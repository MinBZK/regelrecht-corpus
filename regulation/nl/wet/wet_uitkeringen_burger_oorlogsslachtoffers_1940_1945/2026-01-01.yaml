  - number: '20'
    text: |-
      1 Voor de in Nederland gevestigde uitkeringsgerechtigde en de uitkeringsgerechtigde op wie
      [artikel 68b, eerste lid][ref1], of [artikel 69, eerste lid, van de Zorgverzekeringswet][ref2] van toepassing
      is, wordt op de overeenkomstig [artikel 18, eerste lid][ref3], vastgestelde uitkering ten behoeve van de te zijnen
      laste komende premie van verzekering tegen ziektekosten een bij algemene maatregel van bestuur vastgestelde toeslag
      verleend die per categorie van uitkeringsgerechtigden verschilt.

      2 Voor de niet in Nederland gevestigde uitkeringsgerechtigde, met uitzondering van de uitkeringsgerechtigde op wie
      [artikel 68b, eerste lid][ref4], of [artikel 69, eerste lid, van de Zorgverzekeringswet][ref5] van toepassing is,
      wordt op de overeenkomstig [artikel 18, eerste lid][ref6], vastgestelde uitkering een toeslag verleend gelijk aan
      het, op het tijdstip met ingang waarvan toepassing wordt gegeven aan [artikel 18, eerste lid][ref7], eenmalig vast
      te stellen bedrag van de te zijnen laste blijvende premie van verzekering tegen ziektekosten, doch ten hoogste tot
      een bij algemene maatregel van bestuur vast te stellen bedrag.

      3 Het ingevolge het tweede lid vastgestelde bedrag van de ten laste van de uitkeringsgerechtigde blijvende premie
      van verzekering tegen ziektekosten wordt door de Sociale verzekeringsbank herzien:

      a. jaarlijks, naar evenredigheid van de ontwikkeling van de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref8],

      b. bij het door de gerechtigde bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9],

      c. bij veranderingen in de gezinssituatie van de gerechtigde, of

      d. indien de Sociale verzekeringsbank van oordeel is dat het niet herzien van het vastgestelde bedrag gelet op het
      belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.

      4 Indien de in [artikel 18, eerste lid][ref10], bedoelde kosten van verpleging of verzorging met toepassing
      van de [Wet langdurige zorg][ref11] worden betaald en de uitkeringsgerechtigde in die kosten een eigen bijdrage
      verschuldigd is, wordt op de overeenkomstig het bepaalde in [dat artikel][ref12] vastgestelde uitkering een toeslag
      verleend gelijk aan het bedrag van de eigen bijdrage.


