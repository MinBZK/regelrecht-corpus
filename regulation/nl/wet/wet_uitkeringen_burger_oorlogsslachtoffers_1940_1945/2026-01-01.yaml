    text: |-
      1 Degene, die verwacht te eniger tijd aanspraken te kunnen ontlenen aan deze wet, kan bij de Raad
      een aanvraag indienen om erkenning dat de aanvrager is getroffen door oorlogsgeweld als bedoeld in
      [artikel 2, eerste lid][ref1].

      2 Het bepaalde in de [artikelen 35][ref2] tot en met [39][ref3] is, voor zover ter zake van belang, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
