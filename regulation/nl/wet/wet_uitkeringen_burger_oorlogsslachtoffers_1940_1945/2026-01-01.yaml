  - number: '37'
    text: |-
      1 Voor zover de aanvraag, bedoeld in [artikel 35][ref1], is ingediend door of namens een burger-oorlogsslachtoffer,
      wordt door de geneeskundig adviseur een medisch rapport opgesteld. Hij vermeldt daarin voor zover nodig zijn
      bevindingen over:

      a. de invaliditeit van het burger-oorlogsslachtoffer en het in [artikel 2][ref2] bedoelde causaal verband;

      b. de relatie tussen de invaliditeit en het vermogen om een inkomen te verwerven;

      c. de in artikel 17 bedoelde graad van onvermogen om een inkomen te verwerven en

      d. de noodzaak van bijzondere voorzieningen bedoeld in [paragraaf 8][ref3].

      2 Het medisch rapport wordt niet opgesteld dan nadat de geneeskundig adviseur heeft kunnen kennisnemen van het
      rapport, bedoeld in [artikel 36, eerste lid][ref4].

      3 Voor zover de aanvraag, bedoeld in [artikel 35][ref5], is ingediend door de weduwe, weduwnaar of minderjarige
      volle wees van het burger-oorlogsslachtoffer, wordt door de in het eerste lid bedoelde geneeskundig adviseur
      onderzocht of het overlijden van het burger-oorlogsslachtoffer het gevolg was van het letsel, bedoeld in
      [artikel 2][ref6], dan wel of de uit dit letsel ontstane invaliditeit hem nadelig beïnvloedde in zijn vermogen een
      inkomen te verwerven door arbeid in beroep of bedrijf.

      4 Indien een aanvraag betrekking heeft op een vergoeding of tegemoetkoming behoeft het in het eerste lid bedoelde
      rapport slechts te worden opgesteld indien de Raad of de Sociale verzekeringsbank dat nodig acht.

      5 De aanvrager is gehouden medewerking te verlenen aan een medisch onderzoek indien de Raad of de Sociale
      verzekeringsbank zulks noodzakelijk oordeelt.

      6 Indien de aanvrager niet voldoet aan het bepaalde in het vijfde lid, wijst de Raad of de Sociale verzekeringsbank
      de aanvraag af of herziet de Raad of de Sociale verzekeringsbank de eerder gegeven beschikking in het nadeel van
      de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003664#HoofdstukII
