  - number: '5'
    text: |-
      Aan deze wet kunnen geen rechten worden ontleend door:

      a. degene, die blijkens opgave van Onze Minister van Justitie:

      1e. bij onherroepelijke uitspraak van een bijzondere strafrechter is veroordeeld;

      2e. bij een uitspraak van een Tribunaal, waarop fiat executie is verleend, de al dan niet voorwaardelijke oplegging
      van een bijzondere maatregel onderging;

      3e. bij een onherroepelijke beslissing van een orgaan van de bijzondere rechtspleging voorwaardelijk buiten
      vervolging is gesteld;

      4e. zich door de vlucht aan vervolging door een orgaan van de bijzondere rechtspleging heeft onttrokken;

      b. degene, die bij een onherroepelijke uitspraak van een met zuivering belast orgaan of college is ontzet van
      het recht ambten of bepaalde ambten te bekleden dan wel bepaalde beroepen of functies uit te oefenen of oneervol
      is ontslagen. Zo nodig worden inlichtingen ingewonnen bij Onze Minister, hoofd van het betrokken departement van
      algemeen bestuur;

      c. degene, die zich tijdens de oorlogsjaren 1940-1945 uit Nederlands nationaal oogpunt beschouwd, onwaardig heeft
      gedragen. Zo nodig worden inlichtingen ingewonnen bij Onze Minister van Justitie;

      d. de weduwe, weduwnaar en minderjarige volle wees van onder *b* of *c* bedoelde personen, indien en voor zover
      zij als nabestaanden rechten aan deze wet zouden hebben kunnen ontlenen en indien een der omstandigheden zoals
      omschreven onder *a*, *b* of *c*, zich niet zou hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel5
  - number: '7'
    text: |-
      Behoudens het bepaalde in [artikel 9][ref1] heeft recht op een periodieke uitkering:

      a. het burger-oorlogsslachtoffer, dat vóór het bereiken van de leeftijd, waarop gelijksoortige valide personen
      in de regel hun werkzaamheden beëindigen, door zijn invaliditeit, welke het gevolg is van het letsel, bedoeld
      in [artikel 2][ref2], gedwongen werd of wordt zijn werkzaamheden in beroep of bedrijf te beëindigen of blijvend
      te verminderen, indien en voor zover hij buiten staat is door of in verband met arbeid een inkomen te verwerven,
      gelijk aan het inkomen, dat hij uit vorenbedoeld beroep of bedrijf zou hebben genoten, indien hij niet invalide zou
      zijn geweest;

      b. het burger-oorlogsslachtoffer, dat vóór het tot uiting komen van zijn invaliditeit, welke het gevolg is van het
      letsel, bedoeld in [artikel 2][ref3], door of in verband met het volgen van onderwijs nog geen arbeid in beroep of
      bedrijf uitoefende, indien hij ten gevolge van die invaliditeit nimmer in staat is geweest door arbeid in beroep of
      bedrijf een inkomen te verwerven, dat in overeenstemming was met het niveau van het gevolgde onderwijs;

      c. het burger-oorlogsslachtoffer, dat door of in verband met zijn invaliditeit, welke het gevolg is van het letsel,
      bedoeld in [artikel 2][ref4], zijn werkzaamheden in beroep of bedrijf tijdelijk moet onderbreken of verminderen,
      indien en voor zolang in de ten gevolge daarvan ontstane derving van inkomsten niet op andere wijze wordt voorzien;

      d. de weduwe of weduwnaar, alsmede de minderjarige volle wees van het burger-oorlogsslachtoffer, bedoeld onder
      *a*, *b* en *c*, indien dit ten tijde van het overlijden in het genot was van een periodieke uitkering op grond van
      deze wet;

      e. de weduwe of weduwnaar, alsmede de minderjarige volle wees van het burger-oorlogsslachtoffer van wie het
      overlijden het gevolg was van het letsel, bedoeld in [artikel 2][ref5], mits het burger-oorlogsslachtoffer, ware
      het niet overleden, in aanmerking zou zijn gekomen voor een periodieke uitkering;

      f. de weduwe of weduwnaar, alsmede de minderjarige volle wees van het burger-oorlogsslachtoffer, dat ten tijde
      van zijn overlijden in het genot was van een periodieke uitkering, anders dan op grond van deze wet, mits deze
      uitkering hem was toegekend in verband met het letsel, bedoeld in [artikel 2][ref6].


