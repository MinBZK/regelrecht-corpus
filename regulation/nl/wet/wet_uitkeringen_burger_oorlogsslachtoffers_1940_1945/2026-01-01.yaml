  - number: '23'
    text: |-
      1 Op de periodieke uitkering wordt, indien de uitkeringsgerechtigde de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt, een toeslag verleend. Deze toeslag
      bedraagt:

      a. voor de gehuwde uitkeringsgerechtigde 60% van het bedrag van het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref2], vermeerderd
      met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref3];

      b. voor de ongehuwde uitkeringsgerechtigde 20% van het bedrag van het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref4], vermeerderd
      met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref5].

      2 De toeslag, bedoeld in het eerste lid, wordt niet toegekend:

      a. indien [artikel 8][ref6] van toepassing is;

      b. indien [artikel 18, eerste lid][ref7], van toepassing is;

      c. aan de gehuwde uitkeringsgerechtigde, van wie de echtgenoot recht heeft op enig pensioen en ten aanzien van wie
      [artikel 28, zesde lid][ref8], wordt toegepast.

      3 Onder enig pensioen als bedoeld in het tweede lid, onder c, wordt verstaan, een pensioen ten laste van de
      Nederlandse Schatkist of die van de Nederlandse Antillen of Aruba, van een publiekrechtelijk lichaam of een
      privaatrechtelijke rechtspersoon in Nederland, de Nederlandse Antillen of Aruba, dan wel ten laste van een door het
      openbaar gezag in Nederland, de Nederlandse Antillen of Aruba ingesteld fonds, alsmede een uitkering ingevolge deze
      wet of de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref9].


