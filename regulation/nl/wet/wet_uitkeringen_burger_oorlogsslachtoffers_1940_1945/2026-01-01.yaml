  - number: '51'
    text: |-
      1 De belanghebbende, diens wettelijke vertegenwoordiger en de persoon aan wie de uitkering, toeslag, vergoeding
      of tegemoetkoming wordt uitbetaald, zijn gehouden onverwijld aan de Sociale verzekeringsbank mededeling te doen
      van alle feiten en omstandigheden, die tot intrekking of verlaging van de uitkering, toeslag, vergoeding of
      tegemoetkoming aanleiding zouden kunnen geven.

      2 Het bepaalde in [artikel 50, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel50
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel51
