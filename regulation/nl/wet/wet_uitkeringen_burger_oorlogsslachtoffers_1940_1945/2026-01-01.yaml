  - number: '28'
    text: |-
      1 Op de periodieke uitkering vermeerderd met de toeslagen, bedoeld in de[ artikelen 21][ref1] en [23][ref2],
      worden, voor zover deze over de overeenkomstige periode werden genoten, in mindering gebracht:

      a. indien de uitkeringsgerechtigde de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], nog niet heeft bereikt, de bruto-inkomsten uit
      tegenwoordige arbeid in beroep of bedrijf, na aftrek van de daarop drukkende verwervingskosten, voor zover deze
      inkomsten 20% van de grondslag waarnaar de uitkering is berekend te boven gaan;

      b. Indien de uitkeringsgerechtigde de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene ouderdomswet][ref4], heeft bereikt, en pensioengerechtigd is ingevolge
      de [Algemene Ouderdomswet][ref5], het bruto-ouderdomspensioen krachtens die wet van de uitkeringsgerechtigde en
      de echtgenoot met inbegrip van de toeslag, bedoeld in [artikel 10 van die wet][ref6], en de vakantie-uitkering,
      bedoeld in [artikel 29 van die wet][ref7], voor zover dit niet meer bedraagt dan tweemaal het bedrag van het bruto-
      ouderdomspensioen voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van die wet][ref8],
      vermeerderd met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref9];

      c. de inkomsten uit vermogen van de uitkeringsgerechtigde en van diens echtgenoot;

      d. de overige inkomsten van de uitkeringsgerechtigde.

      2 Bij de toepassing van het bepaalde in het eerste lid, onder a, b en d, worden de jaarlijkse vakantie-uitkeringen
      van de uitkeringsgerechtigde voor 1/12 deel per maand op de uitkering in mindering gebracht.

      3 Met inkomsten uit tegenwoordige arbeid worden gelijkgesteld uitkeringen op grond van de [Ziektewet][ref10]
      en de [Werkloosheidswet][ref11], alsmede de daarmede vergelijkbare uitkeringen welke worden verleend aan het
      overheidspersoneel.

      4 De inkomsten uit vermogen, bedoeld in het eerste lid, onder c, worden op jaarbasis gesteld op 1,78% van
      het vermogen dat de uitkeringsgerechtigde en zijn echtgenoot op het tijdstip van de aanvraag, bedoeld in
      [artikel 35][ref12], bezitten. Van het aldus berekende bedrag wordt een bedrag vrijgelaten, waarvan de hoogte door
      Onze Minister wordt bepaald.

      5 Bij bedrijfsbeëindiging vindt het bepaalde in het eerste lid, onder c, en het vierde lid, van dat tijdstip af
      overeenkomstige toepassing.

      6 Indien de echtgenoot van de uitkeringsgerechtigde eveneens recht heeft op enig pensioen als
      bedoeld in [artikel 23, derde lid][ref13], en op dat pensioen een vermindering is toegepast uit
      hoofde van recht op ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref14] van tenminste
      40% van het bedrag van het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref15], vermeerderd met 40% van de vakantie-
      uitkering, bedoeld in [artikel 29 van die wet][ref16], zijn het eerste tot en met vierde lid van toepassing, met
      dien verstande dat, in afwijking van het eerste lid, onder b, op schriftelijk verzoek van de uitkeringsgerechtigde
      50% van het aan de uitkeringsgerechtigde en de echtgenoot toegekende bruto-ouderdomspensioen krachtens de
      [Algemene Ouderdomswet][ref17], met inbegrip van de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref18],
      op de uitkering in mindering wordt gebracht.

      7 Indien de echtgenoot van de uitkeringsgerechtigde eveneens recht heeft op een uitkering ingevolge deze wet, zijn
      het eerste tot en met vijfde lid van toepassing, met dien verstande dat:

      a. in afwijking van het eerste lid, onder c, de inkomsten uit vermogen van de uitkeringsgerechtigde en de
      echtgenoot bij ieder voor de helft in mindering worden gebracht;

      b. in afwijking van het in het vierde lid, onder a, laatste volzin, bedoelde bedrag, de helft daarvan wordt
      vrijgelaten.


