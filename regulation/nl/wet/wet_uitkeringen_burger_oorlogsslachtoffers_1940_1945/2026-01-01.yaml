  - number: '33'
    text: |-
      1 In de ten laste van het burger-oorlogsslachtoffer blijvende kosten van voorzieningen verband houdende met zijn
      invaliditeit, welke het gevolg is van het letsel, bedoeld in [artikel 2][ref1], welke voorzieningen strekken tot
      verbetering van diens levensomstandigheden, kan een tegemoetkoming worden verleend.

      2 De tegemoetkoming heeft ten hoogste betrekking op de in het eerste lid bedoelde kosten in zover deze, met
      inachtneming van de totale financiële omstandigheden van het burger-oorlogsslachtoffer, als bijzondere kosten
      moeten worden aangemerkt.

      3 De tegemoetkoming in de bijzondere kosten, bedoeld in het tweede lid, wordt bepaald met inachtneming van de
      financiële draagkracht van het burger-oorlogsslachtoffer.

      4 Bij algemene maatregel van bestuur worden nadere regelen gesteld met betrekking tot de bepaling van de financiële
      draagkracht van het burger-oorlogsslachtoffer alsmede zo nodig met betrekking tot de aard, de duur en de wijze van
      verstrekking van de voorzieningen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel33
