  - number: '3'
    text: |-
      1 Deze wet is van toepassing op:

      a. degene, die tijdens de oorlogsjaren 1940–1945 of in de na-oorlogse jaren, als burger getroffen is door
      oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], en op dat moment Nederlander was dan wel Nederlands
      onderdaan in de zin van de toenmalige Wet van de Ministers van Koloniën, Buitenlandse Zaken en Justitie van 10
      februari 1910, houdende regeling van het Nederlandse onderdaanschap van de bevolking van Nederlands-Indië (Stb.
      55), mits hij de Nederlandse nationaliteit bezit;

      b. degene, die tijdens de oorlogsjaren 1940–1945 of in de na-oorlogse jaren, als burger getroffen is door
      oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref2], en op dat moment als vreemdeling in Nederland of het
      voormalige Nederlands-Indië gevestigd was, anders dan in opdracht van enige vijandige mogendheid, mits hij de
      Nederlandse nationaliteit bezit;

      c. de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld
      onder a of b voldeed, mits zij de Nederlandse nationaliteit bezitten;

      d. de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld
      onder a of b voldeed en voor de datum van aanvraag, bedoeld in [artikel 35][ref3], is overleden, mits zij de
      Nederlandse nationaliteit bezitten.

      2 De Raad kan deze wet tevens van toepassing verklaren op degene die tijdens de oorlogsjaren 1940–1945 of in de na-
      oorlogse jaren, als burger is getroffen door oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref4], of diens
      nabestaande die niet voldoet aan de in het eerste lid gestelde eisen en ten aanzien van wie het niet toepassen van
      deze wet een klaarblijkelijke hardheid zou zijn.


