  - number: '59'
    text: |-
      1 De periodieke uitkering of de garantie-uitkering wordt, met uitzondering van de op grond van [artikel 10][ref1]
      vastgestelde grondslag, opnieuw vastgesteld:

      a. wanneer de uitkeringsgerechtigde of zijn echtgenoot de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], bereikt;

      b. wanneer de uitkeringsgerechtigde in het huwelijk treedt of zijn huwelijk wordt beëindigd door echtscheiding of
      overlijden van zijn echtgenoot;

      c. wanneer de uitkeringsgerechtigde duurzaam gescheiden van zijn echtgenoot gaat leven;

      d. wanneer een kind of pleegkind van de uitkeringsgerechtigde meerderjarig wordt;

      e. wanneer toepassing wordt gegeven aan [artikel 18, eerste lid][ref3];

      f. wanneer er sprake is van bedrijfsbeëindiging door de uitkeringsgerechtigde of zijn echtgenoot;

      g. wanneer de uitkeringsgerechtigde aanspraak maakt op de betaling uit een nieuwe bron van inkomsten, of

      h. wanneer de uitkeringsgerechtigde geen aanspraak meer kan maken op de betaling uit een bron van inkomsten, tenzij
      hij het vervallen van die aanspraak heeft bewerkstelligd.

      2 Het eerste lid, onder g en h, is van overeenkomstige toepassing op de inkomsten van de echtgenoot van de
      uitkeringsgerechtigde, voor zover die inkomsten de hoogte van de periodieke uitkering of de garantie-uitkering,
      bedoeld in [artikel 8][ref4], mede bepalen.

      3 De beschikking, bedoeld in het eerste en tweede lid, wordt genomen binnen 13 weken nadat de noodzakelijke
      gegevens ter kennis van de Sociale verzekeringsbank zijn gebracht.

      4 Hetgeen als gevolg van een beschikking als bedoeld in het eerste of tweede lid te veel dan wel te weinig is
      uitbetaald, wordt door de Sociale verzekeringsbank teruggevorderd of verrekend dan wel nabetaald. De terugvordering
      kan in door de Sociale verzekeringsbank te bepalen termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel18
