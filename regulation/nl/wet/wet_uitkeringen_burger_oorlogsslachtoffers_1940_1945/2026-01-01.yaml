  - number: '29'
    text: |-
      1 Op de garantie-uitkering worden in mindering gebracht alle over de overeenkomstige periode genoten bruto-
      inkomsten, uit welken hoofde dan ook, van het burger-oorlogsslachtoffer en van diens echtgenoot of van degene met
      wie hij duurzaam samenleeft.

      2 De inkomsten uit vermogen worden vastgesteld overeenkomstig het bepaalde in
      [artikel 28, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel28
