      1 De garantie-uitkering bedraagt een percentage van het bedrag, bedoeld in [artikel 11][ref1].

      2 Het percentage, bedoeld in het eerste lid, bedraagt:

      a. voor het burger-oorlogsslachtoffer, dat de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet heeft bereikt:

      1e. 80, indien hij is gehuwd, tenzij hij duurzaam gescheiden leeft van zijn echtgenoot;

      2e. 75, indien hij niet is gehuwd of duurzaam gescheiden leeft van zijn echtgenoot en minderjarige kinderen te
      zijnen laste heeft;

      3e. 70, indien hij als alleenstaande moet worden aangemerkt;

      b. voor het burger-oorlogsslachtoffer, dat de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], heeft bereikt:

      1e. 65, indien hij is gehuwd, tenzij hij duurzaam gescheiden leeft van zijn echtgenoot;

      2e. 55, indien hij niet is gehuwd of duurzaam gescheiden leeft van zijn echtgenoot en minderjarige kinderen te
      zijnen laste heeft;

      3e. 45, indien hij als alleenstaande moet worden aangemerkt.


