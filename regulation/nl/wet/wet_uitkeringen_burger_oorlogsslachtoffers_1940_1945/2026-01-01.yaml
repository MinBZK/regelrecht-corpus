preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen betreffende de verlening van
    uitkeringen en bijzondere voorzieningen aan burger-oorlogsslachtoffers uit de Tweede Wereldoorlog en hun nagelaten
    betrekkingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. de Raad: de Pensioen- en Uitkeringsraad, bedoeld in
      [artikel 3 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref1];

      c. de Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
