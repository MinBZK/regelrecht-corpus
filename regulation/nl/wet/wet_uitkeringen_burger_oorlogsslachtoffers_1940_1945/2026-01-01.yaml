  - number: '61'
    text: |-
      1 De Raad of de Sociale verzekeringsbank is bevoegd een eenmaal gegeven beschikking in het nadeel van betrokkene
      te herzien, indien hem alsnog blijkt of na kennisneming van enig feit, gegeven of omstandigheid op zich zelf of
      in samenhang met andere feiten, gegevens of omstandigheden, duidelijk wordt, dat de gronden waarop die beschikking
      was gebaseerd dermate onjuist of onvolledig waren, dat de beschikking op die gronden niet kan worden gehandhaafd
      en de bekend geworden feiten, gegevens of omstandigheden onvoldoende grond bieden om de oorspronkelijke beschikking
      te dragen.

      2 Indien, naar het oordeel van de Sociale verzekeringsbank, door de herzieningsbeschikking het recht op elke
      voorziening van deze wet zal moeten worden ontzegd, stelt de Sociale verzekeringsbank, alvorens tot herziening over
      te gaan, de betrokkene in de gelegenheid zijn zienswijze naar voren te brengen.

      3 De Raad of de Sociale verzekeringsbank is bevoegd, op daartoe door of vanwege de belanghebbende gedane aanvraag,
      een door de Raad of de Sociale verzekeringsbank of door de Centrale Raad van Beroep gegeven beschikking dan wel
      uitspraak in het voordeel van de bij die beschikking dan wel uitspraak betrokkene te herzien.

      4 Op een beschikking, voortvloeiende uit de toepassing van het derde lid, is [paragraaf 10][ref1] van
      overeenkomstige toepassing, met uitzondering van [artikel 38, tweede, derde en vierde lid][ref2], en
      [artikel 39][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel39
