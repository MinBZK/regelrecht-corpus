  - number: '4'
    text: |-
      Behoudens in nader bij algemene maatregel van bestuur te regelen gevallen kunnen aan deze wet geen aanspraken
      worden ontleend door:

      a. degene, die op grond van oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], aanspraken ontleent aan de
      voor militairen geldende voorzieningen;

      b. degene, die op grond van zijn invaliditeit aanspraken ontleent aan de
      [Wet buitengewoon pensioen 1940-1945][ref2], de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref3], de
      [Wet buitengewoon pensioen Indisch verzet][ref4] of de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref5];

      c. de weduwe, weduwnaar en minderjarige volle wees van de onder a en b bedoelde personen, indien en voor zover zij
      als nabestaanden aanspraken ontlenen aan de voorzieningen, bedoeld onder a en de wetten, genoemd onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
