  - number: '25'
    text: |-
      1 De periodieke uitkering of de garantie-uitkering wordt door de Sociale verzekeringsbank
      aangepast overeenkomstig de normen en voorwaarden waarmee het bedrag, genoemd in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1] ingevolge
      [artikel 14 van die wet][ref2] wordt herzien.

      2 De grondslagen, bedoeld in [artikel 10, eerste, tweede, zesde, zevende en negende lid][ref3],
      en de bedragen genoemd in [artikel 10, achtste lid, onder a en b][ref4], worden door Onze
      Minister aangepast overeenkomstig de normen en voorwaarden waarmee het bedrag, genoemd in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref5] ingevolge
      [artikel 14 van die wet][ref6] wordt herzien.

      3 Bij de aanpassing, bedoeld in het eerste lid, wordt uitgegaan van de laatst vastgestelde dan wel overeenkomstig
      het eerste lid aangepaste periodieke uitkering of garantie-uitkering, waarbij de toeslagen, bedoeld in de
      [artikelen 20, eerste en tweede lid][ref7], en [21, eerste en tweede lid][ref8], buiten beschouwing worden gelaten.

      4 De aanpassing van een periodieke uitkering of een garantie-uitkering, bedoeld in het eerste lid, vindt plaats
      zonder dat dit bij beschikking is vastgesteld.

      5 De aangepaste periodieke uitkering of garantie-uitkering, bedoeld in het vierde lid, wordt betaald bij de eerste
      betaling nadat de aanpassing heeft plaatsgevonden.


