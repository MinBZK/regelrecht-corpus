      1 Indien geen kinderbijslag uit welken hoofde of onder welke benaming ook wordt genoten, wordt op de periodieke
      uitkering en de garantie-uitkering een toeslag verleend voor de minderjarige kinderen waarvoor kinderbijslag zou
      worden ontvangen, indien de [Algemene Kinderbijslagwet][ref1] van toepassing zou zijn.

      2 Deze toeslag beloopt een bedrag gelijk aan de kinderbijslag ingevolge de in het eerste lid genoemde wet.


