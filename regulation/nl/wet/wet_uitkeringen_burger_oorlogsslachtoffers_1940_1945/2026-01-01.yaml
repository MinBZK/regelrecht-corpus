  - number: '32'
    text: |-
      1 Indien het burger-oorlogsslachtoffer wegens zijn invaliditeit, welke het gevolg is van het letsel, bedoeld in
      [artikel 2][ref1], geneeskundige behandeling of verpleging behoeft, worden de daaraan verbonden ten laste van het
      burger-oorlogsslachtoffer blijvende noodzakelijke kosten volledig vergoed, tenzij het vierde lid van toepassing is.

      2 De extra, ten laste van het burger-oorlogsslachtoffer blijvende, kosten voor noodzakelijke voorzieningen, die
      direct verband houden met de in het eerste lid bedoelde geneeskundige behandeling of verpleging worden eveneens
      volledig vergoed.

      3 Een volledige vergoeding wordt tevens verleend in het geval dat een geneeskundige behandeling of verpleging kan
      bijdragen tot voorkoming van het verergeren van de invaliditeit, bedoeld in het eerste lid.

      4 Indien de in het eerste lid bedoelde kosten betrekking hebben op verpleging of verzorging van een alleenstaande
      of een echtpaar in een daartoe bestemde inrichting en niet worden betaald met toepassing van een der sociale
      verzekeringswetten, worden deze kosten vergoed voor zover de inkomsten daartoe ontoereikend zijn. Van de
      inkomsten blijft buiten beschouwing een bedrag ter grootte van de met toepassing van het bepaalde in de
      [artikelen 18, eerste lid][ref2], en [20, eerste en tweede lid][ref3], vastgestelde uitkering.

      5 Een vergoeding ter zake van de kosten, bedoeld in het eerste tot en met vierde lid, wordt slechts verleend voor
      zover deze niet ten laste kunnen worden gebracht van een zorgverzekering ingevolge de [Zorgverzekeringswet][ref4]
      of een andere ziektekostenverzekering of ten laste daarvan zouden kunnen worden gebracht indien een zodanige
      verzekering is of zou zijn gesloten. De Raad of de Sociale verzekeringsbank kan van de eerste volzin afwijken,
      indien, gezien de individuele omstandigheden van de aanvrager, naar het oordeel van de Raad of de Sociale
      verzekeringsbank daartoe gegronde redenen aanwezig zijn.

      6 Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de aard, de duur en de
      wijze van verstrekking van de voorzieningen bedoeld in de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0018450
