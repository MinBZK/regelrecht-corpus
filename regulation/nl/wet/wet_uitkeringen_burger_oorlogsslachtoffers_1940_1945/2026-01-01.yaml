  - number: '17'
    text: |-
      1 Indien en voor zolang het burger-oorlogsslachtoffer in staat is zich door arbeid een inkomen te verwerven,
      doch deze arbeid naar het oordeel van de Sociale verzekeringsbank om niet gegronde redenen niet of slechts ten
      dele verricht, wordt de grondslag waarnaar de uitkering wordt berekend, nader vastgesteld, rekening houdende met
      de mate van invaliditeit van het burger-oorlogsslachtoffer, waardoor diens vermogen om een inkomen te verwerven
      door of in verband met arbeid in beroep of bedrijf nadelig is beïnvloed. In een zodanig geval is het bepaalde in
      [artikel 10, achtste lid, onder a][ref1], niet van toepassing.

      2 De Sociale verzekeringsbank gaat niet over tot een nadere vaststelling van de grondslag, als bedoeld in het
      eerste lid, dan na advies te hebben ingewonnen van ter zake deskundige personen of organen.

      3 Het bepaalde in het eerste lid is niet van toepassing, indien het burger-oorlogsslachtoffer buiten staat is 50%
      te verwerven van het inkomen dat hij verwierf uit de laatstelijk door hem verrichte arbeid in beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
