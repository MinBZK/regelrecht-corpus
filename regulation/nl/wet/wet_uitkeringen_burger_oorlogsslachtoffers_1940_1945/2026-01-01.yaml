  - number: '60'
    text: |-
      1 Op aanvraag van de uitkeringsgerechtigde wordt de periodieke uitkering of de garantie-uitkering, met uitzondering
      van de op grond van [artikel 10][ref1] vastgestelde grondslag, opnieuw vastgesteld:

      a. indien de vast te stellen periodieke uitkering of de garantie-uitkering op de datum van deze aanvraag hoger
      is dan de laatst vastgestelde of aangepaste periodieke uitkering of garantie-uitkering, mits dit niet uitsluitend
      het gevolg is van de koersomrekening van inkomsten die door de uitkeringsgerechtigde of zijn echtgenoot worden
      ontvangen, of;

      b. indien het vermogen van de uitkeringsgerechtigde en zijn echtgenoot door oorzaken gelegen in factoren waarop
      de uitkeringsgerechtigde geen invloed heeft kunnen uitoefenen, zodanig is verminderd, dat het niet herzien
      van de laatst vastgestelde inkomsten uit vermogen, bedoeld in [artikel 28, eerste lid, onder c][ref2], tot een
      klaarblijkelijke hardheid zou leiden. Bij de beoordeling hiervan wordt rekening gehouden met de totale vermogens-
      en inkomstenpositie van de uitkeringsgerechtigde en zijn echtgenoot.

      2 Indien toepassing is gegeven aan het eerste lid, gaat de opnieuw vastgestelde periodieke uitkering of de
      garantie-uitkering in op de eerste dag van de maand waarin de aanvraag is ingediend.

      3 Op een besluit, voortvloeiende uit de toepassing van het eerste lid, is [artikel 38, vierde lid][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
