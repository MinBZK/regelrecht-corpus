  - number: '42'
    text: |-
      1 De uitkeringsgerechtigde, die is veroordeeld tot een vrijheidsstraf van drie maanden, tot plaatsing in een
      Rijkswerkinrichting of tot enige zwaardere straf, of op bevel van de rechter ter beschikking van de Regering is
      gesteld, mist over de tijd gedurende welke hij zijn straf ondergaat of van regeringswege in zijn verpleging wordt
      voorzien, of gedurende welke hij zich door de vlucht aan de tenuitvoerlegging van het vonnis onttrekt, het genot
      van de uitkering.

      2 De Sociale verzekeringsbank is bevoegd het uitkeringsbedrag over die tijd geheel of ten dele aan of ten behoeve
      van de echtgenoot of minderjarige kinderen van de uitkeringsgerechtigde uit te betalen.

      3 De Sociale verzekeringsbank is tevens bevoegd om, voor zover van de bevoegdheid in het tweede lid bedoeld,
      geen gebruik is gemaakt, de uitkeringsgerechtigde die al of niet voorwaardelijk uit de gevangenis of uit de
      Rijkswerkinrichting is ontslagen, of wiens verpleging van regeringswege is beëindigd, in het genot te stellen van
      een uitkering, ten bedrage van ten hoogste de helft van het niet uitgekeerde bedrag, tot een maximum van de helft
      van het jaarlijkse bedrag van de uitkering.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel42
  - number: '43'
    text: |-
      Van alle rechten op grond van het bij of krachtens deze wet bepaalde wordt terstond vervallen verklaard het burger-
      oorlogsslachtoffer of diens nabestaande, indien zij de Nederlandse nationaliteit verliezen.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel43
  - number: '44'
    text: |-
      1 De belanghebbende is gehouden aanspraken op wettelijke voorzieningen geldend te maken, welke kunnen leiden tot
      een vermindering van de aanspraken op grond van deze wet.

      2 Indien de belanghebbende niet voldoet aan het bepaalde in het eerste lid, kan bij de vaststelling van de
      uitkering, toeslag, vergoeding en tegemoetkoming rekening worden gehouden met de in het eerste lid bedoelde
      aanspraken.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel44
  - number: 44a
    text: |-
      1 De uitkeringen, toeslagen, vergoedingen of tegemoetkomingen worden zo spoedig mogelijk, doch uiterlijk binnen
      dertien weken na de toekenning, vastgesteld en betaald.

      2 Indien de door belanghebbende verstrekte gegevens en bescheiden onvoldoende zijn voor het vaststellen van het
      bedrag van de uitkering, vergoeding of tegemoetkoming, verzoekt de Sociale verzekeringsbank de belanghebbende deze
      gegevens en bescheiden alsnog te verstrekken. De periode van dertien weken, bedoeld in het eerste lid, wordt in
      zodanig geval opgeschort met ingang van de dag waarop de Sociale verzekeringsbank vorenbedoeld verzoek heeft gedaan
      tot de dag waarop de gegevens en bescheiden zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel44a
  - number: '45'
    text: |-
      1 De uitkering, de toeslagen, bedoeld in de [artikelen 19][ref1] tot en met [23][ref2], de vergoeding en de
      tegemoetkoming zijn niet vatbaar voor vervreemding of verpanding.

      2 De toeslagen, bedoeld in de[ artikelen 19][ref3] en [22][ref4], de vergoeding en de tegemoetkoming, alsmede de op
      grond van onderdeel *a* van [artikel 41, eerste lid][ref5], na overlijden doorlopende uitkering zijn niet vatbaar
      voor beslag.

      3 Volmacht tot ontvangst van de uitkering, toeslag, vergoeding en tegemoetkoming, in welke vorm of onder welke
      benaming ook verleend, is steeds herroepelijk.

      4 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.


