  - number: '9'
    text: |-
      1 De periodieke uitkering aan de weduwe of weduwnaar van het burger-oorlogsslachtoffer wordt ten hoogste gedurende
      een tijdvak van twee jaren na de datum van het overlijden verleend, indien de weduwe of weduwnaar op dat tijdstip
      nog niet de leeftijd van 40 jaren heeft bereikt, tenzij deze arbeidsongeschikt is of een of meer minderjarige
      kinderen te haren of zijnen laste heeft.

      2 Een periodieke uitkering aan de weduwe of weduwnaar van het burger-oorlogsslachtoffer wordt niet
      toegekend, indien het huwelijk is gesloten, nadat het burger-oorlogsslachtoffer, aan wie voordien een
      periodieke uitkering in de zin van deze wet was toegekend, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt, tenzij de echtgenoten of
      geregistreerde partners reeds gedurende een periode van ten minste tien jaren met elkaar zijn gehuwd geweest of
      hebben samengeleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '10'
    text: |-
      1 Indien aanspraak bestaat op een periodieke uitkering, wordt de grondslag vastgesteld, waarnaar de uitkering wordt
      berekend.

      2 a. Indien het burger-oorlogsslachtoffer voldoet aan het bepaalde in [artikel 7, onder a][ref1], wordt de
      grondslag vastgesteld naar het inkomen uit arbeid, dat het burger-oorlogsslachtoffer ten tijde van de aanvraag,
      bedoeld in [artikel 35][ref2], in Nederland, ware hij niet invalide geweest, zou hebben genoten uit het door hem
      uitgeoefende beroep of bedrijf, waarin hij voor het eerst ten gevolge van zijn invaliditeit zijn werkzaamheden
      moest beëindigen of blijvend verminderen;

      b. indien het burger-oorlogsslachtoffer, bedoeld onder a, na het tot uiting komen van de invaliditeit ten gevolge
      waarvan hij zijn werkzaamheden in beroep of bedrijf heeft moeten beëindigen of blijvend verminderen, arbeid heeft
      aanvaard in een ander beroep of bedrijf, kan, indien dat voor hem gunstiger is, de grondslag worden vastgesteld
      naar het inkomen, dat het burger-oorlogsslachtoffer ten tijde van de aanvraag, bedoeld in [artikel 35][ref3], in
      Nederland uit arbeid in laatstbedoeld beroep of bedrijf zou hebben genoten, indien hij zijn werkzaamheden door of
      in verband met zijn invaliditeit niet had moeten beëindigen of blijvend verminderen;

      c. onder arbeid in een ander beroep of bedrijf, bedoeld onder b, wordt verstaan: arbeid, welke gedurende een
      aaneengesloten periode van ten minste drie jaren in de voor dat beroep of bedrijf gebruikelijke arbeidstijd is
      verricht;

      d. de Raad kan, bij beschikking, van het bepaalde onder c afwijken indien naar zijn oordeel de onverkorte
      toepassing daarvan, gelet op alle omstandigheden, in een individueel geval onredelijk zou zijn.

      3 Indien het in het tweede lid bedoelde beroep of bedrijf buiten Nederland werd uitgeoefend, wordt bij de
      vaststelling van de grondslag, waarnaar de uitkering wordt berekend, rekening gehouden met het meest vergelijkbare
      beroep of bedrijf in Nederland, alsmede met (vak)opleiding, bekwaamheid en andere factoren, welke ter zake van
      belang kunnen zijn.

      4 Bij de vaststelling van de grondslag, bedoeld in het tweede en derde lid, wordt geen rekening gehouden met de
      mogelijkheid van inkomstenvermeerdering ten gevolge van bevordering of verhoging van de vakbekwaamheid, uitbreiding
      van het bedrijf of andere dergelijke factoren.

      5 Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid in beroep of bedrijf, als bedoeld
      in het tweede lid, moet worden verstaan.

      6 Indien het burger-oorlogsslachtoffer voldoet aan het bepaalde in [artikel 7, onder b][ref4], wordt de grondslag
      vastgesteld met inachtneming van door Onze Minister te stellen regelen.

      7 Indien het burger-oorlogsslachtoffer voldoet aan het bepaalde in [artikel 7, onder c][ref5], wordt de grondslag
      vastgesteld op het bedrag, bedoeld in het achtste lid, onder a, tenzij de Raad, rekening houdende met alle
      omstandigheden, in een individueel geval van oordeel is, dat een hogere grondslag gerechtvaardigd is. Deze
      grondslag kan niet op een hoger bedrag worden vastgesteld dan de grondslag die zou zijn vastgesteld, indien het
      burger-oorlogsslachtoffer zou voldoen aan het bepaalde in het tweede lid, onder a of b.

      8 De grondslag wordt bepaald op:

      a. ten minste een bedrag van € 1.867,87 per maand per 1 januari 1983 ;

      b. ten hoogste een bedrag van € 3.877,64 per maand per 1 januari 1983 .

      9 De grondslag, waarnaar de uitkering aan de weduwe of weduwnaar bedoeld in [artikel 7, onder d tot en met f][ref6],
      wordt berekend, wordt vastgesteld op hetzelfde bedrag als waarop de grondslag voor het burger-oorlogsslachtoffer
      zou zijn vastgesteld, indien hij op de datum van de aanvraag, bedoeld in [artikel 35][ref7], nog in leven zou zijn
      geweest en op die datum voldaan zou hebben aan het bepaalde in artikel 7, onder a of b.


