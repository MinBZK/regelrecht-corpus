  - number: '19'
    text: |-
      1 Behoudens het bepaalde in het vierde lid, wordt aan het burger-oorlogsslachtoffer, wiens invaliditeit, welke
      het gevolg is van het letsel, bedoeld in [artikel 2][ref1], zijn vermogen om door arbeid een inkomen te verwerven
      nadelig beïnvloedt of zou hebben beïnvloed indien hij nog op inkomsten uit arbeid zou zijn aangewezen, een toeslag
      toegekend voor voorzieningen welke strekken tot verbetering van diens levensomstandigheden.

      2 De hoogte van de toeslag, bedoeld in het eerste lid, bedraagt 10% van het bedrag bedoeld in
      [artikel 10, achtste lid, onder a][ref2], tenzij het bepaalde in het derde lid van toepassing is.

      3 Indien aan het burger-oorlogsslachtoffer een periodieke uitkering is toegekend, wordt op de in het tweede lid
      bedoelde toeslag een bedrag in mindering gebracht, berekend volgens de formule:

      in welke formule

      A voorstelt: het bedrag bedoeld in [artikel 10, achtste lid, onder a][ref3];

      B voorstelt: het bedrag bedoeld in [artikel 10, achtste lid, onder b][ref4];

      C voorstelt: het bedrag bedoeld in [artikel 10, achtste lid, onder a][ref5];

      G voorstelt: de grondslag, waarnaar de uitkering wordt berekend.

      4 De toeslag, bedoeld in het eerste lid, wordt niet toegekend, indien toepassing is gegeven aan het bepaalde in de
      [artikelen 18, eerste lid][ref6], [32, vierde lid][ref7], of [42][ref8].


