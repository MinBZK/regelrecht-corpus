  - number: '49'
    text: |-
      1 De belanghebbende is verplicht desgevraagd aan de Raad of de Sociale verzekeringsbank alle inlichtingen te
      verstrekken die hij voor het vaststellen of het bestendigen van het recht van een burger-oorlogsslachtoffer of
      diens nabestaanden op een uitkering, toeslag, vergoeding of tegemoetkoming noodzakelijk acht.

      2 Indien de belanghebbende niet voldoet aan het bepaalde in het eerste lid, wijst de Raad of de Sociale
      verzekeringsbank de aanvraag af, dan wel herziet hij de eerder gegeven beschikking in het nadeel van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel49
  - number: '50'
    text: |-
      1 De belanghebbende is verplicht desgevraagd aan de Sociale verzekeringsbank die gegevens te verstrekken, welke
      voor de uitvoering van de beschikkingen van die Raad noodzakelijk zijn.

      2 Zolang de belanghebbende niet voldoet aan het bepaalde in het eerste lid, wordt de beschikking niet uitgevoerd of
      wordt de uitvoering ervan geschorst. De Sociale verzekeringsbank doet hem hiervan mededeling.

      3 Indien de belanghebbende eerst na twee jaar, nadat het recht op een uitkering, een vergoeding of een
      tegemoetkoming is vastgesteld de in het tweede lid bedoelde gegevens verstrekt, beslist de Sociale verzekeringsbank
      of, gelet op alle omstandigheden, de in de beschikking genoemde ingangsdatum kan worden gehandhaafd. Zo nodig
      stelt de Sociale verzekeringsbank, in afwijking van het bepaalde in [artikel 40, eerste lid][ref1], een nieuwe
      ingangsdatum vast.

      4 Indien de belanghebbende eerst na twee jaar, nadat de uitvoering van de beschikking werd geschorst, de in
      het eerste lid bedoelde gegevens verstrekt, beslist de Sociale verzekeringsbank, rekening houdende met alle
      omstandigheden, of en zo ja in hoeverre, de uitvoering van deze beschikking, voor zover deze betrekking heeft op de
      periode gedurende welke de uitvoering van de beschikking was geschorst, alsnog kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel40
