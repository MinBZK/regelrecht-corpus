  - number: '2'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder burger-oorlogsslachtoffer verstaan:

      a. degene, die tijdens de oorlogsjaren 1940-1945 als burger lichamelijk of psychisch letsel heeft opgelopen bij
      met de krijgsverrichtingen direct verbonden handelingen of omstandigheden, ten gevolge van welk letsel hij blijvend
      invalide is geworden of is overleden;

      b. degene, die tijdens de oorlogsjaren 1940-1945 als burger lichamelijk of psychisch letsel heeft opgelopen door of
      in verband met handelingen of maatregelen welke door of namens de vijandelijke bezettende machten tegen hem werden
      gericht, ten gevolge van welk letsel hij blijvend invalide is geworden of is overleden;

      c. degene, die tijdens de oorlogsjaren 1940-1945 als burger lichamelijk letsel heeft opgelopen bij handelingen,
      welke door of namens de vijandelijke bezettende machten werden gericht tegen derden, ten gevolge van welk letsel
      hij blijvend invalide is geworden of is overleden;

      d. degene, die tijdens de oorlogsjaren 1940-1945 als burger op jeugdige leeftijd psychisch letsel heeft opgelopen
      door de confrontatie met doodslag, executie of zware mishandeling van derden, door of namens de vijandelijke
      bezettende macht, ten gevolge van welk letsel hij blijvend invalide is geworden;

      e. degene, die in de na-oorlogse jaren als burger lichamelijk letsel heeft opgelopen bij het ontploffen van munitie
      of ander oorlogstuig afkomstig uit de oorlogsjaren 1940-1945, ten gevolge van welk letsel hij blijvend invalide is
      geworden of is overleden, tenzij het letsel is te wijten aan onvoorzichtigheid van de betrokkene;

      f. degene, die in de na-oorlogse jaren in het voormalige Nederlands-Indië als burger lichamelijk of psychisch
      letsel heeft opgelopen bij ongeregeldheden die zich nauw aansluitend aan de oorlog tot 27 december 1949 aldaar
      hebben voorgedaan en die naar aard en gevolgen vergelijkbaar zijn met de omstandigheden bedoeld onder *a*, *b*, *c*
      of *d*, ten gevolge van welk letsel hij blijvend invalide is geworden of is overleden.

      2 Indien het letsel, bedoeld in het eerste lid, niet duidelijk door andere oorzaken dan het oorlogsgeweld als
      bedoeld in het eerste lid is ontstaan, wordt dit geacht zijn oorzaak te hebben in het oorlogsgeweld, dan wel
      in omstandigheden daarmee verband houdende. Daarbij wordt rekening gehouden met de inzichten en ervaringen van
      de medische wetenschap met betrekking tot de relatie tussen het oorlogsgeweld en de geestelijke en lichamelijke
      gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel2
  - number: 2a
    text: |-
      1 Voor de toepassing van deze wet wordt gelijkgesteld met:

      a. huwelijk: het geregistreerd partnerschap;

      b. gehuwd: als partner geregistreerd;

      c. echtgenoot of echtpaar: de geregistreerde partner of het geregistreerde paar;

      d. weduwe of weduwnaar: de achtergebleven partij bij het geregistreerd partnerschap;

      2 In deze wet en de daarop berustende bepalingen:

      a. wordt als minderjarig kind of als minderjarige volle wees aangemerkt onderscheidenlijk het kind dat of de volle
      wees die de leeftijd van 21 jaar nog niet heeft bereikt en niet gehuwd is of gehuwd geweest is;

      b. worden als gehuwd of als echtgenoot mede aangemerkt, ongehuwde personen van verschillend of gelijk geslacht die
      duurzaam een gezamenlijke huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste
      of tweede graad bestaat;

      c. wordt als ongehuwd aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.

      3 Van een gezamenlijke huishouding als bedoeld in het eerste lid kan slechts sprake zijn indien twee personen
      gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in de kosten van de huishouding dan
      wel op andere wijze in elkaars verzorging voorzien. Onze Minister kan nadere regels stellen voor de toepassing van
      de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel2a
  - number: 2b
    text: |-
      Waar in deze wet in een artikel of artikellid sprake is van «de Raad of de Sociale
      verzekeringsbank» is de taakverdeling in overeenstemming met de [artikelen 4][ref1] en
      [6 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref2].


