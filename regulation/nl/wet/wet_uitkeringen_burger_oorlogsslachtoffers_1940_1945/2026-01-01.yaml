  - number: '31'
    text: |-
      1 Tot de inkomsten, bedoeld in deze paragraaf, worden niet gerekend:

      a. kinderbijslag uit welken hoofde of onder welke benaming ook;

      b. doelgerichte subsidies of tegemoetkomingen, waaronder begrepen de vermeerdering, bedoeld in de
      [artikelen 10][ref1] en [11 van de Wet buitengewoon pensioen 1940-1945][ref2], de [artikelen 9][ref3]
      en [10 van de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref4] en de [artikelen 12][ref5],
      [13][ref6] en [14 van de Wet buitengewoon pensioen Indisch verzet][ref7], voorzover deze de toeslag, bedoeld in
      [artikel 19][ref8], indien deze is toegekend, overschrijdt.

      2 Onze Minister kan nadere regelen stellen met betrekking tot de vaststelling van de inkomsten uit of in verband
      met arbeid in beroep of bedrijf en de daarop drukkende verwervingskosten, de overige inkomsten alsmede met
      betrekking tot de vaststelling en de taxatie van het vermogen.


