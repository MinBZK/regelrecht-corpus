  - number: '35'
    text: |-
      1 De beoordeling van de aanspraken op een uitkering, toeslag, vergoeding of tegemoetkoming geschiedt naar
      aanleiding van een daartoe bij de Raad of de Sociale verzekeringsbank ingediende aanvraag.

      2 De Raad of de Sociale verzekeringsbank kent geen uitkering, toeslag, vergoeding of tegemoetkoming toe dan nadat
      is vastgesteld dat het door de aanvrager opgegeven adres overeenstemt met het hem betreffende adresgegeven in de
      basisregistratie personen.

      3 Het bepaalde in het tweede lid is niet van toepassing indien de aanvrager in het buitenland gevestigd is.

      4 De Raad of de Sociale verzekeringsbank kan het tweede lid buiten toepassing laten of daarvan afwijken voorzover
      toepassing gelet op het belang dat deze wet beoogt te beschermen zal leiden tot een onbillijkheid van overwegende
      aard.

      5 Op de aanvraag wordt de datum van ontvangst aangetekend.

      6 De ontvangst van de aanvraag wordt de aanvrager schriftelijk bevestigd. Daarbij wordt hem voorlichting gegeven
      over de verdere procedure en de geldende behandeltermijnen.

      7 Onze Minister kan nadere regelen stellen met betrekking tot de bij de aanvraag over te leggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel35
  - number: '36'
    text: |-
      1 Alvorens op een aanvraag wordt beslist, wordt een rapport opgesteld omtrent de aard en de gevolgen van de
      oorlogscalamiteit en de levensomstandigheden van de betrokkene vóór, tijdens en na de oorlogsjaren 1940-1945.

      2 Voor zover nodig wordt, alvorens op een aanvraag wordt beslist, een rapport opgesteld omtrent de financiële
      omstandigheden van de betrokkene. Dit rapport bevat in ieder geval gegevens, welke noodzakelijk zijn voor het
      vaststellen van de grondslag bedoeld in [artikel 10][ref1].

      3 Naar keuze van de belanghebbende worden de in het eerste en tweede lid bedoelde rapporten opgesteld door de
      Stichting Pelita of de Raad of de Sociale verzekeringsbank dan wel, in overeenstemming met de belanghebbende, door
      een andere door de Raad of de Sociale verzekeringsbank aan te wijzen instelling of instantie.

      4 Het rapport wordt opgesteld binnen zes weken nadat de opdracht daartoe bij een instantie als bedoeld in het
      derde lid is ingekomen, met dien verstande dat het rapport binnen vier weken wordt opgesteld, indien de aanvraag
      betrekking heeft op een vergoeding of een tegemoetkoming. Indien die instantie niet tijdig in het opstellen van
      de rapporten voorziet kan de Raad of de Sociale verzekeringsbank, met instemming van de betrokkene, besluiten op
      andere wijze informatie omtrent de aard en de gevolgen van de oorlogscalamiteit, de levensomstandigheden van de
      betrokkene vóór, tijdens en na de oorlogsjaren 1940-1945, en de financiële omstandigheden van de betrokkene in
      te winnen.

      5 De Raad of de Sociale verzekeringsbank geeft aanwijzingen omtrent de inhoud en samenstelling van de in het eerste
      en tweede lid bedoelde rapporten.

      6 Indien een aanvraag betrekking heeft op een vergoeding of tegemoetkoming behoeft het in het eerste lid bedoelde
      rapport slechts te worden opgesteld indien de Raad of de Sociale verzekeringsbank dat nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
