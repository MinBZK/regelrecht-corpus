  - number: '18'
    text: |-
      1 Bij verblijf van een alleenstaande of een echtpaar ter verpleging of verzorging in een daartoe bestemde
      inrichting, waarvan de kosten met toepassing van één der sociale verzekeringswetten worden betaald, wordt de
      periodieke uitkering, met ingang van het tijdstip waarop redelijkerwijs kan worden aangenomen dat deze verpleging
      of verzorging een langdurig karakter zal gaan dragen, doch in ieder geval na verloop van een jaar, nader bepaald
      op:

      a. 12% van de overeenkomstig [artikel 10][ref1] vastgestelde grondslag, voor een alleenstaande;

      b. 20% van de overeenkomstig [artikel 10][ref2] vastgestelde grondslag, voor een gehuwde, tenzij onderdeel *c* van
      toepassing is;

      c. 12% van de overeenkomstig [artikel 10][ref3] vastgestelde grondslag voor een gehuwde, indien het inkomen van
      de echtgenoot, inkomsten uit vermogen daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in
      [artikel 10, achtste lid, onder ][ref4].

      De garantie-uitkering wordt in een zodanig geval berekend naar:

      d. 12% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref5], voor een alleenstaande;

      e. 20% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref6], voor een echtpaar.

      2 Het eerste lid is niet van toepassing indien de uitkeringsgerechtigde op 31 december 2000 verbleef in een
      verzorgingshuis als bedoeld in [artikel 1, eerste lid, onder b, van de Overgangswet verzorgingshuizen][ref7] zoals
      dat luidde voor het vervallen van deze bepaling.


