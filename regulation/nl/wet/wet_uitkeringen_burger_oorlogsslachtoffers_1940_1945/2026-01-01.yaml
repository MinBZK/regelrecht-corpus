      1 Op de uitkering, bedoeld in [artikel 18, eerste lid][ref1], vermeerderd met de toeslag bedoeld in
      [artikel 20][ref2], worden alle inkomsten van het burger-oorlogsslachtoffer en van diens echtgenoot in mindering
      gebracht.

      2 De inkomsten uit vermogen worden vastgesteld overeenkomstig het bepaalde in
      [artikel 28, vierde en vijfde lid][ref3].


