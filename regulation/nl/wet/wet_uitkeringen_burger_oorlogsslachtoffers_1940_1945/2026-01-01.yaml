  - number: '62'
    text: |-
      Indien met terugwerkende kracht een voorziening wordt getroffen voor hetzelfde doel als waarvoor reeds ingevolge
      deze wet een vergoeding of tegemoetkoming werd verleend, herziet de Sociale verzekeringsbank de oorspronkelijke
      beschikking.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel62
  - number: '63'
    text: |-
      Indien een ingevolge deze wet gegeven beschikking in het nadeel van betrokkene wordt herzien, wordt hetgeen te veel
      was uitbetaald, niet teruggevorderd of verrekend, tenzij:

      a. tenzij toepassing is gegeven aan [artikel 59][ref1], dan wel

      b. toepassing is gegeven aan het bepaalde in [artikel 62][ref2], dan wel

      c. in de herzieningsbeschikking gemotiveerd is aangegeven dat van de feiten, gegevens en omstandigheden, bedoeld
      in [artikel 61, eerste lid][ref3], niet kon worden kennisgenomen als gevolg van opzet of grove nalatigheid van
      betrokkene, dan wel

      d. betrokkene redelijkerwijs had moeten begrijpen dat hem te veel werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel61
