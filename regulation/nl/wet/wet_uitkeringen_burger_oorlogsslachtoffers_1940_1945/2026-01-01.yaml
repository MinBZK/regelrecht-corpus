    text: |-
      1 Voor de in Nederland gevestigde uitkeringsgerechtigde en de uitkeringsgerechtigde op wie
      [artikel 68b, eerste lid][ref1], of [artikel 69, eerste lid, van de Zorgverzekeringswet][ref2] van toepassing
      is, wordt op zijn periodieke uitkering of garantie-uitkering ten behoeve van de te zijnen laste komende premie
      van verzekering tegen ziektekosten een bij algemene maatregel van bestuur vastgestelde toeslag verleend voor zover
      deze premie meer bedraagt dan het overeenkomstig de [artikelen 14][ref3] en [15][ref4] vastgestelde percentage van
      het verschil tussen de grondslag en het bedrag, bedoeld in [artikel 10, achtste lid, onder a][ref5]. De toeslag
      verschilt per categorie van uitkeringsgerechtigden.

      2 Voor de niet in Nederland gevestigde uitkeringsgerechtigde, met uitzondering van de uitkeringsgerechtigde op wie
      [artikel 68b, eerste lid][ref6], of [artikel 69, eerste lid, van de Zorgverzekeringswet][ref7] van toepassing
      is, wordt op zijn periodieke uitkering of garantie-uitkering een toeslag verleend gelijk aan het bij de toekenning
      van de periodieke uitkering of de garantie-uitkering eenmalig vast te stellen bedrag van de te zijnen lasten
      blijvende premie van verzekering tegen ziektekosten, doch ten hoogste tot een bij algemene maatregel van bestuur
      vast te stellen bedrag, voor zover deze premie meer bedraagt dan het overeenkomstig de [artikelen 14][ref8]
      en [15][ref9] vastgestelde percentage van het verschil tussen de grondslag en het bedrag, bedoeld in
      [artikel 10, achtste lid, onder a][ref10].

      3 Het ingevolge het tweede lid vastgestelde bedrag van de ten laste van de uitkeringsgerechtigde blijvende premie
      van verzekering tegen ziektekosten wordt door de Sociale verzekeringsbank herzien:

      a. jaarlijks, naar evenredigheid van de ontwikkeling van de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref11],

      b. bij het door de gerechtigde bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref12],

      c. bij veranderingen in de gezinssituatie van de gerechtigde, of

      d. indien de Sociale verzekeringsbank van oordeel is dat het niet herzien van het vastgestelde bedrag gelet op het
      belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.


