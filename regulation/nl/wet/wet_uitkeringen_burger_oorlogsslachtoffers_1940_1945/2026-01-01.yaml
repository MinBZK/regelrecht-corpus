  - number: '15'
    text: |-
      1 Behoudens het bepaalde in het derde lid bedraagt het in [artikel 13][ref1] bedoelde percentage voor de
      nagelaten betrekking van het burger-oorlogsslachtoffer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet heeft bereikt:

      a. 75, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer minderjarige kinderen te haren of zijnen
      laste heeft;

      b. 70, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer geen minderjarige kinderen te haren of
      zijnen laste heeft.

      2 Het in [artikel 13][ref3] bedoelde percentage bedraagt voor de nagelaten betrekking
      van het burger-oorlogsslachtoffer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], heeft bereikt:

      a. 55, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer minderjarige kinderen te haren of zijnen
      laste heeft;

      b. 50, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer geen minderjarige kinderen te haren of
      zijnen laste heeft.

      3 a. De uitkering aan de minderjarige volle wees van het burger-oorlogsslachtoffer wordt naar behoefte individueel
      bepaald. Bij vaststelling van de uitkering wordt rekening gehouden met geëigende voorzieningen ter zake van kosten
      van onderwijs en opleiding.

      b. De onder a bedoelde uitkering kan zo nodig worden voortgezet tot uiterlijk het bereiken van de 27-
      jarige leeftijd door de betrokkene, indien hij, hetzij in verband met een dagstudie, hetzij in verband met
      arbeidsongeschiktheid, door het ontbreken van andere geëigende voorzieningen op die uitkering is aangewezen.

      4 De uitkering, berekend met toepassing van het eerste lid, onderdeel a, bedraagt niet meer dan een bedrag ter
      grootte van 80% van het bedrag, bedoeld in[ artikel 10, achtste lid, onder b][ref5], vermenigvuldigd met 3/4 en
      vermeerderd met een bedrag ter grootte van 20% van het bedrag dat na inhouding van loonbelasting en premie voor
      de volksverzekeringen voor een persoon die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref6]
      bedoelde leeftijd nog niet heeft bereikt, gelijk is aan 90% van het netto-minimumloon, rekening houdend met de
      algemene heffingskorting, bedoeld in[ artikel 22 van de Wet op de loonbelasting 1964][ref7].

      5 De uitkering, berekend met toepassing van het bepaalde in het eerste lid, onder b, bedraagt niet meer
      dan een bedrag ter grootte van 80% van het bedrag, bedoeld in [artikel 10, achtste lid, onder b][ref8],
      vermenigvuldigd met 5/7 en vermeerderd met een bedrag ter grootte van 20% van de uitkering bedoeld in
      [artikel 17, eerste lid, van de Algemene nabestaandenwet][ref9].


