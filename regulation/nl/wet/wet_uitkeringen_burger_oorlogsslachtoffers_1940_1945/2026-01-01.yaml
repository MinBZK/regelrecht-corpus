  - number: '38'
    text: |-
      1 Bij de bekendmaking van de beschikking wordt voorlichting gegeven over de procedure en de voor het bezwaarschrift
      geldende termijn van behandeling.

      2 De beschikking op een aanvraag krachtens [artikel 7, onder a, b of c][ref1], [artikel 8][ref2]
      of [artikel 19][ref3], voorzover de aanvrager niet reeds op grond van [artikel 34][ref4] is erkend,
      [artikel 7, onder d, e of f][ref5], voor zover de overledene geen aanspraken op deze wet heeft doen gelden, de
      [artikelen 32][ref6] en [33][ref7], voorzover de aanvrager niet reeds eerder aanspraken op deze wet heeft doen
      gelden, wordt gegeven binnen zeven maanden na de datum waarop de aanvraag bij de Raad is ingekomen. Indien de Raad
      ten gevolge van bijzondere omstandigheden niet binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste
      acht weken worden verlengd. Van de verlenging doet de Raad schriftelijk mededeling aan de belanghebbende.

      3 De beschikking op een aanvraag krachtens [artikel 34][ref8] wordt gegeven binnen vier maanden na de datum waarop
      de aanvraag bij de Raad is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden niet binnen deze
      termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad
      schriftelijk mededeling aan de belanghebbende.

      4 De beschikking op een aanvraag krachtens [artikel 7, onder a, b of c][ref9], [artikel 8][ref10]
      of [artikel 19][ref11], voorzover de aanvrager reeds op grond van [artikel 34][ref12] is erkend,
      [artikel 7, onder d, e of f][ref13], voor zover de overledene aanspraken op deze wet heeft doen gelden, of de
      [artikelen 32][ref14] of [33][ref15], voorzover de aanvrager reeds eerder aanspraken op deze wet heeft doen gelden,
      wordt gegeven binnen dertien weken na de datum waarop de aanvraag bij de Raad of de Sociale verzekeringsbank is
      ingekomen. Indien de Raad of de Sociale verzekeringsbank ten gevolge van bijzondere omstandigheden niet binnen deze
      termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad
      schriftelijk mededeling aan de belanghebbende.

      5 Met betrekking tot een aanvraag, bedoeld in het vierde lid, die wordt ingediend terwijl een aanvraag, bedoeld
      in het tweede lid, nog in behandeling is geldt, in afwijking van het vierde lid, de termijn die resteert voor
      de beschikking op de aanvraag, bedoeld in het tweede lid, tenzij de resterende termijn korter is dan de termijn,
      bedoeld in het het vierde lid.


