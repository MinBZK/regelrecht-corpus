  - number: 39a
    text: |-
      1 Indien de aanvrager kennis wenst te nemen van gegevens welke mede tot een beschikking van de Raad of de Sociale
      verzekeringsbank kunnen leiden dan wel hebben geleid, worden deze hem op zijn verzoek door de Raad of de Sociale
      verzekeringsbank verstrekt.

      2 Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vergoeding welke verschuldigd is,
      indien afschrift wordt verstrekt van de op de beschikking betrekking hebbende bescheiden.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel39a
  - number: '40'
    text: |-
      1 De uitkering, de toeslag, de vergoeding en tegemoetkoming gaan in:

      a. op de eerste dag van de maand waarin de aanvraag daartoe is ingediend, tenzij het bepaalde onder *b* van
      toepassing is;

      b. voor de weduwe, weduwnaar of minderjarige volle wees, die aansluitend aan het overlijden van het burger-
      oorlogsslachtoffer, dat een uitkering ingevolge deze wet genoot, aanspraak op een uitkering maakt, op de eerste dag
      van de derde maand volgend op die, waarin het overlijden heeft plaatsgevonden.

      2 De Raad of de Sociale verzekeringsbank kan bij beschikking van het bepaalde in het eerste lid in het voordeel
      van de betrokkene afwijken, indien hij, rekening houdende met alle omstandigheden, een dergelijke afwijking in een
      individueel geval noodzakelijk acht. Onze Minister stelt te dien aanzien nadere regelen.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel40
  - number: '41'
    text: |-
      1 De periodieke uitkering alsmede de garantie-uitkering, bedoeld in [artikel 8][ref1], wordt beëindigd:

      a. bij het overlijden van de uitkeringsgerechtigde die een echtgenoot of minderjarige kinderen achterlaat: met
      ingang van de eerste dag van de derde maand volgend op die, waarin het overlijden heeft plaatsgevonden;

      b. bij het overlijden van de uitkeringsgerechtigde die geen echtgenoot of minderjarige kinderen achterlaat: met
      ingang van de eerste dag van de maand volgend op die, waarin het overlijden heeft plaatsgevonden;

      c. bij huwelijk, daaronder mede begrepen de in [artikel 2][ref2], bedoelde situatie, van de weduwe of de weduwnaar,
      die niet als burger-oorlogsslachtoffer recht heeft op een uitkering ingevolge deze wet, met ingang van de eerste
      dag van de maand, volgend op die, waarin daarvan sprake is;

      d. bij het bereiken van de leeftijd van 21 jaar, tenzij [artikel 15, derde lid, onder ][ref3], van toepassing is,
      of bij het aangaan van een huwelijk door de volle wees vóór het bereiken van die leeftijd, daaronder mede begrepen
      de in [artikel 2][ref4], bedoelde situatie, met ingang van de eerste dag van de maand volgend op die, waarin de
      volle wees de leeftijd van 21 jaar bereikt heeft, onderscheidenlijk het huwelijk heeft plaatsgehad.

      2 De toeslag, de vergoeding en tegemoetkoming worden beëindigd bij het overlijden van het burger-oorlogsslachtoffer
      met ingang van de eerste dag van de maand volgend op die waarin het overlijden heeft plaatsgevonden.

      3 De uitkering die op grond van [artikel 41, eerste lid onder ][ref5], werd beëindigd, wordt opnieuw verleend
      indien het huwelijk is ontbonden of het aangaan van een andere vorm van duurzaam samenleven is beëindigd. In dat
      geval gaat de uitkering in op de eerste dag van de maand waarin de hernieuwde aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel8
