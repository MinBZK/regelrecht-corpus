---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_uitkeringen_burger_oorlogsslachtoffers_1940_1945
regulatory_layer: WET
publication_date: '2018-10-23'
valid_from: '2008-02-22'
bwb_id: BWBR0003664
url: https://wetten.overheid.nl/BWBR0003664/2008-02-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen betreffende de verlening van
    uitkeringen en bijzondere voorzieningen aan burger-oorlogsslachtoffers uit de Tweede Wereldoorlog en hun nagelaten
    betrekkingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel1
  - number: 1.b
    text: |-
      de Raad: de Pensioen- en Uitkeringsraad, bedoeld in de [Wet op de Pensioen- en Uitkeringsraad][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004806
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004806
  - number: '2.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder burger-oorlogsslachtoffer verstaan:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2.1.a
    text: |-
      degene, die tijdens de oorlogsjaren 1940-1945 als burger lichamelijk of psychisch letsel heeft opgelopen bij met
      de krijgsverrichtingen direct verbonden handelingen of omstandigheden, ten gevolge van welk letsel hij blijvend
      invalide is geworden of is overleden;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2.1.b
    text: |-
      degene, die tijdens de oorlogsjaren 1940-1945 als burger lichamelijk of psychisch letsel heeft opgelopen door of
      in verband met handelingen of maatregelen welke door of namens de vijandelijke bezettende machten tegen hem werden
      gericht, ten gevolge van welk letsel hij blijvend invalide is geworden of is overleden;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2.1.c
    text: |-
      degene, die tijdens de oorlogsjaren 1940-1945 als burger lichamelijk letsel heeft opgelopen bij handelingen, welke
      door of namens de vijandelijke bezettende machten werden gericht tegen derden, ten gevolge van welk letsel hij
      blijvend invalide is geworden of is overleden;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2.1.d
    text: |-
      degene, die tijdens de oorlogsjaren 1940-1945 als burger op jeugdige leeftijd psychisch letsel heeft opgelopen door
      de confrontatie met doodslag, executie of zware mishandeling van derden, door of namens de vijandelijke bezettende
      macht, ten gevolge van welk letsel hij blijvend invalide is geworden;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2.1.e
    text: |-
      degene, die in de na-oorlogse jaren als burger lichamelijk letsel heeft opgelopen bij het ontploffen van munitie
      of ander oorlogstuig afkomstig uit de oorlogsjaren 1940-1945, ten gevolge van welk letsel hij blijvend invalide is
      geworden of is overleden, tenzij het letsel is te wijten aan onvoorzichtigheid van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2.1.f
    text: |-
      degene, die in de na-oorlogse jaren in het voormalige Nederlands-Indië als burger lichamelijk of psychisch letsel
      heeft opgelopen bij ongeregeldheden die zich nauw aansluitend aan de oorlog tot 27 december 1949 aldaar hebben
      voorgedaan en die naar aard en gevolgen vergelijkbaar zijn met de omstandigheden bedoeld onder *a*, *b*, *c* of
      *d*, ten gevolge van welk letsel hij blijvend invalide is geworden of is overleden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: '2.2'
    text: |-
      Indien het letsel, bedoeld in het eerste lid, niet duidelijk door andere oorzaken dan het oorlogsgeweld als
      bedoeld in het eerste lid is ontstaan, wordt dit geacht zijn oorzaak te hebben in het oorlogsgeweld, dan wel
      in omstandigheden daarmee verband houdende. Daarbij wordt rekening gehouden met de inzichten en ervaringen van
      de medische wetenschap met betrekking tot de relatie tussen het oorlogsgeweld en de geestelijke en lichamelijke
      gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2
  - number: 2a.1
    text: 'Voor de toepassing van deze wet wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.1.a
    text: 'huwelijk: het geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.1.b
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.1.c
    text: 'echtgenoot of echtpaar: de geregistreerde partner of het geregistreerde paar;'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.1.d
    text: 'weduwe of weduwnaar: de achtergebleven partij bij het geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.2
    text: 'In deze wet en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.2.a
    text: |-
      wordt als minderjarig kind of als minderjarige volle wees aangemerkt onderscheidenlijk het kind dat of de volle
      wees die de leeftijd van 21 jaar nog niet heeft bereikt en niet gehuwd is of gehuwd geweest is;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.2.b
    text: |-
      worden als gehuwd of als echtgenoot mede aangemerkt, ongehuwde personen van verschillend of gelijk geslacht die
      duurzaam een gezamenlijke huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste
      of tweede graad bestaat;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.2.c
    text: wordt als ongehuwd aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: 2a.3
    text: |-
      Van een gezamenlijke huishouding als bedoeld in het eerste lid kan slechts sprake zijn indien twee personen
      gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in de kosten van de huishouding dan
      wel op andere wijze in elkaars verzorging voorzien. Onze Minister kan nadere regels stellen voor de toepassing van
      de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel2a
  - number: '3.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: 3.1.a
    text: |-
      degene, die tijdens de oorlogsjaren 1940–1945 of in de na-oorlogse jaren, als burger getroffen is door
      oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], en op dat moment Nederlander was dan wel Nederlands
      onderdaan in de zin van de toenmalige Wet van 10 februari 1910 (*Stb.* 55), mits hij de Nederlandse nationaliteit
      bezit en op de datum van de aanvraag, bedoeld in [artikel 35][ref2], hier te lande gevestigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 3.1.b
    text: |-
      degene, die tijdens de oorlogsjaren 1940–1945 of in de na-oorlogse jaren, als burger getroffen is door
      oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], en op dat moment als vreemdeling in Nederland gevestigd
      was, anders dan in opdracht van enige vijandelijke mogendheid, mits hij de Nederlandse nationaliteit bezit en tot
      de datum van de aanvraag, bedoeld in [artikel 35][ref2], onafgebroken hier te lande gevestigd is gebleven;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 3.1.c
    text: |-
      degene, die tijdens de oorlogsjaren 1940–1945 of in de na-oorlogse jaren, als burger getroffen is door
      oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], en op dat moment als vreemdeling in het voormalige
      Nederlands-Indië gevestigd was, anders dan in opdracht van enige vijandelijke mogendheid, mits hij de Nederlandse
      nationaliteit bezit en tot de datum van zijn komst naar Nederland, doch uiterlijk tot 1 april 1964, onafgebroken
      in het voormalige Nederlands-Indië, in Indonesië of in het voormalige Nederlands Nieuw-Guinea gevestigd is
      gebleven en zich aansluitend daaraan in Nederland heeft gevestigd en tot de datum van de aanvraag, bedoeld in
      [artikel 35][ref2], onafgebroken hier te lande gevestigd is gebleven;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 3.1.d
    text: |-
      de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld onder
      a, b of c voldeed, mits zij de Nederlandse nationaliteit bezitten;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: 3.1.e
    text: |-
      de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld
      onder a voldeed, dat vóór de datum van de aanvraag, bedoeld in [artikel 35][ref1], is overleden, mits de weduwe,
      weduwnaar en de minderjarige volle wees de Nederlandse nationaliteit bezitten en op de datum van de aanvraag hier
      te lande gevestigd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 3.1.f
    text: |-
      de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld
      onder b voldeed, dat vóór de datum van de aanvraag, bedoeld in [artikel 35][ref1], is overleden, mits het burger-
      oorlogsslachtoffer tot het tijdstip van zijn overlijden onafgebroken in Nederland gevestigd is geweest en de
      weduwe, weduwnaar en de minderjarige volle wees de Nederlandse nationaliteit bezitten en sedert het overlijden van
      het burger-oorlogsslachtoffer tot de datum van de aanvraag onafgebroken hier te lande gevestigd zijn gebleven;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 3.1.g
    text: |-
      de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld onder
      c voldeed, dat is overleden vóór 1 april 1964, mits het burger-oorlogsslachtoffer tot de datum van zijn overlijden
      onafgebroken in het voormalige Nederlands-Indië, in Indonesië of in het voormalige Nederlands Nieuw-Guinea
      gevestigd is geweest en de weduwe, weduwnaar en de minderjarige volle wees de Nederlandse nationaliteit bezitten
      en sedert het overlijden van het burger-oorlogsslachtoffer tot hun komst naar Nederland, doch uiterlijk tot 1 april
      1964, onafgebroken in genoemde gebieden gevestigd zijn gebleven en aansluitend daaraan zich in Nederland hebben
      gevestigd en tot de datum van de aanvraag onafgebroken hier te lande gevestigd zijn gebleven;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: 3.1.h
    text: |-
      de weduwe, weduwnaar en de minderjarige volle wees van het burger-oorlogsslachtoffer dat aan de eisen gesteld
      onder c voldeed, dat is overleden ná 1 april 1964, mits het burger-oorlogsslachtoffer tot zijn komst naar
      Nederland, doch uiterlijk tot 1 april 1964, onafgebroken in het voormalige Nederlands-Indië, in Indonesië of in het
      voormalige Nederlands Nieuw-Guinea gevestigd is geweest en zich aansluitend daaraan in Nederland heeft gevestigd
      en tot de datum van zijn overlijden onafgebroken hier te lande gevestigd is gebleven en de weduwe, weduwnaar
      en de minderjarige volle wees de Nederlandse nationaliteit bezitten en sedert het overlijden van het burger-
      oorlogsslachtoffer tot de datum van de aanvraag onafgebroken hier te lande gevestigd zijn gebleven.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: '3.2'
    text: |-
      Indien degene, die voldoet aan de eisen gesteld in het eerste lid, onder *b* en *c*, of diens nabestaanden, bedoeld
      in het eerste lid, onder *f, g* en *h*, tijdens hun onafgebroken verblijf in Nederland, of in het voormalige
      Nederlands-Indië, Indonesië of het voormalige Nederlands Nieuw-Guinea, de Nederlandse nationaliteit hebben
      verkregen, wordt een voortzetting van dat onafgebroken verblijf niet langer vereist, mits diegene of de nabestaande
      de Nederlandse nationaliteit behoudt of tot zijn overlijden heeft behouden en zij op de datum van de aanvraag hier
      te lande gevestigd zijn.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: '3.3'
    text: |-
      Indien degene, die voldoet aan de eisen gesteld in het eerste lid onder a, en in het tweede lid, of de
      nabestaanden, bedoeld in het eerste lid, onder e, en in het tweede lid, zich hier te lande vestigen na de datum
      van inwerkingtreding van deze wet, vervalt het recht op de voorzieningen van deze wet indien zij zich binnen een
      periode van vijf jaar weer elders vestigen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: '3.4'
    text: |-
      Onder komst naar Nederland, bedoeld in het eerste lid, onder *c, g* en *h*, wordt mede verstaan het indienen van
      een verzoek om toestemming tot vestiging in Nederland waarop gunstig is beslist.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: '3.5'
    text: |-
      Onder onafgebroken vestiging, bedoeld in het eerste lid, wordt verstaan vestiging, die niet onderbroken is door
      verblijf elders van langere duur dan één jaar.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
  - number: '3.6'
    text: |-
      De Raad kan deze wet tevens van toepassing verklaren op degene die tijdens de oorlogsjaren 1940–1945 of in de na-
      oorlogse jaren, als burger is getroffen door oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], of diens
      nabestaanden die niet voldoen aan de in het eerste, tweede of derde lid gestelde eisen en ten aanzien van wie het
      niet toepassen van deze wet een klaarblijkelijke hardheid zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '4'
    text: |-
      Behoudens in nader bij algemene maatregel van bestuur te regelen gevallen kunnen aan deze wet geen aanspraken
      worden ontleend door:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel4
  - number: 4.a
    text: |-
      degene, die op grond van oorlogsgeweld als bedoeld in [artikel 2, eerste lid][ref1], aanspraken ontleent aan de
      voor militairen geldende voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: 4.b
    text: |-
      degene, die op grond van zijn invaliditeit aanspraken ontleent aan de [Wet buitengewoon pensioen 1940-1945][ref1],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2], de
      [Wet buitengewoon pensioen Indisch verzet][ref3] of de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002035
      [ref3]: https://wetten.overheid.nl/BWBR0003968
      [ref4]: https://wetten.overheid.nl/BWBR0002844
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002032
      - id: ref2
        bwb_id: BWBR0002035
      - id: ref3
        bwb_id: BWBR0003968
      - id: ref4
        bwb_id: BWBR0002844
  - number: 4.c
    text: |-
      de weduwe, weduwnaar en minderjarige volle wees van de onder a en b bedoelde personen, indien en voor zover zij als
      nabestaanden aanspraken ontlenen aan de voorzieningen, bedoeld onder a en de wetten, genoemd onder b.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel4
  - number: '5'
    text: 'Aan deze wet kunnen geen rechten worden ontleend door:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.a
    text: 'degene, die blijkens opgave van Onze Minister van Justitie:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.a.1e
    text: bij onherroepelijke uitspraak van een bijzondere strafrechter is veroordeeld;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.a.2e
    text: |-
      bij een uitspraak van een Tribunaal, waarop fiat executie is verleend, de al dan niet voorwaardelijke oplegging van
      een bijzondere maatregel onderging;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.a.3e
    text: |-
      bij een onherroepelijke beslissing van een orgaan van de bijzondere rechtspleging voorwaardelijk buiten vervolging
      is gesteld;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.a.4e
    text: zich door de vlucht aan vervolging door een orgaan van de bijzondere rechtspleging heeft onttrokken;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.b
    text: |-
      degene, die bij een onherroepelijke uitspraak van een met zuivering belast orgaan of college is ontzet van het
      recht ambten of bepaalde ambten te bekleden dan wel bepaalde beroepen of functies uit te oefenen of oneervol is
      ontslagen. Zo nodig worden inlichtingen ingewonnen bij Onze Minister, hoofd van het betrokken departement van
      algemeen bestuur;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.c
    text: |-
      degene, die zich tijdens de oorlogsjaren 1940-1945 uit Nederlands nationaal oogpunt beschouwd, onwaardig heeft
      gedragen. Zo nodig worden inlichtingen ingewonnen bij Onze Minister van Justitie;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: 5.d
    text: |-
      de weduwe, weduwnaar en minderjarige volle wees van onder *b* of *c* bedoelde personen, indien en voor zover
      zij als nabestaanden rechten aan deze wet zouden hebben kunnen ontlenen en indien een der omstandigheden zoals
      omschreven onder *a*, *b* of *c*, zich niet zou hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel5
  - number: '7'
    text: |-
      Behoudens het bepaalde in [artikel 9][ref1] heeft recht op een periodieke uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel9
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: 7.a
    text: |-
      het burger-oorlogsslachtoffer, dat vóór het bereiken van de leeftijd, waarop gelijksoortige valide personen in
      de regel hun werkzaamheden beëindigen, door zijn invaliditeit, welke het gevolg is van het letsel, bedoeld in
      [artikel 2][ref1], gedwongen werd of wordt zijn werkzaamheden in beroep of bedrijf te beëindigen of blijvend te
      verminderen, indien en voor zover hij buiten staat is door of in verband met arbeid een inkomen te verwerven,
      gelijk aan het inkomen, dat hij uit vorenbedoeld beroep of bedrijf zou hebben genoten, indien hij niet invalide zou
      zijn geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: 7.b
    text: |-
      het burger-oorlogsslachtoffer, dat vóór het tot uiting komen van zijn invaliditeit, welke het gevolg is van het
      letsel, bedoeld in [artikel 2][ref1], door of in verband met het volgen van onderwijs nog geen arbeid in beroep of
      bedrijf uitoefende, indien hij ten gevolge van die invaliditeit nimmer in staat is geweest door arbeid in beroep of
      bedrijf een inkomen te verwerven, dat in overeenstemming was met het niveau van het gevolgde onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: 7.c
    text: |-
      het burger-oorlogsslachtoffer, dat door of in verband met zijn invaliditeit, welke het gevolg is van het letsel,
      bedoeld in [artikel 2][ref1], zijn werkzaamheden in beroep of bedrijf tijdelijk moet onderbreken of verminderen,
      indien en voor zolang in de ten gevolge daarvan ontstane derving van inkomsten niet op andere wijze wordt voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: 7.d
    text: |-
      de weduwe of weduwnaar, alsmede de minderjarige volle wees van het burger-oorlogsslachtoffer, bedoeld onder *a*,
      *b* en *c*, indien dit ten tijde van het overlijden in het genot was van een periodieke uitkering op grond van
      deze wet;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
  - number: 7.e
    text: |-
      de weduwe of weduwnaar, alsmede de minderjarige volle wees van het burger-oorlogsslachtoffer van wie het overlijden
      het gevolg was van het letsel, bedoeld in [artikel 2][ref1], mits het burger-oorlogsslachtoffer, ware het niet
      overleden, in aanmerking zou zijn gekomen voor een periodieke uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: 7.f
    text: |-
      de weduwe of weduwnaar, alsmede de minderjarige volle wees van het burger-oorlogsslachtoffer, dat ten tijde
      van zijn overlijden in het genot was van een periodieke uitkering, anders dan op grond van deze wet, mits deze
      uitkering hem was toegekend in verband met het letsel, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '8'
    text: |-
      Recht op een garantie-uitkering heeft het burger-oorlogsslachtoffer, dat ten tijde van het tot uiting komen van
      zijn invaliditeit, welke het gevolg is van het letsel, bedoeld in [artikel 2][ref1], de leeftijd heeft bereikt
      waarop gelijksoortige valide personen in de regel hun werkzaamheden beëindigen, mits hij, indien hij die leeftijd
      nog niet zou hebben bereikt, door of in verband met die invaliditeit gedwongen zou zijn geweest zijn werkzaamheden
      in beroep of bedrijf te beëindigen of blijvend te verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '9.1'
    text: |-
      De periodieke uitkering aan de weduwe of weduwnaar van het burger-oorlogsslachtoffer wordt ten hoogste gedurende
      een tijdvak van twee jaren na de datum van het overlijden verleend, indien de weduwe of weduwnaar op dat tijdstip
      nog niet de leeftijd van 40 jaren heeft bereikt, tenzij deze arbeidsongeschikt is of een of meer minderjarige
      kinderen te haren of zijnen laste heeft.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel9
  - number: '9.2'
    text: |-
      Een periodieke uitkering aan de weduwe of weduwnaar van het burger-oorlogsslachtoffer wordt niet toegekend, indien
      het huwelijk is gesloten, nadat het burger-oorlogsslachtoffer, aan wie voordien een periodieke uitkering in de zin
      van deze wet was toegekend, de 65-jarige leeftijd heeft bereikt, tenzij de echtgenoten of geregistreerde partners
      reeds gedurende een periode van ten minste tien jaren met elkaar zijn gehuwd geweest of hebben samengeleefd.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel9
  - number: '10.1'
    text: |-
      Indien aanspraak bestaat op een periodieke uitkering, wordt de grondslag vastgesteld, waarnaar de uitkering wordt
      berekend.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: 10.2.a
    text: |-
      Indien het burger-oorlogsslachtoffer voldoet aan het bepaalde in [artikel 7, onder a][ref1], wordt de grondslag
      vastgesteld naar het inkomen uit arbeid, dat het burger-oorlogsslachtoffer ten tijde van de aanvraag, bedoeld in
      [artikel 35][ref2], in Nederland, ware hij niet invalide geweest, zou hebben genoten uit het door hem uitgeoefende
      beroep of bedrijf, waarin hij voor het eerst ten gevolge van zijn invaliditeit zijn werkzaamheden moest beëindigen
      of blijvend verminderen;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 10.2.b
    text: |-
      indien het burger-oorlogsslachtoffer, bedoeld onder a, na het tot uiting komen van de invaliditeit ten gevolge
      waarvan hij zijn werkzaamheden in beroep of bedrijf heeft moeten beëindigen of blijvend verminderen, arbeid heeft
      aanvaard in een ander beroep of bedrijf, kan, indien dat voor hem gunstiger is, de grondslag worden vastgesteld
      naar het inkomen, dat het burger-oorlogsslachtoffer ten tijde van de aanvraag, bedoeld in [artikel 35][ref1], in
      Nederland uit arbeid in laatstbedoeld beroep of bedrijf zou hebben genoten, indien hij zijn werkzaamheden door of
      in verband met zijn invaliditeit niet had moeten beëindigen of blijvend verminderen;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 10.2.c
    text: |-
      onder arbeid in een ander beroep of bedrijf, bedoeld onder b, wordt verstaan: arbeid, welke gedurende een
      aaneengesloten periode van ten minste drie jaren in de voor dat beroep of bedrijf gebruikelijke arbeidstijd is
      verricht;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: 10.2.d
    text: |-
      de Raad kan, bij beschikking, van het bepaalde onder c afwijken indien naar zijn oordeel de onverkorte toepassing
      daarvan, gelet op alle omstandigheden, in een individueel geval onredelijk zou zijn.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: '10.3'
    text: |-
      Indien het in het tweede lid bedoelde beroep of bedrijf buiten Nederland werd uitgeoefend, wordt bij de
      vaststelling van de grondslag, waarnaar de uitkering wordt berekend, rekening gehouden met het meest vergelijkbare
      beroep of bedrijf in Nederland, alsmede met (vak)opleiding, bekwaamheid en andere factoren, welke ter zake van
      belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: '10.4'
    text: |-
      Bij de vaststelling van de grondslag, bedoeld in het tweede en derde lid, wordt geen rekening gehouden met de
      mogelijkheid van inkomstenvermeerdering ten gevolge van bevordering of verhoging van de vakbekwaamheid, uitbreiding
      van het bedrijf of andere dergelijke factoren.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: '10.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid in beroep of bedrijf, als bedoeld in
      het tweede lid, moet worden verstaan.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: '10.6'
    text: |-
      Indien het burger-oorlogsslachtoffer voldoet aan het bepaalde in [artikel 7, onder b][ref1], wordt de grondslag
      vastgesteld met inachtneming van door Onze Minister te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10.7'
    text: |-
      Indien het burger-oorlogsslachtoffer voldoet aan het bepaalde in [artikel 7, onder c][ref1], wordt de grondslag
      vastgesteld op het bedrag, bedoeld in het achtste lid, onder *a*, tenzij de Raad, rekening houdende met alle
      omstandigheden, in een individueel geval van oordeel is, dat een hogere grondslag gerechtvaardigd is. Deze
      grondslag kan niet op een hoger bedrag worden vastgesteld dan de grondslag die zou zijn vastgesteld, indien het
      burger-oorlogsslachtoffer zou voldoen aan het bepaalde in het tweede lid, onder a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10.8'
    text: 'De grondslag wordt bepaald op:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: 10.8.a
    text: ten minste een bedrag van € 1.867,87 per maand per 1 januari 1983 ;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: 10.8.b
    text: ten hoogste een bedrag van € 3.877,64 per maand per 1 januari 1983 .
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
  - number: '10.9'
    text: |-
      De grondslag, waarnaar de uitkering aan de weduwe of weduwnaar bedoeld in [artikel 7, onder d tot en met f][ref1],
      wordt berekend, wordt vastgesteld op hetzelfde bedrag als waarop de grondslag voor het burger-oorlogsslachtoffer
      zou zijn vastgesteld, indien hij op de datum van de aanvraag, bedoeld in [artikel 35][ref2], nog in leven zou zijn
      geweest en op die datum voldaan zou hebben aan het bepaalde in [artikel 7, onder a of b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel7
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11'
    text: |-
      Indien aanspraak bestaat op een garantie-uitkering wordt deze berekend naar het bedrag, bedoeld in
      [artikel 10, achtste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12'
    text: |-
      Het bepaalde in deze paragraaf is niet van toepassing indien de aanspraak betrekking heeft op een uitkering aan een
      minderjarige volle wees.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel12
  - number: '13'
    text: |-
      De periodieke uitkering bedraagt een percentage van de overeenkomstig het bepaalde in [artikel 10][ref1]
      vastgestelde grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Het in [artikel 13][ref1] bedoelde percentage bedraagt voor het burger-oorlogsslachtoffer dat de 65-jarige leeftijd
      nog niet heeft bereikt:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel13
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 14.1.a
    text: 80, indien het burger-oorlogsslachtoffer is gehuwd, tenzij het bepaalde onder *b* van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: 14.1.b
    text: |-
      70, indien het burger-oorlogsslachtoffer is gehuwd en het inkomen van de echtgenoot, inkomsten uit vermogen
      daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.c
    text: 75, indien het burger-oorlogsslachtoffer niet is gehuwd en minderjarige kinderen te zijnen laste heeft;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: 14.1.d
    text: 70, indien het burger-oorlogsslachtoffer als alleenstaande moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: '14.2'
    text: |-
      Het in [artikel 13][ref1] bedoelde percentage bedraagt voor het burger-oorlogsslachtoffer met ingang van de eerste
      dag van de maand waarin hij de 65-jarige leeftijd heeft bereikt:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel13
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 14.2.a
    text: 65, indien het burger-oorlogsslachtoffer is gehuwd, tenzij het bepaalde onder *b* van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: 14.2.b
    text: |-
      55, indien het burger-oorlogsslachtoffer is gehuwd en het inkomen van de echtgenoot, inkomsten uit vermogen
      daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.2.c
    text: 60, indien het burger-oorlogsslachtoffer niet is gehuwd en minderjarige kinderen te zijnen laste heeft;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: 14.2.d
    text: 55, indien het burger-oorlogsslachtoffer als alleenstaande moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: '14.3'
    text: |-
      Bij overlijden van de echtgenoot van het burger-oorlogsslachtoffer blijft het uitkeringspercentage ongewijzigd tot
      en met de laatste dag van de maand, volgende op die, waarin het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel14
  - number: '15.1'
    text: |-
      Behoudens het bepaalde in het derde lid bedraagt het in [artikel 13][ref1] bedoelde percentage voor de nagelaten
      betrekking van het burger-oorlogsslachtoffer die de 65-jarige leeftijd nog niet heeft bereikt:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel13
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 15.1.a
    text: |-
      75, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer minderjarige kinderen te haren of zijnen laste
      heeft;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
  - number: 15.1.b
    text: |-
      70, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer geen minderjarige kinderen te haren of zijnen
      laste heeft.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
  - number: '15.2'
    text: |-
      Het in [artikel 13][ref1] bedoelde percentage bedraagt voor de nagelaten betrekking van het burger-
      oorlogsslachtoffer die de 65-jarige leeftijd heeft bereikt:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel13
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 15.2.a
    text: |-
      55, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer minderjarige kinderen te haren of zijnen laste
      heeft;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
  - number: 15.2.b
    text: |-
      50, indien de weduwe of weduwnaar van het burger-oorlogsslachtoffer geen minderjarige kinderen te haren of zijnen
      laste heeft.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
  - number: 15.3.a
    text: |-
      De uitkering aan de minderjarige volle wees van het burger-oorlogsslachtoffer wordt naar behoefte individueel
      bepaald. Bij vaststelling van de uitkering wordt rekening gehouden met geëigende voorzieningen ter zake van kosten
      van onderwijs en opleiding.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
  - number: 15.3.b
    text: |-
      De onder *a* bedoelde uitkering kan zo nodig worden voortgezet tot uiterlijk het bereiken van de 27-jarige leeftijd
      door de betrokkene, indien hij, hetzij in verband met een dagstudie, hetzij in verband met arbeidsongeschiktheid,
      door het ontbreken van andere geëigende voorzieningen op die uitkering is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
  - number: '15.4'
    text: |-
      De uitkering, berekend met toepassing van het bepaalde in het eerste lid, onder *a*, bedraagt niet meer dan een
      bedrag ter grootte van 80% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref1], vermenigvuldigd
      met 3/4 en vermeerderd met een bedrag ter grootte van 20% van de som van de uitkeringen bedoeld in de
      [artikelen 17][ref2], eerste lid, en [25 van de Algemene nabestaandenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel25
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '25'
  - number: '15.5'
    text: |-
      De uitkering, berekend met toepassing van het bepaalde in het eerste lid, onder *b*, bedraagt niet meer
      dan een bedrag ter grootte van 80% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref1],
      vermenigvuldigd met 5/7 en vermeerderd met een bedrag ter grootte van 20% van de uitkering bedoeld in
      [artikel 17, eerste lid, van de Algemene nabestaandenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel17
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '17'
  - number: '16'
    text: |-
      Indien een burger-oorlogsslachtoffer voldoet zowel aan het bepaalde in [artikel 7, onder ][ref1], als aan het
      bepaalde in [artikel 7, onder ][ref2], wordt de hoogste ingevolge deze paragraaf van toepassing zijnde uitkering
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel7
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '17.1'
    text: |-
      Indien en voor zolang het burger-oorlogsslachtoffer in staat is zich door arbeid een inkomen te verwerven,
      doch deze arbeid naar het oordeel van de Raad om niet gegronde redenen niet of slechts ten dele verricht,
      wordt de grondslag waarnaar de uitkering wordt berekend, nader vastgesteld, rekening houdende met de mate
      van invaliditeit van het burger-oorlogsslachtoffer, waardoor diens vermogen om een inkomen te verwerven door
      of in verband met arbeid in beroep of bedrijf nadelig is beïnvloed. In een zodanig geval is het bepaalde in
      [artikel 10, achtste lid, onder ][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.2'
    text: |-
      De Raad gaat niet over tot een nadere vaststelling van de grondslag, als bedoeld in het eerste lid, dan na advies
      te hebben ingewonnen van ter zake deskundige personen of organen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel17
  - number: '17.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing, indien het burger-oorlogsslachtoffer buiten staat is 50% te
      verwerven van het inkomen dat hij verwierf uit de laatstelijk door hem verrichte arbeid in beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel17
  - number: '18.1'
    text: |-
      Bij verblijf van een alleenstaande of een echtpaar ter verpleging of verzorging in een daartoe bestemde inrichting,
      waarvan de kosten met toepassing van één der sociale verzekeringswetten worden betaald, wordt de periodieke
      uitkering, met ingang van het tijdstip waarop redelijkerwijs kan worden aangenomen dat deze verpleging of
      verzorging een langdurig karakter zal gaan dragen, doch in ieder geval na verloop van een jaar, nader bepaald op:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
  - number: 18.1.a
    text: |-
      12% van de overeenkomstig [artikel 10][ref1] vastgestelde grondslag, voor een alleenstaande;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 18.1.b
    text: |-
      20% van de overeenkomstig [artikel 10][ref1] vastgestelde grondslag, voor een gehuwde, tenzij onderdeel *c* van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 18.1.c
    text: |-
      12% van de overeenkomstig [artikel 10][ref1] vastgestelde grondslag voor een gehuwde, indien het inkomen van
      de echtgenoot, inkomsten uit vermogen daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in
      [artikel 10, achtste lid, onder ][ref2]. De garantie-uitkering wordt in een zodanig geval berekend naar:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 18.1.d
    text: |-
      12% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref1], voor een alleenstaande;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 18.1.e
    text: |-
      20% van het bedrag, bedoeld in [artikel 10, achtste lid, onder ][ref1], voor een echtpaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Het eerste lid is niet van toepassing indien de uitkeringsgerechtigde op 31 december 2000 verbleef in een
      verzorgingshuis als bedoeld in [artikel 1, eerste lid, onder b, van de Overgangswet verzorgingshuizen][ref1] zoals
      dat luidde voor het vervallen van deze bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel1
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008252
        artikel: '1'
  - number: '19.1'
    text: |-
      Behoudens het bepaalde in het vierde lid, wordt aan het burger-oorlogsslachtoffer, wiens invaliditeit, welke het
      gevolg is van het letsel, bedoeld in [artikel 2][ref1], zijn vermogen om door arbeid een inkomen te verwerven
      nadelig beïnvloedt of zou hebben beïnvloed indien hij nog op inkomsten uit arbeid zou zijn aangewezen, een toeslag
      toegekend voor voorzieningen welke strekken tot verbetering van diens levensomstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '19.2'
    text: |-
      De hoogte van de toeslag, bedoeld in het eerste lid, bedraagt 10% van het bedrag bedoeld in
      [artikel 10, achtste lid, onder a][ref1], nadat dit is verminderd met het bedrag, bedoeld in
      [artikel 26, eerste lid][ref2], tenzij het bepaalde in het derde lid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel26
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '26'
        hoofdstuk: II
        paragraaf: '6'
  - number: '19.3'
    text: |-
      Indien aan het burger-oorlogsslachtoffer een periodieke uitkering is toegekend, wordt op de in het tweede lid
      bedoelde toeslag een bedrag in mindering gebracht, berekend volgens de formule: in welke formule A voorstelt: het
      bedrag bedoeld in [artikel 10, achtste lid, onder a][ref1], nadat dit is verminderd met het bedrag, bedoeld in
      [artikel 26, eerste lid][ref2]; B voorstelt: het bedrag bedoeld in [artikel 10, achtste lid, onder b][ref3]; C
      voorstelt: 'het bedrag bedoeld in [artikel 10, achtste lid, onder a][ref4]; G voorstelt: de grondslag, waarnaar de'
      uitkering wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '26'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19.4'
    text: |-
      De toeslag, bedoeld in het eerste lid, wordt niet toegekend, indien toepassing is gegeven aan het bepaalde in de
      [artikelen 18, eerste lid][ref1], [32, vierde lid][ref2], of [42][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel42
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '32'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '42'
        hoofdstuk: II
        paragraaf: '11'
  - number: '20.1'
    text: |-
      Voor de in Nederland gevestigde uitkeringsgerechtigde en de uitkeringsgerechtigde op wie
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, wordt op de overeenkomstig
      [artikel 18, eerste lid][ref2], vastgestelde uitkering ten behoeve van de te zijnen laste komende premie van
      verzekering tegen ziektekosten een bij algemene maatregel van bestuur vastgestelde toeslag verleend die per
      categorie van uitkeringsgerechtigden verschilt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel18
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Voor de niet in Nederland gevestigde uitkeringsgerechtigde, met uitzondering van de uitkeringsgerechtigde op
      wie [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, wordt op de overeenkomstig
      [artikel 18, eerste lid][ref2], vastgestelde uitkering een toeslag verleend gelijk aan het, op het tijdstip met
      ingang waarvan toepassing wordt gegeven aan [artikel 18, eerste lid][ref3], eenmalig vast te stellen bedrag van
      de te zijnen laste blijvende premie van verzekering tegen ziektekosten, doch ten hoogste tot een bij algemene
      maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel18
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20.3'
    text: |-
      Het ingevolge het tweede lid vastgestelde bedrag van de ten laste van de uitkeringsgerechtigde blijvende premie van
      verzekering tegen ziektekosten wordt door de Raad herzien:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
  - number: 20.3.a
    text: |-
      jaarlijks, naar evenredigheid van de ontwikkeling van de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet op de zorgtoeslag][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '1'
  - number: 20.3.b
    text: bij het door de gerechtigde bereiken van de 65-jarige leeftijd,
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
  - number: 20.3.c
    text: bij veranderingen in de gezinssituatie van de gerechtigde, of
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
  - number: 20.3.d
    text: |-
      indien de Raad van oordeel is dat het niet herzien van het vastgestelde bedrag gelet op het belang dat dit artikel
      beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
  - number: '20.4'
    text: |-
      Indien de in [artikel 18, eerste lid][ref1], bedoelde kosten van verpleging of verzorging met toepassing van de
      [Algemene Wet Bijzondere Ziektekosten][ref2] worden betaald en de uitkeringsgerechtigde in die kosten een eigen
      bijdrage verschuldigd is, wordt op de overeenkomstig het bepaalde in [dat artikel][ref3] vastgestelde uitkering een
      toeslag verleend gelijk aan het bedrag van de eigen bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel18
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
  - number: '21.1'
    text: |-
      Voor de in Nederland gevestigde uitkeringsgerechtigde en de uitkeringsgerechtigde op wie
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, wordt op zijn periodieke uitkering
      of garantie-uitkering ten behoeve van de te zijnen laste komende premie van verzekering tegen ziektekosten een
      bij algemene maatregel van bestuur vastgestelde toeslag verleend voor zover deze premie meer bedraagt dan het
      overeenkomstig de [artikelen 14][ref2] en [15][ref3] vastgestelde percentage van het verschil tussen de grondslag
      en het bedrag, bedoeld in [artikel 10, achtste lid, onder a][ref4]. De toeslag verschilt per categorie van
      uitkeringsgerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Voor de niet in Nederland gevestigde uitkeringsgerechtigde, met uitzondering van de uitkeringsgerechtigde op wie
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, wordt op zijn periodieke uitkering
      of garantie-uitkering een toeslag verleend gelijk aan het bij de toekenning van de periodieke uitkering of de
      garantie-uitkering eenmalig vast te stellen bedrag van de te zijnen lasten blijvende premie van verzekering tegen
      ziektekosten, doch ten hoogste tot een bij algemene maatregel van bestuur vast te stellen bedrag, voor zover deze
      premie meer bedraagt dan het overeenkomstig de [artikelen 14][ref2] en [15][ref3] vastgestelde percentage van het
      verschil tussen de grondslag en het bedrag, bedoeld in [artikel 10, achtste lid, onder a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '21.3'
    text: |-
      Het ingevolge het tweede lid vastgestelde bedrag van de ten laste van de uitkeringsgerechtigde blijvende premie van
      verzekering tegen ziektekosten wordt door de Raad herzien:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
  - number: 21.3.a
    text: |-
      jaarlijks, naar evenredigheid van de ontwikkeling van de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet op de zorgtoeslag][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '1'
  - number: 21.3.b
    text: bij het door de gerechtigde bereiken van de 65-jarige leeftijd,
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
  - number: 21.3.c
    text: bij veranderingen in de gezinssituatie van de gerechtigde, of
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
  - number: 21.3.d
    text: |-
      indien de Raad van oordeel is dat het niet herzien van het vastgestelde bedrag gelet op het belang dat dit artikel
      beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel21
  - number: '22.1'
    text: |-
      Indien geen kinderbijslag uit welken hoofde of onder welke benaming ook wordt genoten, wordt op de periodieke
      uitkering en de garantie-uitkering een toeslag verleend voor de minderjarige kinderen waarvoor kinderbijslag zou
      worden ontvangen, indien de [Algemene Kinderbijslagwet][ref1] van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '22.2'
    text: Deze toeslag beloopt een bedrag gelijk aan de kinderbijslag ingevolge de in het eerste lid genoemde wet.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel22
  - number: '23.1'
    text: |-
      Op de periodieke uitkering wordt, indien de uitkeringsgerechtigde 65 jaar of ouder is, een toeslag verleend. Deze
      toeslag bedraagt:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
  - number: 23.1.a
    text: |-
      voor de gehuwde uitkeringsgerechtigde 60% van het bedrag van het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref1], vermeerderd
      met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 23.1.b
    text: |-
      voor de ongehuwde uitkeringsgerechtigde, die tevens een pensioengerechtigde is als bedoeld in
      [artikel 9, eerste lid, onder c, van de Algemene Ouderdomswet][ref1], 20% van het bedrag van het bruto-
      ouderdomspensioen voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder c, van die wet][ref2],
      vermeerderd met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 23.1.c
    text: |-
      voor de ongehuwde uitkeringsgerechtigde, anders dan die, bedoeld onder b, 20% van
      het bedrag van het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref1], vermeerderd met de vakantie-uitkering,
      bedoeld in [artikel 29 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
  - number: '23.2'
    text: 'De toeslag, bedoeld in het eerste lid, wordt niet toegekend:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
  - number: 23.2.a
    text: |-
      indien [artikel 8][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel8
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 23.2.b
    text: |-
      indien [artikel 18, eerste lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel18
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
  - number: 23.2.c
    text: |-
      aan de gehuwde uitkeringsgerechtigde, van wie de echtgenoot recht heeft op enig pensioen en ten aanzien van wie
      [artikel 28, zesde lid][ref1], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel28
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
  - number: '23.3'
    text: |-
      Onder enig pensioen als bedoeld in het tweede lid, onder c, wordt verstaan, een pensioen ten laste van de
      Nederlandse Schatkist of die van de Nederlandse Antillen of Aruba, van een publiekrechtelijk lichaam of een
      privaatrechtelijke rechtspersoon in Nederland, de Nederlandse Antillen of Aruba, dan wel ten laste van een door het
      openbaar gezag in Nederland, de Nederlandse Antillen of Aruba ingesteld fonds, alsmede een uitkering ingevolge deze
      wet of de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002844
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002844
  - number: 23a.1
    text: |-
      Indien de uitkeringsgerechtigde over zijn periodieke uitkering of garantie-uitkering de inkomensafhankelijke
      bijdrage, bedoeld in [artikel 41 van de Zorgverzekeringswet][ref1], verschuldigd is, heeft hij recht op een
      toeslag. Deze toeslag bedraagt het percentage van de periodieke uitkering of garantie-uitkering dat overeenkomt
      met het bijdragepercentage, bedoeld in [artikel 45, tweede lid, van de Zorgverzekeringswet][ref2], vermenigvuldigd
      met anderhalf, voorzover de uitkering of garantie-uitkering is te rekenen tot het deel van het bijdrage-inkomen,
      bedoeld in [artikel 43, eerste lid, onderdeel a, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 23a.2
    text: |-
      Indien de uitkeringsgerechtigde over zijn periodieke uitkering of garantie-uitkering de bijdrage, bedoeld in
      [artikel 69, tweede lid, van de Zorgverzekeringswet][ref1], verschuldigd is, heeft hij recht op een toeslag. Voor
      de berekening van deze toeslag is het eerste lid, tweede volzin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: 23a.3
    text: |-
      Het in aanmerking te nemen bijdrage-inkomen bedraagt op jaarbasis ten hoogste het bedrag, bedoeld in
      [artikel 43, tweede lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 23a.4
    text: |-
      In afwijking van de [artikelen 59][ref1] en [60][ref2] worden de toeslagen, bedoeld in het eerste en tweede lid, in
      de maand waarin de betaling plaatsvindt definitief vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel60
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '59'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '60'
        hoofdstuk: VI
  - number: '24.1'
    text: |-
      De garantie-uitkering bedraagt een percentage van het bedrag, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel11
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24.2'
    text: 'Het percentage, bedoeld in het eerste lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.a
    text: 'voor het burger-oorlogsslachtoffer, dat de leeftijd van 65 jaar nog niet heeft bereikt:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.a.1e
    text: 80, indien hij is gehuwd, tenzij hij duurzaam gescheiden leeft van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.a.2e
    text: |-
      75, indien hij niet is gehuwd of duurzaam gescheiden leeft van zijn echtgenoot en minderjarige kinderen te zijnen
      laste heeft;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.a.3e
    text: 70, indien hij als alleenstaande moet worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.b
    text: 'voor het burger-oorlogsslachtoffer, dat de leeftijd van 65 jaren heeft bereikt:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.b.1e
    text: 65, indien hij is gehuwd, tenzij hij duurzaam gescheiden leeft van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.b.2e
    text: |-
      55, indien hij niet is gehuwd of duurzaam gescheiden leeft van zijn echtgenoot en minderjarige kinderen te zijnen
      laste heeft;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: 24.2.b.3e
    text: 45, indien hij als alleenstaande moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel24
  - number: '25.1'
    text: |-
      Indien de op 31 december 1995 reeds ingegane pensioenen en reeds bestaande uitzichten op
      pensioen, bedoeld in [artikel 10 van de Wet privatisering ABP][ref1], ingevolge dat artikel
      worden aangepast aan een algemene bezoldigingswijziging, worden de grondslagen, bedoeld in
      [artikel 10, eerste, tweede, zesde, zevende en negende lid][ref2], naar overeenkomstige normen en voorwaarden
      aangepast. Onze Minister stelt de regels voor de uitvoering van de eerste volzin. Indien de algemene
      bezoldigingswijziging een verhoging is, werken deze regels zo nodig terug tot en met de datum waarop bedoelde
      algemene bezoldigingswijziging is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '25.2'
    text: |-
      In dezelfde mate waarin en met ingang van hetzelfde tijdstip waarop de grondslagen ingevolge het eerste lid worden
      aangepast, worden bij de ministeriële regeling als in het eerste lid bedoeld, gewijzigd de bedragen, genoemd in
      [artikel 10, achtste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '25.3'
    text: |-
      De overeenkomstig het eerste en tweede lid aangepaste grondslagen en bedragen treden in de plaats van de
      grondslagen en bedragen, zoals die golden op de dag, voorafgaande aan de datum van ingang van de aanpassing.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel25
  - number: '25.4'
    text: |-
      Indien de op 31 december 1995 reeds ingegane pensioenen en reeds bestaande uitzichten op pensioen, bedoeld in
      [artikel 10 van de Wet privatisering ABP][ref1], ingevolge dat artikel worden aangepast aan een eenmalige uitkering
      met een algemeen karakter, stelt Onze Minister de regels over de wijze waarop deze eenmalige uitkering naar
      overeenkomstige normen en voorwaarden leidt tot een eenmalige uitkering aan de uitkeringsgerechtigden. Deze regels
      werken zo nodig terug tot en met de datum waarop de in de eerste volzin bedoelde aanpassing van pensioenen en
      uitzichten op pensioen plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '10'
  - number: '25.5'
    text: |-
      Indien daartoe naar het oordeel van de Kroon een bijzondere aanleiding bestaat, kunnen de grondslagen, bedoeld
      in het eerste lid, en de bedragen, bedoeld in het tweede lid, bij algemene maatregel van bestuur met ingang van
      een bij die algemene maatregel van bestuur aan te geven datum worden aangepast, waarbij kan worden bepaald dat
      de aanpassing verschilt naar gelang de hoogte van de grondslagen en de bedragen. De ingevolge de vorige volzin
      aangepaste grondslagen en bedragen treden in de plaats van de grondslagen en de bedragen, zoals die golden op de
      dag, voorafgaande aan de datum van ingang van de aanpassing.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel25
  - number: '26.1'
    text: |-
      Op de periodieke uitkering, waaronder begrepen de met de in [artikel 23][ref1] genoemde toeslag verhoogde uitkering,
      wordt, na toepassing van de [artikelen 28][ref2] en [30][ref3], een bedrag ingehouden, dat gelijk is aan het bedrag
      van de premie dat een werkgever ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref4] op het
      overeenkomstige loon van een werknemer, die verzekerd is ingevolge [die wet][ref5], inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '30'
        hoofdstuk: II
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0017745
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0017745
  - number: '26.2'
    text: Op de garantie-uitkering wordt het in het eerste lid bedoelde bedrag ingehouden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel26
  - number: '26.3'
    text: |-
      Indien ingevolge de [Wet financiering sociale verzekeringen][ref1] een premie wordt ingehouden waarvan het
      percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen
      regelen door Onze Minister voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '26.4'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing indien de uitkering is vastgesteld met toepassing van
      [artikel 15, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel15
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '26.5'
    text: Het eerste en tweede lid zijn niet van toepassing indien de uitkeringsgerechtigde 65 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel26
  - number: '26.6'
    text: |-
      Onze Minister kan nadere en zo nodig afwijkende regelen stellen met betrekking tot de berekening van de ingevolge
      het eerste lid op de aldaar bedoelde uitkeringen in te houden bedragen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel26
  - number: '27'
    text: |-
      Het bedrag, bedoeld in [artikel 28, vierde lid, onder a][ref1], wordt door Onze Minister herzien, indien en voor
      zover de ontwikkeling van de consumentenprijsindex daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel28
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
  - number: 27a
    text: |-
      De op grond van de [artikelen 20, eerste en tweede lid][ref1], en [21, eerste en tweede lid][ref2] bij algemene
      maatregel van bestuur vastgestelde bedragen worden door Onze Minister herzien naar evenredigheid van de ontwikkeling
      van de standaardpremie als bedoeld in [artikel 1, eerste lid, onderdeel f, van de Wet op de zorgtoeslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '1'
  - number: '28.1'
    text: |-
      Op de over enig kalenderjaar toegekende periodieke uitkering vermeerderd met de toeslagen, bedoeld in
      de[ artikelen 21][ref1] en [23][ref2], worden, voor zover deze over de overeenkomstige periode werden genoten, in
      mindering gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel23
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
  - number: 28.1.a
    text: |-
      indien de uitkeringsgerechtigde de leeftijd van 65 jaar nog niet heeft bereikt, de bruto-inkomsten uit
      tegenwoordige arbeid in beroep of bedrijf, na aftrek van de daarop drukkende verwervingskosten, voor zover deze
      inkomsten 20% van de grondslag waarnaar de uitkering is berekend te boven gaan;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: 28.1.b
    text: |-
      Indien de uitkeringsgerechtigde 65 jaar of ouder is, en pensioengerechtigd ingevolge de
      [Algemene Ouderdomswet][ref1], het bruto-ouderdomspensioen krachtens die wet van de uitkeringsgerechtigde en
      de echtgenoot met inbegrip van de toeslag, bedoeld in [artikel 10 van die wet][ref2], en de vakantie-uitkering,
      bedoeld in [artikel 29 van die wet][ref3], voor zover dit niet meer bedraagt dan tweemaal het bedrag van het bruto-
      ouderdomspensioen voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van die wet][ref4],
      vermeerderd met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 28.1.c
    text: de inkomsten uit vermogen van de uitkeringsgerechtigde en van diens echtgenoot;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: 28.1.d
    text: de overige inkomsten van de uitkeringsgerechtigde.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: '28.2'
    text: |-
      Bij de toepassing van het bepaalde in het eerste lid, onder a, b en d, worden de jaarlijkse vakantie-uitkeringen
      van de uitkeringsgerechtigde voor 1/12 deel per maand op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: '28.3'
    text: |-
      Met inkomsten uit tegenwoordige arbeid worden gelijkgesteld uitkeringen op grond van de [Ziektewet][ref1]
      en de [Werkloosheidswet][ref2], alsmede de daarmede vergelijkbare uitkeringen welke worden verleend aan het
      overheidspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
  - number: 28.4.a
    text: |-
      De inkomsten uit vermogen, bedoeld in het eerste lid, onder c, worden berekend naar het vermogen dat de
      uitkeringsgerechtigde en zijn echtgenoot op het tijdstip van de aanvraag, bedoeld in [artikel 35][ref1], bezitten.
      Deze inkomsten worden jaarlijks bepaald op een percentage van dat vermogen dat gelijk is aan het forfaitaire
      rendementspercentage, genoemd in [artikel 5.2 van de Wet inkomstenbelasting 2001][ref2]. Van het aldus berekende
      bedrag wordt een bedrag vrijgelaten, waarvan de hoogte door Onze Minister wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 28.4.b
    text: |-
      Indien na het tijdstip van de aanvraag aan de uitkeringsgerechtigde en zijn echtgenoot vermogensbestanddelen
      toevallen, wordt voor de berekening van de inkomsten uit vermogen, het vermogen met ingang van de datum waarop die
      vermogensbestanddelen zijn toegevallen, opnieuw vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: 28.4.c
    text: |-
      Wijziging van het vermogen, anders dan bedoeld onder b, geeft geen aanleiding tot herziening van de overeenkomstig
      dit lid onder a en b vastgestelde inkomsten, tenzij het vermogen, door oorzaken gelegen in factoren waarop
      de uitkeringsgerechtigde generlei invloed heeft kunnen uitoefenen, zodanig is verminderd, dat dit tot een
      klaarblijkelijke hardheid zou leiden. Bij de beoordeling hiervan wordt rekening gehouden met de totale vermogens-
      en inkomstenpositie van de uitkeringsgerechtigde en zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: '28.5'
    text: |-
      Bij bedrijfsbeëindiging vindt het bepaalde in het eerste lid, onder c, en het vierde lid, van dat tijdstip af
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: '28.6'
    text: |-
      Indien de echtgenoot van de uitkeringsgerechtigde eveneens recht heeft op enig pensioen als
      bedoeld in [artikel 23, derde lid][ref1], en op dat pensioen een vermindering is toegepast uit
      hoofde van recht op ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref2] van tenminste
      40% van het bedrag van het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref3], vermeerderd met 40% van de vakantie-
      uitkering, bedoeld in [artikel 29 van die wet][ref4], zijn het eerste tot en met vierde lid van
      toepassing, met dien verstande dat, in afwijking van het eerste lid, onder *b*, op schriftelijk verzoek
      van de uitkeringsgerechtigde 50% van het aan de uitkeringsgerechtigde en de echtgenoot toegekende bruto-
      ouderdomspensioen krachtens de [Algemene Ouderdomswet][ref5], met inbegrip van de vakantie-uitkering, bedoeld in
      [artikel 29 van die wet][ref6], op de uitkering in mindering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0002221
      [ref6]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0002221
      - id: ref6
        bwb_id: BWBR0002221
        artikel: '29'
  - number: '28.7'
    text: |-
      Indien de echtgenoot van de uitkeringsgerechtigde eveneens recht heeft op een uitkering ingevolge deze wet, zijn
      het eerste tot en met vijfde lid van toepassing, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: 28.7.a
    text: |-
      in afwijking van het eerste lid, onder c, de inkomsten uit vermogen van de uitkeringsgerechtigde en de echtgenoot
      bij ieder voor de helft in mindering worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: 28.7.b
    text: |-
      in afwijking van het in het vierde lid, onder a, laatste volzin, bedoelde bedrag, de helft daarvan wordt
      vrijgelaten.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel28
  - number: '29.1'
    text: |-
      Op de in enig kalenderjaar toegekende garantie-uitkering worden in mindering gebracht alle over de overeenkomstige
      periode genoten bruto-inkomsten, uit welken hoofde dan ook, van het burger-oorlogsslachtoffer en van diens
      echtgenoot of van degene met wie hij duurzaam samenleeft.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel29
  - number: '29.2'
    text: |-
      De inkomsten uit vermogen worden vastgesteld overeenkomstig het bepaalde in
      [artikel 28, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel28
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
  - number: '30.1'
    text: |-
      Op de in enig kalenderjaar toegekende uitkering, bedoeld in [artikel 18, eerste lid][ref1], vermeerderd met de
      toeslag bedoeld in [artikel 20][ref2], worden alle over de overeenkomstige periode genoten inkomsten van het
      burger-oorlogsslachtoffer en van diens echtgenoot in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel20
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
  - number: '30.2'
    text: |-
      De inkomsten uit vermogen worden vastgesteld overeenkomstig het bepaalde in
      [artikel 28, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel28
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
  - number: '31.1'
    text: 'Tot de inkomsten, bedoeld in deze paragraaf, worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel31
  - number: 31.1.a
    text: kinderbijslag uit welken hoofde of onder welke benaming ook;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel31
  - number: 31.1.b
    text: |-
      doelgerichte subsidies of tegemoetkomingen, waaronder begrepen de vermeerdering, bedoeld in de
      [artikelen 10][ref1] en [11 van de Wet buitengewoon pensioen 1940-1945][ref2], de [artikelen 9][ref3]
      en [10 van de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref4] en de [artikelen 12][ref5],
      [13][ref6] en [14 van de Wet buitengewoon pensioen Indisch verzet][ref7], voorzover deze de toeslag, bedoeld in
      [artikel 19][ref8], indien deze is toegekend, overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002035#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002035#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003968#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0003968#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0003968#Artikel14
      [ref8]: https://wetten.overheid.nl/BWBR0003664#Artikel19
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002032
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002032
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002035
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002035
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0003968
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0003968
        artikel: '13'
      - id: ref7
        bwb_id: BWBR0003968
        artikel: '14'
      - id: ref8
        bwb_id: BWBR0003664
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
  - number: '31.2'
    text: |-
      Onze Minister kan nadere regelen stellen met betrekking tot de vaststelling van de inkomsten uit of in verband met
      arbeid in beroep of bedrijf en de daarop drukkende verwervingskosten, de overige inkomsten alsmede met betrekking
      tot de vaststelling en de taxatie van het vermogen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel31
  - number: '32.1'
    text: |-
      Indien het burger-oorlogsslachtoffer wegens zijn invaliditeit, welke het gevolg is van het letsel, bedoeld in
      [artikel 2][ref1], geneeskundige behandeling of verpleging behoeft, worden de daaraan verbonden ten laste van het
      burger-oorlogsslachtoffer blijvende noodzakelijke kosten volledig vergoed, tenzij het vierde lid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '32.2'
    text: |-
      De extra, ten laste van het burger-oorlogsslachtoffer blijvende, kosten voor noodzakelijke voorzieningen, die
      direct verband houden met de in het eerste lid bedoelde geneeskundige behandeling of verpleging worden eveneens
      volledig vergoed.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel32
  - number: '32.3'
    text: |-
      Een volledige vergoeding wordt tevens verleend in het geval dat een geneeskundige behandeling of verpleging kan
      bijdragen tot voorkoming van het verergeren van de invaliditeit, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel32
  - number: '32.4'
    text: |-
      Indien de in het eerste lid bedoelde kosten betrekking hebben op verpleging of verzorging van een alleenstaande
      of een echtpaar in een daartoe bestemde inrichting en niet worden betaald met toepassing van een der sociale
      verzekeringswetten, worden deze kosten vergoed voor zover de inkomsten daartoe ontoereikend zijn. Van de
      inkomsten blijft buiten beschouwing een bedrag ter grootte van de met toepassing van het bepaalde in de
      [artikelen 18, eerste lid][ref1], en [20, eerste en tweede lid][ref2], vastgestelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel20
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '18'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
  - number: '32.5'
    text: |-
      Een vergoeding ter zake van de kosten, bedoeld in het eerste tot en met vierde lid, wordt slechts verleend voor
      zover deze niet ten laste kunnen worden gebracht van een zorgverzekering ingevolge de [Zorgverzekeringswet][ref1]
      of een andere ziektekostenverzekering of ten laste daarvan zouden kunnen worden gebracht indien een zodanige
      verzekering is of zou zijn gesloten. De Raad kan van de eerste volzin afwijken, indien, gezien de individuele
      omstandigheden van de aanvrager, naar het oordeel van de Raad daartoe gegronde redenen aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '32.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de aard, de duur en de
      wijze van verstrekking van de voorzieningen bedoeld in de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel32
  - number: '33.1'
    text: |-
      In de ten laste van het burger-oorlogsslachtoffer blijvende kosten van voorzieningen verband houdende met zijn
      invaliditeit, welke het gevolg is van het letsel, bedoeld in [artikel 2][ref1], welke voorzieningen strekken tot
      verbetering van diens levensomstandigheden, kan een tegemoetkoming worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '33.2'
    text: |-
      De tegemoetkoming heeft ten hoogste betrekking op de in het eerste lid bedoelde kosten in zover deze, met
      inachtneming van de totale financiële omstandigheden van het burger-oorlogsslachtoffer, als bijzondere kosten
      moeten worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel33
  - number: '33.3'
    text: |-
      De tegemoetkoming in de bijzondere kosten, bedoeld in het tweede lid, wordt bepaald met inachtneming van de
      financiële draagkracht van het burger-oorlogsslachtoffer.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel33
  - number: '33.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gesteld met betrekking tot de bepaling van de financiële
      draagkracht van het burger-oorlogsslachtoffer alsmede zo nodig met betrekking tot de aard, de duur en de wijze van
      verstrekking van de voorzieningen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel33
  - number: 33a.1
    text: |-
      In afwijking van het eerste lid van de [artikelen 32][ref1] en [33][ref2] kan aan categorieën burger-
      oorlogsslachtoffers in de kosten van bepaalde voorzieningen een vergoeding of tegemoetkoming worden verleend zonder
      dat het in die artikelleden bedoelde verband is vereist. Bij algemene maatregel van bestuur worden ter zake regels
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel33
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '32'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '33'
        hoofdstuk: II
        paragraaf: '8'
  - number: 33a.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld betreffende de mogelijkheid om een vergoeding of
      tegemoetkoming in de kosten van bepaalde voorzieningen als bedoeld in de [artikelen 32][ref1] en [33][ref2] na
      het overlijden van het burger-oorlogsslachtoffer gedurende een bepaalde tijd ten gunste van de weduwe of weduwnaar
      voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel33
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '32'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '33'
        hoofdstuk: II
        paragraaf: '8'
  - number: '34.1'
    text: |-
      Degene, die verwacht te eniger tijd aanspraken te kunnen ontlenen aan deze wet, kan bij de Raad
      een aanvraag indienen om erkenning dat de aanvrager is getroffen door oorlogsgeweld als bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '34.2'
    text: |-
      Het bepaalde in de [artikelen 35][ref1] tot en met [39][ref2] is, voor zover ter zake van belang, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel39a
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: 39a
        hoofdstuk: II
        paragraaf: '10'
  - number: '35.1'
    text: |-
      De beoordeling van de aanspraken op een uitkering, toeslag, vergoeding of tegemoetkoming geschiedt naar aanleiding
      van een daartoe bij de Raad ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel35
  - number: '35.2'
    text: |-
      De Raad kent geen uitkering, toeslag, vergoeding of tegemoetkoming toe dan nadat is vastgesteld dat het door de
      aanvrager opgegeven adres overeenstemt met het hem betreffende adresgegeven in de gemeentelijke basisadministratie.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel35
  - number: '35.3'
    text: |-
      De Raad kan het tweede lid buiten toepassing laten of daarvan afwijken voorzover toepassing gelet op het belang dat
      deze wet beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel35
  - number: '35.4'
    text: Op de aanvraag wordt de datum van ontvangst aangetekend.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel35
  - number: '35.5'
    text: |-
      De ontvangst van de aanvraag wordt de aanvrager schriftelijk bevestigd. Daarbij wordt hem voorlichting gegeven over
      de verdere procedure en de geldende behandeltermijnen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel35
  - number: '35.6'
    text: Onze Minister kan nadere regelen stellen met betrekking tot de bij de aanvraag over te leggen bescheiden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel35
  - number: '36.1'
    text: |-
      Alvorens op een aanvraag wordt beslist, wordt een rapport opgesteld omtrent de aard en de gevolgen van de
      oorlogscalamiteit en de levensomstandigheden van de betrokkene vóór, tijdens en na de oorlogsjaren 1940-1945.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel36
  - number: '36.2'
    text: |-
      Voor zover nodig wordt, alvorens op een aanvraag wordt beslist, een rapport opgesteld omtrent de financiële
      omstandigheden van de betrokkene. Dit rapport bevat in ieder geval gegevens, welke noodzakelijk zijn voor het
      vaststellen van de grondslag bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '36.3'
    text: |-
      Naar keuze van de belanghebbende worden de in het eerste en tweede lid bedoelde rapporten opgesteld door de
      Stichting Pelita of de Raad dan wel, in overeenstemming met de belanghebbende, door een andere door de Raad aan te
      wijzen instelling of instantie.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel36
  - number: '36.4'
    text: |-
      Het rapport wordt opgesteld binnen zes weken nadat de opdracht daartoe bij een instantie als bedoeld in het
      derde lid is ingekomen, met dien verstande dat het rapport binnen vier weken wordt opgesteld, indien de aanvraag
      betrekking heeft op een vergoeding of een tegemoetkoming. Indien die instantie niet tijdig in het opstellen van
      de rapporten voorziet kan de Raad, met instemming van de betrokkene, besluiten op andere wijze informatie omtrent
      de aard en de gevolgen van de oorlogscalamiteit, de levensomstandigheden van de betrokkene vóór, tijdens en na de
      oorlogsjaren 1940-1945, en de financiële omstandigheden van de betrokkene in te winnen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel36
  - number: '36.5'
    text: |-
      De Raad geeft aanwijzingen omtrent de inhoud en samenstelling van de in het eerste en tweede lid bedoelde
      rapporten.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel36
  - number: '36.6'
    text: |-
      Indien een aanvraag betrekking heeft op een vergoeding of tegemoetkoming behoeft het in het eerste lid bedoelde
      rapport slechts te worden opgesteld indien de Raad dat nodig acht.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel36
  - number: '37.1'
    text: |-
      Voor zover de aanvraag, bedoeld in [artikel 35][ref1], is ingediend door of namens een burger-oorlogsslachtoffer,
      wordt door de geneeskundig adviseur een medisch rapport opgesteld. Hij vermeldt daarin voor zover nodig zijn
      bevindingen over:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
  - number: 37.1.a
    text: |-
      de invaliditeit van het burger-oorlogsslachtoffer en het in [artikel 2][ref1] bedoelde causaal verband;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: 37.1.b
    text: de relatie tussen de invaliditeit en het vermogen om een inkomen te verwerven;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
  - number: 37.1.c
    text: de in artikel 17 bedoelde graad van onvermogen om een inkomen te verwerven en
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
  - number: 37.1.d
    text: |-
      de noodzaak van bijzondere voorzieningen bedoeld in [paragraaf 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003664
        hoofdstuk: II
        paragraaf: '8'
  - number: '37.2'
    text: |-
      Het medisch rapport wordt niet opgesteld dan nadat de geneeskundig adviseur heeft kunnen kennisnemen van het
      rapport, bedoeld in [artikel 36, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel36
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '36'
        hoofdstuk: II
        paragraaf: '10'
  - number: '37.3'
    text: |-
      Voor zover de aanvraag, bedoeld in [artikel 35][ref1], is ingediend door de weduwe, weduwnaar of minderjarige volle
      wees van het burger-oorlogsslachtoffer, wordt door de in het eerste lid bedoelde geneeskundig adviseur onderzocht
      of het overlijden van het burger-oorlogsslachtoffer het gevolg was van het letsel, bedoeld in [artikel 2][ref2],
      dan wel of de uit dit letsel ontstane invaliditeit hem nadelig beïnvloedde in zijn vermogen een inkomen te
      verwerven door arbeid in beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel2
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '35'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '2'
        hoofdstuk: I
  - number: '37.4'
    text: |-
      Indien een aanvraag betrekking heeft op een vergoeding of tegemoetkoming behoeft het in het eerste lid bedoelde
      rapport slechts te worden opgesteld indien de Raad dat nodig acht.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
  - number: '37.5'
    text: |-
      De aanvrager is gehouden medewerking te verlenen aan een medisch onderzoek indien de Raad zulks noodzakelijk
      oordeelt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
  - number: '37.6'
    text: |-
      Indien de aanvrager niet voldoet aan het bepaalde in het vijfde lid, wijst de Raad de aanvraag af of herziet de
      Raad de eerder gegeven beschikking in het nadeel van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel37
  - number: '38.1'
    text: |-
      Bij de bekendmaking van de beschikking wordt voorlichting gegeven over de procedure en de voor het bezwaarschrift
      geldende termijn van behandeling.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel38
  - number: '38.2'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 7, onder ][ref1], [artikel 8][ref2] of [artikel 19][ref3],
      voorzover de aanvrager niet reeds op grond van [artikel 34][ref4] is erkend, [artikel 7, onder ][ref5], voor zover
      de overledene geen aanspraken op deze wet heeft doen gelden, de [artikelen 32][ref6] en [33][ref7], voorzover de
      aanvrager niet reeds eerder aanspraken op deze wet heeft doen gelden, wordt gegeven binnen zeven maanden na de
      datum waarop de aanvraag bij de Raad is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden niet
      binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste acht weken worden verlengd. Van de verlenging
      doet de Raad schriftelijk mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0003664#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0003664#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0003664#Artikel33
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003664
        artikel: '34'
        hoofdstuk: II
        paragraaf: '9'
      - id: ref5
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0003664
        artikel: '32'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref7
        bwb_id: BWBR0003664
        artikel: '33'
        hoofdstuk: II
        paragraaf: '8'
  - number: '38.3'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 34][ref1] wordt gegeven binnen vier maanden na de datum waarop
      de aanvraag bij de Raad is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden niet binnen deze
      termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad
      schriftelijk mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel34
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '34'
        hoofdstuk: II
        paragraaf: '9'
  - number: '38.4'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 7, onder ][ref1], [artikel 8][ref2] of [artikel 19][ref3],
      voorzover de aanvrager reeds op grond van [artikel 34][ref4] is erkend, [artikel 7, onder ][ref5], voor zover
      de overledene aanspraken op deze wet heeft doen gelden, of de [artikelen 32][ref6] of [33][ref7], voorzover de
      aanvrager reeds eerder aanspraken op deze wet heeft doen gelden, wordt gegeven binnen dertien weken na de datum
      waarop de aanvraag bij de Raad is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden niet binnen
      deze termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de
      Raad schriftelijk mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0003664#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0003664#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0003664#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0003664#Artikel33
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003664
        artikel: '34'
        hoofdstuk: II
        paragraaf: '9'
      - id: ref5
        bwb_id: BWBR0003664
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0003664
        artikel: '32'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref7
        bwb_id: BWBR0003664
        artikel: '33'
        hoofdstuk: II
        paragraaf: '8'
  - number: '38.5'
    text: |-
      Met betrekking tot een aanvraag, bedoeld in het vierde lid, die wordt ingediend terwijl een aanvraag, bedoeld
      in het tweede lid, nog in behandeling is geldt, in afwijking van het vierde lid, de termijn die resteert voor
      de beschikking op de aanvraag, bedoeld in het tweede lid, tenzij de resterende termijn korter is dan de termijn,
      bedoeld in het het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel38
  - number: '39.1'
    text: |-
      Indien de Raad vier weken voor het verstrijken van de verlengde termijn, bedoeld in [artikel 38, tweede lid][ref1],
      onvoldoende gegevens aanwezig acht om tot een beoordeling van de aanvraag te komen en dientengevolge niet in staat
      is een beschikking te geven, stelt hij de aanvrager gedurende die vier weken in de gelegenheid zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel38
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '38'
        hoofdstuk: II
        paragraaf: '10'
  - number: '39.2'
    text: |-
      [Artikel 4:9 van de Algemene wet bestuursrecht][ref1] is op het horen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '39.3'
    text: Indien de aanvrager zijn zienswijze mondeling naar voren brengt, wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel39
  - number: 39a.1
    text: |-
      Indien de aanvrager kennis wenst te nemen van gegevens welke mede tot een beschikking van de Raad kunnen leiden dan
      wel hebben geleid, worden deze hem op zijn verzoek door de Raad verstrekt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel39a
  - number: 39a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vergoeding welke verschuldigd is,
      indien afschrift wordt verstrekt van de op de beschikking betrekking hebbende bescheiden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel39a
  - number: '40.1'
    text: 'De uitkering, de toeslag, de vergoeding en tegemoetkoming gaan in:'
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel40
  - number: 40.1.a
    text: |-
      op de eerste dag van de maand waarin de aanvraag daartoe is ingediend, tenzij het bepaalde onder *b* van toepassing
      is;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel40
  - number: 40.1.b
    text: |-
      voor de weduwe, weduwnaar of minderjarige volle wees, die aansluitend aan het overlijden van het burger-
      oorlogsslachtoffer, dat een uitkering ingevolge deze wet genoot, aanspraak op een uitkering maakt, op de eerste dag
      van de derde maand volgend op die, waarin het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel40
  - number: '40.2'
    text: |-
      De Raad kan bij beschikking van het bepaalde in het eerste lid in het voordeel van de betrokkene afwijken, indien
      hij, rekening houdende met alle omstandigheden, een dergelijke afwijking in een individueel geval noodzakelijk
      acht. Onze Minister stelt te dien aanzien nadere regelen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel40
  - number: '41.1'
    text: |-
      De periodieke uitkering alsmede de garantie-uitkering, bedoeld in [artikel 8][ref1], wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel8
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 41.1.a
    text: |-
      bij het overlijden van de uitkeringsgerechtigde die een echtgenoot of minderjarige kinderen achterlaat: met ingang
      van de eerste dag van de derde maand volgend op die, waarin het overlijden heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
  - number: 41.1.b
    text: |-
      bij het overlijden van de uitkeringsgerechtigde die geen echtgenoot of minderjarige kinderen achterlaat: met ingang
      van de eerste dag van de maand volgend op die, waarin het overlijden heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
  - number: 41.1.c
    text: |-
      bij huwelijk, daaronder mede begrepen de in [artikel 2][ref1], bedoelde situatie, van de weduwe of de weduwnaar,
      die niet als burger-oorlogsslachtoffer recht heeft op een uitkering ingevolge deze wet, met ingang van de eerste
      dag van de maand, volgend op die, waarin daarvan sprake is;


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: 2a
        hoofdstuk: I
  - number: 41.1.d
    text: |-
      bij het bereiken van de leeftijd van 21 jaar, tenzij [artikel 15, derde lid, onder ][ref1], van toepassing is, of
      bij het aangaan van een huwelijk door de volle wees vóór het bereiken van die leeftijd, daaronder mede begrepen de
      in [artikel 2][ref2], bedoelde situatie, met ingang van de eerste dag van de maand volgend op die, waarin de volle
      wees de leeftijd van 21 jaar bereikt heeft, onderscheidenlijk het huwelijk heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: 2a
        hoofdstuk: I
  - number: '41.2'
    text: |-
      De toeslag, de vergoeding en tegemoetkoming worden beëindigd bij het overlijden van het burger-oorlogsslachtoffer
      met ingang van de eerste dag van de maand volgend op die waarin het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
  - number: '41.3'
    text: |-
      De uitkering die op grond van [artikel 41, eerste lid onder ][ref1], werd beëindigd, wordt opnieuw verleend indien
      het huwelijk is ontbonden of het aangaan van een andere vorm van duurzaam samenleven is beëindigd. In dat geval
      gaat de uitkering in op de eerste dag van de maand waarin de hernieuwde aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel41
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '41'
        hoofdstuk: II
        paragraaf: '11'
  - number: '42.1'
    text: |-
      De uitkeringsgerechtigde, die is veroordeeld tot een vrijheidsstraf van drie maanden, tot plaatsing in een
      Rijkswerkinrichting of tot enige zwaardere straf, of op bevel van de rechter ter beschikking van de Regering is
      gesteld, mist over de tijd gedurende welke hij zijn straf ondergaat of van regeringswege in zijn verpleging wordt
      voorzien, of gedurende welke hij zich door de vlucht aan de tenuitvoerlegging van het vonnis onttrekt, het genot
      van de uitkering.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel42
  - number: '42.2'
    text: |-
      De Raad is bevoegd het uitkeringsbedrag over die tijd geheel of ten dele aan of ten behoeve van de echtgenoot of
      minderjarige kinderen van de uitkeringsgerechtigde uit te betalen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel42
  - number: '42.3'
    text: |-
      De Raad is tevens bevoegd om, voor zover van de bevoegdheid in het tweede lid bedoeld, geen gebruik is gemaakt, de
      uitkeringsgerechtigde die al of niet voorwaardelijk uit de gevangenis of uit de Rijkswerkinrichting is ontslagen,
      of wiens verpleging van regeringswege is beëindigd, in het genot te stellen van een uitkering, ten bedrage van
      ten hoogste de helft van het niet uitgekeerde bedrag, tot een maximum van de helft van het jaarlijkse bedrag van
      de uitkering.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel42
  - number: '43'
    text: |-
      Van alle rechten op grond van het bij of krachtens deze wet bepaalde wordt terstond vervallen verklaard het burger-
      oorlogsslachtoffer of diens nabestaande, indien zij de Nederlandse nationaliteit verliezen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel43
  - number: '44.1'
    text: |-
      De belanghebbende is gehouden aanspraken op wettelijke voorzieningen geldend te maken, welke kunnen leiden tot een
      vermindering van de aanspraken op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel44
  - number: '44.2'
    text: |-
      Indien de belanghebbende niet voldoet aan het bepaalde in het eerste lid, kan bij de vaststelling van de uitkering,
      toeslag, vergoeding en tegemoetkoming rekening worden gehouden met de in het eerste lid bedoelde aanspraken.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel44
  - number: 44a.1
    text: |-
      De uitkeringen, toeslagen, vergoedingen of tegemoetkomingen worden zo spoedig mogelijk, doch uiterlijk binnen
      dertien weken na de toekenning, betaald.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel44a
  - number: 44a.2
    text: |-
      Indien de betaling niet binnen dertien weken plaatsvindt, is de Raad de belanghebbende rente verschuldigd. De wijze
      waarop het bedrag van de verschuldigde rente wordt bepaald, wordt bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel44a
  - number: 44a.3
    text: |-
      Indien de door belanghebbende verstrekte gegevens en bescheiden onvoldoende zijn voor het vaststellen van het
      bedrag van de uitkering, vergoeding of tegemoetkoming, verzoekt de Raad de belanghebbende deze gegevens en
      bescheiden alsnog te verstrekken. De periode van dertien weken, bedoeld in het eerste en tweede lid, wordt in
      zodanig geval opgeschort met ingang van de dag waarop de Raad vorenbedoeld verzoek heeft gedaan tot de dag waarop
      de gegevens en bescheiden zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel44a
  - number: '45.1'
    text: |-
      De uitkering, de toeslagen, bedoeld in de [artikelen 19][ref1] tot en met [23][ref2], de vergoeding en de
      tegemoetkoming zijn niet vatbaar voor vervreemding of verpanding.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel23
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
  - number: '45.2'
    text: |-
      De toeslagen, bedoeld in de[ artikelen 19][ref1] en [22][ref2], de vergoeding en de tegemoetkoming, alsmede de op
      grond van onderdeel *a* van [artikel 41, eerste lid][ref3], na overlijden doorlopende uitkering zijn niet vatbaar
      voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel41
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '22'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '41'
        hoofdstuk: II
        paragraaf: '11'
  - number: '45.3'
    text: |-
      Volmacht tot ontvangst van de uitkering, toeslag, vergoeding en tegemoetkoming, in welke vorm of onder welke
      benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel45
  - number: '45.4'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel45
  - number: '49.1'
    text: |-
      De belanghebbende is verplicht desgevraagd aan de Raad alle inlichtingen te verstrekken die hij voor het
      vaststellen of het bestendigen van het recht van een burger-oorlogsslachtoffer of diens nabestaanden op een
      uitkering, toeslag, vergoeding of tegemoetkoming noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel49
  - number: '49.2'
    text: |-
      Indien de belanghebbende niet voldoet aan het bepaalde in het eerste lid, wijst de Raad de aanvraag af, dan wel
      herziet hij de eerder gegeven beschikking in het nadeel van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel49
  - number: '50.1'
    text: |-
      De belanghebbende is verplicht desgevraagd aan de Raad die gegevens te verstrekken, welke voor de uitvoering van de
      beschikkingen van die Raad noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel50
  - number: '50.2'
    text: |-
      Zolang de belanghebbende niet voldoet aan het bepaalde in het eerste lid, wordt de beschikking niet uitgevoerd of
      wordt de uitvoering ervan geschorst. De Raad doet hem hiervan mededeling.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel50
  - number: '50.3'
    text: |-
      Indien de belanghebbende eerst na twee jaar, nadat het recht op een uitkering, een vergoeding of een tegemoetkoming
      is vastgesteld de in het tweede lid bedoelde gegevens verstrekt, beslist de Raad of, gelet op alle omstandigheden,
      de in de beschikking genoemde ingangsdatum kan worden gehandhaafd. Zo nodig stelt de Raad, in afwijking van het
      bepaalde in [artikel 40, eerste lid][ref1], een nieuwe ingangsdatum vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel40
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '40'
        hoofdstuk: II
        paragraaf: '11'
  - number: '50.4'
    text: |-
      Indien de belanghebbende eerst na twee jaar, nadat de uitvoering van de beschikking werd geschorst, de in het
      eerste lid bedoelde gegevens verstrekt, beslist de Raad, rekening houdende met alle omstandigheden, of en zo ja
      in hoeverre, de uitvoering van deze beschikking, voor zover deze betrekking heeft op de periode gedurende welke de
      uitvoering van de beschikking was geschorst, alsnog kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel50
  - number: '51.1'
    text: |-
      De belanghebbende, diens wettelijke vertegenwoordiger en de persoon aan wie de uitkering, toeslag, vergoeding
      of tegemoetkoming wordt uitbetaald, zijn gehouden onverwijld aan de Raad mededeling te doen van alle feiten en
      omstandigheden, die tot intrekking of verlaging van de uitkering, toeslag, vergoeding of tegemoetkoming aanleiding
      zouden kunnen geven.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel51
  - number: '51.2'
    text: |-
      Het bepaalde in [artikel 50, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel50
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '50'
        hoofdstuk: IV
  - number: '52.1'
    text: |-
      Alle ambtenaren, tot afgifte van uittreksels uit registers van de burgerlijke stand bevoegd, zijn gehouden aan de
      Raad de door hem gevraagde uittreksels uit de registers kosteloos te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel52
  - number: '52.2'
    text: |-
      De gemeentebesturen zijn gehouden aan de Raad de door hem gevraagde inlichtingen uit de basisadministratie
      persoonsgegevens kosteloos te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel52
  - number: '53.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 49][ref1], [50][ref2] en [51][ref3], doet de belanghebbende aan wie een
      uitkering of tegemoetkoming wordt uitbetaald, al dan niet door tussenkomst van zijn wettelijke vertegenwoordiger,
      jaarlijks op een door de Raad te bepalen tijdstip en wijze, opgave van alle door hem in het voorafgaande
      kalenderjaar, anders dan uit vermogen genoten inkomsten, en indien zulks door de Raad wordt verlangd, van de hoogte
      en samenstelling van zijn vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel51
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '49'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '50'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '51'
        hoofdstuk: IV
  - number: '53.2'
    text: |-
      De Raad kan, voor zover zulks naar zijn oordeel nodig is, de financiële gegevens, die bij een aanvraag om een
      uitkering of tegemoetkoming zijn overgelegd, alsmede die welke op grond van het eerste lid zijn verstrekt, ter
      controle aan de Belastingdienst voorleggen. De Raad is gehouden de belanghebbende van deze mogelijkheid in kennis
      te stellen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel53
  - number: '54'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het bezwaarschrift dertien weken, indien de belanghebbende in het buitenland gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '55.1'
    text: |-
      [Artikel 39][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel39a
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: 39a
        hoofdstuk: II
        paragraaf: '10'
  - number: '55.2'
    text: |-
      In afwijking van [artikel 7:10, eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref1] beslist
      de Raad binnen dertien weken na ontvangst van het bezwaarschrift. Ingeval van bijzondere omstandigheden kan deze
      termijn eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad schriftelijk mededeling
      aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '55.3'
    text: |-
      Indien de belanghebbende in het buitenland gevestigd is, worden de termijnen, bedoeld in het tweede lid, ieder met
      acht weken verlengd.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel55
  - number: '56.1'
    text: Tegen een besluit op grond van deze wet kan een belanghebbende beroep instellen bij de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel56
  - number: '56.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een beroepschrift dertien weken, indien de belanghebbende in het buitenland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '56.3'
    text: Het griffierecht bedraagt € 35.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel56
  - number: '59.1'
    text: |-
      Indien de beschikbare gegevens de definitieve vaststelling van de uitkering, toeslag, vergoeding of tegemoetkoming
      dan wel van de hoogte van de op de uitkering in mindering te brengen bedragen nog niet mogelijk maken, kan de Raad,
      in afwachting van toereikende gegevens, de uitkering, toeslag, vergoeding of tegemoetkoming dan wel de hoogte van
      de op de uitkering in mindering te brengen bedragen voorlopig vaststellen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel59
  - number: '59.2'
    text: |-
      Zodra de in het eerste lid bedoelde toereikende gegevens bekend zijn, herziet de Raad, indien nodig, zijn
      oorspronkelijke beschikking.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel59
  - number: '60.1'
    text: |-
      De administratieve uitwerking van een beschikking van de Raad in een berekeningsbeschikking draagt een voorlopig
      karakter.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel60
  - number: '60.2'
    text: |-
      In het kalenderjaar, volgend op het jaar, waarin de in het eerste lid bedoelde berekeningsbeschikking is afgegeven,
      wordt deze definitief vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel60
  - number: '60.3'
    text: |-
      Indien de definitieve vaststelling, bedoeld in het tweede lid, op grond van het ontbreken van de noodzakelijke
      gegevens niet binnen de aldaar genoemde termijn kan plaatsvinden, vindt deze plaats zodra bedoelde gegevens bekend
      zijn.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel60
  - number: '61.1'
    text: |-
      De Raad is bevoegd een eenmaal gegeven beschikking in het nadeel van betrokkene te herzien, indien hem alsnog
      blijkt of na kennisneming van enig feit, gegeven of omstandigheid op zich zelf of in samenhang met andere feiten,
      gegevens of omstandigheden, duidelijk wordt, dat de gronden waarop die beschikking was gebaseerd dermate onjuist
      of onvolledig waren, dat de beschikking op die gronden niet kan worden gehandhaafd en de bekend geworden feiten,
      gegevens of omstandigheden onvoldoende grond bieden om de oorspronkelijke beschikking te dragen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel61
  - number: '61.2'
    text: |-
      Indien, naar het oordeel van de Raad, door de herzieningsbeschikking het recht op elke voorziening van deze wet zal
      moeten worden ontzegd, stelt de Raad, alvorens tot herziening over te gaan, de betrokkene in de gelegenheid zijn
      zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel61
  - number: '61.3'
    text: |-
      De Raad is bevoegd, op daartoe door of vanwege de belanghebbende gedane aanvraag, een door die Raad of door de
      Centrale Raad van Beroep gegeven beschikking dan wel uitspraak in het voordeel van de bij die beschikking dan wel
      uitspraak betrokkene te herzien.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel61
  - number: '61.4'
    text: |-
      Op een beschikking, voortvloeiende uit de toepassing van het derde lid, is [paragraaf 10][ref1] van overeenkomstige
      toepassing, met uitzondering van [artikel 38, tweede, derde en vierde lid][ref2], en [artikel 39][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003664#Artikel39
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003664
        hoofdstuk: II
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '38'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0003664
        artikel: '39'
        hoofdstuk: II
        paragraaf: '10'
  - number: '62.1'
    text: |-
      Indien met terugwerkende kracht inkomsten worden ontvangen die, op grond van het bepaalde in de artikelen 28, 29
      en 30, op de uitkering in mindering zouden zijn gebracht, waren zij genoten in de periode waarop zij betrekking
      hebben, dan herziet de Raad zijn op die periode betrekking hebbende oorspronkelijke beschikking.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel62
  - number: '62.2'
    text: |-
      Indien de inkomsten, bedoeld in het eerste lid, zouden leiden tot een hogere financiële draagkracht, bedoeld
      in [artikel 33][ref1], wordt deze draagkracht over de periode waarop die inkomsten betrekking hebben opnieuw
      vastgesteld. Het bepaalde in de vorige volzin is van overeenkomstige toepassing, indien de grondslag, bedoeld in
      [artikel 10][ref2], met terugwerkende kracht op een hoger bedrag wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel10
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '33'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '62.3'
    text: |-
      Indien met terugwerkende kracht een voorziening wordt getroffen voor hetzelfde doel als waarvoor reeds ingevolge
      deze wet een vergoeding of tegemoetkoming werd verleend, herziet de Raad zijn oorspronkelijke beschikking.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel62
  - number: '63'
    text: |-
      Indien een ingevolge deze wet gegeven beschikking in het nadeel van betrokkene wordt herzien, wordt hetgeen te veel
      was uitbetaald, niet teruggevorderd of verrekend, tenzij:
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel63
  - number: 63.a
    text: |-
      de herziening betrekking heeft op een beschikking die een voorlopig karakter droeg als bedoeld in de
      [artikelen 59][ref1] en [60][ref2], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel60
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '59'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '60'
        hoofdstuk: VI
  - number: 63.b
    text: |-
      toepassing is gegeven aan het bepaalde in [artikel 62][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel62
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '62'
        hoofdstuk: VII
  - number: 63.c
    text: |-
      in de herzieningsbeschikking gemotiveerd is aangegeven dat van de feiten, gegevens en omstandigheden, bedoeld
      in [artikel 61, eerste lid][ref1], niet kon worden kennisgenomen als gevolg van opzet of grove nalatigheid van
      betrokkene, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel61
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '61'
        hoofdstuk: VII
  - number: 63.d
    text: betrokkene redelijkerwijs had moeten begrijpen dat hem te veel werd uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel63
  - number: '64'
    text: |-
      Indien aan de uitkeringsgerechtigde, in afwachting van de toekenning van een uitkering, vergoeding of
      tegemoetkoming ingevolge deze wet, door burgemeester en wethouders een uitkering is verleend ingevolge de
      [Wet werk en bijstand][ref1], wordt de uitkering, vergoeding of tegemoetkoming ingevolge deze wet verminderd met
      de kosten van bijstand welke voor overeenkomstige voorzieningen zijn gemaakt over dezelfde periode waarover de
      uitkering, vergoeding of tegemoetkoming wordt verleend, terwijl de som welke in mindering wordt gebracht, wordt
      uitbetaald aan de betrokken gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '67'
    text: |-
      De Rijksgroepsregeling Oorlogsslachtoffers 1940-1945 en de krachtens dat besluit vastgestelde regelen worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel67
  - number: '68.1'
    text: |-
      Degene, die in een periode liggende tussen de datum tot welke deze wet terugwerkt en de datum van het in werking
      treden van deze wet in het genot was van een periodieke of bijzondere uitkering krachtens de Rijksgroepsregeling
      Oorlogsslachtoffers 1940-1945, wordt geacht over die periode een periodieke uitkering, vergoeding of tegemoetkoming
      op grond van deze wet te hebben genoten.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel68
  - number: '68.2'
    text: |-
      Degene, die op de datum van het in werking treden van deze wet een periodieke of bijzondere uitkering ontvangt
      krachtens de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945, wordt geacht met ingang van die datum een
      periodieke uitkering, vergoeding of tegemoetkoming op grond van deze wet te genieten, tenzij het recht op deze
      periodieke of bijzondere uitkering was toegekend in strijd met de bepalingen van genoemde regeling.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel68
  - number: '68.3'
    text: |-
      Een bedrag dat op grond van [artikel XXX van de Wet houdende nadere wijziging van de Wet minimumloon en
      minimumvakantiebijslag](onbekend), een aantal sociale verzekeringswetten en enige andere wetten (herziening
      aanpassingsmechanismen en vaststelling regelen hoogte sociale minimum) (*Stb.* 1979, 711) in de periode liggende
      tussen de datum tot welke deze wet terugwerkt en de datum van in werking treden van deze wet is ingehouden op een
      periodieke of bijzondere uitkering krachtens de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945, wordt geacht te
      zijn ingehouden op grond van [artikel 26][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel26
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '26'
        hoofdstuk: II
        paragraaf: '6'
  - number: '69.1'
    text: |-
      Indien de persoon, bedoeld in artikel 68, in het genot is van een periodieke uitkering wordt de grondslag,
      waarnaar zijn uitkering wordt berekend, door de Raad ambtshalve en zo nodig met ingang van 1 juli 1981 vastgesteld
      overeenkomstig de bepalingen van deze wet, met dien verstande dat, indien de aanvraag om een periodieke uitkering
      is ingediend vóór 1 juli 1981, laatstgenoemde datum als datum van de aanvraag wordt aangemerkt. Indien de
      aldus vastgestelde grondslag minder bedraagt dan het inkomen, bedoeld in artikel 3 van de Rijksgroepsregeling
      Oorlogsslachtoffers 1940-1945, waarnaar de uitkering op gelijke datum werd of zou zijn berekend, wordt de grondslag
      vastgesteld op het bedrag van bedoeld inkomen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel69
  - number: '69.2'
    text: |-
      Indien ten aanzien van de persoon, bedoeld in [artikel 68][ref1], is gebleken, dat hij in verband met het bepaalde
      in [artikel 5][ref2] geen aanspraken aan deze wet kan ontlenen, wordt de grondslag, waarnaar zijn uitkering
      wordt berekend, vastgesteld op het bedrag van het inkomen, bedoeld in artikel 3 van de Rijksgroepsregeling
      Oorlogsslachtoffers 1940-1945, zoals dat geldt op de datum van in werking treden van deze wet. Het bepaalde in het
      eerste lid is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel5
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '68'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '5'
        hoofdstuk: I
  - number: '69.3'
    text: |-
      Bij de vaststelling van de grondslagen, bedoeld in het eerste lid, zijn de herzieningen van de grondslagen en
      bedragen, bedoeld in [artikel 18 van de Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref1], zoals deze sinds
      1 juli 1981 hebben plaatsgevonden, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel18
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '18'
  - number: '70.1'
    text: |-
      Aan de persoon bedoeld in [artikel 69, eerste lid][ref1], wordt een uitkering toegekend met ingang van de datum,
      waarop hij recht op een uitkering had, doch niet eerder dan 1 juli 1981, berekend volgens de bepalingen van
      paragraaf 3 tot en met paragraaf 7 van [hoofdstuk II][ref2]. Op deze uitkering wordt in mindering gebracht hetgeen
      betrokkene op grond van de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945 vanaf bedoelde datum heeft genoten of
      zou hebben genoten indien hij op die datum een aanvraag om een periodieke uitkering zou hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0003664#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '69'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003664
        hoofdstuk: II
  - number: '70.2'
    text: |-
      De uitkering van de persoon, bedoeld in [artikel 69, tweede lid][ref1], wordt met ingang van de datum van in
      werking treden van deze wet berekend volgens de bepalingen van paragraaf 3 tot en met 7 van hoofdstuk II. Het
      bepaalde in het eerste lid is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel69
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '69'
        hoofdstuk: X
  - number: '70.3'
    text: |-
      Aan de persoon die binnen drie maanden na de datum van het in werking treden van deze wet een aanvraag indient
      om een uitkering wordt, indien hij ingevolge deze wet recht op deze uitkering kan doen gelden, met ingang van de
      datum waarop hij dit recht verkreeg, doch niet eerder dan 1 juli 1981, een uitkering toegekend, berekend volgens
      de bepalingen van paragraaf 2 tot en met 7 van hoofdstuk II. Op deze uitkering wordt in mindering gebracht
      hetgeen hij vanaf bedoelde datum tot de datum van zijn aanvraag heeft genoten of zou hebben genoten ingevolge de
      Rijksgroepsregeling Oorlogsslachtoffers 1940-1945, indien hij op eerstbedoelde datum een aanvraag om een periodieke
      uitkering op grond van die regeling zou hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel70
  - number: '70.4'
    text: |-
      Onder uitkering bedoeld in het eerste, tweede en derde lid wordt verstaan de periodieke uitkering, de garantie-
      uitkering en de toeslag, bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel19
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '19'
        hoofdstuk: II
        paragraaf: '4'
  - number: '71'
    text: |-
      Degene voor wie ingevolge het bepaalde in artikel 10 van de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945 een
      wachttijd was vastgesteld, welke op de datum van het in werking treden van deze wet nog niet is verstreken, wordt
      geacht op de datum van zijn aanvraag om een periodieke uitkering ingevolge genoemde regeling, doch niet eerder dan
      op 1 juli 1981 een aanvraag ingevolge deze wet te hebben ingediend, waarop door de Raad ambtshalve wordt beslist.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel71
  - number: '72'
    text: |-
      Indien degene voor wie ingevolge artikel 10 van de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945 een wachttijd
      was vastgesteld, welke op de datum tot welke deze wet terugwerkt nog niet was verstreken, een aanvraag om een
      periodieke uitkering heeft ingediend ingevolge genoemde regeling vóór genoemde datum, wordt bij de vaststelling
      van de inkomsten uit vermogen bedoeld in [artikel 28, vierde lid][ref1], uitgegaan van het vermogen waarmee bij
      de vaststelling van de wachttijd was rekening gehouden, verminderd met het vermogen dat geacht kan worden reeds
      te zijn ingeteerd op die datum en vermeerderd met vermogensbestanddelen die de betrokkene en zijn echtgenoot zijn
      toegevallen na de datum waarop de wachttijd was vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel28
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
  - number: '73.1'
    text: |-
      Op de ten tijde van het in werking treden van deze wet bij burgemeester en wethouders van de gemeente, alwaar een
      aanvraag om een periodieke of bijzondere uitkering ingevolge de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945
      is ingediend dan wel aan welke de aanvraag is doorgezonden, in behandeling zijnde aanvragen en bezwaarschriften
      waarop nog niet is beslist, wordt een beslissing genomen door de Raad.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel73
  - number: '73.2'
    text: |-
      Voor zover de aanvragen en bezwaarschriften betrekking hebben op een periode liggende vóór de datum tot welke
      deze wet terugwerkt, wordt door de Raad met betrekking tot die periode een beslissing genomen op de voet van de
      bepalingen van de hoofdstukken I en II van de ingetrokken Rijksgroepsregeling Oorlogsslachtoffers 1940-1945.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel73
  - number: '75.1'
    text: |-
      Met betrekking tot beslissingen op grond van de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945, die op het
      tijdstip van het in werking treden van deze wet nog niet in kracht van gewijsde zijn gegaan, kan uiterlijk binnen
      een maand na bedoeld tijdstip een bezwaarschrift worden ingediend bij de Raad.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel75
  - number: '75.2'
    text: |-
      Het bepaalde in [artikel 73, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel73
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '73'
        hoofdstuk: X
  - number: '76'
    text: |-
      De in [artikel 64][ref1] bedoelde uitbetaling aan de betrokken gemeente blijft achterwege in de gevallen waarin
      bijstand is verleend op grond van de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel64
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '64'
        hoofdstuk: VIII
  - number: '78'
    text: In het belang van een goede uitvoering van deze wet kan Onze Minister nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel78
  - number: '83'
    text: Deze wet kan worden aangehaald als Wet uitkeringen burger-oorlogsslachtoffers 1940-1945.
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel83
  - number: '84'
    text: |-
      Deze wet treedt in werking op de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst en
      werkt, met uitzondering van [artikel 82][ref1], terug tot 1 juli 1981.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel82
    url: https://wetten.overheid.nl/BWBR0003664/2008-02-22#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003664
        artikel: '82'
        hoofdstuk: X
