        bwb_id: BWBR0014439
  - number: '2'
    text: |-
      1 Nadat de betrokkene buitengewoon verlof is verleend met behoud van bezoldiging besluit de Minister van Veiligheid
      en Justitie tot beschikbaarstelling.

      De bezoldiging tijdens het buitengewoon verlof wordt berekend naar een arbeidstijd van gemiddeld 38 uur per week,
      tenzij in het desbetreffende kalenderjaar een langere gemiddelde arbeidstijd geldt voor de betrokkene. In dat geval
      blijft de bezoldiging ongewijzigd.

      2 Tot beschikbaarstelling wordt niet besloten dan nadat uit een medische keuring maar ook anderszins is gebleken
      dat de betrokkene geschikt is om te worden uitgezonden in het kader van de missie.

      3 De kosten van de medische keuring en de overige medische kosten voorafgaand aan en verband houdend met de
      uitzending komen ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel2
  - number: '3'
    text: |-
      Het Rijk vergoedt aan de desbetreffende politieregio de werkgeverslasten ten aanzien van de betrokkene en de
      overige aan deze regeling verbonden kosten, voor zover deze worden voldaan door de politieregio.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel3
  - number: '4'
    text: |-
      1 De kosten die de betrokkene ondervindt in relatie tot het volgen van de opleiding ten behoeve van de deelname aan
      de missie worden vergoed.

      2 Voor het overige is voor de duur van de opleiding de politierechtspositie van de betrokkene van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel4
  - number: '5'
    text: |-
      1 De aanspraak van de betrokkene op de overige voorzieningen ingevolge deze regeling vangt aan op de dag van
      vertrek vanuit Nederland naar het missiegebied.

      2 De aanspraak van de betrokkene op voorzieningen ingevolge deze regeling eindigt op de dag van terugkeer in
      Nederland vanuit het missiegebied, behoudens de periode van recuperatie, bedoeld in [artikel 10][ref1], en
      behoudens de aanspraken, bedoeld in de [artikelen 11][ref2], [16][ref3] en [17][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014687#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014687#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014687#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0014687#Artikel17
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel5
