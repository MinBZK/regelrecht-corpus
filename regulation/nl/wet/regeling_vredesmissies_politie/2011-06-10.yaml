preamble:
  text: |-
    Gelet op artikel 3 van het Besluit beschikbaarstelling politieambtenaren ten behoeve van vredesmissies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Besluit:* het [Besluit beschikbaarstelling politieambtenaren ten behoeve van vredesmissies][ref1];

      b. *operationeel gezag:* de head of mission, aangewezen door een volkenrechtelijke organisatie of aangewezen in het
      kader van een internationale overeenkomst waarbij Nederland partij is;

      c. *missie:* het verblijf in het missiegebied ten behoeve van het verrichten van werkzaamheden in het kader van de
      uitzending, bedoeld in het [Besluit][ref2];

      d. *inzet:* het daadwerkelijk verrichten van werkzaamheden in het kader van de uitzending, bedoeld in het
      [Besluit][ref3];

      e. *onkosten:* de tijdens de missie door de betrokkene gedane uitgaven wegens bewassing, (tele)communicatie,
      ontspanning, recuperatie en overige incidentele kosten;

      f. *recuperatie:* een periode, niet zijnde verlof, waarin aan de betrokkene geen feitelijke werkzaamheden worden
      opgedragen, opdat door afwisseling van inzet en rust de gewenste operationele inzetbaarheid wordt gehandhaafd;

      g. *inschepingsverlof:* het verlof dat betrokkene wordt toegekend om zich voor te bereiden op de missie;

      h. *ontschepingsverlof:* het verlof dat betrokkene wordt toegekend na afloop van de uitzending.


      [ref1]: https://wetten.overheid.nl/BWBR0014439
      [ref2]: https://wetten.overheid.nl/BWBR0014439
      [ref3]: https://wetten.overheid.nl/BWBR0014439
