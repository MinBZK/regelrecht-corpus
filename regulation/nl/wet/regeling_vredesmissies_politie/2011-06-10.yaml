  - number: '6'
    text: |-
      De werk- en rusttijden van de betrokkene worden door het operationeel gezag bepaald aan de hand van hetgeen in het
      belang van de dienst tijdens de missie noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel6
  - number: '7'
    text: |-
      Indien de betrokkene uit anderen hoofde aanspraak heeft op overeenkomstige voorzieningen als bedoeld in deze
      regeling, wordt de waarde van die aanspraak in mindering gebracht op de aanspraak ingevolge deze regeling tot ten
      hoogste het bedrag van de laatstgenoemde aanspraak.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel7
  - number: '8'
    text: |-
      1 De betrokkene heeft aanspraak op:

      a. huisvesting en voeding vanwege en voor rekening van het Rijk;

      b. een tegemoetkoming in de onkosten ten bedrage van € 27,21, indien geen aanspraak bestaat op een volledige
      dagvergoeding inclusief huisvesting, voeding en overige onkosten van derden.

      2 Indien om redenen verband houdend met de inzet, geen gebruik kan worden gemaakt van van Rijkswege verstrekte
      huisvesting of voeding en hierin ook niet door de volkenrechtelijke organisatie of de Europese Unie wordt voorzien,
      worden de noodzakelijk gemaakte kosten van huisvesting en voeding vergoed tot ten hoogste de bedragen, bedoeld in
      [Bijlage I behorende bij het Besluit reis-, verblijf- en verhuiskosten politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024064
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024064
  - number: '9'
    text: |-
      De betrokkene heeft aanspraak op een vergoeding voor de bij de missie ondervonden onregelmatige diensten en
      overuren. De vergoeding is vastgesteld in de vorm van een afkoopsom, en bedraagt € 83,81 per dag.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel9
  - number: '10'
    text: |-
      1 Het operationeel gezag kan, indien operationele omstandigheden dat noodzakelijk en mogelijk maken, recuperatie
      verlenen.

      2 Recuperatie wordt slechts verleend aan de betrokkene die langdurig is ingezet onder operationele omstandigheden,
      teneinde de betrokkene een rustperiode te gunnen alvorens de inzet wordt voortgezet.

      3 Recuperatie kan geleid worden doorgebracht in of in de directe nabijheid van het missiegebied. Het operationeel
      gezag geeft aanwijzingen met betrekking tot de wijze van het doorbrengen daarvan. Ten behoeve van deze recuperatie
      worden zonodig vanwege het Rijk faciliteiten, in de vorm van vervoer, huisvesting en voeding, ter beschikking
      gesteld. Recuperatie kan voor rekening van het Rijk ook in Nederland worden doorgebracht.

      4 Op verzoek van de betrokkene kan het operationeel gezag, indien de uitzendduur tenminste zes maanden bedraagt,
      toestaan dat de recuperatie elders wordt doorgebracht. Deze recuperatie brengt de betrokkene alsdan door voor eigen
      risico en rekening. Er bestaat geen aanspraak op reis- en verblijfkosten. Voor de vaststelling van de duur van de
      recuperatie wordt per maand inzet 2,5 dag recuperatie opgebouwd.

      5 Indien na beëindiging van de deelname aan de missie blijkt dat sprake is geweest van onafgebroken inzet zonder
      dat de betrokkene de gelegenheid is geboden tussentijds te recupereren, heeft de betrokkene na definitieve
      terugkeer in Nederland aansluitend recht op extra vrije tijd. Deze extra vrije tijd bedraagt bij een inzet van
      zes achtereenvolgende maanden zes werkdagen. Bij een inzet van een andere duur wordt deze extra vrije tijd naar
      evenredigheid berekend.

      De uitzending, bedoeld in het [Besluit][ref1], wordt geacht te zijn verlengd met deze extra vrije tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0014439
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014439
  - number: 10a
    text: |-
      Naast de periode van de missie waarvoor buitengewoon verlof wordt verleend, bestaat een aanspraak op buitengewoon
      verlof tot een maximum van veertien dagen in de volgende gevallen:

      a. ernstige ziekte van de echtgenote of echtgenoot van de betrokkene, de persoon met wie de betrokkene ongehuwd
      samenwoont of een van zijn bloed- of aanverwanten in de eerste graad;

      b. de bevalling van zijn echtgenote of de persoon met wie de betrokkene ongehuwd samenwoont;

      c. het overlijden en de lijkbezorging van de echtgenote of echtgenoot van de betrokkene, de persoon met wie de
      betrokkene ongehuwd samenwoont of een van zijn bloed- en aanverwanten in de eerste graad.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel10a
  - number: '11'
    text: |-
      De betrokkene heeft aansluitend op de definitieve terugkeer uit het missiegebied recht op vrijstelling van zijn
      normale werkzaamheden en diensten gedurende tien werkdagen na een inzet met een duur van zes maanden. Bij een inzet
      van een andere duur wordt deze vrijstelling naar evenredigheid berekend. De uitzending, bedoeld in het Besluit,
      wordt geacht te zijn verlengd met deze periode.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel11
  - number: '12'
    text: |-
      1 Bij ernstige ziekte of overlijden van ouders, stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen,
      pleegkinderen, aangehuwde kinderen, de echtgenoot of echtgenote of de daarmee gelijkgestelde persoon, bedoeld
      in [artikel 1, tweede lid, van het Besluit algemene rechtspositie politie][ref1], wordt aan de betrokkene een
      vergoeding van reiskosten verleend tot maximaal de kosten voor een retourvlucht in beginsel op basis van de laagste
      klasse van vervoer vanuit het missiegebied naar Nederland.

      2 De vergoeding wordt verleend op een daartoe strekkend verzoek van de betrokkene en, indien het kosten betreft in
      verband met ernstige ziekte, voor zover de ernst daarvan kan worden afgeleid uit een verklaring van de behandelend
      arts.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 12a
    text: |-
      1 De betrokkene die naar verwachting ten minste zes maanden achtereen buiten Nederland zal verblijven, wordt
      inschepingsverlof verleend voor vijf werkdagen.

      2 Ten aanzien van de betrokkene die inschepingsverlof heeft genoten en die door eigen wil of toedoen zijn
      bestemming niet volgt, kan het operationeel gezag dat verlof aanmerken als verleend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel12a
  - number: 12b
    text: |-
      1 Betrokkene heeft na een verblijf buiten Nederland gedurende een maand of langer achtereen, aanspraak op
      ontschepingsverlof van een werkdag voor elke maand dat het verblijf buiten Nederland heeft geduurd, met een maximum
      van twintig werkdagen.

      2 Het ontschepingsverlof, bedoeld in het eerste lid, wordt aaneengesloten of in gedeelten aan betrokkene verleend
      zo spoedig mogelijk nadat hij in Nederland is teruggekeerd.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel12b
  - number: '13'
    text: |-
      1 De betrokkene is verplicht elk geval van ziekte of ongeval van hemzelf terstond ter kennis van de Minister van
      Veiligheid en Justitie te brengen, indien de ziekte of het ongeval van zodanige aard is dat hij naar verwachting
      langer dan een maand niet tot inzet in staat is.

      2 De Minister van Veiligheid en Justitie neemt maatregelen tot definitieve terugkeer naar Nederland van
      de betrokkene indien ten gevolge van de ziekte of het ongeval het verblijf in het missiegebied niet langer
      verantwoord, raadzaam of van nut is. Voor zover uit de genomen maatregelen kosten voortvloeien voor de betrokkene,
      komen deze kosten ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel13
  - number: '14'
    text: Indien de betrokkene tijdens de missie overlijdt, worden de kosten van lijkbezorging aan de nabestaanden vergoed.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel14
  - number: '15'
    text: |-
      1 De naaste betrekkingen van een betrokkene die vermist is geraakt tijdens de missie, komen in aanmerking voor
      bemiddeling vanwege het Ministerie van Veiligheid en Justitie bij het voeren van de procedure tot het verkrijgen
      van een verklaring, dat rechtsvermoeden van overlijden van de vermiste betrokkene bestaat.

      2 De naaste betrekkingen van een betrokkene als bedoeld in het vorige lid hebben, indien de procedure, bedoeld in
      dat lid, niet kosteloos kan worden gevoerd, aanspraak op vergoeding van de kosten die ter zake voor hun rekening
      zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel15
  - number: '16'
    text: |-
      1 In geval van invaliditeit die voortvloeit uit een ongeval tenzij de betrokkene bewust roekeloos heeft gehandeld
      of de betrokkene grof nalatig is geweest, of een beroepsziekte die is ontstaan tijdens de missie of de geleide
      recuperatieperiode, wordt aan de betrokkene smartengeld vergoed tot een netto maximum bedrag van € 136.100,-. De
      [Regeling smartengeld dienstongevallen politie][ref1] is van overeenkomstige toepassing.

      2 In geval de betrokkene is komen te overlijden ten gevolge van een ongeval als bedoeld in het eerste lid,
      wordt aan de weduwe of weduwnaar van wie de overleden betrokkene niet duurzaam gescheiden leefde of de daarmee
      gelijkgestelde persoon, bedoeld in [artikel 1, tweede lid, van het Besluit algemene rechtspositie politie][ref2],
      een netto bedrag van € 68.100,- uitgekeerd.

      3 [Artikel 46, derde en vierde lid, van het Besluit bezoldiging politie][ref3] is van overeenkomstige toepassing.

      4 In geval van een ongeval of beroepsziekte worden aan de betrokkene vergoed de noodzakelijk gemaakte kosten van
      geneeskundige behandeling en verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0022745
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel46
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel16
