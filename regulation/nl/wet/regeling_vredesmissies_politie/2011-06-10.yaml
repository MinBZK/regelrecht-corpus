  - number: 16a
    text: |-
      Indien een politieambtenaar, of indien deze is overleden de weduwe of weduwnaar van wie de
      overleden persoon niet duurzaam gescheiden leefde of de daarmee gelijkgestelde persoon, bedoeld in
      [artikel 1, tweede lid, van het Besluit algemene rechtspositie politie][ref1], schade lijdt doordat de
      levensverzekering die hij ten behoeve van een hypotheek heeft gesloten niet of niet geheel tot uitbetaling komt
      doordat de verzekeraar een molestclausule inroept, staat de Minister van Veiligheid en Justitie ervoor in dat deze
      schade wordt vergoed tot een maximum van 400.000 euro.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: '17'
    text: |-
      Indien de betrokkene tijdens of ten gevolge van de missie in rechte wordt betrokken, heeft hij aanspraak op
      tegemoetkoming in de kosten van rechtskundige hulp.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel17
  - number: '18'
    text: |-
      1 De betrokkene die voor een periode van meer dan 30 dagen wordt uitgezonden, ontvangt van Rijkswege een
      standaarduitrusting die is toegesneden op de omstandigheden in het missiegebied.

      2 Binnen 10 werkdagen na terugkeer in Nederland vanuit het missiegebied, retourneert de betrokkene de uitrusting.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel18
  - number: 18a
    text: |-
      1 Bij iedere vredesmissie waarbij politieambtenaren worden ingezet, bevordert de Minister van Veiligheid en
      Justitie dat voldoende rekening is gehouden met de volgende aspecten:

      a. de veiligheid van politieambtenaren direct voorafgaand aan, tijdens en direct na afloop van de missie;

      b. de bewapening en de regels met betrekking tot geweldgebruik tijdens de missie;

      c. de medische zorg voor politieambtenaren direct voorafgaand aan, tijdens en direct na afloop van de missie;

      d. de uitrusting, kleding en huisvesting tijdens de missie.

      2 Tevens bevordert de Minister van Veiligheid en Justitie dat voldoende rekening is gehouden met de wijze
      waarop wordt omgegaan met politieambtenaren die ervan verdacht worden tijdens de missie een tuchtrechtelijk of
      strafrechtelijk vergrijp te hebben begaan en de wijze waarop civielrechtelijke aansprakelijkheid is geregeld.

      3 De Minister van Veiligheid en Justitie brengt de omstandigheden, bedoeld in het eerste en tweede lid, onverwijld
      ter kennis van de politievakorganisaties zodra deze hem ter kennis zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel18a
  - number: '19'
    text: |-
      De Minister van Veiligheid en Justitie beslist in de gevallen waarin deze regeling niet of niet in redelijkheid
      voorziet.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel19
  - number: '20'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 20 december 2002.
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling vredesmissies politie.'
    url: https://wetten.overheid.nl/BWBR0014687/2011-06-10#Artikel21
