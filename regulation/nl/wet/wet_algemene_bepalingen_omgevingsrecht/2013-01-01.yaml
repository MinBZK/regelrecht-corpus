      categorie activiteiten die van invloed kunnen zijn op de fysieke leefomgeving.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot hetgeen wordt verstaan
      onder de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat met betrekking tot daarbij aangewezen activiteiten als
      bedoeld in het eerste lid in daarbij aangegeven categorieën gevallen, het in dat lid gestelde verbod niet geldt.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
