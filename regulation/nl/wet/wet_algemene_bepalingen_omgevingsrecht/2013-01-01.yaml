  - number: 3.7.2
    text: |-
      In afwijking van het eerste lid is deze paragraaf tevens van toepassing op de voorbereiding van een besluit als
      bedoeld in [artikel 3.10, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.7
