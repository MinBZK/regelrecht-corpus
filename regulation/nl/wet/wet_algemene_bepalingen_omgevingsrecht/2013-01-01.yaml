  - number: 5.2.1
    text: 'Het bevoegd gezag heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
  - number: 5.2.1.a
    text: |-
      zorg te dragen voor de bestuursrechtelijke handhaving van de op grond van het bepaalde bij of krachtens de
      betrokken wetten voor degene die het betrokken project uitvoert, geldende voorschriften;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
  - number: 5.2.1.b
    text: |-
      gegevens die met het oog op de uitoefening van de taak als bedoeld onder a van belang zijn, te verzamelen en te
      registreren;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
  - number: 5.2.1.c
    text: |-
      klachten te behandelen die betrekking hebben op de naleving van het bepaalde bij of krachtens de betrokken wetten
      met betrekking tot het uitvoeren van het betrokken project.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Indien met betrekking tot het uitvoeren van het betrokken project door het bevoegd gezag een beschikking
      tot oplegging van een last onder bestuursdwang, oplegging van een last onder dwangsom of intrekking van een
      vergunning op grond van [artikel 5.19][ref1] is gegeven en, nadat die beschikking is gegeven, als gevolg van een
      verandering van het betrokken project een ander bestuursorgaan bevoegd wordt de vergunning te verlenen, blijft het
      bestuursorgaan dat de beschikking heeft gegeven, bevoegd met betrekking tot die beschikking totdat zij


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.2.2.a
    text: onherroepelijk is geworden en is tenuitvoergelegd, of de dwangsom is ingevorderd, of
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
  - number: 5.2.2.b
    text: |-
      is ingetrokken, of de bij de beschikking opgelegde last onder dwangsom overeenkomstig
      [artikel 5:34 van de Algemene wet bestuursrecht][ref1] is opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.2.3
    text: |-
      Bij het uitoefenen van de taak, bedoeld in het eerste lid, houdt het bevoegd gezag, voorzover er sprake is van een
      activiteit met betrekking tot een inrichting of mijnbouwwerk, rekening met het voor hem geldende milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
  - number: 5.2.4
    text: |-
      In bij wet of algemene maatregel van bestuur aangewezen categorieën gevallen heeft tevens het bestuursorgaan
      dat bevoegd is een verklaring te geven als bedoeld in [artikel 2.27, eerste lid][ref1], tot taak zorg te dragen
      voor de bestuursrechtelijke handhaving, bedoeld in het eerste lid, onder a. Deze taak blijft beperkt tot de
      activiteiten van het project waarvoor de verklaring is vereist. Op het uitoefenen van deze taak is het derde lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 5.2a.1
    text: |-
      Voor zover dit hoofdstuk bij of krachtens een in [artikel 5.1][ref1] genoemde wet van toepassing is, en een
      orgaan van een waterschap een bij of krachtens dit hoofdstuk gevorderde beslissing niet of niet naar behoren
      neemt dan wel een bij of krachtens dit hoofdstuk gevorderde handeling niet of niet naar behoren verricht, zijn de
      [artikelen 121 tot en met 121g van de Provinciewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '121'
  - number: 5.2a.2
    text: |-
      In afwijking van het eerste lid zijn, voor zover [§ 5.2][ref1] bij of krachtens een in [artikel 5.1][ref2]
      genoemde wet van toepassing is en een orgaan van een waterschap een bij of krachtens § 5.2 gevorderde beslissing
      niet of niet naar behoren neemt dan wel een bij of krachtens § 5.2 gevorderde handeling niet of niet naar behoren
      verricht, zijn de [artikelen 124][ref3], [124a][ref4] en [124c tot en met 124i van de Gemeentewet][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel124a
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel124c
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '124'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 124a
      - id: ref5
        bwb_id: BWBR0005416
        artikel: 124c
  - number: 5.2a.3
    text: |-
      [Hoofdstuk XVIII van de Provinciewet][ref1] is van overeenkomstige toepassing ten aanzien van door een orgaan van
      een waterschap bij of krachtens dit hoofdstuk genomen besluiten en niet-schriftelijke beslissingen, gericht op
      enig rechtsgevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XVIII
  - number: 5.2a.4
    text: |-
      In afwijking van het derde lid is [hoofdstuk XVII van de Gemeentewet][ref1] van overeenkomstige toepassing
      ten aanzien van door een orgaan van een waterschap bij of krachtens [§ 5.2][ref2] genomen besluiten en niet-
      schriftelijke beslissingen, gericht op enig rechtsgevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXVII
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XVII
      - id: ref2
        bwb_id: BWBR0024779
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.3.1
    text: |-
      Bij algemene maatregel van bestuur worden in het belang van een doelmatige handhaving regels gesteld. De maatregel
      bevat geen regels met betrekking tot activiteiten als bedoeld in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.3.2
    text: |-
      Bij de maatregel worden in ieder geval regels gesteld met betrekking tot een strategische, programmatische en
      onderling afgestemde uitoefening van de handhavingsbevoegdheden door de bestuursorganen die belast zijn met de
      bestuursrechtelijke handhaving van het bepaalde bij of krachtens de betrokken wetten en van het toezicht op de
      naleving door de onder hun gezag werkzame toezichthouders.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.3
  - number: 5.3.3
    text: |-
      Bij de maatregel kunnen regels worden gesteld met betrekking tot de afstemming van de werkzaamheden van de
      bestuursorganen en toezichthouders, bedoeld in het tweede lid, op die van andere organen en ambtenaren die belast
      zijn met de handhaving van het bepaalde bij of krachtens de betrokken wetten.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.3
  - number: 5.3.4
    text: |-
      Bij regeling van Onze Minister kunnen, in overeenstemming met Onze betrokken Minister, nadere regels worden gesteld
      met betrekking tot het bepaalde bij de maatregel.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      Gedeputeerde staten dragen zorg voor de coördinatie van de uitvoering van het bepaalde krachtens
      [artikel 5.3][ref1] in de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5.1
    text: |-
      Ter uitvoering van [artikel 5.4][ref1] wordt in iedere provincie regelmatig overleg gevoerd tussen de
      bestuursorganen die belast zijn met de handhaving van het bepaalde bij of krachtens de betrokken wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5.2
    text: |-
      Gedeputeerde staten stellen voor dat overleg een of meer overlegorganen in. Aan het overleg kunnen, op uitnodiging,
      andere organen en ambtenaren, die belast zijn met de handhaving van het bepaalde bij of krachtens de betrokken
      wetten, deelnemen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      In dat overleg maken die bestuursorganen in ieder geval afspraken over de wijze waarop zij uitvoering zullen geven
      aan het bepaalde krachtens [artikel 5.3][ref1] en aan [artikel 5.4][ref2] en over de voorzieningen die zij voor die
      uitvoering zullen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '5.6'
    text: |-
      Onze Minister draagt zorg voor de coördinatie van de uitvoering van het bepaalde krachtens [artikel 5.3][ref1],
      voorzover die coördinatie naar zijn oordeel van meer dan provinciaal belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.8.1
    text: |-
      Gedeputeerde staten kunnen, indien zij hebben vastgesteld dat een behoorlijke uitvoering van het bepaalde krachtens
      [artikel 5.3][ref1] in de provincie onvoldoende gewaarborgd is, gemeenten of waterschappen aanwijzen waarvan
      burgemeester en wethouders, onderscheidenlijk de dagelijkse besturen een gemeenschappelijke regeling moeten treffen
      als bedoeld in de [Wet gemeenschappelijke regelingen][ref2], ter behartiging van het belang van een doelmatige
      handhaving. [Artikel 99, eerste lid, van die wet][ref3] is niet van toepassing. Een waterschap wordt niet
      aangewezen dan nadat Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister heeft verklaard
      dat hij daartegen geen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003740
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0003740
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '99'
  - number: 5.8.2
    text: |-
      Gedeputeerde staten houden bij een aanwijzing rekening met de regio’s die overeenkomstig de [bijlage, behorend bij
      de Wet veiligheidsregio’s](onbekend), zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
  - number: 5.8.3
    text: |-
      Gedeputeerde staten kunnen te allen tijde bepalen dat de provincie deelneemt aan een regeling. Indien een aan
      te wijzen waterschap in meer dan een provincie ligt, geschiedt de aanwijzing in overeenstemming met gedeputeerde
      staten van de betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
  - number: 5.8.4
    text: |-
      Bij de regeling wordt een openbaar lichaam als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1] ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: 5.8.5
    text: |-
      Bij de regeling worden door de deelnemende gemeenten of waterschappen aan het bestuur van het openbaar lichaam ten
      minste de volgende taken opgedragen:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
  - number: 5.8.5.a
    text: |-
      het houden van toezicht op de naleving van het bepaalde bij of krachtens de betrokken wetten, het verzamelen en
      registreren van gegevens, bedoeld in [artikel 5.2, eerste lid, onder b][ref1], en het behandelen van klachten,
      bedoeld in dat artikellid, onder c, en


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.8.5.b
    text: |-
      het voorbereiden en het uitvoeren van door burgemeester en wethouders van een deelnemende gemeente of van door
      het dagelijks bestuur van een deelnemend waterschap te geven, of gegeven beschikkingen tot oplegging van een last
      onder bestuursdwang, oplegging van een last onder dwangsom of intrekking van een vergunning of ontheffing op grond
      van [artikel 5.19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.8.6
    text: |-
      Gedeputeerde staten doen van het besluit, houdende de aanwijzing, mededeling door overlegging van het besluit aan
      Onze betrokken Minister en aan provinciale staten en door plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.8
  - number: 5.10.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde, zijn belast de bij besluit van
      Onze betrokken Minister aangewezen ambtenaren. Ambtenaren, ressorterende onder een ander dan zijn ministerie, wijst
      hij niet aan dan in overeenstemming met Onze Minister onder wiens ministerie zij ressorteren.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Voor de krachtens het eerste lid aangewezen ambtenaren, ressorterende onder een ander ministerie dan dat van Onze
      betrokken Minister, worden regels betreffende de vervulling van hun in het eerste lid bedoelde taak niet gesteld
      dan in overeenstemming met Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.10
  - number: 5.10.3
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde binnen hun ambtsgebied zijn
      eveneens belast de bij besluit van gedeputeerde staten, burgemeester en wethouders of andere met de uitvoering van
      de betrokken wet belaste bestuursorganen aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.10
  - number: 5.10.4
    text: |-
      Bij een besluit als bedoeld in het eerste lid kan Onze betrokken Minister gevallen of categorieën gevallen
      aanwijzen met betrekking waartoe, in afwijking van het derde lid bij zijn besluit aangewezen ambtenaren uitsluitend
      belast zijn met het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.10
  - number: 5.10.5
    text: |-
      Van een besluit als bedoeld in het eerste en vierde lid, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.10
  - number: 5.12.1
    text: |-
      Met de opsporing van de bij of krachtens de betrokken wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de in [artikel 5.10][ref2] bedoelde ambtenaren,
      voor zover zij bij besluit van Onze Minister van Veiligheid en Justitie daartoe zijn aangewezen. Deze ambtenaren
      zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref3]
      en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 5.12.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.12
  - number: '5.13'
    text: |-
      De ambtenaren die zijn belast met het toezicht op de naleving of de opsporing van strafbaar gestelde feiten ter
      zake van het bepaalde bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
  - number: 5.13.a
    text: 'deze wet met betrekking tot activiteiten als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
  - number: 5.13.a.1°
    text: |-
      [artikel 2.1, eerste lid, onder a, b, c, d, e][ref1], voorzover deze betrekking hebben op gevaarlijke afvalstoffen,
      f, g en h,


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13.a.2°
    text: |-
      [artikel 2.1, eerste lid, onder i][ref1], voor zover dat bij de betrokken algemene maatregel van bestuur is
      bepaald, en


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13.a.3°
    text: |-
      [artikel 2.2][ref1], voor zover dat bij de betrokken verordening is bepaald,


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.13.b
    text: |-
      de [Monumentenwet 1988][ref1],

      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 5.13.c
    text: |-
      de [Wet milieubeheer][ref1], ten aanzien van gevaarlijke afvalstoffen,


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 5.13.d
    text: |-
      de [Wet ruimtelijke ordening][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 5.13.e
    text: |-
      de [hoofdstukken I tot en met IV van de Woningwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005181#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        hoofdstuk: I
  - number: '5.14'
    text: |-
      Het bestuursorgaan dat bevoegd is tot bestuursrechtelijke handhaving is bevoegd tot oplegging van een last onder
      bestuursdwang ter handhaving van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], voor zover
      het betreft de verplichting tot het verlenen van medewerking aan de krachtens [artikel 5.10][ref2] aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.15'
    text: |-
      Onze betrokken Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde
      bij of krachtens de betrokken wet in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.15
  - number: 5.15.a
    text: hem de zorg voor de bestuursrechtelijke handhaving daarvan is opgedragen, of
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.15
  - number: 5.15.b
    text: geen ander bestuursorgaan daartoe bevoegd is.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.15
  - number: '5.16'
    text: |-
      Het bestuursorgaan dat een beschikking tot oplegging van een last onder bestuursdwang of oplegging van een last
      onder dwangsom heeft gegeven terzake van overtreding van het bepaalde waarvoor bij of krachtens de betrokken wetten
      ook andere organen bevoegd zijn tot bestuursrechtelijke handhaving, zendt die organen onverwijld een exemplaar van
      die beschikking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.16
  - number: '5.17'
    text: |-
      Een besluit tot oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom gericht op
      naleving van het bepaalde bij of krachtens de betrokken wet kan inhouden dat het bouwen, gebruiken of slopen van
      een bouwwerk wordt gestaakt of dat voorzieningen, met inbegrip van het slopen van een bouwwerk, gericht op het
      tegengaan of beëindigen van gevaar voor de gezondheid of de veiligheid worden getroffen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.17
  - number: '5.18'
    text: |-
      Bij een besluit tot oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom gericht
      op naleving van het bepaalde bij of krachtens de betrokken wet kan het bestuursorgaan dat het besluit heeft
      genomen bepalen dat het besluit mede geldt jegens de rechtsopvolger van degene aan wie het besluit is opgelegd
      alsmede jegens iedere verdere rechtsopvolger. In dat geval kan het besluit, tenzij bijzondere omstandigheden
      zich daartegen naar het oordeel van dat bestuursorgaan verzetten, jegens die rechtsopvolger of iedere verdere
      rechtsopvolger worden ten uitvoer gelegd en kunnen de kosten van die tenuitvoerlegging en een te innen dwangsom bij
      die rechtsopvolger of verdere rechtsopvolger worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.18
  - number: 5.19.1
    text: |-
      Het bestuursorgaan dat bevoegd is een vergunning of ontheffing te verlenen, kan de vergunning of ontheffing geheel
      of gedeeltelijk intrekken, indien:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.1.a
    text: de vergunning of ontheffing ten gevolge van een onjuiste of onvolledige opgave is verleend;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.1.b
    text: niet overeenkomstig de vergunning of ontheffing is of wordt gehandeld;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.1.c
    text: de aan de vergunning of ontheffing verbonden voorschriften of beperkingen niet zijn of worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.1.d
    text: |-
      de voor de houder van de vergunning of ontheffing als zodanig geldende algemene regels niet zijn of worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.2
    text: |-
      Een vergunning of ontheffing, die betrekking heeft op het beheer van gevaarlijke afvalstoffen, of van andere
      afvalstoffen die van elders afkomstig zijn, kan, voor zover zij het beheer van afvalstoffen betreft, tevens worden
      ingetrokken, indien op grond van [hoofdstuk 10 van de Wet milieubeheer][ref1] voor de houder geldende voorschriften
      niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 5.19.3
    text: |-
      Een bestuursorgaan gaat niet tot intrekking als bedoeld in het eerste of tweede lid over dan nadat het
      de betrokkene de gelegenheid heeft geboden binnen een daartoe te bepalen termijn zijn handelen alsnog in
      overeenstemming te brengen met de vergunning of ontheffing, onderscheidenlijk de voorschriften of algemene regels,
      bedoeld in het eerste of tweede lid, na te leven.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.4
    text: 'Het bevoegd gezag kan de omgevingsvergunning tevens geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
  - number: 5.19.4.a
    text: |-
      in gevallen als bedoeld in [artikel 2.25, derde lid][ref1], indien het project niet overeenkomstig het krachtens
      dat artikellid bepaalde wordt uitgevoerd door een ander dan degene aan wie de vergunning is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 5.19.4.b
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1];
      [artikel 2.20, tweede lid][ref2], is in dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 5.20.1
    text: |-
      Een bestuursorgaan dat bij de totstandkoming van de vergunning of ontheffing bevoegd was een verklaring als bedoeld
      in [artikel 2.27, eerste lid][ref1], te geven of advies uit te brengen kan een bestuursorgaan dat op grond van
      dit hoofdstuk bevoegd is tot oplegging van een last onder bestuursdwang, oplegging van een last onder dwangsom of
      intrekking van een vergunning of ontheffing, verzoeken een daartoe strekkende beschikking te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 5.20.2
    text: |-
      In gevallen waarin vanuit een inrichting of mijnbouwwerk afvalwater of andere afvalstoffen in een voorziening voor
      de inzameling en het transport van afvalwater worden gebracht tengevolge waarvan:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.20
  - number: 5.20.2.a
    text: |-
      de doelmatige werking van het zuiveringtechnisch werk, bedoeld in [artikel 1.1, eerste lid, van de Waterwet][ref1]
      wordt belemmerd, of


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
  - number: 5.20.2.b
    text: |-
      de bij een algemene maatregel van bestuur als bedoeld in [artikel 5.1 van de Wet milieubeheer][ref1] ter uitvoering
      van een EU-richtlijn of EU-verordening gestelde milieukwaliteitseisen voor oppervlaktewaterlichamen worden
      overschreden,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 5.21.1
    text: |-
      Indien meer dan een bestuursorgaan bevoegd is tot bestuursrechtelijke handhaving geeft het bestuursorgaan waarbij
      een verzoek tot oplegging van een last onder bestuursdwang, oplegging van een last onder dwangsom of intrekking van
      een vergunning of ontheffing is ingediend, een beschikking op het verzoek.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: 5.21.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: 5.21.2.a
    text: |-
      een ander bestuursorgaan dat eveneens bevoegd is tot handhaving, schriftelijk heeft verklaard het verzoek in
      behandeling te willen nemen, en
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: 5.21.2.b
    text: |-
      het bestuursorgaan waarbij het verzoek tot oplegging van een last onder bestuursdwang is ingediend, het verzoek
      binnen twee weken na de datum waarop het is ontvangen, heeft doorgezonden aan dat andere bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: 5.21.3
    text: 'In een geval als bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: 5.21.3.a
    text: |-
      deelt het bestuursorgaan waarbij het verzoek is ingediend, onverwijld aan de afzender mede dat zijn verzoek is
      doorgezonden;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: 5.21.3.b
    text: geeft het bestuursorgaan waaraan het verzoek is doorgezonden, een beschikking op het verzoek.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.21
  - number: '5.22'
    text: |-
      Indien het verzoek wordt ingewilligd, voegt het bestuursorgaan bij de bekendmaking van de beschikking aan de
      verzoeker een exemplaar van de beschikking tot oplegging van een last onder bestuursdwang, oplegging van een last
      onder dwangsom of intrekking van de vergunning of ontheffing.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.22
  - number: '5.23'
    text: |-
      Het bestuursorgaan zendt een exemplaar van de beschikking tot oplegging van een last onder bestuursdwang, tot
      oplegging van een last onder dwangsom of tot intrekking van zodanige beschikkingen of van de beschikking tot
      intrekking van een vergunning of ontheffing aan de inspecteur en de andere bij of krachtens [artikel 2.26][ref1]
      aangewezen adviseurs.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 5.26.1
    text: |-
      Een overheidslichaam kan – behoudens matiging door de rechter – de te zijnen laste komende kosten van het
      beheer van afvalstoffen ten aanzien waarvan in strijd is gehandeld met het bij of krachtens deze wet of de
      [Wet milieubeheer][ref1] bepaalde, verhalen op degene door wiens onrechtmatige daad die kosten zijn veroorzaakt, of
      op degene die anderszins krachtens burgerlijk recht buiten overeenkomst aansprakelijk is voor de gevolgen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 5.26.2
    text: |-
      Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      afvalstoffen ongerechtvaardigd wordt verrijkt.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.26
  - number: 5.26.3
    text: |-
      Voor de toepassing van dit artikel is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde afvalstoffen zich heeft voorgedaan, al jegens de overheid onrechtmatig werd
      gehandeld.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.26
  - number: 6.1.1
    text: Een beschikking krachtens deze wet treedt in werking met ingang van de dag na haar bekendmaking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
  - number: 6.1.2
    text: |-
      In afwijking van het eerste lid treedt een beschikking in werking met ingang van de dag na afloop van de termijn,
      bedoeld in [artikel 6:7 van de Algemene wet bestuursrecht][ref1], voor het indienen van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 6.1.2.a
    text: |-
      een bezwaarschrift indien het een omgevingsvergunning betreft met betrekking tot een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, f, g of h][ref1], of [2.2, eerste lid, onder b, c of g][ref2], of een wijziging
      van voorschriften van een omgevingsvergunning die betrekking hebben op een activiteit als hiervoor bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 6.1.2.b
    text: |-
      een beroepschrift in gevallen waarin zij is voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 6.1.3
    text: |-
      Indien in gevallen als bedoeld in het tweede lid, gedurende de daar bedoelde termijn bij de bevoegde rechter
      een verzoek om voorlopige voorziening is gedaan, treedt de beschikking niet in werking voordat op dat verzoek is
      beslist.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
  - number: 6.1.4
    text: |-
      In afwijking van het eerste lid wordt de werking van een overeenkomstig [artikel 3.9, derde lid][ref1], van
      rechtswege verleende vergunning opgeschort totdat de termijn voor het indienen van een bezwaarschrift, bedoeld in
      [artikel 6:7 van de Algemene wet bestuursrecht][ref2], is verstreken of, indien bezwaar is gemaakt, op dit bezwaar
      is beslist. De vergunninghouder kan de voorzieningenrechter van de rechtbank verzoeken de opschorting op te heffen.
      [Titel 8.3 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
  - number: 6.1.5
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 2.1, eerste lid, onder i][ref1], of een verordening
      als bedoeld in [artikel 2.2, tweede lid][ref2], kan worden bepaald dat met betrekking tot daarbij aangewezen
      activiteiten het tweede en derde lid van overeenkomstige toepassing zijn in daarbij aangewezen categorieën
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '6.2'
    text: |-
      In gevallen waarin het onverwijld in werking treden van een beschikking als bedoeld in [artikel 6.1][ref1] naar
      het oordeel van het bevoegd gezag nodig is, kan het in afwijking van dat artikel bepalen dat zij terstond na haar
      bekendmaking in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2a
    text: |-
      Onverminderd [artikel 6.1][ref1] treedt een omgevingsvergunning met betrekking tot een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, g of h][ref2], indien voor die activiteit tevens een vergunning als bedoeld
      in [artikel 11, tweede lid, van de Monumentenwet 1988][ref3] is vereist, niet eerder in werking dan nadat die
      vergunning in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '11'
  - number: 6.2b
    text: |-
      Onverminderd [artikel 6.1][ref1] treedt een omgevingsvergunning met betrekking tot een activiteit
      als bedoeld in [artikel 2.1, eerste lid, onder a][ref2], indien die activiteit tevens is aan te
      merken als het oprichten of wijzigen van een inrichting waarvoor een vergunning als bedoeld in
      [artikel 15, aanhef en onderdeel b, van de Kernenergiewet][ref3] is vereist, niet eerder in werking dan nadat die
      vergunning in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2b
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 6.2c.1
    text: |-
      Onverminderd [artikel 6.1][ref1] treedt een omgevingsvergunning met betrekking tot een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder a][ref2], indien het te bouwen bouwwerk een bouwwerk betreft als bedoeld
      in [artikel 8, derde lid, van de Woningwet][ref3] en het bevoegd gezag op basis van het onderzoeksrapport,
      bedoeld in artikel 8, vierde lid, onderdeel c, van die wet, dan wel uit anderen hoofde een redelijk vermoeden
      heeft dat ter plaatse van het bouwwerk sprake is van een geval van ernstige verontreiniging als bedoeld in de
      [Wet bodembescherming][ref4], niet eerder in werking dan nadat:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003994
  - number: 6.2c.1.a
    text: |-
      op grond van [artikel 29, eerste lid][ref1], in samenhang met
      [artikel 37, eerste lid, van de Wet bodembescherming][ref2] is vastgesteld dat geen sprake is van een geval van
      ernstige verontreiniging ten aanzien waarvan spoedige sanering noodzakelijk is en het desbetreffende besluit in
      werking is getreden,


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel37
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2c
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '37'
  - number: 6.2c.1.b
    text: |-
      op grond van [artikel 39, tweede lid, van de Wet bodembescherming][ref1] met het saneringsplan, bedoeld in het
      eerste lid van dat artikel, is ingestemd en het desbetreffende besluit in werking is getreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2c
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '39'
  - number: 6.2c.1.c
    text: |-
      een melding van een voornemen tot sanering als bedoeld in
      [artikel 39b, derde lid, van de Wet bodembescherming][ref1] is gedaan en de bij of krachtens het vierde lid van dat
      artikel gestelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2c
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 39b
  - number: 6.2c.2
    text: |-
      Bij de omgevingsvergunning, bedoeld in het eerste lid, vermeldt het bevoegd gezag of het een vermoeden heeft als
      bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.2c
  - number: 6.3.1
    text: |-
      Indien een vergunning met toepassing van [artikel 2.5][ref1] in fasen wordt verleend, treden – in afwijking van
      de [artikelen 6.1][ref2] en [6.2a tot en met 6.2c][ref3] – de beschikkingen met betrekking tot de eerste en tweede
      fase op dezelfde dag in werking. Deze dag is de laatste van de dagen waarop de beschikkingen, met toepassing van de
      artikelen 6.1 en 6.2a tot en met 6.2c, elk afzonderlijk in werking zouden treden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.2
    text: |-
      In gevallen waarin de vergunning met toepassing van [artikel 2.5][ref1] in fasen wordt verleend en de beschikkingen
      in de eerste en de tweede fase tegelijkertijd in bezwaar of beroep aanhangig zijn, worden die beschikkingen voor de
      behandeling in bezwaar, onderscheidenlijk beroep als één besluit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '6.4'
    text: |-
      Indien in een geval als bedoeld in [artikel 3.16][ref1] beroep is ingesteld tegen een beschikking op de aanvraag om
      een vergunning als bedoeld in [artikel 6.2 van de Waterwet][ref2] en krachtens [artikel 2.1][ref3] of [2.2][ref4]
      een daarmee samenhangende beschikking is gegeven met betrekking tot een omgevingsvergunning, heeft het beroep, voor
      zover het die samenhang betreft, ook betrekking op de laatstbedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
