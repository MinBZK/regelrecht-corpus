  - number: 4.2.2
    text: |-
      Indien de beschikking op de aanvraag om een vergunning met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is voorbereid, kan een verzoek om vergoeding worden
      ingediend na de toezending van het ontwerp van de beschikking aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.2.3
    text: |-
      Indien het bevoegd gezag advies heeft ingewonnen over een verzoek om vergoeding of over het voornemen tot
      toekenning daarvan uit eigen beweging, zendt het een exemplaar van het advies aan de belanghebbende. Het vermeldt
      daarbij de termijn waarbinnen deze zijn zienswijze over het advies kenbaar kan maken.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Voor zover Onze Minister heeft ingestemd met het toekennen van een vergoeding krachtens [artikel 4.2][ref1] van
      kosten of schade ten gevolge van beschikkingen met betrekking tot activiteiten met betrekking tot inrichtingen als
      bedoeld in [artikel 2.1, eerste lid, onder e][ref2], komen de kosten daarvan ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.3.2
    text: |-
      In gevallen waarin het bevoegd gezag een beschikking als bedoeld in [artikel 4.2, eerste lid][ref1],
      heeft gegeven ter uitvoering van een verzoek van een bestuursorgaan, als bedoeld in
      [artikel 2.29, eerste lid, tweede volzin, onder a][ref2], komen de kosten van de vergoeding, voor zover het de
      uitvoering van dat verzoek betreft, ten laste van dat bestuursorgaan, voor zover Onze Minister daarmee niet heeft
      ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 4.3.3
    text: |-
      Voor zover het bevoegd gezag een beschikking als bedoeld in [artikel 4.2, eerste lid][ref1], heeft gegeven
      vanwege het van toepassing worden van bepalingen van een provinciale milieuverordening als bedoeld in
      [artikel 1.2, tweede lid, onder a, van de Wet milieubeheer][ref2], houdende een verbod tot het in werking hebben,
      veranderen of veranderen van de werking van inrichtingen, met betrekking tot een inrichting die al was opgericht op
      het moment waarop de betrokken bepaling van toepassing werd, komen de kosten van de schadevergoeding ten laste van
      de provincie, voor zover gedeputeerde staten daarmee hebben ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '5.1'
    text: |-
      Dit hoofdstuk is van toepassing met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde,
      alsmede met betrekking tot de handhaving van het bepaalde bij of krachtens de: - [Flora- en faunawet][ref1],
        - [Kernenergiewet][ref2],
        - [Monumentenwet 1988][ref3],
        - [Natuurbeschermingswet 1998][ref4],
        - [Ontgrondingenwet][ref5],
        - [Wet bescherming Antarctica][ref6],
        - [Wet bodembescherming][ref7],
        - [Wet geluidhinder][ref8],
        - [Wet inzake de luchtverontreiniging][ref9],
        - [Wet milieubeheer][ref10],
        - [Wet ruimtelijke ordening][ref11],
        - [Waterwet][ref12] en
        - [Woningwet][ref13], voor zover dit bij of krachtens de genoemde wetten is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009640
      [ref2]: https://wetten.overheid.nl/BWBR0002402
      [ref3]: https://wetten.overheid.nl/BWBR0004471
