    text: |-
      het in gebruik nemen of gebruiken van een bouwwerk in met het oog op de brandveiligheid bij algemene maatregel van
      bestuur aangewezen categorieën gevallen,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.1.e.1°
    text: het oprichten,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.1.e.2°
    text: het veranderen of veranderen van de werking of
