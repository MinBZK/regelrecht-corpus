        paragraaf: '2.1'
  - number: 2.3a.1
    text: Het is verboden een bouwwerk of deel daarvan dat is gebouwd zonder omgevingsvergunning in stand te laten.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.3a
  - number: 2.3a.2
    text: |-
      Het eerste lid blijft buiten toepassing indien voor het bouwen van het desbetreffende bouwwerk op grond van
      [artikel 2.1, derde lid][ref1], geen omgevingsvergunning is of was vereist, met dien verstande dat indien in een
      dergelijk geval sprake is van een bouwwerk waarvan de aanwezigheid slechts een beperkte periode is toegestaan, het
      eerste lid uitsluitend buiten toepassing blijft gedurende die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.3a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.4.1
    text: |-
      Burgemeester en wethouders van de gemeente waar het betrokken project in hoofdzaak zal worden of wordt uitgevoerd,
      beslissen op de aanvraag om een omgevingsvergunning, behoudens in gevallen als bedoeld in het tweede tot en met
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat gedeputeerde staten van de provincie waar het betrokken
      project in hoofdzaak zal worden of wordt uitgevoerd, op de aanvraag beslissen ten aanzien van projecten die behoren
      tot een bij de maatregel aangewezen categorie projecten die van provinciaal belang zijn. Bij de maatregel kan
      worden bepaald dat de aanwijzing slechts geldt in daarbij aangewezen categorieën gevallen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat Onze daarbij aangewezen Minister op de aanvraag beslist
      ten aanzien van projecten die behoren tot een bij de maatregel aangewezen categorie projecten die van nationaal
      belang zijn. Bij de maatregel kan worden bepaald dat de aanwijzing slechts geldt in daarbij aangewezen categorieën
      gevallen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.4
  - number: 2.4.4
    text: |-
      Onze Minister kan bepalen dat hij, in afwijking van het eerste, tweede of derde lid, beslist op de aanvraag om een
      omgevingsvergunning ten aanzien van een bij zijn besluit aangewezen project, indien dat geboden is in het algemeen
      belang.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Het bevoegd gezag met betrekking tot een geldende omgevingsvergunning beslist op elke aanvraag die betrekking heeft
      op een project dat zal worden of wordt uitgevoerd op de plaats ten aanzien waarvan die vergunning is verleend. De
      eerste volzin geldt niet voor burgemeester en wethouders in gevallen als bedoeld in het tweede tot en met vierde
      lid en gedeputeerde staten in gevallen als bedoeld in het derde en vierde lid. De eerste volzin geldt voorts niet
      in gevallen die behoren tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Op verzoek van de aanvrager wordt een omgevingsvergunning in twee fasen verleend. De eerste fase heeft slechts
      betrekking op de door de aanvrager aan te geven activiteiten.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Op een aanvraag om een beschikking met betrekking tot de eerste of tweede fase wordt beslist door het
      bestuursorgaan dat bevoegd zou zijn te beslissen op de aanvraag om een omgevingsvergunning voor het betrokken
      project. Een beschikking als bedoeld in de eerste volzin wordt voorbereid overeenkomstig de procedure die van
      toepassing zou zijn op de voorbereiding van de beschikking op de aanvraag om een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Indien een beschikking met betrekking tot de eerste of tweede fase wordt voorbereid met de uitgebreide
      voorbereidingsprocedure, bedoeld in [paragraaf 3.3][ref1], maar geen betrekking heeft op een activiteit of geval
      als bedoeld in [artikel 3.10, eerste lid][ref2], die niet tevens kan worden aangemerkt als een activiteit als
      bedoeld in het [derde lid van dat artikel][ref3], geeft het bevoegd gezag de beschikking – in afwijking van
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref4] – uiterlijk veertien weken na ontvangst van
      de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 2.5.4
    text: |-
      De beschikking met betrekking tot de tweede fase wordt niet eerder gegeven dan de beschikking met betrekking tot
      de eerste fase. Indien daardoor de beslistermijn voor de beschikking met betrekking tot de tweede fase zou worden
      overschreden geeft het bevoegd gezag, in afwijking daarvan, de beschikking gelijktijdig met de beschikking met
      betrekking tot de eerste fase.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.5
    text: 'Het bevoegd gezag kan een beschikking intrekken waarbij positief is beslist op een aanvraag met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.5.a
    text: |-
      de eerste fase: indien niet uiterlijk twee jaar nadat de beschikking onherroepelijk is geworden een aanvraag is
      ingediend voor de beschikking met betrekking tot de tweede fase,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.5.b
    text: |-
      de eerste of tweede fase: indien op de aanvraag met betrekking tot de andere fase negatief is beslist en niet
      uiterlijk twee jaar nadat de beschikking onherroepelijk is geworden een nieuwe aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.6
    text: |-
      De beschikking met betrekking tot de eerste fase kan bij de beschikking met betrekking tot de tweede fase worden
      gewijzigd voor zover dat nodig is met het oog op het verlenen van de omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.5.7
    text: |-
      Het bepaalde bij of krachtens deze wet met betrekking tot een omgevingsvergunning is, met uitzondering van
      [artikel 2.7][ref1], van overeenkomstige toepassing op de beschikkingen met betrekking tot de eerste en tweede
      fase.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.5.8
    text: |-
      De beschikkingen waarbij positief is beslist op de aanvragen met betrekking tot de eerste en tweede fase worden,
      als deze in werking zijn getreden, tezamen aangemerkt als een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.5
  - number: 2.6.1
    text: |-
      Voor zover de aanvraag om een omgevingsvergunning betrekking heeft op het veranderen van een inrichting of
      mijnbouwwerk of van de werking daarvan, als bedoeld in [artikel 2.1, eerste lid, onder e, onder 2° of 3°][ref1],
      en met betrekking tot die inrichting of dat mijnbouwwerk al een of meer omgevingsvergunningen zijn verleend, kan
      het bevoegd gezag bepalen dat een omgevingsvergunning wordt aangevraagd met betrekking tot die verandering en het
      in werking hebben van de betrokken inrichting of het betrokken mijnbouwwerk na die verandering.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.6.2
    text: |-
      Indien het bevoegd gezag heeft bepaald dat een zodanige omgevingsvergunning moet worden aangevraagd, besluit het
      aanvragen met betrekking tot de betrokken activiteit die daarop geen betrekking hebben, niet te behandelen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Het bevoegd gezag kan de rechten die de vergunninghouder aan de al eerder verleende omgevingsvergunningen
      ontleende, niet wijzigen anders dan mogelijk zou zijn met toepassing van [artikel 2.31][ref1] of [2.33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.6.4
    text: |-
      Een met toepassing van dit artikel verleende omgevingsvergunning vervangt met ingang van het tijdstip waarop zij
      in werking treedt, de eerder met betrekking tot het betrokken project verleende omgevingsvergunningen, voor zover
      het de inrichting of het mijnbouwwerk betreft. Deze omgevingsvergunningen vervallen op het tijdstip waarop de met
      toepassing van dit artikel verleende omgevingsvergunning, onherroepelijk wordt.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Onverminderd het bepaalde in [de artikelen 2.10, tweede lid][ref1], en [2.11, tweede lid][ref2], draagt de
      aanvrager van een omgevingsvergunning die betrekking heeft op een activiteit die behoort tot verschillende
      categorieën activiteiten als bedoeld in de [artikelen 2.1][ref3] en [2.2][ref4] er zorg voor dat de aanvraag
      betrekking heeft op elk van die activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.7.2
    text: |-
      Een aanvraag om een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], mag slechts op één inrichting waartoe een gpbv-installatie behoort
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      de aanvraag om een omgevingsvergunning geschiedt en de gegevens en bescheiden die door de aanvrager
      worden verstrekt met het oog op de beslissing op de aanvraag. Bij de maatregel kan – in afwijking van de
      [artikelen 2:14, eerste lid][ref1], en [2:15 van de Algemene wet bestuursrecht][ref2] – worden bepaald dat de
      aanvraag geheel of gedeeltelijk elektronisch wordt ingediend of in ontvangst wordt genomen. Daarbij kan worden
      bepaald dat de verplichtingen slechts gelden in daarbij aangewezen categorieën gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 2.8.2
    text: |-
      Bij een verordening als bedoeld in [artikel 2.2, tweede lid][ref1], kunnen eveneens regels worden gesteld met
      betrekking tot de gegevens en bescheiden die door de aanvrager met betrekking tot de bij die verordening aangewezen
      activiteit worden verstrekt met het oog op de beslissing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.9.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat door daarbij aangewezen bestuursorganen van
      het Rijk rechten worden geheven ter zake van de behandeling van aanvragen tot verlening of gehele of gedeeltelijke
      intrekking van een omgevingsvergunning of wijziging van voorschriften van een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de berekening en de bedragen van
      de krachtens:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9
  - number: 2.9.2.a
    text: |-
      [artikel 229, eerste lid, onder b, van de Gemeentewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: 2.9.2.b
    text: |-
      [artikel 223, eerste lid, onder b, van de Provinciewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel223
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '223'
  - number: 2.9.2.c
    text: het eerste lid,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9
  - number: 2.9a.1
    text: |-
      Voor zover aanvragen tot verlening of gehele of gedeeltelijke intrekking van een omgevingsvergunning of wijziging
      van voorschriften van een omgevingsvergunning betrekking hebben op een activiteit met betrekking tot een inrichting
      als bedoeld in [artikel 2.1, eerste lid, onder e][ref1], worden geen rechten geheven. Bij algemene maatregel van
      bestuur kunnen met betrekking tot een activiteit als bedoeld in artikel 2.1, eerste lid, onder i, categorieën
      gevallen worden aangewezen waarin de eerste volzin van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.9a.2
    text: |-
      De bevoegdheid tot het invorderen van rechten terzake van door of vanwege het gemeentebestuur, provinciaal
      bestuur of Onze betrokken Minister verstrekte diensten die verband houden met een omgevingsvergunning waarbij met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°][ref1], van een bestemmingsplan of beheersverordening
      wordt afgeweken, wordt opgeschort tot het tijdstip waarop de mededeling van dat besluit krachtens
      [artikel 3.12, tweede lid, onder b][ref2], langs elektronische weg beschikbaar is gesteld, overeenkomstig de bij of
      krachtens algemene maatregel van bestuur gestelde regels. De bevoegdheid vervalt indien de mededeling niet binnen
      twee maanden op de voorgeschreven wijze beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.9a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 2.10.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a][ref1],
      wordt de omgevingsvergunning geweigerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.10.1.a
    text: |-
      de aanvraag en de daarbij verstrekte gegevens en bescheiden het naar het oordeel van het bevoegd gezag niet
      aannemelijk maken dat het bouwen van een bouwwerk waarop de aanvraag betrekking heeft, voldoet aan de voorschriften
      die zijn gesteld bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1] of
      [120 van de Woningwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
  - number: 2.10.1.b
    text: |-
      de aanvraag en de daarbij verstrekte gegevens en bescheiden het naar het oordeel van het bevoegd gezag niet
      aannemelijk maken dat het bouwen van een bouwwerk waarop de aanvraag betrekking heeft, voldoet aan de voorschriften
      die zijn gesteld bij de bouwverordening of, zolang de bouwverordening daarmee nog niet in overeenstemming
      is gebracht, met de voorschriften die zijn gesteld bij een algemene maatregel van bestuur als bedoeld in
      [artikel 8, achtste lid, van de Woningwet][ref1] dan wel bij of krachtens een algemene maatregel van bestuur als
      bedoeld in [artikel 120 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
  - number: 2.10.1.c
    text: |-
      de activiteit in strijd is met het bestemmingsplan, de beheersverordening of het exploitatieplan, of de regels die
      zijn gesteld krachtens [artikel 4.1, derde lid][ref1], of [4.3, derde lid, van de Wet ruimtelijke ordening][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 2.10.1.d
    text: |-
      het uiterlijk of de plaatsing van het bouwwerk waarop de aanvraag betrekking heeft, met uitzondering van een
      tijdelijk bouwwerk dat geen seizoensgebonden bouwwerk is, zowel op zichzelf beschouwd als in verband met de
      omgeving of de te verwachten ontwikkeling daarvan, in strijd is met redelijke eisen van welstand, beoordeeld naar
      de criteria, bedoeld in [artikel 12a, eerste lid, onder a, van de Woningwet][ref1], tenzij het bevoegd gezag van
      oordeel is dat de omgevingsvergunning niettemin moet worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
  - number: 2.10.1.e
    text: |-
      indien het advies van de Commissie voor de tunnelveiligheid, bedoeld in
      [artikel 6, derde lid, onder b, van de Wet aanvullende regels veiligheid wegtunnels][ref1], daartoe aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
  - number: 2.10.2
    text: |-
      In gevallen als bedoeld in het eerste lid, onder c, wordt de aanvraag mede aangemerkt als een aanvraag om een
      vergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref1], en wordt de vergunning
      slechts geweigerd indien vergunningverlening met toepassing van [artikel 2.12][ref2] niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.11.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder b][ref1],
      waaromtrent regels zijn gesteld in een bestemmingsplan, beheersverordening, exploitatieplan of
      voorbereidingsbesluit, wordt de omgevingsvergunning geweigerd indien het werk of de werkzaamheid daarmee
      in strijd is of in strijd is met de regels die zijn gesteld krachtens [artikel 4.1, derde lid][ref2], of
      [4.3, derde lid, van de Wet ruimtelijke ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 2.11.2
    text: |-
      Indien sprake is van strijd met de regels, bedoeld in het eerste lid, wordt de aanvraag mede aangemerkt als een
      aanvraag om een vergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref1], en wordt de
      vergunning slechts geweigerd indien vergunningverlening met toepassing van [artikel 2.12][ref2] niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.12.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref1],
      kan de omgevingsvergunning slechts worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.12.1.a
    text: 'indien de activiteit in strijd is met het bestemmingsplan of de beheersverordening:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.1.a.1°
    text: met toepassing van de in het bestemmingsplan of de beheersverordening opgenomen regels inzake afwijking,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.1.a.2°
    text: in de bij algemene maatregel van bestuur aangewezen gevallen, of
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.1.a.3°
    text: |-
      indien de activiteit niet in strijd is met een goede ruimtelijke ordening en de motivering van het besluit een
      goede ruimtelijke onderbouwing bevat;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.1.b
    text: |-
      indien de activiteit in strijd is met het exploitatieplan: met toepassing van de daarin opgenomen regels inzake
      afwijking;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.1.c
    text: |-
      indien de activiteit in strijd is met de regels die zijn gesteld krachtens [artikel 4.1, derde lid][ref1], of
      [4.3, derde lid, van de Wet ruimtelijke ordening][ref2]: voor zover de betrokken regels afwijking daarvan toestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 2.12.1.d
    text: |-
      indien de activiteit in strijd is met een voorbereidingsbesluit: met toepassing van de in het voorbereidingsbesluit
      opgenomen regels inzake afwijking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder a, onder 3°, kan de vergunning, voor zover zij betrekking heeft
      op een activiteit voor een bepaalde termijn, worden verleend, indien de activiteit niet in strijd is met een goede
      ruimtelijke ordening.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: 2.12.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud van de ruimtelijke
      onderbouwing, bedoeld in het eerste lid, onder a, onder 3°.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder d][ref1],
      wordt de omgevingsvergunning geweigerd indien de brandveiligheid met het oog op het voorziene gebruik van het
      bouwwerk niet voldoende verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.1.a
    text: 'betrekt het bevoegd gezag bij de beslissing op de aanvraag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.a.1°
    text: |-
      de bestaande toestand van het milieu, voor zover de inrichting of het mijnbouwwerk daarvoor gevolgen kan
      veroorzaken;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.a.2°
    text: |-
      de gevolgen voor het milieu, mede in hun onderlinge samenhang bezien, die de inrichting of het mijnbouwwerk kan
      veroorzaken, mede gezien de technische kenmerken en de geografische ligging daarvan;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.a.3°
    text: |-
      de met betrekking tot de inrichting of het mijnbouwwerk en het gebied waar de inrichting of het mijnbouwwerk zal
      zijn of is gelegen, redelijkerwijs te verwachten ontwikkelingen die van belang zijn met het oog op de bescherming
      van het milieu;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.a.4°
    text: |-
      de voor het einde van de in [artikel 3:16 van de Algemene wet bestuursrecht][ref1] bedoelde termijn of de krachtens
      [artikel 3.12, zesde lid][ref2], aangegeven termijn ingebrachte adviezen en zienswijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 2.14.1.a.5°
    text: |-
      de mogelijkheden tot bescherming van het milieu, door de nadelige gevolgen voor het milieu, die de inrichting of
      het mijnbouwwerk kan veroorzaken, te voorkomen, of zoveel mogelijk te beperken, voor zover zij niet kunnen worden
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.a.6°
    text: |-
      het systeem van met elkaar samenhangende technische, administratieve en organisatorische maatregelen om de gevolgen
      die de inrichting of het mijnbouwwerk voor het milieu veroorzaakt, te monitoren, te beheersen en, voor zover het
      nadelige gevolgen betreft, te verminderen, dat degene die de inrichting of het mijnbouwwerk drijft, met betrekking
      tot de inrichting of het mijnbouwwerk toepast, alsmede het milieubeleid dat hij met betrekking tot de inrichting of
      het mijnbouwwerk voert;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.b
    text: 'houdt het bevoegd gezag bij die beslissing in ieder geval rekening met:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.b.1°
    text: het voor hem geldende milieubeleidsplan;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.b.2°
    text: |-
      het bepaalde in de [artikelen 10.14][ref1] en [10.29a van de Wet milieubeheer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.14.1.b.3°
    text: |-
      de voor de onderdelen van het milieu, waarvoor de inrichting of het mijnbouwwerk gevolgen kan hebben, geldende
      richtwaarden, voor zover de verplichting tot het rekening houden daarmee is vastgelegd krachtens of overeenkomstig
      [artikel 5.2][ref1] of [5.17 van de Wet milieubeheer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 2.14.1.c
    text: 'neemt het bevoegd gezag bij die beslissing in ieder geval in acht:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.c.1°
    text: |-
      dat in de inrichting of het mijnbouwwerk ten minste de voor de inrichting of het mijnbouwwerk in aanmerking komende
      beste beschikbare technieken moeten worden toegepast;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.1.c.2°
    text: |-
      de voor de onderdelen van het milieu, waarvoor de inrichting of het mijnbouwwerk gevolgen kan hebben, geldende
      grenswaarden, voor zover de verplichting tot het in acht nemen daarvan is vastgelegd krachtens of overeenkomstig
      [artikel 5.2 van de Wet milieubeheer][ref1], is vastgelegd in of krachtens [artikel 5.16 van die wet][ref2],
      dan wel voor zover het inrichtingen betreft voortvloeit uit de [artikelen 40][ref3], [44 tot en met 47][ref4],
      [50][ref5], [51][ref6], [53 tot en met 56][ref7], [59 tot en met 61][ref8], [63, tweede lid][ref9], [64][ref10],
      [65][ref11] of [66 van de Wet geluidhinder][ref12];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel50
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel51
      [ref7]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref8]: https://wetten.overheid.nl/BWBR0003227#Artikel59
      [ref9]: https://wetten.overheid.nl/BWBR0003227#Artikel63
      [ref10]: https://wetten.overheid.nl/BWBR0003227#Artikel64
      [ref11]: https://wetten.overheid.nl/BWBR0003227#Artikel65
      [ref12]: https://wetten.overheid.nl/BWBR0003227#Artikel66
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '44'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '50'
      - id: ref6
        bwb_id: BWBR0003227
        artikel: '51'
      - id: ref7
        bwb_id: BWBR0003227
        artikel: '53'
      - id: ref8
        bwb_id: BWBR0003227
        artikel: '59'
      - id: ref9
        bwb_id: BWBR0003227
        artikel: '63'
      - id: ref10
        bwb_id: BWBR0003227
        artikel: '64'
      - id: ref11
        bwb_id: BWBR0003227
        artikel: '65'
      - id: ref12
        bwb_id: BWBR0003227
        artikel: '66'
  - number: 2.14.1.c.3°
    text: |-
      in afwijking van onderdeel 2°, neemt het bevoegd gezag, voor zover het de geldende grenswaarden betreft, die
      voortvloeien uit de in dat onderdeel genoemde artikelen van de [Wet geluidhinder][ref1], bij de beslissing op de
      aanvraag om een vergunning voor een inrichting, gelegen op een industrieterrein waarvoor een geluidreductieplan als
      bedoeld in [artikel 67 van de Wet geluidhinder][ref2] is vastgesteld, het geldende geluidreductieplan in acht;


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel67
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '67'
  - number: 2.14.1.c.4°
    text: |-
      de onderdelen van het advies, bedoeld in [artikel 2.26, tweede lid][ref1], ten aanzien waarvan in het advies is
      aangegeven dat daaraan moet worden voldaan, voor zover daardoor geen strijd ontstaat met het bepaalde in de andere
      onderdelen van dit lid of het tweede lid, of het bepaalde bij of krachtens [artikel 2.22][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.14.1.d
    text: |-
      en betrekt het bevoegd gezag bij die beslissing de bij een algemene maatregel van bestuur als bedoeld in
      [artikel 5.1 van de Wet milieubeheer][ref1] ter uitvoering van een EU-richtlijn of EU-verordening gestelde
      milieukwaliteitseisen op de bij die maatregel aangegeven wijze, voor zover de verplichting daartoe krachtens of
      overeenkomstig [artikel 5.2 van de Wet milieubeheer][ref2] is vastgelegd in die maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 2.14.2
    text: |-
      Voor zover de aanvraag om een activiteit als bedoeld in het eerste lid betrekking heeft op een inrichting
      waarin stoffen behorende tot een in [artikel 9.2.3.1, tweede lid, van de Wet milieubeheer][ref1] aangewezen
      categorie aanwezig kunnen zijn en die behoort tot een bij algemene maatregel van bestuur aangewezen categorie,
      draagt het bevoegd gezag er zorg voor dat de beslissing op de aanvraag niet tot gevolg heeft dat minder dan
      voldoende afstand aanwezig is tussen die inrichting en een beschermd natuurmonument of gebied dat als zodanig
      is aangewezen krachtens [artikel 10 van de Natuurbeschermingswet 1998][ref2] of een gebied dat als zodanig
      is aangewezen krachtens [artikel 10a van die wet][ref3] of dat voorlopig als zodanig is aangewezen krachtens
      [artikel 12 van die wet][ref4]. Bij de beoordeling van de afstand betrekt het bevoegd gezag de maatregelen die zijn
      of worden getroffen om een voorval als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref5] waarbij stoffen als
      bedoeld in de eerste volzin zijn betrokken en waardoor ernstig gevaar voor het milieu ontstaat, in de inrichting te
      voorkomen of de gevolgen daarvan te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 10a
      - id: ref4
        bwb_id: BWBR0009641
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '17'
  - number: 2.14.3
    text: |-
      Voor zover het een activiteit betreft als bedoeld in het eerste lid, kan de omgevingsvergunning slechts in het
      belang van de bescherming van het milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Het bevoegd gezag geeft in de motivering van de beslissing op de aanvraag te kennen, op welke wijze de in het
      eerste lid, onder a, genoemde aspecten de inhoud van het besluit hebben beïnvloed. Indien toepassing wordt gegeven
      aan het eerste lid, onder c, onder 3°, vermeldt het bevoegd gezag dit in de motivering.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.5
    text: |-
      In afwijking van het eerste tot en met vierde lid wordt in gevallen als bedoeld in [artikel 3.10, derde lid][ref1],
      de omgevingsvergunning verleend indien wordt voldaan aan de in het laatstgenoemde lid gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 2.14.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de voor
      een inrichting of mijnbouwwerk in aanmerking komende beste beschikbare technieken moeten worden bepaald. Daarbij
      kan worden bepaald dat de gestelde regels slechts gelden in gevallen die behoren tot een daarbij aangewezen
      categorie.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
  - number: 2.14.7
    text: |-
      Bij de toepassing van het eerste lid worden gronden en bouwwerken in de omgeving van de inrichting in
      aanmerking genomen overeenkomstig het bestemmingsplan, de beheersverordening, of, indien met toepassing
      van [artikel 2.12, eerste lid][ref1], van het bestemmingsplan of de beheersverordening is afgeweken, de
      omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '2.15'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1],
      kan de omgevingsvergunning slechts worden verleend indien het belang van de monumentenzorg zich daartegen niet
      verzet. Bij de beslissing op de aanvraag houdt het bevoegd gezag rekening met het gebruik van het monument.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.16'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder g of h][ref1], kan de omgevingsvergunning worden geweigerd indien naar het oordeel
      van het bevoegd gezag niet aannemelijk is dat op de plaats van het te slopen bouwwerk een ander bouwwerk kan of zal
      worden gebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.17'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder i][ref1],
      kan de omgevingsvergunning slechts worden verleend of geweigerd op de gronden die zijn aangegeven in de betrokken
      algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.18'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.2][ref1] kan de
      omgevingsvergunning slechts worden verleend of geweigerd op de gronden die zijn aangegeven in de betrokken
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.19'
    text: |-
      Voor zover de aanvraag ingevolge een wettelijk voorschrift tevens betrekking heeft op een andere activiteit dan
      bedoeld in de [artikelen 2.1, eerste lid][ref1], en [2.2][ref2], kan de omgevingsvergunning voor die activiteit
      slechts worden verleend of geweigerd op de gronden die zijn aangegeven in het betrokken wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.20.1
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a][ref1],
      of in artikel 2.1, eerste lid, onder e, met betrekking tot een inrichting kan het bevoegd gezag
      de omgevingsvergunning in andere gevallen dan bedoeld in [artikel 2.10][ref2], onderscheidenlijk
      [artikel 2.14][ref3] slechts weigeren in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], met dien verstande
      dat voor de toepassing van [artikel 3 van die wet][ref5], voor zover het deze wet betreft, onder betrokkene
      mede wordt verstaan degene die op grond van feiten en omstandigheden redelijkerwijs met de aanvrager van de
      omgevingsvergunning gelijk kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 2.20.2
    text: |-
      Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 2.20a
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit waarvoor voor het verlenen van de omgevingsvergunning
      een verklaring vereist is als bedoeld in [artikel 2.27, eerste lid][ref1], wordt de omgevingsvergunning voor die
      activiteit geweigerd indien de verklaring is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.20a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '2.21'
    text: |-
      Indien een aanvraag betrekking heeft op een project dat uit verschillende activiteiten bestaat en de
      omgevingsvergunning voor dat project ingevolge de [artikelen 2.10 tot en met 2.20a][ref1] moet worden geweigerd,
      kan het bevoegd gezag op verzoek van de aanvrager de omgevingsvergunning verlenen voor de activiteiten waarvoor zij
      niet behoeft te worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.22.1
    text: In een omgevingsvergunning worden het project en de activiteiten waarop het betrekking heeft, duidelijk beschreven.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.2
    text: |-
      Aan een omgevingsvergunning worden de voorschriften verbonden, die nodig zijn met het oog op het belang dat voor
      de betrokken activiteit is aangegeven in het bepaalde bij of krachtens de [artikelen 2.10 tot en met 2.20][ref1].
      Indien toepassing is gegeven aan [artikel 2.27, vierde lid][ref2], worden aan een omgevingsvergunning tevens de
      bij de verklaring aangegeven voorschriften verbonden. De aan de omgevingsvergunning verbonden voorschriften zijn op
      elkaar afgestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.22.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor daarbij aangewezen categorieën activiteiten of gevallen
      regels gesteld met betrekking tot het verbinden van voorschriften aan de omgevingsvergunning. Hiertoe kunnen
      behoren regels met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.3.a
    text: |-
      voorschriften ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van
      een volkenrechtelijke organisatie met betrekking tot de fysieke leefomgeving;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.3.b
    text: |-
      voorschriften, inhoudende een verplichting om te voldoen aan nadere eisen die door een bij het voorschrift
      aangewezen bestuursorgaan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.3.c
    text: |-
      voorschriften, inhoudende een verplichting voor het krachtens onderdeel b aangewezen bestuursorgaan om van de in
      dat onderdeel bedoelde eisen op een daarbij aan te geven wijze openbaar kennis te geven;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.3.d
    text: voorschriften die nodig zijn met het oog op het belang van de archeologische monumentenzorg;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.3.e
    text: voorschriften die niet aan de omgevingsvergunning kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.22.4
    text: |-
      Bij een verordening als bedoeld in [artikel 2.2][ref1] kunnen voor de betrokken categorieën activiteiten eveneens
      regels worden gesteld met betrekking tot het verbinden van voorschriften aan de omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.22.5
    text: |-
      Voor zover met betrekking tot de activiteit algemeen verbindende voorschriften gelden, kunnen de voorschriften
      die aan de vergunning worden verbonden daarvan alleen afwijken voor zover dat bij die regels is toegestaan. In
      afwijking van de eerste volzin worden aan een omgevingsvergunning die betrekking heeft op een activiteit als
      bedoeld in [artikel 2.1, eerste lid, onder e][ref1], met betrekking tot een inrichting waartoe een gpbv-installatie
      behoort, voorschriften verbonden die afwijken van de algemeen verbindende voorschriften, bedoeld in de eerste
      volzin, voor zover met die voorschriften niet wordt voldaan aan het bepaalde bij of krachtens het tweede of derde
      lid of [artikel 2.14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.22.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in daarbij aangewezen categorieën gevallen regels worden
      gesteld omtrent het voorbereiden, vormgeven, inrichten of beschikbaar stellen van een omgevingsvergunning of
      omtrent de uitvoerbaarheid daarvan.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.22
  - number: 2.23.1
    text: |-
      In een omgevingsvergunning kan worden bepaald dat zij geheel of gedeeltelijk geldt voor een daarin aangegeven
      termijn.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.23
  - number: 2.23.2
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen, waarin in de omgevingsvergunning
      wordt bepaald dat zij slechts geldt voor een daarbij aangegeven termijn. Bij de maatregel kan worden bepaald:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.23
  - number: 2.23.2.a
    text: dat de omgevingsvergunning voor ten hoogste een daarbij aangegeven termijn kan gelden of
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.23
  - number: 2.23.2.b
    text: in welke categorieën gevallen een bij de omgevingsvergunning aangegeven termijn kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.23
  - number: 2.24.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in daarbij aangewezen categorieën gevallen de
      vergunninghouder verplicht is te zijner keuze hetzij de voor de verlening van de omgevingsvergunning bestaande
      toestand te herstellen, hetzij die met de wettelijk voorgeschreven toestand in overeenstemming te brengen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.24
  - number: 2.24.2
    text: |-
      In een omgevingsvergunning met betrekking tot een seizoensgebonden bouwwerk wordt bepaald binnen welke
      opeenvolgende tijdvakken van een kalenderjaar dat bouwwerk wordt opgericht, gebruikt en gesloopt.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.24
  - number: 2.25.1
    text: |-
      Een omgevingsvergunning geldt voor eenieder die het project uitvoert waarop zij betrekking heeft. De
      vergunninghouder draagt ervoor zorg dat de aan de omgevingsvergunning verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.25
  - number: 2.25.2
    text: |-
      Indien een omgevingsvergunning zal gaan gelden voor een ander dan de aanvrager of de vergunninghouder, meldt de
      aanvrager, onderscheidenlijk de vergunninghouder dat ten minste een maand voordien aan het bevoegd gezag, onder
      vermelding van de bij algemene maatregel van bestuur aangegeven gegevens.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.25
  - number: 2.25.3
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen, waarin de omgevingsvergunning
      slechts geldt voor degene aan wie zij is verleend. Daarbij kan tevens worden bepaald dat in daarbij aangewezen
      categorieën gevallen:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.25
  - number: 2.25.3.a
    text: |-
      de omgevingsvergunning nog gedurende een daarbij aangegeven termijn blijft gelden voor rechtsopvolgers van degene
      aan wie zij is verleend;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.25
  - number: 2.25.3.b
    text: |-
      de omgevingsvergunning ook geldt voor een rechtspersoon aan wie zij is overgedragen door een andere rechtspersoon,
      indien daarvoor door het bevoegd gezag toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.25
  - number: 2.26.1
    text: |-
      Naar aanleiding van een aanvraag die betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], waarbij vanuit een inrichting of mijnbouwwerk afvalwater of andere
      afvalstoffen in een voorziening voor de inzameling en het transport van afvalwater worden gebracht, stelt het
      bevoegd gezag het bestuursorgaan dat zorg draagt voor het beheer van het zuiveringtechnisch werk, bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref2], of het oppervlaktewater waarop het afvalwater vanuit die
      voorziening wordt gebracht, in de gelegenheid advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '1'
  - number: 2.26.2
    text: 'Indien ten gevolge van de activiteit waarvoor vergunning wordt gevraagd:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
  - number: 2.26.2.a
    text: |-
      de doelmatige werking van het zuiveringtechnisch werk, bedoeld in [artikel 1.1, eerste lid, van de Waterwet][ref1],
      zou worden belemmerd, of


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
  - number: 2.26.2.b
    text: |-
      de bij een algemene maatregel van bestuur als bedoeld in [artikel 5.1 van de Wet milieubeheer][ref1] ter uitvoering
      van een EU-richtlijn of een EU-verordening gestelde milieukwaliteitseisen voor oppervlaktewaterlichamen zouden
      worden overschreden,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 2.26.3
    text: |-
      Het bevoegd gezag stelt de bij algemene maatregel van bestuur en, in gevallen als bedoeld in [artikel 2.2][ref1],
      de bij de betrokken verordening aangewezen bestuursorganen of andere instanties in gevallen die behoren tot een bij
      die maatregel, onderscheidenlijk verordening aangewezen categorie in de gelegenheid hem advies uit te brengen over
      de aanvraag of het ontwerp van de beschikking op de aanvraag om een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.26.4
    text: |-
      Het bevoegd gezag kan een als adviseur aangewezen bestuursorgaan verzoeken om naar aanleiding van een aanvraag om
      een omgevingsvergunning advies uit te brengen over:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
  - number: 2.26.4.a
    text: de bij de beslissing op de aanvraag te betrekken gegevens,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
  - number: 2.26.4.b
    text: aan de vergunning te verbinden voorschriften,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.26
  - number: 2.27.1
    text: |-
      In bij wet of algemene maatregel van bestuur aangewezen categorieën gevallen wordt een omgevingsvergunning niet
      verleend dan nadat een daarbij aangewezen bestuursorgaan heeft verklaard dat het daartegen geen bedenkingen heeft.
      Bij een maatregel als bedoeld in de eerste volzin worden slechts categorieën gevallen aangewezen waarin voor het
      verrichten van de betrokken activiteit een afzonderlijke toestemming van het aangewezen bestuursorgaan wenselijk is
      gezien de bijzondere deskundigheid die dat orgaan ten aanzien van die activiteit bezit of de verantwoordelijkheid
      die dat orgaan draagt voor het beleid dat betrekking heeft op de betrokken categorie activiteiten. Bij die
      maatregel kan worden bepaald dat het aangewezen bestuursorgaan categorieën gevallen kan aanwijzen waarin de
      verklaring niet is vereist.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.27
  - number: 2.27.2
    text: |-
      In afwijking van [artikel 10:32 van de Algemene wet bestuursrecht][ref1] is [afdeling 10.2.1 van die wet][ref2],
      met uitzondering van [artikel 10:28][ref3], niet van toepassing met betrekking tot de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.1
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 2.27.3
    text: |-
      De verklaring kan slechts worden gegeven of geweigerd in het belang dat in de betrokken wet of algemene maatregel
      van bestuur is aangegeven.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.27
  - number: 2.27.4
    text: |-
      Het bestuursorgaan dat de verklaring geeft, bepaalt daarbij dat aan de omgevingsvergunning de daarbij aangegeven
      voorschriften die nodig zijn met het oog op het belang, bedoeld in het derde lid, worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.27
  - number: 2.27.5
    text: |-
      De verklaring wordt vermeld in de beschikking op de aanvraag. Een exemplaar ervan wordt bij ieder exemplaar van die
      beschikking gevoegd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.27
  - number: '2.28'
    text: |-
      Indien met het oog op de beslissing op de aanvraag om een omgevingsvergunning krachtens meer dan een wettelijk
      voorschrift een verklaring van hetzelfde bestuursorgaan is vereist, beslist dat bestuursorgaan daarover in één
      verklaring.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.28
  - number: 2.29.1
    text: |-
      Een bestuursorgaan dat bij de totstandkoming van de omgevingsvergunning bevoegd was een verklaring als bedoeld in
      [artikel 2.27, eerste lid][ref1], te geven of advies uit te brengen kan het bevoegd gezag verzoeken voorschriften
      van de omgevingsvergunning te wijzigen of de omgevingsvergunning geheel of gedeeltelijk in te trekken. Een verzoek
      kan slechts worden gedaan door:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.29.1.a
    text: |-
      het bestuursorgaan dat bevoegd was een verklaring te geven: voor zover het betreft de activiteiten waarvoor de
      verklaring is gegeven;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.29
  - number: 2.29.1.b
    text: |-
      een adviseur: voor zover het betreft de aspecten waarover hij bij de totstandkoming van de omgevingsvergunning
      advies kan uitbrengen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.29
  - number: 2.29.2
    text: |-
      Voor zover een omgevingsvergunning betrekking heeft op een activiteit met betrekking tot een inrichting als bedoeld
      in [artikel 2.1, eerste lid, onder e][ref1], kan Onze Minister het bevoegd gezag verzoeken binnen een daarbij
      aangegeven termijn de omgevingsvergunning of voorschriften van de omgevingsvergunning te wijzigen, indien zich
      in de betrokken inrichting een voorval als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref2] voordoet of
      heeft voorgedaan of, indien [titel 17.1A van die wet][ref3] van toepassing is, zich een gebeurtenis als bedoeld in
      [artikel 17.5a van die wet][ref4] voordoet of heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0003245
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '17'
  - number: 2.29.3
    text: |-
      Indien het bevoegd gezag gevolg geeft aan een verzoek als bedoeld in het eerste of tweede lid, zendt het een
      exemplaar van de beschikking tot wijziging van voorschriften van de omgevingsvergunning of wijziging of gehele of
      gedeeltelijke intrekking van de omgevingsvergunning aan het betrokken bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.29
  - number: 2.30.1
    text: |-
      Voor zover de omgevingsvergunning betrekking heeft op een activiteit met betrekking tot een inrichting als bedoeld
      in [artikel 2.1, eerste lid, onder e][ref1], beziet het bevoegd gezag regelmatig of de voorschriften die aan een
      omgevingsvergunning zijn verbonden, nog toereikend zijn gezien de ontwikkelingen op het gebied van de technische
      mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.30.2
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van het milieu regels worden gesteld
      met betrekking tot de wijze waarop het eerste lid wordt toegepast met betrekking tot daarbij aangewezen categorieën
      inrichtingen. Bij de maatregel kan worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangewezen
      categorieën gevallen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.30
  - number: 2.31.1
    text: 'Het bevoegd gezag wijzigt voorschriften van de omgevingsvergunning:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.31
  - number: 2.31.1.a
    text: |-
      ter uitvoering van een verzoek als bedoeld in [artikel 2.29, eerste lid, tweede volzin, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.31
    references:
