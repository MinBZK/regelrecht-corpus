preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een groot aantal verschillende stelsels bestaat met betrekking tot
    toestemmingen van bestuursorganen, die vereist zijn voor het verrichten van activiteiten die van invloed zijn op de
    fysieke leefomgeving, en dat het wenselijk is die stelsels zoveel mogelijk samen te voegen, opdat een samenhangende
    beoordeling van die activiteiten op de betrokken aspecten mogelijk is in één procedure die leidt tot één besluit;
    dat het nodig is met het oog op dit nieuwe stelsel ook de handhaving daarvan te regelen en dat het wenselijk is van
    die gelegenheid gebruik te maken om de bestuursrechtelijke handhaving van regelingen met betrekking tot de fysieke
    leefomgeving – voor zover niet algemeen-bestuursrechtelijk geregeld – verder te uniformeren en in dezelfde wet
    onder te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *activiteit:* activiteit als bedoeld in
      [artikel 2.1, eerste lid][ref1], of [2.2][ref2];
        - *afvalstoffen:* afvalstoffen als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref3];
        - *beheersverordening:* beheersverordening als bedoeld in [artikel 3.38 van de Wet ruimtelijke ordening][ref4] die
      van toepassing is op de plaats waar de activiteit wordt of zal worden verricht;
        - *beschermd monument:* beschermd monument als bedoeld in [artikel 1, onder d, van de Monumentenwet 1988][ref5],
      met uitzondering van een beschermd archeologisch monument als bedoeld in [artikel 1, onder c, van die wet][ref6];
        - *beschermd stads- of dorpsgezicht:* beschermd stads- of dorpsgezicht als bedoeld in
      [artikel 1, onder g, van de Monumentenwet 1988][ref7];
        - *beste beschikbare technieken:* voor het bereiken van een hoog niveau van bescherming van het milieu meest
      doeltreffende technieken om de emissies en andere nadelige gevolgen voor het milieu, die een inrichting kan
      veroorzaken, te voorkomen of, indien dat niet mogelijk is, zoveel mogelijk te beperken, die – kosten en baten
      in aanmerking genomen – economisch en technisch haalbaar in de bedrijfstak waartoe de inrichting behoort, kunnen
      worden toegepast, en die voor degene die de inrichting drijft, redelijkerwijs in Nederland of daarbuiten te
      verkrijgen zijn; daarbij wordt onder technieken mede begrepen het ontwerp van de inrichting, de wijze waarop zij
      wordt gebouwd en onderhouden, alsmede de wijze van bedrijfsvoering en de wijze waarop de inrichting buiten gebruik
      wordt gesteld;
        - *bestemmingsplan:* bestemmingsplan, provinciaal inpassingsplan of rijksinpassingsplan als bedoeld in de
      [Wet ruimtelijke ordening][ref8] dat van toepassing is op de plaats waar de activiteit wordt of zal worden verricht
      en de krachtens dat plan gestelde nadere eisen;
        - *bevoegd gezag:* bestuursorgaan dat bevoegd is tot het nemen van een besluit ten aanzien van een aanvraag om een
      omgevingsvergunning of ten aanzien van een al verleende omgevingsvergunning;
        - *bouwen:* plaatsen, geheel of gedeeltelijk oprichten, vernieuwen, veranderen of vergroten;
        - *bouwverordening:* bouwverordening als bedoeld in [artikel 8 van de Woningwet][ref9];
        - *exploitatieplan:* plan als bedoeld in [artikel 6.12, eerste lid, van de Wet ruimtelijke ordening][ref10];
        - *gevaarlijke afvalstoffen:* gevaarlijke afvalstoffen als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref11];
        - *gpbv-installatie:* installatie als bedoeld in bijlage 1 bij richtlijn nr. 2008/1/EG van het Europees
      Parlement en de Raad van de Europese Unie van 15 januari 2008 inzake geïntegreerde preventie en bestrijding van
      verontreiniging (PbEU L 24);
        - *inrichting:* inrichting, behorende tot een categorie die is aangewezen krachtens het derde lid;
        - *inspecteur:* als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
        - *mijnbouwwerk:* mijnbouwwerk als bedoeld in [artikel 1, onder n, van de Mijnbouwwet][ref12];
        - *omgevingsvergunning:* omgevingsvergunning als bedoeld in [artikel 2.1][ref13] of [2.2][ref14];
        - *Onze Minister:* Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
        - *project:* project als bedoeld in [artikel 2.1, eerste lid][ref15], of [2.2][ref16];
        - *slopen:* geheel of gedeeltelijk afbreken;
        - *verklaring:* verklaring van geen bedenkingen als bedoeld in [artikel 2.27, eerste lid][ref17];
        - *voorbereidingsbesluit:* besluit waarbij toepassing is gegeven aan
      [artikel 3.7 van de Wet ruimtelijke ordening][ref18];
        - *wijzigen van voorschriften van een omgevingsvergunning:* wijzigen, aanvullen of intrekken van voorschriften die
      aan een omgevingsvergunning zijn verbonden of alsnog verbinden van voorschriften aan een omgevingsvergunning.


