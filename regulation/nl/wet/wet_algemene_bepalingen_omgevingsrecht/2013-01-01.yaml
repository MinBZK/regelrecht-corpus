      [ref9]: https://wetten.overheid.nl/BWBR0002731
      [ref10]: https://wetten.overheid.nl/BWBR0003245
      [ref11]: https://wetten.overheid.nl/BWBR0020449
      [ref12]: https://wetten.overheid.nl/BWBR0025458
      [ref13]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel5.1
    references:
