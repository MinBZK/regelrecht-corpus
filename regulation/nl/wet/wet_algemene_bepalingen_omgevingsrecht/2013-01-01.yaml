  - number: 1.1.2
    text: |-
      Met betrekking tot de betekenis van de begrippen «gevolgen voor het milieu» en «bescherming van het milieu»
      in deze wet en de daarop berustende bepalingen is [artikel 1.1, tweede lid, van de Wet milieubeheer][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden categorieën inrichtingen aangewezen als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref1], waarvan het oprichten, het veranderen of veranderen van
      de werking of het in werking hebben moet worden onderworpen aan een voorafgaande toetsing, gezien de aard en de
      omvang van de nadelige gevolgen die de inrichtingen voor het milieu kunnen veroorzaken. Bij de maatregel worden als
      categorie in ieder geval aangewezen de inrichtingen waartoe een gpbv-installatie behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.4
    text: |-
      Een wijziging van bijlage 1 bij richtlijn nr. 2008/1/EG van het Europees Parlement en de Raad van de Europese Unie
      van 15 januari 2008 inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEU L 24) gaat voor de
      toepassing van de in het eerste lid gegeven omschrijving van «gpbv-installatie» gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel1.1
  - number: 1.1a.1
    text: |-
      Een bedrijfswoning, behorend tot of voorheen behorend tot een landbouwinrichting, die op grond van het
      bestemmingsplan, de beheersverordening of, indien met toepassing van [artikel 2.12, eerste lid][ref1], van het
      bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning door een derde bewoond mag worden,
      wordt met betrekking tot die inrichting voor de toepassing van deze wet en de daarop berustende bepalingen
      beschouwd als onderdeel van die inrichting, tenzij bij of krachtens deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 1.1a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder landbouwinrichting verstaan: inrichting waar uitsluitend of in
      hoofdzaak agrarische activiteiten, zijnde het telen of kweken van landbouwgewassen of het fokken, mesten, houden of
      verhandelen van landbouwhuisdieren, dan wel activiteiten die daarmee verband houden worden verricht.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel1.1a
  - number: 2.1.1
    text: |-
      Het is verboden zonder omgevingsvergunning een project uit te voeren, voor zover dat geheel of gedeeltelijk bestaat
      uit:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.1.a
    text: het bouwen van een bouwwerk,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.1.b
    text: |-
      het uitvoeren van een werk, geen bouwwerk zijnde, of van werkzaamheden, in gevallen waarin dat bij een
      bestemmingsplan, beheersverordening, exploitatieplan of voorbereidingsbesluit is bepaald,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      het gebruiken van gronden of bouwwerken in strijd met een bestemmingsplan, een beheersverordening,
      een exploitatieplan, de regels gesteld krachtens [artikel 4.1, derde lid][ref1], of
      [4.3, derde lid, van de Wet ruimtelijke ordening][ref2] of een voorbereidingsbesluit voor zover toepassing is
      gegeven aan [artikel 3.7, vierde lid, tweede volzin, van die wet][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.1
    references:
