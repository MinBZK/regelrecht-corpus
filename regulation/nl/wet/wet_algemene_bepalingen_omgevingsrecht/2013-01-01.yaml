        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.1
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van de beschikking op
      de aanvraag om een omgevingsvergunning, indien de aanvraag geheel of gedeeltelijk betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.10.1.a
    text: |-
      een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref1], voor zover er strijd is met het
      bestemmingsplan of een beheersverordening en slechts vergunning kan worden verleend met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°][ref2], of [artikel 2.12, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
