  - number: 3.10.1.d
    text: |-
      een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1], voor zover voor die activiteit krachtens
      [artikel 2.26, derde lid][ref2], een adviseur is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
