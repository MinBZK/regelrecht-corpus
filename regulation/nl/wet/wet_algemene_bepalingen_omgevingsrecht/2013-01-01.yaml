        paragraaf: '2.5'
  - number: 3.10.1.e
    text: |-
      een geval waarin een verklaring vereist is, als bedoeld in [artikel 2.27][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 3.10.1.f
    text: |-
      een geval dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie met mogelijk belangrijke
      gevolgen voor de fysieke leefomgeving of de belangen van derden;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
  - number: 3.10.1.g
    text: |-
      een activiteit als bedoeld in [artikel 2.19][ref1], voor zover dat in het betrokken wettelijk voorschrift is
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.10.2
    text: |-
      Het bevoegd gezag kan bepalen dat de toepassing van [artikel 3.1][ref1] of
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geheel of gedeeltelijk achterwege blijft, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 3.10.2.a
    text: |-
      de aanvraag betrekking heeft op een activiteit waarvan de uitvoering als gevolg van een ongewone omstandigheid op
      korte termijn nodig is;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
  - number: 3.10.2.b
    text: |-
      de uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie dat vereist.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      In afwijking van het eerste lid, aanhef en onder c, is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      niet van toepassing op de voorbereiding van de beschikking op de aanvraag om een omgevingsvergunning met
      betrekking tot een verandering van een inrichting of mijnbouwwerk of de werking daarvan, die niet leidt
      tot andere of grotere nadelige gevolgen voor het milieu dan volgens de geldende omgevingsvergunning is
      toegestaan, waarvoor geen verplichting bestaat tot het maken van een milieueffectrapport als bedoeld in
      [hoofdstuk 7 van de Wet milieubeheer][ref2], en die niet leidt tot een andere inrichting of mijnbouwwerk dan
      waarvoor eerder een omgevingsvergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 3.10.4
    text: |-
      Indien op de voorbereiding van de beschikking op de aanvraag om een omgevingsvergunning
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, zijn tevens de [artikelen 13.6][ref2],
      [13.9][ref3] en [13.11, eerste lid, aanhef en onder c, van de Wet milieubeheer][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '13'
  - number: 3.11.1
    text: |-
      Het bevoegd gezag zendt het bestuursorgaan dat bevoegd is een verklaring te geven als bedoeld in
      [artikel 2.27][ref1], onverwijld een exemplaar van de aanvraag en de daarbij gevoegde stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 3.11.2
    text: |-
      Op verzoek van het bestuursorgaan geeft het bevoegd gezag toepassing aan
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1], voor zover dat nodig is voor de beoordeling van de
      onderdelen van de aanvraag waaromtrent de verklaring is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.11.3
    text: |-
      Zienswijzen die overeenkomstig [artikel 3:15 van de Algemene wet bestuursrecht][ref1] naar voren worden gebracht,
      en adviezen van de krachtens [artikel 2.26][ref2] aangewezen adviseurs kunnen mede betrekking hebben op het ontwerp
      van de verklaring. Voor zover dat het geval is, zendt het bevoegd gezag ze onverwijld aan het bestuursorgaan dat de
      verklaring geeft. Dit deelt zijn oordeel daarover mee aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 3.11.4
    text: |-
      Indien dat met het oog op de voorbereiding van de verklaring nodig is, kan het bestuursorgaan dat bevoegd is de
      verklaring te geven, het bevoegd gezag verzoeken de termijn waarbinnen de beslissing op de aanvraag moet worden
      genomen, te verlengen met toepassing van [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1] juncto
      [artikel 3.12, achtste lid][ref2]. Het bevoegd gezag verlengt de termijn overeenkomstig het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.12.1
    text: |-
      Het bevoegd gezag neemt bij de toepassing van de [afdelingen 3.4][ref1] en
      [3.6 van de Algemene wet bestuursrecht][ref2] het bepaalde in de volgende leden en de [artikelen 3.13][ref3] en
      [3.14][ref4] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.12.2
    text: |-
      Een kennisgeving als bedoeld in [artikel 3:12 van de Algemene wet bestuursrecht][ref1] en een mededeling als
      bedoeld in [artikel 3:44 van die wet][ref2] worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.12.2.a
    text: in de Staatscourant geplaatst, voor zover dat bij algemene maatregel van bestuur is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
  - number: 3.12.2.b
    text: |-
      tevens langs elektronische weg gedaan en beschikbaar gesteld, voor zover en op de wijze waarop dat bij of krachtens
      algemene maatregel van bestuur is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
  - number: 3.12.2.c
    text: |-
      indien toepassing is gegeven aan [artikel 2.12, eerste lid, aanhef en onder a, onder 3°][ref1], gezonden aan
      diegenen die in de kadastrale registratie staan vermeld als eigenaar van de in het ontwerpbesluit begrepen
      gronden of als beperkt gerechtigde op die gronden, voor zover dat nodig is met het oog op de toepassing van
      [artikel 85 van de onteigeningswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel85
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '85'
  - number: 3.12.3
    text: |-
      In gevallen waarin een ander bestuursorgaan dan burgemeester en wethouders bevoegd gezag is, ligt het
      ontwerpbesluit, met de daarop betrekking hebbende stukken die redelijkerwijs nodig zijn voor een beoordeling van
      het ontwerpbesluit, tevens ter inzage in de gemeente waar het betrokken project in hoofdzaak zal worden of wordt
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
  - number: 3.12.4
    text: |-
      Het bevoegd gezag zendt het orgaan dat bevoegd is een verklaring te geven en in bij of krachtens algemene maatregel
      van bestuur aangewezen categorieën gevallen de daarbij aangewezen bestuursorganen het ontwerpbesluit met de daarop
      betrekking hebbende stukken die redelijkerwijs nodig zijn voor een beoordeling van het ontwerpbesluit, alsmede een
      afschrift van de beschikking op de aanvraag om een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
  - number: 3.12.5
    text: |-
      Eenieder kan zienswijzen bij het bevoegd gezag naar voren brengen. Voor zover een ontwerpbesluit zijn grondslag
      vindt in een aanwijzing als bedoeld in [artikel 3.13, tweede lid][ref1], die betrekking heeft op een daarbij
      concreet aangegeven plaats, kunnen zienswijzen daarop geen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.12.6
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 2.26][ref1] kan worden bepaald dat in daarbij aangewezen
      categorieën gevallen een andere, daarbij aan te geven termijn geldt voor het uitbrengen van advies, dan die bedoeld
      in [artikel 3:16 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.12.7
    text: |-
      In afwijking van [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref1] vangt de beslistermijn,
      bedoeld in dat lid, aan op de dag na de datum waarop het orgaan, bedoeld in [artikel 3.1, tweede lid][ref2], de
      aanvraag heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.12.8
    text: |-
      De in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1] bedoelde termijn voor verlenging van de
      termijn waarbinnen het bevoegd gezag op de aanvraag beslist, bedraagt ten hoogste zes weken. De termijn waarbinnen
      het bevoegd gezag op de aanvraag beslist, kan ten hoogste eenmaal worden verlengd. De verlenging en de duur daarvan
      wordt, met inachtneming van de in [artikel 3:18, tweede lid][ref2], bedoelde termijn van acht weken, gemotiveerd
      aan de aanvrager medegedeeld. [Artikel 31, vierde lid, van de Dienstenwet][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel31
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0026759
        artikel: '31'
  - number: 3.13.1
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 2.12, eerste lid, aanhef en onder a, onder 3°][ref1],
      en gedeputeerde staten of de inspecteur daaromtrent een zienswijze naar voren hebben gebracht, die niet is
      overgenomen, wordt de beschikking op de aanvraag hun onverwijld toegezonden en wordt zij eerst zes weken na die
      toezending bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.13.2
    text: |-
      In een geval als bedoeld in het eerste lid kunnen gedeputeerde staten, onderscheidenlijk Onze
      Minister, onverminderd andere aan hen toekomende bevoegdheden, binnen de in dat lid genoemde
      termijn met betrekking tot het betrokken onderdeel van de beschikking op de aanvraag aan het
      bevoegd gezag een aanwijzing als bedoeld in [artikel 4.2, eerste lid][ref1], onderscheidenlijk
      [artikel 4.4, eerste lid, onder a, van de Wet ruimtelijke ordening][ref2] geven, ertoe strekkende dat het onderdeel
      geen deel blijft uitmaken van de beschikking op de aanvraag die is gegeven. De kennisgeving van het besluit
      tot aanwijzing geschiedt tevens langs elektronische weg. [Artikel 4.2, tweede tot en met vierde lid][ref3],
      onderscheidenlijk [artikel 4.4, tweede tot en met vierde lid, van die wet][ref4] is op die aanwijzing niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 3.13.3
    text: |-
      Gedeputeerde staten, onderscheidenlijk Onze Minister vermelden in het besluit, houdende de aanwijzing, de
      daaraan ten grondslag liggende feiten, omstandigheden en overwegingen die hen beletten het betrokken provinciaal,
      onderscheidenlijk nationaal belang met inzet van andere aan hen toekomende bevoegdheden te beschermen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Indien toepassing is gegeven aan het eerste tot en met derde lid, wordt de beschikking op de aanvraag
      tegelijkertijd en op dezelfde wijze met het besluit, houdende de aanwijzing, bekendgemaakt. In afwijking van het
      eerste lid geschiedt die bekendmaking binnen zeven weken na de toezending, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Van het besluit houdende de aanwijzing wordt mededeling gedaan aan diegenen die ten aanzien van het onderdeel
      van de beschikking op de aanvraag dat bij dat besluit is betrokken een zienswijze naar voren hebben gebracht. De
      termijn voor indiening van een beroepschrift tegen het besluit houdende de aanwijzing vangt aan met ingang van de
      dag na die waarop dit besluit ter inzage is gelegd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.13
  - number: 3.13.6
    text: |-
      Het onderdeel, bedoeld in het tweede lid, vervalt van rechtswege op het tijdstip dat het besluit, houdende de
      aanwijzing, onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.13
  - number: 3.15.1
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van een door het bevoegd gezag ambtshalve gegeven
      beschikking tot wijziging van een omgevingsvergunning of voorschriften van een omgevingsvergunning of tot gehele of
      gedeeltelijke intrekking van een omgevingsvergunning:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.15
  - number: 3.15.1.a
    text: |-
      doet het mededeling van die beschikking in een of meer dag-, nieuws- of huis-aan-huisbladen of op een andere
      geschikte wijze;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.15
  - number: 3.15.1.b
    text: |-
      zendt het in bij algemene maatregel van bestuur aangewezen categorieën gevallen de daarbij aangewezen
      bestuursorganen een afschrift van die beschikking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.15
  - number: 3.15.2
    text: |-
      Met betrekking tot een aanvraag om wijziging van voorschriften van de omgevingsvergunning of gehele
      of gedeeltelijke intrekking van de omgevingsvergunning zijn de [artikelen 3.1][ref1], [3.8][ref2] en
      [3.9, eerste en tweede lid][ref3], van overeenkomstige toepassing. Indien de vergunninghouder de wijziging van
      voorschriften van de omgevingsvergunning of de gehele of gedeeltelijke intrekking van de omgevingsvergunning
      aanvraagt, zijn tevens het [derde en vierde lid van artikel 3.9][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.15.3
    text: |-
      In afwijking van het eerste en tweede lid is op de voorbereiding van een beschikking tot wijziging van
      voorschriften van een omgevingsvergunning of gehele of gedeeltelijke intrekking van een omgevingsvergunning
      [paragraaf 3.3][ref1] van overeenkomstige toepassing indien de beschikking betrekking heeft op activiteiten
      of gevallen als bedoeld in [artikel 3.10, eerste lid][ref2], met uitzondering van activiteiten als bedoeld in
      onderdeel c van dat lid met betrekking tot mijnbouwwerken en van activiteiten als bedoeld in het derde lid van dat
      artikel. De eerste volzin geldt niet indien toepassing wordt gegeven aan [artikel 2.32][ref3] of [3.23][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.16'
    text: |-
      In gevallen waarin een omgevingsvergunning of een wijziging van voorschriften van een omgevingsvergunning wordt
      aangevraagd op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is
      en die betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref2], met betrekking
      tot een inrichting waartoe een gpbv-installatie behoort, waarbij sprake is van het lozen van stoffen als bedoeld
      in [artikel 6.1 van de Waterwet][ref3], worden, indien daarvoor krachtens [artikel 6.2 van die wet][ref4] een
      vergunning vereist is op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] van
      toepassing is, bij de toepassing van deze wet de bepalingen van deze paragraaf in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '3.17'
    text: |-
      Indien in de vergunning krachtens de [Waterwet][ref1] een bepaling wordt opgenomen als bedoeld in
      [artikel 2.23][ref2] over de termijn waarvoor zij geldt, kan een gelijke bepaling worden opgenomen in de
      omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 3.18.1
    text: |-
      De aanvraag om een omgevingsvergunning of wijziging van voorschriften van een omgevingsvergunning overeenkomstig
      [artikel 2.31][ref1] wordt tegelijk ingediend met de aanvraag om verlening of wijziging van de vergunning krachtens
      [artikel 6.2 van de Waterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.18.2
    text: |-
      Indien de aanvraag om verlening of wijziging van de vergunning krachtens [artikel 6.2 van de Waterwet][ref1]
      niet is ingediend binnen zes weken na het tijdstip waarop de aanvraag om de omgevingsvergunning of wijziging
      van voorschriften van de omgevingsvergunning is ingediend, wordt de aanvraag om de omgevingsvergunning buiten
      behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.18.3
    text: |-
      Indien de aanvraag om verlening of wijziging van de vergunning krachtens [artikel 6.2 van de Waterwet][ref1] buiten
      behandeling wordt gelaten, wordt de aanvraag om de omgevingsvergunning eveneens buiten behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.19.1
    text: |-
      Het bestuursorgaan dat tot verlening van de vergunning krachtens [artikel 6.2 van de Waterwet][ref1] bevoegd is,
      brengt een advies uit met het oog op de samenhang tussen de beschikkingen op de onderscheidene aanvragen. Het
      advies wordt uitgebracht binnen acht weken na ontvangst van de aanvraag om de omgevingsvergunning of wijziging
      van voorschriften van de omgevingsvergunning. [Artikel 3.11, derde lid, tweede en derde volzin][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.19.2
    text: |-
      Het orgaan dat tot verlening van de vergunning krachtens [artikel 6.2 van de Waterwet][ref1] bevoegd is, wordt
      voorts in de gelegenheid gesteld advies uit te brengen over het ontwerp van de beschikking op de aanvraag om de
      omgevingsvergunning of wijziging van voorschriften van de omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.20.1
    text: |-
      Indien burgemeester en wethouders bevoegd zijn de beschikking op de aanvraag om de omgevingsvergunning
      of wijziging van voorschriften van de omgevingsvergunning te verlenen, kunnen gedeputeerde staten, indien
      dat met het oog op de samenhang tussen de beschikkingen op de onderscheidene aanvragen in het belang
      van de bescherming van het milieu geboden is, en zo nodig in afwijking van regels, gesteld krachtens
      [artikel 1.3c van de Wet milieubeheer][ref1], op een daartoe strekkend verzoek van het orgaan dat bevoegd is de
      vergunning krachtens [artikel 6.2 van de Waterwet][ref2] te verlenen, aan burgemeester en wethouders een aanwijzing
      geven ter zake van de inhoud van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.20.2
    text: |-
      Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvraag
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.20.3
    text: |-
      De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een exemplaar
      ervan wordt gevoegd bij ieder exemplaar van die beschikking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      De motivering van de beschikking vermeldt in ieder geval de invloed die de samenhang tussen de beschikkingen op de
      onderscheidene aanvragen heeft gehad op de inhoud van de omgevingsvergunning of de beschikking tot wijziging van
      voorschriften van de omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.21
  - number: '3.22'
    text: |-
      Ten aanzien van een wijziging van voorschriften van een omgevingsvergunning anders dan op aanvraag zijn de
      [artikelen 3.16][ref1], [3.17][ref2], [3.19][ref3], [3.20][ref4] en [3.21][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.23'
    text: |-
      Het bevoegd gezag kan een omgevingsvergunning geheel of gedeeltelijk intrekken, indien de krachtens
      [artikel 6.2 van de Waterwet][ref1] verleende vergunning geheel of gedeeltelijk wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 4.1.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in daarbij aangewezen categorieën gevallen waarin een
      omgevingsvergunning betrekking heeft op een activiteit die ernstige nadelige gevolgen voor de fysieke leefomgeving
      kan hebben, degene die de activiteit verricht, verplicht is tot het stellen van financiële zekerheid:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.1
  - number: 4.1.1.a
    text: voor het nakomen van krachtens de omgevingsvergunning voor hem geldende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      ter dekking van zijn aansprakelijkheid voor schade die voortvloeit uit door de activiteit veroorzaakte nadelige
      gevolgen voor de fysieke leefomgeving.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Bij de maatregel worden regels gesteld met betrekking tot de vorm waarin, het bedrag waarvoor en de termijn
      gedurende welke de zekerheid in stand wordt gehouden en over de voorwaarden waaraan moet zijn voldaan voordat de
      verplichting komt te vervallen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      In gevallen als bedoeld in het eerste lid, onder a, bepaalt het bevoegd gezag tot welk bedrag het verhaal neemt
      op de zekerheid bij het niet-nakomen van een verplichting. Het bevoegd gezag kan het te verhalen bedrag invorderen
      bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.1
  - number: 4.2.1
    text: 'Het bevoegd gezag kent degene tot wie een beschikking is gericht krachtens:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel4.2
