    text: |-
      deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1], indien de
      omstandigheden aan de kant van de vergunninghouder zodanig zijn gewijzigd dat het belang van de monumentenzorg
      zwaarder moet wegen;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.33.2.f
    text: |-
      deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder i][ref1], op de gronden die
      zijn aangegeven in de betrokken algemene maatregel van bestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.33.2.g
    text: |-
      deze betrekking heeft op een activiteit als bedoeld in [artikel 2.2][ref1], op de gronden die zijn aangegeven in de
      betrokken verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.33.2.h
    text: |-
      deze betrekking heeft op een activiteit als bedoeld in [artikel 2.19][ref1], op de gronden die zijn aangegeven in
      het betrokken wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.33.3
    text: |-
      Voor zover een verzoek van een vergunninghouder tot gehele of gedeeltelijke intrekking van een omgevingsvergunning
      betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref1], trekt het bevoegd gezag
      de omgevingsvergunning slechts geheel of gedeeltelijk in, indien het belang van de bescherming van het milieu zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.33a.1
    text: |-
      In een geval behorende tot een krachtens [artikel 4.1][ref1] aangewezen categorie kan een voorschrift
      overeenkomstig de betrokken algemene maatregel van bestuur aan een beschikking tot gehele of gedeeltelijke
      intrekking van de omgevingsvergunning worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 2.33a.2
    text: |-
      In een beschikking als bedoeld in het eerste lid kan worden bepaald dat een voorschrift als bedoeld in het eerste
      lid, dan wel daarbij aangegeven aan de omgevingsvergunning verbonden voorschriften gedurende een daarbij aan te
      geven termijn blijven gelden.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel2.33a
  - number: 3.1.1
    text: |-
      De aanvraag om een omgevingsvergunning wordt ingediend bij burgemeester en wethouders van de gemeente waar het
      betrokken project in hoofdzaak zal worden of wordt uitgevoerd. Indien burgemeester en wethouders niet bevoegd zijn
      op de aanvraag te beslissen, kan de aanvraag bij het bevoegd gezag worden ingediend. In dat geval zendt het bevoegd
      gezag een afschrift van de aanvraag aan burgemeester en wethouders van de gemeente waar het betrokken project in
      hoofdzaak zal worden of wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het orgaan waarbij de aanvraag is ingediend, zendt de aanvrager onverwijld een bewijs van ontvangst
      van de aanvraag, waarin het de datum vermeldt, waarop het de aanvraag heeft ontvangen. In afwijking van
      [artikel 14, eerste lid, aanhef en onder b, van de Dienstenwet][ref1] geldt de daarin gestelde verplichting voor
      zover deze betrekking heeft op het bewijs van ontvangst, bedoeld in de eerste volzin, voor het orgaan waarbij de
      aanvraag is ingediend. [Artikel 29 van de Dienstenwet][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel29
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '29'
  - number: 3.1.3
    text: |-
      Het bevoegd gezag zendt de aanvrager nadat het de aanvraag heeft ontvangen, zo snel mogelijk een bericht waarin het
      vermeldt dat het bevoegd is op de aanvraag te beslissen en waarin tevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
  - number: 3.1.3.a
    text: de procedure die ter voorbereiding van de beslissing zal worden gevolgd,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
  - number: 3.1.3.b
    text: welke beslistermijn van toepassing is, en
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
  - number: 3.1.3.c
    text: de beschikbare rechtsmiddelen om tegen de beschikking op te komen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen waarin het bevoegd gezag de
      aanvraag of andere gegevens of bescheiden zendt aan daarbij aangewezen categorieën bestuursorganen of andere
      instanties.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
  - number: 3.1.5
    text: |-
      Indien bij de voorbereiding van de beslissing op de aanvraag een milieueffectrapport moet worden gemaakt, is
      [artikel 13.2 van de Wet milieubeheer][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
  - number: '3.2'
    text: |-
      Voor zover het belang van de veiligheid van de Staat dat vereist, kan het bevoegd gezag de toepassing van
      [afdeling 3.4][ref1] en [artikel 3:44 van de Algemene wet bestuursrecht][ref2] en van de [artikelen 2.26][ref3] en
      [3.19][ref4] geheel of gedeeltelijk achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.2a
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1],
      ter zake van een kerkelijk monument als bedoeld in [artikel 1, onder e, van de Monumentenwet 1988][ref2], neemt
      het bevoegd gezag geen beslissing dan na overleg met de eigenaar. Voor zover het betreft een beslissing waarbij
      wezenlijke belangen van het belijden van de godsdienst of levensovertuiging in dat monument in het geding zijn,
      neemt het bevoegd gezag geen beslissing dan in overeenstemming met de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel1
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '1'
  - number: 3.3.1
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a of b][ref1],
      houdt het bevoegd gezag, in afwijking van [artikel 3.9, eerste lid][ref2], onderscheidenlijk
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3], de beslissing aan, indien er geen grond is de vergunning te
      weigeren maar voor het gebied waarin de activiteit zal worden verricht vóór de dag van ontvangst van de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.3.1.a
    text: een voorbereidingsbesluit in werking is getreden;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.1.b
    text: een bestemmingsplan in ontwerp ter inzage is gelegd;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.1.c
    text: |-
      een verklaring als bedoeld in [artikel 4.1, vijfde lid][ref1], of
      [4.3, vierde lid, van de Wet ruimtelijke ordening][ref2] is bekendgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 3.3.1.d
    text: een bestemmingsplan is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.1.e
    text: een bestemmingsplan na vaststelling is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.2
    text: 'De aanhouding duurt totdat:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.2.a
    text: |-
      het voorbereidingsbesluit overeenkomstig [artikel 3.7, vijfde of zesde lid, van de Wet ruimtelijke ordening][ref1]
      is vervallen;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 3.3.2.b
    text: |-
      de termijn voor de vaststelling van het bestemmingsplan ingevolge
      [artikel 3.8, eerste lid, onder e, van de Wet ruimtelijke ordening][ref1] is overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 3.3.2.c
    text: |-
      de termijn voor de bekendmaking van het bestemmingsplan na de vaststelling ingevolge
      [artikel 3.8, derde, vierde of zesde lid, van de Wet ruimtelijke ordening][ref1] is overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 3.3.2.d
    text: het bestemmingsplan in werking is getreden dan wel in beroep is vernietigd;
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.2.e
    text: |-
      de termijn, genoemd in [artikel 4.1, vijfde lid][ref1], of [4.3, vierde lid, van de Wet ruimtelijke ordening][ref2]
      is overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 3.3.2.f
    text: |-
      de verordening, bedoeld in [artikel 4.1, van de Wet ruimtelijke ordening][ref1] of de algemene maatregel van
      bestuur, bedoeld in [artikel 4.3, van die wet][ref2] in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 3.3.3
    text: |-
      In afwijking van het eerste lid, eerste volzin, kan het bevoegd gezag de omgevingsvergunning verlenen, indien de
      activiteit niet in strijd is met het in voorbereiding zijnde bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a of b][ref1],
      houdt het bevoegd gezag, in afwijking van [artikel 3.9, eerste lid][ref2], onderscheidenlijk
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3], de beslissing tevens aan, indien er geen grond is de
      vergunning te weigeren en de aanvraag een activiteit betreft in een gebied waarvoor vóór de datum van ontvangst van
      de aanvraag een besluit tot aanwijzing als beschermd stads- of dorpsgezicht is bekendgemaakt en waarvoor nog geen
      ter bescherming daarvan strekkend bestemmingsplan of beheersverordening geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.3.5
    text: |-
      De aanhouding, bedoeld in het vierde lid, duurt totdat een ter voldoening aan
      [artikel 36 van de Monumentenwet 1988][ref1] vast te stellen bestemmingsplan of beheersverordening in werking is
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel36
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '36'
  - number: 3.3.6
    text: |-
      Het bevoegd gezag kan, in afwijking van het vierde lid, de vergunning verlenen indien de activiteit niet in
      strijd is met het in voorbereiding zijnde ter bescherming van het beschermde stads- of dorpsgezicht strekkende
      bestemmingsplan. Alvorens te besluiten hoort het bevoegd gezag Onze Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder g of h][ref1],
      kan het bevoegd gezag, in afwijking van [artikel 3.9, eerste lid][ref2], onderscheidenlijk
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3] de beslissing aanhouden, indien voor een bouwwerk dat zal
      worden gebouwd in plaats van het te slopen bouwwerk, een omgevingsvergunning is aangevraagd, maar op die aanvraag
      nog niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.4.2
    text: |-
      In een geval als bedoeld in het eerste lid duurt de aanhouding totdat onherroepelijk op de aanvraag om de
      omgevingsvergunning is beslist.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder a of b][ref1],
      en daarop een exploitatieplan van toepassing is, houdt het bevoegd gezag, in afwijking van
      [artikel 3.9, eerste lid][ref2], onderscheidenlijk [artikel 3:18 van de Algemene wet bestuursrecht][ref3], de
      beslissing aan, indien er geen grond is de vergunning te weigeren en het exploitatieplan, dat voor de in de
      aanvraag begrepen grond is vastgesteld, nog niet onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 3.5.2
    text: De aanhouding duurt totdat een exploitatieplan onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag de omgevingsvergunning verlenen indien een ingesteld beroep
      geen gevolgen kan hebben voor de beoordeling van de aangevraagde activiteit of de aan de omgevingsvergunning voor
      die activiteit te verbinden voorschriften, dan wel indien deze gevolgen naar het oordeel van het bevoegd gezag niet
      opwegen tegen het belang dat met verlening van de omgevingsvergunning is gediend.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      Het bevoegd gezag doet van de aanhouding op grond van [artikel 3.3][ref1] of [3.5][ref2] mededeling aan de
      aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.6.2
    text: |-
      In gevallen waarin een beslissing op de aanvraag om een omgevingsvergunning wordt
      aangehouden wordt voor de toepassing van [artikel 3.9][ref1], onderscheidenlijk
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref2] in plaats van de datum waarop de aanvraag is
      ontvangen uitgegaan van de datum waarop de aanhouding eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
