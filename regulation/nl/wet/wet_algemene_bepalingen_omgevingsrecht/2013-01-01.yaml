  - number: 7.5.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in de gevallen waarin een van Onze Ministers het bevoegd
      gezag is aan een provincie, gemeente of waterschap een alleenrecht als bedoeld in artikel 18 van richtlijn nr.
      2004/18/EG van het Europees Parlement en de Raad van 31 maart 2004 betreffende de coördinatie van de procedures
      voor het plaatsen van overheidsopdrachten voor werken, leveringen en diensten (PbEG L 134) wordt verleend met
      betrekking tot daarbij aangewezen categorieën werkzaamheden in het kader van de voorbereiding van een beschikking
      met betrekking tot een omgevingsvergunning of in het kader van bezwaar of beroep tegen een beschikking met
      betrekking tot een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Bij provinciale verordening kan worden bepaald dat in de gevallen waarin gedeputeerde staten het bevoegd gezag
      zijn aan een gemeente of waterschap een alleenrecht als bedoeld in het eerste lid wordt verleend met betrekking tot
      daarbij aangewezen categorieën werkzaamheden in het kader van de voorbereiding van een beschikking met betrekking
      tot een omgevingsvergunning of in het kader van bezwaar of beroep tegen een beschikking met betrekking tot een
      omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.5
  - number: 7.5.3
    text: 'Een alleenrecht kan slechts worden verleend:'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.5
  - number: 7.5.3.a
    text: |-
      aan de provincie of gemeente waar een activiteit waarop de voorbereiding van de beschikking betrekking heeft, in
      hoofdzaak wordt verricht of zal worden verricht,
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.5
  - number: 7.5.3.b
    text: |-
      voor zover de voorbereiding van de beschikking betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], waarbij vanuit een inrichting of mijnbouwwerk afvalwater of andere
      afvalstoffen in een voorziening voor de inzameling en het transport van afvalwater zijn of worden gebracht, aan het
      waterschap waartoe het bestuursorgaan behoort dat zorg draagt voor het beheer van het zuiveringstechnisch werk of
      het oppervlaktewater waarop het afvalwater vanuit die voorziening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.5.4
    text: |-
      Een wijziging van artikel 18 van de richtlijn, bedoeld in het eerste lid, gaat voor de toepassing van het eerste en
      tweede lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.5
  - number: 7.6.1
    text: |-
      Er is een landelijke voorziening waarin gegevens en bescheiden worden opgenomen die betrekking hebben op aanvragen
      om een omgevingsvergunning die geheel of gedeeltelijk elektronisch worden ingediend alsmede op aanvragen om daarop
      volgende beschikkingen.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Het bevoegd gezag en de bestuursorganen die zijn betrokken bij de beslissing omtrent de verlening van een
      omgevingsvergunning, maken gebruik van de voorziening, bedoeld in het eerste lid. Het bevoegd gezag draagt zorg
      voor het beheer van de in de voorziening opgenomen gegevens en bescheiden en de verstrekking daarvan aan de
      bestuursorganen, bedoeld in de eerste volzin. Bij of krachtens algemene maatregel van bestuur kunnen regels worden
      gesteld omtrent dat beheer en die verstrekking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.6
  - number: 7.6.3
    text: |-
      Onze Minister draagt zorg voor de inrichting, instandhouding, werking en beveiliging van de voorziening, bedoeld in
      het eerste lid. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      inrichting, instandhouding, werking en beveiliging van die voorziening.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.6
  - number: 8.1.1
    text: |-
      Indien voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref1], met betrekking tot een
      inrichting, het in de aanhef van dat artikel bedoelde verbod op enig tijdstip gaat gelden, dat voor die
      activiteit voordien niet gold, kan de activiteit indien daarmee op dat tijdstip al was begonnen, zonder vergunning
      worden voortgezet tot twaalf weken na dat tijdstip en, indien binnen die termijn een aanvraag om de vereiste
      omgevingsvergunning is ingediend, vervolgens tot acht weken na het tijdstip waarop de beschikking op de aanvraag in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.1.2
    text: |-
      Indien het verbod gaat gelden ten gevolge van een verandering van de activiteit, is het eerste lid niet van
      toepassing voor zover het die verandering betreft.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.1
  - number: 8.1.3
    text: |-
      Indien voor de activiteit algemene regels golden voor het tijdstip waarop het verbod daarvoor ging gelden, blijven
      die regels voor de activiteit van toepassing gedurende de periode waarin zij zonder vergunning mag worden verricht.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.1
  - number: 8.2.1
    text: |-
      Indien bij of krachtens een wettelijk voorschrift of door een verandering van een project de bevoegdheid te
      beslissen op aanvragen om een omgevingsvergunning overgaat naar een ander bestuursorgaan, worden de voor dat
      project al verleende omgevingsvergunningen gelijkgesteld met omgevingsvergunningen, verleend door dat andere
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.2
  - number: 8.2.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot een overgang als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Deze wet is, voor zover deze betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], niet van toepassing op inrichtingen waarvoor een vergunning is vereist
      krachtens [artikel 15, onder b, van de Kernenergiewet][ref2], behoudens voor zover uit de bepalingen van die wet
      anders blijkt. Deze wet is evenmin van toepassing op inrichtingen, voor zover daarvoor bij of krachtens andere dan
      in de eerste volzin genoemde bepalingen van [die wet][ref3] vergunning is vereist of algemene voorschriften gelden,
      behoudens voor zover uit de bij of krachtens [die wet][ref4] gestelde bepalingen anders blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002402
      [ref4]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0002402
      - id: ref4
        bwb_id: BWBR0002402
  - number: 8.3.2
    text: |-
      Deze wet is, voor zover deze betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], niet van toepassing op inrichtingen of mijnbouwwerken, voor zover
      daarvoor een vergunning is vereist of algemene voorschriften gelden krachtens de [artikelen 3.1][ref2],
      [3.3 tot en met 3.6][ref3], [6.4][ref4] en [7.1 van de Wet dieren][ref5] met betrekking tot dierlijke bijproducten
      of de [Waterwet][ref6], behoudens voor zover uit de bepalingen van die wetten anders blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0025458
  - number: 8.3.3
    text: |-
      Deze wet is, voor zover deze betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], niet van toepassing op inrichtingen waarin van buiten de inrichting
      afkomstige dierlijke meststoffen in de zin van de [Meststoffenwet][ref2] worden bewaard, bewerkt, verwerkt of
      vernietigd, voor zover het een doelmatig beheer van die stoffen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0004054
  - number: '8.4'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.4
  - number: '8.5'
    text: 'Deze wet wordt aangehaald als: Wet algemene bepalingen omgevingsrecht.'
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel8.5
