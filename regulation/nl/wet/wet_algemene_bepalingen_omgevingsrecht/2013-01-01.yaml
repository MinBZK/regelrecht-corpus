  - number: '3.8'
    text: |-
      Het bevoegd gezag geeft bij de toepassing van [titel 4.1 van de Algemene wet bestuursrecht][ref1] tevens onverwijld
      kennis van de aanvraag om een omgevingsvergunning in een of meer dag-, nieuws- of huis-aan-huisbladen of op een
      andere geschikte wijze. Het vermeldt daarbij de in [artikel 3.1, tweede lid][ref2], bedoelde datum waarop de
      aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.9.1
    text: |-
      Het bevoegd gezag beslist op de aanvraag om een omgevingsvergunning binnen acht weken na de datum van ontvangst van
      de aanvraag. Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking:
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.9
  - number: 3.9.1.a
    text: |-
      doet het mededeling van die beschikking op de wijze waarop het overeenkomstig [artikel 3.8][ref1] kennis heeft
      gegeven van de aanvraag, en


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.9.1.b
    text: |-
      zendt het in bij algemene maatregel van bestuur aangewezen categorieën gevallen de daarbij aangewezen
      bestuursorganen een afschrift van die beschikking.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Het bevoegd gezag kan de in het eerste lid bedoelde termijn eenmaal met ten hoogste zes weken verlengen. Het maakt
      zijn besluit daartoe bekend binnen de eerstbedoelde termijn. Het doet daarvan tevens zo spoedig mogelijk mededeling
      op de wijze waarop het overeenkomstig [artikel 3.8][ref1] kennis heeft gegeven van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.9.3
    text: |-
      [Paragraaf. 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is, met uitzondering van de
      [artikelen 4:20b, derde lid][ref2], en [4:20f][ref3], van toepassing op de voorbereiding van de beslissing op de
      aanvraag. Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen waarin de voorbereiding
      van de beslissing op een aanvraag wegens strijd met een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie is uitgezonderd van de toepassing van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.9.4
    text: |-
      Het bevoegd gezag doet zo spoedig mogelijk mededeling van de bekendmaking, bedoeld in
      [artikel 4:20c van de Algemene wet bestuursrecht][ref1], op de wijze waarop het overeenkomstig [artikel 3.8][ref2]
      kennis heeft gegeven van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel3.9
