  - number: 6.5.1
    text: |-
      Het beroep tegen een beschikking inzake een verklaring als bedoeld in [artikel 2.27][ref1] kan door het ten
      aanzien van de beschikking waarop de verklaring betrekking heeft, bevoegde gezag eerst worden ingesteld nadat die
      beschikking is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 6.5.2
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de beroepstermijn in
      een geval als bedoeld in het eerste lid aan met ingang van de dag na de dag waarop overeenkomstig
      [artikel 3.9, eerste of vierde lid][ref2], of [artikel 3:44 van de Algemene wet bestuursrecht][ref3] mededeling
      is gedaan van de beschikking waarop de verklaring of het verzoek betrekking heeft. De bepalingen met betrekking
      tot het beroep tegen die beschikking zijn van overeenkomstige toepassing met betrekking tot het beroep tegen de
      beschikking inzake de verklaring of de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 6.5b.1
    text: |-
      De stichting, bedoeld in [artikel 20.15 van de Wet milieubeheer][ref1], heeft tevens tot taak aan de
      bestuursrechter op diens verzoek deskundigenbericht uit te brengen inzake beroepen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.5b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
  - number: 6.5b.2
    text: |-
      [Artikel 20.17 van de Wet milieubeheer][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel6.5b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
  - number: '7.1'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een provincie of gemeente,
      worden, voor zover nodig, bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen
      die de in deze wet vervatte bevoegdheden uitoefenen, en ten aanzien van de bestuursorganen die bij die uitvoering
      dienen te worden betrokken.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Onze Minister zendt binnen vijf jaar nadat deze wet in werking treedt, aan de Staten-Generaal een verslag omtrent
      de werking van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van
      het eerste lid. Deze regels kunnen voor daarbij aangewezen bestuursorganen de verplichting inhouden op een daarbij
      aan te geven wijze de gegevens te verstrekken, die voor de opstelling van het verslag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.3
  - number: 7.3.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024779/2013-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      De voordracht voor een krachtens [artikel 1.1, derde lid][ref1], [2.1, eerste lid, onder d][ref2],
      [2.1, derde lid][ref3], [2.4, tweede of derde lid][ref4], [2.8, eerste lid][ref5], [2.9, tweede lid][ref6],
      [2.22, derde lid][ref7], [2.23, tweede lid][ref8], [2.24, eerste lid][ref9], [2.25, tweede of derde lid][ref10],
      [2.27, eerste of derde lid][ref11], [2.29, eerste lid, onder a][ref12], [3.9, eerste lid, onder b][ref13],
      [3.12, tweede lid, onder a, vierde of zesde lid][ref14], [4.1, eerste lid][ref15], of [5.3][ref16] vast te stellen
      algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.


