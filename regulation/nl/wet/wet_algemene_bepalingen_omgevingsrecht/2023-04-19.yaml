    text: |-
      1 Het bevoegd gezag zendt het bestuursorgaan dat bevoegd is een verklaring te geven als bedoeld in
      [artikel 2.27][ref1], onverwijld een exemplaar van de aanvraag en de daarbij gevoegde stukken.

      2 Op verzoek van het bestuursorgaan geeft het bevoegd gezag toepassing aan
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2], voor zover dat nodig is voor de beoordeling van de
      onderdelen van de aanvraag waaromtrent de verklaring is vereist.

      3 Zienswijzen die overeenkomstig [artikel 3:15 van de Algemene wet bestuursrecht][ref3] naar voren worden gebracht,
      en adviezen van de krachtens [artikel 2.26][ref4] aangewezen adviseurs kunnen mede betrekking hebben op het ontwerp
      van de verklaring. Voor zover dat het geval is, zendt het bevoegd gezag ze onverwijld aan het bestuursorgaan dat de
      verklaring geeft. Dit deelt zijn oordeel daarover mee aan het bevoegd gezag.

      4 Indien dat met het oog op de voorbereiding van de verklaring nodig is, kan het bestuursorgaan dat bevoegd is de
      verklaring te geven, het bevoegd gezag verzoeken de termijn waarbinnen de beslissing op de aanvraag moet worden
      genomen, te verlengen met toepassing van [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref5] juncto
      [artikel 3.12, achtste lid][ref6]. Het bevoegd gezag verlengt de termijn overeenkomstig het verzoek.


