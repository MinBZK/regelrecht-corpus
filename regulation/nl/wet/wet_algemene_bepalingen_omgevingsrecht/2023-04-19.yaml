  - number: '2.10'
    text: |-
      1 Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a][ref1], wordt de omgevingsvergunning geweigerd indien:

      a. de aanvraag en de daarbij verstrekte gegevens en bescheiden het naar het oordeel van het bevoegd gezag niet
      aannemelijk maken dat het bouwen van een bouwwerk waarop de aanvraag betrekking heeft, voldoet aan de voorschriften
      die zijn gesteld bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2][ref2] of
      [120 van de Woningwet][ref3];

      b. de aanvraag en de daarbij verstrekte gegevens en bescheiden het naar het oordeel van het bevoegd gezag niet
      aannemelijk maken dat het bouwen van een bouwwerk waarop de aanvraag betrekking heeft, voldoet aan de voorschriften
      die zijn gesteld bij de bouwverordening of, zolang de bouwverordening daarmee nog niet in overeenstemming
      is gebracht, met de voorschriften die zijn gesteld bij een algemene maatregel van bestuur als bedoeld in
      [artikel 8, achtste lid, van de Woningwet][ref4] dan wel bij of krachtens een algemene maatregel van bestuur als
      bedoeld in [artikel 120 van die wet][ref5];

      c. de activiteit in strijd is met het bestemmingsplan, de beheersverordening of het
      exploitatieplan, of de regels die zijn gesteld krachtens [artikel 4.1, derde lid][ref6],
      of [4.3, derde lid, van de Wet ruimtelijke ordening][ref7], tenzij de activiteit niet in strijd is met een
      omgevingsvergunning die is verleend met toepassing van [artikel 2.12][ref8];

      d. het uiterlijk of de plaatsing van het bouwwerk waarop de aanvraag betrekking heeft, met uitzondering van
      een tijdelijk bouwwerk dat geen seizoensgebonden bouwwerk is, zowel op zichzelf beschouwd als in verband met de
      omgeving of de te verwachten ontwikkeling daarvan, in strijd is met redelijke eisen van welstand, beoordeeld naar
      de criteria, bedoeld in [artikel 12a, eerste lid, onder a, van de Woningwet][ref9], tenzij het bevoegd gezag van
      oordeel is dat de omgevingsvergunning niettemin moet worden verleend;

      e. de activiteit een wegtunnel als bedoeld in de [Wet aanvullende regels veiligheid wegtunnels][ref10] betreft
      en uit de aanvraag en de daarbij verstrekte gegevens en bescheiden blijkt dat niet wordt voldaan aan de in
      [artikel 6, eerste lid, van die wet][ref11] gestelde norm.

      2 In gevallen als bedoeld in het eerste lid, onder c, wordt de aanvraag mede aangemerkt als een aanvraag om een
      vergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref12], en wordt de vergunning
      op de grond, bedoeld in het eerste lid, onder c, slechts geweigerd indien vergunningverlening met toepassing van
      [artikel 2.12][ref13] niet mogelijk is.


