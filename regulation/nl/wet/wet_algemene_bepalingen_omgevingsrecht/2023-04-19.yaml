  - number: 3.2a
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1],
      ter zake van een kerkelijk monument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref2], neemt het bevoegd gezag
      geen beslissing dan na overleg met de eigenaar. Voor zover het betreft een beslissing waarbij wezenlijke belangen
      van het belijden van de godsdienst of levensovertuiging in dat monument in het geding zijn, neemt het bevoegd gezag
      geen beslissing dan in overeenstemming met de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
