  - number: '2.20'
    text: |-
      1 Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b][ref1], of in artikel 2.1, eerste lid, onder e, met betrekking tot een
      inrichting kan het bevoegd gezag de omgevingsvergunning in andere gevallen dan bedoeld in [artikel 2.10][ref2],
      [artikel 2.11][ref3], onderscheidenlijk [artikel 2.14][ref4] slechts weigeren in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref5], met
      dien verstande dat voor de toepassing van [artikel 3 van die wet][ref6], voor zover het deze wet betreft, onder
      betrokkene mede wordt verstaan degene die op grond van feiten en omstandigheden redelijkerwijs met de aanvrager van
      de omgevingsvergunning gelijk kan worden gesteld.

      2 Voordat toepassing wordt gegeven aan het eerste lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref7], om een advies als
      bedoeld in [artikel 9 van die wet][ref8] worden gevraagd.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat het tweede lid van overeenkomstige
      toepassing is op een aanvraag om een omgevingsvergunning met betrekking tot een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder i][ref9], waarvoor bij die maatregel is bepaald dat een omgevingsvergunning kan
      worden geweigerd in het geval en onder de voorwaarden, bedoeld in het eerste lid.


