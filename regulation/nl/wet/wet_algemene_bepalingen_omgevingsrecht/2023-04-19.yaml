  - number: '3.4'
    text: |-
      1 Indien de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder g of h][ref1], kan het bevoegd gezag, in afwijking van
      [artikel 3.9, eerste lid][ref2], onderscheidenlijk [artikel 3:18 van de Algemene wet bestuursrecht][ref3] de
      beslissing aanhouden, indien voor een bouwwerk dat zal worden gebouwd in plaats van het te slopen bouwwerk, een
      omgevingsvergunning is aangevraagd, maar op die aanvraag nog niet is beslist.

      2 In een geval als bedoeld in het eerste lid duurt de aanhouding totdat onherroepelijk op de aanvraag om de
      omgevingsvergunning is beslist.


