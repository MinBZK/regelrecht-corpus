  - number: '5.9'
    text: |-
      1 Gedeputeerde staten dragen binnen de provincie zorg voor de coördinatie van de uitvoering door de bevoegde
      bestuursorganen van het bepaalde bij of krachtens [artikel 5.7][ref1].

      2 Over de kwaliteit en doelmatigheid van de uitvoering en handhaving van het bepaalde bij of krachtens de betrokken
      wetten, bedoeld in [artikel 5.7][ref2], en over de strafrechtelijke handhaving van het bepaalde bij of krachtens
      de betrokken wetten, in de betreffende provincie, vindt regelmatig overleg plaats.

      3 Gedeputeerde staten stellen voor het in het tweede lid bedoelde overleg een of meer overlegorganen in. Op
      uitnodiging kunnen andere instanties, die belast zijn met de handhaving van het bepaalde bij of krachtens de
      betrokken wetten, deelnemen aan het overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5.7
