  - number: '3.16'
    text: |-
      In gevallen waarin een omgevingsvergunning of een wijziging van voorschriften van een omgevingsvergunning wordt
      aangevraagd op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is
      en die betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref2], met betrekking
      tot een inrichting waartoe een IPPC-installatie behoort, waarbij sprake is van een handeling waarvoor een
      watervergunning als bedoeld in [artikel 6.27, eerste lid, van de Waterwet][ref3] vereist is, worden, indien op
      de voorbereiding van die watervergunning afdeling 3.4 van de Algemene wet bestuursrecht van toepassing is, bij de
      toepassing van deze wet de bepalingen van deze paragraaf in acht genomen.


