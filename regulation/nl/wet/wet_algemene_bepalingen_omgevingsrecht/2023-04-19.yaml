    text: |-
      1 Het bevoegd gezag neemt bij de toepassing van de [afdelingen 3.4][ref1] en
      [3.6 van de Algemene wet bestuursrecht][ref2] het bepaalde in de volgende leden en de [artikelen 3.13][ref3] en
      [3.14][ref4] in acht.

      2 Een kennisgeving als bedoeld in [artikel 3:12][ref5] of
      [artikel 3:44, eerste lid, van de Algemene wet bestuursrecht][ref6] worden, indien toepassing is gegeven aan
      [artikel 2.12, eerste lid, aanhef en onderdeel a, onder 3°][ref7], gezonden aan diegenen die in de kadastrale
      registratie staan vermeld als eigenaar van de in het ontwerpbesluit begrepen gronden of als beperkt gerechtigde op
      die gronden, voor zover dat nodig is met het oog op de toepassing van [artikel 85 van de onteigeningswet][ref8].

      3 In gevallen waarin een ander bestuursorgaan dan het college van burgemeester en wethouders bevoegd gezag
      is, is de ten behoeve van de terinzagelegging van het ontwerpbesluit en de daarop betrekking hebbende stukken
      die redelijkerwijs nodig zijn voor een beoordeling van het ontwerpbesluit aan te wijzen locatie, bedoeld in
      [artikel 13, eerste lid, van de Bekendmakingswet][ref9] gelegen in de gemeente waar het betrokken project in
      hoofdzaak zal worden of wordt uitgevoerd.

      4 Het bevoegd gezag zendt het orgaan dat bevoegd is een verklaring te geven en in bij of krachtens algemene
      maatregel van bestuur aangewezen categorieën gevallen de daarbij aangewezen bestuursorganen het ontwerpbesluit met
      de daarop betrekking hebbende stukken die redelijkerwijs nodig zijn voor een beoordeling van het ontwerpbesluit,
      alsmede een afschrift van de beschikking op de aanvraag om een omgevingsvergunning.

      5 Eenieder kan zienswijzen bij het bevoegd gezag naar voren brengen. Voor zover een ontwerpbesluit zijn grondslag
      vindt in een aanwijzing als bedoeld in [artikel 3.13, tweede lid][ref10], die betrekking heeft op een daarbij
      concreet aangegeven plaats, kunnen zienswijzen daarop geen betrekking hebben.

      6 Bij een algemene maatregel van bestuur krachtens [artikel 2.26][ref11] kan worden bepaald dat in daarbij
      aangewezen categorieën gevallen een andere, daarbij aan te geven termijn geldt voor het uitbrengen van advies, dan
      die bedoeld in [artikel 3:16 van de Algemene wet bestuursrecht][ref12].

      7 In afwijking van [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref13] vangt de beslistermijn,
      bedoeld in dat lid, aan op de dag na de datum waarop het orgaan, bedoeld in [artikel 3.1, tweede lid][ref14], de
      aanvraag heeft ontvangen.

      8 De in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref15] bedoelde termijn voor verlenging
      van de termijn waarbinnen het bevoegd gezag op de aanvraag beslist, bedraagt ten hoogste zes weken. De termijn
      waarbinnen het bevoegd gezag op de aanvraag beslist, kan ten hoogste eenmaal worden verlengd. De verlenging en
      de duur daarvan wordt, met inachtneming van de in [artikel 3:18, tweede lid][ref16], bedoelde termijn van acht
      weken, gemotiveerd aan de aanvrager medegedeeld. [Artikel 31, vierde lid, van de Dienstenwet][ref17] is niet van
      toepassing.


