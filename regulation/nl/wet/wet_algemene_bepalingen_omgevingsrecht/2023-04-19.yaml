  - number: '3.19'
    text: |-
      1 Het bestuursorgaan dat tot verlening van de watervergunning bevoegd is, brengt een advies uit met het oog op de
      samenhang tussen de beschikkingen op de onderscheidene aanvragen. Het advies wordt uitgebracht binnen acht weken
      na ontvangst van de aanvraag om de omgevingsvergunning of wijziging van voorschriften van de omgevingsvergunning.
      [Artikel 3.11, derde lid, tweede en derde volzin][ref1] is van overeenkomstige toepassing.

      2 Het orgaan dat tot verlening van de watervergunning bevoegd is, wordt voorts in de gelegenheid gesteld advies
      uit te brengen over het ontwerp van de beschikking op de aanvraag om de omgevingsvergunning of wijziging van
      voorschriften van de omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel3.19
