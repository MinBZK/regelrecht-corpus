  - number: 6.2a
    text: |-
      Onverminderd [artikel 6.1][ref1] treedt een omgevingsvergunning met betrekking tot een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, b, g of h][ref2], indien voor die activiteit tevens een vergunning als bedoeld
      in [artikel 11, tweede lid, van de Monumentenwet 1988][ref3] zoals die wet luidde voor inwerkingtreding van de
      [Erfgoedwet][ref4] is vereist, niet eerder in werking dan nadat die vergunning in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel11
