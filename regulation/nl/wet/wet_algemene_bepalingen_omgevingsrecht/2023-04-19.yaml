  - number: '3.13'
    text: |-
      1 In gevallen waarin toepassing is gegeven aan [artikel 2.12, eerste lid, aanhef en onder a, onder 3°][ref1],
      en gedeputeerde staten of de inspecteur daaromtrent een zienswijze naar voren hebben gebracht, die niet is
      overgenomen, wordt de beschikking op de aanvraag hun onverwijld toegezonden en wordt zij eerst zes weken na die
      toezending bekendgemaakt.

      2 In een geval als bedoeld in het eerste lid kunnen gedeputeerde staten, onderscheidenlijk
      Onze Minister, onverminderd andere aan hen toekomende bevoegdheden, binnen de in dat
      lid genoemde termijn met betrekking tot het betrokken onderdeel van de beschikking op de
      aanvraag aan het bevoegd gezag een aanwijzing als bedoeld in [artikel 4.2, eerste lid][ref2],
      onderscheidenlijk [artikel 4.4, eerste lid, onder a, van de Wet ruimtelijke ordening][ref3]
      geven, ertoe strekkende dat het onderdeel geen deel blijft uitmaken van de beschikking op de
      aanvraag die is gegeven. [Artikel 4.2, tweede tot en met vierde lid][ref4], onderscheidenlijk
      [artikel 4.4, tweede tot en met vierde lid, van die wet][ref5] is op die aanwijzing niet van toepassing.

      3 Gedeputeerde staten, onderscheidenlijk Onze Minister vermelden in het besluit, houdende de aanwijzing, de
      daaraan ten grondslag liggende feiten, omstandigheden en overwegingen die hen beletten het betrokken provinciaal,
      onderscheidenlijk nationaal belang met inzet van andere aan hen toekomende bevoegdheden te beschermen.

      4 Indien toepassing is gegeven aan het eerste tot en met derde lid, wordt de beschikking op de aanvraag
      tegelijkertijd en op dezelfde wijze met het besluit, houdende de aanwijzing, bekendgemaakt. In afwijking van het
      eerste lid geschiedt die bekendmaking binnen zeven weken na de toezending, bedoeld in dat lid.

      5 Van het besluit houdende de aanwijzing wordt mededeling gedaan aan diegenen die ten aanzien van het onderdeel
      van de beschikking op de aanvraag dat bij dat besluit is betrokken een zienswijze naar voren hebben gebracht. De
      termijn voor indiening van een beroepschrift tegen het besluit houdende de aanwijzing vangt aan met ingang van de
      dag na die waarop dit besluit ter inzage is gelegd.

      6 Het onderdeel, bedoeld in het tweede lid, vervalt van rechtswege op het tijdstip dat het besluit, houdende de
      aanwijzing, onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
