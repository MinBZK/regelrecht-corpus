  - number: '6.2'
    text: |-
      In gevallen waarin het onverwijld in werking treden van een beschikking als bedoeld in [artikel 6.1][ref1] naar
      het oordeel van het bevoegd gezag nodig is, kan het in afwijking van dat artikel bepalen dat zij terstond na haar
      bekendmaking in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel6.2
