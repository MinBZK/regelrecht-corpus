  - number: '5.20'
    text: |-
      1 Een bestuursorgaan dat bij de totstandkoming van de vergunning of ontheffing bevoegd was een verklaring als
      bedoeld in [artikel 2.27, eerste lid][ref1], te geven of advies uit te brengen kan een bestuursorgaan dat op grond
      van dit hoofdstuk bevoegd is tot oplegging van een last onder bestuursdwang, oplegging van een last onder dwangsom
      of intrekking van een vergunning of ontheffing, verzoeken een daartoe strekkende beschikking te geven.

      2 In gevallen waarin vanuit een inrichting of mijnbouwwerk afvalwater of andere afvalstoffen in een voorziening
      voor de inzameling en het transport van afvalwater worden gebracht tengevolge waarvan:

      a. de doelmatige werking van het zuiveringtechnisch werk, bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref2] wordt belemmerd, of

      b. de bij een algemene maatregel van bestuur als bedoeld in [artikel 5.1 van de Wet milieubeheer][ref3] ter
      uitvoering van een EU-richtlijn of EU-verordening gestelde milieukwaliteitseisen voor oppervlaktewaterlichamen
      worden overschreden,

      kan het bestuursorgaan dat zorg draagt voor het beheer van het zuiveringtechnisch werk, bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref4], of het oppervlaktewaterlichaam waarop het afvalwater vanuit de
      voorziening wordt gebracht, voor zover dat nodig is om die gevolgen te beperken of weg te nemen, een verzoek doen,
      als bedoeld in het eerste lid en geeft het bevoegde bestuursorgaan daaraan gevolg, voor zover dat niet in strijd is
      met het belang van de bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5.1
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
