  - number: '5.15'
    text: |-
      Onze betrokken Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde
      bij of krachtens de betrokken wet in gevallen waarin:

      a. hem de zorg voor de bestuursrechtelijke handhaving daarvan is opgedragen, of

      b. geen ander bestuursorgaan daartoe bevoegd is.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.15
  - number: '5.16'
    text: |-
      Het bestuursorgaan dat een beschikking tot oplegging van een last onder bestuursdwang of oplegging van een last
      onder dwangsom heeft gegeven terzake van overtreding van het bepaalde waarvoor bij of krachtens de betrokken wetten
      ook andere organen bevoegd zijn tot bestuursrechtelijke handhaving, zendt die organen onverwijld een exemplaar van
      die beschikking.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.16
  - number: '5.17'
    text: |-
      Een besluit tot oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom gericht op
      naleving van het bepaalde bij of krachtens de betrokken wet kan inhouden dat het bouwen, gebruiken of slopen van
      een bouwwerk wordt gestaakt of dat voorzieningen, met inbegrip van het slopen van een bouwwerk, gericht op het
      tegengaan of beëindigen van gevaar voor de gezondheid of de veiligheid worden getroffen.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.17
  - number: '5.18'
    text: |-
      Bij een besluit tot oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom gericht
      op naleving van het bepaalde bij of krachtens de betrokken wet kan het bestuursorgaan dat het besluit heeft
      genomen bepalen dat het besluit mede geldt jegens de rechtsopvolger van degene aan wie het besluit is opgelegd
      alsmede jegens iedere verdere rechtsopvolger. In dat geval kan het besluit, tenzij bijzondere omstandigheden
      zich daartegen naar het oordeel van dat bestuursorgaan verzetten, jegens die rechtsopvolger of iedere verdere
      rechtsopvolger worden ten uitvoer gelegd en kunnen de kosten van die tenuitvoerlegging en een te innen dwangsom bij
      die rechtsopvolger of verdere rechtsopvolger worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.18
  - number: '5.19'
    text: |-
      1 Het bestuursorgaan dat bevoegd is een vergunning of ontheffing te verlenen, kan de vergunning of ontheffing
      geheel of gedeeltelijk intrekken, indien:

      a. de vergunning of ontheffing ten gevolge van een onjuiste of onvolledige opgave is verleend;

      b. niet overeenkomstig de vergunning of ontheffing is of wordt gehandeld;

      c. de aan de vergunning of ontheffing verbonden voorschriften of beperkingen niet zijn of worden nageleefd;

      d. de voor de houder van de vergunning of ontheffing als zodanig geldende algemene regels niet zijn of worden
      nageleefd.

      2 Een vergunning of ontheffing, die betrekking heeft op het beheer van gevaarlijke afvalstoffen, of van andere
      afvalstoffen die van elders afkomstig zijn, kan, voor zover zij het beheer van afvalstoffen betreft, tevens worden
      ingetrokken, indien op grond van [hoofdstuk 10 van de Wet milieubeheer][ref1] voor de houder geldende voorschriften
      niet worden nageleefd.

      3 Een bestuursorgaan gaat niet tot intrekking als bedoeld in het eerste of tweede lid over dan nadat het
      de betrokkene de gelegenheid heeft geboden binnen een daartoe te bepalen termijn zijn handelen alsnog in
      overeenstemming te brengen met de vergunning of ontheffing, onderscheidenlijk de voorschriften of algemene regels,
      bedoeld in het eerste of tweede lid, na te leven.

      4 Het bevoegd gezag kan de omgevingsvergunning tevens geheel of gedeeltelijk intrekken:

      a. in gevallen als bedoeld in [artikel 2.25, derde lid][ref2], indien het project niet overeenkomstig het krachtens
      dat artikellid bepaalde wordt uitgevoerd door een ander dan degene aan wie de vergunning is verleend;

      b. in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3];
      [artikel 2.20, tweede lid][ref4], is in dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.25
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2.20
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.19
