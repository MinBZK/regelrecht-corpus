  - number: '3.18'
    text: |-
      1 De aanvraag om een omgevingsvergunning of wijziging van voorschriften van een omgevingsvergunning overeenkomstig
      [artikel 2.31][ref1] wordt tegelijk ingediend met de aanvraag om verlening of wijziging van de watervergunning.

      2 Indien de aanvraag om verlening of wijziging van de watervergunning niet is ingediend binnen zes weken na het
      tijdstip waarop de aanvraag om de omgevingsvergunning of wijziging van voorschriften van de omgevingsvergunning is
      ingediend, wordt de aanvraag om de omgevingsvergunning buiten behandeling gelaten.

      3 Indien de aanvraag om verlening of wijziging van de watervergunning buiten behandeling wordt gelaten, wordt de
      aanvraag om de omgevingsvergunning eveneens buiten behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.31
