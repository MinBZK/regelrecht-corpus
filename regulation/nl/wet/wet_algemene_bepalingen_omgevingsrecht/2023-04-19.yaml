  - number: '7.1'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een provincie of gemeente,
      worden, voor zover nodig, bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen
      die de in deze wet vervatte bevoegdheden uitoefenen, en ten aanzien van de bestuursorganen die bij die uitvoering
      dienen te worden betrokken.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel7.1
  - number: '7.2'
    text: |-
      1 Onze Minister zendt binnen vijf jaar nadat deze wet in werking treedt, aan de Staten-Generaal een verslag omtrent
      de werking van deze wet in de praktijk.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van
      het eerste lid. Deze regels kunnen voor daarbij aangewezen bestuursorganen de verplichting inhouden op een daarbij
      aan te geven wijze de gegevens te verstrekken, die voor de opstelling van het verslag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel7.2
  - number: '7.3'
    text: |-
      1 Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel7.3
  - number: '7.4'
    text: |-
      De voordracht voor een krachtens [artikel 1.1, derde lid][ref1], [2.1, eerste lid, onder d][ref2],
      [2.1, derde lid][ref3], [2.4, tweede of derde lid][ref4], [2.8, eerste lid][ref5], [2.9, tweede lid][ref6],
      [2.22, derde lid][ref7], [2.23, tweede lid][ref8], [2.24, eerste lid][ref9], [2.25, tweede of derde lid][ref10],
      [2.27, eerste of derde lid][ref11], [2.29, eerste lid, onder a][ref12], [3.9, eerste lid, onder b][ref13],
      [3.12, tweede lid, onder a, vierde of zesde lid][ref14], [4.1, eerste lid][ref15], [5.3, vierde lid][ref16],
      [5.6, tweede lid][ref17], [5.7, eerste lid][ref18], of [5.8, tweede en derde lid][ref19], vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.


