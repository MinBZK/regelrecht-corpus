  - number: '7.5'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat in de gevallen waarin een van Onze Ministers
      het bevoegd gezag is aan een provincie, gemeente of waterschap een alleenrecht als bedoeld in artikel 11 van
      richtlijn 2014/24/EU van het Europees Parlement en de Raad van 26 februari 2014 betreffende het plaatsen van
      overheidsopdrachten en tot intrekking van Richtlijn 2004/18/EG (PbEU 2014, L 94) wordt verleend met betrekking tot
      daarbij aangewezen categorieën werkzaamheden in het kader van de voorbereiding van een beschikking met betrekking
      tot een omgevingsvergunning of in het kader van bezwaar of beroep tegen een beschikking met betrekking tot een
      omgevingsvergunning.

      2 Bij provinciale verordening kan worden bepaald dat in de gevallen waarin gedeputeerde staten het bevoegd gezag
      zijn aan een gemeente of waterschap een alleenrecht als bedoeld in het eerste lid wordt verleend met betrekking tot
      daarbij aangewezen categorieën werkzaamheden in het kader van de voorbereiding van een beschikking met betrekking
      tot een omgevingsvergunning of in het kader van bezwaar of beroep tegen een beschikking met betrekking tot een
      omgevingsvergunning.

      3 Een alleenrecht kan slechts worden verleend:

      a. aan de provincie of gemeente waar een activiteit waarop de voorbereiding van de beschikking betrekking heeft, in
      hoofdzaak wordt verricht of zal worden verricht,

      b. voor zover de voorbereiding van de beschikking betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], waarbij vanuit een inrichting of mijnbouwwerk afvalwater of andere
      afvalstoffen in een voorziening voor de inzameling en het transport van afvalwater zijn of worden gebracht, aan het
      waterschap waartoe het bestuursorgaan behoort dat zorg draagt voor het beheer van het zuiveringstechnisch werk of
      het oppervlaktewater waarop het afvalwater vanuit die voorziening wordt gebracht.

      4 Een wijziging van artikel 11 van de richtlijn, bedoeld in het eerste lid, gaat voor de toepassing van het
      eerste en tweede lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
