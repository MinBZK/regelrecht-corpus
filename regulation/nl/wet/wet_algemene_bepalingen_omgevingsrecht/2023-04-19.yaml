  - number: '5.13'
    text: |-
      De ambtenaren die zijn belast met het toezicht op de naleving of de opsporing van strafbaar gestelde feiten ter
      zake van het bepaalde bij of krachtens:

      a. deze wet met betrekking tot activiteiten als bedoeld in:

      1°. [artikel 2.1, eerste lid, onder a, b, c, d, e][ref1], voorzover deze betrekking hebben op gevaarlijke
      afvalstoffen, f, g en h,

      2°. [artikel 2.1, eerste lid, onder i][ref2], voor zover dat bij de betrokken algemene maatregel van bestuur is
      bepaald, en

      3°. [artikel 2.2][ref3], voor zover dat bij de betrokken verordening is bepaald,

      b. de [Monumentenwet 1988][ref4] zoals die wet luidde voor inwerkingtreding van de [Erfgoedwet][ref5],

      c. de [Wet milieubeheer][ref6]:

        - ten aanzien van gevaarlijke afvalstoffen en
        - ten behoeve van de uitoefening van de bevoegdheden, bedoeld in artikel 14, vierde lid, onderdelen a, d en
      e, van [Verordening (EU) nr. 2019/1020](32920R2019) van het Europees Parlement en de Raad van 20 juni 2019
      betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/EG](32004L0042)
      en [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU 2019 L169), voor
      zover het gaat om handhaving van het bepaalde bij of krachtens: 1°. de [titels 9.3][ref7], [9.3a][ref8] en
      [9.4][ref9], 2°. de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen, 3°. de EG-
      verordening indeling, etikettering en verpakking van stoffen en mengsels, 4°. de EG-verordening EU-milieukeur
      of 5°. de [titels 2.5][ref10], [9.2][ref11] en [9.5][ref12], voor zover daarbij uitvoering wordt gegeven aan een
      internationale verplichting,

      d. de [Wet ruimtelijke ordening][ref13] en

      e. de [hoofdstukken I tot en met III van de Woningwet][ref14],

      zijn bevoegd, met medeneming van de benodigde apparatuur, een woning te betreden zonder toestemming van de bewoner.


