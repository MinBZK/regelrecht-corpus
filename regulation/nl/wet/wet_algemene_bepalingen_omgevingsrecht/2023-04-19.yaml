  - number: 6.2b
    text: |-
      Onverminderd [artikel 6.1][ref1] treedt een omgevingsvergunning met betrekking tot een activiteit
      als bedoeld in [artikel 2.1, eerste lid, onder a][ref2], indien die activiteit tevens is aan te
      merken als het oprichten of wijzigen van een inrichting waarvoor een vergunning als bedoeld in
      [artikel 15, aanhef en onderdeel b, van de Kernenergiewet][ref3] is vereist, niet eerder in werking dan nadat die
      vergunning in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel6.1
