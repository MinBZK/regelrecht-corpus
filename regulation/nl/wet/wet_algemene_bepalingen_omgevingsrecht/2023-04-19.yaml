  - number: '5.1'
    text: |-
      Dit hoofdstuk is van toepassing op de uitvoering en handhaving van het bij of krachtens deze wet bepaalde, alsmede
      op de uitvoering en handhaving van het bepaalde bij of krachtens de:

        - [Flora- en faunawet][ref1],
        - [Kernenergiewet][ref2],
        - [Monumentenwet 1988][ref3] voor zover van kracht overeenkomstig [artikel 9.1 van de Erfgoedwet][ref4],
        - [Natuurbeschermingswet 1998][ref5],
        - [Ontgrondingenwet][ref6],
        - [Wet bescherming Antarctica][ref7],
        - [Wet bodembescherming][ref8],
        - [Wet geluidhinder][ref9],
        - [Wet inzake de luchtverontreiniging][ref10],
        - [Wet milieubeheer][ref11],
        - [Wet ruimtelijke ordening][ref12],
        - [Waterwet][ref13] en
        - [Woningwet][ref14],

      voor zover dit bij of krachtens de genoemde wetten is bepaald.


