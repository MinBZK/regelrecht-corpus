  - number: '5.21'
    text: |-
      1 Indien meer dan een bestuursorgaan bevoegd is tot bestuursrechtelijke handhaving geeft het bestuursorgaan waarbij
      een verzoek tot oplegging van een last onder bestuursdwang, oplegging van een last onder dwangsom of intrekking van
      een vergunning of ontheffing is ingediend, een beschikking op het verzoek.

      2 Het eerste lid is niet van toepassing indien:

      a. een ander bestuursorgaan dat eveneens bevoegd is tot handhaving, schriftelijk heeft verklaard het verzoek in
      behandeling te willen nemen, en

      b. het bestuursorgaan waarbij het verzoek tot oplegging van een last onder bestuursdwang is ingediend, het verzoek
      binnen twee weken na de datum waarop het is ontvangen, heeft doorgezonden aan dat andere bestuursorgaan.

      3 In een geval als bedoeld in het tweede lid:

      a. deelt het bestuursorgaan waarbij het verzoek is ingediend, onverwijld aan de afzender mede dat zijn verzoek
      is doorgezonden;

      b. geeft het bestuursorgaan waaraan het verzoek is doorgezonden, een beschikking op het verzoek.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.21
  - number: '5.22'
    text: |-
      Indien het verzoek wordt ingewilligd, voegt het bestuursorgaan bij de bekendmaking van de beschikking aan de
      verzoeker een exemplaar van de beschikking tot oplegging van een last onder bestuursdwang, oplegging van een last
      onder dwangsom of intrekking van de vergunning of ontheffing.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.22
  - number: '5.23'
    text: |-
      Het bestuursorgaan zendt een exemplaar van de beschikking tot oplegging van een last onder bestuursdwang, tot
      oplegging van een last onder dwangsom of tot intrekking van zodanige beschikkingen of van de beschikking tot
      intrekking van een vergunning of ontheffing aan de inspecteur en de andere bij of krachtens [artikel 2.26][ref1]
      aangewezen adviseurs.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.26
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.23
