  - number: '3.10'
    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van de beschikking
      op de aanvraag om een omgevingsvergunning, indien de aanvraag geheel of gedeeltelijk betrekking heeft op:

      a. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref2], voor zover er strijd is met
      het bestemmingsplan of een beheersverordening en slechts vergunning kan worden verleend met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°][ref3];

      b. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder d][ref4];

      c. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref5];

      d. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref6], voor zover voor die activiteit krachtens
      [artikel 2.26, derde lid][ref7], een adviseur is aangewezen;

      e. een geval waarin een verklaring vereist is, als bedoeld in [artikel 2.27][ref8];

      f. een geval dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie met mogelijk belangrijke
      gevolgen voor de fysieke leefomgeving of de belangen van derden;

      g. een activiteit als bedoeld in [artikel 2.19][ref9], voor zover dat in het betrokken wettelijk voorschrift is
      aangegeven.

      2 Het bevoegd gezag kan bepalen dat de toepassing van [artikel 3.1][ref10] of
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref11] geheel of gedeeltelijk achterwege blijft, indien:

      a. de aanvraag betrekking heeft op een activiteit waarvan de uitvoering als gevolg van een ongewone omstandigheid
      op korte termijn nodig is;

      b. de uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie dat vereist.

      3 In afwijking van het eerste lid, aanhef en onder c, is [afdeling 3.4 van de Algemene wet bestuursrecht][ref12]
      niet van toepassing op de voorbereiding van de beschikking op de aanvraag om een omgevingsvergunning met
      betrekking tot een verandering van een inrichting of mijnbouwwerk of de werking daarvan, die niet leidt
      tot andere of grotere nadelige gevolgen voor het milieu dan volgens de geldende omgevingsvergunning is
      toegestaan, waarvoor geen verplichting bestaat tot het maken van een milieueffectrapport als bedoeld in
      [hoofdstuk 7 van de Wet milieubeheer][ref13], en die niet leidt tot een andere inrichting of mijnbouwwerk dan
      waarvoor eerder een omgevingsvergunning is verleend.

      4 Indien op de voorbereiding van de beschikking op de aanvraag om een omgevingsvergunning
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref14] van toepassing is, zijn tevens de [artikelen 13.6][ref15],
      [13.9][ref16] en [13.11, eerste lid, aanhef en onder c, van de Wet milieubeheer][ref17] van toepassing.


