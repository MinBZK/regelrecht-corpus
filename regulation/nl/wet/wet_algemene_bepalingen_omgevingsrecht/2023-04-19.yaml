  - number: '2.28'
    text: |-
      Indien met het oog op de beslissing op de aanvraag om een omgevingsvergunning krachtens meer dan een wettelijk
      voorschrift een verklaring van hetzelfde bestuursorgaan is vereist, beslist dat bestuursorgaan daarover in één
      verklaring.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.28
  - number: '2.29'
    text: |-
      1 Een bestuursorgaan dat bij de totstandkoming van de omgevingsvergunning bevoegd was een verklaring als bedoeld in
      [artikel 2.27, eerste lid][ref1], te geven of advies uit te brengen kan het bevoegd gezag verzoeken voorschriften
      van de omgevingsvergunning te wijzigen of de omgevingsvergunning geheel of gedeeltelijk in te trekken. Een verzoek
      kan slechts worden gedaan door:

      a. het bestuursorgaan dat bevoegd was een verklaring te geven: voor zover het betreft de activiteiten waarvoor de
      verklaring is gegeven;

      b. een adviseur: voor zover het betreft de aspecten waarover hij bij de totstandkoming van de omgevingsvergunning
      advies kan uitbrengen.

      2 Voor zover een omgevingsvergunning betrekking heeft op een activiteit met betrekking tot een inrichting als
      bedoeld in [artikel 2.1, eerste lid, onder e][ref2], kan Onze Minister het bevoegd gezag verzoeken binnen een
      daarbij aangegeven termijn de omgevingsvergunning of voorschriften van de omgevingsvergunning te wijzigen, indien
      zich in de betrokken inrichting een voorval als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref3] voordoet of
      heeft voorgedaan of, indien [titel 17.1A van die wet][ref4] van toepassing is, zich een gebeurtenis als bedoeld in
      [artikel 17.5a van die wet][ref5] voordoet of heeft voorgedaan.

      3 Indien het bevoegd gezag gevolg geeft aan een verzoek als bedoeld in het eerste of tweede lid, zendt het een
      exemplaar van de beschikking tot wijziging van voorschriften van de omgevingsvergunning of wijziging of gehele of
      gedeeltelijke intrekking van de omgevingsvergunning aan het betrokken bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel17.1
      [ref4]: https://wetten.overheid.nl/BWBR0003245
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel17.5a
