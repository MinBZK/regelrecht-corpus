  - number: '2.30'
    text: |-
      1 Voor zover de omgevingsvergunning betrekking heeft op een activiteit met betrekking tot een inrichting als
      bedoeld in [artikel 2.1, eerste lid, onder e][ref1], beziet het bevoegd gezag regelmatig of de voorschriften die
      aan een omgevingsvergunning zijn verbonden, nog toereikend zijn gezien de ontwikkelingen op het gebied van de
      technische mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit van
      het milieu. Onder ontwikkelingen op het gebied van de technische mogelijkheden tot bescherming van het milieu wordt
      mede verstaan de vaststelling van nieuwe of herziene conclusies over beste beschikbare technieken, overeenkomstig
      artikel 13, vijfde en zevende lid, van richtlijn nr. 2010/75/EU van het Europees Parlement en de Raad van 24
      november 2010 inzake industriële emissies (PbEU L 334).

      2 Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van het milieu regels worden gesteld
      met betrekking tot de wijze waarop het eerste lid wordt toegepast met betrekking tot daarbij aangewezen categorieën
      inrichtingen. Bij de maatregel kan worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangewezen
      categorieën gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.30
