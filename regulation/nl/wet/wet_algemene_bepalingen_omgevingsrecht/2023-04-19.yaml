  - number: '2.1'
    text: |-
      1 Het is verboden zonder omgevingsvergunning een project uit te voeren, voor zover dat geheel of gedeeltelijk
      bestaat uit:

      a. het bouwen van een bouwwerk,

      b. het uitvoeren van een werk, geen bouwwerk zijnde, of van werkzaamheden, in gevallen waarin dat bij een
      bestemmingsplan, beheersverordening, exploitatieplan of voorbereidingsbesluit is bepaald,

      c. het gebruiken van gronden of bouwwerken in strijd met een bestemmingsplan, een beheersverordening,
      een exploitatieplan, de regels gesteld krachtens [artikel 4.1, derde lid][ref1], of
      [4.3, derde lid, van de Wet ruimtelijke ordening][ref2] of een voorbereidingsbesluit voor zover toepassing is
      gegeven aan [artikel 3.7, vierde lid, tweede volzin, van die wet][ref3],

      d. het in gebruik nemen of gebruiken van een bouwwerk in met het oog op de brandveiligheid bij algemene maatregel
      van bestuur aangewezen categorieën gevallen,

      e. 1°. het oprichten,

      2°. het veranderen of veranderen van de werking of

      3°. het in werking hebben

      van een inrichting of mijnbouwwerk,

      f. het slopen, verstoren, verplaatsen of in enig opzicht wijzigen van een rijksmonument of het herstellen,
      gebruiken of laten gebruiken van een rijksmonument op een wijze waardoor het wordt ontsierd of in gevaar gebracht,

      g. het slopen van een bouwwerk in gevallen waarin dat in een bestemmingsplan, beheersverordening of
      voorbereidingsbesluit is bepaald,

      h. het slopen van een bouwwerk in een beschermd stads- of dorpsgezicht of

      i. het verrichten van een andere activiteit die behoort tot een bij algemene maatregel van bestuur aangewezen
      categorie activiteiten die van invloed kunnen zijn op de fysieke leefomgeving.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot hetgeen wordt verstaan
      onder de in het eerste lid bedoelde activiteiten.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat met betrekking tot daarbij aangewezen activiteiten als
      bedoeld in het eerste lid in daarbij aangegeven categorieën gevallen, het in dat lid gestelde verbod niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4.3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
