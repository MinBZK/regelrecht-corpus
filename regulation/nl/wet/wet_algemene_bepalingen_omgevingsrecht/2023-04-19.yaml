  - number: '5.4'
    text: |-
      1 Om een goede kwaliteit van de uitvoering en handhaving van het bepaalde bij of krachtens de betrokken wetten door
      omgevingsdiensten te waarborgen,

      a. stellen provinciale staten, gehoord Onze Minister en het College van procureurs-generaal, bij verordening regels
      over de uitvoering en handhaving van de taken, bedoeld in [artikel 5.3, vierde lid, eerste en tweede volzin][ref1],
      die in opdracht van gedeputeerde staten worden uitgevoerd, en

      b. stelt de gemeenteraad, gehoord gedeputeerde staten, bij verordening regels over de uitvoering en handhaving van
      de taken, bedoeld in [artikel 5.3, vierde lid, eerste volzin][ref2], niet zijnde taken als bedoeld in de tweede
      volzin, die in opdracht van burgemeester en wethouders worden uitgevoerd.

      2 Gedeputeerde staten dragen er zorg voor dat de regels, bedoeld in het eerste lid, onder a, uniform zijn voor
      de taken, bedoeld in [artikel 5.3, vierde lid, tweede volzin][ref3], op het niveau van de met die taken belaste
      omgevingsdiensten. Gedeputeerde staten en burgemeester en wethouders dragen er zorg voor dat de regels voor de
      taken, bedoeld in artikel 5.3, vierde lid, eerste volzin, niet zijnde taken als bedoeld in de tweede volzin,
      uniform zijn op het niveau van de met die taken belaste omgevingsdienst.

      3 Met het oog op de uniformiteit van de regels, bedoeld in het tweede lid, dragen de bestuursorganen die
      zijn belast met de voorbereiding van die regels, zorg voor de onderlinge afstemming tussen de aangewezen
      omgevingsdiensten, als bedoeld in [artikel 5.3, vierde lid, tweede volzin][ref4], onderscheidenlijk binnen de
      omgevingsdienst.

      4 Bij regeling van Onze Minister kunnen gevallen worden aangewezen, waarin voldoende zorg is gedragen voor
      uniformiteit, als bedoeld in het tweede lid, en afstemming als bedoeld in het derde lid, niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.3
