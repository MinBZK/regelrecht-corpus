  - number: '5.10'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde, zijn belast de bij besluit
      van Onze betrokken Minister aangewezen ambtenaren. Ambtenaren, ressorterende onder een ander dan zijn ministerie,
      wijst hij niet aan dan in overeenstemming met Onze Minister onder wiens ministerie zij ressorteren.

      2 Voor de krachtens het eerste lid aangewezen ambtenaren, ressorterende onder een ander ministerie dan dat van Onze
      betrokken Minister, worden regels betreffende de vervulling van hun in het eerste lid bedoelde taak niet gesteld
      dan in overeenstemming met Onze betrokken Minister.

      3 Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde binnen hun ambtsgebied zijn
      eveneens belast de bij besluit van gedeputeerde staten, burgemeester en wethouders of andere met de uitvoering van
      de betrokken wet belaste bestuursorganen aangewezen ambtenaren.

      4 Bij een besluit als bedoeld in het eerste lid kan Onze betrokken Minister gevallen of categorieën gevallen
      aanwijzen met betrekking waartoe, in afwijking van het derde lid bij zijn besluit aangewezen ambtenaren uitsluitend
      belast zijn met het toezicht op de naleving.

      5 Van een besluit als bedoeld in het eerste en vierde lid, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.10
  - number: '5.11'
    text: |-
      1 De bij besluit van gedeputeerde staten, burgemeester en wethouders of een ander bestuursorgaan aangewezen, bij
      een omgevingsdienst werkzame toezichthouders zijn bevoegd toezicht uit te oefenen op de naleving van het bepaalde
      bij of krachtens de betrokken wetten in de regio of kring, onderscheidenlijk regio’s of kringen, waarvoor die
      omgevingsdienst is ingesteld.

      2 Onze Minister kan besluiten dat voor door hem aan te wijzen categorieën van activiteiten de bij een
      omgevingsdienst werkzame toezichthouders mede bevoegd zijn buiten de regio of kring toezicht uit te oefenen op de
      naleving van het bepaalde bij of krachtens de betrokken wetten.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.11
  - number: '5.12'
    text: |-
      1 Met de opsporing van de bij of krachtens de betrokken wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de in [artikel 5.10][ref2] bedoelde ambtenaren,
      voor zover zij bij besluit van Onze Minister van Veiligheid en Justitie daartoe zijn aangewezen. Deze ambtenaren
      zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref3]
      en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


