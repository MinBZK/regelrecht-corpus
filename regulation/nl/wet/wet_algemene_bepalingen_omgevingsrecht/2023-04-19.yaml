  - number: '2.34'
    text: |-
      1 Onze Minister kan, indien dat in het algemeen belang geboden is, aan het bevoegd gezag een aanwijzing
      geven ter zake van het nemen van een besluit ten aanzien van een aanvraag om een omgevingsvergunning
      of ten aanzien van een al verleende omgevingsvergunning ten behoeve van maatregelen ter voorkoming
      van overschrijding van één of meer voor hoofdspoorwegen vastgestelde risicoplafonds als bedoeld in
      [artikel 15, derde lid, van de Wet vervoer gevaarlijke stoffen][ref1]. Deze bevoegdheid geldt niet:

      a. met betrekking tot activiteiten als bedoeld in [artikel 2.2][ref2];

      b. in gevallen waarin een Onzer andere Ministers het bevoegd gezag is;

      c. met betrekking tot een verklaring van een Onzer andere Ministers en de daarbij overeenkomstig
      [artikel 2.27, vierde lid][ref3], aangegeven of aan te geven voorschriften.

      2 Voordat Onze Minister een aanwijzing geeft, bepaalt Onze Minister in overleg met de betrokken gemeenten en de
      spoorinfrabeheerder welke maatregelen door het rijk en deze partijen genomen zullen worden om de overschrijding
      van het vigerende risicoplafond zo veel als mogelijk te beperken. Hij deelt het voornemen, onder vermelding van de
      redenen daarvoor, mee aan de Staten-Generaal.

      3 Het bevoegd gezag doet van de wijze waarop gevolg is gegeven aan de aanwijzing, schriftelijk mededeling aan Onze
      Minister.

      4 De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een
      exemplaar ervan wordt gevoegd bij ieder exemplaar van die beschikking.

      5 Indien het bevoegd gezag niet of niet volledig gevolg geeft aan een aanwijzing als bedoeld in het eerste lid
      kan Onze Minister een besluit als bedoeld in het eerste lid nemen voor rekening van de rechtspersoon waartoe het
      betrokken bestuursorgaan behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.34
