  - number: '3.5'
    text: |-
      1 Indien de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b][ref1], en daarop een exploitatieplan van toepassing is,
      houdt het bevoegd gezag, in afwijking van [artikel 3.9, eerste lid][ref2], onderscheidenlijk
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3], de beslissing aan, indien er geen grond is de vergunning te
      weigeren en het exploitatieplan, dat voor de in de aanvraag begrepen grond is vastgesteld, nog niet onherroepelijk
      is.

      2 De aanhouding duurt totdat een exploitatieplan onherroepelijk is.

      3 In afwijking van het eerste lid kan het bevoegd gezag de omgevingsvergunning verlenen indien een ingesteld beroep
      geen gevolgen kan hebben voor de beoordeling van de aangevraagde activiteit of de aan de omgevingsvergunning voor
      die activiteit te verbinden voorschriften, dan wel indien deze gevolgen naar het oordeel van het bevoegd gezag niet
      opwegen tegen het belang dat met verlening van de omgevingsvergunning is gediend.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
