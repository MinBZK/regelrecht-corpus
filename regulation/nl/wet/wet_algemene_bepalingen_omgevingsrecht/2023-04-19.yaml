  - number: '2.11'
    text: |-
      1 Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder b][ref1], waaromtrent regels zijn gesteld in een bestemmingsplan,
      beheersverordening, exploitatieplan of voorbereidingsbesluit, wordt de omgevingsvergunning geweigerd indien
      het werk of de werkzaamheid daarmee in strijd is of in strijd is met de regels die zijn gesteld krachtens
      [artikel 4.1, derde lid][ref2], of [4.3, derde lid, van de Wet ruimtelijke ordening][ref3].

      2 Indien sprake is van strijd met de regels, bedoeld in het eerste lid, wordt de aanvraag mede aangemerkt als een
      aanvraag om een vergunning voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder c][ref4], en wordt de
      vergunning slechts geweigerd indien vergunningverlening met toepassing van [artikel 2.12][ref5] niet mogelijk is.


