  - number: '3.3'
    text: |-
      1 Indien de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b][ref1], houdt het bevoegd gezag, in afwijking van
      [artikel 3.9, eerste lid][ref2], onderscheidenlijk [artikel 3:18 van de Algemene wet bestuursrecht][ref3], de
      beslissing aan, indien er geen grond is de vergunning te weigeren maar voor het gebied waarin de activiteit zal
      worden verricht vóór de dag van ontvangst van de aanvraag:

      a. een voorbereidingsbesluit in werking is getreden;

      b. een bestemmingsplan in ontwerp ter inzage is gelegd;

      c. een verklaring als bedoeld in [artikel 4.1, vijfde lid][ref4], of
      [4.3, vierde lid, van de Wet ruimtelijke ordening][ref5] is bekendgemaakt;

      d. een bestemmingsplan is vastgesteld;

      e. een bestemmingsplan na vaststelling is bekendgemaakt.

      De beslissing op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder b][ref6], die is voorgeschreven met toepassing van
      [artikel 3.7, derde lid, van de Wet ruimtelijke ordening][ref7] wordt niet aangehouden.

      2 De aanhouding duurt totdat:

      a. het voorbereidingsbesluit overeenkomstig [artikel 3.7, vijfde of zesde lid, van de Wet ruimtelijke ordening][ref8]
      is vervallen;

      b. de termijn voor de vaststelling van het bestemmingsplan ingevolge
      [artikel 3.8, eerste lid, onder e, van de Wet ruimtelijke ordening][ref9] is overschreden;

      c. de termijn voor de bekendmaking van het bestemmingsplan na de vaststelling ingevolge
      [artikel 3.8, derde, vierde of zesde lid, van de Wet ruimtelijke ordening][ref10] is overschreden;

      d. het bestemmingsplan in werking is getreden dan wel in beroep is vernietigd;

      e. de termijn, genoemd in [artikel 4.1, vijfde lid][ref11], of
      [4.3, vierde lid, van de Wet ruimtelijke ordening][ref12] is overschreden;

      f. de verordening, bedoeld in [artikel 4.1, van de Wet ruimtelijke ordening][ref13] of de algemene maatregel van
      bestuur, bedoeld in [artikel 4.3, van die wet][ref14] in werking is getreden.

      3 In afwijking van het eerste lid, eerste volzin, kan het bevoegd gezag de omgevingsvergunning verlenen, indien de
      activiteit niet in strijd is met het in voorbereiding zijnde bestemmingsplan.

      4 Indien de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b][ref15], houdt het bevoegd gezag, in afwijking van
      [artikel 3.9, eerste lid][ref16], onderscheidenlijk [artikel 3:18 van de Algemene wet bestuursrecht][ref17], de
      beslissing tevens aan, indien er geen grond is de vergunning te weigeren en de aanvraag een activiteit betreft
      in een gebied waarvoor vóór de datum van ontvangst van de aanvraag een besluit tot aanwijzing als beschermd
      stads- of dorpsgezicht is bekendgemaakt en waarvoor nog geen ter bescherming daarvan strekkend bestemmingsplan of
      beheersverordening geldt.

      5 De aanhouding, bedoeld in het vierde lid, duurt totdat een ter voldoening aan
      [artikel 36 van de Monumentenwet 1988][ref18] zoals die wet luidde voor inwerkingtreding van de [Erfgoedwet][ref19]
      vast te stellen bestemmingsplan of beheersverordening in werking is getreden.

      6 Het bevoegd gezag kan, in afwijking van het vierde lid, de vergunning verlenen indien de activiteit niet in
      strijd is met het in voorbereiding zijnde ter bescherming van het beschermde stads- of dorpsgezicht strekkende
      bestemmingsplan. Alvorens te besluiten hoort het bevoegd gezag Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
