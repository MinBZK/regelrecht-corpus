      1 Gedeputeerde staten en burgemeester en wethouders van de gemeenten die behoren tot een regio als bedoeld
      in [artikel 8 van de Wet veiligheidsregio’s][ref1] of tot een kring van daartoe bij regeling van Onze
      Minister en van Onze Minister van Veiligheid en Justitie aangewezen gemeenten, stellen voor die regio of kring,
      onderscheidenlijk voor meerdere regio’s, onderscheidenlijk kringen, een omgevingsdienst in in het belang van een
      doelmatige en doeltreffende uitvoering en handhaving van het bepaalde bij of krachtens de betrokken wetten door
      gedeputeerde staten en burgemeester en wethouders van de betrokken gemeenten.

      2 Het werkgebied van een omgevingsdienst komt overeen met het werkgebied van een of meer regio’s als bedoeld in
      [artikel 8 van de Wet veiligheidsregio’s][ref2] of met het grondgebied van een kring van aangewezen gemeenten
      als bedoeld in het eerste lid.

      3 Een omgevingsdienst is ingesteld als openbaar lichaam, als bedoeld in [artikel 8, eerste lid][ref3], juncto
      [artikel 52, eerste lid, van de Wet gemeenschappelijke regelingen][ref4] door gedeputeerde staten en burgemeester
      en wethouders van de betrokken gemeenten, en juncto [artikel 74, eerste lid, van die wet][ref5], indien
      waterschappen mede een omgevingsdienst instellen.

      4 Bij algemene maatregel van bestuur worden taken aangewezen die in ieder geval in het verband van een
      omgevingsdienst worden uitgevoerd.

      Taken met betrekking tot categorieën inrichtingen:

      a. waarvoor ingevolge [artikel 8.40 van de Wet milieubeheer][ref6] regels zijn gesteld in verband met de beheersing
      van gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, of

      b. waartoe een installatie voor industriële activiteiten als bedoeld in bijlage I, categorie 4, van richtlijn
      nr. 2010/75/EU van het Europees parlement en de Raad van 24 november 2010 inzake industriële emissies (PbEU L334)
      behoort, worden uitsluitend door bij die maatregel aangewezen omgevingsdiensten uitgevoerd.


