  - number: '2.8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      de aanvraag om een omgevingsvergunning geschiedt en de gegevens en bescheiden die door de aanvrager worden
      verstrekt met het oog op de beslissing op de aanvraag. Bij de regels wordt in elk geval bepaald dat in of
      bij een aanvraag die betrekking heeft op een activiteit met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, onder 1° of 3°][ref1], gegevens en bescheiden worden verstrekt over
      de ten behoeve van de activiteiten en processen in de inrichting toe te passen technieken, voor zover die
      redelijkerwijs van belang kunnen zijn voor de beoordeling van de nadelige gevolgen voor het milieu die de
      inrichting kan veroorzaken. Bij de maatregel kan – in afwijking van de [artikelen 2:14, eerste lid][ref2], en
      [2:15 van de Algemene wet bestuursrecht][ref3] – worden bepaald dat de aanvraag geheel of gedeeltelijk elektronisch
      wordt ingediend of in ontvangst wordt genomen. Daarbij kan worden bepaald dat de verplichtingen slechts gelden in
      daarbij aangewezen categorieën gevallen.

      2 Bij een verordening als bedoeld in [artikel 2.2, tweede lid][ref4], kunnen eveneens regels worden gesteld met
      betrekking tot de gegevens en bescheiden die door de aanvrager met betrekking tot de bij die verordening aangewezen
      activiteit worden verstrekt met het oog op de beslissing op de aanvraag.


