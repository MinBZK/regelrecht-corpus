  - number: '5.2'
    text: |-
      1 Het bevoegd gezag heeft tot taak:

      a. zorg te dragen voor de bestuursrechtelijke handhaving van de op grond van het bepaalde bij of krachtens de
      betrokken wetten voor degene die het betrokken project uitvoert, geldende voorschriften;

      b. gegevens die met het oog op de uitoefening van de taak als bedoeld onder a van belang zijn, te verzamelen en
      te registreren;

      c. klachten te behandelen die betrekking hebben op de naleving van het bepaalde bij of krachtens de betrokken
      wetten met betrekking tot het uitvoeren van het betrokken project.

      2 Indien met betrekking tot het uitvoeren van het betrokken project door het bevoegd gezag een beschikking
      tot oplegging van een last onder bestuursdwang, oplegging van een last onder dwangsom of intrekking van een
      vergunning op grond van [artikel 5.19][ref1] is gegeven en, nadat die beschikking is gegeven, als gevolg van een
      verandering van het betrokken project een ander bestuursorgaan bevoegd wordt de vergunning te verlenen, blijft het
      bestuursorgaan dat de beschikking heeft gegeven, bevoegd met betrekking tot die beschikking totdat zij

      a. onherroepelijk is geworden en is tenuitvoergelegd, of de dwangsom is ingevorderd, of

      b. is ingetrokken, of de bij de beschikking opgelegde last onder dwangsom overeenkomstig
      [artikel 5:34 van de Algemene wet bestuursrecht][ref2] is opgeheven.

      3 Bij het uitoefenen van de taak, bedoeld in het eerste lid, houdt het bevoegd gezag, voorzover er sprake
      is van een activiteit met betrekking tot een inrichting of mijnbouwwerk, rekening met het voor hem geldende
      milieubeleidsplan.

      4 In bij wet of algemene maatregel van bestuur aangewezen categorieën gevallen heeft tevens het bestuursorgaan
      dat bevoegd is een verklaring te geven als bedoeld in [artikel 2.27, eerste lid][ref3], tot taak zorg te dragen
      voor de bestuursrechtelijke handhaving, bedoeld in het eerste lid, onder a. Deze taak blijft beperkt tot de
      activiteiten van het project waarvoor de verklaring is vereist. Op het uitoefenen van deze taak is het derde lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.19
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel534
