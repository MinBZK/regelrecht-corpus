        artikel: '2.23'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.23b
    text: |-
      In een omgevingsvergunning kan worden bepaald dat daarbij aangewezen voorschriften nadat de vergunning haar gelding
      heeft verloren, gedurende een daarbij aangegeven termijn van kracht blijven.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.23b
  - number: '2.24'
    text: |-
      1 In een omgevingsvergunning met betrekking tot een seizoensgebonden bouwwerk kan worden bepaald dat het
      desbetreffende bouwwerk op grond van die vergunning gedurende opeenvolgende kalenderjaren kan worden gebouwd,
      gebruikt en gesloopt.

      2 In een omgevingsvergunning met betrekking tot een seizoensgebonden bouwwerk wordt bepaald binnen welke
      opeenvolgende tijdvakken van een kalenderjaar het bouwen, gebruiken en slopen van het desbetreffende bouwwerk
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.24
  - number: 2.24a
    text: |-
      1 Een drijvend bouwwerk waarvoor een omgevingsvergunning is verleend, kan in verband met werkzaamheden worden
      verplaatst en op dezelfde locatie worden teruggeplaatst met behoud van die vergunning.

      2 Onverminderd het eerste lid kan in een omgevingsvergunning met betrekking tot een drijvend bouwwerk op aanvraag
      worden bepaald dat het bouwwerk op grond van die vergunning kan worden verplaatst en op dezelfde locatie kan worden
      teruggeplaatst.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.24a
  - number: '2.25'
    text: |-
      1 Een omgevingsvergunning geldt voor eenieder die het project uitvoert waarop zij betrekking heeft. De
      vergunninghouder draagt ervoor zorg dat de aan de omgevingsvergunning verbonden voorschriften worden nageleefd.

      2 Indien een omgevingsvergunning zal gaan gelden voor een ander dan de aanvrager of de vergunninghouder, meldt de
      aanvrager, onderscheidenlijk de vergunninghouder dat ten minste een maand voordien aan het bevoegd gezag, onder
      vermelding van de bij algemene maatregel van bestuur aangegeven gegevens.

      3 Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen, waarin de omgevingsvergunning
      slechts geldt voor degene aan wie zij is verleend. Daarbij kan tevens worden bepaald dat in daarbij aangewezen
      categorieën gevallen:

      a. de omgevingsvergunning nog gedurende een daarbij aangegeven termijn blijft gelden voor rechtsopvolgers van
      degene aan wie zij is verleend;

      b. de omgevingsvergunning ook geldt voor een rechtspersoon aan wie zij is overgedragen door een andere
      rechtspersoon, indien daarvoor door het bevoegd gezag toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.25
  - number: '2.26'
    text: |-
      1 Naar aanleiding van een aanvraag die betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], waarbij vanuit een inrichting of mijnbouwwerk afvalwater of andere
      afvalstoffen in een voorziening voor de inzameling en het transport van afvalwater worden gebracht, stelt het
      bevoegd gezag het bestuursorgaan dat zorg draagt voor het beheer van het zuiveringtechnisch werk, bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref2], of het oppervlaktewater waarop het afvalwater vanuit die
      voorziening wordt gebracht, in de gelegenheid advies uit te brengen.

      2 Indien ten gevolge van de activiteit waarvoor vergunning wordt gevraagd:

      a. de doelmatige werking van het zuiveringtechnisch werk, bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref3], zou worden belemmerd, of

      b. de bij een algemene maatregel van bestuur als bedoeld in [artikel 5.1 van de Wet milieubeheer][ref4] ter
      uitvoering van een EU-richtlijn of een EU-verordening gestelde milieukwaliteitseisen voor oppervlaktewaterlichamen
      zouden worden overschreden,

      kan het advies inhouden dat de daarin opgenomen voorschriften die nodig zijn om die gevolgen te voorkomen, aan de
      vergunning moeten worden verbonden. Indien die gevolgen niet kunnen worden voorkomen, kan het advies inhouden dat
      de vergunning geheel of gedeeltelijk moet worden geweigerd.

      3 Het bevoegd gezag stelt de bij algemene maatregel van bestuur en, in gevallen als bedoeld in [artikel 2.2][ref5],
      de bij de betrokken verordening aangewezen bestuursorganen of andere instanties in gevallen die behoren tot een bij
      die maatregel, onderscheidenlijk verordening aangewezen categorie in de gelegenheid hem advies uit te brengen over
      de aanvraag of het ontwerp van de beschikking op de aanvraag om een omgevingsvergunning.

      4 Het bevoegd gezag kan een als adviseur aangewezen bestuursorgaan verzoeken om naar aanleiding van een aanvraag om
      een omgevingsvergunning advies uit te brengen over:

      a. de bij de beslissing op de aanvraag te betrekken gegevens,

      b. aan de vergunning te verbinden voorschriften,

      met betrekking tot activiteiten die zullen plaatsvinden binnen het grondgebied van de rechtspersoon waartoe het
      betrokken bestuursorgaan behoort en ten aanzien waarvan dat orgaan bijzondere deskundigheid bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
