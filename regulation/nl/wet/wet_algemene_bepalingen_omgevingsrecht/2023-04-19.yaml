  - number: 2.5a
    text: |-
      Indien toepassing wordt gegeven aan [artikel 2.7, eerste lid, tweede volzin][ref1], kan de omgevingsvergunning voor
      de activiteit, bedoeld in [artikel 2.1, eerste lid, onder c][ref2], bij de beschikking waarbij wordt beslist op de
      aanvraag om een omgevingsvergunning voor de overige onlosmakelijke activiteiten worden gewijzigd, voor zover dat
      nodig is met het oog op het verlenen van die omgevingsvergunning.


