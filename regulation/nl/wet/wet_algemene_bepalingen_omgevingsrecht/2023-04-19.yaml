  - number: 2.33a
    text: |-
      1 In een geval behorende tot een krachtens [artikel 4.1][ref1] aangewezen categorie kan een voorschrift
      overeenkomstig de betrokken algemene maatregel van bestuur aan een beschikking tot gehele of gedeeltelijke
      intrekking van de omgevingsvergunning worden verbonden.

      2 In een beschikking als bedoeld in het eerste lid kan worden bepaald dat een voorschrift als bedoeld in het eerste
      lid, dan wel daarbij aangegeven aan de omgevingsvergunning verbonden voorschriften gedurende een daarbij aan te
      geven termijn blijven gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel4.1
