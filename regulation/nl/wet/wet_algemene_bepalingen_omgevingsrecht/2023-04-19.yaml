  - number: 6.2c
    text: |-
      1 Onverminderd [artikel 6.1][ref1] treedt een omgevingsvergunning met betrekking tot een activiteit als bedoeld
      in [artikel 2.1, eerste lid, onder a][ref2], indien het te bouwen bouwwerk een bouwwerk betreft als bedoeld in
      [artikel 8, derde lid, van de Woningwet][ref3] en het bevoegd gezag op basis van het onderzoeksrapport, bedoeld
      in artikel 8, vierde lid, onderdeel c, van die wet, dan wel uit anderen hoofde een redelijk vermoeden heeft dat
      ter plaatse van het bouwwerk sprake is van een vóór 1 januari 1987 ontstaan geval van ernstige verontreiniging als
      bedoeld in de [Wet bodembescherming][ref4], niet eerder in werking dan nadat:

      a. op grond van [artikel 29, eerste lid][ref5], in samenhang met
      [artikel 37, eerste lid, van de Wet bodembescherming][ref6] is vastgesteld dat geen sprake is van een geval van
      ernstige verontreiniging ten aanzien waarvan spoedige sanering noodzakelijk is en het desbetreffende besluit in
      werking is getreden,

      b. op grond van [artikel 39, tweede lid, van de Wet bodembescherming][ref7] met het saneringsplan, bedoeld in het
      eerste lid van dat artikel, is ingestemd en het desbetreffende besluit in werking is getreden, of

      c. een melding van een voornemen tot sanering als bedoeld in
      [artikel 39b, derde lid, van de Wet bodembescherming][ref8] is gedaan en de bij of krachtens het vierde lid van dat
      artikel gestelde termijn is verstreken.

      2 In afwijking van het eerste lid, aanhef en onder b, treedt de omgevingsvergunning in
      werking als in de beschikking, bedoeld in [artikel 29, eerste lid][ref9], in samenhang met
      [artikel 37, eerste lid, van de Wet bodembescherming][ref10], is vastgesteld dat:

      a. sprake is van een geval van ernstige verontreiniging ten aanzien waarvan spoedige sanering noodzakelijk is,

      b. geen sprake is van risico’s voor de mens, en

      c. het bouwen de uitvoering van de sanering niet belemmert,

      mits degene die het nader onderzoek heeft overgelegd daarbij een met redenen omkleed verzoek heeft ingediend en de
      beschikking, bedoeld in de aanhef van dit lid, in werking is getreden.

      3 Bij de omgevingsvergunning, bedoeld in het eerste lid, vermeldt het bevoegd gezag of het een vermoeden heeft als
      bedoeld in dat lid.


