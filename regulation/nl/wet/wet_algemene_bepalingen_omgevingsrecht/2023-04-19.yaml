  - number: '6.4'
    text: |-
      Indien in een geval als bedoeld in [artikel 3.16][ref1] beroep is ingesteld tegen een beschikking op de aanvraag
      om een watervergunning en krachtens [artikel 2.1][ref2] of [2.2][ref3] een daarmee samenhangende beschikking is
      gegeven met betrekking tot een omgevingsvergunning, heeft het beroep, voor zover het die samenhang betreft, ook
      betrekking op de laatstbedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3.16
