  - number: '5.5'
    text: |-
      De betrokken bestuursorganen dragen zorg voor een goede kwaliteit van de uitvoering en handhaving van het
      bepaalde bij of krachtens de betrokken wetten voor andere taken dan de taken, aangewezen bij of krachtens
      [artikel 5.3, vierde lid][ref1]. Provinciale staten, onderscheidenlijk de gemeenteraad, kunnen, gehoord Onze
      Minister en het College van procureurs-generaal, onderscheidenlijk gedeputeerde staten, regels stellen over de
      uitvoering en handhaving in opdracht van gedeputeerde staten, onderscheidenlijk van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.3
