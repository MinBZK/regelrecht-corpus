  - number: '6.3'
    text: |-
      1 Indien een vergunning met toepassing van [artikel 2.5][ref1] in fasen wordt verleend, treden – in afwijking van
      de [artikelen 6.1][ref2] en [6.2a tot en met 6.2c][ref3] – de beschikkingen met betrekking tot de eerste en tweede
      fase op dezelfde dag in werking. Deze dag is de laatste van de dagen waarop de beschikkingen, met toepassing van de
      artikelen 6.1 en 6.2a tot en met 6.2c, elk afzonderlijk in werking zouden treden.

      2 In gevallen waarin de vergunning met toepassing van [artikel 2.5][ref4] in fasen wordt verleend en de
      beschikkingen in de eerste en de tweede fase tegelijkertijd in bezwaar of beroep aanhangig zijn, worden die
      beschikkingen voor de behandeling in bezwaar, onderscheidenlijk beroep als één besluit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.5
