  - number: '8.3'
    text: |-
      1 Deze wet is, voor zover deze betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref1], niet van toepassing op inrichtingen waarvoor een vergunning is vereist
      krachtens [artikel 15, onder b, van de Kernenergiewet][ref2], behoudens voor zover uit de bepalingen van die wet
      anders blijkt. Deze wet is evenmin van toepassing op inrichtingen, voor zover daarvoor bij of krachtens andere dan
      in de eerste volzin genoemde bepalingen van [die wet][ref3] vergunning is vereist of algemene voorschriften gelden,
      behoudens voor zover uit de bij of krachtens [die wet][ref4] gestelde bepalingen anders blijkt.

      2 Deze wet is, voor zover deze betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref5], niet van toepassing op inrichtingen of mijnbouwwerken, voor zover
      daarvoor een vergunning is vereist of algemene voorschriften gelden krachtens de [artikelen 3.1][ref6],
      [3.3 tot en met 3.6][ref7], [6.4][ref8] en [7.1 van de Wet dieren][ref9] met betrekking tot dierlijke bijproducten
      of de [Waterwet][ref10], behoudens voor zover uit de bepalingen van die wetten anders blijkt.

      3 Deze wet is, voor zover deze betrekking heeft op activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref11], niet van toepassing op inrichtingen waarin van buiten de inrichting
      afkomstige dierlijke meststoffen in de zin van de [Meststoffenwet][ref12] worden bewaard, bewerkt, verwerkt of
      vernietigd, voor zover het een doelmatig beheer van die stoffen betreft.

      4 Deze wet is niet van toepassing op activiteiten als bedoeld in [artikel 2.1][ref13] met betrekking tot
      windparken in de territoriale zee op een plaats die niet deel uitmaakt van een gemeente of een provincie en waarop
      de [Wet windenergie op zee][ref14] op van toepassing is.


