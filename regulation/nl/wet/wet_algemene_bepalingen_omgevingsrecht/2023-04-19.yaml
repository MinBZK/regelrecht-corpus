  - number: '3.20'
    text: |-
      1 Indien burgemeester en wethouders bevoegd zijn de beschikking op de aanvraag om de omgevingsvergunning
      of wijziging van voorschriften van de omgevingsvergunning te verlenen, kunnen gedeputeerde staten, indien
      dat met het oog op de samenhang tussen de beschikkingen op de onderscheidene aanvragen in het belang
      van de bescherming van het milieu geboden is, en zo nodig in afwijking van regels, gesteld krachtens
      [artikel 1.3c van de Wet milieubeheer][ref1], op een daartoe strekkend verzoek van het orgaan dat bevoegd is de
      watervergunning te verlenen, aan burgemeester en wethouders een aanwijzing geven ter zake van de inhoud van die
      beschikking.

      2 Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvraag
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref2] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.

      3 De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een
      exemplaar ervan wordt gevoegd bij ieder exemplaar van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.3c
