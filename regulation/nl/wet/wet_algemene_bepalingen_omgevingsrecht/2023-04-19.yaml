  - number: '7.6'
    text: |-
      1 Er is een landelijke voorziening waarin gegevens en bescheiden worden opgenomen die betrekking hebben op
      aanvragen om een omgevingsvergunning die geheel of gedeeltelijk elektronisch worden ingediend alsmede op aanvragen
      om daarop volgende beschikkingen.

      2 Het bevoegd gezag en de bestuursorganen die zijn betrokken bij de beslissing omtrent de verlening van een
      omgevingsvergunning, maken gebruik van de voorziening, bedoeld in het eerste lid. Het bevoegd gezag draagt zorg
      voor het beheer van de in de voorziening opgenomen gegevens en bescheiden en de verstrekking daarvan aan de
      bestuursorganen, bedoeld in de eerste volzin. Bij of krachtens algemene maatregel van bestuur kunnen regels worden
      gesteld omtrent dat beheer en die verstrekking.

      3 Onze Minister draagt zorg voor de inrichting, instandhouding, werking en beveiliging van de voorziening, bedoeld
      in het eerste lid. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot
      de inrichting, instandhouding, werking en beveiliging van die voorziening.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel7.6
  - number: '8.1'
    text: |-
      1 Indien voor een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref1], met betrekking tot
      een inrichting, het in de aanhef van dat artikel bedoelde verbod op enig tijdstip gaat gelden, dat voor die
      activiteit voordien niet gold, kan de activiteit indien daarmee op dat tijdstip al was begonnen, zonder vergunning
      worden voortgezet tot twaalf weken na dat tijdstip en, indien binnen die termijn een aanvraag om de vereiste
      omgevingsvergunning is ingediend, vervolgens tot acht weken na het tijdstip waarop de beschikking op de aanvraag in
      werking is getreden.

      2 Indien het verbod gaat gelden ten gevolge van een verandering van de activiteit, is het eerste lid niet van
      toepassing voor zover het die verandering betreft.

      3 Indien voor de activiteit algemene regels golden voor het tijdstip waarop het verbod daarvoor ging gelden,
      blijven die regels voor de activiteit van toepassing gedurende de periode waarin zij zonder vergunning mag worden
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.2'
    text: |-
      1 Indien bij of krachtens een wettelijk voorschrift of door een verandering van een project de bevoegdheid te
      beslissen op aanvragen om een omgevingsvergunning overgaat naar een ander bestuursorgaan, worden de voor dat
      project al verleende omgevingsvergunningen gelijkgesteld met omgevingsvergunningen, verleend door dat andere
      bestuursorgaan.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot een overgang als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel8.2
  - number: 8.2a
    text: |-
      1 Indien voor het bouwen of gebruiken van een woonboot of een ander drijvend object dat
      hoofdzakelijk wordt gebruikt voor verblijf voor of op het tijdstip van inwerkingtreding van de
      [Wet verduidelijking voorschriften woonboten][ref1] krachtens een provinciale of een gemeentelijke verordening een
      vergunning of ontheffing is verleend, wordt die vergunning of ontheffing gelijkgesteld met een omgevingsvergunning
      als bedoeld in [artikel 2.1, eerste lid, onderdeel a, c of d][ref2].

      2 Een woonboot of een ander drijvend object dat hoofdzakelijk wordt gebruikt voor verblijf ten aanzien
      waarvan tot het tijdstip van inwerkingtreding van de [Wet verduidelijking voorschriften woonboten][ref3]
      krachtens een provinciale of een gemeentelijke verordening geen vergunning of ontheffing werd vereist voor het
      bouwen of gebruiken ervan, wordt met ingang van het tijdstip van inwerkingtreding van de Wet verduidelijking
      voorschriften woonboten gelijkgesteld met een bouwwerk waarvoor een omgevingsvergunning als bedoeld in de
      [artikelen 2.1, eerste lid, onderdelen a, c of d][ref4] is verleend.

      3 Voorwaarden waaronder een vergunning of ontheffing als bedoeld in het eerste of tweede lid is verleend, worden
      gelijkgesteld met aan de omgevingsvergunning verbonden voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0039181
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
