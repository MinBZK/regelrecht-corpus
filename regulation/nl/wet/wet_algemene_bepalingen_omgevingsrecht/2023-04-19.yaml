  - number: '3.23'
    text: |-
      Het bevoegd gezag kan een omgevingsvergunning geheel of gedeeltelijk intrekken, indien de watervergunning geheel of
      gedeeltelijk wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel3.23
  - number: '4.1'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat in daarbij aangewezen categorieën gevallen waarin een
      omgevingsvergunning betrekking heeft op een activiteit die ernstige nadelige gevolgen voor de fysieke leefomgeving
      kan hebben, degene die de activiteit verricht, verplicht is tot het stellen van financiële zekerheid:

      a. voor het nakomen van krachtens de omgevingsvergunning voor hem geldende verplichtingen;

      b. ter dekking van zijn aansprakelijkheid voor schade die voortvloeit uit door de activiteit veroorzaakte nadelige
      gevolgen voor de fysieke leefomgeving.

      2 Bij de maatregel worden regels gesteld met betrekking tot de vorm waarin, het bedrag waarvoor en de termijn
      gedurende welke de zekerheid in stand wordt gehouden en over de voorwaarden waaraan moet zijn voldaan voordat de
      verplichting komt te vervallen.

      3 In gevallen als bedoeld in het eerste lid, onder a, bepaalt het bevoegd gezag tot welk bedrag het verhaal neemt
      op de zekerheid bij het niet-nakomen van een verplichting. Het bevoegd gezag kan het te verhalen bedrag invorderen
      bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel4.1
  - number: '4.2'
    text: |-
      1 Het bevoegd gezag kent degene tot wie een beschikking is gericht krachtens:

      a. [artikel 2.1, eerste lid, onder a, b, c of h][ref1], voor zover daaraan in het belang van de archeologische
      monumentenzorg voorschriften zijn verbonden,

      b. [artikel 2.1, eerste lid, onder b of c][ref2], voor zover daarbij de omgevingsvergunning in het belang van de
      archeologische monumentenzorg is geweigerd,

      c. [artikel 2.1, eerste lid, onder e, onder 2°, of onder 3°][ref3], juncto [artikel 8.1, eerste lid][ref4], in
      gevallen waarin het tweede lid van dat artikel niet van toepassing is,

      d. [artikel 2.1, eerste lid, onder f][ref5],

      e. [artikel 2.1, eerste lid, onder i][ref6], voor zover dat bij de krachtens dat onderdeel vastgestelde algemene
      maatregel van bestuur is bepaald,

      f. [artikel 2.1, eerste lid, onder e, onder 2° of 3°][ref7], met toepassing van [artikel 2.6][ref8], voor zover
      de rechten die de vergunninghouder aan al eerder krachtens die onderdelen verleende vergunningen ontleende, daarbij
      zijn gewijzigd,

      g. [artikel 2.19][ref9], voor zover dat bij het betrokken wettelijk voorschrift is bepaald,

      h. [artikel 2.31, eerste lid, onder a, b of c][ref10],

      i. [artikel 2.31, eerste lid, onder d][ref11], voor zover dat bij het betrokken wettelijk voorschrift is bepaald,

      j. [artikel 2.33, eerste lid, onder a, b, c, d of e, of tweede lid, onder e of f][ref12],

      k. [artikel 2.33, eerste lid, onder g][ref13], voor zover dat bij het betrokken wettelijk voorschrift is bepaald,

      l. [artikel 2.33, tweede lid, onder f of g][ref14], voor zover dat bij de betrokken algemene maatregel van bestuur,
      onderscheidenlijk verordening is bepaald, of

      m. [artikel 2.33, tweede lid, onder h][ref15], voor zover dat bij het betrokken wettelijk voorschrift is bepaald,

      en die ten gevolge daarvan kosten maakt of schade lijdt die redelijkerwijs niet of niet geheel voor zijn rekening
      behoren te komen op zijn verzoek of uit eigen beweging een naar billijkheid te bepalen vergoeding toe, voor zover
      niet op andere wijze in een redelijke vergoeding is of kan worden voorzien.

      2 Indien de beschikking op de aanvraag om een vergunning met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref16] is voorbereid, kan een verzoek om vergoeding worden
      ingediend na de toezending van het ontwerp van de beschikking aan de aanvrager.

      3 Indien het bevoegd gezag advies heeft ingewonnen over een verzoek om vergoeding of over het voornemen tot
      toekenning daarvan uit eigen beweging, zendt het een exemplaar van het advies aan de belanghebbende. Het vermeldt
      daarbij de termijn waarbinnen deze zijn zienswijze over het advies kenbaar kan maken.


