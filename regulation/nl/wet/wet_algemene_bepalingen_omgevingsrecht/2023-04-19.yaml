  - number: '2.12'
    text: |-
      1 Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder c][ref1], kan de omgevingsvergunning slechts worden verleend indien de activiteit
      niet in strijd is met een goede ruimtelijke ordening en:

      a. indien de activiteit in strijd is met het bestemmingsplan of de beheersverordening:

      1°. met toepassing van de in het bestemmingsplan of de beheersverordening opgenomen regels inzake afwijking,

      2°. in de bij algemene maatregel van bestuur aangewezen gevallen, of

      3°. in overige gevallen, indien de motivering van het besluit een goede ruimtelijke onderbouwing bevat;

      b. indien de activiteit in strijd is met het exploitatieplan: met toepassing van de daarin opgenomen regels inzake
      afwijking;

      c. indien de activiteit in strijd is met de regels die zijn gesteld krachtens [artikel 4.1, derde lid][ref2],
      of [4.3, derde lid, van de Wet ruimtelijke ordening][ref3]: voor zover de betrokken regels afwijking daarvan
      toestaan;

      d. indien de activiteit in strijd is met een voorbereidingsbesluit: met toepassing van de in het
      voorbereidingsbesluit opgenomen regels inzake afwijking.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud van de ruimtelijke
      onderbouwing, bedoeld in het eerste lid, onder a, onder 3°.


