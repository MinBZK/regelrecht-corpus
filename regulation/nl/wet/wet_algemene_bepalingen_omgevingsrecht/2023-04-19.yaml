  - number: '5.7'
    text: |-
      1 Bij algemene maatregel van bestuur worden in het belang van een doelmatige uitvoering en handhaving van het
      bepaalde bij of krachtens de betrokken wetten, regels gesteld over:

      a. een strategische en programmatische uitvoering en handhaving van het bepaalde bij of krachtens de betrokken
      wetten door de betrokken bestuursorganen;

      b. een onderling afgestemde uitoefening van bevoegdheden met betrekking tot de uitvoering en handhaving, bedoeld
      onder a, en de daarmee samenhangende werkzaamheden tussen de bij de handhaving betrokken bestuursorganen en de
      onder hun gezag werkzame toezichthouders alsmede over de afstemming van deze werkzaamheden op de werkzaamheden van
      de instanties die belast zijn met de strafrechtelijke handhaving van het bepaalde bij of krachtens de betrokken
      wetten;

      c. over de prioriteitstelling bij de uitvoering en handhaving voor zover die prioriteitstelling van bovenregionaal
      belang is.

      De maatregel bevat geen regels over activiteiten als bedoeld in [artikel 2.2][ref1].

      2 Bij regeling van Onze Minister kunnen, in overeenstemming met Onze betrokken Minister, nadere regels worden
      gesteld over het bepaalde bij de maatregel, bedoeld in het eerste lid.

      3 Onze Minister draagt zorg voor de afstemming van de uitvoering van het bepaalde krachtens het eerste en tweede
      lid, voor zover die afstemming naar zijn oordeel van bovenprovinciaal belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.7
