  - number: '4.3'
    text: |-
      1 Voor zover Onze Minister heeft ingestemd met het toekennen van een vergoeding krachtens [artikel 4.2][ref1] van
      kosten of schade ten gevolge van beschikkingen met betrekking tot activiteiten met betrekking tot inrichtingen als
      bedoeld in [artikel 2.1, eerste lid, onder e][ref2], komen de kosten daarvan ten laste van het Rijk.

      2 In gevallen waarin het bevoegd gezag een beschikking als bedoeld in [artikel 4.2, eerste lid][ref3],
      heeft gegeven ter uitvoering van een verzoek van een bestuursorgaan, als bedoeld in
      [artikel 2.29, eerste lid, tweede volzin, onder a][ref4], komen de kosten van de vergoeding, voor zover het de
      uitvoering van dat verzoek betreft, ten laste van dat bestuursorgaan, voor zover Onze Minister daarmee niet heeft
      ingestemd.

      3 Voor zover het bevoegd gezag een beschikking als bedoeld in [artikel 4.2, eerste lid][ref5], heeft gegeven
      vanwege het van toepassing worden van bepalingen van een provinciale milieuverordening als bedoeld in
      [artikel 1.2, tweede lid, onder a, van de Wet milieubeheer][ref6], houdende een verbod tot het in werking hebben,
      veranderen of veranderen van de werking van inrichtingen, met betrekking tot een inrichting die al was opgericht op
      het moment waarop de betrokken bepaling van toepassing werd, komen de kosten van de schadevergoeding ten laste van
      de provincie, voor zover gedeputeerde staten daarmee hebben ingestemd.


