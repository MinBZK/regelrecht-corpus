  - number: '2.13'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder d][ref1],
      wordt de omgevingsvergunning geweigerd indien de brandveiligheid met het oog op het voorziene gebruik van het
      bouwwerk niet voldoende verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.14'
    text: |-
      1 Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref1]:

      a. betrekt het bevoegd gezag bij de beslissing op de aanvraag in ieder geval:

      1°. de bestaande toestand van het milieu, voor zover de inrichting of het mijnbouwwerk daarvoor gevolgen kan
      veroorzaken;

      2°. de gevolgen voor het milieu, mede in hun onderlinge samenhang bezien, die de inrichting of het mijnbouwwerk kan
      veroorzaken, mede gezien de technische kenmerken en de geografische ligging daarvan;

      3°. de met betrekking tot de inrichting of het mijnbouwwerk en het gebied waar de inrichting of het mijnbouwwerk
      zal zijn of is gelegen, redelijkerwijs te verwachten ontwikkelingen die van belang zijn met het oog op de
      bescherming van het milieu;

      4°. de voor het einde van de in [artikel 3:16 van de Algemene wet bestuursrecht][ref2] bedoelde termijn of de
      krachtens [artikel 3.12, zesde lid][ref3], aangegeven termijn ingebrachte adviezen en zienswijzen;

      5°. de mogelijkheden tot bescherming van het milieu, door de nadelige gevolgen voor het milieu, die de inrichting
      of het mijnbouwwerk kan veroorzaken, te voorkomen, of zoveel mogelijk te beperken, voor zover zij niet kunnen
      worden voorkomen;

      6°. het systeem van met elkaar samenhangende technische, administratieve en organisatorische maatregelen om de
      gevolgen die de inrichting of het mijnbouwwerk voor het milieu veroorzaakt, te monitoren, te beheersen en, voor
      zover het nadelige gevolgen betreft, te verminderen, dat degene die de inrichting of het mijnbouwwerk drijft, met
      betrekking tot de inrichting of het mijnbouwwerk toepast, alsmede het milieubeleid dat hij met betrekking tot de
      inrichting of het mijnbouwwerk voert;

      b. houdt het bevoegd gezag bij die beslissing in ieder geval rekening met:

      1°. het voor hem geldende milieubeleidsplan;

      2°. het bepaalde in de [artikelen 10.14][ref4] en [10.29a van de Wet milieubeheer][ref5];

      3°. de voor de onderdelen van het milieu, waarvoor de inrichting of het mijnbouwwerk gevolgen kan hebben, geldende
      richtwaarden, voor zover de verplichting tot het rekening houden daarmee is vastgelegd krachtens of overeenkomstig
      [artikel 5.2][ref6] of [5.17 van de Wet milieubeheer][ref7];

      c. neemt het bevoegd gezag bij die beslissing in ieder geval in acht:

      1°. dat in de inrichting of het mijnbouwwerk ten minste de voor de inrichting of het mijnbouwwerk in aanmerking
      komende beste beschikbare technieken moeten worden toegepast;

      2°. de voor de onderdelen van het milieu, waarvoor de inrichting of het mijnbouwwerk gevolgen kan hebben, geldende
      grenswaarden, voor zover de verplichting tot het in acht nemen daarvan is vastgelegd krachtens of overeenkomstig
      [artikel 5.2 van de Wet milieubeheer][ref8], is vastgelegd in of krachtens [artikel 5.16 van die wet][ref9],
      dan wel voor zover het inrichtingen betreft voortvloeit uit de [artikelen 40][ref10], [44 tot en met 47][ref11],
      [50][ref12], [51][ref13], [53 tot en met 56][ref14], [59 tot en met 61][ref15], [63, tweede lid][ref16],
      [64][ref17], [65][ref18] of [66 van de Wet geluidhinder][ref19];

      3°. in afwijking van onderdeel 2°, neemt het bevoegd gezag, voor zover het de geldende grenswaarden betreft, die
      voortvloeien uit de in dat onderdeel genoemde artikelen van de [Wet geluidhinder][ref20], bij de beslissing op de
      aanvraag om een vergunning voor een inrichting, gelegen op een industrieterrein waarvoor een geluidreductieplan als
      bedoeld in [artikel 67 van de Wet geluidhinder][ref21] is vastgesteld, het geldende geluidreductieplan in acht;

      4°. de onderdelen van het advies, bedoeld in [artikel 2.26, tweede lid][ref22], ten aanzien waarvan in het advies
      is aangegeven dat daaraan moet worden voldaan, voor zover daardoor geen strijd ontstaat met het bepaalde in de
      andere onderdelen van dit lid of het tweede lid, of het bepaalde bij of krachtens [artikel 2.22][ref23];

      d. en betrekt het bevoegd gezag bij die beslissing de bij een algemene maatregel van bestuur als bedoeld in
      [artikel 5.1 van de Wet milieubeheer][ref24] ter uitvoering van een EU-richtlijn of EU-verordening gestelde
      milieukwaliteitseisen op de bij die maatregel aangegeven wijze, voor zover de verplichting daartoe krachtens of
      overeenkomstig [artikel 5.2 van de Wet milieubeheer][ref25] is vastgelegd in die maatregel.

      2 Voor zover de aanvraag om een activiteit als bedoeld in het eerste lid betrekking heeft op een inrichting
      waarin stoffen behorende tot een in [artikel 9.2.3.1, tweede lid, van de Wet milieubeheer][ref26] aangewezen
      categorie aanwezig kunnen zijn en die behoort tot een bij algemene maatregel van bestuur aangewezen categorie,
      draagt het bevoegd gezag er zorg voor dat de beslissing op de aanvraag niet tot gevolg heeft dat minder dan
      voldoende afstand aanwezig is tussen die inrichting en een beschermd natuurmonument of gebied dat als zodanig
      is aangewezen krachtens [artikel 10 van de Natuurbeschermingswet 1998][ref27] of een gebied dat als zodanig
      is aangewezen krachtens [artikel 10a van die wet][ref28] of dat voorlopig als zodanig is aangewezen krachtens
      [artikel 12 van die wet][ref29]. Bij de beoordeling van de afstand betrekt het bevoegd gezag de maatregelen die
      zijn of worden getroffen om een voorval als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref30] waarbij
      stoffen als bedoeld in de eerste volzin zijn betrokken en waardoor ernstig gevaar voor het milieu ontstaat, in de
      inrichting te voorkomen of de gevolgen daarvan te beperken.

      3 Voor zover het een activiteit betreft als bedoeld in het eerste lid, kan de omgevingsvergunning slechts in het
      belang van de bescherming van het milieu worden geweigerd.

      4 Het bevoegd gezag geeft in de motivering van de beslissing op de aanvraag te kennen, op welke wijze de in het
      eerste lid, onder a, genoemde aspecten de inhoud van het besluit hebben beïnvloed. Indien toepassing wordt gegeven
      aan het eerste lid, onder c, onder 3°, vermeldt het bevoegd gezag dit in de motivering.

      5 In afwijking van het eerste tot en met vierde lid wordt in gevallen als bedoeld in
      [artikel 3.10, derde lid][ref31], de omgevingsvergunning verleend indien wordt voldaan aan de in het laatstgenoemde
      lid gestelde voorwaarden.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de
      voor een inrichting of mijnbouwwerk in aanmerking komende beste beschikbare technieken moeten worden bepaald.
      Daarbij kan worden bepaald dat de gestelde regels slechts gelden in gevallen die behoren tot een daarbij aangewezen
      categorie.

      7 Bij de toepassing van het eerste lid worden gronden en bouwwerken in de omgeving van de inrichting in
      aanmerking genomen overeenkomstig het bestemmingsplan, de beheersverordening, of, indien met toepassing
      van [artikel 2.12, eerste lid][ref32], van het bestemmingsplan of de beheersverordening is afgeweken, de
      omgevingsvergunning.


