  - number: '2.7'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 2.10, tweede lid][ref1], en [2.11, tweede lid][ref2],
      draagt de aanvrager van een omgevingsvergunning er zorg voor dat de aanvraag betrekking heeft op alle
      onlosmakelijke activiteiten binnen het betrokken project. In afwijking van de eerste volzin en onverminderd
      [artikel 2.5][ref3] kan, indien één van die onlosmakelijke activiteiten een activiteit is als bedoeld in
      [artikel 2.1, eerste lid, onder c][ref4], voor die activiteit voorafgaand aan en los van de overige onlosmakelijke
      activiteiten een aanvraag om een omgevingsvergunning worden ingediend.

      2 Een aanvraag om een omgevingsvergunning die betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e][ref5], mag slechts op één inrichting waartoe een IPPC-installatie behoort
      betrekking hebben.


