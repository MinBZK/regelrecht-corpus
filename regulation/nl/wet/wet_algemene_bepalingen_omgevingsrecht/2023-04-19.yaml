  - number: '3.8'
    text: |-
      Het bevoegd gezag geeft bij de toepassing van [titel 4.1 van de Algemene wet bestuursrecht][ref1] tevens onverwijld
      kennis van de aanvraag om een omgevingsvergunning op de in [artikel 12 van de Bekendmakingswet][ref2] bepaalde
      wijze. Het vermeldt daarbij de in [artikel 3.1, tweede lid][ref3], bedoelde datum waarop de aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel3.8
