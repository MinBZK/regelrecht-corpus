  - number: '2.32'
    text: |-
      Onze Minister wijzigt de omgevingsvergunning of voorschriften van de omgevingsvergunning voor zover deze betrekking
      hebben op een activiteit met betrekking tot een inrichting als bedoeld in [artikel 2.1, eerste lid, onder e][ref1],
      indien zich in de betrokken inrichting een voorval als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref2]
      voordoet of heeft voorgedaan of, indien [titel 17.1A van die wet][ref3] van toepassing is, zich een gebeurtenis
      als bedoeld in [artikel 17.5a van die wet][ref4] voordoet of heeft voorgedaan en de geboden spoed een verzoek
      als bedoeld in [artikel 2.29, tweede lid][ref5], niet toelaat of het bevoegd gezag niet aan het krachtens dat lid
      gedane verzoek binnen de daarbij aangegeven termijn gevolg heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
