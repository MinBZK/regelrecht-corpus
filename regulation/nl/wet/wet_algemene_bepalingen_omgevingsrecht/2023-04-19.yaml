  - number: '3.1'
    text: |-
      1 De aanvraag om een omgevingsvergunning wordt ingediend bij burgemeester en wethouders van de gemeente waar het
      betrokken project in hoofdzaak zal worden of wordt uitgevoerd. Indien burgemeester en wethouders niet bevoegd zijn
      op de aanvraag te beslissen, kan de aanvraag bij het bevoegd gezag worden ingediend. In dat geval zendt het bevoegd
      gezag een afschrift van de aanvraag aan burgemeester en wethouders van de gemeente waar het betrokken project in
      hoofdzaak zal worden of wordt uitgevoerd.

      2 Het orgaan waarbij de aanvraag is ingediend, zendt de aanvrager onverwijld een bewijs van ontvangst
      van de aanvraag, waarin het de datum vermeldt, waarop het de aanvraag heeft ontvangen. In afwijking van
      [artikel 14, eerste lid, aanhef en onder b, van de Dienstenwet][ref1] geldt de daarin gestelde verplichting voor
      zover deze betrekking heeft op het bewijs van ontvangst, bedoeld in de eerste volzin, voor het orgaan waarbij de
      aanvraag is ingediend. [Artikel 29 van de Dienstenwet][ref2] is niet van toepassing.

      3 Het bevoegd gezag zendt de aanvrager nadat het de aanvraag heeft ontvangen, zo snel mogelijk een bericht waarin
      het vermeldt dat het bevoegd is op de aanvraag te beslissen en waarin tevens worden vermeld:

      a. de procedure die ter voorbereiding van de beslissing zal worden gevolgd,

      b. welke beslistermijn van toepassing is, en

      c. de beschikbare rechtsmiddelen om tegen de beschikking op te komen.

      Indien op de voorbereiding van de beslissing [paragraaf 3.2][ref3] van toepassing is, vermeldt het bevoegd gezag
      tevens dat de gevraagde beschikking van rechtswege is gegeven, indien niet tijdig op de aanvraag is beslist.

      4 Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen waarin het bevoegd gezag de
      aanvraag of andere gegevens of bescheiden zendt aan daarbij aangewezen categorieën bestuursorganen of andere
      instanties.

      5 Indien bij de voorbereiding van de beslissing op de aanvraag een milieueffectrapport moet worden gemaakt, is
      [artikel 13.2 van de Wet milieubeheer][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel13.2
