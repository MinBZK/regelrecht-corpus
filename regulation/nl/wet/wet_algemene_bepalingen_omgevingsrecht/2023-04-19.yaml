  - number: '2.3'
    text: |-
      Het is verboden te handelen in strijd met een voorschrift van een omgevingsvergunning dat betrekking heeft op:

      a. activiteiten als bedoeld in [artikel 2.1, eerste lid, onder e][ref1];

      b. activiteiten als bedoeld in [artikel 2.1, eerste lid, onder a, b, c, d, f, g, h of i][ref2];

      c. activiteiten als bedoeld in [artikel 2.2][ref3].


