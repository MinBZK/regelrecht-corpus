  - number: '2.31'
    text: |-
      1 Het bevoegd gezag wijzigt voorschriften van de omgevingsvergunning:

      a. ter uitvoering van een verzoek als bedoeld in [artikel 2.29, eerste lid, tweede volzin, onder a][ref1], of een
      aanwijzing als bedoeld in [artikel 2.34, eerste lid][ref2];

      b. indien door toepassing van [artikel 2.30, eerste lid][ref3], blijkt dat de nadelige gevolgen die de inrichting
      voor het milieu veroorzaakt, gezien de ontwikkeling van de technische mogelijkheden tot bescherming van het milieu,
      verder kunnen, of, gezien de ontwikkeling van de kwaliteit van het milieu, verder moeten worden beperkt;

      c. in gevallen waarin de omgevingsvergunning van rechtswege is verleend, voor zover dit nodig is om ernstige
      nadelige gevolgen voor de fysieke leefomgeving te voorkomen, of, voor zover zodanige gevolgen niet kunnen worden
      voorkomen, deze zoveel mogelijk te beperken;

      d. voor zover deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder i][ref4], voor
      zover dat bij de betrokken algemene maatregel van bestuur is bepaald;

      e. voor zover deze betrekking heeft op een activiteit als bedoeld in [artikel 2.2][ref5], voor zover dat bij de
      betrokken verordening is bepaald;

      f. voor zover deze betrekking heeft op een activiteit als bedoeld in [artikel 2.19][ref6], voor zover dat bij het
      betrokken wettelijk voorschrift is bepaald.

      2 Het bevoegd gezag kan voorschriften van een omgevingsvergunning wijzigen voor zover deze betrekking hebben op:

      a. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder d][ref7], voor zover dit in het belang van de
      brandveiligheid is met het oog op het voorziene gebruik van het bouwwerk;

      b. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref8], voor zover dit in het belang van de
      bescherming van het milieu is;

      c. een activiteit als bedoeld in [artikel 2.1, eerste lid, onder i][ref9], op de gronden die zijn aangegeven in de
      betrokken algemene maatregel van bestuur;

      d. een activiteit als bedoeld in [artikel 2.2][ref10], op de gronden die zijn aangegeven in de betrokken
      verordening;

      e. een activiteit als bedoeld in [artikel 2.19][ref11], op de gronden die zijn aangegeven in het betrokken
      wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.29
