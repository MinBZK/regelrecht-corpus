        paragraaf: '2.1'
  - number: '5.8'
    text: |-
      1 Onze Minister, Onze betrokken Ministers en de betrokken bestuursorganen verstrekken aan elkaar en, voor zover
      deze gegevens noodzakelijk zijn voor de strafrechtelijke handhaving van het bepaalde bij of krachtens de betrokken
      wetten, aan de instanties die belast zijn met de strafrechtelijke handhaving van die wetten, de gegevens waarover
      zij beschikken in verband met de taken, bedoeld in [artikel 5.3, vierde lid][ref1].

      2 Bij algemene maatregel van bestuur kunnen andere bestuursorganen en instanties dan die bedoeld in het eerste lid
      worden aangewezen, die bevoegd zijn uit eigen beweging en desgevraagd verplicht gegevens waarover zij beschikken in
      verband met de taken, bedoeld in [artikel 5.3, vierde lid][ref2], te verstrekken aan Onze Minister, Onze betrokken
      Ministers, de betrokken bestuursorganen of de instanties die belast zijn met de strafrechtelijke handhaving van
      het bepaalde bij of krachtens de betrokken wetten, voor zover deze gegevens noodzakelijk zijn voor een doelmatige
      bestuursrechtelijke en strafrechtelijke handhaving van het bepaalde bij of krachtens die wetten.

      3 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. de gevallen waarin in ieder geval voldaan is aan de verplichting, bedoeld in het eerste lid, tot het verstrekken
      van gegevens en de wijzen waarop gegevens als bedoeld in het eerste of tweede lid, worden verstrekt;

      b. de verwerking van persoonsgegevens, bedoeld in artikel 4, aanhef en onder 2, van de Algemene verordening
      gegevensbescherming, door de bestuursorganen, toezichthouders, omgevingsdiensten en door de krachtens het tweede
      lid aangewezen andere organen en instanties, voor zover die gegevens noodzakelijk zijn voor de strafrechtelijke
      handhaving van het bepaalde bij of krachtens de betrokken wetten, en

      c. tussen wie en de wijze waarop de kosten worden verdeeld, die noodzakelijk verbonden zijn aan het uitvoeren van
      het bepaalde bij en krachtens dit artikel.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat de bestuursorganen en instanties, bedoeld in het
      eerste en tweede lid, andere gegevens dan die waarover zij beschikken in verband met de taken, bedoeld in
      [artikel 5.3, vierde lid][ref3], aan elkaar kunnen verstrekken. Op die gegevens zijn de regels uit het derde lid,
      onder b en c, van toepassing.

      5 Bij regeling van Onze Minister kunnen, in overeenstemming met Onze betrokken Minister, nadere regels worden
      gesteld over het bepaalde bij de maatregel, bedoeld in het derde lid en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5.3
