  - number: '2.21'
    text: |-
      Indien een aanvraag betrekking heeft op een project dat uit verschillende activiteiten bestaat en de
      omgevingsvergunning voor dat project ingevolge de [artikelen 2.10 tot en met 2.20a][ref1] moet worden geweigerd,
      kan het bevoegd gezag op verzoek van de aanvrager de omgevingsvergunning verlenen voor de activiteiten waarvoor zij
      niet behoeft te worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '2.22'
    text: |-
      1 In een omgevingsvergunning worden het project en de activiteiten waarop het betrekking heeft, duidelijk
      beschreven.

      2 Aan een omgevingsvergunning worden de voorschriften verbonden, die nodig zijn met het oog op het belang dat voor
      de betrokken activiteit is aangegeven in het bepaalde bij of krachtens de [artikelen 2.10 tot en met 2.20][ref1].
      Indien toepassing is gegeven aan [artikel 2.27, vierde lid][ref2], worden aan een omgevingsvergunning tevens de
      bij de verklaring aangegeven voorschriften verbonden. De aan de omgevingsvergunning verbonden voorschriften zijn op
      elkaar afgestemd.

      3 Bij of krachtens algemene maatregel van bestuur worden voor daarbij aangewezen categorieën activiteiten of
      gevallen regels gesteld met betrekking tot het verbinden van voorschriften aan de omgevingsvergunning. Hiertoe
      kunnen behoren regels met betrekking tot:

      a. voorschriften ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit
      van een volkenrechtelijke organisatie met betrekking tot de fysieke leefomgeving;

      b. voorschriften, inhoudende een verplichting om te voldoen aan nadere eisen die door een bij het voorschrift
      aangewezen bestuursorgaan worden gesteld;

      c. voorschriften, inhoudende een verplichting voor het krachtens onderdeel b aangewezen bestuursorgaan om van de in
      dat onderdeel bedoelde eisen op een daarbij aan te geven wijze openbaar kennis te geven;

      d. voorschriften die nodig zijn met het oog op het belang van de archeologische monumentenzorg;

      e. voorschriften die niet aan de omgevingsvergunning kunnen worden verbonden.

      4 Bij een verordening als bedoeld in [artikel 2.2][ref3] kunnen voor de betrokken categorieën activiteiten eveneens
      regels worden gesteld met betrekking tot het verbinden van voorschriften aan de omgevingsvergunning.

      5 Voor zover met betrekking tot de activiteit algemeen verbindende voorschriften gelden, kunnen de voorschriften
      die aan de vergunning worden verbonden daarvan alleen afwijken voor zover dat bij die regels is toegestaan. In
      afwijking van de eerste volzin worden aan een omgevingsvergunning die betrekking heeft op een activiteit als
      bedoeld in [artikel 2.1, eerste lid, onder e][ref4], met betrekking tot een inrichting waartoe een IPPC-installatie
      behoort, voorschriften verbonden die afwijken van de algemeen verbindende voorschriften, bedoeld in de eerste
      volzin, voor zover met die voorschriften niet wordt voldaan aan het bepaalde bij of krachtens het tweede of derde
      lid of [artikel 2.14][ref5].

      6 Bij of krachtens algemene maatregel van bestuur kunnen in daarbij aangewezen categorieën gevallen regels worden
      gesteld omtrent het voorbereiden, vormgeven, inrichten of beschikbaar stellen van een omgevingsvergunning of
      omtrent de uitvoerbaarheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
