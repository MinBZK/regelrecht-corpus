  - number: 5.2a
    text: |-
      1 Voor zover dit hoofdstuk bij of krachtens een in [artikel 5.1][ref1] genoemde wet van toepassing is, en een
      orgaan van een waterschap een bij of krachtens dit hoofdstuk gevorderde beslissing niet of niet naar behoren
      neemt dan wel een bij of krachtens dit hoofdstuk gevorderde handeling niet of niet naar behoren verricht, zijn de
      [artikelen 121 tot en met 121f van de Provinciewet][ref2] van overeenkomstige toepassing.

      2 In afwijking van het eerste lid zijn, voor zover [§ 5.2][ref3] bij of krachtens een in [artikel 5.1][ref4]
      genoemde wet van toepassing is en een orgaan van een waterschap een bij of krachtens § 5.2 gevorderde beslissing
      niet of niet naar behoren neemt dan wel een bij of krachtens § 5.2 gevorderde handeling niet of niet naar
      behoren verricht, de [artikelen 124][ref5], [124a][ref6] en [124c tot en met 124h van de Gemeentewet][ref7] van
      overeenkomstige toepassing.

      3 [Hoofdstuk XVIII van de Provinciewet][ref8] is van overeenkomstige toepassing ten aanzien van door een orgaan
      van een waterschap bij of krachtens dit hoofdstuk genomen besluiten en niet-schriftelijke beslissingen, gericht op
      enig rechtsgevolg.

      4 In afwijking van het derde lid is [hoofdstuk XVII van de Gemeentewet][ref9] van overeenkomstige toepassing
      ten aanzien van door een orgaan van een waterschap bij of krachtens [§ 5.2][ref10] genomen besluiten en niet-
      schriftelijke beslissingen, gericht op enig rechtsgevolg.


