  - number: '2.23'
    text: |-
      1 In een omgevingsvergunning voor een voortdurende activiteit kan worden bepaald dat zij, voor zover zij betrekking
      heeft op die activiteit, geldt voor een daarbij aangegeven termijn.

      2 Bij algemene maatregel van bestuur kunnen ten aanzien van activiteiten als bedoeld in het eerste lid categorieën
      gevallen worden aangewezen waarin in de omgevingsvergunning wordt bepaald dat zij slechts geldt voor een daarbij
      aangegeven termijn. Bij de maatregel kan ten aanzien van die termijn worden bepaald:

      a. een maximum gedurende welke deze kan gelden, of

      b. in welke categorieën gevallen deze kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.23
  - number: 2.23a
    text: |-
      1 In een omgevingsvergunning voor een aflopende activiteit kan worden bepaald dat, voor zover zij betrekking heeft
      op die activiteit, de vergunninghouder na het verstrijken van een bij de omgevingsvergunning aangegeven termijn,
      verplicht is de voor de verlening van de omgevingsvergunning bestaande toestand hersteld te hebben.

      2 Bij algemene maatregel van bestuur kunnen ten aanzien van activiteiten als bedoeld in het eerste lid categorieën
      gevallen worden aangewezen waarin in de omgevingsvergunning wordt bepaald dat op de vergunninghouder na het
      verstrijken van een bij de omgevingsvergunning aangegeven termijn, een plicht rust als bedoeld in het eerste lid.
      Ten aanzien van die termijn is [artikel 2.23, tweede lid, laatste volzin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.23
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.23a
    references:
      - id: ref1
