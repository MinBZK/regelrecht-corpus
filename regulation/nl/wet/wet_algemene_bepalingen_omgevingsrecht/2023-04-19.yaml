      aanvrager.

      2 In gevallen waarin een beslissing op de aanvraag om een omgevingsvergunning wordt
      aangehouden wordt voor de toepassing van [artikel 3.9][ref3], onderscheidenlijk
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref4] in plaats van de datum waarop de aanvraag is
      ontvangen uitgegaan van de datum waarop de aanhouding eindigt.


