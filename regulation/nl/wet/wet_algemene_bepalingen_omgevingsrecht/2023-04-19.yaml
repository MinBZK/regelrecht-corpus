  - number: '2.4'
    text: |-
      1 Burgemeester en wethouders van de gemeente waar het betrokken project in hoofdzaak zal worden of wordt
      uitgevoerd, beslissen op de aanvraag om een omgevingsvergunning, behoudens in gevallen als bedoeld in het tweede
      tot en met vijfde lid.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat gedeputeerde staten van de provincie waar het betrokken
      project in hoofdzaak zal worden of wordt uitgevoerd, op de aanvraag beslissen ten aanzien van projecten die behoren
      tot een bij de maatregel aangewezen categorie projecten die van provinciaal belang zijn. Bij de maatregel kan
      worden bepaald dat de aanwijzing slechts geldt in daarbij aangewezen categorieën gevallen.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat Onze daarbij aangewezen Minister op de aanvraag beslist
      ten aanzien van projecten die behoren tot een bij de maatregel aangewezen categorie projecten die van nationaal
      belang zijn. Bij de maatregel kan worden bepaald dat de aanwijzing slechts geldt in daarbij aangewezen categorieën
      gevallen.

      4 Onze Minister kan bepalen dat hij, in afwijking van het eerste, tweede of derde lid, beslist op de aanvraag
      om een omgevingsvergunning ten aanzien van een bij zijn besluit aangewezen project, indien dat geboden is in het
      algemeen belang.

      5 Het bevoegd gezag met betrekking tot een geldende omgevingsvergunning beslist op elke aanvraag die betrekking
      heeft op een project dat zal worden of wordt uitgevoerd op de plaats ten aanzien waarvan die vergunning is
      verleend. De eerste volzin geldt niet voor burgemeester en wethouders in gevallen als bedoeld in het tweede tot en
      met vierde lid en gedeputeerde staten in gevallen als bedoeld in het derde en vierde lid. De eerste volzin geldt
      voorts niet in gevallen die behoren tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel2.4
  - number: '2.5'
    text: |-
      1 Op verzoek van de aanvrager wordt een omgevingsvergunning in twee fasen verleend. De eerste fase heeft slechts
      betrekking op de door de aanvrager aan te geven activiteiten.

      2 Op een aanvraag om een beschikking met betrekking tot de eerste of tweede fase wordt beslist door het
      bestuursorgaan dat bevoegd zou zijn te beslissen op de aanvraag om een omgevingsvergunning voor het betrokken
      project. Een beschikking als bedoeld in de eerste volzin wordt voorbereid overeenkomstig de procedure die van
      toepassing zou zijn op de voorbereiding van de beschikking op de aanvraag om een omgevingsvergunning.

      3 Indien een beschikking met betrekking tot de eerste of tweede fase wordt voorbereid met de uitgebreide
      voorbereidingsprocedure, bedoeld in [paragraaf 3.3][ref1], maar geen betrekking heeft op een activiteit of
      geval als bedoeld in [artikel 3.10, eerste lid][ref2], die niet tevens kan worden aangemerkt als een activiteit
      als bedoeld in het [derde lid van dat artikel][ref3], geeft het bevoegd gezag de beschikking – in afwijking van
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref4] – uiterlijk veertien weken na ontvangst van
      de aanvraag.

      4 De beschikking met betrekking tot de tweede fase wordt niet eerder gegeven dan de beschikking met betrekking tot
      de eerste fase. Indien daardoor de beslistermijn voor de beschikking met betrekking tot de tweede fase zou worden
      overschreden geeft het bevoegd gezag, in afwijking daarvan, de beschikking gelijktijdig met de beschikking met
      betrekking tot de eerste fase.

      5 Het bevoegd gezag kan een beschikking intrekken waarbij positief is beslist op een aanvraag met betrekking tot:

      a. de eerste fase: indien niet uiterlijk twee jaar nadat de beschikking onherroepelijk is geworden een aanvraag is
      ingediend voor de beschikking met betrekking tot de tweede fase,

      b. de eerste of tweede fase: indien op de aanvraag met betrekking tot de andere fase negatief is beslist en niet
      uiterlijk twee jaar nadat de beschikking onherroepelijk is geworden een nieuwe aanvraag is ingediend.

      6 De beschikking met betrekking tot de eerste fase kan bij de beschikking met betrekking tot de tweede fase worden
      gewijzigd voor zover dat nodig is met het oog op het verlenen van de omgevingsvergunning.

      7 Het bepaalde bij of krachtens deze wet met betrekking tot een omgevingsvergunning is, met uitzondering van
      [artikel 2.7][ref5], van overeenkomstige toepassing op de beschikkingen met betrekking tot de eerste en tweede
      fase.

      8 De beschikkingen waarbij positief is beslist op de aanvragen met betrekking tot de eerste en tweede fase worden,
      als deze in werking zijn getreden, tezamen aangemerkt als een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3.10
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3.10
