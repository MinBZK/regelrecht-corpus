        paragraaf: '2.5'
  - number: '5.26'
    text: |-
      1 Een overheidslichaam kan – behoudens matiging door de rechter – de te zijnen laste komende kosten van het
      beheer van afvalstoffen ten aanzien waarvan in strijd is gehandeld met het bij of krachtens deze wet of de
      [Wet milieubeheer][ref1] bepaalde, verhalen op degene door wiens onrechtmatige daad die kosten zijn veroorzaakt, of
      op degene die anderszins krachtens burgerlijk recht buiten overeenkomst aansprakelijk is voor de gevolgen daarvan.

      2 Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      afvalstoffen ongerechtvaardigd wordt verrijkt.

      3 Voor de toepassing van dit artikel is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde afvalstoffen zich heeft voorgedaan, al jegens de overheid onrechtmatig werd
      gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel5.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '6.1'
    text: |-
      1 Een beschikking krachtens deze wet treedt in werking met ingang van de dag na haar bekendmaking.

      2 In afwijking van het eerste lid treedt een beschikking in werking met ingang van de dag na afloop van de termijn,
      bedoeld in [artikel 6:7 van de Algemene wet bestuursrecht][ref1], voor het indienen van:

      a. een bezwaarschrift indien het een omgevingsvergunning betreft met betrekking tot een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, f, g of h][ref2], of [2.2, eerste lid, onder b, c of g][ref3], of een wijziging
      van voorschriften van een omgevingsvergunning die betrekking hebben op een activiteit als hiervoor bedoeld;

      b. een beroepschrift in gevallen waarin zij is voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4].

      3 Indien in gevallen als bedoeld in het tweede lid, gedurende de daar bedoelde termijn bij de bevoegde rechter
      een verzoek om voorlopige voorziening is gedaan, treedt de beschikking niet in werking voordat op dat verzoek is
      beslist.

      4 In afwijking van het eerste lid wordt de werking van een overeenkomstig [artikel 3.9, derde lid][ref5], van
      rechtswege verleende vergunning opgeschort totdat de termijn voor het indienen van een bezwaarschrift, bedoeld in
      [artikel 6:7 van de Algemene wet bestuursrecht][ref6], is verstreken of, indien bezwaar is gemaakt, op dit bezwaar
      is beslist. De vergunninghouder kan de voorzieningenrechter van de rechtbank verzoeken de opschorting op te heffen.
      [Titel 8.3 van de Algemene wet bestuursrecht][ref7] is van overeenkomstige toepassing.

      5 Bij een algemene maatregel van bestuur als bedoeld in [artikel 2.1, eerste lid, onder i][ref8], of een
      verordening als bedoeld in [artikel 2.2, tweede lid][ref9], kan worden bepaald dat met betrekking tot daarbij
      aangewezen activiteiten het tweede en derde lid van overeenkomstige toepassing zijn in daarbij aangewezen
      categorieën gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel67
