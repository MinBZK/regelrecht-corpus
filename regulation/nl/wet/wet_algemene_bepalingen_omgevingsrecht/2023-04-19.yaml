  - number: '5.6'
    text: |-
      1 In opdracht van Onze Minister en Onze betrokken Ministers wordt iedere twee jaar onderzoek gedaan naar de
      doeltreffendheid van de regels bedoeld in [artikel 5.4, eerste lid][ref1], en de wijze waarop wordt zorg gedragen,
      bedoeld in [artikel 5.5][ref2].

      2 Indien naar het oordeel van Onze Minister en Onze betrokken Ministers komt vast te staan dat de regels, bedoeld
      in [artikel 5.4, eerste lid][ref3], onvoldoende doeltreffend zijn, onderscheidenlijk dat de zorg, bedoeld in
      [artikel 5.5][ref4], onvoldoende doeltreffend is, kunnen die regels bij algemene maatregel van bestuur worden
      gesteld.

      3 Bij de maatregel, bedoeld in het tweede lid, kan worden bepaald dat de regels slechts gelden in daarbij
      aangewezen categorieën van gevallen. De maatregel bevat geen regels over activiteiten als bedoeld in
      [artikel 2.2][ref5].

      4 Bij regeling van Onze Minister kunnen, in overeenstemming met Onze betrokken Ministers, nadere regels worden
      gesteld over het bepaalde bij de maatregel, bedoeld in het eerste lid.


