      1 Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van een door het bevoegd gezag ambtshalve gegeven
      beschikking tot wijziging van een omgevingsvergunning of voorschriften van een omgevingsvergunning of tot gehele of
      gedeeltelijke intrekking van een omgevingsvergunning:

      a. doet het mededeling van die beschikking op de in [artikel 12 van de Bekendmakingswet][ref1] bepaalde wijze;

      b. zendt het in bij algemene maatregel van bestuur aangewezen categorieën gevallen de daarbij aangewezen
      bestuursorganen een afschrift van die beschikking.

      2 Met betrekking tot een aanvraag om wijziging van voorschriften van de omgevingsvergunning of gehele
      of gedeeltelijke intrekking van de omgevingsvergunning zijn de [artikelen 3.1][ref2], [3.8][ref3] en
      [3.9, eerste en tweede lid][ref4], van overeenkomstige toepassing. Indien de vergunninghouder de wijziging van
      voorschriften van de omgevingsvergunning of de gehele of gedeeltelijke intrekking van de omgevingsvergunning
      aanvraagt, zijn tevens het [derde en vierde lid van artikel 3.9][ref5] van overeenkomstige toepassing.

      3 In afwijking van het eerste en tweede lid is op de voorbereiding van een beschikking tot wijziging van
      voorschriften van een omgevingsvergunning of gehele of gedeeltelijke intrekking van een omgevingsvergunning
      [paragraaf 3.3][ref6] van overeenkomstige toepassing indien de beschikking betrekking heeft op activiteiten
      of gevallen als bedoeld in [artikel 3.10, eerste lid][ref7], met uitzondering van activiteiten als bedoeld in
      onderdeel c van dat lid met betrekking tot mijnbouwwerken en van activiteiten als bedoeld in het derde lid van dat
      artikel. De eerste volzin geldt niet indien toepassing wordt gegeven aan [artikel 2.32][ref8] of [3.23][ref9].


