  - number: '2.33'
    text: |-
      1 Het bevoegd gezag trekt de omgevingsvergunning in, voor zover:

      a. de uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie dat vereist;

      b. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref1], indien door
      toepassing van [artikel 2.31, eerste lid, aanhef en onder b][ref2], redelijkerwijs niet kan worden bereikt dat in
      de inrichting of het mijnbouwwerk ten minste de voor de inrichting of het mijnbouwwerk in aanmerking komende beste
      beschikbare technieken worden toegepast;

      c. dat nodig is ter uitvoering van een verzoek als bedoeld in
      [artikel 2.29, eerste lid, tweede volzin, onder a][ref3], of een aanwijzing als bedoeld in
      [artikel 2.34, eerste lid][ref4];

      d. de inrichting of het mijnbouwwerk ontoelaatbaar nadelige gevolgen voor het milieu veroorzaakt en toepassing van
      [artikel 2.31][ref5] daarvoor redelijkerwijs geen oplossing biedt;

      e. deze van rechtswege is verleend, indien deze betrekking heeft op een activiteit die ontoelaatbaar
      ernstige nadelige gevolgen voor de fysieke leefomgeving heeft of dreigt te hebben en toepassing van
      [artikel 2.31, eerste lid, aanhef en onder c][ref6], daarvoor redelijkerwijs geen oplossing biedt;

      f. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref7], indien de
      inrichting een stortplaats als bedoeld in [artikel 8.47 van de Wet milieubeheer][ref8] of een afvalvoorziening
      als bedoeld in [artikel 1.1 van die wet][ref9] is: indien de stortplaats of afvalvoorziening krachtens
      [paragraaf 8.2 van die wet][ref10] voor gesloten is verklaard;

      g. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.19][ref11], in gevallen die in het betrokken
      wettelijk voorschrift zijn aangegeven.

      2 Het bevoegd gezag kan de omgevingsvergunning geheel of gedeeltelijk intrekken, voor zover:

      a. gedurende drie jaar, dan wel indien de vergunning betrekking heeft op een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a onderscheidenlijk b of g][ref12], gedurende 26 weken onderscheidenlijk de in de
      vergunning bepaalde termijn, geen handelingen zijn verricht met gebruikmaking van de vergunning;

      b. de vergunninghouder daarom heeft verzocht;

      c. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder d][ref13], indien dit
      in het belang van de brandveiligheid nodig is met het oog op het voorziene gebruik van het bouwwerk, en het niet
      mogelijk blijkt door toepassing van [artikel 2.31, tweede lid, onder a][ref14], dat belang voldoende te beschermen;

      d. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref15], indien:

      1°. dit in het belang van een doelmatig beheer van afvalstoffen nodig is;

      2°. de inrichting of het mijnbouwwerk geheel of gedeeltelijk is verwoest;

      e. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref16], indien de
      omstandigheden aan de kant van de vergunninghouder zodanig zijn gewijzigd dat het belang van de monumentenzorg
      zwaarder moet wegen;

      f. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder i][ref17], op de gronden
      die zijn aangegeven in de betrokken algemene maatregel van bestuur;

      g. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.2][ref18], op de gronden die zijn aangegeven
      in de betrokken verordening;

      h. deze betrekking heeft op een activiteit als bedoeld in [artikel 2.19][ref19], op de gronden die zijn aangegeven
      in het betrokken wettelijk voorschrift.

      3 Voor zover een verzoek van een vergunninghouder tot gehele of gedeeltelijke intrekking van een
      omgevingsvergunning betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e][ref20],
      trekt het bevoegd gezag de omgevingsvergunning slechts geheel of gedeeltelijk in, indien het belang van de
      bescherming van het milieu zich daartegen niet verzet.


