  - number: 1.1a
    text: |-
      1 Een bedrijfswoning, behorend tot of voorheen behorend tot een landbouwinrichting, die op grond van het
      bestemmingsplan, de beheersverordening of, indien met toepassing van [artikel 2.12, eerste lid][ref1], van het
      bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning door een derde bewoond mag worden,
      wordt met betrekking tot die inrichting voor de toepassing van deze wet en de daarop berustende bepalingen
      beschouwd als onderdeel van die inrichting, tenzij bij of krachtens deze wet anders is bepaald.

      2 Voor de toepassing van het eerste lid wordt onder landbouwinrichting verstaan:

      inrichting waar uitsluitend of in hoofdzaak agrarische activiteiten, zijnde het telen of kweken van
      landbouwgewassen of het fokken, mesten, houden of verhandelen van landbouwhuisdieren, dan wel activiteiten die
      daarmee verband houden worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel1.1a
