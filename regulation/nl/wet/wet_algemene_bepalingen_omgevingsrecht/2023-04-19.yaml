  - number: '2.15'
    text: |-
      Voor zover de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 2.1, eerste lid, onder f][ref1],
      kan de omgevingsvergunning slechts worden verleend indien het belang van de monumentenzorg zich daartegen niet
      verzet. Bij de beslissing op de aanvraag houdt het bevoegd gezag rekening met het gebruik van het monument.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
