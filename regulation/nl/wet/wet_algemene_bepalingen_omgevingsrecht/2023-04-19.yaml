    text: |-
      1 De stichting, bedoeld in [artikel 20.15 van de Wet milieubeheer][ref1], heeft tevens tot taak aan de
      bestuursrechter op diens verzoek deskundigenbericht uit te brengen inzake beroepen op grond van deze wet.

      2 [Artikel 20.17 van de Wet milieubeheer][ref2] is van overeenkomstige toepassing.


