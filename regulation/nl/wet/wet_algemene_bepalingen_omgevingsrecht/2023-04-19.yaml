      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat door daarbij aangewezen bestuursorganen
      van het Rijk rechten worden geheven ter zake van de behandeling van aanvragen tot verlening of gehele of
      gedeeltelijke intrekking van een omgevingsvergunning of wijziging van voorschriften van een omgevingsvergunning.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de berekening en de bedragen
      van de krachtens:

      a. [artikel 229, eerste lid, onder b, van de Gemeentewet][ref1];

      b. [artikel 223, eerste lid, onder b, van de Provinciewet][ref2]; of

      c. het eerste lid,

      te heffen rechten ter zake van de behandeling van aanvragen tot verlening of gehele of gedeeltelijke intrekking van
      een omgevingsvergunning of wijziging van voorschriften van een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
