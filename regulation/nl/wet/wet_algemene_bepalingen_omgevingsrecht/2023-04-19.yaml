  - number: '2.2'
    text: |-
      1 Voor zover ingevolge een bepaling in een provinciale of gemeentelijke verordening een vergunning of ontheffing is
      vereist om:

      a.

      b. een monument als bedoeld in een zodanige verordening:

      1°. te slopen, te verstoren, te verplaatsen of in enig opzicht te wijzigen of

      2°. te herstellen, te gebruiken of te laten gebruiken op een wijze waardoor het wordt ontsierd of in gevaar
      gebracht,

      c. een bouwwerk te slopen in een krachtens een zodanige verordening aangewezen stads- of dorpsgezicht,

      d. een weg aan te leggen of verandering te brengen in de wijze van aanleg van een weg, voor zover daarvoor tevens
      een verbod geldt als bedoeld in [artikel 2.1, eerste lid, onder b][ref1],

      e. een uitweg te maken, te hebben of te veranderen of het gebruik daarvan te veranderen,

      f. in, op of aan een onroerende zaak een alarminstallatie te hebben die een voor de omgeving opvallend geluid of
      lichtsignaal kan produceren,

      g. houtopstand te vellen of te doen vellen,

      h. op of aan een onroerende zaak handelsreclame te maken of te voeren met behulp van een opschrift, aankondiging of
      afbeelding in welke vorm dan ook, die zichtbaar is vanaf een voor het publiek toegankelijke plaats,

      i. als eigenaar, beperkt zakelijk gerechtigde of gebruiker van een onroerende zaak toe te staan of te gedogen dat
      op of aan die onroerende zaak handelsreclame wordt gemaakt of gevoerd met behulp van een opschrift, aankondiging of
      afbeelding in welke vorm dan ook, die zichtbaar is vanaf een voor het publiek toegankelijke plaats,

      j. in een daarbij aangewezen gedeelte van de provincie of de gemeente roerende zaken op te slaan of

      k. als eigenaar, beperkt zakelijk gerechtigde of gebruiker van een onroerende zaak in een daarbij aangewezen
      gedeelte van de provincie of de gemeente toe te staan of te gedogen dat daar roerende zaken worden opgeslagen,

      geldt een zodanige bepaling als een verbod om een project voor zover dat geheel of gedeeltelijk uit die
      activiteiten bestaat, uit te voeren zonder omgevingsvergunning.

      2 Bij provinciale, gemeentelijke of waterschapsverordening kan worden bepaald dat het in daarbij aangewezen
      categorieën gevallen verboden is projecten die geheel of gedeeltelijk bestaan uit andere activiteiten die behoren
      tot een daarbij aangewezen categorie activiteiten die van invloed kunnen zijn op de fysieke leefomgeving, uit te
      voeren zonder omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
