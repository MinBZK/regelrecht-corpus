  - number: '6.5'
    text: |-
      1 Het beroep tegen een beschikking inzake een verklaring als bedoeld in [artikel 2.27][ref1] kan door het ten
      aanzien van de beschikking waarop de verklaring betrekking heeft, bevoegde gezag eerst worden ingesteld nadat die
      beschikking is bekendgemaakt.

      2 In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref2] vangt de beroepstermijn in
      een geval als bedoeld in het eerste lid aan met ingang van de dag na de dag waarop overeenkomstig
      [artikel 3.9, eerste of vierde lid][ref3], of [artikel 3:44 van de Algemene wet bestuursrecht][ref4] mededeling
      is gedaan onderscheidenlijk kennis is gegeven van de beschikking waarop de verklaring of het verzoek betrekking
      heeft. De bepalingen met betrekking tot het beroep tegen die beschikking zijn van overeenkomstige toepassing met
      betrekking tot het beroep tegen de beschikking inzake de verklaring of de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.27
