preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een groot aantal verschillende stelsels bestaat met betrekking tot
    toestemmingen van bestuursorganen, die vereist zijn voor het verrichten van activiteiten die van invloed zijn op de
    fysieke leefomgeving, en dat het wenselijk is die stelsels zoveel mogelijk samen te voegen, opdat een samenhangende
    beoordeling van die activiteiten op de betrokken aspecten mogelijk is in één procedure die leidt tot één besluit;
    dat het nodig is met het oog op dit nieuwe stelsel ook de handhaving daarvan te regelen en dat het wenselijk is van
    die gelegenheid gebruik te maken om de bestuursrechtelijke handhaving van regelingen met betrekking tot de fysieke
    leefomgeving – voor zover niet algemeen-bestuursrechtelijk geregeld – verder te uniformeren en in dezelfde wet
    onder te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *activiteit:* activiteit als bedoeld in [artikel 2.1, eerste lid][ref1], of [2.2][ref2];
        - *afvalstoffen:* afvalstoffen als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref3];
        - *beheersverordening:* beheersverordening als bedoeld in [artikel 3.38 van de Wet ruimtelijke ordening][ref4] die
      van toepassing is op de plaats waar de activiteit wordt of zal worden verricht;
        - *beschermd stads- of dorpsgezicht:* beschermd stads- of dorpsgezicht als bedoeld in
      [artikel 1, onder g, van de Monumentenwet 1988][ref5] zoals die wet luidde voor inwerkingtreding van de
      [Erfgoedwet][ref6];
        - *beste beschikbare technieken:* voor het bereiken van een hoog niveau van bescherming van het milieu meest
      doeltreffende technieken om de emissies en andere nadelige gevolgen voor het milieu, die een inrichting kan
      veroorzaken, te voorkomen of, indien dat niet mogelijk is, zoveel mogelijk te beperken, die – kosten en baten
      in aanmerking genomen – economisch en technisch haalbaar in de bedrijfstak waartoe de inrichting behoort, kunnen
      worden toegepast, en die voor degene die de inrichting drijft, redelijkerwijs in Nederland of daarbuiten te
      verkrijgen zijn; daarbij wordt onder technieken mede begrepen het ontwerp van de inrichting, de wijze waarop zij
      wordt gebouwd en onderhouden, alsmede de wijze van bedrijfsvoering en de wijze waarop de inrichting buiten gebruik
      wordt gesteld;
        - *bestemmingsplan:* bestemmingsplan, provinciaal inpassingsplan of rijksinpassingsplan als bedoeld in de
      [Wet ruimtelijke ordening][ref7] dat van toepassing is op de plaats waar de activiteit wordt of zal worden verricht
      en de krachtens dat plan gestelde nadere eisen;
        - *bevoegd gezag:* bestuursorgaan dat bevoegd is tot het nemen van een besluit ten aanzien van een aanvraag om een
      omgevingsvergunning of ten aanzien van een al verleende omgevingsvergunning;
        - *bouwen:* plaatsen, geheel of gedeeltelijk oprichten, vernieuwen, veranderen of vergroten;
        - *bouwverordening:* bouwverordening als bedoeld in [artikel 8 van de Woningwet][ref8];
        - *exploitatieplan:* plan als bedoeld in [artikel 6.12, eerste lid, van de Wet ruimtelijke ordening][ref9];
        - *gevaarlijke afvalstoffen:* gevaarlijke afvalstoffen als bedoeld in [artikel 1.1 van de Wet milieubeheer][ref10];
        - *inrichting:* inrichting, behorende tot een categorie die is aangewezen krachtens het derde lid;
        - *inspecteur:* als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
        - *IPPC-installatie:* installatie voor industriële activiteiten als bedoeld in bijlage I van richtlijn nr. 2010/75/
      EU van het Europees Parlement en de Raad van 24 november 2010 inzake industriële emissies (PbEU L 334);
        - *mijnbouwwerk:* mijnbouwwerk als bedoeld in [artikel 1, onder n, van de Mijnbouwwet][ref11];
        - *omgevingsdienst:* dienst als bedoeld in [artikel 5.3, eerste lid][ref12];
        - *omgevingsvergunning:* omgevingsvergunning als bedoeld in [artikel 2.1][ref13] of [2.2][ref14];
        - *onlosmakelijke activiteit:* activiteit die behoort tot verschillende categorieën activiteiten als bedoeld in de
      [artikelen 2.1][ref15] en [2.2][ref16];
        - *Onze Minister:* Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
        - *project:* project als bedoeld in [artikel 2.1, eerste lid][ref17], of [2.2][ref18];
        - *rijksmonument:* rijksmonument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref19] met uitzondering van
      archeologische monumenten als bedoeld in dat artikel;
        - *slopen:* geheel of gedeeltelijk afbreken;
        - *verklaring:* verklaring van geen bedenkingen als bedoeld in [artikel 2.27, eerste lid][ref20];
        - *voorbereidingsbesluit:* besluit waarbij toepassing is gegeven aan
      [artikel 3.7 van de Wet ruimtelijke ordening][ref21];
        - *wijzigen van voorschriften van een omgevingsvergunning:* wijzigen, aanvullen of intrekken van voorschriften die
      aan een omgevingsvergunning zijn verbonden of alsnog verbinden van voorschriften aan een omgevingsvergunning.

      2 Met betrekking tot de betekenis van de begrippen «gevolgen voor het milieu» en «bescherming van het milieu»
      in deze wet en de daarop berustende bepalingen is [artikel 1.1, tweede lid, van de Wet milieubeheer][ref22] van
      overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur worden categorieën inrichtingen aangewezen als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref23], waarvan het oprichten, het veranderen of veranderen van
      de werking of het in werking hebben moet worden onderworpen aan een voorafgaande toetsing, gezien de aard en de
      omvang van de nadelige gevolgen die de inrichtingen voor het milieu kunnen veroorzaken. Bij de maatregel worden als
      categorie in ieder geval aangewezen de inrichtingen waartoe een IPPC-installatie behoort.

      4 Een wijziging van bijlage 1 bij richtlijn nr. 2010/75/EU van het Europees Parlement en de Raad van 24 november
      2010 inzake industriële emissies (PbEU L 334) gaat voor de toepassing van de in het eerste lid gegeven omschrijving
      van «IPPC-installatie» gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet
      zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld.


