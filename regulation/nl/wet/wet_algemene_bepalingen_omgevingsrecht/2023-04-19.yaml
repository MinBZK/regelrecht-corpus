  - number: 2.9a
    text: |-
      1 Voor zover aanvragen tot verlening of gehele of gedeeltelijke intrekking van een omgevingsvergunning of wijziging
      van voorschriften van een omgevingsvergunning betrekking hebben op een activiteit met betrekking tot een inrichting
      als bedoeld in [artikel 2.1, eerste lid, onder e][ref1], worden geen rechten geheven. Bij algemene maatregel van
      bestuur kunnen met betrekking tot een activiteit als bedoeld in artikel 2.1, eerste lid, onder i, categorieën
      gevallen worden aangewezen waarin de eerste volzin van overeenkomstige toepassing is.

      2 De bevoegdheid tot het invorderen van rechten terzake van door of vanwege het gemeentebestuur, provinciaal
      bestuur of Onze betrokken Minister verstrekte diensten die verband houden met een omgevingsvergunning waarbij met
      toepassing van [artikel 2.12, eerste lid, onder a, onder 3°][ref2], van een bestemmingsplan of beheersverordening
      wordt afgeweken, wordt opgeschort tot het tijdstip waarop van dat besluit kennis is gegeven als bedoeld in
      [artikel 3:44, eerste lid, van de Algemene wet bestuursrecht][ref3]. De bevoegdheid vervalt indien de kennisgeving
      niet binnen twee maanden is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
