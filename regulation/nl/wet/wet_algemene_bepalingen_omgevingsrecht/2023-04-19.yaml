  - number: '3.9'
    text: |-
      1 Het bevoegd gezag beslist op de aanvraag om een omgevingsvergunning binnen acht weken na de datum van ontvangst
      van de aanvraag. Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking:

      a. doet het mededeling van die beschikking op de wijze waarop het overeenkomstig [artikel 3.8][ref1] kennis heeft
      gegeven van de aanvraag, en

      b. zendt het in bij algemene maatregel van bestuur aangewezen categorieën gevallen de daarbij aangewezen
      bestuursorganen een afschrift van die beschikking.

      2 Het bevoegd gezag kan de in het eerste lid bedoelde termijn eenmaal met ten hoogste zes weken verlengen. Het
      maakt zijn besluit daartoe bekend binnen de eerstbedoelde termijn. Het doet daarvan tevens zo spoedig mogelijk
      mededeling op de wijze waarop het overeenkomstig [artikel 3.8][ref2] kennis heeft gegeven van de aanvraag.

      3 [Paragraaf. 4.1.3.3 van de Algemene wet bestuursrecht][ref3] is, met uitzondering van de
      [artikelen 4:20b, derde lid][ref4], en [4:20f][ref5], van toepassing op de voorbereiding van de beslissing op de
      aanvraag. Bij algemene maatregel van bestuur kunnen categorieën gevallen worden aangewezen waarin de voorbereiding
      van de beslissing op een aanvraag wegens strijd met een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie is uitgezonderd van de toepassing van de eerste volzin.

      4 Het bevoegd gezag doet zo spoedig mogelijk mededeling van de bekendmaking, bedoeld in
      [artikel 4:20c van de Algemene wet bestuursrecht][ref6], op de wijze waarop het overeenkomstig [artikel 3.8][ref7]
      kennis heeft gegeven van de aanvraag.


