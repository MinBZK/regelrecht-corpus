    text: |-
      Het bevoegd gezag kan zich bij het verlenen van een omgevingsvergunning in ieder geval baseren op gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0024779/2023-04-19#Artikel3.1a
