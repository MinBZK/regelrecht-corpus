  - number: 2.31a
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 2.31, eerste lid, aanhef en onder b][ref1], verbindt het bevoegd
      gezag voor zover nodig voorschriften aan de omgevingsvergunning die strekken tot toepassing van andere technieken
      dan die waaromtrent ingevolge [artikel 2.8, eerste lid, tweede volzin][ref2], in of bij de aanvraag om de
      vergunning gegevens of bescheiden zijn verstrekt.

      2 Indien het bevoegd gezag voornemens is toepassing te geven aan
      [artikel 2.31, eerste lid, aanhef en onder b][ref3], verschaft de vergunninghouder desgevraagd aan het bevoegd
      gezag de gegevens die voor die toepassing noodzakelijk zijn.


