$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: wet_tot_ontginning_van_steenzout_bij_buurse
regulatory_layer: WET
publication_date: '2002-11-14'
valid_from: '2002-01-01'
bwb_id: BWBR0001893
url: https://wetten.overheid.nl/BWBR0001893/2002-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is tot ontginning van zoutlagen bij Buurse (gemeente
    Haaksbergen) over te gaan en daartoe eene overeenkomst te sluiten;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      Aan den Staat wordt, als ware voor de ontginning van zoutlagen volgens de wet van 21 April 1810 (*Bulletin des
      Lois* n°. 285) concessie verleend, de eigendom toegekend van de zoutmijn in het terrein der provincie Overijssel,
      groot 3030 H.A., dat op de bij deze wet behoorende kaart door eene roode grenslijn is aangeduid.

      Dit terrein wordt begrensd als volgt:

      ten Zuiden:

      van punt A, Rijksgrenspaal 834, volgend de grensscheiding tusschen Nederland en Pruissen, naar punt B,
      Rijksgrenssteen 19;

      ten Oosten:

      van punt B, de grensscheiding tusschen Nederland en Pruissen volgend naar punt C, Rijksgrenssteen 32;

      ten Noorden:

      van punt C in rechte lijn naar punt D, snijpunt van de as van de Schuine brug in den kunstweg van Haaksbergen naar
      Enschede, met de as van de Bruninkbeek, ter plaatse ook wel genaamd de Nieuwe beek;

      van punt D de as van evengenoemden kunstweg volgend naar punt E, snijpunt van de as van meergenoemden kunstweg met
      de as van den weg, welke loopt van Rutbekerveld over de Heegdebeek naar de Schip- of Buurserbeek;

      ten Westen:

      van punt E, de as van laatstgenoemden weg volgend naar punt F, snijpunt van de as van de Rietbrug in dezen weg met
      de as van de Schip- of Buurserbeek;

      van punt F in rechte lijn naar het uitgangspunt A.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelI
  - number: II
    text: |-
      Onze Minister van Landbouw, Nijverheid en Handel wordt gemachtigd het recht op ontginning van de in
      [artikel I][ref1] bedoelde zoutlagen over te dragen aan de op te richten Naamlooze Vennootschap "Nederlandsche
      Zoutindustrie" voor den termijn en op de voorwaarden vervat in de bij deze wet behoorende ontwerp-overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0001893#ArtikelI
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0001893
        artikel: I
  - number: III
    text: |-
      1 De eigenaren van grond vallende binnen het terrein in [artikel I][ref1] omschreven hebben recht op eene
      jaarlijksche uitkeering door den ontginner naar den maatstaf van € 0,11 per Hectare, of op eene uitkeering in eens
      van € 2,84 per Hectare naar verkiezing van den ontginner.

      2 Dit recht vangt aan drie maanden nadat deze wet in werking is getreden.

      3 Behoudens tegenbewijs door den ontginner worden als eigenaren beschouwd diegenen, die als zoodanig bij het
      kadaster te boek staan.


      [ref1]: https://wetten.overheid.nl/BWBR0001893#ArtikelI
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0001893
        artikel: I
  - number: IV
    text: |-
      De wetten van 21 April 1810 (*Bulletin des Lois* n°. 285), van 27 April 1904 (*Staatsblad* n°. 73), gewijzigd bij
      de wet van 29 Juni 1912 (*Staatsblad* n°. 202) en bij de wet van 16 December 1916 (*Staatsblad* n°. 552), en van 6
      Maart 1915 (*Staatsblad* n°. 141) zijn op de in deze wet bedoelde ontginning van toepassing, de eerstgenoemde wet
      (van 1810) voor zoover daarvan niet bij deze wet wordt afgeweken, de in de tweede plaats genoemde wet (van 1904)
      met uitzondering van de artikelen 1-8.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelIV
  - number: V
    text: |-
      Binnen den afstand van 300 Meter van de Rijksgrens zullen geen boringen worden gedaan, noch pompboorgaten worden
      geslagen.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelV
  - number: VI
    text: |-
      1 Alvorens met het boren wordt begonnen, moet op het ter ontginning bestemde terrein eene waterpassing worden
      uitgevoerd, waarin ten genoegen van den Hoofdingenieur der Mijnen een voldoend aantal vaste punten moet worden
      opgenomen.

      2 Deze waterpassing moet, zoodra met het uitloogen is begonnen en vervolgens elke maand, worden herhaald.

      3 Van de uitkomsten van iedere waterpassing moet schriftelijk rapport worden uitgebracht aan den Hoofdingenieur
      der Mijnen.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelVI
  - number: VII
    text: |-
      1 Ter afvoering van waterverontreinigende schadelijke stoffen en bestanddeelen moet een buisleiding worden
      aangelegd, die in den IJssel uitmondt.

      2 Het door deze buisleiding af te voeren verontreinigde water mag slechts in zoodanigen toestand in den
      IJssel worden geloosd, dat daardoor, naar het oordeel van den Hoofdingenieur der Mijnen, geen schade aan de
      volksgezondheid, de vischteelt of eenig ander algemeen belang kan worden berokkend.

      3 Onze voornoemde Minister kan onder door hem vast te stellen voorwaarden van het voorschrift in het eerste lid
      voor een bepaalden tijd ontheffing verleenen.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelVII
  - number: VIII
    text: |-
      1 In een boorregister moet zorgvuldig en in de juiste volgorde der gedane boringen aanteekening worden gehouden van
      de soort en de dikte der doorboorde aardlagen.

      2 De boorkernen en de boormonsters der doorboorde aardlagen moeten genummerd en gerangschikt worden bewaard.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelVIII
  - number: IX
    text: |-
      1 Van elk boorgat moet eene langdoorsnede in dubbel worden vervaardigd, op eene schaal van 1 : 500 voor de
      diepteafmetingen en op eene schaal van 1 : 10 voor de horizontale afmetingen.

      2 In deze langdoorsnede moeten de doorboorde aard- en waterlagen, alsmede de verschillende ingelaten
      bekleedingsbuizen en de waterafsluitingen worden aangegeven.

      3 Alvorens met uitloogen wordt begonnen, moet één exemplaar van de vervaardigde langdoorsneden aan den
      Hoofdingenieur der Mijnen worden gezonden.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelIX
  - number: X
    text: |-
      1 Ondergrondsche wateren moeten in elk boorgat zoodanig door buizen worden afgesloten, dat zij niet in dieper
      gelegen aardlagen kunnen doordringen.

      2 Deze buizen mogen niet verwijderd worden, vóórdat het boorgat onder de watervoerende laag geheel waterdicht is
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelX
  - number: XI
    text: |-
      1 Wanneer eene boring wordt stopgezet of beëindigd, moet hiervan, onder toezending van een op deze boring
      betrekking hebbend uittreksel uit het boorregister, onmiddellijk schriftelijk mededeeling worden gedaan aan den
      Hoofdingenieur der Mijnen.

      2 Ook van eene tijdelijke stopzetting eener boring voor langer dan vier weken moet aan den Hoofdingenieur der
      Mijnen onmiddellijk schriftelijk mededeeling worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelXI
  - number: XII
    text: |-
      1 Alvorens een boorgat wordt verlaten, moet het tot op eene hoogte van 100 Meter van den bodem af, zoodanig
      met waterdichte stoffen worden gevuld, dat het binnendringen van water van het dekterrein in de dieper gelegen
      aardlagen verhinderd wordt.

      2 Indien zoutlagen of zoutbronnen zijn doorboord, moet deze vulling worden voortgezet tot 100 Meter boven de hoogst
      gelegen zout of zoutoplossing bevattende aardlaag.

      3 De Hoofdingenieur der Mijnen is bevoegd vulling over meer dan 100 Meter voor te schrijven.

      4 Is het boorgat minder dan 100 Meter diep, dan moet het tot aan de aardoppervlakte gevuld worden.

      5 Bij gebruik van waterdichte bekleedingsbuizen moet, indien deze buizen weer worden uitgetrokken, de vulling
      gelijktijdig met dit uittrekken plaats hebben.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelXII
  - number: XIII
    text: |-
      De Hoofdingenieur der Mijnen kan ten aanzien van de uitvoering van het bij de vorige artikelen bepaalde nadere
      voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelXIII
  - number: XIV
    text: |-
      De beoordeeling of aan de in de vorige artikelen gestelde eischen is voldaan staat aan den Hoofdingenieur der
      Mijnen.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelXIV
  - number: XV
    text: |-
      Van beslissingen en voorschriften van den Hoofdingenieur der Mijnen krachtens bepalingen dezer wet, staat beroep op
      den Minister open.
    url: https://wetten.overheid.nl/BWBR0001893/2002-01-01#ArtikelXV
