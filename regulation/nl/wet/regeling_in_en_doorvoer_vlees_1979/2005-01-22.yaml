  - number: 7d
    text: |-
      Bij het vervoer op Nederlands grondgebied in het kader van doorvoer van een uit de lid-staten van de Europese
      Unie afkomstige zending vlees, naar een lid-staat van de Europese Unie moet de zending vlees voldoen aan de op
      de doorvoer van vlees afkomstig uit lid-staten van de Europese Unie betrekking hebbende voorwaarden, gesteld in
      de [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel2
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel7d
