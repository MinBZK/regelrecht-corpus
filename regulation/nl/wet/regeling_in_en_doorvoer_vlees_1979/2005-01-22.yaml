  - number: 7h
    text: |-
      1 De zending vlees, afkomstig uit een derde land, welke via het grondgebied van een lid-staat naar Nederland is
      verzonden, gaat vergezeld van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/
      EG](31997L0078) en van het Gemeenschappelijk veterinair document van binnenkomst, bedoeld in [verordening 282/2004/
      EG](32004R0282).

      2 Het bepaalde in de [artikelen 7b, tweede, derde en vijfde lid][ref1], [7c][ref2] en [7 e][ref3] is in geval van
      een invoer als bedoeld in het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel7b
