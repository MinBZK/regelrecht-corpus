        artikel: 7f
        paragraaf: '5'
  - number: '4'
    text: |-
      1 Het in [artikel 1a][ref1] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004](32004R0136) en de
      artikelen 7f tot en met 7k, niet voor vers vlees, beenderen, hoornen en hoeven van runderen, varkens, schapen,
      geiten en eenhoevigen, afkomstig uit een derde land of deel van een derde land, niet zijnde Noorwegen, en bestemd
      voor menselijke consumptie, die:

      a. afkomstig zijn van een derde land of een deel van een derde land dat voor de betrokken diersoort waarvan het
      vers vlees, de beenderen, de hoornen of de hoeven afkomstig is, is vermeld op de lijst van deel 1 van bijlage II
      bij beschikking 79/542/EEG;

      b. vergezeld gaat van het gezondheidscertificaat dat voor de betrokken diersoort is opgenomen in deel 2 van bijlage
      II bij beschikking 79/542/EEG;

      c. voldoen aan de eisen die in het gezondheidscertificaat, bedoeld in onderdeel b, zijn vastgesteld, aan de
      aanvullende garanties die, in voorkomend geval, in dat certificaat zijn opgenomen en aan de overige eisen die op
      grond van [richtlijn 72/462/EEG](31972L0462) zijn vastgesteld, en

      d. afkomstig zijn van een inrichting die is opgenomen op de lijst, bedoeld in artikel 4 van [richtlijn 72/462/
      EEG](31972L0462) en, indien van toepassing, is aangewezen overeenkomstig artikel 18, eerste lid, onderdeel a, en
      artikel 18, dierde lid, van [richtlijn 72/462/EEG](31972L0462).

      2 Het gezondheidscertificaat, bedoeld in het eerste lid, onderdeel b, voldoet, voor zover van toepassing, aan
      bijlage XI, hoofdstuk D, punt 4, van [verordening 999/2001/EG](32001R0999).

      3 Indien het vers vlees, bedoeld in het eerste lid, opgemaakte slachtafvallen als bedoeld in artikel 2, onderdeel
      a, van beschikking 79/542/EEG van als huisdier gehouden runderen, bestemd voor menselijke consumptie als
      vleesproduct, betreft, wordt het vlees na invoer onverwijld naar de verwerkingsinrichting van bestemming gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel4
