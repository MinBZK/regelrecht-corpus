  - number: 7n
    text: De minister is de bevoegde autoriteit, bedoeld in artikel 10 van [verordening 136/2004/EG](32004R0136).
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel7n
  - number: '8'
    text: |-
      1 De Minister kan ontheffing verlenen van het in [artikel 1a][ref1] gestelde verbod.

      2 Aan een ontheffing, bedoeld in het eerste lid, kunnen voorschriften en beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel1a
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003217
        artikel: 1a
        paragraaf: '2'
  - number: 8a
    text: De regeling is niet van toepassing op beenderen, daaronder begrepen gebroken of gemalen beenderen.
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel8a
  - number: '9'
    text: |-
      1 Een wijziging van een of meer onderdelen van de in deze regeling genoemde richtlijnen treedt voor de toepassing
      van de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijnen uitvoering moet zijn gegeven.

      2 De Minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel9
  - number: 9a
    text: |-
      Deze regeling is niet van toepassing op:

      a. gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen als bedoeld in [Richtlijn nr. 88/657/EEG]
      (31988L0657) van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen voor de
      productie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen en tot
      wijziging van de [Richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462) (PbEG
      L 382);

      b. gehakt vlees en vleesbereidingen als bedoeld in [Richtlijn nr. 94/65/EG](31994L0065) van de Raad van
      de Europese Unie van 14 december 1994 tot vaststelling van voorschriften voor de productie en het in de
      handel brengen van gehakt vlees en vleesbereidingen (PbEG L 368), niet zijnde gehakt vlees als bedoeld in
      [artikel 9.15, tweede lid, van de Regeling keuring en handel dierlijke producten][ref1];

      c. vlees als bedoeld in artikel 1 van [verordening (EG) nr. 745/2004](32004R0745) van de Commissie van de
      Europese Gemeenschappen van 16 april 2004 tot vaststelling van maatregelen betreffende de invoer van producten van
      dierlijke oorsprong voor persoonlijke consumptie (PbEU L 122), voor zover door reizigers in de Europese Gemeenschap
      binnengebracht of aan particulieren in de Europese Gemeenschap toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9.15
