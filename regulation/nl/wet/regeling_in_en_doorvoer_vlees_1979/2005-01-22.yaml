  - number: '3'
    text: |-
      Het in [artikel 1a][ref1] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004](32004R0136) en de
      [artikelen 7f tot en met 7k][ref2], niet voor vers vlees, beenderen, hoornen en hoeven van runderen, varkens,
      schapen, geiten en eenhoevigen, afkomstig uit Noorwegen en bestemd voor menselijke consumptie, die:

      a. zijn voorzien van het keurmerk, bedoeld in artikel 3, eerste lid, onderdeel A, subonderdeel e, van [richtlijn
      64/433/EEG](31964L0433);

      b. vergezeld gaan van het handelsdocument, onderscheidenlijk keuringscertificaat, bedoeld in artikel 3, eerste lid,
      onderdeel A, subonderdeel f, van [richtlijn 64/433/EEG](31964L0433).


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003217#Artikel7f
