      Minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            ambtenaar:

              ambtenaar als bedoeld in [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1];



            officiële dierenarts:

              door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;



            lid-staat:

              lidstaat van de Europese Unie, niet zijnde Nederland;



            derde land:

              land, niet zijnde Nederland en niet zijnde een lidstaat;




              [verordening 999/2001/EG](32001R0999):

              [verordening (EG) nr. 999/2001](32001R0999) verordening van het Europees Parlement en de Raad van 22 mei
      2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare
      spongiforme encefalopathieën (PbEG L 147);




              [verordening 136/2004/EG](32004R0136):

              [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22 januari
      2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap
      bij het binnenbrengen van producten uit derde landen (PbEU L 21);




              [richtlijn 64/433/EEG](31964L0433):

              [richtlijn nr. 64/433/EEG](31964L0433) van de Raad van de Europese Gemeenschappen van 26 juni 1994
      betreffende de gezondheidsvoorschriften voor de produktie en het in de handel brengen van vers vlees (PbEG 1991,
      L 268);




              [richtlijn 72/461/EEG](31972L0461):

              [richtlijn nr. 72/461/EEG](31972L0461) van de Raad van de Europese Gemeenschappen van 12 december 1972
      inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in vers vlees
      (PbEG L 302);




              [richtlijn 72/462/EEG](31972L0462):

              [richtlijn nr. 72/462/EEG](31972L0462) van de Raad van de Europese Gemeenschappen van 12 december 1972
      inzake gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen
      en geiten, van vers vlees of van vleesproducten uit derde landen (PbEG L 302);




              [richtlijn 89/662/EEG](31989L0662):

              [richtlijn nr. 89/662/EEG](31989L0662) van de Raad van de Europese Gemeenschappen van 11 december 1989
      inzake veterinaire controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging
      van de interne markt (PbEG L 395);




              [richtlijn 91/495/EEG](31991L0495):

              [richtlijn nr. 91/495/EEG](31991L0495) van de Raad van de Europese Gemeenschappen van 27 november 1990
      inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de produktie en het in de handel
      brengen van konijnevlees en vlees van gekweekt wild (PbEG L 268);




              [richtlijn 92/118/EEG](31992L0118):

              [richtlijn nr. 92/118/EEG](31992L0118) van de Raad van de Europese Gemeenschappen van 17 december 1992 tot
      vaststelling van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in
      de Gemeenschap van producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving
      geldt als bedoeld in bijlage A, hoofdstuk I, van [Richtlijn 89/662/EEG](31989L0662), en, wat ziekteverwekkers
      betreft, van [Richtlijn 90/425/EEG](31990L0425) (PbEG 1993, L 62);




              [richtlijn 97/78/EG](31997L0078):

              [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen in de
      Gemeenschap worden binnengebracht (PbEG 1998, L 24);




              [richtlijn 2001/89/EG](32001L0089):

              [richtlijn nr. 2001/89/EG](32001L0089) van de Raad van 23 oktober 2001 betreffende maatregelen van de
      Gemeenschap ter bestrijding van klassieke varkenspest (PbEG L 316);



            beschikking 79/542/EEG:

              beschikking (EG) nr. 79/542 van de Raad van de Europese Gemeenschappen van 21 december 1976
      tot vaststelling van een lijst van derde landen of delen van derde landen, alsmede tot vaststelling van
      veterinairrechtelijke voorschriften, gezondheidsvoorschriften en voorschriften inzake de veterinaire certificering
      voor de invoer in de Gemeenschap van levende dieren en vers vlees daarvan (PbEU 2004, L 73);



            zending:

              hoeveelheid vlees van dezelfde aard waarvoor eenzelfde document, voor zover dit op grond van de onderhavige
      regeling is voorgeschreven, geldt, die met hetzelfde vervoermiddel wordt vervoerd en afkomstig is uit hetzelfde
      derde land of gedeelte van een derde land;



            handelaar:

              elke natuurlijke persoon of rechtspersoon, zijnde de eerste ontvanger op Nederlands grondgebied van een
      zending vlees afkomstig uit een lidstaat van de Europese Gemeenschappen;



            VWA:

              Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127);



            erkende inspectiepost

              op Nederlands grondgebied gelegen inspectiepost die is aangewezen en erkend overeenkomstig het bepaalde in
      artikel 6 van [richtlijn 97/78/EG](31997L0078);



            belanghebbende bij de lading:

              belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/EG]
      (31997L0078);



            gekweekt wild:

              niet als huisdier beschouwde landzoogdieren, niet zijnde konijnen of hazen, die niet worden vermeld
      in artikel 1, eerste lid, van [richtlijn 64/433/EEG](31964L0433) en die worden gehouden als huisdieren, niet-
      gedomesticeerde zoogdieren die leven op een afgesloten gebied onder soortgelijke omstandigheden ten aanzien van
      vrijheid als wild worden evenwel niet als gekweekt wild beschouwd;



            vlees van gekweekt wild:

              alle voor menselijke consumptie geschikte delen van gekweekt wild;



            beenderen, hoornen of hoeven:

              beenderen, hoornen of hoeven als bedoeld in hoofdstuk 5 van bijlage I van [richtlijn 92/118/EEG]
      (31992L0118), bestemd voor menselijke voeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
