  - number: '7'
    text: |-
      Een partij afkomstig uit Nieuw-Zeeland mag in afwijking van hetgeen in deze paragraaf, dan wel
      [paragraaf 2 van hoofdstuk 3 van de Regeling keuring en handel dierlijke producten][ref1] is bepaald ten aanzien
      van de voor de onderscheiden soorten vlees uit derde landen voorgeschreven gezondheidscertificaten, vergezeld
      gaan van een op de partij betrekking hebbend gezondheidscertificaat dat ingevolge de regelgeving van de Europese
      Gemeenschap ter uitvoering van de Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-
      Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke producten (PbEG 1997, L 57) is
      vastgesteld, indien de partij voldoet aan de ingevolge vorenbedoelde regelgeving gestelde bijkomende voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel7
