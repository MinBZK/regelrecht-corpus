  - number: 6a
    text: |-
      1 Het in [artikel 1a][ref1] gestelde verbod geldt, mits is voldaan aan de [artikelen 7b tot en met 7e][ref2], niet
      voor vlees van gekweekt wild dat:

      a. afkomstig is uit een lid-staat van de Europese Unie;

      b. is gemerkt met een keurmerk overeenkomstig hoofdstuk XI van bijlage I van [richtlijn 64/433/EEG](31964L0433), en

      c. vergezeld gaat van een gezondheidscertificaat overeenkomstig bijlage IV van [richtlijn 91/495/EEG](31991L0495).

      2 Het in [artikel 1a][ref3] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 7f tot en met 7k][ref4], voorts niet voor vlees van gekweekt wild dat:

      a. afkomstig is uit Noorwegen;

      b. voldoet aan het eerste lid, onderdelen b tot en met d.

      3 Het in [artikel 1a][ref5] gestelde verbod geldt, mits is voldaan aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 7f tot en met 7k][ref6], voorts niet voor vlees van gekweekt wild dat:

      a. afkomstig is uit een derde land of deel van een derde land, niet zijnde Noorwegen, dat voor de betrokken
      diersoort waarvan het vlees afkomstig is, is vermeld op de lijst van deel 1 van bijlage II bij beschikking 79/542/
      EEG, voor zover het vlees van slurfdieren of evenhoevigen, niet zijnde runderen, varkens, schapen of geiten,
      betreft, dan wel is vermeld op de lijst van bijlage I bij beschikking 2000/585/EG, voor zover het vlees van overige
      diersoorten betreft;

      b. vergezeld gaat van een gezondheidscertificaat waarvan het model overeenstemt met het model zoals dat voor de
      betrokken diersoort waarvan het vlees afkomstig is, is vastgesteld in deel 2 van bijlage II bij beschikking 79/542/
      EEG, voor zover het vlees van slurfdieren of evenhoevigen, niet zijnde runderen, varkens, schapen of geiten,
      betreft, dan wel in bijlage III bij beschikking 2000/585/EG, voor zover het overige diersoorten betreft;

      c. de eisen die in het gezondheidscertificaat, bedoeld in onderdeel b, zijn vastgesteld en aan de aanvullende
      garanties die in voorkomend geval in dat certificaat zijn opgenomen;

      d. afkomstig is uit een inrichting die, zodra deze is vastgesteld en in werking getreden, voorkomt op de voor vlees
      van gekweekt wild uit het betrokken land van herkomst geldende voorlopige lijst van inrichtingen als bedoeld in
      beschikking 95/408/EG van de Raad van de Europese Unie van 22 juni 1995 tot vaststelling van voorschriften voor
      het opstellen voor een overgangsperiode van voorlopige lijsten van inrichtingen in derde landen waaruit de lid-
      staten bepaalde producten van dierlijke oorsprong, visserijproducten en levende tweekleppige weekdieren mogen
      invoeren (PbEG L 243), die alsdan ter inzage ligt in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer
      en Visserij in Den Haag, met dien verstande dat indien bij de vaststelling van voornoemde lijst is voorzien in
      overgangsbepalingen het vlees met inachtneming van die bepalingen afkomstig mag zijn uit een inrichting die voldoet
      aan [richtlijn 91/495/EEG](31991L0495).


