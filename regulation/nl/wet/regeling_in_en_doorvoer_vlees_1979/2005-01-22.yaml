  - number: 7ea
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op zendingen beenderen, hoornen en hoeven, afkomstig uit een lid-
      staat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0003217/2005-01-22#Artikel7ea
  - number: 7f
    text: |-
      1 De zending vlees, afkomstig uit een derde land, die rechtstreeks uit dat derde land in Nederland wordt in- of
      doorgevoerd, wordt aangevoerd via een erkende inspectiepost.

      2 De melding van de aanvoer van een partij vindt plaats aan de VWA overeenkomstig artikel 2 van [verordening
      136/2004/EG](32004R0136).

      3 Bij de aankomst op de inspectiepost wordt de ambtenaar door de belanghebbende bij de lading het op grond van de
      [artikelen 3 tot en met 7a][ref1], voor de invoer en, onderscheidenlijk of, de doorvoer van vlees afkomstig uit
      derde landen voorgeschreven document ter beschikking gesteld.

      4 De zending wordt door de belanghebbende bij de lading bij aankomst op de erkende inspectiepost ter onderzoek
      aangeboden aan de ambtenaar.

      5 Op de in het eerste lid bedoelde zending vlees zijn de [artikelen 2.17, zesde tot en met twaalfde lid][ref2],
      en [2.17a tot en met 2.23m van de Regeling keuring en handel dierlijke producten][ref3] van overeenkomstige
      toepassing.

      Op het in het derde lid bedoelde document is
      [artikel 2.17, vierde lid, van de Regeling keuring en handel dierlijke producten][ref4] van overeenkomstige
      toepassing.

      6 Voor de toepassing van de in het vijfde lid bedoelde artikelen moet worden gelezen:

      a. het eerste derde land waarnaar de zending vlees wordt vervoerd, deze niet zal weigeren of terugzenden;

      b. de ambtenaar, bedoeld in het tweede lid, vooraf toestemming heeft gegeven voor de doorvoer, en dient:

      a. voor ‘keuringsdierenarts’: inspecteur;

      b. voor ‘partij’: zending;

      c. voor ‘producten’: vlees, beenderen, hoornen of hoeven.

      7 Met betrekking tot de in het eerste lid bedoelde zending is voldaan aan bijlage XI, hoofdstuk A, punt 15, van
      [verordening 999/2001/EG](32001R0999).


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.17
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel2.17a
      [ref4]: https://wetten.overheid.nl/BWBR0006727#Artikel2.17
