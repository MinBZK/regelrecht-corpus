  - number: 2a
    text: |-
      Onder het in de [aanhef van artikel 2][ref1] bedoelde vlees afkomstig uit Italië wordt verstaan het verse rund-,
      varkens-, schape- en geitevlees waarvan de invoer in de Lid-Staten in de periode van 1 november 1984 tot en met 27
      november 1987 niet was toegestaan overeenkomstig [artikel 2, eerste, tweede en derde lid][ref2], van de beschikking
      van de Commissie van Europese Gemeenschappen van 18 september 1987, inzake bepaalde beschermende maatregelen tegen
      mond- en klauwzeer in Italië, No. 87/495/EEG (PbEG L 283).


