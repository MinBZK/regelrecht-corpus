  - number: 4b
    text: |-
      Het in [artikel 1a][ref1] gestelde verbod geldt, mits is voldaan aan de [artikelen 7f][ref2] tot en met [7k][ref3],
      voorts niet voor vers vlees van varkens, bestemd voor menselijke consumptie, afkomstig uit:

      a. Noorwegen, mits:

      1º. het vlees is voorzien van het keurmerk, bedoeld in artikel 3, eerste lid, onderdeel A, subonderdeel e, van
      [richtlijn 64/433/EEG](31964L0433);

      2º. het vlees vergezeld gaat van het handelsdocument, onderscheidenlijk keuringscertificaat, bedoeld in artikel 3,
      eerste lid, onderdeel A, subonderdeel f, van [richtlijn 64/433/EEG](31964L0433), en

      3º. het vlees voldoet aan de artikelen 3 en 4 van [richtlijn 72/461/EEG](31972L0461);

      b. een in [artikel 4a, onderdelen A, J of R][ref4], genoemd land of gedeelte van een land, niet zijnde Noorwegen,
      mits:

      1º het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het voor het land van verzending bij
      beschikking van de Commissie van de Europese Gemeenschappen op grond van artikel 16, eerste lid, van [richtlijn
      72/462/EEG](31972L0462) vastgesteld model, aangevuld met de volgende verklaringen: ‘Het vlees is afkomstig van
      varkens uit een land waar:

      - ten minste in de laatste twaalf maanden geen klassieke varkenspest is geconstateerd;
      - ten minste sedert de laatste twaalf maanden geen toestemming tot inenting tegen klassieke varkenspest is
      verleend;
      - zich in de bedrijven geen varkens bevinden die tegen klassieke varkenspest zijn ingeënt tijdens de laatste twaalf
      maanden.

      Het vlees heeft niet verbleven in ruimten waar vlees en varkens aanwezig zijn die niet aan vorenstaande eisen
      voldoen.’, en

      2º is voldaan aan [artikel 6][ref5] van beschikking 93/242/EEG.


