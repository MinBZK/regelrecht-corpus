    text: |-
      1 Het in [artikel 1a][ref1] gestelde verbod geldt, mits is voldaan aan de [artikelen 7b][ref2] tot en met
      [7e][ref3], niet voor vlees van gekweekt wild dat:

      a. afkomstig is uit een lid-staat van de Europese Unie;

      b. voldoet aan de artikelen 3 en 4 van [richtlijn 72/461/EEG](31972L0461);

      c. is gemerkt met een keurmerk overeenkomstig hoofdstuk XI van bijlage I van [richtlijn 64/433/EEG](31964L0433), en

      d. vergezeld gaat van een gezondheidscertificaat overeenkomstig bijlage IV van [richtlijn 91/495/EEG](31991L0495),
      waarop in voorkomend geval de bij of krachtens [richtlijn 72/461/EEG](31972L0461) vereiste vermeldingen voorkomen.

      2 Het in [artikel 1a][ref4] gestelde verbod geldt, mits is voldaan aan de [artikelen 7f][ref5] tot en met
      [7k][ref6], voorts niet voor vlees van gekweekt wild dat:

      a. afkomstig is uit Noorwegen;

      b. voldoet aan het eerste lid, onderdelen b tot en met d.

      3 Het in [artikel 1a][ref7] gestelde verbod geldt, mits is voldaan aan de [artikelen 7f][ref8] tot en met
      [7k][ref9], voorts niet voor vlees van gekweekt wild dat:

      a. afkomstig is uit een derde land, niet zijnde Noorwegenvan waaruit de in- en doorvoer van vers vlees, afkomstig
      van de als landbouwhuisdier gehouden variant van de betreffende diersoort, op grond van de [artikelen 4a][ref10],
      [4b][ref11] en [5][ref12] is toegestaan;

      b. vergezeld gaat van een gezondheidscertificaat waarvan het model overeenstemt met het voor de betrokken
      vleessoort uit het betrokken land van herkomst in beschikking 97/219/EG vastgestelde model;

      c. voor zover het vlees wordt doorgevoerd naar een lid-staat, bovendien vergezeld gaat van een door of namens de
      bevoegde autoriteit van de lid-staat van bestemming geautoriseerde verklaring, waarin de ter zake van de invoer in
      die lid-staat gestelde eisen zijn opgenomen;

      d. afkomstig is uit een inrichting die, zodra deze is vastgesteld en in werking getreden, voorkomt op de voor vlees
      van gekweekt wild uit het betrokken land van herkomst geldende voorlopige lijst van inrichtingen als bedoeld in
      beschikking 95/408/EG van de Raad van de Europese Unie van 22 juni 1995 tot vaststelling van voorschriften voor
      het opstellen voor een overgangsperiode van voorlopige lijsten van inrichtingen in derde landen waaruit de lid-
      staten bepaalde producten van dierlijke oorsprong, visserijproducten en levende tweekleppige weekdieren mogen
      invoeren (PbEG L 243), die alsdan ter inzage ligt in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer
      en Visserij in Den Haag, met dien verstande dat indien bij de vaststelling van voornoemde lijst is voorzien in
      overgangsbepalingen het vlees met inachtneming van die bepalingen afkomstig mag zijn uit een inrichting die voldoet
      aan [richtlijn 91/495/EEG](31991L0495).


