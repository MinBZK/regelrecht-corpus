    text: |-
      Deze paragraaf is van overeenkomstige toepassing op zendingen beenderen, hoornen en hoeven, afkomstig uit een derde
      land, met dien verstande dat waar in [artikel 7f, derde lid][ref1], wordt verwezen naar de [artikelen 3][ref2]
      tot en met [7a][ref3], voor de toepassing van dit artikel slechts wordt verwezen naar de [artikelen 4c][ref4] en
