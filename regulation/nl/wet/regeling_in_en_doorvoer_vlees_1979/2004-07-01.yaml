  - number: 7c
    text: |-
      1 De handelaar die overeenkomstig het bepaalde in [artikel 7b, tweede lid][ref1], is geregistreerd, moet:

      a. tenzij met de Minister anders is overeengekomen, van elke aanvoer van een zending vlees, bedoeld in
      [artikel 7b, eerste lid][ref2], tussen 08.00 uur en 17.00 uur en ten laatste op de dag, niet zijnde een zaterdag,
      zondag of algemeen erkende feestdag voorafgaande aan de dag van aankomst op de plaats waar de handelaar de zending
      vlees ontvangt, kennisgeven of doen kennisgeven aan de VWA, onder opgave van deze plaats, het vermoedelijke
      tijdstip van aankomst alsmede van de hoeveelheid en de soort vlees;

      b. de instructies van de ambtenaar in verband met een veterinairrechtelijke controle opvolgen en is desgevraagd
      verplicht de aangevoerde zending vlees aan de ambtenaar ten onderzoek aan te bieden en de in de de artikel 2
      bedoelde, voor invoer uit lid-staten van de Europese Unie voorgeschreven, documenten te overleggen alsmede om alle
      medewerking te verlenen en alle inlichtingen te verstrekken die voor deze controle noodzakelijk worden geacht;

      c. een administratie voeren waarin ten minste de leveringen van vlees en de eventuele verdere bestemming van het
      vlees zijn vermeld en waarin alle op de zendingen vlees betrekking hebbende bescheiden, en met name de in onderdeel
      b bedoelde documenten, zijn opgenomen;

      d. de vorenbedoelde administratie gedurende ten minste drie jaren bewaren;

      e. voorafgaand aan de ontvangst, onderscheidenlijk de verdere verdeling of verhandeling van elke zending
      vlees, nagaan of aan de voorwaarden, gesteld in [artikel 2][ref3] voor zover deze betrekking hebben op de
      [invoer van vlees][ref4] uit lid-staten van de Europese Unie, is voldaan;

      f. nalatigheden en onregelmatigheden met betrekking tot een levering van een zending vlees onmiddellijk melden aan
      de VWA;

      2 Indien een handelaar zijn in het eerste lid bedoelde verplichtingen niet nakomt of in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref5], kan de Minister beslissen dat zijn in artikel 6b, tweede
      lid, bedoelde registratie wordt doorgehaald dan wel niet wordt erkend.


