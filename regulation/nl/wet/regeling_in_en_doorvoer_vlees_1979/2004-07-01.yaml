      Het in [artikel 1a][ref1] gestelde verbod geldt, mits is voldaan aan de [artikelen 7f][ref2] tot en met [7k][ref3],
      voorts niet voor beenderen, hoornen of hoeven, die afkomstig zijn uit:

      a. Noorwegen, mits ten aanzien van die beenderen, hoornen of hoeven is voldoen aan [artikel 4b, onderdeel a][ref4];

      b. een derde land of gedeelte van een derde land, niet zijnde Noorwegen, waaruit de invoer van vers vlees van de
      betrokken diersoort krachtens [richtlijn 72/462/EEG](31972L0462) is toegestaan, mits die beenderen, hoornen of
      hoeven vergezeld gaan van een gezondheidscertificaat overeenkomstig het model, zoals dat ten aanzien van het land
      van verzending is vastgesteld bij beschikking van de Commissie van de Europese Gemeenschappen op grond van artikel
      16, eerste lid, van [richtlijn 72/462/EEG](31972L0462).


