  - number: 7a
    text: |-
      1 Het in [artikel 1a][ref1] gestelde verbod geldt voorts niet voor de doorvoer van vlees bestemd voor een derde
      land, mits

      a. de zending vergezeld gaat van een bij de zending behorend document, waaruit, indien de zending afkomstig
      is uit een derde land, tenminste de oorsprong van de zending kan worden afgeleid en, indien de zending via het
      grondgebied van een lid-staat naar Nederland is verzonden, tevens, voorzover van toepassing, wordt voldaan aan de
      [artikelen 7h][ref2] en [7j][ref3];

      b. voorzover de zending afkomstig is uit een derde land en rechtstreeks naar Nederland is verzonden, voorzover van
      toepassing, tevens is voldaan aan de [artikelen 7f][ref4], [7g][ref5], en [7i][ref6]..

      2 Het eerste lid is van overeenkomstige toepassing op beenderen, hoornen en hoeven, bestemd voor een derde land.


