  - number: 7e
    text: |-
      1 Indien bij de controle, bedoeld in [artikel 7c, eerste lid, onderdelen b en e][ref1], of bij de controle tijdens
      het vervoer van een zending vlees in het kader van de invoer of de doorvoer van deze partij wordt vermoed of
      geconstateerd dat er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 7, eerste lid,
      onderdeel a, van [richtlijn 89/662/EEG](31989L0662), aanwezig zijn of het vlees afkomstig is uit een met een
      epidemische dierziekte besmet gebied, kan de ambtenaar, indien hij de aanwezigheid van verwekkers van ziekten,
      zoönosen of andere aandoeningen vermoedt, gelasten dat de zending overeenkomstig zijn aanwijzingen in tijdelijke
      afzondering wordt geplaatst, dan wel worden de maatregelen, bedoeld in [artikel 7, eerste lid, onderdeel a][ref2],
      eerste alinea, van voornoemde richtlijn uitgevoerd, al naar gelang de ambtenaar daaromtrent heeft besloten.

      2 Indien bij de controle, bedoeld in [artikel 7c, eerste lid, onderdelen b en e][ref3], of bij de controle tijdens
      het vervoer van een zending vlees in het kader van de invoer of de doorvoer van deze zending wordt vermoed of
      geconstateerd dat niet wordt voldaan aan de voorschriften van de onderhavige regeling dan wel aan de van toepassing
      zijnde communautaire voorschriften, kan de ambtenaar, indien hij vermoedt dat niet wordt voldaan aan vorenbedoelde
      voorschriften, gelasten dat de zending overeenkomstig zijn aanwijzingen in tijdelijke afzondering wordt geplaatst,
      dan wel worden de maatregelen, bedoeld in artikel 7, eerste lid, onderdeel b, van [richtlijn 89/662/EEG]
      (31989L0662) uitgevoerd, al naar gelang de ambtenaar daaromtrent overeenkomstig de keuze van de afzender of diens
      gemachtigde heeft besloten.

      3 Een besluit als bedoeld in het eerste en tweede lid, wordt ter kennis gebracht van de afzender of diens
      gemachtigde met vermelding van de redenen. Desgevraagd geschiedt die kennisgeving schriftelijk, met vermelding van
      datum en uur waarop het besluit is genomen.

      4 Een besluit als bedoeld in het eerste en tweede lid laat onverlet het recht van de afzender van het vlees
      om, overeenkomstig het bepaalde in [artikel 8, tweede lid][ref4], vierde alinea, van [richtlijn 89/662/EEG]
      (31989L0662), binnen een maand na de kennisgeving, bedoeld in het derde lid, het advies van een veterinair
      deskundige in te winnen, met dien verstande evenwel, dat de ambtenaar te allen tijde kan beslissen om de
      maatregelen, bedoeld in het eerste lid, onmiddellijk uit te voeren, indien zulks noodzakelijk is om redenen van
      gezondheidsbescherming.

      5 De kosten, die uit de in het eerste of het tweede lid bedoelde maatregelen voortvloeien komen voor rekening van
      de afzender van de zending vlees of diens gemachtigde, onderscheidenlijk van de ontvanger van de zending vlees of
      diens gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel7c
