  - number: '7'
    text: >-
      In afwijking van hetgeen in deze paragraaf is bepaald ten aanzien van de voor de onderscheiden producten uit derde
      landen voorgeschreven gezondheidscertificaten, mag een partij afkomstig uit Nieuw-Zeeland eveneens vergezeld gaan
      van een op de partij betrekking hebbend(e):


      a. diergezondheidscertificaat zoals dat op 31 december 1996 voor het betrokken product was voorgeschreven, of


      b. met ingang van de datum van inwerkingtreding van de Overeenkomst van 17 december 1996 tussen de Europese
      Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke producten
      (PbEG 1997, L 57), een gezondheidscertificaat zoals dat is ingevolge de regelgeving van de Europese Gemeenschap
      ter uitvoering van die Overeenkomst is vastgesteld en dat een verklaring als bedoeld in bijlage VII van die
      Overeenkomst bevat.
