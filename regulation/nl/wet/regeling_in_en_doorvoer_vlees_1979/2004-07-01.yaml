  - number: '5'
    text: |-
      1 Het in [artikel 1a][ref1] gestelde verbod geldt, mits voldaan is aan het bepaalde in de
      [artikelen 7f tot en met 7k][ref2], niet voor de in- en doorvoer uit de in bijlage I van beschikking 93/402/EEG
      vastgestelde gebieden in Argentinië, Brazilië, Chili, Colombia, Paraguay en Uruguay van:

      a. de in bijlage II van beschikking 93/402/EEG genoemde categorieën vers vlees voor zover bestemd voor menselijke
      consumptie, met uitzondering van schoongemaakte slachtafvallen als bedoeld in artikel 1, onderdeel c, van
      voornoemde beschikking, bestemd voor de bereiding van vleesproducten die een warmtebehandeling hebben ondergaan,
      mits de zending vers vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen in
      bijlage III bij die beschikking, dat bestaat uit een algemeen gezondheidscertificaat overeenkomstig het model
      opgenomen in deel 1 van die bijlage III en, overeenkomstig hetgeen hieromtrent in bijlage II van beschikking
      93/402/EEG is bepaald, van één van de specifieke gezondheidscertificaten overeenkomstig het model opgenomen in deel
      2 van die bijlage III:.

      b. de in bijlage II van beschikking 93/402/EEG genoemde, voor de bereiding van vleesproducten die een
      warmtebehandeling hebben ondergaan, bestemde, schoongemaakte slachtafvallen, bedoeld in artikel 1, onderdeel c, van
      de in onderdeel a, genoemde beschikking, mits:

      - de zending slachtafvallen vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen
      in bijlage III bij de beschikking, dat bestaat uit een algemeen gezondheidscertificaat overeenkomstig het model
      opgenomen in deel 1 van bijlage III en, overeenkomstig hetgeen hieromtrent in bijlage II van de beschikking is
      bepaald, van één van de specifieke gezondheidscertificaten overeenkomstig het model opgenomen in deel 2 van deze
      bijlage;
      - in geval van invoer, deze plaatsvindt door inrichtingen die door de Minister zijn erkend;
      - de zending slachtafvallen verpakt is in lekvrije, verzegelde containers, op de containers en de begeleidende
      documenten de naam en het adres van de erkende inrichting van bestemming is aangebracht en op het karton,
      de containers en de begeleidende documenten, duidelijk en zichtbaar, de volgende vermelding is aangebracht:
      ‘Uitsluitend voor de industriële bereiding van vleesproducten die een warmtebehandeling hebben ondergaan,’, en
      - de zending slachtafvallen rechtstreeks en zonder overlading, in lekvrije, verzegelde containers of
      transportmiddelen, onder veterinair toezicht, over Nederlands grondgebied indien zij voor een lid-staat of
      Noorwegen is bestemd, dan wel naar de erkende inrichting van bestemming indien zij voor Nederland is bestemd, wordt
      vervoerd.

      2 Een erkenning als bedoeld in het eerste lid, onderdeel b, tweede gedachtenstreepje wordt slechts verleend indien:

      a. de inrichting zodanige voorzieningen kent dat gegarandeerd is dat de voor de bereiding van vleesproducten die
      een warmtebehandeling hebben ondergaan bestemde schoongemaakte slachtafvallen, bedoeld in artikel 1, onderdeel
      c, van de in het eerste lid, onderdeel a, genoemde beschikking, uitsluitend voor de aangegeven bestemming zullen
      worden gebruikt zonder dat er gevaar bestaat dat zij met niet-gesteriliseerde producten in aanraking komen en
      dat de schoongemaakte slachtafvallen de inrichting niet in ongewijzigde staat zullen verlaten, behalve om, indien
      nodig, onder toezicht van de ambtenaar naar een destructiebedrijf te worden gebracht;

      b. de inrichting zich er tegenover de Minister toe verbindt de in onderdeel a bedoelde garanties te verstrekken
      en ervoor te zorgen dat de schoongemaakte slachtafvallen tijdens het productieproces in hermetisch gesloten
      recipiënten worden gesteriliseerd, waarbij een Fc-waarde van tenminste 3 wordt bereikt dan wel worden gekookt tot
      een kerntemperatuur van tenminste 80°C, en de in het eerste lid, onderdeel b, laatste gedachtenstreepje, bedoelde
      containers en transportmiddelen alsmede alle andere voorwerpen die vóór de sterilisatie met de schoongemaakte
      slachtafvallen in contact zijn geweest, overeenkomstig de aanwijzingen van de Minister van de rijksdienst zijn
      gereinigd en ontsmet.

      3 Een erkenning als bedoeld in het eerste lid, onderdeel b, tweede gedachtenstreepje, wordt ingetrokken indien niet
      of niet meer wordt voldaan aan het tweede lid. Intrekking geschiedt niet dan na voorafgaande waarschuwing en na het
      verstrijken van een daarbij te stellen termijn, waarbinnen aan de desbetreffende voorschriften moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel1a
