  - number: 1a
    text: |-
      1 De in- en doorvoer van vlees, alsmede van beenderen, hoornen of hoeven is verboden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op de in- en doorvoer van vlees die op grond van
      [artikel 2.1, tweede lid, van de Regeling keuring en handel dierlijke producten][ref1] verboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0003217/2004-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2.1'
  - number: '2'
    text: |-
      1 Het in [artikel 1a][ref1] gestelde verbod geldt, met uitzondering van het in [artikel 2a][ref2] bedoelde vlees
      afkomstig uit Italië, niet:

      a. voor vers vlees, afkomstig uit een lid-staat van de Europese Unie, dat voldoet aan het bepaalde in de artikelen
      3 en 4 van [richtlijn 72/461/EEG](31972L0461) en ten aanzien waarvan is voldaan aan artikel 3, eerste lid,
      onderdeel A, subonderdelen e en f, van [richtlijn 64/433/EEG](31964L0433);.

      - ‘Vers vlees van runderen die na 1 januari zijn geboren.’;
      - ‘Vers vlees van runderen die in het Verenigd Koninkrijk uitsluitende hebben verbleven op bedrijven waar in de
      laatste zes jaar geen enkel geval van BSE is bevestigd.’;
      - ‘Vers vlees van runderen zonder been, in de vorm van spierweefsel waarvan alle aanhandend weefsel, inclusief
      zichtbaar zenuw- en lymfeweefsel is verwijderd.’;.

      b. voor beenderen, hoornen of hoeven, die afkomstig zijn uit een lid-staat of Noorwegen, met dien verstande dat
      onderdeel a van overeenkomstige toepassing is;

      c. voor in de onderdelen a en b bedoelde producten die in afwijking van die onderdelen niet voldoen aan artikel 3,
      onderdeel e, van [richtlijn 72/461/EEG](31972L0461), mits de producten in voorkomend geval vergezeld gaan van bij
      beschikking van de Commissie van de Europese Gemeenschappen op basis van artikel 10, derde lid, onderdeel f, vierde
      gedachtestreepje, van [richtlijn 2001/89/EG](32001L0089) vastgestelde merken of documenten, ten bewijze dat de
      producten voldoen aan de bij bedoelde beschikking gestelde voorwaarden,.

      mits is voldaan aan de [artikelen 7b tot en met 7e][ref3].

      2 Onverminderd het eerste lid, onderdeel a, wordt ingevoerd vers vlees, afkomstig van runderen, ouder
      dan twaalf maanden, waarin de wervelkolom, waaronder inbegrepen de achterwortelganglia, met uitzondering
      van de staartwervels, aanwezig is, rechtstreeks vervoerd naar een op grond van [artikel 9][ref4] of
      [artikel 10 van het Besluit productie en handel vers][ref5] vlees erkend slachthuis of erkende uitsnijderij, alwaar
      voornoemde wervelkolom wordt verwijderd.

      3 Het tweede lid is niet van toepassing indien het in dat lid bedoelde vlees vanuit een lidstaat via Nederland
      wordt doorgevoerd naar een andere lidstaat.

      4 Met betrekking tot het vlees als bedoeld in het tweede en derde lid is, voorzover van toepassing, met ingang van
      1 april 2002 voldaan aan bijlage XI, hoofdstuk A, punt 14, onder a en b, van [verordening 999/2001/EG](32001R0999).


