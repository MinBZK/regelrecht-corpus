  - number: '4'
    text: |-
      1 Het in [artikel 3][ref1] bedoelde vlees dient bij de invoer vergezeld te gaan van een volledig ingevulde
      gedagtekende en door een officiële dierenarts ondertekende verklaring inhoudende:

      a. dat de dieren waarvan het vlees is verkregen sedert hun geboorte dan wel, indien zij ouder waren dan drie
      maanden, ten minste gedurende de drie maanden vóór zij geslacht werden op het grondgebied van het land van
      verzending hebben verbleven;

      b. dat de dieren voor en na het slachten door een officiële dierenarts zijn gekeurd en bij de keuring niet bleken
      te lijden aan noch ervan verdacht te worden te lijden aan of besmet te zijn met een besmettelijke dierziekte.

      2 Het in [artikel 3][ref2] bedoelde vlees dient, indien het voor een andere lid-staat van de Europese
      Unie is bestemd, bij doorvoer vergezeld te gaan van een door of namens de bevoegde autoriteit van de Lid-
      Staat van bestemming geautoriseerde verklaring waarin de ter zake van de invoer in deze Lid-Staat gestelde
      veterinairrechtelijke eisen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003217#Artikel3
    url: https://wetten.overheid.nl/BWBR0003217/2004-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003217
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003217
        artikel: '3'
        paragraaf: '2'
  - number: 4a
    text: |-
      Het in [artikel 1a][ref1] gestelde verbod geldt, mits voldaan is aan het bepaalde in de [artikelen 7f][ref2] tot en
      met [7k][ref3], voorts niet voor:

      A. Vers vlees van runderen, schapen, geiten en éénhoevigen bestemd voor menselijke consumptie afkomstig uit:

      a. Noorwegen, mits het vlees:

      1º. is voorzien van het keurmerk, bedoeld in artikel 3, eerste lid, onderdeel A, subonderdeel e, van [richtlijn
      64/433/EEG](31964L0433);

      2º. vergezeld gaat van het handelsdocument, onderscheidenlijk keuringscertificaat, bedoeld in artikel 3, eerste
      lid, onderdeel A, subonderdeel f, van [richtlijn 64/433/EEG](31964L0433), en

      3º. voldoet aan de artikelen 3 en 4 van [richtlijn 72/461/EEG](31972L0461);.

      b. Noorwegen, mits het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen
      in de bijlage van de beschikking van de Commissie van de E.G. van 25 juli 1980, No. 80/800/EEG, betreffende
      gezondheidsvoorschriften en gezondheidscertificering voor de [invoer van vlees][ref4] uit Noorwegen (Pb. EG L
      234/38);

      c. Canada, mits het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen in de
      bijlage van beschikking 80/804/EEG van de Commissie van de Europese Gemeenschappen van 25 juli 1980, betreffende
      gezondheidsvoorschriften en gezondheidscertificering voor de [invoer van vlees][ref5] uit Canada (PbEG L 236);.

      d. Canada, mits:

      1º het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage
      van beschikking nr. 80/804/EEG van de Commissie van de Europese Gemeenschappen van 25 juli 1980, betreffende
      gezondheidsvoorschriften en gezondheidscertificering voor de [invoer van vlees][ref6] uit Canada (PbEG L 236), en

      2º voor zover het gekoeld vers vlees van éénhoevigen betreft, op dit vlees voorafgaande aan de uitvoer uit Canada
      met negatief resultaat een trichinenonderzoek overeenkomstig bijlage V van [richtlijn 77/96/EEG](31977L0096) van
      de Raad van de Europese Gemeenschappen van 21 december 1976 inzake gezondheidsvraagstukken op het gebied van het
      intracommunautaire handelsverkeer in vleesproducten (PbEG L 26) is uitgevoerd en dit vlees is vergezeld van een
      verklaring als bedoeld in [artikel 1, eerste lid][ref7], van beschikking nr. 94/60/EG van de Commissie van de
      Europese Gemeenschappen van 31 januari 1994 betreffende maatregelen tegen trichinose (Pb EG L 27);.

      e. Nieuw-Zeeland, mits het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen
      in de bijlage van de beschikking van de Commissie van de E.G. van 25 juli 1980, No. 80/805/EEG, betreffende
      gezondheidsvoorschriften en gezondheidscertificering voor de [invoer van vlees][ref8] uit Nieuw-Zeeland (Pb. EG
      L 236/28);

      f. f. de Verenigde Staten van Amerika, mits het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig
      het model opgenomen in de bijlage van beschikking 82/426/EEG van de Commissie van de Europese Gemeenschappen van 10
      juni 1982, betreffende gezondheidsvoorschriften en gezondheidscertificering voor de [invoer van vlees][ref9] uit de
      Verenigde Staten van Amerika (PbEG L 186);.

      g. de Verenigde Staten van Amerika, mits:

      - het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage
      van beschikking nr. 82/426/EEG van de Commissie van de Europese Gemeenschappen van 25 juli 1980, betreffende
      gezondheidsvoorschriften en gezondheidscertificering voor de invoer van vers vlees uit de Verenigde Staten van
      Amerika (PbEG L 186), en
      - voor zover het gekoeld vers vlees van éénhoevigen betreft, voorafgaande aan de uitvoer uit de Verenigde Staten
      van Amerika op een monster van 5 gram van dit vlees met negatief resultaat een trichinenonderzoek als bedoeld in
      bijlage I van [richtlijn nr. 77/99/EEG](31977L0099) van de Raad van de Europese Gemeenschappen van 21 december
      1976 inzake gezondheidsvraagstukken op het gebied van het intracommunautaire handelsverkeer in vleesproducten (PbEG
      L 26) is uitgevoerd en dit vlees is vergezeld van een verklaring als bedoeld in [artikel 1, eerste lid][ref10],
      van beschikking nr. 94/60/EG van de Commissie van de Europese Gemeenschappen van 31 januari 1994 betreffende
      maatregelen tegen trichinose (PbEG L 27);.

      h. Kroatië en de Republiek Slovenië, mits het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig
      één van de modellen opgenomen in de bijlagen van de op grond van artikel 16, eerste lid, van [richtlijn 72/462/EEG]
      (31972L0462) vastgestelde beschikkingen van de Commissie van de Europese Gemeenschappen.

      B. de in- en doorvoer van vers vlees uit Botswana overeenkomstig de op grond van artikel 16, eerste lid, van
      [richtlijn 72/462/EEG](31972L0462) vastgestelde beschikking van de Commissie van de Europese Gemeenschappen;

      C. Vers vlees van als huisdier gehouden runderen en éénhoevigen, afkomstig uit Costa Rica, mits het vlees
      vergezeld gaat van een gezondheidscertificaat overeenkomtig het model opgenomen in de bijlage van de beschikking
      van de Commissie van de E.E.G. van 19 oktober 1981, nr. 81/887/7/EEG, betreffende gezondheidsvoorschriften en
      gezondheidscertificering voor invoer van vers vlees uit Costa Rica (Pb. E.G. 1 324/25);.

      D. de in- en doorvoer van vers vlees uit Swaziland overeenkomstig de op grond van artikel 16, eerste lid, van
      [richtlijn 72/462/EEG](31972L0462) vastgestelde beschikking van de Commissie van de Europese Gemeenschappen;

      E. de in- en doorvoer van vers vlees uit de Republiek Zuid-Afrika overeenkomstig de op grond van artikel 16,
      eerste lid, van [richtlijn 72/462/EEG](31972L0462) vastgestelde beschikking van de Commissie van de Europese
      Gemeenschappen;

      F. Vers vlees, van als huisdier gehouden runderen en éénhoevigen, afkomstig uit Guatemala, mits het vlees vergezeld
      gaat van een gezondheidscertificaat overeenkomstig het model in de bijlage van de beschikking van de Commissie van
      de E.G. van 10 juni 1982, no. 82/414/EEG, betreffende gezondheidsvoorschriften en gezondheidscertificering voor
      invoer van vers vlees uit Guatemala;

      G. Vers vlees van als huisdier gehouden runderen, schapen, geiten en éénhoevigen, mits het vlees vergezeld gaat van
      een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Commissie van
      de E.G. van 15 februari 1983, nr. 83/84/EEG, betreffende gezondheidsvoorschriften en gezondheidscertificaten voor
      de invoer van vers vlees uit IJsland (Pb. EG L 56);

      H. Vers vlees van als huisdier gehouden runderen en éénhoevigen afkomstig uit Mexico, mits het vlees vergezeld gaat
      van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Commissie
      van de E.G. van 27 juli 1983, nr. 83/380/EEG, betreffende de gezondheidsvoorschriften en gezondheidscertificering
      voor invoer van vers vlees uit Mexico (Pb. EG L 222);

      I. Vers vlees van als huisdier gehouden éénhoevigen afkomstig uit Marokko, mits het vlees vergezeld gaat van een
      gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Commissie van de
      EG van 27 april 1984, nr. 84/295/EEG, betreffende gezondheidsvoorschriften en gezondheidscertificering voor invoer
      van vers vlees uit het Koninkrijk Marokko (PbEG L 144);

      J. Vers vlees van als huisdier gehouden runderen en éénhoevigen afkomstig uit Malta, mits het vlees vergezeld gaat
      van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Commissie
      van de EG van 27 april 1984, nr. 84/294/EEG, betreffende gezondheidsvoorschriften en gezondheidscertificering voor
      invoer van vers vlees uit Malta (PbEG L 144);

      K. Vers vlees van als huisdier gehouden runderen en éénhoevigen afkomstig uit Belize, mits het vlees vergezeld gaat
      van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Commissie
      van de EG van 27 april 1984, nr. 84/292/EEG, betreffende gezondheidsvoorschriften en gezondheidscertificering voor
      invoer van vers vlees uit Belize (PbEG L 144);

      L. Vers vlees van eenhoevige huisdieren, mits het vlees vergezeld gaat van een gezondheidscertificaat
      overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Europese Commissie van 26 juli 1990
      betreffende gezondheidsvoorschriften en gezondheidscertificaten voor de invoer van vers vlees uit Turkije (Pb EG L
      228), zoals deze is of zal zijn.

      M. Vers vlees van als huisdier gehouden runderen, schapen, geiten en éénhoevigen afkomstig uit Groenland, mits
      het vlees vergezeld gaar van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de
      beschikking van de Commissie van de EG van 7 maart 1986, nr. 86/117 EEG, betreffende gezondheidsvoorschriften en
      gezondheidscertificering voor de invoer van vers vlees uit Groenland (Pb.L.99).

      N. vers vlees van als huisdier gehouden eenhoevigen afkomstig uit Honduras, mits het vlees vergezeld gaat van een
      gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de beschikking van de Commissie van
      de EG van 8 maart 1989 betreffende gezondheidsvoorschriften en gezondheidscertificering voor invoer van vers vlees
      uit Honduras.

      O. Vers vlees van karkassen van als huisdier gehouden runderen, zonder been, afkomstig uit Madagascar, mits
      het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig het model opgenomen in de bijlage bij de
      beschikking van de Commissie van de EG van 19 maart 1990, nr. 90/156/EEG, betreffende gezondheidsvoorschriften en
      gezondheidscertificering voor de invoer van vers vlees uit Madagascar (Pb EG L 89).

      P. de in- en doorvoer van vers vlees uit Namibië overeenkomstig de op grond van artikel 16, eerste lid, van
      [richtlijn 72/462/EEG](31972L0462) vastgestelde beschikking van de Commissie van de Europese Gemeenschappen;

      Q. de in- en doorvoer van vers vlees uit de veterinaire gebieden in Zimbabwe, genoemd in de op grond van artikel
      16, eerste lid, van [richtlijn 72/462/EEG](31972L0462) vastgestelde beschikking van de Commissie van de Europese
      Gemeenschappen en overeenkomstig deze beschikking;

      R. een land of gedeelte van een land, vermeld in bijlage B van beschikking 93/242/EEG, mits:

      a. het vlees vergezeld gaat van een gezondheidscertificaat overeenkomstig één van de modellen, opgenomen in de
      bijlagen van de op grond van artikel 16, eerste lid, van [richtlijn 72/462/EEG](31972L0462) ten aanzien van dat
      land door de Commissie van de Europese Gemeenschappen vastgestelde beschikking, en

      b. is voldaan aan [artikel 6][ref11] van beschikking 93/242/EEG.


