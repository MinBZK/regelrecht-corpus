    text: |-
      Het in [artikel 1a][ref1] gestelde verbod geldt, mits aan het bepaalde in de [artikelen 4][ref2] en [7f][ref3]
      tot en met [7k][ref4] is voldaan niet voor vlees van paarden bestemd voor menselijke consumptie afkomstig uit de
      U.S.S.R.


