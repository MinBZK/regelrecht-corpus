  - number: 7l
    text: |-
      1 De [artikelen 7b][ref1] tot en met [7h][ref2] gelden niet voor vlees als bedoeld in artikel 16, eerste lid,
      van [richtlijn 97/78/EG](31997L0078), met dien verstande dat onder commerciële monsters als bedoeld in artikel
      16, eerste lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078) wordt verstaan handelsmonsters als bedoeld in
      [artikel 1][ref3] 1, [eerste lid][ref4], van de [Regeling keuring en handel dierlijke producten][ref5], en, mits
      met inachtneming van [artikel 5][ref6] van beschikking 93/13/EEG, wordt voldaan aan artikel 16, eerste lid, van
      [richtlijn 97/78/EG](31997L0078).

      2 Vlees als bedoeld in artikel 16, eerste lid, onderdelen e en f, van [richtlijn 97/78/EG](31997L0078) wordt
      aangevoerd via een erkende inspectiepost.

      3 Tenzij met de Minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer als bedoeld
      in het tweede lid tenminste 24 uur voor de aankomst schriftelijk kennis aan de VWA.


