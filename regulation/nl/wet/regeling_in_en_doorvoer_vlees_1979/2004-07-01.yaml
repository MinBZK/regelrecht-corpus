  - number: 7b
    text: |-
      1 De zending vlees, afkomstig uit lid-staten van de Europese Unie, moet, tot en met de ontvangst door de
      handelaar, voldoen aan de voorwaarden, gesteld in [artikel 2][ref1], voor zover deze betrekking hebben op de
      [invoer van vlees][ref2] uit lid-staten van de Europese Unie.

      2 De handelaar moet zijn ingeschreven in een register dat wordt bijgehouden door de Minister, terwijl die
      registratie niet is getroffen door een beslissing als bedoeld in [artikel 7c, tweede lid][ref3].

      3 Krachtens de regelgeving van de Europese Gemeenschappen zijn geen maatregelen genomen, houdende instelling van
      een verbod om de betreffende zending vlees uit de betrokken lid-staat van de Europese Unie in te voeren of houdende
      de machtiging tot instelling van een verbod om de betreffende zending vlees in Nederland in te voeren, noch is de
      lid-staat van de Europese Unie van verzending ingevolge die regelgeving gehouden de afgifte van de certificaten of
      vervoersdocumenten, zulks in verband met de invoer in Nederland, op te schorten.

      4 Ingevolge de regelgeving van de lid-staat van de Europese Unie van verzending is er geen verbod om de betrokken
      zending vlees op het grondgebied van die Lid-Staat in de handel te brengen.

      5 De in de e [artikelen 2][ref4], [6][ref5] en [6a, eerste lid][ref6] bedoelde certificaten en documenten zijn,
      met uitzondering van de documenten, bedoeld in artikel 10, eerste lid, eerste gedachtenstreepje, van [richtlijn
      90/675/EEG](31990L0675), originelen waarvan de geldigheidsduur niet is verstreken. Zij zijn in overeenstemming
      met de regelgeving van de Europese Gemeenschappen afgegeven en volledig ingevuld, gedagtekend en ondertekend in de
      Nederlandse, Engelse, Franse of Duitse taal.

      6 Ten aanzien van de betrokken zending vlees is, in voorkomend geval, voldaan aan de ingevolge artikel 9 van
      [richtlijn 89/662/EEG](31989L0662) vastgestelde regelgeving van de Europese Gemeenschap of van de lid-staat van
      verzending zelf, in geval van een uitbraak van een epidemische dierziekte in de lid-staat van verzending.

      7 Indien de zending vlees in Nederland wordt gebracht via een erkende inspectiepost, worden de in de
      [artikelen 2][ref7] en [6a, eerste lid][ref8], bedoelde certificaten of documenten, desverlangd door de handelaar
      overgelegd aan de ambtenaar.

      8 Het zevende lid geldt niet, indien de partij rechtstreeks via een geregelde lijndienst vanuit een erkende
      inspectiepost wordt vervoerd naar een andere op het grondgebied van de Europese Gemeenschap gelegen plaats.


