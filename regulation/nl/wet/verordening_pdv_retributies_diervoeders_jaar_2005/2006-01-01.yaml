$id: verordening_pdv_retributies_diervoeders_jaar_2005
regulatory_layer: WET
publication_date: '2006-01-20'
valid_from: '2006-01-01'
bwb_id: BWBR0017457
url: https://wetten.overheid.nl/BWBR0017457/2006-01-01
preamble:
  text: |-
    Gelet op de artikelen 95, 100 en 126, tweede lid, van de Wet op de bedrijfsorganisatie en op artikel 12 van het
    Instellingsbesluit Akkerbouwproductschappen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:






                  productschap:


                  Productschap Diervoeder;




                  secretaris:


                  secretaris van het productschap;




                  ondernemer:


                  degene die een onderneming drijft waarvoor het productschap is ingesteld.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel1
  - number: '2'
    text: |-
      In het geval in een verordening van het bestuur wordt bepaald dat de ondernemer verplicht is aan het productschap
      een retributie te betalen voor, door of namens het productschap verrichte werkzaamheden is het bepaalde in of
      krachtens deze verordening van toepassing.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      De deelnemende laboratoria zijn ten behoeve van de Kwaliteitsdienst Landbouwkundige Laboratoria aan het
      productschap jaarlijks een retributie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel3
  - number: '3.2'
    text: |-
      De retributie bedraagt






                    Basistarief


                    € 495




                    Per analysepakket additioneel


                    € 800 of € 375





            Geaccrediteerde analysepakketten






                    Aflatoxine


                    )




                    Dierlijke mest


                    )




                    Mineralen/spoorelementen


                    ) € 800




                    Vetkwaliteit


                    )




                    Weender


                    )





            Overige analysepakketten







                    Aminozuren


                    )




                    PCB's


                    )




                    Dierbehandelingsmiddelen chemisch


                    ) € 800




                    Microbiologie


                    )




                    Vet, vuil en eiwit in mmp


                    )




                    DON


                    )




                    Microscopisch onderzoek


                    )




                    Vitamines


                    ) € 375




                    Weipoeder in mmp


                    )




                    Minerale oliën


                    )
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      De ondernemer die een aanvraag als deelnemer aan de MINAS-regeling ingevolge de
      [Verordening PDV erkenningsregeling MINAS leveranciers diervoeders 2003][ref1] indient, dan wel deelnemer ingevolge
      deze verordening is, is verplicht aan het productschap een retributie te betalen van € 180 per jaar. Deelnemers die
      als tussenhandelaar optreden en uitsluitend diervoeders van MINAS-geregistreerde leveranciers betrekken, zijn 50%
      van het retributiebedrag verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014701
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014701
  - number: '4.2'
    text: |-
      De secretaris kan de erkenning namens het bestuur intrekken, indien de retributie, bedoeld in het eerste lid, niet
      of niet tijdig wordt betaald.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel4
  - number: '5'
    text: |-
      De certificatie-instelling is verplicht jaarlijks aan het productschap een retributie te betalen van: € 2.250,-
      basistarief € 750,- per GMP-standaard (incl. QC-standaard).
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      De certificatie-instelling is verplicht jaarlijks aan het productschap per bedrijfslocatie per certificatie van een
      GMP- of QC-standaard een basisvergoeding van € 145,- voor de eerste 5 locaties te betalen, € 110,- voor locatie 6
      t/m 10, € 75,- voor locatie l l t/m 15 en € 40,- voor locatie 16 en verder.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor een tweede certificatie op bedrijfslocatie is 50%, voor elke volgende certificatie is 10% van het in het
      eerste lid genoemde bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      Voor een aanvullende certificatie voor Japanstandaard, scharreldieren of graskippen is de certificatie-instelling
      verplicht aan het productschap een vergoeding van € 20,- te betalen.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel6
  - number: '6.4'
    text: De peildatum voor berekening van de vergoedingen, bedoeld in het eerste tot en met derde lid, is 31 december.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel6
  - number: '7'
    text: Het productschap kan verrekeningen van bedragen kleiner dan € 50 achterwege laten.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de ondernemer de benodigde gegevens voor het vaststellen van de retributie niet, niet tijdig of naar
      het oordeel van de secretaris niet volledig heeft verstrekt, is de secretaris bevoegd namens het bestuur de
      verschuldigde retributie voor de betreffende door het productschap verrichte werkzaamheden ambtshalve bij aanslag
      vast te stellen.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de ondernemer binnen 21 dagen na ontvangst van de retributieaanslag, bedoeld in het eerste lid, alsnog de
      gevraagde gegevens verstrekt, wordt de aanvankelijk vastgestelde retributie ingetrokken en een nieuwe retributie
      vastgesteld op basis van de door hem verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel8
  - number: '9'
    text: |-
      De retributie is verschuldigd uiterlijk op de eenentwintigste dag volgend op die waarop zij door of vanwege het
      productschap in rekening is gebracht, dan wel, indien de secretaris zulks verlangt, voor een door deze te bepalen
      datum.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel9
  - number: '10'
    text: |-
      Aan de ondernemer die niet of niet geheel binnen de in [artikel 9][ref1] gestelde termijn heeft betaald, kan
      door het productschap de wettelijke interest over het niet betaalde bedrag in rekening worden gebracht, te
      berekenen vanaf de dag waarop de betaling uiterlijk diende te zijn verricht ingevolge de aanmaning bedoeld in
      [artikel 127, tweede lid, van de Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017457#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017457
        artikel: '9'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: '11.1'
    text: |-
      De gegevens verkregen uit hoofde van het bepaalde in deze verordening dienen in handen van de secretaris te worden
      gesteld of door deze aan te wijzen personen van het secretariaat van het (hoofd-)productschap.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel11
  - number: '11.2'
    text: |-
      Deze gegevens mogen slechts worden gebezigd voor de vervulling van de taak van het productschap en mogen niet onder
      vermelding of aanduiding van de onderneming, waarop zij betrekking hebben, aan het bestuur, het dagelijks bestuur,
      een commissie van het (hoofd)productschap of aan leden of plaatsvervangende leden daarvan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel11
  - number: '12'
    text: |-
      Deze verordening treedt in werking met ingang van 1 januari 2005. Indien het Verordeningenblad Bedrijfsorganisatie
      waarin deze verordening wordt geplaatst, wordt uitgegeven na 1 januari 2005, treedt zij in werking met ingang van
      de tweede dag na de dagtekening van dat Verordeningenblad Bedrijfsorganisatie en werkt terug tot en met 1 januari
      2005.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel12
  - number: '13.1'
    text: De Verordening PDV retributies diervoeders jaar 2004 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      De in het eerste lid genoemde verordening blijft van kracht voor zover het betreft de op grond van die verordening
      verschuldigde, maar nog niet in rekening gebrachte dan wel betaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel13
  - number: '14'
    text: 'Deze verordening wordt aangehaald als: Verordening PDV retributies diervoeders jaar 2005.'
    url: https://wetten.overheid.nl/BWBR0017457/2006-01-01#Artikel14
