articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *militair:*
        - de militair als bedoeld in [artikel 1, eerste lid, onderdeel c, van het Algemeen militair ambtenarenreglement][ref1]
      (AMAR), alsmede degene die is aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als geestelijk
      verzorger doorlopend werkzaam te zijn;
        - *burgerambtenaar:*
        - de ambtenaar bedoeld in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref2];
        - *commandant:*
        - de commandant bedoeld in de Regeling aanwijzing commandanten AMAR;
        - *huisvesting:* gelegenheid tot nachtverblijf die wordt verstrekt door of voor rekening van Defensie, dan wel
      door of voor rekening van Defensie 1. bij een ander Nederlands defensieonderdeel, dan wel; 2. bij een ander
      publiekrechtelijk orgaan dan Defensie, dan wel; 3. bij een onderdeel van een buitenlandse krijgsmacht, dan wel; 4.
      bij een internationale organisatie waarbij Nederland krachtens een verdrag is aangesloten;
        - *voeding:*
        - de door of vanwege Defensie aangeboden maaltijden;
        - *woning:*
        - de woning waar de militair een eigen huishouding voert;
        - *plaats van tewerkstelling:*
        - het gebouw, gebouwencomplex, terrein of vaartuig, waar de militair gewoonlijk zijn werkzaamheden verricht, dan
      wel een door de commandant aangewezen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel1
