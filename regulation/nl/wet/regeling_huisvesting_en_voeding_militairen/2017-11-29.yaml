  - number: '10.3'
    text: |-
      In afwijking van het tweede lid, bedraagt de in het eerste lid bedoelde bijdrage bij eetgelegenheden waar sprake is
      van componentenverkoop: het totaal van de verkoopprijzen van de afgenomen componenten.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel10
  - number: '11.1'
    text: |-
      De militair die is ingedeeld in een functie bij RHQ-AFNORTH, NAK-AFNORTH, AFNORTH Support Group, Northern Region
      Signal Group, Landmachtstaf/Vert. Kmar HQ-AFNORTH en de CIMIC Group North, die niet dagelijks kan reizen tussen de
      plaats waar hij woonachtig is en de plaats waar hij in de regel de dienst verricht en voor wie het niet mogelijk is
      de maaltijden in de Nederlandse militaire eetgelegenheden te gebruiken, heeft aanspraak op een tegemoetkoming van
      voedingskosten gedurende de dagen dat hij om redenen van dienst in Brunssum, Maastricht of Budel verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel11
  - number: '11.2'
    text: |-
      De militair als bedoeld in [artikel 12, eerste lid, onderdelen a en b][ref1] en
      [artikel 4, tweede lid, onderdeel c][ref2], die door Defensie wordt gehuisvest voor het volgen van een
      niet defensieopleiding en, naar het oordeel van de commandant, geen gebruik kan maken van een Nederlandse
      militaire eetgelegenheid heeft gedurende de dagen dat hij geacht wordt voor het volgen van de opleiding op het
      huisvestingsadres te verblijven aanspraak op een tegemoetkoming in de voedingskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0039895#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0039895#Artikel4
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0039895
        artikel: '12'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0039895
        artikel: '4'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      De in het eerste en tweede lid bedoelde tegemoetkoming bedraagt € 4,06 voor een ontbijt, € 5,84 voor
      een lunch en € 8,63 voor een diner. Voor de militair die een maandelijkse bijdrage wegens huisvesting is
      verschuldigd, wordt de vergoeding per maaltijd verminderd met het voor Nederland geldende bedrag, genoemd in
      [artikel 10, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039895#Artikel10
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0039895
        artikel: '10'
        hoofdstuk: '3'
  - number: '11.4'
    text: |-
      De militair die zich houdt aan de voor hem geldende religieuze drank- en voedselvoorschriften heeft, voor elke
      dag dat hij is vrijgesteld van de bijdrage voor voeding, aanspraak op een tegemoetkoming in de door hem voor zijn
      voeding noodzakelijk te maken werkelijke kosten tot een maximum van € 14,23 per dag.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel11
  - number: '12.1'
    text: 'Van het betalen van de bijdrage voor huisvesting en voeding is vrijgesteld de militair:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.a
    text: |-
      die in de regel dagelijks reist tussen de plaats van tewerkstelling en zijn woning en aan wie uitsluitend om
      redenen van dienst huisvesting wordt verleend;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.b
    text: |-
      die niet dagelijks reist tussen de plaats van tewerkstelling en zijn woning voor de
      periode dat aanspraak bestaat op een tegemoetkoming in de kosten van het reizen, bedoeld in
      [artikel 20, van het Verplaatsingskostenbesluit militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel20
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '20'
  - number: 12.1.c
    text: |-
      die geplaatst of gedetacheerd is aan boord van een schip en wat de voeding betreft alleen als het schip zich buiten
      de thuishaven bevindt;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.d
    text: gedurende de dagen waarop hem, om tuchtrechtelijke of strafrechtelijke reden, zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.e
    text: gedurende de eerste dag van verblijf in werkelijke dienst;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.f
    text: gedurende het verblijf op een onderdeel dan wel in een militair hospitaal om medische redenen;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.g
    text: |-
      tijdens deelname aan bijeenkomsten in een conferentieoord van een instantie belast met geestelijke verzorging voor
      militairen;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.h
    text: |-
      die genodigde is bij bijzondere gebeurtenissen van militaire aard en de militairen die bij de organisatie betrokken
      zijn;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.i
    text: gedurende het verrichten van diensten;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.j
    text: |-
      bij werkzaamheden waarvan de aard, naar het oordeel van de commandant, het niet toelaat dat de werkplek wordt
      verlaten;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.k
    text: |-
      gedurende de inzet in het kader van militaire steunverlening als bedoeld in het Voorschrift Militaire
      Steunverlening in het openbaar belang en Maatschappelijke dienstverlening door Defensie aan derden;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: 12.1.l
    text: |-
      die op grond van de [artikelen 57][ref1] en [58 van de Politiewet 2012][ref2] wordt ingezet voor het verlenen van
      militaire bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel58
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '58'
  - number: '12.2'
    text: |-
      De militair die deelneemt aan een maaltijd ter bevordering van de saamhorigheid tot maximaal zes maal per jaar,
      is vrijgesteld van het betalen van de eigen bijdrage voor die maaltijd. De verstrekking van een maaltijd ter
      bevordering van de saamhorigheid geschiedt op basis van de voor die maaltijden vastgestelde rantsoenschaalprijs.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: '12.3'
    text: |-
      Voor de militair die is vrijgesteld van het betalen van de bijdrage voor voeding en gebruik maakt van een
      eetgelegenheid waar een zelfbedieningssysteem wordt gehanteerd, bedraagt de vrijstelling ten hoogste het bedrag per
      maaltijd volgens de tabel in [artikel 10, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039895#Artikel10
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0039895
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.4'
    text: |-
      Van het betalen van de eigen bijdrage voor huisvesting is vrijgesteld de militair, die huisvesting geniet in een
      door de Hoofddirecteur Personeel aangewezen legeringsgebouw dat nog niet is gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel12
  - number: '13.1'
    text: |-
      De Minister van Defensie kan machtiging verlenen tot het al dan niet tegen betaling van een bijdrage incidenteel
      verstrekken van voeding aan andere personen dan militairen en burgerambtenaren van Defensie. Indien het aantal
      personen niet meer is dan 50 kan deze machtiging door de bevoegde commandant worden verleend.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel13
  - number: '13.2'
    text: In de gevallen waarin deze regeling niet of niet in redelijkheid voorziet beslist de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel13
  - number: '14'
    text: Deze regeling treedt in werking met ingang van de datum van ondertekening.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel14
  - number: '15'
    text: Deze regeling wordt aangehaald als ‘Regeling huisvesting en voeding militairen’ (RHVM).
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel15
