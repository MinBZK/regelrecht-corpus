  - number: '3'
    text: 'De militair kan door de commandant worden verplicht gebruik te maken van huisvesting in het geval:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel3
  - number: 3.a
    text: er sprake is van buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel3
  - number: 3.b
    text: het door de commandant voor het verrichten van diensten of werkzaamheden noodzakelijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel3
  - number: 3.c
    text: |-
      het door de commandant uit oogpunt van opleiding, zijnde initiële of andere opleidingen met een sterk groepsvormend
      karakter, oefening of operationele inzet noodzakelijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel3
  - number: 3.d
    text: er sprake is van een opgelegde beperking van de bewegingsvrijheid.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel3
  - number: '4.1'
    text: |-
      Aan de militair kan, op aanvraag, huisvesting door Defensie worden verleend zolang naar het oordeel van de
      commandant huisvestingsfaciliteiten op het militaire onderdeel beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel4
  - number: '4.2'
    text: |-
      Indien huisvesting op het militaire onderdeel ontbreekt kan ten behoeve van de militair daarin door de zorg van de
      commandant elders worden voorzien, indien de militair:
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel4
  - number: 4.2.a
    text: naar het oordeel van de commandant, uitsluitend om dienstredenen dient te worden gehuisvest;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel4
  - number: 4.2.b
    text: |-
      niet dagelijks reist tussen de plaats van tewerkstelling en zijn woning voor de periode
      dat aanspraak bestaat op een tegemoetkoming in de kosten van het reizen, bedoeld in
      [artikel 20, van het Verplaatsingskostenbesluit militairen][ref1] en de afstand tussen zijn woning en zijn plaats
      van tewerkstelling, naar het oordeel van de commandant, een belemmering vormt voor een goede vervulling van de
      dienst;


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel20
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '20'
  - number: 4.2.c
    text: |-
      niet dagelijks reist tussen de plaats van tewerkstelling en de plaats waar de militair
      woonachtig is, aanspraak heeft op een tegemoetkoming in de kosten van reizen als bedoeld in
      [artikel 21 van het Verplaatsingskostenbesluit militairen][ref1] en de afstand tussen de plaats waar hij woonachtig
      is en de plaats van tewerkstelling, naar het oordeel van de commandant, een belemmering vormt voor een goede
      vervulling van de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel21
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '21'
  - number: '4.3'
    text: |-
      De militair dient, om voor de in dit artikel bedoelde huisvesting in aanmerking te komen, schriftelijk te
      verklaren dat hij minimaal drie nachten per week gebruik zal maken van de geboden huisvesting. Voor de militair
      als bedoeld in [artikel 54e van het Algemeen militair ambtenarenreglement][ref1] en de militair die in verband met
      deeltijdverlof een arbeidsduur heeft van minder dan 38 uur per week wordt deze termijn vastgesteld op een evenredig
      deel daarvan, waarna de uitkomst naar beneden wordt afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54e
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54e
  - number: '5'
    text: '[Vervallen bij BS2010007404, d.d. 31-3-10]'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel5
  - number: '6.1'
    text: |-
      De militair wordt huisvesting verleend op een zodanige afstand van de plaats van tewerkstelling dat er, naar het
      oordeel van de commandant, geen belemmering bestaat voor een goede vervulling van de dienst.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel6
  - number: '6.2'
    text: |-
      De verstrekking van huisvesting door de commandant geschiedt in beginsel voor een termijn van één jaar waarna de
      termijn, voor zover naar het oordeel van de commandant huisvestingsaccommodatie beschikbaar is, telkens met een
      jaar kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel6
  - number: '7.1'
    text: |-
      De militair die huisvesting geniet, is hiervoor een maandelijkse bijdrage verschuldigd, tenzij hij op grond van
      deze regeling daarvan is vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: '7.2'
    text: De bijdrage bedraagt 3,6% van de voor de militair geldende bezoldiging, doch ten hoogste € 119,90.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: '7.3'
    text: |-
      Het in het tweede lid bedoelde bedrag wordt voor de militair die is geplaatst in een gebied buiten Nederland
      verhoogd met een door de Minister vast te stellen duurtecorrectie, aangevende het verschil in kosten van
      levensonderhoud tussen het gebied van verblijf en Nederland.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: '7.4'
    text: 'De bijdrage wordt maandelijks op de bezoldiging ingehouden. Deze inhouding wordt:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: 7.4.a
    text: over de tijd dat aanspraak bestaat op een gedeelte van de bezoldiging, toegepast in evenredigheid met dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: 7.4.b
    text: niet toegepast over de tijd dat geen aanspraak op de bezoldiging bestaat;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: 7.4.c
    text: |-
      indien de militair anders dan om redenen van dienst – waaronder medische redenen – een gedeelte van de maand
      huisvesting geniet, toegepast in evenredigheid met dat gedeelte.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: '7.5'
    text: |-
      De op de bezoldiging toegepaste inhouding wegens een bijdrage voor huisvesting wordt aan de militair, indien hij
      over een aaneengesloten periode van tenminste 30 dagen in verband met verlof, roostervrije dagen, vergoeding in
      tijd en ziekte geen gebruik heeft gemaakt van de huisvesting, over die periode terugbetaald.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: '7.6'
    text: |-
      De militair heeft, indien op zijn bezoldiging de inhouding wegens een bijdrage voor huisvesting is toegepast,
      aanspraak op terugbetaling van 1/30 van de inhouding voor elke dag dat hij:
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: 7.6.a
    text: heeft deelgenomen aan een militaire oefening;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: 7.6.b
    text: is ondergebracht in een tent in verband met renovatie van het legeringsgebouw.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel7
  - number: '8.1'
    text: |-
      De militair die een passende woning huurt uit een bestand van door Defensie in eigendom verworven of gehuurde,
      specifiek voor militairen bestemde woningen, is hiervoor maandelijks een bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: '8.2'
    text: 'De in het eerste lid bedoelde bijdrage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.2.a
    text: |-
      voor de militair aan wie door de commandant de verplichting is opgelegd de in het eerste lid bedoelde woning te
      betrekken:
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.2.a.1°
    text: |-
      indien de woning in Nederland is gelegen: twaalf procent van de bezoldiging, met dien verstande dat dit bedrag –
      in voorkomend geval verminderd met de toelage woninghuur Koninklijke Marechaussee, bedoeld in artikel 39 van de
      Inkomstenregeling militairen – niet méér bedraagt dan de voor de loonheffing geldende huurwaarde van die woning;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.2.a.2°
    text: |-
      indien de woning buiten Nederland is gelegen: twaalf procent van de bezoldiging, vermeerderd met twaalf procent
      van de duurtecorrectie – voor zover deze positief is –, berekend over het voor de militair geldende Standaard Netto
      Nederland in de zin van het [Voorzieningenstelsel buitenland defensiepersoneel][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039849
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0039849
  - number: 8.2.b
    text: 'in de overige gevallen:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.2.b.1°
    text: |-
      indien de woning in Nederland is gelegen: vijftien procent van de bezoldiging, met dien verstande dat dit bedrag
      – in voorkomend geval verminderd met de toelage woninghuur Koninklijke Marechaussee, bedoeld in artikel 39 van de
      Inkomstenregeling militairen – niet méér bedraagt dan de voor de loonheffing geldende huurwaarde van die woning;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.2.b.2°
    text: |-
      indien de woning buiten Nederland is gelegen: zeventien procent van de bezoldiging, vermeerderd met zeventien
      procent van de duurtecorrectie – voor zover deze positief is –, berekend over het voor de militair geldende
      Standaard Netto Nederland in de zin van het [Voorzieningenstelsel buitenland defensiepersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039849
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0039849
  - number: 8.2.c
    text: |-
      In afwijking van het gestelde in het tweede lid onder a en b van dit artikel is de eigen bijdrage 10% van de
      bezoldiging, indien de defensieambtenaar vanuit een eigendomswoning, als gevolg van het vervullen van een bepaalde
      functie, verplicht gebruik dient te maken van een ambts- of dienstwoning en hij gedurende zijn plaatsing of een
      deel van die plaatsing deze eigendomswoning aanhoudt en die woning niet verhuurt of ter beschikking stelt aan een
      ander dan een van de eigen-, stief- of pleegkinderen van de defensieambtenaar.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: '8.3'
    text: |-
      Indien de woning is voorzien van verwarming, elektrische energie, gas of leidingwater en de kosten hiervan niet
      afzonderlijk kunnen worden vastgesteld, wordt de bijdrage verhoogd:
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.3.a
    text: 'indien de woning in Nederland is gelegen:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.3.a.1°
    text: 'voor het gebruik van verwarming: met 2,4% van de bezoldiging, tot een maximum van € 111,43 per maand;'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.3.a.2°
    text: |-
      voor het gebruik van elektrische energie of gas voor kookdoeleinden: met 0,9% van de bezoldiging, tot een maximum
      van € 36,39 per maand;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.3.a.3°
    text: |-
      voor het gebruik van elektrische energie anders dan voor verwarming van de woonruimte en kookdoeleinden: met 0,9%
      van de bezoldiging, tot een maximum van € 23,27 per maand;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.3.a.4°
    text: 'voor het gebruik van leidingwater: met 0,4% van de bezoldiging, tot een maximum van € 14,86 per maand.'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.3.b
    text: |-
      indien de woning buiten Nederland is gelegen: met de onder a, ten 1° tot en met 4°, bedoelde bedragen, vermeerderd
      met de daarover berekende duurtecorrectie, voor zover deze positief is.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: '8.4'
    text: |-
      De militair aan wie door bemiddeling van Defensie een in Nederland gelegen woning ter beschikking is gesteld,
      waarvan de verschuldigde huur door de zorg van Defensie wordt voldaan, is hiervoor maandelijks een bijdrage
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: '8.5'
    text: 'De in het vierde lid bedoelde bijdrage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.5.a
    text: |-
      ter zake van de huur en de – naar het oordeel van de Minister van Defensie – daaronder begrepen servicekosten:
      vijftien procent van de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: 8.5.b
    text: |-
      ter zake van de overige servicekosten: het bedrag dat daarvoor werkelijk is verschuldigd, met dien verstande dat de
      bijdrage niet méér bedraagt dan de door Defensie verschuldigde huur en servicekosten.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel8
  - number: '9'
    text: |-
      De militair heeft aanspraak op voeding van Defensie en voor rekening van Defensie tijdens
      het verrichten van werkzaamheden in het kader van het oefenen, inzet als bedoeld in
      [artikel 1, onderdeel d, van de Regeling voorzieningen vredes- en humanitaire operaties][ref1], aan boord van een
      schip tijdens het varen dan wel aan boord van een vliegtuig tijdens het vliegen, niet zijnde een detachering of
      een verplaatsing als bedoeld in het [Verplaatsingskostenbesluit militairen][ref2] of een dienstreis als bedoeld in
      het [Besluit dienstreizen defensie][ref3], doch uitsluitend indien de militair, naar het oordeel van de commandant,
      niet in staat is in eigen voeding te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0039789#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005137
      [ref3]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039789
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005137
      - id: ref3
        bwb_id: BWBR0007956
  - number: '10.1'
    text: |-
      De militair die voeding geniet, is hiervoor per maaltijd een bijdrage verschuldigd, tenzij de militair op grond van
      deze regeling daarvan is vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel10
  - number: '10.2'
    text: 'De in het eerste lid bedoelde bijdrage bedraagt op basis van de standaard samenstelling van de maaltijden:'
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel10
  - number: 10.2.a
    text: |-
