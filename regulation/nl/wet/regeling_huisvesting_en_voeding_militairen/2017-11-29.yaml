  - number: '2.1'
    text: |-
      Deze regeling is niet van toepassing op de militair op wie
      [hoofdstuk 3 van het Voorzieningenstelsel buitenland defensiepersoneel][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0039849
        hoofdstuk: '3'
  - number: '2.2'
    text: |-
      De [artikelen 9][ref1], [10][ref2] en
      [12, eerste lid, onderdeel a, c, h, j, k, en l en het tweede, derde en vierde lid][ref3], zijn van overeenkomstige
      toepassing op de burgerambtenaar met dien verstande dat artikel 12, onderdeel j, niet overeenkomstig wordt
      toegepast indien het de voeding bij overwerk betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0039895#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0039895#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0039895#Artikel12
    url: https://wetten.overheid.nl/BWBR0039895/2017-11-29#Artikel2
    references:
