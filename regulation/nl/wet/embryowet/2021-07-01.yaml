  - number: '28.3'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn misdrijven; de in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel28
  - number: '29.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel29
  - number: '29.2'
    text: |-
      De in het eerste lid bedoelde personen beschikken niet over de bevoegdheden genoemd in
      [artikel 5:19 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '32'
    text: |-
      Onze Minister zendt iedere vijf jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel32
  - number: '33.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld met dien verstande dat de [artikelen 9][ref1], [11][ref2]
      en [24, onderdeel b][ref3], in werking treden op het in het tweede lid bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel24
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013797
        artikel: '24'
        paragraaf: '6'
  - number: '33.2'
    text: |-
      [Onderdeel a van artikel 24][ref1] vervalt op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor
      dit besluit wordt niet eerder gedaan dan vier weken nadat het ontwerp van het besluit is overgelegd aan beide
      kamers der Staten-Generaal en evenmin indien binnen die termijn door of namens een der kamers of door tenminste een
      vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen is gegeven dat het tijdstip waarop
      [onderdeel a van artikel 24][ref2] vervalt, bij wet wordt geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel24
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '24'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '24'
        paragraaf: '6'
  - number: '34'
    text: 'Deze wet wordt aangehaald als: Embryowet.'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel34
