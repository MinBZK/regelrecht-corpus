---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: embryowet
regulatory_layer: WET
publication_date: '2025-08-12'
valid_from: '2021-07-01'
bwb_id: BWBR0013797
url: https://wetten.overheid.nl/BWBR0013797/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het uit een oogpunt van respect voor menselijk leven wenselijk is
    bepaalde handelingen met menselijke geslachtscellen en embryo's te verbieden, te regelen onder welke voorwaarden
    andere handelingen met menselijke geslachtscellen en embryo's ter verbetering van de medische zorg toelaatbaar zijn
    en regelen te stellen met betrekking tot de zeggenschap over geslachtscellen en embryo's;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: 1.b
    text: 'geslachtscellen: menselijke zaad- en eicellen;'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: 1.c
    text: 'embryo: cel of samenhangend geheel van cellen met het vermogen uit te groeien tot een mens;'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: 1.d
    text: 'foetus: embryo in het menselijk lichaam;'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: 1.e
    text: |-
      centrale commissie: de commissie, bedoeld in
      [artikel 14 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel14
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '14'
  - number: 1.f
    text: |-
      degene die het wetenschappelijk onderzoek verricht: degene die de opdracht heeft gegeven voor de organisatie of
      uitvoering van een wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: 1.g
    text: |-
      degene die het wetenschappelijk onderzoek uitvoert: degene die belast is met de feitelijke uitvoering van het
      onderzoek. Indien de feitelijke uitvoering geschiedt door een werknemer of een andere hulppersoon, wordt degene die
      van deze persoon gebruik maakt aangemerkt als degene die het onderzoek uitvoert.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Het bestuur van een instelling waar buiten het menselijk lichaam embryo's tot stand worden gebracht of
      anderszins handelingen met embryo's worden verricht, stelt na advies van de commissie die ingevolge de
      [Wet medisch-wetenschappelijk onderzoek met mensen][ref1] is belast met het beoordelen van onderzoeksvoorstellen
      voor medisch-wetenschappelijk onderzoek in de instelling, een protocol vast betreffende handelingen met
      geslachtscellen en embryo's. Wijzigingen en aanvullingen van het protocol behoeven eveneens voorafgaand advies van
      bedoelde commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009408
  - number: '2.2'
    text: |-
      In het protocol worden, voor zover in de instelling van toepassing, met inachtneming van de
      [artikelen 5 tot en met 9a][ref1] regels gesteld betreffende de zeggenschap over geslachtscellen en embryo's, het
      tot stand brengen van embryo's buiten het menselijk lichaam, het tot stand brengen van een zwangerschap met die
      embryo's en het gebruik van geslachtscellen en embryo's voor andere doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel5
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '5'
        paragraaf: '2'
  - number: '2.3'
    text: 'Het protocol bevat in ieder geval regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.a
    text: de wijze waarop de ovulatiestimulatie plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.b
    text: de wijze waarop geslachtscellen worden verkregen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.c
    text: de werkwijze bij de bevruchting en bij de ontwikkeling en implantatie van de embryo's;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.d
    text: |-
      de wijze waarop geslachtscellen en embryo's worden bewaard en waarop de herkomst en de bewaring worden vastgelegd
      in de administratie van de instelling;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.e
    text: de termijn gedurende welke geslachtscellen en embryo's worden bewaard en de gang van zaken daarna;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.f
    text: |-
      de werkwijze betreffende het ter beschikking stellen van geslachtscellen en embryo's voor andere doeleinden en
      gebruik na overlijden;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: 2.3.g
    text: |-
      de wijze waarop betrokkene wordt ondersteund bij het nemen van een beslissing omtrent donatie van geslachtscellen
      ten behoeve van de zwangerschap van een ander, indien voor de verkrijging van de geslachtscellen een invasieve
      ingreep bij betrokkene noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      Wetenschappelijk onderzoek met embryo's, daaronder begrepen wetenschappelijk onderzoek met geslachtscellen waarbij
      embryo's tot stand worden gebracht, wordt verricht overeenkomstig een daartoe opgesteld onderzoeksprotocol dat een
      volledige beschrijving van het voorgenomen onderzoek bevat.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Het onderzoek, bedoeld in [paragraaf 3][ref1] en [4][ref2], is slechts toegestaan, indien over het
      onderzoeksprotocol een positief oordeel is verkregen van de centrale commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013797
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013797
        paragraaf: '4'
  - number: '3.3'
    text: |-
      Het onderzoek, bedoeld in [paragraaf 5][ref1], is toegestaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013797
        paragraaf: '5'
  - number: 3.3.a
    text: |-
      het wetenschappelijk onderzoek betreft waarbij de foetus niet wordt onderworpen aan invasieve
      handelingen of waarbij de toestand van de foetus niet opzettelijk wordt gewijzigd en over
      het onderzoeksprotocol een positief oordeel is verkregen van de commissie, bedoeld in
      [artikel 16 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
  - number: 3.3.b
    text: |-
      het wetenschappelijk onderzoek betreft waarbij de foetus wordt onderworpen aan invasieve handelingen of waarbij de
      toestand van de foetus opzettelijk wordt gewijzigd en over het onderzoeksprotocol een positief oordeel is verkregen
      van de centrale commissie.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het derde lid, onderdeel a, kan de centrale commissie bepalen dat de beoordeling van protocollen
      betreffende een door haar aangewezen vorm van wetenschappelijk onderzoek als bedoeld in [paragraaf 5][ref1] door
      haar geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013797
        paragraaf: '5'
  - number: 3a
    text: |-
      De commissie, bedoeld in [artikel 16 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1], zendt aan de
      centrale commissie afschrift van elk ingevolge deze wet door haar gegeven oordeel alsmede van het desbetreffende
      onderzoeksprotocol of de hoofdzaken daarvan. Voorts doet de commissie, bedoeld in artikel 16 van de Wet medisch-
      wetenschappelijk onderzoek met mensen, bij de centrale commissie melding van de in [artikel 22, derde lid][ref2],
      bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel22
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '22'
        paragraaf: '5'
  - number: '4.1'
    text: |-
      De centrale commissie brengt jaarlijks aan Onze Minister verslag uit over de toepassing van deze wet, waarbij met
      name aandacht wordt besteed aan nieuwe ontwikkelingen betreffende handelingen met geslachtscellen en embryo's, voor
      zover deze blijken uit de voorgelegde onderzoeksprotocollen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister zendt dit verslag aan de beide kamers der Staten-Generaal en geeft daarbij zijn opvatting over de
      door de centrale commissie gesignaleerde nieuwe ontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop Onze Minister de in het
      tweede lid bedoelde opvatting voorbereidt.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      Meerderjarigen die in staat zijn tot een redelijke waardering van hun belangen ter zake, kunnen anders dan ten
      behoeve van eigen geneeskundig gebruik en onverminderd [artikel 9][ref1], hun geslachtscellen ter beschikking
      stellen ten behoeve van de zwangerschap van een ander of ten behoeve van wetenschappelijk onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel9
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '9'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      De terbeschikkingstelling kan slechts schriftelijk en om niet worden gedaan en niet dan nadat een persoon als
      bedoeld in het eerste lid, door de zorg van degene die de geslachtscellen bewaart, is ingelicht over de aard en het
      doel ervan. De betrokkene kan voor zover de geslachtscellen nog niet zijn gebruikt, de terbeschikkingstelling te
      allen tijde, zonder opgaaf van redenen, herroepen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      Indien voor het verkrijgen van geslachtscellen een invasieve ingreep bij de betrokkene noodzakelijk is, wordt
      deze door degene die de ingreep verricht, tevens ingelicht over de risico's en bezwaren daarvan. Indien de
      geslachtscellen ter beschikking worden gesteld ten behoeve van wetenschappelijk onderzoek is in dat geval
      mede de toestemming vereist van de in [artikel 2, eerste lid][ref1], bedoelde commissie die beoordeelt
      of het met de terbeschikkingstelling te dienen belang in evenredige verhouding staat tot de risico's en
      bezwaren van de ingreep, mede gelet op de omstandigheden waarin de betrokkene verkeert. Voor zoveel nodig is
      [artikel 5 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref2] in dat geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009408#Artikel5
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009408
        artikel: '5'
  - number: '5.4'
    text: |-
      De in het tweede lid bedoelde inlichtingen omvatten in ieder geval de informatie, bedoeld in de bijlage bij
      richtlijn 2004/23/EG van het Europees Parlement en de Raad van 31 maart 2004 tot vaststelling van kwaliteits- en
      veiligheidsnormen voor het doneren, verkrijgen, testen, bewerken, bewaren en distribueren van menselijke weefsels
      en cellen (PbEU L 102).
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel5
  - number: '5.5'
    text: |-
      Een wijziging van de in het vierde lid genoemde richtlijn gaat voor de toepassing van dit artikel gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      De inlichtingen worden op zodanige wijze verstrekt dat redelijkerwijs zeker is dat de betrokkene deze naar
      haar inhoud heeft begrepen, en in het geval bedoeld in [artikel 5, derde lid][ref1], bovendien schriftelijk. De
      betrokkene krijgt een zodanige bedenktijd dat hij op grond van de gegeven inlichtingen een zorgvuldig overwogen
      beslissing over de terbeschikkingstelling kan nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel5
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '5'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Bij de terbeschikkingstelling wordt vastgelegd voor welke doeleinden de geslachtscellen mogen worden gebruikt en
      gedurende welke termijn zij daarvoor zullen worden bewaard. Degene die de geslachtscellen bewaart en degene die ze
      ter beschikking heeft gesteld kunnen gezamenlijk de doeleinden wijzigen en de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      Bij de terbeschikkingstelling kan de betrokkene te kennen geven dat slechts wetenschappelijk onderzoek met de
      desbetreffende geslachtscellen mag worden verricht nadat hij is ingelicht over het doel van het onderzoek en daar
      uitdrukkelijk toestemming voor heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel6
  - number: '6.4'
    text: |-
      Indien geslachtscellen ter beschikking worden gesteld ten behoeve van de zwangerschap van een ander, wordt de
      betrokkene in de gelegenheid gesteld te bepalen dat voor gebruik van met zijn geslachtscellen tot stand gebrachte
      embryo's voor andere doeleinden mede zijn toestemming is vereist.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel6
  - number: '7'
    text: |-
      De geslachtscellen worden in ieder geval vernietigd indien zij niet voor andere doeleinden ter beschikking worden
      gesteld, na het verstrijken van de termijn waarvoor zij ter beschikking zijn gesteld, en na herroeping van de
      terbeschikkingstelling. De geslachtscellen worden voorts vernietigd nadat bij degene die ze bewaart, bekend is
      geworden dat de betrokkene is overleden, tenzij deze uitdrukkelijk schriftelijk toestemming heeft gegeven voor
      gebruik na zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      Meerderjarigen die in staat zijn tot een redelijke waardering van hun belangen ter zake, kunnen embryo's die ten
      behoeve van de eigen zwangerschap buiten het lichaam tot stand zijn gebracht, maar niet meer daarvoor zullen worden
      gebruikt, ter beschikking stellen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel8
  - number: 8.1.a
    text: de zwangerschap van een ander;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel8
  - number: 8.1.b
    text: |-
      het in kweek brengen van embryonale cellen voor geneeskundige doeleinden, medisch- en biologisch-wetenschappelijk
      onderzoek en medisch- en biologisch-wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel8
  - number: 8.1.c
    text: het verrichten van ingevolge deze wet toelaatbaar wetenschappelijk onderzoek met die embryo's.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      De terbeschikkingstelling kan slechts schriftelijk en om niet worden gedaan en niet dan nadat de betrokkenen,
      waaronder begrepen degene wiens toestemming is vereist op grond van artikel 6, vierde lid, door de zorg van
      degene die de embryo's bewaart, zijn ingelicht over de aard en het doel ervan. Bij verschil van mening tussen de
      betrokkenen vindt de terbeschikkingstelling niet plaats. Ieder van de betrokkenen kan, voor zover de embryo's nog
      niet zijn gebruikt, de terbeschikkingstelling te allen tijde, zonder opgaaf van redenen, herroepen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel8
  - number: '8.3'
    text: De artikelen 6 en 7 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel8
  - number: 9a
    text: |-
      Geslachtscellen of embryo’s die ten behoeve van eigen geneeskundig gebruik beschikbaar zijn of die ingevolge
      deze wet ter beschikking zijn gesteld, maar niet meer zullen worden gebruikt voor eigen geneeskundig gebruik
      of het doel dan wel de doelen waarvoor ze ter beschikking zijn gesteld, mogen worden gebruikt ten behoeve
      van kwaliteitsbewaking die direct verband houdt met de diagnostische processen of behandelprocessen in de
      fertiliteitszorg, voorafgaande aan de vernietiging, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel7
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '7'
        paragraaf: '2'
  - number: '10'
    text: |-
      De centrale commissie geeft slechts een positief oordeel over een onderzoeksprotocol betreffende wetenschappelijk
      onderzoek met embryo's waarmee geen zwangerschap tot stand wordt gebracht, indien:
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel10
  - number: 10.a
    text: |-
      redelijkerwijs aannemelijk is dat het onderzoek zal leiden tot de vaststelling van nieuwe inzichten op het terrein
      van de medische wetenschap;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel10
  - number: 10.b
    text: |-
      redelijkerwijs aannemelijk is dat de vaststelling, bedoeld onder a, niet door andere vormen of methoden van
      wetenschappelijk onderzoek kan plaatsvinden dan onderzoek met de desbetreffende embryo's of door onderzoek van
      minder ingrijpende aard;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel10
  - number: 10.c
    text: het onderzoek voldoet aan de eisen van een juiste methodologie van wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel10
  - number: 10.d
    text: |-
      het onderzoek wordt uitgevoerd door of onder leiding van personen die deskundig zijn op het desbetreffende gebied
      van wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel10
  - number: 10.e
    text: het onderzoek ook overigens voldoet aan redelijkerwijs daaraan te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel10
  - number: '12.1'
    text: |-
      Het is verboden wetenschappelijk onderzoek met embryo's te verrichten zonder dat deze embryo's of de
      geslachtscellen waaruit zij tot stand worden gebracht, daarvoor ter beschikking zijn gesteld en zonodig toepassing
      of overeenkomstige toepassing is gegeven aan het [derde en vierde lid van artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel6
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '6'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Indien toepassing of overeenkomstige toepassing wordt gegeven aan het [derde lid van artikel 6][ref1], zijn het
      [tweede lid van artikel 5][ref2] en het [eerste lid van artikel 6][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel6
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013797
        artikel: '6'
        paragraaf: '2'
  - number: '13'
    text: |-
      Degene die het wetenschappelijk onderzoek verricht draagt zorg voor de naleving van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel3
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '3'
        paragraaf: '1'
  - number: '14'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, draagt er zorg voor dat de persoonlijke levenssfeer van degenen
      van wie de geslachtscellen afkomstig zijn en van degenen die het embryo ter beschikking hebben gesteld, zoveel
      mogelijk wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel14
  - number: '15'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, draagt er zorg voor dat, alvorens de uitvoering van het
      onderzoek een aanvang neemt, degenen wier beroepsmatige medewerking nodig is bij de uitvoering van het onderzoek
      over de aard en het doel van het onderzoek zijn ingelicht.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel15
  - number: '16'
    text: |-
      De centrale commissie geeft slechts een positief oordeel over een onderzoeksprotocol betreffende wetenschappelijk
      onderzoek met embryo's buiten het menselijk lichaam waarmee wordt beoogd een zwangerschap tot stand te brengen,
      indien:
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel16
  - number: 16.a
    text: |-
      redelijkerwijs aannemelijk is dat het onderzoek zal leiden tot de vaststelling van nieuwe inzichten inzake
      onderzoeks- of behandelingsmethoden, gericht op het tot stand brengen van zwangerschap en de geboorte van een
      gezond kind;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel16
  - number: 16.b
    text: |-
      redelijkerwijs aannemelijk is dat de vaststelling, bedoeld onder a, niet door andere vormen of methoden van
      wetenschappelijk onderzoek kan plaatsvinden dan onderzoek met embryo's waarmee wordt beoogd een zwangerschap tot
      stand te brengen, of door onderzoek van minder ingrijpende aard;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel16
  - number: 16.c
    text: |-
      redelijkerwijs aannemelijk is dat het met het onderzoek te dienen belang in evenredige verhouding staat tot de
      bezwaren en risico's voor het toekomstige kind en de vrouw en
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel16
  - number: 16.d
    text: |-
      is voldaan aan de eisen, bedoeld in de [onderdelen c, d en e van artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel10
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '10'
        paragraaf: '3'
  - number: '17.1'
    text: |-
      Het is verboden wetenschappelijk onderzoek als bedoeld in [artikel 16][ref1] te verrichten zonder schriftelijke
      toestemming van de vrouw en haar echtgenoot, geregistreerde partner of andere levensgezel. Toestemming kan slechts
      worden verleend door meerderjarigen die in staat zijn tot een redelijke waardering van hun belangen ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel16
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '16'
        paragraaf: '4'
  - number: '17.2'
    text: |-
      Alvorens toestemming wordt gevraagd, draagt degene die het wetenschappelijk onderzoek uitvoert er zorg voor
      dat degenen van wie toestemming is vereist, schriftelijk worden ingelicht over het doel en de aard van het
      onderzoek, het bepaalde in de derde volzin van het derde lid en het vijfde lid van dit artikel en het bepaalde
      in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel14
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '14'
        paragraaf: '3'
  - number: '17.3'
    text: |-
      De inlichtingen worden op zodanige wijze verstrekt dat redelijkerwijs zeker is dat degenen van wie toestemming is
      vereist, deze naar hun inhoud hebben begrepen. De verstrekte inlichtingen worden desgevraagd aangevuld. Degenen van
      wie toestemming is vereist, krijgen een zodanige bedenktijd dat zij op grond van deze inlichtingen een zorgvuldig
      overwogen beslissing omtrent de gevraagde toestemming kunnen geven.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel17
  - number: '17.4'
    text: De wijze waarop uitvoering wordt gegeven aan dit artikel wordt vastgelegd in het onderzoeksprotocol.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel17
  - number: '17.5'
    text: |-
      Degene die toestemming heeft gegeven, kan deze te allen tijde, zonder opgaaf van redenen, intrekken. Hij is ter
      zake van de intrekking geen schadevergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel17
  - number: '18'
    text: |-
      De [artikelen 13][ref1], [14][ref2] en [15][ref3] zijn van overeenkomstige toepassing op wetenschappelijk onderzoek
      als bedoeld in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel15
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '14'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013797
        artikel: '15'
        paragraaf: '3'
  - number: '19'
    text: |-
      De centrale commissie of de commissie, bedoeld in
      [artikel 16 van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1], geeft slechts een positief
      oordeel over een onderzoeksprotocol betreffende wetenschappelijk onderzoek met foetussen, daaronder begrepen
      wetenschappelijk onderzoek met zwangerschapsondersteunende weefsels, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel16
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '16'
  - number: 19.a
    text: |-
      redelijkerwijs aannemelijk is dat het onderzoek zal leiden tot de vaststelling van nieuwe inzichten op het gebied
      van de geneeskunst betreffende ongeboren en pasgeboren kinderen of omtrent de voltooiing van zwangerschappen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel19
  - number: 19.b
    text: |-
      redelijkerwijs aannemelijk is dat de doelstelling, bedoeld onder a, niet door andere vormen of methoden van
      wetenschappelijk onderzoek kan worden bereikt dan onderzoek met foetussen, daaronder begrepen onderzoek met
      zwangerschapsondersteunende weefsels of door onderzoek van minder ingrijpende aard;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel19
  - number: 19.c
    text: |-
      redelijkerwijs aannemelijk is dat het met het onderzoek te dienen belang in evenredige verhouding staat tot de
      bezwaren en risico's voor de desbetreffende foetus en de zwangere vrouw en
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel19
  - number: 19.d
    text: |-
      is voldaan aan de eisen, bedoeld in de [onderdelen c, d en e van artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel10
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '10'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Wetenschappelijk onderzoek met een foetus daaronder begrepen wetenschappelijk onderzoek met
      zwangerschapsondersteunende weefsels is toegestaan indien het kan bijdragen aan de diagnostiek, de voorkoming of
      de behandeling van ernstige aandoeningen bij de desbetreffende foetus daaronder begrepen wetenschappelijk onderzoek
      met zwangerschapsondersteunende weefsels en dat niet kan worden uitgesteld tot na de geboorte.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Wetenschappelijk onderzoek dat niet kan bijdragen aan de diagnostiek, de voorkoming of behandeling van ernstige
      aandoeningen bij de desbetreffende foetus is slechts toegestaan, indien:
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel20
  - number: 20.2.a
    text: het kan bijdragen aan de diagnostiek, de voorkoming of behandeling van ernstige aandoeningen bij andere foetussen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel20
  - number: 20.2.b
    text: de bezwaren en risico’s voor de desbetreffende foetus en de zwangere vrouw minimaal zijn, en
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel20
  - number: 20.2.c
    text: het niet kan worden uitgesteld tot na de geboorte.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel20
  - number: '21.1'
    text: |-
      Het is verboden wetenschappelijk onderzoek met een foetus daaronder begrepen wetenschappelijk onderzoek met
      zwangerschapsondersteunende weefsels te verrichten zonder schriftelijke toestemming van de zwangere vrouw. Indien
      zij minderjarig is en de leeftijd van zestien jaar nog niet heeft bereikt, is mede schriftelijke toestemming
      vereist van degenen die het gezag over haar uitoefenen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      Indien de zwangere vrouw niet in staat is tot een redelijke waardering van haar belangen ter zake, kan de
      toestemming worden gegeven door degenen die het gezag over haar uitoefenen dan wel, indien zij meerderjarig is,
      door haar wettelijke vertegenwoordiger of, indien deze ontbreekt, door haar echtgenoot, geregistreerde partner of
      andere levensgezel.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: '21.3'
    text: |-
      Alvorens toestemming wordt gevraagd, draagt degene die het wetenschappelijk onderzoek uitvoert er zorg voor dat de
      personen van wie toestemming is vereist, schriftelijk worden ingelicht over:
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: 21.3.a
    text: het doel, de aard en de duur van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: 21.3.b
    text: de risico's die het onderzoek voor de gezondheid van de zwangere vrouw en de foetus met zich kan brengen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: 21.3.c
    text: |-
      de risico's die het tussentijds beëindigen van het onderzoek voor de gezondheid van de zwangere vrouw en de foetus
      met zich kan brengen en
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: 21.3.d
    text: de bezwaren die het onderzoek voor de zwangere vrouw en de foetus met zich kan brengen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: '21.4'
    text: |-
      Het [derde en vierde lid van artikel 17][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel17
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '17'
        paragraaf: '4'
  - number: '21.5'
    text: |-
      De zwangere vrouw dan wel, indien deze ingevolge dit artikel niet bevoegd is tot het geven van toestemming, degene
      die daartoe in haar plaats bevoegd is, kan de toestemming te allen tijde, zonder opgaaf van redenen, intrekken. Zij
      is ter zake van de intrekking geen schadevergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel21
  - number: '22.1'
    text: |-
      Indien het wetenschappelijk onderzoek een verloop neemt dat in noemenswaardige mate voor de zwangere vrouw of de
      foetus ongunstiger is dan in het onderzoeksprotocol is voorzien, doet degene die het onderzoek uitvoert, daarvan
      terstond mededeling aan degene die toestemming heeft gegeven, en aan de ingevolge [artikel 3][ref1] bevoegde
      commissie die als laatste haar oordeel heeft gegeven met een verzoek om een nader oordeel. Tot het tijdstip waarop
      een nader oordeel wordt gegeven, wordt de uitvoering van het onderzoek opgeschort, tenzij de gezondheid van de
      zwangere vrouw of van de foetus opschorting niet onmiddellijk toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel3
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '3'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Indien het nader oordeel negatief is, wordt de uitvoering van het onderzoek beëindigd, tenzij de gezondheid van de
      zwangere vrouw of van de foetus beëindiging niet onmiddellijk toelaat.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      Degene die het wetenschappelijk onderzoek uitvoert, doet onder opgave van de redenen aan de ingevolge
      [artikel 3][ref1] bevoegde commissie die als laatste haar oordeel heeft gegeven eveneens mededeling van de
      voortijdige beëindiging van een onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel3
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '3'
        paragraaf: '1'
  - number: '23'
    text: |-
      De [artikelen 13][ref1], [14][ref2] en [15][ref3] zijn van overeenkomstige toepassing op wetenschappelijk onderzoek
      met foetussen.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel15
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '14'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013797
        artikel: '15'
        paragraaf: '3'
  - number: '24'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.a
    text: |-
      een embryo speciaal tot stand te brengen en speciaal tot stand gebrachte embryo's te gebruiken voor
      wetenschappelijk onderzoek en andere doeleinden dan het tot stand brengen van een zwangerschap;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.b
    text: ;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.c
    text: |-
      geslachtscellen en andere embryo's dan bedoeld in onderdeel b te gebruiken voor andere doeleinden dan waarvoor zij
      ingevolge deze wet ter beschikking mogen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.d
    text: |-
      geslachtscellen en embryo's te gebruiken voor ingevolge deze wet toegelaten doeleinden zonder dat zij daarvoor ter
      beschikking zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.e
    text: een embryo buiten het menselijk lichaam zich langer dan veertien dagen te laten ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.f
    text: |-
      handelingen met geslachtscellen of embryo's te verrichten met het oogmerk van de geboorte van genetisch identieke
      menselijke individuen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.g
    text: |-
      het genetisch materiaal van de kern van menselijke kiembaancellen waarmee een zwangerschap tot stand zal worden
      gebracht, opzettelijk te wijzigen;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
  - number: 24.h
    text: |-
      uit een embryo in kweek gebrachte cellen te gebruiken voor andere doeleinden dan waarvoor zij op grond van
      [artikel 8, eerste lid, onder b][ref1], onderscheidenlijk [artikel 9, eerste lid, onder a][ref2], ter beschikking
      mogen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel9
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '9'
        paragraaf: '2'
  - number: '25'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel25
  - number: 25.a
    text: |-
      een menselijke en een dierlijke geslachtscel samen te brengen met het oog op het doen ontstaan van een meercellige
      hybride;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel25
  - number: 25.b
    text: |-
      een uit menselijke en dierlijke dan wel alleen menselijke embryonale cellen tot stand gebrachte chimère zich langer
      dan veertien dagen te laten ontwikkelen of in te brengen in een mens of een dier;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel25
  - number: 25.c
    text: een embryo in te brengen in een dier;
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel25
  - number: 25.d
    text: een dierlijk embryo in te brengen in een mens.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel25
  - number: '26.1'
    text: |-
      Het is verboden handelingen met geslachtscellen of embryo's te verrichten met het oogmerk het geslacht van een
      toekomstig kind te kunnen kiezen.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel26
  - number: '26.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing indien naar wetenschappelijk verantwoord medisch
      inzicht het risico bestaat op een ernstige geslachtsgebonden erfelijke aandoening bij het kind en de handelingen
      plaatsvinden ter voorkoming daarvan. Het verbod, bedoeld in het eerste lid, is ook niet van toepassing indien
      naar wetenschappelijk verantwoord medisch inzicht het risico bestaat op een ernstige erfelijke aandoening met een
      ongelijke geslachtsincidentie bij het kind en de handelingen plaatsvinden ter verkleining van dat risico.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel26
  - number: '26.3'
    text: Het is verboden diensten aan te bieden bestaande uit handelingen, verboden in dit artikel.
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel26
  - number: '27'
    text: |-
      Het is verboden voor de verstrekking aan anderen van geslachtscellen en embryo's die op grond van de
      [artikelen 5][ref1], [8][ref2] en [9 van deze wet][ref3] ter beschikking zijn gesteld, een vergoeding te vragen
      die meer bedraagt dan de kosten die een rechtstreeks gevolg zijn van de handelingen die met de geslachtscellen of
      embryo's zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel9
    url: https://wetten.overheid.nl/BWBR0013797/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013797
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013797
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013797
        artikel: '9'
        paragraaf: '2'
  - number: '28.1'
    text: |-
      Met een gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die al
      dan niet opzettelijk handelt in strijd met een verbod, vervat in de [artikelen 12][ref1], [17, eerste lid][ref2],
      [21, eerste lid][ref3], [24][ref4], [25][ref5], [26][ref6] of [27][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013797#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0013797#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0013797#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0013797#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0013797#Artikel26
