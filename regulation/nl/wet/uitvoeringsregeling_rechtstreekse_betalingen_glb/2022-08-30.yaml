      1 De steun bedraagt € 153 per rund, respectievelijk € 23 per schaap, dat op het bedrijf is gehouden in de periode
      van 15 mei tot en met 15 oktober van het jaar van de steunaanvraag, en dat voldoet aan de voorwaarden gesteld in
      [artikel 2.22][ref1], respectievelijk [artikel 2.23][ref2].

      2 Het aantal op het bedrijf gehouden dieren, bedoeld in het eerste lid, wordt berekend als A gedeeld door B waarbij
      A staat voor de som van het aantal dagen dat de runderen, respectievelijk de schapen, voldoen aan de voorwaarden,
      bedoeld in [artikel 2.22][ref3] respectievelijk [2.23][ref4], en B het getal 154 is.


