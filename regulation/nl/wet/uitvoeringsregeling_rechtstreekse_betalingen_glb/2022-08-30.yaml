  - number: '2.16'
    text: |-
      1 De minister verplicht in de situatie, bedoeld in artikel 45, derde lid, van Verordening (EU) nr. 1307/2013, de
      landbouwer die beschikt over land dat van blijvend grasland is omgezet in land voor andere vormen van grondgebruik
      overeenkomstig artikel 44, tweede en derde lid, van Verordening (EU) nr. 639/2014 tot het omzetten van land in
      blijvend grasland.

      2 De verplichting, bedoeld in het eerste lid, wordt opgelegd aan de landbouwer die het perceel in gebruik heeft dat
      blijkens een verzamelaanvraag is omgezet van blijvend grasland in land voor andere vormen van grondgebruik in het
      jaar waarin de situatie, bedoeld in artikel 45, derde lid, van Verordening (EU) nr. 1307/2013 zich voordoet.

      3 De minister stelt de betrokken landbouwer in kennis van de oppervlakte waarop deze verplichting betrekking heeft.

      4 De landbouwer die de verplichting uit het eerste lid krijgt opgelegd, zet de vereiste oppervlakte om in blijvend
      grasland voor het moment van indienen van de eerstvolgende verzamelaanvraag en overeenkomstig de voorwaarden die in
      de kennisgeving, bedoeld in het derde lid, zijn geformuleerd.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.16
  - number: '2.17'
    text: |-
      1 Als ecologisch aandachtsgebied als bedoeld in artikel 46, eerste en tweede lid, van Verordening (EU)
      nr. 1307/2013 wordt beschouwd:

      a. bufferstroken en akkerranden als bedoeld in artikel 45, vijfde lid, van Verordening (EU) nr. 639/2014, van
      minimaal 1 meter breed die zijn gelegen op of direct grenzend aan bouwland en waarop geen landbouwproductie
      plaatsvindt als bedoeld in artikel 45, lid 10bis, van Verordening (EU) nr. 639/2014;

      b. areaal bebouwd met hakhout met korte omlooptijd van boomsoorten behorende tot het geslacht wilg (*Salix*)
      met een maximale omlooptijd van vijf jaar, waarop, overeenkomstig artikel 45, achtste lid, van Verordening (EU)
      nr. 639/2014, geen gewasbeschermingsmiddelen en meststoffen worden toegepast;

      c. areaal waarop in de teeltperiode van 15 mei tot 15 juli een gewas van de soorten esparcette (*Onobrychis
      viciifolia*), lupine (*Lupinus species*), luzerne (*Medicago sativa*), rode klaver (*Trifolium pratense*),
      rolklaver (*Lotus corniculatus*), soja (*Glycine Willd*), veldboon (*Vicia faba*) of voederwikke (*Vicia sativa
      subspecies sativa*) wordt geteeld, uitgezonderd het areaal waarop artikel 45, tiende lid, tweede alinea, van
      Verordening (EU) nr. 639/2014 van toepassing is;

      d. areaal, anders dan het areaal waarop artikel 45, negende lid, tweede alinea, van Verordening (EU) nr. 639/2014
      van toepassing is, waarop combinaties van vanggewassen worden geteeld als bedoeld in bijlage 2, onder de
      voorwaarden die per categorie voor de desbetreffende soorten in deze bijlage zijn vermeld;

      e. heggen, houtwallen of bomen in rij als bedoeld in artikel 45, vierde lid, onderdeel a, van Verordening (EU)
      nr. 639/2014;

      f. geïsoleerde bomen als bedoeld in artikel 45, vierde lid, onderdeel b, van Verordening (EU) nr. 639/2014;

      g. stroken subsidiabele hectaren langs bosranden als bedoeld in artikel 46, tweede lid, onderdeel f, van
      Verordening (EU) nr. 1307/2013, van minimaal 1 meter breed waarop geen landbouwproductie plaatsvindt als bedoeld in
      artikel 45, lid 10bis, van Verordening (EU) nr. 639/2014;

      h. boomgroepen in het veld als bedoeld in artikel 45, vierde lid, onderdeel c, van Verordening (EU) nr. 639/2014;

      i. vijvers als bedoeld in artikel 45, vierde lid, onderdeel d, van Verordening (EU) nr. 639/2014;

      j. areaal waarop Olifantsgras (*Miscanthus)* wordt geteeld zonder de toepassing van minerale meststoffen en waarop
      na het eerste jaar waarin wordt aangeplant geen gewasbeschermingsmiddelen worden toegepast;

      k. areaal waarop Zonnekroon *(Silphium perfoliatum)* wordt geteeld zonder de toepassing van minerale meststoffen en
      waarop na het eerste jaar waarin wordt aangeplant geen gewasbeschermingsmiddelen worden toegepast;

      l. braakliggend land waarop, in de periode van 15 maart tot en met 15 november, gedurende 6 maanden, een mengsel
      van tenminste 3 drachtplanten van de soorten *Karwij (Carum carvi), Koriander (Coriandrum sativum) Wilde Peen
      (, Daucus carota), Duizendblad (Achiella millefolium), Goudsbloem (Calendula officinalis), Korenbloem (Centaurea
      cyanus), Cichorei (Cichorium), Zonnebloem (Helianthus Annus), Komkommerkruid (Borago officinalis), Slangenkruid
      (Echium Vulgare), Phacelia (Phacelia tanacetifolia), Gele Mosterd (Sinapis alba), Gewone Rolklaver (Lotus
      corniculatus),Luzerne (Medicago sativa), Witte honingklaver (melilotus albus), Esparcette (Onobrychis viccifolia),
      Rode klaver (Trifolium pratense), Voederwikke (Vicia sativa), Lijnzaad/vlas (Linum usitatissimum), Malva (Malva),
      Klaproos (Papaver), Boekweit (Fagopyrum esculentum), Juffertje in ’t groen (Nigella damascena), Smalle Weegbree
      (Plantago lanceolata)* of Incarnaatklaver *(Trifolium incarnatum)* wordt geteeld zonder de toepassing van
      meststoffen.

      2 Ten aanzien van het ecologische aandachtsgebied, bedoeld in het eerste lid, onderdelen b, c, d, e, f, h, i, j, k
      en l, worden de wegingsfactoren van bijlage X van Verordening (EU) nr. 1307/2013 gebruikt bij de berekening van het
      aantal hectares.

      3 Ten aanzien van het ecologische aandachtsgebied, bedoeld in het eerste lid, onderdeel c:

      a. bewaart de landbouwer aankoopbewijzen en etiketten van het gebruikte zaaizaadmengsel gedurende 5 jaar in zijn
      administratie;

      b. kan de landbouwer aantonen dat ten minste één van de voorgeschreven stikstofbindende gewassen in het mengsel
      overheerst;

      c. is het gebruik van gewasbeschermingsmiddelen niet toegestaan;

      d. vindt nateelt plaats van de vanggewassen, bedoeld in [bijlage 2][ref1], categorie 1, onder de voorwaarde dat de
      nateelt ten minste in de periode van 1 november in het jaar van aanvraag tot 1 maart in het jaar na de aanvraag op
      het perceel aanwezig is indien:

      1. de teelt van de stikstofbindende gewassen, bedoeld in het eerste lid, onderdeel c, wordt beëindigd voor
      1 oktober van het jaar van aanvraag, en

      2. de teelt plaatsvindt op zand- of lössgronden, als vastgesteld in [bijlage 1 bij het Uitvoeringsbesluit
      Meststoffenwet](onbekend).

      4 In afwijking van het eerste lid, aanhef en onderdeel d, wordt areaal waarop na de teelt van maïs de verplichting,
      bedoeld in [artikel 8a van het Besluit gebruik meststoffen][ref2], van toepassing is niet aangemerkt als ecologisch
      aandachtsgebied.

      5 Ten aanzien van het ecologische aandachtsgebied, bedoeld in het eerste lid, onderdelen e en f worden de
      omzettingsfactoren van bijlage X van Verordening (EU) nr. 1307/2013 gebruikt bij de berekening van het aantal
      hectares.

      6 Het in het eerste lid, onderdelen a, e, f, h en i bedoelde areaal of element wordt beschouwd als grenzend aan
      bouwland indien de grensbuffer:

      a. tussen het bouwland en het areaal of element ten hoogste 5 meter breed is;

      b. ter beschikking staat van de landbouwer, en

      c. bestaat uit natuurlijke vegetaties, een kavelpad of een watergang.

      7 In afwijking van artikel 45, vijfde lid, van Verordening (EU) nr. 639/2014 wordt een akkerrand in stand gehouden
      van 1 januari tot ten minste 1 september indien er sprake is van de teelt van een opvolgend wintergewas.

      8 In afwijking van het eerste lid, onderdelen a en g, kunnen bufferstroken, akkerranden en stroken subsidiabele
      hectaren langs bosranden worden gemaaid, onder de voorwaarde dat het maaisel blijft liggen.

      9 Op areaal waarop in de teeltperiode van 15 mei tot 15 juli het gewas soja, bedoeld in het eerste lid, onderdeel
      c, wordt geteeld, is het gebruik van stikstof, als bedoeld in [artikel 1, onderdeel j, van de Meststoffenwet][ref3]
      niet toegestaan.

      10 De grensbuffer, bedoeld in het zesde lid, is van toepassing op arealen en elementen die grenzen aan een
      ecologisch aandachtsgebied dat rechtstreeks grenst aan het bouwland van het bedrijf als bedoeld in artikel 45, lid
      5 bis, van Verordening (EU) nr. 639/2014.

      11 Ten aanzien van het ecologische aandachtsgebied, bedoeld in het eerste lid, onderdeel l:

      a. is het toegestaan een mengsel van drachtplanten te mengen met roodzwenkgras (*Festuca rubra*), rietzwenkgras
      (*Festuca arundinacea*), veldbeemgras (*Poa pratensis*), Japanse haver (*Avena strigosa*), Dille (*Anethum
      graveolens*), Pastinaak (*Pastinaca sativa*), Gele ganzenbloem (*Glebionis segetum*), Kleine zonnebloem
      (*Helianthus Decapetalus*), Margriet (*Leucanthemum vulgare*), Echte kamille (*Matricaria chamomilla*),
      Barbarakruid (*Barbarea vulgaris*), Bladrammenas (*Raphanus sativus*), Bolderik (*Agrostemma githago*), Lupine
      (*Lupinus angusttifolius*), Serradella (*Ornithopus sativus*), Kleine klaver (*Trifolium dubium*), Alexandrijnse
      klaver (*Trifolium resupinatum*), Erwt (*Pisum sativum*), Hennepnetel (*Galeopsis tetrahit*), Veldzuring (*Rumex
      acetosa*), Wilde ridderspoor (*Consolida regalis*) of Timothee (*Phleum pratense*), onder de voorwaarde dat de
      drachtplanten aantoonbaar in het mengsel overheersen;

      b. draagt de landbouwer zorg voor een bloeiperiode van mei tot en met augustus;

      c. draagt de landbouwer zorg voor een zichtbare bedekking waarbij de drachtplanten overheersen;

      d. meldt de landbouwer de datum van inzaai uiterlijk op de dag van inzaai bij de minister door middel van een
      daartoe door de minister beschikbaar gesteld middel;

      e. meldt de landbouwer, indien sprake is van een meerjarige inzet, de startdatum van de instandhoudingsperiode van
      6 maanden uiterlijk op de eerste dag van deze periode bij de minister door middel van een daartoe door de minister
      beschikbaar gesteld middel;

      f. bewaart de landbouwer aankoopbewijzen en etiketten van het gebruikte zaaizaad(mengsel) gedurende 5 jaar in zijn
      administratie.


