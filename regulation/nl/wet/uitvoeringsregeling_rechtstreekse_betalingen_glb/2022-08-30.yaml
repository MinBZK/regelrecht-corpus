  - number: '4.2'
    text: |-
      1 De landbouwer die aanspraak maakt op rechtstreekse betalingen als bedoeld in [artikel 2.1, tweede lid][ref1],
      maakt voor de aanvraag van betalingsrechten alsmede de activering van betalingsrechten en de aanvraag van
      betalingen gebruik van de verzamelaanvraag.

      2 De verzamelaanvraag wordt volledig en naar waarheid door de landbouwer ingevuld, ondertekend en gedagtekend met
      gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 Behoudens de toepassing van artikel 12, eerste alinea, van Verordening (EU) nr. 640/2014 wordt de
      verzamelaanvraag in de periode van 1 maart tot en met 15 mei ingediend bij de minister.

      4 Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die de minister nodig acht voor de beoordeling
      van de aanvraag.

      5 De landbouwer die aanspraak maakt op de steun, bedoeld in [artikel 2.1][ref2], tweede
      lid, onderdeel d, verleent de minister toestemming om de gegevens die over zijn bedrijf
      zijn opgenomen in de I&R-systemen, bedoeld in [artikel 14, onderdeel a][ref3], en
      [artikel 34, onderdeel a, van de Regeling identificatie en registratie van dieren][ref4], te verwerken ten behoeve
      van de controle op de naleving van deze regeling.

      6 In afwijking van het derde lid wordt de verzamelaanvraag in het kalenderjaar 2015 bij de minister ingediend in de
      periode van 1 april tot en met 15 juni.

      7 De landbouwer die vanggewassen inzet als ecologisch aandachtsgebied kan de inhoud van de verzamelaanvraag,
      onderdeel Regelingen grondgebonden, ingevolge artikel 14, vierde lid, van Verordening (EU) nr. 809/2014 tot
      16 oktober wijzigen wat het gebruik van landbouwpercelen betreft met gebruikmaking van een middel dat door de
      minister beschikbaar wordt gesteld.

      8 De minister beslist op de aanvraag, bedoeld in het eerste lid, uiterlijk op 30 juni van het jaar volgend op het
      jaar waarin de aanvraag is ingediend.

      9 De landbouwer die hennep als vanggewas teelt stuurt de minister de etiketten van het gebruikte zaaizaad uiterlijk
      op 1 september van het jaar van aanvraag toe met gebruikmaking van een middel dat door de minister beschikbaar
      wordt gesteld.

      10 De uiterste datum, bedoeld in artikel 15, lid 2 ter, van Verordening (EU) nr. 809/2014, waarop de landbouwer
      wijzigingen kan aanbrengen in het gebruik van zijn landbouwpercelen met gebruikmaking van een middel dat door de
      minister ter beschikking is gesteld, is 15 oktober.


