      1 Een landbouwer die een aanvraag heeft ingediend voor rechtstreekse betalingen als bedoeld in
      [artikel 2.1, tweede lid][ref1], neemt de volgende bepalingen in acht:

      a. de beheerseisen, bedoeld in artikel 93, eerste lid, van Verordening (EU) nr. 1306/2013, opgenomen in
      [bijlage 3][ref2], en

      b. de normen voor het in goede landbouw- en milieuconditie houden van landbouwareaal, bedoeld in artikel 93, eerste
      lid, van Verordening (EU) nr. 1306/2013, opgenomen in [bijlage 4][ref3].

      2 De Nederlandse Voedsel- en Warenautoriteit is de coördinerende autoriteit, bedoeld in artikel 65, van Verordening
      (EU) nr. 809/2014.

      3 De Nederlandse Voedsel- en Warenautoriteit is een specifieke dienst als bedoeld in artikel 85 van Verordening
      (EU) nr. 1306/2013.


