  - number: '2.18'
    text: |-
      1 Landbouwers op wie de verplichting, bedoeld in artikel 46, eerste lid, van Verordening (EU) nr. 1307/2013 rust,
      kunnen deelnemen aan een collectieve tenuitvoerlegging van deze verplichting, onder de voorwaarden, bedoeld in
      artikel 46, zesde lid, van Verordening (EU) nr. 1307/2013, en in artikel 47, eerste lid, onderdeel b, en vierde
      lid, van Verordening (EU) nr. 639/2014.

      2 Het aantal kilometers, bedoeld in artikel 47, eerste lid, onderdeel b, van Verordening (EU) nr. 639/2014,
      bedraagt 15.

      3 Eén van de landbouwers die deelnemen aan een collectieve tenuitvoerlegging van de verplichting van het beheer van
      ecologisch aandachtsgebied, bedoeld in het eerste lid, meldt de collectieve tenuitvoerlegging uiterlijk 31 maart
      van het jaar van de aanvraag aan de minister onder vermelding van de gegevens, bedoeld in artikel 18, tweede
      alinea, aanhef en onderdelen a tot en met d, en vierde alinea, van Verordening (EU) nr. 809/2014, met gebruikmaking
      van een middel dat door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.18
  - number: '2.19'
    text: |-
      1 De gelijkwaardige praktijken, bedoeld in artikel 43, derde lid, van Verordening (EU) nr. 1307/2013, waaraan
      landbouwers kunnen deelnemen, zijn de certificeringsregelingen, bedoeld in het tweede lid.

      2 De minister maakt de certificeringsregelingen die in overeenstemming zijn met artikel 43, derde lid, aanhef en
      onderdeel b, van Verordening (EU) nr. 1307/2013 alsmede beantwoorden aan artikel 43, zevende lid, tweede volzin,
      van Verordening (EU) nr. 1307/2013 bekend.

      3 RVO.nl is de openbare certificeringsinstantie, bedoeld in artikel 38, eerste lid, van Verordening (EU)
      nr. 639/2014.

      4 De minister wijst op aanvraag een particuliere certificeringsinstantie als bedoeld in artikel 38, eerste lid,
      van Verordening (EU) nr. 639/2014, aan indien die instantie voldoet aan artikel 38, tweede lid, van Verordening
      (EU) nr. 639/2014.

      5 De particuliere certificeringsinstanties verstrekken de gegevens, bedoeld in artikel 38, tweede lid, van
      Verordening (EU) nr. 639/2014, die noodzakelijk zijn voor de beoordeling van de aanvraag tot aanwijzing.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.19
  - number: '2.20'
    text: |-
      1 De certificeringsinstantie verstrekt een certificaat aan landbouwers die deelnemen aan de certificeringsregeling,
      bedoeld in [artikel 2.19, eerste lid][ref1].

      2 De certificeringsinstantie controleert jaarlijks of de landbouwer voldoet aan de certificeringsregeling.

      3 Indien blijkt dat de landbouwer niet of niet volledig voldoet aan de certificeringsregeling:

      a. stelt de certificeringsinstantie de desbetreffende landbouwer en de minister hiervan binnen vier weken na de
      constatering van de niet-naleving in kennis, en

      b. kan de certificeringsinstantie besluiten geen certificaat af te geven aan de landbouwer voor het jaar waarop de
      niet-naleving betrekking heeft.

      4 De minister kan de aanwijzing van een certificeringsinstantie als bedoeld in [artikel 2.19, vierde lid][ref2],
      intrekken indien de certificeringsinstantie niet voldoet aan de verplichtingen, bedoeld in het eerste tot en met
      derde lid. De intrekking, alsmede de gevolgen van de intrekking voor de aan de certificeringsregeling deelnemende
      landbouwers, worden bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel2.19
