  - number: '2.4'
    text: |-
      Geen rechtstreekse betalingen worden toegekend aan de landbouwer indien het totaalbedrag van de voor een
      kalenderjaar aangevraagde of toe te kennen rechtstreekse betalingen, voordat de sancties of verlagingen, bedoeld
      in artikel 63, eerste en tweede lid, en artikel 91, eerste lid, van Verordening (EU) nr. 1306/2013 zijn toegepast,
      lager is dan € 500.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.4
  - number: '2.5'
    text: |-
      De verlaging, bedoeld in artikel 11, eerste lid, van Verordening (EU) nr. 1307/2013 bedraagt 5% en vindt plaats
      zonder de toepassing van het tweede en vijfde lid van dat artikel.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.5
  - number: '2.6'
    text: |-
      1 Onverminderd artikel 24, eerste lid, aanhef en onderdelen a en b, van Verordening (EU) nr. 1307/2013 worden op
      aanvraag tevens betalingsrechten toegekend aan landbouwers die:

      a. overeenkomstig artikel 24, eerste lid, derde alinea, aanhef en onderdeel a, van Verordening (EU) nr. 1307/2013
      en blijkens de landbouwtelling, bedoeld in [artikel 24 van de Landbouwwet][ref1], van het jaar 2013 op ten
      minste 0,3 hectare landbouwareaal de gewassen, bedoeld in artikel 24, eerste lid, derde alinea, onderdeel a, van
      Verordening (EU) nr. 1307/2013 hebben geteeld, en

      b. overeenkomstig artikel 24, eerste lid, derde alinea, aanhef en onderdeel c, van Verordening (EU) nr. 1307/2013
      nooit hebben beschikt over betalingsrechten en in het jaar 2013 aantoonbaar ten genoegen van de minister
      landbouwproducten hebben geproduceerd, gefokt, of geteeld, inclusief door het oogsten, het melken en het houden van
      dieren voor landbouwdoeleinden.

      2 De datum, bedoeld in artikel 24, tweede lid, van Verordening (EU) nr. 1307/2013, is 15 mei 2015.

      3 Overeenkomstig artikel 24, zevende lid, Verordening (EU) nr. 1307/2013 worden voor bouwland dat zich bevindt
      onder een permanente kas geen betalingsrechten toegewezen.

      4 De minimumgrootte van het bedrijf waarvoor een landbouwer een aanvraag tot toewijzing van betalingsrechten kan
      indienen, bedoeld in artikel 24, negende lid, van Verordening (EU) nr. 1307/2013 is 0,3 subsidiabele hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
  - number: '2.7'
    text: |-
      1 Landbouwers kunnen met inachtneming van het tweede lid bij verkoop of verhuur van een landbouwbedrijf of een
      deel ervan bepalen dat de toe te wijzen betalingsrechten, overeenkomstig artikel 20, respectievelijk artikel 21 van
      Verordening (EU) nr. 639/2014 worden overgedragen aan de koper respectievelijk de huurder van het desbetreffende
      landbouwbedrijf of het desbetreffende deel ervan.

      2 De grootte van het landbouwbedrijf of het deel ervan, bedoeld in het eerste lid, bedraagt ten minste 0,3
      subsidiabele hectare.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.7
  - number: '2.8'
    text: |-
      De minister stelt de waarde van de betalingsrechten die aan een landbouwer worden toegewezen vast op basis van de
      berekening overeenkomstig artikel 25, tweede lid, en artikel 26, derde lid, van Verordening (EU) nr. 1307/2013 en
      met toepassing van een verhoging van 3% als bedoeld in artikel 22, tweede lid, van Verordening (EU) nr. 1307/2013.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.8
  - number: '2.9'
    text: |-
      1 Het percentage, bedoeld in artikel 30, eerste en derde lid, van Verordening (EU) nr. 1307/2013 bedraagt 6%.

      2 Onverminderd artikel 30, zesde en negende lid, van Verordening (EU) nr. 1307/2013 wijst de minister op aanvraag
      tevens betalingsrechten toe uit de nationale reserve aan de landbouwer:

      a. ten aanzien van aanvragen gedaan vanaf 2016, voor wat betreft het areaal dat in 2015 in verband met openbare
      werken of de aanleg van nutsvoorzieningen niet als subsidiabele hectare als bedoeld in artikel 32, tweede lid, van
      Verordening (EU) nr. 1307/2013 kan worden aangemerkt,

      b. aan wie geen betalingsrechten konden worden toegewezen ten gevolge van overmacht of uitzonderlijke
      omstandigheden als bedoeld in artikel 2, tweede lid, van Verordening (EU) nr. 1306/2013,

      c. ten aanzien van aanvragen gedaan vanaf 2016 voor wat betreft areaal dat tijdelijk uit productie is genomen
      in het kader van een overeenkomst als bedoeld in Verordening (EEG) nr. 1272/1988 en waarvoor niet eerder
      betalingsrechten zijn toegewezen, of

      d. ten aanzien van aanvragen gedaan in 2018 voor wat betreft areaal waarvoor in 2015, 2016
      of 2017 geen betalingsrechten zijn toegekend omdat het areaal was uitgesloten op grond van
      [artikel 2.10, tweede lid, onderdeel a][ref1], zoals dat artikel luidde tot 1 januari 2018, en dat alsnog als
      subsidiabele hectare, bedoeld in artikel 32, tweede lid, onderdeel a, van Verordening (EU) nr. 1307/2013, kan
      worden aangemerkt, mits de landbouwer aantoont dat dit areaal in werkelijkheid als landbouwgrond wordt gebruikt.

      3 Bij de toepassing van artikel 30, zesde en negende lid, van Verordening (EU) nr. 1307/2013 en het tweede lid
      worden nieuwe betalingsrechten toegewezen.

      4 De overeenkomst, bedoeld in het tweede lid, onderdeel c, is na 31 december 2012 beëindigd.

      5 Geen betalingsrechten uit de nationale reserve worden toegekend aan de landbouwer indien de aanspraak op
      betalingsrechten uit de nationale reserve gebaseerd is op minder dan 0,3 subsidiabele hectare landbouwareaal.

      6 De waarde van de aan de landbouwer toe te wijzen betalingsrechten wordt voor de toepassing van het tweede lid,
      onderdeel d, vastgesteld op de nationale gemiddelde waarde van de betalingsrechten in het jaar van toewijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel2.10
