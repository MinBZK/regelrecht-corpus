      1 Het maximumbedrag dat is bestemd voor de gekoppelde steun, bedoeld in artikel 52, zesde lid, van Verordening (EU)
      nr. 1307/2013 bedraagt voor runderen € 2.297.143 en voor schapen € 1.052.857.

      2 Indien het maximumbedrag voor runderen, respectievelijk schapen, bedoeld in het eerste lid, dreigt te worden
      overschreden, wordt overeenkomstig artikel 53, tweede lid, van Verordening (EU) nr. 639/2014, per landbouwer het
      aantal gehouden runderen, respectievelijk schapen, verminderd met een door de minister vast te stellen percentage.

      3 De minister maakt het percentage, bedoeld in het tweede lid, bekend.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.25
  - number: '2.27'
    text: |-
      1 Voor de toepassing van artikel 30 van [Verordening (EU) nr. 640/2014](32014R0640) wordt een rund, respectievelijk
      een schaap, waarvoor steun is aangevraagd voor de hele periode, bedoeld in [artikel 2.24, eerste lid][ref1],
      als niet geconstateerd aangemerkt indien het rund of het schaap niet juist is geregistreerd in het I&R-systeem,
      overeenkomstig artikel 102, eerste lid, van [Verordening (EU) nr. 2016/429](32329R2016) van het Europees parlement
      en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde
      handelingen op het gebied van diergezondheid (‘diergezondheidswetgeving’) (Pb EU 2016, L 84).

      2 Voor de toepassing van artikel 30, eerste lid, van Verordening (EU) nr. 640/2014 wordt een rund, respectievelijk
      een schaap, waarvoor steun is aangevraagd als geconstateerd aangemerkt als het voldoet aan alle voorwaarden in
      [artikel 2.22][ref2], respectievelijk [artikel 2.23][ref3].

      3 Voor niet geconstateerde dieren worden, in geval bij een controle ter plaatse bij een of meer dieren een
      afwijking is geconstateerd terwijl het betrokken dier of de betrokken dieren nog op het bedrijf aanwezig zijn, voor
      de berekening van het aantal dagen dat een dier als niet geconstateerd moet worden beschouwd, het betrokken dier of
      de betrokken dieren geacht tot en met 15 oktober van het aanvraagjaar op het bedrijf aanwezig te zijn.


