      1 De minister past het vroegtijdig waarschuwingssysteem, bedoeld in artikel 99, tweede lid, tweede en derde
      alinea van Verordening (EU) nr. 1306/2013 toe op gevallen van niet-naleving van de bepalingen, bedoeld in
      [artikel 3.1][ref1].

      2 Als vastgestelde termijn, bedoeld in artikel 39, derde lid, eerste alinea, van Verordening (EU) 640/2014, geldt
      voor een niet-naleving die betrekking heeft op oormerkverlies bij runderen, schapen of geiten een termijn van 10
      werkdagen na de controle ter plaatse waarbij betrokkene mededeling is gedaan van de desbetreffende niet-naleving.


