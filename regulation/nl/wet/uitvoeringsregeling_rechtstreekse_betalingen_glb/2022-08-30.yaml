      a. verklaart in de verzamelaanvraag, bedoeld in [artikel 4.2][ref2], dat hij voldoet aan de vereisten, bedoeld in
      artikel 50, tweede lid, onderdelen a en b, van Verordening (EU) nr. 1307/2013 respectievelijk artikel 49, eerste
