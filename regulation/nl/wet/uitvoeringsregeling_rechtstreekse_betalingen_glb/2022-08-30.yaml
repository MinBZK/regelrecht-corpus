  - number: '2.13'
    text: |-
      De betaling voor de klimaat- en milieuvriendelijke landbouwpraktijken geschiedt overeenkomstig artikel 43, negende
      lid, derde alinea, van Verordening (EU) nr. 1307/2013.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.13
  - number: '2.14'
    text: |-
      1 De voor de gewasdiversificatie in aanmerking te nemen teeltperiode, bedoeld in artikel 40, eerste lid, van
      Verordening (EU) nr. 639/2014 is 15 mei tot en met 15 juli.

      2 In afwijking van het eerste lid is voor wat betreft aardappelen geteeld met het oog op de bestrijding van aaltjes
      (*nematoden*) dan wel vroeg te oogsten consumptieaardappelen de desbetreffende teeltperiode 15 mei tot en met
      15 juni.

      3 Alle mengsels van zaden worden overeenkomstig artikel 40, derde lid, van Verordening (EU) nr. 639/2014 beschouwd
      als één gewas.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.14
  - number: '2.15'
    text: |-
      1 Als blijvend grasland dat ecologisch kwetsbaar is als bedoeld in artikel 45, eerste lid, van Verordening (EU) nr.
      1307/2013 wordt aangemerkt:

      a. blijvend grasland gelegen in gebieden die op grond van
      [artikel 2.1, eerste lid, van de Wet natuurbescherming][ref1] zijn aangewezen;

      b. door de minister aangewezen hectares blijvend grasland gelegen buiten gebieden die op grond van
      [artikel 2.1, eerste lid, van de Wet natuurbescherming][ref2] zijn aangewezen, met inachtneming van de criteria,
      genoemd in artikel 41 van Verordening (EU) nr. 639/2014.

      2 Op blijvend grasland als bedoeld in het eerste lid wordt uitsluitend een lichte grondbewerking toegestaan.

      3 De minister kan op schriftelijk verzoek van Gedeputeerde Staten van een provincie de aanwijzing als ecologisch
      kwetsbaar blijvend grasland als bedoeld in het eerste lid, onderdeel a, opheffen op voorwaarde dat het verzoek
      vergezeld gaat van:

      a. hetzij een ecologische beoordeling waaruit blijkt dat op voorhand is verzekerd dat het opheffen niet zal leiden
      tot significante gevolgen voor de instandhoudingsdoelstellingen van het betrokken Natura 2000-gebied, hetzij een
      passende beoordeling als bedoeld in artikel 6, derde lid, van [Richtlijn 92/43/EEG](31992L0043) van de Raad van
      21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG 1992, L 206)
      waaruit blijkt dat opheffing de natuurlijke kenmerken van het betrokken gebied niet zal aantasten, en

      b. een uitgewerkt en onderbouwd voorstel voor het aanwijzen van evenveel hectares ecologisch kwetsbaar blijvend
      grasland op grond van het eerste lid, onderdeel b.

      4 De berekening van het aandeel blijvend grasland vindt plaats met toepassing van artikel 43, tweede lid, van
      [Verordening (EG) nr. 639/2014](32014R0639).


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.1
