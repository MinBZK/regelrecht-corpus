  - number: '2.11'
    text: |-
      1 De datum, bedoeld in artikel 33, eerste lid, van Verordening (EU) nr. 1307/2013, is 15 mei van het jaar waarin de
      betaling wordt aangevraagd.

      2 Het is de landbouwer toegestaan de aangifte, bedoeld in artikel 33, eerste lid, van Verordening (EU) nr.
      1307/2013 uiterlijk 31 mei van het jaar waarin de betaling wordt aangevraagd te wijzigen met inachtneming van de
      eisen, bedoeld in artikel 33, tweede lid, van Verordening (EU) nr. 1307/2013.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.11
  - number: '2.12'
    text: |-
      1 De aanspraak op betaling in enig jaar van aanvraag op basis van een overdracht van betalingsrechten als
      bedoeld in artikel 34 van Verordening (EU) nr. 1307/2013, kan slechts worden gemaakt indien de landbouwer
      die de betalingsrechten heeft overgedragen de minister uiterlijk op de uiterste datum van indiening van de
      verzamelaanvraag, bedoeld in [artikel 4.2, derde lid][ref1], in het desbetreffende jaar van aanvraag met
      gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld in kennis heeft gesteld van de
      overdracht.

      2 De kennisgeving, bedoeld in het eerste lid, wordt volledig en naar waarheid door de landbouwer ingevuld,
      ondertekend en gedagtekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel4.2
