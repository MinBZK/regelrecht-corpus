  - number: '2.21'
    text: |-
      1 De minister stelt elk jaar het bedrag van de betaling voor jonge landbouwers vast volgens de berekening van
      artikel 50, achtste lid, van Verordening (EU) nr. 1307/2013.

      2 Het maximum aantal betalingsrechten dat de landbouwer kan activeren voor de betaling, bedoeld in het eerste lid,
      bedraagt 90.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.21
  - number: '2.22'
    text: |-
      1 Een landbouwer ontvangt op aanvraag vrijwillige gekoppelde steun inzake graasdierhouderij voor runderen.

      2 De steun, bedoeld in het eerste lid, wordt verstrekt voor elk vrouwelijk rund waarvoor steun is aangevraagd dat
      op 15 mei van het jaar van aanvraag aanwezig is op het bedrijf van de aanvrager.

      3 De steun wordt alleen verstrekt indien het rund vanaf 15 mei tot en met 15 oktober van het jaar van aanvraag of,
      als het dier eerder van het bedrijf van de aanvrager wordt afgevoerd tot de datum van afvoer van het bedrijf van de
      aanvrager, ononderbroken aanwezig is op niet subsidiabele grond ten behoeve van extensieve begrazing.

      4 Een rund wordt voor steun in aanmerking genomen voor elke dag dat het in de periode van 15 mei tot en met
      15 oktober van het jaar van aanvraag aanwezig is op het bedrijf van de aanvrager, maar niet eerder dan vanaf het
      moment dat het:

      a. 12 maanden onafgebroken in Nederland is, en

      b. ouder is dan 24 maanden.

      5 De eisen inzake identificatie en registratie van runderen waarin Verordening (EG) nr. 1760/2000 voorziet, worden
      door de landbouwer in acht genomen.

      6 Het voldoen aan de voorwaarden in het tweede en vierde lid, wordt beoordeeld op basis van het I&R-systeem rund,
      bedoeld in [artikel 14, onderdeel a, van de Regeling identificatie en registratie van dieren][ref1].

      7 De datum, bedoeld in artikel 53, vierde lid, onderdeel b, van Verordening (EU) nr. 639/2014, is 15 mei van het
      jaar van aanvraag.

      8 De aanwezigheid van een rund op niet subsidiabele grond, bedoeld in het derde lid, wordt ten genoegen van de
      minister aangetoond door middel van voldoende schriftelijk bewijs, waaruit blijkt welke percelen worden begraasd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel14
