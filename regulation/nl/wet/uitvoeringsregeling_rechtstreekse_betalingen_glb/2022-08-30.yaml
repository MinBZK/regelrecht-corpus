  - number: '1.2'
    text: |-
      Deze regeling strekt tot uitvoering van Verordening (EU) nr. 1307/2013 en, voor wat betreft de rechtstreekse
      betalingen, Verordening (EU) nr. 1306/2013, alsmede van de op deze verordeningen gebaseerde gedelegeerde en
      uitvoeringshandelingen.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel1.2
  - number: '2.1'
    text: |-
      1 De minister wijst op aanvraag aan de landbouwer betalingsrechten toe overeenkomstig artikel 24 en artikel 30,
      vierde lid, van Verordening (EU) nr. 1307/2013.

      2 De minister verstrekt rechtstreekse betalingen inzake de:

      a. basisbetalingsregeling overeenkomstig artikel 32 van Verordening (EU) nr. 1307/2013;

      b. betaling voor klimaat en milieuvriendelijke landbouwpraktijken;

      c. betaling voor jonge landbouwers;

      d. vrijwillige gekoppelde steun inzake graasdierhouderij.

      3 De minister stelt in voorkomend geval de lineaire verlaging, bedoeld in artikel 7, eerste lid, tweede alinea, of
      artikel 51, tweede lid, van Verordening (EU) nr. 1307/2013 vast en past deze toe op de rechtstreekse betalingen.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.1
  - number: '2.2'
    text: |-
      1 Het criterium waaraan de landbouwer dient te voldoen om een landbouwareaal in een staat te houden die
      begrazing of teelt mogelijk maakt, bedoeld in artikel 4, eerste lid, onderdeel c, onder ii, van Verordening (EU)
      nr. 1307/2013 is het jaarlijks, vóór 1 november, maaien van het areaal, tenzij de landbouwer als gevolg van een
      contract voor agrarisch natuurbeheer op basis van de subsidieregelingen ANLb, SNL of de Catalogus Groenblauwe
      diensten niet aan dit criterium kan voldoen, in welk geval het areaal ten minste één keer per twee jaar vóór
      1 november wordt gemaaid.

      2 Boomsoorten behorende tot het geslacht wilg (*Salix*) met een maximale omlooptijd van vijf jaar komen in
      aanmerking als hakhout met korte omlooptijd, als bedoeld in artikel 4, eerste lid, onderdeel k, van Verordening
      (EU) nr. 1307/2013.

      3 Bij de constatering van de oppervlakte van het landbouwareaal worden windhagen die zijn gelegen in een perceel
      grond gebruikt voor fruitteelt en die niet breder zijn dan 2 meter overeenkomstig de door de Europese Commissie
      aanvaarde meetmethoden gerekend tot de volledig gebruikte oppervlakte van het desbetreffende perceel.

      4 De maximumdichtheid, bedoeld in artikel 9, derde lid, van Verordening (EU) nr. 640/2014 is 50 bomen per hectare.

      5 Voor de uitvoering van zijn taken en bevoegdheden baseert de minister zich voor de grenzen van percelen
      landbouwgrond op de gegevens van de RVO-referentiepercelen die zijn gebaseerd op de objectgrenzen uit de
      Basisregistratie Grootschalige Topografie, voor zover deze objectgrenzen in een voorgaand kalenderjaar zijn
      gecontroleerd en zijn voorgelegd aan de betrokken landbouwer, en geen van de betrokken referentiepercelen tevens
      deels in gebruik was bij een andere landbouwer aan wie deze objectgrenzen nog niet zijn voorgelegd.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.2
  - number: '2.3'
    text: |-
      1 Er worden geen rechtstreekse betalingen toegekend aan landbouwers die niet uiterlijk op 15 mei van het jaar
      van aanvraag zijn ingeschreven of waarvan de onderneming niet uiterlijk op 15 mei van het jaar van aanvraag
      is ingeschreven in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1], onder de
      vermelding van de verkorte omschrijving van de landbouwactiviteit en de daarbij behorende code van de Standaard
      Bedrijfsindeling (SBI) beginnend met de cijfers 011, 012, 013, 014, 015, 016 of 1051, voor zover minimaal 50% van
      de melk die wordt verwerkt op het eigen melkveebedrijf geproduceerd wordt.

      2 Onverminderd het eerste lid worden, ter uitvoering van artikel 9, derde lid, aanhef en onderdeel b, van
      Verordening (EU) nr. 1307/2013 geen rechtstreekse betalingen toegekend aan een landbouwer indien uit de
      inschrijving in het handelsregister volgt dat de landbouwactiviteit geen hoofdactiviteit is.

      3 Ter uitvoering van artikel 9, derde lid, aanhef en onderdeel a, van Verordening (EU) nr. 1307/2013 is het
      tweede lid niet van toepassing indien de landbouwer aantoont door middel van een accountantsverklaring dat de
      landbouwactiviteit niet een onaanzienlijk deel uitmaakt van de totale economische activiteiten.

      4 Als accountantsverklaring wordt vastgesteld een accountantsverklaring die overeenkomt met het model dat is
      opgenomen in [bijlage 6][ref2].

      5 De beoordeling dat de landbouwactiviteit niet een onaanzienlijk deel uitmaakt van de totale economische
      activiteiten wordt gemaakt met toepassing van artikel 13, tweede lid, van Verordening (EU) nr. 639/2014.

      6 De drempel, bedoeld in artikel 13, tweede lid, onderdeel b, van Verordening (EU) nr. 639/2014 bedraagt een derde
      van het totale bedrag aan inkomsten in het meest recente belastingjaar, dan wel een derde van een gemiddeld bedrag
      aan inkomsten over de drie meest recente belastingjaren, waarvoor dergelijk bewijs als bedoeld in dat artikellid
      beschikbaar is.

      7 Het bedrag aan rechtstreekse betalingen, bedoeld in artikel 9, vierde lid, van Verordening (EU) nr. 1307/2013
      is € 1.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035925
