    text: |-
      1 De minimumoppervlakte van de landbouwpercelen, bedoeld in artikel 72, eerste lid, van Verordening (EU)
      nr. 1306/2013 bedraagt afgerond 0,01 hectare.

      2 In afwijking van het eerste lid, komt een perceel met een afgeronde oppervlakte kleiner dan 0,01 hectare voor
      steun in aanmerking, voor zover is voldaan aan de volgende criteria:

      a. het perceel grenst direct aan een ander perceel landbouwgrond van dezelfde landbouwer waarbij de totale
      oppervlakte afgerond minimaal 0,01 hectare bedraagt, en

      b. tussen de percelen bevindt zich geen afrastering of enige andere vorm van fysieke begrenzing.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel4.3
  - number: '4.4'
    text: |-
      1 De aanvraag voor toepassing van artikel 24, achtste lid, van Verordening (EU) nr. 1307/2013 gebeurt met
      gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      2 De verkoper of verhuurder van het landbouwbedrijf of een deel ervan doet de aanvraag tot toewijzing van
      betalingsrechten bij een overdracht als bedoeld in artikel 2.7, eerste lid, aan de minister met gebruikmaking van
      een middel dat door de minister beschikbaar wordt gesteld overeenkomstig artikel 4, eerste lid, respectievelijk
      artikel 5, eerste lid, van Verordening (EU) nr. 641/2014.

      3 De koper of huurder van het landbouwbedrijf of een deel ervan, bedoeld in het tweede lid, identificeert de
      verkochte respectievelijk verhuurde percelen waarop de koop respectievelijk huur betrekking heeft.

      4 De aanvragen, bedoeld in het eerste of het tweede lid, worden volledig en naar waarheid door de landbouwer
      ingevuld, ondertekend en gedagtekend.

      5 [Artikel 4.2, vierde lid][ref1], is van overeenkomstige toepassing op de aanvragen, bedoeld in het eerste en
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel4.2
