  - number: '4.11'
    text: |-
      Ten behoeve van de beoordeling van een aanvraag om rechtstreekse betalingen kan worden verzocht om binnen maximaal
      vier weken extra gegevens en inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel4.11
  - number: '5.1'
    text: |-
      1 De [Regeling GLB-inkomenssteun 2006][ref1] wordt ingetrokken.

      2 De [Regeling GLB-inkomenssteun 2006][ref2] blijft van toepassing ten aanzien van aanvragen die op grond van die
      regeling zijn ingediend vóór 1 januari 2015.

      3 Ten aanzien van aanvragen gedaan in 2017 is [artikel 2.17][ref3] van toepassing zoals dit artikel luidde op
      31 december 2017.


