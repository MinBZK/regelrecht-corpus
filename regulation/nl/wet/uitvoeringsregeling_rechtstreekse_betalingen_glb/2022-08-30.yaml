  - number: '2.23'
    text: |-
      1 Een landbouwer ontvangt op aanvraag vrijwillige gekoppelde steun inzake graasdierhouderij voor schapen.

      2 De steun, bedoeld in het eerste lid, wordt verstrekt voor elk schaap:

      a. waarvoor steun is aangevraagd;

      b. dat is geboren voorafgaand aan het jaar van aanvraag, en

      c. dat op 15 mei van het jaar van aanvraag aanwezig is op het bedrijf van de aanvrager.

      3 Het schaap, bedoeld in het eerste lid, wordt voor steun in aanmerking genomen voor elke dag dat het in de periode
      van 15 mei tot en met 15 oktober van het jaar van aanvraag aanwezig is op het bedrijf van de aanvrager.

      4 De eisen inzake identificatie en registratie van schapen waarin Verordening (EG) nr. 21/2004 voorziet, worden
      door de landbouwer in acht genomen.

      5 Het voldoen aan de voorwaarden in het tweede en derde lid wordt beoordeeld op basis van het I&R-systeem schapen
      en geiten, bedoeld in [artikel 34, onderdeel a, van de Regeling identificatie en registratie van dieren][ref1].

      6 De datum, bedoeld in artikel 53, vierde lid, onderdeel b, van Verordening (EU) nr. 639/2014, is 15 mei van het
      jaar van aanvraag.

      7 De steun wordt alleen verstrekt indien het schaap vanaf 15 mei tot en met 15 oktober van het jaar van aanvraag
      of, als het dier eerder van het bedrijf van de aanvrager wordt afgevoerd tot de datum van afvoer van het bedrijf
      van de aanvrager, ononderbroken aanwezig is op niet subsidiabele grond ten behoeve van extensieve begrazing.

      8 De aanwezigheid van een schaap op niet subsidiabele grond, bedoeld in het zevende lid, wordt ten genoegen van de
      minister aangetoond door middel van voldoende schriftelijk bewijs, waaruit blijkt welke percelen worden begraasd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel34
