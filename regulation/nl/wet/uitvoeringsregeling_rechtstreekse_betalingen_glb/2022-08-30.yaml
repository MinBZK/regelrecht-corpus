preamble:
  text: |-
    Gelet op:

    Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van 17 december 2013 inzake de financiering,
    het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en tot intrekking van Verordeningen (EG)
    nr. 814/2000, (EG) nr. 1290/2005 en (EG) nr. 485/2008 van de Raad (PbEU L 347);

    Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling
    van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen van het
    gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EG) nr. 637/2008 van de Raad en van Verordening
    (EG) nr. 73/2009 van de Raad (PbEU L 347);

    Gedelegeerde verordening (EU) nr. 639/2014 van de Europese Commissie van 11 maart 2014 tot aanvulling van
    Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad tot vaststelling van voorschriften
    voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen van het gemeenschappelijk
    landbouwbeleid en tot wijziging van bijlage X bij die verordening (PbEU L 181);

    Gedelegeerde verordening (EU) nr. 640/2014 van de Europese Commissie van 11 maart 2014 tot aanvulling van
    Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft het geïntegreerd beheers- en
    controlesysteem en de voorwaarden voor weigering of intrekking van betalingen en voor administratieve sancties in
    het kader van rechtstreekse betalingen, plattelandsontwikkelingsbijstand en de randvoorwaarden (PbEU L 181);

    Uitvoeringsverordening (EU) nr. 641/2014 van de Europese Commissie van 16 juni 2014 tot vaststelling van
    uitvoeringsbepalingen voor Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad tot vaststelling
    van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen van het
    gemeenschappelijk landbouwbeleid (PbEU L 181);

    Uitvoeringsverordening (EU) nr. 809/2014 van de Europese Commissie van 17 juli 2014 tot vaststelling van
    uitvoeringsbepalingen voor Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft het
    geïntegreerd beheers- en controlesysteem, plattelandsontwikkelingsmaatregelen en de randvoorwaarden (PbEU L 227);

    en de artikelen 15, 19, 26, 27 en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 Voor de toepassing van deze regeling wordt verstaan onder:

        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *RVO.nl:* Rijksdienst voor Ondernemend Nederland;
        - *Verordening (EU) nr. 1306/2013:* Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van
      17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid
      en tot intrekking van Verordeningen (EG) nr. 814/2000, (EG) nr. 1290/2005 en (EG) nr. 485/2008 van de Raad (PbEU
      L 347);
        - *Verordening (EU) nr. 1307/2013:* Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad van
      17 december 2013 tot vaststelling van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van
      de steunregelingen van het gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EG) nr. 637/2008 van
      de raad en van Verordening (EG) nr. 73/2009 van de Raad (PbEU L 347);
        - *Verordening (EU) nr. 639/2014:* Gedelegeerde verordening (EU) nr. 639/2014 van de Europese Commissie van
      11 maart 2014 tot aanvulling van Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad tot
      vaststelling van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen
      van het gemeenschappelijk landbouwbeleid en tot wijziging van bijlage X bij die verordening (PbEU L 181);
        - *Verordening (EU) nr. 640/2014:* Gedelegeerde verordening (EU) nr. 640/2014 van de Europese Commissie van
      11 maart 2014 tot aanvulling van Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft
      het geïntegreerd beheers- en controlesysteem en de voorwaarden voor weigering of intrekking van betalingen en
      voor administratieve sancties in het kader van rechtstreekse betalingen, plattelandsontwikkelingsbijstand en de
      randvoorwaarden (PbEU L 181);
        - *Verordening (EU) nr. 641/2014:* Uitvoeringsverordening (EU) nr. 641/2014 van de Europese Commissie van 16 juni
      2014 tot vaststelling van de uitvoeringsbepalingen voor Verordening (EU) nr. 1307/2013 van het Europees Parlement
      en de Raad tot vaststelling van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de
      steunregelingen van het gemeenschappelijk landbouwbeleid (PbEU L 181);
        - *Verordening (EU) nr. 809/2014:* Uitvoeringsverordening (EU) nr. 809/2014 van de Europese Commissie van 17 juli
      2014 tot vaststelling van uitvoeringsbepalingen voor Verordening (EU) nr. 1306/2013 van het Europees Parlement
      en de Raad wat betreft het geïntegreerd beheers- en controlesysteem, plattelandsontwikkelingsmaatregelen en de
      randvoorwaarden (PbEU L 227);
        - *Verordening (EG) nr. 1760/2000:* Verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van
      17 juli 2000 tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake de etikettering
      van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97 van de Raad (PbEG L 204);
        - *Verordening (EG) nr. 21/2004:* Verordening (EG) nr. 21/2004 van de Raad van 17 december 2003 tot vaststelling
      van een identificatie- en registratieregeling voor schapen en geiten en tot wijziging van Verordening (EG)
      nr. 1782/2003 en [Richtlijnen 92/102/EEG](31992L0102) en [64/432/EEG](31964L0432) (PbEU L 5);
        - *lichte grondbewerking:* de toepassing van een graslandvernieuwingstechniek waarbij de ondergrond vrijwel
      onberoerd blijft en waarbij te allen tijde een dekkende vegetatie zichtbaar blijft;
        - *verbonden bedrijf:* een rechtspersoon die direct of indirect aan de aanvrager is gekoppeld via een relatie van
      volledige zeggenschap in de vorm van volledige eigendom of een meerderheidsbelang;
        - *niet subsidiabele grond:* areaal dat buiten de begrenzing van percelen landbouwgrond als bedoeld in
      [artikel 2.2, vijfde lid][ref1], valt en geschikt is voor extensieve begrazing.

      2 De in Verordening (EU) nr. 1306/2013 en Verordening (EU) nr. 1307/2013, alsmede in op deze verordeningen
      gebaseerde verordeningen vastgestelde definities zijn van overeenkomstige toepassing voor wat betreft de
      [hoofdstukken 2][ref2], [3][ref3], en [4][ref4].


