  - number: '4.7'
    text: |-
      1 De minister beheert het geïntegreerde beheers- en controlesysteem, bedoeld in titel V, hoofdstuk II, van
      Verordening (EU) nr. 1306/2013.

      2 De minister verricht de controles, bedoeld in artikel 74, eerste lid, van Verordening (EU) nr. 1306/2013.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel4.7
  - number: '4.8'
    text: |-
      1 De minister besluit tot het niet betalen, dan wel de gehele of gedeeltelijke intrekking van rechtstreekse
      betalingen en betalingsrechten overeenkomstig artikel 63, eerste lid, van Verordening (EU) nr. 1306/2013.

      2 De minister stelt de sancties, bedoeld in artikel 63, tweede lid, van Verordening (EU) nr. 1306/2013 vast
      overeenkomstig artikel 77 van Verordening (EU) nr. 1306/2013.

      3 De minister stelt de sancties, bedoeld in artikel 91, eerste lid, van Verordening (EU) nr. 1306/2013 vast
      overeenkomstig de artikelen 97 en 99 van Verordening (EU) nr. 1306/2013.

      4 De minister besluit tot terugvordering overeenkomstig artikel 63, derde lid, van Verordening (EU) nr. 1306/2013.

      5 De minister kan besluiten ten onrechte toegewezen betalingsrechten niet in te trekken, overeenkomstig artikel 23,
      vijfde lid, van Verordening (EU) nr. 809/2014.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel4.8
  - number: '4.9'
    text: |-
      Het rentetarief dat overeenkomstig artikel 7, tweede lid, van Verordening (EU) nr. 809/2014 wordt toegepast betreft
      de wettelijke rente, bedoeld in [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
  - number: '4.10'
    text: |-
      1 De kennisgeving, bedoeld in artikel 8, derde lid, van Verordening (EU) nr. 809/2014, geschiedt in de periode
      van 1 maart tot en met 15 mei, dan wel in de daarop volgende periode van 25 kalenderdagen na de overdracht van een
      bedrijf, bedoeld in artikel 8, eerste lid, onderdeel a, van Verordening (EU) nr. 809/2014 met gebruikmaking van een
      middel dat door de minister beschikbaar wordt gesteld.

      2 In afwijking van [artikel 2.3, eerste lid][ref1], is uiterlijk op 1 december van het
      jaar van de bedrijfsoverdracht de overnemer ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref2], onder vermelding van de verkorte omschrijving van de
      landbouwactiviteit en de daarbij behorende code van de Standaard Bedrijfsindeling (SBI) beginnend met de cijfers
      011, 012, 013, 014, 015 of 016 en blijkt uit de inschrijving dat het bedrijf van de overnemer is opgericht op
      uiterlijk de datum van bedrijfsoverdracht.

      3 Indien uit de inschrijving in het handelsregister blijkt dat de hoofdactiviteit van de overnemer geen
      landbouwactiviteit is, wordt de accountantsverklaring, bedoeld in [artikel 2.3, derde lid][ref3], uiterlijk op
      1 december van het jaar van de bedrijfsoverdracht overgelegd.

      4 Onverminderd het tweede en derde lid wordt voor de toepassing van artikel 8, vijfde lid, van Verordening (EU) nr.
      809/2014 als passend aangemerkt de situatie waarin:

      a. de kennisgeving, bedoeld in artikel 8, derde lid, van Verordening (EU) nr. 809/2014 niet of na de periode,
      bedoeld in het eerste lid, is ontvangen;

      b. de persoon wiens bedrijf is overgedragen, voldoet aan alle voorwaarden voor de verstrekking van rechtstreekse
      betalingen, en

      c. de persoon wiens bedrijf is overgedragen alle bewijsstukken heeft overgelegd die de minister nodig acht om de
      betalingen aan hem toe te kennen.

      5 Onverminderd het tweede en derde lid wordt voor de toepassing van artikel 8, vijfde lid, van Verordening (EU) nr.
      809/2014 ook als passend aangemerkt de situatie waarin naast het vierde lid, onderdelen b en c, in het jaar van de
      bedrijfsoverdracht na die bedrijfsoverdracht de verzamelaanvraag nog is ingediend door de persoon wiens bedrijf is
      overgedragen en de overnemer voor het overgenomen bedrijf dat jaar geen aanvraag heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035925#Artikel2.3
