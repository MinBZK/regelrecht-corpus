  - number: 2.9a
    text: |-
      Voor het vaststellen van de betalingsrechten van een landbouwer die aan de nationale reserve vervallen
      overeenkomstig artikel 31, eerste lid, onderdeel b, van Verordening (EU) nr. 1307/2013 worden de volgende
      uitgangspunten gehanteerd:

      a. de waarde van een decimaal recht met dezelfde eenheidswaarde is gelijk aan de waarde van een heel recht met
      dezelfde eenheidswaarde;

      b. de niet verhuurde betalingsrechten in eigendom krijgen prioriteit boven de gehuurde betalingsrechten;

      c. de betalingsrechten die het kortst gehuurd zijn krijgen prioriteit boven de andere gehuurde betalingsrechten;

      d. voor het vaststellen van de volgorde van de te vervallen betalingsrechten, wordt uitgegaan van de situatie zoals
      die was op 15 mei van het aanvraagjaar.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel2.9a
  - number: '2.10'
    text: |-
      1 Voor de toepassing van artikel 32, derde lid, onderdeel a, van Verordening (EU) nr. 1307/2013 is geen
      sprake van noemenswaardige hinder voor de uitoefening van landbouwactiviteiten, indien de duur van de niet-
      landbouwactiviteiten op een landbouwareaal 90 dagen in het jaar van aanvraag niet overschrijdt; evenmin is er
      sprake van noemenswaardige hinder indien op een landbouwareaal voor meer dan 90 dagen niet-landbouwactiviteiten
      plaatsvinden in het kader van contracten op basis van subsidieregelingen ANLb, SNL of de Catalogus Groenblauwe
      diensten, mits de landbouwgrond na afloop van deze activiteiten weer in een staat verkeert waarin begrazing of
      teelt mogelijk is als bedoeld in [artikel 2.2, eerste lid][ref1].

      2 Als areaal dat overwegend voor niet-landbouwactiviteiten wordt gebruikt als bedoeld in artikel 32, derde lid,
      onderdeel b, van Verordening (EU) nr. 1307/2013, wordt aangemerkt:

      a.

      b. moes- en siertuinen;

      c. bermen tot een breedte van drie meter van de weg of breder voor zover de verkeersbestemming de landbouw hindert;

      d. speelweides;

      e. stroken grasland langs verharde landingsbanen voor vliegverkeer;

      f. onverharde landingsbanen voor luchtsport en luchtvaart;

      g. stroken langs gebouwen of kassen, smaller dan 1 meter;

      h. schouwpaden;

      i. geluidswallen;

      j. springweides;

      k. kinderboerderijen;

      l. areaal waarop installaties voor de benutting van zonne-energie aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel2.2
