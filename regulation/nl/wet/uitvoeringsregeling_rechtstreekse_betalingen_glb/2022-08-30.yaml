      1 Er is een bedrijfsadviseringssysteem als bedoeld in artikel 12, eerste lid, van Verordening (EU) nr. 1306/2013.

      2 De adviseur in het kader van het bedrijfsadviseringssysteem adviseert, met inachtneming van artikel 13, tweede
      lid, en artikel 14, laatste alinea, van Verordening (EU) nr. 1306/2013 ten minste over de onderwerpen, bedoeld in
      artikel 12, tweede lid, onderdelen a tot en met e, van Verordening (EU) nr. 1306/2013.
    url: https://wetten.overheid.nl/BWBR0035925/2022-08-30#Artikel3.3
  - number: '3.4'
    text: |-
      1 De minister wijst op aanvraag een beroepsorganisatie voor adviseurs in het kader van het
      bedrijfsadviseringssysteem aan die ten minste 50 leden heeft en die blijkens de bij de aanvraag overgelegde
      gegevens voldoet aan het tweede tot en met vierde lid.

      2 De beroepsorganisatie erkent de adviseur in het kader van het bedrijfsadviseringssysteem die aantoonbaar:

      a. ten minste een HBO-opleidingsniveau of HBO-denkniveau heeft;

      b. ten minste 3 jaar werkervaring heeft als adviseur, en

      c. kennis heeft over de onderwerpen, bedoeld in [artikel 3.3, tweede lid][ref1].

      3 De beroepsorganisatie verplicht de adviseur in het kader van het bedrijfsadviseringssysteem die een erkenning als
      bedoeld in het tweede lid houdt tot:

      a. het jaarlijks geven van ten minste vijf adviezen in het kader van het bedrijfsadviseringssysteem, en

      b. de periodieke opleiding met betrekking tot de onderwerpen, bedoeld in [artikel 3.3, tweede lid][ref2], en met
      betrekking tot adviesvaardigheden.

      4 De beroepsorganisatie trekt een erkenning als bedoeld in het tweede lid in indien de adviseur:

      a. in enig jaar minder dan vijf adviezen in het kader van het bedrijfsadviseringssysteem heeft gegeven, of

      b. niet kan aantonen dat hij jaarlijks ten minste 20 uur opleiding heeft gevolgd als bedoeld in het derde lid,
      onderdeel b.

      5 De aangewezen beroepsorganisaties worden overeenkomstig artikel 13, tweede lid, van Verordening (EU)
      nr. 1306/2013 bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0035925#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0035925#Artikel3.3
