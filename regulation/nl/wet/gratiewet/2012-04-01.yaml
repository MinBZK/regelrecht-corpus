---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: gratiewet
regulatory_layer: WET
publication_date: '2021-03-12'
valid_from: '2012-04-01'
bwb_id: BWBR0004257
url: https://wetten.overheid.nl/BWBR0004257/2012-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 122, eerste lid, van de herziene Grondwet een
    wettelijke regeling dient te voorzien in de aanwijzing van gerechten welke over verzoekschriften om gratie advies
    uitbrengen en in voorschriften omtrent de behandeling van en beschikking op zulke verzoekschriften, en dat het in
    dat verband wenselijk is de bepalingen van het Wetboek van Strafvordering die betrekking hebben op de indiening van
    verzoekschriften om gratie te wijzigen opdat het mogelijk zij ook gratie te verzoeken en te verkrijgen van bepaalde
    door de Nederlandse strafrechter opgelegde strafrechtelijke maatregelen, en voorts enkele andere wetten daaraan aan
    te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder: Onze Minister: Onze Minister van Justitie; openbaar ministerie: het openbaar
      ministerie dat is belast met de tenuitvoerlegging van de rechterlijke beslissing, waarop het verzoek om gratie
      betrekking heeft; verzoekschrift: een schriftelijk verzoek om gratie van een veroordeelde of een derde, ingediend
      op het formulier, bedoeld in [artikel 3, eerste lid][ref1]; veroordeelde: degene op wie het verzoekschrift
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel3
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '3'
  - number: '1.2'
    text: |-
      In deze wet wordt mede verstaan onder: openbaar ministerie: het openbaar ministerie van Bonaire, Sint Eustatius
      en Saba; in Nederland: in de openbare lichamen Bonaire, Sint Eustatius en Saba; een Nederlandse strafrechter: een
      strafrechter in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel1
  - number: '1.3'
    text: |-
      Indien het verzoek om gratie betrekking heeft op een rechterlijke beslissing waarvan de tenuitvoerlegging aan een
      vreemde staat is overgedragen, wordt onder het openbaar ministerie verstaan het openbaar ministerie bij het gerecht
      dat die beslissing heeft gegeven en indien het betrekking heeft op een buitenlandse rechterlijke beslissing waarvan
      de tenuitvoerlegging met toepassing van [artikel 43 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1]
      of artikel 593 van het Wetboek van Strafvordering BES in Nederland is gelast, het openbaar ministerie dat met deze
      tenuitvoerlegging is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel43
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '43'
  - number: '2'
    text: Gratie kan worden verleend
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel2
  - number: 2.a
    text: |-
      op grond van enige omstandigheid, waarmede de rechter op het tijdstip van zijn beslissing geen of onvoldoende
      rekening heeft gehouden of kunnen houden en die, ware zij op dat tijdstip wel of voldoende bekend geweest, hem
      aanleiding zou hebben gegeven tot het opleggen van een andere straf of maatregel, of tot het afzien daarvan; dan
      wel
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel2
  - number: 2.b
    text: |-
      indien aannemelijk is geworden dat met de tenuitvoerlegging van de rechterlijke beslissing of de voortzetting
      daarvan geen met de strafrechtstoepassing na te streven doel in redelijkheid wordt gediend.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel2
  - number: '3.1'
    text: 'Het verzoekschrift wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: 3.1.a
    text: de naam en het adres van de indiener;
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: 3.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: 3.1.c
    text: de aanduiding van het vonnis of arrest, waarvan gratie wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: 3.1.d
    text: de redenen om welke gratie wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: '3.2'
    text: |-
      Indien het verzoek op grond van [artikel 560 van het Wetboek van Strafvordering][ref1] of artikel 614 van het
      Wetboek van Strafvordering BES door een derde wordt ingediend, geeft degene op wie het verzoek betrekking heeft, op
      het in het eerste lid bedoelde formulier tevens aan of hij met het verzoek instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel560
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '560'
  - number: '3.3'
    text: |-
      Indien het formulier niet volledig is ingevuld, wordt de verzoeker in de gelegenheid gesteld de ontbrekende
      gegevens aan te vullen binnen een termijn van zes weken, ingaande op de dag nadat het verzoek om aanvulling van die
      gegevens door Onze Minister is verzonden.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: '3.4'
    text: |-
      Indien de termijn voor aanvulling verstrijkt zonder dat de gevraagde gegevens worden ontvangen, en de ontbrekende
      gegevens essentieel zijn voor de beoordeling van het verzoek of de voorbereiding van de beslissing daarop, kan Onze
      Minister besluiten het verzoekschrift buiten behandeling te laten.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel3
  - number: '4.1'
    text: |-
      Omtrent verzoekschriften, overeenkomstig de wettelijke voorschriften ingediend, om vermindering, verandering of
      kwijtschelding van straffen of maatregelen, bij beslissing van een Nederlandse strafrechter opgelegd, wordt door
      Onze Minister, voordat daarop wordt beschikt, het advies ingewonnen van het gerecht dat de straf of maatregel
      heeft opgelegd. Indien het verzoekschrift betrekking heeft op een straf waarvan de gehele of gedeeltelijke
      tenuitvoerlegging is gelast door een ander gerecht dan hetwelk deze heeft opgelegd, wordt, in afwijking van het
      voorgaande, het advies ingewonnen van het gerecht dat die tenuitvoerlegging heeft gelast. Verzoekschriften die niet
      bij Ons zijn ingediend worden onverwijld aan Ons voorgelegd.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: '4.2'
    text: 'Voor de toepassing van het eerste lid wordt als gerecht dat de straf of maatregel heeft opgelegd mede aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: 4.2.a
    text: |-
      het gerecht dat in hoger beroep een rechterlijke beslissing ten aanzien van de oplegging van straf of van een
      maatregel heeft bevestigd;
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: 4.2.b
    text: |-
      het gerecht dat een bezwaar, hem voorgelegd ingevolge
      [artikel 35 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1] of artikel 592b van het Wetboek van
      Strafvordering BES, ongegrond heeft verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel35
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '35'
  - number: '4.3'
    text: |-
      Omtrent verzoekschriften om vermindering of kwijtschelding van straffen bij rechterlijke
      beslissing van een buitenlandse rechter opgelegd, waarvan de tenuitvoerlegging met toepassing van
      [artikel 43 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1] of artikel 593 van het Wetboek van
      Strafvordering BES in Nederland is gelast, dan wel van gevangenisstraffen die door het Internationaal Strafhof zijn
      opgelegd wegens een misdrijf gericht tegen de rechtspleging van het Strafhof en waarvan de tenuitvoerlegging in
      Nederland geschiedt overeenkomstig [artikel 67][ref2] of [68 van de Uitvoeringswet Internationaal Strafhof][ref3],
      wordt door Onze Minister, voordat daarop wordt beschikt, het advies ingewonnen van het in genoemd artikel 43
      respectievelijk artikel 593 bedoelde gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0013796#Artikel68
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0013796
        artikel: '68'
  - number: '4.4'
    text: 'Het eerste, tweede en derde lid blijven buiten toepassing indien het verzoekschrift:'
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: 4.4.a
    text: |-
      wordt ingediend binnen drie maanden nadat het vonnis of arrest waarvan gratie wordt verzocht, onherroepelijk
      is geworden, en geen nieuwe, na dit tijdstip opgekomen omstandigheid wordt vermeld waarvan de rechter bij diens
      beslissing niet reeds kennis heeft kunnen nemen, of
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: 4.4.b
    text: |-
      is voorafgegaan door een eerder verzoekschrift betreffende dezelfde straf of maatregel, waarop binnen een jaar
      voor de indiening van het tweede verzoekschrift is beschikt, tenzij in het tweede verzoekschrift een nieuwe
      omstandigheid wordt aangevoerd.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: '4.5'
    text: |-
      In de gevallen waarin geen toepassing wordt gegeven aan het vierde lid, onder a of b, omdat blijkt van een nieuwe
      omstandigheid, wordt het verzoekschrift in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: '4.6'
    text: |-
      Een verzoek om gratie terzake van door de Nederlandse strafrechter onherroepelijk opgelegde taakstraffen
      blijft buiten behandeling indien het is ingediend gedurende de periode dat de rechter nog niet heeft beslist
      op een beroepschrift van de veroordeelde tegen de beslissing van het openbaar ministerie om met toepassing van
      [artikel 22g van het Wetboek van Strafrecht][ref1] de vervangende hechtenis te bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22g
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22g
  - number: '4.7'
    text: |-
      Indien het gerecht waarvan de rechterlijke beslissing afkomstig is, ontbonden of opgeheven is, wordt het advies
      ingewonnen van het gerecht waaraan de rechtsmacht is opgedragen, tevoren door dat gerecht uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel4
  - number: '5.1'
    text: |-
      Naar aanleiding van een verzoekschrift kan Onze Minister omtrent de veroordeelde inlichtingen inwinnen bij de
      daarvoor in aanmerking komende autoriteiten, instellingen of personen. Deze verlenen daaraan hun medewerking.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel5
  - number: '5.2'
    text: Onze Minister kan, indien daartoe naar zijn oordeel aanleiding bestaat, de veroordeelde horen.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister stelt op basis van de door de verzoeker verstrekte gegevens en de ingevolge het eerste en tweede lid
      ingewonnen informatie een verslag van bevindingen op.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel5
  - number: '5.4'
    text: |-
      In de gevallen waarin het verzoekschrift betrekking heeft op een vonnis of arrest dat is gewezen door de
      meervoudige kamer of waarbij het openbaar ministerie de aantekening heeft geplaatst dat het wil adviseren over
      te nemen besluiten inzake de verschillende vormen van te verlenen vrijheden aan de gedetineerde, zendt Onze
      Minister het verzoekschrift en zijn verslag van bevindingen naar het openbaar ministerie voor advies. Het openbaar
      ministerie legt zijn advies neer in een verslag en zendt de stukken vervolgens aan het in [artikel 4][ref1]
      aangewezen gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel4
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '4'
  - number: '5.5'
    text: |-
      In de overige gevallen zendt Onze Minister het verzoekschrift met zijn verslag van bevindingen rechtstreeks aan het
      in [artikel 4][ref1] aangewezen gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel4
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '4'
  - number: '6.1'
    text: |-
      Het gerecht kan naar aanleiding van de in [artikel 5, vierde of vijfde lid][ref1], ontvangen stukken inlichtingen
      inwinnen bij de daarvoor in aanmerking komende autoriteiten, instellingen of personen. Het gerecht zendt zijn
      advies, met het op grond van [artikel 5, vierde lid][ref2], uitgebrachte verslag van het openbaar ministerie, aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004257#Artikel5
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004257
        artikel: '5'
  - number: '6.2'
    text: |-
      Indien het uitgebrachte advies daartoe aanleiding geeft, kan Onze Minister aan het openbaar ministerie en het
      gerecht nader advies vragen.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de inrichting van het rechterlijk
      advies en dat van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel6
  - number: '7.1'
    text: Het rechterlijk advies is met redenen omkleed en ondertekend.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel7
  - number: '7.2'
    text: |-
      Zo het rechterlijk advies niet met eenparigheid van stemmen is vastgesteld, wordt het gevoelen van de minderheid
      met de daarvoor aangevoerde gronden en de verhouding van de stemmen in het advies medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel7
  - number: '8.1'
    text: |-
      Verzoekschriften die met toepassing van [artikel 3, vierde lid][ref1], buiten behandeling zijn gelaten, worden niet
      aan Ons voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel3
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '3'
  - number: '8.2'
    text: |-
      Tenzij Wij anders hebben bepaald, is Onze Minister gemachtigd afwijzend op een verzoekschrift om gratie te
      beschikken, indien hij meent dat het niet voor inwilliging in aanmerking komt en tevens
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel8
  - number: 8.2.a
    text: het rechterlijk advies afwijzend luidt, dan wel
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel8
  - number: 8.2.b
    text: |-
      de inwinning van het rechterlijk advies op grond van [artikel 4, vierde lid][ref1], achterwege is gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel4
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '4'
  - number: '8.3'
    text: |-
      Het tweede lid, aanhef en onder a, blijft buiten toepassing indien het verzoekschrift een of meer vrijheidsstraffen
      betreft met een gezamenlijke duur van zes jaar of langer dan wel indien het rechterlijk advies niet met
      eenparigheid van stemmen is vastgesteld. Het bepaalde in het tweede lid blijft tevens buiten toepassing indien
      overeenkomstig [artikel 10, eerste volzin][ref1], het gevoelen van een andere Minister is ingewonnen, en deze blijk
      geeft van een van Onze Minister afwijkend gevoelen over de op het verzoekschrift te nemen beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel10
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '10'
  - number: '9'
    text: |-
      Onze Minister zendt de verzoekschriften die niet overeenkomstig het eerste lid van het vorige artikel zijn afgedaan
      aan Ons toe met zijn voordracht omtrent het op het verzoek te nemen besluit. Bijgevoegd worden het rechterlijk
      advies en het verslag van het openbaar ministerie met de daarbij behorende bescheiden en opgaven.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel9
  - number: '10'
    text: |-
      Indien Wij of Onze Minister het wenselijk achten dat enige andere Minister wordt gehoord voordat op het
      verzoekschrift wordt beschikt, wint Onze Minister diens gevoelen in. Onverminderd het bepaalde in het
      [eerste lid van artikel 8][ref1], wordt de ambtsbrief van die Minister bij de aan Ons toe te zenden stukken gevoegd
      ofwel wordt door Onze Minister en die Minister aan Ons een gemeenschappelijke voordracht gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel8
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '8'
  - number: '11'
    text: |-
      Indien Wij of Onze Minister dit wenselijk achten wordt, behalve het advies van het in [artikel 4][ref1] aangewezen
      gerecht, ook het advies ingewonnen van de Hoge Raad der Nederlanden. Dit advies wordt bij de in [artikel 9][ref2]
      bedoelde stukken gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004257#Artikel9
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004257
        artikel: '9'
  - number: '13.1'
    text: Gratie kan worden verleend onder voorwaarden die het gedrag van de veroordeelde betreffen.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel13
  - number: '13.2'
    text: |-
      Als voorwaarde kan worden gesteld dat de veroordeelde overeenkomstig de daaromtrent vastgestelde wettelijke
      voorschriften bepaalde onbetaalde arbeid verricht of een leerproject volgt of, indien de veroordeelde de leeftijd
      van achttien jaren niet heeft bereikt, arbeid tot herstel van de door het strafbare feit aangerichte schade
      verricht.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel13
  - number: '13.3'
    text: |-
      Een andere voorwaarde kan zijn de betaling van een bepaalde geldsom aan de Staat. Mede kan de voorwaarde worden
      gesteld, dat de veroordeelde de door het strafbare feit veroorzaakte schade geheel of voor een bepaald gedeelte
      zal vergoeden.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel13
  - number: '13.4'
    text: |-
      Bij de toepassing van het derde lid bepaalt Onze Minister de plaats waar en de termijn waarbinnen de geldsom moet
      worden betaald, onderscheidenlijk de schade moet worden vergoed. Hij kan betaling in termijnen toestaan. Hij kan
      de gestelde termijn of termijnen verlengen met dien verstande dat de totale tijdsduur een tijdvak van twee jaren
      niet mag overschrijden. De termijn of eerste termijn vangt aan zodra de in [artikel 18, derde lid][ref1], bedoelde
      betekening is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel18
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '18'
  - number: '13.5'
    text: |-
      Voor zover dit bij het besluit waarbij gratie is verleend is bepaald, houdt het openbaar ministerie,
      onderscheidenlijk - indien het vonnis is uitgesproken met toepassing van de bijzondere strafbepalingen voor
      jeugdige personen - de raad voor de kinderbescherming, toezicht op de naleving van de gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel13
  - number: '14.1'
    text: |-
      Tenzij geen andere voorwaarden zijn gesteld dan die bedoeld in [artikel 13, derde lid][ref1], zijn de voorwaarden
      van kracht tot het tijdstip waarop een door Onze Minister te bepalen proeftijd verstrijkt. De proeftijd bedraagt
      ten hoogste twee jaren. Onze Minister kan deze proeftijd verkorten of verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel13
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '13'
  - number: '14.2'
    text: |-
      De proeftijd gaat in zodra de in [artikel 18, derde lid][ref1], bedoelde betekening is geschied. Hij loopt niet
      gedurende de tijd dat de veroordeelde rechtens zijn vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel18
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '18'
  - number: '15.1'
    text: |-
      Onze Minister kan aan een krachtens algemene maatregel van bestuur aangewezen reclasseringsinstelling dan wel
      aan bijzondere, door hem aangewezen ambtenaren opdracht geven de veroordeelde bij de naleving van de voorwaarden
      hulp en steun te verlenen. Een dergelijke opdracht kan, indien de veroordeling is uitgesproken met toepassing
      van de bijzondere strafbepalingen voor jeugdige personen ook worden gegeven aan een stichting als bedoeld in
      [artikel 1, onder f, van de Wet op de jeugdzorg][ref1], een door Onze Minister aan te wijzen voorziening of aan een
      particulier persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: '15.2'
    text: |-
      Indien de veroordeelde buiten Nederland verblijft, kan de opdracht ook gegeven worden aan een andere instelling of
      persoon die zich tot aanvaarding van die opdracht bereid heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel15
  - number: '16'
    text: |-
      Bij koninklijk besluit kunnen, op voorstel van Onze Minister, de voorwaarden gedurende de proeftijd of gedurende de
      tijd dat deze is geschorst worden aangevuld, gewijzigd of opgeheven.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel16
  - number: '17.1'
    text: |-
      Indien de voorwaarden niet worden nageleefd, kan het koninklijk besluit waarbij gratie is verleend bij koninklijk
      besluit worden herroepen. Deze herroeping vindt niet plaats dan nadat de veroordeelde, alsmede, zo de veroordeling
      is uitgesproken met toepassing van de bijzondere strafbepalingen voor jeugdige personen, degenen die het gezag over
      hem uitoefenen, zo enigszins mogelijk door of vanwege het openbaar ministerie zijn gehoord en het van dat verhoor
      opgemaakte proces-verbaal aan Ons is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel17
  - number: '17.2'
    text: |-
      De verleende gratie kan worden herroepen tot uiterlijk drie maanden na het einde van de proeftijd of tot uiterlijk
      vier maanden na het verstrijken van de krachtens [artikel 13, vierde lid][ref1], gestelde termijn of laatste
      termijn. Niettemin kan, indien de veroordeelde terzake van een voor het einde van de proeftijd begaan strafbaar
      feit is vervolgd en onherroepelijk is strafbaar verklaard, alsnog terzake van het begaan van dat feit binnen drie
      maanden, nadat de strafbaarverklaring onherroepelijk is geworden, tot herroeping van de verleende gratie worden
      besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel13
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '13'
  - number: '17.3'
    text: |-
      Indien de in [artikel 13, tweede lid][ref1], bedoelde voorwaarde slechts gedeeltelijk is nageleefd kan in geval van
      herroeping naar bevind van omstandigheden worden bepaald dat een deel van de straf zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel13
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '13'
  - number: '17.4'
    text: |-
      In geval van herroeping wordt de geldsom teruggegeven, die ter voldoening aan een bij het herroepen besluit
      gestelde voorwaarde aan de Staat was betaald. Indien gedeeltelijke betaling heeft plaats gehad, kan nochtans bij de
      herroeping worden bepaald dat het gestorte bedrag niet wordt teruggeven, onder vermindering van de duur van de te
      ondergane vrijheidsstraf naar evenredigheid.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel17
  - number: '18.1'
    text: |-
      Wanneer gunstig op een verzoek om gratie is beschikt wordt een afschrift van het daartoe strekkende koninklijk
      besluit aan degene aan wie de straf of maatregel werd opgelegd uitgereikt en de verzoeker, zo deze een ander is,
      van de gratieverlening in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
  - number: '18.2'
    text: |-
      Wanneer het verzoek wordt afgewezen stelt Onze Minister degene aan wie de straf of maatregel werd opgelegd en de
      verzoeker, zo deze een ander is, daarvan onder opgaaf van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
  - number: '18.3'
    text: |-
      Wanneer gratie is verleend onder voorwaarden, wordt de inhoud van die voorwaarden aan de veroordeelde in persoon
      betekend en aan degene die met het verlenen van hulp en steun is belast schriftelijk medegedeeld. De inhoud van
      voorwaarden, gesteld ingevolge [artikel 13, tweede lid][ref1], wordt tevens schriftelijk medegedeeld aan degene die
      zorg draagt voor de begeleiding van de tewerkgestelde veroordeelde. Indien de voorwaardelijke gratieverlening een
      veroordeling betreft welke is uitgesproken met toepassing van de bijzondere strafbepalingen voor jeugdige personen,
      wordt de inhoud van de voorwaarden tevens ter kennis gebracht van degenen die het gezag over de veroordeelde
      uitoefenen alsmede van de raad voor de kinderbescherming. Van iedere aanvulling, wijziging of opheffing van de
      voorwaarden, dan wel van de herroeping van een koninklijk besluit waarbij gratie is verleend, wordt eveneens op
      deze wijze kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel13
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '13'
  - number: '18.4'
    text: |-
      Van de in de drie voorgaande leden van dit artikel bedoelde beschikkingen wordt een kennisgeving gezonden aan het
      gerecht dat omtrent het verzoekschrift heeft geadviseerd.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
  - number: '18.5'
    text: |-
      Van de in het eerste en derde lid bedoelde beschikkingen, die betrekking hebben op verzoekschriften om gratie
      terzake van straffen of maatregelen opgelegd bij:
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
  - number: 18.5.a
    text: |-
      rechterlijke beslissingen gegeven door een Nederlandse strafrechter, waarvan de tenuitvoerlegging aan een vreemde
      staat is overgedragen, of
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
  - number: 18.5.b
    text: rechterlijke beslissingen gegeven in een vreemde staat, waarvan de tenuitvoerlegging aan Nederland is overgedragen,
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel18
  - number: '19.1'
    text: |-
      Indien bijzondere omstandigheden Onze Minister aanleiding geven om, zonder dat een daartoe strekkend
      verzoekschrift is ingediend, een voorstel tot gratieverlening in overweging te nemen, wordt het advies
      ingewonnen van het in [artikel 4][ref1] aangewezen gerecht. Tenzij, met Onze machtiging, Onze Minister anders
      bepaalt, zijn de [artikelen 559a van het Wetboek van Strafvordering][ref2] en [5 tot en met 7][ref3] en
      [9 tot en met 11 van deze wet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel559a
      [ref3]: https://wetten.overheid.nl/BWBR0004257#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004257#Artikel9
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 559a
      - id: ref3
        bwb_id: BWBR0004257
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0004257
        artikel: '9'
  - number: '19.2'
    text: |-
      Wanneer in zodanig geval gratie wordt verleend, zijn de [artikelen 13 tot en met 17][ref1] en
      [18, eerste, derde, vierde en vijfde lid][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004257#Artikel18
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004257
        artikel: '18'
  - number: '20'
    text: |-
      De [artikelen 2][ref1] tot en met [19][ref2] blijven van toepassing, indien een straf of maatregel bij wege van
      gratie is verminderd of veranderd en daarvan alsnog vermindering of kwijtschelding wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0004257#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004257#Artikel19
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004257
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004257
        artikel: '19'
  - number: '26.1'
    text: |-
      Deze Wet en [artikel 122, eerste lid, van de Grondwet][ref1] treden in werking op 1 januari 1988 of op een eerder
      bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel122
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '122'
  - number: '26.2'
    text: |-
      Verzoekschriften om gratie, die voordien zijn ingediend, doch waarover op dat tijdstip nog niet is beslist, worden
      met inachtneming van de bepalingen van deze Wet afgehandeld.
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel26
  - number: 26a
    text: |-
      Een verzoekschrift om gratie dat voor het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], is ingediend
      bij de griffie van het Gemeenschappelijk Hof van Justitie van de Nederlandse Antillen en Aruba en waarover op
      dat tijdstip nog niet is beslist, wordt geacht te zijn ingediend bij het Hof van Justitie van Aruba, Curaçao,
      Sint Maarten en van Bonaire, Sint Eustatius en Saba en wordt met inachtneming van de bepalingen van deze wet
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel1
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '1'
  - number: '27'
    text: Deze Wet kan worden aangehaald als "Gratiewet".
    url: https://wetten.overheid.nl/BWBR0004257/2012-04-01#Artikel27
