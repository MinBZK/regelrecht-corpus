      2 De belasting voor een motorrijtuig op drie of meer wielen, dat verbonden is met één of meer dan één rij- of
      voertuig, niet zijnde een motorrijtuig of een kampeeraanhangwagen, wordt voor elk van die rij- of voertuigen
      vermeerderd met de som van f 18 en het bedrag dat voor elk van die rij- of voertuigen zou zijn verschuldigd, indien
      dit als een motorrijtuig op drie of meer wielen werd aangemerkt, met dien verstande dat in geval van toepassing
      van het eerste lid, letter *d*, ten aanzien van een rij- of voertuig met een eigen gewicht van niet meer dan 500
      kilogram, de vermeerdering f 10 per 100 kilogram bedraagt.

      3 De belasting voor een motorrijtuig op drie of meer wielen dat is verbonden met een kampeeraanhangwagen wordt voor
      die kampeeraanhangwagen vermeerderd met f 47 per 100 kilogram eigen gewicht van de kampeeraanhangwagen.

      4 Onder eigen gewicht wordt verstaan het gewicht van het rij- of voertuig in bedrijfsvaardige staat, met inbegrip
      van de bedrijfsstoffen, reservedelen en gereedschappen, welke tot de normale uitrusting behoren. Indien een
      motorrijtuig als bedoeld in het eerste lid, letter *b*, of een motorrijtuig als bedoeld in het eerste lid, letter
      *d*, met een toegestane maximum massa van 3500 kilogram of minder, is voorzien van een installatie voor het
      verplaatsen of vastzetten van een rolstoel, wordt onder bij algemene maatregel van bestuur te stellen voorwaarden,
      op verzoek het gewicht van die installatie niet meegerekend bij het vaststellen van het eigen gewicht van het
      motorrijtuig.

      5 Voor de toepassing van het eerste lid wordt, behoudens waar een gewichtsgrens van 60 of 120 kilogram is genoemd,
      het eigen gewicht van het motorrijtuig afgerond tot het naaste honderdtal kilogrammen, met dien verstande dat 50
      kilogram naar beneden wordt afgerond.

      6 In afwijking van het eerste lid bedraagt de belasting nihil voor een motorrijtuig dat is ingericht en bestemd
      hoofdzakelijk te worden aangedreven door een elektromotor.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel5
  - number: '6'
    text: |-
      1 Voor een in [artikel 5, eerste lid, letter ][ref1], bedoeld motorrijtuig dat wordt voortbewogen of is bestemd om
      te worden voortbewogen door:

      a. een kracht welke wordt ontleend aan minerale oliën als zijn bedoeld in [artikel 27, eerste lid, onderdeel ][ref2]
      (*Stb.* 1991, 561) wordt de op de voet van [artikel 5, eerste lid][ref3], berekende belasting vermeerderd met f
      350, alsmede met f 69 per 100 kilogram eigen gewicht boven 500 kilogram. De vermeerdering van belasting, bedoeld in
      [artikel 5, tweede lid][ref4], wordt vermeerderd met f 39 per 100 kilogram eigen gewicht tot en met 1000 kilogram
      en met f 44 per 100 kilogram eigen gewicht boven 1000 kilogram.

      b. een kracht welke niet uitsluitend wordt ontleend aan minerale oliën als zijn bedoeld in
      [artikel 27, eerste lid, onderdelen ][ref5], wordt op de voet van [artikel 5, eerste lid][ref6], berekende
      belasting vermeerderd met f 538, alsmede met f 91 per 100 kilogram eigen gewicht boven 500 kilogram. De
      vermeerdering van belasting bedoeld in [artikel 5, tweede lid][ref7], wordt vermeerderd met f 46 per 100 kilogram
      eigen gewicht tot en met 1000 kilogram en met f 52 per 100 kilogram eigen gewicht boven 1000 kilogram.

      2 Voor een in [artikel 5, eerste lid, onder ][ref8], bedoeld motorrijtuig dat wordt voortbewogen of is bestemd om
      te worden voortbewogen door een kracht welke niet uitsluitend wordt ontleend aan minerale oliën als zijn bedoeld
      in [artikel 27, eerste lid, onderdelen ][ref9], wordt de op de voet van [artikel 5, eerste lid][ref10], berekende
      belasting vermeerderd met f 155, alsmede met f 31 per 100 kilogram eigen gewicht boven 500 kilogram tot en met 1000
      kilogram en met f 34 per 100 kilogram eigen gewicht boven 1000 kilogram. De vermeerdering van belasting bedoeld in
      [artikel 5, tweede lid][ref11], wordt vermeerderd met f 31 per 100 kilogram eigen gewicht tot en met 1000 kilogram
      en met f 34 per 100 kilogram eigen gewicht boven 1000 kilogram.

      3 Onder de in het eerste en tweede lid bedoelde minerale oliën worden begrepen mengsels van de minerale oliën met
      hiertoe door Onze Minister, al dan niet voorwaardelijk, aangewezen stoffen.


