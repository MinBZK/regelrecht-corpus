  - number: '17'
    text: |-
      1 Hij die niet voldoet aan de hem bij [artikel 15][ref1] opgelegde verplichting het aldaar bedoelde bewijsstuk ter
      inzage te verstrekken, beloopt een administratieve boete van vijfentwintig gulden.

      2 Op de administratieve boete zijn de bepalingen die gelden voor de naheffing,
      [artikel 21, tweede lid, van de Algemene wet inzake rijksbelastingen][ref2] daaronder niet begrepen, van
      overeenkomstige toepassing, met dien verstande dat de naheffingsaanslag wordt opgelegd aan degene die de boete
      heeft belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002534#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel17
