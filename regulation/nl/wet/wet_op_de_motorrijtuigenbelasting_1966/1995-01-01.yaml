        artikel: '21'
  - number: '20'
    text: |-
      Behoudens wettige bevoegdheid tot heffing van tol, de bevoegdheid van de provincies ingevolge de
      [Provinciewet][ref1] tot het heffen van opcenten op de motorrijtuigenbelasting en de bevoegdheid van de gemeenten
      ingevolge de [Gemeentewet][ref2] (*Stb.* 1992, 96) tot het heffen van parkeerbelastingen, wordt terzake van het
      gebruik van de weg met motorrijtuigen geen belasting geheven door andere publiekrechtelijke lichamen dan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005645
      - id: ref2
        bwb_id: BWBR0005416
  - number: 20a
    text: |-
      Onze Minister kan bij de berekening van de belasting, van de vermeerdering daarvan en van op de belasting geheven
      toeslagen en opcenten alsmede bij de berekening van de teruggaaf van belasting en van de verhoging van de in een
      naheffingsaanslag begrepen belasting de door hem nodig geachte afrondingen doen aanbrengen.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel20a
  - number: '24'
    text: |-
      1 De Motorrijtuigenbelastingwet (*Stb.* 1926, 464) wordt ingetrokken.

      2 De bepalingen van de Motorrijtuigenbelastingwet, daaronder begrepen die betreffende de invordering van niet
      betaalde belasting, blijven van toepassing ten aanzien van strafbare feiten welke zijn begaan vóór het tijdstip
      waarop deze wet geheel in werking treedt.

      3 Onze Minister is bevoegd nadere bepalingen ter zake van de overgang vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel24
  - number: '25'
    text: |-
      Zolang [artikel 4 van het Reglement verkeersregels en verkeerstekens][ref1] (*Stb.* 1966, 181) niet in werking is
      getreden, wordt in [artikel 2, tweede lid][ref2], voor "bromfiets" gelezen: rijwiel met hulpmotor.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002534#Artikel2
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002534
        artikel: '2'
        hoofdstuk: I
  - number: '26'
    text: |-
      1 Deze wet treedt in werking op een door Ons te bepalen tijdstip.

      2 Deze wet kan worden aangehaald als Wet op de motorrijtuigenbelasting, met vermelding van het jaar waarin zij in
      het *Staatsblad* wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel26
