  - number: '15'
    text: |-
      1 Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als zijn bedoeld
      in [artikel 141 van het Wetboek van Strafvordering][ref1], is de bestuurder van een motorrijtuig verplicht het
      rijtuig te doen stilhouden. Degene die ingevolge het bepaalde in [artikel 12][ref2] in het bezit moet zijn van een
      bewijsstuk, is verplicht op eerste vordering van de ambtenaren dat bewijsstuk ter inzage te verstrekken.

      2 De in het eerste lid bedoelde ambtenaren zijn bevoegd een motorrijtuig of een daarmede verbonden rij- of voertuig
      aan een onderzoek te onderwerpen en het voertuig daartoe naar een nabij gelegen plaats te voeren of te doen
      voeren. De bestuurder, bij afwezigheid de houder, of degene die ingevolge het bepaalde in [artikel 12][ref3] in het
      bezit moet zijn van een bewijsstuk, is verplicht desgevorderd zijn tot het onderzoek en het vervoer noodzakelijke
      medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002534#Artikel12
