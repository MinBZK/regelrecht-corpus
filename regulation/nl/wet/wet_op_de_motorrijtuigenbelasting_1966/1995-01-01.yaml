  - number: '7'
    text: |-
      1 Ingeval krachtens [artikel 3, tweede lid][ref1], de belasting niet voor ieder motorrijtuig afzonderlijk wordt
      geheven, bedraagt de belasting over een tijdvak van twaalf maanden:








                    *a.* voor motorrijtuigen op twee wielen


                    f  77;




                    *b.* voor een motorrijtuig als bedoeld in artikel 1, onderdeel *b*,


                    f 388;






                    *c.* voor motorrijtuigen op drie of meer wielen, ingericht voor personenvervoer en wel voor het
      vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen


                    f 103;




                    *d.* voor andere motorrijtuigen


                    f 145.






      2 Wordt met twee of meer motorrijtuigen gelijktijdig de weg gebruikt, dan wordt het in het eerste lid omschreven
      tarief toegepast op elk van die motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002534#Artikel3
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel7
