  - number: '16'
    text: |-
      1 Indien met een motorrijtuig de weg is gebruikt zonder dat vooraf de belasting is betaald, kan deze worden
      nageheven op de voet van [Hoofdstuk IV van de Algemene wet inzake rijksbelastingen][ref1], met dien verstande dat:

      a. de in de naheffingsaanslag begrepen belasting wordt verhoogd met honderd percent, doch ten minste met f 50, een
      en ander behoudens overeenkomstige toepassing van [artikel 21, tweede lid, van die wet][ref2];

      b. ingeval de houder van het motorrijtuig aannemelijk maakt dat daarvan tegen zijn wil is gebruik gemaakt en dat
      hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen, de naheffingsaanslag wordt opgelegd aan de bestuurder;

      c. belasting waarvan op grond van [artikel 14][ref3] teruggaaf is verzocht, geacht wordt niet te zijn betaald.

      2 De na te heffen belasting wordt berekend over de twaalf maanden die voorafgaan aan het einde van de maand waarin
      de in de aanhef van dit artikel bedoelde gebeurtenis heeft plaatsgehad, zulks onder aftrek van de belasting welke
      voor het motorrijtuig over die tijd reeds was betaald.

      3 Voor een motorrijtuig dat in het krachtens de [Wegenverkeerswet 1994][ref4] aangehouden register van opgegeven
      kentekens is ingeschreven, wordt voor de vraag of en hoeveel te weinig belasting is geheven, afgegaan op de in
      dat register voorkomende gegevens, zulks met inachtneming van de verschillen welke bij ambtelijk onderzoek zijn
      bevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002534#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006622
