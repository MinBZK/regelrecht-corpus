preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving betreffende de motorrijtuigenbelasting aan
    te passen aan de Algemene wet inzake rijksbelastingen en voorts op enkele punten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam "motorrijtuigenbelasting" wordt een belasting geheven ter zake van het gebruik van de weg:

      a. met een motorrijtuig op twee wielen;

      b. met een motorrijtuig dat op de voet van
      [artikel 3 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] wordt aangemerkt als een
      personenauto;

      c. met een ander motorrijtuig dan is bedoeld onder letter *a* of *b*, door daarmede op de weg te rijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: '2'
    text: |-
      1 Onder motorrijtuig wordt verstaan het rij- of voertuig dat is bestemd om anders dan langs spoorstaven te worden
      voortbewogen uitsluitend of mede door een mechanische kracht, op of aan het rij- of voertuig zelf aanwezig.

      2 Met afwijking van het eerste lid wordt niet als motorrijtuig aangemerkt een bromfiets in de zin van de
      wegenverkeerswetgeving.

      3 Onder weg wordt verstaan elke voor het openbaar rij- of ander verkeer openstaande weg en elk zodanig pad, de in
      de weg of het pad liggende bruggen en duikers alsmede de tot de weg behorende paden en bermen of zijkanten.

      4 Als weg wordt niet aangemerkt een weg of pad, niet in beheer bij een publiekrechtelijk lichaam.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel2
  - number: '3'
    text: |-
      1 De belasting wordt geheven voor elk motorrijtuig afzonderlijk.

      2 Onze Minister kan, onder door hem te stellen voorwaarden, met betrekking tot motorrijtuigen die deel uitmaken
      van een zelfde fabrieks- of handelsvoorraad of bij een zelfde bedrijf in herstelling zijn en waarmede uitsluitend
      in verband daarmede de weg wordt gebruikt, toestaan dat de belasting niet voor elk motorrijtuig afzonderlijk wordt
      geheven.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel3
  - number: '4'
    text: |-
      1 De belasting wordt geheven van de houder van het motorrijtuig.

      2 Met betrekking tot een motorrijtuig dat is ingeschreven in het krachtens de [Wegenverkeerswet 1994][ref1]
      aangehouden register van opgegeven kentekens, wordt, tenzij anders blijkt, als houder beschouwd degene op wiens
      naam het voor het motorrijtuig opgegeven kenteken in dat register is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '5'
    text: |-
      1 De belasting bedraagt over een tijdvak van twaalf maanden:








                    *a.* voor een motorrijtuig op twee wielen, met een eigen gewicht van





                    niet meer dan 60 kilogram


                    f  31






                    meer dan 60 doch niet meer dan 120 kilogram


                    f  62




                    meer dan 120 doch niet meer dan 200 kilogram


                    f  92




                    meer dan 20 kilogram


                    f 109;




                    *b.* voor een motorrijtuig als bedoeld in artikel 1, onderdeel *b*, met een eigen gewicht van niet
      meer dan 200 kilogram


                    f  93




                    meer dan 200 doch niet meer dan 500 kilogram


                    f 112




                    600 kilogram


                    f 137




                    700 kilogram


                    f 164




                    800 kilogram


                    f 222




                    900 kilogram


                    f 285




                    1000 kilogram


                    f 388




                    meer dan 100 kilogram


                    f 388




                    benevens per 100 kilogram eigen gewicht boven 1000 kilogram


                    f 103;




                    *c.* voor een motorrijtuig op drie of meer wielen, ingericht voor personenvervoer en wel voor het
      vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen


                    f  26




                    benevens per 100 kilogram eigen gewicht boven 1000 kilogram


                    f  10;




                    *d.* voor een ander motorrijtuig met een eigen gewicht van





