        artikel: '3'
        hoofdstuk: I
  - number: '8'
    text: |-
      1 Als tijdvak waarover de belasting kan worden voldaan, geldt in elk geval een tijdvak van twaalf of van drie
      maanden.

      2 In de gevallen waarin voldoening van de belasting over een ander tijdvak dan twaalf maanden is toegestaan,
      bedraagt de belasting over een tijdvak van:

      a. een of meer maanden: een naar evenredigheid van het aantal maanden uit de belasting over een tijdvak van twaalf
      maanden herleid bedrag, vermeerderd met f 2,-;

      b. minder dan drie dagen: per dag 1/100 van de belasting over een tijdvak van twaalf maanden;

      c. meer dan twee doch minder dan vijftien dagen: per dag 1/120 van de belasting over een tijdvak van twaalf
      maanden;

      d. meer dan veertien dagen doch minder dan een maand: per dag 1/300 van de belasting over een tijdvak van twaalf
      maanden;

      e. vijftien of meer willekeurige binnen een jaar vallende dagen: per dag 1/240 van de belasting over een tijdvak
      van twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel8
  - number: '9'
    text: |-
      1 Onder door Ons bij algemene maatregel van bestuur te stellen voorwaarden wordt vrijstelling van belasting
      verleend voor:

      a. motorrijtuigen die deel uit maken van een fabrieks- of handelsvoorraad en uitsluitend worden gebezigd voor
      een proefrit of rechtstreeks worden vervoerd van of naar de fabriek of het magazijn, naar of van de plaats van
      aflevering binnenslands of naar of van de grens;

      b. motorrijtuigen, gehouden door een openbaar lichaam en uitsluitend gebezigd voor de defensie, de politie, de
      brandweer, de reinigingsdienst, de ontsmettingsdienst, de schooltandverzorging, de keuringsdienst van waren, de
      vleeskeuringsdienst of het vervoer van voor vernietiging bestemd vee;

      c. motorrijtuigen, ingericht en uitsluitend gebezigd voor de aanleg en het onderhoud van wegen, alsmede stoom- en
      motorwalsen voor zover daaronder niet reeds begrepen;

      d. motorrijtuigen, ingericht en uitsluitend gebezigd voor het vervoer van zieken;

      e. motorrijtuigen, ingericht en uitsluitend gebezigd voor het vervoer van zieke en gewonde dieren;

      f. motorrijtuigen, ingericht voor het gebruik elders dan op wegen en uitsluitend gebezigd voor het landbouwbedrijf;

      g. motorrijtuigen die kennelijk slechts kunnen worden bestuurd door iemand die zich niet op het voertuig bevindt;

      h. motorrijtuigen, ingericht en uitsluitend gebezigd als rijdend uitleenbureau van boeken en tijdschriften en
      gehouden door lichamen, welker werkzaamheid uitsluitend of nagenoeg uitsluitend bestaat uit het in stand houden van
      openbare leeszalen en bibliotheken;

      i. een motorrijtuig op drie of meer wielen, ingericht voor personenvervoer en wel voor het vervoer van niet
      meer dan acht personen, de bestuurder daaronder niet begrepen, dat blijkens een ingevolge de Wet personenvervoer
      ( *Stb.* 1987, 175) afgegeven vergunning, dan wel voor zover afgegeven een vergunningbewijs, is bestemd om openbaar
      vervoer of taxivervoer te verrichten en uitsluitend daarvoor wordt gebezigd;

      j. motorrijtuigen die zijn verbonden met een rij- of voertuig, niet zijnde een motorrijtuig, dat een eigen gewicht
      heeft van niet meer dan 450 kilogram, voor dat deel van de belasting dat ter zake van het verbonden zijn met dat
      rij- of voertuig wordt geheven.

      2 Met een openbaar lichaam wordt gelijkgesteld een lichaam waarvan uitsluitend Nederlandse publiekrechtelijke
      rechtspersonen onmiddellijk of middellijk aandeelhouders, deelnemers of leden zijn, alsmede een lichaam waarvan
      de bestuurders uitsluitend door Nederlandse publiekrechtelijke rechtspersonen onmiddellijk of middellijk
      worden benoemd en ontslagen en waarvan het vermogen bij liquidatie uitsluitend ter beschikking van Nederlandse
      publiekrechtelijke rechtspersonen komt.

      3 Wij behouden Ons voor gehele of gedeeltelijke vrijstelling van belasting te verlenen voor motorrijtuigen waarvan
      de houder niet hier te lande woont of is gevestigd, zulks met inachtneming van het beginsel van wederkerigheid
      indien in het land waar die houder woont of is gevestigd en het motorrijtuig is ingeschreven een soortgelijke
      belasting wordt geheven.

      4 Wij behouden Ons voor bij algemene maatregel van bestuur in bijzondere gevallen of groepen van gevallen onder
      daarbij te stellen voorwaarden gehele of gedeeltelijke vrijstelling van belasting te verlenen.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel9
  - number: '10'
    text: |-
      1 De over een tijdvak verschuldigde belasting wordt geheven bij wege van voldoening op aangifte.

      2 De belasting moet worden betaald voordat het gebruik van de weg met het motorrijtuig aanvangt.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan omtrent de aangifte regelen geven welke afwijken van
      [Hoofdstuk II van de Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301).


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: II
  - number: '12'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur, ter verzekering van de heffing van de belasting, regelen
      te geven ingevolge welke in de daarbij bepaalde gevallen de weg niet met een motorrijtuig mag worden gebruikt
      zonder dat degene die bij die regelen daartoe is aangewezen in het bezit is van een bij of krachtens die regelen
      aangewezen bewijsstuk volgens hetwelk voor dat motorrijtuig de belasting is voldaan, dan wel niet is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel12
  - number: '13'
    text: |-
      1 Ingeval de houder van een motorrijtuig dit door een ander vervangt, wordt de voor het vervangen motorrijtuig
      over de nog niet verstreken halve maanden van het lopende tijdvak betaalde belasting op zijn verzoek verrekend
      met de belasting over die halve maanden voor het vervangende motorrijtuig, met dien verstande dat, indien de
      laatstbedoelde belasting lager is dan de betaalde, teruggaaf van het verschil slechts plaats vindt over nog niet
      ingetreden halve maanden. Onder een halve maand wordt verstaan een periode van de eerste tot en met de vijftiende
      dan wel van de zestiende tot en met de laatste dag van een kalendermaand.

      2 Een motorrijtuig dat een zodanige verandering heeft ondergaan, dat de belasting hoger of lager is, wordt voor de
      toepassing van het eerste lid geacht te zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0002534/1995-01-01#Artikel13
  - number: '14'
    text: |-
      1 Teruggaaf wordt slechts verleend van belasting, betaald:

      a. voor motorrijtuigen als zijn bedoeld in [artikel 5, eerste lid, letters ][ref1], over de op het tijdstip van een
      daartoe strekkend verzoek nog niet ingetreden maanden van het tijdvak;

      b. voor motorrijtuigen als zijn bedoeld in [artikel 5, eerste lid, letters ][ref2], over de op het tijdstip van een
      daartoe strekkend verzoek nog niet ingetreden halve maanden van het tijdvak.

      Onder een halve maand wordt verstaan een periode van de eerste tot en met de vijftiende dan wel van de zestiende
      tot en met de laatste dag van een kalendermaand.

      2 Het in [artikel 8, tweede lid, letter ][ref3], genoemde bedrag van f 2 komt niet voor teruggaaf in aanmerking.
      Op de teruggaaf van belasting, betaald over een tijdvak van twaalf maanden, wordt een bedrag van f 2 in mindering
      gebracht.

      3 Het verzoek geschiedt bij een aangifte waarvan Onze Minister het formulier vaststelt. De inspecteur beslist op
      het verzoek bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002534#Artikel5
