      3 Verstaan wordt onder:

      a. de meter: de lengte van de weg die het licht in vacuüm aflegt in een tijd van 1/299 792 458 seconde;

      b. het kilogram: de massa van het prototype van platina-iridium, dat door de Derde Algemene Conferentie voor maten
      en gewichten tot eenheid van massa is verklaard en dat wordt bewaard in het Internationale Bureau voor maten en
      gewichten te Sèvres bij Parijs;

      c. de seconde: de tijdsduur van 9 192 631 770 perioden van de straling, overeenkomend met de overgang tussen de
      twee hyperfijnniveaus van de grondtoestand van het atoom cesium 133;

      d. de ampère: de constante elektrische stroom die, indien hij geleid wordt door twee evenwijdige, rechtlijnige en
      oneindig lange geleiders van te verwaarlozen cirkelvormige doorsnede, welke geplaatst zijn in het luchtledige op
      een onderlinge afstand van 1 meter, tussen deze twee geleiders voor elke meter lengte een kracht veroorzaakt gelijk
      aan 0,000 0002 kilogram meter per secondekwadraat;

      e. de kelvin: de thermodynamische temperatuur, die gelijk is aan het 1/273,16 gedeelte van de thermodynamische
      temperatuur van het tripelpunt van water;

      f. de mol: de hoeveelheid stof van een systeem dat evenveel elementaire entiteiten bevat als er atomen zijn in
      0,012 kilogram koolstof 12;

      g. de candela: de lichtsterkte, in een gegeven richting, van een bron die een monochromatische straling met een
      frequentie van 540 x 1012 per seconde uitzendt en waarvan de stralingssterkte in die richting 1/683 kilogram
      meterkwadraat per seconde tot de derde macht per steradiaal is;

      h. de radiaal: de vlakke hoek tussen twee stralen van een cirkel, die op de omtrek een boog afsnijden waarvan de
      lengte gelijk is aan die van de straal;

      i. de steradiaal: de ruimtehoek van een kegel die, indien zijn top samenvalt met het middelpunt van een bol, een
      oppervlakte van die bol afsnijdt, gelijk aan die van een vierkant met een zijde van een lengte, gelijk aan die van
      de straal van de bol.

      4 De krachtens het eerste lid, onder b, aangewezen meeteenheden worden bij algemene maatregel van bestuur
      omschreven. Daarbij worden tevens de aanduidingen van die meeteenheden vastgesteld.

      5 Indien de hoeveelheid stof wordt uitgedrukt in mol, worden de elementaire entiteiten, bedoeld in het derde lid,
      onder f, gespecificeerd in atomen, moleculen, ionen, elektronen, andere deeltjes of bepaalde groeperingen van
      andere deeltjes.


