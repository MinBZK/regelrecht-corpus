  - number: '16'
    text: |-
      1 Eigenaren, gebruikers of houders van maten, gewichten, meet- of weegwerktuigen of meetinstrumenten, waarvoor bij
      of krachtens [artikel 6][ref1] voorschriften zijn gegeven, kunnen van de ijkinstelling te allen tijde verlangen,
      dat wordt onderzocht of die voorwerpen voldoen aan de vorenbedoelde daarvoor gegeven voorschriften.

      2 Voorwerpen, welke bij het onderzoek niet aan de bij of krachtens [artikel 6][ref2] gegeven voorschriften blijken
      te voldoen, kunnen van een door Ons vast te stellen afkeuringsmerk worden voorzien en mogen niet weer in gebruik
      worden genomen, alvorens zij zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
