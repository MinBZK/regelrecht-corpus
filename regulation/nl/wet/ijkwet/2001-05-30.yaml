  - number: '8'
    text: |-
      1 Het is verboden op plaatsen als bedoeld in het eerste lid van het vorige artikel, ter bepaling van maat of
      gewicht gebruik te maken van:

      a. valse maten, gewichten, meet- en weegwerktuigen;

      b. andere voorwerpen dan met deze wet of Onze ter uitvoering daarvan genomen besluiten overeenkomstige maten,
      gewichten, meet- en weegwerktuigen;

      c. maten, meet- en weegwerktuigen, waarop bijzondere kentekenen voorkomen met het kennelijk doel om daarmede maat
      of gewicht te bepalen naar andere grondslagen en aanduidingen, dan ingevolge deze wet geldende;

      d. maten, gewichten, meet- en weegwerktuigen, in strijd met de voorschriften, gegeven krachtens het bepaalde in
      [het zesde lid van artikel 6][ref1];

      e. maten, gewichten, meet- en weegwerktuigen als bedoeld in [artikel 6, zevende lid][ref2], in strijd met hun
      bestemming.

      2 De verbodsbepalingen van het eerste lid onder b en c gelden niet ten aanzien van meetwerktuigen als bedoeld
      in [artikel 6, derde lid, tweede volzin][ref3], zolang met betrekking tot deze door Ons geen voorschriften zijn
      gegeven.

      3 [Artikel 7, derde lid][ref4], is van overeenkomstige toepassing.


