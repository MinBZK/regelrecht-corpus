      2 Het duizendste deel van het kilogram is het gram, waarvan het symbool g is. De in het eerste lid bedoelde
      decimale veelvouden en delen van het kilogram, worden, indien zij niet worden aangeduid door een getal voor de naam
      of het symbool van deze meeteenheid, uitgedrukt in het gram.

      3 Bij algemene maatregel van bestuur worden regelen gesteld omtrent de aanduiding van decimale veelvouden en delen
      van de in [artikel 1, eerste lid, onder b][ref2], bedoelde meeteenheden.

      4 Bij algemene maatregel van bestuur kunnen ten aanzien van erkende meeteenheden beperkingen in hun gebruik worden
      vastgesteld.

      5 Bij algemene maatregel van bestuur kan in verband met de uitvoering van, ingevolge het Verdrag tot oprichting van
      de Europese Gemeenschap bindende, door de Raad van de Europese Unie, het Europees Parlement en de Raad gezamenlijk
      of de Commissie van de Europese Gemeenschappen op het terrein van de metrologie genomen besluiten worden bepaald,
      dat een bij die maatregel genoemde grootheid in daarbij omschreven gevallen niet anders mag worden uitgedrukt dan
      in de erkende meeteenheid of meeteenheden, die bij die maatregel voor die gevallen is of zijn voorgeschreven.


