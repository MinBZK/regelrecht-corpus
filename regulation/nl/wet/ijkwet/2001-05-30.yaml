  - number: 29a
    text: |-
      1 Onze Minister kan beleidsregels vaststellen met betrekking tot het toezicht op de naleving van het bepaalde bij
      of krachtens deze wet.

      2 De ijkinstelling draagt er zorg voor, dat de toezichthouders bij het toezicht rekening houden met bevindingen van
      ter zake kundige natuurlijke personen en rechtspersonen, die in de uitoefening van een beroep of bedrijf meet- en
      weegwerktuigen en meetinstrumenten controleren of onderhouden.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel29a
  - number: 29c
    text: |-
      De toezichthouders zijn bevoegd maten, gewichten, meet- en weegwerktuigen en meetinstrumenten waarvoor
      bij of krachtens [artikel 6][ref1] voorschriften zijn gegeven en die bij het onderzoek, bedoeld in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2] niet aan die voorschriften blijken te voldoen, van een bij
      algemene maatregel van bestuur vast te stellen afkeuringsmerk te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: 29d
    text: |-
      Zo nodig oefent de toezichthouder de in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] genoemde bevoegdheid
      uit met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: 29g
    text: |-
      Indien de verplichting, bedoeld in [artikel 5:20 van de Algemene wet bestuursrecht][ref1], in onvoldoende mate is
      nageleefd, kunnen op kosten van de nalatige de nodige maatregelen worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: 29h
    text: |-
      1 Onze Minister kan van de ijkinstelling de inlichtingen verlangen, die hij nodig acht voor de uitvoering van deze
      wet.

      2 De ijkinstelling is verplicht de ingevolge het eerste lid verlangde inlichtingen volledig en naar waarheid te
      verstrekken op de door Onze Minister aan te geven wijze en binnen de door deze te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel29h
  - number: 29j
    text: |-
      Indien door de ijkinstelling of door een ijkbevoegde bij een vorm van onderzoek, vastgesteld bij of
      krachtens deze wet, bij een keuring of herkeuring van een voorwerp daaraan de goedkeuring niet wordt
      verleend of indien niet overeenkomstig een verzoek, gedaan ingevolge het bij of krachtens deze wet bepaalde,
      wordt beslist dan wel indien bij een onderzoek als bedoeld in [artikel 16, eerste lid][ref1], of in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2] een voorwerp, al dan niet onder het aanbrengen van een
      afkeuringsmerk, wordt bevonden niet aan de daarvoor bij of krachtens deze wet gegeven voorschriften te voldoen,
      wordt daarvan, voor zover bij of krachtens deze wet niet anders is bepaald, door respectievelijk de ijkinstelling
      en de ijkbevoegde aan de betrokkene onder opgave van redenen mededeling gedaan en geschiedt die mededeling alleen
      schriftelijk, voor zover de betrokkene daarom uitdrukkelijk vraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
