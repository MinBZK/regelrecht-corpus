    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Economische Zaken;

      ijkinstelling: de krachtens [artikel 22, eerste lid][ref1], aangewezen rechtspersoon;

      ijkbevoegde: de natuurlijke persoon of rechtspersoon, aan wie ingevolge [artikel 26b, eerste lid][ref2], een
      erkenning is verleend;

      toezichthouders: de krachtens [artikel 29, eerste lid][ref3], aangewezen personen.


