  - number: '13'
    text: |-
      1 De bij keuring of herkeuring goedgekeurde voorwerpen als in [artikel 10][ref1] bedoeld worden ten bewijze van
      die goedkeuring voorzien van een of meer uit twee delen bestaande ijkmerken. Het model van die ijkmerken wordt bij
      algemene maatregel van bestuur vastgesteld.

      2 Bij algemene maatregel van bestuur wordt in afwijking van het eerste lid bepaald dat ten aanzien van daarbij
      aangewezen voorwerpen, wegens hun samenstelling of afmetingen, bij de keuring of herkeuring in geval van
      goedkeuring ijkmerken of delen daarvan niet worden aangebracht. Bij die maatregel wordt tevens bepaald ten aanzien
      van welke van die voorwerpen wordt volstaan met het aanbrengen van delen van ijkmerken en ten aanzien van welke van
      die voorwerpen het aanbrengen van ijkmerken geheel of ten dele wordt vervangen door de afgifte van een gewaarmerkte
      verklaring, waarin de bij die maatregel vast te stellen gegevens worden vermeld.

      3 Voorwerpen die bij de herkeuring niet meer aan de bij of krachtens [artikel 6][ref2] gegeven voorschriften
      blijken te voldoen, worden voorzien van een afkeuringsmerk, waarvan het model bij algemene maatregel van bestuur
      wordt vastgesteld.

      4 Onze Minister kan regelen stellen omtrent de wijze waarop en de middelen waarmee voorwerpen als in
      [artikel 10][ref3] bedoeld van ijkmerken of afkeuringsmerken moeten worden voorzien, alsmede omtrent de plaats van
      die merken.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel10
