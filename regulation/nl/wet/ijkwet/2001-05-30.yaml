      1 Er is een Raad van deskundigen voor de nationale standaarden.

      2 De raad bestaat uit ten hoogste negen leden.

      3 De raad heeft tot taak:

      a. toezicht uit te oefenen op het beheer of de verwezenlijking van nationale standaarden van meeteenheden door een
      krachtens [artikel 2, tweede lid][ref1], aangewezen instelling en omtrent dat toezicht jaarlijks aan Onze Minister
      van Economische Zaken een schriftelijk verslag uit te brengen;

      b. de regering en de beide kamers der Staten-Generaal van advies te dienen over aangelegenheden die verband houden
      met standaarden van meeteenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel2
