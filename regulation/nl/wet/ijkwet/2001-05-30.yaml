        paragraaf: '4'
  - number: 26g
    text: |-
      1 De ijkinstelling kan de erkenning intrekken, indien de ijkbevoegde:

      a. daarom verzoekt;

      b. de werkzaamheden waarop de hem verleende erkenning betrekking heeft, niet naar behoren verricht;

      c. niet meer voldoet aan de voor de erkenning gestelde eisen;

      d. handelt in strijd met de aan de erkenning verbonden voorschriften;

      e. voorwerpen waarvoor bij of krachtens [artikel 6][ref1] voorschriften zijn gegeven en met betrekking waartoe
      hem geen erkenning is verleend, voorziet van krachtens deze wet vastgestelde ijkmerken of afkeuringsmerken of ten
      aanzien van die voorwerpen een verklaring als bedoeld in [artikel 13, tweede lid][ref2], afgeeft;

      f. op voorwerpen, waarvoor bij of krachtens [artikel 6][ref3] voorschriften zijn gegeven en die binnen de grenzen
      van zijn bevoegdheid ingevolge artikel 13, eerste lid, van een of meer ijkmerken moeten worden voorzien, een
      kenmerk aanbrengt, dat ingevolge [artikel 26b, derde lid][ref4], voor een ander is vastgesteld;

      g. het bij of krachtens deze wet bepaalde niet naleeft;

      h. maten, gewichten, meet- of weegwerktuigen of meetinstrumenten voorziet van valse of vervalste ijkmerken.

      2 De ijkinstelling doet van een besluit tot intrekking van de erkenning mededeling door plaatsing in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009082#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26g
