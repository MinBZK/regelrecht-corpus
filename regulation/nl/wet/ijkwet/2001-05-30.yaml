  - number: '25'
    text: |-
      1 Een onderzoek, keuring, herkeuring of justering overeenkomstig het bij of krachtens [de artikelen 10][ref1]
      tot en met [18][ref2] en [21a][ref3] bepaalde alsmede de werkzaamheden, voortvloeiende uit het krachtens
      [artikel 21a][ref4] bepaalde met betrekking tot andere voorwerpen dan die waarvoor krachtens [artikel 6][ref5]
      voorschriften zijn gegeven, kunnen door de ijkinstelling worden geweigerd of beëindigd, indien respectievelijk
      de aanbieder, de verzoeker of de eigenaar, gebruiker of houder van een maat, gewicht, meet- of weegwerktuig of
      meetinstrument of degene wiens aanvraag aanleiding is tot de desbetreffende werkzaamheden, voortvloeiende uit het
      krachtens [artikel 21a][ref6] bepaalde:

      a. daarbij niet de van hem verlangde medewerking verleent,

      b. niet voldoet aan zijn financiële verplichtingen jegens de ijkinstelling met betrekking tot werkzaamheden als in
      [artikel 22, eerste lid, onder a][ref7], bedoeld of

      c. niet voldoet aan een verzoek van de ijkinstelling tot betaling vooraf van het bedrag, verschuldigd voor de
      betrokken werkzaamheden, of tot het stellen van zekerheid voor de betaling van dat bedrag dan wel tot betaling van
      een voorschot ter zake van de betrokken werkzaamheden.

      2 De ijkinstelling kan de behandeling van de aanvraag van een ontheffing als bedoeld in [artikel 21c][ref8]
      weigeren of beëindigen, indien:

      a. zich ten aanzien van de aanvrager met betrekking tot de werkzaamheden ter zake van zijn aanvraag feiten voordoen
      als in het eerste lid, onder c bedoeld, of

      b. ten aanzien van de aanvrager het bepaalde in het eerste lid van toepassing is of toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel10
