  - number: '9'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ten aanzien van daarbij aangewezen, ingevolge deze wet aan keuring
      onderworpen maten, gewichten, meet- of weegwerktuigen of meetinstrumenten voorschriften worden gegeven omtrent de
      wijze van opstelling en van gebruik.

      2 Bij algemene maatregel van bestuur kunnen in verband met de uitvoering van een bindend, door de Raad van de
      Europese Unie, het Europees Parlement en de Raad gezamenlijk of de Commissie van de Europese Gemeenschappen genomen
      besluit, als bedoeld in [artikel 4, vijfde lid][ref1], regelen worden gesteld omtrent de methoden, welke bij de
      bepaling van maat of gewicht in bij die maatregel omschreven gevallen moeten worden gevolgd.

      3 De bij een algemene maatregel van bestuur als in het tweede lid bedoeld te stellen regelen kunnen onder
      meer inhouden een verbod op plaatsen als bedoeld in [artikel 7, eerste lid][ref2], of aangewezen krachtens
      [artikel 8, derde lid][ref3], of 21, tweede lid, maat of gewicht te bepalen in strijd met het bij die maatregel
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel8
