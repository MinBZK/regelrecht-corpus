  - number: '22'
    text: |-
      1 Bij koninklijk besluit wordt één in Nederland gevestigde rechtspersoon aangewezen die tot taak heeft met
      inachtneming van het bij of krachtens deze wet bepaalde:

      a. ten aanzien van voorwerpen, waarvoor bij of krachtens [artikel 6][ref1] voorschriften zijn gegeven, de
      werkzaamheden, voortvloeiende uit het bij of krachtens [de artikelen 10][ref2] tot en met [18][ref3], [21a][ref4]
      en [21c][ref5] bepaalde, alsmede werkzaamheden, voortvloeiende uit het met betrekking tot andere dan vorenbedoelde
      voorwerpen krachtens [artikel 21a][ref6] bepaalde, te verrichten;

      b. erkenningen als bedoeld in [artikel 26b][ref7] te verlenen;

      c. zorg te dragen voor de uitoefening van het toezicht op de naleving van het bij of krachtens
      [de artikelen 5][ref8], [5b][ref9] tot en met [14][ref10], [16][ref11] tot en met [21c][ref12],
      [26][ref13], [26a][ref14], [26b, tweede lid][ref15], [26c][ref16], [26d][ref17] tot en met [26f][ref18],
      [27, tweede lid][ref19], en [28, onder b][ref20], bepaalde.

      2 Een aanwijzing als in het eerste lid bedoeld vindt slechts plaats, indien aan de volgende eisen wordt voldaan:

      a. de rechtspersoon dient, voor wat betreft zijn organisatie, personeel en materieel, in staat te zijn de in het
      eerste lid bedoelde taken naar behoren te vervullen en te beschikken over de voor de vervulling van die taken
      nodige standaarden, die zijn herleid naar de nationale standaarden van meeteenheden of naar andere standaarden van
      meeteenheden, die worden beheerd of verwezenlijkt met inachtneming van hetgeen ter zake door de bevoegde organen
      van het verdrag genoemd in artikel 2, derde lid, onder a, in het kader van dat verdrag is bepaald;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige werkwijze binnen de rechtspersoon, dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taken, alsmede naleving van de in de IJkwet neergelegde
      verplichtingen, zoveel mogelijk zijn gewaarborgd.

      3 Wijziging van de statuten van de rechtspersoon behoeft voorafgaande instemming van Onze Minister. Onze
      minister kan zijn instemming slechts onthouden, indien de statuten na wijziging onvoldoende zouden zijn
      afgestemd op de in het eerste en tweede lid bedoelde taken en eisen. De [artikelen 10:28][ref21] tot en met
      [10:31 van de Algemene wet bestuursrecht][ref22] zijn van overeenkomstige toepassing.

      4 Een aanwijzing als in het eerste lid bedoeld kan worden ingetrokken, indien de betrokken rechtspersoon daarom
      verzoekt of indien deze rechtspersoon een of meer van de in het eerste lid bedoelde taken niet naar behoren
      vervult of niet meer voldoet aan de in het tweede lid bedoelde eisen of het bij of krachtens deze wet bepaalde
      niet naleeft.

      5 Van een beschikking tot aanwijzing of tot intrekking van de aanwijzing als in respectievelijk het eerste en
      vierde lid bedoeld, wordt mededeling gedaan door plaatsing in de Staatscourant.


