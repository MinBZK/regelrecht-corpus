      1 Het is verboden in de uitoefening van een beroep of bedrijf bij het vragen, het aanbieden of het leveren van
      goederen of diensten:

      a. een grootheid uit te drukken in een andere dan een erkende meeteenheid, indien voor die grootheid een erkende
      meeteenheid geldt, of in strijd met de krachtens [artikel 4, vijfde lid][ref1], gestelde regelen;

      b. voor een grootheid een benaming te bezigen in strijd met de krachtens [artikel 4a][ref2] gestelde regelen.

      2 Onze Minister van Economische Zaken kan vrijstelling verlenen van het bepaalde in het eerste lid.


