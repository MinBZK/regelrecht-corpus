    text: |-
      1 Van de erkende meeteenheden, bedoeld in [artikel 1, eerste lid][ref1], worden nationale standaarden beheerd of
      verwezenlijkt, indien zulks ten aanzien van zulk een meeteenheid bij algemene maatregel van bestuur is bepaald. Bij
      een algemene maatregel van bestuur als bedoeld in de vorige volzin kunnen regelen worden gesteld over de wijze van
      beheer of verwezenlijking van de betrokken nationale standaard.

      2 Indien het eerste lid toepassing vindt, wordt bij koninklijk besluit één in Nederland gevestigde instelling
      aangewezen die tot taak heeft de nationale standaard van de betrokken meeteenheid te beheren of te verwezenlijken.

      3 Voor een aanwijzing krachtens het tweede lid komt slechts in aanmerking een instelling, die voldoet aan de
      volgende eisen:

      a. zij dient voor wat betreft organisatie, personeel en materieel zodanig te zijn ingericht, dat het beheer of de
      verwezenlijking van de nationale standaard van de betrokken meeteenheid kan worden verricht met inachtneming van
      hetgeen ter zake door de bevoegde organen van het op 20 mei 1875 te Parijs gesloten Verdrag ter verzekering van
      de internationale eenheid en de volmaking van het metrieke stelsel (Stb. 1929, 219) in het kader van dat Verdrag
      is bepaald of in overeenstemming met het ter zake bepaalde in een, ingevolge het Verdrag tot oprichting van de
      Europese Gemeenschap bindend, door de Raad van de Europese Unie, het Europees Parlement en de Raad gezamenlijk of
      de Commissie van de Europese Gemeenschappen genomen besluit;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de instelling, dat een
      onafhankelijke vervulling van de in het tweede lid bedoelde taak zo veel mogelijk gewaarborgd is.

      4 Een krachtens het tweede lid aangewezen instelling dient de standaarden van de ijkinstelling, aangewezen
      krachtens [artikel 22, eerste lid][ref2], en van ijkbevoegden als bedoeld in [artikel 26b, eerste lid][ref3], op
      hun verzoek te herleiden naar de nationale standaard van de betrokken meeteenheid.

      5 De aanwijzing, bedoeld in het tweede lid, kan worden ingetrokken, indien de betrokken instelling daarom verzoekt
      of indien blijkt dat de betrokken instelling de krachtens het eerste lid gestelde regelen niet naleeft, niet meer
      voldoet aan het bepaalde in het derde lid of handelt in strijd met het bepaalde in het vierde lid dan wel de Raad
      van deskundigen, bedoeld in [artikel 3, eerste lid][ref4], niet in de gelegenheid stelt het in het derde lid, onder
      a, van dat artikel bedoelde toezicht uit te oefenen.

      6 Van een beschikking tot aanwijzing of tot intrekking van de aanwijzing als in respectievelijk het tweede en
      vijfde lid bedoeld, wordt mededeling gedaan door plaatsing in de Staatscourant.


