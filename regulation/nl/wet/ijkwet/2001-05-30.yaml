  - number: '10'
    text: |-
      1 Alvorens hetzij ten verkoop aangeboden of in de handel gebracht, hetzij, indien niet ten verkoop aangeboden of
      in de handel gebracht, in gebruik genomen te worden, ondergaan de maten, gewichten, meet- en weegwerktuigen en
      meetinstrumenten, ten aanzien waarvan bij of krachtens [artikel 6][ref1] voorschriften zijn gegeven, een keuring.

      2 Wij behouden Ons voor, bepaalde inhoudsmaten van de in het vorige lid bedoelde keuring vrij te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '6'
        paragraaf: '2'
  - number: 10a
    text: |-
      Met de maten, gewichten, meet- en weegwerktuigen en meetinstrumenten die de in [artikel 10, eerste lid][ref1],
      bedoelde keuring hebben ondergaan, worden gelijkgesteld maten, gewichten, meet- en weegwerktuigen en
      meetinstrumenten die in een andere lid-staat van de Europese Unie dan wel in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte rechtmatig zijn geproduceerd of in de handel zijn gebracht
      en die door een gelijkwaardige, door die andere staat erkende instantie zijn gekeurd, mits bij de keuringen aan
      gelijkwaardige eisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel10
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '10'
        paragraaf: '3'
  - number: '11'
    text: |-
      1 De keuring geschiedt stuksgewijze, voor zover krachtens [artikel 14][ref1] niet anders is bepaald.

      2 De keuring heeft slechts plaats, nadat een model van het betrokken voorwerp ingevolge [artikel 11a][ref2] is
      onderzocht en toegelaten.

      3 Onze Minister kan bij ministeriële regeling bepalen, dat het tweede lid niet geldt ten aanzien van door hem
      aangewezen categorieën van maten, gewichten, meet- of weegwerktuigen of meetinstrumenten.

      4 De keuring wordt voor nieuwe en reeds in gebruik zijnde voorwerpen herhaald:

      a. gedurende door Ons vast te stellen tijdvakken, waarbij aan Gedeputeerde Staten der onderscheidene provincies
      door Ons kan worden opgedragen, het tijdvak voor elke gemeente te bepalen en dit openlijk bekend te maken;

      b. alvorens de voorwerpen te gebruiken, na herstellingen of veranderingen, die een veranderde inhoud, een veranderd
      gewicht of onjuiste aanwijzingen ten gevolge zouden kunnen hebben, alsmede na schending van ijkmerken als in
      [artikel 13][ref3] bedoeld;

      c. op verzoek van de eigenaar of gebruiker.

      5 Wij behouden Ons voor, bepaalde maten, gewichten, meet- en weegwerktuigen en meetinstrumenten van de herkeuring
      vrij te stellen.

      6 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven, waaraan bij de aanvraag tot
      keuring of herkeuring moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel13
