      1 Het is verboden op plaatsen als bedoeld in [het eerste lid van artikel 7][ref1] aan keuring of herkeuring
      onderworpen maten, gewichten, meet- en weegwerktuigen, die van een afkeuringsmerk of niet van de vereiste ijkmerken
      zijn voorzien, te bezitten of voorhanden te hebben.

      2 Het bepaalde in [artikel 7, tweede lid onder a][ref2], vindt overeenkomstige toepassing.

      3 [Artikel 7, derde lid][ref3], is van overeenkomstige toepassing.


