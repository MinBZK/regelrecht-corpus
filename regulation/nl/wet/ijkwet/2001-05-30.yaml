  - number: '27'
    text: |-
      1 De ijkinstelling neemt bij de uitoefening van haar taak algemene aanwijzingen in acht, die door Onze
      Minister in verband met de uitvoering van een bindend, door de Raad van de Europese Unie, het Europees
      Parlement en de Raad gezamenlijk of de Commissie van de Europese Gemeenschappen genomen besluit, als bedoeld in
      [artikel 4, vijfde lid][ref1], worden gegeven.

      2 Ten aanzien van de ijkbevoegden en met betrekking tot de uitoefening van hun bevoegdheden is het bepaalde in het
      eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel4
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel27
