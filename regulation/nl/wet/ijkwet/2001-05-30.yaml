  - number: 29k
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel29k
  - number: '30'
    text: |-
      Maten en gewichten, welke op het tijdstip van inwerkingtreding van deze wet van een geldig goedkeuringsmerk
      zijn voorzien, worden geacht krachtens deze wet te zijn goedgekeurd. Zij worden, wanneer zij niet
      met deze wet of Onze ter uitvoering daarvan genomen besluiten in overeenstemming zijn, niettemin na
      de in [artikel 11][ref1] bedoelde herkeuring goedgekeurd, mits zij voldoen aan de bij of krachtens
      de IJkwet (Stb. 1989, 10) gestelde eisen. Op de aldus goedgekeurde voorwerpen is het bepaalde in
      [de artikelen 7, eerste lid, onder b, en 8, eerste lid, onder b][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel7
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel30
    references:
