  - number: 21a
    text: |-
      1 Bij algemene maatregel van bestuur kunnen in verband met de uitvoering van een bindend, door de Raad van de
      Europese Unie, het Europees Parlement en de Raad gezamenlijk of de Commissie van de Europese Gemeenschappen genomen
      besluit, als bedoeld in [artikel 4, vijfde lid][ref1], regelen worden gesteld ten aanzien van bij die maatregel
      aangewezen maten, gewichten, meet- of weegwerktuigen, meetinstrumenten, onderdelen van of hulpinrichtingen voor
      die voorwerpen.

      2 Bij zodanige algemene maatregel van bestuur kan worden bepaald, dat ten aanzien van daarbij aangewezen voorwerpen
      als in het eerste lid bedoeld een of meer van de bepalingen, vastgesteld bij of krachtens [de artikelen 6][ref2],
      [7, eerste lid, onder b][ref3], en in verband daarmede derde lid, 8, eerste lid, onder b, en in verband daarmede
      derde lid, 10 tot en met 16, 19, 20 en 21 niet gelden.

      3 De bij een algemene maatregel van bestuur, als in het eerste lid bedoeld, te stellen regelen kunnen onder meer
      inhouden:

      a. een verbod om een modelgoedkeuringsteken van de Europese Gemeenschap in strijd met het bij of krachtens die
      maatregel bepaalde aan te brengen op bij die maatregel aangewezen voorwerpen;

      b. een verbod om op plaatsen als bedoeld in [artikel 7, eerste lid][ref4], of aangewezen krachtens
      [artikel 8, derde lid][ref5], of 21, tweede lid, ter bepaling van maat of gewicht gebruik te maken van bij
      die maatregel aangewezen maten, gewichten, meet- of weegwerktuigen of meetinstrumenten - voor zover voor
      deze meetmiddelen [artikel 10, eerste lid][ref6], geldt doch [artikel 11, vierde lid][ref7], niet geldt - na
      herstellingen of veranderingen die een veranderde inhoud, een veranderd gewicht of een onjuiste aanwijzing ten
      gevolge zouden kunnen hebben, alvorens zij in overeenstemming met die maatregel opnieuw ter keuring zijn aangeboden
      en daarbij zijn goedgekeurd;

      c. een verbod om op plaatsen als bedoeld in [artikel 7, eerste lid][ref8], of aangewezen krachtens
      [artikel 8, derde lid][ref9], of [artikel 21, tweede lid][ref10], ter bepaling van maat of gewicht in bij
      die maatregel omschreven gevallen gebruik te maken van andere maten, gewichten, meet- of weegwerktuigen of
      meetinstrumenten dan die, welke in overeenstemming met die maatregel van een geldig merk of teken van de Europese
      Gemeenschap zijn voorzien;

      d. een verbod om ter bepaling van maat gebruik te maken van bij die maatregel aangewezen inhoudsmaten, die bestemd
      of geschikt zijn om met een zich daarin bevindend goed te worden afgeleverd, in andere dan bij die maatregel
      omschreven gevallen of op andere dan bij die maatregel aangewezen plaatsen, waar een beroep of bedrijf wordt
      uitgeoefend;

      e. een verbod om bij die maatregel aangewezen lege inhoudsmaten, als [onder d][ref11] bedoeld, ten verkoop
      voorhanden te hebben, ten verkoop aan te bieden of in de handel te brengen in strijd met het bij of krachtens die
      maatregel bepaalde;

      f. een verbod om maten, gewichten, meet- en weegwerktuigen, meetinstrumenten, onderdelen van en hulpinrichtingen
      voor die voorwerpen te voorzien van merken, tekens of andere opschriften, die verward kunnen worden met bij die
      maatregel aangewezen merken of tekens van de Europese Gemeenschap;

      g. toekenning aan Onze Minister van de bevoegdheid tot het ter uitvoering van die regelen stellen van nadere
      regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel4
