  - number: '14'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat in daarbij aangewezen categorieën van gevallen of
      ten aanzien van daarbij aangewezen categorieën van maten, gewichten, meet- of weegwerktuigen of meetinstrumenten,
      waarvoor bij of krachtens [artikel 6][ref1] voorschriften zijn gegeven, de keuring of de herkeuring volgens bij of
      krachtens die maatregel gestelde regelen plaatsvindt aan de hand van een onderzoek van een aantal van de betrokken
      voorwerpen, dat als steekproef is genomen uit een bij die maatregel omschreven partij van die voorwerpen en bij dat
      onderzoek getoetst wordt aan de daarvoor bij of krachtens [artikel 6][ref2] gegeven voorschriften.

      2 Bij of krachtens een maatregel als in het eerste lid bedoeld worden in ieder geval regelen gegeven omtrent de
      maatstaven aan de hand waarvan de uitslag van het onderzoek van de voorwerpen, behorende tot de steekproef, als
      beslissend wordt aangemerkt voor het goedkeuren onderscheidenlijk het niet goedkeuren dan wel afkeuren van de tot
      de partij behorende exemplaren.

      3 Indien toepassing is gegeven aan het eerste lid, wordt de uitslag van het onderzoek van de voorwerpen, behorende
      tot de steekproef, die als beslissend wordt aangemerkt voor het goedkeuren dan wel het niet goedkeuren of afkeuren
      van de tot de partij behorende exemplaren schriftelijk, en, bij niet goedkeuren of afkeuren, onder opgave van
      redenen aan de betrokkene medegedeeld.

      4 Bij een algemene maatregel van bestuur als in het eerste lid bedoeld kan in afwijking van
      [artikel 13, eerste of derde lid][ref3], worden bepaald, dat in daarbij aangewezen gevallen op de betrokken
      voorwerpen bij herkeuring geen ijkmerken of afkeuringsmerken worden aangebracht.

      5 Bij een algemene maatregel van bestuur als in het eerste lid bedoeld kunnen tevens regelen worden gesteld
      betreffende:

      a. het, in afwijking van het bepaalde in [artikel 13, eerste lid][ref4], 22, eerste lid, onder a, en 26,
      voorafgaande aan de keuring aanbrengen van een of meer ijkmerken door degene, die de keuring aanvraagt, en de
      voorwaarden waaraan in verband met het aanbrengen van die ijkmerken moet worden voldaan;

      b. aanduidingen waarmede de te keuren voorwerpen, indien aan het bepaalde [onder a][ref5] toepassing is gegeven,
      moeten zijn voorzien ter identificatie van de partij waartoe die voorwerpen behoren;

      c. de wijze waarop door de aanvrager van de keuring moet worden gehandeld ten aanzien van voorwerpen die
      overeenkomstig regelen, gesteld krachtens het bepaalde [onder a][ref6], zijn voorzien van ijkmerken en bij die
      keuring niet zijn goedgekeurd;

      d. de door de bezitter van voorwerpen, die aan herkeuring overeenkomstig het bij of krachtens het eerste lid
      bepaalde zijn onderworpen, met betrekking tot die voorwerpen te voeren en te bewaren administratie.

      6 Indien toepassing is gegeven aan het derde lid ten aanzien van een krachtens het eerste lid aangewezen categorie
      van voorwerpen en een partij voorwerpen bij herkeuring overeenkomstig regelen, gesteld krachtens het eerste
      lid, niet wordt goedgekeurd, vinden ten aanzien van de bezitter van die partij met betrekking tot de exemplaren,
      behorende tot die partij, de verboden, gesteld bij of krachtens [de artikelen 7, eerste lid, of derde lid][ref7]
      juncto eerste lid, onder b, en 8, eerste lid, onder b, of derde lid juncto eerste lid, onder b, en 20, eerste
      of derde lid, en 21, eerste lid, onder b of e, of tweede lid juncto eerste lid, onder b of e, geen toepassing
      gedurende dertig dagen, te rekenen vanaf de dagtekening van de schriftelijke mededeling, bedoeld in het derde lid.

      7 Een algemene maatregel van bestuur als in het eerste lid bedoeld vindt geen toepassing, indien de verzoeker
      uitdrukkelijk verlangt de keuring of de herkeuring van de bedoelde voorwerpen stuksgewijze te doen geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
