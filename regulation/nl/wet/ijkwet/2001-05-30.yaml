      1 De erkende meeteenheden zijn:

      a. de in het tweede lid genoemde eenheden van lengte, van massa, van tijd, van elektrische stroom, van
      thermodynamische temperatuur, van hoeveelheid stof, van lichtsterkte, van vlakke hoek en van ruimtehoek;

      b. de bij algemene maatregel van bestuur aangewezen meeteenheden, welke van [de onder a][ref1] bedoelde
      meeteenheden worden afgeleid of daarmede samenhangen.

      2 De namen van de eenheden der hieronder genoemde grootheden, alsmede hun symbolen zijn:









