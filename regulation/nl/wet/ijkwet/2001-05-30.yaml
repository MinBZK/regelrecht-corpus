  - number: '21'
    text: |-
      1 Het is verboden op plaatsen als bedoeld in [het eerste lid van artikel 7][ref1] ter bepaling van maat en gewicht
      gebruik te maken van maten, gewichten, meet- en weegwerktuigen:

      a. ten aanzien van welke de daarvoor ingevolge deze wet of Onze ter uitvoering daarvan genomen besluiten
      voorgeschreven keuring of herkeuring niet heeft plaatsgehad;

      b. welke van een afkeuringsmerk zijn voorzien of welke niet van de vereiste ijkmerken zijn voorzien;

      c. in strijd met het bepaalde in [artikel 11, vierde lid, onder b][ref2], en [artikel 16, tweede lid][ref3];

      d. die bij een onderzoek door toezichthouders ingevolge [artikel 29c][ref4] niet aan de daarvoor bij of
      krachtens [artikel 6][ref5] gegeven voorschriften blijken te voldoen doch niet van een afkeuringsmerk als in
      [artikel 29c][ref6] bedoeld zijn voorzien, voor zover die voorwerpen nadien niet alsnog zijn goedgekeurd;

      e. die bij de herkeuring niet zijn goedgekeurd en daarbij ingevolge het krachtens [artikel 14, vierde lid][ref7],
      bepaalde niet van een afkeuringsmerk zijn voorzien, voor zover die voorwerpen nadien niet alsnog zijn goedgekeurd.

      2 [Artikel 7, derde lid][ref8], is van overeenkomstige toepassing.


