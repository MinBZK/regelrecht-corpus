      De raad wordt door Onze Minister van Economische Zaken in de gelegenheid gesteld advies uit te brengen over
      het voornemen tot een aanwijzing ingevolge [artikel 2, tweede lid][ref1], of een intrekking van een aanwijzing
      ingevolge [artikel 2, vijfde lid][ref2], over te gaan.


