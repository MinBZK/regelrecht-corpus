  - number: 11a
    text: |-
      1 Een model wordt niet toegelaten, indien niet de redelijke verwachting bestaat, dat naar het model vervaardigde
      maten, gewichten, meet- of weegwerktuigen of meetinstrumenten aan de bij of krachtens [artikel 6][ref1] gegeven
      voorschriften zullen voldoen.

      2 Van de toelating van een model wordt een ondertekende en gedagtekende verklaring afgegeven volgens een door Ons
      vast te stellen formulier. In deze verklaring kan het voorschrift worden opgenomen, dat het model op een in de
      verklaring vermelde plaats moet worden bewaard. Bij de verklaring wordt een gewaarmerkt afschrift van de in het
      vijfde lid bedoelde tekeningen en beschrijving afgegeven.

      3 De toelating van een model wordt ingetrokken, indien de bij of krachtens [artikel 6][ref2] gegeven voorschriften
      zodanig zijn gewijzigd, dat het model onder de werking van de gewijzigde voorschriften niet zou zijn toegelaten.

      4 De toelating van een model, dat ingevolge het tweede lid moet worden bewaard, wordt ingetrokken, indien het model
      verandering heeft ondergaan of verloren is gegaan en kan worden ingetrokken, indien het model niet op de plaats,
      vermeld in de in dat lid bedoelde verklaring, wordt bewaard.

      5 Bij elke aanvrage om toelating van een model dienen te worden overgelegd tekeningen en een beschrijving, welke
      het model zo volledig mogelijk weergeven. Bij of krachtens algemene maatregel van bestuur worden voorschriften
      gegeven, waaraan bij elke aanvrage tot toelating van een model moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel6
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel11a
