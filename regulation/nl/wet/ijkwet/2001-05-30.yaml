  - number: '31'
    text: |-
      Na de inwerkingtreding van deze wet berusten de krachtens de IJkwet (Stb. 1989, 10) vastgestelde regels en andere
      besluiten op deze wet.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel31
  - number: '32'
    text: De IJkwet (Stb. 1989, 10) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel32
  - number: '33'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel33
  - number: '34'
    text: 'Deze wet wordt aangehaald als: IJkwet.'
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel34
