  - number: 21b
    text: |-
      1 Onze Minister kan ten aanzien van maten, gewichten, meet- en weegwerktuigen en meetinstrumenten vrijstelling of op
      aanvraag ontheffing verlenen van het bepaalde bij of krachtens [artikel 7, eerste lid, onder b, en derde lid][ref1]
      juncto eerste lid, onder b, [artikel 8, eerste lid, onder b, en derde lid][ref2] juncto eerste lid, onder b, en
      [artikel 19][ref3].

      2 Bij het indienen van een aanvraag om ontheffing moet een bedrag worden betaald volgens een bij algemene maatregel
      van bestuur vastgesteld tarief. Onze Minister kan regelen stellen omtrent de wijze van betaling.

      3 Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      voorschriften worden verbonden.

      4 Ten aanzien van een voorwerp waarvoor een vrijstelling of ontheffing geldt, is [artikel 10, eerste lid][ref4],
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel7
