  - number: '23'
    text: |-
      1 De ijkinstelling vestigt in Nederland een of meer kantoren voor de uitoefening van de in
      [artikel 22, eerste lid][ref1], bedoelde taken en maakt in de Staatscourant de plaats van vestiging en het adres
      daarvan bekend.

      2 Indien de ijkinstelling de werkzaamheden in een kantoor beperkt tot een door haar vast te stellen gebied of een
      bepaalde categorie van maten, gewichten, meet- of weegwerktuigen of meetinstrumenten, wordt het besluit daartoe
      door de ijkinstelling in de Staatscourant bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel22
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '22'
        paragraaf: '4'
  - number: '24'
    text: |-
      1 Voor de werkzaamheden, bedoeld in [artikel 22, eerste lid, onder a][ref1], is aan de ijkinstelling een bedrag
      verschuldigd, berekend volgens de door die instelling vastgestelde en in de Staatscourant bekendgemaakte tarieven.

      2 De vaststelling van de tarieven vindt niet plaats, dan nadat zij aan Onze Minister door de ijkinstelling zijn
      gemeld en vervolgens dertig dagen zijn verlopen, zonder dat Onze Minister tegen die tarieven bedenkingen heeft
      geuit.

      3 In afwijking van het tweede lid behoeven besluiten tot vaststelling van tarieven voor het onderzoek tot toelating
      van een model als in [artikel 11, tweede lid][ref2], bedoeld en voor de behandeling van de aanvraag van de
      ontheffing als in [artikel 21c][ref3] bedoeld de goedkeuring van Onze Minister.

      4 Onze Minister kan van de ijkinstelling gegevens verlangen, die voor de beoordeling van haar tarieven volgens de
      maatstaf van het vijfde lid van belang zijn.

      5 Onze Minister kan slechts bedenkingen uiten tegen de tarieven en de in het derde lid bedoelde goedkeuring kan
      worden onthouden, indien de tarieven voor de betrokken werkzaamheden afwijken van die welke voortvloeien uit een
      redelijke toerekening van kosten.

      6 Het besluit omtrent goedkeuring wordt zo spoedig mogelijk, doch uiterlijk binnen acht weken nadat het aan Onze
      Minister is voorgelegd, bekendgemaakt.

      7 De in het derde lid bedoelde besluiten tot vaststelling van tarieven worden door de ijkinstelling eerst na
      goedkeuring door Onze Minister in de *Staatscourant* bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel21c
