  - number: '12'
    text: |-
      Goedkeuring heeft niet plaats van voorwerpen als in [artikel 10][ref1] bedoeld, welke niet aan de bij of krachtens
      [artikel 6][ref2] gegeven voorschriften voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel6
