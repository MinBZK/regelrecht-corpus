  - number: '26'
    text: |-
      Een natuurlijke persoon of rechtspersoon, die in Nederland is gevestigd, is bevoegd met inachtneming van het bij of
      krachtens deze wet bepaalde:

      a. ten aanzien van voorwerpen, waarvoor bij of krachtens [artikel 6][ref1] voorschriften
      zijn gegeven, de werkzaamheden te verrichten, voortvloeiende uit het bij of krachtens
      [de artikelen 11, eerste lid en vierde lid, onder b en c, en 12 tot en met 17][ref2] bepaalde,

      b. ten aanzien van voorwerpen als [onder a][ref3] bedoeld, behorende tot een bij algemene maatregel van
      bestuur daartoe aangewezen categorie, de werkzaamheden te verrichten, voortvloeiende uit het bij of krachtens
      [artikel 11, vierde lid, onder a][ref4], bepaalde,

      c. ten aanzien van voorwerpen als [onder a][ref5] bedoeld, behorende tot een bij algemene maatregel van
      bestuur daartoe aangewezen categorie, de werkzaamheden te verrichten, voortvloeiende uit het bij of krachtens
      [artikel 21a][ref6] bepaalde, zulks met uitzondering van een krachtens [artikel 21a][ref7] vastgestelde vorm van
      keuring, die gelijkwaardig is aan het onderzoek, bedoeld in [artikel 11a][ref8], en als zodanig door Onze Minister
      is aangewezen,.

      d. daartoe bij algemene maatregel van bestuur aangewezen werkzaamheden, voortvloeiend uit het met betrekking tot
      andere dan [onder a][ref9] bedoelde voorwerpen krachtens [artikel 21a][ref10] bepaalde, te verrichten, een en ander
      voor zover hij daartoe door de ijkinstelling is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel26
