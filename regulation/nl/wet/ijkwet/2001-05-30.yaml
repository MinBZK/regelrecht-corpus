preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de IJkwet opnieuw te doen vaststellen teneinde
    te kunnen voldoen aan richtlijn nr. 83/189/EEG van de Raad van de Europese Gemeenschappen van 28 maart 1983
    betreffende een informatieprocedure op het gebied van normen en technische voorschriften (PbEG L 109);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#ArtikelAanhef
