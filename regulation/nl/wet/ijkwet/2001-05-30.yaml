      Het is verboden in de uitoefening van een beroep of bedrijf ten verkoop aan te bieden of in de handel te brengen
      maten, gewichten, meet- of weegwerktuigen of bij algemene maatregel van bestuur aangewezen meetinstrumenten die
      niet de ingevolge [artikel 11][ref1] vereiste keuring of herkeuring hebben ondergaan dan wel bij die keuring of
      herkeuring niet zijn goedgekeurd.


