  - number: '29'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens [de artikelen 5][ref1], [5b][ref2] tot en met
      [14][ref3], [16][ref4] tot en met [21c][ref5], [26][ref6], [26a][ref7], [26b, tweede lid][ref8], [26c][ref9],
      [26d][ref10] tot en met [26f][ref11], [27, tweede lid][ref12], en [28, onder b][ref13], bepaalde zijn belast de bij
      besluit van de ijkstelling aangewezen werknemers van de ijkinstelling.

      2 Onze Minister kan, indien de wijze van uitoefening van het toezicht door een aangewezen werknemer daartoe
      naar zijn oordeel aanleiding geeft, bepalen dat een aanwijzing als bedoeld in het eerste lid dient te worden
      ingetrokken.

      3 Van een besluit als bedoeld in het eerste lid alsmede van een intrekking daarvan wordt door de ijkinstelling
      mededeling gedaan aan Onze Minister en door plaatsing in de Staatscourant.


