  - number: '17'
    text: |-
      1 De gasverkoper zowel als de verbruiker of koper, bij wie de gasmeter, dienende om de verbruikte of geleverde
      hoeveelheid gas aan te wijzen, berust, kan te allen tijde vorderen, dat deze door de ijkinstelling wordt
      onderzocht. Een overeenkomstig voorschrift kan door Ons worden gegeven met betrekking tot andere meetwerktuigen en
      meetinstrumenten, strekkende om een verbruikte of geleverde hoeveelheid aan te wijzen.

      2 Van de bevoegdheid, bij de eerste zinsnede van het vorige lid, of van een bevoegdheid, krachtens de tweede
      zinsnede van het vorige lid gegeven, kan geen afstand worden gedaan bij overeenkomst; evenmin kan bij overeenkomst
      afstand worden gedaan van de bevoegdheid van bij of krachtens het eerste lid aangewezen personen te allen tijde
      te verlangen dat een gasmeter of een krachtens het eerste lid aangewezen meetwerktuig of meetinstrument wordt
      onderzocht door een ijkbevoegde die tot dat onderzoek van het desbetreffende voorwerp bevoegd en bereid is.

      3 Al de kosten van een onderzoek als in het eerste lid bedoeld komen ten laste van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel17
  - number: '18'
    text: |-
      Gewichten, bij de in [artikel 11, vierde lid][ref1], bedoelde herkeuring, niet meer dan een door Ons vast te
      stellen verschil van hun wettelijke waarde opleverende, worden zo mogelijk door de ijkinstelling of, voor zover het
      betreft herkeuring als bedoeld in [artikel 11, vierde lid, onder b of c][ref2], door de ijkbevoegde, die ingevolge
      [artikel 26][ref3] bevoegd is tot herkeuring van de betrokken gewichten, gejusteerd.


