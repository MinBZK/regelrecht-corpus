  - number: 5b
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder meetinstrumenten verstaan instrumenten
      ter bepaling van aantallen van meeteenheden, met uitzondering van die instrumenten, welke zijn ingericht of mede
      ingericht ter bepaling van lengte, van oppervlakte, van inhoud, van volume of van massa.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel5b
  - number: '6'
    text: |-
      1 Op de maten is de grootste lengte of de grootste inhoud, die zij bestemd zijn aan te wijzen, in wettelijke
      aanduiding uitgedrukt.

      2 Op de gewichten is de massa, die zij bestemd zijn aan te wijzen, in wettelijke aanduiding uitgedrukt,
      uitgezonderd de gewichten in plaatvorm van 1000 milligram of minder, waarop de massa uitsluitend is uitgedrukt door
      een getal.

      3 Op de gasmeters is het grootste verbruik per uur, dat zij in verband met hun samenstelling en afmetingen bestemd
      zijn aan te wijzen, in wettelijke aanduiding uitgedrukt. Een overeenkomstig voorschrift kan door Ons worden gegeven
      met betrekking tot andere meetwerktuigen en meetinstrumenten, strekkende om een verbruikte of geleverde hoeveelheid
      aan te wijzen.

      4 Op de weegwerktuigen is de grootste belasting, waarvoor zij in verband met hun samenstelling en afmetingen
      bestemd zijn, in wettelijke aanduiding uitgedrukt.

      5 Een algemene maatregel van bestuur regelt de overige voorwaarden, waaraan maten, gewichten, meet- en
      weegwerktuigen en meetinstrumenten moeten voldoen, waarbij aan Onze Minister kan worden opgedragen, voorschriften
      te geven omtrent de samenstelling, de meet- en weegeigenschappen en het aanbrengen van ijkmerken.

      6 De in het vorige lid bedoelde algemene maatregel van bestuur kan tevens voorschriften inhouden betreffende
      het uitsluitend gebruik van bepaalde maten, gewichten, meet- en weegwerktuigen en meetinstrumenten in daarbij
      aangewezen gevallen.

      7 De bepalingen van [dit artikel][ref1] zijn niet van toepassing op maten, gewichten, meet- en weegwerktuigen,
      welke blijkens een daarop gestelde, door Onze met de uitvoering dezer wet belaste Minister goedgekeurde aanduiding:

      a. niet bestemd zijn om ter bepaling van maat of gewicht te worden gebruikt bij het drijven van handel of het
      verrichten van een der andere in [het eerste lid van artikel 7][ref2] omschreven handelingen;

      b. uitsluitend dienen ter bepaling van maat of gewicht van goederen, welke voor het buitenland bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel7
