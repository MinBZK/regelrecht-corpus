  - number: '28'
    text: |-
      Onze Minister kan regelen stellen omtrent de werkwijze die moet worden gevolgd door:

      a. de ijkinstelling bij het verrichten van de werkzaamheden, voortvloeiende uit het bij of krachtens
      [de artikelen 10][ref1] tot en met [18][ref2] en [21a][ref3] bepaalde en van de onderzoeken, voortvloeiende uit
      [artikel 5:18 van de Algemene wet bestuursrecht][ref4];

      b. de ijkbevoegden bij het verrichten van werkzaamheden, voortvloeiend uit hun erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel21a
