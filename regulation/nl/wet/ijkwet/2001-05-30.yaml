  - number: 26a
    text: |-
      1 De aanvraag tot erkenning dient de volgende gegevens te bevatten:

      a. de naam of de handelsnaam van de aanvrager en de plaats en het adres waar hij gevestigd is;

      b. een opgave van de voorwerpen ten aanzien waarvan de erkenning wordt verlangd;

      c. een opgave van de in [artikel 26][ref1] bedoelde werkzaamheden waarvoor de erkenning wordt verlangd;

      d. een opgave van de door de aanvrager gewenste beperkingen van de erkenning.

      2 De aanvraag dient vergezeld te gaan van de nodige bescheiden, waaruit de metrologische kennis en kunde van de
      aanvrager of zijn personeel met betrekking tot de in de aanvraag genoemde voorwerpen en werkzaamheden blijkt, en
      van een opgave van de apparatuur waarover hij voor die werkzaamheden beschikt.

      3 Op een aanvraag wordt niet beslist dan nadat de ijkinstelling op haar daartoe strekkend verzoek in de gelegenheid
      is gesteld bij de aanvrager in Nederland een onderzoek in te stellen naar diens vermogen, gezien diens organisatie,
      personeel en materieel, de in de aanvraag vermelde werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel26
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '26'
        paragraaf: '5'
  - number: 26b
    text: |-
      1 Een erkenning wordt door de ijkinstelling verleend, indien de aanvrager voor wat betreft zijn organisatie,
      personeel en materieel overeenkomstig daaromtrent door Onze Minister gestelde, in de Staatscourant bekendgemaakte
      regelen in staat is de in de aanvraag vermelde werkzaamheden ten aanzien van de in de aanvraag genoemde
      voorwerpen naar behoren te verrichten en beschikt over de voor de werkzaamheden nodige standaarden als bedoeld in
      [artikel 22, tweede lid, onder a][ref1].

      2 Aan een erkenning kunnen voorschriften worden verbonden. De erkenning kan onder beperkingen worden verleend.

      3 In de verklaring van erkenning wordt een door de ijkinstelling voor de betrokkene vastgesteld kenmerk opgenomen.

      4 De ijkinstelling doet van de erkenning en de datum daarvan mededeling in de Staatscourant, onder opgave van de
      naam of handelsnaam van de desbetreffende ijkbevoegde, van de plaats en het adres waar deze is gevestigd, van de
      voorwerpen ten aanzien waarvan en van de werkzaamheden waarvoor de erkenning is verleend, en voorts onder opgave
      van de beperkingen waaronder de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel22
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '22'
        paragraaf: '4'
  - number: 26c
    text: |-
      De ijkinstelling kan ook na de verlening ingevolge artikel 26b, eerste lid, van een erkenning daaraan voorschriften
      verbinden of daaraan verbonden voorschriften wijzigen, indien de technische ontwikkeling zulks noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26c
  - number: 26d
    text: |-
      De ijkbevoegde verricht werkzaamheden met betrekking waartoe hem een erkenning is verleend niet buiten Nederland
      dan met voorafgaande schriftelijke toestemming van de ijkinstelling.
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26d
  - number: 26e
    text: |-
      De ijkbevoegde is verplicht de ijkinstelling op daartoe strekkend verzoek gelegenheid te geven na te gaan of hij
      nog voldoet aan de eisen, bedoeld in [artikel 26b, eerste lid][ref1], en hoe hij de werkzaamheden waarop de hem
      verleende erkenning betrekking heeft, verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: 26b
        paragraaf: '5'
  - number: 26f
    text: |-
      1 Voor de behandeling van de aanvraag tot erkenning is de aanvrager aan de ijkinstelling een bedrag verschuldigd,
      berekend volgens de door die instelling vastgestelde tarieven.

      2 Ter bestrijding van de kosten, verbonden aan controles als bedoeld in [artikel 26e][ref1] zijn de ijkbevoegden
      jaarlijks aan de ijkinstelling een bedrag verschuldigd, berekend volgens een door die instelling vastgesteld
      tarief.

      3 De besluiten tot vaststelling van tarieven, bedoeld in het eerste en tweede lid, behoeven de goedkeuring van
      Onze Minister; het bepaalde in [artikel 24, vierde, vijfde, zesde en zevende lid][ref2], is van overeenkomstige
      toepassing.

      4 De behandeling van een aanvraag tot erkenning kan door de ijkinstelling worden geweigerd of beëindigd, indien de
      aanvrager niet voldoet aan zijn financiële verplichtingen jegens de ijkinstelling met betrekking tot die aanvraag
      of met betrekking tot kosten als in het tweede lid bedoeld of niet voldoet aan een verzoek van de ijkinstelling tot
      betaling vooraf van het bedrag, verschuldigd voor de behandeling van de aanvraag, of tot het stellen van zekerheid
      voor de betaling van dat bedrag dan wel tot betaling van een voorschot op bedoeld bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel26e
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel24
    url: https://wetten.overheid.nl/BWBR0009082/2001-05-30#Artikel26f
