  - number: '7'
    text: |-
      1 Het is verboden op plaatsen, bestemd voor dan wel gebruikt of mede gebruikt tot of ten behoeve van het drijven
      van handel, het doen van leveringen, het vaststellen van heffingen of het vaststellen van loon voor verrichte
      arbeid, berekend naar grondslag van maat of gewicht, te bezitten of voorhanden te hebben:

      a. valse maten, gewichten, meet- en weegwerktuigen;

      b. andere dan met deze wet of Onze ter uitvoering daarvan genomen besluiten overeenkomstige maten, gewichten, meet-
      en weegwerktuigen;

      c. maten, meet- en weegwerktuigen, waarop bijzondere kentekenen voorkomen met het kennelijk doel om daarmede maat
      of gewicht te bepalen naar andere grondslagen en aanduidingen, dan ingevolge deze wet geldende.

      2 De verbodsbepalingen van het eerste lid onder b en c gelden niet ten aanzien van:

      a. plaatsen waar maten, gewichten, meet- en weegwerktuigen vervaardigd of hersteld worden;

      b. meetwerktuigen als bedoeld in [artikel 6, derde lid, tweede volzin][ref1], zolang met betrekking tot deze door
      Ons geen voorschriften zijn gegeven;

      c. maten, gewichten, meet- en weegwerktuigen als bedoeld in [artikel 6, zevende lid][ref2].

      3 Bij algemene maatregel van bestuur kunnen verboden als in het eerste lid ten aanzien van de daar bedoelde
      plaatsen en met betrekking tot maten, gewichten, meet- en weegwerktuigen vervat, worden gegeven:

      a. met betrekking tot de daarbij aangewezen maten, gewichten, meet- of weegwerktuigen ten aanzien van daarbij
      aangewezen andere plaatsen, waar een beroep of bedrijf wordt uitgeoefend;

      b. met betrekking tot de daarbij aangewezen meetinstrumenten ten aanzien van de daarbij aangewezen plaatsen, waar
      een beroep of bedrijf wordt uitgeoefend;

      c. met betrekking tot de daarbij aangewezen weegwerktuigen ten aanzien van plaatsen, waar bepalingen plaatsvinden
      van massa voor het berekenen van een recht, belasting, premie, boete, vergoeding of soortgelijke verschuldigde
      bedragen, voor de toepassing van wettelijke regelingen of andere besluiten van bestuursorganen of voor
      gerechtelijke expertises.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel6
