  text: |-
    De Staatssecretaris van Volksgezondheid, Welzijn en Sport,

    Gelet op artikel 1.3 van de Kaderregeling subsidies OCW, SZW en VWS;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041482/2021-09-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De beleidsregels voor het verstrekken van subsidies aan ggz-instellingen voor het stimuleren van gestandaardiseerde
      elektronische gegevensuitwisseling tussen patiënt en zorgaanbieder en een verbeterde inzet van e-health bij ggz-
      instellingen worden vastgesteld overeenkomstig de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0041482/2021-09-10#Artikel1
  - number: '2'
    text: |-
      In afwijking van [artikel 7.5, tweede tot en met vierde lid, van de Kaderregeling subsidies OCW, SZW en VWS][ref1]
      legt de ontvanger van een subsidie voor modules, bedoeld in hoofdstuk 2 van de bijlage bij dit besluit, tevens
      verantwoording af door het overleggen van:

      a. een rapportage van de eindtoets, opgesteld door een onafhankelijke IT-auditor, en, indien de ontvanger over een
      periode van drie belastingjaren € 500.000 of meer overheidssubsidie ontvangt;

      b. een financiële verantwoording waaruit blijkt dat de gerealiseerde kosten het subsidiebedrag overschrijden en er
      geen opbrengsten zijn gerealiseerd, overeenkomstig een door de Minister vastgesteld model;

      c. een controleverklaring opgesteld door een accountant overeenkomstig een door de Minister vastgesteld model met
      inachtneming van een door de Minister vastgesteld accountantsprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0041482/2021-09-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '7.5'
  - number: '3'
    text: |-
      Indien de modules waarvoor subsidie is verleend geheel zijn verricht, maar niet wordt
      voldaan aan de verplichting, bedoeld in [artikel 2, onder b en c][ref1], kan in afwijking van
      [artikel 7.5, vijfde lid, van de Kaderregeling subsidies OCW, SZW en VWS][ref2] de subsidie lager worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041482#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel7.5
