preamble:
  text: |-
    Gelet op artikel 16, zevende lid, van de Binnenschepenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012771/2001-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het klein vaarbewijs voor de vaart op de rivieren, kanalen en meren, onderscheidenlijk voor de vaart op alle
      binnenwateren wordt vastgesteld volgens het model opgenomen in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0012771/2001-09-01#Artikel1
  - number: '2'
    text: |-
      Klein vaarbewijzen, afgegeven overeenkomstig de Regeling vaststelling model klein vaarbewijs, behouden hun
      geldigheid, totdat deze is verstreken.
    url: https://wetten.overheid.nl/BWBR0012771/2001-09-01#Artikel2
  - number: '3'
    text: De Regeling vaststelling model klein vaarbewijs wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012771/2001-09-01#Artikel3
  - number: '4'
    text: Deze regeling treedt in werking met ingang van 1 september 2001.
    url: https://wetten.overheid.nl/BWBR0012771/2001-09-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling vaststelling model klein vaarbewijs 2001.'
    url: https://wetten.overheid.nl/BWBR0012771/2001-09-01#Artikel5
