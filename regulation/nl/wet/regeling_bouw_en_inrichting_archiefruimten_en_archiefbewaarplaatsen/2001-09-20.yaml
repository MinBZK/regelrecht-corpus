        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8'
    text: |-
      De vloeren, wanden en plafonds en alle daarin aangebrachte voorzieningen zijn waterdicht uitgevoerd en zijn bestand
      tegen de druk bij de maximaal optredende waterstand, ook bij calamiteiten.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel8
  - number: '9'
    text: |-
      1 Tussen de archiefbewaarplaats en de aangrenzende ruimten bedraagt de weerstand tegen branddoorslag en
      brandoverslag bepaald volgens NEN 6069 tenminste 120 minuten; dit geldt ook voor de vloer, wanden, plafonds, en
      alle daarin aangebrachte voorzieningen als: deuren, kozijnen, doorvoeringen van kabels, leidingen kanalen voor
      ventilatie en luchtbehandeling en andere perforaties; met betrekking tot brandkleppen is NEN 6077 van toepassing.
      Indien de vuurbelasting van de aangrenzende ruimte groter is dan 120 minuten wordt de weerstand tegen branddoorslag
      en brandoverslag dienovereenkomstig aangepast.

      2 Indien de oppervlakte van een op één verdieping gelegen deel van een archiefbewaarplaats groter is dan 300 m² bij
      een hoogte van 3 m, dan wordt deze in compartimenten verdeeld. Het aantal compartimenten is gelijk aan het quotiënt
      van de totale oppervlakte van de archiefbewaarplaats in vierkante meters gedeeld door 200 m², waarbij de rest moet
      worden verdeeld over de compartimenten zodanig dat geen enkel compartiment groter is dan 300 m². Indien de ruimte
      hoger is dan 3 meter, dan dienen deze oppervlakten zodanig te worden aangepast, dat de inhoud per compartiment niet
      meer is dan 600 m³.

      3 In afwijking van het tweede lid mag het aantal compartimenten worden bepaald op grond van de maximale
      opbergcapaciteit. Deze bedraagt per compartiment maximaal 3000 strekkende meter papier van A4 tot folio-formaat of
      een equivalent daarvan.

      4 Tussen de in het tweede lid genoemde compartimenten bedraagt de weerstand tegen branddoorslag en brandoverslag
      bepaald volgens NEN 6069 120 minuten.

      5 De hoofddraagconstructie van het gebouw voorzover van belang voor de archiefbewaarplaats bezit een
      brandwerendheid op het criterium van bezwijken van tenminste 120 minuten, berekend volgens NEN 6069 dan wel voor
      zover van toepassing NEN 6071, NEN 6072 onderscheidenlijk NEN 6073.

      6 Voor de bewaring van archiefbescheiden die schade kunnen veroorzaken aan andere archiefbescheiden worden
      afzonderlijke compartimenten ingericht, zodanig dat er ook bij calamiteiten geen schade kan ontstaan aan andere
      compartimenten.

      7 Geldige TNO-rapporten aangaande het gestelde in het eerste, vierde en vijfde lid worden desgevraagd overgelegd
      aan de algemene rijksarchivaris, dan wel, indien het een andere dan een rijksarchiefbewaarplaats betreft,
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel9
  - number: '10'
    text: Ramen zijn in de archiefbewaarplaats niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel10
  - number: '11'
    text: |-
      1 Vloeren, wanden en plafonds zijn glad, vlak en stofvrij afgewerkt; de afwerklaag van wanden en plafonds is niet
      dampremmend; houten plinten en dorpels of losse delen met kieren worden niet toegepast.

      2 De vloeren zijn voorzien van een slijtvaste afwerking of afdekking.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel11
  - number: '12'
    text: |-
      1 De bijdrage tot brandvoortplanting van de wanden en plafonds van de archiefbewaarplaats voldoet aan klasse 4
      volgens NEN 6065. De maatgevende rookdichtheid bepaald volgens NEN 6066 bedraagt ten hoogste 10 m-1.

      2 De bepaling van het al dan niet gemakkelijk ontvlambaar zijn en de bijdrage tot brandvoortplanting van de vloer
      van de archiefbewaarplaats voldoet aan de klasse T1 volgens NEN 1775.

      3 Geldige TNO-rapporten aangaande het gestelde in het eerste en tweede lid worden desgevraagd overgelegd aan de
      algemene rijksarchivaris, dan wel, indien het een andere dan een rijksarchiefbewaarplaats betreft, gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel12
  - number: '13'
    text: |-
      Er zijn geen bouw- en afwerkmaterialen toegepast uit welke schadelijke gassen kunnen vrijkomen of die op andere
      wijze schade aan de archiefbescheiden kunnen veroorzaken of waarvan een redelijk vermoeden bestaat dat zij in de
      toekomst schade kunnen gaan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel13
  - number: '14'
    text: |-
      Door de archiefbewaarplaats zijn geen kabels, leidingen en kanalen gevoerd die dienst doen als voedings- of
      afvoerleiding voor andere ruimten dan de archiefbewaarplaats, of voor een op een andere verdieping gelegen
      compartiment van de archiefbewaarplaats, ongeacht de aard van die kabels, leidingen en kanalen.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel14
  - number: '15'
    text: Alle kabels en leidingen zijn uitgevoerd als opbouw; voeding naar apparatuur vindt plaats van bovenaf door de wand.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel15
  - number: '16'
    text: |-
      Binnen de archiefbewaarplaats mag op geen onderdeel van het gebouw en de meubilering condensvorming kunnen
      optreden. Hierbij moet rekening worden gehouden met de normaal te verwachten externe klimaatomstandigheden en met
      de klimaateisen, genoemd in [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel32
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '32'
        hoofdstuk: III
        paragraaf: '8'
  - number: '17'
    text: |-
      1 De deuren in de wand van de archiefbewaarplaats zijn van plaatstaal, naar buiten draaiend en zelfsluitend
      uitgevoerd; de deuren kunnen zijn voorzien van een extra, zelfsluitende loopdeur. Bij toepassing van een loopdeur
      behoeft de plaatstalen deur niet zelfsluitend te zijn. Deuren van compartimenten behoeven niet zelfsluitend te
      zijn. Zelfsluitende deuren zijn van binnenuit te openen.

      2 De verlichtingsinstallatie is voorzien van een controlelampje of ander signaleringssysteem waaraan buiten de
      archiefbewaarplaats zichtbaar is of de verlichting in de archiefbewaarplaats is ingeschakeld. Deurcontacten voor de
      verlichting zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel17
  - number: '18'
    text: |-
      1 Bij de beplanting van het omliggende terrein zijn geen klimplanten geplaatst tegen de buitengevels;
      stuifmeelrijke planten zijn vermeden.

      2 Planten, waterpartijen en andere objecten die micro-organismen kunnen aantrekken zijn zodanig binnen het
      gebouw geplaatst, dat er tenminste één zelfsluitende deur is tussen deze objecten en de deur of deuren van de
      archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel18
  - number: '19'
    text: |-
      1 De archiefbewaarplaats die gelegen is in een gebied met een overstromingsrisico als gevolg van het risico
      van doorbraak van de dijk van de polder waarin deze is gelegen dan wel te hoge waterstand in waterlopen
      grenzend aan het gebied waarin de archiefbewaarplaats is gelegen, is waterdicht uitgevoerd met inbegrip van
      deuren, doorvoeringen van kabels, leidingen en ventilatie- en luchtbehandelingskanalen; dit geldt ook voor de
      archiefbewaarplaats welke meer dan drie meter beneden het maaiveld is gelegen.

      2 Geen overstromingsrisico wordt geacht aanwezig te zijn in gebieden volledig beschermd door dijken, die voldoen
      aan de veiligheidsnorm als bedoeld in [artikel 3 van de Wet op de waterkering][ref1].

      3 De archiefbewaarplaats, bedoeld in het eerste lid, is voorzien van een of meer pompen met een voldoende
      capaciteit, aangesloten op een onafhankelijke noodstroomvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel3
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007801
        artikel: '3'
  - number: '20'
    text: |-
      1 De boven het maaiveld en niet meer dan drie meter beneden het maaiveld gelegen archiefbewaarplaats
      is 10 cm gelegen boven het niveau waarop zich wateroverlast kan voordoen bij een calamiteit als
      omschreven in [artikel 19][ref1] dan wel is voorzien van een waterkering tot 10 cm boven dat niveau; de
      zorgdragers maken bij het overleggen van de plannen, bedoeld in de [artikelen 33, tweede lid][ref2], en
      [38, tweede lid, van de Archiefwet 1995][ref3], aannemelijk dat de plannen aan deze eis voldoen.

      2 Het laagste toelooppunt van water bij calamiteiten, als bedoeld in het eerste lid en als gevolg van overvloedige
      neerslag, lekkage van leidingen in het gebouw en brandblussing is gelegen minimaal 10 cm boven het niveau ter
      plaatse van waaraf een vrije afloop naar het maaiveld dan wel de riolering is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel38
