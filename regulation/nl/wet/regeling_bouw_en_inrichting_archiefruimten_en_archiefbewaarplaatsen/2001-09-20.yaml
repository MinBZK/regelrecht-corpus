        artikel: '38'
  - number: '21'
    text: |-
      Een archiefbewaarplaats waarin regelmatig archiefbescheiden van buiten het gebouw worden opgenomen, beschikt over
      een ontvangst- en quarantaineruimte die voldoet aan de volgende eisen:

      a. In de onmiddellijke nabijheid is een laadperron aanwezig, alwaar materialen onder bescherming van een luifel
      naar binnen kunnen worden gebracht.

      b. De ruimte is dusdanig afgewerkt dat een natte ontsmetting van de ruimte goed mogelijk is. Bij voorkeur dienen de
      wanden en de vloeren betegeld te zijn.

      c. Bij voorkeur wordt de ruimte ingericht met vrij van de muur hangende legborden, uitgevoerd in roestvrij staal.

      d. De werktafels in de ruimte zijn vervaardigd van materiaal dat waterbestendig is.

      e. De ruimte is voorzien van een onafhankelijke luchtbehandeling. De installatie haalt de lucht rechtstreeks van
      buiten en voert de afzuiglucht ook rechtstreeks af naar buiten; er is geen recirculatie.

      f. Mobiele apparatuur is toegelaten.

      g. In de ruimte is plaatselijke afzuiging beschikbaar voor het droog reinigen van het archiefmateriaal.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel21
  - number: '22'
    text: |-
      1 In de directe nabijheid van de uitgang(en) van de archiefbewaarplaats en op de plaats het verst verwijderd van de
      uitgang zijn op een goed zichtbare plaats in de ruimte een of meer koolzuursneeuwblussers geplaatst die voldoen aan
      het [Besluit draagbare blustoestellen 1997][ref1], elk met een nuttige inhoud van tenminste 5 kg.

      2 In de directe nabijheid van de toegang tot de archiefbewaarplaats is aan de buitenzijde van de bewaarplaats een
      slanghaspel geplaatst, welke voldoet aan NEN-EN 671-1.

      3 Indien een archiefbewaarplaats of een compartiment daarvan groter is dan omschreven in
      [artikel 9, tweede of derde lid][ref2], is deze na overleg met de brandweer voorzien van een sprinklerinstallatie,
      uitgevoerd als gecommandeerd systeem; het brandmeldsysteem kan daarbij worden uitgevoerd volgens het systeem
      van twee-groepsafhankelijkheid, twee-melderafhankelijkheid of dubbeltoetsmethode; de uitvoering met water in de
      leidingen verdient de voorkeur.

      4 In afwijking van het derde lid is een gasblusinstallatie gericht op zuurstofverdrijving toegestaan, mits het
      gasmengsel veilig voor personen en chemisch indifferent is ten opzichte van archiefbescheiden, er geen gassen bij
      de vuurhaard worden gevormd die kunnen reageren met archiefbescheiden en de installatie zodanig is uitgevoerd, dat
      deze geen fysische schade toebrengt aan de archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0009334
      [ref2]: https://wetten.overheid.nl/BWBR0012803#Artikel9
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009334
      - id: ref2
        bwb_id: BWBR0012803
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '23'
    text: |-
      De archiefbewaarplaats is voorzien van een automatische brandmeldinstallatie, welke voldoet aan NEN 2535; het
      systeem is in ieder geval voorzien van rookdetectoren.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel23
  - number: '24'
    text: |-
      Aanduidingen met een rookverbod en een verbod om brandbare zaken binnen 50 cm van de uitmondingen van de
      ventilatie- en luchtbehandelingskanalen en van de deursponningen te plaatsen, zowel aan de binnen- als aan de
      buitenzijde van de deur, zijn op relevante en duidelijk zichtbare plaatsen aangebracht.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel24
  - number: '25'
    text: |-
      De toegang tot de archiefbewaarplaats is zodanig gesitueerd, dat bezoekers en niet met de verzorging van archieven
      belaste personeelsleden er niet ongecontroleerd kunnen binnen gaan.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel25
  - number: '26'
    text: |-
      1 De buitendeuren van het gebouw en de deuren van de archiefbewaarplaats zijn tenminste voorzien van insteeksloten
      met sluitkommen en van veiligheidsbouwbeslag met boorzekering. De deuren zijn beveiligd tegen uitlichten.

      2 De wijze van inbraaksignalering is aangepast aan de situering van het gebouw.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel26
  - number: '27'
    text: |-
      1 De bijdrage tot brandvoortplanting van kasten en stellingen in de archiefbewaarplaats voldoet aan het gestelde
      voor klasse 4 volgens NEN 6065; de maatgevende rookdichtheid, bepaald volgens NEN 6066, bedraagt ten hoogste 10
      m-1.

      2 Geldige TNO-rapporten aangaande het gestelde in het eerste lid worden overgelegd aan de algemene rijksarchivaris,
      dan wel, indien het een andere dan een rijksarchiefbewaarplaats betreft, gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel27
  - number: '28'
    text: |-
      Er is geen meubilering toegepast, waaruit schadelijke gassen vrij kunnen komen of die op andere wijze schade aan
      de archiefbescheiden kan veroorzaken of ten aanzien waarvan een redelijk vermoeden bestaat, dat zij in de toekomst
      schade aan de archiefbescheiden zal veroorzaken.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel28
  - number: '29'
    text: |-
      1 De stellingen in de archiefbewaarplaats zijn zo geplaatst, dat looppaden van ten minste 70 cm breed overblijven.
      Op plaatsen waar geen looppaden noodzakelijk zijn, mag de afstand tot de wanden tot 20 cm worden teruggebracht. De
      afstand tussen verrolbare archiefstellingen in gesloten toestand is tenminste 5 cm. De afstand tussen de inhoud van
      de bovenste plank en het plafond is ten minste 30 cm.

      2 De afstand tot de deurkozijnen en andere doorvoeringen door brandwerende wanden is ten minste 50 cm.

      3 De elektromotoren voor de voortbeweging van verrolbare stellingen kunnen, indien zij in de archiefbewaarplaats
      zijn opgesteld, geen brand of explosie veroorzaken.

      4 Er zijn voldoende kasten aanwezig om charters, kaarten, tekeningen en andere materialen van groot formaat of
      kwetsbare samenstelling vlak op te bergen. De kasten voor hangende berging van grote formaten zijn zo ingericht,
      dat de archiefbescheiden niet door hun eigen gewicht kunnen scheuren of anderszins schade ondervinden. Er zijn
      kasten en stellingen aanwezig om grote banden liggend te bewaren.

      5 Voor de berging van elektromagnetische materialen zijn volledig plaatstalen kasten, voorzien van deuren en een
      achterwand, toegepast.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel29
  - number: '30'
    text: |-
      1 De archiefbewaarplaats is uitsluitend bestemd voor de bewaring van archiefbescheiden. De bewaring in de
      archiefbewaarplaats van andere documenten dan archiefbescheiden is toegestaan.

      2 In een archiefbewaarplaats zijn geen materialen of apparaten geplaatst, die het klimaat nadelig kunnen
      beïnvloeden, verontreiniging verspreiden, brandgevaar veroorzaken, dan wel insecten of micro-organismen kunnen
      aantrekken. De klimaatapparatuur wordt buiten de archiefbewaarplaats geplaatst.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel30
  - number: '31'
    text: In de archiefbewaarplaats en in elk compartiment is telefoon aanwezig.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel31
  - number: '32'
    text: |-
      De temperatuur onderscheidenlijk de relatieve luchtvochtigheid bedraagt voor:

      a. papier, perkament, was, leer, textiel en hout 17°C -2/+1°C, onderscheidenlijk 52% ±3%

      b. zwart-wit fotomateriaal op papier, ook wanneer polyethyleen is toegepast: een vast in te stellen waarde tussen
      -20 tot 17°C ±1°C, onderscheidenlijk 33% tot 38% ±3%

      c. zwart-wit fotomateriaal op glas en polyester film, positief en negatief: een vast in te stellen waarde tussen
      -20 tot 17°C ±1°C, onderscheidenlijk 33% tot 38% ±3%

      d. zwart-wit fotomateriaal op bi- of tri-acetaatfilm: een vast in te stellen waarde tussen -20 tot 5°C ± 1°C,
      onderscheidenlijk 33% tot 38% ±3%

      e. zwart-wit fotomateriaal op nitraatfilm: een vast in te stellen waarde tussen -20 tot 5°C ± 1°C,
      onderscheidenlijk 33% tot 38% ± 3%

      f. fotomateriaal in kleur, positief en negatief: een vast in te stellen waarde tussen -20 tot -2°C ±1°C,
      onderscheidenlijk 33% ±3%

      g. elektromagnetische dragers 18°C ±1°C, onderscheidenlijk 40% ±2%

      h. optische schijven: een vast in te stellen waarde tussen 2 tot 18°C -2/+1°C, onderscheidenlijk 40 tot 55% ±3%
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel32
  - number: '33'
    text: |-
      De klimaatbeheersinginstallatie is zodanig ingericht dat deze voor de archiefbewaarplaats afzonderlijk en per
      compartiment afzonderlijk kan worden in- en nageregeld.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel33
  - number: '34'
    text: |-
      Wanneer een archiefbewaarplaats of een compartiment een temperatuur heeft lager dan 15°C, wordt voor het gebruik
      van de archiefbescheiden voorzien in een mogelijkheid tot acclimatisering, waarbij de temperatuur niet meer dan 1°C
      per uur oploopt bij een gelijkblijvende relatieve luchtvochtigheid.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel34
  - number: '35'
    text: |-
      In afwijking van [artikel 32, onder a][ref1], is een constante, seizoensonafhankelijke relatieve luchtvochtigheid
      toegestaan van iedere vast in te stellen waarde tussen 43% en 52% ±3% voor papier en boekbanden, waarin geen leer,
      perkament of hout is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel32
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '32'
        hoofdstuk: III
        paragraaf: '8'
  - number: '36'
    text: |-
      In afwijking van [artikel 32, onder a, b en h][ref1], is een temperatuur van 18°C ±2°C en een variatie in de
      relatieve luchtvochtigheid van ±5% ten opzichte van de aangegeven waarde toegestaan, indien de chemische kwaliteit
      van de lucht een maximale corrosieve waarde heeft van 40 Ångström per 30 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel32
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '32'
        hoofdstuk: III
        paragraaf: '8'
  - number: '37'
    text: |-
      Toetredende lucht is gezuiverd van SO, NO, NH en O op plaatsen met een hoge intensiteit van het wegverkeer en in
      die gebieden waar gedurende een van de laatste drie jaren een gemiddelde concentratie is gemeten van meer dan 15
      µg/m3 SO onderscheidenlijk 25 ppb (gerekend als 1:10-9) aan NO. Het is toegestaan de toetreding van verse lucht
      tijdens de spitsuren af te sluiten, mits een ventilatievoud van 2 per etmaal wordt bereikt. De toevoeropeningen
      worden op de meest gunstige wijze geplaatst, maar tenminste 5 m boven het maaiveld.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel37
  - number: '38'
    text: |-
      In afwijking van [artikel 32, onder g][ref1], is iedere afwijking toegestaan, indien de elektromagnetische
      gegevens worden gekopieerd op een nieuwe drager in een frequentie, gerelateerd aan de afwijking van de onder g
      voorgeschreven temperatuur en relatieve luchtvochtigheid en een kopie van de gegevens elders wordt bewaard onder
      overeenkomstige voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel32
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '32'
        hoofdstuk: III
        paragraaf: '8'
  - number: '39'
    text: |-
      1 Het ventilatievoud bedraagt 0,1 tot 0,2 maal per uur. Een hoger ventilatievoud is toegestaan indien de chemische
      kwaliteit van de lucht voldoet aan de eis gesteld in [artikel 36][ref1]. Het inwendige circulatievoud bedraagt
      minimaal 2 maal de lege ruimte per uur bij een luchtsnelheid tussen 0,01 m en 2,5 m/seconde in de gehele ruimte.
      Indien verrolbare archiefstellingen worden gebruikt, bedraagt het circulatievoud ten minste 2,5 maal de lege ruimte
      per uur.

      2 In afwijking van het gestelde in het eerste lid bedraagt het ventilatievoud 0,25 tot 0,5 per uur voor
      compartimenten bestemd voor de bewaring van fotografische materialen op bi- of tri-acetaat- of nitraatfilm.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel36
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '36'
        hoofdstuk: III
        paragraaf: '8'
  - number: '40'
    text: |-
      De tot de archiefbewaarplaats toetredende, verse en gerecirculeerde lucht wordt gefilterd tot verwijdering van
      60-80% van stofdeeltjes met een diameter van 0,5 µ of meer, gemeten ten opzichte van de buitenlucht. De maximale
      hoeveelheid stof is 75 µg/m3.

      De installatie is zodanig ingericht dat de eventuele compartimenten van de archiefbewaarplaats elkaar niet kunnen
      besmetten met schimmels en andere micro-organismen.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel40
  - number: '41'
    text: |-
      In de archiefbewaarplaats zijn een thermometer en een elektronische hygrometer dan wel een thermohygrograaf
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel41
  - number: '42'
    text: |-
      Indien archiefbescheiden niet in dozen worden bewaard, is het maximale niveau van continue belichting 50 lux bij
      een aandeel UV-licht van 75 µW/lumen.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel42
  - number: '43'
    text: |-
      1 De minister kan met betrekking tot de rijksarchiefbewaarplaatsen die vóór 1 januari 2001 zijn gebouwd en
      gedeputeerde staten kunnen met betrekking tot andere archiefbewaarplaatsen die vóór 1 januari 2001 zijn gebouwd,
      ontheffing verlenen van de eisen, die in [artikel 7, onder a tot en met e][ref1], aan beton worden gesteld.

      2 Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel7
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '44'
    text: |-
      1 De minister kan met betrekking tot archiefruimten bestemd voor de bewaring van de in de
      [artikelen 23, eerste en tweede lid][ref1], en [artikel 41, eerste lid, van de Archiefwet 1995][ref2] bedoelde
      archiefbescheiden en met betrekking tot de rijksarchiefbewaarplaatsen in een bijzonder geval ontheffing verlenen
      van één of meer voorschriften van deze regeling.

      2 Gedeputeerde staten kunnen met betrekking tot andere archiefruimten of archiefbewaarplaatsen dan bedoeld in het
      eerste lid, in een bijzonder geval ontheffing verlenen van één of meer voorschriften van deze regeling.

      3 Aan een ontheffing als bedoeld in het eerste of het tweede lid, worden voorschriften verbonden, die de mogelijke
      nadelige gevolgen van de ontheffing zoveel mogelijk ondervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '45'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel45
  - number: '46'
    text: 'Deze regeling wordt aangehaald als: Regeling bouw en inrichting archiefruimten en archiefbewaarplaatsen.'
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel46
