articles:
  - number: '1'
    text: |-
      1 Deze regeling verstaat onder:

      a. de minister: de Minister van Onderwijs, Cultuur en Wetenschappen;

      b. gebouw: een gebouw als bedoeld in de [Woningwet][ref1];

      c. archiefgebouw: een tot een industriegebouw als bedoeld in het [Bouwbesluit][ref2] behorende archiefbewaarplaats
      of een andere ruimte uitsluitend in gebruik voor het beheer en de raadpleging van archiefbescheiden en documentaire
      verzamelingen;

      d. compartiment: gedeelte van een archiefbewaarplaats, dat door brandwerende bouwdelen van een of meer andere
      gedeelten van de archiefbewaarplaats is gescheiden.

      2 Met de in deze regeling genoemde technische producteisen worden gelijkgesteld technische producteisen die worden
      gesteld in een andere lidstaat van de Europese Unie dan wel in een staat die partij is bij de overeenkomst inzake
      de Europese Economische Ruimte, en die tenminste een gelijkwaardig kwaliteitsniveau van het product waarborgen,
      mits daarbij een geldig rapport wordt overgelegd waaruit blijkt dat de producten aan die eisen voldoen, en dat
      rapport is opgemaakt door een beproevingslaboratorium dat voldoet aan NEN-EN-ISO/IEC 17025.


