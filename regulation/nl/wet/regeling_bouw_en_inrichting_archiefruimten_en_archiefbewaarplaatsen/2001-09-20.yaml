  - number: '2'
    text: |-
      1 Een gebouw waarin een archiefruimte is of wordt gevestigd, is niet gelegen in een omgeving, waar een bijzonder
      brand- of overstromingsgevaar bestaat dan wel extreme overlast van luchtvervuiling te verwachten is.

      2 De archiefruimte is uitsluitend bestemd voor de bewaring van archiefbescheiden. De bewaring in de archiefruimte
      van andere documenten dan archiefbescheiden is toegestaan.

      3 In een archiefruimte bevinden zich geen materialen en apparaten die het klimaat nadelig kunnen beïnvloeden,
      verontreiniging verspreiden, brandgevaar veroorzaken, dan wel insecten of micro-organismen kunnen aantrekken.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel2
  - number: '3'
    text: |-
      1 De vloerbelasting is berekend op een gewicht van 10 kN/m², bij een inrichting met 7 legborden boven elkaar, bij
      een onderlinge afstand van 35 cm.

      2 De archiefruimte is beschermd tegen overlast van grond-, riool-, regen-, leiding- en bluswater door de toepassing
      van een waterkering van tenminste 10 cm. In een archiefruimte beneden het maaiveld zijn watermelders aanwezig.
      Indien de situatie van een archiefruimte beneden het maaiveld daartoe aanleiding geeft, wordt, ten genoegen van
      degene die ingevolge de [Archiefwet 1995][ref1] is belast met het toezicht aangetoond dat de waterindringing in het
      beton gemeten volgens ISO-DIS 7031 een waarde heeft die onschadelijk is voor de bewaring van archiefbescheiden.

      3 De scheidingsconstructie, vloeren, wanden en plafonds tussen de archiefruimte en de omringende ruimten is van
      steenachtig materiaal en bezit een brandwerendheid van 60 minuten volgens NEN 6069; dit geldt ook voor deuren,
      kozijnen, brandkleppen, doorvoeringen van kabels, leidingen en andere perforaties. Met betrekking tot brandkleppen
      is NEN 6077 van toepassing. Rooster- en andere tussenvloeren zijn niet toegestaan. Indien de vuurbelasting van een
      aangrenzende ruimte groter is dan die van een gemiddelde kantoorruimte wordt de weerstand tegen branddoorslag en
      brandoverslag dienovereenkomstig verhoogd.

      4 Ramen zijn in de archiefruimte niet toegestaan.

      5 De bijdrage tot de brandvoortplanting van wanden, plafonds, vloeren en vloerbedekking alsmede van kasten en
      stellingen voldoet aan klasse 4 volgens NEN 6065.

      6 De vloeren, wanden en plafonds zijn glad, vlak en stofvrij afgewerkt; losse bouwdelen met kieren zijn niet
      toegepast.

      7 Alleen kabels, leidingen en kanalen ten behoeve van voorzieningen in de archiefruimte zelf, zoals een
      verwarmingsbuis, zijn in de archiefruimte aanwezig. Archiefstellingen staan niet onder watervoerende leidingen.
      Kabels en leidingen worden zoveel mogelijk als opbouw uitgevoerd; voeding naar apparatuur vindt plaats van bovenaf
      door de wand.

      8 Het ventilatiesysteem of de luchtbehandelingsinstallatie is zodanig uitgevoerd dat hierdoor geen water, vuil en
      ongedierte kunnen doordringen in de archiefruimte. De klimaatapparatuur wordt buiten de archiefruimte geplaatst.

      9 De toegangsdeuren zijn tenminste voorzien van insteeksloten met sluitkommen en van veiligheidsbouwbeslag met
      boorzekering. De deuren zijn beveiligd tegen uitlichten. Zij zijn zelfsluitend uitgevoerd.

      10 Bij gesloten deur is door een verklikkerlampje aan de buitenzijde zichtbaar of de elektriciteit is ingeschakeld.
      Deurcontacten voor de verlichting zijn niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '4'
    text: |-
      1 In de nabijheid van de archiefruimte zijn voldoende en doelmatige kleine blusmiddelen aanwezig in de vorm van
      slanghaspels en koolzuursneeuwblussers. Poeder- en schuimblussers zijn niet toegestaan.

      2 Op de toegangsdeuren zijn bordjes geplaatst voorzien van de tekst of het symbool `Verboden te roken'.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel4
  - number: '5'
    text: |-
      1 De relatieve luchtvochtigheid in een archiefruimte waarin alleen papieren archiefbescheiden worden bewaard, kan
      variëren tussen 30 en 55% en de temperatuur tussen 16 en 20°C; een overschrijding tot 25°C tijdens maximaal 10
      etmalen per jaar is toegestaan.

      2 De archiefruimte is voorzien van een thermometer en een hygrometer. Haarhygrometers zijn niet toegestaan. Alle
      meetapparatuur wordt regelmatig gecontroleerd op juiste werking en aanwijzing.

      3 De luchtinhoud van de archiefruimte wordt tenminste één maal en niet meer dan vier maal per 24 uur ververst.

      4 Op de bewaring van archiefbescheiden in andere vorm dan papier zijn de [artikelen 32][ref1] en [38][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0012803#Artikel38
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '32'
        hoofdstuk: III
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0012803
        artikel: '38'
        hoofdstuk: III
        paragraaf: '8'
  - number: '6'
    text: |-
      1 Bij plaatsing van archiefstellingen langs een buitenmuur en langs radiatoren wordt een tussenruimte van tenminste
      20 cm in acht genomen, langs een binnenmuur 10 cm; de afstand tussen de inhoud van de bovenste plank en het plafond
      is tenminste 10 cm, en tussen de inhoud van de bovenste plank en de verlichtingsarmaturen 20 cm. De looppaden
      tussen de archiefstellingen zijn tenminste 70 cm breed.

      2 De afstand van deurkozijnen en andere doorvoeringen door brandwerende wanden ten opzichte van archiefstellingen
      is tenminste 50 cm.

      3 Archiefstellingen zijn in de regel niet hoger dan 230 cm.

      4 Voor de berging van elektromagnetische materialen worden volledig plaatstalen kasten, voorzien van deuren en een
      achterwand, toegepast.
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel6
  - number: '7'
    text: |-
      De vloeren, wanden en plafonds worden uitgevoerd in gewapend beton in kwaliteiten als omschreven in NEN 6720 of
      gelijkwaardig materiaal als volgt:

      a. Het beton in de buitenwanden en vloeren van een in de kelder gesitueerde archiefbewaarplaats is tenminste 300
      mm dik in betonkwaliteit B25 of 270 mm in betonkwaliteit B35 of 250 mm in betonkwaliteit B45 of hoger. Indien de
      algemene rijksarchivaris dan wel, indien het een andere dan een rijksarchiefbewaarplaats betreft, gedeputeerde
      staten dat nodig oordelen, toont de bouwer onderscheidenlijk de zorgdrager aan dat de waterindringing gemeten
      volgens ISO-DIS 7031 een waarde heeft die onschadelijk is voor de bewaring van archiefbescheiden.

      b. Het beton van de wanden van de archiefbewaarplaats die tevens buitenmuren zijn, is tenminste 300 mm dik in
      betonkwaliteit B45 of hoger, indien zij aan een open terrein liggen; de wanden van de archiefbewaarplaats worden
      tevens als buitenmuur beschouwd als er slechts een glas- of andere lichte constructie voor staat.

      c. Het plafond van een op de bovenste verdieping of slechts onder een lichte kapconstructie gelegen
      archiefbewaarplaats is tenminste 300 mm dik in betonkwaliteit B25 of 270 mm in betonkwaliteit B35 of 250 mm in
      betonkwaliteit B45 of hoger.

      d. De overige wanden, vloeren en plafonds zijn uitgevoerd in beton van tenminste 250 mm dik in betonkwaliteit B25
      dan wel in beton van tenminste 200 mm dik aangevuld met ander steenachtig bouwmateriaal tot een gezamenlijke massa
      van tenminste 625 kg/m2.

      e. De onder b en d bedoelde wanden, vloeren en plafonds worden berekend op een bijzondere belasting van tenminste
      10 kN/m2 of indien deze hoger is, de statisch equivalente belasting ten gevolge van een explosie op een afstand
      van 1,5 m met explosieven overeenkomend met de kracht van een 155 mm granaat. De in rekening te brengen statisch
      equivalente belasting is: qu = (72 : l) kN/m2 waarbij l de overspanning is, en uitgaande van een overspanning
      groter dan 5 en kleiner dan 10 m. Bij vierzijdig opgelegde vloeren, al of niet ingeklemd, is l de kleinste
      overspanning. De belasting wordt aanwezig geacht over een oppervlakte van l x l.

      f. Onderdeel e is niet van toepassing op het plafond indien het tevens een vrij liggend dak is zonder obstakels met
      een hoogte van 1,5 meter of meer; de buitenmuur, voorzover deze tenminste 3 meter boven het straatniveau is gelegen
      en tevens deel uitmaakt van een gesloten gevelwand in een aan weerszijden bebouwde straat; daaraan parallel lopende
      binnenwanden en overige binnenwanden die niet gekeerd zijn in de richting van een open terrein.

      g. In wanden waarop de sterkte-eis, bedoeld in onderdeel e, van toepassing is, zijn de deuren tenminste 90 mm dik
      en van dubbel plaatstaal met een dikte van tenminste 1,5 mm en met een verstevigingsconstructie of vulling tussen
      de twee lagen; de kozijnen zijn vervaardigd van plaatstaal met een dikte van tenminste 2 mm; in wanden waarop deze
      sterkte-eis niet van toepassing is, zijn zij van staal, met een weerstand tegen branddoorslag en brandoverslag als
      omschreven in [artikel 9][ref1].

      h. De vloer is berekend op een nuttige belasting groot 10 kN/m2 bij een gebruik van vaste of verrolbare stellingen
      met 7 legborden op onderlinge afstanden van 35 cm. Het plafond wordt berekend voor de daarop rustende nuttige
      belasting vermeerderd met de bijzondere belasting, bedoeld in onderdeel e, indien het onder e gestelde van
      toepassing is.

      i. Technische berekeningen en geldige TNO-rapporten aangaande het gestelde onder e, g en h worden desgevraagd
      overgelegd aan de algemene rijksarchivaris, dan wel, indien het een andere dan een rijksarchiefbewaarplaats
      betreft, gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel9
    url: https://wetten.overheid.nl/BWBR0012803/2001-09-20#Artikel7
    references:
      - id: ref1
