preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het vraagstuk van de zendapparatuur voor den Nederlandschen radio-
    omroep behoort te worden opgelost door het scheppen van eenheid van organisatie door samenwerking tusschen het Rijk
    en de omroeporganisaties in den vorm van een met aanleg, beheer en exploitatie belast gemengd bedrijf, waarin het
    Rijk overwegende zeggenschap heeft;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onze Minister van Binnenlandsche Zaken wordt gemachtigd om met inachtneming van de bepalingen dezer wet voor en
      namens den Staat der Nederlanden met de Algemeene Vereeniging "Radio-Omroep" te Amsterdam, de stichting "Katholieke
      Radio Omroep" te Amsterdam, de Nederlandsche Christelijke Radio Vereeniging te Wageningen en de Vereeniging van
      Arbeiders Radio Amateurs te Hilversum, alle rechtspersoonlijkheid bezittende omroeporganisaties, een Naamlooze
      Vennootschap op te richten, genaamd "Nederlandsche Omroep-Zender-Maatschappij, "NOZEMA", welke ten doel heeft:

      a. de aanleg en de exploitatie van aan de eisen des tijds voldoende zendinrichtingen voor omroepdoeleinden hier te
      lande ten behoeve van de uitzending van de programma’s van personen en instellingen die zendtijd hebben verkregen,
      alsmede van zendinrichtingen hier te lande die bestemd zijn voor het uitzenden naar het buitenland van programma’s
      van de Stichting Radio Nederland Wereldomroep;

      b. het ter hand nemen van die werkzaamheden, welke met aanleg en exploitatie van deze zendinrichtingen direct
      verband houden of daaraan verwant zijn, en tevens dienstig zijn om het omroepwezen in Nederland te steunen of het
      doel, genoemd sub *a*, te bevorderen.

      De Vennootschap is tevens bevoegd tot het verrichten van die taken, welke, niet liggende op het eigenlijk gebied
      der programma-verzorging en niet direct verband houdende met aanleg en exploitatie van de sub *a* genoemde
      zendinrichtingen, als voorwerp van samenwerking tusschen de omroeporganisaties te beschouwen zijn en overeenkomstig
      de statuten, zooals deze terzake luiden of zullen luiden, ter hand genomen kunnen worden.

      2 De vennootschap kan bij de uitvoering van de in het eerste lid onder *a* en *b* omschreven taken gebruik maken
      van de diensten van Koninklijke PTT Nederland N.V. of een dochtermaatschappij daarvan, zulks onder nader overeen te
      komen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel1
  - number: '2'
    text: |-
      1 Indien de NOZEMA wordt aangewezen als omroepzendernetwerk als bedoeld in
      [artikel 8.3 van de Telecommunicatiewet][ref1], zijn de [artikelen 5.1 tot en met 5.9 van die wet][ref2] van
      overeenkomstige toepassing op kabels die door NOZEMA worden aangelegd.

      2 De NOZEMA beëindigt geheel of gedeeltelijk het gebruik van de inrichtingen zodra dit bij koninklijk besluit in
      het algemeen belang nodig wordt geoordeeld.

      3 Onze Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van het in het
      tweede lid bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel8.3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '8.3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '5.1'
  - number: '3'
    text: |-
      1 De Vennootschap zal, wat de wijze van oprichting betreft, onderworpen zijn aan de desbetreffende bepalingen
      van het [Wetboek van Koophandel][ref1], met dien verstande, dat de in artikel 36 *e* van het Wetboek bedoelde
      Ministerieele verklaring voor haar niet vereischt zal zijn.

      2 De Vennootschap zal aanvangen op den dag van het verlijden van de acte van oprichting.

      3 Een wijziging van de statuten der Vennootschap zal niet onderworpen zijn aan de in artikel 125 van Boek 2
      (Rechtspersonen) van het Burgerlijk Wetboek bedoelde Ministerieele verklaring.

      4 De Vennootschap zal alleen eindigen in de gevallen als in deze wet en in de statuten bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001838
  - number: '4'
    text: |-
      1 De Staat, de Nederlandse Omroep Stichting en de Stichting Radio Nederland Wereldomroep zullen de enige
      aandeelhouders van de vennootschap zijn. Het totaal der aandelen van de Nederlandse Omroep Stichting bedraagt 2/3
      van dat van de Staat en de Stichting Radio Nederland Wereldomroep tezamen.

      2 De Staat wordt voor alle met het bezit der aandelen verband houdende handelingen vertegenwoordigd door Onze
      Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister belast met de zorg voor de omroep.
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel4
  - number: '5'
    text: |-
      1 Het bestuur der Vennootschap zal berusten bij een Raad van Beheer, bestaande uit 11 leden.

      2 Onze Ministers genoemd in [artikel 4][ref1] benoemen ieder 3 leden. De Stichting Radio Nederland Wereldomroep
      benoemt 1 lid. De Nederlandse Omroep Stichting benoemt 2 leden. De naamloze vennootschap Nederlands Omroepproduktie
      Bedrijf N.V. benoemt 2 leden. De vergaderingen van de Raad van Beheer en de algemene vergadering van aandeelhouders
      kunnen door waarnemers worden bijgewoond, volgens regels die bij of krachtens de statuten worden gesteld.

      3 De Raad voor cultuur heeft het recht een van zijn leden als waarnemer naar de vergaderingen van de Raad van
      Beheer en de algemene vergadering van aandeelhouders af te vaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel4
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '4'
  - number: '6'
    text: |-
      De vennootschap zal worden ontbonden en vereffend:

      a. wanneer bij de wet verklaard wordt, dat het algemeen belang deze ontbinding vordert;

      b. wanneer op een met de steun van tenminste 7 stemmen, waaronder die van de leden benoemd door de Nederlandse
      Omroep Stichting of één van die leden en het lid benoemd door de Stichting Radio Nederland Wereldomroep, tot stand
      gekomen voorstel van de Raad van Beheer de algemene vergadering van aandeelhouders op in de statuten te bepalen
      wijze daartoe besluit en onze ministers genoemd in [artikel 4][ref1] zich met dit besluit verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel4
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '4'
  - number: '7'
    text: |-
      1 Bij ontbinding en vereffening der Vennootschap zal de Staat gerechtigd zijn de activa en passiva der Vennootschap
      tegen boekwaarde over te nemen.

      2 Indien de Vennootschap geen vereffenaars heeft benoemd, geschiedt dit door Onze Minister van Verkeer en
      Waterstaat in overeenstemming met Onze Minister belast met de zorg voor de omroep.
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel7
  - number: '8'
    text: |-
      1 De Raad van Beheer legt aan de algemene vergadering van aandeelhouders in elk geval ter vaststelling voor:

      a. de jaarlijkse investeringsbegroting en de begroting van baten en lasten;

      b. een meerjarenplan indien voor bepaalde projecten de daarvoor benodigde investeringen zich over meer dan één
      jaar uitstrekken.

      2 Bij koninklijk besluit kunnen worden vernietigd beslissingen van de Raad van Beheer tot:

      a. het ter hand nemen van werkzaamheden en het verrichten van de taken anders dan bedoeld in
      [artikel 1, onder ][ref1];

      b. het aangaan van overeenkomsten met buitenlandse ondernemingen;

      c. het vaststellen van de plaats, waar de zenders gebouwd zullen worden;

      d. het aangaan van overeenkomsten, die eenzijdig bezwarend zijn voor de Vennootschap.

      3 Een beslissing als bedoeld in het tweede lid, wordt door de voorzitter van de Raad van Beheer aan Onze Minister
      van Verkeer en Waterstaat en Onze Minister van Onderwijs, Cultuur en Wetenschappen toegezonden, binnen twee weken
      nadat zij is genomen.

      4 De [afdelingen 10.2.2][ref2] en [10.2.3 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing, met dien verstande dat een beslissing niet kan worden vernietigd, indien vier weken zijn verstreken na
      de in het derde lid bedoelde toezending.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '9'
    text: |-
      Onze Ministers genoemd in [artikel 4][ref1] zullen al die maatregelen en beslissingen kunnen nemen tot welke zij
      krachtens de statuten der Vennootschap zijn geroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel4
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '4'
  - number: '10'
    text: |-
      De bepalingen van titel 3 van Boek 2 (Rechtspersonen) van het Burgerlijk Wetboek, in het bijzonder die, welke
      betrekking hebben op terugbetaling op de aandeelen en publicatie van stukken, zullen op de Vennootschap niet
      van toepassing zijn, voorzoover deze bepalingen onvereenigbaar zijn met het doel, de samenstelling en de
      beheersregeling der Vennootschap, zooals deze in deze wet zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel10
  - number: '11'
    text: |-
      De Vennootschap zal gehouden zijn jaarlijks een beredeneerd verslag over den gang van haar bedrijf aan Onze
      Ministers genoemd in [artikel 4][ref1] aan te bieden en een aantal gedrukte exemplaren van dit verslag ter
      beschikking te stellen van de Regeering en van de leden der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001965#Artikel4
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001965
        artikel: '4'
  - number: '12'
    text: |-
      De artikelen dezer wet, die kan worden aangehaald onder den titel van Radio-Omroep-Zender-Wet 1935, treden in
      werking op een door Ons te bepalen tijdstip, dat voor verschillende artikelen verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001965/1998-12-15#Artikel12
