---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_kamers_van_koophandel_en_nijverheid_bes
regulatory_layer: WET
publication_date: '2020-01-27'
valid_from: '2022-01-01'
bwb_id: BWBR0028238
url: https://wetten.overheid.nl/BWBR0028238/2022-01-01
articles:
  - number: '1'
    text: |-
      In de artikelen van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *de Kamers:* de Kamers van
      Koophandel en Nijverheid, bedoeld in [artikel 1a, eerste lid][ref1];
        - *Onze Minister:* de Minister van Economische Zaken en Klimaat;
        - *openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: 1a
  - number: 1a.1
    text: |-
      De handel en nijverheid op Bonaire, Sint Eustatius of Saba wordt door de Kamers van Koophandel en Nijverheid
      vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Er wordt één Kamer ingesteld voor Bonaire, die haar zetel heeft op Bonaire, en één Kamer voor Sint Eustatius en
      Saba gezamenlijk, die haar zetel heeft op Sint Eustatius. Beide Kamers hebben een bestuur dat uit ten minste drie
      en ten hoogste vijf bestuursleden bestaat.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1a
  - number: 1a.3
    text: 'Het bestuur van de Kamer voor Sint Eustatius en Saba bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1a
  - number: 1a.3.a
    text: ten hoogste drie vertegenwoordigers van ondernemingen of rechtspersonen, gevestigd in hetzelfde openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1a
  - number: 1a.3.b
    text: ten minste een vertegenwoordiger van een onderneming of rechtspersoon, gevestigd op Sint Eustatius; en
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1a
  - number: 1a.3.c
    text: ten minste een vertegenwoordiger van een onderneming of rechtspersoon, gevestigd op Saba.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel1a
  - number: '3.1'
    text: |-
      De bestuursleden van de Kamers worden gekozen door de vertegenwoordigers van ondernemingen en rechtspersonen,
      met uitzondering van verenigingen en stichtingen, die in het handelsregister van de desbetreffende Kamer zijn
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de personen die kunnen worden aangemerkt als
      vertegenwoordigers als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel3
  - number: '5.1'
    text: |-
      Tot bestuurslid van de Kamers kunnen worden gekozen de vertegenwoordigers van ondernemingen en rechtspersonen, met
      uitzondering van verenigingen en stichtingen, die
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.1.a
    text: in het handelsregister van de betreffende Kamer zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.1.b
    text: |-
      op het moment van de verkiezingen en gedurende de laatste twee jaren voor de verkiezingen ingeschreven zijn geweest
      in het bevolkingsregister van het openbaar lichaam waar de betreffende Kamer op ziet;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.1.c
    text: op de dag van de stemming de leeftijd van achttien jaren hebben bereikt; en
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.1.d
    text: |-
      van ten minste vijftien kiesgerechtigden voor de Kamer voor Bonaire respectievelijk ten minste vijf
      kiesgerechtigden voor de Kamer voor Sint Eustatius en Saba een schriftelijke verklaring tot ondersteuning van hun
      kandidatuur hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: '5.2'
    text: |-
      Twee vertegenwoordigers van dezelfde onderneming of rechtspersoon, kunnen niet tegelijkertijd bestuurslid zijn van
      dezelfde Kamer.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: '5.3'
    text: 'Niet verkiesbaar zijn personen die:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.3.a
    text: rechtens van hun vrijheid zijn beroofd; of
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.3.b
    text: onder curatele zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: '5.4'
    text: 'Bij algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.4.a
    text: de personen die kunnen worden aangemerkt als vertegenwoordigers als bedoeld in de aanhef van het eerste lid; en
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5.4.b
    text: de verklaring tot ondersteuning, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5
  - number: 5a.1
    text: |-
      Indien het aantal kandidaten dat zich verkiesbaar stelt voor het bestuur van de Kamer voor Bonaire groter is
      dan vijf, vinden er verkiezingen plaats. Is het aantal kandidaten gelijk aan of kleiner dan vijf, treden alle
      kandidaten van rechtswege toe tot het bestuur.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Indien het aantal kandidaten dat zich verkiesbaar stelt voor het bestuur van de Kamer voor Sint Eustatius en Saba
      in beide openbare lichamen groter is dan drie, kiezen vertegenwoordigers van ondernemingen en rechtspersonen die
      gevestigd zijn in het openbaar lichaam Sint Eustatius twee leden en kiezen de vertegenwoordigers van ondernemingen
      en rechtspersonen die gevestigd zijn in het openbaar lichaam Saba twee leden. Als vijfde lid van het bestuur wordt
      diegene gekozen die daarna de meeste stemmen heeft behaald, ongeacht de herkomst van die stemmen.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Indien het aantal kandidaten dat zich verkiesbaar stelt voor het bestuur van de Kamer voor Sint Eustatius en Saba
      in geen van de openbare lichamen groter is dan drie, treden de kandidaten van rechtswege toe tot het bestuur.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5a
  - number: 5a.4
    text: |-
      Indien het aantal kandidaten dat zich verkiesbaar stelt voor het bestuur van de Kamer voor Sint Eustatius en Saba
      in een van de twee openbare lichamen groter is dan drie en in het andere openbare lichaam kleiner is dan drie,
      vinden er verkiezingen plaats voor de leden in het openbaar lichaam waarin meer dan drie leden zich verkiesbaar
      hebben gesteld en treedt de kandidaat of treden de kandidaten in het andere openbare lichaam van rechtswege toe tot
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5a
  - number: 5a.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de procedure van de verkiezing van de
      bestuursleden van de Kamers.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel5a
  - number: '6.1'
    text: |-
      De bestuursleden van de Kamers nemen zitting in het bestuur voor een periode van drie jaren, lopend van 1 januari
      van het eerste jaar tot en met 31 december van derde jaar.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: '6.2'
    text: Het gehele bestuur treedt tegelijk af op 31 december van het derde jaar.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien een lid van het bestuur tussentijds aftreedt, wordt het bestuur, indien er minder dan drie bestuursleden
      over zijn, telkens aangevuld met de eerstvolgende kandidaat die:
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: 6.3.a
    text: bij de laatste verkiezingen de meeste stemmen heeft behaald;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: 6.3.b
    text: sinds de laatste verkiezingen nog geen lid van het bestuur is geweest;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: 6.3.c
    text: instemt met het lidmaatschap; en
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: 6.3.d
    text: |-
      in het geval het de Kamer voor Sint Eustatius en Saba betreft, is ingeschreven in het bevolkingsregister van
      een openbaar lichaam waar ook een van de afgetreden en nog niet vervangen bestuursleden was ingeschreven, met
      inachtneming van het vereiste, bedoeld in [artikel 1a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: 1a
  - number: '6.4'
    text: |-
      Indien twee kandidaten die op grond van het derde lid in aanmerking zouden komen voor een plaats in het bestuur een
      gelijk aantal stemmen hebben behaald, dan beslist het lot.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: '6.5'
    text: |-
      Indien er minder dan drie bestuursleden zijn, en het bestuur niet aangevuld kan worden overeenkomstig het derde
      lid, wordt op voordracht van de overige bestuursleden een bestuurslid benoemd door het Bestuurscollege van
      het openbaar lichaam waar het voorgedragen bestuurslid staat ingeschreven in het bevolkingsregister. Benoeming
      geschiedt alleen indien het voorgedragen bestuurslid voldoet aan de voorwaarden van [artikel 5][ref1] en instemt
      met het lidmaatschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel5
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '5'
  - number: '6.6'
    text: |-
      Het derde tot en met vijfde lid is van overeenkomstige toepassing als, in het geval het de Kamer van Sint Eustatius
      en Saba betreft, de ondernemingen of rechtspersonen van één van de twee openbare lichamen geen bestuurslid hebben
      dat hen vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: '6.7'
    text: |-
      Onverminderd het derde lid, kan het bestuur overeenkomstig het derde en vierde lid worden aangevuld, indien het
      bestuur uit drie of vier leden bestaat.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: '6.8'
    text: |-
      Bij algemene maatregel van bestuur worden aanvullende regels gesteld met betrekking tot het tussentijds aftreden en
      aanvullen van bestuursleden.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel6
  - number: '9.1'
    text: |-
      Er is een verkiezingscommissie die verantwoordelijk is voor de verkiezingsprocedure en tot taak heeft toezicht te
      houden op de verkiezingen.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel9
  - number: '9.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de samenstelling van de verkiezingscommissie
      en de uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel9
  - number: '11'
    text: |-
      De Kamers geven aan Onze Minister en aan het Bestuurscollege, van het gebied waarbinnen zij gevestigd zijn,
      gevraagd en ongevraagd adviezen of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel11
  - number: '12.1'
    text: 'De Kamers hebben tot taak:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: 12.1.a
    text: |-
      het stimuleren van economische ontwikkelingen in hun gebied door middel van het bevorderen van onderzoeken en van
      overleg- en samenwerkingsvormen die de economische belangen van handel en nijverheid in hun gebied betreffen;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: 12.1.b
    text: |-
      het verstrekken van inlichtingen van algemene aard over het oprichten en drijven van een onderneming in hun gebied,
      waaronder juridische en economische voorlichting.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: '12.2'
    text: 'De Kamers kunnen de volgende taken uitvoeren:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: 12.2.a
    text: het afgeven van verklaringen ten dienste van de handel en nijverheid;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: 12.2.b
    text: |-
      het legaliseren van handtekeningen van personen die een onderneming of rechtspersoon in het handelsregister hebben
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: 12.2.c
    text: |-
      het in depot nemen van algemene voorwaarden en het verstrekken van informatie daarover als bedoeld in
      [artikel 234, eerste lid, onderdeel b, van Boek 6 van het Burgerlijk Wetboek BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel234
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '234'
  - number: 12.2.d
    text: het uitvoeren van het hun opgedragen beheer over inrichtingen ten dienste van handel en nijverheid.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: '12.3'
    text: |-
      De Kamers brengen de integrale kosten die samenhangen met het verrichten van de in het tweede lid vermelde
      werkzaamheden in rekening en laste van degene voor wie deze werkzaamheden zijn verricht.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: '12.4'
    text: |-
      De bedragen ter vergoeding van de integrale kosten die samenhangen met het verrichten van de taken, bedoeld in het
      tweede lid, onderdelen a, b en c, worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: '12.5'
    text: |-
      De bedragen ter vergoeding van de kosten die samenhangen met het verrichten van de taken, bedoeld in het tweede
      lid, onderdeel d, kunnen bij ministeriële regeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel12
  - number: '13'
    text: De Kamers kunnen aan instellingen die een algemeen belang van handel en nijverheid bevorderen subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel13
  - number: 13a.1
    text: |-
      De Kamers verrichten, met de baten, bedoeld in [artikel 19, onderdelen a, b, d en e][ref1], geen activiteiten
      waarmee zij rechtstreeks concurreren met ondernemingen of vrije beroepsbeoefenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel19
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '19'
  - number: 13a.2
    text: |-
      De Kamers dragen er zorg voor dat hun werkzaamheden niet leiden tot het verhinderen, beperken of vervalsen van de
      mededinging tussen ondernemingen of vrije beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel13a
  - number: '14'
    text: |-
      De Kamer voor Bonaire heeft een vestiging op Bonaire. De Kamer voor Sint Eustatius en Saba heeft vestigingen op
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel14
  - number: '15.1'
    text: Het bestuur van een Kamer staat aan het hoofd van de Kamer.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15
  - number: '15.2'
    text: Het bestuur benoemt uit zijn midden een voorzitter, een plaatsvervangend voorzitter en een penningmeester.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15
  - number: '15.3'
    text: |-
      De bestuursleden hebben elk gelijk stemrecht. Indien het bestuur bestaat uit een even aantal bestuursleden en de
      stemmen staken bij enig onderwerp, is de stem van de voorzitter doorslaggevend.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15
  - number: '15.4'
    text: |-
      De bestuursleden hebben op persoonlijke titel zitting in het bestuur en oefenen hun functie uit zonder last of
      ruggespraak.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15
  - number: 15a
    text: |-
      Een bestuurslid vervult geen functies die ongewenst zijn met het oog op de goede vervulling van zijn functie als
      bestuurslid of van zijn onafhankelijkheid of het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15a
  - number: 15b.1
    text: Het bestuur draagt zorg voor de uitvoering van de taken van de Kamer.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15b
  - number: 15b.2
    text: 'Het bestuur stelt een bestuursreglement vast, waarin in elk geval regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15b
  - number: 15b.2.a
    text: de wijze waarop beslissingen van het bestuur worden voorbereid, genomen en uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15b
  - number: 15b.2.b
    text: de taak en bevoegdheden van de bestuursleden en de secretaris.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15b
  - number: 15b.3
    text: De voorzitter vertegenwoordigt de Kamer in rechte.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15b
  - number: 15b.4
    text: |-
      De voorzitter en de secretaris vertegenwoordigen bij de uitvoering van bestuursbesluiten gezamenlijk de Kamer
      buiten rechte.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel15b
  - number: '16.1'
    text: Het bestuur benoemt en ontslaat de secretaris.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel16
  - number: '16.2'
    text: De secretaris is het hoofd van het overige personeel en benoemt en ontslaat dat personeel.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel16
  - number: '16.3'
    text: De secretaris heeft in bestuursvergaderingen een raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel16
  - number: '16.4'
    text: Het bestuur stelt de salarissen van de secretaris en het overige personeel vast.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel16
  - number: '17'
    text: |-
      De vergaderingen zijn toegankelijk voor de kiezers. Wanneer de voorzitter of de meerderheid van de bestuursleden
      dat nodig vindt, wordt een besloten vergadering gehouden.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel17
  - number: '19'
    text: 'De baten van de Kamer bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel19
  - number: 19.a
    text: |-
      de opbrengsten uit de krachtens [artikel 12, derde lid][ref1], ontvangen vergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel12
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '12'
  - number: 19.b
    text: de opbrengsten uit vergoedingen voor andere bij of krachtens de wet aan de Kamer opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel19
  - number: 19.c
    text: de opbrengsten uit andere werkzaamheden en uit samenwerking met derden;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel19
  - number: 19.d
    text: het heffen van gelden voor het gebruik van bij haar in beheer zijnde inrichtingen; en
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel19
  - number: 19.e
    text: andere baten voor bij of krachtens de wet aan de Kamer opgedragen taken of voor de bedrijfsvoering van de Kamers.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel19
  - number: '20.1'
    text: |-
      Elke Kamer brengt jaarlijks een verslag uit van haar handelingen in het voorafgaande kalenderjaar en over de
      toestand van handel en nijverheid in dit jaar in haar gebied.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel20
  - number: '20.2'
    text: |-
      In het verslag rapporteert de Kamer over de toepassing van [artikel 13a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel13a
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: 13a
  - number: '20.3'
    text: |-
      Onze Minister en het Bestuurscollege, van het openbaar lichaam waar de Kamer op ziet, ontvangen vóór 1 mei van het
      jaar, dat volgt op het kalenderjaar waarop het verslag betrekking heeft, een exemplaar van het verslag.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel20
  - number: '21'
    text: 'Aan de goedkeuring van het Bestuurscollege worden onderworpen de besluiten van het bestuur betreffende:'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel21
  - number: 21.a
    text: het verlenen van subsidies aan instellingen, die een algemeen belang van handel en nijverheid bevorderen;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel21
  - number: 21.b
    text: |-
      het zich belasten met het beheer van inrichtingen ten dienste van handel en nijverheid, die niet door het openbaar
      gezag in het leven zijn geroepen;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel21
  - number: 21.c
    text: het stichten van inrichtingen ten dienste van handel en nijverheid;
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel21
  - number: 21.d
    text: het kopen, verkopen en bezwaren van onroerende zaken en de rechten waaraan deze zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel21
  - number: '22.1'
    text: |-
      De besluiten van het bestuur kunnen, voor zover zij in strijd zijn met de wet of het algemeen belang door Onze
      Minister van Economische Zaken en Klimaat worden geschorst of vernietigd bij een met redenen omkleed besluit, dat,
      ingeval van schorsing, de duur daarvan bepaalt, en dat bekend wordt gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22
  - number: '22.2'
    text: |-
      Schorsing stuit onmiddellijk de werking van het geschorste besluit. Zij kan niet langer duren dan zes maanden.
      Besluiten, die geschorst zijn geweest, kunnen niet opnieuw geschorst worden.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22
  - number: '22.3'
    text: |-
      Vernietiging wegens strijd met wettelijke regelingen brengt vernietiging mee van alle gevolgen van het vernietigde
      besluit, voor zover die voor vernietiging vatbaar zijn. Bij vernietiging wegens strijd met het algemeen belang
      kunnen niet met dat belang strijdige gevolgen in stand blijven.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22
  - number: '22.4'
    text: |-
      Gedeeltelijke schorsing of vernietiging van een besluit heeft geen invloed op de geldigheid van het niet geschorste
      of niet-vernietigde deel van het besluit.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22
  - number: '22.5'
    text: |-
      Ingeval het bestuur ernstig nalatig is in het naleven van verplichtingen die haar ingevolge deze wet of andere
      wettelijke regelingen zijn opgelegd, besluit de Rijksvertegenwoordiger daarin namens het bestuur te voorzien ten
      koste van de nalatige Kamer. Deze voorziening brengt de bevoegdheid van de Rijksvertegenwoordiger mee om de nodige
      gelden uit de kas van de Kamer te putten, alsmede om over de diensten van de secretaris van de Kamer te beschikken,
      hem personeel toe te wijzen en hem bij gebleken ongeschiktheid of nalatigheid te ontslaan en in zijn vervanging
      te voorzien.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22
  - number: 22a.1
    text: |-
      Het bestuur stelt de begroting en het jaarplan vast en zendt deze aan het Bestuurscollege van het desbetreffende
      openbaar lichaam en aan Onze Minister vóór 1 november van het jaar dat voorafgaat aan het kalenderjaar waarop de
      begroting betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Het bestuur stelt de jaarrekening vast en zendt deze, tegelijkertijd met het jaarverslag, bedoeld in
      [artikel 20][ref1], aan het Bestuurscollege van het desbetreffende openbaar lichaam en aan Onze Minister vóór 1 mei
      van het jaar dat volgt op het kalenderjaar waarop de jaarrekening betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel20
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '20'
  - number: 22b.1
    text: |-
      De jaarrekening, waarin rekening en verantwoording wordt afgelegd over het financieel beheer en van de
      geleverde prestaties in het verstreken boekjaar, wordt zoveel mogelijk met overeenkomstige toepassing van
      [artikel 15 van Boek 2 van het Burgerlijk Wetboek BES][ref1] ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '15'
  - number: 22b.2
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de Kamer
      aangewezen deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1]. Bij de
      aanwijzing van de accountant bedingt een Kamer dat aan Onze Minister desgevraagd inzicht wordt geboden in de
      controlewerkzaamheden van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 22b.3
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door een Kamer.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22b
  - number: 22b.4
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van een Kamer voldoen aan de eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22b
  - number: 22c
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de inrichting van en de toelichting op de
      begroting en de jaarrekening, omtrent eisen met betrekking tot de hoogte en samenstelling van het eigen vermogen en
      omtrent aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel22c
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Wet op de Kamers van Koophandel en Nijverheid BES.'
    url: https://wetten.overheid.nl/BWBR0028238/2022-01-01#Artikel23
