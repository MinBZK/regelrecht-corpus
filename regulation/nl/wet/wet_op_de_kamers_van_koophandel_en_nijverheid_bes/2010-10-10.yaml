---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_kamers_van_koophandel_en_nijverheid_bes
regulatory_layer: WET
publication_date: '2020-01-27'
valid_from: '2010-10-10'
bwb_id: BWBR0028238
url: https://wetten.overheid.nl/BWBR0028238/2010-10-10
articles:
  - number: '1'
    text: |-
      In de artikelen van deze wet wordt verstaan onder openbaar lichaam: het openbaar lichaam Bonaire, Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel1
  - number: 1a.1
    text: |-
      De handel en nijverheid op Bonaire, Sint Eustatius of Saba wordt door de Kamers van Koophandel en Nijverheid
      vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel1a
  - number: 1a.2
    text: |-
      Er wordt één Kamer ingesteld voor Bonaire, welke haar zetel heeft op Bonaire, en één Kamer voor Sint Eustatius en
      Saba gezamenlijk, welke haar zetel heeft op Sint Eustatius. De Kamers bestaan uit ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel1a
  - number: 1a.3
    text: |-
      De verkiezing van de leden van de Kamers en alles wat daarmede in verband staat, wordt geregeld bij een
      afzonderlijk reglement, vastgesteld bij algemene maatregel van bestuur, behoudens de hieronder volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel1a
  - number: '2.1'
    text: De Kamers vertegenwoordigen het grootbedrijf en het kleinbedrijf beide.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      De kiezers voor het grootbedrijf kiezen 3 leden van elke kamer, de kiezers voor het kleinbedrijf kiezen de overige
      leden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Kiezers voor het grootbedrijf zijn de kiesgerechtigden als omschreven in [artikel 3][ref1], wier namen in het
      handelsregister voorkomen als betrokken bij een onderneming of een nevenvestiging voor wier inschrijving in het
      handelsregister een bedrag verschuldigd is dat gebaseerd is op een in de onderneming of nevenvestiging aanwezige
      eigen vermogen van tenminste USD 55.865,92. Alle andere kiesgerechtigden als vorenbedoeld zijn kiezers voor het
      kleinbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel3
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '3'
  - number: '3.1'
    text: |-
      De leden van de kamers worden gekozen; door de ingezetenen van het openbaar lichaam alwaar de Kamer haar gebied
      heeft, (tevens Nederlanders) die gedurende 1 jaar, onmiddellijk voorafgaande aan het opmaken van de kiezerslijst,
      in het handelsregister van het gebied van de Kamer voorkomen, hetzij als eigenaar van een in het gebied van de
      Kamer gevestigde onderneming of nevenvestiging, en wel alleen of tezamen met andere personen, als lid van een
      vennootschap onder firma, of als beherende vennoot van een commanditaire vennootschap, hetzij als directeur, als
      adjunct- of onderdirecteur, aandeelhouder-bestuurder, lid van een algemeen bestuur of een uitvoerend bestuur,
      lid van een raad van beheer of raad van toezicht, of als commissaris, of als bekleed met een andere functie,
      welke de bevoegdheid meebrengt omtrent het besturen of het beheren van een rechtspersoon aan wie een onderneming
      of nevenvestiging toebehoort, hetzij zelfstandig, hetzij krachtens gezamenlijk genomen besluit handelingen te
      verrichten, hetzij als algemeen gevolmachtigde of algemeen procuratiehouder bij een ingeschreven onderneming, mits
      deze de bevoegdheid is toegekend zonder beperking verbintenissen aan te gaan ten bate en ten laste van degene die
      hij vertegenwoordigt, zij het ook dat collectieve tekening daartoe is vereist.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Van het kiesrecht zijn uitgesloten zij, die rechtens van hunne vrijheid zijn beroofd, die krachtens onherroepelijke
      rechterlijke uitspraak wegens krankzinnigheid of zwakheid van vermogens de beschikking of het beheer over hunne
      goederen hebben verloren, die van het ouderlijk gezag over een of meer hunner kinderen ontzet zijn, of die
      ingevolge onherroepelijk geworden rechterlijke uitspraak in staat van faillissement verkeeren of anderszins
      de beschikking of het beheer hunner goederen hebben verloren en zij, aan wie bij onherroepelijke rechterlijke
      uitspraak het kiesrecht is ontzegd.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Zij, wier naam in het handelsregister bij meer dan eene Kamer van Koophandel en Nijverheid voorkomt, hebben slechts
      kiesrecht voor de Kamer binnen welker gebied zij hun woonplaats hebben.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel3
  - number: '3.4'
    text: |-
      De Kamer kan het bewijs vorderen dat de personen in het 1ste lid bedoeld de hoedanigheid bezitten waarop hun opname
      in het handelsregister is gegrond.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel3
  - number: '3.5'
    text: |-
      Als ingezetene bedoeld in den zin van deze verordening wordt beschouwd hij die in het bevolkingsregister van
      Bonaire, Sint Eustatius of Saba is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De Kamer maakt jaarlijks twee kiezerslijsten op van de kiezers, die gerechtigd zijn, hun stem uit te brengen bij
      verkiezingen voor leden van die Kamer. vaartuig bij laag water te lichten of uit hoofde van andere noodzakelijke
      redenen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Deze lijsten blijven van kracht voor de verkiezingen ter vervulling van tusschentijds opengevallen plaatsten,
      totdat de lijsten voor het volgend kalenderjaar zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      De kiezerslijsten voor elke Kamer worden in het gebied van elke Kamer openbaar gemaakt. Tegen die lijsten kunnen
      bezwaren bij de Kamer worden ingediend.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      In het reglement, bedoeld in het [4de lid van artikel 1][ref1] wordt geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel1
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '1'
  - number: 4.5.a
    text: het opmaken der kiezerslijsten;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: 4.5.b
    text: het openbaar maken der kiezerslijsten;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: 4.5.c
    text: |-
      de termijn waarbinnen en de wijze waarop bezwaren tegen de openbaar gemaakte kiezerslijsten kunnen worden
      ingediend;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: 4.5.d
    text: de termijn, waarbinnen en de wijze waarop die bezwaren moet worden beslist;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: 4.5.e
    text: het tijdstip voor het sluiten der kiezerslijsten.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Tot lid eener Kamer kunnen worden gekozen of benoemd zij die gedurende de laatste twee jaren ingezetenen van
      Bonaire, Sint Eustatius of Saba zijn geweest, tevens Nederlanders of Nederlandsche onderdanen zijn en den ouderdom
      van 25 jaren op den 15den oktober van het jaar, waarin de verkiezing valt, hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Twee of meer personen, die tot eenzelfde ingeschreven onderneming of nevenvestiging in betrekking staan als
      eigenaar, directeur, adjunct- of onderdirecteur, aandeelhouder-bestuurder, lid van een algemeen bestuur of een
      uitvoerend bestuur, lid van een raad van beheer of raad van toezicht, of als commissaris, dan wel een andere
      functie bekleden bedoeld in [artikel 3, eerste lid][ref1], kunnen niet tegelijkertijd leden van de Kamer zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel3
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '3'
  - number: '5.3'
    text: |-
      Van de verkiesbaarheid zijn uitgesloten zij, die rechtens van hunne vrijheid zijn beroofd, die krachtens
      onherroepelijke rechtelijke uitspraak wegens krankzinnigheid of zwakheid van vermogens de beschikking of het beheer
      over hunne goederen hebben verloren, die van het ouderlijke gezag over een of meer hunner kinderen ontzet zijn, of
      die ingevolge onherroepelijk geworden rechterlijke uitspraak in staat van faillissement verkeerden of anderszins
      de beschikking of het beheer hunner goederen hebben verloren en zij die van het kiesrecht voor de Kamer of van de
      verkiesbaarheid bij onherroepelijke rechterlijke uitspraak zijn ontzet.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel5
  - number: '6.1'
    text: De leden der Kamer hebben zitting gedurende drie jaren.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Jaarlijks treedt op den 1sten januari een derde der leden van elke Kamer volgens rooster af. Indien het getal leden
      eener Kamer niet deelbaar is door 3 neemt men het dichtbijzijnde veelvoud van drie. Het eerste en het tweede jaar
      treden af telkenmale een derde van dat veelvoud en het derde jaar de rest van het aantal leden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Hij, die ter vervulling eener buiten den bij den rooster bepaalden tijd opengevallen plaats, tot lid eener Kamer is
      verkozen, treedt af op het tijdstip, waarop degeen, in wiens plaats hij verkozen is, moet aftreden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel6
  - number: '6.4'
    text: De aftredende leden kunnen ten hoogste drie maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel6
  - number: '6.5'
    text: |-
      De rooster van aftreden bedoeld in het 2de lid van dit artikel, door de Kamer voor het eerst na toelating der
      voor de eerste maal gekozen nieuwe leden der Kamer vastgesteld, zal voor Bonaire, Sint Eustatius of Saba een
      voortzetting zijn van de ten tijde van het in werking treden dezer wet bestaande rooster, met dien verstande dat de
      onderlinge plaatsing der nieuwe leden bij het lot zal geschieden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De leden der Kamer kunnen te allen tijde hun ontslag nemen; het schriftelijk bericht daarvan wordt door hen
      opgezonden aan de kamer, die daarvan aan het Bestuurscollege, binnen wiens gebied de Kamer gevestigd is, bericht
      geeft.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Zij verliezen van rechtswege hun lidmaatschap, zoodra zich eene der in [artikel 5, derde lid][ref1], vermelde
      omstandigheden voordoet, die de verkiesbaarheid uitsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel5
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '5'
  - number: '7.3'
    text: |-
      Wanneer tusschen twee of meer leden van de Kamer de verboden verhouding bedoeld in het
      [tweede lid van artikel 5][ref1] ontstaat, verliest of verliezen het lid of de leden, die het laatst in die niet
      toegelaten betrekking is of zijn gekomen van rechtswege zijn of hun lidmaatschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel5
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '5'
  - number: '7.4'
    text: |-
      Voorts vervalt het lidmaatschap door het opgeven der vestiging als hoofdverblijf in het openbaar lichaam of door
      een afwezigheid daarvan langer dan 8 maanden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      De Kamer stelt het tijdperk van elke verkiezing vast, en deelt dat mede aan het Bestuurscollege binnen wiens
      gebied zij gevestigd is. Tusschen deze mededeeling en den aanvangsdatum van dat tijdperk moet tenminste een maand
      verloopen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Bij periodieke aftreding, ingevolge [artikel 6, tweede lid][ref1], geschiedt deze mededeeling in de maand Augustus,
      voorafgaande aan de aftreding, en heeft de verkiezing plaats in de maand November of, indien omstandigheden zulks
      noodig maken, in de maand December daaropvolgend; bij het openvallen van plaatsen ingevolge [artikel 7][ref2] en
      in alle andere gevallen geschiedt deze mededeeling binnen één maand na het openvallen en heeft de verkiezing plaats
      binnen drie maanden na die mededeeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028238#Artikel7
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028238
        artikel: '7'
  - number: '9.1'
    text: |-
      Voor de verkiezing van leden van de Kamer van Koophandel en Nijverheid is eene commissie gevestigd in elk openbaar
      lichaam, waar eene kamer haren zetel heeft, hierna te noemen Verkiezingscommissie.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Elke verkiezingscommissie bestaat uit een voorzitter, twee leden en drie plaatsvervangende leden welke voor een
      kalenderjaar uit de kiesgerechtigden voor de Kamer door het Bestuurscollege worden benoemd. Als secretaris treedt
      op de secretaris van de Kamer.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      De Kamer stelt een lokaal beschikbaar voor de zitting van de Verkiezings-commissie en zorgt voor de inrichting van
      dat lokaal.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      De verkiezing geschiedt op de wijze als voorgeschreven is in het reglement bedoeld bij [lid 4 van artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel1
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '1'
  - number: '10.2'
    text: |-
      Het tijdstip en de wijze van indiening van – en de beslissing op de bezwaren tegen eene verkiezing, alsmede omtrent
      afgifte, onderzoek en beslissing over geloofsbrieven en indiening van – en beslissing op bezwaren tegen beslissing
      te dier zake worden tevens in dat reglement vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      De Kamers zijn verplicht aan het Bestuurscollege binnen wiens gebied zij gevestigd zijn, adviezen of inlichtingen
      te geven over die aangelegenheden van handel en nijverheid, waarover door het Bestuurscollege haar oordeel of
      inlichtingen gevraagd worden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Zij kunnen ook uit eigen beweging aan het Bestuurscollege binnen wiens gebied zij gevestigd zijn, zoodanige
      adviezen of inlichtingen geven, en verzoeken of voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel11
  - number: '12'
    text: De Kamers zijn verplicht de functie te verrichten, welke haar door wet of besluiten zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel12
  - number: '13.1'
    text: 'De Kamers zijn bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.a
    text: het verleenen van subsidies aan instellingen, die een algemeen belang van handel en nijverheid bevorderen;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.b
    text: |-
      het zich belasten met het haar opgedragen beheer over al of niet door het Openbaar gezag in het leven geroepen
      inrichtingen ten dienste van handel en nijverheid;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.c
    text: |-
      het afgeven van verklaringen ten dienste van het handelsverkeer, zooals verklaringen omtrent het bestaan en den
      aard van handelsrecht in haar gebied;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.d
    text: het legaliseeren van handteekeningen, die in het handelsregister zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.e
    text: |-
      het heffen van gelden voor het gebruik van bij haar in beheer zijnde inrichtingen en van retributies voor door haar
      aan belanghebbenden bewezen diensten of voor hen verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.f
    text: het verzamelen van statische gegevens;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: 13.1.g
    text: het verrichten van al hetgeen bevorderlijk kan zijn voor de belangen van handel en nijverheid.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: '13.2'
    text: |-
      Zij kunnen van de overheid mededeelingen bekomen van de voor hare verslagen en verzamelingen van statische gegevens
      benoodigde opgaven volgens door het Bestuurscollege te geven voorschriften en behoudens de gevallen, waarin deze
      geheimhouding noodig acht.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel13
  - number: '14'
    text: |-
      De kamers geven sturing aan één uitvoeringsorganisatie welke is gevestigd op Bonaire waar ook voor Bonaire een
      publiekskantoor is. Daarnaast is er zowel op Sint Eustatius als op Saba een publiekskantoor. Het publiekskantoor
      krijgt ondersteuning vanuit de uitvoeringsorganisatie bij de taakuitvoering.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Elke Kamer kiest in de eerste vergadering van elk kalenderjaar uit hare leden een voorzitter en een
      ondervoorzitter.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Bij ontstentenis van den Voorzitter treedt de Ondervoorzitter als zoodanig op. En bij ontstentenis ook van dezen
      laatste treedt als Voorzitter op het lid, dat in een onafgebroken reeks van perioden het langst lid van de Kamer
      is.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel15
  - number: '15.3'
    text: De voorzitter vertegenwoordigt de Kamer in rechten.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Elke Kamer benoemt een Secretaris en een Penningmeester. Deze betrekkingen kunnen door één persoon worden
      waargenomen. Hunne salarissen worden jaarlijks door de Kamer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      De Secretaris en de Penningmeester behoeven geen lid der Kamer te zijn. Indien de Secretaris geen lid der Kamer is,
      heeft hij een raadgevende stem in hare vergaderingen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel16
  - number: '16.3'
    text: De Secretaris en de Penningmeester kunnen door de Kamer worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel16
  - number: '16.4'
    text: |-
      Het verder noodige personeel wordt eveneens door de Kamer benoemd en ontslagen. De salarissen van dit personeel
      worden door de Kamer jaarlijks vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      De vergaderingen zijn toegankelijk voor de kiezers. In gevallen ter beoordeeling van den voorzitter of van de
      meerderheid der Kamer, kunnen geheime vergaderingen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      De Kamer kan personen, niet lid der Kamer zijnde, verzoeken haar tijdens de vergaderingen van voorlichting te
      dienen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel17
  - number: '18'
    text: |-
      Elke Kamer stelt een reglement van orde vast ter regeling van haren inwendigen dienst. Dat reglement en de later
      daarin te brengen wijzigingen behoeven alvorens van kracht te zijn de goedkeuring van het Bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel18
  - number: '19.1'
    text: |-
      De kosten van elke Kamer worden bestreden uit de gelden en retributies bedoeld in [artikel 13][ref1], alsmede uit
      hare overige inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028238#Artikel13
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028238
        artikel: '13'
  - number: '19.2'
    text: Het comptabel toezicht op het geldelijk beheer der Kamers wordt bij huishoudelijk reglement geregeld.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel19
  - number: '20'
    text: |-
      Elke Kamer brengt jaarlijks een verslag uit van haar handelingen in het voorafgaande kalenderjaar en over den
      toestand in dit tijdvak van handel en nijverheid in haar gebied. Het Bestuurscollege, binnen wiens gebied een Kamer
      gevestigd is, ontvangt een exemplaar van dat verslag.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel20
  - number: '21.1'
    text: 'Aan de goedkeuring van het Bestuurscollege worden onderworpen de besluiten der Kamers betreffende:'
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel21
  - number: 21.1.a
    text: het verleenen van subsidies aan instellingen, die een algemeen belang van handel en nijverheid bevorderen;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel21
  - number: 21.1.b
    text: |-
      het zich belasten met het beheer van inrichtingen ten dienste van handel en nijverheid, welke niet door het
      openbaar gezag in het leven zijn geroepen;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel21
  - number: 21.1.c
    text: het stichten van inrichtingen ten dienste van handel en nijverheid;
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel21
  - number: 21.1.d
    text: het koopen, verkoopen en bezwaren van onroerende zaken en de rechten waaraan deze zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel21
  - number: '21.2'
    text: |-
      De Kamers geven aan het Bestuurscollege, binnen wiens gebied zij gevestigd zijn, alle gewenste inlichtingen omtrent
      haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      De besluiten der Kamers kunnen, voor zover zij in strijd zijn met de wet of het algemeen belang door Onze Minister
      van Economische Zaken worden geschorst of vernietigd bij een met redenen omkleed besluit, dat, ingeval van
      schorsing, den duur daarvan bepaalt, en welk besluit bekend wordt gemaakt in de courant, waarin officieele stukken
      worden gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      Schorsing stuit onmiddellijk de werking van het geschorste besluit. Zij kan niet langer duren dan zes maanden.
      Besluiten, die geschorst zijn geweest, kunnen niet opnieuw geschorst worden.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel22
  - number: '22.3'
    text: |-
      Vernietiging wegens strijd met wettelijke regelingen brengt mede vernietiging van alle gevolgen van het vernietigde
      besluit, voor zoover die voor vernietiging vatbaar zijn. Bij vernietiging wegens strijd met het algemeen belang
      kunnen niet met dat belang strijdige gevolgen in stand blijven.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel22
  - number: '22.4'
    text: |-
      Gedeeltelijke schorsing of vernietiging van een besluit heeft geen invloed op de geldigheid van het niet geschorste
      of niet-vernietigde deel van het besluit.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel22
  - number: '22.5'
    text: |-
      Ingeval eene Kamer ernstig nalatig is in het naleven van haar ingevolge deze wet of andere wettelijke regelingen
      opgelegde verplichtingen, wordt daarin door de Rijksvertegenwoordiger voor de openbare lichamen ten koste van de
      nalatige Kamer voorzien. Deze voorziening brengt mede de bevoegdheid van de Rijksvertegenwoordiger voor de openbare
      lichamen om de noodige gelden uit de kas der Kamer te putten, alsmede om over de diensten van den Secretaris/
      Penningmeester der Kamer te beschikken, hem personeel toe te wijzen en hem bij gebleken ongeschiktheid of
      nalatigheid te ontslaan en in deze vervanging te voorzien.
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Wet op de Kamers van Koophandel en Nijverheid BES.'
    url: https://wetten.overheid.nl/BWBR0028238/2010-10-10#Artikel23
