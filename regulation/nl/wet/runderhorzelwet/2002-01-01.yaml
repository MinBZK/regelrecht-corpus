preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke voorschriften tot bestrijding van de
    runderhorzel uit te vaardigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002109/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder "runderhorzelvlieg":

      a. de grote runderhorzelvlieg (Hypoderma bovis);

      b. de kleine runderhorzelvlieg (Hypoderma lineatum).

      2 Voorts verstaat deze wet onder:

      "houder van runderen": hij, die één of meer runderen onder beheer of toezicht heeft, tenzij zulks geschiedt voor
      korte duur en uitsluitend ten behoeve van het vervoer van runderen dan wel tijdens de aanwezigheid van runderen
      op markten, keuringen, tentoonstellingen, openbare verkopingen of soortgelijke tijdelijke verzamelplaatsen van
      rundvee.
    url: https://wetten.overheid.nl/BWBR0002109/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Iedere houder van runderen is verplicht alle larven van runderhorzelvliegen, welker aanwezigheid bij die runderen
      door bulten of andere uiterlijke kentekenen blijkt, te doden, of te doen doden.
    url: https://wetten.overheid.nl/BWBR0002109/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Het is verboden runderen in het weiland te brengen of toe te laten, indien deze runderen bulten of andere
      uiterlijke kentekenen vertonen, welke duiden op de aanwezigheid van larven van runderhorzelvliegen.
    url: https://wetten.overheid.nl/BWBR0002109/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Het is verboden runderen, op welke zich blijkens bulten of andere uiterlijke kentekenen larven van
      runderhorzelvliegen bevinden, aan te voeren op een markt, een keuring, een tentoonstelling, een openbare verkoping
      of op een soortgelijke tijdelijke verzamelplaats van rundvee.
    url: https://wetten.overheid.nl/BWBR0002109/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 Overtreding van een der [artikelen 2][ref1], [3][ref2] en [4][ref3] wordt gestraft met hechtenis van ten
      hoogste één jaar of geldboete van de eerste categorie.

      2 Het feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0002109#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002109#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002109#Artikel4
    url: https://wetten.overheid.nl/BWBR0002109/2002-01-01#Artikel5
