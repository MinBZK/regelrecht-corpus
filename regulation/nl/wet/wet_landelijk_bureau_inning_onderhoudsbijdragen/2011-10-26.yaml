---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_landelijk_bureau_inning_onderhoudsbijdragen
regulatory_layer: WET
publication_date: '2013-02-28'
valid_from: '2011-10-26'
bwb_id: BWBR0007292
url: https://wetten.overheid.nl/BWBR0007292/2011-10-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de uitoefening van de taken met betrekking tot de
    inning van onderhoudsbijdragen voor kinderen en de vaststelling en inning van ouderbijdragen jeugdhulpverlening
    door de dependance Gouda van de raad voor de kinderbescherming Den Haag en door de daar gedetacheerde werkeenheid
    van het Ministerie van Volksgezondheid, Welzijn en Sport te verzelfstandigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel1
  - number: 1.b
    text: |-
      het Bureau: het Landelijk Bureau Inning Onderhoudsbijdragen, bedoeld in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.c
    text: |-
      de raad: de raad van toezicht, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel3
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.d
    text: |-
      de directie: de directie, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel3
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.1'
    text: Er is een Landelijk Bureau Inning Onderhoudsbijdragen, dat gevestigd is te Rotterdam.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: '2.2'
    text: Het Bureau bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: '2.3'
    text: 'Het Bureau is belast met de hem:'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: 2.3.a
    text: |-
      bij of krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] opgedragen taken ter zake van de inning van
      onderhoudsbijdragen voor minderjarigen en meerderjarigen die de leeftijd van eenentwintig jaar nog niet
      hebben bereikt en ter zake van de inning van uitkeringen tot levensonderhoud ten behoeve van een echtgenoot of
      geregistreerd partner;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 2.3.b
    text: |-
      bij of krachtens de [Wet op de jeugdzorg][ref1] opgedragen taken ter zake van de vaststelling en inning van
      ouderbijdragen; en


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: 2.3.c
    text: bij andere wetten opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: '2.4'
    text: |-
      Het Bureau treedt op als ontvangende en verzendende instelling als bedoeld in artikel 2 van het Verdrag inzake het
      verhaal in het buitenland van uitkeringen tot onderhoud en als bedoeld in artikel 11, derde lid, van het Europees
      Verdrag inzake de rechtspositie van migrerende werknemers. Het Bureau treedt op als centrale autoriteit, bedoeld
      in artikel 4 van het op 23 november 2007 te ’s-Gravenhage tot stand gekomen Verdrag inzake de internationale inning
      van levensonderhoud voor kinderen en andere familieleden (PbEU 2011, L 192/51) en artikel 49 van verordening (EG)
      nr. 4/2009 van de Raad van 18 december 2008 betreffende de bevoegdheid, het toepasselijke recht, de erkenning en de
      tenuitvoerlegging van beslissingen, en de samenwerking op het gebied van onderhoudsverplichtingen (PbEU L 7/1).
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: '2.5'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het Bureau daarbij aangegeven andere taken kan verrichten
      dan die, bedoeld in het derde en vierde lid, indien deze taken:
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: 2.5.a
    text: nauw verband houden met de in het derde lid genoemde taken;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: 2.5.b
    text: |-
      toepassing met zich brengen van de produktiemiddelen die het Bureau voor de vervulling van zijn in het derde lid
      genoemde taken gebruikt;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: 2.5.c
    text: niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: 2.5.d
    text: tegen kostendekkende tarieven worden verricht.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel2
  - number: '3'
    text: Het Bureau heeft een directie en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel3
  - number: '4.1'
    text: De directie bestaat uit ten hoogste drie leden.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel4
  - number: '4.2'
    text: Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel4
  - number: '4.3'
    text: |-
      De leden van de directie worden aangesteld, geschorst en ontslagen door de raad van toezicht. Zij kunnen voor
      bepaalde tijd worden aangesteld.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel4
  - number: '4.4'
    text: |-
      De regeling van de bezoldiging en verdere rechtspositie van de leden van de directie behoeft de goedkeuring van
      Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel4
  - number: '5.1'
    text: De directie is belast met de dagelijkse leiding van het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel5
  - number: '5.2'
    text: |-
      Alle bevoegdheden van het Bureau die niet bij of krachtens de wet aan de raad zijn opgedragen, komen toe aan de
      directie.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel5
  - number: '6.1'
    text: De directie vertegenwoordigt het Bureau in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel6
  - number: '6.2'
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taken van het Bureau dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel6
  - number: '7'
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet de raad in de waarneming van diens
      functie.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel7
  - number: '8.1'
    text: |-
      De directie is verantwoording verschuldigd aan de raad. Zij verstrekt de raad tijdig de voor de uitoefening van
      diens taak benodigde inlichtingen en andere gegevens.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel8
  - number: '8.2'
    text: |-
      De directie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      aanleiding bestaat, aan de raad verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel8
  - number: '9.1'
    text: De raad bestaat uit vijf leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel9
  - number: '9.2'
    text: Een persoon in dienst van het Bureau kan niet tevens lid zijn van de raad.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel9
  - number: '9.3'
    text: Onze minister kan aan de leden van de raad een vacatiegeld toekennen ten laste van het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel9
  - number: '9.4'
    text: |-
      De leden van de raad hebben aanspraak op vergoeding door het Bureau van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel9
  - number: '9.5'
    text: |-
      De leden van de raad hebben daarin op persoonlijke titel zitting en oefenen hun functie uit zonder last of
      ruggespraak.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel9
  - number: '10.1'
    text: |-
      Onze minister benoemt, schorst en ontslaat in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en
      Sport, de voorzitter en de overige leden van de raad.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel10
  - number: '10.2'
    text: |-
      De raad doet Onze minister voor iedere te vervullen plaats in de raad een aanbeveling van één persoon. De
      aanbeveling is met redenen omkleed. Onze minister wijkt niet van de aanbeveling af, dan na overleg met de raad.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel10
  - number: '10.3'
    text: |-
      De leden van de raad worden benoemd voor een periode van ten hoogste vier jaar. Zij kunnen eenmaal worden
      herbenoemd.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel10
  - number: '10.4'
    text: De leden van de raad kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel10
  - number: '10.5'
    text: |-
      Zolang niet is voorzien in een vacature in de raad, vormen de overblijvende leden de raad. Indien alle leden
      ontbreken, benoemt Onze minister in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport,
      onverwijld een of meer personen die tijdelijk de taken van de raad vervullen.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel10
  - number: '10.6'
    text: |-
      Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden en is vervolgens voor een aansluitende periode éénmaal
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel10
  - number: '11.1'
    text: |-
      De raad ziet toe op de werkzaamheden van de directie en op de algemene gang van zaken in het Bureau. Hij staat de
      directie met raad ter zijde.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel11
  - number: '11.2'
    text: De raad regelt bij reglement zijn werkwijze, waaronder in ieder geval de openbaarheid van zijn vergaderingen.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel11
  - number: '11.3'
    text: De raad kan geen geldige besluiten nemen, indien niet ten minste drie leden ter vergadering aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel11
  - number: '12.1'
    text: 'Aan de goedkeuring van de raad zijn onderworpen de besluiten van de directie met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
  - number: 12.1.a
    text: |-
      de reglementen, bedoeld in de[ artikelen 13][ref1] en [16, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007292#Artikel16
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007292
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 12.1.b
    text: |-
      de begroting, bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel17
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 12.1.c
    text: investeringen die een door de raad vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
  - number: 12.1.d
    text: |-
      het verrichten van werkzaamheden als bedoeld in [artikel 2, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: 12.1.e
    text: |-
      het aangaan of verbreken van duurzame samenwerking met een andere rechtspersoon, indien deze samenwerking of
      verbreking van ingrijpende betekenis is voor het Bureau;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
  - number: 12.1.f
    text: het oprichten of mede-oprichten van een privaatrechtelijke rechtspersoon of het deelnemen in een vennootschap;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
  - number: 12.1.g
    text: belangrijke reorganisaties.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
  - number: '12.2'
    text: |-
      Besluiten als bedoeld in het eerste lid, onder *f*, behoeven bovendien de goedkeuring van Onze minister en van Onze
      Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel12
  - number: '13'
    text: De directie stelt bij reglement de hoofdlijnen vast van de organisatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel13
  - number: '14.1'
    text: |-
      Het personeel van het Bureau, de leden van de directie daaronder niet begrepen, wordt benoemd, geschorst en
      ontslagen door de directie.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel14
  - number: '14.2'
    text: |-
      De rechtspositie van het personeel van het Bureau is overeenkomstig de regels, zoals die gelden voor ambtenaren die
      zijn aangesteld bij de ministeries met dien verstande dat, waar in deze regels een bevoegdheid is toegekend aan een
      andere minister dan Onze Minister van Binnenlandse Zaken, deze bevoegdheid wordt uitgeoefend door de directie.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel14
  - number: '15.1'
    text: 'De inkomsten van het bureau bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
  - number: 15.1.a
    text: |-
      de opbrengsten uit de opslag van kosten, bedoeld in
      [artikel 408, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel408
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '408'
  - number: 15.1.b
    text: de opbrengsten uit vergoedingen voor andere bij of krachtens de wet aan het Bureau opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
  - number: 15.1.c
    text: andere baten, hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
  - number: '15.2'
    text: |-
      Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport verstrekken jaarlijks aan het Bureau een
      subsidie voor de kosten van de uitvoering van de taken, bedoeld in [artikel 2, derde lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.3'
    text: |-
      Onze minister verstrekt jaarlijks aan het Bureau een subsidie voor de kosten van de uitvoering van de taken,
      bedoeld in [artikel 2, derde lid, onder a][ref1]. Eveneens wordt jaarlijks aan het Bureau een subsidie verstrekt
      voor de kosten van de uitvoering van de taken, bedoeld in [artikel 2, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.4'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing op de subsidies, bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '15.5'
    text: |-
      Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport geven jaarlijks voor 1 september van enig
      kalenderjaar, doch niet dan nadat zij daarover met het Bureau hebben overlegd, het bedrag van de subsidie aan dat
      voor het daaropvolgende kalenderjaar aan het Bureau zal worden verstrekt en nemen dit bedrag op in de voorstellen
      van wet tot vaststelling van de begroting van onderscheidenlijk het Ministerie van Justitie en het Ministerie van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
  - number: '15.6'
    text: |-
      Indien de subsidie wordt verstrekt ten laste van een begroting die nog niet is vastgesteld, wordt zij verleend
      onder de voorwaarde, bedoeld in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.7'
    text: |-
      Het Bureau trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van de vorige
      volzin is het aan het Bureau toegestaan ter overbrugging van tijdelijke kastekorten bij een bank die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland haar bedrijf mag uitoefenen tijdelijke kredieten in rekening-
      courant op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '16.1'
    text: |-
      De directie houdt zodanige aantekeningen omtrent de vermogenstoestand van het Bureau dat daaruit te allen tijde
      zijn rechten en verplichtingen kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel16
  - number: '16.2'
    text: |-
      De directie stelt bij reglement de werkwijze vast voor het financiële beheer en de administratieve organisatie van
      het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel16
  - number: '16.3'
    text: Het boekjaar van het Bureau is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel16
  - number: '17'
    text: |-
      De directie stelt tijdig voor de afloop van het boekjaar een financiële begroting vast voor het volgende boekjaar.
      De begroting is in overeenstemming met het meerjarenbeleidsplan, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel18
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Tegelijk met de opstelling van de financiële begroting stelt de directie een meerjarenbeleidsplan op. Het
      meerjarenbeleidsplan wordt vastgesteld door de raad.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel18
  - number: '18.2'
    text: 'Het meerjarenbeleidsplan geeft voor de eerstvolgende vijf boekjaren in elk geval:'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel18
  - number: 18.2.a
    text: |-
      een overzicht van de door het Bureau te verrichten werkzaamheden ter uitvoering van de aan het Bureau bij of
      krachtens de wet opgedragen taken en een raming van de daarmee gemoeide kosten en opbrengsten;
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel18
  - number: 18.2.b
    text: |-
      een overzicht van de voorgenomen andere werkzaamheden van het Bureau, als bedoeld in [artikel 2, vijfde lid][ref1],
      en een raming van de daarmee gemoeide kosten en opbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.1'
    text: |-
      De raad zendt de door hem goedgekeurde begroting en het door hem vastgestelde meerjarenbeleidsplan voor 1 juli van
      het daaraan voorafgaande boekjaar toe aan Onze minister en aan Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel19
  - number: '19.2'
    text: |-
      Bij toezending van de in het eerste lid bedoelde stukken kan de raad aan Onze minister een beredeneerd voorstel
      doen tot wijziging van de kostenopslag, bedoeld in [artikel 408 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel408
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '408'
  - number: '20'
    text: |-
      Het meerjarenbeleidsplan behoeft de goedkeuring van Onze minister die deze niet verleent dan in overeenstemming
      met Onze Minister van Volksgezondheid, Welzijn en Sport. Onze minister kan het meerjarenbeleidsplan gedeeltelijk
      goedkeuren of aan de goedkeuring voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel20
  - number: '21.1'
    text: |-
      Jaarlijks binnen drie maanden na afloop van het boekjaar maakt de directie een jaarrekening op en stelt een verslag
      van werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
  - number: '21.2'
    text: |-
      De jaarrekening wordt vastgesteld door de raad. Zij behoeft de goedkeuring van Onze minister en van Onze Minister
      van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
  - number: '21.3'
    text: |-
      De jaarrekening voldoet aan het bepaalde daaromtrent in [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1]
      met uitzondering van de [artikelen 392][ref2] en de bepalingen welke een in aandelen verdeeld kapitaal van de
      vennootschap veronderstellen. Het verslag van werkzaamheden omvat in ieder geval mededelingen omtrent het gevoerde
      beleid gedurende het boekjaar, alsmede omtrent de doelmatigheid en doeltreffendheid van de werkwijze van het
      Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '21.4'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de raad
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1] alsmede
      van een opgave van de gebeurtenissen na de balansdatum met belangrijke financiële gevolgen voor het Bureau, onder
      mededeling van de omvang van die gevolgen. Voorts gaat de jaarrekening vergezeld van een beoordeling omtrent
      de rechtmatigheid van de uitvoering van de bij of krachtens deze wet gestelde bepalingen, alsmede van de bij of
      krachtens het Burgerlijk Wetboek en de [Wet op de jeugdzorg][ref2] gestelde bepalingen, voor zover deze worden
      uitgevoerd door het Bureau. Bij de aanwijzing van de accountant wordt bedongen dat aan Onze minister of Onze
      Minister van Volksgezondheid, Welzijn en Sport op diens verzoek inzicht wordt geboden in de controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0016637
  - number: '21.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop de beoordeling van de
      rechtmatigheid, bedoeld in het vierde lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
  - number: '21.6'
    text: |-
      De raad zendt de jaarrekening, het verslag van werkzaamheden en de stukken, bedoeld in het vierde lid, binnen
      vier maanden na afloop van het boekjaar toe aan Onze minister en aan Onze Minister van Volksgezondheid, Welzijn en
      Sport. Onze minister kan deze termijn in bijzondere omstandigheden verlengen, doch ten hoogste met zes maanden.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
  - number: '21.7'
    text: |-
      Binnen acht dagen na de goedkeuring maakt het Bureau de jaarrekening openbaar door terinzagelegging op het kantoor
      van het Bureau. Van de terinzagelegging wordt mededeling gedaan in de *Staatscourant*. De directie ziet erop toe
      dat aan een ieder die daarom verzoekt, inzage wordt verleend in de in het eerste lid genoemde stukken, en een
      volledig of gedeeltelijk afschrift daarvan wordt verstrekt tegen ten hoogste de kostprijs van het maken van zodanig
      afschrift.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
  - number: '21.8'
    text: |-
      [Artikel 139 van boek 2 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing ten aanzien van de
      directie en, voor zover het betreft de jaarrekening, ook ten aanzien van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel139
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '139'
  - number: '22.1'
    text: |-
      De directie en de raad verstrekken Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport,
      desgevraagd alle voor de uitoefening van hun taak benodigde inlichtingen. Onze minister en Onze Minister van
      Volksgezondheid, Welzijn en Sport kunnen inzage verlangen van gegevens en bescheiden, voor zover dat voor de
      vervulling van hun taken redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel22
  - number: '22.2'
    text: |-
      Onze minister kan bepalen dat de directie inlichtingen als bedoeld in het eerste lid, aan hem verstrekt in de vorm
      van een periodieke rapportage.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel22
  - number: '23'
    text: |-
      De Gemeentelijke Sociale Diensten, Onze Minister van Onderwijs, Cultuur en Wetenschap dan wel,
      voor zover het betreft het onderwijs of onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, de inspecteur der rijksbelastingen,
      de Sociale verzekeringsbank, het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de ambtenaren van de burgerlijke
      stand en de gemeentebesturen, voor zover het betreft de gemeentelijke basisadministraties persoonsgegevens, zijn
      verplicht aan het Bureau kosteloos alle inlichtingen te verstrekken ten behoeve van de uitvoering van de taken,
      bedoeld in [artikel 2, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '24'
    text: |-
      Indien het Bureau zijn taken, bedoeld in [artikel 2, derde en vierde lid][ref1], naar het oordeel van Onze minister
      en Onze Minister van Volksgezondheid, Welzijn en Sport verwaarloost, kunnen zij voorzieningen treffen. Onze
      minister doet hiervan terstond mededeling aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '33.1'
    text: |-
      De ambtenaren die op het tijdstip van inwerkingtreding van deze wet behoren tot het personeel van de dependance
      Gouda van de raad voor de kinderbescherming, van wie naam en functie zijn vermeld op een door Onze minister
      vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en aangesteld als ambtenaar met een
      rechtspositie die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij de dependance
      Gouda van de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel33
  - number: '33.2'
    text: |-
      De ambtenaren die op het tijdstip van inwerkingtreding van deze wet behoren tot het personeel van het
      Ministerie van Volksgezondheid, Welzijn en Sport dat is gedetacheerd bij de dependance Gouda van de raad voor de
      kinderbescherming, van wie naam en functie zijn vermeld op een door Onze Minister van Volksgezondheid, Welzijn en
      Sport vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en aangesteld als ambtenaar met
      een rechtspositie die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het Ministerie
      van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel33
  - number: '34'
    text: |-
      Archiefbescheiden van de dependance Gouda van de raad voor de kinderbescherming gaan met ingang van het tijdstip
      van inwerkingtreding van deze wet over naar het Bureau, voor zover zij niet overeenkomstig de Archiefwet 1962 zijn
      overgebracht naar een archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel34
  - number: '35.1'
    text: |-
      Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport bepalen welke vermogensbestanddelen van de
      Staat worden toebedeeld aan het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel35
  - number: '35.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze wet
      onder algemene titel en om niet over op het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel35
  - number: '36.1'
    text: |-
      De eerste benoeming van de leden van de directie geschiedt, in afwijking van [artikel 4, derde lid][ref1], door
      Onze Minister in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel4
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      Bij de eerste benoeming van de leden van de raad is [artikel 11, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel11
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '37'
    text: |-
      Tot het tijdstip waarop de reglementen, bedoeld in de [artikelen 13][ref1] en [16, tweede lid][ref2], in werking
      treden, blijven de voorschriften van kracht die ter zake golden onmiddellijk voorafgaand aan het tijdstip van de
      inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007292#Artikel16
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007292
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '38.1'
    text: |-
      In procedures waarin tot het tijdstip van inwerkingtreding van deze wet de raad voor de kinderbescherming op grond
      van de uitvoering van de taken, bedoeld in [artikel 2, derde of vierde lid][ref1], optreedt, treedt het Landelijk
      Bureau Inning Onderhoudsbijdragen in zijn plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '38.2'
    text: |-
      In procedures waarin tot het tijdstip van inwerkingtreding van deze wet de Staat dan wel Onze
      Minister van Volksgezondheid, Welzijn en Sport op grond van de uitvoering van de taken, bedoeld in
      [artikel 2, derde lid, onder b][ref1], optreedt, treedt het Bureau in zijn plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '38.3'
    text: |-
      In zaken waarin voor het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 12 van de Wet Nationale ombudsman][ref1] aan de Nationale ombudsman is verzocht een onderzoek te doen
      dan wel de Nationale ombudsman op grond van [artikel 15 van die wet][ref2] een onderzoek heeft ingesteld naar
      een gedraging die kan worden toegerekend aan de dependance Gouda van de raad voor de kinderbescherming dan
      wel aan de daar gedetacheerde werkeenheid van het Ministerie van Volksgezondheid, Welzijn en Sport, treden
      de directie, onderscheidenlijk de raad van toezicht op dat tijdstip als bestuursorgaan in de zin van de
      [Wet Nationale ombudsman][ref3] in de plaats van Onze minister onderscheidenlijk Onze Minister van Volksgezondheid,
      Welzijn en Sport. Op gedragingen van voor het tijdstip van inwerkingtreding van deze wet die kunnen worden
      toegerekend aan de dependance Gouda van de raad voor de kinderbescherming dan wel aan de daar gedetacheerde
      werkeenheid van het Ministerie van Volksgezondheid, Welzijn en Sport, en waarover de Nationale ombudsman op het
      tijdstip van inwerkingtreding van deze wet nog geen verzoek als bedoeld in [artikel 12][ref4] heeft bereikt, maar
      nog wel kan bereiken, is de eerste volzin eveneens van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003372
      [ref4]: https://wetten.overheid.nl/BWBR0007292#Artikel12
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0003372
      - id: ref4
        bwb_id: BWBR0007292
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '39'
    text: Deze wet treedt in werking met ingang van 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel39
  - number: '40'
    text: 'Deze wet kan worden aangehaald als: Wet Landelijk Bureau Inning Onderhoudsbijdragen.'
    url: https://wetten.overheid.nl/BWBR0007292/2011-10-26#Artikel40
