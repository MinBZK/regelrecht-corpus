        artikel: '2'
        hoofdstuk: '1'
  - number: '38.2'
    text: |-
      In procedures waarin tot het tijdstip van inwerkingtreding van deze wet de Staat dan wel Onze
      Minister van Volksgezondheid, Welzijn en Sport op grond van de uitvoering van de taken, bedoeld in
      [artikel 2, derde lid, onder b][ref1], optreedt, treedt het Bureau in zijn plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel38
