  - number: '38.1'
    text: |-
      In procedures waarin tot het tijdstip van inwerkingtreding van deze wet de raad voor de kinderbescherming op grond
      van de uitvoering van de taken, bedoeld in [artikel 2, derde of vierde lid][ref1], optreedt, treedt het Landelijk
      Bureau Inning Onderhoudsbijdragen in zijn plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel38
    references:
