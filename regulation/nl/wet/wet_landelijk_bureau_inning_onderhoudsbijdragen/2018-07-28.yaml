---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_landelijk_bureau_inning_onderhoudsbijdragen
regulatory_layer: WET
publication_date: '2013-02-28'
valid_from: '2018-07-28'
bwb_id: BWBR0007292
url: https://wetten.overheid.nl/BWBR0007292/2018-07-28
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de uitoefening van de taken met betrekking tot de
    inning van onderhoudsbijdragen voor kinderen en de vaststelling en inning van ouderbijdragen jeugdhulpverlening
    door de dependance Gouda van de raad voor de kinderbescherming Den Haag en door de daar gedetacheerde werkeenheid
    van het Ministerie van Volksgezondheid, Welzijn en Sport te verzelfstandigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel1
  - number: 1.b
    text: |-
      het Bureau: het Landelijk Bureau Inning Onderhoudsbijdragen, bedoeld in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.c
    text: |-
      de directie: de directie, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel3
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.d
    text: |-
      de Kaderwet: de [Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '2.1'
    text: Er is een Landelijk Bureau Inning Onderhoudsbijdragen, dat gevestigd is te Rotterdam.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: '2.2'
    text: Het Bureau bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: '2.3'
    text: 'Het Bureau is belast met de hem:'
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: 2.3.a
    text: |-
      bij of krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] opgedragen taken ter zake van de inning van
      onderhoudsbijdragen voor minderjarigen en meerderjarigen die de leeftijd van eenentwintig jaar nog niet
      hebben bereikt en ter zake van de inning van uitkeringen tot levensonderhoud ten behoeve van een echtgenoot of
      geregistreerd partner; en


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 2.3.b
    text: bij andere wetten opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: '2.4'
    text: |-
      Het Bureau treedt op als ontvangende en verzendende instelling als bedoeld in artikel 2 van het Verdrag inzake het
      verhaal in het buitenland van uitkeringen tot onderhoud en als bedoeld in artikel 11, derde lid, van het Europees
      Verdrag inzake de rechtspositie van migrerende werknemers. Het Bureau treedt op als centrale autoriteit, bedoeld
      in artikel 4 van het op 23 november 2007 te ’s-Gravenhage tot stand gekomen Verdrag inzake de internationale inning
      van levensonderhoud voor kinderen en andere familieleden (PbEU 2011, L 192/51) en artikel 49 van verordening (EG)
      nr. 4/2009 van de Raad van 18 december 2008 betreffende de bevoegdheid, het toepasselijke recht, de erkenning en de
      tenuitvoerlegging van beslissingen, en de samenwerking op het gebied van onderhoudsverplichtingen (PbEU L 7/1).
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: '2.5'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het Bureau daarbij aangegeven andere taken kan verrichten
      dan die, bedoeld in het derde en vierde lid, indien deze taken:
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: 2.5.a
    text: nauw verband houden met de in het derde lid genoemde taken;
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: 2.5.b
    text: |-
      toepassing met zich brengen van de produktiemiddelen die het Bureau voor de vervulling van zijn in het derde lid
      genoemde taken gebruikt;
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: 2.5.c
    text: niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: 2.5.d
    text: tegen kostendekkende tarieven worden verricht.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
  - number: '2.6'
    text: |-
      De [Kaderwet][ref1] is van toepassing op het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '3'
    text: Het Bureau heeft een directie.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel3
  - number: '4.1'
    text: De directie bestaat uit ten hoogste drie leden.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel4
  - number: '4.2'
    text: |-
      De rechtspositie van de leden van de directie, voor zover niet geregeld in de
      [Kaderwet zelfstandige bestuursorganen][ref1], van de leden van de directie wordt geregeld bij regeling van Onze
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '5'
    text: De directie is belast met de dagelijkse leiding van het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel5
  - number: '6.1'
    text: De directie vertegenwoordigt het Bureau in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel6
  - number: '6.2'
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taken van het Bureau dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel6
  - number: '13'
    text: De directie stelt bij bestuursreglement de hoofdlijnen vast van de organisatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel13
  - number: '15.1'
    text: 'De inkomsten van het bureau bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
  - number: 15.1.a
    text: |-
      de opbrengsten uit de opslag van kosten, bedoeld in
      [artikel 408, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel408
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '408'
  - number: 15.1.b
    text: de opbrengsten uit vergoedingen voor andere bij of krachtens de wet aan het Bureau opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
  - number: 15.1.c
    text: andere baten, hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister verstrekt jaarlijks aan het Bureau een subsidie voor de kosten van de uitvoering van de taken,
      bedoeld in [artikel 2, derde lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.3'
    text: |-
      Onze minister verstrekt jaarlijks aan het Bureau een subsidie voor de kosten van de uitvoering van de taken,
      bedoeld in [artikel 2, derde lid, onder a][ref1]. Eveneens wordt jaarlijks aan het Bureau een subsidie verstrekt
      voor de kosten van de uitvoering van de taken, bedoeld in [artikel 2, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.4'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing op de subsidies, bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '15.5'
    text: |-
      Onze Minister geeft jaarlijks voor 1 september, nadat hij daarover met het Bureau heeft overlegd, het bedrag van de
      subsidie aan dat in het daarop volgende kalenderjaar aan het Bureau zal worden verstrekt en neemt dit bedrag op in
      het voorstel van wet tot vaststelling van de begroting van het Ministerie van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
  - number: '15.6'
    text: |-
      Indien de subsidie wordt verstrekt ten laste van een begroting die nog niet is vastgesteld, wordt zij verleend
      onder de voorwaarde, bedoeld in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.7'
    text: |-
      Het Bureau trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van de vorige
      volzin is het aan het Bureau toegestaan ter overbrugging van tijdelijke kastekorten bij een bank die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland haar bedrijf mag uitoefenen tijdelijke kredieten in rekening-
      courant op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '16.1'
    text: |-
      De directie houdt zodanige aantekeningen omtrent de vermogenstoestand van het Bureau dat daaruit te allen tijde
      zijn rechten en verplichtingen kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel16
  - number: '16.2'
    text: |-
      De directie stelt bij bestuursreglement de werkwijze vast voor het financiële beheer en de administratieve
      organisatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel16
  - number: '16.3'
    text: Het boekjaar van het Bureau is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel16
  - number: '17'
    text: |-
      De directie stelt tijdig voor de afloop van het boekjaar het ontwerp van een financiële begroting vast voor het
      volgende boekjaar. De begroting is in overeenstemming met het meerjarenbeleidsplan, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel18
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Tegelijk met de opstelling van het ontwerp van de financiële begroting stelt de directie een ontwerp van een
      meerjarenbeleidsplan op.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel18
  - number: '18.2'
    text: 'Het meerjarenbeleidsplan geeft voor de eerstvolgende vijf boekjaren in elk geval:'
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel18
  - number: 18.2.a
    text: |-
      een overzicht van de door het Bureau te verrichten werkzaamheden ter uitvoering van de aan het Bureau bij of
      krachtens de wet opgedragen taken en een raming van de daarmee gemoeide kosten en opbrengsten;
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel18
  - number: 18.2.b
    text: |-
      een overzicht van de voorgenomen andere werkzaamheden van het Bureau, als bedoeld in [artikel 2, vijfde lid][ref1],
      en een raming van de daarmee gemoeide kosten en opbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.1'
    text: |-
      De directie zendt de vastgestelde begroting en het vastgestelde meerjarenbeleidsplan voor 1 juli van het daaraan
      voorafgaande boekjaar toe aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel19
  - number: '19.2'
    text: |-
      Bij toezending van de in het eerste lid bedoelde stukken kan de directie aan Onze minister een beredeneerd voorstel
      doen tot wijziging van de kostenopslag, bedoeld in [artikel 408 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel408
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '408'
  - number: '20'
    text: |-
      Het meerjarenbeleidsplan behoeft de goedkeuring van Onze minister. Onze minister kan het meerjarenbeleidsplan
      gedeeltelijk goedkeuren of aan de goedkeuring voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel20
  - number: '21'
    text: |-
      Binnen acht dagen na de vaststelling maakt het Bureau de jaarrekening openbaar door terinzagelegging op het kantoor
      van het Bureau. Van de terinzagelegging wordt mededeling gedaan in de Staatscourant. De directie ziet erop toe dat
      aan een ieder die daarom verzoekt, inzage wordt verleend in de jaarrekening en het jaarverslag, en een volledig of
      gedeeltelijk afschrift daarvan wordt verstrekt tegen ten hoogste de kostprijs van het maken van zodanig afschrift.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel21
  - number: '22'
    text: |-
      Onze minister kan bepalen dat de directie inlichtingen als bedoeld in
      [artikel 20, eerste lid, van de Kaderwet][ref1] aan hem verstrekt in de vorm van een periodieke rapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '23'
    text: |-
      De Gemeentelijke Sociale Diensten, Onze Minister van Onderwijs, Cultuur en Wetenschap dan wel,
      voor zover het betreft het onderwijs of onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, de inspecteur der rijksbelastingen,
      de Sociale verzekeringsbank, het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de ambtenaren van de
      burgerlijke stand en de gemeentebesturen, voor zover het betreft de basisregistratie personen, bedoeld in de
      [Wet basisregistratie personen][ref2], zijn verplicht aan het Bureau kosteloos alle inlichtingen te verstrekken ten
      behoeve van de uitvoering van de taken, bedoeld in [artikel 2, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0033715
      [ref3]: https://wetten.overheid.nl/BWBR0007292#Artikel2
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0033715
      - id: ref3
        bwb_id: BWBR0007292
        artikel: '2'
        hoofdstuk: '1'
  - number: '33.1'
    text: |-
      De ambtenaren die op het tijdstip van inwerkingtreding van deze wet behoren tot het personeel van de dependance
      Gouda van de raad voor de kinderbescherming, van wie naam en functie zijn vermeld op een door Onze minister
      vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en aangesteld als ambtenaar met een
      rechtspositie die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij de dependance
      Gouda van de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel33
  - number: '33.2'
    text: |-
      De ambtenaren die op het tijdstip van inwerkingtreding van deze wet behoren tot het personeel van het
      Ministerie van Volksgezondheid, Welzijn en Sport dat is gedetacheerd bij de dependance Gouda van de raad voor de
      kinderbescherming, van wie naam en functie zijn vermeld op een door Onze Minister van Volksgezondheid, Welzijn en
      Sport vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en aangesteld als ambtenaar met
      een rechtspositie die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het Ministerie
      van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel33
  - number: '34'
    text: |-
      Archiefbescheiden van de dependance Gouda van de raad voor de kinderbescherming gaan met ingang van het tijdstip
      van inwerkingtreding van deze wet over naar het Bureau, voor zover zij niet overeenkomstig de Archiefwet 1962 zijn
      overgebracht naar een archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel34
  - number: '35.1'
    text: |-
      Onze minister en Onze Minister van Volksgezondheid, Welzijn en Sport bepalen welke vermogensbestanddelen van de
      Staat worden toebedeeld aan het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel35
  - number: '35.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze wet
      onder algemene titel en om niet over op het Bureau.
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel35
  - number: '36.1'
    text: |-
      De eerste benoeming van de leden van de directie geschiedt, in afwijking van [artikel 4, derde lid][ref1], door
      Onze Minister in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel4
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      Bij de eerste benoeming van de leden van de raad is [artikel 11, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel11
    url: https://wetten.overheid.nl/BWBR0007292/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007292
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '37'
    text: |-
      Tot het tijdstip waarop de reglementen, bedoeld in de [artikelen 13][ref1] en [16, tweede lid][ref2], in werking
      treden, blijven de voorschriften van kracht die ter zake golden onmiddellijk voorafgaand aan het tijdstip van de
      inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007292#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007292#Artikel16
