        artikel: '12'
        hoofdstuk: '4'
  - number: 28.1.b
    text: de toegang tot en de aansluiting op het informatiesysteem;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel28
  - number: 28.1.c
    text: beheerpolygonen, oriëntatiepolygonen en graafpolygonen.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel28
  - number: '28.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de situatie dat vanwege
      de door een calamiteit geboden spoed niet aan [artikel 2, eerste en derde lid][ref1], kan worden voldaan dan
      wel de in [hoofdstuk 4][ref2] beschreven procedure kan worden gevolgd, waarbij voor zover nodig van dat artikel
      onderscheidenlijk de bepalingen van dat hoofdstuk kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel28
