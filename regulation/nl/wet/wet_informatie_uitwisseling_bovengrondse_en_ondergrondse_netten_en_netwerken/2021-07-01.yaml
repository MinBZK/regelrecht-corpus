  - number: '29.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de gebiedsinformatie die
      op grond van de [artikelen 11 tot en met 13][ref1] aan de grondroerder of de aanbieder van een openbaar
      telecommunicatienetwerk wordt verstrekt, waarbij voor verschillende categorieën graafwerkzaamheden,
      netwerkexploitanten, fysieke infrastructuur of civiele werkzaamheden verschillende regels kunnen worden gesteld, en
      de wijze waarop die gebiedsinformatie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel11
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      Bij regeling van het bestuur van de Dienst worden regels gesteld omtrent de wijze waarop de registratie van
      beheerders of netwerkexploitanten, bedoeld in [artikel 6][ref1] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel6
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '6'
        hoofdstuk: '3'
  - number: '29.3'
    text: |-
      Bij regeling van het bestuur van de Dienst kunnen regels worden gesteld omtrent de tijden gedurende welke
      oriëntatieverzoeken en graafmeldingen kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel29
  - number: '30'
    text: |-
      Bij algemene maatregel van bestuur kunnen gebieden worden aangewezen ten aanzien waarvan om veiligheidsredenen kan
      worden afgeweken van de voorschriften gesteld bij of krachtens [hoofdstuk 4][ref1]. Daarbij kunnen regels worden
      gesteld over de informatie-uitwisseling omtrent die gebieden of de daarin gelegen fysieke infrastructuur of civiele
      werken.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0040728
        hoofdstuk: '4'
  - number: '31'
    text: |-
      Indien de in deze wet geregelde onderwerpen in het belang van een goede uitvoering van [richtlijn nr. 2014/61]
      (32014L0061)/EU nadere regeling behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel31
  - number: '32.1'
    text: |-
