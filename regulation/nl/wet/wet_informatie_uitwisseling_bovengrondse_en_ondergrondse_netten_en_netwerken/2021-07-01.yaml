  - number: '35'
    text: |-
      De bevoegdheid, de gemeenteraad toekomend ingevolge [artikel 149 van de Gemeentewet][ref1], blijft ten aanzien van
      het verrichten van graafwerkzaamheden gehandhaafd voor zover de door hem te maken verordeningen niet met deze wet
      in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
  - number: 35a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens iedere vijf jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet op het voorkomen van graafschade
      in de praktijk.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel35a
  - number: '41'
    text: |-
      Op bezwaar en beroep ingevolge de [Wet informatie-uitwisseling ondergrondse netten][ref1] dat is ingediend tegen
      een besluit van voor de datum van inwerkingtreding van deze wet, blijven de bij of krachtens de Wet informatie-
      uitwisseling ondergrondse netten geldende voorschriften zoals die luidden onmiddellijk voorafgaand aan het tijdstip
      van inwerkingtreding van deze wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023775
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023775
  - number: 41a.1
    text: |-
      In afwijking van [artikel 11][ref1] is een beheerder voor de delen van zijn net die bestaan uit de niet met
      andere kabels of leidingen samengebonden delen van kabels of leidingen die een verbinding vormen tussen een
      net dat naar zijn aard voor aansluiting van huishoudens wordt opengesteld, en één onroerende zaak als bedoeld
      in [artikel 16, onderdeel a tot en met e, van de Wet waardering onroerende zaken][ref2] niet verplicht om
      liggingsgegevens daarvan aan de Dienst te verstrekken voor zover hij die liggingsgegevens niet beschikbaar heeft in
      de voor overdracht via het elektronische informatiesysteem, bedoeld in [artikel 4][ref3], voorgeschreven weergave
      en voor zover geen sprake is van renovatie of onderhoud van de desbetreffende delen van zijn net.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0040728#Artikel4
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0040728
        artikel: '4'
        hoofdstuk: '3'
  - number: 41a.2
    text: |-
      Ten aanzien van een net als bedoeld in [artikel 1, eerste lid, onderdeel m, van de Gaswet][ref1] is het eerste lid
      van toepassing tot en met 31 december 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 41a.3
    text: |-
      Ten aanzien van een net als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1],
      een net bestaande uit een collectiefleidingnet of een distributienet als bedoeld in
      [artikel 1, eerste lid, van de Drinkwaterwet][ref2] of een net bestaande uit een ondergrondse kabel als bedoeld
      in [artikel 1.1 van de Telecommunicatiewet][ref3] en waarvan de ligging anders dan door opgraving kan worden
      bepaald is het eerste lid van toepassing tot en met 31 december 2027. Na 31 december 2027 kunnen bij ministeriële
      regeling nadere regels worden gesteld over de bepaling van de ligging, anders dan door opgraving, van een net of
      distributienet waarvan de ligging enkel door opgraving kan worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '1'
  - number: '42'
    text: |-
      De [Wet informatie-uitwisseling ondergrondse netten][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0023775
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel42
    references:
