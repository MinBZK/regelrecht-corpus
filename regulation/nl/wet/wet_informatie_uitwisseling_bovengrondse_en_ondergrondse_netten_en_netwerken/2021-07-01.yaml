preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de implementatie van richtlijn 2014/61/EU van het Europese
    Parlement en de Raad van 15 mei 2014 inzake maatregelen ter verlaging van de kosten van de aanleg van
    elektronischecommunicatienetwerken met hoge snelheid (PbEU 2014, L 155) maatregelen vergt waardoor medegebruik
    van bestaande fysieke infrastructuur en coördineren van civiele werken wordt bevorderd teneinde de aanleg van
    elektronische communicatienetwerken met hoge snelheid te stimuleren, alsmede dat daartoe uitbreiding nodig is van
    de bestaande wettelijke informatie-uitwisseling tussen beheerders van netten; dat het wenselijk is de regels voor
    informatie-uitwisseling over ondergrondse en bovengrondse elementen van netten en netwerken onder te brengen in
    dezelfde wet; dat gelet hierop de Wet informatie-uitwisseling ondergrondse netten wordt vervangen door een wet die
    ziet op de informatie-uitwisseling omtrent ondergrondse en bovengrondse elementen van netten en netwerken;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanbieder:* een aanbieder van een openbaar
      elektronisch communicatienetwerk als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref1];
        - *beheerder:* degene die als natuurlijk persoon handelende in de uitoefening van een beroep of een bedrijf dan wel
      als rechtspersoon een net beheert;
        - *beheerpolygoon:* de weergave door een beheerder respectievelijk door een netwerkexploitant van een
      aaneengesloten gebied, waarbinnen een beheerder een of meer netten beheert, respectievelijk een netwerkexploitant
      fysieke infrastructuur beheert;
        - *civiele werken:* civiele werken als bedoeld in [artikel 5a.1 van de Telecommunicatiewet][ref2];
        - *coördinatie:*coördinatie van civiele werken als bedoeld in artikel 5 van richtlijn nr. 2014/61/EU;
        - *Dienst:* de Dienst voor het kadaster en de openbare registers, bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref3];
        - *fysieke infrastructuur:* fysieke infrastructuur als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref4];
        - *gebiedsinformatie:* het geheel van informatie dat door beheerders of netwerkexploitanten, ingevolge de
      [artikelen 11, eerste lid][ref5], en [12, eerste lid en tweede lid, onderdeel a][ref6], aan de Dienst is verstrekt
      over de betrokken oriëntatiepolygoon dan wel graafpolygoon;
        - *graafbericht:* het bericht van de Dienst, bedoeld in [artikel 10, onderdeel b, onder 1°][ref7];
        - *graaflocatie:* de locatie waar graafwerkzaamheden worden verricht;
        - *graafmelding:* de melding aan de Dienst van voorgenomen graafwerkzaamheden, bedoeld in
      [artikel 8, eerste lid][ref8];
        - *graafpolygoon:* de weergave door een grondroerder van het gebied, waarbinnen de graaflocatie zich bevindt;
        - *graafwerkzaamheden:* het mechanisch verrichten van werkzaamheden in de ondergrond;
        - *grondroerder:* degene onder wiens verantwoordelijkheid of leiding graafwerkzaamheden worden verricht;
        - *liggingsgegevens:* de gegevens omtrent de ligging van een net of netwerk binnen de betrokken oriëntatiepolygoon
      dan wel graafpolygoon;
        - *medegebruik:* medegebruik van fysieke infrastructuur als bedoeld in
      [artikel 5a.3, eerste en vierde lid, van de Telecommunicatiewet][ref9];
        - *net:* een ondergrondse kabel of leiding, daaronder mede begrepen lege buizen, ondergrondse ondersteuningswerken
      en beschermingswerken, bestemd voor transport van vaste, vloeibare of gasvormige stoffen, van energie of van
      informatie;
        - *net met gevaarlijke inhoud:* een buisleiding die behoort tot een krachtens
      [artikel 12.12, tweede lid, van de Wet milieubeheer][ref10] aangewezen categorie;
        - *netwerk:* een netwerk van een netwerkexploitant;
        - *netwerkexploitant:* een netwerkexploitant als bedoeld in [artikel 5a.1 van de Telecommunicatiewet][ref11];
        - *netwerk met hoge snelheid:* een elektronisch communicatienetwerk met hoge snelheid als bedoeld in
      [artikel 1.1 van de Telecommunicatiewet][ref12];
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *opdrachtgever:* degene die opdracht geeft tot het uitvoeren van een werk waarbij graafwerkzaamheden worden
      verricht;
        - *oriëntatiepolygoon:* de weergave door een opdrachtgever, grondroerder, aanbieder of bestuursorgaan
      van een aangesloten gebied, ten aanzien waarvan deze met het oog op een belang als bedoeld in
      [artikel 7, eerste, tweede of derde lid][ref13], om gebiedsinformatie verzoekt;
        - *oriëntatieverzoek:* het verzoek aan de Dienst om gebiedsinformatie, bedoeld in artikel 7, eerste tot en met
      derde lid;
        - *registratiemelding:* de melding van de beheerder of een netwerkexploitant, bedoeld in
      [artikel 6, tweede of derde lid][ref14];
        - *richtlijn nr. 2014/61/EU:* [richtlijn nr. 2014/61](32014L0061)/EU van het Europees Parlement en de
      Raad van de Europese Unie van 15 mei 2014 inzake maatregelen ter verlaging van kosten van de aanleg van
      elektronischecommunicatienetwerken met hoge snelheid (PbEU 2014 L 155).


