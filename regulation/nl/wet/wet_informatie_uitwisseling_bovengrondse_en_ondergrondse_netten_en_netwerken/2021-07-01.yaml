  - number: '43'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel43
  - number: '44'
    text: 'Deze wet wordt aangehaald als: Wet informatie-uitwisseling bovengrondse en ondergrondse netten en netwerken.'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel44
