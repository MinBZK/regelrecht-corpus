  - number: '2.1'
    text: |-
      De opdrachtgever draagt er zorg voor dat de graafwerkzaamheden waartoe hij opdracht geeft, op zorgvuldige wijze
      kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel2
  - number: '2.2'
    text: De grondroerder verricht de graafwerkzaamheden op zorgvuldige wijze.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel2
  - number: '2.3'
    text: 'Ter uitvoering van het tweede lid zorgt de grondroerder ten minste dat:'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel2
  - number: 2.3.a
    text: vóór aanvang van de graafwerkzaamheden een graafmelding is gedaan,
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel2
  - number: 2.3.b
    text: onderzoek is verricht naar de precieze ligging van onderdelen van netten op de graaflocatie, en
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel2
  - number: 2.3.c
    text: op de graaflocatie de van de Dienst ontvangen gebiedsinformatie aanwezig is.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      De aanleg, de instandhouding en de opruiming van netten door een beheerder geschieden op zodanige wijze dat het
      beheer van andere netten niet in gevaar wordt gebracht of zonder noodzaak wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      De beheerder die in strijd handelt met het eerste lid, neemt op eigen kosten maatregelen ten aanzien van het
      betreffende onderdeel van zijn net, waaronder zonodig het verplaatsen daarvan, om aan de strijdigheid onverwijld
      een einde te maken.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Er is een elektronisch informatiesysteem waarmee informatie tussen beheerders, netwerkexploitanten, aanbieders,
      opdrachtgevers, grondroerders en bestuursorganen wordt uitgewisseld, voor zover dat nodig is ter:
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel4
  - number: 4.1.a
    text: preventie van graafschade;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel4
  - number: 4.1.b
    text: oriëntatie op een verzoek tot medegebruik;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel4
  - number: 4.1.c
    text: oriëntatie op een verzoek tot coördinatie.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      De informatie, bedoeld in het eerste lid, wordt door de gebruikers die de informatie via het elektronisch
      informatiesysteem ontvangen vertrouwelijk behandeld en uitsluitend aan derden verstrekt voor zover dat noodzakelijk
      is voor het bereiken van de in het eerste lid, genoemde doelen.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      In het elektronische informatiesysteem wordt op verzoek van een beheerder informatie bewaard als bedoeld in
      [artikel 5a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel5a
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: 5a
        hoofdstuk: '3'
  - number: '5.1'
    text: De Dienst is belast met het beheer van het elektronische informatiesysteem.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5
  - number: '5.2'
    text: 'De Dienst verstrekt op verzoek via het elektronische informatiesysteem gebiedsinformatie aan:'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5
  - number: 5.2.a
    text: |-
      opdrachtgevers en grondroerders ten behoeve van het voorbereiden van graafwerkzaamheden en het op zorgvuldige wijze
      verrichten van graafwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5
  - number: 5.2.b
    text: aanbieders ten behoeve van de voorbereiding van een verzoek tot medegebruik of coördinatie;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5
  - number: 5.2.c
    text: bestuursorganen voor zover deze gebiedsinformatie noodzakelijk is voor de uitvoering van hun taak.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5
  - number: 5a.1
    text: |-
      Een beheerder kan de Dienst verzoeken om met betrekking tot elk net dat hij beheert in het elektronische
      informatiesysteem de volgende informatie te bewaren:
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5a
  - number: 5a.1.a
    text: informatie over de ligging van het net;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5a
  - number: 5a.1.b
    text: relevante eigenschappen van het net;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5a
  - number: 5a.1.c
    text: |-
      informatie over voorzorgsmaatregelen als bedoeld in [artikel 15, eerste of tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel15
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '15'
        hoofdstuk: '4'
  - number: 5a.1.d
    text: contactgegevens van de beheerder.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5a
  - number: 5a.2
    text: |-
      De beheerder op wiens verzoek informatie wordt bewaard als bedoeld in het eerste lid geeft elke wijziging in die
      informatie onverwijld door aan de Dienst.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel5a
  - number: '6.1'
    text: 'De Dienst registreert de beheerpolygonen en de beheerders ten behoeve van de informatie-uitwisseling over:'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.1.a
    text: ondergrondse netten;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.1.b
    text: fysieke infrastructuur van netwerkexploitanten;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.1.c
    text: geplande civiele werken van netwerkexploitanten.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: '6.2'
    text: Degene die
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.2.a
    text: |-
      een net beheert of gaat beheren dat niet ligt binnen een door de Dienst op zijn naam geregistreerde beheerpolygoon,
      of
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.2.b
    text: |-
      niet langer een net zal beheren dat ligt binnen een door de Dienst op zijn naam geregistreerde beheerpolygoon of
      deel daarvan,
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid is tevens van toepassing op een netwerkexploitant die fysieke infrastructuur beheert, gaat beheren
      of niet langer fysieke infrastructuur zal beheren, met uitzondering van degene die:
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.3.a
    text: reeds heeft voldaan aan de verplichtingen in het tweede lid, onderdelen a en b, of
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: 6.3.b
    text: |-
      uitsluitend antenne-opstelpunten beheert en diegene de informatie als bedoeld in
      [artikel 12, eerste lid, onderdelen a tot en met c][ref1], omtrent die antenne-opstelpunten middels het
      antenneregister toegankelijk heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel12
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '12'
        hoofdstuk: '4'
  - number: '6.4'
    text: |-
      Indien sprake is van overdracht van een net of een deel van dat net, doen de oude en de nieuwe beheerder
      gezamenlijk melding van de wijziging, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een opdrachtgever of een grondroerder kan de Dienst om gebiedsinformatie verzoeken ten behoeve van het voorbereiden
      van graafwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: '7.2'
    text: 'Een aanbieder kan de Dienst om gebiedsinformatie verzoeken ten behoeve van het voorbereiden van een verzoek tot:'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: 7.2.a
    text: medegebruik;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: 7.2.b
    text: coördinatie.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      Een bestuursorgaan kan de Dienst om gebiedsinformatie verzoeken voor zover deze informatie noodzakelijk is voor de
      uitvoering van de hem opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: '7.4'
    text: |-
      Bij een oriëntatieverzoek geeft de opdrachtgever, de grondroerder, de aanbieder of het bestuursorgaan een
      oriëntatiepolygoon op.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: '7.5'
    text: |-
      Bij een oriëntatieverzoek als bedoeld in het tweede lid, wordt het gebied aangeduid waarin de elementen van een
      netwerk met hoge snelheid worden aangelegd alsmede of het verzoek betrekking heeft op fysieke infrastructuur of op
      civiele werken.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      Een grondroerder meldt het voornemen tot het verrichten van graafwerkzaamheden aan de Dienst ten hoogste twintig
      werkdagen voorafgaande aan de aanvang van die graafwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel8
  - number: '8.2'
    text: Bij de graafmelding geeft de grondroerder een graafpolygoon op.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de graafwerkzaamheden ten hoogste een bij algemene maatregel van
      bestuur te bepalen diepgang hebben en uitgevoerd zullen worden in grond die in eigendom of beheer is van de
      grondroerder en hij weet dat sinds de voorafgaande graafmelding de ligging van de netten in deze grond niet is
      veranderd.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen bepaalde categorieën grondroerders worden aangewezen die zijn vrijgesteld
      van de verplichting om een graafmelding te doen voor zover zij graafwerkzaamheden verrichten in grond die in
      eigendom of in beheer is van de grondroerder en die graafwerkzaamheden niet dieper gaan dan 50 cm onder het
      maaiveld.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      Vrijstelling laat de op de grondroerder rustende zorgplichten, bedoeld in
      [artikel 2, eerste, tweede en derde lid, onderdeel b][ref1], onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel2
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '2'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      [Artikel 2, derde lid, onderdelen a en c][ref1], is niet van toepassing op de grondroerders, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel2
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '2'
        hoofdstuk: '2'
  - number: '9.4'
    text: |-
      Voor de toepassing van dit artikel wordt de opdrachtgever voor graafwerkzaamheden als bedoeld in het eerste lid
      aangemerkt als grondroerder indien de opdrachtgever eigenaar of beheerder is van de grond waarin de werkzaamheden
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Na ontvangst van een oriëntatieverzoek als bedoeld in [artikel 7, eerste, tweede of derde lid][ref1], of van een
      graafmelding als bedoeld in [artikel 8][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel8
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '7'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0040728
        artikel: '8'
        hoofdstuk: '4'
  - number: 10.a
    text: |-
      verstrekt de Dienst aan degene die het oriëntatieverzoek of de graafmelding heeft gedaan onverwijld een
      ontvangstbevestiging;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel10
  - number: 10.b
    text: 'bericht de Dienst hierover onverwijld onder vermelding van de oriëntatiepolygoon of graafpolygoon:'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel10
  - number: 10.b.1°
    text: |-
      indien het graafwerkzaamheden betreft: alle beheerders wier beheerpolygoon geheel of gedeeltelijk samenvalt met
      deze oriëntatiepolygoon onderscheidenlijk graafpolygoon;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel10
  - number: 10.b.2°
    text: |-
      indien het medegebruik van fysieke infrastructuur of de coördinatie van civiele werken betreft: alle
      netwerkexploitanten wier beheerpolygoon geheel of gedeeltelijk samenvalt met deze oriëntatiepolygoon.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onverwijld doch uiterlijk binnen één werkdag na verzending van een graafbericht verstrekt een beheerder via het
      elektronische informatiesysteem in ieder geval de volgende informatie omtrent zijn net binnen de betreffende
      oriëntatiepolygoon aan de Dienst:
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
  - number: 11.1.a
    text: de liggingsgegevens;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
  - number: 11.1.b
    text: de relevante eigenschappen van zijn net;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
  - number: 11.1.c
    text: |-
      in voorkomend geval welke voorzorgsmaatregelen als bedoeld in [artikel 15, eerste of tweede lid][ref1],
      noodzakelijk zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel15
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '15'
        hoofdstuk: '4'
  - number: 11.1.d
    text: zijn contactgegevens.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
  - number: '11.2'
    text: |-
      De beheerder van wie de Dienst informatie bewaart als bedoeld in [artikel 5a][ref1] voldoet daarmee aan het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel5a
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: 5a
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      Indien een beheerder de termijn, genoemd in het eerste lid, overschrijdt, doet de Dienst daarvan onverwijld
      mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      Indien een verzoek betrekking heeft op medegebruik verstrekt een netwerkexploitant via het elektronische
      informatiesysteem onverwijld doch uiterlijk binnen twee werkdagen nadat de Dienst een oriëntatieverzoek als bedoeld
      in [artikel 10, aanhef en onderdeel b, subonderdeel 2°][ref1], heeft doorgezonden, in ieder geval de volgende
      informatie omtrent zijn netwerk binnen de betreffende oriëntatiepolygoon aan de Dienst:


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel10
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '10'
        hoofdstuk: '4'
  - number: 12.1.a
    text: de locatie en route van zijn fysieke infrastructuur;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
  - number: 12.1.b
    text: aard en huidig gebruik van zijn fysieke infrastructuur, en
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
  - number: 12.1.c
    text: zijn contactgegevens.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      Indien een verzoek betrekking heeft op coördinatie verstrekt een netwerkexploitant, in ieder geval de volgende
      informatie omtrent zijn netwerk binnen de betreffende oriëntatiepolygoon:
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
  - number: 12.2.a
    text: |-
      zijn contactgegevens: onverwijld doch uiterlijk binnen twee werkdagen nadat de Dienst een oriëntatieverzoek als
      bedoeld in [artikel 10, aanhef en onderdeel b, subonderdeel 2°][ref1], heeft doorgezonden en via het elektronische
      informatiesysteem aan de Dienst;


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel10
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '10'
        hoofdstuk: '4'
  - number: 12.2.b
    text: |-
      de locatie en het type werkzaamheden, de betrokken netwerkelementen, en de geraamde datum voor de aanvang van de
      werkzaamheden en de duur daarvan: binnen twee weken en per post, per fax of per elektronische post aan de aanbieder
      die om informatie omtrent coördineren heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
  - number: '12.3'
    text: |-
      De verplichtingen in het eerste lid en het tweede lid, aanhef en onderdeel a, zijn niet van toepassing op een
      netwerkexploitant die uitsluitend antenne-opstelpunten beheert en de informatie, bedoeld in het eerste lid,
      onderdelen a tot en met c, omtrent zijn antenne-opstelpunten middels het antenneregister toegankelijk heeft
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel12
  - number: '13.1'
    text: |-
      De Dienst verstrekt gebiedsinformatie via het elektronische informatiesysteem onverwijld na ontvangst van
      alle informatie als bedoeld in [artikel 5a, eerste lid][ref1], of de [artikelen 11, eerste lid][ref2], en
      [12, eerste lid en tweede lid, onderdeel a][ref3] doch uiterlijk binnen twee werkdagen na verzending van het
      graafbericht of het verzoek om informatie als bedoeld in [artikel 10, onderdeel b, subonderdeel 1°][ref4], aan
      degene die het oriëntatieverzoek of de graafmelding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0040728#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0040728#Artikel10
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: 5a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0040728
        artikel: '12'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0040728
        artikel: '10'
        hoofdstuk: '4'
  - number: '13.2'
    text: |-
      De Dienst informeert een beheerder van wie de Dienst informatie bewaart als bedoeld in [artikel 5a][ref1] over de
      informatie, bedoeld in [artikel 11, eerste lid, onderdelen a tot en met d][ref2], die de Dienst namens hem heeft
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel11
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: 5a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
  - number: '13.3'
    text: |-
      Indien de Dienst niet binnen de termijn, bedoeld in het eerste lid, respectievelijk de termijn
      van [artikel 12][ref1], van alle beheerders de ingevolge de [artikelen 11, eerste lid][ref2], en
      [12, eerste lid en tweede lid, onderdeel a][ref3], vereiste informatie heeft ontvangen, doet de Dienst daarvan
      mededeling bij het verstrekken van de gebiedsinformatie.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0040728#Artikel12
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '12'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0040728
        artikel: '12'
        hoofdstuk: '4'
  - number: 13a.1
    text: |-
      Indien de van de Dienst verkregen gebiedsinformatie naar het oordeel van de grondroerder of opdrachtgever
      onvoldoende is voor een zorgvuldige voorbereiding of uitvoering van de voorgenomen graafwerkzaamheden, verstrekt de
      beheerder aan de grondroerder of opdrachtgever op diens verzoek nadere informatie over zijn net.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13a
  - number: 13a.2
    text: |-
      De beheerder verstrekt de nadere informatie onverwijld, doch uiterlijk binnen drie werkdagen na ontvangst van het
      verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13a
  - number: 13b.1
    text: |-
      Indien ingeval van een graafmelding sprake is van een melding van voorzorgsmaatregelen als bedoeld in
      [artikel 11, eerste lid, onderdeel c][ref1], neemt de grondroerder contact op met de desbetreffende beheerder om
      afspraken te maken over de te treffen voorzorgsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel11
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
  - number: 13b.2
    text: De grondroerder en de beheerder leggen de afspraken, bedoeld in het eerste lid, schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13b
  - number: 13b.3
    text: |-
      Het contact, bedoeld in het eerste lid, vindt plaats zodra degene die de graafmelding heeft gedaan
      de gebiedsinformatie heeft ontvangen, doch uiterlijk drie werkdagen voor de geplande aanvang van de
      graafwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel13b
  - number: '14'
    text: |-
      Onze Minister kan voor de situatie dat graafmeldingen die betrekking hebben op graafwerkzaamheden als bedoeld in
      [artikel 8, derde lid][ref1], gezamenlijk worden gedaan door tussenkomst van een door Onze Minister aan te wijzen
      organisatie, bij regeling vrijstelling verlenen van de verplichtingen ten aanzien van de termijnen, bepaald in de
      artikelen 8, eerste lid, [10][ref2], [11, eerste lid][ref3], [13, eerste lid][ref4] en [13b][ref5]. De vrijstelling
      kan onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0040728#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0040728#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0040728#Artikel13b
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0040728
        artikel: '10'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0040728
        artikel: '13'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0040728
        artikel: 13b
        hoofdstuk: '4'
  - number: '15.1'
    text: |-
      De beheerder van een net met gevaarlijke inhoud treft de voorzorgsmaatregelen waarvan hij met de grondroerder
      heeft afgesproken dat hij die voor zijn rekening neemt, voordat die grondroerder graafwerkzaamheden in de omgeving
      daarvan verricht. Deze voorzorgsmaatregelen betreffen in ieder geval de aanwijzing ter plaatse van de exacte
      ligging van dat net door de beheerder.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel15
  - number: '15.2'
    text: |-
      De beheerder van een net met een grote waarde kan voorzorgsmaatregelen treffen voordat een grondroerder
      graafwerkzaamheden in de omgeving daarvan verricht.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de beheerder heeft aangegeven dat hij voorzorgsmaatregelen treft, vangt de grondroerder de
      graafwerkzaamheden niet aan dan nadat de beheerder deze voorzorgsmaatregelen heeft getroffen.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel15
  - number: '15.4'
    text: |-
      De beheerder treft de voorzorgsmaatregelen binnen drie werkdagen nadat de grondroerder contact met hem heeft
      opgenomen, tenzij hij in overleg met de grondroerder andere afspraken maakt.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel15
  - number: '15.5'
    text: |-
      De grondroerder treft de voorzorgsmaatregelen waarvan hij met de beheerder heeft afgesproken dat hij die voor zijn
      rekening neemt.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister van Veiligheid en Justitie kan ter voorkoming van een terroristisch misdrijf als bedoeld in
      [artikel 83 van het Wetboek van Strafrecht][ref1] of om op voorhand de gevolgen daarvan te beperken aan de Dienst
      alle nodige aanwijzingen geven ten aanzien van de informatie-uitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '83'
  - number: '17.1'
    text: |-
      De beheerder rapporteert aan de Dienst telkens in januari het aantal schadegevallen als gevolg van
      graafwerkzaamheden in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel17
  - number: '17.2'
    text: De Dienst maakt ten minste jaarlijks een overzicht van het aantal gemelde schadegevallen openbaar.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel17
  - number: '18'
    text: |-
      De grondroerder meldt schade aan een net als gevolg van zijn graafwerkzaamheden onverwijld aan de beheerder van het
      beschadigde net.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel18
  - number: '19.1'
    text: |-
      Indien de ligging van een net afwijkt van de liggingsgegevens die aan de grondroerder zijn verstrekt, meldt de
      grondroerder dit onverwijld bij de Dienst.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel19
  - number: '19.2'
    text: Van de melding, bedoeld in het eerste lid, doet de Dienst onverwijld mededeling aan de betrokken beheerder.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      De beheerder treft onverwijld, doch uiterlijk binnen dertig werkdagen na ontvangst van de mededeling, bedoeld in
      het tweede lid, de als gevolg van de melding, bedoeld in het eerste lid, noodzakelijke maatregelen.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel19
  - number: '20.1'
    text: |-
      Indien de grondroerder een net aantreft dat niet in de door de Dienst verstrekte liggingsgegevens is vermeld of
      waarvan niet duidelijk is wie de beheerder is, meldt de grondroerder dit onverwijld bij de Dienst.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      De Dienst bericht onverwijld alle beheerders wier beheerpolygoon geheel of gedeeltelijk samenvalt met de
      graafpolygoon en de bij ministeriële regeling te bepalen beheerders dat er een net is aangetroffen, waarover geen
      liggingsgegevens zijn verstrekt als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel11
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
  - number: '20.3'
    text: Indien er een beheerder van het net is, meldt deze zich onverwijld bij de Dienst.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      Indien de Dienst niet binnen tien werkdagen na het bericht, bedoeld in het tweede lid, een melding als bedoeld in
      het derde lid ontvangt:
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
  - number: 20.4.a
    text: |-
      geeft de Dienst de met betrekking tot dat net bekende gegevens door aan de gemeente in welker grondgebied dat net
      zich bevindt;
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
  - number: 20.4.b
    text: registreert de Dienst de globale ligging van de met betrekking tot dat net bekende gegevens als polygoon.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
  - number: '20.5'
    text: |-
      Voor de toepassing van [artikel 10][ref1] wordt de gemeente, bedoeld in het vierde lid, gelijkgesteld met een
      beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel10
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '10'
        hoofdstuk: '4'
  - number: '21'
    text: |-
      Op een gemeente die gegevens heeft ontvangen door toepassing van [artikel 20, vierde lid][ref1],
      zijn de [artikelen 11][ref2], [13a][ref3], [13b][ref4], [15, eerste en tweede lid][ref5], en
      [19, tweede en derde lid][ref6], van overeenkomstige toepassing met dien verstande dat de gemeente de met
      betrekking tot dat net bekende gegevens verstrekt, met inbegrip van eventuele correcties ingevolge artikel 19,
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0040728#Artikel13a
      [ref4]: https://wetten.overheid.nl/BWBR0040728#Artikel13b
      [ref5]: https://wetten.overheid.nl/BWBR0040728#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0040728#Artikel19
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '20'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0040728
        artikel: '11'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0040728
        artikel: 13a
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0040728
        artikel: 13b
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0040728
        artikel: '15'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0040728
        artikel: '19'
        hoofdstuk: '4'
  - number: '22'
    text: |-
      De Dienst bewaart gedurende een bij algemene maatregel van bestuur te bepalen periode gegevens over de
      uitvoering van de [artikelen 6, tweede en vierde lid][ref1], [7][ref2], [8, eerste en tweede lid][ref3],
      [10][ref4], [11][ref5], [12, eerste lid en tweede lid, onderdeel a][ref6], [13][ref7], [17, eerste lid][ref8],
