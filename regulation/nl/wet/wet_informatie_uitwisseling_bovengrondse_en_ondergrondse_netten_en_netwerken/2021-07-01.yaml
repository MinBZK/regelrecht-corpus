  - number: '23.1'
    text: |-
      Indien er tussen een netwerkexploitant en een aanbieder van een elektronisch communicatienetwerk een geschil is
      ontstaan inzake de nakoming van een op één hunner op grond van een bij of krachtens deze wet rustende verplichting
      betreffende medegebruik of coördinatie, kan Onze Minister op aanvraag van een bij dat geschil betrokken partij het
      geschil beslechten.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister is onbevoegd tot het beslechten van een op grond van het eerste lid voorgelegd geschil, indien de bij
      dat geschil betrokken partijen gezamenlijk Onze Minister verzoeken het geschil niet langer te behandelen.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister kan een besluit in een geschil als bedoeld in het eerste lid intrekken indien de bij dat besluit
      betrokken netwerkexploitant en aanbieder van een elektronisch communicatienetwerk daartoe gezamenlijk een aanvraag
      doen.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel23
  - number: '23.4'
    text: |-
      Indien een aanvraag als bedoeld in het eerste, tweede of derde lid tevens betrekking heeft op de verplichtingen,
      bedoeld in [hoofdstuk 5a van de Telecommunicatiewet][ref1] beslist Onze Minister in coördinatie met de Autoriteit
      Consument en Markt op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk5a
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009950
        hoofdstuk: 5a
  - number: '24.1'
    text: |-
      Op vordering van Onze Minister verstrekken de bij een geschil betrokken partijen binnen twee weken, dan wel binnen
      een andere door Onze Minister te bepalen redelijke termijn, aan Onze Minister alle gegevens die relevant zijn voor
      de beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel24
  - number: '24.2'
    text: |-
      De bij het geschil betrokken partijen zijn verplicht onverwijld, maar in elk geval binnen de door Onze Minister
      gestelde redelijke termijn, alle medewerking te verlenen die deze redelijkerwijs kan vorderen ten behoeve van de
      beoordeling van het geschil.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel24
  - number: '25.1'
    text: |-
      Onze Minister beslist zo spoedig mogelijk op een aanvraag als bedoeld in
      [artikel 23, eerste, tweede of derde lid][ref1], doch, behoudens buitengewone omstandigheden, uiterlijk binnen twee
      maanden na ontvangst van die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel23
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '23'
        hoofdstuk: '5'
  - number: '25.2'
    text: |-
      Onverminderd het eerste lid, kan Onze Minister in spoedeisende gevallen een voorlopig besluit nemen dat tussen de
      betrokkenen geldt tot het definitieve besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel25
  - number: '26'
    text: |-
      Een bij een geschil betrokken partij volgt de door Onze Minister op grond van [artikel 23][ref1] genomen besluit
      op. Onze Minister kan daarbij termijnen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel23
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '23'
        hoofdstuk: '5'
  - number: '27'
    text: |-
      Van een besluit als bedoeld in [artikel 23, eerste, tweede of derde lid][ref1], wordt mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel23
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0040728
        artikel: '23'
        hoofdstuk: '5'
  - number: '28.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel28
  - number: 28.1.a
    text: |-
      de informatie die op grond van de [artikelen 11][ref1] en [12][ref2] wordt verstrekt, waarbij voor verschillende
      categorieën netten en netwerkexploitanten verschillende regels kunnen worden gesteld, en de wijze waarop die
      informatie wordt verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0040728#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0040728#Artikel12
    url: https://wetten.overheid.nl/BWBR0040728/2021-07-01#Artikel28
