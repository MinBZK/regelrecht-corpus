      [8][ref3], [11, eerste lid][ref4], [12][ref5], [13a][ref6], [13b][ref7], [15, eerste, vierde en vijfde lid][ref8],
      [17, eerste lid][ref9], [18][ref10], [19, eerste en derde lid][ref11], [20, eerste en derde lid][ref12],
