    text: |-
      [Paragraaf 4.1.3.2. van de Algemene wet bestuursrecht][ref1] vindt voor het eerst toepassing met betrekking tot
      ingevolge de [Algemene wet inkomensafhankelijke regelingen][ref2] te nemen of genomen beschikkingen met betrekking
      tot het berekeningsjaar 2013.


