  - number: '5'
    text: |-
      1 Geen subsidie wordt verleend:

      a. indien op het bedrijf blijkens de aangifte overschotheffing 1996 geen varkens werden gehouden, of

      b. indien ten aanzien van het bedrijf op of na 1 september 1998 een kennisgeving van een overgang van het
      varkensrecht is gedaan als bedoeld in [artikel 18, eerste lid, van de wet][ref1], of

      c. indien de tot het bedrijf behorende oppervlakte grond voorzover die in een reservaatsgebied of een
      natuurontwikkelingsproject ligt, op of na de datum waarop deze regeling wordt bekendgemaakt, anders dan door
      eigendomsoverdracht aan BBL, is verkleind, of

      d. indien de beëindiging van het bedrijf heeft plaatsgevonden voordat een aanvraag tot subsidieverlening was
      ingediend, of

      e. indien de aanvrager uit anderen hoofde een subsidie is verleend ter zake van de beëindiging, verplaatsing of
      hervestiging van zijn bedrijf of een gedeelte daarvan.

      2 De minister kan van het eerste lid, onder a, d of e afwijken ten aanzien van bedrijven waarvoor uit hoofde van
      een andere regeling ter zake van de beëindiging, verplaatsing of hervestiging van bedrijven of gedeelten daarvan
      een aanvraag tot subsidieverlening is ingediend die op het moment dat deze regeling in werking treedt nog niet was
      verstrekt, met dien verstande dat, tenzij de uit anderen hoofde verleende subsidie wordt ingetrokken, zij op de
      subsidie, bedoeld in [artikel 2][ref2], in mindering worden gebracht.

      3 Indien de subsidie een bedrag voor de vermindering van het varkensrecht omvat als bedoeld in
      [artikel 6, eerste lid, onderdeel b, onder 1][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0010149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010149#Artikel6
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel5
