        artikel: '8.1'
  - number: '2'
    text: |-
      De minister kan subsidie verlenen ter zake van de beëindiging van bedrijven in gebied I of gebied II waarop
      blijkens de registratie van het Bureau Heffingen in 1996 een niet-gebonden mestproductierecht rustte, die
      beschikken over een geldige milieuvergunning en die voldoen aan een van de volgende voorwaarden:

      a. het erfperceel ligt in of grenst onmiddellijk aan een reservaatsgebied of natuurontwikkelingproject;

      b. de locatie waarop de aanvraag tot subsidieverlening betrekking heeft, veroorzaakt een ammoniakdepositie van ten
      minste 300 mol per hectare per jaar op een voor verzuring gevoelig gebied dat gelegen is binnen de EHS.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Voor de bepaling van de ligging van het bedrijf is artikel 17, vierde lid, van de wet van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 Voor de toepassing van deze regeling wordt onder beëindiging van een bedrijf dat voldoet aan de voorwaarde
      genoemd in [artikel 2, onder a][ref1], verstaan:

      a. registratie door het Bureau Heffingen van de kennisgeving van het vervallen van het varkensrecht, bedoeld in
      [artikel 30 van de wet][ref2], indien de aanvrager bij zijn aanvraag tot subsidieverlening heeft verklaard de
      varkenshouderij niet op een andere tot zijn bedrijf behorende locatie of op een ander hem toebehorend bedrijf te
      zullen voortzetten, dan wel de registratie door het Bureau Heffingen van de kennisgeving van de overgang van het
      varkensrecht, bedoeld in [artikel 18, tweede lid, van de wet][ref3], indien de aanvrager bij zijn aanvraag tot
      subsidieverlening heeft verklaard de varkenshouderij op een ander hem toebehorend bedrijf te zullen voortzetten;

      b. afbraak van de gebouwen bestemd voor de uitoefening van het bedrijf, voorzover zij in een reservaatsgebied of
      een natuurontwikkelingsproject liggen of op een onmiddellijk daaraan grenzend erfperceel;

      c. overdracht aan [BBL][ref4] van de eigendom van de tot het bedrijf behorende oppervlakte grond voorzover die
      in een reservaatsgebied of een natuurontwikkelingsproject ligt, met uitzondering van het erfperceel, waarvan de
      oppervlakte ten hoogste één hectare bedraagt, of beëindiging van de pacht indien de tot het bedrijf behorende
      oppervlakte grond eigendom is van Staatsbosbeheer of van een particuliere natuurbeschermingsorganisatie;

      d. intrekking van de milieuvergunning overeenkomstig [artikel 8.26, eerste lid, van de Wet milieubeheer][ref5].

      2 Voor de toepassing van deze regeling wordt onder beëindiging van een bedrijf dat voldoet aan de voorwaarde
      genoemd in [artikel 2, onder b][ref6], verstaan:

      a. registratie van de kennisgeving, bedoeld in het eerste lid, onder a;

      b. afbraak van de in een reservaatsgebied of een natuurontwikkelingsproject gelegen gebouwen bestemd voor de
      uitoefening van het bedrijf;

      c. afbraak van de niet in een reservaatsgebied of een natuurontwikkelingsproject gelegen gebouwen bestemd voor
      de uitoefening van het bedrijf, indien de aanvrager bij zijn aanvraag heeft verklaard deze gebouwen te zullen
      afbreken, danwel het aan hun bestemming onttrekken van de voor de huisvesting van varkens bestemde gebouwen, indien
      de aanvrager bij zijn aanvraag heeft verklaard deze gebouwen niet te zullen afbreken;

      d. overdracht aan [BBL][ref7] van de eigendom van de tot het bedrijf behorende oppervlakte grond voorzover die in
      een reservaatsgebied of een natuurontwikkelingsproject ligt, of beëindiging van de pacht indien de tot het bedrijf
      behorende oppervlakte grond eigendom is van Staatsbosbeheer of van een particuliere natuurbeschermingsorganisatie;

      e. blijkens een aangepaste milieuvergunning blijvende vermindering van de ammoniakdepositie op het voor verzuring
      gevoelige, in de EHS gelegen gebied tot ten hoogste 300 mol per hectare per jaar, indien het bedrijf op de locatie
      waarop de aanvraag voor subsidieverlening betrekking heeft wordt voortgezet, onderscheidenlijk intrekking van de
      milieuvergunning als bedoeld in het eerste lid, onder d, indien het bedrijf op de desbetreffende locatie niet wordt
      voortgezet.


