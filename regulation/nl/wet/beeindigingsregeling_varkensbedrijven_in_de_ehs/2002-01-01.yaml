  - number: '7'
    text: |-
      1 Bij het verlenen van de subsidie bepaalt de minister het bedrag voor het vervallen onderscheidenlijk
      de vermindering van het varkensrecht, bedoeld in het eerste lid, onderdeel b, onder 1°, op basis van de
      representatieve marktwaarde van een varkenseenheid in gebied Ionderscheidenlijk in gebied II.

      2 In de beschikking tot subsidieverlening kan worden afgezien van de vermelding van het bedrag waarop de subsidie
      ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 De door BBL te betalen prijs voor de grond, bedoeld in
      [artikel 4, eerste lid, onder c, en tweede lid, onder d][ref1], wordt bepaald op basis van de daartoe in opdracht
      van [BBL][ref2] getaxeerde waarde van de betrokken grond.

      2 Artikel 50, tweede lid, van de Regeling beheersovereenkomsten en natuurontwikkeling is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005758
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel8
    references:
