  - number: '6'
    text: |-
      1 Voor een bedrijf dat voldoet aan de voorwaarde genoemd in [artikel 2, onder a][ref1], kunnen de volgende bedragen
      worden verstrekt:

      a. een bedrag voor de overdracht aan [BBL][ref2] van de tot het bedrijf behorende oppervlakte grond voorzover deze
      in een reservaatsgebied of een natuurontwikkelingsproject ligt, en

      b. een subsidie die de volgende onderdelen omvat:

      1° een bedrag voor het vervallen van het varkensrecht, overeenkomend met 75% van het op het tijdstip van de
      registratie van de kennisgeving ten aanzien van het bedrijf geregistreerde varkensrecht, dan wel een bedrag voor
      de vermindering van het varkensrecht, bedoeld in [artikel 18, derde lid, van de wet][ref3], indien de aanvrager
      bij zijn aanvraag tot subsidieverlening heeft verklaard dat hij voornemens is de varkenshouderij te verplaatsen
      naar een ander hem toebehorend bedrijf, waarvan het erfperceel niet ligt in of niet onmiddellijk grenst aan een
      reservaatsgebied of natuurontwikkelingproject en dat niet een ammoniakdepositie van ten minste 300 mol per hectare
      per jaar op een voor verzuring gevoelig, in de EHS gelegen gebied veroorzaakt,

      2° een bedrag voor de afbraak van de in [artikel 4, eerste lid, onder b][ref4], genoemde gebouwen, overeenkomend
      met € 36,30 per vierkante meter grondoppervlakte, en

      3° een bedrag overeenkomend met de agrarische waarde van de onder 2° genoemde gebouwen.

      2 Voor een bedrijf dat voldoet aan de voorwaarde genoemd in [artikel 2, onder b][ref5], kan het in het eerste lid,
      onder a, genoemde bedrag worden verstrekt en een subsidie die de volgende onderdelen omvat:

      a. het bedrag, bedoeld in het eerste lid, onderdeel b, onder 1°, en

      b. een bedrag voor de afbraak van de in [artikel 4, tweede lid, onder b en c][ref6], genoemde gebouwen,
      overeenkomend met € 36,30 per vierkante meter grondoppervlakte, alsmede een bedrag overeenkomend met de agrarische
      waarde van deze gebouwen, in voorkomend geval verminderd met de restwaarde.


