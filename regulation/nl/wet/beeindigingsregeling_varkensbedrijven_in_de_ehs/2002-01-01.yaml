articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
            Bureau Heffingen:

              Bureau Heffingen van het Ministerie van Landbouw, Natuurbeheer en Visserij, te Assen;



            c
            BBL:

              Bureau beheer landbouwgronden als bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref1];



            d
            DLG:

              Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuurbeheer en Visserij, te Utrecht;



            e
            wet:

              [Wet herstructurering varkenshouderij][ref2];



            f
            bedrijf:

              bedrijf als bedoeld in [artikel 1 van de wet][ref3];



            g
            niet-gebonden mestproductierecht:

              niet-gebonden mestproductierecht als bedoeld in [artikel 1 van de Wet verplaatsing mestproductie][ref4];



            h
            varkensrecht:

              varkensrecht als bedoeld in [artikel 1, onder h, van de wet][ref5];



            i
            aangifte overschotheffing 1996:

              schriftelijke opgave, zoals in voorkomend geval gecorrigeerd, die ter vaststelling van de verschuldigde
      overschotheffing over het jaar 1996 met betrekking tot het bedrijf is gedaan krachtens de [artikelen 8][ref6] en
      [13 van de Meststoffenwet][ref7], zoals deze artikelen luidden onmiddellijk vóór inwerkingtreding van de wet van 2
      mei 1997, houdende wijziging van de [Meststoffenwet][ref8] (Stb. 360);



            j
            aanvrager:

              degene die overeenkomstig [artikel 10, eerste lid][ref9], een aanvraag tot subsidieverlening indient;



            k
            gebied I:

              gebied I als aangegeven in de bijlage bij de Wet verplaatsing mestproductie;



            l
            gebied II:

              gebied II als aangegeven in de bijlage bij de Wet verplaatsing mestproductie;



            m
            reservaatsgebied:

              reservaatsgebied als bedoeld in artikel 1 van de Regeling beheersovereenkomsten en natuurontwikkeling en
      zoals het krachtens die regeling nader door de provincies is begrensd;



            n
            natuurontwikkelingsproject:

              natuurontwikkelingsproject als bedoeld in artikel 1 van de Regeling beheersovereenkomsten en
      natuurontwikkeling en zoals het krachtens die regeling nader door de provincies is begrensd;



            o
            EHS:

              ecologische hoofdstructuur, zoals die globaal is aangegeven op kaart 7 van de planologische
      kernbeslissing van het Structuurschema Groene Ruimte en zoals die, voor wat betreft reservaatsgebieden en
      natuurontwikkelingsprojecten, nader door de provincies is begrensd krachtens de Regeling beheersovereenkomsten
      en natuurontwikkeling;



            p
            erfperceel:

              tot het bedrijf behorend perceel, niet zijnde landbouwgrond, waarop de gebouwen bestemd voor de uitoefening
      van het bedrijf gelegen zijn;



            q
            voor verzuring gevoelig gebied:

              voor verzuring gevoelig gebied als bedoeld in [artikel 2][ref10] van de Uitvoeringsregeling ammoniak en
      veehouderij;



            r
            milieuvergunning:

              vergunning krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref11].


