  - number: '20'
    text: |-
      Na vaststelling van de subsidie wordt op het erfperceel, bedoeld in [artikel 4, eerste lid, onder c][ref1], niet
      opnieuw een bedrijf opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0010149#Artikel4
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010149
        artikel: '4'
        paragraaf: '2'
  - number: '21'
    text: |-
      De minister kan op verzoek van de subsidie-ontvanger voorschotten verlenen tot ten hoogste 80% van de verleende
      subsidie.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel21
  - number: '22'
    text: |-
      Indien de beschikking tot subsidievaststelling is ingetrokken, betaalt de subsidie-ontvanger op eerste vordering
      van de minister de onverschuldigd betaalde subsidiebedragen en voorschotten terug, vermeerderd met de wettelijke
      rente over de periode van de datum van intrekking tot het tijdstip van algehele voldoening.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel22
  - number: '23'
    text: Deze regeling treedt in werking op 14 januari 1999.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel23
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Beëindigingsregeling varkensbedrijven in de EHS.'
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel24
