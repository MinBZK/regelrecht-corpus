        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005758
  - number: '9'
    text: |-
      Het subsidieplafond van de regeling bedraagt f 100.000.000,-, waarvan ten minste f 25.000.000,-
      voor gebied I en ten minste f 25.000.000,- voor gebied II, welke bedragen worden verminderd
      met de bedragen die worden betaald voor de overdracht aan [BBL][ref1] van de grond, bedoeld in
      [artikel 4, eerste lid, onder c, en tweede lid onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005758
      [ref2]: https://wetten.overheid.nl/BWBR0010149#Artikel4
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005758
      - id: ref2
        bwb_id: BWBR0010149
        artikel: '4'
        paragraaf: '2'
  - number: '10'
    text: |-
      1 De aanvraag tot subsidieverlening wordt ingediend door de persoon, de rechtspersoon of het samenwerkingsverband
      van personen of rechtspersonen op wiens of welks naam het varkensrecht bij het Bureau Heffingen staat
      geregistreerd.

      2 De aanvraag wordt mede-ondertekend door de hypotheekhouder die een aanmelding heeft gedaan als bedoeld in artikel
      5, eerste lid, van de Regeling leges en blokkade Wet herstructurering varkenshouderij, indien de aanvrager bij zijn
      aanvraag tot subsidieverlening heeft verklaard dat hij voornemens is de varkenshouderij te verplaatsen naar een
      ander hem toebehorend bedrijf of naar een andere tot zijn bedrijf behorende locatie.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel10
  - number: '11'
    text: Een aanvraag tot subsidieverlening kan worden ingediend van 14 januari tot en met 30 juni 1999.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel11
  - number: '12'
    text: De aanvraag wordt ingediend bij DLG met gebruikmaking van een daartoe door DLG ter beschikking gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel12
  - number: '13'
    text: |-
      1 De aanvrager geeft DLG toestemming gebruik te maken van de door hem aan het Bureau Heffingen verstrekte gegevens.

      2 De aanvrager verschaft op verzoek van DLG aanvullende gegevens, of legt op verzoek van DLG bescheiden over,
      binnen een door DLG te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 Een beschikking op een aanvraag tot subsidieverlening wordt gegeven uiterlijk twaalf weken na ontvangst van de
      aanvraag.

      2 De in het eerste lid genoemde termijn kan met ten hoogste vier weken worden verlengd.

      3 De minister beslist op de ingediende aanvragen in de volgorde van ontvangst.

      Bij gelijktijdige ontvangst van twee of meer ingediende aanvragen wordt de volgorde door loting bepaald.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel14
  - number: '15'
    text: |-
      1 De minister kan besluiten dat vanaf een door hem te bepalen datum geen aanvragen tot subsidieverlening kunnen
      worden ingediend voor bepaalde categorieën van bedrijven of voor bedrijven die gelegen zijn in bepaalde gebieden.

      2 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Uiterlijk veertien dagen nadat de subsidie is verleend doet de subsidie-ontvanger, met gebruikmaking van een
      daartoe door DLG ter beschikking gesteld formulier, aan DLG een kennisgeving of op het bedrijf of de locatie waarop
      de aanvraag betrekking heeft, dieren worden gehouden.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Uiterlijk zes maanden nadat de subsidie is verleend worden de dieren van het bedrijf of van de locatie waarop de
      aanvraag betrekking heeft afgevoerd.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel17
  - number: '18'
    text: |-
      Onmiddellijk nadat de dieren van het bedrijf of van de locatie waarop de aanvraag betrekking heeft zijn afgevoerd,
      doet de subsidie-ontvanger aan het Bureau Heffingen een kennisgeving van het vervallen, onderscheidenlijk de
      overgang van zijn varkensrecht.
    url: https://wetten.overheid.nl/BWBR0010149/2002-01-01#Artikel18
  - number: '19'
    text: |-
      1 Uiterlijk acht maanden nadat de subsidie is verleend, zorgt de subsidie-ontvanger dat aan de
      in [artikel 4, eerste lid, onder b, c en d][ref1], genoemde voorwaarden, onderscheidenlijk de in
      [artikel 4, tweede lid, onder b, c, d en e][ref2], genoemde voorwaarden, is voldaan en dient hij een aanvraag tot
      vaststelling van de subsidie in.

      2 De in het eerste lid bedoelde aanvraag wordt ingediend bij DLG met gebruikmaking van een daartoe
      door DLG ter beschikking gesteld formulier en gaat vergezeld van een afschrift van de registratie
      door het Bureau Heffingen van de kennisgeving van het vervallen onderscheidenlijk de overgang van
      het varkensrecht, een afschrift van een verklaring van het sloopbedrijf dat de gebouwen, bedoeld
      in [artikel 4, eerste lid, onder b, onderscheidenlijk tweede lid, onder b en c][ref3], zijn
      afgebroken, een gewaarmerkt afschrift van de akte van overdracht van de landbouwgrond, bedoeld in
      [artikel 4, eerste lid, onder c, onderscheidenlijk tweede lid, onder d][ref4], en een afschrift van de beschikking
      van het bevoegd gezag dat de milieuvergunning is ingetrokken.


