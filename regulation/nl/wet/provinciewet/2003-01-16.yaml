$id: provinciewet
regulatory_layer: WET
publication_date: '2026-01-22'
valid_from: '2003-01-16'
bwb_id: BWBR0005645
url: https://wetten.overheid.nl/BWBR0005645/2003-01-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Provinciewet aan te passen aan de herziene Grondwet
    en aan de Gemeentewet en in verband daarmee nieuwe bepalingen vast te stellen met betrekking tot de inrichting van
    provincies, alsmede de samenstelling en bevoegdheid van hun besturen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder het aantal inwoners van een provincie: het aantal inwoners volgens de door het
      Centraal Bureau voor de Statistiek openbaar gemaakte bevolkingscijfers per 1 januari.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel1
  - number: '1.2'
    text: |-
      Voor de vaststelling van het inwonertal bedoeld in artikel 8, geldt als peildatum 1 januari van het jaar
      voorafgaande aan het jaar van de verkiezing van provinciale staten. Het Centraal Bureau voor de Statistiek kan op
      schriftelijk verzoek van een provinciaal bestuur het inwonertal per de eerste dag van de vierde maand voorafgaande
      aan de maand van kandidaatstelling vaststellen indien aannemelijk is dat een in dat artikel genoemd inwonertal op
      genoemde datum is overschreden. In dat geval geldt dit tijdstip als peildatum.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel1
  - number: '2'
    text: 'In deze wet wordt verstaan onder ingezetenen: zij die hun werkelijke woonplaats in de provincie hebben.'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel2
  - number: '3'
    text: |-
      Zij die als ingezetene met een adres zijn ingeschreven in de gemeentelijke basisadministratie persoonsgegevens
      van een gemeente, worden voor de toepassing van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke
      woonplaats te hebben in de provincie waarin die gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel3
  - number: '4'
    text: |-
      In deze wet wordt onder ambtenaar mede verstaan: degene die op arbeidsovereenkomst naar burgerlijk recht werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel4
  - number: '5'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel5
  - number: 5.a
    text: 'provinciaal bestuur: ieder bevoegd orgaan van de provincie;'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel5
  - number: 5.b
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel5
  - number: 5.c
    text: |-
      commissie: een commissie als bedoeld in [artikel 80][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel80
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '80'
        hoofdstuk: V
  - number: '6'
    text: In elke provincie zijn er provinciale staten, gedeputeerde staten en een commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel6
  - number: '7'
    text: Provinciale staten vertegenwoordigen de gehele bevolking van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel7
  - number: '8.1'
    text: |-
      Provinciale staten bestaan uit: 39 leden in een provincie beneden de 200 001 inwoners; 43 leden in een provincie
      van 200 001 - 300 000 inwoners; 47 leden in een provincie van 300 001 - 400 000 inwoners; 51 leden in een provincie
      van 400 001 - 500 000 inwoners; 55 leden in een provincie van 500 001 - 750 000 inwoners; 59 leden in een provincie
      van 750 001 - 1 000 000 inwoners; 63 leden in een provincie van 1 000 001 - 1 250 000 inwoners; 67 leden in een
      provincie van 1 250 001 - 1 500 000 inwoners; 71 leden in een provincie van 1 500 001 - 1 750 000 inwoners; 75
      leden in een provincie van 1 750 001 - 2 000 000 inwoners; 79 leden in een provincie van 2 000 001 - 2 500 000
      inwoners; 83 leden in een provincie boven de 2 500 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel8
  - number: '8.2'
    text: |-
      Vermeerdering of vermindering van het aantal leden van provinciale staten, voortvloeiende uit wijziging van het
      aantal inwoners van de provincie, treedt eerst in bij de eerstvolgende periodieke verkiezing van de leden van
      provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel8
  - number: '9'
    text: De commissaris van de Koning is voorzitter van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel9
  - number: '10'
    text: |-
      Voor het lidmaatschap van provinciale staten is vereist dat men Nederlander en ingezetene van de provincie is, de
      leeftijd van achttien jaar heeft bereikt en niet is uitgesloten van het kiesrecht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel10
  - number: '11.1'
    text: |-
      De leden van provinciale staten maken openbaar welke andere functies dan het lidmaatschap van provinciale staten
      zij vervullen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel11
  - number: '11.2'
    text: |-
      Openbaarmaking geschiedt door terinzagelegging van een opgave van de in het eerste lid bedoelde functies op het
      provinciehuis.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel11
  - number: '12'
    text: |-
      Ter vervulling van een tussentijds opengevallen plaats is niet benoembaar tot lid van provinciale staten hij die na
      de laatstgehouden periodieke verkiezing van de leden van provinciale staten wegens handelen in strijd met artikel
      15 van het lidmaatschap van provinciale staten is vervallen verklaard.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel12
  - number: '13.1'
    text: 'Een lid van provinciale staten kan in ieder geval niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: 13.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: 13.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: 13.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: 13.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: 13.1.e
    text: ambtenaar, door of vanwege het provinciaal bestuur aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: '13.2'
    text: |-
      Het bepaalde in het eerste lid, onder *e*, is niet van toepassing op hen die als vrijwilliger dan wel uit hoofde
      van een wettelijke verplichting niet bij wijze van beroep hulpdiensten verrichten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel13
  - number: '14'
    text: |-
      Alvorens hun functie te kunnen uitoefenen, leggen de leden van provinciale staten in de vergadering, in handen van
      de voorzitter, de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, om tot lid van provinciale
      staten benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift
      of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten,
      rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof)
      dat ik getrouw zal zijn aan de Grondwet, dat ik de wetten zal nakomen en dat ik mijn plichten als lid van het
      provinciaal bestuur naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!" (Dat verklaar en
      beloof ik!")
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel14
  - number: '15.1'
    text: 'Een lid van provinciale staten mag niet:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.a
    text: |-
      als advocaat, procureur of adviseur in geschillen werkzaam zijn ten behoeve van de provincie of het provinciaal
      bestuur dan wel ten behoeve van de wederpartij van de provincie of het provinciaal bestuur;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.b
    text: |-
      als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van de provincie of het provinciaal
      bestuur;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.c
    text: 'als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met de provincie aangaan van:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.c.1e
    text: overeenkomsten als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.c.2e
    text: overeenkomsten tot het leveren van onroerende zaken aan de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d
    text: 'rechtstreeks of middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.1e
    text: het aannemen van werk ten behoeve van de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.2e
    text: het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.3e
    text: het leveren van roerende zaken anders dan om niet aan de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.4e
    text: het verhuren van roerende zaken aan de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.5e
    text: het verwerven van betwiste vorderingen ten laste van de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.6e
    text: het van de provincie onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: 15.1.d.7e
    text: het onderhands huren of pachten van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: '15.2'
    text: Van het bepaalde in het eerste lid, onder *d*, kan Onze Minister ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel15
  - number: '16'
    text: Provinciale staten stellen een reglement van orde voor hun vergaderingen en andere werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel16
  - number: '17.1'
    text: Provinciale staten vergaderen zo vaak als zij daartoe hebben besloten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel17
  - number: '17.2'
    text: |-
      Voorts vergaderen zij indien de commissaris van de Koning of gedeputeerde staten het nodig oordelen of indien ten
      minste een vijfde van het aantal leden waaruit provinciale staten bestaan schriftelijk, met opgave van redenen,
      daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel17
  - number: '18.1'
    text: |-
      Provinciale staten vergaderen na de periodieke verkiezing van hun leden voor de eerste maal in nieuwe samenstelling
      op de dag met ingang waarvan de leden van provinciale staten in oude samenstelling aftreden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel18
  - number: '18.2'
    text: |-
      In het geval, bedoeld in [artikel V15 van de Kieswet](onbekend) (*Stb.* 1989, 423), wordt de vergadering gehouden
      zo spoedig mogelijk nadat veertien dagen zijn verlopen na de onherroepelijke goedkeuring van de geloofsbrieven van
      meer dan de helft van de leden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel18
  - number: '19.1'
    text: De commissaris roept de leden schriftelijk tot de vergadering op.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel19
  - number: '19.2'
    text: |-
      Tegelijkertijd met de oproeping brengt de commissaris dag, tijdstip en plaats van de vergadering ter openbare
      kennis. De agenda en de daarbij behorende voorstellen met uitzondering van de in artikel 25, tweede lid, bedoelde
      stukken worden tegelijkertijd met de oproeping en op een bij de openbare kennisgeving aan te geven wijze ter inzage
      gelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel19
  - number: '20.1'
    text: |-
      De vergadering van provinciale staten wordt niet geopend voordat blijkens de presentielijst meer dan de helft van
      het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel20
  - number: '20.2'
    text: |-
      Indien ingevolge het eerste lid de vergadering niet kan worden geopend, belegt de commissaris van de Koning, onder
      verwijzing naar dit artikel, opnieuw een vergadering tegen een tijdstip dat ten minste vierentwintig uur na het
      bezorgen van de oproeping is gelegen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel20
  - number: '20.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Provinciale staten kunnen
      echter over andere aangelegenheden dan die waarvoor de ingevolge het eerste lid niet geopende vergadering was
      belegd alleen beraadslagen of besluiten, indien blijkens de presentielijst meer dan de helft van het aantal zitting
      hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel20
  - number: '21'
    text: De commissaris van de Koning heeft het recht in de vergadering aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel21
  - number: '22'
    text: |-
      De leden van het provinciaal bestuur en andere personen die deelnemen aan de beraadslaging kunnen niet in
      rechte worden vervolgd of aangesproken voor dan wel worden verplicht getuigenis af te leggen als bedoeld in
      [artikel 165, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] over hetgeen zij in de vergadering
      van provinciale staten hebben gezegd of aan provinciale staten schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '23.1'
    text: De vergadering van provinciale staten wordt in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel23
  - number: '23.2'
    text: |-
      De deuren worden gesloten, wanneer ten minste een tiende van het aantal leden dat de presentielijst heeft getekend
      daarom verzoekt of de voorzitter het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel23
  - number: '23.3'
    text: Provinciale staten beslissen vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel23
  - number: '23.4'
    text: |-
      Van een vergadering met gesloten deuren wordt een afzonderlijk verslag opgemaakt, dat niet openbaar wordt gemaakt
      tenzij provinciale staten anders beslissen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel23
  - number: '24'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel24
  - number: 24.a
    text: de toelating van nieuw benoemde leden;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel24
  - number: 24.b
    text: de vaststelling en wijziging van de begroting en de vaststelling van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel24
  - number: 24.c
    text: de invoering, wijziging en afschaffing van provinciale belastingen; en
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel24
  - number: 24.d
    text: de benoeming en het ontslag van gedeputeerden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel24
  - number: '25.1'
    text: |-
      Provinciale staten kunnen op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur,
      omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan provinciale staten
      worden overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt
      tijdens die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen
      die van het behandelde of de stukken kennis dragen, in acht genomen totdat provinciale staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel25
  - number: '25.2'
    text: |-
      Op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur, kan de geheimhouding eveneens
      worden opgelegd door gedeputeerde staten, de commissaris van de Koning en een provinciale commissie, ieder ten
      aanzien van stukken die zij aan provinciale staten of aan leden van provinciale staten overleggen. Daarvan wordt op
      de stukken melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel25
  - number: '25.3'
    text: |-
      De krachtens het tweede lid opgelegde verplichting tot geheimhouding met betrekking tot aan provinciale staten
      overgelegde stukken vervalt, indien de oplegging niet door provinciale staten in hun eerstvolgende vergadering
      die blijkens de presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, wordt
      bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel25
  - number: '25.4'
    text: |-
      De krachtens het tweede lid opgelegde verplichting tot geheimhouding met betrekking tot aan leden van provinciale
      staten overgelegde stukken wordt in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel,
      indien het stuk waaromtrent geheimhouding is opgelegd aan provinciale staten is voorgelegd, totdat provinciale
      staten haar opheffen. Provinciale staten kunnen deze beslissing alleen nemen in een vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel25
  - number: '26.1'
    text: |-
      De voorzitter zorgt voor de handhaving van de orde in de vergadering en is bevoegd, wanneer die orde op enigerlei
      wijze door toehoorders wordt verstoord, deze en zo nodig andere toehoorders te doen vertrekken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel26
  - number: '26.2'
    text: |-
      Hij is bevoegd toehoorders die bij herhaling de orde in de vergadering verstoren voor ten hoogste drie maanden de
      toegang tot de vergadering te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel26
  - number: '26.3'
    text: |-
      Hij kan provinciale staten voorstellen aan een lid dat door zijn gedragingen de geregelde gang van zaken belemmert,
      het verdere verblijf in de vergadering te ontzeggen. Over het voorstel wordt niet beraadslaagd. Na aanneming
      daarvan verlaat het lid de vergadering onmiddellijk. Zo nodig doet de voorzitter hem verwijderen. Bij herhaling van
      zijn gedrag kan het lid bovendien voor ten hoogste drie maanden de toegang tot de vergadering worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel26
  - number: '27'
    text: De leden van provinciale staten stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel27
  - number: '28.1'
    text: 'Een lid van provinciale staten neemt niet deel aan de stemming over:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel28
  - number: 28.1.a
    text: |-
      een aangelegenheid die hem rechtstreeks of middellijk persoonlijk aangaat of waarbij hij als vertegenwoordiger
      is betrokken;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel28
  - number: 28.1.b
    text: |-
      de vaststelling of goedkeuring der rekening van een lichaam waaraan hij rekenplichtig is of tot welks bestuur hij
      behoort.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel28
  - number: '28.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het deelnemen aan de stemming verstaan het inleveren van een
      stembriefje.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel28
  - number: '28.3'
    text: |-
      Een benoeming gaat iemand persoonlijk aan, wanneer hij behoort tot de personen tot wie de keuze door een voordracht
      of bij een herstemming is beperkt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel28
  - number: '28.4'
    text: |-
      Het eerste lid is niet van toepassing bij het besluit betreffende de toelating van de na periodieke verkiezing
      benoemde leden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel28
  - number: '29.1'
    text: |-
      Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft en zich niet van
      deelneming aan de stemming moet onthouden, daaraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel29
  - number: '29.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel29
  - number: 29.2.a
    text: |-
      ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, voordracht of aanbeveling van een of meer
      personen ten aanzien van wie in een vorige vergadering een stemming op grond van dat lid niet geldig was;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel29
  - number: 29.2.b
    text: |-
      in een vergadering als bedoeld in artikel 20, tweede lid, voor zover het betreft onderwerpen die in de daaraan
      voorafgaande, ingevolge artikel 20, eerste lid, niet geopende vergadering aan de orde waren gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel29
  - number: '30.1'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel30
  - number: '30.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het uitbrengen van een stem verstaan het inleveren van een behoorlijk
      ingevuld stembriefje.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel30
  - number: '31.1'
    text: |-
      De stemming over personen voor het doen van benoemingen, voordrachten of aanbevelingen geschiedt bij gesloten en
      ongetekende stembriefjes.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel31
  - number: '31.2'
    text: |-
      Indien de stemmen staken over personen tot wie de keuze door een voordracht of bij een herstemming is beperkt,
      wordt in dezelfde vergadering een herstemming gehouden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel31
  - number: '31.3'
    text: Staken bij deze stemming de stemmen opnieuw, dan beslist terstond het lot.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel31
  - number: '32.1'
    text: |-
      De overige stemmingen geschieden bij hoofdelijke oproeping, indien de voorzitter of een van de leden dat verlangt.
      In dat geval geschieden zij mondeling.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel32
  - number: '32.2'
    text: |-
      Bij hoofdelijke oproeping is ieder ter vergadering aanwezig lid dat zich niet van deelneming aan de stemming moet
      onthouden verplicht zijn stem voor of tegen uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel32
  - number: '32.3'
    text: Indien over een voorstel geen stemming wordt gevraagd, is het aangenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel32
  - number: '32.4'
    text: |-
      Tenzij de vergadering voltallig is, wordt bij staking van stemmen het nemen van een beslissing uitgesteld tot een
      volgende vergadering, waarin de beraadslagingen kunnen worden heropend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel32
  - number: '32.5'
    text: |-
      Indien de stemmen staken in een voltallige vergadering of in een ingevolge het vierde lid opnieuw belegde
      vergadering, is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel32
  - number: '32.6'
    text: |-
      Onder een voltallige vergadering wordt verstaan een vergadering waarin alle leden waaruit provinciale staten
      bestaan, voor zover zij zich niet van deelneming aan de stemming moesten onthouden, een stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel32
  - number: '33'
    text: Provinciale staten regelen op welke wijze ambtelijke bijstand wordt verleend aan de leden van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel33
  - number: '34.1'
    text: De commissaris van de Koning en de gedeputeerden vormen te zamen gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel34
  - number: '34.2'
    text: De commissaris is voorzitter van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel34
  - number: '35.1'
    text: Provinciale staten benoemen uit hun midden gedeputeerden, ten getale van tenminste drie en ten hoogste negen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel35
  - number: '35.2'
    text: |-
      De gedeputeerden, bedoeld in het eerste lid, vervullen een volledige betrekking. Provinciale staten kunnen evenwel
      besluiten dat een of meer van die betrekkingen in deeltijd worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel35
  - number: '35.3'
    text: |-
      Indien de tweede volzin van het tweede lid toepassing vindt, bedraagt, in afwijking van het eerste lid, het aantal
      gedeputeerden ten hoogste elf, met dien verstande dat de tijdsbestedingsnorm van de gedeputeerden gezamenlijk ten
      hoogste tien procent meer bedraagt dan de tijdsbestedingsnorm van de gedeputeerden gezamenlijk zou hebben bedragen
      indien de tweede volzin van het tweede lid geen toepassing had gevonden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel35
  - number: '35.4'
    text: |-
      Indien de tweede volzin van het tweede lid toepassing vindt, stellen provinciale staten bij de benoeming van de
      gedeputeerden de tijdsbestedingsnorm van elke gedeputeerde vast.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel35
  - number: '36'
    text: |-
      De benoeming van gedeputeerden na de verkiezing van de leden van provinciale staten vindt plaats in de eerste
      vergadering van provinciale staten in nieuwe samenstelling, bedoeld in artikel 18.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel36
  - number: '37'
    text: |-
      In het geval van artikel 36 gaat de benoeming van degene die zijn benoeming tot gedeputeerde heeft aangenomen, in
      op het tijdstip waarop ten minste de helft van het met inachtneming van artikel 35 bepaalde aantal gedeputeerden
      zijn benoeming heeft aangenomen of, indien de aanneming van de benoeming op een later tijdstip plaatsvindt, op
      dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel37
  - number: '38'
    text: |-
      De benoeming ter vervulling van een plaats die tussentijds openvalt geschiedt zo spoedig mogelijk, doch, tenzij
      provinciale staten in een bijzonder geval anders beslissen, eerst nadat opengevallen plaatsen in provinciale staten
      zijn vervuld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel38
  - number: '39'
    text: |-
      De benoemde gedeputeerde wordt geacht de benoeming niet aan te nemen, indien op de tiende dag na kennisgeving van
      de benoeming door middel van een aangetekende brief nog geen mededeling van hem is ontvangen dat hij de benoeming
      aanneemt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel39
  - number: '40'
    text: Wanneer de benoeming niet is aangenomen, geschiedt zo spoedig mogelijk een nieuwe benoeming.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel40
  - number: '41.1'
    text: De gedeputeerden treden af op het tijdstip van aftreden van de leden van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel41
  - number: '41.2'
    text: |-
      Vanaf het tijdstip van aftreden van de gedeputeerden tot het tijdstip waarop na de verkiezing van de leden van de
      nieuwe provinciale staten ten minste de helft van het met inachtneming van artikel 35 bepaalde aantal gedeputeerden
      de benoeming heeft aangenomen, treedt de commissaris van de Koning in de plaats van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel41
  - number: '42.1'
    text: Een gedeputeerde kan te allen tijde ontslag nemen. Hij doet daarvan schriftelijk mededeling aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel42
  - number: '42.2'
    text: |-
      Het ontslag gaat in met ingang van de dag, gelegen een maand na de dag waarop hij zijn ontslag heeft genomen of
      zoveel eerder als zijn opvolger de benoeming heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel42
  - number: '43.1'
    text: |-
      De gedeputeerden genieten ten laste van de provincie een bezoldiging, die bij of krachtens algemene maatregel van
      bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel43
  - number: '43.2'
    text: |-
      Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van bijzondere kosten en
      betreffende andere financiële voorzieningen die verband houden met de vervulling van het ambt van gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel43
  - number: '43.3'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel43
  - number: '43.4'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend genieten de gedeputeerden als zodanig geen inkomsten, in
      welke vorm ook, ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel43
  - number: '43.5'
    text: |-
      De gedeputeerden genieten geen vergoedingen, in welke vorm ook, voor werkzaamheden verricht in nevenfuncties die
      zij vervullen uit hoofde van het ambt van gedeputeerde, ongeacht of die vergoedingen ten laste van de provincie
      komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de provinciale kas.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel43
  - number: '44.1'
    text: 'Een gedeputeerde kan niet gelijktijdig met zijn functie de betrekking uitoefenen van:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel44
  - number: 44.1.a
    text: |-
      voorzitter of lid van het bestuur van of ambtenaar in dienst van een in de provincie gelegen gemeente of
      waterschap;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel44
  - number: 44.1.b
    text: |-
      ambtenaar in dienst van een bij gemeenschappelijke regeling ingesteld lichaam waarvan een orgaan aan toezicht van
      gedeputeerde staten is onderworpen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel44
  - number: 44.1.c
    text: |-
      ambtenaar door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het kader
      van het toezicht op de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel44
  - number: '44.2'
    text: |-
      Een gedeputeerde kan niet gelijktijdig met zijn functie een betrekking uitoefenen waarin hij door de wet of door
      een algemene maatregel van bestuur geroepen wordt het provinciaal bestuur van advies te dienen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel44
  - number: '45.1'
    text: |-
      Indien degene wiens benoeming tot gedeputeerde is ingegaan, een betrekking uitoefent als bedoeld in artikel 44,
      eerste en tweede lid, draagt hij er onverwijld zorg voor dat hij van de uitoefening van die betrekking wordt
      ontheven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel45
  - number: '45.2'
    text: Provinciale staten verlenen hem ontslag indien hij dit nalaat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel45
  - number: '45.3'
    text: Het ontslag gaat in terstond na de bekendmaking van het ontslagbesluit.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel45
  - number: '45.4'
    text: |-
      In het geval, bedoeld in het tweede lid, is [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '46.1'
    text: |-
      Indien een gedeputeerde een betrekking gaat uitoefenen als bedoeld in artikel 44, eerste en tweede lid, neemt hij
      onmiddellijk ontslag. Hij doet hiervan schriftelijk mededeling aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel46
  - number: '46.2'
    text: Artikel 45, tweede, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel46
  - number: '47'
    text: |-
      In zaken die aan de uitspraak van gedeputeerde staten zijn onderworpen mag een gedeputeerde niet als gemachtigde of
      adviseur werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel47
  - number: '48'
    text: |-
      Schorsing in en tussentijds verlies van het lidmaatschap van provinciale staten brengt terstond schorsing in,
      onderscheidenlijk verlies van het ambt van gedeputeerde mede.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel48
  - number: '49'
    text: |-
      Provinciale staten kunnen een of meer gedeputeerden ontslag verlenen, indien dezen het vertrouwen
      van provinciale staten niet meer bezitten. Op het ontslagbesluit zijn de[artikelen 4:8][ref1]
      en[ 7:1 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '50.1'
    text: |-
      Over een voorstel tot het verlenen van ontslag als bedoeld in artikel 49 wordt niet beraadslaagd of besloten,
      dan nadat provinciale staten ten minste twee weken en ten hoogste drie maanden tevoren hebben verklaard, dat de
      betrokken gedeputeerden het vertrouwen van provinciale staten niet meer bezitten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel50
  - number: '50.2'
    text: |-
      De oproeping tot de vergadering waarin over dat voorstel wordt beraadslaagd of besloten wordt ten minste
      achtenveertig uur voor de aanvang of zoveel eerder als provinciale staten hebben bepaald, bij de leden van
      provinciale staten bezorgd. Zij vermeldt het voorstel tot het verlenen van ontslag als bedoeld in artikel 49.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel50
  - number: '50.3'
    text: |-
      Artikel 28 is niet van toepassing bij besluiten van provinciale staten ingevolge artikel 49 of ingevolge dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel50
  - number: '51.1'
    text: |-
      Bij verhindering, ontstentenis of ontslag van een gedeputeerde, of indien een gedeputeerde met de waarneming van
      het ambt van commissaris van de Koning is belast, wordt hij zo nodig vervangen door een lid van provinciale staten,
      aan te wijzen door provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel51
  - number: '51.2'
    text: |-
      De toekenning van een vergoeding ten laste van de provincie aan degene die met de waarneming van het ambt van
      gedeputeerde is belast, wordt geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel51
  - number: '51.3'
    text: |-
      Ten aanzien van degene die met de waarneming van het ambt van gedeputeerde is belast, zijn de artikelen 44 en 45
      van overeenkomstige toepassing indien provinciale staten zulks voorafgaande aan of bij de aanwijzing, bedoeld in
      het eerste lid, hebben bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel51
  - number: '52'
    text: |-
      Gedeputeerde staten stellen een reglement van orde voor hun vergaderingen en andere werkzaamheden vast, dat aan
      provinciale staten wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel52
  - number: '53.1'
    text: |-
      De commissaris van de Koning stelt, met inachtneming van hetgeen gedeputeerde staten hebben bepaald, dag en plaats
      van de vergadering van gedeputeerde staten en het tijdstip van de opening vast.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel53
  - number: '53.2'
    text: De commissaris maakt dag en plaats van te houden openbare vergaderingen en het tijdstip van de opening bekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel53
  - number: '54.1'
    text: |-
      De vergaderingen van gedeputeerde staten worden met gesloten deuren gehouden, voor zover gedeputeerde staten niet
      anders hebben bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel54
  - number: '54.2'
    text: |-
      Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel54
  - number: '54.3'
    text: |-
      Ten aanzien van bepalingen in het reglement van orde die betrekking hebben op vergaderingen vindt artikel 144 geen
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel54
  - number: '55.1'
    text: |-
      Gedeputeerde staten kunnen op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur,
      omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan hen worden
      overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens
      die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen die van
      het behandelde of de stukken kennis dragen, in acht genomen totdat gedeputeerde staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel55
  - number: '55.2'
    text: |-
      Op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur, kan de geheimhouding eveneens
      worden opgelegd door de commissaris van de Koning of een commissie, ten aanzien van de stukken die zij aan
      gedeputeerde staten overleggen. Daarvan wordt op de stukken melding gemaakt. De geheimhouding wordt in acht genomen
      totdat het orgaan dat de verplichting heeft opgelegd, dan wel provinciale staten, haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel55
  - number: '55.3'
    text: |-
      Indien gedeputeerde staten zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot
      provinciale staten hebben gericht, wordt de geheimhouding in acht genomen totdat provinciale staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel55
  - number: '56.1'
    text: |-
      In de vergadering van gedeputeerde staten kan slechts worden beraadslaagd of besloten, indien ten minste de helft
      van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel56
  - number: '56.2'
    text: |-
      Indien het vereiste aantal leden niet tegenwoordig is, belegt de commissaris van de Koning, onder verwijzing naar
      dit artikel, opnieuw een vergadering.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel56
  - number: '56.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Gedeputeerde staten kunnen
      echter over andere aangelegenheden dan die waarvoor de eerdere vergadering was belegd alleen beraadslagen of
      besluiten, indien ten minste de helft van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel56
  - number: '57'
    text: |-
      De leden van gedeputeerde staten en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor hetgeen zij in de vergadering van gedeputeerde staten hebben gezegd of aan
      gedeputeerde staten schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel57
  - number: '58'
    text: |-
      De artikelen 28, eerste tot en met derde lid, 29 en 30 zijn ten aanzien van de vergaderingen van gedeputeerde
      staten van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel58
  - number: '59.1'
    text: |-
      Indien bij een stemming, anders dan over personen voor het doen van benoemingen, voordrachten of aanbevelingen, de
      stemmen staken, wordt opnieuw gestemd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel59
  - number: '59.2'
    text: Staken de stemmen andermaal over hetzelfde voorstel, dan beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel59
  - number: '60.1'
    text: |-
      Provinciale staten kunnen regelen van welke beslissingen van gedeputeerde staten aan de leden van provinciale
      staten kennisgeving wordt gedaan. Daarbij kunnen provinciale staten de gevallen bepalen waarin met terinzagelegging
      kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel60
  - number: '60.2'
    text: |-
      Gedeputeerde staten laten de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het
      openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel60
  - number: '61.1'
    text: |-
      De commissaris van de Koning wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de tijd van
      zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister overlegt met provinciale staten over de eisen die aande te benoemen commissaris worden gesteld met
      betrekking tot de vervulling van het ambt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61
  - number: '61.3'
    text: |-
      Na het overleg met Onze Minister stellen provinciale staten uit hun midden een vertrouwenscommissie in, belast met
      de beoordeling van de kandidaten. Onze Minister verschaft de vertrouwenscommissie een opgave van degenen die naar
      het ambt van commissaris hebben gesolliciteerd, vergezeld van zijn oordeel over kandidaten die hij in beginsel
      geschikt acht voor benoeming. Als de vertrouwenscommissie besluit naast deze kandidaten ook andere kandidaten die
      gesolliciteerd hebben, bij haar beoordeling te betrekken, doet zij daarvan onverwijld mededeling aan Onze Minister.
      Deze brengt zijn oordeel over laatstgenoemde kandidaten ter kennis van de vertrouwenscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61
  - number: '61.4'
    text: |-
      De vertrouwenscommissie verschaft zich de door haar nodig geachte informatie over de kandidaten. Bestuursorganen
      zijn verplicht de gevraagde informatie te verstrekken. De vertrouwenscommissie brengt verslag uit van haar
      bevindingen aan de staten en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61
  - number: '61.5'
    text: |-
      Provinciale staten zenden Onze Minister binnen vier maanden nadat de gelegenheid tot sollicitatie voor de
      functie is gegeven een aanbeveling inzake de benoeming. Deze aanbeveling omvat twee personen. In bijzondere, door
      provinciale staten te motiveren gevallen, kan worden volstaan met een aanbeveling waarop één persoon vermeld staat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61
  - number: '61.6'
    text: |-
      Onze Minister volgt in zijn voordracht in beginsel de aanbeveling, met inbegrip van de daarop gehanteerde volgorde,
      tenzij zwaarwegende gronden aanleiding tot afwijking geven. Een afwijking wordt gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61
  - number: 61a.1
    text: |-
      De commissaris van de Koning kan bij koninklijk besluit op voordracht van Onze Minister worden herbenoemd voor de
      tijd van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61a
  - number: 61a.2
    text: |-
      Provinciale staten zenden een aanbeveling inzake de herbenoeming van de commissaris tenminste vier maanden voor de
      eerste dag van de maand waarin de herbenoeming dient in te gaan, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61a
  - number: 61a.3
    text: |-
      Voordat provinciale staten een aanbeveling opstellen, overleggen zij met Onze Minister over het functioneren van
      de commissaris.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61a
  - number: 61a.4
    text: Onze Minister wijkt in zijn voordracht slechts op zwaarwegende gronden af van de aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61a
  - number: 61b.1
    text: |-
      De commissaris van de Koning kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61b
  - number: 61b.2
    text: |-
      Indien sprake is van een verstoorde verhouding tussen de commissaris en provinciale staten, kunnen de staten een
      aanbeveling tot ontslag zenden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61b
  - number: 61b.3
    text: |-
      Voordat de staten verklaren dat van een verstoorde verhouding tussen de commissaris en de staten sprake is,
      overleggen zij met Onze Minister over de aanleiding tot die verklaring.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61b
  - number: 61b.4
    text: |-
      Een aanbeveling vormt geen onderwerp van beraadslagingen en wordt niet vastgesteld dan nadat provinciale staten
      tenminste twee weken en ten hoogste drie maanden tevoren hebben verklaard, dat tussen de commissaris en de staten
      sprake is van een verstoorde verhouding.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61b
  - number: 61b.5
    text: |-
      De oproeping tot de vergadering waarin over de aanbeveling wordt beraadslaagd of besloten, wordt tenminste
      achtenveertig uur voor de aanvang of zoveel eerder als provinciale staten hebben bepaald, bij de leden van de
      staten bezorgd. Zij vermeldt het voorstel tot de aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61b
  - number: 61b.6
    text: Onze Minister wijkt in zijn voordracht slechts af van de aanbeveling op zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61b
  - number: 61c.1
    text: |-
      De beraadslagingen, bedoeld in de artikelen 61, derde en vierde lid, 61a, derde lid, en 61b, derde lid, vinden
      plaats met gesloten deuren. Van deze beraadslagingen wordt een afzonderlijk verslag opgemaakt dat niet openbaar
      wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61c
  - number: 61c.2
    text: |-
      Ten aanzien van de beraadslagingen en de stukken die aan provinciale staten worden gezonden dan wel die door
      provinciale staten aan Onze Minister worden gezonden geldt een geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61c
  - number: 61c.3
    text: |-
      De aanbevelingen van de staten, bedoeld in artikel 61, vijfde lid, 61a, tweede lid, en 61b, tweede lid, zijn
      openbaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61c
  - number: 61d
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de bij benoeming, herbenoeming en
      ontslag van de commissaris van de Koning te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel61d
  - number: '62.1'
    text: De commissaris kan bij koninklijk besluit worden geschorst.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel62
  - number: '62.2'
    text: |-
      Onze Minister kan, in afwachting van een besluit omtrent schorsing, bepalen dat de commissaris zijn functie niet
      uitoefent.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel62
  - number: '62.3'
    text: |-
      Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel62
  - number: '63'
    text: Voor de benoembaarheid tot commissaris is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel63
  - number: '64'
    text: |-
      Alvorens zijn ambt te aanvaarden, legt de commissaris in handen van de Koning de volgende eed (verklaring en
      belofte) af: "Ik zweer (verklaar) dat ik, om tot commissaris van de Koning benoemd te worden, rechtstreeks
      noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer
      (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk
      of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal zijn aan de Grondwet, dat ik
      de wetten zal nakomen en dat ik mijn plichten als commissaris van de Koning naar eer en geweten zal vervullen. Zo
      waarlijk helpe mij God Almachtig!" (Dat verklaar en beloof ik!")
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel64
  - number: '65.1'
    text: |-
      De commissaris geniet ten laste van de provincie een bezoldiging, die bij of krachtens algemene maatregel van
      bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel65
  - number: '65.2'
    text: |-
      Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van bijzondere kosten en
      betreffende andere financiële voorzieningen die verband houden met de vervulling van zijn ambt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel65
  - number: '65.3'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel65
  - number: '65.4'
    text: |-
      Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de commissaris als zodanig geen inkomsten, in welke
      vorm ook, ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel65
  - number: '65.5'
    text: |-
      De commissaris geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties welke
      hij vervult uit hoofde van zijn ambt, ongeacht of die vergoedingen ten laste van de provincie komen of niet. Indien
      deze vergoedingen worden uitgekeerd, worden zij gestort in de provinciale kas.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel65
  - number: '66.1'
    text: |-
      De commissaris vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van het ambt van commissaris of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het
      vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel66
  - number: '66.2'
    text: |-
      De commissaris meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van het ambt van
      commissaris, aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel66
  - number: '66.3'
    text: De commissaris maakt openbaar welke nevenfuncties hij, anders dan uit hoofde van het ambt van commissaris, vervult.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel66
  - number: '67'
    text: 'De commissaris kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel67
  - number: 67.a
    text: lid van provinciale staten;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel67
  - number: 67.b
    text: ambtenaar door of vanwege het provinciaal bestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel67
  - number: 67.c
    text: voorzitter of lid van het bestuur van een in de provincie gelegen gemeente of waterschap.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel67
  - number: '68'
    text: Het bepaalde in artikel 15 is van overeenkomstige toepassing op de commissaris.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel68
  - number: '69'
    text: |-
      Het ambt van commissaris ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel69
  - number: '70'
    text: De commissaris heeft zijn werkelijke woonplaats in de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel70
  - number: '71.1'
    text: |-
      Indien de commissaris langer dan zes weken buiten de provincie wenst te verblijven, behoeft hij daartoe de
      toestemming van Onze Minister. De toestemming mag alleen worden verleend, indien het belang van de provincie zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel71
  - number: '71.2'
    text: De Algemene Termijnenwet (*Stb.* 1964, 314) is niet van toepassing op de termijn genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel71
  - number: '72.1'
    text: |-
      Voor zover dit niet bij de wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien van
      de commissaris regels vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: 72.1.a
    text: benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: 72.1.b
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: 72.1.c
    text: uitkering bij ontslag;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: 72.1.d
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: 72.1.e
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: 72.1.f
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: '72.2'
    text: |-
      Bij de regels betreffende de in het eerste lid bedoelde aangelegenheden kunnen financiële voorzieningen worden
      getroffen die ten laste van de provincie komen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel72
  - number: '73.1'
    text: |-
      Alle aan provinciale staten of aan gedeputeerde staten gerichte stukken worden door of namens de commissaris
      geopend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel73
  - number: '73.2'
    text: |-
      Van de ontvangst van aan provinciale staten gerichte stukken die niet terstond in de vergadering van provinciale
      staten aan de orde worden gesteld, doet hij in de eerstvolgende vergadering van provinciale staten mededeling.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel73
  - number: '74.1'
    text: De stukken die van provinciale staten uitgaan, worden door de commissaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel74
  - number: '74.2'
    text: |-
      De stukken die van gedeputeerde staten uitgaan, worden door de commissaris ondertekend. Gedeputeerde staten kunnen
      hem toestaan de ondertekening op te dragen aan een ander lid van gedeputeerde staten, aan de griffier of aan een of
      meer andere provinciale ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel74
  - number: '75.1'
    text: |-
      Bij verhindering of ontstentenis van de commissaris wordt zijn ambt waargenomen door een gedeputeerde, door
      gedeputeerde staten aan te wijzen. Van de aanwijzing doet de commissaris schriftelijk mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel75
  - number: '75.2'
    text: |-
      Bij verhindering of ontstentenis van alle gedeputeerden wordt het ambt waargenomen door het oudste lid in jaren van
      provinciale staten, tenzij provinciale staten een ander lid met de waarneming belasten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel75
  - number: '75.3'
    text: |-
      Bij verhindering of ontstentenis van de commissaris op de dag met ingang waarvan de zittende provinciale staten
      zijn afgetreden, zal het ambt worden waargenomen door een afgetreden gedeputeerde aan te wijzen door de afgetreden
      gedeputeerde staten of, bij ontstentenis van alle afgetreden gedeputeerden, door het oudste lid in jaren van de
      afgetreden provinciale staten, een en ander totdat in de waarneming overeenkomstig het eerste en tweede lid is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel75
  - number: '76.1'
    text: |-
      Indien de regering het in het belang van de provincie nodig oordeelt, voorziet zij in afwijking van artikel 75 in
      de waarneming. Alvorens daartoe over te gaan hoort zij provinciale staten, tenzij gewichtige redenen zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel76
  - number: '76.2'
    text: |-
      Hij die door de regering met de waarneming van het ambt van commissaris is belast, legt, indien hij geen lid
      van provinciale staten is, in handen van Onze Minister een overeenkomstig artikel 64 luidende eed (verklaring en
      belofte) af.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel76
  - number: '77'
    text: |-
      De toekenning van een vergoeding aan degene die met de waarneming van het ambt van commissaris is belast, wordt
      geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel77
  - number: '78'
    text: |-
      Ten aanzien van degene die met de waarneming van het ambt van commissaris is belast, is artikel 15 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel78
  - number: '79.1'
    text: |-
      Provinciale staten kunnen regelen van welke beslissingen van de commissaris aan de leden van provinciale staten
      kennisgeving wordt gedaan. Daarbij kunnen provinciale staten de gevallen bepalen waarin met terinzagelegging kan
      worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel79
  - number: '79.2'
    text: |-
      De commissaris laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel79
  - number: '80.1'
    text: Provinciale staten kunnen commissies instellen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel80
  - number: '80.2'
    text: |-
      Zij regelen de taken, de bevoegdheden, de samenstelling en de wijze waarop de leden van provinciale staten inzage
      hebben in stukken waaromtrent door de commissie geheimhouding is opgelegd. Deze inzage kan slechts worden geweigerd
      voor zover zij in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel80
  - number: '81.1'
    text: |-
      Ten aanzien van een commissie waaraan bevoegdheden van provinciale staten worden overgedragen, regelen provinciale
      staten de verantwoording aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel81
  - number: '81.2'
    text: |-
      Besluiten en andere niet schriftelijke beslissingen gericht op enig rechtsgevolg van een commissie
      waaraan bevoegdheden van provinciale staten worden overgedragen, kunnen door provinciale staten worden
      vernietigd. Provinciale staten kunnen de bevoegdheid tot schorsing delegeren aan gedeputeerde staten. Ten
      aanzien van de vernietiging van een niet-schriftelijke beslissing zijn de [afdelingen 10.2.2][ref1] en
      [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing. Voor zover zulks in verband met
      de aard en de omvang van de overgedragen bevoegdheden nodig is, regelen provinciale staten het overige toezicht
      van provinciale staten op de uitoefening van de bevoegdheden door de commissie. Regeling van het overige toezicht
      kan mede goedkeuring omvatten van beslissingen van een commissie, als bedoeld in het eerste lid. Ten aanzien van de
      goedkeuring van andere beslissingen dan besluiten is [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref3] van
      overeenkomstige toepassing. De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen
      belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '81.3'
    text: |-
      Ten aanzien van de vergadering van een commissie als bedoeld in het eerste lid zijn, met inachtneming van door
      provinciale staten gestelde nadere regels, de artikelen 19, tweede lid, en 23 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel81
  - number: '82.1'
    text: |-
      Ten aanzien van een commissie waaraan bevoegdheden van gedeputeerde staten worden overgedragen, regelen provinciale
      staten de verantwoording aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel82
  - number: '82.2'
    text: |-
      Besluiten en andere niet schriftelijke beslissingen gericht op enig rechtsgevolg van een commissie waaraan
      bevoegdheden van gedeputeerde staten worden overgedragen, kunnen door gedeputeerde staten worden vernietigd.
      Ten aanzien van de vernietiging van een niet-schriftelijke beslissing zijn de [afdelingen 10.2.2][ref1] en
      [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing. Voor zover zulks in verband
      met de aard en de omvang van de overgedragen bevoegdheden nodig is, regelen provinciale staten, op voorstel van
      gedeputeerde staten, de openbaarheid van de vergaderingen en het overige toezicht van gedeputeerde staten, op
      de uitoefening van de bevoegdheden door de commissie. Regeling van het overige toezicht kan mede goedkeuring
      omvatten van beslissingen van een commissie, als bedoeld in het eerste lid. Ten aanzien van de goedkeuring van
      andere beslissingen dan besluiten is [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref3] van overeenkomstige
      toepassing. De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '82.3'
    text: |-
      In een commissie waaraan de bevoegdheid van gedeputeerde staten, bedoeld in artikel 168, wordt overgedragen, wordt
      ten minste één lid van gedeputeerde staten tot lid benoemd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel82
  - number: '82.4'
    text: |-
      Indien aan een commissie behalve bevoegdheden van gedeputeerde staten ook bevoegdheden van provinciale staten
      zijn overgedragen, zijn, met inachtneming van door provinciale staten gestelde nadere regels, ten aanzien van de
      vergadering van die commissie de artikelen 19, tweede lid, en 23 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel82
  - number: '83'
    text: |-
      Ten aanzien van een commissie die is belast met het voorbereiden van door provinciale staten te nemen beslissingen
      op beroep- en bezwaarschriften, dan wel met het beslissen op beroepschriften, regelen provinciale staten tevens:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel83
  - number: 83.a
    text: de openbaarheid van de vergaderingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel83
  - number: 83.b
    text: de voorbereiding, de uitvoering en de openbaarmaking van beslissingen van de commissie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel83
  - number: '84.1'
    text: |-
      Het bepaalde in de artikelen 81, eerste lid, voor zover de regeling van de verantwoording aan provinciale staten
      betreft, en 82, eerste lid, voorzover de regeling van de verantwoording aan provinciale staten betreft, is niet van
      toepassing op een commissie als bedoeld in artikel 85.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel84
  - number: '84.2'
    text: |-
      Artikel 24 is van overeenkomstige toepassing op de vergadering van een commissie als bedoeld in artikel 85.
      Indien wordt voorzien in de instelling van een dagelijks bestuur zijn de artikelen 49 en 50 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel84
  - number: '85.1'
    text: |-
      De leden van een commissie waaraan de behartiging van de belangen van een deel van de provincie is opgedragen en
      waaraan met het oog daarop een zodanig samenstel van bevoegdheden van provinciale staten is overgedragen, dat zij
      als een algemeen vertegenwoordigend orgaan moet worden aangemerkt, worden rechtstreeks gekozen door de ingezetenen
      van dat deel van de provincie die kiesgerechtigd zijn voor de verkiezing van de leden van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel85
  - number: '85.2'
    text: |-
      Provinciale staten regelen de in het eerste lid bedoelde verkiezing zoveel mogelijk overeenkomstig de bepalingen
      van de [Kieswet][ref1] voor de verkiezing van de leden van provinciale staten. De [artikelen Z1](onbekend) tot en
      met [Z11 van de Kieswet](onbekend) zijn op de verkiezing van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '86'
    text: |-
      Om lid te kunnen zijn van een commissie als bedoeld in artikel 85 is vereist dat men ingezetene is van het
      betreffende deel van de provincie en overigens voldoet aan de vereisten voor het lidmaatschap van provinciale
      staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel86
  - number: '87.1'
    text: 'Een lid van een commissie als bedoeld in artikel 85 kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel87
  - number: 87.1.a
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel87
  - number: 87.1.b
    text: lid van provinciale staten;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel87
  - number: 87.1.c
    text: ambtenaar, door of vanwege de commissie aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel87
  - number: '87.2'
    text: |-
      Artikel 13 is van overeenkomstige toepassing, met dien verstande dat het bepaalde in artikel 13, eerste lid,
      onderdeel *e*, geen belemmering vormt voor een ambtenaar, aangesteld door of ondergeschikt aan een commissie als
      bedoeld in artikel 85, om lid te zijn van een andere in de provincie ingestelde commissie als bedoeld in artikel
      85.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel87
  - number: '88'
    text: |-
      Indien bij de instelling van een commissie als bedoeld in artikel 85 in een dagelijks bestuur wordt voorzien,
      kunnen provinciale staten tevens het dagelijks bestuur bevoegd verklaren de uitoefening van een of meer aan het
      dagelijks bestuur overgedragen bevoegdheden uit naam en onder verantwoordelijkheid van dit bestuur op te dragen aan
      een of meer leden van dit bestuur, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel88
  - number: '89.1'
    text: |-
      De instelling van vaste commissies van advies aan gedeputeerde staten of aan de commissaris van de Koning en de
      regeling van hun bevoegdheden en samenstelling geschieden door provinciale staten op voorstel van gedeputeerde
      staten onderscheidenlijk de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel89
  - number: '89.2'
    text: |-
      Ten aanzien van een vergadering van een vaste commissie van advies aan gedeputeerde staten die tevens tot taak
      heeft gedeputeerde staten van advies te dienen bij de voorbereiding van de besluitvorming in provinciale staten,
      zijn, met inachtneming van door provinciale staten gestelde nadere regels, de artikelen 19, tweede lid, en 23 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel89
  - number: '89.3'
    text: |-
      Bij de samenstelling van een vaste commissie van advies aan gedeputeerde staten of aan de commissaris die
      tevens tot taak heeft gedeputeerde staten of de commissaris van advies te dienen bij de voorbereiding van de
      besluitvorming in provinciale staten, zorgen provinciale staten, voor zover het de benoeming in een dergelijke
      commissie betreft van leden van provinciale staten, voor een evenwichtige vertegenwoordiging van de in provinciale
      staten vertegenwoordigde groeperingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel89
  - number: '90'
    text: |-
      Andere commissies van advies aan gedeputeerde staten of aan de commissaris van de Koning worden door gedeputeerde
      staten onderscheidenlijk de commissaris van de Koning ingesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel90
  - number: '91.1'
    text: |-
      Een commissie kan in een besloten vergadering, op grond van een belang, genoemd in artikel 10 van de Wet
      openbaarheid van bestuur, omtrent het in die vergadering met gesloten deuren behandelde en omtrent de inhoud
      van de stukken die aan de commissie worden overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een
      besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De geheimhouding wordt door hen die bij de
      behandeling aanwezig waren en allen die van het behandelde of de stukken kennis dragen, in acht genomen totdat de
      commissie haar opheft.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel91
  - number: '91.2'
    text: |-
      Op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur, kan de geheimhouding eveneens
      worden opgelegd door de voorzitter van de commissie, gedeputeerde staten en de commissaris van de Koning, ieder
      ten aanzien van stukken die zij aan de commissie overleggen. Daarvan wordt op de stukken melding gemaakt. De
      geheimhouding wordt in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel provinciale
      staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel91
  - number: '91.3'
    text: |-
      Indien de commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot
      provinciale staten heeft gericht, wordt de geheimhouding in acht genomen totdat provinciale staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel91
  - number: '92.1'
    text: |-
      De leden van een commissie en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor dan wel worden verplicht getuigenis af te leggen als bedoeld in
      [artikel 165, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] over hetgeen zij in de vergadering
      van de commissie hebben gezegd of aan deze schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '92.2'
    text: Indien een subcommissie is ingesteld is het bepaalde in het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel92
  - number: '93.1'
    text: |-
      De leden van provinciale staten die geen lid zijn van gedeputeerde staten genieten naar bij provinciale verordening
      te stellen regelen vergoeding van reis- en verblijfkosten voor het bijwonen van vergaderingen van provinciale
      staten en van commissies.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel93
  - number: '93.2'
    text: |-
      Aan de leden van provinciale staten die geen lid zijn van gedeputeerde staten vindt vergoeding van reis- en
      verblijfkosten, in andere gevallen dan die van het eerste lid, alleen plaats voor zover provinciale staten
      dat bepalen bij verordening. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met
      betrekking tot de vergoeding, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel93
  - number: '93.3'
    text: |-
      De leden van provinciale staten die geen lid zijn van gedeputeerde staten genieten een vergoeding voor hun
      werkzaamheden en een tegemoetkoming in de andere kosten dan bedoeld in het eerste en tweede lid. Deze vergoeding
      en tegemoetkoming worden op jaarbasis door provinciale staten bij verordening vastgesteld naar bij of krachtens
      algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel93
  - number: '93.4'
    text: |-
      Met betrekking tot de in het derde lid bedoelde leden van provinciale staten kunnen provinciale staten voorts bij
      verordening regels stellen betreffende tegemoetkoming in of vergoeding van bijzondere kosten en betreffende andere
      financiële voorzieningen die verband houden met de vervulling van het lidmaatschap van provinciale staten. De in de
      vorige volzin bedoelde verordening wordt vastgesteld overeenkomstig bij of krachtens algemene maatregel van bestuur
      te stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel93
  - number: '94.1'
    text: 'De leden van een commissie ontvangen voor zover provinciale staten het bepalen:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: 94.1.a
    text: een vergoeding voor het bijwonen van vergaderingen van de commissie en haar subcommissies, en
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: 94.1.b
    text: een vergoeding van reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: '94.2'
    text: |-
      In bijzondere gevallen kunnen provinciale staten bepalen dat de leden van het dagelijks bestuur van een commissie
      die geen lid zijn van gedeputeerde staten een vaste vergoeding voor hun werkzaamheden ontvangen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: '94.3'
    text: |-
      Provinciale staten kunnen bepalen dat de leden van een commissie als bedoeld in artikel 85 een vaste vergoeding
      voor hun werkzaamheden en een tegemoetkoming in de kosten ontvangen en dat de leden van het dagelijks bestuur van
      die commissie een bezoldiging genieten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: '94.4'
    text: |-
      De in het eerste, tweede en derde lid bedoelde vergoedingen en bezoldiging worden door provinciale staten bij
      verordening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: '94.5'
    text: |-
      Ten aanzien van de vergoeding bedoeld in het eerste lid, onderdeel *a*, en de bezoldiging bedoeld in het vierde
      lid, worden bij of krachtens algemene maatregel van bestuur nadere regels gesteld. Ten aanzien van de overige
      vergoedingen bedoeld in dit artikel kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel94
  - number: '95'
    text: De verordeningen bedoeld in de artikelen 93 en 94 worden aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel95
  - number: '96.1'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van provinciale staten, van een
      commissie en van het dagelijks bestuur van een commissie als zodanig geen andere vergoedingen en tegemoetkomingen
      ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel96
  - number: '96.2'
    text: |-
      Voordelen ten laste van de provincie, anders dan in de vorm van vergoedingen en tegemoetkomingen, genieten zij
      slechts voor zover provinciale staten dit bij verordening bepalen. De verordening behoeft de goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel96
  - number: '97'
    text: In iedere provincie is een griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel97
  - number: '98.1'
    text: |-
      De griffier wordt door provinciale staten benoemd. Voorafgaand aan de benoeming maken gedeputeerde staten een
      aanbeveling van twee personen op. Provinciale staten kunnen de griffier schorsen en ontslaan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel98
  - number: '98.2'
    text: |-
      Gedeputeerde staten kunnen in spoedeisende gevallen tot schorsing overgaan. Zij doen daarvan terstond mededeling
      aan provinciale staten. De schorsing vervalt, wanneer provinciale staten haar niet in hun eerstvolgende vergadering
      bekrachtigen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel98
  - number: '99'
    text: |-
      De griffier mag geen handelingen verrichten als bedoeld in artikel 15, eerste lid. Het tweede lid van artikel 15 is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel99
  - number: '100.1'
    text: |-
      De griffier staat provinciale staten, gedeputeerde staten en de commissaris van de Koning alsmede de door hen
      ingestelde commissies bij de uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel100
  - number: '100.2'
    text: |-
      Provinciale staten stellen in een instructie nadere regels vast betreffende de taak en de bevoegdheid van de
      griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel100
  - number: '101'
    text: De griffier is in de vergadering van provinciale staten en van gedeputeerde staten aanwezig.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel101
  - number: '102.1'
    text: De stukken die van provinciale staten en van gedeputeerde staten uitgaan, worden door de griffier medeondertekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel102
  - number: '102.2'
    text: |-
      Het eerste lid is niet van toepassing indien de ondertekening van stukken die van gedeputeerde staten uitgaan
      ingevolge artikel 74, tweede lid, aan de griffier of een andere provinciale ambtenaar is opgedragen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel102
  - number: '103'
    text: Provinciale staten regelen de vervanging van de griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel103
  - number: '104'
    text: Ten aanzien van degene die de griffier vervangt is artikel 99 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel104
  - number: '105.1'
    text: |-
      De bevoegdheid tot regeling en bestuur inzake de huishouding van de provincie wordt aan het provinciaal bestuur
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel105
  - number: '105.2'
    text: |-
      Regeling en bestuur kunnen van het provinciaal bestuur worden gevorderd bij of krachtens een andere dan deze wet
      ter verzekering van de uitvoering daarvan, met dien verstande dat het geven van aanwijzingen aan het provinciaal
      bestuur en het aan het provinciaal bestuur opleggen of in zijn plaats vaststellen van beslissingen, slechts kan
      geschieden indien de bevoegdheid daartoe bij de wet is toegekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel105
  - number: '105.3'
    text: |-
      Onverminderd het bepaalde in de artikelen 108, vijfde lid, en 117, vierde lid, worden de kosten verbonden aan de
      uitvoering van het tweede lid voor zover zij ten laste van de betrokken provincies blijven, door het Rijk aan hen
      vergoed.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel105
  - number: '106'
    text: Bij of krachtens de wet kan zo nodig onderscheid worden gemaakt tussen provincies.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel106
  - number: '107.1'
    text: |-
      Het provinciaal bestuur kan bevoegdheden van regeling en bestuur, gevorderd bij of krachtens een andere dan deze
      wet, voor het gebied van een of meer gemeenten of waterschappen overdragen aan de besturen van die gemeenten
      of waterschappen voor zover die bevoegdheden zich naar hun aard en schaal daartoe lenen en die besturen daarmee
      instemmen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.2'
    text: Een besluit als bedoeld in het eerste lid regelt de gevolgen van intrekking van het besluit.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.3'
    text: |-
      Het ontwerp van een besluit als bedoeld in het eerste lid behoeft de instemming van provinciale staten en van de
      raden van de betrokken gemeenten onderscheidenlijk de algemene besturen van de betrokken waterschappen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.4'
    text: Een besluit als bedoeld in het eerste lid wordt binnen een week toegezonden aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.5'
    text: |-
      Ten aanzien van de bekendmaking van een besluit als bedoeld in het eerste lid zijn de artikelen 136 tot en met 138
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.6'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van het provinciaal bestuur, de uitoefening daarvan en het
      toezicht daarop, uitgezonderd die met betrekking tot vergaderingen, zijn ten aanzien van de ingevolge het eerste
      lid overgedragen bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.7'
    text: |-
      Het provinciaal bestuur oefent geen toezicht uit en geeft geen voorschriften met betrekking tot de uitoefening van
      de ingevolge het eerste lid overgedragen bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '107.8'
    text: |-
      Indien het verzoek van een gemeentebestuur of bestuur van een waterschap tot het nemen van een besluit als bedoeld
      in het eerste lid wordt afgewezen, wordt die afwijzing door het provinciaal bestuur met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel107
  - number: '108.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: 108.1.a
    text: |-
      plan: een beslissing die een samenhangend geheel van op elkaar afgestemde keuzes bevat omtrent door het provinciaal
      bestuur te nemen besluiten of te verrichten andere handelingen, ten einde een of meer doelstellingen te bereiken;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: 108.1.b
    text: |-
      beleidsverslag: een schriftelijke rapportage betreffende het door het provinciaal bestuur gevoerde beleid op een of
      meer beleidsterreinen dan wel op onderdelen daarvan en de samenhang daarbinnen of daartussen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: '108.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk van het provinciaal bestuur slechts worden gevorderd in bij de wet te bepalen
      gevallen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: '108.3'
    text: Een verplichting als bedoeld in het tweede lid geldt voor ten hoogste vier jaren tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: '108.4'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk in andere dan bij de wet bepaalde gevallen voor een termijn van ten hoogste vier
      jaar van het provinciebestuur worden gevraagd als onderdeel van de regeling van een tijdelijke specifieke uitkering
      als bedoeld in artikel 17 van de Financiële-verhoudingswet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: '108.5'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure wordt van een provinciaal bestuur niet gevorderd of gevraagd, dan nadat is aangegeven hoe de financiële
      gevolgen ervan voor de provincie worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: '108.6'
    text: |-
      Dit artikel is niet van toepassing op de begroting, bedoeld in artikel 193, en op de jaarrekening en het
      jaarverslag, bedoeld in artikel 201.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel108
  - number: '109.1'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in artikel 108 en het ter voorbereiding daarvan
      volgen van een voorgeschreven procedure wordt alleen gevorderd, indien:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.1.a
    text: dit noodzakelijk is uit een oogpunt van afstemming tussen provinciaal beleid en het beleid van het Rijk, of
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.1.b
    text: de ontwikkeling van beleid op een nieuw beleidsterrein dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: '109.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in artikel 108 en het ter voorbereiding daarvan
      volgen van een voorgeschreven procedure wordt niet gevorderd, indien:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.2.a
    text: het provinciaal bestuur daardoor ontoelaatbaar beperkt wordt in zijn inhoudelijke of financiële beleidsruimte;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.2.b
    text: |-
      de bestuurslasten niet in redelijke verhouding staan tot de te verwachten baten of een aanzienlijk beslag leggen op
      de voor het betrokken beleidsterrein beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.2.c
    text: |-
      integratie met een bestaand plan of een bestaand beleidsverslag dan wel met de begroting, bedoeld in artikel 193,
      of de jaarrekening en het jaarverslag, bedoeld in artikel 201, mogelijk is;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.2.d
    text: |-
      het bevorderen van de samenhang in het provinciaal beleid door onderlinge afstemming van onderdelen daarvan
      onmogelijk wordt;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: 109.2.e
    text: het uitsluitend dient tot het verkrijgen van informatie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: '109.3'
    text: |-
      Indien in een voorstel van wet tot invoering of wijziging van bepalingen waarbij het vaststellen van een plan
      of een beleidsverslag als bedoeld in artikel 108 en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure wordt gevorderd, wordt afgeweken van het bepaalde bij of krachtens artikel 108 en dit artikel, wordt die
      afwijking gemotiveerd in de bij het voorstel behorende toelichting.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel109
  - number: '110'
    text: |-
      Onze Minister wie het aangaat doet het provinciaal bestuur desgevraagd mededeling van zijn standpunten en
      voornemens met betrekking tot aangelegenheden die voor de provincie van belang zijn, tenzij het openbaar belang
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel110
  - number: '111'
    text: |-
      Onze Minister wie het aangaat biedt het provinciaal bestuur desgevraagd de gelegenheid tot het plegen van overleg
      met betrekking tot aangelegenheden die voor de provincie van belang zijn, tenzij het openbaar belang zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel111
  - number: '112.1'
    text: |-
      Onze Minister wie het aangaat stelt de betrokken provinciale besturen of een instantie die voor deze representatief
      kan worden geacht, zo nodig binnen een te stellen termijn, in de gelegenheid hun oordeel te geven omtrent
      voorstellen van wet, ontwerpen van algemene maatregel van bestuur, of ontwerpen van ministeriële regeling waarbij:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel112
  - number: 112.1.a
    text: van de provinciale besturen regeling of bestuur wordt gevorderd,
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel112
  - number: 112.1.b
    text: in betekenende mate wijziging wordt gebracht in de taken en bevoegdheden van de provinciale besturen, of
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel112
  - number: 112.1.c
    text: de financiën van de provincies in betekenende mate zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel112
  - number: '112.2'
    text: |-
      Voorstellen als bedoeld in het eerste lid bevatten in de bijbehorende toelichting een weergave van de gevolgen
      voor de inrichting en werking van de provincies en een weergave van het in het eerste lid bedoelde oordeel van de
      betrokken provinciale besturen of representatieve instantie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel112
  - number: '112.3'
    text: |-
      Onze Minister wie het aangaat is niet verplicht vooraf het in het eerste lid bedoelde oordeel in te winnen indien
      zulks ten gevolge van dringende omstandigheden niet mogelijk is. In dat geval wordt het oordeel zo spoedig mogelijk
      ingewonnen en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel112
  - number: '113.1'
    text: |-
      Een wet waarbij van provinciale besturen regeling of bestuur wordt gevorderd of waarbij in betekenende mate
      wijziging wordt gebracht in taken en bevoegdheden van provinciale besturen, wijkt van het bepaalde in deze wet niet
      af dan wanneer dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel113
  - number: '113.2'
    text: |-
      Het voorstel voor een wet als bedoeld in het eerste lid bevat in de bijbehorende toelichting de gronden voor de
      voorgestelde afwijking.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel113
  - number: '114.1'
    text: |-
      Onze Minister is belast met de coördinatie van het rijksbeleid dat de provincies raakt. Hij bevordert voorts de
      beleidsvrijheid van het provinciaal bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel114
  - number: '114.2'
    text: |-
      Over maatregelen en voornemens die van betekenis zijn voor het rijksbeleid inzake de provincies treden Onze
      Ministers onder wier verantwoordelijkheid die maatregelen en voornemens tot stand komen in een vroegtijdig stadium
      in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister maakt bedenkingen kenbaar tegen een maatregel of een voornemen voor zover hem die maatregel of dat
      voornemen met het oog op het door de regering gevoerde decentralisatiebeleid niet toelaatbaar voorkomt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel114
  - number: '115.1'
    text: Onze Minister bevordert de decentralisatie ten behoeve van de provincies.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel115
  - number: '115.2'
    text: |-
      Onverminderd het bepaalde in [artikel 117, tweede lid, van de Gemeentewet][ref1] (*Stb.* 1992, 96), worden
      voorstellen van maatregelen waarbij bepaalde aangelegenheden tot rijksbeleid worden gerekend slechts gedaan indien
      het onderwerp van zorg niet op doelmatige en doeltreffende wijze door de provinciale besturen kan worden behartigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel117
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '117'
  - number: '116.1'
    text: Over al hetgeen de provincie betreft dient het provinciaal bestuur Onze Ministers desgevraagd van bericht en raad.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel116
  - number: '116.2'
    text: |-
      Het dienen van bericht en raad geschiedt door gedeputeerde staten, tenzij het uitdrukkelijk van provinciale staten
      of van de commissaris van de Koning wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel116
  - number: '117.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur worden de gevallen geregeld waarin het
      provinciaal bestuur verplicht is tot het verstrekken van systematische informatie aan Onze Minister wie het
      aangaat. Daarbij kan worden bepaald dat bij ministeriële regeling nadere voorschriften worden gegeven ten behoeve
      van de toepassing van de wet of de algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel117
  - number: '117.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Economische Zaken, na overleg met Onze
      Minister, kan worden bepaald dat in die maatregel te omschrijven gegevens ten behoeve van statistische doeleinden
      aan het Centraal Bureau voor de Statistiek worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel117
  - number: '117.3'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan worden bij
      algemene maatregel van bestuur nadere algemene regels gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel117
  - number: '117.4'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan, alsmede
      omtrent de verstrekking en inwinning van incidentele informatie, wordt, voorzover dat niet bij wet geschiedt, bij
      algemene maatregel van bestuur aangegeven hoe de financiële gevolgen van de verplichting tot informatieverstrekking
      worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel117
  - number: '117.5'
    text: |-
      De voordrachten voor de algemene maatregelen van bestuur, bedoeld in het derde en het vierde lid, worden gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel117
  - number: '118'
    text: |-
      De bevoegdheid tot het maken van provinciale verordeningen blijft ten aanzien van het onderwerp waarin door
      wetten of algemene maatregelen van bestuur is voorzien, gehandhaafd, voor zover de verordeningen met die wetten en
      algemene maatregelen van bestuur niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel118
  - number: '119'
    text: |-
      De bepalingen van provinciale verordeningen in wier onderwerp door een wet of een algemene maatregel van bestuur
      wordt voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel119
  - number: '120'
    text: |-
      Wanneer provinciale staten of, indien aan een commissie bevoegdheden van provinciale staten of van gedeputeerde
      staten zijn overgedragen, de commissie bij of krachtens een andere dan deze wet gevorderde beslissingen niet of
      niet naar behoren nemen, voorzien gedeputeerde staten daarin.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel120
  - number: '121.1'
    text: |-
      Wanneer gedeputeerde staten of de commissaris van de Koning bij of krachtens een andere dan deze wet gevorderde
      beslissingen niet of niet naar behoren nemen, voorziet Onze Minister daarin namens het provinciaal bestuur en ten
      laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel121
  - number: '121.2'
    text: |-
      Spoedeisende gevallen uitgezonderd, vindt het eerste lid geen toepassing dan nadat gedeputeerde staten,
      onderscheidenlijk de commissaris in de gelegenheid zijn gesteld binnen een door Onze Minister gestelde termijn
      alsnog de bij of krachtens een andere dan deze wet gevorderde beslissingen te nemen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel121
  - number: '122.1'
    text: Het provinciaal bestuur is bevoegd tot toepassing van bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel122
  - number: '122.2'
    text: |-
      De bevoegdheid tot toepassing van bestuursdwang wordt uitgeoefend door gedeputeerde staten, indien de toepassing
      van bestuursdwang dient tot handhaving van regels welke het provinciaal bestuur uitvoert.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel122
  - number: '122.3'
    text: |-
      De bevoegdheid tot toepassing van bestuursdwang wordt evenwel uitgeoefend door de commissaris van de Koning, indien
      de toepassing van bestuursdwang dient tot handhaving van regels welke hij uitvoert.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel122
  - number: '122.4'
    text: |-
      Een commissie waaraan bevoegdheden van provinciale staten of gedeputeerde staten zijn overgedragen, bezit de
      bevoegdheid tot toepassing van bestuursdwang en de bevoegdheid tot het geven van een machtiging tot binnentreden
      van een woning slechts indien ook die bevoegdheid uitdrukkelijk is overgedragen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel122
  - number: '132.1'
    text: |-
      In geval van toepassing van artikel 121 kan Onze Minister bestuursdwang toepassen namens het provinciaal bestuur en
      ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel132
  - number: '132.2'
    text: De provincie heeft in dat geval voor het bedrag van de te haren laste gebrachte kosten verhaal op de overtreder.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel132
  - number: '132.3'
    text: |-
      [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is alsdan van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '136.1'
    text: |-
      Besluiten van het provinciaal bestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer
      zij zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel136
  - number: '136.2'
    text: De bekendmaking geschiedt door plaatsing in het provinciaal blad, dat algemeen verkrijgbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel136
  - number: '136.3'
    text: |-
      Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt de dagtekening vermeld van het
      besluit waarbij die goedkeuring is verleend of wordt de mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '137'
    text: |-
      Besluiten van het provinciaal bestuur die algemeen verbindende voorschriften inhouden, liggen voor een ieder
      kosteloos ter inzage op het provinciehuis of op een andere door provinciale staten te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel137
  - number: '138'
    text: |-
      Een ieder kan op zijn verzoek een afschrift verkrijgen van de besluiten van het provinciaal bestuur die ingevolge
      artikel 137 ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel138
  - number: '139'
    text: |-
      De bekendgemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel139
  - number: '140'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende voorschriften inhouden, is het bepaalde in
      de artikelen 136 en 139 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel140
  - number: '141'
    text: |-
      Op termijnen gesteld in een provinciale verordening zijn de artikelen 1 tot en met 4 van de Algemene Termijnenwet
      van overeenkomstige toepassing, tenzij in de verordening anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel141
  - number: '143.1'
    text: |-
      Provinciale verordeningen worden door provinciale staten vastgesteld voor zover de bevoegdheid daartoe niet bij
      de wet of door provinciale staten krachtens de wet aan gedeputeerde staten of de commissaris van de Koning is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel143
  - number: '143.2'
    text: |-
      De overige bevoegdheden, bedoeld in artikel 105, berusten bij provinciale staten voor zover deze niet bij of
      krachtens de wet aan gedeputeerde staten of de commissaris van de Koning zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel143
  - number: '144.1'
    text: |-
      Provinciale staten kunnen bij verordening beleidsregels vaststellen waarmee andere organen van de provincie
      rekening houden bij de uitoefening van bij of krachtens de wet verleende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel144
  - number: '144.2'
    text: |-
      Ten aanzien van de bekendmaking van een verordening als bedoeld in het eerste lid, zijn de artikelen 136, 137 en
      138 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel144
  - number: '145'
    text: Provinciale staten maken de verordeningen die zij in het belang van de provincie nodig oordelen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel145
  - number: '146.1'
    text: |-
      Provinciale staten kunnen in hun verordeningen medewerking tot de uitvoering daarvan vorderen van de
      gemeentebesturen of, voor zover het de waterstaat betreft, van de besturen van waterschappen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel146
  - number: '146.2'
    text: |-
      De kosten, verbonden aan de in het eerste lid bedoelde medewerking, worden voor zover zij ten laste van de
      betrokken gemeenten of waterschappen blijven, door de provincie aan hen vergoed.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel146
  - number: '147.1'
    text: |-
      Provinciale staten stellen een verordening vast, waarin regels worden gesteld met betrekking tot de wijze
      waarop ingezetenen en in de provincie een belang hebbende natuurlijke en rechtspersonen bij de voorbereiding van
      provinciaal beleid worden betrokken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel147
  - number: '147.2'
    text: 'In deze verordening worden ten minste geregeld:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel147
  - number: 147.2.a
    text: de wijze waarop van de beleidsvoornemens waarop inspraak zal worden verleend, openbaar wordt kennis gegeven;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel147
  - number: 147.2.b
    text: |-
      de wijze waarop ingezetenen en in de provincie een belang hebbende natuurlijke en rechtspersonen in staat worden
      gesteld hun mening omtrent de onder *a*. bedoelde beleidsvoornemens kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel147
  - number: 147.2.c
    text: de rapportering over de onder *b*. bedoelde inspraak en over de uitkomsten daarvan;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel147
  - number: 147.2.d
    text: |-
      de wijze waarop ingezetenen en in de provincie een belang hebbende natuurlijke en rechtspersonen in de gelegenheid
      worden gesteld hun beklag te doen over de uitvoering van de verordening.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel147
  - number: '148'
    text: |-
      Provinciale staten kunnen in hun verordeningen beroep op zich openstellen van krachtens deze verordeningen door
      gedeputeerde staten of de commissaris van de Koning genomen besluiten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel148
  - number: '149'
    text: |-
      Indien beroep op provinciale staten openstaat, geschiedt de voorbereiding van de beslissing van provinciale staten
      op het beroepschrift door een door provinciale staten te benoemen commissie. In deze commissie heeft geen lid van
      gedeputeerde staten zitting. Artikel 168 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel149
  - number: '150.1'
    text: |-
      Provinciale staten kunnen op overtreding van hun verordeningen en van die van organen waaraan ingevolge artikel 152
      verordenende bevoegdheid is gedelegeerd, straf stellen maar geen andere of zwaardere dan hechtenis van ten hoogste
      drie maanden of geldboete van de tweede categorie, al dan niet met openbaarmaking van de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel150
  - number: '150.2'
    text: De in het eerste lid bedoelde strafbare feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel150
  - number: '151.1'
    text: |-
      Provinciale staten besluiten slechts tot het oprichten van en deelnemen in stichtingen, maatschappen,
      vennootschappen, verenigingen, coöperaties en onderlinge waarborgmaatschappijen indien dat bijzonder aangewezen
      moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel151
  - number: '151.2'
    text: 'Het besluit behoeft de goedkeuring van Onze Minister. De goedkeuring kan slechts worden onthouden wegens:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel151
  - number: 151.2.a
    text: strijd met het bepaalde in het eerste lid of anderszins strijd met het recht;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel151
  - number: 151.2.b
    text: andere dringende redenen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel151
  - number: '152.1'
    text: |-
      Provinciale staten kunnen aan gedeputeerde staten en aan een commissie als bedoeld in artikel 80 bevoegdheden van
      provinciale staten overdragen, tenzij de aard van de bevoegdheid zich tegen overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: '152.2'
    text: 'Daarbij kan niet worden overgedragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.a
    text: |-
      de opheffing en instelling van waterschappen, de regeling van hun taken en inrichting, alsmede de samenstelling van
      hun besturen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.b
    text: het vaststellen of wijzigen van de begroting, bedoeld in artikel 193;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.c
    text: het vaststellen van de jaarrekening als bedoeld in artikel 201;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.d
    text: het stellen van straf op overtreding van provinciale verordeningen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.e
    text: |-
      het vaststellen van regels met betrekking tot de organisatie van de administratie en het beheer van
      vermogenswaarden van de provincie, bedoeld in artikel 216;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.f
    text: |-
      het vaststellen van regels met betrekking tot de controle op de administratie en het beheer van vermogenswaarden
      van de provincie, bedoeld in artikel 217;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: 152.2.g
    text: |-
      het heffen van andere belastingen dan de rechten, bedoeld in artikel 221, onderdeel *b*, en de rechten waarvan de
      heffing krachtens andere wetten dan deze geschiedt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: '152.3'
    text: |-
      De bevoegdheid tot het maken van verordeningen, door strafbepaling of bestuursdwang te handhaven, kunnen
      provinciale staten slechts delegeren voor zover het betreft de vaststelling van nadere regels met betrekking tot
      bepaalde door hen in hun verordeningen aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: '152.4'
    text: |-
      De bevoegdheid tot het houden van toezicht op een ander publiekrechtelijk lichaam kunnen provinciale staten slechts
      overdragen aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: '152.5'
    text: |-
      Ten aanzien van een besluit als bedoeld in het eerste lid zijn de artikelen 136, 137 en 138 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: '152.6'
    text: |-
      Het bepaalde in het tweede lid, onderdeel d, en het derde lid is niet van toepassing op een commissie als bedoeld
      in artikel 85.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel152
  - number: '153.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van provinciale staten, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge artikel 152 overgedragen bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel153
  - number: '153.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel153
  - number: '154'
    text: |-
      Provinciale staten hebben het toezicht op alle waterstaatswerken, voor zover de wet het toezicht over bepaalde
      werken niet aan anderen heeft opgedragen. De eerste volzin is niet van toepassing op waterstaatswerken in beheer
      bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel154
  - number: '155'
    text: |-
      Verordeningen, geheel of in hoofdzaak de waterstaat betreffende, worden gezonden aan Onze Minister wie het aangaat.
      Zij treden niet eerder in werking dan drie maanden na de dag van verzending.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel155
  - number: '156.1'
    text: Provinciale staten kunnen de naam van de provincie wijzigen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel156
  - number: '156.2'
    text: Het besluit van provinciale staten wordt ter kennis gebracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel156
  - number: '156.3'
    text: Het besluit vermeldt de datum van ingang, die is gelegen ten minste een jaar na de datum van het besluit.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel156
  - number: '157'
    text: Provinciale staten stellen een verordening vast omtrent de ambtelijke organisatie in de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel157
  - number: '158'
    text: |-
      Het dagelijks bestuur van de provincie berust bij gedeputeerde staten voor zover niet bij of krachtens de wet de
      commissaris van de Koning hiermee is belast.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel158
  - number: '159'
    text: |-
      Gedeputeerde staten zijn belast met de voorbereiding van alles waarover in de vergadering van provinciale staten
      zal worden beraadslaagd en besloten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel159
  - number: '160'
    text: |-
      Gedeputeerde staten zijn belast met de uitvoering van de beslissingen van provinciale staten, tenzij bij of
      krachtens de wet de commissaris van de Koning hiermee is belast.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel160
  - number: '161'
    text: |-
      Onverminderd het bepaalde bij of krachtens andere wetten dragen gedeputeerde staten zorg dat de voorbereiding van
      de civiele verdediging door de provincie naar behoren geschiedt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel161
  - number: '162.1'
    text: |-
      Gedeputeerde staten nemen, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doen wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel162
  - number: '162.2'
    text: |-
      Gedeputeerde staten zijn bevoegd, tenzij provinciale staten daaromtrent in voorkomende gevallen een
      beslissing hebben genomen, tot het procederen in kort geding en tot voeging in strafzaken als bedoeld in
      [artikel 51a van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51a
  - number: '162.3'
    text: |-
      Gedeputeerde staten zijn bevoegd, indien ingevolge wettelijk voorschrift aan de provincie of aan het provinciaal
      bestuur hetzij een recht van beroep hetzij een recht bezwaar te maken toekomt, spoedshalve beroep in te stellen of
      bezwaar in te brengen alsmede, voor zover de voorschriften dat toelaten, schorsing van het aangevochten besluit of
      een voorlopige voorziening ter zake te verzoeken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel162
  - number: '162.4'
    text: |-
      Het ingestelde beroep of het gemaakte bezwaar wordt ingetrokken, indien provinciale staten de beslissing van
      gedeputeerde staten tot het instellen van beroep of het maken van bezwaar niet hetzij in hun eerstvolgende
      vergadering, hetzij binnen drie maanden bekrachtigen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel162
  - number: '163.1'
    text: |-
      Provinciale staten kunnen, op voorstel van gedeputeerde staten, aan een commissie als bedoeld in artikel 80
      bevoegdheden van gedeputeerde staten overdragen, tenzij de aard van de bevoegdheid zich tegen overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel163
  - number: '163.2'
    text: De bevoegdheid tot het geven van een betalingsopdracht kan alleen uitdrukkelijk worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel163
  - number: '163.3'
    text: |-
      Ten aanzien van een besluit als bedoeld in het eerste lid zijn de artikelen 136, 137 en 138 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel163
  - number: '165.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van gedeputeerde staten, de uitoefening daarvan en het toezicht
      daarop, zijn ten aanzien van de ingevolge artikel 163 toegekende bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel165
  - number: '165.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel165
  - number: '166.1'
    text: |-
      Gedeputeerde staten kunnen een of meer van hun leden machtigen tot uitoefening van een of meer van hun
      bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel166
  - number: '166.2'
    text: |-
      Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van gedeputeerde
      staten uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel166
  - number: '166.3'
    text: Gedeputeerde staten kunnen te dien aanzien alle aanwijzingen geven die zij nodig achten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel166
  - number: '167.1'
    text: |-
      De leden van gedeputeerde staten zijn, te zamen en ieder afzonderlijk, aan provinciale staten verantwoording
      verschuldigd voor het door hen gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel167
  - number: '167.2'
    text: |-
      Zij geven provinciale staten mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen waarvan het
      verstrekken niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel167
  - number: '168'
    text: |-
      Een door provinciale staten te maken verordening regelt de behandeling door gedeputeerde staten van administratieve
      geschillen, aan hun beslissing onderworpen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel168
  - number: '169.1'
    text: |-
      In aanvulling op [artikel 7:22 van de Algemene wet bestuursrecht][ref1] gelden de volgende bepalingen met
      betrekking tot getuigen en deskundigen die worden gehoord tijdens de behandeling van de geschillen, bedoeld in
      artikel 168.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '169.2'
    text: |-
      Getuigen en deskundigen kunnen al dan niet op verzoek van belanghebbenden door gedeputeerde staten worden
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel169
  - number: '169.3'
    text: |-
      De opgeroepenen zijn verplicht aan de oproeping gevolg te geven. De getuigen zijn verplicht getuigenis af te
      leggen, de deskundigen hun diensten als zodanig te verlenen, een en ander behoudens verschoning wegens ambts-
      of beroepsgeheim. De getuigen leggen de eed of de belofte af dat zij de gehele waarheid en niets dan de waarheid
      zullen spreken, de deskundigen dat zij verslag zullen doen naar hun geweten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel169
  - number: '169.4'
    text: |-
      Gedeputeerde staten kunnen bevelen dat getuigen of deskundigen die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel169
  - number: '169.5'
    text: |-
      Getuigen en deskundigen, door gedeputeerde staten opgeroepen, ontvangen desverlangd uit de provinciale kas een door
      provinciale staten te regelen vergoeding voor reis- en verblijfkosten en tijdsverzuim.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel169
  - number: '170'
    text: |-
      Artikel 169 is eveneens van toepassing in die gevallen waarvoor het provinciaal bestuur een behandeling op de voet
      van de verordening, bedoeld in artikel 168 heeft voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel170
  - number: '171.1'
    text: |-
      Voor de behandeling van de zaken, bedoeld in de artikelen 168 en 170, vormen gedeputeerde staten uit hun college
      een of meer kamers.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel171
  - number: '171.2'
    text: Elke kamer telt ten minste drie leden, waartoe ook de commissaris van de Koning als voorzitter behoren kan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel171
  - number: '171.3'
    text: Gedeputeerde staten regelen samenstelling en werkzaamheden der kamers.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel171
  - number: '171.4'
    text: |-
      De voorzitter van een kamer kan de behandeling van eenvoudige zaken aan een enkelvoudige kamer, bestaande uit één
      door hem uit de kamer aan te wijzen lid, opdragen. Dit lid is te allen tijde bevoegd, indien naar zijn oordeel de
      zaak niet van eenvoudige aard is, deze naar de bevoegde kamer terug te wijzen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel171
  - number: '171.5'
    text: |-
      Op de behandeling door deze kamers is het bij of krachtens de artikelen 168 en 169 bepaalde van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel171
  - number: '171.6'
    text: |-
      De uitspraken van de meervoudige kamers onderscheidenlijk de enkelvoudige kamers worden getekend door haar
      voorzitter onderscheidenlijk het lid van de kamer en mede ondertekend door degene die als haar griffier optreedt.
      De uitspraken gelden als uitspraken van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel171
  - number: '172.1'
    text: |-
      De voorzitter van een kamer als bedoeld in artikel 171, tweede lid, en het lid van een enkelvoudige kamer kunnen,
      zonder toepassing van de [artikelen 7:16][ref1] en [7:18 tot en met 7:22 van de Algemene wet bestuursrecht][ref2],
      uitspraak doen, indien het verzoek om voorziening kennelijk niet-ontvankelijk is, dan wel indien de verdere
      behandeling van de zaak hen niet nodig voorkomt, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 172.1.a
    text: het verzoek kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: 172.1.b
    text: het aangevallen besluit kennelijk niet in stand kan blijven;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: 172.1.c
    text: |-
      het aangevallen besluit door het bevoegde overheidsorgaan is ingetrokken of gewijzigd, en dit orgaan kennelijk aan
      de bezwaren van de verzoeker is tegemoet gekomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: '172.2'
    text: |-
      Het voornemen om in een zaak op de in het eerste lid bedoelde wijze uitspraak te doen, wordt door de voorzitter
      van een kamer als bedoeld in artikel 171, onderscheidenlijk het lid van een enkelvoudige kamer bekendgemaakt aan de
      belanghebbenden. De bekendmaking bevat een kennisgeving van hetgeen in het derde lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: '172.3'
    text: |-
      Tegen de voorgenomen wijze van afdoening kan de belanghebbende binnen veertien dagen na de bekendmaking van het
      voornemen schriftelijk verzet doen bij gedeputeerde staten indien het een voornemen betreft van de voorzitter van
      een kamer als bedoeld in artikel 171, of, indien het een voornemen betreft van het lid van een enkelvoudige kamer,
      bij de kamer uit welke dat lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: '172.4'
    text: |-
      Alvorens een uitspraak te doen op het verzet, stellen gedeputeerde staten onderscheidenlijk de kamer uit welke het
      lid van een enkelvoudige kamer is aangewezen, de indiener van het verzetschrift die daarom vroeg in de gelegenheid
      in een openbare vergadering te worden gehoord en de stukken die op zijn zaak betrekking hebben in te zien, tenzij
      zij van oordeel zijn dat het verzet gegrond is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: '172.5'
    text: |-
      Al hetgeen verder de indiening en de behandeling van, alsmede de uitspraak op het verzetschrift betreft wordt door
      provinciale staten nader geregeld in de verordening, bedoeld in artikel 168.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel172
  - number: '173'
    text: |-
      Indien een besluit van de raad of van burgemeester en wethouders van een gemeente in hun provincie naar het oordeel
      van gedeputeerde staten voor vernietiging in aanmerking komt, doen zij daarvan mededeling aan Onze Minister wie
      het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel173
  - number: '174'
    text: |-
      Gedeputeerde staten trachten alle geschillen tussen in hun provincie gevestigde gemeenten, waterschappen en
      lichamen, ingesteld bij gemeenschappelijke regeling, in der minne te doen bijleggen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel174
  - number: '175'
    text: De commissaris van de Koning bevordert een goede behartiging van de zaken van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel175
  - number: '176.1'
    text: De commissaris vertegenwoordigt de provincie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel176
  - number: '176.2'
    text: |-
      De commissaris kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen
      persoon.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel176
  - number: '179.1'
    text: De commissaris is aan provinciale staten verantwoording verschuldigd voor het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel179
  - number: '179.2'
    text: |-
      Hij geeft provinciale staten mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen waarvan het
      verstrekken niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel179
  - number: '180'
    text: |-
      De artikelen 168 tot en met 170 zijn van overeenkomstige toepassing op de behandeling door de commissaris van
      administratieve geschillen, aan zijn beslissing onderworpen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel180
  - number: '181'
    text: |-
      Indien een besluit van de burgemeester van een gemeente in zijn provincie naar het oordeel van de commissaris voor
      vernietiging in aanmerking komt, doet hij daarvan mededeling aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel181
  - number: '182.1'
    text: 'De commissaris is, volgens regels te stellen bij een door de regering gegeven ambtsinstructie, belast met:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: 182.1.a
    text: |-
      het bevorderen van de samenwerking tussen de in de provincie werkzame rijksambtenaren onderling en met het
      provinciaal bestuur, de gemeentebesturen en de waterschapsbesturen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: 182.1.b
    text: het regelmatig bezoeken van de gemeenten in de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: 182.1.c
    text: |-
      het uitbrengen van adviezen aan de regering of aan Onze Ministers over andere onderwerpen dan die bedoeld in
      artikel 116, eerste lid;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: 182.1.d
    text: |-
      de coördinatie van de voorbereiding van de civiele verdediging door de in de provincie werkzame rijksambtenaren,
      het provinciaal bestuur, de gemeentebesturen en de waterschapsbesturen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: 182.1.e
    text: de bewaring en registratie van aan hem gerichte stukken, verband houdende met zijn ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: '182.2'
    text: |-
      Bij de wet kan de commissaris, volgens regels te stellen bij de in het eerste lid bedoelde ambtsinstructie, worden
      belast met andere dan de in dat lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: '182.3'
    text: |-
      De ambtsinstructie wordt vastgesteld bij algemene maatregel van bestuur. De voordracht wordt gedaan door of mede
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: '182.4'
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: '182.5'
    text: De artikelen 79, 144 en 179 zijn niet van toepassing op de uitvoering van de ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel182
  - number: '190'
    text: |-
      De begroting, de begrotingswijzigingen, de meerjarenraming, de jaarrekening en het jaarverslag worden ingericht
      overeenkomstig bij of krachtens algemene maatregel van bestuur te geven regels.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel190
  - number: '191'
    text: Aan de provincies kunnen slechts bij of krachtens de wet uitgaven worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel191
  - number: '192'
    text: |-
      De provinciale besturen zenden aan Onze Minister hun besluiten binnen twee weken na de vaststelling daarvan,
      betreffende:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel192
  - number: 192.a
    text: het aangaan van geldleningen en rekening-courant-overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel192
  - number: 192.b
    text: het uitlenen van gelden en het waarborgen van geldelijke verplichtingen, door anderen aan te gaan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel192
  - number: '193.1'
    text: |-
      Voor alle taken en activiteiten brengen provinciale staten jaarlijks op de begroting de bedragen die zij daarvoor
      beschikbaar stellen, alsmede de financiële middelen die zij naar verwachting kunnen aanwenden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel193
  - number: '193.2'
    text: De begroting bevat mede een bedrag voor onvoorziene uitgaven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel193
  - number: '193.3'
    text: |-
      Provinciale staten zien erop toe dat de begroting in evenwicht is. Hiervan kunnen zij afwijken indien aannemelijk
      is dat het evenwicht in de begroting in de eerstvolgende jaren tot stand zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel193
  - number: '193.4'
    text: |-
      Behoudens het bepaalde in de artikelen 212 en 213 kunnen ten laste van de provincie slechts uitgaven worden gedaan
      tot de bedragen die hiervoor op de begroting zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel193
  - number: '193.5'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel193
  - number: '194.1'
    text: |-
      Gedeputeerde staten bieden jaarlijks, tijdig voor de in artikel 195, eerste lid, bedoelde vaststelling, provinciale
      staten een ontwerp aan voor de begroting met toelichting van de provincie en een meerjarenraming met toelichting
      voor ten minste drie op het begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel194
  - number: '194.2'
    text: |-
      De ontwerp-begroting en de overige in het eerste lid bedoelde stukken liggen, zodra zij aan provinciale
      staten zijn aangeboden, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel194
  - number: '194.3'
    text: Provinciale staten beraadslagen over de ontwerp-begroting niet eerder dan twee weken na de openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel194
  - number: '195.1'
    text: Provinciale staten stellen de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel195
  - number: '195.2'
    text: |-
      Gedeputeerde staten zenden de door provinciale staten vastgestelde begroting vergezeld van de in artikel 194,
      eerste lid, bedoelde stukken binnen twee weken na de vaststelling, doch in ieder geval vóór 15 november van het
      jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel195
  - number: '196.1'
    text: |-
      Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel196
  - number: '196.2'
    text: |-
      De artikelen 194, tweede lid, 195, tweede lid, alsmede, behoudens in gevallen van dringende spoed, artikel 194,
      derde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel196
  - number: '197'
    text: 'Verplichte uitgaven van de provincie zijn:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel197
  - number: 197.a
    text: de renten en aflossingen van de door de provincie aangegane geldleningen en alle overige opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel197
  - number: 197.b
    text: de uitgaven die bij of krachtens de wet aan de provincie zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel197
  - number: 197.c
    text: |-
      de uitgaven die voortvloeien uit de van het provinciale bestuur gevorderde medewerking tot uitvoering van wetten en
      algemene maatregelen van bestuur, voor zover die uitgaven niet ten laste van anderen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel197
  - number: '198.1'
    text: |-
      Indien provinciale staten weigeren verplichte uitgaven of een bedrag voor onvoorziene uitgaven op de begroting te
      brengen, doet Onze Minister dit.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel198
  - number: '198.2'
    text: |-
      Indien provinciale staten bovendien weigeren in voldoende dekking van in het eerste lid bedoelde uitgaven te
      voorzien, vermindert Onze Minister daartoe hetzij het bedrag voor onvoorziene uitgaven, hetzij indien dit bedrag
      niet toereikend is, overige niet-verplichte uitgaven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel198
  - number: '199'
    text: |-
      Onze Minister draagt zo nodig aan de bevoegde provinciale ambtenaar bedoeld in artikel 216, tweede lid, de betaling
      op ten laste van de provincie van hetgeen als verplichte uitgaaf op de begroting is gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel199
  - number: '201.1'
    text: |-
      Gedeputeerde staten leggen aan provinciale staten over elk begrotingsjaar verantwoording af van het gevoerde
      financieel beheer onder overlegging van de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel201
  - number: '201.2'
    text: Zij voegen daarbij een verslag als bedoeld in artikel 217, tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel201
  - number: '201.3'
    text: |-
      De jaarrekening en de verslagen liggen, zodra zij aan provinciale staten zijn overgelegd, voor een ieder ter inzage
      en zijn algemeen verkrijgbaar. Van de terinzagelegging en de verkrijgbaarstelling wordt openbaar kennis gegeven.
      Provinciale staten beraadslagen over de jaarrekening en het jaarverslag niet eerder dan twee weken na de openbare
      kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel201
  - number: '202.1'
    text: Provinciale staten stellen de jaarrekening vast in het jaar volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel202
  - number: '202.2'
    text: |-
      Provinciale staten kunnen uitgaven die te kwader trouw zijn geboekt op een post waarmee zij niet overeenstemmen of
      die anderszins niet rechtmatig zijn gedaan, buiten de jaarrekening laten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel202
  - number: '202.3'
    text: |-
      De leden van gedeputeerde staten nemen niet deel aan de stemmingen over besluiten als bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel202
  - number: '203'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast het besluit tot vaststelling van de jaarrekening de
      leden van gedeputeerde staten ten aanzien van het daarin verantwoorde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel203
  - number: '204.1'
    text: |-
      Gedeputeerde staten zenden de door provinciale staten vastgestelde jaarrekening vergezeld van de in artikel 201
      bedoelde verslagen binnen twee weken na vaststelling, doch in ieder geval vóór 15 september van het jaar volgend op
      het begrotingsjaar aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel204
  - number: '204.2'
    text: |-
      Indien provinciale staten artikel 202, tweede lid, hebben toegepast, zenden gedeputeerde staten het desbetreffende
      besluit met de jaarrekening aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel204
  - number: '205.1'
    text: |-
      Indien uitgaven niet in de vastgestelde jaarrekening zijn opgenomen, zijn de leden van gedeputeerde staten
      daarvoor, ieder voor een gelijk deel, persoonlijk aansprakelijk jegens de provincie, tenzij blijkt dat zij aan het
      besluit tot het doen van die uitgaven niet hebben meegewerkt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel205
  - number: '205.2'
    text: |-
      Gelijke aansprakelijkheid bestaat voor zover zij te kwader trouw hebben meegewerkt aan het niet of niet tijdig
      innen van vorderingen of andere aan de provincie toekomende gelden dan wel aan het overeenkomen van afstand van een
      vorderingsrecht waardoor de provincie schade heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel205
  - number: '205.3'
    text: |-
      De provincie stelt, zo dikwijls daartoe volgens dit artikel termen zijn, zonder nadere beslissing van provinciale
      of gedeputeerde staten tot het voeren van een rechtsgeding, een rechtsvordering in tot betaling van de krachtens
      het eerste of tweede lid verschuldigde gelden. Provinciale staten wijzen iemand aan om de provincie in het
      rechtsgeding te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel205
  - number: '205.4'
    text: |-
      Indien binnen een door Onze Minister gestelde termijn geen rechtsvordering is ingesteld, gaat Onze Minister namens
      en ten laste van de provincie daartoe over.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel205
  - number: '206'
    text: |-
      Indien provinciale staten de jaarrekening, nadat deze door gedeputeerde staten overeenkomstig het bepaalde in
      artikel 201, eerste lid, aan provinciale staten is aangeboden, niet of niet naar behoren vaststellen, zenden
      gedeputeerde staten de jaarrekening vergezeld van de in artikel 201 bedoelde verslagen ter vaststelling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel206
  - number: '207.1'
    text: |-
      De begroting, bedoeld in artikel 193, van het eerstvolgende begrotingsjaar alsmede de daarop betrekking hebbende
      begrotingswijzigingen behoeven de goedkeuring van Onze Minister, indien naar zijn oordeel de begroting, bedoeld in
      artikel 193, niet in evenwicht is en blijkens de meerjarenraming, bedoeld in artikel 194, niet aannemelijk is dat
      in de eerstvolgende jaren een evenwicht tot stand zal worden gebracht. Onze Minister doet hiervan vóór de aanvang
      van het begrotingsjaar mededeling aan het provinciaal bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: '207.2'
    text: |-
      Onze Minister kan bepalen dat de begroting, bedoeld in artikel 193, van het eerstvolgende begrotingsjaar alsmede de
      daarop betrekking hebbende begrotingswijzigingen zijn goedkeuring behoeven, indien:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: 207.2.a
    text: de jaarrekening van het tweede aan het begrotingsjaar voorafgaande jaar niet in evenwicht is, of
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: 207.2.b
    text: |-
      de begroting, bedoeld in artikel 193, niet tijdig is ingezonden aan Onze Minister overeenkomstig het bepaalde in
      artikel 195, of
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: 207.2.c
    text: |-
      de jaarrekening, bedoeld in artikel 202, eerste lid, van het tweede aan het begrotingsjaar voorafgaande jaar niet
      tijdig is ingezonden aan Onze Minister overeenkomstig het bepaalde in artikel 204, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: '207.3'
    text: |-
      Onze Minister maakt een besluit als bedoeld in het tweede lid voor de aanvang van het begrotingsjaar aan het
      provinciaal bestuur bekend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: '207.4'
    text: |-
      De begroting behoeft geen goedkeuring indien Onze Minister geen mededeling doet als bedoeld in het eerste lid of
      geen besluit bekendmaakt als bedoeld in het tweede lid binnen de in het eerste respectievelijk derde lid genoemde
      termijn.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel207
  - number: '209'
    text: |-
      Onze Minister maakt bij de aanvang van het desbetreffende begrotingsjaar door publicatie in de *Staatscourant*
      bekend van welke provincies de begrotingen en begrotingswijzigingen zijn goedkeuring behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel209
  - number: '210'
    text: De goedkeuring kan slechts worden onthouden wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel210
  - number: '211.1'
    text: |-
      Indien op de dag waarop een besluit tot wijziging van de begroting aan Onze Minister wordt aangeboden, de begroting
      nog niet is goedgekeurd, vangt de in [artikel 10:31, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde
      termijn aan op de dag van de goedkeuring van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '211.2'
    text: |-
      Onze Minister kan bij zijn besluit omtrent goedkeuring van de begroting ten aanzien van door hem aan te geven
      soorten van wijzigingen daarvan bepalen dat die zijn goedkeuring niet behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel211
  - number: '212.1'
    text: |-
      Indien de begroting of een besluit tot wijziging daarvan niet is goedgekeurd, behoeft het provinciaal bestuur tot
      het doen van uitgaven de toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel212
  - number: '212.2'
    text: |-
      Een aanvraag van het provinciaal bestuur om toepassing van het eerste lid kan door Onze Minister slechts worden
      afgewezen wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel212
  - number: '212.3'
    text: |-
      Onze Minister beslist op de aanvraag binnen twee maanden na de verzending van de aanvraag, bedoeld in het tweede
      lid. De toestemming wordt geacht te zijn verleend indien binnen deze termijn geen besluit aan het provinciale
      bestuur is verzonden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel212
  - number: '212.4'
    text: Onze Minister kan aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel212
  - number: '212.5'
    text: |-
      Onze Minister kan bepalen voor welke posten en tot welk bedrag het provinciale bestuur de toestemming, bedoeld in
      het eerste lid, niet behoeft.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel212
  - number: '213.1'
    text: |-
      In gevallen van dringende spoed kan, indien provinciale staten daartoe besluiten, een uitgaaf worden gedaan voordat
      de desbetreffende begroting of begrotingswijziging is goedgekeurd. Het besluit wordt terstond toegezonden aan Onze
      Minister. Is de uitgaaf geraamd bij een begrotingswijziging welke nog niet ter goedkeuring is ingezonden, dan wordt
      deze begrotingswijziging te zamen met het besluit toegezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel213
  - number: '213.2'
    text: Over het in het eerste lid bedoelde besluit stemmen provinciale staten bij hoofdelijke oproeping.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel213
  - number: '214.1'
    text: |-
      Indien provinciale staten artikel 213 hebben toegepast en Onze Minister zijn goedkeuring aan de desbetreffende
      begroting of begrotingswijziging onthoudt, kan hij binnen een maand nadat zijn besluit onherroepelijk is geworden,
      de leden van provinciale staten die hun stem voor het in artikel 213 bedoelde besluit hebben uitgebracht, ieder
      voor een gelijk deel, persoonlijk voor deze uitgaaf aansprakelijk stellen tegenover de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel214
  - number: '214.2'
    text: |-
      De werking van de beschikking tot aansprakelijkstelling wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel214
  - number: '214.3'
    text: |-
      Onze Minister stelt zo nodig namens en ten laste van de provincie een rechtsvordering in tot betaling van de
      krachtens het besluit tot aansprakelijkstelling verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel214
  - number: '215'
    text: |-
      Indien de begroting van een provincie ingevolge artikel 207, eerste of tweede lid, is onderworpen aan goedkeuring,
      kan Onze Minister bepalen dat door hem aan te wijzen beslissingen van het provinciaal bestuur die financiële
      gevolgen voor de provincie hebben of kunnen hebben, door het provinciaal bestuur binnen twee weken aan Onze
      Minister worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel215
  - number: '216.1'
    text: |-
      Provinciale staten stellen bij verordening regels vast met betrekking tot de organisatie van de administratie
      en van het beheer van vermogenswaarden van de provincie. Deze regels dienen te waarborgen dat aan de eisen van
      doelmatigheid en controle wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel216
  - number: '216.2'
    text: |-
      De administratie en het beheer, bedoeld in het eerste lid, worden verricht door de bij de in dat lid bedoelde
      regels aan te wijzen ambtenaren. Zij kunnen niet tevens griffier zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel216
  - number: '216.3'
    text: |-
      De regels, bedoeld in het eerste lid, voorzien in een financieringsstatuut, waarin in ieder geval regels zijn
      opgenomen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel216
  - number: 216.3.a
    text: de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel216
  - number: 216.3.b
    text: |-
      de administratieve organisatie van de financieringsfunctie, waaronder begrepen taken en bevoegdheden, de
      verantwoordingsrelaties en de bijbehorende informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel216
  - number: '217.1'
    text: |-
      Provinciale staten stellen bij verordening regels vast met betrekking tot de controle op de administratie en op het
      beheer van vermogenswaarden van de provincie. Deze regels dienen onder meer te waarborgen dat de rechtmatigheid en
      de doelmatigheid van de administratie en het beheer worden getoetst.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel217
  - number: '217.2'
    text: |-
      De regels, bedoeld in het eerste lid, voorzien in de aanwijzing van een of meer accountants als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met het onderzoek van de in artikel
      201 bedoelde jaarrekening alsmede met het ter zake uitbrengen van een verslag, dat behalve de verklaring bij de
      jaarrekening bevindingen bevat over de vraag of de administratie en het beheer voldoen aan eisen van rechtmatigheid
      en doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '217.3'
    text: |-
      Accountants als bedoeld in het tweede lid kunnen in provinciale dienst worden aangesteld. In dat geval worden zij
      door provinciale staten benoemd, geschorst en ontslagen. Artikel 98, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel217
  - number: '218'
    text: |-
      Gedeputeerde staten zenden de verordeningen, bedoeld in de artikelen 216 en 217, binnen twee weken na vaststelling
      door provinciale staten aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel218
  - number: '219'
    text: |-
      Onze Minister kan te allen tijde een onderzoek instellen naar de wijze waarop de administratie en het beheer,
      bedoeld in artikel 216, eerste lid, worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel219
  - number: '220'
    text: |-
      Provinciale staten besluiten tot het invoeren, wijzigen of afschaffen van een provinciale belasting door het
      vaststellen van een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel220
  - number: 220a
    text: |-
      Een belastingverordening vermeldt, in de daartoe leidende gevallen, de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, het
      tijdstip van beëindiging van de heffing en hetgeen overigens voor de heffing en de invordering van belang is.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel220a
  - number: '221.1'
    text: |-
      Behalve de provinciale belastingen waarvan de heffing krachtens andere wetten dan deze geschiedt, worden geen
      andere belastingen geheven dan die bedoeld in de tweede paragraaf van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel221
  - number: '221.2'
    text: |-
      Behoudens het bepaalde in andere wetten dan deze en in de tweede paragraaf van dit hoofdstuk kunnen de provinciale
      belastingen worden geheven naar in de belastingverordening te bepalen heffingsmaatstaven, met dien verstande dat
      het bedrag van een provinciale belasting niet afhankelijk mag worden gesteld van het inkomen, de winst of het
      vermogen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel221
  - number: '222.1'
    text: |-
      Er kunnen provinciale opcenten op de hoofdsom van de motorrijtuigenbelasting worden geheven van
      de in de provincie wonende of gevestigde houders van personenauto’s en motorrijwielen, bedoeld in
      [artikel 2, onderdelen b en d][ref1], en [artikel 3 van de Wet op de motorrijtuigenbelasting 1994][ref2] en van
      degenen op wier naam een kenteken als bedoeld in [artikel 62 van die wet][ref3] is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '62'
  - number: '222.2'
    text: Het aantal opcenten bedraagt voor de belastingtijdvakken die na 31 maart 1997 aanvangen ten hoogste 66,4.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222
  - number: '222.3'
    text: |-
      Voor de berekening van het aan opcenten verschuldigde bedrag wordt uitgegaan van het tarief van de Wet op de
      motorrijtuigenbelasting 1994 zoals dat geldt op 1 april 1995 met dien verstande dat de verhoging van de belasting,
      bedoeld in artikel 23, tweede lid, van die wet en de vermindering van de belasting, bedoeld in de artikelen 28 en
      68 van die wet buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222
  - number: '222.4'
    text: |-
      Het in het tweede lid genoemde aantal opcenten wordt jaarlijks aangepast aan de hand van het vierjaarlijks
      voortschrijdend gemiddelde van de gerealiseerde nominale ontwikkeling van het nationaal inkomen. Onze Minister van
      Financiën bepaalt jaarlijks vóór 1 juli van enig jaar, in overeenstemming met Onze Minister, het aantal opcenten
      dat de provincies ten hoogste kunnen heffen in de periode die aanvangt op 1 april nadien. Dit aantal wordt naar
      boven afgerond op één decimaal.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222
  - number: '222.5'
    text: Het aantal opcenten is voor alle motorrijtuigen, bedoeld in het eerste lid, gelijk.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222
  - number: '222.6'
    text: |-
      Onze Minister van Financiën verstrekt de provinciale besturen jaarlijks vóór 1 september een naar soort,
      gewichtsklasse en aantal gespecificeerd overzicht van de motorrijtuigen, bedoeld in het eerste lid. Het overzicht
      wordt opgesteld naar de toestand per 1 juli van het lopende jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222
  - number: 222a.1
    text: |-
      Besluiten tot het invoeren, wijzigen of afschaffen van provinciale opcenten op de hoofdsom van de
      motorrijtuigenbelasting treden in werking met ingang van 1 april van enig jaar. Een desbetreffend besluit wordt
      vóór 31 december van het voorafgaande jaar in afschrift ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222a
  - number: 222a.2
    text: |-
      Een in het eerste lid bedoeld besluit heeft geen gevolgen voor de opcenten die zijn betaald over een tijdvak dat
      vóór de datum van inwerkingtreding van dat besluit is aangevangen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222a
  - number: 222a.3
    text: |-
      Bij naheffing van belasting worden opcenten berekend volgens het hoogste aantal dat in enige provincie
      van toepassing was op de dag waarop de in de artikelen 33, 34, 35, 36, 52, 53, 69 en 76 van de Wet op de
      motorrijtuigenbelasting 1994 bedoelde feiten zijn geconstateerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222a
  - number: 222a.4
    text: |-
      De houders van motorrijtuigen die niet hier te lande wonen of gevestigd zijn, maar die wel aan de heffing van
      motorrijtuigenbelasting zijn onderworpen, worden voor de heffing van opcenten geacht te wonen of te zijn gevestigd
      in een provincie die het hoogste aantal opcenten heft. In bijzondere gevallen kan Onze Minister van Financiën in
      overeenstemming met Onze Minister ook voor andere houders van motorrijtuigen een provincie aanwijzen waar deze
      houders worden geacht te wonen of te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222a
  - number: 222a.5
    text: |-
      De opbrengsten van de opcenten die worden geheven volgens het derde en vierde lid, worden naar evenredigheid van
      het aandeel van een provincie in de totale opbrengst van de ten behoeve van de provincies geheven opcenten over
      alle provincies verdeeld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222a
  - number: 222a.6
    text: |-
      Verandering van woonplaats of van plaats van vestiging van de houder van een motorrijtuig in de loop van het
      tijdvak waarover de motorrijtuigenbelasting is betaald, vormt geen aanleiding tot het heffen van opcenten over
      het nog niet verstreken gedeelte van het tijdvak door een andere provincie of tot het verlenen van teruggaaf van
      geheven opcenten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222a
  - number: 222c
    text: |-
      Ter zake van het hebben van voorwerpen onder, op of boven voor de openbare dienst bestemde grond van de provincie,
      kan een precariobelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel222c
  - number: '223.1'
    text: 'Rechten kunnen worden geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel223
  - number: 223.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde provinciale bezittingen of van de
      voor de openbare dienst bestemde werken of inrichtingen die bij de provincie in beheer of in onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel223
  - number: 223.1.b
    text: het genot van door of vanwege het provinciaal bestuur verstrekte diensten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel223
  - number: '223.2'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de in het eerste lid bedoelde rechten aangemerkt als provinciale
      belastingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel223
  - number: '224'
    text: |-
      De rechten, bedoeld in artikel 223, eerste lid, kunnen worden geheven door de provincie die het gebruik van de
      bezittingen, werken of inrichtingen toestaat of de diensten verleent, ongeacht of het belastbare feit zich binnen
      of buiten het grondgebied van de provincie voordoet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel224
  - number: '225.1'
    text: |-
      In verordeningen op grond waarvan rechten als bedoeld in artikel 223, eerste lid, worden geheven, worden de
      tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel225
  - number: '225.2'
    text: 'Onder de in het eerste lid bedoelde lasten worden mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel225
  - number: 225.2.a
    text: bijdragen aan bestemmingsreserves en voorzieningen voor noodzakelijke vervanging van de betrokken activa;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel225
  - number: 225.2.b
    text: |-
      de omzetbelasting die ingevolge de [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het
      fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '226'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in deze paragraaf, nadere
      regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel226
  - number: '227'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227
  - number: 227.a
    text: |-
      Algemene wet: [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 227.b
    text: 'heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op aangifte.'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227
  - number: 227a.1
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde geschieden de heffing en de invordering van provinciale
      belastingen, andere dan die bedoeld in [artikel 222, met toepassing van de Algemene wet](onbekend), de
      [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2] als waren die belastingen
      rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
  - number: 227a.2
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde gelden de bevoegdheden en de verplichtingen
      van de hierna vermelde, in de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde functionarissen, met betrekking tot de provinciale
      belastingen voor de daarachter genoemde colleges of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: 227a.2.a
    text: |-
      Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het college van gedeputeerde
      staten;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
  - number: 227a.2.b
    text: 'de inspecteur: de provincieambtenaar, belast met de heffing van provinciale belastingen;'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
  - number: 227a.2.c
    text: |-
      de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de provincieambtenaar belast met de invordering van
      provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
  - number: 227a.2.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de provincieambtenaren belast met de heffing of de invordering van
      provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
  - number: 227a.2.e
    text: 'de belastingdeurwaarder: de daartoe aangewezen provincieambtenaar.'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
  - number: 227a.3
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot provinciale belastingen in
      de [Algemene wet][ref1] en in de [Invorderingswet 1990][ref2] voor «algemene maatregel van bestuur» en voor
      «ministeriële regeling» gelezen: besluit van het college van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 227b.1
    text: |-
      Het college van gedeputeerde staten kan bepalen dat voor de toezending of uitreiking van aanslagbiljetten ingevolge
      artikel 8, eerste lid, van de Invorderingswet 1990 voor de in artikel 227a, tweede lid, onderdeel c, bedoelde
      ambtenaar een andere provincieambtenaar in de plaats treedt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.2
    text: |-
      De colleges van gedeputeerde staten van twee of meer provincies kunnen met betrekking tot een of meer provinciale
      belastingen bepalen dat ambtenaren van een van die provincies worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.2.a
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde ambtenaar van die provincies voor de uitvoering van enige
      wettelijke bepaling betreffende de heffing van provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.2.b
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *c*, bedoelde ambtenaar van die provincies voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.2.c
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *d*, bedoelde ambtenaren van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.2.d
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *e*, bedoelde ambtenaar van die provincies, voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het college van gedeputeerde staten van de
      provincie waarvan de ambtenaar belast met de invordering van provinciale belastingen op grond van het tweede lid,
      onderdeel *b*, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.4
    text: |-
      Indien voor de heffing of de invordering van provinciale belastingen een gemeenschappelijke regeling is getroffen
      en bij die regeling een openbaar lichaam is ingesteld, kan bij of krachtens die regeling worden bepaald dat een
      daartoe aangewezen ambtenaar van dat openbare lichaam wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.4.a
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde ambtenaar van de provincie voor de uitvoering van enige
      wettelijke bepaling betreffende de heffing van provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.4.b
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel*c*, bedoelde ambtenaar van de provincie voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.4.c
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *d*, bedoelde ambtenaren van de provincie voor de uitvoering van enige
      wettelijke bepaling betreffende de heffing of de invordering van provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.4.d
    text: |-
      de in artikel 227*a*, tweede lid, onderdeel *e*, bedoelde ambtenaar van de provincie voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van provinciale belastingen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227b.5
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      waarvan een ambtenaar op grond van het vierde lid, onderdeel *b*, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227b
  - number: 227c
    text: |-
      Provinciale belastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op
      andere wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227c
  - number: 227d.1
    text: |-
      Indien de provinciale belastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke wijze
      deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan daarnaast bepalen dat het college van gedeputeerde staten omtrent de uitvoering van een en
      ander nadere regels geeft.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227d
  - number: 227d.2
    text: |-
      De op andere wijze geheven belastingen worden voor de toepassing van de [Algemene wet][ref1] en de
      [Invorderingswet 1990][ref2] aangemerkt als bij wege van aanslag geheven belastingen, met dien verstande dat wordt
      verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227d
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 227d.2.a
    text: |-
      de aanslag, de voorlopige aanslag, de navorderingsaanslag: het gevorderde, onderscheidenlijk het voorlopig
      gevorderde, het nagevorderde bedrag;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227d
  - number: 227d.2.b
    text: 'het aanslagbiljet: de kennisgeving van het in onderdeel *a* bedoelde bedrag;'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227d
  - number: 227d.2.c
    text: |-
      de dagtekening van het aanslagbiljet: de dagtekening van de schriftelijke kennisgeving van het in onderdeel *a*
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel227d
  - number: '228'
    text: |-
      Bij de heffing van provinciale belastingen blijven de [artikelen 2, vierde lid][ref1], [3][ref2],
      [37 tot en met 39][ref3], [47a][ref4], [48][ref5], [52][ref6], [53][ref7], [54][ref8], [55][ref9], [62][ref10],
      [71][ref11], [76][ref12], [80, tweede, derde en vierde lid][ref13], [82][ref14], [84][ref15], [86][ref16],
      [87][ref17] en [90 tot en met 95 van de Algemene wet][ref18] buiten toepassing. Bij de heffing van provinciale
      belastingen die op andere wijze worden geheven, blijven bovendien de [artikelen 5][ref19], [6 tot en met 9][ref20],
      [11, tweede lid][ref21], en [12][ref22] van die wet buiten toepassing.


