  - number: 228a.1
    text: |-
      Het uitnodigen tot het doen van aangifte, bedoeld in [artikel 6 van de Algemene wet][ref1], geschiedt door het
      uitreiken van een aangiftebiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '6'
  - number: 228a.2
    text: |-
      Het doen van aangifte, bedoeld in [artikel 8 van de Algemene wet][ref1], geschiedt door het inleveren of toezenden
      van het uitgereikte aangiftebiljet met de daarbij gevraagde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel8
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '8'
  - number: 228a.3
    text: |-
      In afwijking in zoverre van de vorige leden kan de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde
      provincieambtenaar vorderen dat een verplichting tot het doen van aangifte of tot het indienen van een verzoek om
      uitreiking van een aangiftebiljet wordt nagekomen door het mondeling doen van aangifte. Daarbij:
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
  - number: 228a.3.a
    text: |-
      worden de door de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde provincieambtenaar gevraagde bescheiden
      overgelegd;
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
  - number: 228a.3.b
    text: |-
      kan de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde provincieambtenaar vorderen dat een van de mondelinge
      aangifte opgemaakt relaas door de aangever wordt ondertekend, bij gebreke waarvan de aangifte geacht wordt niet te
      zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
  - number: 228a.4
    text: |-
      Indien het derde lid toepassing vindt, kan de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde
      provincieambtenaar voor de termijnen, genoemd in artikel 9, eerste en derde lid, eerste volzin, artikel 10, tweede
      lid, en artikel 19, eerste, derde en vierde lid, van de Algemene wet, of voor de kortere termijn, bedoeld in
      artikel 228*b*, eerste of tweede lid, kortere termijnen in de plaats stellen en is artikel 12 van de Algemene wet
      niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
  - number: 228a.5
    text: Bij de belastingverordening kan van het eerste en tweede lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228a
  - number: 228b.1
    text: |-
      Met betrekking tot de bij wege van aanslag geheven provinciale belastingen kan in de belastingverordening voor de
      in [artikel 9, eerste lid en derde lid, van de Algemene wet][ref1] genoemde termijn van ten minste een maand een
      kortere termijn in de plaats worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: 228b.2
    text: |-
      Met betrekking tot de bij wege van voldoening op aangifte geheven provinciale belastingen kan
      in de belastingverordening voor de termijn van een maand, genoemd in artikel 10, tweede lid, en
      [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref1], een kortere termijn in de plaats worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 228c.1
    text: |-
      De in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde provincieambtenaar is bevoegd om voor een zelfde
      belastingplichtige bestemde belastingaanslagen van dezelfde soort die betrekking kunnen hebben op verschillende
      belastingen, op één aanslagbiljet te verenigen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228c
  - number: 228c.2
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228c
  - number: 228d
    text: |-
      Voor de toepassing van de [artikelen 9, vierde lid][ref1], [18, derde lid][ref2], en
      [21, tweede lid, van de Algemene wet][ref3] wordt met een onherroepelijke veroordeling gelijkgesteld het vervallen
      van het recht tot strafvordering op de voet van [artikel 74 van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel228d
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '229.1'
    text: |-
      Degene die ingevolge de belastingverordening aanspraak kan maken op een gehele of gedeeltelijke vrijstelling,
      vermindering, ontheffing of teruggaaf kan binnen zes weken nadat de omstandigheid welke die aanspraak deed
      ontstaan, zich heeft voorgedaan, of, voor zover het een belasting betreft die bij wege van aanslag wordt geheven
      en op dat tijdstip nog geen aanslagbiljet is uitgereikt of toegezonden, binnen zes weken na de dagtekening van het
      aanslagbiljet, een aanvraag tot het verkrijgen van vrijstelling, vermindering, ontheffing of teruggaaf indienen bij
      de in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde provincieambtenaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel229
  - number: '229.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel229
  - number: '229.3'
    text: |-
      De in artikel 227*a*, tweede lid, onderdeel *b*, bedoelde provincieambtenaar beslist op de aanvraag bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel229
  - number: 229a
    text: |-
      In de gevallen waarin het volkenrecht dan wel, naar het oordeel van Onze Minister en Onze Minister van Financiën,
      het internationale gebruik daartoe noodzaakt, wordt vrijstelling van provinciale belastingen verleend. Onze
      genoemde Ministers kunnen gezamenlijk ter zake nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel229a
  - number: 229b
    text: |-
      Naast een in de belastingverordening voorziene vermindering, ontheffing of teruggaaf, kan de in artikel 227*a*,
      tweede lid, onderdeel *b*, bedoelde provincieambtenaar ook een in de belastingverordening voorziene vrijstelling
      ambtshalve verlenen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel229b
  - number: '230.1'
    text: 'Met betrekking tot de provinciale belastingen kunnen bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel230
  - number: 230.1.a
    text: |-
      regels worden gesteld waarbij de [artikelen 48][ref1], [52][ref2], [53, eerste en vierde lid][ref3], [54][ref4] of
      [55 van de Algemene wet][ref5], alsmede de [artikelen 59][ref6] of [62 van de Invorderingswet 1990][ref7] geheel of
      gedeeltelijk van toepassing worden verklaard, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel62
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '54'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '62'
  - number: 230.1.b
    text: regels worden gesteld die overeenkomen met die in de in onderdeel *a* genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel230
  - number: '230.2'
    text: |-
      De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting
      rust, alsmede van de belasting ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang
      de aard van de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de
      aard van de gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging
      beschikbaar stellen van gegevensdragers kan geschieden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel230
  - number: '232'
    text: |-
      Bij de invordering van provinciale belastingen blijven de artikelen 5, 20, 21, 59, 62 en 69 van de Invorderingswet
      1990 buiten toepassing. Bij de invordering van provinciale belastingen die op andere wijze worden geheven, blijven
      bovendien de artikelen 7, derde lid, en 8, eerste lid, van die wet buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232
  - number: 232a.1
    text: De belastingverordening kan van artikel 9 van de Invorderingswet 1990 afwijkende voorschriften inhouden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232a
  - number: 232a.2
    text: |-
      De belastingverordening kan bepalen dat het verschuldigde bedrag moet worden betaald gelijktijdig met en op
      dezelfde wijze als de voldoening van een andere vordering aan de schuldeiser van die andere vordering.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232a
  - number: 232b
    text: |-
      De verrekening van aan de belastingschuldige uit te betalen en van hem te innen bedragen ter zake van provinciale
      belastingen op de voet van artikel 24 van de Invorderingswet 1990 is ook mogelijk ingeval de in artikel 9 van de
      Invorderingswet 1990 gestelde termijn, dan wel de krachtens artikel 232*a*, eerste lid, gestelde termijn nog niet
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232b
  - number: 232c.1
    text: |-
      Indien ter zake van hetzelfde voorwerp van de belasting of hetzelfde belastbare feit twee of meer personen
      belastingplichtig zijn, kan de belastingaanslag ten name van een van hen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232c
  - number: 232c.2
    text: |-
      Indien de belastingplicht, bedoeld in het eerste lid, voortvloeit uit het genot van een onroerende zaak krachtens
      eigendom, bezit of beperkt recht en de aanslag ten name van één van de belastingplichtigen is gesteld, kan de met
      de invordering van provinciale belastingen belaste provincieambtenaar de belastingaanslag op de gehele onroerende
      zaak verhalen ten name van degene te wiens name de aanslag is gesteld, zonder rekening te houden met de rechten van
      de overige belastingplichtigen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232c
  - number: 232c.3
    text: |-
      De belastingschuldige die de belastingaanslag heeft voldaan kan hetgeen hij meer heeft voldaan dan overeenkomt met
      zijn belastingplicht verhalen op de overige belastingplichtigen naar evenredigheid van ieders belastingplicht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232c
  - number: 232c.4
    text: |-
      Een bezwaarschrift als bedoeld in artikel 23, eerste lid, van de Algemene wet kan mede worden ingediend door een
      belastingplichtige als bedoeld in het eerste lid wiens naam niet op het aanslagbiljet staat vermeld. [Artikel 23,
      tweede lid, van de Algemene wet](onbekend) is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232c
  - number: 232c.5
    text: Van het derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232c
  - number: 232d
    text: |-
      Voor de toepassing van [artikel 66 van de Invorderingswet 1990][ref1] met betrekking tot provinciale belastingen
      blijven de [artikelen 76][ref2], [80, tweede, derde en vierde lid][ref3], [82][ref4], [84][ref5], [86][ref6] en
      [87 van de Algemene wet][ref7] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232d
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '87'
  - number: 232e.1
    text: |-
      De in artikel 26 van de Invorderingswet 1990 bedoelde kwijtschelding wordt met betrekking tot provinciale
      belastingen verleend door de in artikel 227*a*, tweede lid, onderdeel *c*, bedoelde provincieambtenaar.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232e
  - number: 232e.2
    text: |-
      Met betrekking tot het verlenen van gehele of gedeeltelijke kwijtschelding zijn de krachtens artikel 26 van de
      Invorderingswet 1990 door Onze Minister van Financiën bij ministeriële regeling gestelde regels van toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232e
  - number: 232e.3
    text: |-
      Provinciale staten kunnen bepalen dat, in afwijking van de in het tweede lid bedoelde regels, in het geheel geen
      dan wel gedeeltelijk kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232e
  - number: 232e.4
    text: |-
      Met inachtneming van door Onze Minister, in overeenstemming met Onze Minister van Financiën, te stellen regels
      kunnen provinciale staten met betrekking tot de wijze waarop de kosten van bestaan in aanmerking worden genomen
      afwijkende regels stellen die er toe leiden dat in ruimere mate kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232e
  - number: 232e.5
    text: |-
      Gedeputeerde staten kunnen de belasting geheel of gedeeltelijk oninbaar verklaren. Het daartoe strekkende besluit
      ontheft de provincieambtenaar belast met de invordering van provinciale belastingen van de verplichting verdere
      pogingen tot invordering te doen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232e
  - number: 232f
    text: |-
      Indien ter zake van een provinciale belasting exploot moet worden gedaan, een akte van vervolging betekend of een
      dwangbevel ten uitvoer gelegd in een andere provincie dan die waaraan belasting verschuldigd is, is daartoe naast
      de belastingdeurwaarder van laatstbedoelde provincie mede de belastingdeurwaarder van eerstbedoelde provincie
      bevoegd en desgevraagd verplicht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232f
  - number: 232g.1
    text: |-
      Met betrekking tot de in artikel 222 bedoelde opcenten is de rijksbelastingdienst belast met de heffing en de
      invordering.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232g
  - number: 232g.2
    text: De opcenten worden als motorrijtuigenbelasting geheven en ingevorderd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232g
  - number: 232g.3
    text: De opbrengst wordt aan de provincies uitgekeerd volgens door Onze Minister van Financiën te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232g
  - number: 232g.4
    text: |-
      De aan de heffing en de invordering verbonden kosten komen ten laste van de provincies. Deze kosten worden berekend
      volgens door Onze Minister van Financiën te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232g
  - number: 232h
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake provinciale belastingen in het kader van deze
      paragraaf passende nadere regels worden gegeven ter aanvulling van de in deze paragraaf geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel232h
  - number: '253.1'
    text: |-
      Beslissingen van provinciale besturen kunnen slechts aan goedkeuring worden onderworpen in bij de wet bepaalde
      gevallen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel253
  - number: '253.2'
    text: |-
      Ten aanzien van de goedkeuring van andere beslissingen dan besluiten is
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '259.1'
    text: |-
      Een beslissing die aan goedkeuring bij koninklijk besluit is onderworpen, wordt toegezonden aan Onze Minister wie
      het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel259
  - number: '259.2'
    text: Een voordracht tot onthouding van goedkeuring wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel259
  - number: '259.3'
    text: Artikel 18*a* van de Wet op de Raad van State is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel259
  - number: '261.1'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het provinciaal bestuur kan
      bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel261
  - number: '261.2'
    text: |-
      Ten aanzien van de vernietiging van een niet-schriftelijke beslissing zijn de [afdelingen 10.2.2][ref1] en [10.2.3
      van de Algemene wet bestuursrecht](onbekend) van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
  - number: '266.1'
    text: |-
      Indien een besluit naar het oordeel van de commissaris van de Koning voor vernietiging in aanmerking komt, doet
      hij daarvan binnen twee dagen nadat het te zijner kennis is gekomen, mededeling aan Onze Minister wie het aangaat.
      Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en zo nodig aan het orgaan dat met de
      uitvoering van het besluit is belast.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel266
  - number: '266.2'
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister wie het aangaat de mededeling is ontvangen dat voor schorsing of vernietiging geen
      redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de commissaris
      is geschorst of vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel266
  - number: '267.1'
    text: Een voordracht tot schorsing wordt gedaan door Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel267
  - number: '267.2'
    text: |-
      Over de voordracht pleegt Onze Minister wie het aangaat overleg met Onze Minister, tenzij schorsing onverwijld
      plaats dient te vinden. In de voordracht wordt het achterwege blijven van overleg gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel267
  - number: '270'
    text: |-
      Indien een bekend gemaakt besluit niet is vernietigd binnen de tijd waarvoor het is geschorst, wordt hiervan door
      het provinciaal bestuur openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel270
  - number: '271.1'
    text: De voordracht tot vernietiging wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel271
  - number: '271.2'
    text: Artikel 15, derde lid, van de Wet op de Raad van State is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel271
  - number: '272'
    text: |-
      Het koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel272
  - number: '274'
    text: |-
      Het provinciaal bestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met
      het koninklijk besluit wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel274
  - number: 274a.1
    text: |-
      In afwijking van [artikel 8:4, onderdeel ][ref1] kan een belanghebbende tegen een koninklijk besluit als bedoeld in
      artikel 261, eerste lid, dan wel tegen een vernietigingsbesluit als bedoeld in de artikelen 81, tweede lid, en 82,
      tweede lid, beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel274a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 274a.2
    text: |-
      In afwijking van [artikel 6:2 van de Algemene wet bestuursrecht][ref1] kan geen beroep worden ingesteld tegen
      de weigering om de vernietiging van een besluit te bevorderen en tegen het niet tijdig nemen van een besluit tot
      vernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel274a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '280'
    text: De Provinciewet (*Stb.* 1962, 17) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel280
  - number: '281.1'
    text: |-
      De intrekking van de Provinciewet heeft geen gevolgen voor de geldigheid van de op de dag voor de inwerkingtreding
      van deze wet geldende besluiten.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel281
  - number: '281.2'
    text: |-
      Besluiten als bedoeld in het eerste lid die algemeen verbindende voorschriften bevatten waarvan de inhoud in strijd
      is met deze wet, worden binnen twee jaar na de datum van inwerkingtreding van deze wet daarmee in overeenstemming
      gebracht of ingetrokken. De besluiten of onderdelen daarvan die bij het verstrijken van de in de vorige volzin
      genoemde termijn niet met deze wet in overeenstemming zijn gebracht of zijn ingetrokken, zijn van rechtswege
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel281
  - number: '282'
    text: |-
      Ten aanzien van de bij de inwerkingtreding van deze wet zitting hebbende leden van provinciale staten en
      gedeputeerden zijn tot hun aftreden de artikelen 15, eerste lid, en 44 slechts van toepassing voor zover de
      Provinciewet ter zake eveneens een verbod inhield.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel282
  - number: '283'
    text: |-
      Ten aanzien van het aantal gedeputeerden blijft tot het eerste periodieke aftreden van de gedeputeerden na de
      inwerkingtreding van deze wet artikel 29 van de Provinciewet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel283
  - number: '284'
    text: |-
      Artikel 43, vijfde lid, en artikel 65, vijfde lid, treden in werking op de dag van het eerste periodieke aftreden
      van de leden van gedeputeerde staten na de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel284
  - number: '285'
    text: |-
      Het bepaalde in artikel 61, eerste lid, eerste volzin, is niet van toepassing op degenen die bij de
      inwerkingtreding van deze wet het ambt van commissaris van de Koning vervullen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel285
  - number: '286'
    text: |-
      Verzoeken om toestemming als bedoeld in artikel 56 van de Provinciewet die bij de Kroon zijn ingediend voor de
      inwerkingtreding van deze wet en waarop door de Kroon voor de dag van de inwerkingtreding nog niet is beschikt,
      worden overgedragen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel286
  - number: '287'
    text: |-
      Artikel 149 is niet van toepassing op beroepen en bezwaarschriften die zijn ingediend voor de inwerkingtreding van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel287
  - number: '288'
    text: |-
      De in artikel 147 bedoelde verordening wordt vastgesteld binnen een jaar na de dag van inwerkingtreding van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel288
  - number: '289'
    text: |-
      Artikel 95 van de Provinciewet blijft van kracht ten aanzien van wetten die tot stand zijn gekomen voor de dag van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel289
  - number: '290'
    text: |-
      De artikelen 98 en 100 van de Provinciewet blijven van toepassing tot het tijdstip waarop in het onderwerp van die
      artikelen wordt voorzien door het in werking treden van een wettelijke regeling met betrekking tot waterschappen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel290
  - number: '291.1'
    text: |-
      Ten aanzien van verplichtingen als bedoeld in artikel 108, tweede lid, die gelden op de dag voor die van de
      inwerkingtreding van deze wet, vangt de termijn, bedoeld in artikel 108, derde lid, aan op de dag na die van de
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel291
  - number: '291.2'
    text: |-
      Artikel 108, derde en vijfde lid, is niet van toepassing op verplichtingen als bedoeld in artikel 108, tweede lid,
      die zijn genoemd in de bijlage, behorende bij deze wet.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel291
  - number: '291.3'
    text: |-
      Ten aanzien van voorschriften als bedoeld in artikel 108, vierde lid, die gelden op de dag voor die van de
      inwerkingtreding van deze wet, vangt de termijn genoemd in dat lid, aan op de dag na die van de inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel291
  - number: '292'
    text: |-
      Voor bij koninklijk besluit aan te wijzen begrotingsjaren blijven de artikelen 127, 128, 130, 132 en 134, derde lid
      van de Provinciewet van toepassing. In het koninklijk besluit kunnen regels worden gesteld omtrent de toepassing
      van de in de eerste volzin genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel292
  - number: '293'
    text: |-
      De artikelen 256 tot en met 259 zijn niet van toepassing op aan voorafgaand toezicht onderworpen besluiten die
      zijn genomen voor de inwerkingtreding van deze wet. Ten aanzien van die besluiten blijven de op de dag voor de
      inwerkingtreding van deze wet geldende wettelijke bepalingen van kracht.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel293
  - number: '295'
    text: |-
      Indien het bij koninklijke boodschap van 10 maart 1990 ingediende voorstel van wet tot wijziging van de
      binnentredingsbepalingen (kamerstukken 22 539) niet in werking is getreden op het moment dat deze wet in werking
      treedt, blijven de artikelen 117 en 118 van de Provinciewet van kracht totdat dat voorstel in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel295
  - number: '296.1'
    text: Deze wet treedt in werking op een bij of krachtens de wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel296
  - number: '296.2'
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister de nummering van de artikelen, paragrafen, hoofdstukken en
      titels van deze wet opnieuw vast en brengt de in deze wet voorkomende aanhalingen van die artikelen, paragrafen,
      hoofdstukken en titels met de nieuwe nummering in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel296
  - number: '297'
    text: 'Deze wet kan worden aangehaald als: Provinciewet.'
    url: https://wetten.overheid.nl/BWBR0005645/2003-01-16#Artikel297
