---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: provinciewet
regulatory_layer: WET
publication_date: '2026-01-22'
valid_from: '2018-01-01'
bwb_id: BWBR0005645
url: https://wetten.overheid.nl/BWBR0005645/2018-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Provinciewet aan te passen aan de herziene Grondwet
    en aan de Gemeentewet en in verband daarmee nieuwe bepalingen vast te stellen met betrekking tot de inrichting van
    provincies, alsmede de samenstelling en bevoegdheid van hun besturen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder het aantal inwoners van een provincie: het aantal inwoners volgens de door het
      Centraal Bureau voor de Statistiek openbaar gemaakte bevolkingscijfers per 1 januari.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de vaststelling van het inwonertal bedoeld in artikel 8, geldt als peildatum 1 januari van het jaar
      voorafgaande aan het jaar van de verkiezing van provinciale staten. Het Centraal Bureau voor de Statistiek kan
      op schriftelijk verzoek van provinciale staten het inwonertal per de eerste dag van de vierde maand voorafgaande
      aan de maand van kandidaatstelling vaststellen indien aannemelijk is dat een in dat artikel genoemd inwonertal op
      genoemde datum is overschreden. In dat geval geldt dit tijdstip als peildatum.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel1
  - number: '2'
    text: 'In deze wet wordt verstaan onder ingezetenen: zij die hun werkelijke woonplaats in de provincie hebben.'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel2
  - number: '3'
    text: |-
      Zij die als ingezetene met een adres in een gemeente zijn ingeschreven in de basisregistratie personen, worden
      voor de toepassing van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke woonplaats te hebben in de
      provincie waarin die gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel3
  - number: '4'
    text: |-
      In deze wet wordt onder ambtenaar mede verstaan: degene die op arbeidsovereenkomst naar burgerlijk recht werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel4
  - number: '5'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel5
  - number: 5.a
    text: 'provinciebestuur: ieder bevoegd orgaan van de provincie;'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel5
  - number: 5.b
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel5
  - number: '6'
    text: In elke provincie zijn er provinciale staten, gedeputeerde staten en een commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel6
  - number: '7'
    text: Provinciale staten vertegenwoordigen de gehele bevolking van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel7
  - number: '8.1'
    text: |-
      Provinciale staten bestaan uit: 39 leden in een provincie beneden de 400 001 inwoners; 41 leden in een provincie
      van 400 001 – 500 000 inwoners; 43 leden in een provincie van 500 001 – 750 000 inwoners; 45 leden in een provincie
      van 750 001 – 1 000 000 inwoners; 47 leden in een provincie van 1 000 001 – 1 250 000 inwoners; 49 leden in een
      provincie van 1 250 001 – 1 500 000 inwoners; 51 leden in een provincie van 1 500 001 – 1 750 000 inwoners; 53
      leden in een provincie van 1 750 001 – 2 000 000 inwoners; 55 leden in een provincie boven de 2 000 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel8
  - number: '8.2'
    text: |-
      Vermeerdering of vermindering van het aantal leden van provinciale staten, voortvloeiende uit wijziging van het
      aantal inwoners van de provincie, treedt eerst in bij de eerstvolgende periodieke verkiezing van de leden van
      provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel8
  - number: '9'
    text: De commissaris van de Koning is voorzitter van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel9
  - number: '10'
    text: |-
      Voor het lidmaatschap van provinciale staten is vereist dat men Nederlander en ingezetene van de provincie is, de
      leeftijd van achttien jaar heeft bereikt en niet is uitgesloten van het kiesrecht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel10
  - number: '11.1'
    text: |-
      De leden van provinciale staten maken openbaar welke andere functies dan het lidmaatschap van provinciale staten
      zij vervullen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel11
  - number: '11.2'
    text: |-
      Openbaarmaking geschiedt door terinzagelegging van een opgave van de in het eerste lid bedoelde functies op het
      provinciehuis.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel11
  - number: '12'
    text: |-
      Ter vervulling van een tussentijds opengevallen plaats is niet benoembaar tot lid van provinciale staten hij die na
      de laatstgehouden periodieke verkiezing van de leden van provinciale staten wegens handelen in strijd met artikel
      15 van het lidmaatschap van provinciale staten is vervallen verklaard.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel12
  - number: '13.1'
    text: 'Een lid van provinciale staten is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 13.1.g
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.h
    text: gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.i
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.1.j
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 79q, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79q
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79q
        hoofdstuk: IVC
        paragraaf: '1'
  - number: 13.1.k
    text: ambtenaar, door of vanwege het provinciebestuur aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onder h, kan een lid van provinciale staten tevens gedeputeerde zijn
      gedurende het tijdvak dat:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: 13.2.a
    text: |-
      aanvangt op de dag van de stemming voor de verkiezing van de leden van provinciale staten en eindigt op het
      tijdstip waarop de gedeputeerden ingevolge [artikel 41, eerste lid][ref1], aftreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel41
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '41'
        hoofdstuk: III
  - number: 13.2.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot gedeputeerde en eindigt op het tijdstip waarop de goedkeuring
      van de geloofsbrief van zijn opvolger als lid van provinciale staten onherroepelijk is geworden of waarop het
      centraal stembureau heeft beslist dat geen opvolger kan worden benoemd. Hij wordt geacht ontslag te nemen als
      lid van provinciale staten met ingang van het tijdstip waarop hij zijn benoeming tot gedeputeerde aanvaardt.
      [Artikel X 6 van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: '13.3'
    text: |-
      In afwijking van het eerste lid, aanhef en onder k, kan een lid van provinciale staten tevens zijn vrijwilliger of
      ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten verricht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel13
  - number: '14.1'
    text: |-
      Alvorens hun functie te kunnen uitoefenen, leggen de leden van provinciale staten in de vergadering, in handen van
      de voorzitter, de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, om tot lid van provinciale
      staten benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift
      of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten,
      rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof)
      dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als lid van
      provinciale staten naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!" (Dat verklaar en beloof
      ik!")


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '14.2'
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta lid fan provinsjale steaten
      beneamd te wurden, streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn
      of ûnthjitten haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht
      noch midlik hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou
      wêze sil oan 'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as lid fan provinsjale
      steaten yn alle oprjochtens ferfolje sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '15.1'
    text: 'Een lid van provinciale staten mag niet:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.a
    text: |-
      als advocaat of adviseur in geschillen werkzaam zijn ten behoeve van de provincie of het provinciebestuur dan wel
      ten behoeve van de wederpartij van de provincie of het provinciebestuur;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.b
    text: |-
      als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van de provincie of het
      provinciebestuur;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.c
    text: 'als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met de provincie aangaan van:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.c.1e
    text: overeenkomsten als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.c.2e
    text: overeenkomsten tot het leveren van onroerende zaken aan de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d
    text: 'rechtstreeks of middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.1e
    text: het aannemen van werk ten behoeve van de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.2e
    text: het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.3e
    text: het leveren van roerende zaken anders dan om niet aan de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.4e
    text: het verhuren van roerende zaken aan de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.5e
    text: het verwerven van betwiste vorderingen ten laste van de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.6e
    text: het van de provincie onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: 15.1.d.7e
    text: het onderhands huren of pachten van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: '15.2'
    text: Van het eerste lid, aanhef en onder *d*, kan Onze Minister ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: '15.3'
    text: Provinciale staten stellen voor hun leden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel15
  - number: '16'
    text: Provinciale staten stellen een reglement van orde voor hun vergaderingen en andere werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel16
  - number: '17.1'
    text: Provinciale staten vergaderen zo vaak als zij daartoe hebben besloten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel17
  - number: '17.2'
    text: |-
      Voorts vergaderen zij indien de commissaris van de Koning het nodig oordeelt of indien ten minste een vijfde van
      het aantal leden waaruit provinciale staten bestaan schriftelijk, met opgave van redenen, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel17
  - number: '18'
    text: |-
      Provinciale staten vergaderen na de periodieke verkiezing van hun leden voor de eerste maal in nieuwe samenstelling
      op de dag met ingang waarvan de leden van provinciale staten in oude samenstelling aftreden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel18
  - number: '19.1'
    text: De commissaris roept de leden schriftelijk tot de vergadering op.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel19
  - number: '19.2'
    text: |-
      Tegelijkertijd met de oproeping brengt de commissaris dag, tijdstip en plaats van de vergadering ter openbare
      kennis. De agenda en de daarbij behorende voorstellen met uitzondering van de in artikel 25, tweede lid, bedoelde
      stukken worden tegelijkertijd met de oproeping en op een bij de openbare kennisgeving aan te geven wijze ter inzage
      gelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel19
  - number: '20.1'
    text: |-
      De vergadering van provinciale staten wordt niet geopend voordat blijkens de presentielijst meer dan de helft van
      het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien ingevolge het eerste lid de vergadering niet kan worden geopend, belegt de commissaris van de Koning, onder
      verwijzing naar dit artikel, opnieuw een vergadering tegen een tijdstip dat ten minste vierentwintig uur na het
      bezorgen van de oproeping is gelegen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel20
  - number: '20.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Provinciale staten kunnen
      echter over andere aangelegenheden dan die waarvoor de ingevolge het eerste lid niet geopende vergadering was
      belegd alleen beraadslagen of besluiten, indien blijkens de presentielijst meer dan de helft van het aantal zitting
      hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel20
  - number: '21.1'
    text: De commissaris van de Koning heeft het recht in de vergadering aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel21
  - number: '21.2'
    text: Een gedeputeerde heeft toegang tot de vergaderingen en kan aan de beraadslaging deelnemen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel21
  - number: '21.3'
    text: Een gedeputeerde kan door provinciale staten worden uitgenodigd om ter vergadering aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel21
  - number: '22'
    text: |-
      De leden van het provinciebestuur en andere personen die deelnemen aan de beraadslaging kunnen niet in
      rechte worden vervolgd of aangesproken voor dan wel worden verplicht getuigenis af te leggen als bedoeld in
      [artikel 165, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] over hetgeen zij in de vergadering
      van provinciale staten hebben gezegd of aan provinciale staten schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '23.1'
    text: De vergadering van provinciale staten wordt in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel23
  - number: '23.2'
    text: |-
      De deuren worden gesloten, wanneer ten minste een tiende van het aantal leden dat de presentielijst heeft getekend
      daarom verzoekt of de voorzitter het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel23
  - number: '23.3'
    text: Provinciale staten beslissen vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel23
  - number: '23.4'
    text: |-
      Van een vergadering met gesloten deuren wordt een afzonderlijk verslag opgemaakt, dat niet openbaar wordt gemaakt
      tenzij provinciale staten anders beslissen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel23
  - number: '23.5'
    text: |-
      Provinciale staten maken de besluitenlijst van hun vergaderingen op de in de provincie gebruikelijke wijze
      openbaar. Provinciale staten laten openbaarmaking achterwege voor zover het aangelegenheden betreft ten aanzien
      waarvan op grond van [artikel 25][ref1] geheimhouding is opgelegd of ten aanzien waarvan openbaarmaking in strijd
      is met het openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel25
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '25'
        hoofdstuk: II
  - number: '24'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel24
  - number: 24.a
    text: de toelating van nieuw benoemde leden;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel24
  - number: 24.b
    text: de vaststelling en wijziging van de begroting en de vaststelling van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel24
  - number: 24.c
    text: de invoering, wijziging en afschaffing van provinciale belastingen; en
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel24
  - number: 24.d
    text: de benoeming en het ontslag van gedeputeerden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel24
  - number: '25.1'
    text: |-
      Provinciale staten kunnen op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur,
      omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan provinciale staten
      worden overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt
      tijdens die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen
      die van het behandelde of de stukken kennis dragen, in acht genomen totdat provinciale staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel25
  - number: '25.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1], kan de geheimhouding
      eveneens worden opgelegd door gedeputeerde staten, de commissaris van de Koning en een commissie, ieder ten aanzien
      van stukken die zij aan provinciale staten of aan leden van provinciale staten overleggen. Daarvan wordt op de
      stukken melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '25.3'
    text: |-
      De krachtens het tweede lid opgelegde verplichting tot geheimhouding met betrekking tot aan provinciale staten
      overgelegde stukken vervalt, indien de oplegging niet door provinciale staten in hun eerstvolgende vergadering
      die blijkens de presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, wordt
      bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel25
  - number: '25.4'
    text: |-
      De krachtens het tweede lid opgelegde verplichting tot geheimhouding met betrekking tot aan leden van provinciale
      staten overgelegde stukken wordt in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel,
      indien het stuk waaromtrent geheimhouding is opgelegd aan provinciale staten is voorgelegd, totdat provinciale
      staten haar opheffen. Provinciale staten kunnen deze beslissing alleen nemen in een vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel25
  - number: '26.1'
    text: |-
      De voorzitter zorgt voor de handhaving van de orde in de vergadering en is bevoegd, wanneer die orde op enigerlei
      wijze door toehoorders wordt verstoord, deze en zo nodig andere toehoorders te doen vertrekken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel26
  - number: '26.2'
    text: |-
      Hij is bevoegd toehoorders die bij herhaling de orde in de vergadering verstoren voor ten hoogste drie maanden de
      toegang tot de vergadering te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel26
  - number: '26.3'
    text: |-
      Hij kan provinciale staten voorstellen aan een lid dat door zijn gedragingen de geregelde gang van zaken belemmert,
      het verdere verblijf in de vergadering te ontzeggen. Over het voorstel wordt niet beraadslaagd. Na aanneming
      daarvan verlaat het lid de vergadering onmiddellijk. Zo nodig doet de voorzitter hem verwijderen. Bij herhaling van
      zijn gedrag kan het lid bovendien voor ten hoogste drie maanden de toegang tot de vergadering worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel26
  - number: '27'
    text: De leden van provinciale staten stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel27
  - number: '28.1'
    text: 'Een lid van provinciale staten neemt niet deel aan de stemming over:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel28
  - number: 28.1.a
    text: |-
      een aangelegenheid die hem rechtstreeks of middellijk persoonlijk aangaat of waarbij hij als vertegenwoordiger
      is betrokken;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel28
  - number: 28.1.b
    text: |-
      de vaststelling of goedkeuring der rekening van een lichaam waaraan hij rekenplichtig is of tot welks bestuur hij
      behoort.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het deelnemen aan de stemming verstaan het inleveren van een
      stembriefje.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel28
  - number: '28.3'
    text: |-
      Een benoeming gaat iemand persoonlijk aan, wanneer hij behoort tot de personen tot wie de keuze door een voordracht
      of bij een herstemming is beperkt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel28
  - number: '28.4'
    text: |-
      Het eerste lid is niet van toepassing bij het besluit betreffende de toelating van de na periodieke verkiezing
      benoemde leden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft en zich niet van
      deelneming aan de stemming moet onthouden, daaraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel29
  - number: '29.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel29
  - number: 29.2.a
    text: |-
      ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, voordracht of aanbeveling van een of meer
      personen ten aanzien van wie in een vorige vergadering een stemming op grond van dat lid niet geldig was;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel29
  - number: 29.2.b
    text: |-
      in een vergadering als bedoeld in artikel 20, tweede lid, voor zover het betreft onderwerpen die in de daaraan
      voorafgaande, ingevolge artikel 20, eerste lid, niet geopende vergadering aan de orde waren gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel29
  - number: '30.1'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel30
  - number: '30.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het uitbrengen van een stem verstaan het inleveren van een behoorlijk
      ingevuld stembriefje.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel30
  - number: '31.1'
    text: |-
      De stemming over personen voor het doen van benoemingen, voordrachten of aanbevelingen geschiedt bij gesloten en
      ongetekende stembriefjes.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel31
  - number: '31.2'
    text: |-
      Indien de stemmen staken over personen tot wie de keuze door een voordracht of bij een herstemming is beperkt,
      wordt in dezelfde vergadering een herstemming gehouden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel31
  - number: '31.3'
    text: Staken bij deze stemming de stemmen opnieuw, dan beslist terstond het lot.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel31
  - number: '32.1'
    text: |-
      De overige stemmingen geschieden bij hoofdelijke oproeping, indien de voorzitter of een van de leden dat verlangt.
      In dat geval geschieden zij mondeling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32
  - number: '32.2'
    text: |-
      Bij hoofdelijke oproeping is ieder ter vergadering aanwezig lid dat zich niet van deelneming aan de stemming moet
      onthouden verplicht zijn stem voor of tegen uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32
  - number: '32.3'
    text: Indien over een voorstel geen stemming wordt gevraagd, is het aangenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32
  - number: '32.4'
    text: |-
      Tenzij de vergadering voltallig is, wordt bij staking van stemmen het nemen van een beslissing uitgesteld tot een
      volgende vergadering, waarin de beraadslagingen kunnen worden heropend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32
  - number: '32.5'
    text: |-
      Indien de stemmen staken in een voltallige vergadering of in een ingevolge het vierde lid opnieuw belegde
      vergadering, is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32
  - number: '32.6'
    text: |-
      Onder een voltallige vergadering wordt verstaan een vergadering waarin alle leden waaruit provinciale staten
      bestaan, voor zover zij zich niet van deelneming aan de stemming moesten onthouden, een stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32
  - number: 32a.1
    text: |-
      De stukken die van provinciale staten uitgaan, worden door de commissaris ondertekend en door de griffier
      medeondertekend. Bij verhindering of ontstentenis van de commissaris worden de stukken die van provinciale staten
      uitgaan, ondertekend door degene die krachtens [artikel 75][ref1] de commissaris als voorzitter van provinciale
      staten vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel75
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '75'
        hoofdstuk: IV
  - number: 32a.2
    text: |-
      Provinciale staten kunnen de commissaris toestaan de ondertekening op te dragen aan de griffier of aan een of meer
      andere bij de griffie werkzame ambtenaren. In dat geval blijft medeondertekening achterwege.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel32a
  - number: '33.1'
    text: Provinciale staten en elk van hun leden hebben recht op ambtelijke bijstand.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel33
  - number: '33.2'
    text: De in provinciale staten vertegenwoordigde groeperingen hebben recht op ondersteuning.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel33
  - number: '33.3'
    text: |-
      Provinciale staten stellen met betrekking tot de ambtelijke bijstand en de ondersteuning van de in provinciale
      staten vertegenwoordigde groeperingen een verordening vast. De verordening bevat ten aanzien van de ondersteuning
      regels over de besteding en de verantwoording.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel33
  - number: '34.1'
    text: De commissaris van de Koning en de gedeputeerden vormen te zamen gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel34
  - number: '34.2'
    text: De commissaris is voorzitter van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel34
  - number: '35.1'
    text: |-
      Provinciale staten benoemen de gedeputeerden. [Artikel 31][ref1] is van toepassing op de stemming inzake de
      benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel31
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '31'
        hoofdstuk: II
  - number: '35.2'
    text: |-
      De commissaris van de Koning wordt geïnformeerd over de uitkomsten van de college-onderhandelingen. Hij wordt
      alsdan in de gelegenheid gesteld zijn opvattingen over voorstellen ten behoeve van het collegeprogramma kenbaar
      te maken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35
  - number: 35a.1
    text: Het aantal gedeputeerden bedraagt ten minste drie en ten hoogste zeven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35a
  - number: 35a.2
    text: Een gedeputeerde vervult een volledige functie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35a
  - number: 35a.3
    text: |-
      Provinciale staten kunnen besluiten dat een of meer van de gedeputeerden zijn functie in deeltijd vervult. In dat
      geval bedraagt het aantal gedeputeerden ten hoogste negen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35a
  - number: 35a.4
    text: |-
      Indien het derde lid toepassing vindt, stellen provinciale staten bij de benoeming van de gedeputeerden de
      tijdbestedingsnorm van elke gedeputeerde vast, met dien verstande dat de tijdbestedingsnorm van de gedeputeerden
      gezamenlijk in dat geval ten hoogste tien procent meer bedraagt dan de tijdbestedingsnorm van de gedeputeerden
      gezamenlijk zou hebben bedragen indien alle gedeputeerden een volledige functie zouden vervullen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35a
  - number: 35b.1
    text: |-
      Voor het ambt van gedeputeerde gelden de vereisten voor het lidmaatschap van provinciale staten, bedoeld in
      [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '10'
        hoofdstuk: II
  - number: 35b.2
    text: |-
      Provinciale staten kunnen voor de duur van een jaar ontheffing verlenen van het vereiste van ingezetenschap. De
      ontheffing kan in bijzondere gevallen, telkens met een periode van maximaal een jaar, worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35b
  - number: 35b.3
    text: Dezelfde persoon kan niet in meer dan één provincie gedeputeerde zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35b
  - number: 35c.1
    text: 'Een gedeputeerde is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 35c.1.g
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.h
    text: lid van provinciale staten;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.i
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.j
    text: lid van de raad van een gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.k
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.l
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.m
    text: lid van de rekenkamer van een in de betrokken provincie gelegen gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.n
    text: ambtenaar, door of vanwege het provinciebestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.o
    text: |-
      ambtenaar, door of vanwege het gemeentebestuur van een in de provincie gelegen gemeente aangesteld of daaraan
      ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.p
    text: voorzitter van of lid van het bestuur van of ambtenaar in dienst van een in de provincie gelegen waterschap;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.q
    text: |-
      ambtenaar in dienst van een bij gemeenschappelijke regeling ingesteld lichaam waarvan een orgaan aan toezicht van
      gedeputeerde staten is onderworpen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.r
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.1.s
    text: |-
      functionaris, krachtens wet of algemene maatregel van bestuur geroepen om het provinciebestuur van advies te
      dienen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder h, kan een gedeputeerde tevens lid van provinciale staten zijn van
      de provincie waar hij gedeputeerde is gedurende het tijdvak dat:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: 35c.2.a
    text: |-
      aanvangt op de dag van de stemming van de verkiezing van de leden van provinciale staten en eindigt op het tijdstip
      waarop de gedeputeerden ingevolge [artikel 41, eerste lid][ref1], aftreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel41
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '41'
        hoofdstuk: III
  - number: 35c.2.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot gedeputeerde en eindigt op het tijdstip waarop de goedkeuring
      van de geloofsbrief van zijn opvolger als lid van provinciale staten onherroepelijk is geworden of waarop het
      centraal stembureau heeft beslist dat geen opvolger kan worden benoemd. Hij wordt geacht ontslag te nemen als
      lid van provinciale staten met ingang van het tijdstip waarop hij zijn benoeming tot gedeputeerde aanvaardt.
      [Artikel X 6 van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: 35c.3
    text: |-
      In afwijking van het eerste lid, aanhef en onder n, kan een gedeputeerde tevens zijn vrijwilliger of ander persoon
      die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten verricht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel35c
  - number: '36'
    text: |-
      De benoeming van gedeputeerden na de verkiezing van de leden van provinciale staten vindt plaats in een vergadering
      van provinciale staten in nieuwe samenstelling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel36
  - number: '37'
    text: |-
      In het geval van [artikel 36][ref1] gaat de benoeming van degene die zijn benoeming tot gedeputeerde heeft
      aangenomen, in op het tijdstip waarop ten minste de helft van het met inachtneming van [artikel 35a][ref2] bepaalde
      aantal gedeputeerden zijn benoeming heeft aangenomen of, indien de aanneming van de benoeming op een later tijdstip
      plaatsvindt, op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel35a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '36'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 35a
        hoofdstuk: III
  - number: '38'
    text: |-
      De benoeming ter vervulling van een plaats die tussentijds openvalt geschiedt zo spoedig mogelijk, tenzij
      provinciale staten besluiten het aantal gedeputeerden te verminderen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel38
  - number: '39'
    text: |-
      De benoemde gedeputeerde deelt provinciale staten uiterlijk op de tiende dag na de kennisgeving van zijn benoeming
      mee of hij de benoeming aanneemt. Indien deze termijn verstrijkt zonder mededeling, wordt de benoemde gedeputeerde
      geacht de benoeming niet aan te nemen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel39
  - number: '40'
    text: Wanneer de benoeming niet is aangenomen, geschiedt zo spoedig mogelijk een nieuwe benoeming.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40
  - number: 40a.1
    text: |-
      Alvorens hun functie te kunnen uitoefenen leggen de gedeputeerden, in de vergadering van provinciale staten,
      in handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot
      gedeputeerde benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift
      of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten,
      rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat
      ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als gedeputeerde
      naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 40a.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta deputearre beneamd te wurden,
      streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.
      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze sil oan 'e
      [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as deputearre yn alle oprjochtens ferfolje
      sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 40b.1
    text: |-
      Een gedeputeerde vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op een goede vervulling
      van zijn ambt als gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40b
  - number: 40b.2
    text: Een gedeputeerde meldt zijn voornemen tot aanvaarding van een nevenfunctie aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40b
  - number: 40b.3
    text: |-
      Een gedeputeerde maakt zijn nevenfuncties openbaar. Openbaarmaking geschiedt door terinzagelegging op het
      provinciehuis.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40b
  - number: 40b.4
    text: |-
      Een gedeputeerde die zijn ambt niet in deeltijd vervult, maakt tevens de inkomsten uit nevenfuncties openbaar.
      Openbaarmaking geschiedt door terinzagelegging op het provinciehuis uiterlijk op 1 april na het kalenderjaar waarin
      de inkomsten zijn genoten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40b
  - number: 40b.5
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 40c.1
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op gedeputeerden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel15
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '15'
        hoofdstuk: II
  - number: 40c.2
    text: Provinciale staten stellen voor de gedeputeerden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel40c
  - number: '41.1'
    text: |-
      Na de verkiezing van de leden van provinciale staten treden de gedeputeerden af op het moment dat provinciale
      staten ten minste de helft van het met inachtneming van [artikel 35a][ref1] bepaalde aantal gedeputeerden heeft
      benoemd en deze benoemingen zijn aanvaard


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel35a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 35a
        hoofdstuk: III
  - number: '41.2'
    text: |-
      Indien zoveel gedeputeerden hun ontslag indienen of worden ontslagen dat niet ten minste de helft van het met
      inachtneming van [artikel 35a][ref1] bepaalde aantal gedeputeerden in functie is, treedt de commissaris van de
      Koning in de plaats van gedeputeerde staten totdat dit wel het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel35a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 35a
        hoofdstuk: III
  - number: '42.1'
    text: Een gedeputeerde kan te allen tijde ontslag nemen. Hij doet daarvan schriftelijk mededeling aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel42
  - number: '42.2'
    text: |-
      Behoudens het geval dat de gedeputeerde onmiddellijk ontslag neemt, gaat het ontslag in met ingang van de dag,
      gelegen een maand na de dag waarop hij zijn ontslag heeft genomen of zoveel eerder als zijn opvolger de benoeming
      heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel42
  - number: '43.1'
    text: |-
      De gedeputeerden genieten ten laste van de provincie een bezoldiging, die bij of krachtens algemene maatregel van
      bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '43.2'
    text: |-
      Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van bijzondere kosten en
      betreffende andere voorzieningen die verband houden met de vervulling van het ambt van gedeputeerde.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '43.3'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend genieten de gedeputeerden als zodanig geen inkomsten, in
      welke vorm ook, ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '43.4'
    text: |-
      De gedeputeerden genieten geen vergoedingen, in welke vorm ook, voor werkzaamheden verricht in nevenfuncties die
      zij vervullen uit hoofde van het ambt van gedeputeerde, ongeacht of die vergoedingen ten laste van de provincie
      komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de provinciale kas.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '43.5'
    text: |-
      Tot vergoedingen als bedoeld in het vijfde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de gedeputeerde neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '43.6'
    text: |-
      Andere inkomsten dan die bedoeld in het vijfde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1]. De rijksbelastingdienst verstrekt Onze Minister
      ten behoeve van de verrekening de benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: '43.7'
    text: |-
      Ten aanzien van de gedeputeerden die hun ambt in deeltijd vervullen, vindt onverminderd het vijfde lid geen
      verrekening plaats van de inkomsten, bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '43.8'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de gedeputeerde gegevens over de
      inkomsten, bedoeld in het zevende lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel43
  - number: '44.1'
    text: |-
      Gedeputeerde staten verlenen aan een gedeputeerde op diens verzoek verlof wegens zwangerschap en bevalling. Het
      verlof gaat in op de in het verzoek vermelde dag die ligt tussen ten hoogste zes en ten minste vier weken voor
      de vermoedelijke datum van de bevalling die blijkt uit een bij het verzoek gevoegde verklaring van een arts of
      verloskundige.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44
  - number: '44.2'
    text: |-
      Gedeputeerde staten verlenen aan een gedeputeerde op diens verzoek verlof wegens ziekte, indien uit een bij het
      verzoek gevoegde verklaring van een arts blijkt dat niet aannemelijk is dat hij de uitoefening van zijn functie
      binnen acht weken zal kunnen hervatten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44
  - number: '44.3'
    text: |-
      In het geval een gedeputeerde vanwege zijn ziekte niet in staat is zelf het verzoek te doen, kan de commissaris van
      de Koning namens hem het verzoek doen indien de continuïteit van het provinciaal bestuur dringend vereist dat in
      vervanging van de gedeputeerde wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44
  - number: '44.4'
    text: Het verlof eindigt op de dag waarop zestien weken zijn verstreken sinds de dag waarop het verlof is ingegaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44
  - number: '44.5'
    text: |-
      Aan een gedeputeerde wordt gedurende de zittingsperiode van provinciale staten ten hoogste drie maal verlof
      verleend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44
  - number: 44a.1
    text: |-
      Gedeputeerde staten beslissen zo spoedig mogelijk op een verzoek tot verlof, doch uiterlijk op de veertiende dag na
      indiening van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44a
  - number: 44a.2
    text: |-
      De beslissing geschiedt in overeenstemming met de verklaring van de arts of verloskundige en bevat de dag waarop
      het verlof ingaat.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44a
  - number: 44b.1
    text: |-
      Provinciale staten kunnen een vervanger benoemen voor de gedeputeerde die met verlof is gegaan.
      [Artikel 35a, eerste en derde lid, tweede volzin][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel35a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 35a
        hoofdstuk: III
  - number: 44b.2
    text: |-
      De vervanger is van rechtswege ontslagen met ingang van de dag waarop zestien weken zijn verstreken sinds de dag
      waarop het verlof is ingegaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44b
  - number: 44b.3
    text: |-
      Indien de vervanger voor het einde van het verlof ontslag neemt of door provinciale staten wordt ontslagen, kunnen
      provinciale staten voor de resterende duur van het verlof een nieuwe tijdelijke vervanger benoemen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel44b
  - number: '45.1'
    text: |-
      Indien degene wiens benoeming tot gedeputeerde is ingegaan, een functie bekleedt als bedoeld in
      [artikel 35c][ref1], eerste lid, en het tweede of derde lid van dat artikel niet van toepassing zijn, draagt hij er
      onverwijld zorg voor dat hij uit die functie wordt ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel35c
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 35c
        hoofdstuk: III
  - number: '45.2'
    text: Provinciale staten verlenen hem ontslag indien hij dit nalaat.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel45
  - number: '45.3'
    text: Het ontslag gaat in terstond na de bekendmaking van het ontslagbesluit.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel45
  - number: '45.4'
    text: |-
      In het geval, bedoeld in het tweede lid, is [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '46.1'
    text: |-
      Indien een gedeputeerde niet langer voldoet aan de vereisten voor het ambt van gedeputeerde, bedoeld in
      [artikel 35b][ref1], eerste en tweede lid, of een functie gaat bekleden als bedoeld in [artikel 35c][ref2], eerste
      lid, en het tweede of het derde lid van dat artikel niet van toepassing zijn, neemt hij onmiddellijk ontslag. Hij
      doet hiervan schriftelijk mededeling aan provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel35c
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 35b
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 35c
        hoofdstuk: III
  - number: '46.2'
    text: Artikel 45, tweede, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel46
  - number: '47'
    text: |-
      In zaken die aan de uitspraak van gedeputeerde staten zijn onderworpen mag een gedeputeerde niet als gemachtigde of
      adviseur werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel47
  - number: '49'
    text: |-
      Indien een uitspraak van provinciale staten inhoudende de opzegging van hun vertrouwen in een gedeputeerde er
      niet toe leidt dat de betrokken gedeputeerde onmiddellijk ontslag neemt, kunnen provinciale staten besluiten
      tot ontslag. [Artikel 31][ref1] is van toepassing op de stemming inzake het ontslag. Op het ontslagbesluit is
      [artikel 4:8 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '31'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '50'
    text: |-
      De rechter treedt niet in de beoordeling van de gronden waarop provinciale staten tot ontslag van een gedeputeerde
      hebben besloten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel50
  - number: '52'
    text: |-
      Gedeputeerde staten stellen een reglement van orde voor hun vergaderingen en andere werkzaamheden vast, dat aan
      provinciale staten wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel52
  - number: '53.1'
    text: |-
      De commissaris van de Koning stelt, met inachtneming van hetgeen gedeputeerde staten hebben bepaald, dag en plaats
      van de vergadering van gedeputeerde staten en het tijdstip van de opening vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel53
  - number: '53.2'
    text: De commissaris maakt dag en plaats van te houden openbare vergaderingen en het tijdstip van de opening bekend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel53
  - number: 53a.1
    text: De commissaris van de Koning bevordert de eenheid van het beleid van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel53a
  - number: 53a.2
    text: De commissaris kan onderwerpen aan de agenda voor een vergadering van gedeputeerde staten toevoegen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel53a
  - number: 53a.3
    text: De commissaris kan ten aanzien van geagendeerde onderwerpen een eigen voorstel aan gedeputeerde staten voorleggen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel53a
  - number: '54.1'
    text: |-
      De vergaderingen van gedeputeerde staten worden met gesloten deuren gehouden, voor zover gedeputeerde staten niet
      anders hebben bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel54
  - number: '54.2'
    text: |-
      Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel54
  - number: '55.1'
    text: |-
      Gedeputeerde staten kunnen op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur,
      omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan hen worden
      overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens
      die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen die van
      het behandelde of de stukken kennis dragen, in acht genomen totdat gedeputeerde staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel55
  - number: '55.2'
    text: |-
      Op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur, kan de geheimhouding eveneens
      worden opgelegd door de commissaris van de Koning of een commissie, ten aanzien van de stukken die zij aan
      gedeputeerde staten overleggen. Daarvan wordt op de stukken melding gemaakt. De geheimhouding wordt in acht genomen
      totdat het orgaan dat de verplichting heeft opgelegd, dan wel provinciale staten, haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel55
  - number: '55.3'
    text: |-
      Indien gedeputeerde staten zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot
      provinciale staten hebben gericht, wordt de geheimhouding in acht genomen totdat provinciale staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel55
  - number: '56.1'
    text: |-
      In de vergadering van gedeputeerde staten kan slechts worden beraadslaagd of besloten, indien ten minste de helft
      van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel56
  - number: '56.2'
    text: |-
      Indien het vereiste aantal leden niet tegenwoordig is, belegt de commissaris van de Koning, onder verwijzing naar
      dit artikel, opnieuw een vergadering.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel56
  - number: '56.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Gedeputeerde staten kunnen
      echter over andere aangelegenheden dan die waarvoor de eerdere vergadering was belegd alleen beraadslagen of
      besluiten, indien ten minste de helft van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel56
  - number: '57'
    text: |-
      De leden van gedeputeerde staten en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte
      worden vervolgd of aangesproken voor hetgeen zij in de vergadering van gedeputeerde staten hebben gezegd of aan
      gedeputeerde staten schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel57
  - number: '58'
    text: |-
      De artikelen 28, eerste tot en met derde lid, 29 en 30 zijn ten aanzien van de vergaderingen van gedeputeerde
      staten van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel58
  - number: '59.1'
    text: |-
      Indien bij een stemming, anders dan over personen voor het doen van benoemingen, voordrachten of aanbevelingen, de
      stemmen staken, wordt opnieuw gestemd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel59
  - number: '59.2'
    text: Staken de stemmen andermaal over hetzelfde voorstel, dan beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel59
  - number: 59a.1
    text: |-
      De stukken die van gedeputeerde staten uitgaan, worden door de commissaris ondertekend en door de secretaris
      medeondertekend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel59a
  - number: 59a.2
    text: |-
      Gedeputeerde staten kunnen de commissaris toestaan de ondertekening op te dragen aan een ander lid van gedeputeerde
      staten, aan de secretaris of aan een of meer andere provinciale ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel59a
  - number: 59a.3
    text: |-
      De medeondertekening door de secretaris is niet van toepassing indien de ondertekening van stukken die van het
      college uitgaan ingevolge het tweede lid is opgedragen aan de secretaris of een andere provinciale ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel59a
  - number: '60.1'
    text: |-
      Provinciale staten kunnen regelen van welke beslissingen van gedeputeerde staten aan de leden van provinciale
      staten kennisgeving wordt gedaan. Daarbij kunnen provinciale staten de gevallen bepalen waarin met terinzagelegging
      kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel60
  - number: '60.2'
    text: |-
      Gedeputeerde staten laten de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het
      openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel60
  - number: '60.3'
    text: |-
      Gedeputeerde staten maken de besluitenlijst van hun vergaderingen op de in de provincie gebruikelijke wijze
      openbaar. Zij laten de openbaarmaking achterwege voor zover het aangelegenheden betreft ten aanzien waarvan op
      grond van [artikel 55][ref1] geheimhouding is opgelegd of ten aanzien waarvan openbaarmaking in strijd is met het
      openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel55
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '55'
        hoofdstuk: III
  - number: '61.1'
    text: |-
      De commissaris van de Koning wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de tijd van
      zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister overlegt met provinciale staten over de eisen die aan de te benoemen commissaris worden gesteld met
      betrekking tot de vervulling van het ambt. Voorafgaand aan het overleg met Onze Minister stellen provinciale staten
      gedeputeerde staten in de gelegenheid hun wensen en bedenkingen ten aanzien van deze eisen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.3'
    text: |-
      Na het overleg met Onze Minister stellen provinciale staten uit hun midden een vertrouwenscommissie in, belast
      met de beoordeling van de kandidaten. Provinciale staten kunnen bepalen dat één of meer gedeputeerden als adviseur
      aan de vertrouwenscommissie worden toegevoegd. Onze Minister verschaft de vertrouwenscommissie een opgave van
      degenen die naar het ambt van commissaris hebben gesolliciteerd, vergezeld van zijn oordeel over kandidaten die
      hij in beginsel geschikt acht voor benoeming. Als de vertrouwenscommissie besluit naast deze kandidaten ook andere
      kandidaten die gesolliciteerd hebben, bij haar beoordeling te betrekken, doet zij daarvan onverwijld mededeling aan
      Onze Minister. Deze brengt zijn oordeel over laatstgenoemde kandidaten ter kennis van de vertrouwenscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.4'
    text: |-
      De vertrouwenscommissie verschaft zich de door haar nodig geachte informatie over de kandidaten. Bestuursorganen
      zijn verplicht de gevraagde informatie te verstrekken. De vertrouwenscommissie brengt verslag uit van haar
      bevindingen aan de staten en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.5'
    text: |-
      Provinciale staten zenden Onze Minister binnen vier maanden nadat de gelegenheid tot sollicitatie voor de functie
      is gegeven een aanbeveling inzake de benoeming. Deze aanbeveling omvat twee personen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.6'
    text: |-
      In een bijzonder, door provinciale staten te motiveren geval, kan worden volstaan met een aanbeveling waarop één
      persoon vermeld staat. Onze Minister slaat geen acht op een enkelvoudige aanbeveling, indien naar zijn oordeel geen
      sprake is van een bijzonder geval.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.7'
    text: |-
      Onze Minister volgt in zijn voordracht in beginsel de aanbeveling, met inbegrip van de daarop gehanteerde volgorde,
      tenzij zwaarwegende gronden aanleiding tot afwijking geven. Een afwijking wordt gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
  - number: '61.8'
    text: |-
      De rijksbelastingdienst verstrekt Onze Minister de benodigde gegevens inzake bestuurlijke boeten als bedoeld in
      [hoofdstuk VIIIA van de Algemene wet inzake rijksbelastingen][ref1] en inzake strafbeschikkingen als bedoeld in
      [artikel 76 van die wet][ref2], voor zover deze boeten en beschikkingen zijn opgelegd dan wel hadden kunnen worden
      opgelegd ter zake van feiten die zijn gebleken na de termijn om deze op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VIIIA
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '76'
  - number: 61a.1
    text: |-
      De commissaris van de Koning kan bij koninklijk besluit op voordracht van Onze Minister worden herbenoemd voor de
      tijd van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61a
  - number: 61a.2
    text: |-
      Provinciale staten zenden een aanbeveling inzake de herbenoeming van de commissaris tenminste vier maanden voor de
      eerste dag van de maand waarin de herbenoeming dient in te gaan, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61a
  - number: 61a.3
    text: |-
      Voordat provinciale staten een aanbeveling opstellen, overleggen zij met Onze Minister over het functioneren van
      de commissaris.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61a
  - number: 61a.4
    text: |-
      Na het overleg met Onze Minister stellen provinciale staten uit hun midden een vertrouwenscommissie in, belast
      met de voorbereiding van de aanbeveling inzake de herbenoeming. Provinciale staten kunnen bepalen dat één of meer
      gedeputeerden als adviseur aan de vertrouwenscommissie worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61a
  - number: 61a.5
    text: Onze Minister wijkt in zijn voordracht slechts op zwaarwegende gronden af van de aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61a
  - number: 61b.1
    text: |-
      De commissaris van de Koning kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61b
  - number: 61b.2
    text: |-
      Indien sprake is van een verstoorde verhouding tussen de commissaris en provinciale staten, kunnen de staten een
      aanbeveling tot ontslag zenden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61b
  - number: 61b.3
    text: |-
      Voordat de staten verklaren dat van een verstoorde verhouding tussen de commissaris en de staten sprake is,
      overleggen zij met Onze Minister over de aanleiding tot die verklaring.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61b
  - number: 61b.4
    text: |-
      Een aanbeveling vormt geen onderwerp van beraadslagingen en wordt niet vastgesteld dan nadat provinciale staten
      tenminste twee weken en ten hoogste drie maanden tevoren hebben verklaard, dat tussen de commissaris en de staten
      sprake is van een verstoorde verhouding.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61b
  - number: 61b.5
    text: |-
      De oproeping tot de vergadering waarin over de aanbeveling wordt beraadslaagd of besloten, wordt tenminste
      achtenveertig uur voor de aanvang of zoveel eerder als provinciale staten hebben bepaald, bij de leden van de
      staten bezorgd. Zij vermeldt het voorstel tot de aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61b
  - number: 61b.6
    text: Onze Minister wijkt in zijn voordracht slechts af van de aanbeveling op zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61b
  - number: 61c.1
    text: |-
      De beraadslagingen, bedoeld in de [artikelen 61, derde en vierde lid][ref1], [61a, derde en vierde lid][ref2], en
      [61b, derde lid][ref3], vinden plaats met gesloten deuren. Van deze beraadslagingen wordt een afzonderlijk verslag
      opgemaakt dat niet openbaar wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel61b
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 61a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 61b
        hoofdstuk: IV
  - number: 61c.2
    text: |-
      Ten aanzien van de beraadslagingen en de stukken die aan provinciale staten worden gezonden dan wel die door
      provinciale staten aan Onze Minister worden gezonden geldt een geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61c
  - number: 61c.3
    text: |-
      De aanbevelingen van provinciale staten, bedoeld in [artikel 61, vijfde en zesde lid][ref1],
      [61a, tweede lid][ref2], en [61b, tweede lid][ref3], zijn openbaar met dien verstande dat ten aanzien van de
      aanbeveling inzake de benoeming, bedoeld in [artikel 61, vijfde lid][ref4], de openbaarheid uitsluitend de als
      eerste aanbevolen persoon geldt. [Artikel 31][ref5] is van toepassing op de stemmingen inzake de aanbevelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel61b
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel61
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel31
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 61a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 61b
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '61'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0005645
        artikel: '31'
        hoofdstuk: II
  - number: 61d
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de bij benoeming, herbenoeming en
      ontslag van de commissaris van de Koning te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel61d
  - number: '62.1'
    text: De commissaris kan bij koninklijk besluit worden geschorst.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel62
  - number: '62.2'
    text: |-
      Onze Minister kan, in afwachting van een besluit omtrent schorsing, bepalen dat de commissaris zijn functie niet
      uitoefent.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel62
  - number: '62.3'
    text: |-
      Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel62
  - number: '63'
    text: Voor de benoembaarheid tot commissaris is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel63
  - number: '64.1'
    text: |-
      De commissaris legt in handen van de Koning de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar)
      dat ik, om tot commissaris van de Koning benoemd te worden, rechtstreeks noch middellijk, onder welke naam of
      welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets
      in dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of
      zal aannemen. Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en
      dat ik mijn plichten als commissaris van de Koning naar eer en geweten zal vervullen. Zo waarlijk helpe mij God
      Almachtig!" (Dat verklaar en beloof ik!")


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '64.2'
    text: |-
      In geval van herbenoeming wordt de eed (verklaring en belofte) in handen van de Koning of in handen van Onze
      Minister, daartoe door de Koning gemachtigd, afgelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel64
  - number: '64.3'
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta kommissaris fan 'e Kening beneamd
      te wurden, streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of
      ûnthjitten haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch
      midlik hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze
      sil oan 'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as kommissaris fan 'e Kening yn
      alle oprjochtens ferfolje sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '65.1'
    text: |-
      De commissaris geniet ten laste van de provincie een bezoldiging, die bij of krachtens algemene maatregel van
      bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
  - number: '65.2'
    text: |-
      Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van bijzondere kosten en
      betreffende andere voorzieningen die verband houden met de vervulling van zijn ambt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
  - number: '65.3'
    text: |-
      Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de commissaris als zodanig geen inkomsten, in welke
      vorm ook, ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
  - number: '65.4'
    text: |-
      De commissaris geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties welke
      hij vervult uit hoofde van zijn ambt, ongeacht of die vergoedingen ten laste van de provincie komen of niet. Indien
      deze vergoedingen worden uitgekeerd, worden zij gestort in de provinciale kas.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
  - number: '65.5'
    text: |-
      Tot vergoedingen als bedoeld in het vijfde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de commissaris neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
  - number: '65.6'
    text: |-
      Andere inkomsten dan die bedoeld in het vijfde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1]. De rijksbelastingdienst verstrekt Onze Minister
      ten behoeve van de verrekening de benodigde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: '65.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de commissaris gegevens over de
      inkomsten, bedoeld in het zevende lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel65
  - number: '66.1'
    text: |-
      De commissaris vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van het ambt van commissaris of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het
      vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel66
  - number: '66.2'
    text: |-
      De commissaris meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van het ambt van
      commissaris, aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel66
  - number: '66.3'
    text: |-
      De commissaris maakt nevenfuncties, anders dan uit hoofde van zijn ambt van commissaris, en de inkomsten uit die
      functies openbaar. Openbaarmaking geschiedt door terinzagelegging op het provinciehuis uiterlijk op 1 april na het
      kalenderjaar waarin de inkomsten zijn genoten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel66
  - number: '66.4'
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '67'
    text: 'De commissaris is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 67.g
    text: lid van provinciale staten;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.h
    text: gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.i
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.j
    text: lid van de raad van een gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.k
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.l
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.m
    text: lid van de rekenkamer van een in de betrokken provincie gelegen gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.n
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 79q, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79q
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79q
        hoofdstuk: IVC
        paragraaf: '1'
  - number: 67.o
    text: ambtenaar, door of vanwege het provinciebestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.p
    text: |-
      ambtenaar, door of vanwege het gemeentebestuur van een in de provincie gelegen gemeente aangesteld of daaraan
      ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.q
    text: voorzitter van, lid van het bestuur van of ambtenaar in dienst van een in de provincie gelegen waterschap;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.r
    text: |-
      ambtenaar in dienst van een bij gemeenschappelijke regeling ingesteld lichaam waarvan een orgaan aan toezicht van
      gedeputeerde staten is onderworpen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.s
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: 67.t
    text: |-
      functionaris, krachtens wet of algemene maatregel van bestuur geroepen om het provinciebestuur van advies te
      dienen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel67
  - number: '68.1'
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel15
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '15'
        hoofdstuk: II
  - number: '68.2'
    text: Provinciale staten stellen voor de commissaris een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel68
  - number: '69'
    text: |-
      Het ambt van commissaris ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel69
  - number: '70'
    text: De commissaris heeft zijn werkelijke woonplaats in de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel70
  - number: '71.1'
    text: |-
      Indien de commissaris langer dan zes weken buiten de provincie wenst te verblijven, behoeft hij daartoe de
      toestemming van Onze Minister. De toestemming mag alleen worden verleend, indien het belang van de provincie zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel71
  - number: '71.2'
    text: De Algemene Termijnenwet (*Stb.* 1964, 314) is niet van toepassing op de termijn genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel71
  - number: '72.1'
    text: |-
      Voor zover dit niet bij de wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien van
      de commissaris regels vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: 72.1.a
    text: benoeming, herbenoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: 72.1.b
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: 72.1.c
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: 72.1.d
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: 72.1.e
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: '72.2'
    text: |-
      Bij de regels betreffende de in het eerste lid bedoelde aangelegenheden kunnen financiële voorzieningen worden
      getroffen die ten laste van de provincie komen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel72
  - number: '73.1'
    text: |-
      Alle aan provinciale staten of aan gedeputeerde staten gerichte stukken worden door of namens de commissaris
      geopend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel73
  - number: '73.2'
    text: |-
      Van de ontvangst van aan provinciale staten gerichte stukken die niet terstond in de vergadering van provinciale
      staten aan de orde worden gesteld, doet hij in de eerstvolgende vergadering van provinciale staten mededeling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel73
  - number: '75.1'
    text: |-
      Bij verhindering of ontstentenis van de commissaris wordt zijn ambt waargenomen door een door gedeputeerde staten
      aan te wijzen gedeputeerde. Van de aanwijzing doet de commissaris schriftelijk mededeling aan Onze Minister. Het
      voorzitterschap van provinciale staten wordt bij verhindering of ontstentenis van de commissaris waargenomen door
      het langstzittende lid van provinciale staten. Indien meer leden van provinciale staten even lang zitting hebben,
      dan vindt de waarneming van het voorzitterschap plaats door het oudste lid in jaren van hen. Provinciale staten
      kunnen een ander lid van provinciale staten met de waarneming van het voorzitterschap belasten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel75
  - number: '75.2'
    text: |-
      Bij verhindering of ontstentenis van alle gedeputeerden wordt het ambt van commissaris waargenomen door het
      langstzittende lid van provinciale staten. Indien meer leden van provinciale staten even lang zitting hebben,
      dan vindt de waarneming plaats door het oudste lid in jaren van hen. Provinciale staten kunnen een ander lid van
      provinciale staten met de waarneming belasten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel75
  - number: '76.1'
    text: |-
      Indien de regering het in het belang van de provincie nodig oordeelt, voorziet zij in afwijking van
      [artikel 75][ref1] in de waarneming. Alvorens daartoe over te gaan hoort zij provinciale staten, tenzij gewichtige
      redenen zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel75
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '75'
        hoofdstuk: IV
  - number: '76.2'
    text: |-
      Hij die door de regering met de waarneming van het ambt van commissaris is belast, legt in handen van Onze Minister
      een overeenkomstig artikel 64 luidende eed (verklaring en belofte) af.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel76
  - number: '77'
    text: |-
      De toekenning van een vergoeding aan degene die met de waarneming van het ambt van commissaris is belast, wordt
      geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel77
  - number: '78'
    text: |-
      Ten aanzien van degene die met de waarneming van het ambt van commissaris is belast, zijn de [artikelen 63][ref1],
      [66][ref2], [67][ref3] en [68][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel68
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '63'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '66'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '67'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '68'
        hoofdstuk: IV
  - number: '79.1'
    text: |-
      Provinciale staten kunnen regelen van welke beslissingen van de commissaris aan de leden van provinciale staten
      kennisgeving wordt gedaan. Daarbij kunnen provinciale staten de gevallen bepalen waarin met terinzagelegging kan
      worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79
  - number: '79.2'
    text: |-
      De commissaris laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79
  - number: 79a.1
    text: Provinciale staten kunnen een rekenkamer instellen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79a
  - number: 79a.2
    text: |-
      Indien provinciale staten een rekenkamer instellen, zijn de navolgende artikelen van dit hoofdstuk alsmede
      [hoofdstuk XIa][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXIA
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XIA
  - number: 79a.3
    text: |-
      Indien provinciale staten geen rekenkamer instellen is [hoofdstuk IVb][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukIVB
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: IVB
  - number: 79b
    text: Provinciale staten stellen het aantal leden van de rekenkamer vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79b
  - number: 79c.1
    text: Provinciale staten benoemen de leden van de rekenkamer voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
  - number: 79c.2
    text: Indien de rekenkamer uit twee of meer leden bestaat, benoemen provinciale staten uit de leden de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
  - number: 79c.3
    text: |-
      Provinciale staten kunnen plaatsvervangende leden benoemen. Indien de rekenkamer uit één lid bestaat, benoemen
      provinciale staten in ieder geval een plaatsvervangend lid. Deze paragraaf is op plaatsvervangende leden van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
  - number: 79c.4
    text: Provinciale staten kunnen een lid herbenoemen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
  - number: 79c.5
    text: |-
      Voorafgaand aan de benoemingen, bedoeld in het eerste tot en met vierde lid, plegen provinciale staten overleg met
      de rekenkamer.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
  - number: 79c.6
    text: |-
      Een lid van de rekenkamer wordt door provinciale staten ontslagen: - op eigen verzoek;
        - bij de aanvaarding van een functie die onverenigbaar is met het lidmaatschap;
        - indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
        - indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld;
        - indien hij naar het oordeel van provinciale staten ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
  - number: 79c.7
    text: |-
      Een lid van de rekenkamer kan door provinciale staten worden ontslagen: - indien hij door ziekte of gebreken
      blijvend ongeschikt is zijn functie te vervullen;
        - indien hij handelt in strijd met [artikel 79h][ref1] juncto [artikel 15, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79h
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel15
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79c
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79h
        hoofdstuk: IVA
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '15'
        hoofdstuk: II
  - number: 79d.1
    text: |-
      Provinciale staten stellen een lid van de rekenkamer op non-activiteit indien: - hij zich in voorlopige hechtenis
      bevindt;
        - hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
        - hij onder curatele is gesteld, in staat van faillissement is verklaard, surséance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79d
  - number: 79d.2
    text: |-
      Provinciale staten kunnen een lid van de rekenkamer op non-activiteit stellen, indien tegen hem een
      gerechtelijk onderzoek ter zake van een misdrijf wordt ingesteld of indien er een ander ernstig vermoeden
      is van het bestaan van feiten en omstandigheden die tot ontslag, anders dan op gronden vermeld in
      [artikel 79c, zesde lid, onder a, en zevende lid, onder a][ref1], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79c
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79d
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79c
        hoofdstuk: IVA
        paragraaf: '1'
  - number: 79d.3
    text: |-
      Provinciale staten beëindigen de non-activiteit zodra de grond voor de maatregel is vervallen, met dien verstande
      dat in een geval als bedoeld in het tweede lid de non-activiteit in ieder geval eindigt na zes maanden. In dat
      geval kunnen provinciale staten de maatregel telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79d
  - number: 79e
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing op de leden van de rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel11
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79e
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '11'
        hoofdstuk: II
  - number: 79f.1
    text: 'Een lid van de rekenkamer is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 79f.1.g
    text: lid van provinciale staten van de betrokken provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.h
    text: commissaris van de Koning van de betrokken provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.i
    text: gedeputeerde van de betrokken provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.j
    text: burgemeester van een in de betrokken provincie gelegen gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.k
    text: wethouder van een in de betrokken provincie gelegen gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.l
    text: ambtenaar, door of vanwege het provinciebestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.m
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.1.n
    text: |-
      functionaris, krachtens wet of algemene maatregel van bestuur geroepen om het provinciebestuur van advies te
      dienen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79f.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder l, kan een lid van de rekenkamer tevens zijn vrijwilliger of ander
      persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten verricht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79f
  - number: 79g.1
    text: |-
      Alvorens hun functie uit te kunnen oefenen, leggen de leden van de rekenkamer in de vergadering van provinciale
      staten, in handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om
      tot lid van de rekenkamer benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel
      ook, enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen
      of te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer
      (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als
      lid van de rekenkamer naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig! («Dat verklaar en
      beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79g
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 79g.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta lid fan 'e rekkenkeamer beneamd
      te wurden, streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of
      ûnthjitten haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch
      midlik hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze
      sil oan 'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as lid fan 'e rekkenkeamer yn
      alle oprjochtens ferfolje sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79g
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 79h
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de leden van de rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel15
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79h
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '15'
        hoofdstuk: II
  - number: 79i.1
    text: |-
      De rekenkamer stelt een reglement van orde voor haar werkzaamheden vast en, indien zij uit twee of meer leden
      bestaat, tevens voor haar vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79i
  - number: 79i.2
    text: |-
      De rekenkamer zendt het reglement ter kennisneming aan provinciale staten en maakt het bekend op de wijze, bedoeld
      in [artikel 136, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79i
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: 79j.1
    text: |-
      Provinciale staten stellen, na overleg met de rekenkamer, de rekenkamer de nodige middelen ter beschikking voor een
      goede uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79j
  - number: 79j.2
    text: |-
      Op voordracht van de voorzitter of van het enige lid van de rekenkamer benoemen gedeputeerde staten zoveel
      ambtenaren van de rekenkamer als nodig zijn voor een goede uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79j
  - number: 79j.3
    text: |-
      De ambtenaren die werkzaamheden verrichten voor de rekenkamer, verrichten niet tevens werkzaamheden voor een ander
      orgaan van de provincie
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79j
  - number: 79j.4
    text: |-
      De ambtenaren, die werkzaamheden verrichten voor de rekenkamer, zijn ter zake van die werkzaamheden uitsluitend
      verantwoording schuldig aan de rekenkamer.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79j
  - number: 79k
    text: |-
      De leden van de rekenkamer ontvangen een bij verordening van provinciale staten vastgestelde vergoeding voor hun
      werkzaamheden en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79k
  - number: 79l
    text: |-
      In afwijking van [artikel 79a][ref1] kunnen provinciale staten met provinciale staten van een of
      meer andere provincies met toepassing van [artikel 40][ref2] en [artikel 41, eerste lid][ref3],
      juncto [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref4], of met de raad
      of de raden van één of meer gemeenten, al dan niet met provinciale staten van één of meer andere
      provincies tezamen, met toepassing van [artikel 51][ref5] en [artikel 52, eerste lid][ref6], juncto
      [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref7] een gemeenschappelijke rekenkamer
      instellen. De [artikelen 10, tweede en derde lid][ref8], [10a][ref9], [11][ref10], [15][ref11], [16][ref12],
      [17][ref13], [20, derde lid][ref14], [21][ref15], [22][ref16], [23][ref17], [43][ref18] en [54 van die wet][ref19]
      zijn niet van toepassing.


