  - number: 79m.2
    text: |-
      [Artikel 79g][ref1] is op de gemeenschappelijke rekenkamer van toepassing, met dien verstande dat voor «provinciale
      staten» wordt gelezen «provinciale staten van de provincie die daartoe in de regeling waarbij de gemeenschappelijke
      rekenkamer is ingesteld, zijn aangewezen» of, indien de rekenkamer mede is ingesteld door gemeenten, «provinciale
      staten van de provincie of de raad van de gemeente die daartoe in de regeling waarbij de gemeenschappelijke
      rekenkamer is ingesteld zijn of is aangewezen».


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79g
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79m
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79g
        hoofdstuk: IVA
        paragraaf: '1'
  - number: 79n
    text: |-
      Indien provinciale staten van één of meer provincies met de raad of raden van een of meer gemeenten
      een gemeenschappelijke rekenkamer instellen, is, onverminderd [artikel 79m, eerste lid][ref1], juncto
      [artikel 79f][ref2], een lid van de rekenkamer niet tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79m
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel79f
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79m
        hoofdstuk: IVA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 79f
        hoofdstuk: IVA
        paragraaf: '1'
  - number: 79n.a
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
  - number: 79n.b
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
  - number: 79n.c
    text: lid van de raad van een deelnemende gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
  - number: 79n.d
    text: ambtenaar, door of vanwege het gemeentebestuur van een deelnemende gemeente aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
  - number: 79n.e
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in het
      kader van het toezicht op een deelnemende gemeente;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
  - number: 79n.f
    text: |-
      functionaris, krachtens wet of algemene maatregel van bestuur geroepen om het gemeentebestuur van een deelnemende
      gemeente van advies te dienen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79n
  - number: 79o
    text: |-
      In de regeling waarbij de gemeenschappelijke rekenkamer wordt ingesteld, worden ten minste regels gesteld over: -
      de benoeming, op voordracht van de voorzitter of het enige lid van de rekenkamer, van de ambtenaren die nodig zijn
      voor een goede uitoefening van de werkzaamheden van de rekenkamer;
        - de vergoeding die de leden van de rekenkamer voor hun werkzaamheden ontvangen en de tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79o
  - number: 79p.1
    text: |-
      Als geen rekenkamer is ingesteld als bedoeld in [hoofdstuk IVa][ref1], stellen provinciale staten bij verordening
      regels vast voor de uitoefening van de rekenkamerfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukIVA
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79p
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: IVA
  - number: 79p.2
    text: |-
      De [artikelen 183][ref1], 185, [185a][ref2] en [186][ref3] zijn voor de uitoefening van de rekenkamerfunctie van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel185a
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel186
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79p
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '183'
        hoofdstuk: XIA
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 185a
        hoofdstuk: XIA
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '186'
        hoofdstuk: XIA
  - number: 79p.3
    text: |-
      Op personen die de rekenkamerfunctie uitoefenen is [artikel 79f, behoudens het eerste lid, onder g][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79f
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79p
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79f
        hoofdstuk: IVA
        paragraaf: '1'
  - number: 79q.1
    text: |-
      Met inachtneming van het bepaalde in dit hoofdstuk kunnen provinciale staten de behandeling van verzoekschriften
      als bedoeld in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1], opdragen aan een provinciale
      ombudsman of ombudscommissie, dan wel een gezamenlijke ombudsman of ombudscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79q
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 79q.2
    text: |-
      Een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien provinciale staten hiertoe besluiten, zenden zij het besluit tot instelling aan de Nationale
      ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79q
  - number: 79q.3
    text: |-
      De instelling van een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van
      enig jaar worden beëindigd. Indien provinciale staten hiertoe besluiten, zenden zij het besluit tot beëindiging
      van de instelling aan de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling
      eindigt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79q
  - number: 79r.1
    text: |-
      Indien provinciale staten de behandeling van verzoekschriften opdragen aan een provinciale ombudsman, benoemen zij
      deze voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.2
    text: |-
      Provinciale staten benoemen een plaatsvervangend ombudsman. Deze paragraaf is op de plaatsvervangend ombudsman van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.3
    text: 'De ombudsman wordt door provinciale staten ontslagen:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.3.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.3.b
    text: wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.3.c
    text: |-
      bij de aanvaarding van een betrekking als bedoeld in [artikel 79s, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79s
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79s
        hoofdstuk: IVC
        paragraaf: '2'
  - number: 79r.3.d
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.3.e
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.3.f
    text: indien hij naar het oordeel van provinciale staten ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.4
    text: 'Provinciale staten stellen de ombudsman op non-activiteit indien hij:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.4.a
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.4.b
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79r.4.c
    text: |-
      onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft verkregen of wegens schulden is
      gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79r
  - number: 79s.1
    text: |-
      De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79s
  - number: 79s.2
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing op de ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel11
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79s
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '11'
        hoofdstuk: II
  - number: 79t.1
    text: |-
      Alvorens zijn functie te kunnen uitoefenen, legt de ombudsman in de vergadering van provinciale staten, in handen
      van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot ombudsman
      benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb
      gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks
      noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (verklaar en beloof) dat ik
      getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als ombudsman naar
      eer en geweten zal vervullen. Zo waarlijk helpe mij God almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79t
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 79t.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta ombudsman beneamd te wurden,
      streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten
      haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik
      hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze sil oan
      'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as ombudsman yn alle oprjochtens ferfolje
      sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79t
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 79u.1
    text: |-
      Op voordracht van de ombudsman benoemen gedeputeerde staten het personeel van de ombudsman dat nodig is voor een
      goede uitoefening van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79u
  - number: 79u.2
    text: |-
      De ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in het algemeen,
      noch voor een enkel geval.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79u
  - number: 79u.3
    text: |-
      Het personeel van de ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens gedraging de
      ombudsman een onderzoek kan instellen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79u
  - number: 79u.4
    text: |-
      Het personeel van de ombudsman is ter zake van de werkzaamheden die het voor de ombudsman verricht, uitsluitend aan
      hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79u
  - number: 79v
    text: De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79v
  - number: 79w
    text: |-
      De ombudsman ontvangt een bij verordening van provinciale staten vastgestelde vergoeding voor zijn werkzaamheden en
      een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79w
  - number: 79x.1
    text: |-
      Indien provinciale staten de behandeling van verzoekschriften opdraagt aan een provinciale ombudscommissie, stellen
      provinciale staten het aantal leden van de ombudscommissie vast.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79x
  - number: 79x.2
    text: Provinciale staten benoemen de leden van de ombudscommissie voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79x
  - number: 79x.3
    text: Provinciale staten benoemen uit de leden de voorzitter en de plaatsvervangend voorzitter van de ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79x
  - number: 79y.1
    text: De ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79y
  - number: 79y.2
    text: |-
      Op de ombudscommissie en op ieder lid afzonderlijk zijn de [artikelen 79r, derde en vierde lid][ref1], [79s][ref2],
      [79t][ref3], [79u][ref4] en [79w][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79r
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel79s
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel79t
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel79u
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel79w
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79y
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79r
        hoofdstuk: IVC
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 79s
        hoofdstuk: IVC
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 79t
        hoofdstuk: IVC
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: 79u
        hoofdstuk: IVC
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005645
        artikel: 79w
        hoofdstuk: IVC
        paragraaf: '2'
  - number: 79z.1
    text: |-
      Provinciale staten kunnen voor de behandeling van verzoekschriften een gezamenlijke ombudsman of een gezamenlijke
      ombudscommissie instellen met de raad of raden van een of meer andere gemeenten, dan wel met provinciale staten van
      een of meer provincies, dan wel met het algemeen bestuur van een of meer waterschappen, dan wel met het algemeen
      bestuur van een of meer openbare lichamen of gemeenschappelijke organen ingesteld bij gemeenschappelijke regeling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79z
  - number: 79z.2
    text: |-
      De ombudsman of de ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de vertegenwoordigende
      organen van de deelnemende rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79z
  - number: 79z.3
    text: |-
      Op de ombudsman en op ieder afzonderlijk lid van de ombudscommissie zijn de [artikelen 79r tot en met 79u][ref1],
      [79w][ref2] en [79x][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79r
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel79w
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel79x
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79z
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 79r
        hoofdstuk: IVC
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 79w
        hoofdstuk: IVC
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 79x
        hoofdstuk: IVC
        paragraaf: '3'
  - number: 79aa
    text: |-
      Indien provinciale staten een ombudsman of een ombudscommissie instellen met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], zijn de in die wet ten aanzien van gemeenschappelijke organen opgenomen
      bepalingen slechts van toepassing voor zover de aard van de aan de ombudsman of de ombudscommissie opgedragen taken
      zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel79aa
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '80.1'
    text: |-
      Provinciale staten kunnen statencommissies instellen die besluitvorming van provinciale staten kunnen voorbereiden
      en met gedeputeerde staten of de commissaris kunnen overleggen. Zij regelen daarbij de taken, de bevoegdheden, de
      samenstelling en de werkwijze, daaronder begrepen de wijze waarop de leden van provinciale staten inzage hebben
      in stukken waaromtrent door de commissie geheimhouding is opgelegd. Deze inzage kan slechts worden geweigerd voor
      zover zij in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel80
  - number: '80.2'
    text: De commissaris en de gedeputeerden zijn geen lid van een statencommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel80
  - number: '80.3'
    text: |-
      Bij de samenstelling van een statencommissie zorgen provinciale staten, voor zover het de benoeming betreft
      van leden van provinciale staten, voor een evenwichtige vertegenwoordiging van de in provinciale staten
      vertegenwoordigde groeperingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel80
  - number: '80.4'
    text: Een lid van provinciale staten is voorzitter van een statencommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel80
  - number: '80.5'
    text: |-
      De [artikelen 19][ref1] en [21 tot en met 23][ref2] zijn van overeenkomstige toepassing op een vergadering
      van een statencommissie, met dien verstande dat in artikel 19 voor «commissaris» wordt gelezen «voorzitter
      van de statencommissie» en in [artikel 23, vijfde lid][ref3], voor «[artikel 25][ref4]» wordt gelezen
      «[artikel 91][ref5]».


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel91
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '21'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '23'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '25'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0005645
        artikel: '91'
        hoofdstuk: V
  - number: '81.1'
    text: |-
      Provinciale staten, onderscheidenlijk gedeputeerde staten, kunnen bestuurscommissies instellen die bevoegdheden
      uitoefenen die hun door provinciale staten, onderscheidenlijk gedeputeerde staten, zijn overgedragen. Zij regelen
      daarbij de taken, de bevoegdheden, de samenstelling en de werkwijze, daaronder begrepen de wijze waarop zij inzage
      hebben in de stukken waaromtrent door een bestuurscommissie geheimhouding is opgelegd. Deze inzage kan slechts
      worden geweigerd voor zover zij in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel81
  - number: '81.2'
    text: |-
      De commissaris en de gedeputeerden zijn geen lid van een door provinciale staten ingestelde bestuurscommissie.
      Leden van provinciale staten zijn geen lid van een door gedeputeerde staten ingestelde bestuurscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel81
  - number: '81.3'
    text: |-
      De [artikelen 136, tweede lid][ref1], [137][ref2] en [138][ref3] zijn van overeenkomstige toepassing op een besluit
      tot instelling van een bestuurscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel138
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '137'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '138'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '81.4'
    text: |-
      De [artikelen 19, tweede lid][ref1], [22][ref2] en [23, eerste tot en met vierde lid][ref3], zijn van
      overeenkomstige toepassing ten aanzien van de vergadering van een door provinciale staten ingestelde
      bestuurscommissie, met dien verstande dat in [artikel 19, tweede lid][ref4], voor «de commissaris» wordt gelezen:
      de voorzitter van een bestuurscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '22'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '23'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '19'
        hoofdstuk: II
  - number: '81.5'
    text: |-
      Voor zover zulks in verband met de aard en omvang van de overgedragen bevoegdheden nodig is, regelen gedeputeerde
      staten de openbaarheid van vergaderingen van een door hen ingestelde bestuurscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel81
  - number: '82.1'
    text: |-
      Provinciale staten of gedeputeerde staten kunnen andere commissies dan bedoeld in de
      [artikelen 80, eerste lid][ref1], en [81, eerste lid][ref2], instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel81
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '80'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '81'
        hoofdstuk: V
  - number: '82.2'
    text: |-
      [Artikel 81, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel81
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '81'
        hoofdstuk: V
  - number: '82.3'
    text: |-
      Provinciale staten of gedeputeerde staten regelen ten aanzien van een door hen ingestelde andere commissie de
      openbaarheid van de vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel82
  - number: '82.4'
    text: |-
      De [artikelen 136, tweede lid][ref1], [137][ref2] en [138][ref3] zijn van overeenkomstige toepassing op een besluit
      tot instelling van een andere commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel138
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '137'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '138'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '83.1'
    text: |-
      Provinciale staten, onderscheidenlijk gedeputeerde staten, regelen ten aanzien van de door hen ingestelde
      bestuurscommissies de verantwoording aan provinciale staten, onderscheidenlijk gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel83
  - number: '83.2'
    text: |-
      Provinciale staten, onderscheidenlijk gedeputeerde staten, kunnen besluiten en andere, niet-schriftelijke,
      beslissingen gericht op enig rechtsgevolg van een door provinciale staten, onderscheidenlijk gedeputeerde
      staten, ingestelde bestuurscommissie vernietigen. Provinciale staten kunnen hun bevoegdheid tot schorsing
      delegeren aan gedeputeerde staten. Ten aanzien van de vernietiging van niet-schriftelijke beslissingen gericht
      op enig rechtsgevolg zijn de [afdelingen 10.2.2.][ref1] en [10.2.3. van de Algemene wet bestuursrecht][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '83.3'
    text: |-
      Voor zover zulks in verband met de aard en de omvang van de overgedragen bevoegdheden nodig is, regelen
      provinciale staten onderscheidenlijk gedeputeerde staten het overige toezicht op de uitoefening van de
      bevoegdheden door een door hen ingestelde bestuurscommissie. Dit overige toezicht kan mede de goedkeuring
      omvatten van beslissingen van een bestuurscommissie. De goedkeuring kan slechts worden onthouden wegens strijd
      met het recht of het algemeen belang. Ten aanzien van de goedkeuring van andere beslissingen dan besluiten is
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '91.1'
    text: |-
      Een commissie kan in een besloten vergadering, op grond van een belang, genoemd in artikel 10 van de Wet
      openbaarheid van bestuur, omtrent het in die vergadering met gesloten deuren behandelde en omtrent de inhoud
      van de stukken die aan de commissie worden overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een
      besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De geheimhouding wordt door hen die bij de
      behandeling aanwezig waren en allen die van het behandelde of de stukken kennis dragen, in acht genomen totdat de
      commissie haar opheft.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel91
  - number: '91.2'
    text: |-
      Op grond van een belang, genoemd in artikel 10 van de Wet openbaarheid van bestuur, kan de geheimhouding eveneens
      worden opgelegd door de voorzitter van de commissie, gedeputeerde staten en de commissaris van de Koning, ieder
      ten aanzien van stukken die zij aan de commissie overleggen. Daarvan wordt op de stukken melding gemaakt. De
      geheimhouding wordt in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel provinciale
      staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel91
  - number: '91.3'
    text: |-
      Indien de commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot
      provinciale staten heeft gericht, wordt de geheimhouding in acht genomen totdat provinciale staten haar opheffen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel91
  - number: '93.1'
    text: |-
      De leden van provinciale staten en de leden van provinciale staten aan wie ingevolge
      [artikel X 10 van de Kieswet][ref1] ontslag is verleend wegens zwangerschap en bevalling of ziekte ontvangen een
      bij verordening van provinciale staten vast te stellen vergoeding voor hun werkzaamheden en een tegemoetkoming in
      de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '93.2'
    text: |-
      Provinciale staten kunnen bij verordening regels stellen over de tegemoetkoming in of vergoeding van bijzondere
      kosten en over andere voorzieningen die verband houden met de vervulling van het lidmaatschap van provinciale
      staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel93
  - number: '93.3'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op een lid van provinciale staten dat met inachtneming van
      [artikel 13, tweede lid][ref1], tevens gedeputeerde is.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel13
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '13'
        hoofdstuk: II
  - number: '93.4'
    text: |-
      De verordeningen, bedoeld in het eerste en het tweede lid, worden vastgesteld overeenkomstig bij of krachtens
      algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel93
  - number: '94.1'
    text: |-
      De leden van een door provinciale staten of gedeputeerde staten ingestelde commissie ontvangen, voor zover zij geen
      lid zijn van provinciale staten of gedeputeerde staten, een bij provinciale verordening vast te stellen vergoeding:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel94
  - number: 94.1.a
    text: voor het bijwonen van vergaderingen van de commissie en
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel94
  - number: 94.1.b
    text: van reis- en verblijfskosten in verband met reizen binnen de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel94
  - number: '94.2'
    text: |-
      In bijzondere gevallen kunnen provinciale staten bij verordening bepalen dat de leden van het dagelijks bestuur
      van een bestuurscommissie of een andere commissie als bedoeld in [artikel 82][ref1] een vaste vergoeding voor hun
      werkzaamheden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel82
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '82'
        hoofdstuk: V
  - number: '94.3'
    text: |-
      Ten aanzien van een vergoeding, bedoeld in het eerste lid, onder a, worden bij of krachtens algemene maatregel
      van bestuur nadere regels gesteld. Ten aanzien van de overige vergoedingen, bedoeld in dit artikel, kunnen bij of
      krachtens algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel94
  - number: '95'
    text: De verordeningen bedoeld in de artikelen 93 en 94 worden aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel95
  - number: '96.1'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van provinciale staten, en van een
      door provinciale staten of gedeputeerde staten ingestelde commissie als zodanig geen andere vergoedingen en
      tegemoetkomingen ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel96
  - number: '96.2'
    text: |-
      Voordelen ten laste van de provincie, anders dan in de vorm van vergoedingen en tegemoetkomingen, genieten zij
      slechts voor zover dat is bepaald bij of krachtens de wet dan wel bij verordening van provinciale staten. De
      verordening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel96
  - number: '97.1'
    text: In iedere provincie is een secretaris en een griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel97
  - number: '97.2'
    text: Een secretaris is niet tevens griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel97
  - number: '98'
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de secretaris en de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel15
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '15'
        hoofdstuk: II
  - number: '99'
    text: Gedeputeerde staten benoemen de secretaris. Zij zijn tevens bevoegd de secretaris te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel99
  - number: '100.1'
    text: |-
      De secretaris staat gedeputeerde staten, de commissaris van de Koning en de door gedeputeerde staten ingestelde
      commissies bij de uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel100
  - number: '100.2'
    text: Gedeputeerde staten stellen in een instructie nadere regels over de taak en de bevoegdheden van de secretaris.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel100
  - number: '101'
    text: De secretaris is in de vergadering van gedeputeerde staten aanwezig.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel101
  - number: '103.1'
    text: Gedeputeerde staten regelen de vervanging van de secretaris.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel103
  - number: '103.2'
    text: |-
      De [artikelen 97, tweede lid][ref1], en [98 tot en met 102][ref2] zijn van overeenkomstige toepassing op degene die
      de secretaris vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel98
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '97'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '98'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '104'
    text: Provinciale staten benoemen de griffier. Zij zijn tevens bevoegd de griffier te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104
  - number: 104a.1
    text: De griffier staat provinciale staten en de door hen ingestelde commissies bij de uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104a
  - number: 104a.2
    text: Provinciale staten stellen in een instructie nadere regels over de taak en de bevoegdheden van de griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104a
  - number: 104b
    text: De griffier is in de vergadering van provinciale staten aanwezig.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104b
  - number: 104d.1
    text: Provinciale staten regelen de vervanging van de griffier.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104d
  - number: 104d.2
    text: |-
      De artikelen 97, tweede lid, 98 en 104 tot en met 104c zijn van overeenkomstige toepassing op degene die de
      griffier vervangt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104d
  - number: 104e.1
    text: Provinciale staten kunnen regels stellen over de organisatie van de griffie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104e
  - number: 104e.2
    text: Provinciale staten zijn bevoegd de op de griffie werkzame ambtenaren te benoemen, te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel104e
  - number: '105.1'
    text: |-
      De bevoegdheid tot regeling en bestuur inzake de huishouding van de provincie wordt aan het provinciebestuur
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel105
  - number: '105.2'
    text: |-
      Regeling en bestuur kunnen van het provinciebestuur worden gevorderd bij of krachtens een andere dan deze wet ter
      verzekering van de uitvoering daarvan, met dien verstande dat het geven van aanwijzingen aan het provinciebestuur
      en het aan het provinciebestuur opleggen of in zijn plaats vaststellen van beslissingen, slechts kan geschieden
      indien de bevoegdheid daartoe bij de wet is toegekend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel105
  - number: '105.3'
    text: |-
      Onverminderd het bepaalde in de [artikelen 108, vijfde lid][ref1], en [117, vierde lid][ref2], worden de kosten
      verbonden aan de uitvoering van het tweede lid voor zover zij ten laste van de betrokken provincies blijven, door
      het Rijk aan hen vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel117
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '117'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '106'
    text: Bij of krachtens de wet kan zo nodig onderscheid worden gemaakt tussen provincies.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel106
  - number: '107.1'
    text: |-
      Het provinciebestuur kan bevoegdheden van regeling en bestuur, gevorderd bij of krachtens een andere dan deze
      wet, voor het gebied van een of meer gemeenten of waterschappen overdragen aan de besturen van die gemeenten
      of waterschappen voor zover die bevoegdheden zich naar hun aard en schaal daartoe lenen en die besturen daarmee
      instemmen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '107.2'
    text: Een besluit als bedoeld in het eerste lid regelt de gevolgen van intrekking van het besluit.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '107.3'
    text: |-
      Het ontwerp van een besluit als bedoeld in het eerste lid behoeft de instemming van provinciale staten en van de
      raden van de betrokken gemeenten onderscheidenlijk de algemene besturen van de betrokken waterschappen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '107.4'
    text: Een besluit als bedoeld in het eerste lid wordt binnen een week toegezonden aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '107.5'
    text: |-
      Ten aanzien van de bekendmaking van een besluit als bedoeld in het eerste lid zijn de
      [artikelen 136 tot en met 138][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '107.6'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van het provinciebestuur, de uitoefening daarvan en het toezicht
      daarop, uitgezonderd die met betrekking tot vergaderingen, zijn ten aanzien van de ingevolge het eerste lid
      overgedragen bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '107.7'
    text: |-
      Het provinciebestuur oefent geen toezicht uit en geeft geen voorschriften met betrekking tot de uitoefening van de
      ingevolge het eerste lid overgedragen bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '107.8'
    text: |-
      Indien het verzoek van een gemeentebestuur of bestuur van een waterschap tot het nemen van een besluit als bedoeld
      in het eerste lid wordt afgewezen, wordt die afwijzing door het provinciebestuur met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel107
  - number: '108.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
  - number: 108.1.a
    text: |-
      plan: een beslissing die een samenhangend geheel van op elkaar afgestemde keuzes bevat omtrent door het
      provinciebestuur te nemen besluiten of te verrichten andere handelingen, ten einde een of meer doelstellingen te
      bereiken;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
  - number: 108.1.b
    text: |-
      beleidsverslag: een schriftelijke rapportage betreffende het door het provinciebestuur gevoerde beleid op een of
      meer beleidsterreinen dan wel op onderdelen daarvan en de samenhang daarbinnen of daartussen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
  - number: '108.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk van het provinciebestuur slechts worden gevorderd in bij de wet te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
  - number: '108.3'
    text: Een verplichting als bedoeld in het tweede lid geldt voor ten hoogste vier jaren tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
  - number: '108.4'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk in andere dan bij de wet bepaalde gevallen voor een termijn van ten hoogste vier
      jaar van het provinciebestuur worden gevraagd als onderdeel van de regeling van een tijdelijke specifieke uitkering
      als bedoeld in [artikel 17 van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '17'
  - number: '108.5'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure wordt van een provinciebestuur niet gevorderd of gevraagd, dan nadat is aangegeven hoe de financiële
      gevolgen ervan voor de provincie worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
  - number: '108.6'
    text: |-
      Dit artikel is niet van toepassing op de begroting, bedoeld in [artikel 193][ref1], en op de jaarrekening en het
      jaarverslag, bedoeld in [artikel 201][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel201
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '109.1'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 108][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt alleen gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel108
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109.1.a
    text: dit noodzakelijk is uit een oogpunt van afstemming tussen provinciaal beleid en het beleid van het Rijk, of
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
  - number: 109.1.b
    text: de ontwikkeling van beleid op een nieuw beleidsterrein dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
  - number: '109.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 108][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt niet gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel108
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109.2.a
    text: het provinciebestuur daardoor ontoelaatbaar beperkt wordt in zijn inhoudelijke of financiële beleidsruimte;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
  - number: 109.2.b
    text: |-
      de bestuurslasten niet in redelijke verhouding staan tot de te verwachten baten of een aanzienlijk beslag leggen op
      de voor het betrokken beleidsterrein beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
  - number: 109.2.c
    text: |-
      integratie met een bestaand plan of een bestaand beleidsverslag dan wel met de begroting, bedoeld in
      [artikel 193][ref1], of de jaarrekening en het jaarverslag, bedoeld in [artikel 201][ref2], mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel108
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 109.2.d
    text: |-
      het bevorderen van de samenhang in het provinciaal beleid door onderlinge afstemming van onderdelen daarvan
      onmogelijk wordt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
  - number: 109.2.e
    text: het uitsluitend dient tot het verkrijgen van informatie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
  - number: '109.3'
    text: |-
      Indien in een voorstel van wet tot invoering of wijziging van bepalingen waarbij het vaststellen van een
      plan of een beleidsverslag als bedoeld in [artikel 108][ref1] en het ter voorbereiding daarvan volgen van een
      voorgeschreven procedure wordt gevorderd, wordt afgeweken van het bepaalde bij of krachtens [artikel 108][ref2] en
      dit artikel, wordt die afwijking gemotiveerd in de bij het voorstel behorende toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel108
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '110'
    text: |-
      Onze Minister wie het aangaat doet gedeputeerde staten desgevraagd mededeling van zijn standpunten en voornemens
      met betrekking tot aangelegenheden die voor de provincie van belang zijn, tenzij het openbaar belang zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel110
  - number: '111'
    text: |-
      Onze Minister wie het aangaat biedt gedeputeerde staten desgevraagd de gelegenheid tot het plegen van overleg met
      betrekking tot aangelegenheden die voor de provincie van belang zijn, tenzij het openbaar belang zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel111
  - number: '112.1'
    text: |-
      Onze Minister wie het aangaat stelt de betrokken gedeputeerde staten of een instantie die voor hen representatief
      kan worden geacht, zo nodig binnen een te stellen termijn, in de gelegenheid hun oordeel te geven omtrent
      voorstellen van wet, ontwerpen van algemene maatregel van bestuur, of ontwerpen van ministeriële regeling waarbij:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel112
  - number: 112.1.a
    text: van de provinciebesturen regeling of bestuur wordt gevorderd,
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel112
  - number: 112.1.b
    text: in betekenende mate wijziging wordt gebracht in de taken en bevoegdheden van de provinciale besturen, of
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel112
  - number: 112.1.c
    text: de financiën van de provincies in betekenende mate zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel112
  - number: '112.2'
    text: |-
      Voorstellen als bedoeld in het eerste lid bevatten in de bijbehorende toelichting een weergave van de gevolgen
      voor de inrichting en werking van de provincies en een weergave van het in het eerste lid bedoelde oordeel van de
      betrokken gedeputeerde staten of representatieve instantie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel112
  - number: '112.3'
    text: |-
      Onze Minister wie het aangaat is niet verplicht vooraf het in het eerste lid bedoelde oordeel in te winnen indien
      zulks ten gevolge van dringende omstandigheden niet mogelijk is. In dat geval wordt het oordeel zo spoedig mogelijk
      ingewonnen en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel112
  - number: '113.1'
    text: |-
      Een wet waarbij van provinciebesturen regeling of bestuur wordt gevorderd of waarbij in betekenende mate wijziging
      wordt gebracht in taken en bevoegdheden van provinciebesturen, wijkt van het bepaalde in deze wet niet af dan
      wanneer dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel113
  - number: '113.2'
    text: |-
      Het voorstel voor een wet als bedoeld in het eerste lid bevat in de bijbehorende toelichting de gronden voor de
      voorgestelde afwijking.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel113
  - number: '114.1'
    text: |-
      Onze Minister is belast met de coördinatie van het rijksbeleid dat de provincies raakt. Hij bevordert voorts de
      beleidsvrijheid van het provinciebestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel114
  - number: '114.2'
    text: |-
      Over maatregelen en voornemens die van betekenis zijn voor het rijksbeleid inzake de provincies treden Onze
      Ministers onder wier verantwoordelijkheid die maatregelen en voornemens tot stand komen in een vroegtijdig stadium
      in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister maakt bedenkingen kenbaar tegen een maatregel of een voornemen voor zover hem die maatregel of dat
      voornemen met het oog op het door de regering gevoerde decentralisatiebeleid niet toelaatbaar voorkomt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel114
  - number: '115.1'
    text: Onze Minister bevordert de decentralisatie ten behoeve van de provincies.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel115
  - number: '115.2'
    text: |-
      Onverminderd het bepaalde in [artikel 117, tweede lid, van de Gemeentewet][ref1] (*Stb.* 1992, 96), worden
      voorstellen van maatregelen waarbij bepaalde aangelegenheden tot rijksbeleid worden gerekend slechts gedaan indien
      het onderwerp van zorg niet op doelmatige en doeltreffende wijze door de provinciebesturen kan worden behartigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel117
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '117'
  - number: '116'
    text: |-
      Over al hetgeen de provincie betreft dienen gedeputeerde staten Onze Ministers desgevraagd van bericht en raad,
      tenzij dit uitdrukkelijk van de commissaris van de Koning wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel116
  - number: '117.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur worden de gevallen geregeld waarin gedeputeerde
      staten verplicht zijn tot het verstrekken van systematische informatie aan Onze Minister wie het aangaat. Daarbij
      kan worden bepaald dat bij ministeriële regeling nadere voorschriften worden gegeven ten behoeve van de toepassing
      van de wet of de algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel117
  - number: '117.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Economische Zaken, na overleg met Onze
      Minister, kan worden bepaald dat in die maatregel te omschrijven gegevens ten behoeve van statistische doeleinden
      aan het Centraal Bureau voor de Statistiek worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel117
  - number: '117.3'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan worden bij
      algemene maatregel van bestuur nadere algemene regels gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel117
  - number: '117.4'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan, alsmede
      omtrent de verstrekking en inwinning van incidentele informatie, wordt, voorzover dat niet bij wet geschiedt, bij
      algemene maatregel van bestuur aangegeven hoe de financiële gevolgen van de verplichting tot informatieverstrekking
      worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel117
  - number: '117.5'
    text: |-
      De voordrachten voor de algemene maatregelen van bestuur, bedoeld in het derde en het vierde lid, worden gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel117
  - number: '118'
    text: |-
      De bevoegdheid tot het maken van provinciale verordeningen blijft ten aanzien van het onderwerp waarin door
      wetten of algemene maatregelen van bestuur is voorzien, gehandhaafd, voor zover de verordeningen met die wetten en
      algemene maatregelen van bestuur niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel118
  - number: '119'
    text: |-
      De bepalingen van provinciale verordeningen in wier onderwerp door een wet of een algemene maatregel van bestuur
      wordt voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel119
  - number: '120.1'
    text: |-
      Wanneer aan een bestuurscommissie bevoegdheden van provinciale staten zijn overgedragen en de commissie een bij
      of krachtens een andere dan deze wet gevorderde beslissing niet of niet naar behoren neemt, voorzien provinciale
      staten daarin.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel120
  - number: '120.2'
    text: |-
      Wanneer aan een bestuurscommissie bevoegdheden van gedeputeerde staten zijn overgedragen en de commissie een bij
      of krachtens een andere dan deze wet gevorderde beslissing niet of niet naar behoren neemt, voorzien gedeputeerde
      staten daarin.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel120
  - number: '121.1'
    text: |-
      Wanneer provinciale staten, gedeputeerde staten of de commissaris van de Koning een bij of krachtens een andere dan
      deze wet gevorderde beslissing niet of niet naar behoren nemen dan wel een bij of krachtens een andere dan deze wet
      gevorderde handeling niet of niet naar behoren verrichten, of anderszins een bij of krachtens een andere dan deze
      wet gevorderd resultaat niet, niet tijdig of niet naar behoren tot stand brengen, besluit Onze Minister wie het
      aangaat daarin namens provinciale staten, gedeputeerde staten of de commissaris van de Koning te voorzien ten laste
      van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121
  - number: '121.2'
    text: |-
      Spoedeisende gevallen uitgezonderd, voert Onze Minister wie het aangaat het besluit tot indeplaatsstelling niet
      uit dan nadat een in het besluit genoemde termijn is verstreken, waarbinnen provinciale staten, gedeputeerde
      staten of de commissaris van de Koning de gelegenheid hebben alsnog zelf te voorzien in hetgeen het besluit
      vordert. Indien de situatie dermate spoedeisend is dat Onze Minister wie het aangaat de beslissing om over te
      gaan tot indeplaatsstelling niet tevoren op schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor de
      opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121
  - number: '121.3'
    text: |-
      Indien het besluit tot indeplaatsstelling een bij of krachtens een andere dan deze wet gevorderd resultaat betreft
      dat niet tijdig tot stand zal worden gebracht, geeft Onze Minister wie het aangaat in het besluit aan welke
      beslissingen, handelingen of resultaten moeten zijn genomen, verricht of tot stand gebracht binnen de in het tweede
      lid bedoelde termijn. Onze Minister wie het aangaat kan voor verschillende beslissingen, handelingen of resultaten
      een verschillende termijn stellen. Indien provinciale staten, gedeputeerde staten of de commissaris van de Koning
      niet binnen die termijn hebben voorzien in hetgeen het besluit van hen vordert, voorziet Onze Minister wie het
      aangaat verder in het tot stand brengen van het gevorderde resultaat.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121
  - number: '121.4'
    text: |-
      Van een besluit tot indeplaatsstelling, alsmede van het voornemen tot het nemen van een dergelijk besluit, wordt
      mededeling gedaan in een dag-, nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze. Een afschrift
      van het besluit en van het voornemen wordt gezonden aan Onze Minister en provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121
  - number: '121.5'
    text: |-
      Indien meer dan één van Onze Ministers overwegen ten aanzien van dezelfde provincie in met elkaar samenhangende
      beslissingen, handelingen of resultaten toepassing te geven aan het eerste lid, kunnen zij hun bevoegdheden op
      grond van dit artikel aan een van hen overdragen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121
  - number: 121a.1
    text: |-
      Bij de uitvoering van het besluit tot indeplaatsstelling, beschikt Onze Minister wie het aangaat over
      de bevoegdheden waarover provinciale staten, gedeputeerde staten of de commissaris van de Koning bij of
      krachtens deze wet en de andere wet, bedoeld in [artikel 121, eerste lid][ref1] beschikken. In afwijking van
      [artikel 176, eerste lid][ref2], vertegenwoordigt Onze Minister wie het aangaat de provincie zonodig in en buiten
      rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel176
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '121'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '176'
        hoofdstuk: XI
  - number: 121a.2
    text: |-
      Voor zover het provinciebestuur, had hij de bevoegdheden, bedoeld in het eerste lid, zelf uitgeoefend, de kosten
      van de uitvoering in rekening kan brengen bij derden, heeft hij bij die derden verhaal voor de door Onze Minister
      wie het aangaat ten laste van de provincie gebrachte kosten. Het provinciebestuur kan het bedrag invorderen bij
      dwangbevel.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121a
  - number: 121b
    text: |-
      Onze Minister wie het aangaat kan een besluit tot indeplaatsstelling intrekken, indien provinciale staten,
      gedeputeerde staten of de commissaris van de Koning voldoende aannemelijk maken dat zij zonder voorbehoud zullen
      voorzien in hetgeen het besluit van hen vordert.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121b
  - number: 121c
    text: |-
      Onze Minister wie het aangaat kan ambtenaren aanwijzen ten behoeve van het toezicht op de uitvoering van de
      aan het provinciebestuur bij of krachtens andere wet dan deze opgedragen taken. Deze ambtenaren beschikken
      over de bevoegdheden van de [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1]. De
      [artikelen 5:12][ref2], [5:13][ref3] en [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 121d.1
    text: |-
      Indien Onze Minister wie het aangaat bij de uitvoering van het besluit tot indeplaatsstelling namens provinciale
      staten, gedeputeerde staten of de commissaris van de Koning een besluit neemt, kan voor de toepassing van
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] bezwaar worden gemaakt bij Onze Minister wie het aangaat.
      Onze Minister wie het aangaat beslist op het bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 121d.2
    text: |-
      Onze Minister wie het aangaat is de verwerende partij inzake een beroep tegen een namens provinciale staten,
      gedeputeerde staten of de commissaris van de Koning genomen besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121d
  - number: 121d.3
    text: Het provinciebestuur kan geen beroep instellen tegen een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121d
  - number: 121e.1
    text: |-
      Het provinciebestuur werkt mee met de uitvoering van een besluit tot indeplaatsstelling. Onze Minister wie het
      aangaat kan ter zake van de uitvoering van het besluit aanwijzingen geven. Het provinciebestuur stelt op eerste
      vordering van Onze Minister wie het aangaat de voor de uitvoering van het besluit benodigde provincieambtenaren ter
      beschikking en verschaft op eerste vordering van Onze Minister wie het aangaat alle informatie die nodig is voor de
      uitvoering van het besluit tot indeplaatsstelling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121e
  - number: 121e.2
    text: |-
      Onze Minister wie het aangaat kan ambtenaren aanwijzen die ten behoeve van de
      uitvoering van een besluit tot indeplaatsstelling beschikken over de bevoegdheden van de
      [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1]. De [artikelen 5:12][ref2], [5:13][ref3]
      en [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing. Het provinciebestuur
      verschaft de aangewezen ambtenaren desgevraagd de faciliteiten die zij nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 121f
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister, kunnen regels worden gesteld over de
      verstrekking van systematische informatie aan Onze Minister wie het aangaat, betreffende de uitvoering door het
      provinciebestuur van de andere wet, bedoeld in [artikel 121, eerste lid][ref1]. Bij ministeriële regeling kunnen
      nadere regels worden gesteld omtrent de toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel121
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel121f
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '121'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '122.1'
    text: Het provinciebestuur is bevoegd tot oplegging van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel122
  - number: '122.2'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door gedeputeerde staten, indien de
      last dient tot handhaving van regels welke het provinciebestuur uitvoert.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel122
  - number: '122.3'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door de commissaris van de Koning,
      indien de last dient tot handhaving van regels welke hij uitvoert.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel122
  - number: '122.4'
    text: |-
      Een bestuurscommissie waaraan bevoegdheden van provinciale staten of gedeputeerde staten zijn overgedragen, bezit
      de bevoegdheid tot oplegging van een last onder bestuursdwang en de bevoegdheid tot het geven van een machtiging
      tot binnentreden van een woning slechts indien ook die bevoegdheid uitdrukkelijk is overgedragen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel122
  - number: '136.1'
    text: |-
      Besluiten van het provinciebestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer zij
      zijn bekendgemaakt in het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel136
  - number: '136.2'
    text: |-
      De uitgifte van het provinciaal blad geschiedt elektronisch op een algemeen toegankelijke wijze. Na de uitgifte
      blijft het provinciaal blad elektronisch op een algemeen toegankelijke wijze beschikbaar. Indien elektronische
      uitgifte geheel of gedeeltelijk onmogelijk is, voorziet het provinciebestuur in een vervangende uitgave. Bij of
      krachtens algemene maatregel van bestuur worden omtrent het bepaalde in de eerste en tweede volzin nadere regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel136
  - number: '136.3'
    text: |-
      In afwijking van het eerste lid kan een besluit als bedoeld in dat lid bepalen dat een bij het besluit behorende
      bijlage wordt bekendgemaakt door terinzagelegging.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel136
  - number: '136.4'
    text: |-
      Voor het inzien van een overeenkomstig het eerste lid bekendgemaakt besluit worden geen kosten in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel136
  - number: '136.5'
    text: |-
      Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt de dagtekening vermeld van het
      besluit waarbij die goedkeuring is verleend of wordt de mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '137.1'
    text: |-
      De teksten van besluiten van het provinciebestuur die algemeen verbindende voorschriften inhouden, zijn in
      geconsolideerde vorm voor een ieder beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen
      algemeen toegankelijk elektronisch medium.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel137
  - number: '137.2'
    text: |-
      Een geconsolideerde tekst van een besluit die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien het besluit na de beschikbaarstelling is gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel137
  - number: '137.3'
    text: |-
      Onze Minister kan regels stellen over de wijze waarop de in het eerste lid bedoelde teksten beschikbaar worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel137
  - number: '137.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën van besluiten worden aangewezen, waarop het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel137
  - number: '138'
    text: |-
      Een ieder kan op verzoek een papieren afschrift verkrijgen van de besluiten van het provinciebestuur die algemeen
      verbindende voorschriften inhouden. Het afschrift wordt verstrekt tegen ten hoogste de kosten van het maken van
      het afschrift.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel138
  - number: '139'
    text: |-
      De bekendgemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel139
  - number: '140'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende voorschriften inhouden, is het bepaalde in
      de artikelen 136 en 139 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel140
  - number: '141'
    text: |-
      Op termijnen gesteld in een provinciale verordening zijn de artikelen 1 tot en met 4 van de Algemene Termijnenwet
      van overeenkomstige toepassing, tenzij in de verordening anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel141
  - number: '143.1'
    text: |-
      Provinciale verordeningen worden door provinciale staten vastgesteld voor zover de bevoegdheid daartoe niet bij
      de wet of door provinciale staten krachtens de wet aan gedeputeerde staten of de commissaris van de Koning is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143
  - number: '143.2'
    text: |-
      De overige bevoegdheden, bedoeld in [artikel 105, eerste lid][ref1], berusten bij provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel105
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '105'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '143.3'
    text: |-
      De overige bevoegdheden, bedoeld in [artikel 105, tweede lid][ref1], berusten bij gedeputeerde staten, voor zover
      deze niet bij of krachtens de wet aan provinciale staten of de commissaris van de Koning zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel105
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '105'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 143a.1
    text: |-
      Een lid van provinciale staten kan een voorstel voor een verordening of een ander voorstel ter behandeling in
      provinciale staten indienen
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143a
  - number: 143a.2
    text: Provinciale staten regelen op welke wijze een voorstel voor een verordening wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143a
  - number: 143a.3
    text: |-
      Provinciale staten regelen op welke wijze en onder welke voorwaarden een ander voorstel wordt ingediend en
      behandeld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143a
  - number: 143a.4
    text: |-
      Provinciale staten nemen geen besluit over een voorstel dan nadat gedeputeerde staten in de gelegenheid zijn
      gesteld hun wensen en bedenkingen ter kennis van de staten te brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143a
  - number: 143b.1
    text: |-
      Een lid van provinciale staten kan een voorstel tot wijziging van een voor de vergadering van provinciale staten
      geagendeerde ontwerp-verordening of ontwerp-beslissing indienen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143b
  - number: 143b.2
    text: Het tweede lid van artikel 143a is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel143b
  - number: '145'
    text: Provinciale staten maken de verordeningen die zij in het belang van de provincie nodig oordelen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel145
  - number: '146.1'
    text: |-
      Provinciale staten kunnen in hun verordeningen medewerking tot de uitvoering daarvan vorderen van de
      gemeentebesturen of, voor zover het de waterstaat betreft, van de besturen van waterschappen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel146
  - number: '146.2'
    text: |-
      De kosten, verbonden aan de in het eerste lid bedoelde medewerking, worden voor zover zij ten laste van de
      betrokken gemeenten of waterschappen blijven, door de provincie aan hen vergoed.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel146
  - number: '147.1'
    text: |-
      Provinciale staten stellen een verordening vast waarin regels worden gesteld met betrekking tot de wijze waarop
      ingezetenen en belanghebbenden bij de voorbereiding van provinciaal beleid worden betrokken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel147
  - number: '147.2'
    text: |-
      De in het eerste lid bedoelde inspraak wordt verleend door toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], voorzover in de verordening niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '150.1'
    text: |-
      Provinciale staten kunnen op overtreding van hun verordeningen en van die van organen waaraan ingevolge artikel 152
      verordenende bevoegdheid is gedelegeerd, straf stellen maar geen andere of zwaardere dan hechtenis van ten hoogste
      drie maanden of geldboete van de tweede categorie, al dan niet met openbaarmaking van de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel150
  - number: '150.2'
    text: De in het eerste lid bedoelde strafbare feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel150
  - number: '151.1'
    text: |-
      Een lid van provinciale staten kan gedeputeerde staten of de commissaris van de Koning mondeling of schriftelijk
      vragen stellen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151
  - number: '151.2'
    text: |-
      Een lid van provinciale staten kan provinciale staten verlof vragen tot het houden van een interpellatie over een
      onderwerp dat niet staat vermeld op de agenda, bedoeld in [artikel 19, tweede lid][ref1], om gedeputeerde staten of
      de commissaris van de Koning hierover inlichtingen te vragen. Provinciale staten stellen hierover nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '19'
        hoofdstuk: II
  - number: 151a.1
    text: |-
      Provinciale staten kunnen op voorstel van een of meer van hun leden een onderzoek instellen naar het door
      gedeputeerde staten of de commissaris van de Koning gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
  - number: 151a.2
    text: |-
      Het besluit tot het instellen van een onderzoek omvat een omschrijving van het onderwerp van onderzoek alsmede een
      toelichting. Deze omschrijving kan hangende het onderzoek door provinciale staten worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
  - number: 151a.3
    text: |-
      Het onderzoek wordt uitgevoerd door een door provinciale staten in te stellen onderzoekscommissie. De commissie
      heeft ten minste drie leden en bestaat uitsluitend uit leden van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
  - number: 151a.4
    text: |-
      De [artikelen 22][ref1], [80, derde lid][ref2], en [91, eerste lid][ref3], zijn van overeenkomstige toepassing op
      een onderzoekscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel91
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '80'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '91'
        hoofdstuk: V
  - number: 151a.5
    text: |-
      De onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen, indien ten minste drie
      van haar leden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
  - number: 151a.6
    text: |-
      De bevoegdheden en werkzaamheden van een onderzoekscommissie worden niet geschorst door het aftreden van
      provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
  - number: 151a.7
    text: |-
      Op het besluit tot instelling van een onderzoek en tot instelling van een onderzoekscommissie, alsmede het besluit
      tot wijziging van de omschrijving van het onderwerp van onderzoek zijn de [artikelen 136, tweede lid][ref1],
      [137][ref2] en [138][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel138
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '137'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '138'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: 151a.8
    text: |-
      Alvorens provinciale staten besluiten tot een onderzoek, stellen zij bij verordening nadere regels met betrekking
      tot deze onderzoeken. In elk geval worden daarin regels opgenomen over de wijze waarop ambtelijke bijstand wordt
      verleend aan de commissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151a
  - number: 151b.1
    text: |-
      Leden en gewezen leden van provinciale staten, de commissaris van de Koning en gewezen commissarissen van de
      Koning, gedeputeerden en gewezen gedeputeerden, leden en gewezen leden van de door de provinciale staten ingestelde
      rekenkamer, leden en gewezen leden van een door provinciale staten of gedeputeerde staten ingestelde commissie,
      ambtenaren en gewezen ambtenaren, door of vanwege het provinciebestuur aangesteld of daaraan ondergeschikt, zijn
      verplicht te voldoen aan een vordering van de onderzoekscommissie tot het verschaffen van inzage in, het nemen
      van afschrift van of het anderszins laten kennisnemen van alle bescheiden waarover zij beschikken en waarvan naar
      het redelijk oordeel van de onderzoekscommissie inzage, afschrift of kennisneming anderszins voor het doen van een
      onderzoek als bedoeld in [artikel 151a][ref1] nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel151a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 151a
        hoofdstuk: IX
  - number: 151b.2
    text: |-
      Indien een vordering als bedoeld in het eerste lid betrekking heeft op bescheiden die afkomstig zijn van een
      instelling van de Europese Unie of van het Rijk en kennisneming van die bescheiden door de onderzoekscommissie het
      belang van de Europese Unie of van de Staat kan schaden, wordt niet dan met toestemming van Onze Minister aan de
      vordering voldaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151b
  - number: 151b.3
    text: |-
      Ambtenaren, door of vanwege het provinciebestuur aangesteld of daaraan ondergeschikt, zijn gehouden om aan een
      onderzoek als bedoeld in [artikel 151a][ref1] alle door de onderzoekscommissie gevorderde medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel151a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 151a
        hoofdstuk: IX
  - number: 151c.1
    text: |-
      Personen als bedoeld in [artikel 151b, eerste lid][ref1], zijn verplicht te voldoen aan een oproep van de
      onderzoekscommissie om als getuige of deskundige te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel151b
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 151b
        hoofdstuk: IX
  - number: 151c.2
    text: |-
      Een getuige of deskundige die door de onderzoekscommissie wordt gehoord, is niet tevens lid van de
      onderzoekscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.3
    text: De getuigen zijn verplicht getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.4
    text: De deskundigen zijn verplicht hun diensten onpartijdig en naar beste weten als zodanig te verlenen
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.5
    text: |-
      De onderzoekscommissie kan besluiten dat getuigen uitsluitend worden verhoord na het afleggen van een eed of
      belofte. Zij leggen dan in de vergadering van de onderzoekscommissie, in handen van de voorzitter, de eed of
      belofte af dat zij de gehele waarheid en niets dan de waarheid zullen zeggen
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.6
    text: |-
      De getuigen en deskundigen worden in een openbare zitting van de onderzoekscommissie gehoord. Plaats en tijd van de
      openbare zitting worden door de voorzitter tijdig ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.7
    text: |-
      De onderzoekscommissie kan om gewichtige redenen besluiten een verhoor of een gedeelte daarvan niet in het openbaar
      af te nemen. De leden en plaatsvervangende leden van de commissie bewaren geheimhouding over hetgeen hun tijdens
      een besloten zitting ter kennis komt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.8
    text: |-
      Een getuige is gerechtigd zich tijdens het verhoor te laten bijstaan. Om gewichtige redenen kan de commissie
      besluiten, dat een getuige zonder bijstand wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
  - number: 151c.9
    text: |-
      Verklaringen die zijn afgelegd voor de onderzoekscommissie kunnen, behalve in het geval van
      [artikel 207, eerste lid, van het Wetboek van Strafrecht][ref1], niet als bewijs in rechte gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: 151d.1
    text: |-
      Getuigen en deskundigen worden schriftelijk opgeroepen. De brief, houdende de oproep, wordt aangetekend verzonden
      of tegen gedagtekend ontvangstbewijs uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151d
  - number: 151d.2
    text: |-
      De onderzoekscommissie kan bevelen dat getuigen en deskundigen die, hoewel opgeroepen in overeenstemming met
      het eerste lid, niet zijn verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichting te
      voldoen. De onderzoekscommissie stelt de getuige of deskundige hiervan schriftelijk in kennis op de wijze, bedoeld
      in het eerste lid. In de beschikking wordt een termijn gesteld waarbinnen de belanghebbende de tenuitvoerlegging
      kan voorkomen door alsnog aan zijn verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151d
  - number: 151e.1
    text: |-
      Niemand kan genoodzaakt worden aan de onderzoekscommissie geheimen te openbaren, voor zover daardoor onevenredige
      schade zou worden toegebracht aan het belang van de uitoefening van zijn beroep, dan wel aan het belang van zijn
      onderneming of de onderneming waarbij hij werkzaam is of is geweest.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151e
  - number: 151e.2
    text: |-
      Zij die uit hoofde van hun ambt, beroep of betrekking tot geheimhouding verplicht zijn, kunnen zich verschonen
      getuigenis af te leggen, doch uitsluitend met betrekking tot hetgeen waarvan de wetenschap aan hen als zodanig is
      toevertrouwd. Zij kunnen inzage, afschrift of kennisneming anderszins weigeren van bescheiden of gedeelten daarvan
      tot welke hun plicht tot geheimhouding zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151e
  - number: 151e.3
    text: |-
      De commissaris van de Koning en gewezen commissarissen van de Koning, gedeputeerden en gewezen gedeputeerden,
      leden en gewezen leden van een door gedeputeerde staten ingestelde commissie, ambtenaren en gewezen
      ambtenaren, door of vanwege gedeputeerde staten aangesteld of daaraan ondergeschikt, zijn niet verplicht aan
      [artikel 151b, eerste en derde lid][ref1], en [artikel 151c, derde lid][ref2], te voldoen, indien het verstrekken
      van de inlichtingen in strijd is met het openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel151c
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151e
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 151b
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 151c
        hoofdstuk: IX
  - number: 151e.4
    text: |-
      De onderzoekscommissie kan verlangen dat een beroep als bedoeld in het derde lid op strijd met het openbaar
      belang wordt bevestigd door gedeputeerde staten, of, voor zover de inlichtingen betrekking hebben op het door de
      commissaris van de Koning gevoerde bestuur, door de commissaris.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151e
  - number: 151f
    text: |-
      Gedeputeerde staten nemen de door provinciale staten geraamde kosten voor een onderzoek in een bepaald jaar op in
      de ontwerp-begroting.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel151f
  - number: '152.1'
    text: |-
      Provinciale staten kunnen aan gedeputeerde staten en aan een door hen ingestelde bestuurscommissie bevoegdheden
      overdragen, tenzij de aard van de bevoegdheid zich daartegen verzet
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
  - number: '152.2'
    text: 'Provinciale staten kunnen in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
  - number: 152.2.a
    text: |-
      de instelling van een onderzoek als bedoeld in [artikel 151a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel151a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 151a
        hoofdstuk: IX
  - number: 152.2.b
    text: |-
      de vaststelling of wijziging van de begroting, bedoeld in [artikel 193][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 152.2.c
    text: |-
      de vaststelling van de jaarrekening, bedoeld in [artikel 202][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel202
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '202'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 152.2.d
    text: het stellen van straf op overtreding van de provinciale verordeningen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
  - number: 152.2.e
    text: |-
      de vaststelling van de verordeningen, bedoeld in de [artikelen 216, eerste lid][ref1], [217, eerste lid][ref2]
      en [217a, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel217a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '216'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 217a
        hoofdstuk: XIV
  - number: 152.2.f
    text: |-
      de aanwijzing van een of meer accountants, bedoeld in [artikel 217, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
  - number: 152.2.g
    text: |-
      de heffing van andere belastingen dan de rechten, bedoeld in [artikel 223, eerste lid][ref1], en de rechten waarvan
      de heffing krachtens andere wetten dan deze wet geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel223
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '223'
        hoofdstuk: XV
        paragraaf: '2'
  - number: '152.3'
    text: |-
      De bevoegdheid tot het vaststellen van verordeningen, door strafbepaling of bestuursdwang te handhaven, kunnen
      provinciale staten slechts overdragen voor zover het betreft de vaststelling van nadere regels met betrekking tot
      bepaalde door hen in hun verordeningen aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
  - number: '152.4'
    text: |-
      De [artikelen 136, tweede lid][ref1], [137][ref2] en [138][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel138
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '137'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '138'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '153.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van provinciale staten, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge artikel 152 overgedragen bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel153
  - number: '153.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel153
  - number: '155'
    text: Verordeningen, geheel of in hoofdzaak de waterstaat betreffende, worden gezonden aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel155
  - number: '156.1'
    text: Provinciale staten kunnen de naam van de provincie wijzigen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel156
  - number: '156.2'
    text: Het besluit van provinciale staten wordt ter kennis gebracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel156
  - number: '156.3'
    text: Het besluit vermeldt de datum van ingang, die is gelegen ten minste een jaar na de datum van het besluit.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel156
  - number: '158.1'
    text: 'Gedeputeerde staten zijn in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.a
    text: |-
      het dagelijks bestuur van de provincie te voeren, voor zover niet bij of krachtens de wet provinciale staten of de
      commissaris van de Koning hiermee zijn belast;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.b
    text: |-
      beslissingen van provinciale staten voor te bereiden en uit te voeren, tenzij bij of krachtens de wet de
      commissaris hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.c
    text: |-
      regels vast te stellen over de ambtelijke organisatie van de provincie, met uitzondering van de organisatie van
      de griffie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.d
    text: |-
      ambtenaren, niet zijnde de griffier en de op de griffie werkzame ambtenaren, te benoemen, te schorsen en te
      ontslaan;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.e
    text: tot privaatrechtelijke rechtshandelingen van de provincie te besluiten;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.f
    text: |-
      te besluiten namens de provincie, provinciale staten of gedeputeerde staten rechtsgedingen, bezwaarprocedures
      of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te verrichten, tenzij
      provinciale staten, voor zover het provinciale staten aangaat, in voorkomende gevallen anders beslissen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.g
    text: |-
      toezicht te houden op waterstaatswerken, voor zover niet bij de wet het toezicht aan anderen is opgedragen of de
      waterstaatswerken in beheer zijn bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: 158.1.h
    text: ten aanzien van de voorbereiding van de civiele verdediging.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: '158.2'
    text: |-
      Gedeputeerde staten besluiten slechts tot de oprichting van en de deelneming in stichtingen, maatschappen,
      vennootschappen, verenigingen, coöperaties en onderlinge waarborgmaatschappijen, indien dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang. Het besluit wordt
      niet genomen dan nadat provinciale staten een ontwerp-besluit is toegezonden en in de gelegenheid zijn gesteld hun
      wensen en bedenkingen ter kennis van gedeputeerde staten te brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: '158.3'
    text: |-
      Gedeputeerde staten nemen, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doen wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel158
  - number: '163.1'
    text: |-
      Gedeputeerde staten kunnen aan een door hen ingestelde bestuurscommissie bevoegdheden overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel163
  - number: '163.2'
    text: |-
      De [artikelen 136, tweede lid][ref1], [137][ref2] en [138][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel138
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '137'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '138'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '163.3'
    text: |-
      Gedeputeerde staten nemen geen besluit op grond van het eerste lid dan nadat provinciale staten een ontwerpbesluit
      is toegezonden en in de gelegenheid zijn gesteld hun wensen en bedenkingen ter kennis van gedeputeerde staten te
      brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel163
  - number: '165.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van gedeputeerde staten, de uitoefening daarvan en het toezicht
      daarop, zijn ten aanzien van de ingevolge artikel 163 toegekende bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel165
  - number: '165.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel165
  - number: '166.1'
    text: |-
      Gedeputeerde staten kunnen een of meer van hun leden machtigen tot uitoefening van een of meer van hun
      bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel166
  - number: '166.2'
    text: |-
      Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van gedeputeerde
      staten uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel166
  - number: '166.3'
    text: Gedeputeerde staten kunnen te dien aanzien alle aanwijzingen geven die zij nodig achten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel166
  - number: '167.1'
    text: |-
      Gedeputeerde staten en elk van hun leden afzonderlijk zijn aan provinciale staten verantwoording schuldig over het
      door hen gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel167
  - number: '167.2'
    text: |-
      Zij geven provinciale staten alle inlichtingen die provinciale staten voor de uitoefening van hun taak nodig
      hebben.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel167
  - number: '167.3'
    text: |-
      Zij geven provinciale staten mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel167
  - number: '167.4'
    text: |-
      Zij geven provinciale staten vooraf inlichtingen over de uitoefening van de bevoegdheden, bedoeld in
      [artikel 158, eerste lid, onder e, f en h][ref1], indien provinciale staten daarom verzoeken of indien de
      uitoefening ingrijpende gevolgen kan hebben voor de provincie. In het laatste geval nemen gedeputeerde staten geen
      besluit dan nadat provinciale staten hun wensen en bedenkingen terzake ter kennis van gedeputeerde staten hebben
      kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel158
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '158'
        hoofdstuk: X
  - number: '167.5'
    text: |-
      Indien de uitoefening van de bevoegdheid, bedoeld in [artikel 158, eerste lid, onder f][ref1], geen uitstel kan
      lijden, geven zij in afwijking van het vierde lid provinciale staten zo spoedig mogelijk inlichtingen over de
      uitoefening van deze bevoegdheid en het terzake genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel158
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '158'
        hoofdstuk: X
  - number: '168'
    text: |-
      Een door provinciale staten te maken verordening regelt de behandeling door gedeputeerde staten van administratieve
      geschillen, aan hun beslissing onderworpen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel168
  - number: '169.1'
    text: |-
      In aanvulling op [artikel 7:22 van de Algemene wet bestuursrecht][ref1] gelden de volgende bepalingen met
      betrekking tot getuigen en deskundigen die worden gehoord tijdens de behandeling van de geschillen, bedoeld in
      artikel 168.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '169.2'
    text: |-
      Getuigen en deskundigen kunnen al dan niet op verzoek van belanghebbenden door gedeputeerde staten worden
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel169
  - number: '169.3'
    text: |-
      De opgeroepenen zijn verplicht aan de oproeping gevolg te geven. De getuigen zijn verplicht getuigenis af te
      leggen, de deskundigen hun diensten als zodanig te verlenen, een en ander behoudens verschoning wegens ambts-
      of beroepsgeheim. De getuigen leggen de eed of de belofte af dat zij de gehele waarheid en niets dan de waarheid
      zullen spreken, de deskundigen dat zij verslag zullen doen naar hun geweten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel169
  - number: '169.4'
    text: |-
      Gedeputeerde staten kunnen bevelen dat getuigen of deskundigen die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel169
  - number: '169.5'
    text: |-
      Getuigen en deskundigen, door gedeputeerde staten opgeroepen, ontvangen desverlangd uit de provinciale kas een door
      provinciale staten te regelen vergoeding voor reis- en verblijfkosten en tijdsverzuim.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel169
  - number: '170'
    text: |-
      Artikel 169 is eveneens van toepassing in die gevallen waarvoor het provinciebestuur een behandeling op de voet van
      de verordening, bedoeld in artikel 168 heeft voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel170
  - number: '171.1'
    text: |-
      Voor de behandeling van de zaken, bedoeld in de artikelen 168 en 170, vormen gedeputeerde staten uit hun college
      een of meer kamers.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel171
  - number: '171.2'
    text: Elke kamer telt ten minste drie leden, waartoe ook de commissaris van de Koning als voorzitter behoren kan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel171
  - number: '171.3'
    text: Gedeputeerde staten regelen samenstelling en werkzaamheden der kamers.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel171
  - number: '171.4'
    text: |-
      De voorzitter van een kamer kan de behandeling van eenvoudige zaken aan een enkelvoudige kamer, bestaande uit één
      door hem uit de kamer aan te wijzen lid, opdragen. Dit lid is te allen tijde bevoegd, indien naar zijn oordeel de
      zaak niet van eenvoudige aard is, deze naar de bevoegde kamer terug te wijzen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel171
  - number: '171.5'
    text: |-
      Op de behandeling door deze kamers is het bij of krachtens de artikelen 168 en 169 bepaalde van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel171
  - number: '171.6'
    text: |-
      De uitspraken van de meervoudige kamers onderscheidenlijk de enkelvoudige kamers worden getekend door haar
      voorzitter onderscheidenlijk het lid van de kamer en mede ondertekend door degene die als haar griffier optreedt.
      De uitspraken gelden als uitspraken van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel171
  - number: '172.1'
    text: |-
      De voorzitter van een kamer als bedoeld in artikel 171, tweede lid, en het lid van een enkelvoudige kamer kunnen,
      zonder toepassing van de [artikelen 7:16][ref1] en [7:18 tot en met 7:22 van de Algemene wet bestuursrecht][ref2],
      uitspraak doen, indien het verzoek om voorziening kennelijk niet-ontvankelijk is, dan wel indien de verdere
      behandeling van de zaak hen niet nodig voorkomt, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 172.1.a
    text: het verzoek kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: 172.1.b
    text: het aangevallen besluit kennelijk niet in stand kan blijven;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: 172.1.c
    text: |-
      het aangevallen besluit door het bevoegde overheidsorgaan is ingetrokken of gewijzigd, en dit orgaan kennelijk aan
      de bezwaren van de verzoeker is tegemoet gekomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: '172.2'
    text: |-
      Het voornemen om in een zaak op de in het eerste lid bedoelde wijze uitspraak te doen, wordt door de voorzitter
      van een kamer als bedoeld in artikel 171, onderscheidenlijk het lid van een enkelvoudige kamer bekendgemaakt aan de
      belanghebbenden. De bekendmaking bevat een kennisgeving van hetgeen in het derde lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: '172.3'
    text: |-
      Tegen de voorgenomen wijze van afdoening kan de belanghebbende binnen veertien dagen na de bekendmaking van het
      voornemen schriftelijk verzet doen bij gedeputeerde staten indien het een voornemen betreft van de voorzitter van
      een kamer als bedoeld in artikel 171, of, indien het een voornemen betreft van het lid van een enkelvoudige kamer,
      bij de kamer uit welke dat lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: '172.4'
    text: |-
      Alvorens een uitspraak te doen op het verzet, stellen gedeputeerde staten onderscheidenlijk de kamer uit welke het
      lid van een enkelvoudige kamer is aangewezen, de indiener van het verzetschrift die daarom vroeg in de gelegenheid
      in een openbare vergadering te worden gehoord en de stukken die op zijn zaak betrekking hebben in te zien, tenzij
      zij van oordeel zijn dat het verzet gegrond is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: '172.5'
    text: |-
      Al hetgeen verder de indiening en de behandeling van, alsmede de uitspraak op het verzetschrift betreft wordt door
      provinciale staten nader geregeld in de verordening, bedoeld in artikel 168.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel172
  - number: '174'
    text: |-
      Gedeputeerde staten trachten alle geschillen tussen in hun provincie gevestigde gemeenten, waterschappen en
      lichamen, ingesteld bij gemeenschappelijke regeling, in der minne te doen bijleggen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel174
  - number: '175.1'
    text: 'De commissaris ziet toe op:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: 175.1.a
    text: |-
      een tijdige voorbereiding, vaststelling en uitvoering van het provinciaal beleid en van de daaruit voortvloeiende
      besluiten, alsmede op een goede afstemming tussen degenen die bij de voorbereiding, vaststelling en uitvoering
      zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: 175.1.b
    text: een goede samenwerking van de provincie met andere provincies en andere overheden;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: 175.1.c
    text: de kwaliteit van procedures op het vlak van burgerparticipatie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: 175.1.d
    text: een zorgvuldige behandeling van bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: 175.1.e
    text: een zorgvuldige behandeling van klachten door het provinciebestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: '175.2'
    text: De commissaris bevordert de bestuurlijke integriteit van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: '175.3'
    text: De commissaris bevordert overigens een goede behartiging van de provinciale aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel175
  - number: '176.1'
    text: De commissaris vertegenwoordigt de provincie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel176
  - number: '176.2'
    text: |-
      De commissaris kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen
      persoon.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel176
  - number: '179.1'
    text: De commissaris is aan provinciale staten verantwoording schuldig over het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel179
  - number: '179.2'
    text: Hij geeft provinciale staten alle inlichtingen die zij nodig hebben voor de uitoefening van hun taak.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel179
  - number: '179.3'
    text: |-
      Hij geeft provinciale staten mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel179
  - number: '180'
    text: |-
      De artikelen 168 tot en met 170 zijn van overeenkomstige toepassing op de behandeling door de commissaris van
      administratieve geschillen, aan zijn beslissing onderworpen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel180
  - number: '182.1'
    text: 'De commissaris is, volgens regels te stellen bij een door de regering gegeven ambtsinstructie, belast met:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: 182.1.a
    text: |-
      het bevorderen van de samenwerking tussen de in de provincie werkzame rijksambtenaren onderling en met het
      provinciebestuur, de gemeentebesturen en de waterschapsbesturen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: 182.1.b
    text: het regelmatig bezoeken van de gemeenten in de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: 182.1.c
    text: |-
      het adviseren en bemiddelen bij verstoorde bestuurlijke verhoudingen in een gemeente en wanneer de bestuurlijke
      integriteit van een gemeente in het geding is;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: 182.1.d
    text: |-
      het uitbrengen van adviezen aan de regering of aan Onze Ministers over andere onderwerpen dan die bedoeld in
      [artikel 116][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel116
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '116'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: 182.1.e
    text: |-
      de coördinatie van de voorbereiding van de civiele verdediging door de in de provincie werkzame rijksambtenaren,
      het provinciebestuur, de gemeentebesturen en de waterschapsbesturen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: 182.1.f
    text: de bewaring en registratie van aan hem gerichte stukken, verband houdende met zijn ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: '182.2'
    text: |-
      Bij de wet kan de commissaris, volgens regels te stellen bij de in het eerste lid bedoelde ambtsinstructie, worden
      belast met andere dan de in dat lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: '182.3'
    text: |-
      De ambtsinstructie wordt vastgesteld bij algemene maatregel van bestuur. De voordracht wordt gedaan door of mede
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: '182.4'
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
  - number: '182.5'
    text: |-
      De [artikelen 79][ref1] en [179][ref2] zijn niet van toepassing. De commissaris rapporteert Onze Minister periodiek
      over de werkzaamheden die hij ter uitvoering van de ambtsinstructie heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel179
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '79'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '179'
        hoofdstuk: XI
  - number: '182.6'
    text: |-
      Verzoeken op grond van [artikel 3 van de Wet openbaarheid van bestuur][ref1] om toezending van rapportages als
      bedoeld in het vijfde lid, worden uitsluitend behandeld door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel3
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '3'
  - number: '183.1'
    text: |-
      De rekenkamer onderzoekt de doelmatigheid, de doeltreffendheid en de rechtmatigheid van het door het
      provinciebestuur gevoerde bestuur. Een door de rekenkamer ingesteld onderzoek naar de rechtmatigheid van
      het door het provinciebestuur gevoerde bestuur bevat geen controle van de jaarrekening als bedoeld in
      [artikel 217, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
  - number: '183.2'
    text: Op verzoek van provinciale staten kan de rekenkamer een onderzoek instellen
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel183
  - number: '184.1'
    text: |-
      De rekenkamer is bevoegd alle documenten die berusten bij het provinciebestuur te onderzoeken voor zover zij dat
      ter vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel184
  - number: '184.2'
    text: |-
      Het provinciebestuur verstrekt desgevraagd alle inlichtingen die de rekenkamer ter vervulling van haar taak nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel184
  - number: '184.3'
    text: |-
      Indien de zorg voor de administratie aan een derde is uitbesteed, is het eerste lid van overeenkomstige toepassing
      op de administratie van de betrokken derde dan wel van degene die de administratie in opdracht van de derde voert.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel184
  - number: '185.1'
    text: |-
      De rekenkamer heeft de in de volgende leden vermelde bevoegdheden ten aanzien van de volgende instellingen en over
      de volgende periode:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185
  - number: 185.1.a
    text: |-
      openbare lichamen, bedrijfsvoeringsorganisaties en gemeenschappelijke organen ingesteld krachtens de
      [Wet gemeenschappelijke regelingen][ref1] waaraan de provincie deelneemt, over de jaren dat de provincie deelneemt
      in de regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 185.1.b
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan de provincie, alleen of
      samen met andere provincies, meer dan vijftig procent van het geplaatste aandelenkapitaal houdt, over de jaren dat
      de provincie, alleen of samen met andere provincies, meer dan vijftig procent van het geplaatste aandelenkapitaal
      houdt;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185
  - number: 185.1.c
    text: |-
      andere privaatrechtelijke rechtspersonen waaraan de provincie, alleen of samen met andere provincies, of een of
      meer derden voor rekening en risico van de provincie of provincies rechtstreeks of middellijk een subsidie, lening
      of garantie heeft verstrekt ten bedrage van ten minste vijftig procent van de baten van deze instelling, over de
      jaren waarop deze subsidie, lening of garantie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185
  - number: '185.2'
    text: |-
      De rekenkamer is bevoegd bij de betrokken instelling nadere inlichtingen in te winnen over de jaarrekeningen,
      daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en overige documenten met
      betrekking tot die instelling die bij het provinciebestuur berusten. Indien een of meer documenten ontbreken, kan
      de rekenkamer van de betrokken instelling de overlegging daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185
  - number: '185.3'
    text: |-
      Indien de documenten, bedoeld in het tweede lid, daartoe aanleiding geven, kan de rekenkamer bij de betrokken
      instelling dan wel bij de derde die de administratie in opdracht van de instelling voert, een onderzoek instellen.
      De rekenkamer stelt provinciale staten en gedeputeerde staten van haar voornemen een dergelijk onderzoek in te
      stellen in kennis.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185
  - number: 185a
    text: |-
      De rekenkamer is belast met het toezicht op de naleving van [artikel 217, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel185a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
  - number: '186.1'
    text: |-
      De rekenkamer legt haar bevindingen en haar oordeel vast in rapporten, met dien verstande dat hierin niet worden
      opgenomen gegevens en bevindingen die naar hun aard vertrouwelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel186
  - number: '186.2'
    text: |-
      De rekenkamer deelt aan provinciale staten, aan gedeputeerde staten, en, indien van toepassing, aan de betrokken
      instelling, de opmerkingen en bedenkingen mee die zij naar aanleiding van haar bevindingen van belang acht. Aan
      provinciale staten of gedeputeerde staten kan zij ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel186
  - number: '186.3'
    text: De rekenkamer stelt elk jaar voor 1 april een verslag op van haar werkzaamheden over het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel186
  - number: '186.4'
    text: |-
      De rekenkamer zendt een afschrift van haar rapporten en haar verslag aan provinciale staten en gedeputeerde staten.
      Indien zij met toepassing van artikel 185 een onderzoek heeft ingesteld, zendt de rekenkamer tevens een afschrift
      van het rapport aan de betrokken instelling.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel186
  - number: '186.5'
    text: De rapporten en de verslagen van de rekenkamer zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel186
  - number: '190.1'
    text: |-
      De begroting, de begrotingswijzigingen, de meerjarenraming, de jaarrekening en het jaarverslag worden ingericht
      overeenkomstig bij of krachtens algemene maatregel van bestuur te geven regels.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: '190.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden tevens regels gesteld ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: 190.2.a
    text: |-
      door gedeputeerde staten vast te stellen documenten ten behoeve van de uitvoering van de begroting en de
      jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: 190.2.b
    text: |-
      door gedeputeerde staten aan derden te verstrekken informatie op basis van de begroting en de jaarrekening en de
      controle van deze informatie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: '190.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen nadere regels worden gesteld
      ten aanzien van het periodiek verstrekken van informatie voor derden. In overeenstemming met Onze Minister van
      Economische Zaken kan worden bepaald dat de informatie voor derden wordt gezonden aan het Centraal Bureau voor
      de Statistiek.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: '190.4'
    text: |-
      De informatie voor derden, bedoeld in het tweede lid, onderdeel b, wordt gezonden aan Onze
      Minister binnen de termijnen, bedoeld in de [artikelen 195, tweede lid][ref1], en [204][ref2].
      [Artikel 17a, vierde lid, van de Financiële-verhoudingswet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel204
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '195'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '204'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '190.5'
    text: |-
      Indien Onze Minister vaststelt dat de informatie, bedoeld in het tweede lid, onder b, of de informatie, bedoeld in
      het derde lid, voor zover die verstrekt moet worden aan Onze Minister, niet of niet tijdig wordt verstrekt, dan wel
      de kwaliteit van die informatie tekort schiet, doet hij daarvan mededeling aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: '190.6'
    text: |-
      Gedeputeerde staten kunnen tot twee weken voor het verstrijken van de termijnen, bedoeld in het vierde lid,
      schriftelijk en met redenen omkleed, aan Onze Minister verzoeken om uitstel voor de toezending van de informatie,
      tot uiterlijk een in dat verzoek te noemen datum. Onze Minister beslist binnen twee weken op dat verzoek.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: '190.7'
    text: |-
      Indien de informatie, bedoeld in het tweede lid, onder b, of de informatie, bedoeld in het derde lid, voor zover
      die verstrekt moet worden aan Onze Minister, niet of niet tijdig wordt verstrekt, dan wel de kwaliteit van die
      informatie tekort schiet, geeft Onze Minister een aanwijzing aan gedeputeerde staten om binnen tien werkdagen
      alsnog informatie van voldoende kwaliteit te leveren.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
  - number: '190.8'
    text: |-
      Indien gedeputeerde staten nalaten de aanwijzing, bedoeld in het zevende lid, op te volgen,
      kunnen Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Financiën besluiten de
      betalingen op grond van [artikel 15, eerste lid, van de Financiële-verhoudingswet][ref1] aan de
      betreffende provincie geheel of gedeeltelijk op te schorten gedurende ten hoogste zesentwintig weken.
      [Artikel 17b, vierde, vijfde en zesde lid, van de Financiële-verhoudingswet][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17b
  - number: '191'
    text: Aan de provincies kunnen slechts bij of krachtens de wet uitgaven worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel191
  - number: '193.1'
    text: |-
      Voor alle taken en activiteiten brengen provinciale staten jaarlijks op de begroting de bedragen die zij daarvoor
      beschikbaar stellen, alsmede de financiële middelen die zij naar verwachting kunnen aanwenden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel193
  - number: '193.2'
    text: |-
      Provinciale staten zien erop toe dat de begroting structureel en reëel in evenwicht is. Hiervan kunnen zij afwijken
      indien aannemelijk is dat het structureel en reëel evenwicht in de begroting in de eerstvolgende jaren tot stand
      zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel193
  - number: '193.3'
    text: |-
      Behoudens het bepaalde in de [artikelen 212][ref1] en [213][ref2] kunnen ten laste van de provincie slechts
      lasten en daarmee overeenstemmende balansmutaties worden genomen tot de bedragen die hiervoor op de begroting zijn
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel213
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '212'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '213'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '193.4'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel193
  - number: '194.1'
    text: |-
      Gedeputeerde staten bieden jaarlijks, tijdig voor de in artikel 195, eerste lid, bedoelde vaststelling, provinciale
      staten een ontwerp aan voor de begroting met toelichting van de provincie en een meerjarenraming met toelichting
      voor ten minste drie op het begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel194
  - number: '194.2'
    text: |-
      De ontwerp-begroting en de overige in het eerste lid bedoelde stukken liggen, zodra zij aan provinciale
      staten zijn aangeboden, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel194
  - number: '194.3'
    text: Provinciale staten beraadslagen over de ontwerp-begroting niet eerder dan twee weken na de openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel194
  - number: '195.1'
    text: Provinciale staten stellen de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel195
  - number: '195.2'
    text: |-
      Gedeputeerde staten zenden de door provinciale staten vastgestelde begroting vergezeld van de in artikel 194,
      eerste lid, bedoelde stukken binnen twee weken na de vaststelling, doch in ieder geval vóór 15 november van het
      jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel195
  - number: '196.1'
    text: |-
      Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel196
  - number: '196.2'
    text: |-
      De artikelen 194, tweede lid, 195, tweede lid, alsmede, behoudens in gevallen van dringende spoed, artikel 194,
      derde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel196
  - number: '197'
    text: 'Verplichte uitgaven van de provincie zijn:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel197
  - number: 197.a
    text: de renten en aflossingen van de door de provincie aangegane geldleningen en alle overige opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel197
  - number: 197.b
    text: de uitgaven die bij of krachtens de wet aan de provincie zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel197
  - number: 197.c
    text: |-
      de uitgaven die voortvloeien uit de van het provinciale bestuur gevorderde medewerking tot uitvoering van wetten en
      algemene maatregelen van bestuur, voor zover die uitgaven niet ten laste van anderen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel197
  - number: '198.1'
    text: Indien provinciale staten weigeren verplichte uitgaven op de begroting te brengen, doet Onze Minister dit.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel198
  - number: '198.2'
    text: |-
      Indien provinciale staten bovendien weigeren in voldoende dekking van in het eerste lid bedoelde uitgaven te
      voorzien, vermindert Onze Minister daartoe hetzij het bedrag voor onvoorziene uitgaven, hetzij indien dit bedrag
      niet toereikend is, overige niet-verplichte uitgaven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel198
  - number: '199'
    text: |-
      Onze Minister draagt zo nodig aan de bevoegde provinciale ambtenaar de betaling op ten laste van de provincie van
      hetgeen als verplichte uitgaaf op de begroting is gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel199
  - number: '201.1'
    text: |-
      Gedeputeerde staten leggen aan provinciale staten over elk begrotingsjaar verantwoording af over het door hen
      gevoerde bestuur, onder overlegging van de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel201
  - number: '201.2'
    text: |-
      Gedeputeerde staten voegen daarbij de verslagen, bedoeld in [artikel 217a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 217a
        hoofdstuk: XIV
  - number: '201.3'
    text: |-
      Provinciale staten leggen de in het eerste en tweede lid, alsmede de in [artikel 217, derde en vierde lid][ref1],
      bedoelde stukken, wanneer de bespreking daarvan geagendeerd is op de in [artikel 19, tweede lid][ref2]
      bedoelde wijze, voor een ieder ter inzage en stellen ze algemeen verkrijgbaar. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven. Provinciale staten beraadslagen over de jaarrekening en het
      jaarverslag niet eerder dan twee weken na de openbare kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '19'
        hoofdstuk: II
  - number: '202.1'
    text: |-
      Provinciale staten stellen de jaarrekening en het jaarverslag vast in het jaar volgend op het begrotingsjaar. De
      jaarrekening betreft alle baten en lasten van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel202
  - number: '202.2'
    text: |-
      Indien provinciale staten tot het standpunt komen dat de in de jaarrekening opgenomen baten, lasten of
      balansmutaties, die niet rechtmatig tot stand zijn gekomen, aan de vaststelling van de jaarrekening in de weg
      staan, brengen zij dit terstond ter kennis van gedeputeerde staten met vermelding van de gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel202
  - number: '202.3'
    text: |-
      Gedeputeerde staten zenden provinciale staten binnen twee maanden na ontvangst van het standpunt, bedoeld in het
      tweede lid, een voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij provinciale staten
      gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel202
  - number: '202.4'
    text: |-
      Indien gedeputeerde staten een voorstel voor een indemniteitsbesluit hebben gedaan, stellen provinciale staten de
      jaarrekening niet vast dan nadat zij hebben besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel202
  - number: '203'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast de vaststelling van de jaarrekening de leden van
      gedeputeerde staten ten aanzien van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel203
  - number: '204'
    text: |-
      Gedeputeerde staten zenden de vastgestelde jaarrekening en het jaarverslag, vergezeld van de overige in
      [artikel 201][ref1] bedoelde stukken, binnen twee weken na vaststelling, maar in ieder geval vóór 15 juli van het
      jaar, volgend op het begrotingsjaar, aan Onze Minister. Gedeputeerde staten voegen daarbij, indien van toepassing,
      het besluit van provinciale staten over een voorstel voor een indemniteitsbesluit met de reactie van gedeputeerde
      staten, bedoeld in [artikel 202, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel202
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '202'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '205'
    text: |-
      Indien provinciale staten de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststellen,
      zenden gedeputeerde staten de jaarrekening, vergezeld van de overige in [artikel 201][ref1] bedoelde stukken,
      respectievelijk het indemniteitsbesluit ter vaststelling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel201
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '207.1'
    text: |-
      De begroting, bedoeld in [artikel 193][ref1], van het eerstvolgende begrotingsjaar alsmede de daarop betrekking
      hebbende begrotingswijzigingen behoeven de goedkeuring van Onze Minister, indien naar zijn oordeel de begroting,
      bedoeld in [artikel 193][ref2], niet structureel en reëel in evenwicht is en blijkens de meerjarenraming, bedoeld
      in [artikel 194][ref3], niet aannemelijk is dat in de eerstvolgende jaren een structureel en reëel evenwicht tot
      stand zal worden gebracht. Onze Minister doet hiervan vóór de aanvang van het begrotingsjaar mededeling aan het
      provinciebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel194
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '194'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '207.2'
    text: |-
      Onze Minister kan bepalen dat de begroting, bedoeld in [artikel 193][ref1], van het eerstvolgende begrotingsjaar
      alsmede de daarop betrekking hebbende begrotingswijzigingen zijn goedkeuring behoeven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 207.2.a
    text: |-
      de begroting, bedoeld in [artikel 193][ref1], niet tijdig is ingezonden aan Onze Minister overeenkomstig het
      bepaalde in [artikel 195][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel195
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '195'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 207.2.b
    text: |-
      de jaarrekening, bedoeld in [artikel 202, eerste lid][ref1], van het tweede aan het begrotingsjaar voorafgaande
      jaar niet tijdig is ingezonden aan Onze Minister overeenkomstig het bepaalde in [artikel 204, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel202
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel204
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '202'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '204'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '207.3'
    text: |-
      Onze Minister maakt een besluit als bedoeld in het tweede lid voor de aanvang van het begrotingsjaar aan het
      provinciebestuur bekend.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
  - number: '207.4'
    text: |-
      De begroting behoeft geen goedkeuring indien Onze Minister geen mededeling doet als bedoeld in het eerste lid of
      geen besluit bekendmaakt als bedoeld in het tweede lid binnen de in het eerste respectievelijk derde lid genoemde
      termijn.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
  - number: '207.5'
    text: Onze Minister kan het besluit, bedoeld in het eerste lid, gedurende het lopende begrotingsjaar intrekken.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel207
  - number: '209'
    text: |-
      Onze Minister maakt bij de aanvang van het desbetreffende begrotingsjaar door publicatie in de *Staatscourant*
      bekend van welke provincies de begrotingen en begrotingswijzigingen zijn goedkeuring behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel209
  - number: '210'
    text: De goedkeuring kan slechts worden onthouden wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel210
  - number: '211.1'
    text: |-
      Indien op de dag waarop een besluit tot wijziging van de begroting aan Onze Minister wordt aangeboden, de begroting
      nog niet is goedgekeurd, vangt de in [artikel 10:31, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde
      termijn aan op de dag van de goedkeuring van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '211.2'
    text: |-
      Onze Minister kan bij zijn besluit omtrent goedkeuring van de begroting ten aanzien van door hem aan te geven
      soorten van wijzigingen daarvan bepalen dat die zijn goedkeuring niet behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel211
  - number: '212.1'
    text: |-
      Indien de begroting of een besluit tot wijziging daarvan niet is goedgekeurd, behoeft het provinciebestuur tot het
      aangaan van verplichtingen de toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel212
  - number: '212.2'
    text: |-
      Een aanvraag van het provinciebestuur om toepassing van het eerste lid kan door Onze Minister slechts worden
      afgewezen wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel212
  - number: '212.3'
    text: |-
      Onze Minister beslist op de aanvraag binnen twee maanden na de verzending van de aanvraag, bedoeld in het tweede
      lid. De toestemming wordt geacht te zijn verleend indien binnen deze termijn geen besluit aan het provinciale
      bestuur is verzonden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel212
  - number: '212.4'
    text: Onze Minister kan aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel212
  - number: '212.5'
    text: |-
      Onze Minister kan bepalen voor welke posten en tot welk bedrag het provinciebestuur de toestemming, bedoeld in het
      eerste lid, niet behoeft.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel212
  - number: '213.1'
    text: |-
      In gevallen van dringende spoed kan, indien provinciale staten daartoe besluiten, verplichting worden aangegaan
      voordat de desbetreffende begroting of begrotingswijziging is goedgekeurd. Het besluit wordt terstond toegezonden
      aan Onze Minister. Is de aangegane verplichting geraamd bij een begrotingswijziging welke nog niet ter goedkeuring
      is ingezonden, dan wordt deze begrotingswijziging te zamen met het besluit toegezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel213
  - number: '213.2'
    text: Over het in het eerste lid bedoelde besluit stemmen provinciale staten bij hoofdelijke oproeping.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel213
  - number: '214.1'
    text: |-
      Indien provinciale staten artikel 213 hebben toegepast en Onze Minister zijn goedkeuring aan de desbetreffende
      begroting of begrotingswijziging onthoudt, kan hij binnen een maand nadat zijn besluit onherroepelijk is geworden,
      de leden van provinciale staten die hun stem voor het in artikel 213 bedoelde besluit hebben uitgebracht, ieder
      voor een gelijk deel, persoonlijk voor deze verplichting aansprakelijk stellen tegenover de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel214
  - number: '214.2'
    text: |-
      De werking van de beschikking tot aansprakelijkstelling wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel214
  - number: '214.3'
    text: |-
      Onze Minister stelt zo nodig namens en ten laste van de provincie een rechtsvordering in tot betaling van de
      krachtens het besluit tot aansprakelijkstelling verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel214
  - number: '215'
    text: |-
      Indien de begroting van een provincie ingevolge [artikel 207, eerste of tweede lid][ref1], is onderworpen aan
      goedkeuring, kan Onze Minister bepalen dat door hem aan te wijzen beslissingen van het provinciebestuur die
      financiële gevolgen voor de provincie hebben of kunnen hebben, door gedeputeerde staten binnen twee weken aan Onze
      Minister worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel207
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '207'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '216.1'
    text: |-
      Provinciale staten stellen bij verordening de uitgangspunten voor het financiële beleid, alsmede voor het
      financiële beheer en voor de inrichting van de financiële organisatie vast. De verordening waarborgt dat aan de
      eisen van rechtmatigheid, verantwoording en controle wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel216
  - number: '216.2'
    text: 'De verordening bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel216
  - number: 216.2.a
    text: regels voor waardering en afschrijving van activa;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel216
  - number: 216.2.b
    text: |-
      grondslagen voor de berekening van door het provinciebestuur in rekening te brengen prijzen en tarieven voor
      rechten als bedoeld in [artikel 225][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel225
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 216.2.c
    text: regels inzake de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel216
  - number: '217.1'
    text: |-
      Provinciale staten stellen bij verordening regels vast voor de controle op het financiële beheer en op de
      inrichting van de financiële organisatie. Deze verordening waarborgt dat de rechtmatigheid van het financiële
      beheer en van de inrichting van de financiële organisatie wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: '217.2'
    text: |-
      Provinciale staten wijzen een of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 201][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het
      uitbrengen van een verslag van bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel201
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '217.3'
    text: 'De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: 217.3.a
    text: |-
      de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en de samenstelling van het
      vermogen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: 217.3.b
    text: de baten en lasten, alsmede de balansmutaties rechtmatig tot stand zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: 217.3.c
    text: |-
      de jaarrekening is opgesteld overeenkomstig de bij of krachtens algemene maatregel van bestuur te stellen regels,
      bedoeld in [artikel 190][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
        hoofdstuk: XII
  - number: 217.3.d
    text: het jaarverslag met de jaarrekening verenigbaar is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: '217.4'
    text: 'Het verslag van bevindingen bevat in ieder geval bevindingen over:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: 217.4.a
    text: |-
      de vraag of de inrichting van het financiële beheer en van de financiële organisatie een getrouwe en rechtmatige
      verantwoording mogelijk maken en
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: 217.4.b
    text: onrechtmatigheden in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: '217.5'
    text: |-
      De accountant zendt de accountantsverklaring en het verslag van bevindingen aan provinciale staten en een afschrift
      daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: '217.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: '217.7'
    text: |-
      Accountants als bedoeld in het tweede lid kunnen in provinciale dienst worden aangesteld en worden in dat geval
      door provinciale staten benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: '217.8'
    text: |-
      Indien provinciale staten op grond van het tweede lid accountants heeft aangewezen die in provinciale dienst zijn
      aangesteld, is:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
  - number: 217.8.a
    text: |-
      het bepaalde bij en krachtens de [artikelen 25][ref1], [25a][ref2] en
      [27 van de Wet toezicht accountantsorganisaties][ref3] van overeenkomstige toepassing op deze accountants;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '27'
  - number: 217.8.b
    text: |-
      het bepaalde bij en krachtens de [artikelen 14][ref1], [18][ref2], [19][ref3], [20][ref4] en
      [21 van de Wet toezicht accountantsorganisaties][ref5] van overeenkomstige toepassing op de provincie; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel21
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0019468
        artikel: '21'
  - number: 217.8.c
    text: |-
      het bepaalde bij en krachtens de [artikelen 15][ref1] en [16 van de Wet toezicht accountantsorganisaties][ref2]
      van overeenkomstige toepassing op de personen die de dagelijkse leiding hebben over het onderdeel van de provincie
      waarbij de in de aanhef bedoelde accountants werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: '217.9'
    text: |-
      Indien een provincie wordt aangewezen als organisatie van openbaar belang als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Wet toezicht accountantsorganisaties][ref1], zijn de
      [artikelen 22 tot en met 24 van die wet][ref2] van overeenkomstige toepassing op deze provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '22'
  - number: 217a.1
    text: |-
      Gedeputeerde staten verrichten periodiek onderzoek naar de doelmatigheid en de doeltreffendheid van het door hen
      gevoerde bestuur. Provinciale staten stellen bij verordening regels hierover.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217a
  - number: 217a.2
    text: |-
      Gedeputeerde staten brengen schriftelijk verslag uit aan provinciale staten van de resultaten van het periodiek
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217a
  - number: 217a.3
    text: |-
      Gedeputeerde staten stellen de rekenkamer tijdig op de hoogte van de onderzoeken die zij doen instellen en zenden
      haar een afschrift van een verslag als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel217a
  - number: '218'
    text: |-
      Gedeputeerde staten zenden de verordeningen, bedoeld in de [artikelen 216][ref1], [217][ref2] en [217a][ref3],
      binnen twee weken na vaststelling door provinciale staten aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel217a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '216'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 217a
        hoofdstuk: XIV
  - number: '219'
    text: |-
      Onze Minister kan te allen tijde een onderzoek instellen naar het beheer en de inrichting van de financiële
      organisatie, bedoeld in [artikel 216, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel216
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '216'
        hoofdstuk: XIV
  - number: '220'
    text: |-
      Provinciale staten besluiten tot het invoeren, wijzigen of afschaffen van een provinciale belasting door het
      vaststellen van een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel220
  - number: 220a
    text: |-
      Een belastingverordening vermeldt, in de daartoe leidende gevallen, de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, het
      tijdstip van beëindiging van de heffing en hetgeen overigens voor de heffing en de invordering van belang is.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel220a
  - number: '221.1'
    text: |-
      Behalve de provinciale belastingen waarvan de heffing krachtens andere wetten dan deze geschiedt, worden geen
      andere belastingen geheven dan die bedoeld in de tweede paragraaf van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel221
  - number: '221.2'
    text: |-
      Behoudens het bepaalde in andere wetten dan deze en in de tweede paragraaf van dit hoofdstuk kunnen de provinciale
      belastingen worden geheven naar in de belastingverordening te bepalen heffingsmaatstaven, met dien verstande dat
      het bedrag van een provinciale belasting niet afhankelijk mag worden gesteld van het inkomen, de winst of het
      vermogen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel221
  - number: '222.1'
    text: |-
      Er kunnen provinciale opcenten op de hoofdsom van de motorrijtuigenbelasting worden geheven van
      de in de provincie wonende of gevestigde houders van personenauto’s en motorrijwielen, bedoeld in
      [artikel 2, onderdelen b en d][ref1], en [artikel 3 van de Wet op de motorrijtuigenbelasting 1994][ref2] en van
      degenen op wier naam een kenteken als bedoeld in [artikel 62 van die wet][ref3] is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '62'
  - number: '222.2'
    text: Het aantal opcenten bedraagt voor de belastingtijdvakken die na 31 december 2011 aanvangen ten hoogste 111,9.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
  - number: '222.3'
    text: |-
      Voor de berekening van het aan opcenten verschuldigde bedrag wordt uitgegaan van het tarief van de
      [Wet op de motorrijtuigenbelasting 1994][ref1] zoals dat geldt op 1 april 1995, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006324
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
  - number: 222.3.a
    text: |-
      dit tarief voor motorrijwielen wordt vermenigvuldigd met het tarief zoals dat luidt op 1 april 2007 gedeeld door
      het tarief zoals dat luidde op 31 maart 2007;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
  - number: 222.3.b
    text: |-
      dit tarief voor motorrijtuigen, bedoeld in [artikel 30, eerste lid, onderdelen b, c en f][ref1], en
      [artikel 23a, eerste lid, van de Wet op de motorrijtuigenbelasting 1994][ref2], wordt gedeeld door vier;


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: 23a
  - number: 222.3.c
    text: |-
      dit tarief voor motorrijtuigen, bedoeld in
      [artikel 23a, tweede lid, van de Wet op de motorrijtuigenbelasting 1994][ref1], wordt gedeeld door twee; en


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23a
  - number: 222.3.d
    text: |-
      dit tarief voor motorrijtuigen, bedoeld in
      [artikel 23b, eerste lid, onderdeel a, van de Wet op de motorrijtuigenbelasting 1994][ref1], nihil bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23b
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23b
  - number: 222.3.da
    text: |-
      dit tarief voor motorrijtuigen, bedoeld in
      [artikel 23b, eerste lid, onderdeel b, van de Wet op de motorrijtuigenbelasting 1994][ref1], wordt gedeeld door
      twee;


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23b
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23b
  - number: 222.3.e
    text: |-
      buiten beschouwing blijft de verhoging van de belasting, bedoeld in
      [artikel 23, tweede lid, van de Wet op de motorrijtuigenbelasting 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '23'
  - number: 222.3.f
    text: |-
      indien de hoofdsom en de provinciale opcenten zonder toepassing van
      [artikel 84a, tweede lid, van de Wet op de motorrijtuigenbelasting 1994][ref1], samen meer bedragen dan het
      maximum, bedoeld in dat artikel, wordt voor de berekening van de provinciale opcenten, het maximum verminderd met
      de hoofdsom, waarbij het aandeel van de hoofdsom ten hoogste het genoemde maximum kan bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel84a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 84a
  - number: '222.4'
    text: |-
      Vanaf 1 januari 2013 wordt bij het begin van het kalenderjaar het aantal opcenten, genoemd in het tweede
      lid, bij ministeriële regeling van Onze Minister van Financiën vervangen door een ander aantal. Dit aantal
      wordt berekend door het te vervangen aantal te vermenigvuldigen met de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet op de inkomstenbelasting 2001][ref1], en de uitkomst, indien deze twee of meer decimalen
      telt, af te ronden op één decimaal. Indien het aantal opcenten in het voorafgaande jaar is afgerond, wordt de
      tabelcorrectiefactor toegepast op het niet afgeronde bedrag van het voorgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '222.5'
    text: Het aantal opcenten is voor alle motorrijtuigen, bedoeld in het eerste lid, gelijk.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
  - number: '222.6'
    text: |-
      Onze Minister van Financiën verstrekt de provinciale besturen jaarlijks vóór 1 september een naar soort,
      gewichtsklasse en aantal gespecificeerd overzicht van de motorrijtuigen, bedoeld in het eerste lid. Het overzicht
      wordt opgesteld naar de toestand per 1 juli van het lopende jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222
  - number: 222a.1
    text: |-
      Besluiten tot het invoeren, wijzigen of afschaffen van provinciale opcenten op de hoofdsom van de
      motorrijtuigenbelasting treden in werking met ingang van 1 januari van enig jaar. Een desbetreffend besluit wordt
      vóór 1 december van het voorafgaande jaar in afschrift ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222a
  - number: 222a.2
    text: |-
      Een in het eerste lid bedoeld besluit heeft geen gevolgen voor de opcenten die verschuldigd zijn over een tijdvak
      dat vóór de datum van inwerkingtreding van dat besluit is aangevangen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222a
  - number: 222a.3
    text: |-
      Bij naheffing van belasting worden opcenten berekend volgens het hoogste aantal dat in enige provincie van
      toepassing was op de dag waarop de in de [artikelen 33][ref1], [34][ref2], [35][ref3], [36][ref4], [69][ref5] en
      [76 van de Wet op de motorrijtuigenbelasting 1994][ref6] bedoelde feiten zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0006324#Artikel69
      [ref6]: https://wetten.overheid.nl/BWBR0006324#Artikel76
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0006324
        artikel: '36'
      - id: ref5
        bwb_id: BWBR0006324
        artikel: '69'
      - id: ref6
        bwb_id: BWBR0006324
        artikel: '76'
  - number: 222a.4
    text: |-
      De houders van motorrijtuigen die niet hier te lande wonen of gevestigd zijn, maar die wel aan de heffing van
      motorrijtuigenbelasting zijn onderworpen, worden voor de heffing van opcenten geacht te wonen of te zijn gevestigd
      in een provincie die het laagste aantal opcenten heft. In bijzondere gevallen kan Onze Minister van Financiën in
      overeenstemming met Onze Minister ook voor andere houders van motorrijtuigen een provincie aanwijzen waar deze
      houders worden geacht te wonen of te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222a
  - number: 222a.5
    text: |-
      De opbrengsten van de opcenten die worden geheven volgens het derde en vierde lid, worden naar evenredigheid van
      het aandeel van een provincie in de totale opbrengst van de ten behoeve van de provincies geheven opcenten over
      alle provincies verdeeld.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222a
  - number: 222a.6
    text: |-
      Verandering van woonplaats of van plaats van vestiging van de houder van een motorrijtuig in de loop van het
      tijdvak waarover de motorrijtuigenbelasting verschuldigd is, vormt geen aanleiding tot het heffen van opcenten over
      het nog niet verstreken gedeelte van het tijdvak door een andere provincie of tot het verlenen van teruggaaf van
      geheven opcenten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222a
  - number: 222c.1
    text: |-
      Ter zake van het hebben van voorwerpen onder, op of boven voor de openbare dienst bestemde grond van de provincie,
      kan een precariobelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222c
  - number: 222c.2
    text: 'Geen belasting wordt geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222c
  - number: 222c.2.a
    text: |-
      de infrastructuur, bedoeld in [artikel 7, derde lid, van de Drinkwaterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '7'
  - number: 222c.2.b
    text: |-
      een net als bedoeld in [artikel 20, eerste lid, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '20'
  - number: 222c.2.c
    text: |-
      een gastransportnet als bedoeld in [artikel 39a van de Gaswet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel39a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 39a
  - number: 222c.2.d
    text: |-
      werken als bedoeld in [artikel 38 van de Warmtewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel38
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '38'
  - number: '223.1'
    text: 'Rechten kunnen worden geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel223
  - number: 223.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde provinciale bezittingen of van de
      voor de openbare dienst bestemde werken of inrichtingen die bij de provincie in beheer of in onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel223
  - number: 223.1.b
    text: het genot van door of vanwege het provinciebestuur verstrekte diensten.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel223
  - number: '223.2'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de in het eerste lid bedoelde rechten aangemerkt als provinciale
      belastingen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel223
  - number: '224'
    text: |-
      De rechten, bedoeld in artikel 223, eerste lid, kunnen worden geheven door de provincie die het gebruik van de
      bezittingen, werken of inrichtingen toestaat of de diensten verleent, ongeacht of het belastbare feit zich binnen
      of buiten het grondgebied van de provincie voordoet.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel224
  - number: '225.1'
    text: |-
      In verordeningen op grond waarvan rechten als bedoeld in artikel 223, eerste lid, worden geheven, worden de
      tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel225
  - number: '225.2'
    text: 'Onder de in het eerste lid bedoelde lasten worden mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel225
  - number: 225.2.a
    text: bijdragen aan bestemmingsreserves en voorzieningen voor noodzakelijke vervanging van de betrokken activa;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel225
  - number: 225.2.b
    text: |-
      de omzetbelasting die ingevolge de [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het
      fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '226'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in deze paragraaf, nadere
      regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel226
  - number: '227'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227
  - number: 227.a
    text: |-
      Algemene wet: [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 227.b
    text: 'heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op aangifte.'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227
  - number: 227a.1
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde geschieden de heffing en de invordering van provinciale
      belastingen, andere dan die bedoeld in [artikel 222, met toepassing van de Algemene wet](onbekend), de
      [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2] als waren die belastingen
      rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
  - number: 227a.2
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde gelden de bevoegdheden en de verplichtingen
      van de hierna vermelde, in de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde functionarissen, met betrekking tot de provinciale
      belastingen voor de daarachter genoemde colleges of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: 227a.2.a
    text: |-
      Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het college van gedeputeerde
      staten;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
  - number: 227a.2.b
    text: 'de inspecteur: de provincieambtenaar, belast met de heffing van provinciale belastingen;'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
  - number: 227a.2.c
    text: |-
      de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de provincieambtenaar belast met de invordering van
      provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
  - number: 227a.2.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de provincieambtenaren belast met de heffing of de invordering van
      provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
  - number: 227a.2.e
    text: 'de belastingdeurwaarder: de daartoe aangewezen provincieambtenaar;'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
  - number: 227a.2.f
    text: 'de Tweede Kamer der Staten-Generaal of de Tweede Kamer: de provinciale staten.'
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
  - number: 227a.3
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot provinciale belastingen in
      de [Algemene wet][ref1] en in de [Invorderingswet 1990][ref2] voor «algemene maatregel van bestuur» en voor
      «ministeriële regeling» gelezen: besluit van het college van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 227a.4
    text: |-
      Met betrekking tot provinciale belastingen wordt in [artikel 24 van de Invorderingswet 1990][ref1] voor «de Staat»
      gelezen: de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: 227b.1
    text: |-
      Het college van gedeputeerde staten kan bepalen dat voor de toezending of uitreiking van
      aanslagbiljetten ingevolge [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] voor de in
      [artikel 227a, tweede lid, onderdeel c][ref2], bedoelde ambtenaar een andere provincieambtenaar in de plaats
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2
    text: |-
      De colleges van gedeputeerde staten van twee of meer provincies kunnen met betrekking tot een of meer provinciale
      belastingen bepalen dat ambtenaren van een van die provincies worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
  - number: 227b.2.a
    text: |-
      de in [artikel 227a, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2.b
    text: |-
      de in [artikel 227a, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2.c
    text: |-
      de in [artikel 227a, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2.d
    text: |-
      de in [artikel 227a, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van die provincies, voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het college van gedeputeerde staten van de
      provincie waarvan de ambtenaar belast met de invordering van provinciale belastingen op grond van het tweede lid,
      onderdeel b, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
  - number: 227b.4
    text: |-
      Indien voor de heffing of de invordering van provinciale belastingen een gemeenschappelijke regeling is
      getroffen en bij die regeling een openbaar lichaam of een bedrijfsvoeringsorganisatie is ingesteld, kan bij
      of krachtens die regeling worden bepaald dat een daartoe aangewezen ambtenaar van dat openbare lichaam of die
      bedrijfsvoeringsorganisatie wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
  - number: 227b.4.a
    text: |-
      de in [artikel 227a, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.4.b
    text: |-
      de in [artikel 227a, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.4.c
    text: |-
      de in [artikel 227a, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.4.d
    text: |-
      de in artikel [227a, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2018-01-01#Artikel227b
    references:
