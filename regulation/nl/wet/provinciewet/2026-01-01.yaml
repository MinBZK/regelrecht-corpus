    text: |-
      de heffing van andere belastingen dan de rechten, bedoeld in [artikel 223, eerste lid][ref1], en de rechten waarvan
      de heffing krachtens andere wetten dan deze wet geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel223
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '223'
        hoofdstuk: XV
        paragraaf: '2'
  - number: '152.3'
    text: |-
      De bevoegdheid tot het vaststellen van verordeningen, door strafbepaling of bestuursdwang te handhaven, kunnen
      provinciale staten slechts overdragen voor zover het betreft de vaststelling van nadere regels met betrekking tot
      bepaalde door hen in hun verordeningen aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel152
  - number: '152.4'
    text: |-
      [Artikel 19 van de Bekendmakingswet][ref1] is van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '19'
  - number: '153.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van provinciale staten, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge artikel 152 overgedragen bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel153
  - number: '153.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel153
  - number: '155'
    text: Verordeningen, geheel of in hoofdzaak de waterstaat betreffende, worden gezonden aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel155
  - number: '156.1'
    text: Provinciale staten kunnen de naam van de provincie wijzigen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel156
  - number: '156.2'
    text: Het besluit van provinciale staten wordt ter kennis gebracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel156
  - number: '156.3'
    text: Het besluit vermeldt de datum van ingang, die is gelegen ten minste een jaar na de datum van het besluit.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel156
  - number: '158.1'
    text: 'Gedeputeerde staten zijn in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.a
    text: |-
      het dagelijks bestuur van de provincie te voeren, voor zover niet bij of krachtens de wet provinciale staten of de
      commissaris van de Koning hiermee zijn belast;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.b
    text: |-
      beslissingen van provinciale staten voor te bereiden en uit te voeren, tenzij bij of krachtens de wet de
      commissaris hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.c
    text: |-
      regels vast te stellen over de ambtelijke organisatie van de provincie, met uitzondering van de organisatie van
      de griffie;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.d
    text: tot privaatrechtelijke rechtshandelingen van de provincie te besluiten;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.e
    text: |-
      te besluiten namens de provincie, provinciale staten of gedeputeerde staten rechtsgedingen, bezwaarprocedures
      of administratief beroepsprocedures te voeren of handelingen ter voorbereiding daarop te verrichten, tenzij
      provinciale staten, voor zover het provinciale staten aangaat, in voorkomende gevallen anders beslissen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.f
    text: |-
      toezicht te houden op waterstaatswerken, voor zover niet bij de wet het toezicht aan anderen is opgedragen of de
      waterstaatswerken in beheer zijn bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: 158.1.g
    text: ten aanzien van de voorbereiding van de civiele verdediging.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: '158.2'
    text: |-
      Gedeputeerde staten besluiten slechts tot de oprichting van en de deelneming in stichtingen, maatschappen,
      vennootschappen, verenigingen, coöperaties en onderlinge waarborgmaatschappijen, indien dat in het bijzonder
      aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang. Het besluit wordt
      niet genomen dan nadat provinciale staten een ontwerp-besluit is toegezonden en in de gelegenheid zijn gesteld hun
      wensen en bedenkingen ter kennis van gedeputeerde staten te brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: '158.3'
    text: |-
      Gedeputeerde staten nemen, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doen wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel158
  - number: '163.1'
    text: |-
      Gedeputeerde staten kunnen aan een door hen ingestelde bestuurscommissie bevoegdheden overdragen, tenzij de aard
      van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel163
  - number: '163.2'
    text: |-
      [Artikel 19 van de Bekendmakingswet][ref1] is van overeenkomstige toepassing op een besluit dat wordt genomen op
      grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '19'
  - number: '163.3'
    text: |-
      Gedeputeerde staten nemen geen besluit op grond van het eerste lid dan nadat provinciale staten een ontwerpbesluit
      is toegezonden en in de gelegenheid zijn gesteld hun wensen en bedenkingen ter kennis van gedeputeerde staten te
      brengen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel163
  - number: '165.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van gedeputeerde staten, de uitoefening daarvan en het toezicht
      daarop, zijn ten aanzien van de ingevolge artikel 163 toegekende bevoegdheden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel165
  - number: '165.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel165
  - number: '166.1'
    text: |-
      Gedeputeerde staten kunnen een of meer van hun leden machtigen tot uitoefening van een of meer van hun
      bevoegdheden, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel166
  - number: '166.2'
    text: |-
      Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van gedeputeerde
      staten uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel166
  - number: '166.3'
    text: Gedeputeerde staten kunnen te dien aanzien alle aanwijzingen geven die zij nodig achten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel166
  - number: '167.1'
    text: |-
      Gedeputeerde staten en elk van hun leden afzonderlijk zijn aan provinciale staten verantwoording schuldig over het
      door hen gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel167
  - number: '167.2'
    text: |-
      Zij geven provinciale staten alle inlichtingen die provinciale staten voor de uitoefening van hun taak nodig
      hebben.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel167
  - number: '167.3'
    text: |-
      Zij geven provinciale staten mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel167
  - number: '167.4'
    text: |-
      Zij geven provinciale staten vooraf inlichtingen over de uitoefening van de bevoegdheden, bedoeld in
      [artikel 158, eerste lid, onder d, e, en g][ref1], indien provinciale staten daarom verzoeken of indien de
      uitoefening ingrijpende gevolgen kan hebben voor de provincie. In het laatste geval nemen gedeputeerde staten geen
      besluit dan nadat provinciale staten hun wensen en bedenkingen terzake ter kennis van gedeputeerde staten hebben
      kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel158
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '158'
        hoofdstuk: X
  - number: '167.5'
    text: |-
      Indien de uitoefening van de bevoegdheid, bedoeld in [artikel 158, eerste lid, onder e][ref1], geen uitstel kan
      lijden, geven zij in afwijking van het vierde lid provinciale staten zo spoedig mogelijk inlichtingen over de
      uitoefening van deze bevoegdheid en het terzake genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel158
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '158'
        hoofdstuk: X
  - number: '168'
    text: |-
      Een door provinciale staten te maken verordening regelt de behandeling door gedeputeerde staten van administratieve
      geschillen, aan hun beslissing onderworpen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel168
  - number: '169.1'
    text: |-
      In aanvulling op [artikel 7:22 van de Algemene wet bestuursrecht][ref1] gelden de volgende bepalingen met
      betrekking tot getuigen en deskundigen die worden gehoord tijdens de behandeling van de geschillen, bedoeld in
      artikel 168.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '169.2'
    text: |-
      Getuigen en deskundigen kunnen al dan niet op verzoek van belanghebbenden door gedeputeerde staten worden
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel169
  - number: '169.3'
    text: |-
      De opgeroepenen zijn verplicht aan de oproeping gevolg te geven. De getuigen zijn verplicht getuigenis af te
      leggen, de deskundigen hun diensten als zodanig te verlenen, een en ander behoudens verschoning wegens ambts-
      of beroepsgeheim. De getuigen leggen de eed of de belofte af dat zij de gehele waarheid en niets dan de waarheid
      zullen spreken, de deskundigen dat zij verslag zullen doen naar hun geweten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel169
  - number: '169.4'
    text: |-
      Gedeputeerde staten kunnen bevelen dat getuigen of deskundigen die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel169
  - number: '169.5'
    text: |-
      Getuigen en deskundigen, door gedeputeerde staten opgeroepen, ontvangen desverlangd uit de provinciale kas een door
      provinciale staten te regelen vergoeding voor reis- en verblijfkosten en tijdsverzuim.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel169
  - number: '170'
    text: |-
      Artikel 169 is eveneens van toepassing in die gevallen waarvoor het provinciebestuur een behandeling op de voet van
      de verordening, bedoeld in artikel 168 heeft voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel170
  - number: '171.1'
    text: |-
      Voor de behandeling van de zaken, bedoeld in de artikelen 168 en 170, vormen gedeputeerde staten uit hun college
      een of meer kamers.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel171
  - number: '171.2'
    text: Elke kamer telt ten minste drie leden, waartoe ook de commissaris van de Koning als voorzitter behoren kan.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel171
  - number: '171.3'
    text: Gedeputeerde staten regelen samenstelling en werkzaamheden der kamers.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel171
  - number: '171.4'
    text: |-
      De voorzitter van een kamer kan de behandeling van eenvoudige zaken aan een enkelvoudige kamer, bestaande uit één
      door hem uit de kamer aan te wijzen lid, opdragen. Dit lid is te allen tijde bevoegd, indien naar zijn oordeel de
      zaak niet van eenvoudige aard is, deze naar de bevoegde kamer terug te wijzen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel171
  - number: '171.5'
    text: |-
      Op de behandeling door deze kamers is het bij of krachtens de artikelen 168 en 169 bepaalde van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel171
  - number: '171.6'
    text: |-
      De uitspraken van de meervoudige kamers onderscheidenlijk de enkelvoudige kamers worden getekend door haar
      voorzitter onderscheidenlijk het lid van de kamer en mede ondertekend door degene die als haar griffier optreedt.
      De uitspraken gelden als uitspraken van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel171
  - number: '172.1'
    text: |-
      De voorzitter van een kamer als bedoeld in artikel 171, tweede lid, en het lid van een enkelvoudige kamer kunnen,
      zonder toepassing van de [artikelen 7:16][ref1] en [7:18 tot en met 7:22 van de Algemene wet bestuursrecht][ref2],
      uitspraak doen, indien het verzoek om voorziening kennelijk niet-ontvankelijk is, dan wel indien de verdere
      behandeling van de zaak hen niet nodig voorkomt, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 172.1.a
    text: het verzoek kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: 172.1.b
    text: het aangevallen besluit kennelijk niet in stand kan blijven;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: 172.1.c
    text: |-
      het aangevallen besluit door het bevoegde overheidsorgaan is ingetrokken of gewijzigd, en dit orgaan kennelijk aan
      de bezwaren van de verzoeker is tegemoet gekomen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: '172.2'
    text: |-
      Het voornemen om in een zaak op de in het eerste lid bedoelde wijze uitspraak te doen, wordt door de voorzitter
      van een kamer als bedoeld in artikel 171, onderscheidenlijk het lid van een enkelvoudige kamer bekendgemaakt aan de
      belanghebbenden. De bekendmaking bevat een kennisgeving van hetgeen in het derde lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: '172.3'
    text: |-
      Tegen de voorgenomen wijze van afdoening kan de belanghebbende binnen veertien dagen na de bekendmaking van het
      voornemen schriftelijk verzet doen bij gedeputeerde staten indien het een voornemen betreft van de voorzitter van
      een kamer als bedoeld in artikel 171, of, indien het een voornemen betreft van het lid van een enkelvoudige kamer,
      bij de kamer uit welke dat lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: '172.4'
    text: |-
      Alvorens een uitspraak te doen op het verzet, stellen gedeputeerde staten onderscheidenlijk de kamer uit welke het
      lid van een enkelvoudige kamer is aangewezen, de indiener van het verzetschrift die daarom vroeg in de gelegenheid
      in een openbare vergadering te worden gehoord en de stukken die op zijn zaak betrekking hebben in te zien, tenzij
      zij van oordeel zijn dat het verzet gegrond is.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: '172.5'
    text: |-
      Al hetgeen verder de indiening en de behandeling van, alsmede de uitspraak op het verzetschrift betreft wordt door
      provinciale staten nader geregeld in de verordening, bedoeld in artikel 168.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel172
  - number: '174'
    text: |-
      Gedeputeerde staten trachten alle geschillen tussen in hun provincie gevestigde gemeenten, waterschappen en
      lichamen, ingesteld bij gemeenschappelijke regeling, in der minne te doen bijleggen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel174
  - number: '175.1'
    text: 'De commissaris ziet toe op:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: 175.1.a
    text: |-
      een tijdige voorbereiding, vaststelling, uitvoering en evaluatie van het provinciaal beleid en van de daaruit
      voortvloeiende besluiten, alsmede op een goede afstemming tussen degenen die bij de voorbereiding, vaststelling,
      uitvoering en evaluatie zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: 175.1.b
    text: een goede samenwerking van de provincie met andere provincies en andere overheden;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: 175.1.c
    text: de kwaliteit van procedures op het vlak van burgerparticipatie;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: 175.1.d
    text: een zorgvuldige behandeling van bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: 175.1.e
    text: een zorgvuldige behandeling van klachten door het provinciebestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: '175.2'
    text: De commissaris bevordert de bestuurlijke integriteit van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: '175.3'
    text: De commissaris bevordert overigens een goede behartiging van de provinciale aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel175
  - number: '176.1'
    text: De commissaris vertegenwoordigt de provincie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel176
  - number: '176.2'
    text: |-
      De commissaris kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen
      persoon.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel176
  - number: '179.1'
    text: De commissaris is aan provinciale staten verantwoording schuldig over het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel179
  - number: '179.2'
    text: Hij geeft provinciale staten alle inlichtingen die zij nodig hebben voor de uitoefening van hun taak.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel179
  - number: '179.3'
    text: |-
      Hij geeft provinciale staten mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel179
  - number: '180'
    text: |-
      De artikelen 168 tot en met 170 zijn van overeenkomstige toepassing op de behandeling door de commissaris van
      administratieve geschillen, aan zijn beslissing onderworpen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel180
  - number: '182.1'
    text: 'De commissaris is, volgens regels te stellen bij een door de regering gegeven ambtsinstructie, belast met:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: 182.1.a
    text: |-
      het bevorderen van de samenwerking tussen de in de provincie werkzame rijksambtenaren onderling en met het
      provinciebestuur, de gemeentebesturen en de waterschapsbesturen;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: 182.1.b
    text: het regelmatig bezoeken van de gemeenten in de provincie;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: 182.1.c
    text: |-
      het adviseren en bemiddelen bij verstoorde bestuurlijke verhoudingen in een gemeente en wanneer de bestuurlijke
      integriteit van een gemeente in het geding is;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: 182.1.d
    text: |-
      het uitbrengen van adviezen aan de regering of aan Onze Ministers over andere onderwerpen dan die bedoeld in
      [artikel 116][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel116
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '116'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: 182.1.e
    text: |-
      de coördinatie van de voorbereiding van de civiele verdediging door de in de provincie werkzame ambtenaren, in
      dienst van de Staat, het provinciebestuur, de gemeentebesturen en de waterschapsbesturen;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: 182.1.f
    text: de bewaring en registratie van aan hem gerichte stukken, verband houdende met zijn ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: '182.2'
    text: |-
      De commissaris is bij de uitvoering van de taak, bedoeld in het eerste lid, onderdeel c, bevoegd alle vergaderingen
      van het gemeentebestuur bij te wonen en kennis te nemen van alle bescheiden waarover het gemeentebestuur beschikt
      en waarvan naar het redelijk oordeel van de commissaris kennisneming voor het vervullen van die taak nodig is.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: '182.3'
    text: |-
      Bij de wet kan de commissaris, volgens regels te stellen bij de in het eerste lid bedoelde ambtsinstructie, worden
      belast met andere dan de in dat lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: '182.4'
    text: |-
      De ambtsinstructie wordt vastgesteld bij algemene maatregel van bestuur. De voordracht wordt gedaan door of mede
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: '182.5'
    text: |-
      Een krachtens het vierde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee
      maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
  - number: '182.6'
    text: |-
      De [artikelen 79][ref1] en [179][ref2] zijn niet van toepassing. De commissaris rapporteert Onze Minister periodiek
      over de werkzaamheden die hij ter uitvoering van de ambtsinstructie heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel179
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '79'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '179'
        hoofdstuk: XI
  - number: '182.7'
    text: |-
      Verzoeken op grond van [artikel 4.1 van de Wet open overheid][ref1] om openbaarmaking van rapportages als bedoeld
      in het zesde lid, worden uitsluitend behandeld door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel4
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '4'
  - number: '183.1'
    text: |-
      De rekenkamer onderzoekt de doelmatigheid, de doeltreffendheid en de rechtmatigheid van het door het
      provinciebestuur gevoerde beleid. Een door de rekenkamer ingesteld onderzoek naar de rechtmatigheid van
      het door het provinciebestuur gevoerde beleid bevat geen controle van de jaarrekening als bedoeld in
      [artikel 217, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
  - number: '183.2'
    text: Op verzoek van provinciale staten kan de rekenkamer een onderzoek instellen
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel183
  - number: '183.3'
    text: |-
      Bij het uitvoeren van haar taken kan de rekenkamer gebruik maken van de resultaten van door anderen verrichte
      controles, onverminderd haar bevoegdheid tot het verrichten van onderzoek.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel183
  - number: '184.1'
    text: |-
      De rekenkamer is bevoegd alle documenten die berusten bij het provinciebestuur te onderzoeken voor zover zij dat
      ter vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel184
  - number: '184.2'
    text: |-
      Het provinciebestuur verstrekt desgevraagd alle inlichtingen die de rekenkamer ter vervulling van haar taak nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel184
  - number: '184.3'
    text: |-
      Indien de zorg voor de administratie aan een derde is uitbesteed, is het eerste lid van overeenkomstige toepassing
      op de administratie van de betrokken derde dan wel van degene die de administratie in opdracht van de derde voert.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel184
  - number: '185.1'
    text: |-
      De rekenkamer heeft de in de volgende leden vermelde bevoegdheden ten aanzien van de volgende instellingen en over
      de volgende periode:
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: 185.1.a
    text: |-
      openbare lichamen, bedrijfsvoeringsorganisaties en gemeenschappelijke organen ingesteld krachtens de
      [Wet gemeenschappelijke regelingen][ref1] waaraan de provincie deelneemt, over de jaren dat de provincie deelneemt
      in de regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 185.1.b
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan de provincie meer dan
      50% van het geplaatste aandelenkapitaal houdt en naamloze vennootschappen en besloten vennootschappen met beperkte
      aansprakelijkheid waarin de eerstgenoemde naamloze en besloten vennootschappen middellijk of onmiddellijk meer
      dan 50% van het geplaatste aandelenkapitaal houden, over de jaren dat de provincie het geplaatste aandelenkapitaal
      houdt;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: 185.1.c
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan de provincie samen
      met een of meer andere provincies, een of meer gemeenten, een of meer waterschappen of de Staat meer dan 50%
      van het geplaatste aandelenkapitaal houdt en naamloze vennootschappen en besloten vennootschappen met beperkte
      aansprakelijkheid, waarin de eerstgenoemde naamloze en besloten vennootschappen middellijk of onmiddellijk meer
      dan 50% van het geplaatste aandelenkapitaal houden, over de jaren dat de provincie het geplaatste aandelenkapitaal
      houdt;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: 185.1.d
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een
      beroep of bedrijf uitoefenen waaraan de provincie of een of meer derden voor rekening en risico van de provincie
      rechtstreeks of middellijk een subsidie, lening of garantie heeft verstrekt ten laste van de provinciebegroting,
      over de jaren waarop deze subsidie, lening of garantie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: 185.1.e
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een
      beroep of bedrijf uitoefenen die goederen en diensten leveren die betrekking hebben op de uitvoering van een
      publieke taak waarvan de betaling ten laste van de provinciebegroting komt en waarbij de provincie zich het
      recht heeft voorbehouden bij de betreffende rechtspersoon, vennootschap of natuurlijke persoon controles uit te
      voeren ten aanzien van de geleverde goederen of diensten, over de jaren waarin de betaling ten laste komt van de
      provinciebegroting.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: '185.2'
    text: |-
      De rekenkamer maakt bij het onderzoek ten aanzien van de in het eerste lid genoemde instellingen zoveel mogelijk
      gebruik van door anderen verrichte controles.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: '185.3'
    text: |-
      De rekenkamer is bevoegd bij de betrokken instelling nadere inlichtingen in te winnen over de jaarrekeningen,
      daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en overige documenten met
      betrekking tot die instelling die bij het provinciebestuur berusten. Indien een of meer documenten ontbreken, kan
      de rekenkamer van de betrokken instelling de overlegging daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: '185.4'
    text: |-
      Indien de documenten, bedoeld in het derde lid, daartoe aanleiding geven, kan de rekenkamer bij de betrokken
      instelling dan wel bij de derde die de administratie in opdracht van de instelling voert, een onderzoek instellen,
      waaronder een onderzoek naar het gevoerde beleid van de instelling, bedoeld in het eerste lid, onderdeel a. De
      rekenkamer stelt provinciale staten, gedeputeerde staten en indien een onderzoek wordt ingesteld naar het gevoerde
      beleid van een instelling als bedoeld in het eerste lid, onderdeel a, de rekenkamers van de deelnemende provincies,
      gemeenten en waterschappen aan deze instelling van haar voornemen een dergelijk onderzoek in te stellen in kennis.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: '185.5'
    text: |-
      Indien de rekenkamer voornemens is onderzoek in te stellen bij een in het eerste lid, onderdeel c, genoemde
      instelling, stelt zij, onverminderd het vierde lid, de gedeputeerde staten van de andere deelnemende provincies,
      de colleges van de deelnemende gemeenten, het dagelijks bestuur van de deelnemende waterschappen of Onze Minister
      die het aangaat in het geval van deelneming van de Staat van haar voornemen een dergelijk onderzoek in te stellen
      in kennis.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
  - number: '185.6'
    text: |-
      Dit artikel is niet van toepassing op financiële ondernemingen en elektronischgeldinstellingen als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 185a
    text: |-
      De rekenkamer is belast met het toezicht op de naleving van [artikel 217, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel185a
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
  - number: '186.1'
    text: |-
      De rekenkamer legt haar bevindingen en haar oordeel vast in rapporten, met dien verstande dat hierin niet worden
      opgenomen gegevens en bevindingen die naar hun aard vertrouwelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186
  - number: '186.2'
    text: |-
      Voordat de rekenkamer een rapport, bedoeld in het eerste lid, vaststelt, stelt zij in elk geval het onderzochte
      orgaan in de gelegenheid binnen redelijke termijn te reageren op haar bevindingen en voorlopige conclusies.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186
  - number: '186.3'
    text: |-
      Na de vaststelling van het rapport, deelt de rekenkamer aan provinciale staten, aan gedeputeerde staten en, indien
      van toepassing, aan de betrokken instelling, de opmerkingen en bedenkingen mee die zij naar aanleiding van haar
      bevindingen van belang acht. Aan provinciale staten of gedeputeerde staten kan zij ter zake voorstellen doen.
      Mededelingen aan de provinciale staten, die gegevens of bevindingen bevatten die naar hun aard vertrouwelijk zijn,
      kan de rekenkamer ter vertrouwelijke kennisneming verstrekken.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186
  - number: '186.4'
    text: De rekenkamer stelt elk jaar voor 1 april een verslag op van haar werkzaamheden over het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186
  - number: '186.5'
    text: |-
      De rekenkamer zendt een afschrift van haar rapporten en haar verslag aan provinciale staten en gedeputeerde staten.
      Indien zij met toepassing van [artikel 185][ref1] een onderzoek heeft ingesteld, zendt de rekenkamer tevens een
      afschrift van het rapport aan de betrokken instelling. Indien de rekenkamer een onderzoek heeft ingesteld bij een
      vennootschap als bedoeld in artikel 185, eerste lid, onderdeel c, zendt zij tevens een afschrift van het rapport
      ter kennisneming aan de gedeputeerde staten van de andere deelnemende provincies, de colleges van de deelnemende
      gemeenten, de dagelijks besturen van de deelnemende waterschappen of Onze Minister die het aangaat in het geval van
      deelneming van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel185
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '185'
        hoofdstuk: XIA
  - number: '186.6'
    text: De rapporten en de verslagen van de rekenkamer zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186
  - number: 186a
    text: |-
      Gedeputeerde staten zenden provinciale staten jaarlijks een overzicht van de aan gedeputeerde staten gedane
      voorstellen van de rekenkamer, vergezeld van hun standpunt daaromtrent en van de wijze waarop aan de voorstellen
      vervolg is gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel186a
  - number: '190.1'
    text: |-
      De begroting, de begrotingswijzigingen, de meerjarenraming, de jaarrekening en het jaarverslag worden ingericht
      overeenkomstig bij of krachtens algemene maatregel van bestuur te geven regels.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: '190.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden tevens regels gesteld ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: 190.2.a
    text: |-
      door gedeputeerde staten vast te stellen documenten ten behoeve van de uitvoering van de begroting en de
      jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: 190.2.b
    text: |-
      door gedeputeerde staten aan derden te verstrekken informatie op basis van de begroting en de jaarrekening en de
      controle van deze informatie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: '190.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen nadere regels worden gesteld
      ten aanzien van het periodiek verstrekken van informatie voor derden. In overeenstemming met Onze Minister van
      Economische Zaken kan worden bepaald dat de informatie voor derden wordt gezonden aan het Centraal Bureau voor
      de Statistiek.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: '190.4'
    text: |-
      De informatie voor derden, bedoeld in het tweede lid, onderdeel b, wordt gezonden aan Onze
      Minister binnen de termijnen, bedoeld in de [artikelen 195, tweede lid][ref1], en [204][ref2].
      [Artikel 17a, vierde lid, van de Financiële-verhoudingswet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel204
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '195'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '204'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '190.5'
    text: |-
      Indien Onze Minister vaststelt dat de informatie, bedoeld in het tweede lid, onder b, of de informatie, bedoeld in
      het derde lid, voor zover die verstrekt moet worden aan Onze Minister, niet of niet tijdig wordt verstrekt, dan wel
      de kwaliteit van die informatie tekort schiet, doet hij daarvan mededeling aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: '190.6'
    text: |-
      Gedeputeerde staten kunnen tot twee weken voor het verstrijken van de termijnen, bedoeld in het vierde lid,
      schriftelijk en met redenen omkleed, aan Onze Minister verzoeken om uitstel voor de toezending van de informatie,
      tot uiterlijk een in dat verzoek te noemen datum. Onze Minister beslist binnen twee weken op dat verzoek.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: '190.7'
    text: |-
      Indien de informatie, bedoeld in het tweede lid, onder b, of de informatie, bedoeld in het derde lid, voor zover
      die verstrekt moet worden aan Onze Minister, niet of niet tijdig wordt verstrekt, dan wel de kwaliteit van die
      informatie tekort schiet, geeft Onze Minister een aanwijzing aan gedeputeerde staten om binnen tien werkdagen
      alsnog informatie van voldoende kwaliteit te leveren.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
  - number: '190.8'
    text: |-
      Indien gedeputeerde staten nalaten de aanwijzing, bedoeld in het zevende lid, op te volgen,
      kunnen Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Financiën besluiten de
      betalingen op grond van [artikel 15, eerste lid, van de Financiële-verhoudingswet][ref1] aan de
      betreffende provincie geheel of gedeeltelijk op te schorten gedurende ten hoogste zesentwintig weken.
      [Artikel 17b, vierde, vijfde en zesde lid, van de Financiële-verhoudingswet][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17b
  - number: '191'
    text: Aan de provincies kunnen slechts bij of krachtens de wet uitgaven worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel191
  - number: '193.1'
    text: |-
      Voor alle taken en activiteiten brengen provinciale staten jaarlijks op de begroting de bedragen die zij daarvoor
      beschikbaar stellen, alsmede de financiële middelen die zij naar verwachting kunnen aanwenden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel193
  - number: '193.2'
    text: |-
      Provinciale staten zien erop toe dat de begroting structureel en reëel in evenwicht is. Hiervan kunnen zij afwijken
      indien aannemelijk is dat het structureel en reëel evenwicht in de begroting in de eerstvolgende jaren tot stand
      zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel193
  - number: '193.3'
    text: |-
      Behoudens het bepaalde in de [artikelen 212][ref1] en [213][ref2] kunnen ten laste van de provincie slechts
      lasten en daarmee overeenstemmende balansmutaties worden genomen tot de bedragen die hiervoor op de begroting zijn
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel213
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '212'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '213'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '193.4'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel193
  - number: '194.1'
    text: |-
      Gedeputeerde staten bieden jaarlijks, tijdig voor de in artikel 195, eerste lid, bedoelde vaststelling, provinciale
      staten een ontwerp aan voor de begroting met toelichting van de provincie en een meerjarenraming met toelichting
      voor ten minste drie op het begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel194
  - number: '194.2'
    text: |-
      De ontwerp-begroting en de overige in het eerste lid bedoelde stukken liggen, zodra zij aan provinciale
      staten zijn aangeboden, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel194
  - number: '194.3'
    text: Provinciale staten beraadslagen over de ontwerp-begroting niet eerder dan twee weken na de openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel194
  - number: '195.1'
    text: Provinciale staten stellen de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel195
  - number: '195.2'
    text: |-
      Gedeputeerde staten zenden de door provinciale staten vastgestelde begroting vergezeld van de in artikel 194,
      eerste lid, bedoelde stukken binnen twee weken na de vaststelling, doch in ieder geval vóór 15 november van het
      jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel195
  - number: '196.1'
    text: |-
      Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel196
  - number: '196.2'
    text: |-
      De artikelen 194, tweede lid, 195, tweede lid, alsmede, behoudens in gevallen van dringende spoed, artikel 194,
      derde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel196
  - number: '197'
    text: 'Verplichte uitgaven van de provincie zijn:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel197
  - number: 197.a
    text: de renten en aflossingen van de door de provincie aangegane geldleningen en alle overige opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel197
  - number: 197.b
    text: de uitgaven die bij of krachtens de wet aan de provincie zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel197
  - number: 197.c
    text: |-
      de uitgaven die voortvloeien uit de van het provinciale bestuur gevorderde medewerking tot uitvoering van wetten en
      algemene maatregelen van bestuur, voor zover die uitgaven niet ten laste van anderen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel197
  - number: '198.1'
    text: Indien provinciale staten weigeren verplichte uitgaven op de begroting te brengen, doet Onze Minister dit.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel198
  - number: '198.2'
    text: |-
      Indien provinciale staten bovendien weigeren in voldoende dekking van in het eerste lid bedoelde uitgaven te
      voorzien, vermindert Onze Minister daartoe hetzij het bedrag voor onvoorziene uitgaven, hetzij indien dit bedrag
      niet toereikend is, overige niet-verplichte uitgaven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel198
  - number: '199'
    text: |-
      Onze Minister draagt zo nodig aan de bevoegde provinciale ambtenaar de betaling op ten laste van de provincie van
      hetgeen als verplichte uitgaaf op de begroting is gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel199
  - number: '201.1'
    text: |-
      Gedeputeerde staten leggen aan provinciale staten over elk begrotingsjaar verantwoording af over het door hen
      gevoerde bestuur, onder overlegging van de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel201
  - number: '201.2'
    text: |-
      Gedeputeerde staten voegen daarbij de verslagen, bedoeld in [artikel 217a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 217a
        hoofdstuk: XIV
  - number: '201.3'
    text: |-
      Provinciale staten leggen de in het eerste en tweede lid, alsmede de in [artikel 217, derde en vierde lid][ref1],
      bedoelde stukken, wanneer de bespreking daarvan geagendeerd is op de in [artikel 19, tweede lid][ref2]
      bedoelde wijze, voor een ieder ter inzage en stellen ze algemeen verkrijgbaar. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven. Provinciale staten beraadslagen over de jaarrekening en het
      jaarverslag niet eerder dan twee weken na de openbare kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '19'
        hoofdstuk: II
  - number: '202.1'
    text: |-
      Provinciale staten stellen de jaarrekening en het jaarverslag vast in het jaar volgend op het begrotingsjaar. De
      jaarrekening betreft alle baten en lasten van de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel202
  - number: '202.2'
    text: |-
      Indien provinciale staten tot het standpunt komen dat de in de jaarrekening opgenomen baten, lasten of
      balansmutaties, die niet rechtmatig tot stand zijn gekomen, aan de vaststelling van de jaarrekening in de weg
      staan, brengen zij dit terstond ter kennis van gedeputeerde staten met vermelding van de gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel202
  - number: '202.3'
    text: |-
      Gedeputeerde staten zenden provinciale staten binnen twee maanden na ontvangst van het standpunt, bedoeld in het
      tweede lid, een voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij provinciale staten
      gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel202
  - number: '202.4'
    text: |-
      Indien gedeputeerde staten een voorstel voor een indemniteitsbesluit hebben gedaan, stellen provinciale staten de
      jaarrekening niet vast dan nadat zij hebben besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel202
  - number: '203'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast de vaststelling van de jaarrekening de leden van
      gedeputeerde staten ten aanzien van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel203
  - number: '204'
    text: |-
      Gedeputeerde staten zenden de vastgestelde jaarrekening en het jaarverslag, vergezeld van de overige in
      [artikel 201][ref1] bedoelde stukken, binnen twee weken na vaststelling, maar in ieder geval vóór 15 juli van het
      jaar, volgend op het begrotingsjaar, aan Onze Minister. Gedeputeerde staten voegen daarbij, indien van toepassing,
      het besluit van provinciale staten over een voorstel voor een indemniteitsbesluit met de reactie van gedeputeerde
      staten, bedoeld in [artikel 202, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel202
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '202'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '205'
    text: |-
      Indien provinciale staten de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststellen,
      zenden gedeputeerde staten de jaarrekening, vergezeld van de overige in [artikel 201][ref1] bedoelde stukken,
      respectievelijk het indemniteitsbesluit ter vaststelling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel201
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '207.1'
    text: |-
      De begroting, bedoeld in [artikel 193][ref1], van het eerstvolgende begrotingsjaar alsmede de daarop betrekking
      hebbende begrotingswijzigingen behoeven de goedkeuring van Onze Minister, indien naar zijn oordeel de begroting,
      bedoeld in [artikel 193][ref2], niet structureel en reëel in evenwicht is en blijkens de meerjarenraming, bedoeld
      in [artikel 194][ref3], niet aannemelijk is dat in de eerstvolgende jaren een structureel en reëel evenwicht tot
      stand zal worden gebracht. Onze Minister doet hiervan vóór de aanvang van het begrotingsjaar mededeling aan het
      provinciebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel194
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '194'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '207.2'
    text: |-
      Onze Minister kan bepalen dat de begroting, bedoeld in [artikel 193][ref1], van het eerstvolgende begrotingsjaar
      alsmede de daarop betrekking hebbende begrotingswijzigingen zijn goedkeuring behoeven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 207.2.a
    text: |-
      de begroting, bedoeld in [artikel 193][ref1], niet tijdig is ingezonden aan Onze Minister overeenkomstig het
      bepaalde in [artikel 195][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel195
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '193'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '195'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 207.2.b
    text: |-
      de jaarrekening, bedoeld in [artikel 202, eerste lid][ref1], van het tweede aan het begrotingsjaar voorafgaande
      jaar niet tijdig is ingezonden aan Onze Minister overeenkomstig het bepaalde in [artikel 204, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel202
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel204
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '202'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '204'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '207.3'
    text: |-
      Onze Minister maakt een besluit als bedoeld in het tweede lid voor de aanvang van het begrotingsjaar aan het
      provinciebestuur bekend.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
  - number: '207.4'
    text: |-
      De begroting behoeft geen goedkeuring indien Onze Minister geen mededeling doet als bedoeld in het eerste lid of
      geen besluit bekendmaakt als bedoeld in het tweede lid binnen de in het eerste respectievelijk derde lid genoemde
      termijn.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
  - number: '207.5'
    text: Onze Minister kan het besluit, bedoeld in het eerste lid, gedurende het lopende begrotingsjaar intrekken.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel207
  - number: '209'
    text: |-
      Onze Minister maakt bij de aanvang van het desbetreffende begrotingsjaar door publicatie in de *Staatscourant*
      bekend van welke provincies de begrotingen en begrotingswijzigingen zijn goedkeuring behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel209
  - number: '210'
    text: De goedkeuring kan slechts worden onthouden wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel210
  - number: '211.1'
    text: |-
      Indien een besluit is genomen als bedoeld in [artikel 207, eerste of tweede lid][ref1], vangt de termijn, bedoeld
      in [artikel 10:31, eerste lid, van de Algemene wet bestuursrecht][ref2], voor de al ingezonden begroting aan op de
      dag waarop dat besluit is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel207
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '207'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '211.2'
    text: |-
      Indien op de dag waarop een besluit tot wijziging van de begroting aan Onze Minister wordt aangeboden, de begroting
      nog niet is goedgekeurd, vangt de in [artikel 10:31, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde
      termijn aan op de dag van de goedkeuring van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '211.3'
    text: |-
      Onze Minister kan bij zijn besluit omtrent goedkeuring van de begroting ten aanzien van door hem aan te geven
      soorten van wijzigingen daarvan bepalen dat die zijn goedkeuring niet behoeven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel211
  - number: '212.1'
    text: |-
      Indien de begroting of een besluit tot wijziging daarvan niet is goedgekeurd, behoeft het provinciebestuur tot het
      aangaan van verplichtingen de toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel212
  - number: '212.2'
    text: |-
      Een aanvraag van het provinciebestuur om toepassing van het eerste lid kan door Onze Minister slechts worden
      afgewezen wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel212
  - number: '212.3'
    text: |-
      Onze Minister beslist op de aanvraag binnen twee maanden na de verzending van de aanvraag, bedoeld in het tweede
      lid. De toestemming wordt geacht te zijn verleend indien binnen deze termijn geen besluit aan het provinciale
      bestuur is verzonden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel212
  - number: '212.4'
    text: Onze Minister kan aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel212
  - number: '212.5'
    text: |-
      Onze Minister kan bepalen voor welke posten en tot welk bedrag het provinciebestuur de toestemming, bedoeld in het
      eerste lid, niet behoeft.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel212
  - number: '213.1'
    text: |-
      In gevallen van dringende spoed kan, indien provinciale staten daartoe besluiten, verplichting worden aangegaan
      voordat de desbetreffende begroting of begrotingswijziging is goedgekeurd. Het besluit wordt terstond toegezonden
      aan Onze Minister. Is de aangegane verplichting geraamd bij een begrotingswijziging welke nog niet ter goedkeuring
      is ingezonden, dan wordt deze begrotingswijziging te zamen met het besluit toegezonden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel213
  - number: '213.2'
    text: Over het in het eerste lid bedoelde besluit stemmen provinciale staten bij hoofdelijke oproeping.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel213
  - number: '214.1'
    text: |-
      Indien provinciale staten artikel 213 hebben toegepast en Onze Minister zijn goedkeuring aan de desbetreffende
      begroting of begrotingswijziging onthoudt, kan hij binnen een maand nadat zijn besluit onherroepelijk is geworden,
      de leden van provinciale staten die hun stem voor het in artikel 213 bedoelde besluit hebben uitgebracht, ieder
      voor een gelijk deel, persoonlijk voor deze verplichting aansprakelijk stellen tegenover de provincie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel214
  - number: '214.2'
    text: |-
      De werking van de beschikking tot aansprakelijkstelling wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel214
  - number: '214.3'
    text: |-
      Onze Minister stelt zo nodig namens en ten laste van de provincie een rechtsvordering in tot betaling van de
      krachtens het besluit tot aansprakelijkstelling verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel214
  - number: '215'
    text: |-
      Indien de begroting van een provincie ingevolge [artikel 207, eerste of tweede lid][ref1], is onderworpen aan
      goedkeuring, kan Onze Minister bepalen dat door hem aan te wijzen beslissingen van het provinciebestuur die
      financiële gevolgen voor de provincie hebben of kunnen hebben, door gedeputeerde staten binnen twee weken aan Onze
      Minister worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel207
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '207'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '216.1'
    text: |-
      Provinciale staten stellen bij verordening de uitgangspunten voor het financiële beleid, alsmede voor het
      financiële beheer en voor de inrichting van de financiële organisatie vast. De verordening waarborgt dat aan de
      eisen van rechtmatigheid, verantwoording en controle wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel216
  - number: '216.2'
    text: 'De verordening bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel216
  - number: 216.2.a
    text: regels voor waardering en afschrijving van activa;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel216
  - number: 216.2.b
    text: |-
      grondslagen voor de berekening van door het provinciebestuur in rekening te brengen prijzen en tarieven voor
      rechten als bedoeld in [artikel 225][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel225
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 216.2.c
    text: regels inzake de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel216
  - number: '217.1'
    text: |-
      Provinciale staten stellen bij verordening regels vast voor de controle op het financiële beheer en op de
      inrichting van de financiële organisatie. Deze verordening waarborgt dat de rechtmatigheid van het financiële
      beheer en van de inrichting van de financiële organisatie wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: '217.2'
    text: |-
      Provinciale staten wijzen een of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 201][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het
      uitbrengen van een verslag van bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel201
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '201'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '217.3'
    text: 'De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: 217.3.a
    text: |-
      de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en de samenstelling van het
      vermogen;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: 217.3.b
    text: |-
      de baten en lasten, alsmede de balansmutaties met betrekking tot specifieke uitkeringen als bedoeld in
      [artikel 17 van de Financiële-verhoudingswet][ref1] rechtmatig tot stand zijn gekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '17'
  - number: 217.3.c
    text: |-
      de jaarrekening is opgesteld overeenkomstig de bij of krachtens algemene maatregel van bestuur te stellen regels,
      bedoeld in [artikel 190][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel190
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '190'
        hoofdstuk: XII
  - number: 217.3.d
    text: het jaarverslag met de jaarrekening verenigbaar is.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: '217.4'
    text: 'Het verslag van bevindingen bevat in ieder geval bevindingen over:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: 217.4.a
    text: |-
      de vraag of de inrichting van het financiële beheer en van de financiële organisatie een getrouwe en rechtmatige
      verantwoording mogelijk maken en
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: 217.4.b
    text: de tabel van fouten en onzekerheden voor de specifieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: '217.5'
    text: |-
      De accountant zendt de accountantsverklaring en het verslag van bevindingen aan provinciale staten en een afschrift
      daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: '217.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: '217.7'
    text: |-
      Accountants als bedoeld in het tweede lid kunnen in provinciale dienst worden genomen. In dat geval besluiten
      provinciale staten tot het aangaan, wijzigen en beëindigen van de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: '217.8'
    text: |-
      Indien provinciale staten op grond van het tweede lid accountants heeft aangewezen die in provinciale dienst zijn
      genomen, is:
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
  - number: 217.8.a
    text: |-
      het bepaalde bij en krachtens de [artikelen 25][ref1], [25a][ref2] en
      [27 van de Wet toezicht accountantsorganisaties][ref3] van overeenkomstige toepassing op deze accountants;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '27'
  - number: 217.8.b
    text: |-
      het bepaalde bij en krachtens de [artikelen 14][ref1], [18][ref2], [19][ref3], [20][ref4] en
      [21 van de Wet toezicht accountantsorganisaties][ref5] van overeenkomstige toepassing op de provincie; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel21
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0019468
        artikel: '21'
  - number: 217.8.c
    text: |-
      het bepaalde bij en krachtens de [artikelen 15][ref1] en [16 van de Wet toezicht accountantsorganisaties][ref2]
      van overeenkomstige toepassing op de personen die de dagelijkse leiding hebben over het onderdeel van de provincie
      waarbij de in de aanhef bedoelde accountants werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: '217.9'
    text: |-
      Indien een provincie wordt aangewezen als organisatie van openbaar belang als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Wet toezicht accountantsorganisaties][ref1], zijn de
      [artikelen 22 tot en met 24 van die wet][ref2] van overeenkomstige toepassing op deze provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '22'
  - number: 217a.1
    text: |-
      Gedeputeerde staten verrichten periodiek onderzoek naar de doelmatigheid en de doeltreffendheid van het door hen
      gevoerde bestuur. Provinciale staten stellen bij verordening regels hierover.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217a
  - number: 217a.2
    text: |-
      Gedeputeerde staten brengen schriftelijk verslag uit aan provinciale staten van de resultaten van het periodiek
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217a
  - number: 217a.3
    text: |-
      Gedeputeerde staten stellen de rekenkamer tijdig op de hoogte van de onderzoeken die zij doen instellen en zenden
      haar een afschrift van een verslag als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel217a
  - number: '218'
    text: |-
      Gedeputeerde staten zenden de verordeningen, bedoeld in de [artikelen 216][ref1], [217][ref2] en [217a][ref3],
      binnen twee weken na vaststelling door provinciale staten aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel217a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '216'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '217'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 217a
        hoofdstuk: XIV
  - number: '219'
    text: |-
      Onze Minister kan te allen tijde een onderzoek instellen naar het beheer en de inrichting van de financiële
      organisatie, bedoeld in [artikel 216, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel216
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '216'
        hoofdstuk: XIV
  - number: '220'
    text: |-
      Provinciale staten besluiten tot het invoeren, wijzigen of afschaffen van een provinciale belasting door het
      vaststellen van een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel220
  - number: 220a
    text: |-
      Een belastingverordening vermeldt, in de daartoe leidende gevallen, de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, het
      tijdstip van beëindiging van de heffing en hetgeen overigens voor de heffing en de invordering van belang is.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel220a
  - number: '221.1'
    text: |-
      Behalve de provinciale belastingen waarvan de heffing krachtens andere wetten dan deze geschiedt, worden geen
      andere belastingen geheven dan die bedoeld in de tweede paragraaf van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel221
  - number: '221.2'
    text: |-
      Behoudens het bepaalde in andere wetten dan deze en in de tweede paragraaf van dit hoofdstuk kunnen de provinciale
      belastingen worden geheven naar in de belastingverordening te bepalen heffingsmaatstaven, met dien verstande dat
      het bedrag van een provinciale belasting niet afhankelijk mag worden gesteld van het inkomen, de winst of het
      vermogen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel221
  - number: '222.1'
    text: |-
      Er kunnen provinciale opcenten op de hoofdsom van de motorrijtuigenbelasting worden geheven van
      de in de provincie wonende of gevestigde houders van personenauto’s en motorrijwielen, bedoeld in
      [artikel 2, onderdelen b en d][ref1], en [artikel 3 van de Wet op de motorrijtuigenbelasting 1994][ref2] en van
      degenen op wier naam een kenteken als bedoeld in [artikel 62 van die wet][ref3] is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel62
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '62'
  - number: '222.2'
    text: Het aantal opcenten bedraagt voor de belastingtijdvakken die na 31 december 2011 aanvangen ten hoogste 144,00.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
  - number: '222.3'
    text: |-
      Voor de berekening van het aan opcenten verschuldigde bedrag wordt uitgegaan van het tarief van de
      [Wet op de motorrijtuigenbelasting 1994][ref1] zoals dat geldt op 1 april 1995, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006324
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
  - number: 222.3.a
    text: |-
      dit tarief voor motorrijwielen wordt vermenigvuldigd met het tarief zoals dat luidt op 1 april 2007 gedeeld door
      het tarief zoals dat luidde op 31 maart 2007;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
  - number: 222.3.b
    text: |-
      dit tarief voor motorrijtuigen, bedoeld in
      [artikel 30, eerste lid, onderdelen b en c, van de Wet op de motorrijtuigenbelasting 1994][ref1], wordt gedeeld
      door vier;


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel30
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '30'
  - number: 222.3.c
    text: |-
      dit tarief voor motorrijtuigen, bedoeld in [artikel 23a van de Wet op de motorrijtuigenbelasting 1994][ref1], wordt
      gedeeld door twee; en


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23a
  - number: 222.3.d
    text: |-
      dit tarief voor motorrijtuigen als bedoeld in
      [artikel 23b, eerste lid, van de Wet op de motorrijtuigenbelasting 1994][ref1], wordt vermenigvuldigd met het
      percentage, genoemd in dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23b
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 23b
  - number: 222.3.e
    text: |-
      buiten beschouwing blijft de verhoging van de belasting, bedoeld in
      [artikel 23, tweede lid, van de Wet op de motorrijtuigenbelasting 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel23
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '23'
  - number: 222.3.f
    text: |-
      indien de hoofdsom en de provinciale opcenten zonder toepassing van
      [artikel 84a, tweede lid, van de Wet op de motorrijtuigenbelasting 1994][ref1], samen meer bedragen dan het
      maximum, bedoeld in dat artikel, wordt voor de berekening van de provinciale opcenten, het maximum verminderd met
      de hoofdsom, waarbij het aandeel van de hoofdsom ten hoogste het genoemde maximum kan bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel84a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: 84a
  - number: '222.4'
    text: |-
      Vanaf 1 januari 2013 wordt bij het begin van het kalenderjaar het aantal opcenten, genoemd in het tweede
      lid, bij ministeriële regeling van Onze Minister van Financiën vervangen door een ander aantal. Dit aantal
      wordt berekend door het te vervangen aantal te vermenigvuldigen met de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet op de inkomstenbelasting 2001][ref1], en de uitkomst, indien deze twee of meer decimalen
      telt, af te ronden op één decimaal. Indien het aantal opcenten in het voorafgaande jaar is afgerond, wordt de
      tabelcorrectiefactor toegepast op het niet afgeronde bedrag van het voorgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '222.5'
    text: Het aantal opcenten is voor alle motorrijtuigen, bedoeld in het eerste lid, gelijk.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
  - number: '222.6'
    text: |-
      Onze Minister van Financiën verstrekt de provinciale besturen jaarlijks vóór 1 september een naar soort,
      gewichtsklasse en aantal gespecificeerd overzicht van de motorrijtuigen, bedoeld in het eerste lid. Het overzicht
      wordt opgesteld naar de toestand per 1 juli van het lopende jaar.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222
  - number: 222a.1
    text: |-
      Besluiten tot het invoeren, wijzigen of afschaffen van provinciale opcenten op de hoofdsom van de
      motorrijtuigenbelasting treden in werking met ingang van 1 januari van enig jaar. Een desbetreffend besluit wordt
      vóór 1 december van het voorafgaande jaar in afschrift ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222a
  - number: 222a.2
    text: |-
      Een in het eerste lid bedoeld besluit heeft geen gevolgen voor de opcenten die verschuldigd zijn over een tijdvak
      dat vóór de datum van inwerkingtreding van dat besluit is aangevangen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222a
  - number: 222a.3
    text: |-
      Bij naheffing van belasting worden opcenten berekend volgens het hoogste aantal dat in enige provincie van
      toepassing was op de dag waarop de in de [artikelen 33][ref1], [34][ref2], [35][ref3], [36][ref4], [69][ref5] en
      [76 van de Wet op de motorrijtuigenbelasting 1994][ref6] bedoelde feiten zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006324#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006324#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0006324#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0006324#Artikel69
      [ref6]: https://wetten.overheid.nl/BWBR0006324#Artikel76
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222a
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0006324
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0006324
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0006324
        artikel: '36'
      - id: ref5
        bwb_id: BWBR0006324
        artikel: '69'
      - id: ref6
        bwb_id: BWBR0006324
        artikel: '76'
  - number: 222a.4
    text: |-
      De houders van motorrijtuigen die niet hier te lande wonen of gevestigd zijn, maar die wel aan de heffing van
      motorrijtuigenbelasting zijn onderworpen, worden voor de heffing van opcenten geacht te wonen of te zijn gevestigd
      in een provincie die het laagste aantal opcenten heft. In bijzondere gevallen kan Onze Minister van Financiën in
      overeenstemming met Onze Minister ook voor andere houders van motorrijtuigen een provincie aanwijzen waar deze
      houders worden geacht te wonen of te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222a
  - number: 222a.5
    text: |-
      De opbrengsten van de opcenten die worden geheven volgens het derde en vierde lid, worden naar evenredigheid van
      het aandeel van een provincie in de totale opbrengst van de ten behoeve van de provincies geheven opcenten over
      alle provincies verdeeld.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222a
  - number: 222a.6
    text: |-
      Verandering van woonplaats of van plaats van vestiging van de houder van een motorrijtuig in de loop van het
      tijdvak waarover de motorrijtuigenbelasting verschuldigd is, vormt geen aanleiding tot het heffen van opcenten over
      het nog niet verstreken gedeelte van het tijdvak door een andere provincie of tot het verlenen van teruggaaf van
      geheven opcenten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222a
  - number: 222c.1
    text: |-
      Ter zake van het hebben van voorwerpen onder, op of boven voor de openbare dienst bestemde grond van de provincie,
      kan een precariobelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222c
  - number: 222c.2
    text: 'Geen belasting wordt geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222c
  - number: 222c.2.a
    text: |-
      de infrastructuur nodig voor de productie en distributie van drinkwater als bedoeld in
      [artikel 7, eerste lid, onder b][ref1], in samenhang met [artikel 1, eerste lid, van de Drinkwaterwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel1
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '1'
  - number: 222c.2.b
    text: |-
      een systeem dat wordt beheerd door een transmissie- of distributiesysteembeheerder als bedoeld in
      [artikel 1.1 van de Energiewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
  - number: 222c.2.c
    text: |-
      werken als bedoeld in [artikel 38 van de Warmtewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel38
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel222c
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '38'
  - number: '223.1'
    text: 'Rechten kunnen worden geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel223
  - number: 223.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde provinciale bezittingen of van de
      voor de openbare dienst bestemde werken of inrichtingen die bij de provincie in beheer of in onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel223
  - number: 223.1.b
    text: het genot van door of vanwege het provinciebestuur verstrekte diensten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel223
  - number: '223.2'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de in het eerste lid bedoelde rechten aangemerkt als provinciale
      belastingen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel223
  - number: '224'
    text: |-
      De rechten, bedoeld in artikel 223, eerste lid, kunnen worden geheven door de provincie die het gebruik van de
      bezittingen, werken of inrichtingen toestaat of de diensten verleent, ongeacht of het belastbare feit zich binnen
      of buiten het grondgebied van de provincie voordoet.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel224
  - number: '225.1'
    text: |-
      In verordeningen op grond waarvan rechten als bedoeld in artikel 223, eerste lid, worden geheven, worden de
      tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel225
  - number: '225.2'
    text: 'Onder de in het eerste lid bedoelde lasten worden mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel225
  - number: 225.2.a
    text: bijdragen aan bestemmingsreserves en voorzieningen voor noodzakelijke vervanging van de betrokken activa;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel225
  - number: 225.2.b
    text: |-
      de omzetbelasting die ingevolge de [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het
      fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '226'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in deze paragraaf, nadere
      regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel226
  - number: '227'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227
  - number: 227.a
    text: |-
      Algemene wet: [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 227.b
    text: 'heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op aangifte.'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227
  - number: 227a.1
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde geschieden de heffing en de invordering van provinciale
      belastingen, andere dan die bedoeld in [artikel 222, met toepassing van de Algemene wet](onbekend), de
      [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2] als waren die belastingen
      rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
  - number: 227a.2
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde gelden de bevoegdheden en de verplichtingen
      van de hierna vermelde, in de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde functionarissen, met betrekking tot de provinciale
      belastingen voor de daarachter genoemde colleges of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: 227a.2.a
    text: |-
      Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het college van gedeputeerde
      staten;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
  - number: 227a.2.b
    text: 'de inspecteur: de provincieambtenaar, belast met de heffing van provinciale belastingen;'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
  - number: 227a.2.c
    text: |-
      de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de provincieambtenaar belast met de invordering van
      provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
  - number: 227a.2.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de provincieambtenaren belast met de heffing of de invordering van
      provinciale belastingen;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
  - number: 227a.2.e
    text: 'de belastingdeurwaarder: de daartoe aangewezen provincieambtenaar;'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
  - number: 227a.2.f
    text: 'de Tweede Kamer der Staten-Generaal of de Tweede Kamer: de provinciale staten.'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
  - number: 227a.3
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot provinciale belastingen in
      de [Algemene wet][ref1] en in de [Invorderingswet 1990][ref2] voor «algemene maatregel van bestuur» en voor
      «ministeriële regeling» gelezen: besluit van het college van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 227a.4
    text: |-
      Met betrekking tot provinciale belastingen wordt in [artikel 24 van de Invorderingswet 1990][ref1] voor «de Staat»
      gelezen: de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: 227a.5
    text: |-
      Indien een Commissiebesluit als bedoeld in [artikel 1 van de Wet terugvordering staatssteun][ref1] verplicht
      tot terugvordering van staatssteun en die staatssteun voortvloeit uit een provinciale belasting als bedoeld in
      dit hoofdstuk, wordt deze staatssteun op dezelfde wijze teruggevorderd als staatssteun die voortvloeit uit de
      toepassing van een belastingwet als bedoeld in [artikel 20a van de Algemene wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040718#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0040718
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 20a
  - number: 227b.1
    text: |-
      Het college van gedeputeerde staten kan bepalen dat voor de toezending of uitreiking van
      aanslagbiljetten ingevolge [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] voor de in
      [artikel 227a, tweede lid, onderdeel c][ref2], bedoelde ambtenaar een andere provincieambtenaar in de plaats
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2
    text: |-
      De colleges van gedeputeerde staten van twee of meer provincies kunnen met betrekking tot een of meer provinciale
      belastingen bepalen dat ambtenaren van een van die provincies worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
  - number: 227b.2.a
    text: |-
      de in [artikel 227a, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2.b
    text: |-
      de in [artikel 227a, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2.c
    text: |-
      de in [artikel 227a, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van die provincies voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.2.d
    text: |-
      de in [artikel 227a, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van die provincies, voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het college van gedeputeerde staten van de
      provincie waarvan de ambtenaar belast met de invordering van provinciale belastingen op grond van het tweede lid,
      onderdeel b, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
  - number: 227b.4
    text: |-
      Indien voor de heffing of de invordering van provinciale belastingen een gemeenschappelijke regeling is
      getroffen en bij die regeling een openbaar lichaam of een bedrijfsvoeringsorganisatie is ingesteld, kan bij
      of krachtens die regeling worden bepaald dat een daartoe aangewezen ambtenaar van dat openbare lichaam of die
      bedrijfsvoeringsorganisatie wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
  - number: 227b.4.a
    text: |-
      de in [artikel 227a, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.4.b
    text: |-
      de in [artikel 227a, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.4.c
    text: |-
      de in [artikel 227a, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van provinciale belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.4.d
    text: |-
      de in artikel [227a, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van de provincie voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van provinciale belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
        hoofdstuk: XV
        paragraaf: '3'
  - number: 227b.5
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      of het bestuur van de bedrijfsvoeringsorganisatie waarvan een ambtenaar op grond van het vierde lid, onderdeel b,
      wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227b
  - number: 227c
    text: |-
      Provinciale belastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op
      andere wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227c
  - number: 227d.1
    text: |-
      Indien de provinciale belastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke wijze
      deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan daarnaast bepalen dat het college van gedeputeerde staten omtrent de uitvoering van een en
      ander nadere regels geeft.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227d
  - number: 227d.2
    text: |-
      De op andere wijze geheven belastingen worden voor de toepassing van de [Algemene wet][ref1] en de
      [Invorderingswet 1990][ref2] aangemerkt als bij wege van aanslag geheven belastingen, met dien verstande dat wordt
      verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227d
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 227d.2.a
    text: |-
      de aanslag, de voorlopige aanslag, de navorderingsaanslag: het gevorderde, onderscheidenlijk het voorlopig
      gevorderde, het nagevorderde bedrag;
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227d
  - number: 227d.2.b
    text: 'het aanslagbiljet: de kennisgeving van het in onderdeel *a* bedoelde bedrag;'
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227d
  - number: 227d.2.c
    text: |-
      de dagtekening van het aanslagbiljet: de dagtekening van de schriftelijke kennisgeving van het in onderdeel *a*
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel227d
  - number: '228'
    text: |-
      Bij de heffing van provinciale belastingen blijven de [artikelen 2, vierde lid][ref1], [3][ref2],
      [37 tot en met 39][ref3], [47a][ref4], [48][ref5], [52][ref6], [53][ref7], [54][ref8], [55][ref9], [62][ref10],
      [66a][ref11], [66b][ref12], [71][ref13], [76][ref14], [80, tweede, derde en vierde lid][ref15], [82][ref16],
      [84][ref17], [86][ref18], [87][ref19] en [90 tot en met 95 van de Algemene wet][ref20] buiten toepassing. Bij de
      heffing van provinciale belastingen die op andere wijze worden geheven, blijven bovendien de [artikelen 5][ref21],
      [6 tot en met 9][ref22], [11, tweede lid][ref23], en [12][ref24] van die wet buiten toepassing.


