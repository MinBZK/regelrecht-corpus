        artikel: '52'
  - number: 151g.5
    text: |-
      Bij de samenstelling van de gemeenschappelijke onderzoekscommissie, bedoeld in het derde lid, wordt gezorgd voor
      een evenwichtige vertegenwoordiging van de in het openbaar lichaam, bedrijfsvoeringsorganisatie onderscheidenlijk
      gemeenschappelijk orgaan deelnemende gemeenten en provincies.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
  - number: 151g.6
    text: |-
      De regeling waarbij de gemeenschappelijke onderzoekscommissie wordt ingesteld houdt bepalingen in omtrent het
      onderzoek, bedoeld in het eerste lid. In elk geval worden bepalingen opgenomen over de wijze waarop ambtelijke
      bijstand wordt verleend aan de gemeenschappelijke onderzoekscommissie.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
  - number: 151g.7
    text: |-
      De [artikelen 22][ref1] en [91, eerste lid][ref2], zijn van overeenkomstige toepassing op de gemeenschappelijke
      onderzoekscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel91
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '91'
        hoofdstuk: VA
  - number: 151g.8
    text: |-
      De gemeenschappelijke onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen, indien
      ten minste drie van haar leden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
  - number: 151g.9
    text: |-
      De bevoegdheden en werkzaamheden van een gemeenschappelijke onderzoekscommissie worden niet geschorst door het
      aftreden van een van de provinciale staten of raden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
  - number: 151g.10
    text: |-
      Op het besluit tot instelling van een onderzoek en tot instelling van een gemeenschappelijke
      onderzoekscommissie, alsmede het besluit tot wijziging van de omschrijving van het onderwerp van een onderzoek is
      [artikel 19 van de Bekendmakingswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel19
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '19'
  - number: 151g.11
    text: |-
      De [artikelen 10, tweede, derde en vijfde tot en met achtste lid][ref1], [10a][ref2], [11][ref3], [15][ref4],
      [16][ref5], [17][ref6], [20, derde lid][ref7], [21][ref8], [22][ref9], [23][ref10], [30][ref11], [43][ref12]
      en [54 van de Wet gemeenschappelijke regelingen][ref13] zijn niet van toepassing. De overige bepalingen uit
      de [Wet gemeenschappelijke regelingen][ref14] zijn slechts van toepassing voor zover de aard van de aan de
      gemeenschappelijke onderzoekscommissie opgedragen taken zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel10a
