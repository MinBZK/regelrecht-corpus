      politie, in dienst van het openbaar lichaam of de bedrijfsvoeringsorganisatie als bedoeld in [artikel 40][ref6] of
      [51 van de Wet gemeenschappelijke regelingen][ref7] of uit andere hoofde aan het bestuur van het openbaar lichaam
