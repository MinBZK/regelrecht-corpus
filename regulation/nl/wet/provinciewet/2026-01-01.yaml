  - number: 79m.1
    text: |-
      De [artikelen 79b tot en met 79f][ref1], [79h][ref2], [79i][ref3], [79j, eerste, derde en vierde lid][ref4],
      zijn van overeenkomstige toepassing op de gemeenschappelijke rekenkamer, met dien verstande dat in de
      [artikelen 79b tot en met 79d][ref5], [79i, tweede lid][ref6], en [79j, eerste lid][ref7], voor «provinciale
      staten» telkens wordt gelezen «provinciale staten van de deelnemende provincies gezamenlijk» of, indien de
      rekenkamer mede is ingesteld door gemeenten of waterschappen, «provinciale staten, de raden en de algemene besturen
      van de deelnemende provincies, gemeenten en waterschappen gezamenlijk».


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel79b
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel79h
