      ingestelde commissie en ambtenaren en gewezen ambtenaren, onderscheidenlijk ambtenaren van politie en gewezen
      ambtenaren van politie, in dienst van de gemeente of uit andere hoofde aan het gemeentebestuur ondergeschikt,
      indien het een regeling als bedoeld in [artikel 51 van de Wet gemeenschappelijke regelingen][ref3] betreft;


