  - number: 151h.e.3
    text: |-
      De commissaris van de Koning en gewezen commissarissen van de Koning, gedeputeerden en gewezen gedeputeerden,
      leden en gewezen leden van een commissie ingesteld door gedeputeerde staten, het college, de burgemeester,
      of het bestuur van het openbaar lichaam ingesteld bij een regeling als bedoeld in [artikel 40][ref1] of
      [51 van de Wet gemeenschappelijke regelingen][ref2], die uitsluitend of mede is getroffen door gedeputeerde staten,
      commissarissen van de Koning, colleges van burgemeester en wethouders of burgemeesters zijn niet verplicht aan
      [artikel 151b, eerste en derde lid][ref3], en [artikel 151c, derde lid][ref4], te voldoen, indien het verstrekken
      van de inlichtingen in strijd is met het openbaar belang. Dit geldt evenzo voor ambtenaren en gewezen ambtenaren,
      onderscheidenlijk ambtenaren van politie en gewezen ambtenaren van politie, in dienst van de provincie of de
      gemeente of uit andere hoofde aan het bestuur hiervan ondergeschikt en de ambtenaren en gewezen ambtenaren
      in dienst van het openbaar lichaam of de bedrijfsvoeringsorganisatie of uit andere hoofde ondergeschikt aan
      het bestuur daarvan, ingesteld bij een regeling als bedoeld in artikel 40 of 51 van de Wet gemeenschappelijke
      regelingen, die uitsluitend of mede is getroffen door gedeputeerde staten, colleges van burgemeester en wethouders,
      burgemeesters, commissarissen van de Koning, of een combinatie van deze organen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel151b
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel151c
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151h
