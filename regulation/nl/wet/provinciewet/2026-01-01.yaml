        artikel: '51'
      - id: ref5
        bwb_id: BWBR0003740
        artikel: '52'
  - number: 151g.2
    text: |-
      Het eerste lid is niet van toepassing op een regeling die uitsluitend of mede is getroffen door provinciale staten
      of de raden van de deelnemende gemeenten of provincies.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
  - number: 151g.3
    text: |-
      Het besluit tot het instellen van een gemeenschappelijke onderzoekscommissie omvat een omschrijving van
      het onderwerp van onderzoek alsmede een toelichting. Deze omschrijving kan hangende het onderzoek door de
      vertegenwoordigende organen, bedoeld in het eerste lid, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
  - number: 151g.4
    text: |-
      Het onderzoek, bedoeld in het eerste lid, wordt uitgevoerd door een door provinciale staten
      gezamenlijk, met toepassing van de [artikelen 41][ref1] en [42, eerste lid][ref2], juncto
      [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref3], dan wel een door de raden en provinciale
      staten gezamenlijk met toepassing van de [artikelen 51][ref4] en [52, eerste lid][ref5] juncto artikel 8,
      tweede lid, van de Wet gemeenschappelijke regelingen in te stellen gemeenschappelijke onderzoekscommissie.
      De gemeenschappelijke onderzoekscommissie heeft ten minste drie leden en bestaat uitsluitend uit leden van de
      vertegenwoordigende organen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003740#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0003740#Artikel52
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '41'
      - id: ref2
