      dienen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79f
  - number: 79f.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder l, kan een lid van de rekenkamer tevens zijn vrijwilliger of ander
      persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten verricht.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79f
  - number: 79g.1
    text: |-
      Alvorens hun functie uit te kunnen oefenen, leggen de leden van de rekenkamer in de vergadering van provinciale
      staten, in handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om
      tot lid van de rekenkamer benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel
      ook, enige gift of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen
      of te laten, rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer
      (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als
      lid van de rekenkamer naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig! («Dat verklaar en
      beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79g
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 79g.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta lid fan 'e rekkenkeamer beneamd
      te wurden, streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of
      ûnthjitten haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch
      midlik hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze
      sil oan 'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as lid fan 'e rekkenkeamer yn
      alle oprjochtens ferfolje sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79g
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 79h
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de leden van de rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel15
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79h
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '15'
        hoofdstuk: II
  - number: 79i.1
    text: |-
      De rekenkamer stelt een reglement van orde voor haar werkzaamheden vast en, indien zij uit twee of meer leden
      bestaat, tevens voor haar vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79i
  - number: 79i.2
    text: De rekenkamer zendt het reglement ter kennisneming aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79i
  - number: 79j.1
    text: |-
      Provinciale staten stellen, na overleg met de rekenkamer, de rekenkamer de nodige middelen ter beschikking voor een
      goede uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79j
  - number: 79j.2
    text: |-
      Op voordracht van de voorzitter of van het enige lid van de rekenkamer besluiten gedeputeerde staten tot het
      aangaan van arbeidsovereenkomsten met zoveel ambtenaren van de rekenkamer als nodig zijn voor een goede uitoefening
      van haar werkzaamheden. Indien de voordracht een op de griffie werkzame ambtenaar betreft, besluiten provinciale
      staten tot het aangaan van de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79j
  - number: 79j.3
    text: |-
      De ambtenaren die werkzaamheden verrichten voor de rekenkamer, verrichten niet tevens werkzaamheden voor een ander
      orgaan van de provincie, met uitzondering van de op de griffie werkzame ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79j
  - number: 79j.4
    text: |-
      De ambtenaren, die werkzaamheden verrichten voor de rekenkamer, zijn ter zake van die werkzaamheden uitsluitend
      verantwoording schuldig aan de rekenkamer.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79j
  - number: 79k
    text: |-
      De leden van de rekenkamer ontvangen een bij verordening van provinciale staten vastgestelde vergoeding voor hun
      werkzaamheden en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel79k
  - number: 79l
    text: |-
      In afwijking van [artikel 79a][ref1] kunnen provinciale staten met provinciale staten van een of meer
      andere provincies met toepassing van [artikel 40][ref2] en [artikel 41, eerste lid][ref3], juncto
      [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref4], of met de raad of de raden van één of
      meer gemeenten of met het algemeen bestuur of de algemene besturen van een of meer waterschappen, al dan niet
      met provinciale staten van één of meer andere provincies tezamen, met toepassing van [artikel 51][ref5] en
      [artikel 52, eerste lid][ref6], juncto [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref7] een
      gemeenschappelijke rekenkamer instellen. De [artikelen 10, tweede, derde en vijfde tot en met achtste lid][ref8],
      [10a][ref9], [11][ref10], [11a][ref11], [15][ref12], [16][ref13], [17][ref14], [20, derde lid][ref15], [21][ref16],
      [22][ref17], [23][ref18], [43][ref19] en [54 van die wet][ref20] zijn niet van toepassing.


