  - number: 151h
    text: |-
      De [artikelen 151b tot en met 151f][ref1] zijn van overeenkomstige toepassing op de gemeenschappelijke
      onderzoekscommissie, bedoeld in [artikel 151g][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel151g
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel151h
