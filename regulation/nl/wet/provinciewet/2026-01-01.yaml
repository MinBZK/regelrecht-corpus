      [ref23]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref24]: https://wetten.overheid.nl/BWBR0002320#Artikel12
    url: https://wetten.overheid.nl/BWBR0005645/2026-01-01#Artikel228
