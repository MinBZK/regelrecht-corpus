        artikel: '5'
  - number: '7'
    text: |-
      1 De tegemoetkoming in de belastingschade is gelijk aan het bedrag, dat de oesterkweker over de in de
      [artikelen 5][ref1] en [6][ref2] bedoelde tegemoetkomingen en over de overigens met de liquidatie van zijn
      oesterbedrijf behaalde winst in de boekjaren, waartoe onderscheidenlijk behoren 1 januari van de kalenderjaren 1963
      tot en met 1967, meer aan inkomstenbelasting of vennootschapsbelasting moet betalen dan het geval zou zijn geweest,
      indien die tegemoetkomingen en die winst gelijkmatig over een aantal jaren zouden zijn verdeeld.

      2 De belasting over de in de [artikelen 5][ref3] en [6][ref4] bedoelde tegemoetkomingen en over de in het eerste
      lid bedoelde overigens behaalde winst, verschuldigd bij gelijkmatige verdeling overeenkomstig dat lid wordt gesteld
      op acht maal het verschil tussen enerzijds de belasting over de som van:

      a. de gemiddeld over de jaren 1958 tot en met 1962 buiten het oesterbedrijf jaarlijks genoten winsten en inkomsten
      en

      b. de geschatte jaarlijkse opbrengsten van vrijkomend kapitaal en van vrijkomende arbeid, bedoeld in
      [artikel 6][ref5],

      en anderzijds de belasting over de onder *a* en *b* bedoelde bedragen, nadat deze bedragen zijn vermeerderd met
      een tiende deel van de winst, behaald door de toekenning van de in [artikel 5][ref6] bedoelde tegemoetkoming,
      een achtste deel van de in [artikel 6][ref7] bedoelde tegemoetkoming en een tiende deel van de in het eerste lid
      bedoelde overigens behaalde winst.

      3 De in het tweede lid bedoelde belasting wordt berekend naar de omstandigheden en tarieven aan het einde van het
      eerste jaar, waarin de in de [artikelen 5][ref8] en [6][ref9] bedoelde tegemoetkomingen tot de fiscale winst van
      de oesterkweker bijdragen.


