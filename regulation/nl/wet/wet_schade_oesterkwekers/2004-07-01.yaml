  - number: '11'
    text: |-
      De uitbetaling van de tegemoetkoming in de vermogensschade en over deze tegemoetkoming betaalbaar gestelde
      wettelijke rente of van een voorschot daarop ten aanzien van de met hypotheek of pand bezwaarde goederen en
      de in [artikel 5, tweede lid][ref1], bedoelde zaken geschiedt niet dan overeenkomstig een regeling, die tussen
      de oesterkweker en de hypotheek- of pandhouder, onderscheidenlijk de huurverkoper is tot stand gekomen of op
      verzoek van één van partijen door Onze Minister is vastgesteld. Onze Minister let bij deze vaststelling op de
      waardevermindering van het goed en op het belang dat de hypotheek- of pandhouder, onderscheidenlijk de huurverkoper
      bij het goed hebben. Een afschrift van de beschikking tot vaststelling van een regeling als bedoeld in dit artikel
      wordt bij aangetekende brief aan partijen toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002538#Artikel5
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel11
