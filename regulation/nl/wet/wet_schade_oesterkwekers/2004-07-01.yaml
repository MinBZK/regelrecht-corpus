preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat voor oesterkwekers een regeling van de tegemoetkoming in de schade, als
    bedoeld in artikel 8 van de Deltawet, dient te worden vastgesteld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      1e. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      2e. oesterkweker: de huurder van een in de Zeeuwse stromen gelegen en voor de oesterteelt gebezigd visserijperceel,
      degene die met toestemming van het bestuur der Visserijen op de Zeeuwse Stromen in de plaats van de huurder
      het feitelijk genot van een zodanig visserijperceel geheel of ten dele heeft, de vennoot van een maatschap tot
      uitoefening van een oesterbedrijf, wiens medevennoot huurder is van een zodanig visserijperceel en de winner van
      oesterbroed;

      3e. oesterbedrijf: een tot de onderneming van de oesterkweker behorend bedrijf, waarin oesters worden gekweekt, of
      tevens oesters worden verhandeld dan wel andere handelingen in samenhang hiermede worden verricht.
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel1
  - number: '2'
    text: |-
      Iedere oesterkweker kan uit 's Lands kas een tegemoetkoming ontvangen in de schade, welke door de in
      [artikel 1][ref1] onder [I van de Deltawet](onbekend) bedoelde werken in de uitoefening van zijn oesterbedrijf voor
      hem ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002283
        artikel: '1'
  - number: '3'
    text: |-
      1 Om in aanmerking te komen voor een tegemoetkoming, dient de oesterkweker uiterlijk zes maanden na het in werking
      treden van deze wet bij een door Onze Minister aangewezen bureau:

      a. opgave te doen van de op 31 december 1962 tot de uitoefening van het oesterbedrijf dienende of mede dienende
      goederen;

      b. een afschrift van de winst- en verliesrekening over het boekjaar, waarin 1 januari 1962 valt en indien mogelijk
      over de vier aan dit boekjaar voorafgaande jaren, alsmede een afschrift van de balansen aan het begin en het eind
      van deze boekjaren in te zenden.

      2 De oesterkweker is verplicht de verdere door Onze Minister in verband met de vaststelling van de tegemoetkoming
      gevraagde gegevens en inlichtingen te verstrekken.

      3 De opgave moet, voor zover Onze Minister een formulier heeft vastgesteld, geschieden met gebruikmaking van dit
      formulier.
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel3
  - number: '4'
    text: |-
      De tegemoetkoming bestaat uit een tegemoetkoming in de vermogensschade, in de bedrijfsschade en in de
      belastingschade.
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel4
  - number: '5'
    text: |-
      1 De tegemoetkoming in de vermogensschade wordt vastgesteld op het bedrag van de werkelijke waarde op 31 december
      1962 van de op dat tijdstip aan de oesterkweker toebehorende en tot de uitoefening van het oesterbedrijf dienende
      of mede dienende goederen, verminderd met de geschatte waarde van deze goederen bij aanwending buiten het
      oesterbedrijf.

      2 Het eerste lid is eveneens van toepassing op tot de uitoefening van het oesterbedrijf van de oesterkweker
      dienende of mede dienende roerende zaken, welke hij krachtens een overeenkomst van huurkoop gebruikt.

      3 Tot de in het eerste lid bedoelde goederen worden mede gerekend de zaken waarvoor de oesterkweker anders dan als
      eigenaar op grond van een overeenkomst aangegaan voor 1 januari 1963 het risico draagt.

      4 De goederen bedoeld in het eerste en tweede lid, die niet uitsluitend dienen tot de uitoefening van het
      oesterbedrijf, worden voor de vaststelling van de tegemoetkoming in de vermogensschade slechts in de mate, waarin
      zij tot de uitoefening van het oesterbedrijf dienen, in aanmerking genomen.

      5 Voor zover de zaken bestaan uit oestervoorraden wordt in afwijking van het eerste lid de tegemoetkoming
      vastgesteld op zestig ten honderd van de kostprijs van het deel van deze oestervoorraden, dat na 31 december 1962
      ten gevolge van de vorst is verloren gegaan, tot een bedrag van ten hoogste f 50 000 en op vijftig ten honderd
      van het gedeelte, waarmee deze dat bedrag te boven gaat. Onze Minister kan normen vaststellen volgens welke de
      kostprijs van de oestervoorraden wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel5
  - number: '6'
    text: |-
      1 De tegemoetkoming in de bedrijfsschade wordt vastgesteld op acht maal het verschil tussen het gemiddelde
      van de naar bedrijfseconomische maatstaven bepaalde winsten, in het oesterbedrijf behaald in de in
      [artikel 3, eerste lid, onder ][ref1], bedoelde boekjaren en de geschatte jaarlijkse opbrengsten van het
      vrijkomende kapitaal en van de vrijkomende arbeid van de oesterkweker bij beëindiging van het oesterbedrijf.
      Bedraagt het aantal boekjaren, waarin het oesterbedrijf werd uitgeoefend, minder dan 5, dan wordt aan de
      ontbrekende jaren een door schatting te bepalen winstbedrag toegerekend.

      2 In gevallen waarin de winst bedoeld in het eerste lid buiten de wil van de oesterkweker door bijzondere,
      persoonlijke omstandigheden ongunstig is beïnvloed en toepassing van dat lid tot onbillijkheid zou leiden, kan aan
      de berekening van de tegemoetkoming een hogere winst dan uit dat lid volgt ten grondslag worden gelegd.

      3 In geval van beëindiging van het oesterbedrijf kan de in het eerste lid bedoelde tegemoetkoming worden verhoogd
      met een bedrag voor de uitgaven, welke de oesterkweker uit hoofde van verplichtingen, die op 31 december 1962
      bestonden en tot het op dat tijdstip geldende bedrag, na beëindiging verschuldigd is met betrekking tot andere dan
      de in [artikel 5][ref2] bedoelde goederen, die hij voor de uitoefening van zijn oesterbedrijf gebruikte.


      [ref1]: https://wetten.overheid.nl/BWBR0002538#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002538#Artikel5
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel6
