  - number: '8'
    text: |-
      1 Onze Minister stelt het bedrag van de tegemoetkoming vast. Het bedrag van de tegemoetkoming in de belastingschade
      kan afzonderlijk worden vastgesteld.

      2 Onze Minister zendt een afschrift van zijn beschikking bij aangetekende brief aan de oesterkweker toe.
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel8
  - number: '9'
    text: |-
      1 De oesterkweker, die zich met de beslissing van Onze Minister omtrent de tegemoetkoming in de schade en de
      vaststelling door Onze Minister van de in [artikel 11][ref1] bedoelde regeling niet kan verenigen, kan daartegen
      binnen drie maanden na de verzending bedoeld in [artikel 8, tweede lid][ref2], beroep instellen bij de rechtbank
      te Middelburg.

      2 Het instellen van beroep geschiedt door de indiening van een verzoekschrift ter griffie van de rechtbank; het
      verzoekschrift wordt door een procureur ondertekend. Bij het verzoekschrift worden twee afschriften gevoegd.

      3 Het verzoekschrift is met redenen omkleed en bevat een duidelijke conclusie ten aanzien van het door de verzoeker
      verlangde bedrag van de tegemoetkoming.

      4 De griffier zendt onverwijld een afschrift van het verzoekschrift aan Onze Minister. Onze Minister zendt een
      gewaarmerkt afschrift van zijn beslissing aan de griffier toe.

      5 De rechtbank stelt Onze Minister in de gelegenheid binnen een door haar te bepalen termijn een verweerschrift
      vergezeld van twee afschriften bij de griffier in te dienen. De rechtbank kan deze termijn verlengen. De griffier
      zendt een afschrift van het verweerschrift aan de verzoeker.

      6 De rechtbank kan de indiening van verdere schrifturen toestaan, indien zij zulks voor de behandeling der zaak
      dienstig acht.

      7 De [vierde, zesde en zevende paragaaf van de negende afdeling van de tweede titel van het eerste boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend) vinden overeenkomstige toepassing.

      8 Desverlangd geeft de rechtbank de verzoeker en Onze Minister gelegenheid de zaak mondeling toe te lichten.

      9 De rechtbank beslist bij met redenen omklede beschikking.

      10 De griffier zendt een afschrift van de beschikking aan de verzoeker en aan Onze Minister.

      11 De kosten komen ten laste van de Staat, tenzij de rechtbank in de omstandigheden van het geding termen vindt
      om de kosten geheel of voor een deel te compenseren, behoudens dat de kosten geheel door de eiser worden gedragen,
      indien hem niet meer wordt toegewezen dan het in [artikel 8][ref3] bedoelde bedrag dan wel de in [artikel 11][ref4]
      bedoelde regeling gehandhaafd blijft.

      12 Binnen twee maanden na de verzending van de beschikking van de rechtbank staat aan de verzoeker en
      aan Onze Minister beroep in cassatie open. Op het beroep in cassatie zijn de artikelen 426-429 van het
      [Wetboek van Burgerlijke Rechtsvordering][ref5] van toepassing.

      13 Onze Minister draagt zorg voor de tenuitvoerlegging van de uitspraak van de rechter.


