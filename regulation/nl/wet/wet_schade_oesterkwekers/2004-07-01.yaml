  - number: '10'
    text: |-
      1 Een tegemoetkoming wordt betaalbaar gesteld, zodra zij onherroepelijk is vastgesteld.

      2 Gelijktijdig wordt over de tegemoetkomingen, vastgesteld op grond van de [artikelen 5][ref1] en [6][ref2], de
      wettelijke rente betaalbaar gesteld van 1 januari 1963 af. De rente loopt tot de eerste dag van de kalendermaand
      van betaling.

      Indien en voor zover uit 's lands kas een voorschot op de te verwachten tegemoetkoming is verstrekt, treedt
      de maand waarin dit is geschied voor de berekening van de rente in de plaats van de in de vorige zin bedoelde
      kalendermaand. Voor de berekening van de rente worden de bedragen van de tegemoetkoming naar beneden op honderd
      gulden of een veelvoud daarvan afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0002538#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002538#Artikel6
    url: https://wetten.overheid.nl/BWBR0002538/2004-07-01#Artikel10
