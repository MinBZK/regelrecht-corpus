    text: 'raad: de raad van bestuur van de mededingingsautoriteit;'
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
  - number: 1.j
    text: |-
      Commissariaat: het Commissariaat voor de Media, genoemd in [artikel 9 van de Mediawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel9
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
    references:
