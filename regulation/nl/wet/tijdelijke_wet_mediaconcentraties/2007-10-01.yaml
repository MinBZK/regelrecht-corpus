preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat voorkomen moet worden dat concentraties in de mediasector tot aantasting
    van de pluriformiteit leiden; dat mediaondernemingen niettemin voldoende mogelijkheden moeten kunnen benutten om
    zich multimediaal te ontwikkelen; dat het daarom wenselijk is tijdelijk regels te stellen voor mediaconcentraties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
  - number: 1.b
    text: |-
      mediaconcentratie: een concentratie als bedoeld in de [artikelen 27][ref1] en [28 van de Mededingingswet][ref2],
      waarbij in ieder geval twee of meer natuurlijke personen of rechtspersonen betrokken zijn, die ieder voor zich
      zeggenschap over een of meer ondernemingen hebben die een of meer dagbladen uitgeven of televisieprogramma’s of
      radioprogramma’s uitzenden, bestemd voor het publiek in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel28
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '28'
  - number: 1.c
    text: |-
      zeggenschap: zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel26
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '26'
  - number: 1.d
    text: 'dagblad: een op papier gedrukte uitgave van een persorgaan, die ten minste vijf keer per week verschijnt;'
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
  - number: 1.e
    text: |-
      televisieprogramma: een televisieprogramma als bedoeld in [artikel 1, onder h, van de Mediawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
    references:
