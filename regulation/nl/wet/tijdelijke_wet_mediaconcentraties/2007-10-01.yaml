  - number: 1.h
    text: |-
      mededingingsautoriteit: de Nederlandse Mededingingsautoriteit, genoemd in [artikel 2 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
    references:
      - id: ref1
