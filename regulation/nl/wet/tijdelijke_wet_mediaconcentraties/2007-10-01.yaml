  - number: 1.g
    text: |-
      uitzenden van een programma: het uitzenden van een programma als bedoeld in
      [artikel 1, onderdeel n, van de Mediawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel1
    references:
      - id: ref1
