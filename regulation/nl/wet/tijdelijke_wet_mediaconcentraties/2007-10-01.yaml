        artikel: '9'
  - number: '2.1'
    text: |-
      In zoverre in afwijking van de [paragrafen 2 tot en met 4 van Hoofdstuk 5 van de Mededingingswet][ref1] is het
      verboden een mediaconcentratie tot stand te brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008691
        paragraaf: '2'
  - number: 2.1.a
    text: |-
      als het gebruikersmarktaandeel na de mediaconcentratie meer dan vijfendertig procent op de gebruikersmarkt voor
      dagbladen bedraagt; of
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel2
  - number: 2.1.b
    text: |-
      die, in het geval dat de mediaconcentratie betrekking heeft op een combinatie van twee of drie van de
      gebruikersmarkten voor dagbladen, televisieprogramma’s of radioprogramma’s, tot resultaat heeft dat de opgetelde
      gebruikersmarktaandelen op de betrokken gebruikersmarkten meer dan negentig procent bedragen.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de gebruikersmarkten voor dagbladen,
      televisieprogramma’s en radioprogramma’s, alsmede de gebruikersmarktaandelen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel2
  - number: '3.1'
    text: |-
      Als een melding als bedoeld in [artikel 34 van de Mededingingswet][ref1] betrekking heeft op een
      mediaconcentratie, beslist de raad in afwijking van [artikel 37, eerste lid, van de Mededingingswet][ref2],
      binnen vier weken na ontvangst van de melding of door de concentratie een situatie als bedoeld in
      [artikel 2, eerste lid, onderdeel a of b][ref3], ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0022033#Artikel2
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0022033
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Bij een beslissing dat door de mediaconcentratie geen situatie als bedoeld in
      [artikel 2, eerste lid, onderdeel a of b][ref1] ontstaat, doet de raad tevens de in
      [artikel 37, eerste lid, van de Mededingingswet][ref2] bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022033#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022033
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '37'
  - number: '3.3'
    text: Van een beschikking als bedoeld in het eerste en tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel3
  - number: '4.1'
    text: |-
      Bij algemene maatregel van bestuur worden de gegevens aangewezen die voor de toepassing van deze wet bij een
      melding als bedoeld in [artikel 34 van de Mededingingswet][ref1] dienen te worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
  - number: '4.2'
    text: |-
      De [artikelen 35, tweede tot en met vierde lid][ref1], en [38 van de Mededingingswet][ref2] zijn van
      overeenkomstige toepassing op de verstrekking van gegevens als bedoeld in het eerste lid en de termijn, bedoeld in
      [artikel 3, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0022033#Artikel3
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0022033
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      Voor het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn [hoofdstuk 6][ref1] en de
      [paragrafen 1][ref2] en [1b van hoofdstuk 8 van de Mededingingswet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Paragraaf1b
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008691
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008691
        paragraaf: 1b
  - number: '6'
    text: |-
      Bij overtreding van [artikel 2][ref1] zijn de [artikelen 74][ref2], [75a][ref3] en [76][ref4] en
      [paragraaf 3 van hoofdstuk 8 van de Mededingingswet][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022033#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel75a
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel76
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022033
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: 75a
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '76'
      - id: ref5
        bwb_id: BWBR0008691
        paragraaf: '3'
  - number: '7'
    text: |-
      Op besluiten ter uitvoering van deze wet is [artikel 93 van de Mededingingswet][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel93
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '93'
  - number: '8.1'
    text: |-
      Het Commissariaat onderzoekt ontwikkelingen ten aanzien van concentraties en financieel-economische omstandigheden
      op de nationale en internationale mediamarkten en de gevolgen daarvan voor de pluriformiteit en onafhankelijkheid
      van de informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel8
  - number: '8.2'
    text: Het Commissariaat rapporteert jaarlijks over zijn bevindingen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel8
  - number: '8.3'
    text: |-
      Het Commissariaat maakt zijn bevindingen openbaar, met uitzondering van gegevens die naar hun aard vertrouwelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel8
  - number: '9.1'
    text: |-
      Alvorens beslissingen te nemen over de toepassing van [artikel 2][ref1] vraagt de raad advies aan het
      Commissariaat.


      [ref1]: https://wetten.overheid.nl/BWBR0022033#Artikel2
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022033
        artikel: '2'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Met het oog op een doelmatige en doeltreffende uitvoering van deze wet, over de wijze van behandeling van
      aangelegenheden van wederzijds belang en over het verzamelen van informatie ten behoeve daarvan maken de raad en
      het Commissariaat afspraken.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel9
  - number: '9.3'
    text: |-
      De [artikelen 90][ref1] en [91 van de Mededingingswet][ref2] zijn van overeenkomstige toepassing op gegevens of
      inlichtingen die in verband met enige werkzaamheid ten behoeve van de uitvoering van deze wet door de raad of het
      Commissariaat zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel91
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '91'
  - number: '10.1'
    text: |-
      Onze Minister van Economische Zaken oefent de in de [artikelen 5c, eerste, derde en vierde lid][ref1],
      [5d, eerste lid][ref2], en [5e, tweede lid, van de Mededingingswet][ref3] aan hem toegekende taken en bevoegdheden
      ten aanzien van de raad uit na overleg met Onze Minister, voor zover die taken en bevoegdheden betrekking hebben op
      werkzaamheden van de raad ter uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5c
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel5d
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel5e
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 5c
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 5d
      - id: ref3
        bwb_id: BWBR0008691
        artikel: 5e
  - number: '10.2'
    text: |-
      [Artikel 5e, eerste lid, van de Mededingingswet][ref1] is van overeenkomstige toepassing ten aanzien van Onze
      Minister voor zover het betreft de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5e
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 5e
  - number: '13'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken vóór 1 mei 2009 aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel13
  - number: '15.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en vervalt met ingang van 1 januari 2010, tenzij bij koninklijk besluit een later tijdstip wordt
      vastgesteld waarop deze wet vervalt.
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet mediaconcentraties.'
    url: https://wetten.overheid.nl/BWBR0022033/2007-10-01#Artikel16
