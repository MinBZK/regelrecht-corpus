preamble:
  text: |-
    Gelet op artikel 4.8 van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gezagvoerder van een luchtvaartuig is verplicht ervoor te zorgen dat bij elke vlucht de volgende documenten
      worden meegevoerd:
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
  - number: 1.a
    text: |-
      Het bewijs van inschrijving, als bedoeld in [artikel 3.5, eerste of tweede lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 1.b
    text: |-
      Het bewijs van luchtwaardigheid als bedoeld in [artikel 3.13][ref1] respectievelijk
      [3.20 van de Wet luchtvaart][ref2], behoudens in gevallen als bedoeld in [artikel 3.21 van de Wet luchtvaart][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 1.c
    text: |-
      De op het luchtvaartuig betrekking hebbende gebruiksbeperkingen, gebruiksaanwijzingen en gebruiksgegevens in een
      vorm van een vlieghandboek dat de instemming heeft van de Minister van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
  - number: 1.d
    text: |-
      Het bewijs van bevoegdheid als bedoeld in [artikel 2.1, vierde lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: 1.e
    text: |-
      Het journaal als bedoeld in [artikel 98, tweede lid, van de R.T.L.][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel98
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '98'
  - number: 1.f
    text: |-
      Indien van toepassing: het geluidscertificaat of de geluidsverklaring als bedoeld in [artikel 3.19b][ref1]
      respectievelijk [artikel 3.19c van de Wet luchtvaart][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 1.g
    text: 'Indien het luchtvaartuig is uitgerust met radioapparatuur: het bewijs aanwijzing radiostation.'
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel1
  - number: '2.1'
    text: 'De gezagvoerder van een luchtvaartuig is verplicht ervoor te zorgen dat bij een internationale verkeersvlucht:'
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel2
  - number: 2.1.a
    text: |-
      wordt medegevoerd een exemplaar van het laatste voor het betrokken luchtvaartuig opgestelde certificaat als bedoeld
      in [artikel 9 van de Regeling onderhoud luchtvaartuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012882#Artikel9
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012882
        artikel: '9'
  - number: 2.1.b
    text: |-
      waarbij het luchtvaartuig lading vervoert, in het luchtvaartuig een manifest en waar nodig een gespecificeerde
      verklaring omtrent die lading aanwezig is.
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel2
  - number: '2.2'
    text: |-
      In geval van vervoer van gevaarlijke stoffen door de lucht wordt medegevoerd de NOTOC als bedoeld in artikel 2 van
      de Regeling meldings- en informatieplicht vervoer gevaarlijke stoffen door de lucht.
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 1 mei 2005.
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling boorddocumenten luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0018245/2005-05-01#Artikel4
