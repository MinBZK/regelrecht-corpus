  - number: '2'
    text: |-
      1 De gezagvoerder van een luchtvaartuig is verplicht ervoor te zorgen dat bij een internationale verkeersvlucht:

      a. wordt medegevoerd een exemplaar van het laatste voor het betrokken luchtvaartuig opgestelde certificaat als
      bedoeld in [artikel 9 van de Regeling onderhoud luchtvaartuigen][ref1];

      b. waarbij het luchtvaartuig lading vervoert, in het luchtvaartuig een manifest en waar nodig een gespecificeerde
      verklaring omtrent die lading aanwezig is.

      2 In geval van vervoer van gevaarlijke stoffen door de lucht wordt medegevoerd de NOTOC als bedoeld in artikel 2
      van de Regeling meldings- en informatieplicht vervoer gevaarlijke stoffen door de lucht.


