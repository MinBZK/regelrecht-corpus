articles:
  - number: '1'
    text: |-
      De gezagvoerder van een luchtvaartuig is verplicht ervoor te zorgen dat bij elke vlucht de volgende documenten
      worden meegevoerd:

      a. Het bewijs van inschrijving, als bedoeld in [artikel 3.5, eerste of tweede lid, van de Wet luchtvaart][ref1];

      b. Het bewijs van luchtwaardigheid als bedoeld in [artikel 3.13][ref2] respectievelijk
      [3.20 van de Wet luchtvaart][ref3], behoudens in gevallen als bedoeld in [artikel 3.21 van de Wet luchtvaart][ref4];

      c. De op het luchtvaartuig betrekking hebbende gebruiksbeperkingen, gebruiksaanwijzingen en gebruiksgegevens in een
      vorm van een vlieghandboek dat de instemming heeft van de Minister van Verkeer en Waterstaat;

      d. Het bewijs van bevoegdheid als bedoeld in [artikel 2.1, vierde lid, van de Wet luchtvaart][ref5];

      e. Het journaal als bedoeld in [artikel 98, tweede lid, van de R.T.L.][ref6];

      f. Indien van toepassing: het geluidscertificaat of de geluidsverklaring als bedoeld in [artikel 3.19b][ref7]
      respectievelijk [artikel 3.19c van de Wet luchtvaart][ref8];

      g. Indien het luchtvaartuig is uitgerust met radioapparatuur: het bewijs aanwijzing radiostation.


