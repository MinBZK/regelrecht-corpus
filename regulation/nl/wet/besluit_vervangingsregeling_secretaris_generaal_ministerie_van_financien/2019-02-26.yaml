articles:
  - number: '1'
    text: De directeur-generaal Fiscale Zaken vervangt de secretaris-generaal tijdens diens afwezigheid.
    url: https://wetten.overheid.nl/BWBR0041938/2019-02-26#Artikel1
  - number: '2'
    text: Het besluit van 8 mei 2017, met kenmerk 2017-85767, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0041938/2019-02-26#Artikel2
  - number: '3'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 1 augustus 2018.
    url: https://wetten.overheid.nl/BWBR0041938/2019-02-26#Artikel3
