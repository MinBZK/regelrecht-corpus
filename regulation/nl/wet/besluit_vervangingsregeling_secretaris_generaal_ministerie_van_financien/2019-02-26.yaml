preamble:
  text: |-
    Gelet op artikel 3, vierde lid, van het Organisatie- en mandaatbesluit Ministerie van Financiën 2015;

    Overwegende dat er, behoudens in gevallen omschreven in artikel 3a, vijfde lid, van het Organisatie- en
    mandaatbesluit Ministerie van Financiën 2015, een vervangingsregeling nodig is;

    Besluit:
