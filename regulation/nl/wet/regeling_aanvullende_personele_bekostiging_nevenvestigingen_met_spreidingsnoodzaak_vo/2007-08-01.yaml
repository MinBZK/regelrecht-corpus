  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 85a, eerste lid, van de Wet op het voortgezet onderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022331/2007-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Onderwijs, Cultuur en Wetenschap;

      b. nevenvestiging: een permanente locatie van een school of scholengemeenschap niet zijnde de hoofdvestiging;

      c. school: een school voor voortgezet onderwijs als bedoeld in
      [artikel 1 van de Wet op het voortgezet onderwijs][ref1];

      d. nevenvestiging met spreidingsnoodzaak: een nevenvestiging van een school die voldoet aan de criteria, genoemd
      in [artikel 2][ref2];

      e. verlangd onderwijs: het verlangd onderwijs als bedoeld in
      [artikel 65, eerste lid, van de Wet op het voortgezet onderwijs][ref3].


