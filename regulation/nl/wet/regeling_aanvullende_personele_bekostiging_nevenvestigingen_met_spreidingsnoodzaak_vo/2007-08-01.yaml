  - number: '2'
    text: |-
      1 De Minister verstrekt aan het bevoegd gezag van een school per kalenderjaar aanvullende bekostiging voor
      personeelskosten ten behoeve van een op 1 augustus nieuw te vormen nevenvestiging met spreidingsnoodzaak.

      2 Er is sprake van een nevenvestiging met spreidingsnoodzaak indien:

      a. de nevenvestiging hemelsbreed 10 kilometer of meer is verwijderd van een vestiging van een school waaraan
      hetzelfde verlangd onderwijs en dezelfde schoolsoort wordt aangeboden;

      b. aan de nevenvestiging 120 leerlingen of meer ingeschreven staan op 1 oktober voorafgaande aan het kalenderjaar
      waarop de aanvullende bekostiging betrekking heeft.

      3 De aanvullende bekostiging moet tenminste twee maanden voorafgaand aan het eerste kalenderjaar waarop de
      bekostiging betrekking heeft bij de Centrale Financiën Instellingen worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0022331/2007-08-01#Artikel2
  - number: '3'
    text: |-
      De aanvullende bekostiging bedraagt:

      a. éénmaal de landelijke gemiddelde personeelslast onderwijsondersteunend personeel, en

      b. éénmaal de landelijke gemiddelde personeelslast voor directiepersoneel van de schoolsoortgroep waartoe de school
      behoort.
    url: https://wetten.overheid.nl/BWBR0022331/2007-08-01#Artikel3
  - number: '4'
    text: |-
      1. De aanvullende bekostiging wordt verstrekt als tegemoetkoming in de uitgaven voor een nevenvestiging met
      spreidingsnoodzaak. Verrekening van eventueel niet-bestede middelen of voorschotten vindt niet plaats.

      2. De verklaring van de accountant bij de jaarrekening omvat tevens een oordeel over de rechtmatige besteding van
      de aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0022331/2007-08-01#Artikel4
  - number: '5'
    text: |-
      De betaling van de aanvullende personele bekostiging vindt plaats volgens het betaalritme van de reguliere
      personele bekostiging.
    url: https://wetten.overheid.nl/BWBR0022331/2007-08-01#Artikel5
  - number: '6'
    text: |-
      Vestigingen die op enig moment voor 1 augustus 2007 reeds aanvullende personele bekostiging voor een nevenvestiging
      met spreidingsnoodzaak ontvingen, houden recht op de bekostiging bedoeld in [artikel 4][ref1], onverminderd het
      bepaalde in [artikel 2, eerste lid onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022331#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022331#Artikel2
