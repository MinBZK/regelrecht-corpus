  - number: '2.2'
    text: |-
      De gegevens, bedoeld in [artikel 4, tweede lid, van het besluit][ref1] worden via elektronische informatie-
      uitwisseling verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel4
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '4'
  - number: '3'
    text: |-
      Bij het opstellen van de lijst van de gevaarlijke stoffen kan voor de aard en fysische vormen van de gevaarlijke
      stoffen worden volstaan met een opgave per stof van de gevaarscategorie respectievelijk de chemische naam en het
      CAS-nummer, mits daaruit de fysisch-chemische eigenschappen en de gevaarseigenschappen van de desbetreffende stof
      kenbaar zijn en inzichtelijk is op basis van welke gevaarlijke stoffen of categorieën van stoffen de inrichting een
      lagedrempelinrichting of een hogedrempelinrichting is.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel3
  - number: '4'
    text: 'Bij de vastlegging van het preventiebeleid voor zware ongevallen wordt een beschrijving gegeven van:'
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel4
  - number: 4.a
    text: de aard en de omvang van de risico’s van zware ongevallen, in hoofdlijnen;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel4
  - number: 4.b
    text: |-
      de beginselen die ten grondslag liggen aan de inrichting van het veiligheidsbeheerssysteem en die inzicht bieden in
      de samenhang tussen het beleid en het veiligheidsbeheerssysteem;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel4
  - number: 4.c
    text: de criteria die worden toegepast bij de vaststelling van de risico’s van zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel4
  - number: 4.d
    text: |-
      de beginselen die ten grondslag liggen aan de maatregelen die zijn getroffen ter voorkoming van zware ongevallen en
      die inzicht bieden in de samenhang tussen de getroffen maatregelen en de risico’s van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel4
  - number: '5.1'
    text: |-
      De procedures voor de systematische identificatie van de gevaren van zware ongevallen, bedoeld in bijlage III,
      onderdeel b, onder ii, bij de richtlijn hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel5
  - number: 5.1.a
    text: |-
      het verrichten van systematisch onderzoek naar de aan een installatie verbonden risico’s van een zwaar ongeval
      tijdens het ontwerp, de bouw, het gebruik en het onderhoud van de installatie, alsmede bij voorgenomen wijzigingen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel5
  - number: 5.1.b
    text: de criteria voor het bepalen van de methode voor het onderzoek, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel5
  - number: 5.1.c
    text: de methode voor de beoordeling van de risico’s van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel5
  - number: '5.2'
    text: |-
      De onderzoeksmethode, bedoeld in het eerste lid, onderdeel b, is afgestemd op de fasen, bedoeld in het eerste lid,
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel5
  - number: '5.3'
    text: |-
      De methode, bedoeld in het eerste lid, onderdeel c, is geschikt om vast te stellen welke maatregelen nodig zijn ter
      voorkoming van zware ongevallen of ter beperking van de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel5
  - number: '6'
    text: |-
      Het bevoegd gezag stelt de exploitanten van de betrokken inrichtingen en burgemeester en wethouders van de gemeente
      of gemeenten waarin de inrichtingen geheel of gedeeltelijk zijn gelegen in kennis van een aanwijzing als bedoeld in
      [artikel 8, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel8
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '8'
  - number: '7'
    text: |-
      Onder groepen van inrichtingen, als bedoeld in [artikel 8, eerste lid, van het besluit][ref1],
      kunnen inrichtingen worden verstaan die gelegen zijn binnen een op grond van
      [artikel 14 van het Besluit externe veiligheid inrichtingen][ref2] vastgestelde veiligheidscontour.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel14
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '14'
  - number: '8'
    text: |-
      De exploitant kan het document inzake het preventiebeleid, het veiligheidsrapport en het veiligheids- en
      gezondheidsdocument, bedoeld in [artikel 2.42, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], samenvoegen
      in één document.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: '9'
    text: |-
      Het veiligheidsrapport bevat de gegevens en beschrijvingen, bedoeld in bijlage II bij de richtlijn, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.a
    text: |-
      ten aanzien van onderdeel 1 een beschrijving wordt gegeven van het maximale aantal personen dat in de inrichting
      werkzaam is en het maximale aantal personen binnen en buiten de inrichting dat aan het risico van een zwaar ongeval
      is blootgesteld, alsmede een indicatie van de verdeling van het aantal personen over de inrichting;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.b
    text: |-
      ten aanzien van onderdeel 2 een beschrijving wordt gegeven van de zones die door een zwaar ongeval kunnen worden
      getroffen, voor zover zij van belang zijn voor:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.b.1°
    text: de interne veiligheid;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.b.2°
    text: de externe veiligheid;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.b.3°
    text: de voorbereiding van de rampenbestrijding;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.c
    text: |-
      ten aanzien van onderdeel 3 een beschrijving wordt gegeven van de processen die in de inrichting plaatsvinden,
      alsmede het verloop daarvan en een beschrijving van de stoffen op de lijst van de gevaarlijke stoffen waaronder
      de eigenschappen en gedragingen van deze stoffen onder de in de inrichting geldende omstandigheden en bij een
      voorzienbaar ongeval, alsmede de hoeveelheden waarin deze stoffen in de inrichting aanwezig zijn of kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.d
    text: |-
      ten aanzien van onderdeel 4 een gedetailleerde beschrijving wordt gegeven van de scenario’s, uitgewerkt per
      installatie en van de scenario's voor een mogelijk zwaar ongeval op het terrein van de inrichting die bepalend
      zijn voor de inhoud van het intern noodplan, voor het rampbestrijdingsplan en voor de omvang en uitrusting van de
      bedrijfsbrandweer, bedoeld in [artikel 7.3 van het Besluit veiligheidsregio’s][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel7
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: '7'
  - number: 9.e
    text: |-
      ten aanzien van onderdeel 5 een beschrijving wordt gegeven van de consequenties die de in dit onderdeel bedoelde
      beschrijving van de beschermings- en interventiemiddelen hebben voor het intern noodplan, alsmede een beschrijving
      van de organisatie van de nodig geachte bedrijfsbrandweer, waaronder de omvang van het personeel en materieel en
      een beschrijving van andere gegevens die met het oog op de voorbereiding van de rampenbestrijding nodig zijn;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: 9.f
    text: |-
      ten aanzien van de onderdelen 4 en 5 een beschrijving wordt gegeven van de zware ongevallen die binnen of buiten de
      inrichting gevaar kunnen opleveren en een opsomming van de bijbehorende maatregelen die zijn genomen om de kans dat
      deze ongevallen zich voordoen, te verkleinen en de gevolgen van die ongevallen te beperken.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd het bepaalde in [artikel 9][ref1], heeft de beschrijving van de scenario’s in een risico-analyse
      betrekking op de onderdelen van de installaties die de grootste risico’s van een zwaar ongeval met zich
      meebrengen. De identificatie van de betreffende onderdelen van de installaties vindt plaats op basis van een in het
      veiligheidsrapport beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0037692#Artikel9
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037692
        artikel: '9'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      Bij de beschrijving, bedoeld in het eerste lid, wordt ten minste beschouwd welke van de volgende voorvallen
      deze scenario’s op gang kunnen brengen: corrosie, erosie, externe belasting, impact, overdruk, onderdruk, lage
      temperatuur, hoge temperatuur, trillingen, menselijke fouten tijdens gebruik, wijziging of onderhoud.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: '10.3'
    text: |-
      Van elk scenario wordt kwalitatief of met risicoberekeningen aangegeven wat de waarschijnlijkheid en het effect is
      en welke maatregelen getroffen zijn om te voorkomen dat het scenario zich voordoet.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: '10.4'
    text: |-
      Voor elk scenario wordt, ter beoordeling van de aanvaardbaarheid van de risico’s en rekening houdend met de reeds
      getroffen maatregelen, een samenhangend inzicht geboden in:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: 10.4.a
    text: de resterende kans dat een zwaar ongeval geschiedt;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: 10.4.b
    text: de ernst van de gevolgen die het zwaar ongeval in dat geval zal hebben;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: 10.4.c
    text: |-
      welke verdere maatregelen technisch mogelijk zijn om de kans en effect op een zwaar ongeval verder te verkleinen
      tot een daarbij aan te geven niveau, zo mogelijk volgens risicoberekeningen;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: 10.4.d
    text: een indicatie van de kosten die verbonden zijn aan het treffen van maatregelen als bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: '10.5'
    text: |-
      Uit de scenario’s blijkt dat de risico’s van zware ongevallen op adequate wijze worden beheerst met het complete
      stelsel van aanwezige technische en organisatorische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel10
  - number: '11.1'
    text: |-
      Het groepsrisico en het plaatsgebonden risico, bedoeld in [artikel 6, tweede lid, van het besluit][ref1] worden
      berekend op basis van de lijst van de gevaarlijke stoffen en met toepassing van de rekenmethodiek Bevi.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel6
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '6'
  - number: '11.2'
    text: |-
      De berekeningen van het groepsrisico en het plaatsgebonden risico maken tevens onderdeel uit van de risico-analyse
      in het veiligheidsrapport en worden weergegeven op de wijze zoals beschreven in de rekenmethodiek Bevi.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel11
  - number: '11.3'
    text: |-
      De artikelen [8b][ref1], [8c][ref2] en [8d van de Regeling externe veiligheid inrichtingen][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017168#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0017168#Artikel8c
      [ref3]: https://wetten.overheid.nl/BWBR0017168#Artikel8d
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017168
        artikel: 8b
      - id: ref2
        bwb_id: BWBR0017168
        artikel: 8c
      - id: ref3
        bwb_id: BWBR0017168
        artikel: 8d
  - number: '12'
    text: |-
      Onverminderd het bepaalde in [artikel 9][ref1], bevat het veiligheidsrapport, voor zover het betreft de risico’s
      voor het milieu, de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037692#Artikel9
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037692
        artikel: '9'
        paragraaf: '3'
  - number: 12.a
    text: |-
      een schatting van de kans dat belangrijke ongewenste effecten voor het milieu ten gevolge van een zwaar ongeval
      zich voordoen in het oppervlaktewater of in de lozing naar een zuiveringstechnisch werk alsmede een schatting van
      de omvang van die effecten;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel12
  - number: 12.b
    text: een opsomming van de maatregelen die zijn genomen om de risico’s voor het milieu bij een zwaar ongeval te beperken.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel12
  - number: '13'
    text: |-
      Onverminderd het bepaalde in [artikel 9][ref1], bevat de beschrijving in het veiligheidsrapport van externe en
      natuurlijke oorzaken, bedoeld in bijlage II, onderdeel 4, onderdeel a, onder ii en iii, bij de richtlijn in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0037692#Artikel9
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037692
        artikel: '9'
        paragraaf: '3'
  - number: 13.a
    text: |-
      bij een aanwijzing als bedoeld in [artikel 8, eerste lid, van het besluit][ref1], een schatting van de kans en de
      omvang van de effecten van een zwaar ongeval dat door een naburige inrichting wordt veroorzaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel8
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '8'
  - number: 13.b
    text: een schatting van de kans en de omvang van de effecten van een mogelijke overstroming;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel13
  - number: 13.c
    text: een schatting van de kans en de omvang van de effecten van een mogelijke aardbeving;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel13
  - number: 13.d
    text: |-
      een opsomming en een onderbouwing van de maatregelen die zijn genomen om de risico’s van zware ongevallen te
      beperken.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel13
  - number: '14.1'
    text: |-
      De exploitant kan een veiligheidsrapport of een bijgewerkt veiligheidsrapport in elektronische of schriftelijke
      vorm aan het bevoegd gezag verzenden.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel14
  - number: '14.2'
    text: |-
      Behoudens de verzending van het veiligheidsrapport, bedoeld in [artikel 2, eerste lid, onder d][ref1], zendt het
      bevoegd gezag tevens een exemplaar aan het Rijksinstituut voor Volksgezondheid en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0037692#Artikel2
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037692
        artikel: '2'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Degene die een inrichting gaat drijven, zendt voordat de inrichting of een onderdeel daarvan in
      werking wordt gebracht, ter completering van de onderdelen van het veiligheidsrapport, bedoeld in
      [artikel 4.13, eerste lid, van de Regeling omgevingsrecht][ref1], aan het bevoegd gezag de gegevens die een
      veiligheidsrapport op grond van het [besluit][ref2] en deze regeling dient te bevatten, voor zover die nog niet
      krachtens artikel 4.13, eerste lid, van de Regeling omgevingsrecht zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0036791
  - number: '15.2'
    text: |-
      Degene die een inrichting drijft, zendt telkens voordat een verandering van de inrichting of van de werking
      daarvan of een verandering van de installatie of van de werking daarvan wordt aangebracht die voor de
      risico’s van een zwaar ongeval belangrijke gevolgen kan hebben aan het bevoegd gezag die onderdelen van het
      veiligheidsrapport die nodig zijn voor de beoordeling van de risico’s die samenhangen met die verandering. Daartoe
      zendt hij, voor zover van toepassing, ter completering van de onderdelen van het veiligheidsrapport, bedoeld
      in [artikel 4.17 van de Regeling omgevingsrecht][ref1], de gegevens die een veiligheidsrapport op grond van het
      [besluit][ref2] en deze regeling dient te bevatten, voor zover die nog niet krachtens artikel 4.17 van de Regeling
      omgevingsrecht zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0036791
  - number: '16.1'
    text: |-
      De termijn, bedoeld in [artikel 10, tiende lid, van het besluit][ref1] is in ieder geval verstreken wanneer de
      exploitant na zes maanden niet in kennis is gesteld van de conclusies naar aanleiding van het veiligheidsrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel10
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '10'
  - number: '16.2'
    text: |-
      Indien het bevoegd gezag van oordeel is dat het veiligheidsrapport onvolledig is, verzoekt het bevoegd gezag binnen
      acht weken na de ontvangst van het veiligheidsrapport de exploitant om aanvullende inlichtingen te verstrekken
      binnen een bij het verzoek te stellen termijn van ten hoogste zes weken.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel16
  - number: '16.3'
    text: |-
      De in het eerste lid bedoelde termijn van zes maanden wordt opgeschort met ingang van de dag dat het verzoek,
      bedoeld in het tweede lid, is gedaan tot de dag waarop de aanvullende inlichtingen zijn verstrekt of de daarvoor
      gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel16
  - number: '17.1'
    text: |-
      Het bevoegd gezag stelt de toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1], in de gelegenheid om de onderdelen van
      het veiligheidsrapport die betrekking hebben op de arbeidsveiligheid te beoordelen, en verwerkt deze beoordeling in
      de conclusies naar aanleiding van het veiligheidsrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: '17.2'
    text: |-
      Het bevoegd gezag stelt het bestuur van de veiligheidsregio waarin de inrichting geheel of gedeeltelijk is gelegen
      in de gelegenheid om de onderdelen van het veiligheidsrapport die betrekking hebben op de bedrijfsbrandweer en
      de voorbereiding op de bestrijding van rampen te beoordelen, en verwerkt deze beoordeling in de conclusies naar
      aanleiding van het veiligheidsrapport.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel17
  - number: '17.3'
    text: |-
      Het bevoegd gezag stelt het bestuursorgaan, bedoeld in
      [artikel 6.15, vierde lid, van het Besluit omgevingsrecht][ref1], in de gelegenheid om de onderdelen van het
      veiligheidsrapport die betrekking hebben op mogelijke waterverontreiniging of mogelijke belemmeringen voor
      de doelmatige werking van zuiveringstechnische werken bij een zwaar ongeval te beoordelen, en verwerkt deze
      beoordeling in de conclusies naar aanleiding van het veiligheidsrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
  - number: '18.1'
    text: |-
      De exploitant draagt er zorg voor dat hulpverleningsdiensten van de overheid binnen de inrichting voor elke
      installatie direct toegang hebben tot ten minste de volgende actuele gegevens van de binnen de installatie
      aanwezige gevaarlijke stof of gevaarlijke stoffen en stoffen die op basis van aard en hoeveelheid een risico
      vormen:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.1.a
    text: de chemische stofnaam of handelsnaam;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.1.b
    text: de maximaal aanwezige hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.1.c
    text: het CAS-nummer of het veiligheidsinformatieblad;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.1.d
    text: het VN-nummer;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.1.e
    text: het gevaarsidentificatienummer.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: '18.2'
    text: |-
      Indien de gegevens, bedoeld in het eerste lid, onderdelen c, d en e, niet bestaan, zijn onverminderd het eerste
      lid, onderdelen a en b, ten minste actuele gegevens beschikbaar over:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.2.a
    text: het gevaar voor een explosie;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.2.b
    text: het gevaar voor brand;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: 18.2.c
    text: het gevaar voor een toxische wolk.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel18
  - number: '19'
    text: 'Het bevoegd gezag coördineert in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.a
    text: 'de aanpak en uitvoering van inspecties ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.a.1°
    text: |-
      de kennisgeving, bedoeld in [artikel 6 van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel5
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '5'
  - number: 19.a.2°
    text: het preventiebeleid voor zware ongevallen en het veiligheidsbeheerssysteem;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.a.3°
    text: |-
      inrichtingen, als bedoeld in [artikel 8 van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel8
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '8'
  - number: 19.a.4°
    text: het veiligheidsrapport;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.a.5°
    text: het intern noodplan;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.a.6°
    text: |-
      het inspectieplan en het inspectieprogramma, bedoeld in [artikel 13, vierde en zevende lid van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel13
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '13'
  - number: 19.a.7°
    text: |-
      het overleg met betrekking tot toezicht en vervolgacties, waaronder het inspectierapport,
      bedoeld in [artikel 15, eerste lid onderdeel b][ref1], en de last onder bestuursdwang, bedoeld in
      [artikel 17, zesde lid, van het besluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0036791#Artikel17
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0036791
        artikel: '17'
  - number: 19.a.8°
    text: gezamenlijke niet-inspectiegebonden activiteiten;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.a.9°
    text: het overleg met betrekking tot inspecties;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.b
    text: |-
      het door de toezichthouders in het kader van inspecties monitoren van en reageren op gevallen van niet-naleving
      door:
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.b.1°
    text: |-
      het verzamelen en evalueren van voortgangsgegevens, realisatiegegevens en kwaliteitsgegevens met betrekking tot
      toezicht en vervolgacties; en
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: 19.b.2°
    text: |-
      het signaleren van geconstateerde afwijkingen met een structureel of incidenteel karakter indien ernstig van aard
      en het organiseren of doorvoeren van verbetermaatregelen.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel19
  - number: '20.1'
    text: |-
      De exploitant doet zo spoedig mogelijk na een zwaar ongeval aan de toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1], langs elektronische weg, melding van de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 20.1.a
    text: datum, tijd, plaats en omstandigheden van het zware ongeval;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: 20.1.b
    text: de daarbij betrokken gevaarlijke stoffen, alsmede de hoeveelheid daarvan;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: 20.1.c
    text: de gevolgen van het zware ongeval voor de werknemers, die zich op korte dan wel langere termijn kunnen voordoen;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: 20.1.d
    text: |-
      het aantal werknemers dat als gevolg van blootstelling aan een gevaarlijke stof is overleden, dan wel zodanig
      gewond is dat dit heeft geleid tot een opname in het ziekenhuis voor ten minste 24 uur;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: 20.1.e
    text: de ter bescherming van de werknemers voorgenomen en getroffen maatregelen en noodmaatregelen;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: 20.1.f
    text: |-
      de ter bescherming van de werknemers voorgenomen en getroffen maatregelen om herhaling van het ongeval te
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: 20.1.g
    text: het bedrag van de materiële schade binnen de inrichting.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: '20.2'
    text: |-
      Indien uit nader onderzoek gegevens naar voren komen die afwijken van de ingevolge het eerste lid verstrekte
      gegevens, en die wijziging kunnen brengen in de getrokken conclusies, worden die gegevens zo spoedig mogelijk
      aanvullend door de exploitant langs elektronische weg verstrekt.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
  - number: '20.3'
    text: |-
      De toezichthouder, bedoeld in [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1] ziet erop
      toe dat de maatregelen, bedoeld in het eerste lid, onderdelen e en f, daadwerkelijk worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: '20.4'
    text: |-
      Voor zover de exploitant de in dit artikel bedoelde gegevens reeds heeft verstrekt ter voldoening aan zijn
      verplichtingen ingevolge de [Wet algemene bepalingen omgevingsrecht][ref1], de [Wet milieubeheer][ref2]
      of de [Wet veiligheidsregio’s][ref3], is daarmee voldaan aan de ingevolge het eerste en tweede lid
      op hem rustende verplichtingen. In dat geval zendt het bestuursorgaan dat de betreffende gegevens
      heeft ontvangen, zo spoedig mogelijk een afschrift daarvan aan de toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0027466
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0027466
      - id: ref4
        bwb_id: BWBR0010346
        artikel: '1'
  - number: '23'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel23
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Regeling risico’s zware ongevallen.'
    url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#Artikel24
