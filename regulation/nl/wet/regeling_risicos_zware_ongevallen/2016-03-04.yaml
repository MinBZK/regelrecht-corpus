preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Sociale Zaken en Werkgelegenheid en de Minister van Veiligheid
    en Justitie;

    Gelet op Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de beheersing
    van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en vervolgens
    intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L197);

    Gelet op de artikelen 4, vijfde lid, 6, achtste lid, 7, zevende lid, 8, vijfde lid, 10, dertiende lid, 11, zevende
    lid, 12, derde lid, 13, achttiende lid en 14 van het Besluit risico’s zware ongevallen 2015, artikel 4.4, eerste
    lid, van het Besluit omgevingsrecht en artikel 14, tweede lid, van het Besluit externe veiligheid inrichtingen;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0037692/2016-03-04#ArtikelAanhef
