preamble:
  text: |-
    Gelet op artikel 45, van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004222/1987-10-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het verbod van [artikel 21 van de Diergeneesmiddelenwet][ref1] (Stb. 1985, 410) wordt vrijstelling verleend
      aan dierenartsen voor het afleveren van diergeneesmiddelen aan bereiders van gemedicineerde voormengsels dan wel
      gemedicineerd voeder voor zover deze levering strekt voor de bereiding van standaard voeder of speciaal voeder
      als bedoeld in artikel 7 van het Landbouwkwaliteitsbesluit Gemedicineerd Voeder (Stb. 1978, 352) en voor zover
      de aflevering voor de bereiding van speciaal voeder vergezeld gaat van het daarop betrekking hebbend attest als
      bedoeld in artikel 7, vierde lid, van het hiervoren genoemde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0004222/1987-10-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '2'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag volgend op die van haar bekendmaking in de Nederlandse
      Staatscourant.

      2 Deze regeling kan worden aangehaald als: Vrijstelling vergunningplicht dierenartsen bij gemidicineerd voeder.
    url: https://wetten.overheid.nl/BWBR0004222/1987-10-31#Artikel2
