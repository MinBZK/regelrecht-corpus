        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.3'
    text: |-
      De secretaris-generaal stelt regels voor de vervanging van de plaatsvervangend secretaris-generaal en de
      directeuren-generaal, genoemd in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel3
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.4'
    text: |-
      De secretaris-generaal stelt een meerjarenplan voor het ministerie vast. De secretaris-generaal stelt voorts
      de jaarplannen vast van de organisatieonderdelen, genoemd in [artikel 2, onder a][ref1]. De secretaris-generaal
      kent aan de plaatsvervangend secretaris-generaal, de directeurengeneraal, de inspecteur-generaal Werk en Inkomen
      en de functionarissen die leiding geven aan de organisatieonderdelen, genoemd in [artikel 2, onder a][ref2],
      de budgetten toe waarover de genoemde functionarissen mogen beschikken. De secretaris-generaal bewaakt de
      voortgang van de uitvoering van het meerjarenplan en van de jaarplannen van de organisatieonderdelen, genoemd in
      [artikel 2, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
