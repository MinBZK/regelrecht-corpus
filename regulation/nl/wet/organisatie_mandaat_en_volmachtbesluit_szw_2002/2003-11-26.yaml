  - number: '3.2'
    text: |-
      Het in het eerste lid bedoelde overleg staat onder voorzitterschap van de secretaris-generaal en elk van de
      functionarissen neemt daaraan deel met volledig behoud van de eigen verantwoordelijkheden en bevoegdheden.
      De inspecteur-generaal Werk en Inkomen neemt aan dit overleg deel op een zodanige wijze dat dit in
      overeenstemming is met zijn verantwoordelijkheid voor de onafhankelijke uitvoering van de taken genoemd in
      [artikel 37 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel3
