    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '4'
        hoofdstuk: '3'
  - number: 5.2.c
    text: |-
      de voorlopige buiteninvorderingstelling en definitieve buiteninvorderingstelling van vorderingen op
      derden van minder dan € 500.000,–, alsmede, na instemming van de Minister van Financiën, de voorlopige
      buiteninvorderingstelling van vorderingen van meer dan € 500.000,–;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: 5.2.d
    text: de kwijtschelding van vorderingen op derden van ten hoogste € 500.000,-.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: '5.3'
    text: |-
      De secretaris-generaal is bevoegd tot uitoefening van alle bevoegdheden die zijn verleend aan onder hem
      ressorterende functionarissen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: 5.3.a
    text: |-
      hij gehouden is om de inspectiebevindingen van de Arbeidsinspectie en de Inspectie Werk en Inkomen, ongewijzigd
      door te sturen naar de betreffende bewindsperso(o)n(en);
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: 5.3.b
    text: |-
      hij gehouden is om de jaarplannen, meerjarenplannen en jaarverslagen met betrekking tot de inspectietaken
      van de Arbeidsinspectie en de Inspectie Werk en Inkomen, ongewijzigd door te sturen naar de betreffende
      bewindsperso(o)n(en);
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: 5.3.c
    text: |-
      hij gehouden is om de door de algemeen directeur van de Arbeidsinspectie en de inspecteurgeneraal Werk en Inkomen
      gerapporteerde resultaten voortvloeiend uit toezichtbaarheids- en uitvoeringstoetsen welke op verzoek van een
      bewindspersoon binnen de daarvoor gestelde termijnen worden uitgebracht bij relevante wet- en regelgeving,
      ongewijzigd door te sturen aan de betreffende bewindsperso(o)n(en).
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: '5.4'
    text: |-
      De secretaris-generaal kan tijdelijke departementale projectorganisaties instellen en projectdirecteuren
      benoemen die leiding geven aan deze projectorganisaties. De secretaris-generaal kan deze projectorganisaties
      onder verantwoordelijkheid van de plaatsvervangend secretaris-generaal, een directeur-generaal of de inspecteur-
      generaal Werk en Inkomen stellen en bepalen dat de verlening van vertegenwoordigingsbevoegdheden aan de betreffende
      functionaris(sen) binnen de projectorganisatie door de betreffende directeur-generaal, plaatsvervangend secretaris-
      generaal of inspecteur-generaal kan geschieden.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel5
  - number: '6.1'
    text: |-
      De plaatsvervangend secretarisgeneraal vervangt de secretaris-generaal bij diens afwezigheid of verhindering. Hij
      treedt alsdan in de verantwoordelijkheden en bevoegdheden van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: '6.2'
    text: |-
      De plaatsvervangend secretarisgeneraal geeft rechtstreeks leiding aan de functionarissen die leiding geven aan de
      organisatieonderdelen, genoemd in [artikel 2, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      De plaatsvervangend secretarisgeneraal stelt de jaarplannen vast van de organisatieonderdelen, genoemd
      in [artikel 2, onder b][ref1]. Gegeven het budget dat door de secretaris-generaal aan de plaatsvervangend
      secretarisgeneraal ter beschikking is gesteld, kent de plaatsvervangend secretarisgeneraal aan de functionarissen
      die leiding geven aan de organisatieonderdelen, genoemd in [artikel 2, onder b][ref2], de budgetten toe waarover
      zij mogen beschikken. De plaatsvervangend secretaris-generaal bewaakt de voortgang van de uitvoering van
      jaarplannen van de organisatieonderdelen, genoemd in [artikel 2, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013298#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      De plaatsvervangend secretarisgeneraal is belast met de beleids- en bedrijfsvoering betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onder b][ref1]. Het werkterrein van de plaatsvervangend secretaris-
      generaal omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.4.a
    text: het organisatie- en personeelsbeleid;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.b
    text: het voorlichtings- en communicatiebeleid, inclusief de documentaire informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.c
    text: |-
      het financiële en administratieve beleid, inclusief taken ten aanzien van de departementale begroting
      en jaarverantwoording, het coördineren van het verkeer met de Algemene Rekenkamer en het uitvoeren van
      bekostigingsactiviteiten in het kader van wettelijke uitkerings- en subsidieregelingen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.d
    text: de uitvoering van de taken van de departementale Accountantsdienst;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.e
    text: |-
      het huisvestings- en beveiligingsbeleid voor wat betreft de Haagse vestigingen van het ministerie, met inbegrip van
      crisisbeheersing en milieumanagement;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.f
    text: het automatiserings- en informatiseringsbeleid;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.g
    text: overige facilitaire diensten, inclusief advisering op het gebied van inkoop en (Europese) aanbestedingen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.h
    text: het beheer van de pensioengarantieregeling voor oud-medewerkers van de emigratiecentrales;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.i
    text: |-
      het behandelen van bezwaar- en beroepschriften en zaken van de nationale ombudsman van (ex-)medewerkers van het
      ministerie inzake aangelegenheden verband houdend met de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.4.j
    text: |-
      de verzorging van ramingen en de daarvoor benodigde analyses met betrekking tot de beleidsterreinen van het
      ministerie en het regisseren, verkrijgen en beheren van de betreffende beleidsinformatie.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: '6.5'
    text: 'De plaatsvervangend secretarisgeneraal is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.5.a
    text: |-
      het bij schriftelijk besluit toedelen van taken aan de onder hem ressorterende organisatieonderdelen en aan de
      functionarissen die leiding geven aan deze organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.5.b
    text: |-
      de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de onder hem ressorterende organisatieonderdelen alsmede de hiervoor bedoelde werkgeversverplichtingen
      voor zover deze centraal georganiseerd zijn;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.5.c
    text: |-
      de personeelsaangelegenheden welke niet ingevolge [artikel 4, vijfde lid][ref1],
      aan de secretaris-generaal zijn voorbehouden, dan wel ingevolge
      [artikel 8, tweede lid, van het Besluit taakuitoefening Inspectie Werk en Inkomen][ref2] tot de bevoegdheden van de
      inspecteur-generaal Werk en Inkomen behoren, dan wel ingevolge [artikel 7, derde lid][ref3], tot de taken van een
      directeur- generaal of de inspecteur-generaal Werk en Inkomen behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013179#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013298#Artikel7
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013179
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013298
        artikel: '7'
        hoofdstuk: '3'
  - number: 6.5.d
    text: |-
      het adviseren van de bewindspersonen ten aanzien zijn werkterrein als bedoeld in het vierde lid en het attenderen
      van de bewindspersonen op politiek of maatschappelijk gevoelige aspecten ten aanzien van zijn werkterrein;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
  - number: 6.5.e
    text: |-
      het rapporteren aan de secretarisgeneraal over de uitvoering van de jaarplannen betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.5.f
    text: |-
      de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] voor
      zover deze betrekking hebben op gedragingen van functionarissen van de organisatieonderdelen, genoemd in
      [artikel 2, onder b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.5.g
    text: |-
      de behandeling van klachten over de wijze waarop de bemiddelingsorganisatie, bedoeld in artikel 1, onderdeel
      f, van de Regeling Kinderopvang SZW, uitvoering geeft aan de Regeling Kinderopvang SZW; h. een juiste,
      volledige en tijdige aanlevering aan de secretaris-generaal van de gegevens die in het mandaat-, volmacht- en
      machtigingsregister SZW, genoemd in [artikel 4, vijfde lid, onder i][ref1], moeten worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel4
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '4'
        hoofdstuk: '3'
  - number: 6a.1
    text: |-
      De plaatsvervangend secretarisgeneraal is bevoegd om namens een bewindspersoon besluiten te nemen,
      privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch
      een privaatrechtelijke rechtshandeling zijn, voor zover zij verband houden met zijn werkterrein als bedoeld in
      [artikel 6][ref1] en voor zover zij niet zijn voorbehouden aan een bewindspersoon of de secretaris-generaal. Van de
      volmacht, bedoeld in de eerste volzin, is evenwel uitgezonderd het aangaan van overeenkomsten met de Landsadvocaat
      en andere juridische dienstverleners inzake advisering en procureurstelling alsmede het instellen van gerechtelijke
      procedures, tenzij deze overeenkomsten betrekking hebben op beroepschriften van (ex- )medewerkers van het
      ministerie inzake aangelegenheden verband houdende met de dienstbetrekking of op de invordering van geldvorderingen
      van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel6
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.2
    text: |-
      2. De bevoegdheden van de plaatsvervangend secretaris-generaal, bedoeld in het eerste lid, omvatten in elk geval
      mandaat, volmacht en machtiging ten aanzien van de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
  - number: 6a.2.a
    text: |-
      beslissingen in bezwaar- en beroepsprocedures voor zover deze betrekking hebben op zijn verantwoordelijkheden of
      werkterrein als bedoeld in [artikel 6][ref1], met uitzondering van de beslissing op een beroepschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel6
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.2.b
    text: |-
      de in [artikel 6, vijfde lid][ref1], genoemde aangelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel6
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.2.c
    text: |-
      het benoemen van onder hem ressorterende hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan
      wie bevoegdheden zijn toegekend met betrekking tot personeelsaangelegenheden, voor zover het gaat om functies tot
      en met salarisschaal 13 van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], mits
      hij van zijn voornemen daartoe vooraf melding heeft gemaakt in de Commissie Management Development;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 6a.2.d
    text: |-
      de kwijtschelding en de voorlopige en definitieve buiteninvorderingstelling van vorderingen op derden van ten
      hoogste € 500.000,-, alsmede, na instemming van de minister van Financiën, de voorlopige buiteninvorderingstelling
      van vorderingen van meer dan € 500.000,-, een en ander voor zover deze vorderingen verband houden met zijn
      werkterrein als bedoeld in [artikel 6][ref1] en met uitzondering van vorderingen waarvan de oorsprong bij een
      voormalig organisatieonderdeel van het ministerie gelegen is;


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel6
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.2.e
    text: |-
      het instellen van tijdelijke projectorganisaties binnen zijn werkterrein als bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel6
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.2.f
    text: |-
      de formatie van de organisatieonderdelen, genoemd in [artikel 2, onder b][ref1], een en ander met inachtneming van
      de daarvoor beschikbaar gestelde budgetten en desbetreffende aanwijzingen van de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Elk van de directeuren-generaal, genoemd in [artikel 3, eerste lid][ref1], geeft rechtstreeks leiding aan de
      hoofden van de organisatieonderdelen welke ingevolge [artikel 2][ref2] rechtstreeks onder elk van hen ressorteren.


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Elke directeur-generaal en de inspecteur-generaal Werk en Inkomen stellen de jaarplannen vast van de onder
      elk van hen ressorterende organisatieonderdelen. Gegeven het budget dat door de secretaris-generaal aan de
      betreffende directeur-generaal respectievelijk de inspecteur-generaal ter beschikking is gesteld, kennen
      de directeuren-generaal en de inspecteurgeneraal aan de functionarissen die leiding geven aan de onder hen
      ressorterende organisatieonderdelen de budgetten toe waarover zij mogen beschikken. De directeuren-generaal en
      de inspecteur-generaal bewaken de voortgang van de uitvoering van jaarplannen van de onder hen ressorterende
      organisatieonderdelen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: '7.3'
    text: 'De directeuren-generaal en de inspecteur-generaal Werk en Inkomen zijn verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.3.a
    text: |-
      het bij schriftelijk besluit toedelen van taken aan de onder hen ressorterende organisatieonderdelen en aan de
      functionarissen die leiding geven aan deze organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.3.b
    text: |-
      de personeelsaangelegenheden van de functionarissen die onder hen ressorteren, voor zover dit niet ingevolge
      [artikel 4, vijfde lid][ref1], aan de secretarisgeneraal is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel4
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '4'
        hoofdstuk: '3'
  - number: 7.3.c
    text: |-
      de personeelsaangelegenheden van functionarissen die niet meer onder hen ressorteren en ten aanzien van wie geen
      andere verantwoordelijke functionaris binnen het ministerie (meer) aangewezen kan worden, maar die op 31 december
      2002 of later wel onder hen ressorteerden;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.3.d
    text: |-
      de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de onder hen ressorterende organisatieonderdelen, met uitzondering van de bij de plaatsvervangend
      secretaris-generaal belegde centraal georganiseerde werkgeversverplichtingen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.3.e
    text: |-
      het zorgdragen voor toedeling van de onder d bedoelde verantwoordelijkheid aan onder hen
      ressorterende functionarissen, voor zover deze functionarissen als bestuurder in de zin van
      [artikel 1 van de Wet op de ondernemingsraden][ref1] optreden;


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel1
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '1'
  - number: 7.3.f
    text: |-
      het adviseren van de bewindspersonen ten aanzien van hun eigen werkterrein en het attenderen van de bewindspersonen
      op politiek of maatschappelijk gevoelige aspecten ten aanzien van dat werkterrein;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.3.g
    text: |-
      het rapporteren aan de secretaris-generaal over de uitvoering van de jaarplannen betreffende de onder hen
      ressorterende organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.3.h
    text: |-
      de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] voor zover deze
      betrekking hebben op gedragingen van de onder hen ressorterende functionarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 7.3.i
    text: |-
      een juiste, volledige en tijdige aanlevering aan de secretaris-generaal van de gegevens die in het mandaat-,
      volmacht- en machtigingsregister SZW, genoemd in [artikel 4, vijfde lid, onder i][ref1], moeten worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel4
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '4'
        hoofdstuk: '3'
  - number: '7.4'
    text: |-
      Elke directeur-generaal is bevoegd om namens een bewindspersoon besluiten te nemen, privaatrechtelijke
      rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met zijn werkterrein en voor zover zij niet zijn voorbehouden
      aan een bewindspersoon of de secretaris-generaal. Van de volmacht, bedoeld in de eerste volzin, is evenwel
      uitgezonderd het aangaan van de volgende overeenkomsten:
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.a
    text: |-
      overeenkomsten met de Landsadvocaat en andere juridische dienstverleners inzake advisering en procureurstelling
      alsmede het instellen van gerechtelijke procedures;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.b
    text: |-
      overeenkomsten met het Centraal bureau voor de statistiek alsmede overeenkomsten met betrekking tot meerjarige,
      structurele beleidsinformatievoorziening die het verzamelen, bewerken en leveren van beleidsinformatie betreffen,
      voor zover deze informatie primair bedoeld is voor ramingen en verdeelmodellen, dan wel verband houdt met
      verplichtingen die voortvloeien uit de Regeling Prestatiegegevens en Evaluatieonderzoek Rijksoverheid zoals
      opgenomen in het Handboek Financiële Informatie en Administratie Rijksoverheid of met verplichtingen die
      voortvloeien uit internationale verdragen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.c
    text: |-
      overeenkomsten betreffende de organisatie van voorlichtings- en informatiecampagnes en de productie en distributie
      van voorlichtingsmateriaal;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.d
    text: overeenkomsten betreffende externe advisering in het kader van voorlichtingsprojecten;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.e
    text: |-
      overeenkomsten met de arbodienst, het centraal flankerend beleid ten behoeve van herplaatsers en de opvang van
      kinderen van medewerkers van het ministerie;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.f
    text: |-
      overeenkomsten betreffende de technische infrastructuur, de hardware, de kantoorautomatiseringssoftware, de
      datacommunicatievoorzieningen en het technisch beheer van geautomatiseerde systemen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.g
    text: |-
      overeenkomsten betreffende de huisvesting en facilitaire voorzieningen ten behoeve van de Haagse vestigingen van
      het ministerie;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.h
    text: overeenkomsten betreffende de gerechtelijke en buitengerechtelijke invordering van geldvorderingen van de Staat;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.4.i
    text: |-
      overeenkomsten met betrekking tot systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties
      van geautomatiseerde informatie- en salarissystemen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: '7.5'
    text: |-
      Het bepaalde in het vierde lid is van overeenkomstige toepassing op de inspecteur-generaal Werk en Inkomen, met
      dien verstande dat in afwijking van de uitzonderingen, bedoeld onder c, e, f, g en i voor hem het volgende geldt.
      De inspecteurgeneraal Werk en Inkomen is bevoegd tot het aangaan van overeenkomsten die betrekking hebben op
      de productie en distributie van voorlichtingsmateriaal gericht op de communicatie van toezichtsbevindingen en
      tot het aangaan van overeenkomsten met de arbodienst. Tevens is de inspecteur-generaal bevoegd tot het aangaan
      van overeenkomsten die betrekking hebben op systeemontwikkeling, licenties, functioneel beheer en onderhoud
      van applicaties van voorlichtings- en documentatiesystemen. Voorts is de inspecteur-generaal bevoegd om de
      overeenkomsten, bedoeld in het vierde lid, onder f en g, aan te gaan voor zover geen gebruik wordt gemaakt
      van de departementale infrastructuur en er geen sprake is van huisvesting in een gebouw waar tevens andere
      organisatieonderdelen van het ministerie, niet zijnde baten-lastendiensten, zijn gehuisvest.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: '7.6'
    text: |-
      De in het vierde en vijfde lid bedoelde bevoegdheden van de directeuren- generaal en de inspecteur-generaal Werk en
      Inkomen omvatten in elk geval mandaat, volmacht en machtiging ten aanzien van de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.6.a
    text: |-
      beslissingen in bezwaar- en beroepsprocedures voor zover deze betrekking hebben op hun eigen verantwoordelijkheden
      of werkterrein, met uitzondering van de beslissing op een beroepschrift;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.6.b
    text: de aangelegenheden, genoemd in het derde lid;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.6.c
    text: |-
      het benoemen van de onder hen ressorterende hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan
      wie bevoegdheden zijn toegekend met betrekking tot personeelsaangelegenheden, voor zover het gaat om functies tot
      en met salarisschaal 13 van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], mits
      zij van hun voornemen daartoe vooraf melding hebben gemaakt in de Commissie Management Development;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 7.6.d
    text: |-
      de kwijtschelding en de voorlopige en definitieve buiteninvorderingstelling van vorderingen op derden van ten
      hoogste € 500.000,-, alsmede, na instemming van de minister van Financiën, de voorlopige buiteninvorderingstelling
      van vorderingen van meer dan € 500.000,-, een en ander voor zover deze vorderingen verband houden met hun eigen
      werkterrein en met uitzondering van vorderingen waarvan de oorsprong bij een voormalig organisatieonderdeel van het
      ministerie gelegen is;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.6.e
    text: het instellen van tijdelijke projectorganisaties binnen hun eigen werkterrein;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.6.f
    text: |-
      de formatie van de onder hen ressorterende organisatieonderdelen, een en ander met inachtneming van de daarvoor
      beschikbaar gestelde budgetten en desbetreffende aanwijzingen van de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7.6.g
    text: |-
      het verlenen en vaststellen van subsidies en rijksvergoedingen, het aangaan van verbetertrajecten en het korten op
      bevoorschotting, voor zover het de uitvoering betreft van regelingen op hun eigen werkterrein.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: '7.7'
    text: |-
      De inspecteur-generaal Werk en Inkomen geeft op verzoek van een der kamers van de Staten-Generaal of van een
      commissie uit een van die kamers een toelichting op het jaarverslag of een andere rapportage van de Inspectie Werk
      en Inkomen nadat het desbetreffende stuk aan de kamers ter kennis is gebracht. De inspecteurgeneraal beperkt zich
      daarbij tot het geven van inlichtingen van feitelijke aard. De inspecteur-generaal stelt de minister terstond in
      kennis van een verzoek als hier bedoeld.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7
  - number: 7a
    text: |-
      De directeur-generaal Arbeidsverhoudingen en Internationale Betrekkingen is belast met de beleids- en
      bedrijfsvoering betreffende de organisatieonderdelen, genoemd in [artikel 2, onder c][ref1]. Het werkterrein van de
      directeur-generaal Arbeidsverhoudingen en Internationale Betrekkingen omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 7a.a
    text: het algemeen sociaal-economisch beleid;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7a
  - number: 7a.b
    text: |-
      de arbeidsverhoudingen met inbegrip van de aanvullende pensioenen, waaronder het beleid met betrekking tot
      arbeidsvoorwaardenvorming, publiekrechtelijke bedrijfsorganisatie, arbeidsrecht, kinderopvang en arbeid en zorg;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7a
  - number: 7a.c
    text: |-
      de departementale coördinatie van het internationaal beleid en het uitdragen van en onderhandelen over de
      Nederlandse standpunten in multilateraal en bilateraal verband;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7a
  - number: 7a.d
    text: de ontwikkeling en coördinatie van emancipatiebeleid.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7a
  - number: 7b
    text: |-
      De directeur-generaal Arbeidsomstandigheden en Sociale Verzekeringen is belast met de beleids- en bedrijfsvoering
      betreffende de organisatieonderdelen, genoemd in [artikel 2, onder d][ref1]. Het werkterrein van de directeur-
      generaal Arbeidsomstandigheden en Sociale Verzekeringen omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 7b.a
    text: |-
      het beleid met betrekking tot de bestrijding en preventie van arbeidsrisico’s en arbeidsongeschiktheid in ruime
      zin;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7b
  - number: 7b.b
    text: |-
      het beleid ten aanzien van de werknemers- en volksverzekeringen met inbegrip van het beleid met betrekking tot
      grensoverschrijdende verzekeringsposities van personen die naar Nederland komen dan wel uit Nederland vertrekken en
      het beleid met betrekking tot de financiering van de werknemers- en volksverzekeringen en de daarmee samenhangende
      administratieve lasten.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7b
  - number: 7c
    text: |-
      De directeur-generaal Arbeidsmarktbeleid en Bijstand is belast met de beleids- en bedrijfsvoering betreffende
      de organisatieonderdelen, genoemd in [artikel 2, onder e][ref1]. Het werkterrein van de directeurgeneraal
      Arbeidsmarktbeleid en Bijstand omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 7c.a
    text: |-
      het arbeidsmarktbeleid met inbegrip van de problematiek van de arbeidsmigratie, de werking van de
      arbeidsbemiddelingsmarkt, het instrumentarium van gesubsidieerde arbeid en het beleid rond arbeidsinpassing van
      arbeidsgehandicapten;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7c
  - number: 7c.b
    text: het bijstandsbeleid en het activeringsbeleid van gemeenten;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7c
  - number: 7c.c
    text: de verdere ontwikkeling van de departementale kaders voor het reïntegratiebeleid;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7c
  - number: 7c.d
    text: het beleid met betrekking tot subsidieregelingen op het terrein van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7c
  - number: 7d
    text: |-
      De directeur-generaal Uitvoeringsbeleid Werk en Inkomen is belast met de beleids- en bedrijfsvoering betreffende
      de organisatieonderdelen, genoemd in [artikel 2, onder f][ref1]. Het werkterrein van de directeurgeneraal
      Uitvoeringsbeleid Werk en Inkomen omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '2'
        hoofdstuk: '2'
  - number: 7d.a
    text: |-
      het uitvoeringsbeleid, het (doen) uitvoeren van uitvoeringstoetsen en het bevorderen van een rechtmatige en
      effectieve uitvoering op het gebied van werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7d
  - number: 7d.b
    text: |-
      het bevorderen van een doeltreffende en doelmatige toepassing van informatie- en communicatietechnologie in het
      gehele uitvoeringsdomein van het ministerie;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7d
  - number: 7d.c
    text: |-
      de coördinatie en monitoring van het opsporingsbeleid op het terrein van het ministerie en het jaarlijks opstellen
      van een opsporingsbeleidsplan en handhavingsarrangement;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7d
  - number: 7d.d
    text: |-
      het opsporen van zware strafbare feiten op de beleidsterreinen waarvoor de minister verantwoordelijkheid draagt,
      het in het kader van deze opsporing constateren van andere strafbare feiten welke daarmee verband houden, het in
      verband met de opsporing van strafbare feiten voeren van registers als genoemd in de [Wet politieregisters][ref1]
      en het verwerken van persoonsgegevens binnen het kader van de [Wet bescherming persoonsgegevens][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0004798
      - id: ref2
        bwb_id: BWBR0011468
  - number: 7d.e
    text: het toetsen van voorgenomen weten regelgeving op handhaafbaarheid en fraudegevoeligheid.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel7d
  - number: '43.1'
    text: |-
      De uitoefening van vertegenwoordigingsbevoegdheden geschiedt binnen de grenzen van de vastgestelde taken en met
      inachtneming van het terzake geldende recht alsmede de voor de rijksdienst en voor het ministerie geldende beleids-
      en uitvoeringsregels.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: '43.2'
    text: |-
      De algemene bepalingen inzake organisatie, mandaat, volmacht en machtiging in dit besluit zijn tevens van
      toepassing ten aanzien van de uitoefening van bevoegdheden die krachtens ondermandaat respectievelijk doorverlening
      van volmacht en machtiging worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: '43.3'
    text: |-
      Het uitoefenen van vertegenwoordigingsbevoegdheden die betrekking hebben op aangelegenheden met (mogelijke)
      financiële gevolgen geschiedt, onverminderd het bepaalde in het eerste lid, met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: 43.3.a
    text: de begrotingswet en de daarbij gegeven financiële ruimte;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: 43.3.b
    text: de voor de vertegenwoordigingsbevoegde geldende budgetten en bestedingsplannen;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: 43.3.c
    text: |-
      het bepaalde bij en krachtens de [Comptabiliteitswet][ref1], de [Comptabiliteitswet 2001][ref2] en de aanwijzingen
      van de directeur Financieel-Economische Zaken op grond van die wet en de daarop berustende regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0013891
  - number: 43.3.d
    text: door de secretaris-generaal te stellen regels betreffende de (financiële) besturing van het ministerie.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: '43.4'
    text: 'Verleningen van mandaat, volmacht en machtiging zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: 43.4.a
    text: indien bij wettelijk voorschrift is bepaald dat verlening van de betreffende bevoegdheid niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: 43.4.b
    text: indien de aard van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel43
  - number: '44.1'
    text: |-
      De afdoening van alle stukken, waarvan de bewindspersonen aangeven dat zij deze zelf wensen af te doen, geschiedt
      door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel44
  - number: '44.2'
    text: |-
      Tenzij de bewindspersonen anders te kennen geven worden brieven ter beantwoording van persoonlijke brieven, gericht
      aan (een van) de bewindspersonen, ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel44
  - number: '44.3'
    text: |-
      De vertegenwoordigingsbevoegde is gehouden in de ondertekening van stukken die op basis van mandaat, volmacht
      of machtiging worden ondertekend, zijn vertegenwoordigingsbevoegdheid tot uitdrukking te brengen door opneming
      van de volgende formule: De Minister van Sociale Zaken en Werkgelegenheid, namens deze, functie betrokken
      vertegenwoordigingsbevoegde, handtekening van de betrokken vertegenwoordigingsbevoegde, naam van de betrokken
      vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel44
  - number: '44.4'
    text: |-
      Stukken kunnen met goedvinden van een bewindspersoon overeenkomstig de door hen geparafeerde minute worden
      ondertekend door de secretaris-generaal dan wel door een door de bewindspersoon aan te wijzen andere functionaris.
      Daartoe wordt de volgende formule opgenomen: Overeenkomstig het door de Minister genomen besluit, functie betrokken
      vertegenwoordigingsbevoegde, handtekening van de betrokken vertegenwoordigingsbevoegde, naam van de betrokken
      vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel44
  - number: '44.5'
    text: |-
      In afwijking van het bepaalde in het derde en vierde lid, wordt in de ondertekening van stukken die betrekking
      hebben op een aangelegenheid die volgens de geldende taakverdeling tussen de bewindspersonen behoort tot het
      takenpakket van een staatssecretaris, in plaats van `Minister' vermeld: Staatssecretaris. Indien het ministerie
      meer dan een staatssecretaris heeft, wordt daaraan de naam van de betreffende staatssecretaris toegevoegd.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel44
  - number: '45.1'
    text: 'Stukken, bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.a
    text: de Koningin;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.b
    text: de Raad van State (van het Koninkrijk), voorzover betrekking hebbend op wetgeving;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.c
    text: de Raad van Ministers (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.d
    text: de Eerste of Tweede Kamer der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.e
    text: de Algemene rekenkamer;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.f
    text: de Nationale ombudsman en
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: 45.1.g
    text: een extern advies- of overlegorgaan, worden vastgesteld en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: '45.2'
    text: |-
      Ministeriële regelingen houdende algemeen verbindende voorschriften worden vastgesteld en ondertekend door een
      bewindspersoon. Indien bij of krachtens de wet waarbij de bevoegdheid tot het vaststellen van een ministeriële
      regeling wordt verleend in de mogelijkheid van mandaatverlening is voorzien kan een ministeriële regeling namens
      de bewindspersoon worden vastgesteld en ondertekend door hetzij de functionaris die daartoe bij of krachtens die
      wetsbepaling is aangewezen, hetzij de functionaris die daarvoor op grond van deze regeling in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: '45.3'
    text: |-
      Besluiten inzake het verlenen van goedkeuring aan, het schorsen of het vernietigen van dan wel het onthouden van
      goedkeuring aan besluiten van een ander bestuursorgaan worden genomen en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: '45.4'
    text: |-
      Besluiten inzake de definitieve buiteninvorderingstelling van vorderingen op derden van meer dan € 500.000,- worden
      genomen en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: '45.5'
    text: |-
      Besluiten inzake kwijtschelding van vorderingen op derden van meer dan € 500.000,- worden genomen en ondertekend
      door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel45
  - number: '46'
    text: |-
      Bij afwezigheid of verhindering van een vertegenwoordigingsbevoegde worden, voor de duur van de afwezigheid of
      verhindering, diens taken en bevoegdheden waargenomen door een daartoe aan te wijzen plaatsvervanger, behoudens de
      bevoegdheid tot het verlenen, wijzigen of intrekken van mandaten, volmachten en machtigingen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel46
  - number: '47'
    text: |-
      Tenzij in deze regeling anders is bepaald, is de leidinggevende van een vertegenwoordigingsbevoegde te allen tijde
      bevoegd de aan deze verleende bevoegdheden zelf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel47
  - number: '48'
    text: |-
      De vertegenwoordigingsbevoegde maakt geen gebruik van een aan hem verleende bevoegdheid in de gevallen waarin hij
      weet of redelijkerwijze moet vermoeden dat diens leidinggevende een besluit dient te nemen of een stuk dient vast
      te stellen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel48
  - number: '49'
    text: |-
      Een vertegenwoordigingsbevoegde is niet bevoegd tot het nemen van besluiten over en het vaststellen en ondertekenen
      van stukken op het gebied van personeelsaangelegenheden die betrekking hebben op hemzelf.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel49
  - number: '50'
    text: |-
      Beleidsregels als bedoeld in [artikel 1:3, vierde lid, van de Algemene wet bestuursrecht][ref1] worden vastgesteld
      en ondertekend door een directeur-generaal, door de plaatsvervangend secretaris-generaal, door de secretaris-
      generaal of door een bewindspersoon; mandaat tot het vaststellen en ondertekenen van beleidsregels kan niet aan een
      functionaris onder het niveau van directeur-generaal worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '51'
    text: |-
      Vergunningen op grond van [artikel 15, onderdelen b en c, van de Kernenergiewet][ref1] worden vastgesteld en
      ondertekend door de plaatsvervangend secretaris-generaal, door de secretaris-generaal of door een bewindspersoon;
      mandaat tot het vaststellen en ondertekenen van deze vergunningen kan niet aan een functionaris onder het niveau
      van directeur-generaal worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '52.1'
    text: |-
      Het gebruik van een afgesloten mantelcontract is verplicht, behoudens toestemming van de mantelcontracthouder om
      hiervan af te wijken.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel52
  - number: '52.3'
    text: |-
      Indien een organisatieonderdeel overweegt om een voorgenomen opdracht met een waarde van € 162.293,- of meer niet
      Europees aan te besteden, omdat zij van mening is dat de betreffende opdracht niet onder het regiem van één van
      de EG-aanbestedingsrichtlijnen valt, dan wel dat een beroep gedaan kan worden op uitzonderingsbepalingen binnen de
      richtlijnen, is inschakeling van de directeur Wetgeving, Bestuurlijke en Juridische Aangelegenheden verplicht.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel52
  - number: '52.4'
    text: |-
      Indien op een overeenkomst de Europese aanbestedingsregels van toepassing zijn, is inschakeling van de directeur
      Algemene Zaken verplicht.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel52
  - number: '52.5'
    text: |-
      Het eerste, derde en vierde lid zijn niet van toepassing ten aanzien van het Agentschap SZW en de Inspectie Werk
      en Inkomen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel52
  - number: '53.1'
    text: |-
      De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de inspecteurgeneraal
      Werk en Inkomen kunnen hun vertegenwoordigingsbevoegdheden in een door hen te bepalen omvang mandateren of
      doorverlenen aan onder hen ressorterende functionarissen. Zij kunnen daarbij bepalen dat deze ondermandaat kunnen
      verlenen respectievelijk volmacht en machtiging kunnen doorverlenen aan rechtstreeks onder hen ressorterende
      functionarissen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: '53.2'
    text: |-
      2. Bevoegdheden ten aanzien van de volgende aangelegenheden kunnen niet worden doorverleend aan een functionaris
      onder het niveau van directeur-generaal of inspecteur-generaal Werk en Inkomen:
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: 53.2.a
    text: het aangaan van overeenkomsten met een waarde van € 500.000,- of meer;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: 53.2.b
    text: |-
      het benoemen van hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan wie bevoegdheden zijn
      toegekend met betrekking tot personeelsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: 53.2.c
    text: |-
      het op grond van [artikel 22a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] toekennen van
      periodieke toeslagen voor zover het gaat om toeslagen om redenen van werving en behoud;


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22a
  - number: 53.2.d
    text: |-
      de voorlopige buiteninvorderingstelling, na instemming van de minister van Financiën, van vorderingen op derden van
      meer dan € 500.000,-;
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: 53.2.e
    text: de formatie van organisatieonderdelen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: '53.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid kunnen vertegenwoordigingsbevoegden hun bevoegdheden
      eveneens doorverlenen aan functionarissen die niet onder hen ressorteren, mits de betreffende functionaris daarmee
      schriftelijk instemt.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: '53.4'
    text: |-
      De (door)verlening van (onder)mandaat, volmacht en machtiging kan uitsluitend bij een schriftelijk besluit
      geschieden.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel53
  - number: '55'
    text: |-
      De vertegenwoordigingsbevoegde brengt de door hem vastgestelde organisatie-, mandaat- en volmachtbesluiten
      onmiddellijk en in elk geval voor de bekendmaking ter kennis aan de mandaat- respectievelijk volmachtgever en -
      indien deze niet tevens de directe leidinggevende is - aan de directe leidinggevende, alsmede aan de secretaris-
      generaal.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel55
  - number: '56.1'
    text: |-
      Aan de uitoefening van de bij dit besluit opgedragen taken en van de bij en krachtens dit besluit verleende
      bevoegdheden kunnen door iedere leidinggevende algemene en bijzondere aanwijzingen aan zijn ondergeschikten worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel56
  - number: '56.2'
    text: De vertegenwoordigingsbevoegde is gehouden de algemene en bijzondere aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel56
  - number: '56.3'
    text: |-
      Elke leidinggevende is gehouden toe te zien op de naleving door zijn ondergeschikten van deze en eventuele andere
      mandaat- en volmachtbesluiten en van de aan de uitoefening van het mandaat, de volmacht of machtiging verbonden
      algemene en bijzondere aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel56
  - number: '56.4'
    text: |-
      De vertegenwoordigingsbevoegde is gehouden met inachtneming van de door zijn leidinggevende(n) te geven algemene
      en bijzondere aanwijzingen aan zijn leidinggevende(n) te rapporteren over de wijze waarop hij zijn taken heeft
      uitgeoefend en van zijn vertegenwoordigingsbevoegdheden gebruik heeft gemaakt. De leidinggevende(n) kan/kunnen
      algemene en bijzondere aanwijzingen geven omtrent de vorm, inhoud, tijdstippen en perioden van de rapportage.
      Voorzover het de financiële bedrijfsvoering betreft, legt de vertegenwoordigingsbevoegde mede verantwoording af aan
      de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel56
  - number: '56.5'
    text: Alle in deze regeling genoemde bedragen zijn inclusief BTW.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel56
  - number: '57'
    text: |-
      In de Regeling openbaarheid van bestuur Sociale Zaken en Werkgelegenheid wordt `directie Voorlichting, Bibliotheek
      en Documentatie' steeds vervangen door: directie Communicatie.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel57
  - number: '58'
    text: Het Organisatie-, mandaat- en volmachtbesluit SZW 1999 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel58
  - number: '59'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel59
  - number: '60'
    text: 'Deze regeling wordt aangehaald als: Organisatie-, mandaat- en volmachtbesluit SZW 2002.'
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel60
