        artikel: '37'
  - number: '4.1'
    text: |-
      De secretaris-generaal is, gelet op het koninklijk besluit van 18 oktober 1988, houdende regeling van de functie
      en verantwoordelijkheid van de secretaris-generaal (Stb. 1988, 499), belast met de ambtelijke leiding van het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel4
  - number: '4.2'
    text: |-
      De secretaris-generaal geeft rechtstreeks leiding aan de functionarissen, genoemd in
      [artikel 3, eerste lid, onderdeel b tot en met g][ref1], en aan de functionarissen die leiding geven aan de
      organisatieonderdelen, genoemd in [artikel 2, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013298#Artikel2
    url: https://wetten.overheid.nl/BWBR0013298/2003-11-26#Artikel4
    references:
