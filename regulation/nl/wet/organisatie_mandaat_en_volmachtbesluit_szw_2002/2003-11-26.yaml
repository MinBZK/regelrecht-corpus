articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

            a

              *het ministerie:*


              het Ministerie van Sociale Zaken en Werkgelegenheid;



            b

              *de minister:*


              de Minister van Sociale Zaken en Werkgelegenheid;



            c

              *bewindspersoon:*


              de Minister of een Staatssecretaris van Sociale Zaken en Werkgelegenheid;



            d

              *mandaat:*


              de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;



            e

              *volmacht:*


              de bevoegdheid om in naam van een bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;



            f

              *machtiging:*


              de bevoegdheid om in naam van een bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn;



            g

              *vertegenwoordigingsbevoegdheid:*


              de bevoegdheid om namens een bewindspersoon, onder diens verantwoordelijkheid en met inachtneming van diens
      algemene en bijzondere aanwijzingen, besluiten te nemen, privaatrechtelijke rechtshandelingen te verrichten dan wel
      handelingen te verrichten die noch een besluit noch een privaatrechtelijke rechtshandeling zijn;



            h






            i

              *de inspecteur-generaal Werk en Inkomen:*


              het hoofd van de Inspectie Werk en Inkomen, genoemd in
      [artikel 36, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];



            j

              *bedrijfsvoering:*


              de sturing en beheersing van bedrijfsprocessen om de gestelde beleidsdoelstellingen te kunnen realiseren.


