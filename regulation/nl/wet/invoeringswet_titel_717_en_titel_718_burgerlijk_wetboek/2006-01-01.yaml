preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering te regelen van de wet tot vaststelling
    van titel 7.17 (verzekering) en titel 7.18 (lijfrente) van het nieuwe Burgerlijk Wetboek en in verband daarmee de
    wetgeving aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019383/2006-01-01#ArtikelAanhef
articles:
  - number: IX
    text: |-
      Op een vóór het tijdstip van inwerkingtreding van deze wet gelegd beslag op de rechten uit een sommenverzekering,
      een voor dat tijdstip uitgesproken faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen
      zijn de artikelen III en IV van de wet van 22 december 2005 tot vaststelling van titel 7.17 (verzekering) en titel
      7.18 (lijfrente) van het nieuwe Burgerlijk Wetboek (Stb. 700) niet van toepassing en blijft het tevoren geldende
      recht ook na dit tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0019383/2006-01-01#ArtikelIX
  - number: X
    text: |-
      1 Onze Minister van Justitie stelt de nummering van de artikelen van het bij koninklijke boodschap van 16 mei
      1986 ingediende voorstel van wet tot vaststelling van titel 7.17 (verzekering) en titel 7.18 (lijfrente) van het
      nieuwe Burgerlijk Wetboek (Kamerstukken I 2002/03, 19 529, nr. 206), nadat het tot wet is verheven en in werking
      is getreden, en deze wet, opnieuw vast, en brengt in die wetten voorkomende aanhalingen met die nummering in
      overeenstemming.

      2 Hij draagt ervoor zorg dat de overeenkomstig lid 1 bijgewerkte teksten van die wetten in het Staatsblad worden
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019383/2006-01-01#ArtikelX
  - number: XI
    text: |-
      Deze wet, alsmede het bij koninklijke boodschap van 16 mei 1986 ingediende voorstel van wet tot vaststelling van
      titel 7.17 (verzekering) en titel 7.18 (lijfrente) van het nieuwe Burgerlijk Wetboek (Kamerstukken I 2002/03, 19
      529, nr. 206), nadat het tot wet is verheven, treden in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019383/2006-01-01#ArtikelXI
  - number: XII
    text: 'Deze wet wordt aangehaald als: Invoeringswet titel 7.17 en titel 7.18 Burgerlijk Wetboek.'
    url: https://wetten.overheid.nl/BWBR0019383/2006-01-01#ArtikelXII
