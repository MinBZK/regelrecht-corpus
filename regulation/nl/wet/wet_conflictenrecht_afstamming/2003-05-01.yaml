$id: wet_conflictenrecht_afstamming
regulatory_layer: WET
publication_date: '2011-06-08'
valid_from: '2003-05-01'
bwb_id: BWBR0013513
url: https://wetten.overheid.nl/BWBR0013513/2003-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regels te stellen met betrekking tot het
    conflictenrecht inzake familierechtelijke betrekkingen uit hoofde van afstamming;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Of een kind door geboorte in familierechtelijke betrekkingen komt te staan tot de vrouw uit wie het is
      geboren en de met haar gehuwde of gehuwd geweest zijnde man, wordt bepaald door het recht van de staat van de
      gemeenschappelijke nationaliteit van de vrouw en de man of, indien dit ontbreekt, door het recht van de staat waar
      de vrouw en de man elk hun gewone verblijfplaats hebben, of indien ook dit ontbreekt, door het recht van de staat
      van de gewone verblijfplaats van het kind.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid is bepalend het tijdstip van de geboorte van het kind, dan wel indien het
      huwelijk van de ouders voordien is ontbonden, dat van de ontbinding.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel1
  - number: '1.3'
    text: |-
      Hebben de vrouw en de man meer dan één gemeenschappelijke nationaliteit, dan worden zij voor de toepassing van het
      eerste lid geacht geen gemeenschappelijke nationaliteit te hebben.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel1
  - number: '2.1'
    text: |-
      Of familierechtelijke betrekkingen als bedoeld in [artikel 1][ref1] in een gerechtelijke procedure tot
      gegrondverklaring van een ontkenning kunnen worden tenietgedaan, wordt bepaald door het recht dat ingevolge dat
      artikel op het bestaan van die betrekkingen toepasselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel1
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.2'
    text: |-
      Is volgens het in het eerste lid bedoelde recht ontkenning niet of niet meer mogelijk, dan kan de rechter, indien
      zulks in het belang is van het kind en de ouders en het kind een daartoe strekkend gezamenlijk verzoek doen,
      een ander in [artikel 1][ref1] genoemd recht toepassen, dan wel het recht toepassen van de staat van de gewone
      verblijfplaats van het kind ten tijde van de ontkenning of het Nederlandse recht.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel1
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.3'
    text: |-
      Ongeacht het ingevolge het eerste of het tweede lid toepasselijke recht is in de daar bedoelde gerechtelijke
      procedure [artikel 212 van Boek 1 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel212
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '212'
  - number: '2.4'
    text: |-
      Of familierechtelijke betrekkingen tussen een kind en de met zijn moeder gehuwde of gehuwd geweest zijnde man
      door een verklaring houdende ontkenning door de moeder ten overstaan van de ambtenaar van de burgerlijke stand
      kunnen worden tenietgedaan, wordt bepaald door het recht dat ingevolge [artikel 1][ref1] op het bestaan van die
      betrekkingen toepasselijk is. Onverminderd het eerste en het tweede lid, kan een zodanige verklaring slechts
      worden afgelegd indien de met de moeder gehuwde of gehuwd geweest zijnde nog levende man erin toestemt en indien
      tegelijkertijd familierechtelijke betrekkingen tussen het kind en een andere man ontstaan of worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel1
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '1'
        hoofdstuk: '1'
  - number: '3.1'
    text: |-
      Of tussen een vrouw en het buiten huwelijk uit haar geboren kind door geboorte familierechtelijke betrekkingen
      ontstaan, wordt bepaald door het recht van de staat van de nationaliteit van de vrouw. In elk geval ontstaan
      zodanige betrekkingen indien de vrouw haar gewone verblijfplaats in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel3
  - number: '3.2'
    text: Voor de toepassing van het eerste lid is bepalend het tijdstip van de geboorte.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel3
  - number: '3.3'
    text: |-
      Het eerste en het tweede lid laten onverlet de toepassing van de op 12 september 1962 te Brussel tot stand gekomen
      Overeenkomst betreffende de vaststelling van betrekkingen tussen het onwettige kind en zijn moeder (Trb. 1963, 93).
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel3
  - number: '4.1'
    text: |-
      Of erkenning door een man familierechtelijke betrekkingen doet ontstaan tussen hem en een kind, wordt, wat betreft
      de bevoegdheid van de man en de voorwaarden voor de erkenning, bepaald door het recht van de staat waarvan de man
      de nationaliteit bezit. Indien volgens dat recht erkenning niet of niet meer mogelijk is, is bepalend het recht van
      de staat van de gewone verblijfplaats van het kind. Is zij ook volgens dat recht niet of niet meer mogelijk, dan is
      bepalend het recht van de staat waarvan het kind de nationaliteit bezit. Is zij volgens dat recht ook niet of niet
      meer mogelijk, dan is bepalend het recht van de staat van de gewone verblijfplaats van de man.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel4
  - number: '4.2'
    text: |-
      Ongeacht het ingevolge het eerste lid toepasselijke recht, bepaalt het Nederlandse recht of een Nederlandse gehuwde
      man bevoegd is een kind van een andere vrouw dan zijn echtgenote te erkennen.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel4
  - number: '4.3'
    text: |-
      De akte van erkenning en de latere vermelding van de erkenning vermelden het recht dat ingevolge het eerste of het
      tweede lid is toegepast.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel4
  - number: '4.4'
    text: |-
      Ongeacht het ingevolge het eerste lid toepasselijke recht, is op de toestemming van de moeder, onderscheidenlijk
      het kind, tot de erkenning toepasselijk het recht van de staat waarvan de moeder, onderscheidenlijk het kind,
      de nationaliteit bezit. Bezit de moeder, onderscheidenlijk het kind, de Nederlandse nationaliteit, dan is het
      Nederlandse recht van toepassing. Indien het toepasselijke recht de erkenning niet kent, is toepasselijk het
      recht van de staat van de gewone verblijfplaats van de moeder, onderscheidenlijk het kind. Het op de toestemming
      toepasselijke recht bepaalt tevens of bij gebreke van toestemming deze kan worden vervangen door een rechterlijke
      beslissing.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel4
  - number: '4.5'
    text: Voor de toepassing van de voorgaande leden is bepalend het tijdstip van de erkenning en de toestemming.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel4
  - number: '5'
    text: |-
      Of en op welke wijze een erkenning kan worden tenietgedaan, wordt, wat betreft de bevoegdheid van de man en de
      voorwaarden voor de erkenning, bepaald door het ingevolge [artikel 4, eerste en tweede lid][ref1], toegepaste
      recht, en wat betreft de toestemming van de moeder, onderscheidenlijk het kind, door het recht dat ingevolge
      [artikel 4, vierde lid][ref2], toepasselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013513#Artikel4
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013513
        artikel: '4'
        hoofdstuk: '2'
  - number: '6.1'
    text: |-
      Of en onder welke voorwaarden het vaderschap van een man gerechtelijk kan worden vastgesteld, wordt bepaald door
      het recht van de staat van de gemeenschappelijke nationaliteit van de man en de moeder of, indien dit ontbreekt,
      door het recht van de staat van hun gemeenschappelijke gewone verblijfplaats of, indien ook dit ontbreekt, door het
      recht van de staat van de gewone verblijfplaats van het kind.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid is bepalend het tijdstip van de indiening van het verzoek. Is de man of de
      moeder op dat tijdstip overleden, dan is, bij gebreke van een gemeenschappelijke nationaliteit op het tijdstip van
      zijn overlijden, toepasselijk het recht van de staat van de gemeenschappelijke gewone verblijfplaats van de man en
      de moeder op dat tijdstip of, indien ook dat ontbreekt, het recht van de staat van de gewone verblijfplaats van het
      kind op het tijdstip van de indiening van het verzoek.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel6
  - number: '6.3'
    text: |-
      Hebben de man en de vrouw meer dan één gemeenschappelijke nationaliteit, dan worden zij voor de toepassing van de
      voorgaande leden geacht geen gemeenschappelijke nationaliteit te hebben.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel6
  - number: '7.1'
    text: |-
      Of een kind door het huwelijk van een van zijn ouders, dan wel door een nadien genomen beslissing van een
      rechterlijke of andere bevoegde autoriteit, wordt gewettigd, wordt bepaald door de op 10 december 1970 te Rome tot
      stand gekomen Overeenkomst inzake wettiging door huwelijk (Trb. 1972, 61).
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel7
  - number: '7.2'
    text: |-
      Indien toepassing van het eerste lid niet leidt tot de wettiging, kunnen familierechtelijke betrekkingen door
      wettiging worden gevestigd volgens het recht van de staat van de gewone verblijfplaats van het kind.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste en het tweede lid gelden niet indien een van de ouders de Nederlandse nationaliteit bezit en
      het huwelijk niet geldig is voltrokken in overeenstemming met het bepaalde in de [artikelen 4][ref1] en
      [5 van de Wet conflictenrecht huwelijk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004619#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004619#Artikel5
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004619
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004619
        artikel: '5'
  - number: '7.4'
    text: |-
      Voor de toepassing van de voorgaande leden is bepalend het tijdstip van het huwelijk van de ouders, dan wel, bij
      de totstandkoming van de familierechtelijke betrekkingen door de beslissing van een rechterlijke of andere bevoegde
      autoriteit, het tijdstip van de indiening van het verzoek of de vordering.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel7
  - number: '8.1'
    text: |-
      Onverminderd hetgeen ten aanzien van bijzondere onderwerpen is bepaald, wordt de inhoud van de familierechtelijke
      betrekkingen tussen ouders en kind bepaald door het recht van de staat van de gemeenschappelijke nationaliteit van
      de ouders of, indien dit ontbreekt, door het recht van de staat van hun gemeenschappelijke gewone verblijfplaats
      of, indien ook dit ontbreekt, door het recht van de staat van de gewone verblijfplaats van het kind.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel8
  - number: '8.2'
    text: |-
      Bestaan alleen familierechtelijke betrekkingen tussen de moeder en het kind, dan wordt de inhoud van deze
      familierechtelijke betrekkingen bepaald door het recht van de staat van de gemeenschappelijke nationaliteit van de
      moeder en het kind. Bij gebreke van een gemeenschappelijke nationaliteit wordt zij bepaald door het recht van de
      gewone verblijfplaats van het kind.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel8
  - number: '8.3'
    text: |-
      Hebben de vrouw en de man meer dan één gemeenschappelijke nationaliteit, dan worden zij voor de toepassing van de
      voorgaande leden geacht geen gemeenschappelijke nationaliteit te hebben.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel8
  - number: '9.1'
    text: |-
      Een buitenslands tot stand gekomen onherroepelijke rechterlijke beslissing waarbij familierechtelijke betrekkingen
      uit hoofde van afstamming zijn vastgesteld of gewijzigd, wordt in Nederland van rechtswege erkend, tenzij
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
  - number: 9.1.a
    text: er voor de rechtsmacht van de rechter kennelijk onvoldoende aanknoping bestond met de rechtssfeer van zijn land;
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
  - number: 9.1.b
    text: aan die beslissing kennelijk geen behoorlijk onderzoek of behoorlijke rechtspleging is voorafgegaan, of
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
  - number: 9.1.c
    text: de erkenning van die beslissing kennelijk in strijd met de openbare orde zou zijn.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
  - number: '9.2'
    text: |-
      De erkenning van de beslissing kan, ook wanneer daarbij een Nederlander betrokken is, niet wegens strijd met de
      openbare orde worden geweigerd op de enkele grond dat daarop een ander recht is toegepast dan uit de bepalingen van
      deze wet zou zijn gevolgd.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
  - number: '9.3'
    text: |-
      De beslissing is niet vatbaar voor erkenning indien zij onverenigbaar is met een onherroepelijk geworden beslissing
      van de Nederlandse rechter inzake de vaststelling of wijziging van dezelfde familierechtelijke betrekkingen.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
  - number: '9.4'
    text: |-
      De voorgaande leden laten de toepassing van de in [artikel 7, eerste lid][ref1], bedoelde overeenkomst onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel7
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '7'
        hoofdstuk: '3'
  - number: '10.1'
    text: |-
      De bepalingen van [artikel 9, eerste lid, onderdelen b en c, tweede en derde lid][ref1], zijn van overeenkomstige
      toepassing op buitenslands tot stand gekomen rechtsfeiten of rechtshandelingen waarbij familierechtelijke
      betrekkingen zijn vastgesteld of gewijzigd, welke zijn neergelegd in door een bevoegde instantie overeenkomstig de
      plaatselijke voorschriften opgemaakte akte.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel9
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '9'
        hoofdstuk: '5'
  - number: '10.2'
    text: |-
      Een weigeringsgrond als bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], doet zich met betrekking tot de
      erkenning in elk geval voor


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel9
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '9'
        hoofdstuk: '5'
  - number: 10.2.a
    text: indien deze is verricht door een Nederlander die naar Nederlands recht niet bevoegd zou zijn het kind te erkennen;
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel10
  - number: 10.2.b
    text: |-
      indien, wat de toestemming van de moeder of het kind betreft, niet is voldaan aan de vereisten van het recht dat
      ingevolge [artikel 4, vierde lid][ref1], toepasselijk is, of


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel4
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '4'
        hoofdstuk: '2'
  - number: 10.2.c
    text: indien de akte kennelijk op een schijnhandeling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel10
  - number: '10.3'
    text: |-
      De voorgaande leden laten de toepassing van de in [artikel 7, eerste lid][ref1], genoemde overeenkomst onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0013513#Artikel7
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013513
        artikel: '7'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      Deze wet is van toepassing op rechtsbetrekkingen die na haar inwerkingtreding worden vastgesteld of gewijzigd
      alsmede op de erkenning van na haar inwerkingtreding buitenslands vastgestelde of gewijzigde rechtsbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel11
  - number: '12'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet conflictenrecht afstamming.'
    url: https://wetten.overheid.nl/BWBR0013513/2003-05-01#Artikel13
