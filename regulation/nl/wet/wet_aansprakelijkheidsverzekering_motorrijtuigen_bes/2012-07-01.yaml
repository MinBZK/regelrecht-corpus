  - number: 21a
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren.

      2 Op de eerste vordering van een ambtenaar als bedoeld in het eerste lid, is de bestuurder van een motorrijtuig
      verplicht dit te doen stil houden en het document, bedoeld in [artikel 11][ref2], behoorlijk ter inzage af te
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028254#Artikel11
