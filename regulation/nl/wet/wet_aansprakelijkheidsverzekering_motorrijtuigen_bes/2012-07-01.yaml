        artikel: '14'
  - number: '11'
    text: |-
      1 De bestuurder van een motorrijtuig moet bij zich hebben een bewijs van verzekering. Met betrekking tot dit bewijs
      worden bij algemene maatregel van bestuur nadere regels gesteld.

      2 De bestuurder van een motorrijtuig die bij een ongeval is betrokken, is verplicht het in lid 1 bedoelde document
      desgevraagd behoorlijk ter inzage te verstrekken aan degenen die eveneens bij dat ongeval zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel11
  - number: '12'
    text: |-
      1 De houder van een bewijs als bedoeld in [artikel 11, eerste lid][ref1], waarvan de geldigheidsduur nog niet
      is verstreken, is verplicht dit binnen acht dagen nadat de verplichting tot verzekering met betrekking tot het
      motorrijtuig op een ander overgegaan is, bij de verzekeraar door wie het werd uitgereikt in te leveren.

      2 De verzekering eindigt, wanneer de verplichting tot verzekering op een ander overgaat, met dien verstande dat de
      verplichtingen van de verzekeraar jegens een benadeelde blijven bestaan zolang het verzekeringsbewijs niet bij de
      verzekeraar is ingeleverd, behoudens het gestelde in het volgende lid.

      3 De verplichtingen van de verzekeraar eindigen van rechtswege door het van kracht worden van een nieuwe
      verzekering welke met betrekking tot hetzelfde motorrijtuig het in [artikel 3][ref2] bedoelde risico dekt. In
      ieder geval zullen de verplichtingen van de verzekeraar jegens de benadeelden geëindigd zijn na het verstrijken van
      zestien dagen nadat de verplichting tot verzekering op een ander overgegaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028254#Artikel3
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel12
