  - number: '13'
    text: |-
      Van een bepaling van deze wet kan slechts worden afgeweken, indien de bevoegdheid daartoe uit de bepaling zelve
      blijkt.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel13
  - number: '14'
    text: |-
      De som of sommen, waarvoor de in deze wet bedoelde verzekering ten minste moet zijn gesloten, worden bij algemene
      maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel14
  - number: 16A
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel16A
  - number: '20'
    text: |-
      1 De [artikelen 5 tot en met 10][ref1] blijven van toepassing op een verzekeringsonderneming met betrekking tot de
      schade tengevolge van een ongeval dat heeft plaatsgevonden voor of binnen 30 dagen na de datum van intrekking van
      de vergunning.

      2 Degene die met een verzekeringsonderneming die niet of niet meer in het bezit is van een vergunning, een
      verzekering heeft gesloten ter dekking van de wettelijke aansprakelijkheid waartoe een motorrijtuig in het verkeer
      aanleiding kan geven, is bevoegd deze verzekering door opzegging te beëindigen. De verzekeringsonderneming geeft
      alsdan de vooruitbetaalde premie terug voor het gedeelte dat evenredig is aan het op de datum van de ontvangst der
      opzegging nog niet verstreken gedeelte van de termijn waarvoor de premie werd betaald, onder aftrek van een door de
      Nederlandsche Bank N.V. te bepalen percentage van het terug te betalen bedrag aan onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel5
