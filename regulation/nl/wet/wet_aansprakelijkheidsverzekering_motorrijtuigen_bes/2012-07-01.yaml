        artikel: '23'
  - number: '2'
    text: |-
      1 De wettelijke aansprakelijkheid waartoe een motorrijtuig in het verkeer aanleiding kan geven, moet zijn gedekt
      door een verzekeringsovereenkomst welke aan de bij en krachtens deze wet gestelde bepalingen beantwoordt, indien
      dat motorrijtuig zich op de weg bevindt, of indien het daarbuiten deelneemt aan het verkeer op een terrein dat
      toegankelijk is voor het publiek of voor een zeker aantal personen die recht hebben daar te komen.

      2 De verplichting tot verzekering rust op de bezitter van het motorrijtuig, tenzij dit in duurzaam gebruik is bij
      een houder; in dat geval rust de verplichting op deze houder.

      3 De verzekering moet zijn gesloten bij een verzekeraar als bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel1
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028254
        artikel: '1'
  - number: '3'
    text: |-
      1 De verzekering moet de wettelijke aansprakelijkheid dekken van ieder bezitter, houder en bestuurder van het
      verzekerde motorrijtuig, alsmede van degenen die daarmede worden vervoerd.

      2 De verzekering moet in elk geval de schade omvatten, welke wordt toegebracht door in de openbare lichamen
      Bonaire, Sint Eustatius en Saba voorgevallen feiten. Hierin is begrepen de schade, toegebracht aan personen
      die onder welke titel ook, worden vervoerd door het motorrijtuig, dat de schade veroorzaakt; de zaken, door dat
      motorrijtuig vervoerd, kunnen van de verzekering worden uitgesloten.

      3 De verzekering moet de wettelijke aansprakelijkheid voor de door het motorrijtuig veroorzaakte schade dekken
      zoals die aansprakelijkheid voortvloeit uit de toepasselijke wet.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel3
  - number: '4'
    text: |-
      1 De verzekering behoeft niet te dekken de aansprakelijkheid voor schade, toegebracht aan:

      a. de verzekeringnemer, alsmede de bezitter, de houder en de bestuurder van het motorrijtuig dat het ongeval
      veroorzaakt;

      b. de echtgenoten van de hierboven bedoelde personen, alsmede hun bloed- en aanverwanten in de rechte linie, mits
      dezen bij hen inwonen en door hen worden onderhouden.

      2 Van de verzekering kan worden uitgesloten de schade die voortvloeit uit het deelnemen van het motorrijtuig aan
      snelheids-, regelmatigheids- of behendigheidsritten en -wedstrijden, waarvoor door de Gezaghebber van een openbaar
      lichaam vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel4
  - number: '5'
    text: |-
      1 Indien de overeenkomst een beding inhoudt dat de verzekerde persoonlijk voor een deel in de vergoeding van
      de schade zal bijdragen, blijft de verzekeraar niettemin jegens de benadeelde gehouden tot betaling van de
      schadeloosstelling die krachtens de overeenkomst ten laste van de verzekerde blijft.

      2 De verzekeraar kan echter tegenover een benadeelde beroep doen op een beding, inhoudende dat hij slechts
      aansprakelijk is voor het bedrag waarmede de schade een bij algemene maatregel van bestuur vast te stellen bedrag
      te boven gaat.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel5
  - number: '6'
    text: |-
      1 De benadeelde heeft jegens de verzekeraar door wie de aansprakelijkheid volgens deze wet is gedekt, een eigen
      recht op schadevergoeding. Het tenietgaan van zijn schuld aan de verzekerde bevrijdt de verzekeraar niet jegens de
      benadeelde, tenzij deze is schadeloosgesteld. Indien de benadeelde, als beledigde partij in een strafgeding tegen
      de aansprakelijke persoon, zijn vordering tegen deze beperkt tot het wettelijk maximum, is deze beperking niet van
      invloed op zijn vordering tegen de verzekeraar.

      2 Indien er bij een ongeval meer dan een benadeelde is en het totaalbedrag van de verschuldigde schadeloosstelling
      de verzekerde som overschrijdt, worden de rechten van de benadeelden tegen de verzekeraar naar evenredigheid
      teruggebracht tot het beloop van die som. Niettemin blijft de verzekeraar die, onbekend met het bestaan van
      vorderingen van andere benadeelden, te goeder trouw aan een benadeelde een groter bedrag dan het aan deze
      toekomende deel heeft uitgekeerd, jegens die anderen slechts gehouden tot het beloop van het overblijvende gedeelte
      van de verzekerde som.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel6
  - number: '7'
    text: |-
      De verzekerden moeten van ieder ongeval waarvan zij kennis dragen, mededeling doen aan de verzekeraar, indien
      bij dat ongeval het verzekerde motorrijtuig is betrokken en er schade is ontstaan tot welker dekking door
      verzekering deze wet verplicht. De verzekeringnemer moet aan de verzekeraar alle door de verzekeringsovereenkomst
      voorgeschreven inlichtingen en bescheiden verschaffen. De overige verzekerden moeten aan de verzekeraar op zijn
      verzoek alle nodige inlichtingen en bescheiden verschaffen.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel7
  - number: '8'
    text: |-
      1 Aan een vonnis gewezen in een geschil ter zake van door een motorrijtuig veroorzaakte schade, komt tegenover de
      verzekeraar, de verzekerde of de benadeelde gezag van gewijsde toe, indien zij in het geding de positie van een
      procespartij hebben gehad.

      2 Voorts kan het vonnis dat is gewezen in een geschil tussen de benadeelde en de verzekerde, worden tegengeworpen
      aan de verzekeraar, indien is komen vast te staan dat de laatste in feite de leiding van het geding op zich heeft
      genomen; aan de verzekeraar staat alsdan geen tegenbewijs open tegen de bij gewijsde als bewezen aangenomen feiten.

      3 De verzekeraar kan de verzekerde in het geding roepen, dat door de benadeelde tegenover hem wordt ingesteld. De
      oproeping dient te geschieden door middel van een deurwaardersexploot voor het nemen van de conclusie van antwoord.
      De in het geding geroepene heeft de positie van een procespartij.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel8
  - number: '9'
    text: |-
      1 Iedere uit deze wet voortvloeiende rechtsvordering van de benadeelde tegen de verzekeraar verjaart door verloop
      van drie jaar te rekenen vanaf de dag van het ontstaan van het feit waaruit de schade is ontstaan.

      2 Handelingen die de verjaring van de rechtsvordering van een benadeelde tegen een verzekerde stuiten, stuiten
      tevens de verjaring van de rechtsvordering van die benadeelde tegen de verzekeraar. Handelingen die de verjaring
      van de rechtsvordering van een benadeelde tegen de verzekeraar stuiten, stuiten tevens de verjaring van de
      rechtsvordering van de benadeelde tegen de verzekerden.

      3 De verjaring wordt ten opzichte van een verzekeraar gestuit door iedere onderhandeling tussen de verzekeraar
      en de benadeelde. Een nieuwe termijn van drie jaar begint te lopen te rekenen van het ogenblik waarop een van
      de partijen bij deurwaardersexploot of aangetekende brief aan de andere partij heeft kennisgegeven dat zij de
      onderhandelingen afbreekt.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel9
  - number: '10'
    text: |-
      1 Geen uit de wettelijke bepalingen omtrent de verzekeringsovereenkomst of uit deze overeenkomst zelf
      voortvloeiende nietigheid, verweer of verval kan door een verzekeraar aan een benadeelde worden tegengeworpen. Het
      bepaalde in de vorige zin geldt niet met betrekking tot het bedrag, waarmede het van de verzekeraar gevorderde de
      krachtens [artikel 14][ref1] vastgestelde som of sommen overschrijdt.

      2 De verzekeraar die ingevolge deze wet de schade van een benadeelde geheel of ten dele vergoedt, ofschoon de
      aansprakelijkheid voor die schade niet door een met hem gesloten overeenkomst was gedekt, heeft voor het bedrag der
      schadevergoeding verhaal op de aansprakelijke persoon, en indien daartoe grond bestaat, op de verzekeringnemer.

      3 De in het vorige lid bedoelde schadevergoeding kan niet verhaald worden op degene die het motorrijtuig waarmede
      de schade is veroorzaakt in opdracht van zijn werkgever gebruikte, tenzij hij niet te goeder trouw mocht aannemen
      dat zijn aansprakelijkheid door een verzekeringsovereenkomst was gedekt.

      Tot verhaal van de schadevergoeding op de verzekeringnemer bestaat geen grond, indien deze aantoont dat de
      omstandigheden die geleid hebben tot de ten gevolge van een polisuitsluiting niet gedekte schade zich buiten zijn
      weten of tegen zijn wil hebben voorgedaan en dat hem terzake van die omstandigheden in redelijkheid geen verwijt
      treft.

      4 De verzekeraar die ingevolge deze wet de schade van een benadeelde geheel of ten dele vergoedt, heeft een recht
      van verhaal op degene die zich door diefstal of geweldpleging de macht over het motorrijtuig, waarmee de schade is
      veroorzaakt, heeft verschaft of van hem die dit wetende, dat motorrijtuig zonder geldige reden gebruikt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel14
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel10
