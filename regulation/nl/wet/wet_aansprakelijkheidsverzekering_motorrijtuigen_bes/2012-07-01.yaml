    text: |-
      1 De [artikelen 15 tot en met 19][ref1] van deze wet treden in werking met ingang van een daartoe bij afzonderlijk
      koninklijk besluit te bepalen tijdstip.

      2 Het fonds is niet aansprakelijk voor schade, ontstaan uit feiten die hebben plaatsgevonden vóór de datum van
      inwerkingtreding van de [artikelen 15 tot en met 19][ref2].


