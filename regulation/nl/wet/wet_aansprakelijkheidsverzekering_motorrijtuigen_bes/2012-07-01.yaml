  - number: '22'
    text: |-
      1 De bestuurder alsmede degene op wie met betrekking tot een motorrijtuig de verplichting rust tot het sluiten van
      een verzekering welke voldoet aan de bij en krachtens deze wet gestelde bepalingen, wordt gestraft met hechtenis
      van ten hoogste drie maanden of een geldboete van de tweede categorie indien aan deze verzekeringsplicht niet is
      voldaan.

      2 Bij veroordeling wegens het strafbare feit, omschreven in het eerste lid, kan de rechter tevens de schuldige
      de bevoegdheid ontzeggen motorrijtuigen te besturen voor de tijd van ten hoogste één jaar en, ingeval tijdens het
      plegen van het strafbare feit nog geen vijf jaren zijn verlopen na het einde van de tijdsduur, waarvoor bij een
      vroegere onherroepelijke veroordeling de schuldige de bevoegdheid motorrijtuigen te besturen is ontzegd, voor de
      tijd van ten hoogste vijf jaren.

      3 Bij veroordeling wegens het strafbare feit, omschreven in het eerste lid, kan de rechter tevens degene die de
      verplichting tot verzekering niet is nagekomen en de bestuurder de bijkomende straf van storting van een bedrag van
      ten hoogste USD 1.680,– in het Waarborgfonds Motorverkeer opleggen.

      4 De in het vorige lid bedoelde bijkomende straf wordt ten uitvoer gelegd op wijze als voor tenuitvoerlegging
      van geldboeten is bepaald, met dien verstande dat geen vervangende vrijheidsstraf wordt toegepast. Het openbaar
      ministerie draagt er zorg voor, dat geïnde bedragen tegen kwijting aan het Waarborgfonds Motorverkeer worden
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel22
  - number: '23'
    text: |-
      Handelen in strijd met [artikel 11, eerste lid][ref1], of [artikel 12, eerste lid][ref2], wordt gestraft met
      hechtenis van ten hoogste dertig dagen of geldboete van ten hoogste USD 84,–.


