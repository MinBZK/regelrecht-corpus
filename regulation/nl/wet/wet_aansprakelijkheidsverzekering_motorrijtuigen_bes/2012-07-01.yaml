  - number: '24'
    text: |-
      Op overtreding van krachtens deze wet gestelde regelen kan bij algemene maatregel van bestuur geen andere of hogere
      straf worden gesteld dan hechtenis van ten hoogste dertig dagen en geldboete van de eerste categorie of een van
      deze beide.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel24
  - number: '25'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel25
  - number: '26'
    text: De bij of krachtens deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel26
  - number: '27'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel27
  - number: '28'
    text: |-
      Voor de uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere regelen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel28
  - number: '29'
    text: |-
      De vergunning bedoeld in [artikel 4 lid 2][ref1] kan slechts worden verleend, indien wordt aangetoond,
      dat maatregelen zijn getroffen ter voorkoming van deelneming aan de wedstrijd zonder dat de wettelijke
      aansprakelijkheid voor de schade waartoe het gebruik van een motorrijtuig tijdens de wedstrijd aanleiding
      kan geven, is gedekt door een verzekering overeenkomstig deze wet; de verzekering dient mede te dekken de
      aansprakelijkheid van degenen die de wedstrijd organiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel4
    url: https://wetten.overheid.nl/BWBR0028254/2012-07-01#Artikel29
