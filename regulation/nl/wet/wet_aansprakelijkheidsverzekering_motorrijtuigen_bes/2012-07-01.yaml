  - number: '1'
    text: |-
      Voor de toepassing van deze wet worden verstaan onder:

        - *motorrijtuigen:* alle rij- of voertuigen, bestemd om over de grond te worden voortbewogen uitsluitend of mede
      door een mechanische kracht; als een deel daarvan wordt aangemerkt al hetgeen aan het rij- of voertuig is gekoppeld
      of na koppeling daarvan is losgemaakt of losgeraakt, zolang het nog niet buiten het verkeer tot stilstand is
      gekomen;
        - *verzekerden:* zij wier aansprakelijkheid overeenkomstig de bepalingen van deze wet is gedekt;
        - *benadeelden:* zij die schade hebben geleden welke grond oplevert voor toepassing van deze wet, alsmede hun
      rechtverkrijgenden;
        - *vergunning:* vergunning die ingevolge de [Wet financiële markten BES][ref1] is vereist voor de branche
      motorrijtuigverzekering;
        - *verzekeraar:* onderneming die ingevolge de [Wet financiële markten BES][ref2] het bedrijf van schadeverzekeraar
      in de branche motorrijtuigverzekering mag uitoefenen;
        - *weg:* voor het openbaar verkeer openstaand pad, verharde of onverharde rijbaan met inbegrip van de middenberm
      of middengeleiding, de parkeerstroken en parkeerhavens en vluchtstroken alsmede de in de weg gelegen bruggen en de
      naast de rijbaan gelegen paden, bermen en zijkanten;
        - *Waarborgfonds Motorverkeer en fonds:* de krachtens
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref3] aangewezen rechtspersoon.


