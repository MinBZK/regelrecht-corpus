preamble:
  text: |-
    De ledenvergadering van de NOvAA,

    gelet op artikel 30, tweede lid, van de Wet op de Accountants-Administratieconsulenten,

    stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0028008/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het tarief voor het beoordelen en goedkeuren van het verbeterplan als bedoeld in
      [artikel 11, zevende lid, van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt € 540,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel11
    url: https://wetten.overheid.nl/BWBR0028008/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '11'
  - number: '2'
    text: |-
      Het tarief voor de behandeling van een verzoek tot tijdelijke vrijstelling van de toetsing of de verlenging daarvan
      als bedoeld in [artikel 14, tweede lid, van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt

      a. bij een eerste verzoek € 100,–;

      b. bij een tweede verzoek € 175,–; en

      c. bij een derde of volgend verzoek € 250,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel14
    url: https://wetten.overheid.nl/BWBR0028008/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '14'
  - number: '3'
    text: |-
      Het tarief voor een accreditatie als bedoeld in
      [artikel 15a, eerste lid, van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt € 820,– .


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028008/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: 15a
  - number: '4'
    text: |-
      Het tarief voor de toetsing als bedoeld in
      [artikel 18, eerste lid, van de Verordening op de periodieke preventieve toetsing][ref1] bedraagt:

      a. voor een eerste toetsing: € 700,–;

      b. voor een hertoetsing: € 1.030,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel18
    url: https://wetten.overheid.nl/BWBR0028008/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '18'
  - number: '5'
    text: |-
      1 Een toetser die voor een toetsing of accreditatie wordt ingeschakeld, ontvangt voor de bij de te toetsen
      accountantspraktijk of de te accrediteren koepelorganisatie ten behoeve van de toetsing aangevangen dagdelen een
      vergoeding ten bedrage van € 360,– per dagdeel.

      2 De vergoeding, bedoeld in het eerste lid, geldt voor ten hoogste twee dagdelen per dag.

      3 Een dagdeel omvat een tijdsperiode van drie uur.

      4 Toetsers ontvangen een vergoeding van reis- en verblijfkosten overeenkomstig de regeling van de
      [artikelen 1][ref1], [2][ref2] en [3 van de Verordening op de kostenvergoedingen][ref3].

      5 Toetsers die voor een toetsing of accreditatie worden ingeschakeld, ontvangen in afwijking van
      [artikel 1, vierde lid, van de Verordening op de kostenvergoedingen][ref4], een afzonderlijke vergoeding voor
      de kosten van parkeergelden welke zijn gemaakt in verband met de toetsing van een accountantspraktijk of te
      accrediteren koepelorganisatie.

      6 Een toetser verzoekt om toepassing van het vorige lid en overlegt daarbij bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0006183#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006183#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006183#Artikel3
