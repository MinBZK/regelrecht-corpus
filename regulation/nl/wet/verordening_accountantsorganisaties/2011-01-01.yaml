  - number: '2'
    text: |-
      De accountantsorganisatie besteedt in haar kwaliteitsbeleid en het daarop gebaseerde stelsel van
      kwaliteitsbeheersing ten minste aandacht aan:

      a. de verantwoordelijkheid van de personen die het dagelijks beleid van de accountantsorganisatie bepalen voor het
      kwaliteitsbeleid en het daarop gebaseerde stelsel van kwaliteitsbeheersing;

      b. de gedragsregels;

      c. het aanvaarden en voortzetten van de relatie met een controlecliënt en van een specifieke opdracht;

      d. het personeelsbeleid;

      e. de uitvoering van de wettelijke controle;

      f. de naleving van het stelsel van kwaliteitsbeheersing;

      g. de continuïteit van de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel2
  - number: '3'
    text: |-
      De personen die het dagelijks beleid van de accountantsorganisatie bepalen zorgen ervoor dat het kwaliteitsbeleid
      van de accountantsorganisatie leidt tot een bedrijfscultuur waarin wettelijke controles worden uitgevoerd
      overeenkomstig vooraf vastgestelde kwaliteitseisen.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel3
  - number: '4'
    text: |-
      1 De personen die het dagelijks beleid van de accountantsorganisatie bepalen kunnen personen benoemen aan wie
      uitvoerende taken in het kader van het stelsel van kwaliteitsbeheersing worden opgedragen.

      2 Voor benoeming komen in aanmerking personen die:

      a. beschikken over toereikende ervaring en deskundigheid;

      b. beschikken over de noodzakelijke bevoegdheid;

      c. voldoende gezag hebben.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel4
  - number: '5'
    text: |-
      1 De accountantsorganisatie zorgt ervoor dat zij over voldoende medewerkers beschikt om de aan de
      accountantsorganisatie verleende opdrachten tot het verrichten van een wettelijke controle uit te voeren in
      overeenstemming met de daarvoor geldende wet- en regelgeving.

      2 De accountantsorganisatie zorgt ervoor dat de in het eerste lid bedoelde medewerkers beschikken over de vereiste
      capaciteiten en zich houden aan het bepaalde in de [Verordening gedragscode][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026512
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026512
  - number: '6'
    text: |-
      De accountantsorganisatie zorgt ervoor dat:

      a. de naam van de voor de uitvoering van een wettelijke controle aangewezen externe accountant wordt bekendgemaakt
      aan het leidinggevende orgaan en het toezichthoudende orgaan van de controlecliënt;

      b. de aangewezen externe accountant over de voor de uitvoering van de aan hem toegewezen wettelijke controle
      vereiste vakbekwaamheid beschikt;

      c. de taken en bevoegdheden van de aangewezen externe accountant met hem worden besproken en vastgelegd.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel6
  - number: '7'
    text: |-
      1 De accountantsorganisatie stelt regels vast ter zake van het behandelen en het oplossen van een bij de uitvoering
      van een wettelijke controle gerezen verschil van inzicht tussen bij de uitvoering van deze wettelijke controle
      betrokken medewerkers of tussen de bij de uitvoering van deze wettelijke controle betrokken externe accountant en
      de personen bij wie ter zake van deze controle advies is ingewonnen.

      2 De bereikte conclusies ter zake van de oplossing van een verschil van inzicht worden vastgelegd en overgenomen.

      3 De accountantsorganisatie zorgt ervoor dat de externe accountant zijn accountantsverklaring niet eerder afgeeft
      dan nadat het verschil van inzicht is opgelost.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel7
  - number: '8'
    text: |-
      1 De accountantsorganisatie die wettelijke controles verricht bij organisaties van openbaar belang stelt een
      complianceregeling vast.

      2 De complianceregeling beschrijft op welke wijze de compliance officer toeziet op de naleving van de bij of
      krachtens de [artikelen 13 tot en met 24 van de wet][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel13
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '13'
  - number: '9'
    text: |-
      De accountantsorganisatie stelt regels vast ter zake van de uitvoering van periodiek intern kwaliteitsonderzoek van
      afgeronde opdrachten tot het verrichten van een wettelijke controle.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel9
  - number: '10'
    text: |-
      1 De accountantsorganisatie maakt ten minste eenmaal per jaar de uitkomsten van de in
      [artikel 22, tweede lid, van het besluit][ref1] bedoelde evaluatie bekend aan de bij haar werkzame of aan haar
      verbonden externe accountants en aan de overige medewerkers waarvoor deze informatie relevant is, teneinde deze
      personen in staat te stellen de geëigende acties te ondernemen.

      2 De bekendmaking omvat ten minste:

      a. een beschrijving van het uitgevoerde periodiek intern kwaliteitsonderzoek, bedoeld in [artikel 9][ref2];

      b. een beschrijving van de uitgevoerde evaluatie;

      c. het eindoordeel dat naar aanleiding van de evaluatie is gevormd;

      d. een beschrijving van de uit de evaluatie gebleken relevante systematische, zich herhalende of andere belangrijke
      onvolkomenheden en de maatregelen die zijn getroffen om deze onvolkomenheden op te lossen.

      3 De accountantsorganisatie bewaart de in het tweede lid bedoelde informatie gedurende ten minste zeven jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0026502#Artikel9
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel10
