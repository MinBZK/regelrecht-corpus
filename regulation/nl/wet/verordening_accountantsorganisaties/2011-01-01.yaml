  - number: '11'
    text: |-
      1 De accountantsorganisatie zorgt ervoor dat zij ter zake van het risico van beroepsaansprakelijkheid van haarzelf
      en van de bij haar werkzame of aan haar verbonden medewerkers en andere personen in redelijke mate is verzekerd.

      2 Het bestuur is bevoegd op een schriftelijk en gemotiveerd verzoek van de accountantsorganisatie ontheffing te
      verlenen van het bepaalde in het eerste lid op grond van het feit dat de personen die het dagelijks beleid van de
      accountantsorganisatie bepalen erkende gemoedsbezwaren hebben tegen elke vorm van verzekering. Het bestuur kan aan
      deze ontheffing voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel11
  - number: '12'
    text: |-
      1 De op grond van het bepaalde in [artikel 11, eerste lid][ref1], te sluiten verzekering voor de
      beroepsaansprakelijkheid van een accountantsorganisatie en van de bij haar werkzame of aan haar verbonden
      medewerkers en andere personen voldoet ten minste aan de volgende eisen:

      a. de verzekering wordt aangegaan met een verzekeraar van wie het aannemelijk is dat deze voldoet aan
      redelijkerwijs te stellen eisen van solvabiliteit;

      b. de verzekering biedt jaarlijks dekking voor ten minste tweemaal het verzekerd bedrag per aanspraak;

      c. het verzekerd bedrag per aanspraak bedraagt:

        - bij een jaaromzet tot € 500.000,- ten minste € 300.000,-;
        - bij een jaaromzet van € 500.000,- tot € 1.000.000,- ten minste € 500.000,-;
        - bij een jaaromzet van € 1.000.000,- tot € 2.500.000,- ten minste € 1.250.000,-;
        - bij een jaaromzet van € 2.500.000,- of meer, ten minste € 3.000.000,-.

      d. boven de in onderdeel c genoemde minimumbedragen bepaalt de accountantsorganisatie de wijze waarop financiële
      risico’s kunnen worden opgevangen en de hoogte van de dekking van de verzekering, met dien verstande dat sprake is
      van een redelijke dekking van de risico’s;

      e. het eigen risico per aanspraak is zodanig vastgesteld dat de solvabiliteit van de accountantsorganisatie niet
      in gevaar komt. Daartoe bedraagt het eigen risico bij een jaaromzet tot € 2.500.000,- maximaal € 25.000,-. Bij een
      jaaromzet van meer dan € 2.500.000,- bepaalt de accountantsorganisatie zelf de hoogte van het eigen risico;

      f. onder de dekking van de verzekering vallen alle werkzaamheden die door de accountantsorganisatie worden
      verricht, ongeacht door wie de claim wordt ingediend;

      g. de verzekering heeft ten minste Europa als dekkingsgebied;

      h. de accountantsorganisatie zorgt ervoor dat haar inloop- en uitlooprisico’s gedurende ten minste twee jaren zijn
      gedekt;

      i. de verzekering dekt tevens de beroepsaansprakelijkheid van de accountantsorganisatie voor de personen die
      onder haar verantwoordelijkheid werkzaam zijn, voor de personen die haar werkzaamheden of de werkzaamheden van
      medewerkers van de accountantsorganisatie waarnemen en voor derden die betrokken zijn bij de werkzaamheden die door
      de accountantsorganisatie worden verricht;

      j. de verzekering dekt de kosten van benodigde juridische bijstand in het kader van het in procedures te voeren
      verweer.

      2 De accountantsorganisatie beoordeelt te allen tijde of er specifieke omstandigheden zijn die het noodzakelijk
      maken naar boven toe af te wijken van de minimumeisen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026502#Artikel11
