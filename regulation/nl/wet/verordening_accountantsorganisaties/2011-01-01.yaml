  - number: '13'
    text: |-
      1 De accountantsorganisatie regelt op adequate wijze de waarneming van de uitvoering van een wettelijke controle in
      geval van ontstentenis, belet of langdurige arbeidsongeschiktheid van een bij haar werkzame of aan haar verbonden
      externe accountant.

      2 Waarneming kan uitsluitend geschieden door een andere externe accountant die werkzaam is bij of verbonden is aan
      dezelfde accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel13
  - number: '14'
    text: |-
      De accountantsorganisatie treft zodanige voorzieningen dat in geval van het overlijden van een bij haar werkzame of
      aan haar verbonden externe accountant een juiste afwikkeling van de beroepsuitoefening is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel14
  - number: '15'
    text: |-
      De meerderheid van de stemrechten in een accountantsorganisatie is middellijk of
      onmiddellijk in het bezit van registeraccountants of Accountants-Administratieconsulenten
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '16'
    text: |-
      1 De accountantsorganisatie zorgt ervoor dat haar medewerkers en anderen die moeten voldoen aan de voor hen
      geldende regels inzake onafhankelijkheid:

      a. zich periodiek scholen en trainen in de toepassing van de regelgeving inzake onafhankelijkheid en de daarop
      betrekking hebbende interne regels van de accountantsorganisatie;

      b. tijdig aan de accountantsorganisatie de bij of krachtens de [wet][ref1] of de verordening vereiste informatie
      verstrekken met betrekking tot de voorgenomen aanvaarding en continuering van een opdracht tot het verrichten van
      een wettelijke controle en met betrekking tot de voorgenomen aanvaarding van een opdracht tot het verrichten van
      overige diensten aan een controlecliënt;

      c. de accountantsorganisatie onmiddellijk inlichten over omstandigheden en betrekkingen ter zake van een bij een
      controlecliënt uitgevoerde wettelijke controle die leiden tot een bedreiging voor de onafhankelijkheid van de
      accountantsorganisatie.

      2 De accountantsorganisatie maakt de haar ter beschikking gestelde informatie, bedoeld in het eerste lid,
      onderdelen b en c, tijdig aan haar medewerkers bekend, voor zover de informatie voor de naleving van de bij of
      krachtens de [wet][ref2] of de verordening gestelde regels van belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0019468
      [ref2]: https://wetten.overheid.nl/BWBR0019468
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019468
      - id: ref2
        bwb_id: BWBR0019468
  - number: '17'
    text: |-
      1 De accountantsorganisatie zorgt ervoor dat haar medewerkers haar tijdig inlichten over overtredingen van de
      regelgeving inzake onafhankelijkheid.

      2 In het geval van overtredingen als bedoeld in het eerste lid neemt de accountantsorganisatie zodanige maatregelen
      dat deze overtredingen worden beëindigd, de gevolgen daarvan zoveel als redelijkerwijs mogelijk ongedaan worden
      gemaakt en herhaling wordt voorkomen.

      3 Indien sprake is van een mogelijke aantasting van de onafhankelijkheid in relatie tot een wettelijke controle,
      ziet de accountantsorganisatie erop toe dat de voor die wettelijke controle aangewezen externe accountant één of
      meer van de volgende personen of organen raadpleegt:

      a. de onafhankelijkheidsfunctionaris en, indien de accountantsorganisatie wettelijke controles verricht bij
      organisaties van openbaar belang, de compliance officer;

      b. een externe accountant die niet is betrokken bij de desbetreffende controlecliënt;

      c. een daartoe geëigende commissie of afdeling binnen de accountantsorganisatie;

      d. een in [artikel 1 van de Verordening kwaliteitstoetsing accountants][ref1] bedoelde koepelorganisatie; of

      e. het Nederlands Instituut van Registeraccountants.

      4 De accountantsorganisatie beschrijft in welke omstandigheden, op welk tijdstip en op welke wijze het
      leidinggevende orgaan van de controlecliënt en, indien aanwezig, het toezichthoudende orgaan van de controlecliënt
      worden geraadpleegd.

      5 De accountantsorganisatie maakt de haar bekend geworden overtredingen van de regelgeving inzake onafhankelijkheid
      bekend aan alle personen die betrokken zijn bij de behandeling van deze overtredingen.

      6 De accountantsorganisatie zorgt ervoor dat de personen, bedoeld in het vijfde lid, haar tijdig inlichten over de
      door hen naar aanleiding van de hun gemelde overtredingen van de regelgeving inzake onafhankelijkheid ondernomen
      acties.


      [ref1]: https://wetten.overheid.nl/BWBR0014487#Artikel1
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014487
        artikel: '1'
  - number: '18'
    text: |-
      1 De accountantsorganisatie zorgt voor een schriftelijke rapportage per controlecliënt waarin is vastgelegd of
      sprake is van omstandigheden die de onafhankelijkheid van de externe accountant bedreigen of hebben bedreigd, op
      welke wijze met potentiële bedreigingen wordt en is omgegaan en, voor zover bedreigingen van niet te verwaarlozen
      betekenis zijn, welke waarborgen zijn getroffen om die bedreigingen weg te nemen of tot een aanvaardbaar niveau
      terug te brengen.

      2 De accountantsorganisatie die onderdeel uitmaakt van een netwerk legt van iedere controlecliënt die een
      organisatie van openbaar belang is tevens vast:

      a. de per boekjaar bij deze controlecliënt in rekening gebrachte vergoedingen voor diensten die zijn verleend door
      in Nederland gevestigde onderdelen van haar netwerk;

      b. de per boekjaar bij deze controlecliënt in rekening gebrachte vergoedingen voor diensten die zijn verleend door
      buiten Nederland gevestigde onderdelen van haar netwerk, voor zover deze diensten bij de accountantsorganisatie
      bekend zijn.

      3 De accountantsorganisatie ziet erop toe dat de gegevens, bedoeld in het eerste en tweede lid, met inbegrip van
      een gemotiveerde conclusie, in het controledossier worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel18
  - number: '19'
    text: |-
      De accountantsorganisatie maakt de bij of krachtens de [wet][ref1] en de [Wet op de Registeraccountants][ref2]
      vigerende regels inzake onafhankelijkheid bekend aan haar medewerkers en aan anderen die aan deze regels zijn
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468
      [ref2]: https://wetten.overheid.nl/BWBR0002374
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019468
      - id: ref2
        bwb_id: BWBR0002374
  - number: '20'
    text: |-
      1 De accountantsorganisatie heeft een onafhankelijkheidsfunctionaris.

      2 De accountantsorganisatie stelt een onafhankelijkheidsregeling vast.

      3 De onafhankelijkheidsregeling beschrijft op welke wijze de onafhankelijkheidsfunctionaris toeziet op de naleving
      van de in [artikel 19][ref1] bedoelde regels inzake onafhankelijkheid.

      4 De functie van onafhankelijkheidsfunctionaris kan tevens worden uitgeoefend door de compliance officer.


      [ref1]: https://wetten.overheid.nl/BWBR0026502#Artikel19
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026502
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '21'
    text: |-
      De accountantsorganisatie stelt regels vast die voorzien in het treffen van waarborgen die de bedreiging voor haar
      onafhankelijkheid als gevolg van een grote mate van vertrouwdheid of vertrouwen in het geval dat één en dezelfde
      leidinggevende medewerker gedurende een lange periode wordt ingezet bij een wettelijke controle wegnemen, dan wel
      tot een aanvaardbaar niveau terugbrengen.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel21
  - number: '22'
    text: |-
      1 De accountantsorganisatie stelt regels vast ter zake van de toelaatbaarheid van het hebben van financiële,
      zakelijke en andere relaties met een controlecliënt of een met deze controlecliënt verbonden derde. Deze regels
      zijn erop gericht te voorkomen dat deze financiële, zakelijke en andere relaties een onaanvaardbare bedreiging
      kunnen vormen voor de onafhankelijkheid van de accountantsorganisatie en haar medewerkers.

      2 De in het eerste lid bedoelde regels houden ten minste in dat het de accountantsorganisatie of een ander
      onderdeel van haar netwerk niet is toegestaan:

      a. een direct financieel belang in een controlecliënt te hebben;

      b. een indirect financieel belang in een controlecliënt te hebben, dat voor ten minste één van de betrokken
      partijen van grote betekenis is;

      c. een direct of indirect financieel belang in een met de controlecliënt verbonden derde te hebben, dat voor ten
      minste één van de betrokken partijen van grote betekenis is.

      3 De in het eerste lid bedoelde regels houden tevens in dat het de accountantsorganisatie of een ander onderdeel
      van haar netwerk uitsluitend is toegestaan de in dat lid bedoelde relaties aan te gaan met een controlecliënt, een
      met deze controlecliënt verbonden derde, de leiding van de controlecliënt of een daarmee verbonden derde, indien
      deze relaties en de met die relaties overeen te komen verbintenissen:

      a. passen in het kader van de gewone bedrijfsuitoefening van de accountantsorganisatie en haar netwerk; en

      b. geen onaanvaardbare bedreiging vormen voor de onafhankelijkheid van de accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel22
  - number: '23'
    text: |-
      De accountantsorganisatie stelt regels vast die erin voorzien dat zijzelf of een ander onderdeel van haar netwerk
      geen wettelijke controles uitvoert ten behoeve van:

      a. een eigenaar van de accountantsorganisatie;

      b. een met een eigenaar van de accountantsorganisatie verbonden derde, indien deze eigenaar in een zodanige positie
      verkeert dat hij de besluitvorming van de accountantsorganisatie met betrekking tot het uitvoeren van de wettelijke
      controle bij die derde kan beïnvloeden;

      c. een onderneming of instelling waarbij een persoon met een bestuurlijke of toezichthoudende functie werkzaam is
      of daaraan is verbonden in een zodanige positie verkeert dat hij de besluitvorming binnen de accountantsorganisatie
      met betrekking tot het uitvoeren van de wettelijke controle bij die onderneming of instelling kan beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel23
  - number: '24'
    text: |-
      1 De accountantsorganisatie stelt regels vast die erin voorzien dat personen werkzaam bij of verbonden aan de
      accountantsorganisatie die in een positie verkeren waarin zij de uitkomsten van een wettelijke controle kunnen
      beïnvloeden, geen dienstbetrekking vervullen bij de controlecliënt of een met deze controlecliënt verbonden derde.

      2 De accountantsorganisatie stelt regels vast die erin voorzien dat personen werkzaam bij of verbonden aan de
      accountantsorganisatie:

      a. geen zitting hebben in het leidinggevende of toezichthoudende orgaan van de controlecliënt;

      b. geen zitting hebben in het leidinggevende of toezichthoudende orgaan van een onderneming of instelling die
      middellijk of onmiddellijk meer dan 20 procent van de stemrechten in de controlecliënt bezit;

      c. geen zitting hebben in het leidinggevende of toezichthoudende orgaan van een onderneming of instelling waarin de
      controlecliënt middellijk of onmiddellijk meer dan 20 procent van de stemrechten bezit.

      3 Het tweede lid is van overeenkomstige toepassing op personen werkzaam bij of verbonden aan een onderdeel van het
      netwerk waartoe de accountantsorganisatie behoort.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel24
  - number: '25'
    text: |-
      1 De accountantsorganisatie stelt regels vast ter zake van de indiensttreding van een medewerker bij een
      controlecliënt of een met deze controlecliënt verbonden derde.

      2 De in het eerste lid bedoelde regels houden ten minste in dat:

      a. een medewerker die het voornemen heeft in dienst te treden bij een controlecliënt, terwijl hij betrokken is bij
      de uitvoering van een wettelijke controle bij deze controlecliënt, daarvan de accountantsorganisatie onmiddellijk
      in kennis stelt;

      b. indien de medewerker, bedoeld in onderdeel a, de externe accountant is, de accountantsorganisatie een andere
      externe accountant aanwijst voor de wettelijke controle;

      c. indien de medewerker, bedoeld in onderdeel a, een andere dan de in onderdeel b bedoelde externe accountant is,
      deze medewerker met onmiddellijke ingang niet meer betrokken is bij de wettelijke controle;

      d. de werkzaamheden van de medewerker, bedoeld in onderdeel a, die hij ten behoeve van de lopende of meest recente
      wettelijke controle van de desbetreffende controlecliënt heeft verricht, onmiddellijk worden beoordeeld door een
      bij diezelfde wettelijke controle betrokken medewerker met een hogere functie; en

      e. indien de medewerker, bedoeld in onderdeel a, de externe accountant is, de beoordeling, bedoeld in onderdeel d,
      wordt uitgevoerd door een externe accountant die niet bij die wettelijke controle betrokken is. In de situatie dat
      als gevolg van de omvang van de accountantsorganisatie er geen externe accountant is die niet bij de desbetreffende
      wettelijke controle is betrokken, wordt een andere externe accountant gevraagd om de in onderdeel d bedoelde
      beoordeling uit te voeren.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel25
  - number: '26'
    text: |-
      1 De accountantsorganisatie stelt regels vast die erin voorzien dat, indien één van haar voormalige medewerkers bij
      een controlecliënt van de accountantsorganisatie in dienst is getreden, terwijl hij betrokken was bij de uitvoering
      van de wettelijke controle bij deze controlecliënt, de banden van betekenis tussen de accountantsorganisatie en de
      betrokken medewerker volledig worden verbroken.

      2 Van banden van betekenis als bedoeld in het eerste lid is sprake indien:

      a. de vorderingen op en schulden aan de voormalig medewerker en soortgelijke financiële betrekkingen niet zijn
      vereffend, met uitzondering van de financiële betrekkingen die zijn vastgelegd in een schriftelijke overeenkomst en
      die niet worden beïnvloed door de relatie tussen de voormalig medewerker en de accountantsorganisatie; of

      b. de voormalig medewerker deelneemt aan de beroeps- of bedrijfsmatige activiteiten van de accountantsorganisatie.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een persoon die deel heeft uitgemaakt van de
      hiërarchische structuur.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel26
  - number: '27'
    text: |-
      De accountantsorganisatie stelt regels vast die erin voorzien dat een bedreiging voor haar onafhankelijkheid wordt
      beoordeeld en dat adequate waarborgen worden getroffen in geval een bij een controlecliënt betrokken medewerker een
      naaste verwant heeft die:

      a. een hoge bestuursfunctie bekleedt bij die controlecliënt, indien hij vanuit die positie directe invloed op het
      object van onderzoek van de wettelijke controle kan uitoefenen;

      b. bij die controlecliënt in een zodanige positie verkeert dat hij directe invloed kan uitoefenen op het object van
      onderzoek van die wettelijke controle;

      c. een financieel belang heeft in die controlecliënt, tenzij het belang van te verwaarlozen betekenis is;

      d. met die controlecliënt een zakelijke relatie onderhoudt, tenzij deze relatie past in het kader van de gewone
      bedrijfsuitoefening en slechts een te verwaarlozen bedreiging inhoudt voor de onafhankelijkheid van deze persoon.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel27
  - number: '28'
    text: |-
      1 De accountantsorganisatie stelt regels vast die erin voorzien dat geen persoon bij een wettelijke controle wordt
      ingeschakeld die een gezinslid heeft dat:

      a. een hoge bestuursfunctie bekleedt bij die controlecliënt;

      b. bij die controlecliënt in een zodanige positie verkeert dat hij directe invloed kan uitoefenen op het object van
      onderzoek van die wettelijke controle;

      c. weliswaar ten tijde van de uitvoering van die wettelijke controle geen functie bekleedt als genoemd in onderdeel
      a of b, maar een dergelijke functie wel bekleedde in de periode waarop die wettelijke controle betrekking heeft;

      d. een financieel belang heeft in die controlecliënt, tenzij het belang van te verwaarlozen betekenis is;

      e. met die controlecliënt een zakelijke relatie onderhoudt, tenzij deze relatie past in het kader van de gewone
      bedrijfsuitoefening en slechts een te verwaarlozen bedreiging vormt voor de onafhankelijkheid van die persoon.

      2 De accountantsorganisatie stelt regels vast die erin voorzien dat geen wettelijke controle wordt uitgevoerd
      vanuit een vestiging waarbij of waaraan een externe accountant werkzaam of verbonden is die niet bij de
      desbetreffende wettelijke controle is betrokken of een persoon werkzaam is die deel uitmaakt van de hiërarchische
      structuur, indien één van hen dan wel beiden een gezinslid heeft dan wel hebben dat voldoet aan één of meer van de
      in het eerste lid genoemde criteria.

      3 De accountantsorganisatie stelt regels vast die erin voorzien dat een persoon die deel uitmaakt van haar
      hiërarchische structuur niet betrokken is bij een beslissing die rechtstreeks met de wettelijke controle verband
      houdt indien een gezinslid van die persoon voldoet aan één of meer van de in het eerste lid genoemde criteria.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel28
  - number: '29'
    text: |-
      1 De accountantsorganisatie stelt regels vast die erin voorzien dat bedreigingen voor haar onafhankelijkheid als
      gevolg van een dreigend geschil tussen de accountantsorganisatie of een ander onderdeel van haar netwerk en de
      controlecliënt of een met deze controlecliënt verbonden derde worden beoordeeld en dat wordt bepaald of daartegen
      waarborgen moeten worden getroffen.

      2 De accountantsorganisatie staakt haar werkzaamheden ter zake van de uitvoering van de in het eerste lid bedoelde
      wettelijke controle indien:

      a. het dreigende geschil van wezenlijk belang is voor ten minste één van de betrokken partijen;

      b. het dreigende geschil betrekking heeft op een eerder uitgevoerde wettelijke controle; of

      c. er niet langer sprake is van een dreigend geschil maar van een aangekondigd geschil.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel29
  - number: '30'
    text: |-
      1 De accountantsorganisatie stelt regels vast ter zake van de toelaatbaarheid van de samenloop van het uitvoeren
      van een wettelijke controle met het door haarzelf of haar netwerk aan de controlecliënt leveren van overige
      diensten. Indien de controlecliënt een organisatie van openbaar belang is, dan wordt in de bedoelde regels tevens
      de met de controlecliënt verbonden derde betrokken. Deze regels zijn erop gericht te voorkomen dat deze overige
      diensten een onaanvaardbare bedreiging vormen voor de onafhankelijkheid van de accountantsorganisatie en haar
      medewerkers.

      2 De in het eerste lid bedoelde regels bevatten ten minste het voorschrift dat de accountantsorganisatie, haar
      medewerkers of een ander onderdeel van haar netwerk geen beslissingen mogen nemen en niet mogen participeren in een
      besluitvormingsproces namens een controlecliënt of een met deze controlecliënt verbonden derde of het management
      van laatstgenoemden.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel30
  - number: '31'
    text: |-
      De accountantsorganisatie maakt de bij of krachtens de [Wet op de Registeraccountants][ref1] gestelde regels ter
      zake van de integere bedrijfsvoering bekend aan haar medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0002374
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002374
  - number: '32'
    text: |-
      1 De accountantsorganisatie heeft een regeling die waarborgt dat personen van buiten de accountantsorganisatie en
      bij haar werkzame of aan haar verbonden personen zonder gevaar voor hun rechtspositie vermeende onregelmatigheden
      binnen of (mede) buiten de accountantsorganisatie aan de orde kunnen stellen. Deze regeling leidt ertoe dat
      klachten worden vastgelegd, vertrouwelijk en tijdig worden behandeld en dat de onregelmatigheden waarover
      wordt geklaagd, indien gegrond, tijdig worden afgehandeld door het nemen van passende maatregelen door de
      accountantsorganisatie.

      2 De in het eerste lid bedoelde regeling wordt in elk geval op de website van de accountantsorganisatie geplaatst.
      In geval een accountantsorganisatie niet over een website beschikt, verspreidt zij deze regeling op een andere
      wijze binnen de accountantsorganisatie en stuurt zij deze regeling desgevraagd toe aan personen buiten de
      accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel32
  - number: '33'
    text: |-
      De personen die het dagelijks beleid van de accountantsorganisatie bepalen zorgen ervoor dat vanaf het moment dat
      de accountantsorganisatie ophoudt te bestaan:

      a. de gegevens die de accountantsorganisatie op grond van het bepaalde bij of krachtens de [wet][ref1], het
      [besluit][ref2] of deze verordening moet bewaren, bewaard blijven gedurende de in die regelingen voorgeschreven
      periode;

      b. de vertrouwelijkheid van de in [artikelen 20][ref3] en [26, eerste lid, van de wet][ref4] bedoelde gegevens
      gewaarborgd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0019468
      [ref2]: https://wetten.overheid.nl/BWBR0020184
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel26
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019468
      - id: ref2
        bwb_id: BWBR0020184
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '26'
  - number: '34'
    text: |-
      1 Het bestuur kan nadere voorschriften geven aangaande de onafhankelijkheid, het stelsel van kwaliteitsbeheersing
      en de integere bedrijfsvoering van de accountantsorganisatie.

      2 De nadere voorschriften, bedoeld in het eerste lid, worden door het bestuur slechts gegeven - de leden gehoord -
      na overleg met het bestuur van de Nederlandse Orde van Accountants-Administratieconsulenten.

      3 Het bestuur maakt de nadere voorschriften via elektronische weg bekend op http://www.nivra.nl.
    url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#Artikel34
