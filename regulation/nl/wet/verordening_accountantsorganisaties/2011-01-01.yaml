    Stelt de volgende verordening vast.
  url: https://wetten.overheid.nl/BWBR0026502/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:

      a. accountantsorganisatie: onderneming of instelling die bedrijfsmatig wettelijke controles verricht,
      dan wel een organisatie waarin zodanige ondernemingen of instellingen met elkaar zijn verbonden, als
      bedoeld in [artikel 1, eerste lid, onderdeel a, van de wet][ref1], waaraan een vergunning als bedoeld in
      [artikel 5 van de wet][ref2], is verleend, uitsluitend ter zake van de werkingssfeer van de [wet][ref3];

      b. besluit: [Besluit toezicht accountantsorganisaties][ref4];

      c. bestuur: bestuur van het Nederlands Instituut van Registeraccountants;

      d. compliance officer: persoon als bedoeld in [artikel 23, eerste lid, van het besluit][ref5];

      e. controlecliënt: onderneming of instelling als bedoeld in [artikel 1, eerste lid, onderdeel e, van de wet][ref6];

      f. externe accountant: persoon als bedoeld in [artikel 1, eerste lid, onderdeel f, van de wet][ref7];

      g. financieel belang: een financieel belang in een controlecliënt, gehouden door een persoon die zich in de positie
      bevindt van waaruit hij invloed kan uitoefenen op de uitkomsten van de wettelijke controle bij die controlecliënt;

      h. gezinslid: een financieel afhankelijk persoon of een andere persoon met wie samen een huishouding wordt gevoerd;

      i. indirect financieel belang: een financieel belang in een entiteit, ongeacht of deze wel of geen controlecliënt
      is van de accountantsorganisatie, welke entiteit een financieel belang in een controlecliënt heeft;

      j. intern kwaliteitsonderzoek: procedures opgezet door de accountantsorganisatie gericht op het vaststellen dat
      afgeronde wettelijke controles voldoen aan de daaraan gestelde eisen;

      k. medewerker: medewerker als bedoeld in [artikel 1 van het besluit][ref8];

      l. naaste verwant: een niet-financieel afhankelijke eerste- of tweedegraadsbloedverwant of aanverwant of stiefkind;

      m. netwerk: samenwerkingsverband als bedoeld in [artikel 1, eerste lid, onderdeel j, van de wet][ref9];

      n. onafhankelijkheidsfunctionaris: persoon belast met de uitvoering van de onafhankelijkheidsregeling, bedoeld in
      [artikel 20, eerste lid][ref10];

      o. organisatie van openbaar belang: organisatie als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de wet][ref11];

      p. persoon die deel uitmaakt van de hiërarchische structuur: een persoon die binnen de accountantsorganisatie een
      toezichthoudende of leidinggevende functie heeft ten aanzien van de uitvoering van een wettelijke controle of de
      persoon die de evaluatie van de prestatie van een bij de wettelijke controle betrokken medewerker voorbereidt,
      beoordeelt of hierop directe invloed uitoefent of anderszins de beloning van deze medewerker vaststelt;

      q. verbonden derde: natuurlijk of rechtspersoon die feitelijk beleidsbepalend is in de controlecliënt, dan wel
      invloed van betekenis kan uitoefenen op het zakelijke en financiële beleid van die controlecliënt, alsmede de
      entiteit waarin de controlecliënt feitelijk beleidsbepalend is, dan wel invloed van betekenis kan uitoefenen op het
      zakelijke en financiële beleid;

      r. vestiging: een onderdeel van een accountantsorganisatie of van haar netwerk dat wordt onderscheiden op basis
      van vastgelegde geografische criteria of op grond van vastgelegde criteria die betrekking hebben op de aard van de
      werkzaamheden en activiteiten en waarbinnen een externe accountant hoofdzakelijk werkzaam is;

      s. wet: [Wet toezicht accountantsorganisaties][ref12];

      t. wettelijke controle: controle als bedoeld in [artikel 1, eerste lid, onderdeel p, van de wet][ref13].


