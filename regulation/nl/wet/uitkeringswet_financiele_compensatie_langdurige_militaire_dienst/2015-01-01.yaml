---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitkeringswet_financiele_compensatie_langdurige_militaire_dienst
regulatory_layer: WET
publication_date: '2014-07-15'
valid_from: '2015-01-01'
bwb_id: BWBR0005569
url: https://wetten.overheid.nl/BWBR0005569/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een voorziening te treffen houdende een eenmalige
    financiële compensatie voor bepaalde groepen militairen die ten minste 5 jaar onder de wapenen zijn geweest en
    daarvoor in de overheidspensioenwetgeving geen vergelding ontvangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel1
  - number: 1.a
    text: |-
      militair: de reservist of dienstplichtige in de zin van de bij of krachtens de
      [Kaderwet militaire pensioenen][ref1] daarover vastgestelde bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 1.b
    text: |-
      werkelijke dienst: de door de militair doorgebrachte, in de periode van 1 januari 1936 tot en met 31 december 1962
      liggende werkelijke dienst in de zin van artikel A 1, eerste lid, onder *i* van de Algemene militaire pensioenwet,
      voor zover die feitelijk is doorgebracht of geacht moet worden onder de wapenen te zijn doorgebracht krachtens de
      [Wet verbetering rechtspositie verzetsmilitairen][ref1] (*Stb.* 1976, 19) en voor zover die ingevolge de vroegere
      militaire pensioenwetten in de zin van de Algemene militaire pensioenwet voor pensioen geldig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003015
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003015
  - number: 1.c
    text: 'weduwe: degene die in het tijdvak van de werkelijke dienst met de militair was gehuwd.'
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel1
  - number: '2'
    text: |-
      De gewezen militair, die een werkelijke dienst aan kan wijzen van ten minste vijf jaren en voor wie geen recht of
      uitzicht bestaat op vergelding van die tijd met enig overheidspensioen, heeft aanspraak op een eenmalige uitkering
      ten bedrage van € 3403,35.
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel2
  - number: '3'
    text: |-
      Indien de in [artikel 2][ref1] genoemde aanspraak in verband met het overlijden van de militair niet kan worden
      geëffectueerd, heeft de weduwe recht op een eenmalige uitkering, gelijk aan het bedrag dat wordt gevonden door het
      in dat artikel genoemde bedrag van € 3403,35 te vermenigvuldigen met een breuk, waarvan de teller gelijk is aan dat
      deel van de werkelijke dienst waarin zij met de militair gehuwd is geweest en de noemer gelijk is aan de werkelijke
      dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005569#Artikel2
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005569
        artikel: '2'
  - number: '4'
    text: |-
      De over de uitkering verschuldigde belasting ingevolge de [Wet inkomstenbelasting 2001][ref1] en
      de [Wet op de loonbelasting 1964][ref2] alsmede de premie voor de volksverzekeringen ingevolge de
      [Wet financiering sociale verzekeringen][ref3] komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0017745
  - number: '5'
    text: |-
      De uitkering blijft buiten beschouwing bij de verlening van bijstand ingevolge de [Participatiewet][ref1] en
      andere, op het inkomen van de rechthebbende afgestemde publiekrechtelijke uitkeringen of verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '6'
    text: |-
      Een uitkering ingevolge deze wet wordt door Onze Minister van Defensie verleend op aanvraag van de rechthebbende.
      De aanvraag moet en uiterlijk binnen twee jaren na de datum van inwerkingtreding van deze wet zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel6
  - number: '8'
    text: 'Deze wet kan worden aangehaald als: Uitkeringswet financiële compensatie langdurige militaire dienst.'
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel8
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005569/2015-01-01#Artikel9
