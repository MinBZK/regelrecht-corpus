  - number: III
    text: |-
      De artikelen 105 en 157, zoals deze artikelen luidden op de dag voorafgaand aan de inwerkingtreding van deze wet,
      blijven van toepassing ten aanzien van een wijziging in de bezoldiging van het rijkspersoneel voor 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0006684/1995-01-01#ArtikelIII
  - number: IV
    text: |-
      Ten aanzien van degene die ingevolge de [Algemene pensioenwet politieke ambtsdragers][ref1] recht op nabestaanden-
      of wezenpensioen hebben verkregen voor 1 januari 1995, wordt de tijd waarnaar het pensioen is of geacht wordt te
      zijn berekend en die niet daadwerkelijk als politiek ambtsdrager is doorgebracht, voorzover nodig medebegrepen
      onder tijd gelegen voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0006684/1995-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: V
    text: |-
      Een algemene maatregel van bestuur als bedoeld in de artikelen 106, tweede lid, en 160, tweede lid, zoals
      die artikelen zijn gewijzigd bij deze wet, kan voor de eerste keer terugwerken tot en met het tijdstip van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006684/1995-01-01#ArtikelV
  - number: VI
    text: |-
      De Wet van 22 december 1983, houdende wijziging van de [Inhoudingswet overheidspersoneel 1982](onbekend) en
      regeling inhouding op het inkomen van leden en gewezen leden van de Staten-Generaal (*Stb.* 651) wordt ingetrokken
    url: https://wetten.overheid.nl/BWBR0006684/1995-01-01#ArtikelVI
  - number: VII
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1995, met uitzondering van
      [artikel I, onderdeel D, onder 2 en 3, onderdeel H, onderdeel N, onder 2 en 3, onderdeel R, onderdeel][ref1]
      AA, onder 2 en 3, onderdeel FF, dat in werking treedt met ingang van de eerste dag van de
      kalendermaand na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst. Indien
      het *Staatsblad* waarin deze wet wordt geplaatst, wordt uitgegeven na 30 april 1994, werkt
      [artikel I, onderdeel D, onder 2 en 3, onderdeel H, onderdeel N, onder 2 en 3, onderdeel R, onderdeel][ref2] AA,
      onder 2 en 3, onderdeel FF terug tot en met 1 mei 1994.


