preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gevolgen voor de materiële rechtspositie van het
    overheidspersoneel die voortvloeien uit de Wet financiële voorzieningen privatisering ABP overeenkomstig neerslag
    te doen vinden in de materiële rechtspositie van de politieke ambtsdragers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006684/1995-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Met ingang van de inwerkingtreding van deze wet worden:

      a. het inkomen van een politiek ambtsdrager als bedoeld in de [Algemene pensioenwet politieke ambtsdragers][ref1],
      als zodanig, alsmede het inkomen van degene die een functie vervult ter zake waarvan die wet van overeenkomstige
      toepassing is verklaard, uit die functie,

      b. de laatstelijk genoten wedde dan wel de berekeningsgrondslag, waarvan is afgeleid een uitkering ter zake
      van ontslag of aftreden als politiek ambtsdrager dan wel een overeenkomstige uitkering ter zake van ontslag
      of aftreden uit een functie als bedoeld onder *a*, in beide gevallen inbegrepen een zodanige wegens algemene
      invaliditeit voortgezette uitkering, aangepast overeenkomstig de aanpassing van de salarissen ingevolge
      [artikel 34 van de Wet financiële voorzieningen privatisering ABP][ref2].

      2 De in het eerste lid bedoelde aanpassing is geen algemene bezoldigingswijziging als bedoeld in de
      [artikelen 105][ref3] en [157 van de Algemene pensioenwet politieke ambtsdragers][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002691
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002691#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0002691#Artikel157
