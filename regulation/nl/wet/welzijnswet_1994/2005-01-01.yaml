      - id: ref2
        bwb_id: BWBR0006705
        artikel: '9'
        hoofdstuk: V
  - number: 10a
    text: |-
      1 Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering
      verstrekken ten behoeve van beleid op het terrein van maatschappelijke opvang, vrouwenopvang daaronder niet
      begrepen, en op het terrein van verslavingsbeleid.

      2 Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering
      verstrekken ten behoeve van beleid op het terrein van vrouwenopvang.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van:

      a. het bedrag van de uitkering dan wel de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag van een uitkering en de besluitvorming daarover;

      c. de vaststelling van de uitkering;

      d. de intrekking of wijziging van de beschikking tot verlening en vaststelling van de uitkering;

      e. de betaling, de terugvordering van de uitkering alsmede het verlenen van voorschotten op de uitkering.

      In de maatregel kan het stellen van nadere regels aan Onze Minister worden opgedragen.

      4 Een gemeente waaraan een uitkering als bedoeld in het eerste of tweede lid wordt verstrekt en die daartoe
      financiële middelen verstrekt aan instellingen, draagt er zorg voor dat die instellingen overeenkomstig door Onze
      Minister bij ministeriële regeling te stellen regels hun werkzaamheden registreren en de geregistreerde gegevens
      verstrekken aan een door Onze Minister daartoe aangewezen instelling.

      5 Het gemeentebestuur van een gemeente waaraan een uitkering als bedoeld in het eerste of tweede lid wordt
      verstrekt, werkt mee aan door Onze Minister ingestelde onderzoeken, gericht op het verkrijgen van inzicht in het
      beleid van gemeentebesturen inzake maatschappelijke opvang, vrouwenopvang en verslavingsbeleid overeenkomstig bij
      ministeriële regeling te stellen regels.

      6 De voordracht voor een krachtens het eerste, tweede en derde lid vast te stellen algemene maatregel van bestuur
      wordt niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd en sedert die
      overlegging vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel10a
  - number: '11'
    text: |-
      Het gemeentebestuur of provinciale bestuur dat subsidie verstrekt voor activiteiten op de in [artikel 2][ref1]
      genoemde terreinen draagt er zorg voor dat de subsidie-ontvanger desgevraagd meewerkt aan door of namens Onze
      Minister ingestelde onderzoeken die er op zijn gericht Onze Minister inlichtingen te verschaffen ten behoeve van de
      uitvoering van de landelijke functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel2
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '2'
        hoofdstuk: I
  - number: 11a
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet voorzover betrekking hebbend op de
      tot de bemoeiing van het Rijk behorende voorzieningen, zijn belast de bij besluit van Onze Minister aangewezen
      ambtenaren.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet voorzover betrekking hebbend op de
      tot de bemoeiing van de provincies of van de gemeenten behorende voorzieningen, zijn belast de bij besluit van
      gedeputeerde staten respectievelijk bij besluit van burgemeester en wethouders aangewezen ambtenaren.

      3 De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      4 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel11a
