  - number: '18'
    text: |-
      Het gemeentebestuur verstrekt aan de verhuurder van woningen aan wie voor 1986 door Onze Minister een subsidie
      is toegekend op grond van artikel 2 van het Interimbesluit woontussenvoorzieningen, subsidie in de kosten van
      voorzieningen die gericht zijn op het handhaven en bevorderen van de mogelijkheden voor ouderen om zo lang
      mogelijk zelfstandig te blijven wonen, voor zover het bewoners betreft ten behoeve van wie in 1986 door Onze
      Minister subsidie is verstrekt. Het subsidie is zodanig dat de verhuurder ten behoeve van deze bewoners de bedoelde
      voorzieningen op gelijke voet als in 1986 kan blijven aanbieden.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel18
  - number: '20'
    text: |-
      1 In afwijking van [artikel 7, vierde lid][ref1], worden bij gemeentelijke verordening regels gesteld met
      betrekking tot de kwaliteit van bij algemene maatregel van bestuur aangewezen vormen van kinderopvang, anders
      dan de kinderopvang, waarop de [Wet kinderopvang][ref2] van toepassing is, alsmede het toezicht op de naleving
      daarvan. Bij algemene maatregel van bestuur kan worden bepaald welke kwaliteitsvoorschriften in ieder geval in de
      gemeentelijke verordening worden opgenomen.

      2 De in het eerste lid bedoelde verordening is van toepassing op zowel de gesubsidieerde kinderopvang als de niet-
      gesubsidieerde kinderopvang.

      3 Uiterlijk acht weken voordat de voordracht voor een maatregel als bedoeld in het eerste lid wordt gedaan, laat
      Onze Minister het ontwerp daarvan plaatsen in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel20
    references:
