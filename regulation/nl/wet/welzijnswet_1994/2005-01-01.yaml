        artikel: '10'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:23
  - number: '10'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen de activiteiten
      waarvoor subsidie kan worden verstrekt nader worden bepaald alsmede andere criteria voor die verstrekking worden
      vastgesteld.

      2 De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op:

      a. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag van een subsidie en de besluitvorming daarover;

      c. de verplichtingen van de subsidie-ontvanger;

      d. de vaststelling van de subsidie;

      e. de intrekking of wijziging van de beschikking tot verlening en vaststelling van een specifieke uitkering;

      f. de betaling en terugvordering van de subsidie alsmede het verlenen van voorschotten op de subsidie.

      g. delegatie van de bevoegdheid besluiten te nemen met betrekking tot de subsidie.

      3 Uiterlijk een maand voordat de voordracht voor een maatregel als bedoeld in het eerste lid wordt gedaan, laat
      Onze Minister het ontwerp daarvan plaatsen in de *Staatscourant*.

      4 Onze Minister kan aan een subsidie als bedoeld in [artikel 9][ref1] verplichtingen verbinden met inachtneming van
      het bij of krachtens de maatregel, bedoeld in het eerste lid, bepaalde.

      5 Bij algemene maatregel van bestuur of de ministeriële regeling, bedoeld in het eerste lid, kan worden voorzien
      in de vaststelling van subsidieplafonds voor het verstrekken van subsidies bedoeld in [artikel 9][ref2], anders dan
      specifieke uitkeringen, en in de regeling van de wijze van verdeling daarvan.

      6 De regels, bedoeld in het eerste lid, kunnen mede strekken tot de bevordering van bij algemene maatregel van
      bestuur aangewezen overheidsdoelstellingen van algemene aard.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel9
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel10
