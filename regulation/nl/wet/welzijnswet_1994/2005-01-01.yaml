        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '12'
    text: |-
      1 Een gemeente die op grond van [artikel 10a][ref1] een uitkering ontvangt, overlegt over de besteding van die
      uitkering met de omringende gemeenten.

      2 De door gemeenten bekostigde voorzieningen op het terrein van maatschappelijke opvang en verslavingsbeleid zijn
      toegankelijk voor iedereen die in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel10a
