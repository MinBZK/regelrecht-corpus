  - number: '23'
    text: |-
      Deze wet kan worden aangehaald als: Welzijnswet met vermelding van het jaartal van het *Staatsblad* waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel23
