preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke regels te stellen inzake de
    gezamenlijke inspanning van de overheden, om in samenwerking met het particulier initiatief en andere betrokkenen
    activiteiten op het terrein van het welzijnsbeleid te realiseren, te ontwikkelen en te verbeteren en voorts dat het
    wenselijk is het welzijnsbeleid van het Rijk eenmaal per vier jaar in een nota vast te leggen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. welzijnsbeleid: de gezamenlijke inspanning van de overheden op maatschappelijk en sociaal-cultureel terrein, die
      tot doel heeft, in samenwerking met het particulier initiatief en andere betrokkenen:

      1°. de ontplooiingsmogelijkheden van mensen te vergroten en hun zelfredzaamheid alsmede hun deelname aan de
      samenleving te stimuleren mede om te voorkomen dat mensen in een achterstandspositie geraken;

      2°. de personen die in een achterstandspositie zijn geraakt mogelijkheden te bieden hun positie te verbeteren;

      3°. het welbevinden van personen in de samenleving op andere wijze te bevorderen;

      c. uitvoerend werk: het geheel van maatschappelijke en sociaal-culturele activiteiten, rechtstreeks gericht op
      personen of groepen van personen in de samenleving;

      d. steunfunctiewerk: het geheel van de activiteiten die het uitvoerend werk ondersteunen;

      e. landelijke functie:

      1°. het volgen, signaleren en analyseren van ontwikkelingen in de samenleving;

      2°. het stimuleren van nieuw beleid, nieuwe voorzieningen en activiteiten;

      3°. het zorgdragen voor innovatieve projecten met een landelijke betekenis;

      4°. het zorgdragen voor internationale uitwisselingen van informatie;

      5°. het zorgdragen voor een landelijke infrastructuur waaronder landelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel1
  - number: '2'
    text: |-
      Deze wet is van toepassing op de volgende terreinen van het welzijnsbeleid:

      a. welzijn jeugd, behoudens voor zover de [Wet op de jeugdzorg][ref1] van toepassing is;

      b. kinderopvang;

      c. maatschappelijke dienstverlening;

      d. maatschappelijke opvang, waaronder sociale pensions en vrouwenopvang;

      e. verslavingsbeleid, behoudens voor zover de [Algemene Wet Bijzondere Ziektekosten][ref2] van toepassing is;

      f. sociaal-cultureel werk;

      g. emancipatie;

      h. sport;

      i. welzijn ouderen, behoudens voor zover de [Algemene Wet Bijzondere Ziektekosten][ref3] van toepassing is;

      j. welzijn gehandicapten;

      k. welzijn etnische minderheden en groepen personen die in een met etnische minderheden vergelijkbare positie
      verkeren, behoudens voor zover de [Wet inburgering nieuwkomers][ref4] van toepassing is.

      l. dienstverlening ten behoeve van door de Tweede Wereldoorlog getroffenen;

      m. activiteiten in het kader van de viering van de bevrijding, de voorlichting over en herdenking van de
      gebeurtenissen gedurende de Tweede Wereldoorlog.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0009544
