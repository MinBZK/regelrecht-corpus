        bwb_id: BWBR0006705
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0017017
  - number: '22'
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 1994. Indien het *Staatsblad* waarin deze wet wordt
      geplaatst, wordt uitgegeven na 31 december 1993, treedt zij in werking met ingang van de dag na de datum van het
      *Staatsblad* waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 1994.

      2 In afwijking van het eerste lid treedt [artikel 12][ref1] in werking op het tijdstip waarop de Tijdelijke wet
      stimulering sociale vernieuwing vervalt.

      3 [Artikel 20][ref2] treedt in afwijking van het eerste lid in werking op een bij koninklijk besluit te bepalen
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel20
