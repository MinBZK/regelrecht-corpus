        hoofdstuk: II
  - number: '6'
    text: |-
      1 De gemeenten Amsterdam, Rotterdam, 's-Gravenhage en Utrecht worden voor de toepassing van
      [artikel 4, tweede lid][ref1], en het bepaalde krachtens [artikel 5, eerste lid][ref2], gelijkgesteld met een
      provincie.

      2 De in het eerste lid genoemde gemeenten worden ten aanzien van het beleid inzake steunfunctiewerk voor
      minderheden niet gelijk gesteld met een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel4
