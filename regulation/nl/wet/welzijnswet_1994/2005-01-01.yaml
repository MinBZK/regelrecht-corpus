  - number: '3'
    text: |-
      1 Onze Minister, de provinciale besturen en de gemeentebesturen bevorderen een goede samenwerking tussen de
      betrokken overheidsniveaus, het particulier initiatief op het terrein van het welzijnsbeleid en andere betrokkenen
      in alle gevallen waarin een goede samenwerking nodig is om de doelstellingen van het welzijnsbeleid op een
      doelmatige en doeltreffende wijze te realiseren.

      2 Onze Minister, de provinciale besturen en de gemeentebesturen houden bij het voeren van welzijnsbeleid zoveel
      mogelijk rekening met de pluriformiteit van de samenleving en bevorderen daarbij, met inachtneming van waarborgen
      voor deugdelijkheid, doelmatigheid en democratisch functioneren, eigen initiatief en verantwoordelijkheid van de
      burgers.

      3 Onze Minister, de provinciale besturen en de gemeentebesturen bevorderen dat het door hen gesubsidieerde
      particulier initiatief op het terrein van het welzijnsbeleid rekening houdt met de pluriformiteit van de
      samenleving.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Tot de verantwoordelijkheid van de gemeenten behoort het beleid inzake het uitvoerend werk, met uitzondering van
      de kinderopvang, waarop de [Wet kinderopvang][ref1] van toepassing is.

      2 Tot de verantwoordelijkheid van de provincies behoort het beleid inzake het steunfunctiewerk.

      3 Tot de verantwoordelijkheid van het Rijk behoort het beleid inzake de landelijke functie, met uitzondering van de
      kinderopvang, waarop de [Wet kinderopvang][ref2] van toepassing is.

      4 Een gemeente of provincie kan beleid voeren ter zake van onderdelen van steunfunctiewerk, onderscheidenlijk
      uitvoerend werk, die niet op grond van het eerste of tweede lid dan wel [artikel 5][ref3] tot haar
      verantwoordelijkheid behoren, mits dit geschiedt in overeenstemming met de betrokken provincie, onderscheidenlijk
      de betrokken gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
      [ref2]: https://wetten.overheid.nl/BWBR0017017
      [ref3]: https://wetten.overheid.nl/BWBR0006705#Artikel5
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel4
