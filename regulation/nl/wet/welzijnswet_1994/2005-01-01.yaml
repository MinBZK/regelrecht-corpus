  - number: '7'
    text: |-
      1 Degene die subsidie ontvangt in de kosten van uitvoerend werk of steunfunctiewerk op het terrein van het
      welzijnsbeleid draagt er zorg voor dat dit werk van verantwoorde kwaliteit is. Onder uitvoerend werk of
      steunfunctiewerk van verantwoorde kwaliteit wordt verstaan werk dat in ieder geval doeltreffend, doelmatig en
      cliëntgericht wordt verricht.

      2 Ter voldoening aan de verplichting, bedoeld in het eerste lid, wordt in ieder geval het in het eerste lid
      bedoelde werk op zodanige wijze georganiseerd, zowel kwalitatief als kwantitatief zodanig van personeel en
      materieel voorzien, en zorggedragen voor een zodanige verantwoordelijkheidstoedeling, dat een en ander leidt of
      redelijkerwijs moet leiden tot uitvoerend werk en steunfunctiewerk van verantwoorde kwaliteit.

      3 Het uitvoeren van het tweede lid omvat mede de systematische bewaking van de kwaliteit van het desbetreffende
      werk, alsmede maatregelen en onderzoek naar beheersing en verbetering daarvan.

      4 Aan een subsidie als bedoeld in het eerste lid kunnen door de subsidieverlener verplichtingen met betrekking tot
      de kwaliteit worden verbonden, tenzij de subsidie-ontvanger deelneemt aan een door middel van zelfregulering tot
      stand gekomen landelijk kwaliteitssysteem. Omtrent een landelijk kwaliteitssysteem als bedoeld in de eerste volzin
      dient overeenstemming te bestaan met vertegenwoordigende organisaties van de subsidiërende overheid dan wel met
      Onze Minister, indien de subsidie door hem wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister legt eenmaal per vier jaar aan beide Kamers der Staten-Generaal een welzijnsnota over.

      2 De welzijnsnota bevat in ieder geval een verslag van activiteiten op het terrein van het welzijnsbeleid alsmede
      van de belangrijkste ontwikkelingen daarin. Het verslag gaat vergezeld van een globaal overzicht van de ten behoeve
      van het welzijnsbeleid bestede en aangewezen rijksbegrotingsmiddelen gedurende de verslagperiode.

      3 De welzijnsnota bevat tevens een beschrijving van de hoofdlijnen van het welzijnsbeleid van het Rijk in de daarop
      volgende periode van vier jaren alsmede van de te verwachten belangrijke ontwikkelingen die van invloed zijn op het
      maatschappelijke en sociaal-culturele leven in Nederland.

      4 Bij tussentijdse wijziging van de hoofdlijnen van het welzijnsbeleid van het Rijk doet Onze Minister daarvan
      mededeling aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister kan subsidies waaronder specifieke uitkeringen verstrekken ten behoeve van activiteiten op
      beleidsterreinen die op grond van de [artikelen 4, derde lid][ref1], en [5][ref2] tot de verantwoordelijkheid van
      het Rijk behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel5
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel9
