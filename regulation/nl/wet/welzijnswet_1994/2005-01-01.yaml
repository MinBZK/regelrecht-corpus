  - number: 9a
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 10][ref1] tenzij het een subsidie betreft:

      a. als bedoeld in [artikel 4: 23 , derde lid, van de Algemene wet bestuursrecht][ref2] of

      b. waarvan de voorgenomen strekking tevoren schriftelijk is meegedeeld aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel423
    url: https://wetten.overheid.nl/BWBR0006705/2005-01-01#Artikel9a
    references:
      - id: ref1
