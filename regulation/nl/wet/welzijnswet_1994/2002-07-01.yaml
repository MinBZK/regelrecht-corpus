$id: welzijnswet_1994
regulatory_layer: WET
publication_date: '2006-12-07'
valid_from: '2002-07-01'
bwb_id: BWBR0006705
url: https://wetten.overheid.nl/BWBR0006705/2002-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke regels te stellen inzake de
    gezamenlijke inspanning van de overheden, om in samenwerking met het particulier initiatief en andere betrokkenen
    activiteiten op het terrein van het welzijnsbeleid te realiseren, te ontwikkelen en te verbeteren en voorts dat het
    wenselijk is het welzijnsbeleid van het Rijk eenmaal per vier jaar in een nota vast te leggen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.a
    text: Onze Minister van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.b
    text: |-
      welzijnsbeleid: de gezamenlijke inspanning van de overheden op maatschappelijk en sociaal-cultureel terrein, die
      tot doel heeft, in samenwerking met het particulier initiatief en andere betrokkenen:
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.b.1°
    text: |-
      de ontplooiingsmogelijkheden van mensen te vergroten en hun zelfredzaamheid alsmede hun deelname aan de samenleving
      te stimuleren mede om te voorkomen dat mensen in een achterstandspositie geraken;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.b.2°
    text: de personen die in een achterstandspositie zijn geraakt mogelijkheden te bieden hun positie te verbeteren;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.b.3°
    text: het welbevinden van personen in de samenleving op andere wijze te bevorderen;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.c
    text: |-
      uitvoerend werk: het geheel van maatschappelijke en sociaal-culturele activiteiten, rechtstreeks gericht op
      personen of groepen van personen in de samenleving;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.d
    text: 'steunfunctiewerk: het geheel van de activiteiten die het uitvoerend werk ondersteunen;'
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.e
    text: 'landelijke functie:'
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.e.1°
    text: het volgen, signaleren en analyseren van ontwikkelingen in de samenleving;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.e.2°
    text: het stimuleren van nieuw beleid, nieuwe voorzieningen en activiteiten;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.e.3°
    text: het zorgdragen voor innovatieve projecten met een landelijke betekenis;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.e.4°
    text: het zorgdragen voor internationale uitwisselingen van informatie;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: 1.e.5°
    text: het zorgdragen voor een landelijke infrastructuur waaronder landelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel1
  - number: '2'
    text: 'Deze wet is van toepassing op de volgende terreinen van het welzijnsbeleid:'
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.a
    text: |-
      welzijn jeugd, behoudens voor zover de [Wet op de jeugdhulpverlening][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004608
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004608
  - number: 2.b
    text: kinderopvang;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.c
    text: maatschappelijke dienstverlening;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.d
    text: maatschappelijke opvang, waaronder sociale pensions en vrouwenopvang;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.e
    text: |-
      verslavingsbeleid, behoudens voor zover de [Algemene Wet Bijzondere Ziektekosten][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2.f
    text: sociaal-cultureel werk;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.g
    text: emancipatie;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.h
    text: sport;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.i
    text: |-
      welzijn ouderen, behoudens voor zover de [Algemene Wet Bijzondere Ziektekosten][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2.j
    text: welzijn gehandicapten;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.k
    text: |-
      welzijn etnische minderheden en groepen personen die in een met etnische minderheden vergelijkbare positie
      verkeren, behoudens voor zover de [Wet inburgering nieuwkomers][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 2.l
    text: dienstverlening ten behoeve van door de Tweede Wereldoorlog getroffenen;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: 2.m
    text: |-
      activiteiten in het kader van de viering van de bevrijding, de voorlichting over en herdenking van de
      gebeurtenissen gedurende de Tweede Wereldoorlog.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister, de provinciale besturen en de gemeentebesturen bevorderen een goede samenwerking tussen de betrokken
      overheidsniveaus, het particulier initiatief op het terrein van het welzijnsbeleid en andere betrokkenen in alle
      gevallen waarin een goede samenwerking nodig is om de doelstellingen van het welzijnsbeleid op een doelmatige en
      doeltreffende wijze te realiseren.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister, de provinciale besturen en de gemeentebesturen houden bij het voeren van welzijnsbeleid zoveel
      mogelijk rekening met de pluriformiteit van de samenleving en bevorderen daarbij, met inachtneming van waarborgen
      voor deugdelijkheid, doelmatigheid en democratisch functioneren, eigen initiatief en verantwoordelijkheid van de
      burgers.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister, de provinciale besturen en de gemeentebesturen bevorderen dat het door hen gesubsidieerde
      particulier initiatief op het terrein van het welzijnsbeleid rekening houdt met de pluriformiteit van de
      samenleving.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel3
  - number: '4.1'
    text: Tot de verantwoordelijkheid van de gemeenten behoort het beleid inzake het uitvoerend werk.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel4
  - number: '4.2'
    text: Tot de verantwoordelijkheid van de provincies behoort het beleid inzake het steunfunctiewerk.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel4
  - number: '4.3'
    text: Tot de verantwoordelijkheid van het Rijk behoort het beleid inzake de landelijke functie.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel4
  - number: '4.4'
    text: |-
      Een gemeente of provincie kan beleid voeren ter zake van onderdelen van steunfunctiewerk, onderscheidenlijk
      uitvoerend werk, die niet op grond van het eerste of tweede lid dan wel [artikel 5][ref1] tot haar
      verantwoordelijkheid behoren, mits dit geschiedt in overeenstemming met de betrokken provincie, onderscheidenlijk
      de betrokken gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel5
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '5'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Indien om redenen van doelmatigheid en doeltreffendheid een onderdeel van het beleid inzake uitvoerend werk tot
      de verantwoordelijkheid van de provincies of het Rijk dan wel een onderdeel van het beleid inzake steunfunctiewerk
      tot de verantwoordelijkheid van het Rijk behoort te worden gerekend, kan de verantwoordelijkheid voor het
      desbetreffende beleidsonderdeel in afwijking van [artikel 4][ref1] bij algemene maatregel van bestuur worden
      toegedeeld aan de provincies onderscheidenlijk het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel4
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '4'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Alvorens de voordracht voor een maatregel als bedoeld in het eerste lid wordt gedaan, voert Onze Minister overleg
      met vertegenwoordigende organisaties van de gemeenten, onderscheidenlijk de provincies.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel5
  - number: '6.1'
    text: |-
      De gemeenten Amsterdam, Rotterdam, 's-Gravenhage en Utrecht worden voor de toepassing van
      [artikel 4, tweede lid][ref1], en het bepaalde krachtens [artikel 5, eerste lid][ref2], gelijkgesteld met een
      provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel5
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006705
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      De in het eerste lid genoemde gemeenten worden ten aanzien van het beleid inzake steunfunctiewerk voor minderheden
      niet gelijk gesteld met een provincie.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel6
  - number: '7.1'
    text: |-
      Degene die subsidie ontvangt in de kosten van uitvoerend werk of steunfunctiewerk op het terrein van het
      welzijnsbeleid draagt er zorg voor dat dit werk van verantwoorde kwaliteit is. Onder uitvoerend werk of
      steunfunctiewerk van verantwoorde kwaliteit wordt verstaan werk dat in ieder geval doeltreffend, doelmatig en
      cliëntgericht wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel7
  - number: '7.2'
    text: |-
      Ter voldoening aan de verplichting, bedoeld in het eerste lid, wordt in ieder geval het in het eerste lid
      bedoelde werk op zodanige wijze georganiseerd, zowel kwalitatief als kwantitatief zodanig van personeel en
      materieel voorzien, en zorggedragen voor een zodanige verantwoordelijkheidstoedeling, dat een en ander leidt of
      redelijkerwijs moet leiden tot uitvoerend werk en steunfunctiewerk van verantwoorde kwaliteit.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel7
  - number: '7.3'
    text: |-
      Het uitvoeren van het tweede lid omvat mede de systematische bewaking van de kwaliteit van het desbetreffende werk,
      alsmede maatregelen en onderzoek naar beheersing en verbetering daarvan.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel7
  - number: '7.4'
    text: |-
      Aan een subsidie als bedoeld in het eerste lid kunnen door de subsidieverlener verplichtingen met betrekking tot de
      kwaliteit worden verbonden, tenzij de subsidie-ontvanger deelneemt aan een door middel van zelfregulering tot stand
      gekomen landelijk kwaliteitssysteem. Omtrent een landelijk kwaliteitssysteem als bedoeld in de eerste volzin dient
      overeenstemming te bestaan met vertegenwoordigende organisaties van de subsidiërende overheid dan wel met Onze
      Minister, indien de subsidie door hem wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel7
  - number: '8.1'
    text: Onze Minister legt eenmaal per vier jaar aan beide Kamers der Staten-Generaal een welzijnsnota over.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel8
  - number: '8.2'
    text: |-
      De welzijnsnota bevat in ieder geval een verslag van activiteiten op het terrein van het welzijnsbeleid alsmede van
      de belangrijkste ontwikkelingen daarin. Het verslag gaat vergezeld van een globaal overzicht van de ten behoeve van
      het welzijnsbeleid bestede en aangewezen rijksbegrotingsmiddelen gedurende de verslagperiode.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel8
  - number: '8.3'
    text: |-
      De welzijnsnota bevat tevens een beschrijving van de hoofdlijnen van het welzijnsbeleid van het Rijk in de daarop
      volgende periode van vier jaren alsmede van de te verwachten belangrijke ontwikkelingen die van invloed zijn op het
      maatschappelijke en sociaal-culturele leven in Nederland.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel8
  - number: '8.4'
    text: |-
      Bij tussentijdse wijziging van de hoofdlijnen van het welzijnsbeleid van het Rijk doet Onze Minister daarvan
      mededeling aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister kan subsidies waaronder specifieke uitkeringen verstrekken ten behoeve van activiteiten op
      beleidsterreinen die op grond van de [artikelen 4, derde lid][ref1], en [5][ref2] tot de verantwoordelijkheid van
      het Rijk behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel5
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006705
        artikel: '5'
        hoofdstuk: II
  - number: 9a
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 10][ref1] tenzij het een subsidie betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel10
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '10'
        hoofdstuk: V
  - number: 9a.a
    text: |-
      als bedoeld in [artikel 4: 23 , derde lid, van de Algemene wet bestuursrecht][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 9a.b
    text: waarvan de voorgenomen strekking tevoren schriftelijk is meegedeeld aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel9a
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen de activiteiten
      waarvoor subsidie kan worden verstrekt nader worden bepaald alsmede andere criteria voor die verstrekking worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: '10.2'
    text: 'De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.a
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.b
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.c
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.d
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.e
    text: de intrekking of wijziging van de beschikking tot verlening en vaststelling van een specifieke uitkering;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.f
    text: de betaling en terugvordering van de subsidie alsmede het verlenen van voorschotten op de subsidie.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10.2.g
    text: delegatie van de bevoegdheid besluiten te nemen met betrekking tot de subsidie.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: '10.3'
    text: |-
      Uiterlijk een maand voordat de voordracht voor een maatregel als bedoeld in het eerste lid wordt gedaan, laat Onze
      Minister het ontwerp daarvan plaatsen in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister kan aan een subsidie als bedoeld in [artikel 9][ref1] verplichtingen verbinden met inachtneming van
      het bij of krachtens de maatregel, bedoeld in het eerste lid, bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel9
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '9'
        hoofdstuk: V
  - number: '10.5'
    text: |-
      Bij algemene maatregel van bestuur of de ministeriële regeling, bedoeld in het eerste lid, kan worden voorzien in
      de vaststelling van subsidieplafonds voor het verstrekken van subsidies bedoeld in [artikel 9][ref1], anders dan
      specifieke uitkeringen, en in de regeling van de wijze van verdeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel9
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '9'
        hoofdstuk: V
  - number: '10.6'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen mede strekken tot de bevordering van bij algemene maatregel van
      bestuur aangewezen overheidsdoelstellingen van algemene aard.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10
  - number: 10a.1
    text: |-
      Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering verstrekken
      ten behoeve van beleid op het terrein van maatschappelijke opvang, vrouwenopvang daaronder niet begrepen, en op het
      terrein van verslavingsbeleid.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.2
    text: |-
      Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering verstrekken
      ten behoeve van beleid op het terrein van vrouwenopvang.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.3
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.3.a
    text: het bedrag van de uitkering dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.3.b
    text: de aanvraag van een uitkering en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.3.c
    text: de vaststelling van de uitkering;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.3.d
    text: de intrekking of wijziging van de beschikking tot verlening en vaststelling van de uitkering;
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.3.e
    text: de betaling, de terugvordering van de uitkering alsmede het verlenen van voorschotten op de uitkering.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.4
    text: |-
      Een gemeente waaraan een uitkering als bedoeld in het eerste of tweede lid wordt verstrekt en die daartoe
      financiële middelen verstrekt aan instellingen, draagt er zorg voor dat die instellingen overeenkomstig door Onze
      Minister bij ministeriële regeling te stellen regels hun werkzaamheden registreren en de geregistreerde gegevens
      verstrekken aan een door Onze Minister daartoe aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.5
    text: |-
      Het gemeentebestuur van een gemeente waaraan een uitkering als bedoeld in het eerste of tweede lid wordt verstrekt,
      werkt mee aan door Onze Minister ingestelde onderzoeken, gericht op het verkrijgen van inzicht in het beleid van
      gemeentebesturen inzake maatschappelijke opvang, vrouwenopvang en verslavingsbeleid overeenkomstig bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: 10a.6
    text: |-
      De voordracht voor een krachtens het eerste, tweede en derde lid vast te stellen algemene maatregel van bestuur
      wordt niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd en sedert die
      overlegging vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel10a
  - number: '11'
    text: |-
      Het gemeentebestuur of provinciale bestuur dat subsidie verstrekt voor activiteiten op de in [artikel 2][ref1]
      genoemde terreinen draagt er zorg voor dat de subsidie-ontvanger desgevraagd meewerkt aan door of namens Onze
      Minister ingestelde onderzoeken die er op zijn gericht Onze Minister inlichtingen te verschaffen ten behoeve van de
      uitvoering van de landelijke functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel2
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '2'
        hoofdstuk: I
  - number: 11a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet voorzover betrekking hebbend op de
      tot de bemoeiing van het Rijk behorende voorzieningen, zijn belast de bij besluit van Onze Minister aangewezen
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel11a
  - number: 11a.2
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet voorzover betrekking hebbend op de
      tot de bemoeiing van de provincies of van de gemeenten behorende voorzieningen, zijn belast de bij besluit van
      gedeputeerde staten respectievelijk bij besluit van burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel11a
  - number: 11a.3
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 11a.4
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel11a
  - number: '12.1'
    text: |-
      Een gemeente die op grond van [artikel 10a][ref1] een uitkering ontvangt, overlegt over de besteding van die
      uitkering met de omringende gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel10a
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: 10a
        hoofdstuk: V
  - number: '12.2'
    text: |-
      De door gemeenten bekostigde voorzieningen op het terrein van maatschappelijke opvang en verslavingsbeleid zijn
      toegankelijk voor iedereen die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel12
  - number: '17'
    text: |-
      Na de inwerkingtreding van deze wet berust het Besluit subsidiëring en stimulering voorzieningen van
      maatschappelijk en sociaal-cultureel welzijn op [artikel 10, eerste lid][ref1], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel10
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '10'
        hoofdstuk: V
  - number: '18'
    text: |-
      Het gemeentebestuur verstrekt aan de verhuurder van woningen aan wie voor 1986 door Onze Minister een subsidie
      is toegekend op grond van artikel 2 van het Interimbesluit woontussenvoorzieningen, subsidie in de kosten van
      voorzieningen die gericht zijn op het handhaven en bevorderen van de mogelijkheden voor ouderen om zo lang
      mogelijk zelfstandig te blijven wonen, voor zover het bewoners betreft ten behoeve van wie in 1986 door Onze
      Minister subsidie is verstrekt. Het subsidie is zodanig dat de verhuurder ten behoeve van deze bewoners de bedoelde
      voorzieningen op gelijke voet als in 1986 kan blijven aanbieden.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel18
  - number: '20.1'
    text: |-
      In afwijking van [artikel 7, vierde lid][ref1], worden bij gemeentelijke verordening regels gesteld met betrekking
      tot de kwaliteit van bij algemene maatregel van bestuur aangewezen vormen van kinderopvang alsmede het toezicht op
      de naleving daarvan. Bij algemene maatregel van bestuur kan worden bepaald welke kwaliteitsvoorschriften in ieder
      geval in de gemeentelijke verordening worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel7
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '7'
        hoofdstuk: III
  - number: '20.2'
    text: |-
      De in het eerste lid bedoelde verordening is van toepassing op zowel de gesubsidieerde kinderopvang als de niet-
      gesubsidieerde kinderopvang.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel20
  - number: '20.3'
    text: |-
      Uiterlijk acht weken voordat de voordracht voor een maatregel als bedoeld in het eerste lid wordt gedaan, laat Onze
      Minister het ontwerp daarvan plaatsen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel20
  - number: '22.1'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1994. Indien het *Staatsblad* waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 december 1993, treedt zij in werking met ingang van de dag na de datum van het *Staatsblad*
      waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel22
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid treedt [artikel 12][ref1] in werking op het tijdstip waarop de Tijdelijke wet
      stimulering sociale vernieuwing vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel12
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '12'
        hoofdstuk: VI
  - number: '22.3'
    text: |-
      [Artikel 20][ref1] treedt in afwijking van het eerste lid in werking op een bij koninklijk besluit te bepalen
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel20
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '20'
        hoofdstuk: VIII
  - number: '23'
    text: |-
      Deze wet kan worden aangehaald als: Welzijnswet met vermelding van het jaartal van het *Staatsblad* waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006705/2002-07-01#Artikel23
