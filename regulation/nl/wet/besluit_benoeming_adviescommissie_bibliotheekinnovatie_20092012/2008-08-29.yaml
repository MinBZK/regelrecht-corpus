regulatory_layer: WET
publication_date: '2021-02-10'
valid_from: '2008-08-29'
bwb_id: BWBR0024382
url: https://wetten.overheid.nl/BWBR0024382/2008-08-29
preamble:
  text: |-
    Overwegende dat een innovatieplan betreffende de bibliotheekvernieuwing voor een periode van 2009–2012 op een
    zorgvuldige wijze tot stand dient te komen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#ArtikelAanhef
articles:
  - number: '1'
    text: Er is een adviescommissie bibliotheekinnovatie 2009–2012, hierna te noemen de commissie.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel1
  - number: '2'
    text: |-
      De commissie bestaat uit de volgende leden: mevrouw. drs. J.S. Calff, voorzitter; de heer dr. J.A. Brandenbarg,
      lid; de heer drs. J.J.J. Kloprogge, lid; de heer A.W. Mulder, lid; de heer J.A. van Soelen, lid.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel2
  - number: '3'
    text: |-
      De commissie zal, volgens de in de bijlage beschreven taakomschrijving, door het opstellen van een innovatieplan
      de Minister van Onderwijs, Cultuur en Wetenschap adviseren over de bibliotheekvernieuwing 2009–2012. De Minister
      brengt het advies in bij het bestuurlijk overleg bibliotheekvernieuwing.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel3
  - number: '4.1'
    text: De commissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel4
  - number: '4.2'
    text: De Minister stelt een werkbudget beschikbaar aan de commissie voor eventuele inzet van ondersteuning door derden.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel4
  - number: '5'
    text: |-
      De leden en de voorzitter van de commissie ontvangen voor het bijwonen van vergaderingen en overige bijeenkomsten
      in het kader van hun werkzaamheden vacatiegelden overeenkomstig het [Vacatiegeldenbesluit 1988][ref1] en de
      [Regeling maximumbedragen vacatiegeld 2004][ref2]. Een voorzitter ontvangt € 260,– en een lid ontvangt € 200,– per
      vergadering. De commissie wordt, volgens het [Vacatiegeldenbesluit 1988][ref3], ingedeeld in de categorie zwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004317
      [ref2]: https://wetten.overheid.nl/BWBR0017556
      [ref3]: https://wetten.overheid.nl/BWBR0004317
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004317
      - id: ref2
        bwb_id: BWBR0017556
      - id: ref3
        bwb_id: BWBR0004317
  - number: '6.1'
    text: |-
      Voor de kosten van de werkzaamheden van de commissie wordt vooralsnog een werkbudget van maximaal € 100.000,–
      beschikbaar gesteld (vgl. [art. 4.2][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0024382#Artikel4
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024382
        artikel: '4'
  - number: '6.2'
    text: |-
      De kosten van de commissie komen, voor zover binnen het beschikbaar gestelde budget en voor zover goedgekeurd, voor
      rekening van de Minister. Onder kosten worden in ieder geval verstaan:
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel6
  - number: 6.2.a
    text: de kosten voor vergaderingen en voor secretariële ondersteuning;
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel6
  - number: 6.2.b
    text: de kosten voor het inschakelen van externe deskundigheid en het laten verrichten van onderzoek;
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel6
  - number: 6.2.c
    text: de kosten voor publicatie van rapportages.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel6
  - number: '6.3'
    text: |-
      De commissie declareert achteraf op basis van werkelijk gemaakte kosten. De laatste declaraties dienen binnen drie
      maanden na het verstrijken van de periode zoals genoemd in [artikel 8][ref1] te zijn ingediend. Declaraties die
      zijn ingediend na de gestelde termijn worden niet uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024382#Artikel8
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024382
        artikel: '8'
  - number: '7'
    text: |-
      De commissie draagt zo spoedig mogelijk na beëindiging van haar werkzaamheden de bescheiden betreffende die
      werkzaamheden over aan het archief van de directie Media, Letteren en Bibliotheken van het Ministerie van
      Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel7
  - number: '8'
    text: |-
      De commissie wordt ingesteld voor de tijdsduur van maximaal een half jaar, te rekenen vanaf bovengenoemde datum van
      de instellingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0024382/2008-08-29#Artikel9
