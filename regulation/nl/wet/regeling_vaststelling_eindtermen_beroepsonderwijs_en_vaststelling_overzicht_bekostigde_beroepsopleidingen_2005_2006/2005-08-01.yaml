articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a wet:

      de [Wet educatie en beroepsonderwijs][ref1];

      b studiebelastingsuren:

      de studiebelastingsuren zoals voor een beroepsopleiding opgenomen in het Centraal register beroepsopleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0017258/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '2'
    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden de eindtermen voor
      het studiejaar 2005-2006 vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij deze regeling.

      2 In [bijlage 1][ref3] wordt per beroepsopleiding vastgesteld:

      a de onderverdeling in deelkwalificaties;

      b de leerweg waarin de beroepsopleiding kan worden verzorgd;

      c de deelkwalificaties die aan examinering zijn onderworpen;

      d of de beroepsopleiding voor bekostiging in aanmerking komt, en

      e de prijsfactor, bedoeld in [artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017258
      [ref2]: https://wetten.overheid.nl/BWBR0017258
      [ref3]: https://wetten.overheid.nl/BWBR0017258
      [ref4]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.3
    url: https://wetten.overheid.nl/BWBR0017258/2005-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017258
      - id: ref2
        bwb_id: BWBR0017258
      - id: ref3
        bwb_id: BWBR0017258
      - id: ref4
        bwb_id: BWBR0010646
        artikel: 2.2.3
  - number: '3'
    text: |-
      1 De bekostiging aan de hand van de maatstaf, bedoeld in [artikel 2.2.2, tweede lid onder a, van de wet][ref1],
      van de beroepsopleidingen, bedoeld in het eerste lid, wordt, behoudens het derde lid, beëindigd met ingang van
      het studiejaar:

        - 2006 - 2007 indien het aantal studiebelastingsuren 1600 of minder bedraagt;
        - 2007 - 2008 indien het aantal studiebelastingsuren meer dan 1600 en minder dan 3201 bedraagt;
        - 2008 - 2009 indien het aantal studiebelastingsuren meer dan 3200 en minder dan 4801 bedraagt;
        - 2009 - 2010 indien het aantal studiebelastingsuren meer dan 4800 bedraagt.

      2 Voor deelnemers in de beroepsopleidende leerweg die niet voldoen aan de omschrijving van voltijdsdeelnemer,
      bedoeld in [artikel 2.1.2, onderdeel b, van het Uitvoeringsbesluit WEB][ref2], wordt de bekostiging beëindigd met
      ingang van het studiejaar, volgend op het studiejaar, vastgesteld volgens het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2.1.2
    url: https://wetten.overheid.nl/BWBR0017258/2005-08-01#Artikel3
