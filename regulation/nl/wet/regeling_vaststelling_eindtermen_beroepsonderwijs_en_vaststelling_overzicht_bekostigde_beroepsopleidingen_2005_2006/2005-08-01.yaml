  - number: '4'
    text: |-
      Deze regeling zal met de toelichting in het Gele Katern worden geplaatst. [Bijlage 1][ref1] zal separaat aan de
      instellingen worden gezonden [Bijlage 2][ref2] zal ter inzage worden gelegd in de bibliotheek van het Ministerie
      van Onderwijs, Cultuur en Wetenschappen.

      Van deze plaatsing en terinzagelegging zal mededeling worden gedaan in de Staatscourant. Daarnaast zijn de
      [bijlagen 2][ref3], [3][ref4] en [4][ref5] te downloaden van www.cfi.nl.


