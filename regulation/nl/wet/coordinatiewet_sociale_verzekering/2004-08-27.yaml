  - number: 12b
    text: >-
      1 De beschikking waarbij de boete wordt opgelegd, vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald.


      2 Indien een boete gelijktijdig wordt opgelegd met de vaststelling van de premie, wordt het bedrag van de boete
      afzonderlijk in de beschikking vermeld.


      3 Indien de werkgever de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de werkgever zorg voor dat de in de
      beschikking vermelde informatie wordt medegedeeld in een voor de werkgever begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel12b
  - number: 12c
    text: |-
      1 Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het Openbaar Ministerie.

      2 De oplegging van een boete blijft definitief achterwege indien terzake van de gedraging tegen de werkgever een
      strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot
      strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van strafrecht][ref1].

      3 Het Openbaar Ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 12d
    text: |-
      1 Een boete ingevolge [artikel 12, derde lid][ref1], wordt opgelegd binnen een jaar nadat het Landelijk
      instituut sociale verzekeringen de werkgever overeenkomstig [artikel 12a, vierde lid][ref2], in de gelegenheid
      heeft gesteld zijn zienswijze naar voren te brengen. Indien terzake aangifte is gedaan of proces-verbaal is
      opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag na die waarop het Openbaar Ministerie aan het
      Uitvoeringsinstituut werknemersverzekeringen heeft medegedeeld dat geen strafvervolging wordt ingesteld.

      2 Een boete wordt niet meer opgelegd, indien meer dan vijf jaren zijn verstreken sedert het einde van het
      kalenderjaar waarin de desbetreffende gedraging heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel12d
