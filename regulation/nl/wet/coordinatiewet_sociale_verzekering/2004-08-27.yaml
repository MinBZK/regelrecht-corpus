  - number: 16g
    text: |-
      1 Degene die ingevolge de [artikelen 16a][ref1], [16b][ref2], [16ba][ref3], [16bb][ref4] of
      [16c, eerste lid onder a][ref5], premie of voorschotpremie aan de Uitvoeringsinstituut werknemersverzekeringen
      heeft betaald, heeft hiervoor verhaal op ieder van degenen die ingevolge [artikel 16d][ref6] aansprakelijk is.

      2 Ten aanzien van degene die een ingevolge [artikel 16f][ref7] verschuldigd bedrag heeft voldaan, is het eerste lid
      van overeenkomstige toepassing.

      3 Degene die het ingevolge het eerste lid verschuldigde bedrag heeft voldaan wordt geacht tot dit bedrag de premie
      of de voorschotpremie van het lichaam ingevolge [artikel 16d][ref8] te hebben voldaan.

      4 Van de voorgaande leden kan bij overeenkomst worden afgeweken.


