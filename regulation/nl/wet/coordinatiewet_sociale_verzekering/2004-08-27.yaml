  - number: 16a
    text: |-
      1 Ingeval een werknemer met instandhouding van de dienstbetrekking tot zijn werkgever, de uitlener, door deze
      ter beschikking is gesteld aan een derde, de inlener, om onder diens toezicht of leiding werkzaam te zijn, is de
      inlener hoofdelijk aansprakelijk voor de premie en de voorschotpremie, welke de uitlener is verschuldigd in verband
      met het verrichten van die werkzaamheden door die werknemer.

      2 Onder inlener wordt mede verstaan:

      a. de doorlener, zijnde degene aan wie een werknemer ter beschikking is gesteld en die deze werknemer vervolgens
      ter beschikking stelt aan een derde om onder diens toezicht of leiding werkzaam te zijn;

      b. de in onderdeel a bedoelde derde, aan wie door een doorlener een werknemer ter beschikking is gesteld om onder
      toezicht of leiding van die derde werkzaam te zijn.

      3 Voor de toepassing van dit artikel wordt de boete, bedoeld in [artikel 12, tweede of derde lid][ref1], niet als
      premie beschouwd.

      4 Indien een inlener ingevolge een overeenkomst met de uitlener ten behoeve van de voldoening van sociale
      verzekeringspremies, loonbelasting en omzetbelasting in verband met het verrichten van werkzaamheden door
      een ter beschikking gestelde werknemer, alsmede dat ter beschikking stellen, een bedrag heeft overgemaakt
      op een rekening die door die uitlener ten behoeve van de betaling van sociale verzekeringspremies,
      loonbelasting en omzetbelasting wordt gehouden bij een kredietinstelling die is geregistreerd ingevolge
      [artikel 52, tweede lid, onder a, b, of c, van de Wet toezicht kredietwezen 1992][ref2] en die een
      kredietinstelling is als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°, van die wet,][ref3]
      wordt het bedrag waarvoor de aansprakelijkheid van de inlener uit hoofde van het eerste en tweede lid en van
      [artikel 34, eerste en tweede lid, van de Invorderingswet 1990][ref4] met betrekking tot die werkzaamheden en dat
      ter beschikking stellen in eerste aanleg bestaat, verminderd met dat overgemaakte bedrag.

      5 Het vierde lid is niet van toepassing voor zover de inlener wist of redelijkerwijs moest vermoeden dat de
      uitlener in gebreke zou blijven het op de in dat lid bedoelde rekening gestorte bedrag aan te wenden voor de
      betaling van sociale verzekeringspremies, loonbelasting of omzetbelasting.

      6 De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de premie of voorschotpremie
      verschuldigd door de uitlener, indien aannemelijk is dat de niet-betaling door de uitlener noch aan hem noch aan
      een inlener is te wijten.

      7 De inlener die hoofdelijk aansprakelijk is, kan slechts worden aangesproken, wanneer de uitlener met de betaling
      van de premie of de voorschotpremie in gebreke is.

      8 De [artikelen 10 tot en met 16][ref5] zijn ten aanzien van de inlener van overeenkomstige toepassing, met dien
      verstande, dat in [artikel 10, onder a][ref6], in plaats van «een loonadministratie te voeren» wordt gelezen:
      «een administratie te voeren, aan de hand waarvan het door de werknemer genoten loon kan worden vastgesteld». Bij
      ministeriële regeling kunnen voor dit artikellid nadere regels worden gesteld.

      9 De inlener wordt ter zake van de toepassing van de [artikelen 10 tot en met 16][ref7], alsmede ter zake van het
      instellen van bezwaar en beroep tegen een beslissing betreffende verschuldigde premie mede als werkgever in de zin
      van deze wet beschouwd.

      10 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de toepassing van het vierde lid.

      11 Dit artikel is niet van toepassing indien de werkzaamheden die door de ter beschikking gestelde werknemer zijn
      verricht, ondergeschikt zijn aan een tussen de uitlener en de inlener, dan wel tussen de doorlener en de inlener,
      gesloten overeenkomst van koop en verkoop van een bestaande zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
