      Met betrekking tot bestaande aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon
      zijn de in [artikel 6, eerste lid, onderdeel ][ref1], gestelde voorwaarden niet van toepassing. Onder bestaande
      aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon worden verstaan de op 31 december
      1994 bestaande aanspraken welke naar of krachtens de tekst van [artikel 6][ref2] zoals dat toen luidde, zijn aan te
      merken als aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


