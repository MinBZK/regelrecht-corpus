  - number: 3a
    text: |-
      1 Deze wet verstaat onder dienstbetrekking de dienstbetrekking en de arbeidsverhouding die
      als zodanig wordt beschouwd ingevolge het bepaalde bij of krachtens de [Ziektewet][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Werkloosheidswet][ref3] en die als zodanig geldt ingevolge
      de [Ziekenfondswet][ref4].

      2 De werknemer die een uitkering ontvangt op grond van de verplichte verzekering krachtens de [Ziektewet][ref5],
      de verplichte verzekering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref6] of de verplichte
      verzekering dan wel [hoofdstuk IV van de Werkloosheidswet][ref7], al dan niet vermeerderd met een toeslag op
      grond van de [Toeslagenwet][ref8], wordt tijdens de duur van die uitkering geacht in dienstbetrekking te staan
      tot het Uitvoeringsinstituut werknemersverzekeringen. De werknemer die geen ziekengeld ontvangt op grond van
      [artikel 29, eerste lid, van de Ziektewet][ref9] maar wel toeslag op grond van de [Toeslagenwet][ref10], wordt voor
      de toepassing van de eerste zin geacht een uitkering te ontvangen op grond van de verplichte verzekering krachtens
      de [Ziektewet][ref11].

      3 De werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van de Wet arbeid en zorg][ref12], aan wie
      uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van die wet][ref13], wordt tijdens de
      duur van die uitkering geacht in dienstbetrekking te staan tot het Uitvoeringsinstituut werknemersverzekeringen.


