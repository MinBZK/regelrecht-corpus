  - number: 16b
    text: |-
      1 De aannemer is hoofdelijk aansprakelijk voor de premie en de voorschotpremie:

      a. die de onderaannemer en, indien een werk geheel of gedeeltelijk door één of meer volgende onderaannemers wordt
      uitgevoerd, iedere volgende onderaannemer verschuldigd is in verband met het verrichten van werkzaamheden door zijn
      werknemers ter zake van dat werk;

      b. voor de betaling waarvan de onderaannemer en, indien een werk geheel of gedeeltelijk door één of meer
      volgende onderaannemers wordt uitgevoerd, iedere volgende onderaannemer ingevolge [artikel 16][ref1] hoofdelijk
      aansprakelijk is ter zake van dat werk.

      2 In dit artikel wordt verstaan onder:

      a. aannemer: degene die zich jegens een ander, de opdrachtgever, verbindt om buiten dienstbetrekking een werk van
      stoffelijke aard uit te voeren tegen een te betalen prijs;

      b. onderaannemer: degene die zich jegens een aannemer verbindt om buiten dienstbetrekking het onder *a* bedoelde
      werk geheel of gedeeltelijk uit te voeren tegen een te betalen prijs.

      3 Voor de toepassing van dit artikel wordt:

      a. de onderaannemer ten opzichte van zijn onderaannemer als aannemer beschouwd;

      b. met een aannemer gelijkgesteld degene die zonder daartoe van een opdrachtgever opdracht te hebben gekregen
      buiten dienstbetrekking in de normale uitoefening van zijn bedrijf een werk van stoffelijke aard uitvoert;

      c. ten opzichte van de aannemer als onderaannemer beschouwd de verkoper van een toekomstige zaak, voor zover de
      koop en verkoop voortvloeit uit of verband houdt met het in het tweede lid, onder *a*, bedoelde werk;

      d. een boete, opgelegd krachtens [artikel 12, tweede of derde lid][ref2], niet als premie beschouwd.

      4 De voorgaande leden zijn niet van toepassing:

      a. indien een werk tot de uitvoering waarvan een onderaannemer zich jegens een aannemer heeft verbonden, geheel of
      grotendeels wordt verricht op de plaats, waar de onderneming van de onderaannemer is gevestigd met uitzondering van
      de vervaardiging en elke daarop gerichte handeling van kleding, andere dan schoeisel, of

      b. indien de uitvoering van een werk waartoe een onderaannemer zich jegens een aannemer heeft verbonden,
      ondergeschikt is aan een tussen hen gesloten overeenkomst van koop en verkoop van een bestaande zaak.

      5 Indien een aannemer ingevolge een overeenkomst met een onderaannemer, ten behoeve van de voldoening van
      sociale verzekeringspremies en loonbelasting met betrekking tot het door die onderaannemer aangenomen werk,
      een bedrag heeft overgemaakt op een rekening die door die onderaannemer ten behoeve van de betaling van
      sociale verzekeringspremies en loonbelasting wordt gehouden bij een kredietinstelling die is geregistreerd
      ingevolge [artikel 52, tweede lid, onder a, b of c, van de Wet toezicht kredietwezen 1992][ref3]
      wordt het bedrag waarvoor de aansprakelijkheid van de aannemer uit hoofde van het eerste lid en
      [artikel 35, eerste lid, van de Invorderingswet 1990][ref4] met betrekking tot dat werk in eerste aanleg bestaat,
      verminderd met dat overgemaakte bedrag. De vorige volzin is niet van toepassing voor zover de aannemer wist of
      redelijkerwijs moest vermoeden, dat een onderaannemer in gebreke zou blijven het op de in de eerste volzin bedoelde
      rekening gestorte bedrag aan te wenden voor de betaling van sociale verzekeringspremies of loonbelasting. Bij
      ministeriële regeling worden nadere regels gesteld met betrekking tot de toepassing van dit lid.

      6 De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de premie of de voorschotpremie
      verschuldigd door een onderaannemer, indien aannemelijk is dat de niet-betaling door de onderaannemer noch aan hem
      noch aan een aannemer is te wijten.

      7 Degene die op grond van het eerste lid hoofdelijk aansprakelijk is, kan slechts worden aangesproken, wanneer de
      werkgever met de betaling van de premie of de voorschotpremie in gebreke is.

      8 De [artikelen 10 tot en met 16][ref5] zijn ten aanzien van de aannemer van overeenkomstige toepassing, met
      dien verstande, dat in [artikel 10, eerste lid][ref6], in plaats van "voert een administratie" wordt gelezen:
      voert een administratie, aan de hand waarvan het bedrag aan loon kan worden vastgesteld, dat in de door de
      aannemer te betalen prijs voor de uitvoering van een werk door een onderaannemer is begrepen. Onze Minister
      kan bij ministeriële regeling nadere regelen stellen. De aannemer wordt ter zake van de toepassing van de
      [artikelen 10 tot en met 16][ref7], alsmede ter zake van het instellen van beroep tegen een beslissing betreffende
      verschuldigde premie, mede als werkgever in de zin van deze wet beschouwd.


