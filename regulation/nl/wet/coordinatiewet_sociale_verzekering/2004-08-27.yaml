      1 De werkgever voert een administratie met inachtneming van door Onze Minister daaromtrent te stellen regels.

      2 De werkgever doet, met inachtneming van door Onze Minister daaromtrent te stellen regels, opgave van het door de
      werknemer genoten loon aan het Uitvoeringsinstituut werknemersverzekeringen

      3 Het doen van een opgave als bedoeld in het tweede lid is geen aanvraag in de zin van
      [artikel 1:3, derde lid van de Algemene wet bestuursrecht][ref1].


