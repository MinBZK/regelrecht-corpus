  - number: '4'
    text: >-
      1 Loon is al hetgeen uit een dienstbetrekking wordt genoten.


      2 Tot het loon behoren aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.


      3 Onder aanspraken worden mede verstaan rechten op geheel of gedeeltelijk betaald verlof.
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel4
  - number: '5'
    text: >-
      Loon wordt beschouwd te zijn genoten op het tijdstip waarop het:


      a. betaald of verrekend is, ter beschikking van de werknemer is gesteld of rentedragend is geworden, dan wel


      b. vorderbaar en tevens inbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel5
  - number: '6'
    text: |-
      1 Tot het loon behoren niet:

      a. aanspraken ingevolge een pensioenregeling;

      b. aanspraken ingevolge een regeling voor vervroegde uittreding;

      c. aanspraken ingevolge sociale verzekeringswetten, waaronder mede worden begrepen aanspraken op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1][ref1], of [hoofdstuk 7 van de Wet arbeid en zorg][ref2];

      d. aanspraken, die naar aard en strekking overeenkomen met aanspraken, als bedoeld in onderdeel c, tenzij het
      betreft een aanspraak op kinderbijslag anders dan ingevolge de [Algemene Kinderbijslagwet][ref3];

      e. aanspraken op periodieke uitkeringen ter vervanging van gederfd of te derven loon, mits:

      1°. deze aanspraken voorzien in aan de werknemer of gewezen werknemer toekomende periodieke uitkeringen die niet
      later ingaan dan in het jaar waarin hij de leeftijd van 65 jaar bereikt of in periodieke uitkeringen die bij zijn
      overlijden ingaan en toekomen aan zijn echtgenoot of gewezen echtgenoot of aan zijn eigen kinderen, stiefkinderen
      of pleegkinderen die de leeftijd van 30 jaar nog niet hebben bereikt;

      2°. voor deze aanspraken als verzekeraar optreedt een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel a, b of d, van de Wet op de loonbelasting 1964][ref4] of de natuurlijke
      persoon, bedoeld in [artikel 19a, eerste lid, onderdeel e, van de Wet op de loonbelasting 1964;][ref5]

      f. aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;

      g. aanspraken op de in de onderdelen m en p bedoelde uitkeringen en verstrekkingen;

      h. uitkeringen en verstrekkingen ingevolge een aanspraak die tot het loon behoort;

      i.

      j. bedragen die worden ingehouden:

      1°. als bijdrage ingevolge een pensioenregeling of een regeling voor vervroegde uittreding;

      2°. als bijdrage voor aanspraken die ingevolge de onderdelen d en f niet tot het loon behoren;

      k. vergoedingen en verstrekkingen voorzover die geacht kunnen worden te strekken tot bestrijding van kosten,
      lasten en afschrijvingen ter behoorlijke vervulling van de dienstbetrekking, alsmede andere vergoedingen en andere
      verstrekkingen voorzover die naar algemene maatschappelijke opvattingen niet als beloningsvoordeel worden ervaren;

      l. uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke zaken;

      m. uitkeringen tot dekking van op de werknemer drukkende kosten van zijn opleiding of studie voor een beroep,
      alsmede verstrekkingen met betrekking tot zodanige opleiding of studie;

      n. uitkeringen en verstrekkingen tot dekking van op de werknemer drukkende kosten ter zake van ziekte, invaliditeit
      en bevalling;

      o. vergoedingen tot dekking van op de werknemer drukkende kosten van kinderopvang waarvoor krachtens
      [artikel 20, eerste lid, van de Welzijnswet 1994][ref6] bij gemeentelijke verordening regels zijn gesteld met
      betrekking tot de kwaliteit, voor eigen kinderen, stiefkinderen en pleegkinderen die jonger dan 13 jaar zijn, voor
      zover de vergoedingen gezamenlijk meer belopen dan een bij ministeriële regeling vast te stellen bedrag en mits
      wordt voldaan aan bij ministeriële regeling te stellen administratieve voorwaarden, met dien verstande dat ingeval
      de kinderopvang bij de werknemer thuis plaatsvindt de op de werknemer drukkende kosten daarvan tot ten hoogste
      € 9626 per kind per kalenderjaar in aanmerking worden genomen;

      p. eenmalige uitkeringen en verstrekkingen ter zake van overlijden van de werknemer, zijn echtgenoot of degene die
      op grond van [artikel 1 van de Ziektewet][ref7] hieraan is gelijkgesteld, of zijn eigen kinderen, stiefkinderen
      en pleegkinderen, voor zover deze uitkeringen en verstrekkingen niet driemaal het loon over een maand overtreffen,
      bepaald met inachtneming van door het Uitvoeringsinstituut werknemersverzekeringen te stellen regels;

      q. uitkeringen en verstrekkingen andere dan die ter zake van adoptie en overlijden, die de werknemer ontvangt
      uit een fonds tot welks middelen de werkgever gedurende de laatstverlopen vijf kalenderjaren evenveel of minder
      heeft bijgedragen dan de bij het fonds betrokken werknemers, tenzij die uitkeringen en verstrekkingen geschieden
      ingevolge een aanspraak die niet tot het loon behoort;

      r. bijdragen in de op de werknemer drukkende kosten ter zake van een particuliere ziektekostenverzekering,
      danwel terzake van een van de volgende publiekrechtelijke ziektekosten verzekeringen: het Instituut
      Zorgverzekering Ambtenaren Nederland, de Interprovinciale ziektekostenregeling 1988 of het
      [Besluit geneeskundige verzorging politie 1994][ref8];

      s. loon dat in geblokkeerde vorm wordt gespaard volgens een spaarloonregeling tot ten hoogste € 613 per
      kalenderjaar;

      t. uitkeringen ingevolge een pensioenregeling of een regeling voor vervroegde uittreding;

      u. een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste 25
      jaar en een uitkering of verstrekking die eenmaal wordt toegekend na het bereiken van een diensttijd van ten minste
      40 jaar, voor zover de waarde daarvan het loon over een maand niet overtreft, mits is voldaan aan bij ministeriële
      regeling te stellen voorwaarden;

      v.

      w. verstrekkingen met een in hoofdzaak ideële waarde ter gelegenheid van een dienstjubileum van de werknemer,
      bij het beëindigen van zijn dienstbetrekking of ter gelegenheid van algemeen erkende feestdagen en het Sint-
      Nicolaasfeest, een jubileum van de werkgever, dan wel de verjaardag en andere persoonlijke feestdagen van de
      werknemer;

      x. verstrekkingen van consumpties tijdens de werktijd, niet zijnde maaltijden;

      y. verstrekking en terbeschikkingstelling van computers en bijbehorende apparatuur, alsmede vergoedingen van de
      kosten daarvan, voor zover de waarde in het economische verkeer van de computers en de apparatuur tezamen in het
      kalenderjaar en de twee voorafgaande kalenderjaren niet meer bedraagt dan € 2269 en niet aannemelijk is dat zij
      niet mede dienen ter vervulling van de dienstbetrekking;

      z. verstrekking en terbeschikkingstelling van inrichting van de werkruimte in de woning, de aanhorigheden daaronder
      begrepen, van de werknemer, alsmede vergoedingen van de kosten daarvan, voorzover de waarde in het economische
      verkeer van die inrichting in het kalenderjaar en de vier voorafgaande kalenderjaren niet meer bedraagt dan € 1815
      en niet aannemelijk is dat zij niet mede dient ter vervulling van de dienstbetrekking, mits:

      1°. de werknemer krachtens een schriftelijk vastgelegde regeling van de werkgever dan wel van de werkgever en
      een of meer andere werkgevers ten minste eenmaal per week, gedurende de gebruikelijke werktijd en zonder dat
      tevens wordt gereisd naar een buiten de woning gelegen arbeidsplaats, in die werkruimte ter vervulling van zijn
      dienstbetrekking pleegt te werken met behulp van telematica; en

      2°. de inrichting voldoet aan bij ministeriële regeling te stellen voorwaarden, een en ander met inachtneming van
      bij ministeriële regeling te stellen nadere regels;

      aa. de financiële tegemoetkoming op grond van[ hoofdstuk 7 van de Wet arbeid en zorg][ref9];

      bb. aanspraken:

      1°. op vakantieverlof en compensatieverlof, voorzover deze aanspraken aan het einde van het kalenderjaar in totaal
      niet meer bedragen dan de arbeidsduur per week gerekend over een periode van vijftig weken;

      2°. op bij ministeriële regeling aan te wijzen geclausuleerd verlof;

      3°. op verlof tijdens rust- en feestdagen.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan, onder goedkeuring van Onze Minister, bepalen, dat eveneens
      niet tot het loon behoren andere aanspraken dan bedoeld in het eerste lid, indien zulks tot vergemakkelijking van
      de heffing van de premie kan leiden.

      3 Voor de toepassing van deze wet wordt onder pensioenregeling onderscheidenlijk regeling
      voor vervroegde uittreding verstaan hetgeen daaronder wordt verstaan voor de toepassing van de
      [Wet op de loonbelasting 1964][ref10].

      4 Onze Minister kan, in overeenstemming met Onze Minister van Financiën, zo nodig onder voorwaarden, afwijkingen
      toestaan van het derde lid door bepaalde regelingen of groepen van regelingen aan te wijzen als pensioenregeling of
      regeling voor vervroegde uittreding.

      5 Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan wordt bepaald welke vergoedingen
      en verstrekkingen en in hoeverre deze vergoedingen en verstrekkingen zijn aan te merken als vergoedingen en
      verstrekkingen als bedoeld in het eerste lid, onderdeel k.

      6 In afwijking van het eerste lid, aanhef en onderdeel m, behoren tot het loon: uitkeringen tot dekking van op de
      werknemer drukkende kosten

      a. die verband houden met een studeerruimte, de inrichting daaronder begrepen;

      b. van binnenlandse reizen ter zake van opleiding of studie voor zover de uitkering meer bedraagt dan een bij
      ministeriële regeling vast te stellen bedrag per kilometer.

      7 Het in het eerste lid, onderdeel o, vermelde bedrag wordt bij het begin van het kalenderjaar van rechtswege
      vervangen door het bedrag dat krachtens [artikel 10.1 van de Wet inkomstenbelasting 2001][ref11] wordt vastgesteld
      ter vervanging van het in [artikel 3.143, eerste lid, van die wet][ref12] vermelde bedrag.

      8 Voorzover de aanspraken op vakantieverlof en compensatieverlof aan het einde van het kalenderjaar in totaal
      de in het eerste lid, onderdeel bb, onder 1°, opgenomen begrenzing overschrijden, wordt het meerdere geacht te
      zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.

      9 Onder spaarloonregeling wordt verstaan een schriftelijke regeling – niet zijnde een
      pensioenregeling – die voorziet in sparen van loon (spaarloon) dat gedurende ten minste vier
      jaar niet ter beschikking van de werknemer komt, tenzij het spaarloon wordt opgenomen ter
      zake van de verwerving van zijn eigen woning als hoofdverblijf, de aankoop van effecten, de
      voldoening van premies voor lijfrenten als bedoeld in de [artikelen 3124, onderdeel b][ref13], en
      [3125, eerste lid, onderdelen a, c en d, van de Wet inkomstenbelasting 2001][ref14], de voldoening van premies
      volgens bij ministeriële regeling aan te wijzen overeenkomsten van levensverzekering waarbij een kapitaalsuitkering
      is verzekerd, de door de werknemer vrijwillig betaalde premies ingevolge een pensioenregeling, de start van een
      voor eigen rekening gedreven onderneming, de opname van verlof, de financiering van scholingsuitgaven als bedoeld
      in [artikel 6.27 van de Wet inkomstenbelasting 2001][ref15], of bij beëindiging van zijn dienstbetrekking. Ingeval
      het spaarloon door de werknemer is opgenomen bij beëindiging van zijn dienstbetrekking, wordt voor elke maand
      gedurende welke het spaarloon voortijdig is opgenomen premie geheven van de werknemer ter zake van een evenredig
      deel van het spaarloon. Bij ministeriële regeling kunnen nadere regels worden gesteld.


