  - number: 15a
    text: >-
      1 De werkgever kan tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de rechtbank van het
      arrondissement waarbinnen hij woont of is gevestigd. Indien de werkgever buiten Nederland woont of is gevestigd dan
      wel in Nederland geen vaste woonplaats of plaats van vestiging heeft, kan hij in verzet komen bij de rechtbank van
      het arrondissement waarbinnen het kantoor is gevestigd van het Uitvoeringsinstituut werknemersverzekeringen.


      2 Het verzet vangt aan met dagvaarding door de werkgever als eiser aan de met de tenuitvoerlegging belaste
      ontvanger als gedaagde. De ontvanger stelt zo spoedig mogelijk het Uitvoeringsinstituut werknemersverzekeringen in
      kennis van het verzet. Het verzet schorst de tenuitvoerlegging van het dwangbevel voor zover deze door het verzet
      wordt bestreden.


      3 Het verzet kan niet zijn gegrond op de stelling dat de premienota, de aanmaning, het op de voet van artikel 13,
      derde lid, van de Invorderingswet 1990 betekende dwangbevel of de voor beroep vatbare beslissing niet is ontvangen.
      Bovendien kan het verzet niet zijn gegrond op de stelling dat de premienota ten onrechte of tot een te hoog bedrag
      is vastgesteld, dat de voor beroep vatbare beslissing niet wettig is, dat de aannemer niet aansprakelijk is of dat
      de bestuurder zich van zijn aansprakelijkheid kan bevrijden.
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel15a
  - number: '16'
    text: |-
      De vordering van het Uitvoeringsinstituut werknemersverzekeringen wegens premie, waaronder begrepen worden
      de kosten van de in [het eerste lid van artikel 15][ref1] bedoelde aanmaning en de in [artikel 14][ref2]
      bedoelde interest, is bevoorrecht op alle goederen van de werkgever en gaat boven alle andere
      voorrechten met uitzondering van die van de [artikelen 287][ref3] en [288 onder ][ref4], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref5], voor zover de daar bedoelde kosten zijn gemaakt na de
      vaststelling van de voorschotpremie of de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel14
