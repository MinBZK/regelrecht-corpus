    text: >-
      1 Artikel 6, eerste lid, onderdelen g en i, zoals deze bepalingen luidden op 31 december 2002, blijven tot en
      met het kalenderjaar 2007 van toepassing op aanspraken op spaarpremies en op na 31 december 2002 toegekende
      spaarpremies of voorlopig bijgeschreven spaarpremies ter zake van voor 1 januari 2003 ingehouden besparingen op de
      voet van een premiespaarregeling als bedoeld in [artikel 31a van de Wet op de loonbelasting 1964](onbekend), zoals
      dat artikel luidde op 31 december 2002.


      2 [Artikel 13 van de Uitvoeringsregeling werknemersspaarregelingen en winstdelingsregelingen](onbekend), zoals
      dat artikel luidde op 31 december 2002, is in het kalenderjaar 2003 nog van toepassing op toegekende of voorlopig
      bijgeschreven spaarpremies ter zake van in het kalenderjaar 2002 ingehouden besparingen op de voet van een
      premiespaarregeling als bedoeld in artikel 6, vijfde, zesde en zevende lid, zoals die leden luidden op 31 december
      2002.


      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het tweede lid.
