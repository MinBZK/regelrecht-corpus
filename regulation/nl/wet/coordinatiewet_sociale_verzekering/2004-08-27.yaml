  - number: 12e
    text: Voor zover een boete nog niet is geïnd, vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel12e
  - number: '13'
    text: >-
      1 Premie wordt niet meer vastgesteld, indien meer dan vijf jaren sedert het einde van het kalenderjaar, waarin de
      premie verschuldigd is geworden, zijn verstreken.


      2 Premie, welke niet is ingevorderd binnen tien jaren na de vaststelling, wordt niet meer ingevorderd.


      3 De rechtsvordering tot terugbetaling van onverschuldigd betaalde premie verjaart door verloop van vijf jaren
      sedert het einde van het kalenderjaar, waarin de premie is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel13
  - number: '14'
    text: |-
      Indien een werkgever een voorschotpremie of een vastgestelde premie niet of niet geheel binnen de daarvoor
      gestelde termijn betaalt, is het Uitvoeringsinstituut werknemersverzekeringen, onverlet zijn bevoegdheid, bedoeld
      in [het eerste lid van artikel 15][ref1], bevoegd over het niet tijdig betaalde bedrag van de werkgever interest
      te vorderen over de termijn, gelegen tussen het tijdstip, waarop de premie is betaald en het tijdstip, waarop de
      premie had moeten worden betaald. De interest wordt berekend tegen het percentage van de wettelijke rente.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel15
    url: https://wetten.overheid.nl/BWBR0002126/2004-08-27#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '15'
        paragraaf: '4'
  - number: '15'
    text: |-
      1 Indien een werkgever een voorschotpremie of een vastgestelde premie niet of niet geheel binnen de daarvoor
      gestelde termijn betaalt, maant het Uitvoeringsinstituut werknemersverzekeringen hem schriftelijk aan om alsnog
      te betalen.

      2 Indien de werkgever na de aanmaning in gebreke blijft, kan de invordering van de premie, de aanmaningskosten en
      de in [artikel 14][ref1] bedoelde interest geschieden bij een door het Uitvoeringsinstituut werknemersverzekeringen
      uit te vaardigen dwangbevel.

      3 Verschillende vorderingen tegen dezelfde werkgever kunnen in hetzelfde dwangbevel worden opgenomen.

      4 De betekening en de tenuitvoerlegging van een dwangbevel geschieden door de zorg van de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref2], en door de belastingdeurwaarder,
      bedoeld in [artikel 2, eerste lid, onderdeel j, van die wet][ref3] met toepassing van de [artikelen 13][ref4] en
      [14 van die wet][ref5].

      5 Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref6], alsmede verrekenen op grond van artikel 24 van die wet.

      6 De ontvanger kan zolang hij met de zorg voor de invordering is belast onder door hem in overleg met het
      Uitvoeringsinstituut werknemersverzekeringen te stellen voorwaarden aan de werkgever uitstel van betaling verlenen.
      Gedurende het uitstel wordt de dwanginvordering geschorst. Het uitstel kan tussentijds schriftelijk worden
      beëindigd.

      7 Na de betekening van het dwangbevel dient te worden betaald aan de ontvanger, bedoeld in het vierde lid, die is
      vermeld op het dwangbevel.

      8 De kosten van aanmaning en van verdere vervolging worden berekend op de voet van de
      [Kostenwet invordering rijksbelastingen][ref7] (*Stb.* 1969, 83). Het recht van invordering bij dwangbevel strekt
      zich uit tot deze kosten.

      9 De toerekening van de betalingen geschiedt achtereenvolgens aan:

      a. de kosten van vervolging;

      b. de kosten van de in het eerste lid bedoelde aanmaning;

      c. de interest, bedoeld in [artikel 14][ref8];

      d. de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
