  - number: '9'
    text: |-
      1 Bij de berekening van het loon, waarnaar de premies ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] en de [Werkloosheidswet][ref2] worden geheven, blijft het loon,
      dat bij dezelfde werkgever meer heeft bedragen dan het bedrag, dat wordt verkregen door vermenigvuldiging van een
      bedrag van f 263,50 met het aantal dagen van het premiebetalingstijdvak, waarover de werknemer loon heeft genoten,
      voor dat meerdere buiten aanmerking. Voorts komt - voor zover nodig in afwijking van het bepaalde dienaangaande
      in de [Ziektewet][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] en de [Werkloosheidswet][ref5]
        - bij de berekening van het dagloon, dat aan de in de vorengenoemde wetten geregelde uitkeringen is of wordt ten
      grondslag gelegd, het dagloon, hetwelk meer bedraagt dan het in de vorige volzin bedoelde maximum dagloon, voor dat
      meerdere niet in aanmerking.

      2 Het bepaalde in de eerste volzin van het vorige lid vindt overeenkomstige toepassing met betrekking tot
      de berekening van het loon, waarnaar de premies ingevolge de [Ziekenfondswet][ref6] worden geheven, met dien
      verstande dat in plaats van het bedrag, genoemd in het vorige lid, een bedrag van € 108,-  in aanmerking wordt
      genomen. Indien het in [artikel 3, eerste lid, onder ][ref7] genoemde bedrag, zoals dit is herzien ingevolge
      [artikel 3][ref8], wijziging ondergaat, wordt het in de eerste zin genoemde bedrag door de Minister van
      Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze Minister, met ingang van dezelfde datum herzien.

      3 Bij de berekening van het loon, waarnaar de premie op grond van de [Werkloosheidswet][ref9] wordt geheven,
      blijft, wat het deel van de premie dat ten gunste komt van het wachtgeldfonds dat het Uitvoeringsinstituut
      werknemersverzekeringen voor de betrokken sector afzonderlijk administreert betreft, het bij dezelfde werkgever
      genoten loon buiten aanmerking tot een bedrag, dat wordt verkregen door vermenigvuldiging van een door Onze
      Minister vastgesteld bedrag, met het aantal dagen van het premiebetalingstijdvak waarover de werknemer het loon
      heeft genoten.

      4 Bij de berekening van het loon, waarnaar de premie op grond van de [Werkloosheidswet][ref10] wordt geheven,
      blijft, wat het door de werkgever en door de werknemer verschuldigde gedeelte van het deel van de premie dat ten
      gunste komt van het Algemeen Werkloosheidsfonds betreft, het bij dezelfde werkgever genoten loon buiten aanmerking
      tot een bedrag, dat wordt verkregen door vermenigvuldiging van een door Onze Minister vastgesteld bedrag met het
      aantal dagen van het premiebetalingstijdvak waarover de werknemer het loon heeft genoten. Het bedrag, genoemd in de
      eerste zin kan voor de werkgever en voor de werknemer verschillend worden vastgesteld.

      5 Indien de werknemer uitsluitend als gevolg van ploegendienst op minder dan vijf dagen per week arbeid verrichtte,
      wordt hij geacht over het tijdvak, waarin hij in ploegendienst werkzaam was, over vijf dagen per week loon te
      hebben genoten.

      6 Voor de toepassing van het bepaalde in de vorige leden wordt:

      a. arbeid, in een aaneengesloten nachtdienst op twee dagen verricht, gerekend als arbeid op één dag;

      b. het aantal dagen, waarover de werknemer gemiddeld per werkweek loon heeft genoten, geacht niet meer dan 5 te
      bedragen.

      7 Indien voor een werknemer die gelijktijdig tot meer dan één werkgever in dienstbetrekking staat door zijn
      gezamenlijke werkgevers premie is betaald over een hoger loonbedrag dan het bedrag, bedoeld in het eerste
      onderscheidenlijk tweede lid, wordt, op aanvraag van werkgever dan wel werknemer, de premievaststelling herzien.
      Bij die herziening wordt het voor de premieberekening in aanmerking komende loon vastgesteld naar evenredigheid
      van het ten laste van die werkgevers genoten loon, en blijft, bij de berekening van het loon waarnaar de premie
      op grond van de [Werkloosheidswet][ref11] wordt vastgesteld, het voor premieberekening in aanmerking komende loon
      buiten aanmerking tot een evenredig deel van het bedrag, bedoeld in het vierde lid. Het te veel betaalde wordt aan
      de werkgevers terugbetaald.

      8 Onze Minister kan nadere regels stellen voor de vaststelling van het voor premieberekening in aanmerking
      komende loon bij samenloop van loon dat gelijktijdig wordt genoten uit een dienstbetrekking als bedoeld in
      [artikel 3][ref12], en uit één of meer dienstbetrekkingen als bedoeld in [artikel 3][ref13], dan wel uitsluitend
      uit meer dan één dienstbetrekking als bedoeld in [artikel 3][ref14]. In de te stellen regels wordt uitgegaan van
      een totaal loonbedrag, dat niet hoger is dan het bedrag bedoeld in het eerste lid, onderscheidenlijk het tweede
      lid, en waarbij niet meer dan een keer rekening wordt gehouden met dat bedrag.

      9 Onze Minister kan regelen stellen, volgens welke ten aanzien van bepaalde groepen van werknemers verschuldigde
      premies worden geheven naar de grondslag van het bedrag, waarnaar de uitkering ingevolge een daarbij aan te wijzen
      wet wordt vastgesteld.

      10 Onze Minister kan nadere regelen stellen ter uitvoering van het bepaalde in de vorige leden. Onze Minister kan
      tevens nadere regelen stellen, welke afwijken van het bepaalde in de vorige leden.


