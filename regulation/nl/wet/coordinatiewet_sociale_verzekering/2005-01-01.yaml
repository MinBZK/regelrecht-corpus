  - number: 16d
    text: |-
      1 Hoofdelijk aansprakelijk is voor de premie en de voorschotpremie verschuldigd door een rechtspersoonlijkheid
      bezittend lichaam dat volledig rechtsbevoegd is, voor zover het aan de heffing van de vennootschapsbelasting is
      onderworpen: ieder van de bestuurders overeenkomstig het bepaalde in de volgende leden.

      2 Het lichaam als bedoeld in het eerste lid is verplicht om onverwijld nadat gebleken is dat het niet tot betaling
      in staat is, daarvan mededeling te doen aan het Uitvoeringsinstituut werknemersverzekeringen en, indien het
      Uitvoeringsinstituut werknemersverzekeringen dit verlangt, nadere inlichtingen te verstrekken en stukken over te
      leggen. Elke bestuurder is bevoegd namens het lichaam aan deze verplichting te voldoen.

      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van
      de mededeling, de aard en de inhoud van de te verstrekken inlichtingen en de over te leggen stukken alsmede de
      termijnen waarbinnen het doen van de mededeling, het verstrekken van de inlichtingen en het overleggen van de
      stukken dienen te geschieden.

      3 Indien het lichaam op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan, is een
      bestuurder aansprakelijk indien aannemelijk is, dat het niet betalen van de premie of de voorschotpremie het gevolg
      is van aan hem te wijten kennelijk onbehoorlijk bestuur in de periode van drie jaren, voorafgaande aan het tijdstip
      van de mededeling.

      4 Indien het lichaam niet of niet op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan,
      is een bestuurder op de voet van het bepaalde in het derde lid aansprakelijk met dien verstande, dat vermoed wordt
      dat de niet-betaling aan hem is te wijten en dat de periode van drie jaar wordt geacht in te gaan op het tijdstip
      waarop het lichaam in gebreke is. Tot de weerlegging van het vermoeden wordt slechts toegelaten de bestuurder
      die aannemelijk maakt dat het niet aan hem te wijten is dat het lichaam niet aan zijn in het tweede lid bedoelde
      verplichting heeft voldaan.

      5 De bestuurder kan slechts worden aangesproken, indien het lichaam met de betaling van de premie of de
      voorschotpremie in gebreke is.

      6 Voor de toepassing van dit artikel wordt onder bestuurder mede verstaan:

      a. de gewezen bestuurder, tijdens wiens bestuur de premieschuld is ontstaan;

      b. degene ten aanzien van wie aannemelijk is dat hij het beleid van het lichaam heeft bepaald of mede heeft bepaald
      als ware hij bestuurder, met uitzondering van de door de rechter benoemde bewindvoerder;

      c. ieder van de met de vereffening belaste personen ingeval het lichaam is ontbonden, met uitzondering van de door
      de rechter benoemde vereffenaar;

      d. indien een bestuurder van een lichaam een lichaam is: ieder van de bestuurders van het laatstbedoelde lichaam.

      7 De tweede volzin van het vierde lid is niet van toepassing op de gewezen bestuurder.

      8 Degene die hoofdelijk aansprakelijk is gesteld, wordt ter zake van het instellen van bezwaar of beroep tegen een
      beslissing betreffende verschuldigde premie of voorschotpremie mede als werkgever in de zin van deze wet beschouwd,
      met dien verstande dat beroep niet is toegestaan tegen de hoogte van het door het lichaam verschuldigde bedrag
      aan premie of voorschotpremie, indien met betrekking tot die hoogte een onherroepelijke rechterlijke uitspraak is
      gewezen in een door het lichaam of door een of meer andere aansprakelijk gestelde bestuurders ingesteld beroep.

      9 Onder premie en voorschotpremie wordt uitsluitend verstaan de premie en de voorschotpremie die het lichaam dient
      te betalen ter zake van werknemers die tot hem in dienstbetrekking staan.

      10 Na het overlijden van de bestuurder zijn de erfgenamen niet aansprakelijk als het Uitvoeringsinstituut
      werknemersverzekeringen niet vóór het overlijden de bestuurder bij voor beroep vatbare beslissing aansprakelijk
      heeft gesteld.

      11 Indien de bestuurder van het lichaam ingevolge dit artikel aansprakelijk is en niet in staat is tot betaling van
      zijn schuld terzake, zijn de door die bestuurder onverplicht verrichte rechtshandelingen waardoor de mogelijkheid
      tot verhaal op hem is verminderd, vernietigbaar en kan het Uitvoeringsinstituut werknemersverzekeringen deze
      vernietigingsgrond inroepen, indien aannemelijk is dat deze rechtshandelingen geheel of nagenoeg geheel met dat
      oogmerk zijn verricht. [Artikel 45 leden 4 en 5 van Boek 3 van het Burgerlijk Wetboek][ref1] is van overeenkomstige
      toepassing.

      12 Het bepaalde in de [artikelen 14 tot en met 16][ref2] is ten aanzien van degene die op grond van dit artikel
      hoofdelijk aansprakelijk is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel14
