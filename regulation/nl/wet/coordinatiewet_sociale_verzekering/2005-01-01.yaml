  - number: 16c
    text: |-
      1 Hoofdelijk aansprakelijk is voor de premie en de voorschotpremie:

      a. verschuldigd door een niet in Nederland wonende of gevestigde werkgever en voor de premie en de voorschotpremie,
      die een niet in Nederland wonende of gevestigde aannemer, opdrachtgever of koper verschuldigd is op grond van
      de [artikelen 16b][ref1], [16ba][ref2] of [16bb][ref3]: de leider van de vaste inrichting in Nederland, de in
      Nederland wonende of gevestigde vaste vertegenwoordiger, of degene die de leiding heeft van de in Nederland
      verrichte werkzaamheden;

      b. verschuldigd door twee of meer werkgevers: ieder van die werkgevers;

      c. verschuldigd door een lichaam zonder rechtspersoonlijkheid of door een rechtspersoonlijkheid bezittend lichaam
      dat niet volledig rechtsbevoegd is: ieder van de bestuurders.

      2 Indien een bestuurder van een lichaam zelf een lichaam is, wordt onder bestuurder mede verstaan ieder van de
      bestuurders van het laatstbedoelde lichaam.

      3 Degene die op grond van het eerste lid, onderdeel a, aansprakelijk is, is niet aansprakelijk voor zover hij
      bewijst dat het niet aan hem is te wijten dat de premie of de voorschotpremie niet is betaald.

      4 Degene die op grond van het eerste lid, onderdeel a, aansprakelijk is, kan slechts worden aangesproken, indien de
      werkgever met de betaling van de premie of de voorschotpremie in gebreke is.

      5 Het bepaalde in de [artikelen 14 tot en met 16][ref4] is ten aanzien van degene die op grond van dit artikel
      hoofdelijk aansprakelijk is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16b
