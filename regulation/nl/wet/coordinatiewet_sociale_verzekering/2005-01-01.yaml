  - number: 3b
    text: |-
      Deze wet verstaat onder lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder
      rechtspersoonlijkheid die met verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van
      publiekrechtelijke rechtspersonen en doelvermogens.
    url: https://wetten.overheid.nl/BWBR0002126/2005-01-01#Artikel3b
  - number: '4'
    text: |-
      1 Loon is:

      a. het loon overeenkomstig [Hoofdstuk II van de Wet op de loonbelasting 1964][ref1] waarbij van dat hoofdstuk
      buiten toepassing blijven:

      1°. [artikel 11, eerste lid, onderdelen j, onder 2° en 5°, en r, onder 4°][ref2],

      2°. [artikel 11, eerste lid, onderdeel j, onder 4°][ref3], voorzover het bedragen betreft die worden ingehouden op
      grond van de [Werkloosheidswet][ref4];

      b. voor de artiest en beroepssporter, bedoeld in [artikel 5a van de Wet op de loonbelasting 1964][ref5], de gage
      overeenkomstig [artikel 35 van die wet][ref6] waarbij het derde lid, onderdeel g, van dat artikel buiten toepassing
      blijft voorzover het bedragen betreft die worden ingehouden op grond van de [Werkloosheidswet][ref7].

      2 Tot het loon behoren niet:

      a. hetgeen uit een vroegere dienstbetrekking als bedoeld in de [Wet op de loonbelasting 1964][ref8] wordt genoten
      met uitzondering van:

      1°. de uitkeringen en toeslag, genoemd in [artikel 3a, tweede en derde lid][ref9], en de aanvullingen daarop van
      degene tot wie de werknemer in dienstbetrekking staat,

      2°. hetgeen wordt genoten op grond van de [artikelen 628][ref10], [628a][ref11] en
      [629 van Boek 7 van het Burgerlijk Wetboek][ref12], alsmede hetgeen door de werknemer met een publiekrechtelijke
      dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen, en de aanvullingen
      daarop van degene tot wie de werknemer in dienstbetrekking staat;

      b. eindheffingsbestanddelen als bedoeld in
      [artikel 31, tweede lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref13];

      c. aanspraken op grond van de [Ziekenfondswet][ref14] alsmede vergoedingen ter zake van premies en bijdragen voor
      ziektekostenregelingen, uitkeringen en verstrekkingen die naar aard en omvang overeenkomen met uitkeringen en
      verstrekkingen op grond van de [Ziekenfondswet][ref15];

      d. uitkeringen op grond van een regeling als bedoeld in
      [artikel 11, eerste lid, onderdeel j, onder 5°, van de Wet op de loonbelasting 1964][ref16].


