  - number: 12a
    text: |-
      1 Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de werkgever een handeling verricht waaraan deze
      in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete, als bedoeld in
      [artikel 12, tweede of derde lid][ref1], zal worden opgelegd, is de werkgever niet langer verplicht terzake van die
      gedraging enige verklaring af te leggen, voor zover het betreft de boeteoplegging. De werkgever wordt hiervan in
      kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.

      2 Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is om aan de werkgever een boete ingevolge
      [artikel 12, derde lid][ref2], op te leggen, wordt hiervan kennis gegeven aan de werkgever onder vermelding van de
      gronden waarop het voornemen berust. De kennisgeving is een handeling als bedoeld in het eerste lid.

      3 Indien de werkgever de kennisgeving wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de werkgever zorg voor dat de in de
      kennisgeving vermelde gronden worden medegedeeld in een voor deze begrijpelijke taal.

      4 In afwijking van afdeling 4.1.2 van de Algemene wet bestuursrecht stelt het Uitvoeringsinstituut
      werknemersverzekeringen de werkgever in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar
      voren te brengen voordat ingevolge [artikel 12, derde lid][ref3], een boete wordt opgelegd.

      5 Indien de werkgever zijn zienswijze mondeling naar voren brengt, en hij de Nederlandse taal onvoldoende beheerst,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de werkgever zorg voor dat een tolk
      wordt benoemd die de werkgever kan bijstaan, tenzij redelijkerwijs mag worden aangenomen dat hieraan geen behoefte
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002126#Artikel12
