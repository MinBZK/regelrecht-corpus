  - number: 16h
    text: |-
      De aansprakelijke die premie of voorschotpremie heeft voldaan dan wel in de premie of de voorschotpremie heeft
      bijgedragen, is bij zijn verhaal op de werkgever of de mede-aansprakelijke uitsluitend gesubrogeerd in het
      voorrecht van het Uitvoeringsinstituut werknemersverzekeringen overeenkomstig [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16
