  - number: 16ba
    text: |-
      1 De opdrachtgever is hoofdelijk aansprakelijk voor de premie en de voorschotpremie ter zake van een werk,
      inhoudende de vervaardiging en elke daarop gerichte handeling van kleding, andere dan schoeisel:

      a. die de aannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende onderaannemers wordt
      uitgevoerd, iedere volgende onderaannemer verschuldigd is in verband met het verrichten van werkzaamheden door zijn
      werknemers ter zake van dat werk;

      b. voor de betaling waarvan de aannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende
      onderaannemers wordt uitgevoerd, iedere volgende onderaannemer ingevolge [artikel 16b][ref1] hoofdelijk
      aansprakelijk is ter zake van dat werk.

      2 In dit artikel wordt onder opdrachtgever verstaan degene die buiten dienstbetrekking in de normale uitoefening
      van zijn bedrijf met een ander, de aannemer, een overeenkomst heeft gesloten om voor hem een werk als bedoeld in
      het eerste lid uit te voeren tegen een te betalen prijs.

      3 Voor de toepassing van dit artikel wordt met een opdrachtgever gelijkgesteld degene die buiten dienstbetrekking
      in de normale uitoefening van zijn bedrijf kleding, andere dan schoeisel, koopt die nog geheel of gedeeltelijk
      vervaardigd moet worden en met een aannemer de verkoper daarvan.

      4 De [artikelen 14 tot en met 16][ref2] en [16b, tweede lid, derde lid, onderdelen a, c en d, en vijfde lid][ref3],
      zijn van overeenkomstige toepassing, met dien verstande dat:

      a. in het [tweede lid, onderdeel a, van artikel 16b][ref4] voor een werk van stoffelijke aard moet worden gelezen:
      een werk, inhoudende de vervaardiging en elke daarop gerichte handeling van kleding, andere dan schoeisel;

      b. de toepassing van het [derde lid, onderdeel a, van artikel 16b][ref5] er niet toe kan leiden dat de wederpartij
      van de aannemer als opdrachtgever als bedoeld in het tweede lid wordt beschouwd;

      c. in het vijfde lid van [artikel 16b][ref6] voor «aannemer» moet worden gelezen: opdrachtgever, voor
      «onderaannemer»: aannemer en voor «het eerste lid en artikel 35»: het eerste lid van artikel 16ba en artikel 35a.

      5 De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de premie of de voorschotpremie
      verschuldigd door de aannemer of een onderaannemer, indien aannemelijk is dat de niet-betaling door de aannemer of
      een onderaannemer noch aan de opdrachtgever, noch aan de aannemer of een onderaannemer is te wijten.

      6 Degene die op grond van het eerste lid hoofdelijk aansprakelijk is, kan slechts worden aangesproken, indien de
      werkgever met de betaling van de premie of de voorschotpremie in gebreke is.


