        artikel: 1:3
  - number: '11'
    text: |-
      1 De vaststelling van de door de werkgever verschuldigde premie, alsmede de invordering daarvan, geschiedt door
      het Uitvoeringsinstituut werknemers verzekeringen. Indien het Uitvoeringsinstituut werknemers verzekeringen premie
      is verschuldigd over een uitkering stelt hij die premie vast en vordert die in.De vaststelling en invordering
      geschieden met inachtneming van door Onze Minister te stellen regels. Bij deze regels kan worden bepaald dat van de
      werkgever een voorschotpremie wordt gevorderd. De premie wordt naar beneden afgerond op hele euro.

      2 Bij algemene maatregel van bestuur kan ten aanzien van bepaalde groepen van werknemers worden afgeweken van het
      in de eerste volzin van het vorige lid bepaalde.

      3 Indien ten onrechte geen bedrag aan premie is vastgesteld, dan wel na de vaststelling van het te betalen
      bedrag aan premie of voorschotpremie blijkt, dat een lager bedrag is vastgesteld dan verschuldigd is, stelt
      het Uitvoeringsinstituut werknemersverzekeringen het alsnog door de werkgever verschuldigde bedrag aan premie
      of voorschotpremie vast, zowel voor wat betreft de reeds verstreken betalingstermijnen als, ten aanzien van de
      voorschotpremie, voor wat betreft de nog resterende periode van het lopende premiebetalingstijdvak.

      4 Indien een hoger bedrag aan premie of voorschotpremie is vastgesteld dan verschuldigd is, stelt het
      Uitvoeringsinstituut werknemersverzekeringen, het verschuldigde op het juiste bedrag vast. Het teveel betaalde
      wordt verrekend, dan wel aan de werkgever terugbetaald.

      5 Het Uitvoeringsinstituut werknemersverzekeringen vermeldt op de beschikking, bedoeld in dit artikel, binnen welke
      termijn de betaling van de premie, onderscheidenlijk de betaling van de voorschotpremie, dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0002126/2005-01-01#Artikel11
  - number: '12'
    text: |-
      1 Indien een werkgever niet, niet juist of niet volledig voldoet aan een op grond van
      [artikel 10, tweede lid][ref1], gestelde verplichting stelt het Uitvoeringsinstituut werknemersverzekeringen
      ambtshalve het verschuldigde of het alsnog verschuldigde bedrag aan premie of voorschotpremie vast.

      2 Indien de werkgever niet, niet juist of niet volledig voldoet aan een op grond van
      [artikel 10, tweede lid][ref2], geldende verplichting legt het Uitvoeringsinstituut werknemersverzekeringen
      hem een boete op van ten hoogste 10% van het verschuldigde of het alsnog verschuldigde bedrag aan premie of
      voorschotpremie.

      3 Indien het aan opzet of grove schuld van de werkgever is te wijten dat niet, niet juist of niet volledig is
      voldaan aan een op grond van [artikel 10, tweede lid][ref3], geldende verplichting, legt het Uitvoeringsinstituut
      werknemersverzekeringen hem een boete op van ten hoogste 100% van het verschuldigde of het alsnog verschuldigde
      bedrag aan premie of voorschotpremie.

      4 De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de werkgever de gedraging
      verweten kan worden en de omstandigheden waarin de werkgever verkeert. Indien daarvoor dringende redenen aanwezig
      zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van het opleggen van een boete af te zien.
      Van het opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt. De
      boete, bedoeld in het derde lid, wordt niet opgelegd indien de werkgever alsnog juist en volledig voldoet aan de
      op grond van [artikel 10, tweede lid][ref4], voor hem geldende verplichting voordat hij weet of redelijkerwijs moet
      vermoeden dat het Uitvoeringsinstituut werknemersverzekeringen met de onjuistheid of onvolledigheid bekend is of
      bekend zal worden.

      5 Voor de toepassing van deze wet wordt een krachtens het tweede of derde lid opgelegde boete als premie
      beschouwd, tenzij in deze wet anders is bepaald. De toerekening van de krachtens het tweede en derde lid opgelegde
      boeten geschiedt naar evenredigheid van de ingevolge de verschillende sociale verzekeringswetten vastgestelde
      premiebedragen.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het tweede, derde
      en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel10
