  - number: 9a
    text: |-
      1 Het bedrag, genoemd in [artikel 9, eerste lid][ref1], wordt herzien met ingang van de dag waarop en in de mate
      waarin het bedrag genoemd in [artikel 8, eerste lid, onder ][ref2] (*Stb.* 1968, 657) wordt herzien.

      2 De dag, bedoeld in het eerste lid, en het overeenkomstig het eerste lid herziene bedrag worden door Onze Minister
      in de *Staatscourant* bekend gemaakt.

      3 Het overeenkomstig het eerste lid herziene bedrag treedt in de plaats van het bedrag, genoemd in
      [artikel 9, eerste lid][ref3].

      4 Uitsluitend voor de berekening van het loon waarnaar de premies worden geheven, wordt het bedrag, genoemd in
      [artikel 9, eerste lid][ref4], afgerond op hele euro naar beneden en blijft het bedrag zoals dat geldt per 1
      januari van een kalenderjaar gedurende dat hele kalenderjaar van kracht.


