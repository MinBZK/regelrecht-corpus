  - number: '2'
    text: |-
      Deze wet verstaat onder werknemer:

      a. voor de toepassing van de [Ziektewet][ref1]: de werknemer in de zin van die wet;

      b. voor de toepassing van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] (*Stb.* 1987, 89): de werknemer in
      de zin van die wet;

      c. voor de toepassing van de [Werkloosheidswet][ref3] (*Stb.* 1987, 93): de werknemer in de zin van die wet;

      d. voor de toepassing van de [Ziekenfondswet][ref4]: de verzekerde, bedoeld in [Hoofdstuk II van die wet][ref5],
      voor zover te zijnen aanzien geen afwijkende bepalingen gelden op grond van [het zesde lid van artikel 15][ref6] of
      [artikel 18 van die wet][ref7].


