  - number: 16f
    text: |-
      1 Indien verhaal op de werkgever door degene die ingevolge [artikel 16a][ref1], [16b][ref2], [16ba][ref3],
      [16bb][ref4], [16c, eerste lid, onderdeel a][ref5], of [16d][ref6] premie of voorschotpremie heeft voldaan geheel
      of gedeeltelijk onmogelijk blijkt en ter zake van de niet betaalde premie of voorschotpremie twee of meer personen
      ingevolge de desbetreffende bepaling hoofdelijk aansprakelijk zijn, dragen dezen onderling voor gelijke delen in
      het onverhaald gebleven deel bij. Indien [artikel 16b][ref7], [16ba][ref8] of [16bb][ref9] van toepassing is en het
      aandeel in het totaal van het uit te voeren werk dat ieder van de hoofdelijk aansprakelijken heeft laten uitvoeren
      kan worden vastgesteld, draagt, in afwijking in zoverre van de eerste volzin, ieder in evenredigheid met dat
      aandeel bij. Voor de toepassing van dit artikel worden voorts de opdrachtgever en de koper geacht dat werk geheel
      te hebben laten uitvoeren door een onderaannemer.

      2 Indien de opdrachtgever ingevolge [artikel 16ba][ref10] premie of voorschotpremie heeft voldaan, draagt,
      in afwijking in zoverre van het eerste lid, tevens een aannemer bij die met betrekking tot het desbetreffende
      werk ingevolge [artikel 16b][ref11] aansprakelijk is. Indien een koper ingevolge [artikel 16bb][ref12] premie
      of voorschotpremie heeft voldaan, dragen, in afwijking in zoverre van het eerste lid, tevens de opdrachtgever
      onderscheidenlijk een aannemer bij die met betrekking tot het desbetreffende werk ingevolge [artikel 16ba][ref13]
      onderscheidenlijk [artikel 16b][ref14] aansprakelijk zijn.

      3 In afwijking in zoverre van de voorgaande leden bedraagt de bijdrage niet meer dan het bedrag waarvoor ieders
      aansprakelijkheid ingevolge de desbetreffende bepaling bestaat. Een als gevolg van de toepassing van de vorige
      volzin ontstaan tekort wordt met inachtneming van de voorgaande leden over de anderen verdeeld.

      4 Degene die meer heeft bijgedragen dan overeenkomt met zijn op de voet van de voorgaande leden bepaalde
      aandeel, heeft voor dat meerdere verhaal op degene die minder dan zijn dienovereenkomstig bepaalde aandeel heeft
      bijgedragen. Blijkt verhaal op een of meer van degenen op wie verhaal kan worden genomen geheel of gedeeltelijk
      onmogelijk, dan wordt dat tekort met inachtneming van de voorgaande leden over de anderen verdeeld.

      5 Ieder die in de premie of voorschotpremie heeft bijgedragen, blijft gerechtigd het bijgedragene alsnog van de
      werkgever terug te vorderen.

      6 Van de voorgaande leden kan bij overeenkomst worden afgeweken.


