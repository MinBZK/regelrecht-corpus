  - number: '3'
    text: |-
      Deze wet verstaat onder werkgever:

      a. voor de toepassing van de [Ziektewet][ref1]: de werkgever in de zin van die wet;

      b. voor de toepassing van de [Wet op de arbeidsongeschiktheidsverzekering][ref2]: de werkgever in de zin van die
      wet;

      c. voor de toepassing van de [Werkloosheidswet][ref3]: de werkgever in de zin van die wet;

      d. voor de toepassing van de [Ziekenfondswet][ref4]: de werkgever in de zin van het derde lid van artikel 5
      van die wet voor zover het betreft verzekerden te wier aanzien geen afwijkende bepalingen gelden op grond van
      [het zesde lid van artikel 15][ref5] of [artikel 18 van die wet][ref6].


