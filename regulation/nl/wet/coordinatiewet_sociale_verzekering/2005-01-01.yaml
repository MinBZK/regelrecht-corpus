  - number: '17'
    text: |-
      1 Degene, die gemoedsbezwaren heeft tegen een van de verzekeringen ingevolge de [Ziektewet][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Werkloosheidswet][ref3] en de [Ziekenfondswet][ref4],
      alsmede de rechtspersoon waarbij natuurlijke personen betrokken zijn die zodanige gemoedsbezwaren hebben, kunnen
      met inachtneming van bij ministeriële regeling te stellen regels en voorwaarden door het Uitvoeringsinstituut
      werknemersverzekeringen worden vrijgesteld van de bij die maatregel aan te wijzen verplichtingen, welke hun bij of
      krachtens genoemde wetten en deze wet zijn opgelegd.

      2 In de maand januari van elk kalenderjaar doet het Uitvoeringsinstituut werknemersverzekeringen aan de inspecteur
      der directe belastingen, die ten aanzien van de werkgever bevoegd is met betrekking tot de loonbelasting,
      toekomen een staat vermeldende naam en woon- of vestigingsplaats van die werkgever, alsmede het bedrag, waarvoor
      die werkgever over het afgelopen kalenderjaar aansprakelijk zou zijn geweest, indien hem niet de vorenbedoelde
      vrijstelling was verleend.

      3 Naar aanleiding van de in het vorige lid bedoelde opgave of opgaven wordt uit hoofde van de krachtens
      het bepaalde in het eerste lid aan de werkgever verleende vrijstelling van premiebetaling aan hem over het
      desbetreffende kalenderjaar een naheffingsaanslag in de loonbelasting - zonder boete - opgelegd ter grootte van het
      in totaal opgegeven premiebedrag.

      4 De in het vorige lid bedoelde naheffingsaanslag in de loonbelasting wordt ingevorderd overeenkomstig de
      bepalingen geldende voor de invordering van de loonbelasting en als loonbelasting verantwoord, doch overigens voor
      de heffing van de loonbelasting niet als zodanig aangemerkt.

      5 Het bedrag aan premie, waarvoor een werkgever aansprakelijk zou zijn geweest, indien hem niet de in het eerste
      lid bedoelde vrijstelling was verleend, komt voor rekening van het Rijk.

      6 Bij de ministeriële regeling, bedoeld in het eerste lid, worden tevens geregeld de verdere gevolgen, welke aan
      het verlenen van vrijstelling wegens gemoedsbezwaren zijn verbonden, alsmede de gevallen, waarin de vrijstelling
      wordt of kan worden ingetrokken en de aan de intrekking verbonden gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
