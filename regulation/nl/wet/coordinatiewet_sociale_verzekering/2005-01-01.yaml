  - number: 18c
    text: |-
      1 Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, vierde tot en met achtste lid][ref1], en [4][ref2] en de op
      die artikelen berustende bepalingen.

      2 Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven
      in zake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel1
