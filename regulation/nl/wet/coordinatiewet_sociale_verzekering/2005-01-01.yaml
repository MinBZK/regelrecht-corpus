preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige bepalingen van sociale verzekeringswetten te
    coördineren met overeenkomstige bepalingen van de loonbelasting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002126/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      2

      3 In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners.

      4 In deze wet en de daarop berustende bepalingen wordt:

      a. als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde
      meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;

      b. als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.

      5 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      6 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:

      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;

      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;

      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of

      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vijfde lid.

      7 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het zesde lid, onderdeel d.

      8 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
