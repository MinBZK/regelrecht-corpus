---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_ontwikkeling_van_landschappen
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2005-04-30'
bwb_id: BWBR0010601
url: https://wetten.overheid.nl/BWBR0010601/2005-04-30
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderregeling subsidiëring natuurprojecten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel1
  - number: 1.a
    text: |-
      landschapsontwikkelingsplan: plan voor het grondgebied van één of meer gemeenten ter verbetering van de
      landschapskwaliteit in het desbetreffende gebied;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel1
  - number: 1.b
    text: |-
      landschapsplan: landschapsbeleidsplan of landschapsstructuurplan, waarvoor uit ’s Rijks kas subsidie is verstrekt
      vóór 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel1
  - number: '2'
    text: |-
      Aanvragen tot subsidieverlening voor projecten, bedoeld in
      [artikel 2 van de Kaderregeling subsidiëring natuurprojecten][ref1], kunnen worden ingediend voor het thema
      ’Ontwikkeling van het landschap’.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel2
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '2'
  - number: '4'
    text: |-
      Subsidie kan worden verstrekt voor projecten die een bijdrage leveren aan de bevordering van een samenhangend en
      doelmatig beleid met betrekking tot het beheer en de ontwikkeling van een kwalitatief hoogwaardig landschap.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel4
  - number: '5.1'
    text: 'Voor subsidieverlening komen in aanmerking projecten:'
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5
  - number: 5.1.a
    text: |-
      die het voorbereiden en opstellen van landschapsontwikkelingsplannen betreffen waarvoor niet reeds eerder uit ’s
      Rijks kas subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5
  - number: 5.1.b
    text: |-
      waarbij het opstellen van het landschapsontwikkelingsplan wordt uitbesteed aan een bureau waarbij tenminste één
      tuin- en landschapsarchitect werkzaam is die ingevolge de [Wet op de architectentitel][ref1] is ingeschreven in het
      architectenregister en die actief participeert in het opstellen van het landschapsontwikkelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004189
  - number: '5.2'
    text: Voor subsidieverlening komen tevens in aanmerking projecten die de herziening betreffen van een landschapsplan.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5
  - number: 5a
    text: |-
      Subsidie wordt uitsluitend verstrekt voor landschapsontwikkelingsplannen die voldoen aan de in de
      [artikelen 5b][ref1] tot en met [5e][ref2] genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0010601#Artikel5e
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0010601
        artikel: 5e
  - number: 5b
    text: |-
      In het landschapsontwikkelingsplan wordt aandacht besteed aan de volgende aspecten van het desbetreffende
      landschap:
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.a
    text: de opbouw van het landschap;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.b
    text: de identiteit en verscheidenheid van het landschap, gerelateerd aan kenmerkende landschappen in Nederland;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.c
    text: het watersysteem;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.d
    text: de visuele kenmerken;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.e
    text: de betekenis van de gebruiksfuncties, inclusief verwachte ontwikkelingen, voor het landschap en omgekeerd;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.f
    text: de cultuurhistorische en aardkundige waarden;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.g
    text: de ecologische waarden;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.h
    text: de culturele vernieuwing van het landschap, waaronder de toepassing van landschapsarchitectuur en beeldende kunst;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.i
    text: de omvang en de landschappelijke en ecologische kwaliteit van opgaande begroeiing;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.j
    text: de omvang en kwaliteit van de recreatieve ontsluiting en de toegankelijkheid en bereikbaarheid;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5b.k
    text: de waardering van het landschap door gebruikers.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5b
  - number: 5c
    text: 'Het landschapsontwikkelingsplan bevat de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
  - number: 5c.a
    text: een kwantitatieve en kwalitatieve systematische beschrijving en analyse van het bestaande landschap;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
  - number: 5c.b
    text: een beschrijving van de doelstellingen inzake de ontwikkeling van het landschap;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
  - number: 5c.c
    text: tenminste twee wezenlijk verschillende visies op hoofdlijnen met een onderbouwde gekozen ontwikkelingsrichting;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
  - number: 5c.d
    text: |-
      een landschapsontwikkelingsvisie waarin wordt aangegeven: - in welke mate de in [artikel 5b][ref1] genoemde
      aspecten worden ontwikkeld en beschermd;
        - de gebieden en functies met accenten op behoud dan wel vernieuwing, scheiding dan wel combinatie van functies;


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel5b
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: 5b
  - number: 5c.e
    text: |-
      een uitvoeringsplan waarin op basis van de onder d genoemde landschapsontwikkelingsvisie zijn aangegeven: -
      de maatregelen voor de uitvoering van de ontwikkeling, bescherming en beheer van het landschap, inclusief een
      tijdsplanning;
        - de eisen die bij landschappelijk relevante ingrepen worden gesteld aan te treffen landschappelijke voorzieningen;
        - de wijze waarop de doorwerking van het landschapsontwikkelingsplan in het bestemmingsplan en in de
      vergunningverlening wordt gerealiseerd, inclusief een tijdsplanning;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
  - number: 5c.f
    text: |-
      een financieringsplan waarin toegezegde bijdragen van derden worden gekoppeld aan de realisering van het onder e
      bedoelde uitvoeringsplan, inclusief een tijdsplanning.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5c
  - number: 5d
    text: |-
      Het landschapsontwikkelingsplan bevat een opsomming en omschrijving van uit te voeren activiteiten ter verzekering
      van het maatschappelijke en financiële draagvlak van het betreffende landschapsontwikkelingsplan.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5d
  - number: 5e
    text: |-
      Het landschapsontwikkelingsplan wordt vastgesteld dan wel goedgekeurd door de gemeenteraad van de gemeente of
      gemeenten op welker grondgebied het plan betrekking heeft of door provinciale staten ingeval het een aanvraag van
      een provincie betreft.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel5e
  - number: '6.1'
    text: |-
      De subsidie wordt verleend onder de voorwaarde dat het project vóór 1 november in het tweede jaar volgend op de
      aanvraag is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel6
  - number: '6.2'
    text: De minister kan op verzoek van de aanvrager uitstel verlenen met ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel6
  - number: '7'
    text: Subsidie kan worden aangevraagd door gemeenten en provincies.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel7
  - number: '8.1'
    text: |-
      De subsidie voor projecten als bedoeld in [artikel 2][ref1] kan worden verleend voor de volgende kosten, verband
      houdend met het project:


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel2
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: '2'
  - number: 8.1.a
    text: bijdragen aan derden voor het opstellen dan wel het laten opstellen van landschapsontwikkelingsplannen;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel8
  - number: 8.1.b
    text: kosten van onderzoeken die nodig zijn voor het opstellen van landschapsontwikkelingsplannen;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel8
  - number: 8.1.c
    text: |-
      kosten van de in [artikel 5d][ref1] bedoelde activiteiten, totaal tot een maximum van € 75.000,-, voor
      zover het betreft: - het ontwikkelen en inzetten van communicatie-instrumenten die het draagvlak voor het
      landschapsontwikkelingsplan bevorderen, waaronder het geven van voorlichting en het organiseren van een
      maatschappelijk debat over het landschapsontwikkelingsplan;
        - het voorbereiden en afsluiten van overeenkomsten met derden op het gebied van financiering, inrichting en beheer;
        - het bevorderen van de beschikbaarstelling van lokale middelen voor de uitvoering van het
      landschapsontwikkelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel5d
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: 5d
  - number: '8.2'
    text: |-
      De kosten, bedoeld in het eerste lid, worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting
      indien de aanvrager de omzetbelasting niet kan verrekenen met de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel8
  - number: 8a
    text: |-
      De subsidie voor de in [artikel 8, eerste lid, onderdeel c][ref1], bedoelde activiteiten wordt verleend onder de
      voorwaarde dat de activiteiten zijn verricht in de periode tussen de datum van de beschikking tot subsidieverlening
      en de datum van indiening van de aanvraag tot subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel8
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: '8'
  - number: '9.1'
    text: |-
      De subsidie bedraagt ten hoogste 50% van de in [artikel 8][ref1] bedoelde kosten bij een aanvraag tot
      subsidieverlening ingediend door een provincie of een individuele gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel8
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: '8'
  - number: '10.1'
    text: |-
      Indien voor het project waarvoor op grond van dit besluit subsidie is verleend, andere subsidies door de
      rijksoverheid worden verstrekt, wordt slechts een zodanig bedrag op grond van dit besluit verstrekt, dat de som van
      de subsidies het in [artikel 9][ref1] genoemde percentage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel9
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010601
        artikel: '9'
  - number: '10.2'
    text: |-
      Indien voor het project waarvoor op grond van dit besluit subsidie is verleend, subsidies door anderen dan de
      rijksoverheid dan wel financiële middelen door niet-bestuursorganen worden verstrekt, wordt slechts een zodanig
      bedrag op grond van dit besluit verstrekt, dat de som van de subsidies dan wel de financiële middelen niet meer
      bedraagt dan 100% van de totale kosten van het project.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel10
  - number: '11'
    text: |-
      Aanvragen tot subsidieverlening worden jaarlijks ingediend in de periode van 1 april tot en met 31 oktober met dien
      verstande dat aanvragen voor het jaar 2005 worden ingediend in de periode van 1 mei tot en met 31 oktober 2005.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel11
  - number: '12.1'
    text: Een aanvraag tot subsidieverlening wordt gericht aan de minister en ingediend bij Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel12
  - number: '12.2'
    text: |-
      De Stichting Landschapsbeheer Nederland adviseert Dienst Regelingen bij de beoordeling van aanvragen en de
      uitbetaling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel12
  - number: '13'
    text: |-
      In afwijking van [artikel 6 van de Kaderregeling subsidiëring natuurprojecten][ref1] gaat de aanvraag vergezeld
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel6
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '6'
  - number: 13.a
    text: een kaart tot een schaal van 1:100.000 van het gebied waarop het landschapsontwikkelingsplan betrekking zal hebben;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel13
  - number: 13.b
    text: een redengeving voor het opstellen van het landschapsontwikkelingsplan;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel13
  - number: 13.c
    text: |-
      een sluitende begroting op basis van drie offertes en met een redengevende verklaring waarom één van de drie
      offertes geselecteerd is;
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel13
  - number: 13.d
    text: een korte evaluatie van het landschapsontwikkelingsplan, indien een plan herzien wordt.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel13
  - number: '14'
    text: |-
      In afwijking van [artikel 10, eerste lid van de Kaderregeling subsidiëring natuurprojecten][ref1] worden aanvragen
      tot subsidievaststelling ingediend vóór 1 juni van het derde jaar volgend op het jaar waarvoor een aanvraag tot
      subsidieverlening is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel10
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '10'
  - number: 14a.1
    text: |-
      Ten minste één jaar doch uiterlijk 15 maanden na de datum van de beschikking tot subsidievaststelling dient de
      subsidieontvanger een rapportage in waarin is aangegeven op welke wijze het landschapsontwikkelingsplan is en zal
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel14a
  - number: 14b
    text: |-
      In het jaar 2005 en voorts ten minste iedere vijf jaar publiceert de minister een verslag over de doeltreffendheid
      en de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel14b
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit ontwikkeling van landschappen.'
    url: https://wetten.overheid.nl/BWBR0010601/2005-04-30#Artikel16
