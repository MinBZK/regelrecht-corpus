articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Koninkrijksrelaties en Bestuur.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Koninkrijksrelaties en Bestuur, genoemd in het
      [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1
    text: |-
      1 Het Bureau Directeur Generaal van het Directoraat-Generaal Koninkrijksrelaties en Bestuur staat onder leiding van
      een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het uitoefenen van de beleidscoördinatie en bestuursondersteuning;

      b. het verzorgen van de kaderstelling op DG-niveau;

      c. het uitvoeren van de integrale control (beleids- en PIOFACH-control);

      d. het adviseren inzake strategisch beleid;

      e. het optreden als opdrachtgever in de richting van de Gemeenschappelijke Diensten;

      f. het coördineren van het onderzoeksveld;

      g. het richtinggevend sturen van de vertegenwoordigingen;

      h. het opstellen van speeches over beleidsvelden.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 4:1
    text: |-
      De directie Koninkrijksrelaties bestaat uit de volgende onderdelen:

      a. de afdeling Koninkrijksverhoudingen (KV);

      b. de afdeling Samenwerkingsbeleid (SB).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel41
  - number: 4:2
    text: |-
      1 De afdeling Koninkrijksverhoudingen staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak:

      a. het coördineren van beleid ten aanzien van de bestuurlijke en financiële verhoudingen in het Koninkrijk;

      b. het coördineren van interdepartementale en internationale aangelegenheden;

      c. het coördineren van de samenwerking met de Koninkrijkspartners op het terrein van de rechtshandhaving;

      d. het voorbereiden van parlementaire aangelegenheden en reizen;

      e. het coördineren van het opstellen en uitvoeren van hoofdstuk IV van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:3
    text: |-
      1 De afdeling Samenwerkingsbeleid staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak:

      a. het ontwikkelen van het beleid ten aanzien van de samenwerking met de Koninkrijkspartners. Hierbij gaat het
      om samenwerkingsprogramma’s met de Antilliaanse en Arubaanse overheid en om financiering van non-gouvernementele
      organisaties;

      b. het ontwikkelen van het beleid ten aanzien van het toezicht houden op de onafhankelijke ontwikkelingsfondsen en
      het monitoren van de resultaten van de samenwerking;

      c. het ontwikkelen van het beleid op het terrein van goed bestuur, waaronder openbare financiën en integriteit.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel43
  - number: 5:1
    text: |-
      De directie Grotestedenbeleid en Interbestuurlijke betrekkingen bestaat uit de volgende onderdelen:

      a. de directiestaf (DS);

      b. de afdeling Grotestedenbeleid (GSB);

      c. de afdeling Interbestuurlijke Betrekkingen (IB);

      d. het project Grotestedenbeleid III (project GSB III).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel51
  - number: 5:2
    text: |-
      1 De directiestaf staat onder leiding van een directiesecretaris.

      2 De afdeling heeft de volgende taken:

      a. het coördineren van de beleidsplanning van de directie;

      b. het verrichten van algemeen beleidsmatige werkzaamheden;

      c. het coördineren van algemeen beheersmatige zaken op het gebied van huisvesting, automatisering e.d.;

      d. het verzorgen van de administratieve en secretariële ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:3
    text: |-
      1 De afdeling Grotestedenbeleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het coördineren en doorontwikkelen van het grotestedenbeleid mede op basis van de toezeggingen in de
      stadsconvenanten, in nauw overleg met de steden en ministeries;

      b. het nemen van initiatieven om samenhangend rijksbeleid verder te ontwikkelen en bij te sturen;

      c. het beoordelen van voornemens van de diverse ministeries op hun verenigbaarheid met de doelstellingen van het
      grotestedenbeleid;

      d. het periodiek onderzoeken en analyseren van de voortgang van de uitvoering van stedelijke
      meerjarenontwikkelingsprogramma’s en de afspraken met steden.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:4
    text: |-
      1 De afdeling Interbestuurlijke betrekkingen staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het zorgdragen voor goede bestuurlijke arrangementen;

      b. het signaleren van ontwikkelingen die van belang zijn voor de bestuurlijke verhoudingen;

      c. het faciliteren van processen die de bestuurlijke samenwerking bevorderen;

      d. het ontwikkelen van concepten voor bestuurlijke arrangementen die aansluiten op veranderingen in de samenleving;

      e. het beoordelen van voornemens van de diverse ministeries op hun gevolgen voor het openbaar bestuur en in het
      bijzonder gemeenten en provincies.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:5
    text: |-
      1 Het project Grotestedenbeleid III staat onder leiding van een projectleider. Het project is tijdelijk ingesteld
      en heeft als einddatum 1 april 2005.

      2 Het project heeft de volgende taken:

      a. het optimaliseren van de doelstellingen en instrumenten van het grotestedenbeleid;

      b. het opstellen van de verlengingsafspraken 2004;

      c. het opstellen van het Beleidskader GSB III;

      d. bundeling en ontschotting van regelingen;

      e. integreren van de monitors;

      f. het afsluiten van de nieuwe convenanten (2005–2009).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 6:1
    text: |-
      De directie Bestuurlijke en Financiële Organisatie bestaat uit de volgende onderdelen:

      a. de afdeling Bestuurlijke Organisatie (BO);

      b. de afdeling Financiële Organisatie Binnenlands Bestuur (FOBB);

      c. de afdeling Inspectie Financiën Lokale en provinciale Overheden (IFLO).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel61
  - number: 6:2
    text: |-
      1 De afdeling Bestuurlijke Organisatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen en uitvoeren van het beleid en met betrekking tot de organisatie, de kwaliteit en het
      functioneren van het binnenlands bestuur;

      b. het ontwikkelen en uitvoeren van het beleid inzake lijkbezorging, de streektalen en talen van minderheden en de
      gevolgen van Europees beleid en wetgeving voor het systeem van binnenlands bestuur;

      c. het zorgdragen voor de materiële rechtspositie van gekozen en benoemde politieke ambtsdragers;

      d. het ontwikkelen van beleid inzake de financiën van politieke partijen;

      e. het behandelen van verzoekschriften van burgers;

      f. het schorsings- en vernietigingsbeleid van besluiten op het gebied van het openbaar bestuur;

      g. het coördineren van het vernietigingsbeleid voor de gehele rijksdienst.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:3
    text: |-
      1 De afdeling Financiële Organisatie Binnenlands Bestuur staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het zorgdragen voor de beleidsontwikkeling betreffende een adequate financiële verhouding tussen rijk en
      medeoverheden, waaronder de omvang en verdeling van het gemeente- en provinciefonds;

      b. het mede zorgdragen voor de opstelling en uitvoering gemeente- en provinciefonds;

      c. het zorgdragen voor de beleidsontwikkeling betreffende het financiële toezicht op medeoverheden;

      d. het zorgdragen voor de beleidsontwikkeling betreffende het algemene beleids- en beheersinstrumentarium
      financiële organisatie voor medeoverheden, inclusief de accountantscontrole en de financieringsvoorschriften;

      e. het zorgdragen voor de beleidsontwikkeling betreffende belastingen en heffingen van medeoverheden.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:4
    text: |-
      1 De afdeling Inspectie Financiën Lokale en Provinciale Overheden staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het instellen van onderzoeken en uitbrengen van adviezen op het gebied van de
      financiën van de individuele medeoverheden, in het bijzonder de behandeling van verzoeken
      van gemeenten en toepassing van [artikel 12 van de Financiële-verhoudingswet][ref1],
      de [artikelen 79][ref2] en [82 van de Wet bodembescherming][ref3],
      [artikel 3 van het Besluit rijksbijdragen bijstands- en bestrijdingskosten][ref4] en het
      [Bijdragenbesluit kosten ruiming explosieven Tweede Wereldooorlog 1999][ref5] alsmede het op verzoek van gemeenten
      samen met de desbetreffende provincie uitvoeren van begrotingsscans;

      b. het zorgdragen voor het financieel toezicht op provincies en toezicht voortvloeiend uit de
      [Wet gemeenschappelijke regelingen][ref6];

      c. het bevorderen van de naleving van de Europese wet- en regelgeving door de medeoverheden, in het bijzonder op
      de relevante terreinen van het mededingings- en subsidiebeleid (onder meer staatssteun, aanbestedingen en Europese
      subsidies);

      d. het vergroten van kennis over Europese wet- en regelgeving op de relevante terreinen van het mededingings- en
      subsidiebeleid (onder meer staatssteun, aanbestedingen en Europese subsidies) bij medeoverheden door middel van het
      geven van voorlichting en advies;

      e. het doorgeleiden van staatssteunmeldingen aan de Europese Commissie (Coördinatiepunt staatssteun) en het
      meewerken aan procedures betreffende staatssteun van de Europese Commissie;

      f. het signaleren van de financiële gevolgen voor de medeoverheden van Europese wet- en regelgeving, in het
      bijzonder op de relevante terreinen van het mededingings- en subsidiebeleid (onder meer staatssteun, aanbestedingen
      en Europese subsidies).


