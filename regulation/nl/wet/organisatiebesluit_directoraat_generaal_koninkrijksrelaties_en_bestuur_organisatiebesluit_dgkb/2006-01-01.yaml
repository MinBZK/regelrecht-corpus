    text: de vestiging te Philipsburg, Sint Maarten (VNP).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel111
  - number: 11:2.1
    text: De vestiging te Willemstad, Curaçao, staat onder leiding van de Vertegenwoordiger.
