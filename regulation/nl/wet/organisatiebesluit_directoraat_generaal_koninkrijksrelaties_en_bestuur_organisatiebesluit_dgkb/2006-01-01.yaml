  - number: 7:1
    text: |-
      De directie Coördinatie Internationaal Beleid bestaat uit de volgende onderdelen:

      a. de afdeling Europese Unie (EU);

      b. de afdeling Internationale Zaken (IZ).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel71
  - number: 7:2
    text: |-
      1 De afdeling Europese Unie staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak het uitvoeren van de taken van de directie voor zover gelegen op het terrein van de
      Europese Unie, meer in het bijzonder:

      a. het verzorgen van een adequate inbreng van het ministerie in het EU-besluitvormingsproces via de beschikbare
      intra- en interdepartementale structuren;

      b. het verzorgen van de intradepartementale informatie-uitwisseling over onderwerpen betreffende de Europese Unie;

      c. het behartigen van algemene en dienstoverstijgende onderwerpen op het terrein van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel72
  - number: 7:3
    text: |-
      1 De afdeling Internationale Zaken staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak het uitvoeren van de taken van de directie voor zover niet gelegen op het terrein van
      de Europese Unie, meer in het bijzonder:

      a. het verzorgen van een adequate inbreng van het ministerie in besluitvormingsprocessen van andere internationale
      organisaties dan de Europese Unie via de beschikbare intra- en interdepartementale structuren;

      b. het verzorgen van de intradepartementale informatie-uitwisseling over onderwerpen betreffende internationale
      vraagstukken;

      c. het behartigen van algemene en dienstoverstijgende onderwerpen op het terrein van internationale vraagstukken.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel73
