---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatiebesluit_directoraat_generaal_koninkrijksrelaties_en_bestuur_organisatiebesluit_dgkb
regulatory_layer: WET
publication_date: '2006-11-21'
valid_from: '2006-01-01'
bwb_id: BWBR0017933
url: https://wetten.overheid.nl/BWBR0017933/2006-01-01
preamble:
  text: |-
    Gelet op artikel 4:2 van het Organisatiebesluit BZK 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Koninkrijksrelaties en Bestuur.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Koninkrijksrelaties en Bestuur, genoemd in het
      [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1.1
    text: |-
      Het Bureau Directeur Generaal van het Directoraat-Generaal Koninkrijksrelaties en Bestuur staat onder leiding van
      een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.a
    text: het uitoefenen van de beleidscoördinatie en bestuursondersteuning;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.b
    text: het verzorgen van de kaderstelling op DG-niveau;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.c
    text: het uitvoeren van de integrale control (beleids- en PIOFACH-control);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.d
    text: het adviseren inzake strategisch beleid;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.e
    text: het optreden als opdrachtgever in de richting van de Gemeenschappelijke Diensten;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.f
    text: het coördineren van het onderzoeksveld;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.g
    text: het richtinggevend sturen van de vertegenwoordigingen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 3:1.2.h
    text: het opstellen van speeches over beleidsvelden.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel31
  - number: 4:1
    text: 'De directie Koninkrijksrelaties bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel41
  - number: 4:1.a
    text: de afdeling Koninkrijksverhoudingen (KV);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel41
  - number: 4:1.b
    text: de afdeling Samenwerkingsbeleid (SB).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel41
  - number: 4:2.1
    text: De afdeling Koninkrijksverhoudingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:2.2
    text: 'De afdeling heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:2.2.a
    text: het coördineren van beleid ten aanzien van de bestuurlijke en financiële verhoudingen in het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:2.2.b
    text: het coördineren van interdepartementale en internationale aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:2.2.c
    text: het coördineren van de samenwerking met de Koninkrijkspartners op het terrein van de rechtshandhaving;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:2.2.d
    text: het voorbereiden van parlementaire aangelegenheden en reizen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:2.2.e
    text: het coördineren van het opstellen en uitvoeren van hoofdstuk IV van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel42
  - number: 4:3.1
    text: De afdeling Samenwerkingsbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel43
  - number: 4:3.2
    text: 'De afdeling heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel43
  - number: 4:3.2.a
    text: |-
      het ontwikkelen van het beleid ten aanzien van de samenwerking met de Koninkrijkspartners. Hierbij gaat het om
      samenwerkingsprogramma’s met de Antilliaanse en Arubaanse overheid en om financiering van non-gouvernementele
      organisaties;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel43
  - number: 4:3.2.b
    text: |-
      het ontwikkelen van het beleid ten aanzien van het toezicht houden op de onafhankelijke ontwikkelingsfondsen en het
      monitoren van de resultaten van de samenwerking;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel43
  - number: 4:3.2.c
    text: het ontwikkelen van het beleid op het terrein van goed bestuur, waaronder openbare financiën en integriteit.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel43
  - number: 5:1
    text: 'De directie Grotestedenbeleid en Interbestuurlijke betrekkingen bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel51
  - number: 5:1.a
    text: de directiestaf (DS);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel51
  - number: 5:1.b
    text: de afdeling Grotestedenbeleid (GSB);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel51
  - number: 5:1.c
    text: de afdeling Interbestuurlijke Betrekkingen (IB);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel51
  - number: 5:1.d
    text: het project Grotestedenbeleid III (project GSB III).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel51
  - number: 5:2.1
    text: De directiestaf staat onder leiding van een directiesecretaris.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:2.2.a
    text: het coördineren van de beleidsplanning van de directie;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:2.2.b
    text: het verrichten van algemeen beleidsmatige werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:2.2.c
    text: het coördineren van algemeen beheersmatige zaken op het gebied van huisvesting, automatisering e.d.;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:2.2.d
    text: het verzorgen van de administratieve en secretariële ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel52
  - number: 5:3.1
    text: De afdeling Grotestedenbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:3.2.a
    text: |-
      het coördineren en doorontwikkelen van het grotestedenbeleid mede op basis van de toezeggingen in de
      stadsconvenanten, in nauw overleg met de steden en ministeries;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:3.2.b
    text: het nemen van initiatieven om samenhangend rijksbeleid verder te ontwikkelen en bij te sturen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:3.2.c
    text: |-
      het beoordelen van voornemens van de diverse ministeries op hun verenigbaarheid met de doelstellingen van het
      grotestedenbeleid;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:3.2.d
    text: |-
      het periodiek onderzoeken en analyseren van de voortgang van de uitvoering van stedelijke
      meerjarenontwikkelingsprogramma’s en de afspraken met steden.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel53
  - number: 5:4.1
    text: De afdeling Interbestuurlijke betrekkingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:4.2.a
    text: het zorgdragen voor goede bestuurlijke arrangementen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:4.2.b
    text: het signaleren van ontwikkelingen die van belang zijn voor de bestuurlijke verhoudingen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:4.2.c
    text: het faciliteren van processen die de bestuurlijke samenwerking bevorderen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:4.2.d
    text: het ontwikkelen van concepten voor bestuurlijke arrangementen die aansluiten op veranderingen in de samenleving;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:4.2.e
    text: |-
      het beoordelen van voornemens van de diverse ministeries op hun gevolgen voor het openbaar bestuur en in het
      bijzonder gemeenten en provincies.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel54
  - number: 5:5.1
    text: |-
      Het project Grotestedenbeleid III staat onder leiding van een projectleider. Het project is tijdelijk ingesteld en
      heeft als einddatum 1 april 2005.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2
    text: 'Het project heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2.a
    text: het optimaliseren van de doelstellingen en instrumenten van het grotestedenbeleid;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2.b
    text: het opstellen van de verlengingsafspraken 2004;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2.c
    text: het opstellen van het Beleidskader GSB III;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2.d
    text: bundeling en ontschotting van regelingen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2.e
    text: integreren van de monitors;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 5:5.2.f
    text: het afsluiten van de nieuwe convenanten (2005–2009).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel55
  - number: 6:1
    text: 'De directie Bestuurlijke en Financiële Organisatie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel61
  - number: 6:1.a
    text: de afdeling Bestuurlijke Organisatie (BO);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel61
  - number: 6:1.b
    text: de afdeling Financiële Organisatie Binnenlands Bestuur (FOBB);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel61
  - number: 6:1.c
    text: de afdeling Inspectie Financiën Lokale en provinciale Overheden (IFLO).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel61
  - number: 6:2.1
    text: De afdeling Bestuurlijke Organisatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.a
    text: |-
      het ontwikkelen en uitvoeren van het beleid en met betrekking tot de organisatie, de kwaliteit en het functioneren
      van het binnenlands bestuur;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.b
    text: |-
      het ontwikkelen en uitvoeren van het beleid inzake lijkbezorging, de streektalen en talen van minderheden en de
      gevolgen van Europees beleid en wetgeving voor het systeem van binnenlands bestuur;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.c
    text: het zorgdragen voor de materiële rechtspositie van gekozen en benoemde politieke ambtsdragers;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.d
    text: het ontwikkelen van beleid inzake de financiën van politieke partijen;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.e
    text: het behandelen van verzoekschriften van burgers;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.f
    text: het schorsings- en vernietigingsbeleid van besluiten op het gebied van het openbaar bestuur;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:2.2.g
    text: het coördineren van het vernietigingsbeleid voor de gehele rijksdienst.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel62
  - number: 6:3.1
    text: De afdeling Financiële Organisatie Binnenlands Bestuur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:3.2.a
    text: |-
      het zorgdragen voor de beleidsontwikkeling betreffende een adequate financiële verhouding tussen rijk en
      medeoverheden, waaronder de omvang en verdeling van het gemeente- en provinciefonds;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:3.2.b
    text: het mede zorgdragen voor de opstelling en uitvoering gemeente- en provinciefonds;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:3.2.c
    text: het zorgdragen voor de beleidsontwikkeling betreffende het financiële toezicht op medeoverheden;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:3.2.d
    text: |-
      het zorgdragen voor de beleidsontwikkeling betreffende het algemene beleids- en beheersinstrumentarium financiële
      organisatie voor medeoverheden, inclusief de accountantscontrole en de financieringsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:3.2.e
    text: het zorgdragen voor de beleidsontwikkeling betreffende belastingen en heffingen van medeoverheden.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel63
  - number: 6:4.1
    text: De afdeling Inspectie Financiën Lokale en Provinciale Overheden staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
  - number: 6:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
  - number: 6:4.2.a
    text: |-
      het instellen van onderzoeken en uitbrengen van adviezen op het gebied van de financiën
      van de individuele medeoverheden, in het bijzonder de behandeling van verzoeken van
      gemeenten en toepassing van [artikel 12 van de Financiële-verhoudingswet][ref1],
      de [artikelen 79][ref2] en [82 van de Wet bodembescherming][ref3],
      [artikel 3 van het Besluit rijksbijdragen bijstands- en bestrijdingskosten][ref4] en het
      [Bijdragenbesluit kosten ruiming explosieven Tweede Wereldooorlog 1999][ref5] alsmede het op verzoek van gemeenten
      samen met de desbetreffende provincie uitvoeren van begrotingsscans;


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0013371#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0010700
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: '82'
      - id: ref4
        bwb_id: BWBR0013371
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0010700
  - number: 6:4.2.b
    text: |-
      het zorgdragen voor het financieel toezicht op provincies en toezicht voortvloeiend uit de
      [Wet gemeenschappelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 6:4.2.c
    text: |-
      het bevorderen van de naleving van de Europese wet- en regelgeving door de medeoverheden, in het bijzonder op de
      relevante terreinen van het mededingings- en subsidiebeleid (onder meer staatssteun, aanbestedingen en Europese
      subsidies);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
  - number: 6:4.2.d
    text: |-
      het vergroten van kennis over Europese wet- en regelgeving op de relevante terreinen van het mededingings- en
      subsidiebeleid (onder meer staatssteun, aanbestedingen en Europese subsidies) bij medeoverheden door middel van het
      geven van voorlichting en advies;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
  - number: 6:4.2.e
    text: |-
      het doorgeleiden van staatssteunmeldingen aan de Europese Commissie (Coördinatiepunt staatssteun) en het meewerken
      aan procedures betreffende staatssteun van de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
  - number: 6:4.2.f
    text: |-
      het signaleren van de financiële gevolgen voor de medeoverheden van Europese wet- en regelgeving, in het bijzonder
      op de relevante terreinen van het mededingings- en subsidiebeleid (onder meer staatssteun, aanbestedingen en
      Europese subsidies).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel64
  - number: 7:1
    text: 'De directie Coördinatie Internationaal Beleid bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel71
  - number: 7:1.a
    text: de afdeling Europese Unie (EU);
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel71
  - number: 7:1.b
    text: de afdeling Internationale Zaken (IZ).
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel71
  - number: 7:2.1
    text: De afdeling Europese Unie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel72
  - number: 7:2.2
    text: |-
      De afdeling heeft tot taak het uitvoeren van de taken van de directie voor zover gelegen op het terrein van de
      Europese Unie, meer in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel72
  - number: 7:2.2.a
    text: |-
      het verzorgen van een adequate inbreng van het ministerie in het EU-besluitvormingsproces via de beschikbare intra-
      en interdepartementale structuren;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel72
  - number: 7:2.2.b
    text: het verzorgen van de intradepartementale informatie-uitwisseling over onderwerpen betreffende de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel72
  - number: 7:2.2.c
    text: het behartigen van algemene en dienstoverstijgende onderwerpen op het terrein van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel72
  - number: 7:3.1
    text: De afdeling Internationale Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel73
  - number: 7:3.2
    text: |-
      De afdeling heeft tot taak het uitvoeren van de taken van de directie voor zover niet gelegen op het terrein van de
      Europese Unie, meer in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel73
  - number: 7:3.2.a
    text: |-
      het verzorgen van een adequate inbreng van het ministerie in besluitvormingsprocessen van andere internationale
      organisaties dan de Europese Unie via de beschikbare intra- en interdepartementale structuren;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel73
  - number: 7:3.2.b
    text: |-
      het verzorgen van de intradepartementale informatie-uitwisseling over onderwerpen betreffende internationale
      vraagstukken;
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel73
  - number: 7:3.2.c
    text: het behartigen van algemene en dienstoverstijgende onderwerpen op het terrein van internationale vraagstukken.
    url: https://wetten.overheid.nl/BWBR0017933/2006-01-01#Artikel73
