  - number: '11'
    text: |-
      Tot de taak van de in dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan
      vermeld, in opdracht van de Minister, de secretaris-generaal of de directeur-generaal, voor zover hogere wet- en
      regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0020524/2007-10-01#Artikel11
  - number: '12.1'
    text: |-
      1 De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0020524/2007-10-01#Artikel12.1
  - number: '12.2'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0020524/2007-10-01#Artikel12.2
  - number: '13.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0020524/2007-10-01#Artikel13.1
  - number: '13.2'
    text: |-
      Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Koninkrijksrelaties en Bestuur
