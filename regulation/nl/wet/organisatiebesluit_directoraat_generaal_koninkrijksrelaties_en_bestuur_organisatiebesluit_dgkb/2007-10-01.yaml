  - number: '9.1'
    text: |-
      De Vertegenwoordiging van Nederland in de Nederlandse Antillen bestaat uit:

      a. de vestiging te Willemstad, Curaçao (VNW);

      b. de vestiging te Philipsburg, Sint Maarten (VNP).
    url: https://wetten.overheid.nl/BWBR0020524/2007-10-01#Artikel9.1
  - number: '9.2'
    text: |-
      1 De vestiging te Willemstad, Curaçao, staat onder leiding van de Vertegenwoordiger.

      2 [Artikel 3.34, tweede lid, van het Organisatiebesluit BZK 2004][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017563#Artikel334
    url: https://wetten.overheid.nl/BWBR0020524/2007-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0017563
        artikel: 3:34
  - number: '9.3'
    text: |-
      1 De vestiging te Philipsburg, Sint Maarten staat onder leiding van een hoofd. Het hoofd rapporteert aan de
      Vertegenwoordiger te Willemstad, Curaçao.

      2 [Artikel 3.34, tweede lid, van het Organisatiebesluit BZK 2004][ref1] is van toepassing.


