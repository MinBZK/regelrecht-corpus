  - number: 4:3.2
    text: |-
      De sectie draagt, met inachtneming van [artikel 3:24, tweede lid, van het Organisatiebesluit BZK 2003][ref1], zorg
      voor de documentaire informatievoorziening van de leiding.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel3
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel43
    references:
