  - number: 12:1
    text: |-
      De Vertegenwoordiging van Nederland in de Nederlandse Antillen bestaat uit: - de vestiging te Willemstad, Curaçao
      (VNW);
        - de vestiging te Philipsburg, Sint Maarten (VNP).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel121
  - number: 12:2.1
    text: |-
      De vestiging te Willemstad, Curaçao, staat onder leiding van de Vertegenwoordiger en de plaatsvervangend
      Vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel122
  - number: 12:2.2
    text: |-
      [Artikel 3:32, tweede lid, van het Organisatiebesluit BZK 2003][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel3
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0015590
        artikel: '3'
  - number: 12:3.1
    text: |-
      De vestiging te Philipsburg, Sint Maarten staat onder leiding van een hoofd. Het hoofd rapporteert aan de
      Vertegenwoordiger te Willemstad, Curaçao.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel123
  - number: 12:3.2
    text: |-
