    text: |-
      In dit besluit wordt verstaan onder: - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties.
        - de directeur-generaal: de directeur-generaal Koninkrijksrelaties en Bestuur.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel1
