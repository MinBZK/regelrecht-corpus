    text: |-
      Het stafbureau Openbaar Bestuur bestaat uit de volgende onderdelen: - Algemene Zaken (A);
        - Documentaire Informatievoorziening (DI);
        - Financiën (F);
        - Personeelszaken (P).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel41
  - number: 4:2.1
    text: De sectie Algemene Zaken staat onder leiding van het hoofd stafbureau.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel42
  - number: 4:2.2
    text: |-
      De sectie heeft, met inachtneming van [artikel 3:24, tweede lid, van het Organisatiebesluit BZK 2003][ref1], tot
      taak de directe advisering en ondersteuning van de leiding.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel3
