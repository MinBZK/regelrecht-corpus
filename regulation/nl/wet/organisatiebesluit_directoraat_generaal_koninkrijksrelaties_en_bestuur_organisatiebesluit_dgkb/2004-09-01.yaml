  - number: '5.1'
    text: |-
      De directie Koninkrijksrelaties bestaat uit de volgende onderdelen: - de afdeling Koninkrijksverhoudingen (KV);
        - de afdeling Samenwerkingsbeleid (SB).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel5.1
  - number: 5:2.1
    text: De afdeling Koninkrijksverhoudingen staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel52
  - number: 5:2.2
    text: 'De afdeling heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel52
  - number: 5:2.2.a)
    text: interdepartementale en internationale coördinatie;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel52
  - number: 5:2.2.b)
    text: coördinatie van de samenwerking met de Koninkrijkspartners op het terrein van de rechtshandhaving;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel52
  - number: 5:2.2.c)
    text: voorbereiding parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel52
  - number: 5:2.2.d)
    text: coördinatie bij het opstellen van hoofdstuk IV van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel52
  - number: 5:3.1
    text: De afdeling Samenwerkingsbeleid staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel53
  - number: 5:3.2
    text: 'De afdeling heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel53
  - number: 5:3.2.a)
    text: |-
      ontwikkelen van het beleid ten aanzien van de samenwerking met de koninkrijkspartners op het terrein van
      bestuurlijke ontwikkeling, onderwijs en duurzame economische ontwikkeling en non-gouvernementele organisaties;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel53
  - number: 5:3.2.b)
    text: |-
      ontwikkelen van het beleid ten aanzien van het op afstand zetten van de ontwikkelingssamenwerking door middel van
      het oprichten van onafhankelijke ontwikkelingsfondsen;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel53
  - number: 5:3.2.c)
    text: beleidsadvisering op het terrein van de openbare financiën.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel53
  - number: 6:1
    text: |-
      De directie Grote Stedenbeleid en Interbestuurlijke betrekkingen bestaat uit de volgende onderdelen: - de afdeling
      Grotestedenbeleid (GSB);
        - de afdeling Interbestuurlijke Betrekkingen (IB);
        - het project Grotestedenbeleid III (project GSB III).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel61
  - number: 6:2.1
    text: De afdeling Grotestedenbeleid staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel62
  - number: 6:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel62
  - number: 6:2.2.a)
    text: |-
      het coördineren en doorontwikkelen van het grotestedenbeleid mede op basis van de toezeggingen in de
      stadsconvenanten, in nauw overleg met de steden en ministeries;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel62
  - number: 6:2.2.b)
    text: het nemen van initiatieven om samenhangend rijksbeleid verder te ontwikkelen en bij te sturen;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel62
  - number: 6:2.2.c)
    text: |-
      het beoordelen van voornemens van de diverse ministeries op hun verenigbaarheid met de doelstellingen van het
      grotestedenbeleid;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel62
  - number: 6:2.2.d)
    text: |-
      het periodiek onderzoeken en analyseren van de voortgang van de uitvoering van stedelijke
      meerjarenontwikkelingsprogramma’s en de afspraken met steden.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel62
  - number: 6:3.1
    text: De afdeling Interbestuurlijke betrekkingen staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2.a
    text: het zorgdragen voor goede bestuurlijke arrangementen;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2.b
    text: het signaleren van ontwikkelingen die van belang zijn voor de bestuurlijke verhoudingen;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2.c
    text: het faciliteren van processen die de bestuurlijke samenwerking bevorderen;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2.d
    text: het zorgdragen voor de regiocontracten;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2.e
    text: het ontwikkelen van concepten voor bestuurlijke arrangementen die aansluiten op veranderingen in de samenleving;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:3.2.f
    text: |-
      het beoordelen van voornemens van de diverse ministeries op hun gevolgen voor het openbaar bestuur en in het
      bijzonder gemeenten en provincies.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel63
  - number: 6:4.1
    text: |-
      Het project Grotestedenbeleid III staat onder leiding van een projectleider en een plaatsvervangend projectleider.
      Het project is tijdelijk ingesteld en heeft als einddatum 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2
    text: 'Het project heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2.a)
    text: het optimaliseren van de doelstellingen en instrumenten van het grotestedenbeleid;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2.b)
    text: het opstellen van de verlengingsafspraken 2004;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2.c)
    text: het opstellen van het Beleidskader GSB III;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2.d)
    text: bundeling en ontschotting van regelingen;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2.e)
    text: integreren van de monitors;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 6:4.2.f)
    text: het afsluiten van de nieuwe convenanten (2005–2009).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel64
  - number: 7:1
    text: |-
      De directie Bestuurlijke en Financiële Organisatie bestaat uit de volgende onderdelen: - de afdeling Bestuur en
      Wetgeving (BW);
        - de afdeling Financiële Organisatie Binnenlands Bestuur (FO);
        - de afdeling Inspectie Financiën Lokale en provinciale Overheden (IFLO).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel71
  - number: 7:2.1
    text: De afdeling Bestuur en Wetgeving staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:2.2.a)
    text: |-
      het ontwikkelen en uitvoeren van het beleid en wetgeving met betrekking tot de organisatie, de kwaliteit en het
      functioneren van het binnenlands bestuur (dualisering van het gemeentelijk en provinciaal bestuur, vormgeving van
      het bestuur in stedelijke gebieden, intergemeentelijke samenwerking, gemeentelijke en provinciale herindeling,
      grensoverschrijdende samenwerking met België en Duitsland, financiën van politieke partijen, bestuurlijke
      handhaving van gestelde regels, zorg voor de materiële rechtspositie van gekozen en benoemde politieke
      ambtsdragers);
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:2.2.b)
    text: beleid en wetgeving inzake lijkbezorging, streektalen en talen van minderheden;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:2.2.c)
    text: het behandelen van verzoekschriften van burgers;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:2.2.d)
    text: het schorsings- en vernietigingsbeleid van besluiten op het gebied van het openbaar bestuur;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:2.2.e)
    text: het coördineren van het vernietigingsbeleid voor de gehele rijksdienst.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel72
  - number: 7:3.1
    text: |-
      De afdeling Financiële Organisatie Binnenlands Bestuur staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:3.2.a)
    text: |-
      het zorgdragen voor de beleidsontwikkeling en wetgeving betreffende een adequate financiële verhouding tussen rijk
      en mede-overheden, waaronder de omvang en verdeling van het gemeente- en provinciefonds;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:3.2.b)
    text: het mede zorgdragen voor de opstelling en uitvoering gemeente- en provinciefonds;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:3.2.c)
    text: het zorgdragen voor de beleidsontwikkeling en wetgeving betreffende het financiële toezicht op mede-overheden;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:3.2.d)
    text: |-
      het zorgdragen voor de beleidsontwikkeling en wetgeving betreffende het algemene beleids- en beheersinstrumentarium
      financiële organisatie voor mede-overheden, inclusief de accountantscontrole en de financieringsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:3.2.e)
    text: het zorgdragen voor de beleidsontwikkeling en wetgeving betreffende belastingen en heffingen van mede-overheden.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel73
  - number: 7:4.1
    text: |-
      De afdeling Inspectie Financiën Lokale en provinciale Overheden staat onder leiding van een hoofd en een
      plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel74
  - number: 7:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel74
  - number: 7:4.2.a)
    text: |-
      het instellen van onderzoeken en uitbrengen van adviezen op het gebied van de financiën
      van de individuele mede-overheden, in het bijzonder van gemeenten die een beroep doen op
      [artikel 12 van de Financiële-verhoudingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
  - number: 7:4.2.b)
    text: |-
      het zorgdragen voor het financieel toezicht op provincies en toezicht voortvloeiend uit de
      [Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 7:4.2.c)
    text: Het functioneren als coördinatiepunt staatssteun voor medeoverheden.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel74
  - number: 8:1
    text: |-
      De directie Coördinatie Internationaal Beleid bestaat uit de volgende onderdelen: - de afdeling Europese Unie (EU);
        - de afdeling Internationale Zaken (IZ).
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel81
  - number: 8:2.1
    text: De afdeling Europese Unie staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel82
  - number: 8:2.2
    text: |-
      De afdeling heeft tot taak het uit voeren van de taken van de directie voor zover gelegen op het terrein van de
      Europese Unie, meer in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel82
  - number: 8:2.2.a)
    text: |-
      het verzorgen van een adequate inbreng van het ministerie in het EU‑besluitvormingsproces via de beschikbare intra-
      en interdepartementale structuren;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel82
  - number: 8:2.2.b)
    text: het verzorgen van de intradepartementale informatie-uitwisseling over onderwerpen betreffende de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel82
  - number: 8:2.2.c)
    text: het behartigen van algemene en dienstoverstijgende onderwerpen op het terrein van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel82
  - number: 8:3.1
    text: De afdeling Internationale Zaken staat onder leiding van een hoofd en een plaatsvervangend hoofd.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel83
  - number: 8:3.2
    text: |-
      De afdeling heeft tot taak het uitvoeren van de taken van de directie voor zover niet gelegen op het terrein van de
      Europese Unie, meer in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel83
  - number: 8:3.2.a)
    text: |-
      het verzorgen van een adequate inbreng van het ministerie in besluitvormingsprocessen van andere internationale
      organisaties dan de Europese Unie via de beschikbare intra- en interdepartementale structuren;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel83
  - number: 8:3.2.b)
    text: |-
      het verzorgen van de intradepartementale informatie-uitwisseling over onderwerpen betreffende internationale
      vraagstukken;
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel83
  - number: 8:3.2.c)
    text: het behartigen van algemene en dienstoverstijgende onderwerpen op het terrein van internationale vraagstukken.
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel83
  - number: '9'
    text: |-
