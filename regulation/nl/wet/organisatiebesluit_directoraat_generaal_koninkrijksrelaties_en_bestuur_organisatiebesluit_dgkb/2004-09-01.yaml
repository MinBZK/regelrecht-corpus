      taak het coördineren van de begrotingsvoorbereiding, uitvoering en verantwoording van de leiding.


      [ref1]: https://wetten.overheid.nl/BWBR0015590#Artikel3
    url: https://wetten.overheid.nl/BWBR0015589/2004-09-01#Artikel44
