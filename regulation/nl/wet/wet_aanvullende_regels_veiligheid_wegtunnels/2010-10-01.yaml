bwb_id: BWBR0019516
url: https://wetten.overheid.nl/BWBR0019516/2010-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 2004/54/EG van het Europees Parlement en
    de Raad van de Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese
    wegennet (PbEU L 167, gerectificeerd in PbEU L 201), noodzakelijk is regels te stellen voor het bereiken van een
    minimaal veiligheidsniveau van tunnels in het trans-Europese wegennet, en dat het wenselijk is in aanvulling op
    deze richtlijn regels te stellen ten aanzien van de veiligheid van deze en andere wegtunnels;

    Dat het voorts wenselijk is dat de werkzaamheden van de beoogde Commissie voor de tunnelveiligheid zich mede
    uitstrekken tot andere tunnels dan wegtunnels;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel1
  - number: 1.a
    text: |-
      richtlijn: [richtlijn nr. 2004/54/EG](32004L0054) van het Europees Parlement en de Raad van de Europese Unie van 29
      april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese wegennet (PbEU L 167, gerectificeerd
      bij PbEU L 201);
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel1
  - number: 1.c
    text: |-
      bevoegd college van burgemeester en wethouders: het college van burgemeester en wethouders van de gemeente waarin
      een tunnel geheel of in hoofdzaak is of zal zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel1
  - number: 1.d
    text: |-
      hulpverleningsdiensten: de politie, de brandweer en de GHOR, bedoeld in
      [artikel 1 van de Wet veiligheidsregio’s][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel1
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '1'
  - number: 1.e
    text: |-
      bouwen: hetgeen onder bouwen wordt verstaan in [artikel 1, eerste lid, onderdeel a, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op tunnels, langer dan 250 meter, uitsluitend dan wel mede bestemd voor motorrijtuigen
      als bedoeld in [artikel 1, eerste lid, onder c, van de Wegenverkeerswet 1994][ref1]. De lengte van de tunnel wordt
      bepaald door het langste omsloten gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '2.2'
    text: |-
      Bij besluit van Onze Minister kan het bepaalde bij of krachtens deze wet of het bepaalde ten aanzien
      van de veiligheid van tunnels bij of krachtens de [Woningwet][ref1] uit het oogpunt van veiligheid
      geheel of gedeeltelijk van toepassing worden verklaard op met een tunnel vergelijkbare bouwwerken
      boven of bij een weg die uitsluitend dan wel mede bestemd is voor motorrijtuigen als bedoeld in
      [artikel 1, eerste lid, onder c, van de Wegenverkeerswet 1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '3.1'
    text: |-
      Er is een Commissie voor de tunnelveiligheid die tot taak heeft in de bij of krachtens deze wet of de
      [Woningwet][ref1] aangegeven gevallen desgevraagd advies uit te brengen aan de tunnelbeheerder over de veiligheid
      van een tunnel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de samenstelling en de
      werkwijze van de Commissie voor de tunnelveiligheid.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel3
  - number: '4.1'
    text: |-
      Indien een tunnel op het grondgebied van meer dan één gemeente ligt of zal liggen, oefent het bevoegd college van
      burgemeester en wethouders zijn bevoegdheden, gegeven bij of krachtens deze wet of de [Woningwet][ref1], uit in
      overeenstemming met het college van burgemeester en wethouders van die andere gemeente, dan wel met de colleges van
      burgemeester en wethouders van die andere gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '4.2'
    text: |-
      Indien een tunnel de landsgrens overschrijdt of zal overschrijden, oefent het bevoegd college van burgemeester en
      wethouders zijn bevoegdheden, gegeven bij of krachtens deze wet of de [Woningwet][ref1], ten aanzien van het deel
      van de tunnel dat in Nederland is gelegen uit in overeenstemming met het bestuursorgaan dat bevoegd is ten aanzien
      van het niet in Nederland gelegen deel van de tunnel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '5.1'
    text: |-
      Voor elke tunnel, alsmede voor elke tunnel ten aanzien waarvan de bouw overwogen wordt of die in aanbouw is, is er
      één tunnelbeheerder en één veiligheidsbeambte.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel5
  - number: '5.2'
    text: |-
      De tunnelbeheerder is verantwoordelijk voor het beheer van de tunnel. De beheerder van de weg voor zover die in de
      tunnel ligt of zal liggen, of een andere rechtspersoon aan wie het wegbeheer voor de in de tunnel gelegen weg is
      of zal worden opgedragen, is tunnelbeheerder. Bij ministeriële regeling worden nadere regels gesteld met betrekking
      tot de taken van de tunnelbeheerder.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel5
  - number: '5.3'
    text: |-
      De veiligheidsbeambte wordt aangesteld door de tunnelbeheerder, nadat het bevoegd college van burgemeester
      en wethouders met deze aanstelling heeft ingestemd. De veiligheidsbeambte coördineert voor de organisatie
      van de tunnelbeheerder alle preventieve en veiligheidsmaatregelen ter verzekering van de veiligheid van de
      tunnelgebruikers en het tunnelpersoneel. De veiligheidsbeambte is voor de uitoefening van de bij of krachtens deze
      wet aan hem opgedragen taken onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel5
  - number: '5.4'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de taken van de veiligheidsbeambte.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel5
  - number: '6.1'
    text: |-
      In geval overwogen wordt een tunnel te bouwen laat de tunnelbeheerder een risicoanalyse uitvoeren ten aanzien van
      het tracé van de tunnel, alternatieve tracés en mogelijke alternatieven voor een tunnel, alsmede een risicoanalyse
      ten aanzien van het ontwerp van de tunnel. In geval overwogen wordt een tunnel dan wel het gebruik van een tunnel
      te veranderen, laat de tunnelbeheerder een risicoanalyse uitvoeren ten aanzien van het ontwerp van deze verandering
      of ten aanzien van het voornemen tot het veranderen van het gebruik. De risicoanalyse wordt uitgevoerd door een
      onafhankelijke deskundige. Bij ministeriële regeling worden regels gesteld ten aanzien van de methode voor het
      uitvoeren van de risicoanalyse en de aspecten die in ieder geval bij de risicoanalyse worden betrokken.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel6
  - number: '6.2'
    text: |-
      In geval overwogen wordt een tunnel te bouwen of het gebruik te veranderen, stelt de tunnelbeheerder na overleg met
      de veiligheidsbeambte een tunnelveiligheidsplan op waarin alle veiligheidsaspecten die een rol spelen bij de keuze
      van de locatie, het ontwerp en het beoogde gebruik, worden afgewogen. De risicoanalyses, bedoeld in het eerste
      lid, maken daarvan onderdeel uit. Bij ministeriële regeling worden nadere regels gesteld ten aanzien van de vorm en
      inhoud van het tunnelveiligheidsplan.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel6
  - number: '6.3'
    text: |-
      De tunnelbeheerder vraagt advies aan de Commissie, bedoeld in [artikel 3][ref1], over:


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel3
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '3'
        hoofdstuk: '1'
  - number: 6.3.a
    text: het tunnelveiligheidsplan; en
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel6
  - number: 6.3.b
    text: |-
      het bouwplan waarvoor een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] zal worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '6.4'
    text: |-
      In afwijking van [artikel 2, eerste lid, eerste volzin][ref1], is het derde lid van overeenkomstige toepassing ten
      aanzien van tunnels, langer dan 250 meter, bestemd voor verkeer over spoorstaven of geleiderails.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel2
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '2'
        hoofdstuk: '1'
  - number: '7'
    text: |-
      Voor de openstelling van een tunnel stelt de tunnelbeheerder na overleg met de veiligheidsbeambte en de
      burgemeester van de gemeente of van elk van de gemeenten waarin de tunnel is gelegen een veiligheidsbeheerplan
      op. Het plan omvat ten minste de organisatie van het tunnelbeheer, de afstemming van dit beheer met de
      hulpverleningsdiensten, de verkeersbegeleiding, de instandhoudingsactiviteiten en de bestrijding van rampen of
      andere gebeurtenissen in of bij een tunnel die een mensenleven, het milieu of de tunnel in gevaar kunnen brengen.
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de inhoud van het veiligheidsbeheerplan.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel7
  - number: '8.1'
    text: 'Het is verboden een tunnel voor het verkeer:'
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel8
  - number: 8.1.a
    text: |-
      na het bouwen open te stellen zonder daartoe strekkende vergunning van het bevoegd college van burgemeester en
      wethouders;
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel8
  - number: 8.1.b
    text: |-
      in gebruik te hebben zonder of in afwijking van het veiligheidsbeheerplan, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel7
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '7'
        hoofdstuk: '1'
  - number: '8.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden bij een aanvraag om vergunning, bedoeld in het
      eerste lid, verstrekt, onderscheidenlijk overgelegd, worden.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel8
  - number: '8.3'
    text: |-
      Aan de vergunning, bedoeld in het eerste lid, worden geen voorschriften verbonden. Zij wordt niet onder beperkingen
      verleend.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel8
  - number: '8.4'
    text: |-
      De vergunning, bedoeld in het eerste lid, kan slechts en moet geweigerd worden indien met betrekking tot de
      onderhavige tunnel niet voldaan wordt aan het bepaalde bij of krachtens deze wet of het bepaalde ten aanzien van de
      veiligheid van tunnels bij of krachtens de [Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '9'
    text: |-
      De tunnelbeheerder en de hulpverleningsdiensten houden in samenwerking met de veiligheidsbeambte gemeenschappelijke
      oefeningen voor het tunnelpersoneel en die diensten. De tunnelbeheerder stelt daartoe in overleg met de
      veiligheidsbeambte en de betrokken hulpverleningsdiensten een oefenprogramma op. Bij ministeriële regeling worden
      regels gesteld over de oefenfrequentie en kunnen regels worden gesteld met betrekking tot het oefenen.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel9
  - number: '10'
    text: |-
      De tunnelbeheerder draagt zorg voor een actueel tunnelveiligheidsdossier. Bij ministeriële regeling worden regels
      gesteld met betrekking tot inhoud van dit dossier, het aanleveren van gegevens en bescheiden door derden aan de
      tunnelbeheerder en het door hem ter inzage geven van het dossier of delen daarvan.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel10
  - number: '11.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      bevoegd college van burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel11
  - number: '11.2'
    text: |-
      Het bevoegd college van burgemeester en wethouders draagt er zorg voor dat elke tunnel ten minste eenmaal in de
      zes jaar wordt onderzocht ten einde vast te stellen of voldaan wordt aan de van toepassing zijnde bepalingen.
      Het college zendt de resultaten van dit onderzoek onverwijld naar de tunnelbeheerder, de veiligheidsbeambte, Onze
      Minister en Onze Minister voor Wonen, Wijken en Integratie en geeft daarbij aan welke maatregelen naar zijn oordeel
      genomen moeten worden om de gebleken tekortkomingen weg te nemen.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel11
  - number: '11.3'
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens deze wet of het bepaalde ten aanzien van de veiligheid
      van tunnels bij of krachtens de [Woningwet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 11.3.a
    text: |-
      doet het bevoegd college van burgemeester en wethouders daarvan onverwijld mededeling aan de tunnelbeheerder, de
      veiligheidsbeambte, Onze Minister en Onze Minister voor Wonen, Wijken en Integratie;
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel11
  - number: 11.3.b
    text: |-
      kan het bevoegd college van burgemeester en wethouders de vergunning, bedoeld in [artikel 8, eerste lid][ref1],
      intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel8
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '8'
        hoofdstuk: '1'
  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van de veiligheid nadere regels gegeven met
      betrekking tot het voornemen een tunnel te bouwen, het bouwen en het in gebruik nemen en hebben van tunnels, voor
      zover deze regels niet zijn gegeven bij of krachtens de [Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '16'
    text: |-
      Indien voor 2 mei 2006 een aanvraag om bouwvergunning met betrekking tot een tunnel is ingediend en de
      desbetreffende vergunning nog niet is verleend, wordt deze aanvraag beoordeeld overeenkomstig het bepaalde bij of
      krachtens deze wet en het bepaalde bij of krachtens de [Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '17'
    text: |-
      Ten aanzien van tunnels ten behoeve waarvan de bouwvergunning voor 2 mei 2006 is verleend maar die op 1 mei 2006
      nog niet voor het openbaar verkeer opengesteld zijn, beoordeelt het bevoegd college van burgemeester en wethouders
      of voldaan wordt aan het bepaalde bij of krachtens deze wet, of het bepaalde bij of krachtens de [Woningwet][ref1]
      met betrekking tot tunnels. Indien het bevoegd college van burgemeester en wethouders van oordeel is dat hieraan
      niet wordt voldaan, stelt hij de tunnelbeheerder en de veiligheidsbeambte in kennis van de te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '18.1'
    text: |-
      Indien een tunnel voor 1 mei 2006 voor het openbare verkeer opengesteld is of opengesteld geweest is, beoordeelt
      het bevoegd college van burgemeester en wethouders voor 31 oktober 2006 of voldaan wordt aan het bepaalde bij of
      krachtens deze wet, of het bepaalde bij of krachtens de [Woningwet][ref1] met betrekking tot de veiligheidseisen
      voor tunnels. Indien het bevoegd college van burgemeester en wethouders van oordeel is dat hieraan niet wordt
      voldaan, stelt hij de tunnelbeheerder en de veiligheidsbeambte in kennis van de te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '18.2'
    text: |-
      Maatregelen ten aanzien van tunnels, bedoeld in het eerste lid, die nodig zijn om te voldoen aan het bepaalde bij
      of krachtens deze wet, of het bepaalde bij of krachtens de [Woningwet][ref1] met betrekking tot de veiligheidseisen
      voor tunnels, worden genomen voor 1 mei 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet aanvullende regels veiligheid wegtunnels.'
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel19
  - number: '20'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019516/2010-10-01#Artikel20
