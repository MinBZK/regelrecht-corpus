  - number: 1.h
    text: |-
      Trans-Europees wegennet: bij ministeriële regeling aan te wijzen wegennet als bedoeld in richtlijn nr. 2004/54/EG
      van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor
      tunnels in het trans-Europese wegennet (PbEU L 167, gerectificeerd bij PbEU L 201).
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op tunnels, langer dan 250 meter. De lengte van de tunnel wordt bepaald door het langst
      omsloten gedeelte.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij besluit van Onze Minister kan het bepaalde bij of krachtens deze wet of het bepaalde ten aanzien
      van de veiligheid van tunnels bij of krachtens de [Omgevingswet][ref1] uit het oogpunt van veiligheid
      geheel of gedeeltelijk van toepassing worden verklaard op met een tunnel vergelijkbare bouwwerken
      boven of bij een weg die uitsluitend dan wel mede bestemd is voor motorrijtuigen als bedoeld in
      [artikel 1, eerste lid, onder c, van de Wegenverkeerswet 1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '4.1'
    text: |-
      Indien een tunnel op het grondgebied van meer dan één gemeente ligt of zal liggen, oefent het bevoegd college van
      burgemeester en wethouders zijn bevoegdheden, gegeven bij of krachtens deze wet of de [Omgevingswet][ref1], uit in
      overeenstemming met het college van burgemeester en wethouders van die andere gemeente, dan wel met de colleges van
      burgemeester en wethouders van die andere gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '4.2'
    text: |-
      Indien een tunnel de landsgrens overschrijdt of zal overschrijden, oefent het bevoegd college van burgemeester en
      wethouders zijn bevoegdheden, gegeven bij of krachtens deze wet of de [Omgevingswet][ref1], ten aanzien van het
      deel van de tunnel dat in Nederland is gelegen uit in overeenstemming met het bestuursorgaan dat bevoegd is ten
      aanzien van het niet in Nederland gelegen deel van de tunnel.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '5.1'
    text: |-
      Voor elke tunnel, alsmede voor elke tunnel ten aanzien waarvan de bouw overwogen wordt of die in aanbouw is, is er
      één tunnelbeheerder en één veiligheidsbeambte.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      De tunnelbeheerder is verantwoordelijk voor het beheer van de tunnel. De beheerder van de weg voor zover die in de
      tunnel ligt of zal liggen, of een andere rechtspersoon aan wie het wegbeheer voor de in de tunnel gelegen weg is
      of zal worden opgedragen, is tunnelbeheerder. Bij ministeriële regeling worden nadere regels gesteld met betrekking
      tot de taken van de tunnelbeheerder.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      De veiligheidsbeambte wordt aangewezen door de tunnelbeheerder, nadat het bevoegd college van burgemeester en
      wethouders met deze aanwijzing heeft ingestemd. De aanwijzing eindigt van rechtswege met ingang van de datum
      dat de uitoefening van de functie van veiligheidsbeambte geen onderdeel meer uitmaakt van de werkzaamheden
      van de betreffende ambtenaar. De veiligheidsbeambte coördineert voor de organisatie van de tunnelbeheerder
      alle preventieve en veiligheidsmaatregelen ter verzekering van de veiligheid van de tunnelgebruikers en het
      tunnelpersoneel. De veiligheidsbeambte is voor de uitoefening van de bij of krachtens deze wet aan hem opgedragen
      taken onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien de tunnelbeheerder afwijkt van een advies van de veiligheidsbeambte gegeven krachtens deze wet, maakt de
      tunnelbeheerder zijn gemotiveerde afwijking van dat advies openbaar.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel5
  - number: '5.5'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de taken van de veiligheidsbeambte.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      De kans op slachtoffers in de tunnel is blijkens een risicoanalyse niet groter dan 0,1/N2 per kilometer tunnelbuis
      per jaar. Waarbij «N» het aantal dodelijke slachtoffers onder de weggebruikers per incident is en waarbij dat
      aantal 10 of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      De uitvoerder van de risicoanalyse, bedoeld in het eerste lid, is in functioneel opzicht onafhankelijk van de
      tunnelbeheerder.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6
  - number: '6.3'
    text: De risicoanalyse, bedoeld in het eerste lid, geschiedt volgens een bij ministeriële regeling vastgestelde methode.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6
  - number: '6.4'
    text: |-
      De tunnelbeheerder vraagt advies aan de veiligheidsbeambte over het bouwplan voor een bouwactiviteit als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder a, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 6a.1
    text: |-
      Bij regeling van Onze Minister worden een of meer gestandaardiseerde uitrustingen vastgesteld die verschillen naar
      type gebruik of naar type ontwerp van de tunnel.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6a
  - number: 6a.2
    text: |-
      Een gestandaardiseerde uitrusting als bedoeld in het eerste lid wordt vastgesteld in overeenstemming met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie en:
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6a
  - number: 6a.2.a
    text: |-
      indien uit een risicoanalyse, bedoeld in [artikel 6, derde lid][ref1], blijkt dat bij toepassing van de
      gestandaardiseerde uitrusting in een tunnel met de fysieke kenmerken van de opengestelde of in aanbouw zijnde
      tunnels, aan de in artikel 6, eerste lid, genoemde norm wordt voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 6a.2.b
    text: |-
      nadat het Veiligheidsberaad, bedoeld in [artikel 1 van de Wet veiligheidsregio’s][ref1], in de gelegenheid is
      gesteld daarover advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel1
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '1'
  - number: 6a.3
    text: |-
      Onze Minister evalueert de gestandaardiseerde uitrustingen binnen vijf jaar na de inwerkingtreding van de wet
      van ... tot wijziging van de Wet aanvullende regels veiligheid wegtunnels in verband met het vaststellen van een
      veiligheidsnorm en het stellen van regels omtrent het gebruik van gestandaardiseerde uitrustingen en in verband
      met wijzigingen in het totstandkomingsproces van wegtunnels (Stb. ...), en vervolgens telkens na vijf jaar. Indien
      de evaluatie daar aanleiding toe geeft, past Onze Minister de gestandaardiseerde uitrustingen aan en stelt hij de
      Tweede Kamer der Staten-Generaal van deze aanpassing in kennis.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6a
  - number: 6b.1
    text: |-
      De tunnelbeheerder past in de tunnel een krachtens [artikel 6a, eerste lid][ref1], vastgestelde gestandaardiseerde
      uitrusting toe.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6a
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6a
        hoofdstuk: '1'
  - number: 6b.2
    text: |-
      Indien overwogen wordt een tunnel te bouwen, laat de tunnelbeheerder een risicoanalyse als bedoeld in
      [artikel 6, derde lid][ref1], uitvoeren ten aanzien van de tunnel zoals bij het vaststellen van het tracé voorzien
      wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 6b.3
    text: |-
      De tunnelbeheerder kan van de gestandaardiseerde uitrusting, als bedoeld in het eerste lid, uitsluitend afwijken
      indien:
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.3.a
    text: |-
      dit noodzakelijk is om aan de in [artikel 6, eerste lid][ref1], genoemde norm te voldoen, en


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 6b.3.b
    text: de tunnelbeheerder daarover advies heeft ingewonnen bij de veiligheidsbeambte, en
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.3.c
    text: |-
      daarmee ten minste de zelfde mate van veiligheid wordt geboden als is beoogd met de betrokken gestandaardiseerde
      uitrusting of onderdelen daarvan, of
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.3.d
    text: |-
      toepassing wordt gegeven aan artikel 3, tweede lid, of artikel 14 van Richtlijn 2004/54 van het Europees Parlement
      en de Raad van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese wegennet.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.4
    text: |-
      De tunnelbeheerder kiest de toe te passen gestandaardiseerde uitrusting, als bedoeld in het eerste lid,
      voorafgaand:
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.4.a
    text: |-
      aan de vaststelling van het projectbesluit, bedoeld in [afdeling 5.2 van de Omgevingswet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 6b.4.b
    text: aan de vaststelling van een omgevingsplan of een wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.5
    text: |-
      Indien de tunnelbeheerder op grond van het derde lid afwijkt van de gestandaardiseerde uitrusting, maakt de
      tunnelbeheerder de keuze over de toe te passen uitrusting voorafgaand:
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.5.a
    text: |-
      aan de vaststelling van het projectbesluit, bedoeld in [afdeling 5.2 van de Omgevingswet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 6b.5.b
    text: aan de vaststelling van een omgevingsplan of een wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6b.6
    text: |-
      De keuze voor de toe te passen uitrusting, bedoeld in het vierde lid, onderdeel a, of de keuze voor de toe te
      passen uitrusting, bedoeld in het vijfde lid, onderdeel a, wordt gemaakt in overeenstemming met het bevoegd college
      van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6b
  - number: 6c.1
    text: |-
      De tunnelbeheerder stelt, na overleg met de veiligheidsbeambte, een tunnelveiligheidsplan op waarin alle
      veiligheidsaspecten die een rol spelen bij de keuze van de locatie, het ontwerp en het beoogde gebruik, worden
      afgewogen. De risicoanalyse bedoeld in [artikel 6, derde lid][ref1], maakt daarvan onderdeel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 6c.2
    text: |-
      Het tunnelveiligheidsplan wordt vastgesteld voorafgaand aan de vaststelling van het projectbesluit, bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1], of voorafgaand aan de vaststelling van een omgevingsplan of van een
      wijziging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 6c.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van de vorm en de inhoud van het
      tunnelveiligheidsplan.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6c
  - number: 6d.1
    text: |-
      Indien overwogen wordt de constructie, de voorzieningen of het gebruik van een tunnel wezenlijk te wijzigen, laat
      de tunnelbeheerder een risicoanalyse als bedoeld in [artikel 6, derde lid][ref1], uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 6d.2
    text: |-
      Een wezenlijke wijziging van een tunnel vindt uitsluitend plaats indien uit de risicoanalyse, bedoeld in het eerste
      lid, blijkt dat het risico niet groter is dan de veiligheidsnorm, genoemd in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 6d.3
    text: |-
      [Artikel 6b, zesde lid][ref1], is van overeenkomstige toepassing op de keuze van de uitrusting die met de
      wezenlijke wijziging samenhangt.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6b
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6b
        hoofdstuk: '1'
  - number: '7.1'
    text: |-
      Voor de openstelling van een tunnel stelt de tunnelbeheerder na overleg met de veiligheidsbeambte en de
      burgemeester van de gemeente of van elk van de gemeenten waarin de tunnel is gelegen een veiligheidsbeheerplan
      op. Het plan omvat ten minste de organisatie van het tunnelbeheer, de afstemming van dit beheer met de
      hulpverleningsdiensten, de verkeersbegeleiding, de instandhoudingsactiviteiten en de bestrijding van rampen of
      andere gebeurtenissen in of bij een tunnel die een mensenleven, het milieu of de tunnel in gevaar kunnen brengen.
      Het plan omvat tevens een analyse van scenario’s van ongevallen. Bij ministeriële regeling worden nadere regels
      gesteld met betrekking tot de inhoud van het veiligheidsbeheerplan en wordt de methode voor het uitvoeren van de
      analyse van scenario’s van ongevallen vastgesteld. De in de derde volzin bedoelde analyse kan, met redenen omkleed,
      achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      Voor de openstelling van een tunnel na een wezenlijke wijziging van de constructie, de voorzieningen dan wel
      het gebruik van de tunnel, past de tunnelbeheerder, na overleg met de veiligheidsbeambte en de burgemeester
      van de gemeente of van elk van de gemeenten waarin de tunnel is gelegen, het in het eerste lid bedoelde
      veiligheidsbeheerplan, voor zover noodzakelijk, aan die veranderde situatie aan.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het is verboden een tunnel voor het verkeer open te stellen zonder daartoe strekkende vergunning van het bevoegd
      college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden bij een aanvraag om vergunning, bedoeld in het
      eerste lid, verstrekt, onderscheidenlijk overgelegd, worden.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
  - number: '8.3'
    text: |-
      Aan de vergunning, bedoeld in het eerste lid, worden geen voorschriften verbonden. Zij wordt niet onder beperkingen
      verleend.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
  - number: '8.4'
    text: |-
      In afwijking van het derde lid, kan de vergunning, bedoeld in het eerste lid, worden verleend onder de
      voorwaarde dat onvolkomenheden in de uitvoering van de gekozen gestandaardiseerde uitrusting, bedoeld in
      [artikel 6b, vierde lid][ref1], of in de uitvoering van de gekozen voorzieningen op grond van artikel 6b, derde
      lid, binnen een door het bevoegd gezag te bepalen termijn zijn hersteld, mits de tunnel ondanks de onvolkomenheden
      voldoet aan de in [artikel 6, eerste lid][ref2], genoemde norm.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6b
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: '8.5'
    text: 'De vergunning, bedoeld in het eerste lid, wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
  - number: 8.5.a
    text: |-
      de uitrusting van de tunnel niet is uitgevoerd overeenkomstig de krachtens [artikel 6b, vierde lid][ref1], gekozen
      gestandaardiseerde uitrusting of niet is uitgevoerd volgens de uitrusting die is gekozen op grond van artikel 6b,
      derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6b
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6b
        hoofdstuk: '1'
  - number: 8.5.b
    text: de tunnel niet voldoet aan het overige bepaalde bij of krachtens deze wet, of
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
  - number: 8.5.c
    text: |-
      de tunnel niet voldoet aan het bepaalde ten aanzien van de veiligheid van tunnels bij of krachtens de
      [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '8.6'
    text: |-
      [Afdeling 3.5 van de Algemene wet bestuursrecht][ref1] en [artikel 16.87 van de Omgevingswet][ref2] zijn van
      toepassing op een vergunning als bedoeld in het eerste lid voor een tunnel die onderdeel uitmaakt van een
      projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 8a.1
    text: |-
      Het is verboden een tunnel na een wezenlijke wijziging van de constructie, de voorzieningen dan wel het gebruik
      van de tunnel voor het verkeer open te stellen zonder daartoe strekkende vergunning van het bevoegd college van
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8a
  - number: 8a.2
    text: |-
      [Artikel 8, tweede, derde, vierde en vijfde lid, onderdelen b en c][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel8
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '8'
        hoofdstuk: '1'
  - number: 8b
    text: |-
      Het is verboden een tunnel voor het verkeer in gebruik te hebben zonder of in afwijking van het
      veiligheidsbeheerplan, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel7
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '7'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      De tunnelbeheerder en de hulpverleningsdiensten houden in samenwerking met de veiligheidsbeambte gemeenschappelijke
      oefeningen voor het tunnelpersoneel en die diensten. De tunnelbeheerder stelt daartoe in overleg met de
      veiligheidsbeambte en de betrokken hulpverleningsdiensten een oefenprogramma op. Bij ministeriële regeling worden
      regels gesteld over de oefenfrequentie en kunnen regels worden gesteld met betrekking tot het oefenen.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel9
  - number: '10'
    text: |-
      De tunnelbeheerder draagt zorg voor een actueel tunnelveiligheidsdossier. Bij ministeriële regeling worden regels
      gesteld met betrekking tot inhoud van dit dossier, het aanleveren van gegevens en bescheiden door derden aan de
      tunnelbeheerder en het door hem ter inzage geven van het dossier of delen daarvan.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      bevoegd college van burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het bevoegd college van burgemeester en wethouders draagt er zorg voor dat elke tunnel ten minste eenmaal in de
      zes jaar wordt onderzocht ten einde vast te stellen of voldaan wordt aan de van toepassing zijnde bepalingen.
      Het college zendt de resultaten van dit onderzoek onverwijld naar de tunnelbeheerder, de veiligheidsbeambte, Onze
      Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en geeft daarbij aan welke maatregelen naar
      zijn oordeel genomen moeten worden om de gebleken tekortkomingen weg te nemen.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel11
  - number: '11.3'
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens deze wet of het bepaalde ten aanzien van de veiligheid
      van tunnels bij of krachtens de [Omgevingswet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 11.3.a
    text: |-
      doet het bevoegd college van burgemeester en wethouders daarvan onverwijld mededeling aan de tunnelbeheerder, de
      veiligheidsbeambte, Onze Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel11
  - number: 11.3.b
    text: |-
      kan het bevoegd college van burgemeester en wethouders de vergunning, bedoeld in [artikel 8, eerste lid][ref1],
      intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel8
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '8'
        hoofdstuk: '1'
  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van de veiligheid nadere regels gegeven met
      betrekking tot het voornemen een tunnel te bouwen, het bouwen en het in gebruik nemen en hebben van tunnels, voor
      zover deze regels niet zijn gegeven bij of krachtens de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '16'
    text: |-
      Indien voor 2 mei 2006 een aanvraag om bouwvergunning met betrekking tot een tunnel is ingediend en de
      desbetreffende vergunning nog niet is verleend, wordt deze aanvraag beoordeeld overeenkomstig het bepaalde bij of
      krachtens deze wet en het bepaalde bij of krachtens de [Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '17'
    text: |-
      Ten aanzien van tunnels ten behoeve waarvan de bouwvergunning voor 2 mei 2006 is verleend maar die op 1 mei 2006
      nog niet voor het openbaar verkeer opengesteld zijn, beoordeelt het bevoegd college van burgemeester en wethouders
      of voldaan wordt aan het bepaalde bij of krachtens deze wet, of het bepaalde bij of krachtens de [Woningwet][ref1]
      met betrekking tot tunnels. Indien het bevoegd college van burgemeester en wethouders van oordeel is dat hieraan
      niet wordt voldaan, stelt hij de tunnelbeheerder en de veiligheidsbeambte in kennis van de te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '18.1'
    text: |-
      Maatregelen ten aanzien van tunnels die voor 1 mei 2006 voor het openbare verkeer opengesteld zijn of opengesteld
      geweest zijn, die nodig zijn om te voldoen aan het bepaalde bij of krachtens deze wet of het bepaalde bij of
      krachtens de Woningwet met betrekking tot de veiligheidseisen voor tunnels, worden genomen:
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: 18.1.a
    text: |-
      voor tunnels in het Nederlands deel van het trans-Europees wegennet met een lengte van meer dan 500 meter: voor
      1 mei 2014;
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: 18.1.b
    text: 'voor andere dan de in onderdeel a bedoelde tunnels: voor 1 mei 2019.'
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      Maatregelen ten aanzien van tunnels, die voor 1 juli 2013 voor het openbare verkeer opengesteld zijn of opengesteld
      geweest zijn, die nodig zijn om te voldoen aan het bepaalde bij of krachtens deze wet, of die nodig zijn om te
      voldoen aan de norm, genoemd in [artikel 6, eerste lid][ref1], worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
  - number: 18.2.a
    text: |-
      voor tunnels in het Nederlands deel van het trans-Europees wegennet met een lengte van meer dan 500 meter: voor
      1 mei 2014;
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: 18.2.b
    text: 'voor andere dan de in onderdeel a bedoelde tunnels: voor 1 mei 2019.'
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: '18.3'
    text: |-
      De [artikelen 6b][ref1] en [8, vijfde lid, onderdeel a][ref2], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0019516#Artikel8
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6b
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0019516
        artikel: '8'
        hoofdstuk: '1'
  - number: 18.3.a
    text: |-
      tunnels waarvoor op 1 juli 2013 reeds een tracébesluit als bedoeld in [artikel 9 van de Tracéwet][ref1] is genomen
      of waarvoor een bestemmingsplan of een wijziging van een bestemmingsplan is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel9
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '9'
  - number: 18.3.b
    text: tunnels die op 1 juli 2013 zijn opengesteld of opengesteld zijn geweest, of
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: 18.3.c
    text: tunnels die niet in beheer zijn bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18
  - number: 18a
    text: |-
      Een door de Commissie voor de tunnelveiligheid afgegeven advies overeenkomstig [artikel 6, derde lid][ref1], zoals
      dit luidde voor inwerkingtreding van deze wet, blijft onderdeel uitmaken van het tunnelveiligheidsdossier, genoemd
      in [artikel 10][ref2], voor zover het advies verenigbaar is met deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019516#Artikel10
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0019516
        artikel: '10'
        hoofdstuk: '1'
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet aanvullende regels veiligheid wegtunnels.'
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel19
  - number: '20'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#Artikel20
