preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 2004/54/EG van het Europees Parlement en
    de Raad van de Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het trans-Europese
    wegennet (PbEU L 167, gerectificeerd in PbEU L 201), noodzakelijk is regels te stellen voor het bereiken van een
    minimaal veiligheidsniveau van tunnels in het trans-Europese wegennet, en dat het wenselijk is in aanvulling op
    deze richtlijn regels te stellen ten aanzien van de veiligheid van deze en andere wegtunnels;

    Dat het voorts wenselijk is dat de werkzaamheden van de beoogde Commissie voor de tunnelveiligheid zich mede
    uitstrekken tot andere tunnels dan wegtunnels;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019516/2024-01-01#ArtikelAanhef
