  text: |-
    Gelet op de artikelen 1a, tweede lid, 17a, vierde lid en 20, vijfde lid van de Werkloosheidswet, en artikel 1a,
    tweede lid van de Wet werk en inkomen naar arbeidsvermogen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032545/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Met een arbeidsuur als bedoeld in [artikel 1a van de Werkloosheidswet][ref1] en
      [artikel 1a van de Wet werk en inkomen naar arbeidsvermogen][ref2] wordt gelijkgesteld een uur, gedurende een
      dienstbetrekking of daaruit voortvloeiend, waarover de werknemer geen inkomen uit arbeid heeft ontvangen, maar:

      a. als gevolg van vakantie-, snipper-, of compensatieverlofdagen, hij een schadeloosstelling wegens loonderving of
      vakantiebonnen heeft ontvangen of hij daarmee overeenkomende aanspraken heeft ontvangen of verkregen;

      b. hij als gevolg van feestdagen, een schadeloosstelling wegens loonderving heeft ontvangen;

      c. hij een schadeloosstelling of vergoeding wegens het beëindigen van de dienstbetrekking heeft ontvangen;

      d. dit het gevolg is van werktijdverkorting waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3] ontheffing is verleend;

      e. waarover hij een uitkering op grond van een vorstuitkeringsreglement dan wel een uitkering op grond van
      [artikel 18 van de Werkloosheidswet][ref4] heeft ontvangen;

      f. waarover hij recht op uitkering heeft op grond van [hoofdstuk IV van de Werkloosheidswet][ref5];

      g. dit het gevolg is van ziekte of arbeidsongeschiktheid;

      h. dit het gevolg is van een verplichte bedrijfssluiting en waarvoor de werknemer geen loon of inkomsten wegens
      loonderving dan wel vakantiebonnen of daarmee overeenkomende aanspraken heeft ontvangen of verkregen;

      i. waarover hij een uitkering heeft ontvangen op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref6].


