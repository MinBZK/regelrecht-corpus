  - number: '7'
    text: |-
      Kalenderweken waarin de werknemer geen arbeidsuren heeft ten gevolge van ploegendienst of vanwege andere vormen van
      werkroosters worden gelijkgesteld met kalenderweken waarin de werknemer tenminste één arbeidsuur heeft.
    url: https://wetten.overheid.nl/BWBR0032545/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 Indien de werknemer meer dan één recht op uitkering op grond van de [Werkloosheidswet][ref1] heeft en zich een
      omstandigheid als bedoeld in [artikel 20, eerste lid, onderdelen a en b, van de Werkloosheidswet][ref2], voordoet,
      worden voor de toepassing van het tweede, derde en vierde lid van dat artikel de uitkeringsrechten beëindigd in de
      volgorde waarin zij zijn ontstaan.

      2 Het UWV neemt, in afwijking van het eerste lid, een andere volgorde in acht, indien de toepassing van dat lid tot
      een kennelijk onjuiste uitkomst leidt.

      3 In de situatie, bedoeld in het tweede lid, wordt voor de vaststelling van de volgorde, waarin de
      uitkeringsrechten worden beëindigd, uitgegaan van een samenhang tussen de werkloosheidssituaties en de reden van
      beëindiging van het recht op uitkering.

      4 Een samenhang als bedoeld in het derde lid wordt vastgesteld aan de hand van:

      a. het beroep of de beroepen van de werknemer;

      b. de bedrijfstak of bedrijfstakken waarin de werknemer werkzaam is;

      c. het aantal verloren arbeidsuren en het aantal arbeidsuren waarmee het uitkeringsrecht moet worden beëindigd;

      d. de hoogte van het loon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0032545/2013-01-01#Artikel8
