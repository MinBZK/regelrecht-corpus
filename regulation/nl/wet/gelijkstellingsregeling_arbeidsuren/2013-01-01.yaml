  - number: '2'
    text: |-
      1 Heeft de werknemer inkomsten ontvangen als bedoeld in [artikel 1, onderdeel c][ref1], dan wordt voor
      de vaststelling van uren die worden gelijkgesteld met arbeidsuren een bedrag aan inkomsten in aanmerking
      genomen tot aan het bedrag aan loon dat de werknemer zou hebben ontvangen indien de dienstbetrekking
      door opzegging met inachtneming van de rechtens geldende termijn zou zijn geëindigd. Onder inkomsten als
      bedoeld in de eerste zin wordt niet verstaan een door de rechter toegewezen vergoeding van proceskosten.
      Onder de rechtens geldende termijn, bedoeld in de eerste zin, wordt verstaan de termijn die de
      werkgever of de werknemer op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref2], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref3] of een overeenkomstige bepaling van
      een soortgelijke regeling ieder voor zich bij opzegging in acht behoort te nemen. In geval de dienstbetrekking is
      geëindigd met wederzijds goedvinden wordt onder de rechtens geldende termijn, bedoeld in de eerste zin, verstaan
      de termijn die de werkgever op grond van artikel 672 van Boek 7 van het Burgerlijk Wetboek, de artikelen 94 tot
      en met 97 van het Algemeen Rijksambtenarenreglement of een overeenkomstige bepaling van een soortgelijke regeling
      bij opzegging in acht behoort te nemen. Het in de eerste zin bedoelde bedrag wordt toegerekend aan de periode
      onmiddellijk volgend op de laatste dag van de dienstbetrekking, waarbij:

      a. indien de dienstbetrekking is geëindigd door ontbinding als datum waarop de dienstbetrekking geacht wordt te
      zijn opgezegd de datum geldt van de beschikking tot ontbinding; of

      b. indien de dienstbetrekking is geëindigd met wederzijds goedvinden als datum waarop de dienstbetrekking geacht
      wordt te zijn opgezegd de datum geldt waarop de beëindiging schriftelijk is overeengekomen, dan wel, bij gebrek aan
      een schriftelijke beëindigingsovereenkomst, de laatste dag van de dienstbetrekking.

      2 Het aantal uren dat met arbeidsuren wordt gelijkgesteld, wordt vastgesteld door het bedrag dat wordt toegerekend
      aan de periode onmiddellijk volgend op de laatste dag van de dienstbetrekking te delen door het voor de werknemer
      laatstelijk geldende uurloon dan wel indien de werknemer niet tegen een overeengekomen uurloon werkzaam was,
      te delen door een door UWV vast te stellen bedrag per uur dat daarvoor redelijkerwijs in aanmerking komt. Het
      berekende aantal uren wordt toegerekend aan dezelfde periode als waaraan het bedrag in de eerste volzin wordt
      toegerekend.

      3 Het eerste lid vindt geen toepassing indien de werkgever na het einde van de dienstbetrekking in een toestand
      verkeert als bedoeld in [artikel 61 van de Werkloosheidswet][ref4] en voor zover de werknemer als gevolg van die
      toestand het in het eerste lid bedoelde inkomsten niet ontvangt.


