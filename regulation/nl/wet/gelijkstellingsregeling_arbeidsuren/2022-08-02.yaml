  - number: '4'
    text: |-
      1 Indien de berekening van het aantal arbeidsuren, bedoeld in
      [artikel 16, tweede lid, van de Werkloosheidswet][ref1] ten aanzien van de werknemer, die in ploegendienst of
      volgens andere vormen van werkroosters arbeidsuren heeft gehad dan wel als gevolg van een bepaalde wijze van
      invulling van arbeidsduurverkorting, geen juist beeld geeft van dat arbeidspatroon, kan het UWV:

      a. uren waarop de werknemer geen arbeidsuren had, gelijkstellen met arbeidsuren; of

      b. arbeidsuren buiten beschouwing laten; of

      c. zowel uren waarop de werknemer geen arbeidsuren had, gelijkstellen met arbeidsuren als arbeidsuren beschouwing
      laten.

      2 Voor de toepassing van het eerste lid wordt de arbeidsduurverkorting geacht gelijkelijk te zijn verspreid over
      een periode van een kalenderjaar. Indien de werknemer in een kalenderweek meer uren arbeidsduurverkorting heeft
      genoten dan het op jaarbasis vastgesteld gemiddeld aantal per week, wordt het verschil voor de toepassing van het
      eerste lid gelijkgesteld met arbeidsuren. Indien de werknemer in een kalenderweek minder uren arbeidsduurverkorting
      heeft genoten dan het op jaarbasis vastgesteld gemiddeld aantal per week, wordt het verschil voor de toepassing van
      het eerste lid buiten beschouwing gelaten.

      3 Het eerste lid is van overeenkomstige toepassing indien voor de berekening van het aantal arbeidsuren, bedoeld in
      [artikel 16, tweede lid, van de Werkloosheidswet][ref2], uren waarin de werknemer niet heeft gewerkt als gevolg van
      compensatieverlofdagen op grond van [artikel 1][ref3] zijn gelijkgesteld met arbeidsuren.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
