  - number: '3'
    text: |-
      1 Indien de periode van ziekte of arbeidsongeschiktheid dan wel de periode waarover een uitkering als bedoeld in
      [artikel 1, onderdeel h][ref1], is ontvangen, gelet op het arbeidspatroon van de werknemer, aansluit op een periode
      waarin de werknemer arbeidsuren had, is het aantal uren dat op grond van artikel 1, onderdeel f respectievelijk h,
      gelijkgesteld wordt, gelijk aan:

      a. het aantal arbeidsuren dat de werknemer zou hebben gehad indien hij niet ziek of arbeidsongeschikt zou zijn
      geworden dan wel zich geen situatie zou hebben voorgedaan op grond waarvan hij recht heeft op een uitkering als
      bedoeld in [artikel 1, onderdeel h][ref2], en hij een vast aantal arbeidsuren had; of

      b. het gemiddeld aantal arbeidsuren dat de werknemer zou hebben gehad indien hij niet ziek of arbeidsongeschikt zou
      zijn geworden dan wel zich geen situatie zou hebben voorgedaan op grond waarvan hij recht heeft op een uitkering
      als bedoeld in het [artikel 1, onderdeel h][ref3], en hij geen aantal vaste arbeidsuren had.

      2 Het gemiddeld aantal arbeidsuren, bedoeld in het eerste lid, onderdeel b, wordt berekend over de periode, bedoeld
      in [artikel 16, tweede lid, van de Werkloosheidswet][ref4], met dien verstande dat buiten aanmerking blijven de in
      die periode gelegen uren, waarop hij ten gevolge van ziekte of arbeidsongeschiktheid dan wel de situatie op grond
      waarvan hij recht heeft op een uitkering als bedoeld in [artikel 1, onderdeel h][ref5], niet werkzaam was.


