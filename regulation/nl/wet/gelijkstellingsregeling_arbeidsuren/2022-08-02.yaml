  - number: '5'
    text: |-
      Indien de werknemer arbeidsuren heeft die voortvloeien uit een dienstbetrekking zonder hiervoor te werken en hij
      die omstandigheid benut om arbeidsuren te hebben die voortvloeien uit een andere dienstbetrekking, dan worden de
      arbeidsuren die voortvloeien uit die andere dienstbetrekking niet beschouwd als arbeidsuren.
    url: https://wetten.overheid.nl/BWBR0032545/2022-08-02#Artikel5
  - number: '6'
    text: |-
      1 Voor de vaststelling van het aantal kalenderweken, bedoeld in [artikel 17 van de Werkloosheidswet][ref1], worden
      kalenderweken meer dan één keer in aanmerking genomen indien:

      a. zich tijdens een recht op uitkering opnieuw werkloosheid als bedoeld in
      [artikel 16, eerste lid, van de Werkloosheidswet][ref2] voordoet; of

      b. een recht op uitkering is geëindigd en zich vervolgens opnieuw werkloosheid als bedoeld in
      [artikel 16, eerste lid, van de Werkloosheidswet][ref3] voordoet, voor zover op dat moment het totale verlies van
      arbeidsuren groter is dan het verlies van arbeidsuren op het moment, waarop het eerstgenoemde recht is ontstaan.

      2 Het eerste lid is niet van toepassing in gevallen waarin het recht op uitkering is geëindigd en zich vervolgens
      opnieuw werkloosheid als bedoeld in [artikel 16, eerste lid, van de Werkloosheidswet][ref4] voordoet, indien:

      a. de werknemer op het moment, waarop het geëindigde recht ontstond, al zijn arbeidsuren in dienstbetrekking had
      verloren; of

      b. het aantal resterende arbeidsuren in dienstbetrekking op het moment waarop zich opnieuw werkloosheid voordoet,
      gelijk is aan, dan wel groter is dan het aantal resterende arbeidsuren in dienstbetrekking op het moment waarop het
      geëindigde recht ontstond.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
