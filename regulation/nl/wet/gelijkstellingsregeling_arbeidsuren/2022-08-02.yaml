      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0032545/2022-08-02#Artikel6
