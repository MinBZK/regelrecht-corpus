    text: |-
      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens [de artikelen 3, eerste en vierde lid, ][ref1][4, tweede lid][ref2],
      [5, eerste lid, tweede volzin, aanhef en onderdelen b en c, en derde lid][ref3],
      [5a, eerste en vierde lid][ref4], [6, tweede lid][ref5], [6a, eerste en derde lid][ref6], [6b][ref7],
      [6c, tweede lid][ref8], [7, eerste, derde, vierde en zevende lid][ref9], [10, tweede lid][ref10],
      [11, eerste en tweede lid][ref11], [11a, eerste tot en met vijfde lid][ref12], [12, tweede en vierde lid][ref13],
      [13, eerste lid, tweede volzin, vijfde lid, zesde lid, eerste volzin, zevende en negende lid][ref14],
      [14, eerste en vierde lid][ref15], [15, tweede lid][ref16], [15a, eerste, tweede en derde lid][ref17],
      [15b, eerste en tweede lid][ref18], [16, eerste, zevende, achtste en tiende tot en met twaalfde lid][ref19],
      [17, eerste lid][ref20], [18, tweede lid][ref21], [18a, eerste lid][ref22], [18b, tweede lid][ref23],
      [19, derde lid][ref24], [21, zesde lid][ref25], [22, eerste, derde en vijfde lid][ref26],
      [23][ref27], [24, eerste en derde lid][ref28], [26a, eerste, vijfde, zesde en negende lid][ref29],
      [28, derde en zesde lid, onder a][ref30], [28c, tweede, derde en vierde lid][ref31],
      [28a, tweede en vierde lid][ref32], [29, tweede en derde lid][ref33], voor zover het betreft het voorschrift
      van [artikel 5:20 van de Algemene wet bestuursrecht][ref34] en het voorschrift inzage te verlenen
      in zakelijke gegevens en bescheiden, [29a, tweede en vierde volzin][ref35], [36, tweede lid][ref36],
      [37, tweede lid][ref37], [39, derde lid][ref38], voor zover het betreft het voorschrift op grond van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref39] inzage te verlenen in zakelijke gegevens en bescheiden,
      [46, eerste, derde en negende lid][ref40], [46a, eerste en tweede lid][ref41], [46b, eerste lid][ref42],
