  - number: '40'
    text: |-
      1 Taken en bevoegdheden die Onze Minister op grond van deze wet heeft, kunnen, met uitzondering van
      de taken en bevoegdheden, bedoeld in de [artikelen 8][ref1], [10][ref2], [18][ref3], [22][ref4],
      [25][ref5], [26][ref6], [26a][ref7], [27][ref8], [28a, vierde lid][ref9], [41][ref10], [42][ref11],
      [45][ref12], [46b, derde lid, onder c, en vijfde lid][ref13], 46d, [48a][ref14], [48b, derde lid][ref15],
      [48c, derde lid][ref16], en [48m, tweede lid][ref17], en met uitzondering van het verlenen van een vrijstelling als
      bedoeld in de [artikelen 4][ref18], [5][ref19], [5a][ref20], [6c][ref21] en [18b][ref22], bij algemene maatregel
      van bestuur worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze
      wet jegens Onze Minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.

      2 Een overdracht als bedoeld in het eerste lid vindt slechts plaats indien de betrokken rechtspersoon aan de
      volgende vereisten voldoet:

      a. hij dient in staat te zijn de in het eerste lid bedoelde taken en bevoegdheden naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taken en bevoegdheden zoveel mogelijk is gewaarborgd;

      c. de statuten van de rechtspersoon dienen te bepalen dat de benoeming, de schorsing en het ontslag van de
      bestuurders van de rechtspersoon geschiedt door Onze Minister.

      3 Aan de overdracht, bedoeld in het eerste lid, kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.

      4 Onze Minister kan aan een rechtspersoon als bedoeld in het eerste lid voorschriften geven ter uitvoering van
      richtlijnen inzake het effectenverkeer van de Raad van de Europese Unie dan wel van het Europees Parlement en de
      Raad van de Europese Unie gezamenlijk.

      5 De rechtspersoon of rechtspersonen brengt onderscheidenlijk brengen eenmaal per jaar, uiterlijk op 1 mei, verslag
      uit aan Onze Minister over de uitoefening van de overgedragen taken en bevoegdheden in het voorgaande kalenderjaar.
      Dit verslag wordt door de zorg van Onze Minister openbaar gemaakt, met dien verstande dat gegevens met betrekking
      tot afzonderlijke ondernemingen en instellingen niet openbaar worden gemaakt zonder hun schriftelijke toestemming.

      6 Indien ingevolge het eerste lid taken en bevoegdheden zijn overgedragen aan een of meer rechtspersonen, kan of
      kunnen deze worden gehoord alvorens:

      a. een erkenning als bedoeld in [artikel 22][ref23] wordt verleend of ingetrokken;

      b. voorschriften als bedoeld in [de artikelen 24, tweede lid][ref24], en [27, tweede lid][ref25], worden gegeven;

      c. een ontheffing als bedoeld in [artikel 25][ref26] wordt verleend of ingetrokken;

      d. een verklaring van geen bezwaar als bedoeld in [artikel 26a][ref27] wordt verleend, gewijzigd of ingetrokken;

      e. een termijn als bedoeld in [artikel 45, vierde lid][ref28], wordt bepaald.

      7 De rechtspersoon aan wie een advies als bedoeld in het zesde lid wordt gevraagd, is verplicht dit advies uit
      te brengen.

      8 De rechtspersoon of rechtspersonen verstrekt onderscheidenlijk verstrekken Onze Minister desgevraagd de
      inlichtingen die nodig zijn voor de beoordeling van de uitvoerbaarheid van voorgenomen wettelijke voorschriften en
      algemene beleidsvoornemens, voor zover deze betrekking hebben op het effectenverkeer.


