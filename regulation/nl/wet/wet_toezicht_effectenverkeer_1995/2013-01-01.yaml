    text: |-
      Geen effecten in de zin van deze wet zijn:

      a. waarden die uitsluitend het karakter van betaalmiddel dragen;

      b. appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0007657/2013-01-01#Artikel2
  - number: '28'
    text: |-
      1 Indien Onze Minister vaststelt dat een instelling waarvan effecten zijn aangeboden of zullen worden
      aangeboden, degene die deze effecten aanbiedt, een bieder, bestuurder, commissaris of functionaris
      als bedoeld in [artikel 6a, derde lid][ref1], een effecteninstelling, niet zijnde een instelling
      als bedoeld in [artikel 7, tweede lid, onder h, i of j][ref2], of een instelling als bedoeld in
      [artikel 18a, eerste lid][ref3], de bij of krachtens de [artikelen 3, eerste en vierde lid][ref4], [4][ref5],
      [5 eerste lid, tweede volzin, aanhef en onderdelen b en c, en derde lid][ref6], [5a, eerste en vierde lid][ref7],
      [6a, tweede en derde lid][ref8], [6b][ref9], [11, eerste lid][ref10], [18a, eerste lid][ref11],
      [18b, tweede lid][ref12], onderscheidenlijk de in [hoofdstuk XII][ref13] gestelde regels niet naleeft, vestigt hij
      daarop de aandacht van de betrokkene.

      2 Zonodig doet Onze Minister de mededeling, bedoeld in het eerste lid, vergezeld gaan van dan wel volgen door een
      aanwijzing om ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen met het oog op een
      adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.

      3 Degene tot wie de in het tweede lid bedoelde aanwijzing is gericht volgt deze aanwijzing op binnen een door Onze
      Minister te bepalen termijn.

