      [ref10]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
      [ref11]: https://wetten.overheid.nl/BWBR0007657#Artikel18b
      [ref12]: https://wetten.overheid.nl/BWBR0007657#Artikel47
