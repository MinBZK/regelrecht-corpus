  - number: '2'
    text: |-
      Geen effecten in de zin van deze wet zijn:

      a. waarden die uitsluitend het karakter van betaalmiddel dragen;

      b. appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden in Nederland bij algemene maatregel van bestuur aan te wijzen effecten aan te bieden, tenzij ter
      zake van de aanbieding een prospectus algemeen verkrijgbaar is dat is goedgekeurd door Onze Minister of door een
      toezichthoudende autoriteit in een andere lidstaat. Bij of krachtens algemene maatregel van bestuur worden regels
      gesteld met betrekking tot de aanbieding.

      2 Onze Minister keurt een prospectus goed indien het voldoet aan bij algemene maatregel van bestuur te stellen
      regels.

      3 Onze Minister kan in bij algemene maatregel van bestuur aan te wijzen gevallen het prospectus ter zake van een
      aanbieding van effecten in een andere lidstaat goedkeuren. Het eerste lid, tweede volzin, en het tweede lid zijn
      van overeenkomstige toepassing.

      4 Het is verboden in of vanuit Nederland andere dan de in het eerste lid bedoelde effecten aan te bieden dan wel
      een zodanig aanbieding door middel van advertenties of documenten in het vooruitzicht te stellen, tenzij:

      a. ter zake van de aanbieding een prospectus verkrijgbaar is dat voldoet aan bij of krachtens algemene maatregel
      van bestuur te stellen regels; of

      b. ter zake van de aanbieding dan wel de in het vooruitzicht gestelde aanbieding wordt voldaan aan bij of krachtens
      algemene maatregel van bestuur te stellen regels.

      5 Het eerste tot en met het vierde lid zijn niet van toepassing indien de aan te bieden
      effecten rechten van deelneming betreffen in een beleggingsinstelling, als bedoeld in
      [artikel 1, onderdeel c van de Wet toezicht belegginginstellingen][ref1], die op verzoek van de houder ten laste
      van de activa direct of indirect worden ingekocht of terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: 3a
    text: |-
      1 Onze Minister maakt na ontvangst van een aanvraag van goedkeuring zijn besluit omtrent de goedkeuring binnen een
      termijn van tien werkdagen bekend aan de aanvrager.

      2 De in het eerste lid bedoelde termijn bedraagt ten hoogste twintig werkdagen indien sprake is van een aanbieding
      van effecten van een instelling waarvan nog geen effecten zijn aangeboden.

      3 Indien de door de aanvrager ingediende documenten onvolledig zijn of onder toepassing van artikel 3, derde
      alinea, 22, eerste lid, derde alinea, 23, eerste lid of derde lid, tweede alinea, van de prospectusverordening
      aanvullende informatie nodig is voor de beoordeling van het vermogen, de financiële positie, het resultaat of
      de vooruitzichten van de instelling of de aan de effecten verbonden rechten en plichten, stelt Onze Minister de
      aanvrager hiervan binnen de termijn, bedoeld in het eerste of, indien van toepassing, het tweede lid op de hoogte
      en stelt hij hem in de gelegenheid om de aanvraag aan te vullen. Indien de aanvrager niet binnen de gestelde
      termijn de aanvraag heeft aangevuld, kan Onze Minister besluiten de aanvraag niet verder te behandelen.

      4 Ingeval het derde lid, eerste volzin, wordt toegepast gaan de termijnen, bedoeld in het eerste en tweede lid,
      opnieuw in, te rekenen vanaf het tijdstip waarop de aanvrager de aanvullende informatie heeft verstrekt.

      5 [Artikel 4:5 van de Algemene wet bestuursrecht][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 3b
    text: |-
      1 Het verbod, bedoeld in [artikel 3, eerste lid][ref1], is van overeenkomstige toepassing op een aanbieding van
      effecten ter zake waarvan het prospectus overeenkomstig [artikel 3][ref2] is goedgekeurd, indien zich voorafgaand
      aan de afsluiting van de aanbieding van effecten een belangrijke nieuwe ontwikkeling, materiële vergissing of
      onjuistheid voordoet of door de aanvrager geconstateerd wordt die verband houdt met de informatie in het prospectus
      en van invloed kan zijn op de beoordeling van de aangeboden effecten, tenzij een document ter aanvulling van het
      prospectus door Onze Minister is goedgekeurd en algemeen verkrijgbaar is.

      2 Onze Minister keurt het in het eerste lid bedoelde aanvullende document goed indien wordt voldaan aan bij
      algemene maatregel van bestuur te stellen regels en maakt zijn besluit omtrent goedkeuring van dit document
      binnen een termijn van zeven werkdagen bekend aan de aanvrager. Het [vijfde lid van artikel 3a][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel3a
