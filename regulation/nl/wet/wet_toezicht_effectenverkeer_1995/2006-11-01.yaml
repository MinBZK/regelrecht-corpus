    text: |-
      1 De houder van een verklaring van geen bezwaar die is verleend op grond van [artikel 16, derde lid][ref1], waarvan
      tenminste één dochtermaatschappij een effecteninstelling is waaraan een vergunning is verleend als bedoeld in
      [artikel 7, eerste lid][ref2], houdt zich aan bij of krachtens algemene maatregel van bestuur te stellen regels
      om te voorkomen dat de handeling waarvoor de verklaring van geen bezwaar is verleend, zou leiden of zou kunnen
      leiden tot een invloed op de betrokken effecteninstelling die in strijd is met een gezonde, prudente of integere
      bedrijfsvoering van die instelling.

      2 De regels, die voor onderscheiden groepen houders verschillend kunnen zijn, kunnen uitsluitend betrekking hebben
      op financiële waarborgen, op te verstrekken gegevens en inlichtingen alsmede op de vorm waarin die gegevens en
      inlichtingen dienen te worden verstrekt. Artikel 16, tiende lid, is van overeenkomstige toepassing.

      3 Onze Minister verleent, op verzoek, ontheffing van de regels indien de houder van de verklaring van geen bezwaar
      aantoont dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze regels beogen te
      bereiken anderszins voldoende zijn bereikt.


