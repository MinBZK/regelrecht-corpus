  - number: 47e
    text: |-
      1 Een effecteninstelling of persoon als bedoeld in het tweede lid, die voor het publiek bestemde informatie
      als bedoeld in dat lid openbaar maakt, houdt zich aan bij algemene maatregel van bestuur te stellen regels met
      betrekking tot:

      a. het openbaar maken van de identiteit van degene die de in de aanhef bedoelde informatie heeft opgesteld of naar
      buiten brengt;

      b. het waarborgen dat de in de aanhef bedoelde informatie een juiste voorstelling van zaken biedt; en

      c. het openbaar maken van informatie waarvan redelijkerwijs mag worden aangenomen dat deze informatie afbreuk kan
      doen aan de objectiviteit van de in de aanhef bedoelde informatie.

      2 Het eerste lid is van toepassing op:

      a. effecteninstellingen die:

      1°. in of vanuit Nederland of een staat die geen lidstaat is voor het publiek bestemde informatie openbaar maken,
      waarin rechtstreeks of middellijk een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld
      in [artikel 46, eerste lid, onder a][ref1], of met betrekking tot een rechtspersoon, vennootschap of instelling die
      effecten als bedoeld in dat onderdeel heeft uitgegeven of zal uitgeven;

      2°. in of vanuit Nederland voor het publiek bestemde informatie openbaar maken, waarin rechtstreeks of
      middellijk een beleggingsaanbeveling wordt gedaan met betrekking tot effecten die zijn toegelaten tot de handel
      op een gereglementeerde markt die gelegen is of werkzaam is in een andere lid-staat, of met betrekking tot een
      rechtspersoon, vennootschap of instelling die deze effecten heeft uitgegeven of zal uitgeven;

      b. met een effecteninstelling, of met een persoon als bedoeld onder c, gelieerde rechtspersonen die:

      1°. in of vanuit Nederland of een staat die geen lidstaat is voor het publiek bestemde informatie openbaar
      maken waarin rechtstreeks een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in
      [artikel 46, eerste lid, onder a][ref2];

      2°. in of vanuit Nederland voor het publiek bestemde informatie openbaar maken, waarin rechtstreeks een
      beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in onderdeel a, onder 2°;

      c. personen, niet zijnde effecteninstellingen, wier hoofdactiviteit bestaat uit het:

      1°. in of vanuit Nederland of een staat die geen lidstaat is openbaar maken van voor het publiek bestemde
      informatie waarin rechtstreeks of middellijk een beleggingsaanbeveling wordt gedaan met betrekking tot effecten
      als bedoeld in [artikel 46, eerste lid, onder a][ref3], of met betrekking tot een rechtspersoon, vennootschap of
      instelling als bedoeld in onderdeel a, onder 1°;

      2°. in of vanuit Nederland openbaar maken van voor het publiek bestemde informatie waarin rechtstreeks of
      middellijk een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in onderdeel a, onder 2°,
      of met betrekking tot een rechtspersoon, vennootschap of instelling als bedoeld in onderdeel a, onder 2°;

      d. andere personen dan genoemd onder a tot en met c die in het kader van hun beroeps- of bedrijfsuitoefening:

      1°. in of vanuit Nederland of een staat die geen lidstaat is voor het publiek bestemde informatie openbaar
      maken, waarin rechtstreeks een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in
      [artikel 46, eerste lid, onder a][ref4];

      2°. in of vanuit Nederland voor het publiek bestemde informatie openbaar maken, waarin rechtstreeks een
      beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in onderdeel a, onder 2°;

      e. personen die in het kader van een arbeidsovereenkomst of anderszins, voor een persoon als bedoeld onder a of c,
      werkzaam zijn en als hoofdactiviteit:

      1°. in of vanuit Nederland of een staat die geen lidstaat is voor het publiek bestemde informatie openbaar maken,
      waarin rechtstreeks of middellijk een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld
      in [artikel 46, eerste lid, onder a][ref5], of met betrekking tot een rechtspersoon, vennootschap of instelling als
      bedoeld in onderdeel a, onder 1°;

      2°. in of vanuit Nederland voor het publiek bestemde informatie openbaar maken, waarin rechtstreeks of middellijk
      een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in onderdeel a, onder 2°, of met
      betrekking tot een rechtspersoon, vennootschap of instelling als bedoeld in onderdeel a, onder 2° en die bij het
      opstellen van de informatie betrokken waren;

      f. personen die in het kader van een arbeidsovereenkomst of anderszins, voor een persoon als bedoeld onder a of c,
      werkzaam zijn en niet als hoofdactiviteit:

      1°. in of vanuit Nederland of een staat die geen lidstaat is voor het publiek bestemde informatie openbaar
      maken, waarin rechtstreeks een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in
      [artikel 46, eerste lid, onder a][ref6], en die bij het opstellen van de aanbeveling betrokken waren;

      2°. in of vanuit Nederland voor het publiek bestemde informatie openbaar maken, waarin rechtstreeks een
      beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in onderdeel a, onder 2°, en die bij het
      opstellen van de aanbeveling betrokken waren;

      g. andere personen dan genoemd in de overige onderdelen van dit lid, die:

      1°. in of vanuit Nederland of een staat die geen lidstaat is voor het publiek bestemde informatie openbaar
      maken, waarin rechtstreeks een beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in
      [artikel 46, eerste lid, onder a][ref7];

      2°. in of vanuit Nederland voor het publiek bestemde informatie openbaar maken, waarin rechtstreeks een
      beleggingsaanbeveling wordt gedaan met betrekking tot effecten als bedoeld in onderdeel a, onder 2°.

      3 Een effecteninstelling als bedoeld in het tweede lid, onder a, of een persoon als bedoeld in het tweede lid,
      onder e of f, vermeldt in de in het tweede lid bedoelde informatie wie de bevoegde toezichthoudende autoriteit
      is. Een ieder die niet een effecteninstelling is en op wie ingevolge zelfregulering normen of gedragsregels met
      betrekking tot de in het eerste lid, onder a tot en met c, bedoelde onderwerpen van toepassing zijn, vermeldt deze
      in de in het tweede lid bedoelde informatie.

      4 Een effecteninstelling als bedoeld in het tweede lid, die transacties in effecten verricht, maakt de door haar
      getroffen organisatorische en administratieve maatregelen om belangenconflicten ten aanzien van aanbevelingen te
      voorkomen in algemene bewoordingen openbaar.

      5 Een persoon die in het kader van zijn beroeps- of bedrijfsuitoefening door een derde uitgebrachte, voor het
      publiek bestemde informatie als bedoeld in het tweede lid voor eigen verantwoordelijkheid openbaar maakt, vermeldt
      duidelijk en opvallend wijzigingen die hij in de informatie heeft aangebracht of vermeldt dat deze informatie
      ongewijzigd is overgenomen en voldoet aan de ingevolge het eerste lid bij algemene maatregel van bestuur te stellen
      regels. Het derde lid, eerste volzin, is van overeenkomstige toepassing.

      6 Een ieder die in of vanuit Nederland een samenvatting van door een derde opgestelde, voor het publiek bestemde
      informatie als bedoeld in het tweede lid openbaar maakt, draagt ervoor zorg dat deze samenvatting duidelijk,
      niet misleidend en direct en gemakkelijk toegankelijk is. Tevens maakt hij daarbij melding van de plaats waar de
      informatie die in de samenvatting wordt weergegeven toegankelijk is, indien deze informatie openbaar is.

      7 Met betrekking tot het openbaarmaken van informatie als bedoeld in het tweede lid door journalisten of andere
      beroepsbeoefenaren kunnen bij de in het eerste lid bedoelde algemene maatregel van bestuur afwijkende regels worden
      gesteld.


