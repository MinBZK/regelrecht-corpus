  - number: 15b
    text: |-
      1 Een effecteninstelling meldt een wijziging van de gegevens, bedoeld in
      [artikel 15a, tweede lid, onderdelen b tot en met e][ref1], ten minste een maand tevoren schriftelijk aan Onze
      Minister.

      2 De effecteninstelling doet de in het eerste lid bedoelde gegevens vergezeld gaan van een vertaling voor zover
      Onze Minister zulks verlangt.

      3 Indien de effecteninstelling voldoet aan de bij of krachtens [artikel 11][ref2] gestelde regels en Onze Minister
      geen bedenkingen heeft tegen de wijziging maakt hij dit aan de effecteninstelling bekend.

      4 Indien het voornemen bestaat om de bedrijfsuitoefening vanuit het bijkantoor te staken, stelt de
      effecteninstelling Onze Minister daarvan ten minste een maand tevoren schriftelijk in kennis. Zodra de
      effecteninstelling haar voornemen uitvoert, meldt zij dit onverwijld aan Onze Minister.


