  - number: '47'
    text: |-
      1 Een rechtspersoon, vennootschap of instelling die effecten heeft uitgegeven die met diens instemming zijn
      toegelaten tot de handel op een gereglementeerde markt die gelegen is of werkzaam is in Nederland of waarvoor
      verzocht is om toelating van die effecten tot de handel op een dergelijke markt, maakt informatie als bedoeld
      in [artikel 46, vierde of vijfde lid][ref1], die rechtstreeks op de rechtspersoon, vennootschap of instelling
      betrekking heeft, onverwijld openbaar. De openbaarmaking vindt plaats door middel van een persbericht dat
      gelijktijdig wordt uitgebracht in Nederland en in iedere andere lid-staat waar de door de rechtspersoon,
      vennootschap of instelling uitgegeven effecten zijn toegelaten tot de handel op een gereglementeerde markt of waar
      de rechtspersoon, vennootschap of instelling heeft verzocht om of ingestemd met toelating tot de handel van die
      effecten op een dergelijke markt. De rechtspersoon, vennootschap of instelling stelt Onze Minister dan wel, indien
      van toepassing, de rechtspersoon waaraan ingevolge [artikel 40][ref2] taken en bevoegdheden zijn overgedragen,
      gelijktijdig met de openbaarmaking op de hoogte van deze informatie.

      2 De rechtspersoon, vennootschap of instelling beschikt over een website en plaatst de informatie onverwijld op
      deze website. De rechtspersoon, vennootschap of instelling houdt de informatie gedurende tenminste een jaar op de
      website toegankelijk.

      3 In afwijking van het eerste en tweede lid kan een rechtspersoon, vennootschap of instelling de openbaarmaking van
      de informatie uitstellen indien:

      a. het uitstel een rechtmatig belang van de rechtspersoon, vennootschap of instelling dient;

      b. van het uitstel geen misleiding van het publiek te duchten is; en

      c. zij de vertrouwelijkheid van deze informatie kan waarborgen.

      4 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het derde lid. Daarbij wordt bepaald
      wat onder een rechtmatig belang van de rechtspersoon, vennootschap of instelling wordt verstaan en aan welke
      vereisten een rechtspersoon, vennootschap of instelling dient te voldoen om de vertrouwelijkheid van de informatie
      te waarborgen.

      5 Indien de rechtspersoon, vennootschap of instelling of een persoon die de rechtspersoon, vennootschap of
      instelling vertegenwoordigt, doelbewust informatie als bedoeld in [artikel 46, vierde of vijfde lid][ref3], in
      het kader van de normale uitoefening van werk, beroep of functie meedeelt aan een derde, maakt de rechtspersoon,
      vennootschap of instelling die informatie gelijktijdig openbaar. Indien de informatie niet doelbewust aan een derde
      is meegedeeld maakt de rechtspersoon, vennootschap of instelling haar onverwijld openbaar. Het eerste lid is van
      overeenkomstige toepassing.

      6 Het vijfde lid is niet van toepassing indien de persoon aan wie de informatie wordt meegedeeld terzake daarvan
      gehouden is tot geheimhouding.

      7 Een rechtspersoon, vennootschap of instelling met statutaire zetel in Nederland die effecten als
      bedoeld in [artikel 46, eerste lid, onder a of b][ref4], heeft uitgegeven, een rechtspersoon, vennootschap
      of instelling met statutaire zetel in een staat die niet een lid-staat is die effecten als bedoeld in
      [artikel 46, eerste lid, onder a][ref5], heeft uitgegeven of zal uitgeven, alsmede een ieder die namens of voor
      rekening van de hiervoor genoemde rechtspersoon, vennootschap of instelling optreedt, houdt een lijst bij van de
      bij hem of haar werkzame personen die op regelmatige of incidentele basis kennis kunnen hebben van informatie als
      bedoeld in [artikel 46, vierde of vijfde lid][ref6], en stelt deze personen op de hoogte van de in dit hoofdstuk
      gestelde verboden en de hoogte van de sancties die op overtreding daarvan zijn gesteld.

      8 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de in
      het eerste, tweede en vijfde lid bedoelde openbaarmaking dient plaats te vinden, alsmede met betrekking tot de
      inhoud, het bijwerken en bewaren van de lijst, bedoeld in het zevende lid.

      9 Onze Minister verwerkt de in een melding als bedoeld in het eerste of vijfde lid opgenomen informatie en het
      tijdstip waarop deze door de rechtspersoon, vennootschap of instelling openbaar is gemaakt, na openbaarmaking
      onverwijld in een register.

      10 Onze Minister houdt de in het negende lid bedoelde gegevens gedurende tenminste vijf jaar voor een ieder
      kosteloos ter inzage in het register. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld
      ten aanzien van de inrichting en de werking van het register.


