  - number: 46a
    text: |-
      1 Het is een ieder die behoort tot een in het tweede lid van [artikel 46, onder a, b of d][ref1], bedoelde
      categorie alsmede een ieder die beschikt over voorwetenschap en behoort tot de in het tweede lid, onder c, bedoelde
      categorie verboden om in of vanuit een in [artikel 46, eerste lid, onder a, b, of c][ref2] bedoelde staat, voor
      zover het effecten betreft als bedoeld in het desbetreffende onderdeel:

      a. de informatie waarop zijn voorwetenschap betrekking heeft aan een derde mee te delen, anders dan in de normale
      uitoefening van zijn werk, beroep of functie; of

      b. een derde aan te bevelen of ertoe aan te zetten transacties te verrichten of te bewerkstelligen in die effecten.

      2 Het verbod, bedoeld in het eerste lid, is van overeenkomstige toepassing op ieder ander die weet of
      redelijkerwijs moet vermoeden dat hij over voorwetenschap beschikt.

      3 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin en de
      omstandigheden waaronder sprake is van meedelen in het kader van de normale uitoefening van werk, beroep of
      functie, als bedoeld in het eerste lid, onder a.


