  - number: 47d
    text: |-
      1 Een effecteninstelling die ingevolge [artikel 47c, eerste lid][ref1], te goeder trouw een melding heeft gedaan is
      niet aansprakelijk voor schade die een derde dientengevolge lijdt.

      2 Gegevens of inlichtingen die op grond van [artikel 47c, eerste lid][ref2], zijn verstrekt, kunnen niet dienen
      als grondslag voor of ten behoeve van een opsporingsonderzoek of vervolging wegens verdenking van, of als bewijs
      ter zake van een tenlastelegging wegens overtreding van de [artikelen 46][ref3] of [46b][ref4] ten aanzien van een
      effecteninstelling die ingevolge [artikel 47c, eerste lid][ref5], gegevens of inlichtingen heeft verstrekt.

      3 Een effecteninstelling die ingevolge [artikel 47c, eerste lid][ref6], een melding heeft gedaan is verplicht tot
      geheimhouding daarvan.


