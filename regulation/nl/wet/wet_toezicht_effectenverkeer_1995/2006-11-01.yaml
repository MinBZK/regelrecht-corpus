      1 Onze Minister kan vrijstelling verlenen van [artikel 7, eerste lid][ref1].

      2 Aan een vrijstelling kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een
      adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.


