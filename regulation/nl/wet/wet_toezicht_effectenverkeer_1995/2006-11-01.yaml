    text: |-
      1 Onze Minister kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 3, eerste en vierde lid, ][ref1][4, tweede lid][ref2],
      [5, derde lid][ref3], [6, tweede lid][ref4], [6a, eerste en derde lid][ref5], [6b][ref6],
      [6c, tweede lid][ref7], [7, eerste, derde, vierde en zevende lid][ref8], [10, tweede lid][ref9],
      [11, eerste en tweede lid][ref10], [11a, eerste en tweede lid][ref11], [12, tweede en vierde lid][ref12],
      [13, eerste lid, tweede volzin, vijfde, zesde, zevende en negende lid][ref13], [15, tweede lid][ref14],
      [16, eerste, zevende, achtste en tiende lid][ref15], [17, eerste lid][ref16], [18, tweede lid][ref17],
