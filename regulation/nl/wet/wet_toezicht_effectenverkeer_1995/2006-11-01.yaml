  - number: '62'
    text: |-
      1 [Artikel 16, eerste lid][ref1], blijft buiten toepassing tot de eerste dag van de derde kalendermaand na de datum
      van inwerkingtreding van dat artikellid.

      2 Met ingang van de in het eerste lid bedoelde dag geldt [artikel 16, eerste lid][ref2], niet ten aanzien
      van degene die in de aan die dag voorafgaande periode bij Onze Minister een aanvraag heeft ingediend voor een
      verklaring van geen bezwaar en tot de tweede dag nadat Onze Minister zijn besluit inzake die aanvraag heeft
      verzonden.


