      Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref1] taken en bevoegdheden zijn
      overgedragen, werkt bij de uitoefening van het toezicht samen met de betrokken toezichthoudende autoriteiten
      van de andere lid-staten. Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref2] taken en
      bevoegdheden zijn overgedragen, pleegt daartoe in voorkomende gevallen overleg met deze autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel40
