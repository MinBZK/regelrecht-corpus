  - number: '4'
    text: |-
      1 Onze Minister kan vrijstelling of, op verzoek, ontheffing verlenen van [artikel 3, eerste of vierde lid][ref1].

      2 Aan een vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden
      met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.

      3 Indien een op grond van het eerste lid verleende vrijstelling betrekking heeft op het aanbieden van effecten aan
      bepaalde door Onze Minister aan te wijzen personen, houdt Onze Minister een register bij waarin de namen van die
      personen worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 Instellingen waarvan in of vanuit Nederland effecten zijn aangeboden, stellen periodiek informatie omtrent hun
      bedrijf algemeen verkrijgbaar. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking
      tot:

      a. de soort en inhoud van de informatie;

      b. de termijnen waarbinnen deze informatie algemeen verkrijgbaar wordt gesteld; en

      c. de wijze waarop de informatie algemeen verkrijgbaar wordt gesteld.

      2 Onze Minister kan van de op grond van het eerste lid gestelde regels vrijstelling of, op verzoek, ontheffing
      verlenen.

      3 Aan een vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden
      met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.

      4 Het eerste lid is niet van toepassing op een beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref1] en het rechten van deelneming betreft die op verzoek
      van de houder ten laste van de activa direct of indirect worden ingekocht of terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '18'
  - number: '6'
    text: |-
      1 Indien Onze Minister vaststelt dat een instelling waarvan effecten zijn uitgegeven die zijn toegelaten,
      of waarvan aannemelijk is dat deze spoedig zullen worden toegelaten, tot de handel op een op grond van
      [artikel 22][ref1] erkende effectenbeurs, of degene die deze effecten aanbiedt, zich niet houdt of heeft gehouden
      aan het bij of krachtens [artikel 3][ref2] bepaalde of aan de regels van de effectenbeurs waaraan die instelling
      in verband met de toelating is onderworpen, vestigt hij daarop de aandacht van de houder van die effectenbeurs.
      Zonodig doet Onze Minister deze mededeling vergezeld gaan van dan wel volgen door een aanwijzing met betrekking
      tot een door de houder van de effectenbeurs jegens de instelling te volgen gedragslijn met het oog op een adequate
      functionering van de effectenmarkten of de positie van de beleggers op die markten.

      2 De houder van de effectenbeurs volgt de in het eerste lid bedoelde aanwijzing op binnen een door Onze Minister te
      bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
