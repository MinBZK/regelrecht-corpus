  - number: '42'
    text: |-
      Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref1] taken en bevoegdheden zijn
      overgedragen, kan de kosten die worden gemaakt voor de uitvoering van die taken en de uitoefening van die
      bevoegdheden volgens door Onze Minister te stellen regels in rekening brengen bij houders van effectenbeurzen,
      bij aanbieders van effecten, bij de personen waarvan de namen zijn opgenomen in het register, bedoeld in
      [artikel 4, derde lid][ref2], bij instellingen als bedoeld in [artikel 5, eerste lid][ref3], bij bieders, bij
      aanvragers van een ontheffing als bedoeld in [artikel 6a, vijfde lid][ref4], of [artikel 6c, eerste lid][ref5],
      bij effecteninstellingen, bij aanvragers van een vergunning als bedoeld in [artikel 7, eerste lid][ref6], bij
      aanvragers van een ontheffing als bedoeld in [artikel 4, eerste lid][ref7], bij aanvragers van een ontheffing
      als bedoeld in [artikel 5, tweede lid][ref8], bij aanvragers van een erkenning als bedoeld in [artikel 22][ref9],
      bij aanvragers van een ontheffing als bedoeld in [artikel 25, eerste lid][ref10], bij aanvragers van een
      verklaring van geen bezwaar als bedoeld in [artikel 16, eerste lid][ref11], bij houders van een verklaring van
      geen bezwaar die is verleend op grond van [artikel 16, derde lid][ref12], alsmede bij instellingen als bedoeld in
      [artikel 18a, eerste lid][ref13].


