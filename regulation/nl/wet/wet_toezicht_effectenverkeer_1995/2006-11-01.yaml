  - number: 48a
    text: |-
      1 Onze Minister is bevoegd aan een rechtspersoon waaraan ingevolge [artikel 40, eerste lid][ref1], taken en
      bevoegdheden zijn overgedragen de gegevens of inlichtingen te vragen die naar zijn oordeel nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de rechtspersoon deze wet uitvoert of heeft
      uitgevoerd, indien dat ter wille van het bedrijfseconomisch toezicht nodig blijkt.

      2 De rechtspersoon, bedoeld in het eerste lid, is verplicht aan Onze Minister de in het eerste lid bedoelde
      gegevens of inlichtingen te verstrekken. Indien Onze Minister de rechtspersoon vraagt bepaalde gegevens of
      inlichtingen te verstrekken die onder [artikel 31, eerste en tweede lid][ref2], vallen, is de rechtspersoon niet
      verplicht deze gegevens of inlichtingen te verstrekken, indien:

      a. deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke effecteninstelling waaraan een vergunning als bedoeld in [artikel 7, eerste lid][ref3], is verleend
      of waarvan die vergunning is ingetrokken of vervallen, en waaraan surséance van betaling is verleend of die in
      staat van faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden;

      b. deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      effecteninstelling in staat te stellen haar bedrijf voort te zetten; of

      c. deze zijn ontvangen van een instantie als bedoeld in [artikel 33, eerste lid][ref4], of zijn verkregen naar
      aanleiding van een verificatie bij een in een andere staat gelegen bijkantoor van een in Nederland gevestigde
      effecteninstelling, tenzij de uitdrukkelijke instemming is verkregen van die instantie onderscheidenlijk van de
      toezichthoudende autoriteit van de staat waar de verificatie ter plaatse is verricht.

      3 Onze Minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.

      4 Onze Minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      rechtspersoon, bedoeld in het eerste lid, deze wet uitvoert of heeft uitgevoerd.

      5 Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. Artikel 31, eerste en tweede lid, is van toepassing.

      6 Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.

      7 De [Wet openbaarheid van bestuur][ref5], de [Wet Nationale ombudsman][ref6] en
      [titel 9.2 van de Algemene wet bestuursrecht][ref7] zijn niet van toepassing met betrekking tot de in dit artikel
      bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel7
