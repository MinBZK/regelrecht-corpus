  - number: '48'
    text: |-
      1 Onze Minister kan, onverminderd [artikel 29][ref1], met het oog op het toezicht op de naleving van het bij of
      krachtens dit hoofdstuk bepaalde, inlichtingen inwinnen of doen inwinnen bij een ieder die, naar in redelijkheid
      mag worden aangenomen, beschikt over informatie die relevant is voor dat toezicht.

      2 Onze Minister kan met het oog op een adequate functionering van de effectenmarkten of de positie van de
      beleggers op die markten aan de houder van een gereglementeerde markt die gelegen is of werkzaam is in Nederland
      een aanwijzing geven om de handel in bepaalde effecten op te schorten, te onderbreken of door te halen, indien
      het toezicht op de naleving van het bij of krachtens [artikel 47, eerste of derde lid][ref2], bepaalde daartoe
      aanleiding geeft. De houder van de effectenbeurs volgt de aanwijzing op binnen een door Onze Minister te bepalen
      termijn.

      3 Onze Minister kan een aanwijzing als bedoeld in het tweede lid openbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel47
