  - number: '63'
    text: |-
      Houders van een effectenbeurs die op het tijdstip van inwerkingtreding van [artikel 22, eerste lid][ref1], van deze
      wet een erkenning als bedoeld in [artikel 16, eerste lid, van de Wet toezicht effectenverkeer](onbekend) bezitten,
      worden geacht op dat tijdstip een erkenning als bedoeld in [artikel 22, eerste lid][ref2], van deze wet te hebben
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
