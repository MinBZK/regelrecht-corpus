  - number: '24'
    text: |-
      1 De houder van een op grond van [artikel 22][ref1] erkende effectenbeurs draagt er zorg voor dat de voor de
      effectenbeurs geldende regels kunnen worden toegepast op de instellingen, bedoeld in [artikel 6, eerste lid][ref2],
      en op de effecteninstellingen die zijn toegelaten tot deze beurs.

      2 Onze Minister kan met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers
      op die markten aan de houder van een op grond van [artikel 22][ref3] erkende effectenbeurs:

      a. voorschriften geven met betrekking tot de voor die effectenbeurs te hanteren regels, hun toepassing of de
      controle op de naleving van die regels;

      b. een aanwijzing geven met betrekking tot een door deze jegens een effecteninstelling die zich naar het oordeel
      van Onze Minister niet houdt aan de regels bedoeld in [artikel 22, tweede lid][ref4], te volgen gedragslijn.

      3 De houder van de effectenbeurs volgt de in het tweede lid bedoelde voorschriften en aanwijzing op binnen een door
      Onze Minister te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
