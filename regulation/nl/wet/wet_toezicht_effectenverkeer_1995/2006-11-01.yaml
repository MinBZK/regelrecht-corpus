  - number: '20'
    text: |-
      Onze Minister kan een op grond van [artikel 16][ref1] verleende verklaring van geen bezwaar slechts wijzigen of
      intrekken dan wel daaraan nadere beperkingen stellen of nadere voorschriften verbinden:

      a. op verzoek van de houder;

      b. indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van geen bezwaar zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;

      c. indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan, zo zij voor het tijdstip waarop
      de verklaring van geen bezwaar werd verleend zich hadden voorgedaan of bekend waren geweest, de verklaring van geen
      bezwaar zou zijn geweigerd;

      d. indien de houder niet meer als een houder van de gekwalificeerde deelneming kan worden aangemerkt;

      e. indien de houder niet alsnog binnen de termijn, bedoeld in [artikel 16, achtste lid, eerste volzin][ref2], alle
      bij de verklaring van geen bezwaar gestelde beperkingen in acht neemt;

      f. indien de houder niet meer voldoet aan bij of krachtens deze wet gestelde regels of beperkingen of gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel16
