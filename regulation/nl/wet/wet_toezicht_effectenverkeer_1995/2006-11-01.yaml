  - number: 15a
    text: |-
      1 Een effecteninstelling waaraan een vergunning als bedoeld in [artikel 7][ref1] is verleend en die voornemens
      is als effectenbemiddelaar of vermogensbeheerder diensten aan te bieden of te verrichten door middel van een
      bijkantoor in een staat, die niet een lid-staat is, geeft, alvorens daartoe over te gaan, Onze Minister van haar
      voornemen schriftelijk kennis. Het is de effecteninstelling verboden om aan haar voornemen gevolg te geven zolang
      Onze Minister daarmee niet uitdrukkelijk heeft ingestemd.

      2 De kennisgeving, bedoeld in het eerste lid, geschiedt onder opgave van:

        - de staat waarin de effecteninstelling voornemens is het bijkantoor te vestigen;
        - een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie – met inbegrip van de financiële administratie en de interne controle – ten behoeve van
      het bijkantoor zijn vermeld;
        - de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering;
        - het adres van het bijkantoor; en
        - de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.

      3 De effecteninstelling doet de in het tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover
      Onze Minister zulks verlangt.

      4 Indien er naar het oordeel van Onze Minister aanwijzingen bestaan dat de effecteninstelling, gezien de
      werkzaamheden die zij vanuit het bijkantoor voornemens is te verrichten, niet zal kunnen voldoen aan de bij of
      krachtens de [artikel 11][ref2] gestelde regels, geeft Onze Minister geen toestemming voor de opening van het
      bijkantoor.

      5 Onze Minister beslist binnen 6 weken na ontvangst van de kennisgeving, bedoeld in het eerste lid, op het verzoek
      tot instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel11
