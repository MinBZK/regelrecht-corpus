  - number: 48e
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige
      verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48e
  - number: 48f
    text: |-
      1 Indien Onze Minister voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder
      vermelding van de gronden waarop het voornemen berust.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister de betrokkene in
      de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage of de algemene maatregel van bestuur, bedoeld in
      [artikel 48d][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel48d
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0007657
        artikel: 48d
        hoofdstuk: XII_B
  - number: 48g
    text: |-
      1 Onze Minister legt de boete op bij beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. het feit terzake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;

      b. het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en

      c. de termijn, bedoeld in [artikel 48i, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48i
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48i
        hoofdstuk: XII_B
  - number: 48h
    text: |-
      1 De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.

      2 In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 48f, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48f
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48h
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48f
        hoofdstuk: XII_B
  - number: 48i
    text: |-
      1 De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 48f, tweede lid][ref1], is aangewezen.

      3 Indien de boete niet tijdig is betaald, stuurt Onze Minister schriftelijk een aanmaning om binnen twee weken de
      boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de boete,
      voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het derde lid zal worden ingevorderd.

      4 Bij gebreke van tijdige betaling kan Onze Minister de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon die de boete heeft opgelegd.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48f
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48i
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48f
        hoofdstuk: XII_B
  - number: 48j
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      2 Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 48c][ref2] vervalt,
      indien Onze Minister ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel48c
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48j
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: 48c
        hoofdstuk: XII_B
  - number: 48k
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.

      2 De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48k
  - number: 48l
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48l
  - number: 48m
    text: |-
      1 Met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten,
      kan Onze Minister, onverminderd [artikel 31, eerste en tweede lid][ref1], het feit ter zake waarvan de last
      onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en
      de woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis
      brengen.

      2 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel31
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48m
