      1 Een instelling als bedoeld in [artikel 7, tweede lid, onder a, f, k of l][ref1],
      of een kredietinstelling of financiële instelling als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ________, niet zijnde een instelling als bedoeld in [artikel 7, tweede lid, onder h][ref3], houdt zich aan bij
      of krachtens algemene maatregel van bestuur te stellen effectentypische gedragsregels. Deze regels hebben in
      elk geval betrekking op het omgaan met koersgevoelige informatie, privé beleggingstransacties van bestuurders en
      personeelsleden, het tegengaan van marktmanipulatie, het voorkomen van belangenverstrengeling, voor zover dit te
      maken heeft met effectentransacties, en het vastleggen van relevante gedragscodes en andere voorzieningen die met
      het oog op het bovenstaande zijn getroffen, in de administratieve organisatie en interne controle.

      2 De regels, bedoeld in het eerste lid, kunnen voor de onderscheiden groepen instellingen verschillend zijn.


