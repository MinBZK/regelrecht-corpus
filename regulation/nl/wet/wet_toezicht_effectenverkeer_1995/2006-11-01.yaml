  - number: '21'
    text: |-
      1 Onze Minister houdt een register waarin zijn opgenomen de effecteninstellingen die ingevolge een vergunning of
      ingevolge [artikel 7, tweede lid, aanhef en onder h, i of j][ref1], als effectenbemiddelaar of vermogensbeheerder
      hun diensten mogen aanbieden of verrichten alsmede de aan de desbetreffende vergunning of vrijstelling gestelde
      beperkingen of verbonden voorschriften. In het register zijn tevens opgenomen de effecteninstellingen die ingevolge
      een vrijstelling als effectenbemiddelaar of vermogensbeheerder hun diensten mogen aanbieden of verrichten alsmede
      de aan de desbetreffende vrijstelling gestelde beperkingen of verbonden voorschriften, indien zij ingevolge een
      voorschrift dat aan die vrijstelling is verbonden Onze Minister in kennis hebben gesteld van hun voornemen om de
      desbetreffende effectendiensten aan te bieden of te verrichten (2e nota van wijziging).

      2 De inschrijving van een effecteninstelling waarvan de vergunning is ingetrokken dan wel waarop niet langer een
      vrijstelling van toepassing is, wordt doorgehaald.

      3 In de maand januari van elk jaar wordt door de zorg van Onze Minister een lijst van de ingeschreven
      effecteninstellingen naar de stand van 31 december van het voorgaande jaar in de *Staatscourant* geplaatst.

      4 Onze Minister houdt een afschrift van het register voor een ieder kosteloos ter inzage.

      5 De registerinschrijving van een effecteninstelling als bedoeld in het eerste lid, tweede volzin, wordt geweigerd
      dan wel doorgehaald indien de voornemens, de handelingen of de antecedenten van de personen die het beleid van de
      effecteninstelling bepalen of mede bepalen, dan wel van de personen die rechtstreeks of middellijk bevoegd zijn
      deze personen te benoemen of te ontslaan, Onze Minister aanleiding geven tot het oordeel dat, met het oog op de
      belangen van de beleggers, de betrouwbaarheid van deze personen niet buiten twijfel staat.

      6 Het is een effecteninstelling als bedoeld in het eerste lid, tweede volzin, die niet in het register is
      ingeschreven, verboden om als effectenbemiddelaar of vermogensbeheerder diensten aan te bieden of te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
