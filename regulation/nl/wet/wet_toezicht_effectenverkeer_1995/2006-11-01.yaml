  - number: '7'
    text: |-
      1 Het is verboden zonder vergunning als effectenbemiddelaar of vermogensbeheerder in of vanuit Nederland diensten
      aan te bieden of te verrichten.

      2 Het eerste lid is niet van toepassing op:

      a. verzekeraars als bedoeld in [artikel 1, eerste lid, onder ][ref1], behoudens voor zover
      [artikel 13 van die wet][ref2] van toepassing is, en verzekeraars als bedoeld in [artikel 1, onder ][ref3];

      b. degenen die de in het eerste lid bedoelde diensten uitsluitend verrichten voor de onderneming waarvan zij
      dochtermaatschappij zijn, voor hun dochtermaatschappijen of voor een andere dochtermaatschappij van de onderneming
      waarvan zij dochtermaatschappij zijn;

      c. degenen wier in het eerste lid bedoelde diensten uitsluitend bestaan uit het op grond van een overeenkomst met
      een werkgever beheren van een werknemersparticipatieplan met betrekking tot effecten die zijn uitgegeven ten laste
      van die werkgever;

      d. degenen wier in het eerste lid bedoelde diensten uitsluitend bestaan uit het verlenen van zowel de diensten,
      bedoeld onder *b*, als die, bedoeld onder *c*;

      e. de ECB bedoeld in [artikel 4a van het Verdrag tot oprichting van de Europese Gemeenschappen](onbekend), en
      de centrale banken van de lid-staten, nationale instellingen van de lid-staten met een soortgelijke functie en
      overheidsinstellingen van de lid-staten die zijn belast met of betrokken bij het beheer van de overheidsschuld;

      f. beleggingsinstellingen als bedoeld in [artikel 1, onder ][ref4], alsmede beheerders als bedoeld in
      [artikel 1, onder ][ref5], voor zover het betreft de inkoop of verkoop van rechten van deelneming in de betrokken
      beleggingsinstellingen door de beleggingsinstellingen zelf onderscheidenlijk door de aan die beleggingsinstellingen
      verbonden beheerders;

      g. degenen wier hoofdbedrijf bestaat uit het verhandelen van zaken met producenten, met beroeps- of bedrijfsmatige
      gebruikers of met anderen met eenzelfde hoofdbedrijf en die de in het eerste lid bedoelde diensten verrichten voor
      alleen deze wederpartijen en in de mate dat hun hoofdbedrijf zulks vereist;

      h. kredietinstellingen of financiële instellingen die zijn ingeschreven in het register, bedoeld in
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref6], voor zover het aan die instellingen ingevolge de
      [artikelen 6][ref7], [31][ref8], [32][ref9] of [38][ref10] onderscheidenlijk [45][ref11], [50][ref12] of
      [51 van die wet][ref13] is toegestaan om diensten ter zake van effectenbemiddeling of vermogensbeheer aan te bieden
      of te verrichten;

      i. effecteninstellingen die zijn gevestigd in een andere lid-staat, niet zijnde instellingen als bedoeld onder *h*,
      die door middel van een bijkantoor in Nederland als effectenbemiddelaar of vermogensbeheerder diensten aanbieden of
      verrichten, indien:

      1°. zij van de toezichthoudende autoriteit van die andere lid-staat een voor de uitoefening van het beroep of
      bedrijf van effectenbemiddelaar of vermogensbeheerder benodigde vergunning hebben verkregen;

      2°. Onze Minister van de toezichthoudende autoriteit van die andere lid-staat een kennisgeving heeft ontvangen,
      die bevat:

        - een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van het bijkantoor
      zijn vermeld;
        - het adres van het bijkantoor;
        - de identiteit van de personen die het dagelijks beleid van het bijkantoor bepalen; en
        - gegevens omtrent de toepasselijkheid van een garantieregeling op de verplichtingen van het bijkantoor;

      en

      3°. Onze Minister de ontvangst van de kennisgeving, bedoeld onder 2°, en de inhoud daarvan aan de
      effecteninstelling heeft bekendgemaakt dan wel er twee maanden zijn verstreken vanaf het tijdstip waarop Onze
      Minister die kennisgeving heeft ontvangen;

      j. effecteninstellingen die zijn gevestigd in een andere lid-staat, niet zijnde instellingen als bedoeld onder *h*,
      die, anders dan door middel van een bijkantoor in Nederland, als effectenbemiddelaar of vermogensbeheerder diensten
      aanbieden of verrichten, indien:

      1°. zij van de toezichthoudende autoriteit van die andere lid-staat een voor de uitoefening van het beroep of
      bedrijf van effectenbemiddelaar of vermogensbeheerder benodigde vergunning hebben verkregen; en

      2°. zij aan de toezichthoudende autoriteit van die andere lid-staat een kennisgeving hebben gezonden, die een
      opgave van de voorgenomen werkzaamheden bevat.

      k. bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, ondernemingsspaarfondsen en beroepspensioenfondsen
      als bedoeld in [artikel 1, eerste lid, onderdeel b, c, d van de Pensioen- en spaarfondsenwet][ref14]
      onderscheidenlijk [artikel 1, eerste lid, onderdeel j, van de Wet verplichte beroepspensioenregeling][ref15],
      die krachtens die wet aan het toezicht van de Pensioen- & Verzekeringskamer zijn onderworpen en die als
      vermogensbeheerder uitsluitend diensten aanbieden aan of verrichten voor de desbetreffende bedrijfstak,
      onderneming, dan wel beroepsgroep waarmee zij zijn verbonden, alsmede het pensioenfonds, bedoeld in
      [artikel 113a, eerste lid, van de Wet op het notarisambt][ref16];

      l. natuurlijke personen en rechtspersonen voor zover zij als vermogensbeheerder uitsluitend diensten aanbieden
      aan of verrichten voor een fonds als bedoeld onder k of een daaraan gelieerd fonds, mits de natuurlijke persoon of
      de rechtspersoon is verbonden aan het fonds waaraan de diensten worden aangeboden of waarvoor de diensten worden
      verricht.

      3 Het is effecteninstellingen als bedoeld in het tweede lid, onder *i*, of *j*, niet toegestaan de werkzaamheden,
      genoemd in deel A van de bijlage bij de richtlijn beleggingsdiensten, aan te bieden of te verrichten indien
      het aanbieden of verrichten van die werkzaamheden door de vergunning, bedoeld in het tweede lid, onderdeel *i*
      onder 1°, onderscheidenlijk onderdeel *j*, onder 1°, wordt uitgesloten of de kennisgeving, bedoeld in het tweede
      lid, onderdeel *i*, onder 2°, onderscheidenlijk onderdeel *j*, onder 2°, het aanbieden of verrichten van die
      werkzaamheden niet vermeldt.

      4 Onze Minister verleent, op verzoek, een vergunning als bedoeld in het eerste lid indien de aanvrager aantoont dat
      wordt voldaan aan bij of krachtens algemene maatregel van bestuur te stellen regels ten aanzien van:

        - deskundigheid en betrouwbaarheid;
        - financiële waarborgen, al dan niet tevens op geconsolideerde basis;
        - bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
      en vestiging van het hoofdkantoor;
        - aan Onze Minister en aan het publiek te verstrekken informatie; en
        - waarborgen voor een adequaat toezicht op de naleving van de bij of krachtens deze wet gestelde regels.

      Is de aanvrager een bijkantoor in Nederland van een effecteninstelling die niet in een lid-staat is gevestigd, dan
      toont hij tevens aan dat de instelling in de staat waar zij is gevestigd bevoegd is tot het als effectenbemiddelaar
      of vermogensbeheerder aanbieden of verrichten van diensten en bevoegd is een bijkantoor in Nederland te openen.

      5 De regels, bedoeld in het vierde lid, kunnen voor onderscheiden groepen effecteninstellingen verschillend zijn.

      6 Indien de aanvrager redelijkerwijs niet kan voldoen aan de op grond van het vierde lid gestelde regels kan Onze
      Minister op verzoek een vergunning als bedoeld in het eerste lid verlenen indien de aanvrager aantoont dat de
      doeleinden die deze wet beoogt te bereiken anderszins voldoende zijn bereikt.

      7 Aan een vergunning kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een
      adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.


