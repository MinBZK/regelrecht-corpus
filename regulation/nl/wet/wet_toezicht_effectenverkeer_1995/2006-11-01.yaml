  - number: 47c
    text: |-
      1 Een effecteninstelling die een redelijk vermoeden heeft dat een transactie of een opdracht tot een transactie
      terzake waarvan zij in of vanuit Nederland bemiddelt in strijd is met [artikel 46, eerste of derde lid][ref1], of
      [artikel 46b, eerste lid][ref2], meldt dit vermoeden onverwijld aan Onze Minister dan wel, indien van toepassing,
      aan de rechtspersoon aan wie ingevolge [artikel 40][ref3] taken en bevoegdheden zijn overgedragen.

      2 Onze Minister meldt een overeenkomstig het eerste lid gemeld vermoeden onverwijld aan iedere overheidsinstantie
      of van overheidswege aangewezen instantie die belast is met het toezicht op een gereglementeerde markt waar de
      effecten waarop de melding betrekking heeft tot de handel zijn toegelaten of waarvoor toelating van die effecten
      tot de handel is aangevraagd.

      3 Bij of krachtens algemene maatregel van bestuur kan worden bepaald wanneer sprake is van een redelijk vermoeden
      als bedoeld in het eerste lid en kunnen regels worden gesteld waaraan de melding dient te voldoen en op welke wijze
      deze dient plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel46b
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel40
