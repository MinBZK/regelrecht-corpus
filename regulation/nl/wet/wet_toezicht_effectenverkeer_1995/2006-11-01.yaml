  - number: 48v
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 48n][ref1] ter openbare kennis brengen van een feit
      worden verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan
      voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel48v
