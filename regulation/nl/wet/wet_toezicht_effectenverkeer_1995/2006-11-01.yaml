      1 Onze Minister kan vrijstelling of, op verzoek, ontheffing verlenen van [artikel 22, eerste lid][ref1].

      2 Aan een vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden
      met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.


