      1 Onze Minister houdt een register bij waarin zijn opgenomen de prospectussen die zijn goedgekeurd op grond van
      [artikel 3, eerste of derde lid][ref1].

      2 Onze Minister houdt de gegevens in het register voor een ieder kosteloos ter inzage.

      3 Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de inrichting en de werking van het
      register en de wijze waarop wijzigingen in het register worden aangebracht.


