  - number: 45a
    text: |-
      Voor de toepassing van dit hoofdstuk:

      1°. wordt onder effecten mede verstaan: rente-, valuta- of aandelenswaps of soortgelijke overeenkomsten;

      2°. wordt onder gereglementeerde markt verstaan: een markt als bedoeld in artikel 1, onder 13, van de richtlijn
      beleggingsdiensten of een effectenbeurs, niet zijnde een markt als hiervoor bedoeld, waarvan de houder ingevolge
      [artikel 22][ref1] een erkenning heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel45a
