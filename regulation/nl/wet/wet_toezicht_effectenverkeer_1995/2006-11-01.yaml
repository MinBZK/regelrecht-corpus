  - number: '22'
    text: |-
      1 Het houden van een effectenbeurs is niet toegestaan dan na verkregen erkenning van Onze Minister.

      2 De erkenning wordt verleend indien de houder van de effectenbeurs aantoont dat hij in Nederland is gevestigd
      en het houden van de effectenbeurs, de voor die effectenbeurs te hanteren regels, hun toepassing en de controle
      op de naleving van die regels zullen voldoen aan hetgeen nodig is met het oog op een adequate functionering van
      de effectenmarkten of de positie van de beleggers op die markten. Met het oog op de verlening van de erkenning
      toetst Onze Minister ten minste de deskundigheid van de personen die het dagelijks beleid van de houder bepalen,
      de betrouwbaarheid van de personen die het beleid van de houder bepalen of mede bepalen, de financiële waarborgen,
      het afwikkelingssysteem, en de toepassing van de voor de effectenbeurs geldende regels op de instellingen,
      bedoeld in [artikel 6, eerste lid][ref1], op effecteninstellingen die zullen worden toegelaten tot deze beurs en
      op dochterondernemingen.

      3 Aan een erkenning kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een adequate
      functionering van de effectenmarkten of de positie van de beleggers op die markten.

      4 Het eerste lid is niet van toepassing op een gereglementeerde markt als bedoeld in artikel 1, onder 13, van de
      richtlijn beleggingsdiensten waarvan de houder in een andere lid-staat is gevestigd.

      5 Aan de vrijstelling, bedoeld in het vierde lid, is het voorschrift verbonden dat degene voor wie de vrijstelling
      geldt zich houdt aan door Onze Minister te stellen regels met het oog op een adequate functionering van de
      effectenmarkten of de positie van de beleggers op die markten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel6
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel22
