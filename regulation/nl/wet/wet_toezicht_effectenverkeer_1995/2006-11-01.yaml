  - number: 28b
    text: |-
      Indien een accountant naar het oordeel van Onze Minister niet of niet meer de nodige waarborgen biedt dat deze de
      toevertrouwde taak met betrekking tot de effecteninstelling naar behoren zal vervullen, kan Onze Minister bepalen
      dat hij niet bevoegd is de in deze wet en daaruit voortvloeiende besluiten bedoelde verklaringen omtrent de
      getrouwheid met betrekking tot die effecteninstelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel28b
  - number: 28c
    text: |-
      1 Indien tot de personen, die rechtstreeks of middellijk bevoegd zijn de personen te benoemen of te ontslaan die
      het beleid van de effecteninstelling bepalen of medebepalen, iemand behoort, die niet voldoet aan de op grond van
      [artikel 11, tweede lid][ref1], gestelde regels met betrekking tot zijn betrouwbaarheid, kan Onze Minister die
      personen, voor zover zij niet behoren tot de instelling, de aanwijzing geven dat degene, wiens betrouwbaarheid niet
      aan deze regels voldoet, deze bevoegdheid niet meer mag uitoefenen.

      2 De personen tot wie de aanwijzing is gericht, volgen deze binnen een door Onze Minister te stellen termijn op.

      3 De personen tot wie de aanwijzing is gericht, informeren Onze Minister binnen de gestelde termijn over de
      maatregelen die zijn getroffen om aan de aanwijzing gevolg te geven.

      4 De effecteninstelling geeft geen gevolg aan algemene of bijzondere instructies van degene, op wie een aanwijzing
      als bedoeld in het eerste lid betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel11
