  - number: 48c
    text: |-
      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens [de artikelen 3, eerste en vierde lid, ][ref1][4, tweede lid][ref2],
      [5, eerste lid, tweede volzin, aanhef en onderdelen a, b en c, en derde lid][ref3],
      [6, tweede lid][ref4], [6a, eerste en derde lid][ref5], [6b][ref6], [6c, tweede lid][ref7],
      [7, eerste, derde, vierde en zevende lid][ref8], [10, tweede lid][ref9], [11, eerste en tweede lid][ref10],
      [11a, eerste tot en met vijfde lid][ref11], [12, tweede en vierde lid][ref12],
      [13, eerste lid, tweede volzin, vijfde lid, zesde lid, eerste volzin, zevende en negende lid][ref13],
      [14, eerste en vierde lid][ref14], [15, tweede lid][ref15], [15a, eerste, tweede en derde lid][ref16],
      [15b, eerste en tweede lid][ref17], [16, eerste, zevende, achtste en tiende tot en met twaalfde lid][ref18],
      [17, eerste lid][ref19], [18, tweede lid][ref20], [18a, eerste lid][ref21], [18b, tweede lid][ref22],
      [19, derde lid][ref23], [21, zesde lid][ref24], [22, eerste, derde en vijfde lid][ref25],
      [23][ref26], [24, eerste en derde lid][ref27], [26a, eerste, vijfde, zesde en negende lid][ref28],
      [28, derde en zesde lid, onder a][ref29], [28c, tweede, derde en vierde lid][ref30],
      [28a, tweede en vierde lid][ref31], [29, tweede en derde lid][ref32], voor zover het betreft het voorschrift
      van [artikel 5:20 van de Algemene wet bestuursrecht][ref33] en het voorschrift inzage te verlenen
      in zakelijke gegevens en bescheiden, [29a, tweede en vierde volzin][ref34], [36, tweede lid][ref35],
      [37, tweede lid][ref36], [39, derde lid][ref37], voor zover het betreft het voorschrift op grond van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref38] inzage te verlenen in zakelijke gegevens en bescheiden,
      [46, eerste, derde en negende lid][ref39], [46a, eerste en tweede lid][ref40], [46b, eerste lid][ref41],
      [47, eerste, tweede, vijfde, zevende en achtste lid][ref42], [47a, eerste tot en met derde lid][ref43],
      [47c, eerste en derde lid][ref44], [47d, derde lid][ref45], [47e][ref46], [47f][ref47] en
      [48, eerste en tweede lid][ref48] en de artikelen 26, vijfde lid, 30 en 34 van de prospectusverordening.

      2 De bestuurlijke boete komt toe aan de staat. Voor zover Onze Minister met toepassing van
      [artikel 40, eerste lid][ref49], de bevoegdheid tot het opleggen van een bestuurlijke boete heeft overgedragen aan
      een rechtspersoon, komt de boete toe aan die rechtspersoon.

      3 Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.


