      - id: ref2
        bwb_id: BWBR0011468
  - number: '31'
    text: |-
      1 Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke ondernemingen
      of instellingen zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een instantie als bedoeld in
      [de artikelen 33, eerste lid][ref1], of [33][ref2], zijn ontvangen, worden niet gepubliceerd en zijn geheim.

      2 Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie als
      bedoeld in [de artikelen 33, eerste lid][ref3], of [33][ref4], ontvangen, of van gegevens of inlichtingen, bij het
      onderzoek van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te maken of daaraan verder of
      anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.

      3 Het eerste en tweede lid laten, ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref5].

      4 Het eerste en tweede lid laten evenzo, ten aanzien van degene op wie het tweede lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref6] en
      van [artikel 66 van de Faillissementswet][ref7] die betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een effecteninstelling die in staat van faillissement is verklaard of op grond
      van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet van toepassing in geval van gegevens of
      inlichtingen die betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een
      poging de desbetreffende effecteninstelling in staat te stellen haar bedrijf voort te zetten.

      5 In afwijking van het eerste en tweede lid kan Onze Minister met gebruikmaking van gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, mededelingen doen mits deze niet kunnen
      worden herleid tot afzonderlijke ondernemingen of instellingen.

      6 In afwijking van het eerste, tweede en vijfde lid kan Onze Minister gegevens of inlichtingen verkregen bij
      de vervulling van de hem ingevolge deze wet opgedragen taak verstrekken aan de houder van een op grond van
      [artikel 22][ref8] erkende effectenbeurs met het oog op de controle op de naleving van de voor die effectenbeurs te
      hanteren regels. Op de aldus verstrekte gegevens of inlichtingen zijn het eerste en tweede lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel33a
