    text: |-
      1 Het is een ieder die behoort tot een in het tweede lid genoemde categorie natuurlijke personen of rechtspersonen
      verboden om gebruik te maken van voorwetenschap door een transactie te verrichten of te bewerkstelligen:

      a. in of vanuit Nederland of een staat die geen lid-staat is in effecten die zijn toegelaten tot de handel op
      een gereglementeerde markt die gelegen is of werkzaam is in Nederland of waarvoor toelating tot die handel is
      aangevraagd;

      b. in of vanuit Nederland in effecten die zijn toegelaten tot de handel op een gereglementeerde markt die gelegen
      is of werkzaam is in een andere lid-staat of die zijn toegelaten tot de handel op een effectenbeurs die is
      gevestigd en van overheidswege toegelaten in een staat die geen lid-staat is, of in effecten waarvoor toelating tot
      die handel is aangevraagd; of

      c. in of vanuit Nederland of een staat die geen lid-staat is in effecten, niet zijnde effecten als bedoeld onder a
      of b, waarvan de waarde mede wordt bepaald door de onder a of b bedoelde effecten.

      2 De in het eerste lid bedoelde categorieën zijn:

      a. natuurlijke personen of rechtspersonen die over voorwetenschap beschikken vanwege het feit dat zij het dagelijks
      beleid bepalen of mede bepalen, dan wel toezicht houden op het beleid en de algemene gang van zaken van de
      rechtspersoon, vennootschap of instelling die effecten heeft uitgegeven als bedoeld in het eerste lid, waarop de
      voorwetenschap betrekking heeft;

      b. natuurlijke personen of rechtspersonen die over voorwetenschap beschikken vanwege het feit dat zij beschikken
      over een gekwalificeerde deelneming in de rechtspersoon, vennootschap of instelling, die effecten heeft uitgegeven
      als bedoeld in het eerste lid, waarop de voorwetenschap betrekking heeft;

      c. natuurlijke personen of rechtspersonen die toegang hebben tot informatie als bedoeld in het vierde of vijfde lid
      uit hoofde van de uitoefening van werk, beroep of functie;

      d. natuurlijke personen of rechtspersonen die over voorwetenschap beschikken uit hoofde van betrokkenheid bij
      strafbare feiten.

      3 Het is een ieder die niet behoort tot een in het tweede lid genoemde categorie en die weet of redelijkerwijs moet
      vermoeden dat hij over voorwetenschap beschikt, verboden om gebruik te maken van die voorwetenschap door:

      a. in of vanuit Nederland of een staat die geen lid-staat is een transactie te verrichten of te bewerkstelligen in
      effecten als bedoeld in [artikel 46, eerste lid, onder a][ref1];

      b. in of vanuit Nederland een transactie te verrichten of te bewerkstelligen in effecten als bedoeld in
      [artikel 46, eerste lid, onder b][ref2]; of

      c. in of vanuit Nederland of een staat die geen lid-staat is een transactie te verrichten of te bewerkstelligen in
      effecten als bedoeld in [artikel 46, eerste lid, onder c][ref3].

      4 Voorwetenschap is bekendheid met informatie die concreet is en die rechtstreeks of middellijk betrekking heeft op
      de rechtspersoon, vennootschap of instelling waarop de effecten betrekking hebben of op de handel in deze effecten,
      welke informatie niet openbaar is gemaakt en waarvan openbaarmaking significante invloed zou kunnen hebben op de
      koers van de effecten of op de koers van daarvan afgeleide effecten.

      5 Met betrekking tot effecten waarvan de waarde mede wordt bepaald door de waarde van grondstoffen is
      voorwetenschap bekendheid met niet openbaar gemaakte informatie die concreet is en die rechtstreeks of middellijk
      betrekking heeft op een of meer van die effecten, van welke informatie beleggers in die effecten bekendmaking mogen
      verwachten op grond van marktpraktijken die gebruikelijk zijn op de gereglementeerde markt waarop die effecten
      worden verhandeld. Bij of krachtens algemene maatregel van bestuur kunnen marktpraktijken als bedoeld in de vorige
      volzin worden aangewezen.

      6 Van informatie waarvan beleggers bekendmaking mogen verwachten als bedoeld in het vijfde lid is sprake indien
      deze van dien aard is dat deze:

      a. routinematig beschikbaar wordt gesteld aan de beleggers in die effecten;

      b. openbaar moet worden gemaakt overeenkomstig de met betrekking tot de desbetreffende gereglementeerde
      markt geldende wettelijke voorschriften of volgens de op die gereglementeerde markt gehanteerde marktregels,
      overeenkomsten of gangbare gewoonten.

      7 De verboden, bedoeld in het eerste en derde lid, zijn niet van toepassing op het verrichten of bewerkstelligen
      van transacties in effecten:

      a. ter nakoming van een opeisbare verbintenis die reeds bestond op het tijdstip waarop degene die de transactie
      verrichtte of bewerkstelligde kennis kreeg van de informatie, bedoeld in het vierde lid, met betrekking tot de
      rechtspersoon, vennootschap of instelling waarop die effecten betrekking hebben;

      b. in het kader van het monetaire beleid, het valutabeleid of het beheer van de overheidsschuld;

      c. in het kader van een terugkoopprogramma zoals omschreven in hoofdstuk II van [verordening nr. 2273/2003]
      (32003R2273) van de Commissie van de Europese Gemeenschappen van 22 december 2003 tot uitvoering van [Richtlijn
      2003/6/EG](32003L0006) van het Europees Parlement en de Raad van de Europese Unie wat de uitzonderingsregeling voor
      terugkoopprogramma’s en voor de stabilisatie van financiële instrumenten betreft (PbEU L 336); en

      d. in het kader van stabilisatie zoals omschreven in hoofdstuk III van [verordening nr. 2273/2003](32003R2273)
      van de Commissie van de Europese Gemeenschappen van 22 december 2003 tot uitvoering van [Richtlijn 2003/6/
      EG](32003L0006) van het Europees Parlement en de Raad van de Europese Unie wat de uitzonderingsregeling voor
      terugkoopprogramma’s en voor de stabilisatie van financiële instrumenten betreft (PbEU L 336).

      8 Bij algemene maatregel van bestuur kunnen categorieën transacties worden aangewezen waarop de in het eerste en
      derde lid bedoelde verboden niet van toepassing zijn. Daarbij kan binnen een aan te wijzen categorie onderscheid
      worden gemaakt naar de personen door wie en de omstandigheden waaronder de transacties worden verricht of
      bewerkstelligd.

      9 Het is verboden om gebruik te maken van voorwetenschap door te trachten een transactie te verrichten of te
      bewerkstelligen als bedoeld in het eerste lid.


