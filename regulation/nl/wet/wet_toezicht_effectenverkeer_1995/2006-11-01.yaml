  - number: 47f
    text: |-
      Een rechtspersoon, vennootschap of instelling met statutaire zetel in Nederland die effecten als bedoeld in
      [artikel 46, eerste lid, onder a of b][ref1], heeft uitgegeven of zal uitgeven, met uitzondering van effecten die
      zijn uitgegeven of zullen worden uitgegeven in het kader van het monetaire beleid, het valutabeleid of het beheer
      van de overheidsschuld, alsmede een rechtspersoon, vennootschap of instelling met statutaire zetel in een staat
      die niet een lid-staat is die effecten als bedoeld in [artikel 46, eerste lid, onder a][ref2], heeft uitgegeven of
      zal uitgeven, met uitzondering van effecten die zijn uitgegeven of zullen worden uitgegeven in het kader van het
      monetaire beleid, het valutabeleid of het beheer van de overheidsschuld, stelt een reglement vast waarin regels
      worden gesteld ten aanzien van het bezit van en transacties in op haar betrekking hebbende aandelen of in effecten
      waarvan de waarde mede wordt bepaald door de waarde van deze aandelen door haar werknemers en de personen, bedoeld
      in [artikel 47a, eerste lid, onder a en b][ref3]. Het reglement voldoet aan bij algemene maatregel van bestuur te
      stellen regels.


