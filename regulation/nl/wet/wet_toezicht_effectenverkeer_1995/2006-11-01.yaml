  - number: 6b
    text: |-
      Indien de bieder zijn openbaar bod gestand heeft gedaan, is het hem gedurende een periode van drie jaar na
      de verkrijgbaarstelling van het biedingsbericht niet toegestaan effecten van de soort waarop het openbaar bod
      betrekking had, direct of indirect, te verwerven tegen voor de rechthebbende van die effecten gunstiger voorwaarden
      dan volgens het openbaar bod.
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel6b
  - number: 6c
    text: |-
      1 Onze Minister kan vrijstelling of, op verzoek, ontheffing verlenen van [artikel 6a, eerste en derde lid][ref1],
      en [artikel 6b][ref2].

      2 Aan een vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden
      met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.


