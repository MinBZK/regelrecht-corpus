  - number: 46b
    text: |-
      1 Het is verboden om in of vanuit een in [artikel 46, eerste lid, onder a of b][ref1], bedoelde staat, telkens voor
      zover het effecten betreft als bedoeld in het desbetreffende onderdeel:

      a. een transactie of handelsorder in effecten te verrichten of te bewerkstelligen waarvan een onjuist of misleidend
      signaal uitgaat of te duchten is met betrekking tot het aanbod van, de vraag naar of de koers van die effecten;

      b. een transactie of handelsorder in effecten te verrichten of te bewerkstelligen teneinde de koers van die
      effecten op een kunstmatig niveau te houden;

      c. een transactie of handelsorder in effecten te verrichten of te bewerkstelligen waarbij gebruik wordt gemaakt van
      bedrog of misleiding; of

      d. informatie te verspreiden waarvan een onjuist of misleidend signaal uitgaat of te duchten is met betrekking
      tot het aanbod van, de vraag naar of de koers van effecten, terwijl de verspreider van die informatie weet of
      redelijkerwijs moet vermoeden dat die informatie onjuist of misleidend is.

      2 De verboden, bedoeld in het eerste lid, zijn niet van toepassing op het verrichten of bewerkstelligen van
      transacties of handelsorders in effecten of het verspreiden van informatie in het kader van:

      a. het monetaire beleid, het valutabeleid of het beheer van de overheidsschuld;

      b. een terugkoopprogramma zoals omschreven in hoofdstuk II van [verordening nr. 2273/2003](32003R2273) van de
      Commissie van de Europese Gemeenschappen van 22 december 2003 tot uitvoering van [Richtlijn 2003/6/EG](32003L0006)
      van het Europees Parlement en de Raad van de Europese Unie wat de uitzonderingsregeling voor terugkoopprogramma’s
      en voor de stabilisatie van financiële instrumenten betreft (PbEU L 336); en

      c. stabilisatie zoals omschreven in hoofdstuk III van [verordening nr. 2273/2003](32003R2273) van de Commissie
      van de Europese Gemeenschappen van 22 december 2003 tot uitvoering van [Richtlijn 2003/6/EG](32003L0006) van het
      Europees Parlement en de Raad van de Europese Unie wat de uitzonderingsregeling voor terugkoopprogramma’s en voor
      de stabilisatie van financiële instrumenten betreft (PbEU L 336).

      3 Bij algemene maatregel van bestuur kunnen categorieën transacties of handelsorders worden aangewezen waarop de in
      het eerste lid, aanhef en onder a en b, bedoelde verboden niet van toepassing zijn en kan de wijze waarop tot deze
      aanwijzing wordt gekomen verder worden uitgewerkt.

      4 Het verbod, bedoeld in het eerste lid, aanhef en onder d, is niet van toepassing voor zover het betreft het
      verspreiden van informatie door een journalist die in zijn normale beroepshoedanigheid handelt, rekening houdend
      met de regels die gelden binnen zijn beroepsgroep, tenzij deze journalist voordeel of winst behaalt uit de
      verspreiding van de informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel46
