        artikel: '22'
        hoofdstuk: VI
  - number: 45b
    text: |-
      Indien een overheidsinstantie in een andere lid-staat dan wel een instantie die in een andere lid-staat
      van overheidswege is aangewezen als bevoegde autoriteit in de zin van [richtlijn nr. 2003/6/EG](32003L0006)
      van het Europees Parlement en de Raad van de Europese Unie van 28 januari 2003 betreffende handel met
      voorwetenschap en marktmanipulatie (PbEU L 96) Onze Minister met het oog op het toezicht op de naleving
      van ter uitvoering van die richtlijn gestelde regels verzoekt om gegevens of inlichtingen als bedoeld in
      [artikel 33, eerste lid, aanhef][ref1], verstrekt Onze Minister die gegevens of inlichtingen onverwijld, tenzij:

      a. het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;

      b. het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het in de aanhef bedoelde
      toezicht;

      c. de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet, de nationale
      veiligheid of de openbare orde;

      d. de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen
      die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel33
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '33'
        hoofdstuk: VIII
