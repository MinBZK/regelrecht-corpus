  - number: '27'
    text: |-
      1 De houder van een op grond van [artikel 22][ref1] erkende effectenbeurs houdt de voor die effectenbeurs geldende
      regels in overeenstemming met richtlijnen inzake het effectenverkeer van de Raad van de Europese Unie dan wel van
      het Europees Parlement en de Raad van de Europese Unie gezamenlijk.

      2 Onze Minister kan aan de houder van een op grond van [artikel 22][ref2] erkende effectenbeurs voorschriften geven
      ter uitvoering van de in het eerste lid bedoelde richtlijnen.

      3 De houder van de effectenbeurs, bedoeld in het tweede lid, volgt de in het tweede lid bedoelde voorschriften op
      binnen een door Onze Minister te bepalen termijn.

      4 Iedere wijziging in de regels, bedoeld in het eerste lid, wordt vooraf aan Onze Minister voorgelegd teneinde
      na te gaan of aan de in het eerste lid bedoelde richtlijnen wordt voldaan onderscheidenlijk of door die wijziging
      strijd met die richtlijnen zou ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel22
    url: https://wetten.overheid.nl/BWBR0007657/2006-11-01#Artikel27
    references:
