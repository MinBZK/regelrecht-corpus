  - number: 47a
    text: |-
      1 Een ieder die:

      a. het dagelijks beleid bepaalt of mede bepaalt van een rechtspersoon, vennootschap of instelling met statutaire
      zetel in Nederland die effecten als bedoeld in [artikel 46, eerste lid, onder a of b][ref1], heeft uitgegeven of
      zal uitgeven of van een rechtspersoon, vennootschap of instelling met statutaire zetel in een staat die niet een
      lid-staat is die effecten als bedoeld in [artikel 46, eerste lid, onder a][ref2], heeft uitgegeven of zal uitgeven;

      b. toezicht houdt op het beleid van het bestuur en de algemene gang van zaken in een rechtspersoon, vennootschap of
      instelling als bedoeld onder a, en de daarmee verbonden onderneming;

      c. een leidinggevende functie heeft en uit dien hoofde de bevoegdheid heeft om besluiten te nemen die gevolgen
      hebben voor de toekomstige ontwikkelingen en bedrijfsvooruitzichten van een rechtspersoon, vennootschap
      of instelling als bedoeld onder a en die regelmatig kennis kan hebben van informatie als bedoeld in
      [artikel 46, vierde of vijfde lid][ref3]; of

      d. behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie van personen die nauw gelieerd zijn
      met een onder a, b of c bedoelde persoon,

      doet uiterlijk op de vijfde werkdag na de transactiedatum melding van voor eigen rekening verrichte of
      bewerkstelligde transacties in aandelen die betrekking hebben op de onder a, b, onderscheidenlijk c bedoelde
      rechtspersoon, vennootschap of instelling, of in effecten waarvan de waarde mede wordt bepaald door de waarde van
      deze aandelen. De melding wordt, indien het een rechtspersoon, vennootschap of instelling met statutaire zetel
      in Nederland betreft, gedaan aan Onze Minister of, indien van toepassing, aan de rechtspersoon waaraan ingevolge
      [artikel 40][ref4] taken en bevoegdheden zijn overgedragen, of, indien het een rechtspersoon, vennootschap of
      instelling betreft waarvan de statutaire zetel zich niet in een lid-staat bevindt, aan de toezichthouder van de
      lid-staat waarin de rechtspersoon, vennootschap of instelling gehouden is de jaarlijkse informatie in verband
      met aandelen te verstrekken overeenkomstig artikel 10 van [richtlijn nr. 2003/71/EG](32003L0071) van het Europees
      Parlement en de Raad van de Europese Unie van 4 november 2003 betreffende het prospectus dat gepubliceerd moet
      worden wanneer effecten van het publiek worden aangeboden of tot de handel worden toegelaten en tot wijziging van
      [richtlijn nr. 2001/34/EG](32001L0034) (PbEU L 345).

      2 De melding kan worden uitgesteld tot het tijdstip waarop de voor eigen rekening verrichte transacties door
      personen als bedoeld in het eerste lid, onder a, b of c, per persoon in het desbetreffende kalenderjaar een bedrag
      van € 5 000 of meer bedragen of waarop de voor eigen rekening verrichte transacties door een persoon als bedoeld
      onder a, b of c, opgeteld bij de voor eigen rekening verrichte transacties van de met hem gelieerde personen als
      bedoeld onder d, in het desbetreffende kalenderjaar een bedrag van € 5 000 of meer bedragen.

      3 De melding voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels.

      4 De melding kan worden gedaan door tussenkomst van een door de rechtspersoon, vennootschap of instelling waarop de
      effecten betrekking hebben aan te wijzen persoon.

      5 Ten aanzien van de melding kan bij algemene maatregel van bestuur worden bepaald dat indien op grond van
      daarbij aan te wijzen andere wettelijke bepalingen reeds bepaalde gegevens aan Onze Minister dan wel, indien van
      toepassing, aan de rechtspersoon aan wie ingevolge [artikel 40][ref5] taken en bevoegdheden zijn overgedragen, zijn
      gemeld, daardoor aan de verplichting tot melding op grond van het eerste lid is voldaan.

      6 Dit artikel is niet van toepassing op transacties die zijn verricht of bewerkstelligd in het kader van het
      monetaire beleid, het valutabeleid of het beheer van de overheidsschuld. Bij algemene maatregel van bestuur kunnen
      andere categorieën transacties worden aangewezen waarop dit artikel niet van toepassing is.


