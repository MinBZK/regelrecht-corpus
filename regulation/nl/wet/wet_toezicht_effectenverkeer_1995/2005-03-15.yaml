  - number: '16'
    text: |-
      1 Het is verboden, anders dan na verkregen verklaring van geen bezwaar, een gekwalificeerde deelneming te
      houden, te verwerven of te vergroten in een effecteninstelling waaraan een vergunning is verleend op grond van
      [artikel 7, vierde of zesde lid][ref1], dan wel enige zeggenschap verbonden aan een gekwalificeerde deelneming uit
      te oefenen in een instelling als hiervoor bedoeld.

      2 Het eerste lid is niet van toepassing op een handeling als bedoeld in het eerste lid waarvoor ingevolge de
      [Wet toezicht kredietwezen 1992][ref2] een verklaring van geen bezwaar is verleend en op een handeling als
      bedoeld in [artikel 23, eerste lid, onderdeel b of c, van die wet][ref3] waarvoor op grond van die onderdelen geen
      verklaring van geen bezwaar is vereist.

      3 Onze Minister verleent, op verzoek, een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste
      lid, tenzij hij van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een invloed op de betrokken
      effecteninstelling die in strijd is met een gezonde, prudente of integere bedrijfsvoering van die instelling.

      4 Op de aanvraag wordt binnen dertien weken beslist.

      5 Indien een verklaring van geen bezwaar wordt verleend, kan de aanvrager tevens toestemming worden verleend tot
      het vergroten van de gekwalificeerde deelneming, waarbij als bovengrens 20, 33, 50 of 100 procent kan gelden.
      Indien een verklaring van geen bezwaar wordt verleend voor een deelneming in een effecteninstelling, kan op verzoek
      van de aanvrager, worden bepaald dat de verleende verklaring van geen bezwaar geldt voor alle groepsmaatschappijen
      gezamenlijk.

      6 Van het verlenen van een verklaring van geen bezwaar als bedoeld in het eerste lid wordt door Onze Minister aan
      de betrokken effecteninstelling mededeling gedaan.

      7 Aan een verklaring van geen bezwaar die is verleend op grond van het derde lid kunnen beperkingen worden gesteld
      en voorschriften worden verbonden om te voorkomen dat de handeling waarvoor de verklaring van geen bezwaar is
      verleend, zou leiden of zou kunnen leiden tot een invloed op de betrokken effecteninstelling die in strijd is met
      een gezonde, prudente of integere bedrijfsvoering van die instelling.

      8 Ingeval het houden, het verwerven of het vergroten van een gekwalificeerde deelneming in een effecteninstelling
      als bedoeld in het eerste lid is verricht zonder dat voor die handeling een verklaring van geen bezwaar is
      verkregen of de bij die verklaring gestelde beperkingen in acht zijn genomen dan wel dat met betrekking tot die
      handeling de vrijstelling, bedoeld in het tweede lid, van toepassing is, maakt de in overtreding zijnde natuurlijke
      persoon of rechtspersoon binnen een door Onze Minister te bepalen termijn de verrichte handeling ongedaan
      onderscheidenlijk neemt hij de beperkingen alsnog in acht. Deze verplichting vervalt op het tijdstip waarop en voor
      zover voor de desbetreffende handeling alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in
      acht genomen beperkingen worden ingetrokken.

      9 Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming in een
      effecteninstelling als bedoeld in het eerste lid is geschied zonder dat voor die handeling een verklaring van geen
      bezwaar is verkregen of de bij die verklaring gestelde beperkingen in acht zijn genomen dan wel dat met betrekking
      tot die handeling de vrijstelling, bedoeld in het tweede lid, van toepassing is, is een mede door de uitgeoefende
      zeggenschap tot stand gekomen besluit vernietigbaar. Het besluit kan worden vernietigd op vordering van Onze
      Minister. Het besluit wordt in dat geval door de rechtbank, binnen welker rechtsgebied de effecteninstelling is
      gevestigd, vernietigd indien het besluit zonder dat de desbetreffende zeggenschap zou zijn uitgeoefend, anders zou
      hebben geluid dan wel niet zou zijn genomen, tenzij voor het tijdstip van de uitspraak alsnog een verklaring van
      geen bezwaar wordt verleend dan wel de niet in acht genomen beperkingen worden ingetrokken. De rechtbank regelt
      voor zover nodig de gevolgen van de vernietiging.

      10 Ingeval voorschriften die zijn verbonden aan de verklaring van geen bezwaar die is verleend op grond van het
      derde lid, niet worden nagekomen, kan Onze Minister een termijn vaststellen waarbinnen de in overtreding zijnde
      houder de niet nagekomen voorschriften alsnog moet vervullen.

      11 Iedere natuurlijke persoon of rechtspersoon stelt Onze Minister vooraf in kennis van een zodanige wijziging van
      diens gekwalificeerde deelneming in een effecteninstelling waardoor de omvang van deze deelneming:

      a. boven de 20, 33, 50 of 95 procent stijgt, 100 procent wordt dan wel waardoor de effecteninstelling een
      dochtermaatschappij wordt; of

      b. onder de 10, 20, 33, 50, 95 of 100 procent daalt, dan wel waardoor de effecteninstelling ophoudt een
      dochtermaatschappij te zijn.

      12 Een effecteninstelling als bedoeld in het eerste lid stelt, voor zover haar bekend, Onze Minister in de
      maand juli van elk jaar in kennis van de identiteit van iedere natuurlijke persoon of rechtspersoon die een
      gekwalificeerde deelneming in deze instelling houdt. Tevens stelt de effecteninstelling, zodra zulks haar bekend
      wordt, Onze Minister in kennis van iedere verwerving, afstoting of wijziging van een gekwalificeerde deelneming in
      deze instelling waardoor de omvang van deze deelneming:

      a. boven de 20, 33, 50 of 95 procent stijgt, 100 procent wordt dan wel waardoor de effecteninstelling een
      dochtermaatschappij wordt; of

      b. onder de 10, 20, 33, 50, 95 of 100 procent daalt dan wel waardoor de effecteninstelling ophoudt een
      dochtermaatschappij te zijn.

      13 Indien de omvang van een deelneming waarvoor een verklaring van geen bezwaar is afgegeven onder de 10 procent
      daalt, vervalt de afgegeven verklaring van geen bezwaar van rechtswege.


