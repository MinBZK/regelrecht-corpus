  - number: 46a
    text: |-
      1 Het is een ieder die beschikt over voorwetenschap omtrent een rechtspersoon, vennootschap of
      instelling als bedoeld in [artikel 46, tweede lid][ref1], of omtrent de handel in effecten als bedoeld in
      [artikel 46, eerste lid][ref2], die op die rechtspersoon, vennootschap of instelling betrekking hebben, verboden
      om, anders dan in de normale uitoefening van zijn werk, beroep of functie:

      a. deze voorwetenschap aan een derde mee te delen, of

      b. een derde aan te bevelen transacties te verrichten of te bewerkstelligen in die effecten.

      2 Het verbod, bedoeld in het eerste lid, aanhef en onder b, is niet van toepassing op de rechtspersoon,
      vennootschap of instelling, waarvan de werknemers die zijn betrokken bij het aanbevelen niet over voorwetenschap
      beschikken.

      3 Ten aanzien van strafbare feiten als bedoeld in het eerste lid is de rechtbank van Amsterdam in eerste aanleg bij
      uitsluiting bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel46
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel46a
