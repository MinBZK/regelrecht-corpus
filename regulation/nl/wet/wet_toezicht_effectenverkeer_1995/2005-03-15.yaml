        artikel: '84'
  - number: '3'
    text: |-
      1 Het is verboden in of vanuit Nederland buiten een besloten kring bij uitgifte effecten aan te bieden dan wel
      zodanige aanbieding door middel van advertenties of documenten in het vooruitzicht te stellen.

      2 Het eerste lid is niet van toepassing indien:

      a. de aan te bieden effecten zijn toegelaten tot de notering aan een op grond van [artikel 22][ref1] erkende
      effectenbeurs, of aannemelijk is dat zij daartoe spoedig zullen worden toegelaten;

      b. ter zake van een aanbod een prospectus algemeen verkrijgbaar is dat voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen regels, mits daarnaar in elke schriftelijke bekendmaking van het aanbod wordt
      verwezen;

      c. ter zake van een aanbieding die in het vooruitzicht wordt gesteld, wordt voldaan aan bij of krachtens algemene
      maatregel van bestuur te stellen regels; of

      d. de aan te bieden effecten rechten van deelneming betreffen in een beleggingsinstelling die is ingeschreven in
      het register, bedoeld in [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2].

      3 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt met het in Nederland bij uitgifte
      aanbieden van effecten gelijkgesteld het voor de eerste keer in Nederland aanbieden van effecten van een soort dat:

      a. sedert de uitgifte nog niet verkrijgbaar is geweest in Nederland;

      b. sedert de uitgifte nog niet verkrijgbaar is geweest in Nederland buiten een besloten kring;

      c. sedert de uitgifte nog niet verkrijgbaar is geweest in Nederland buiten een kring van natuurlijke personen en
      rechtspersonen die beroeps- of bedrijfsmatig handelen of beleggen in effecten; of

      d. sedert de uitgifte nog niet verkrijgbaar is geweest in Nederland anders dan uitsluitend als pakket tegen een
      waarde van ten minste een door Onze Minister te bepalen bedrag per belegger.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
