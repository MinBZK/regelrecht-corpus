  - number: '36'
    text: |-
      1 Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, kan Onze Minister ten behoeve van een
      instantie die werkzaam is in een staat die met Nederland partij is bij een verdrag of die met Nederland valt onder
      eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die staat belast is met de uitvoering
      van wettelijke regelingen inzake het toezicht op het effectenverkeer, inlichtingen vragen aan of een onderzoek
      instellen of doen instellen bij een ieder die ingevolge deze wet onder zijn toezicht valt dan wel bij een ieder
      waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of inlichtingen beschikt die van belang kunnen zijn
      voor de uitvoering van de wettelijke regelingen als hiervoor bedoeld.

      2 Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel36
  - number: '37'
    text: |-
      1 Onze Minister kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 36, eerste lid][ref1], deelneemt aan de uitvoering van een onderzoek als bedoeld in dat lid.

      2 Degene bij wie een onderzoek als bedoeld in [artikel 36, eerste lid][ref2], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.

      3 De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      onderzoek is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel36
