  - number: 26A
    text: |-
      1 Het is verboden, anders dan na verkregen verklaring van geen bezwaar, een gekwalificeerde deelneming te houden,
      te verwerven of te vergroten in een houder van een effectenbeurs aan wie op grond van [artikel 22][ref1] een
      erkenning is verleend, waarbij in afwijking van [artikel 1, onder f][ref2], een percentage geldt van meer dan 10
      procent, dan wel enige zeggenschap verbonden aan deze gekwalificeerde deelneming uit te oefenen in een houder van
      een effectenbeurs als hiervoor bedoeld.

      2 Onze Minister verleent, op verzoek, een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste
      lid, tenzij

      a. hij van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een invloed op de betrokken houder
      van een effectenbeurs die in strijd is met hetgeen nodig is met het oog op een adequate functionering van die
      effectenbeurs of de positie van de beleggers op die effectenbeurs;

      b. hij van oordeel is dat de handeling ertoe zou leiden of zou kunnen leiden dat de betrokken houder behoort of zou
      gaan behoren tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige mate ondoorzichtig
      is dat deze een belemmering zou vormen voor het adequaat uitoefenen van de controle op de naleving van de voor de
      effectenbeurs geldende regels.

      3 Op de aanvraag wordt binnen dertien weken beslist.

      4 Van het verlenen van een verklaring van geen bezwaar wordt door Onze Minister aan de betrokken houder van de
      effectenbeurs mededeling gedaan.

      5 Aan een verklaring van geen bezwaar kunnen, op grond van de in het tweede lid genoemde overwegingen, beperkingen
      worden gesteld en voorschriften worden verbonden.

      6 Ingeval het houden, het verwerven of het vergroten van een gekwalificeerde deelneming is verricht zonder dat
      voor die handeling een verklaring van geen bezwaar is verkregen of de bij die verklaring gestelde beperkingen in
      acht zijn genomen, is de in overtreding zijnde natuurlijke persoon of rechtspersoon gehouden binnen een door Onze
      Minister te bepalen termijn de verrichte handeling ongedaan te maken dan wel de beperkingen alsnog in acht te
      nemen. Deze verplichting vervalt op het tijdstip waarop en voorzover voor de desbetreffende handeling alsnog een
      verklaring van geen bezwaar wordt verleend dan wel de niet in acht genomen beperkingen worden ingetrokken.

      7 Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming is geschied zonder
      dat voor die handeling een verklaring van geen bezwaar is verkregen of de bij die verklaring gestelde beperkingen
      in acht zijn genomen, is een mede door de uitgeoefende zeggenschap tot stand gekomen besluit vernietigbaar.
      Het besluit kan worden vernietigd op vordering van Onze Minister. Het besluit wordt in dat geval door de
      rechtbank, binnen welker rechtsgebied de effectenbeurs is gevestigd, vernietigd indien het besluit zonder dat de
      desbetreffende zeggenschap zou zijn uitgeoefend, anders zou hebben geluid dan wel niet zou zijn genomen, tenzij
      voor het tijdstip van de uitspraak alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in acht
      genomen beperkingen worden ingetrokken. De rechtbank regelt voorzover nodig de gevolgen van de vernietiging.

      8 Ingeval voorschriften die zijn verbonden aan de verklaring van geen bezwaar niet worden nagekomen, kan Onze
      Minister een termijn vaststellen waarbinnen de in overtreding zijnde houder van de verklaring van geen bezwaar de
      niet nagekomen voorschriften alsnog moet vervullen.

      9 Onze Minister kan een op grond van het tweede lid verleende verklaring van geen bezwaar slechts wijzigen of
      intrekken dan wel daaraan nadere beperkingen stellen of nadere voorschriften verbinden:

      a. op verzoek van de houder van de verklaring van geen bezwaar;

      b. indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van geen bezwaar zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;

      c. indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan, zo zij voor het tijdstip waarop
      de verklaring van geen bezwaar werd verleend zich hadden voorgedaan of bekend waren geweest, de verklaring van geen
      bezwaar zou zijn geweigerd dan wel daaraan nadere beperkingen zouden zijn gesteld of nadere voorschriften zouden
      zijn verbonden;

      d. indien de houder van de verklaring van geen bezwaar niet meer als een houder van de gekwalificeerde deelneming
      kan worden aangemerkt;

      e. indien de houder van de verklaring van geen bezwaar niet alsnog binnen de termijn, bedoeld in het zesde lid,
      eerste volzin, alle bij de verklaring van geen bezwaar gestelde beperkingen in acht neemt;

      f. indien de houder van de verklaring van geen bezwaar niet meer voldoet aan bij of krachtens deze wet gestelde
      regels of beperkingen of gegeven voorschriften.


