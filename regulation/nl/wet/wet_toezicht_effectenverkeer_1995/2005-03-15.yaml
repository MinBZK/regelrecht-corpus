      1 Onze Minister kan een op grond van [de artikelen 4][ref1] en [5][ref2] verleende ontheffing en een vergunning
      als bedoeld in [artikel 7, eerste lid][ref3], slechts intrekken:

      a. op verzoek van de houder;

      b. indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de ontheffing of vergunning zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;

      c. indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan, zo zij voor het tijdstip waarop
      de ontheffing of vergunning werd verleend zich hadden voorgedaan of bekend waren geweest, de ontheffing of de
      vergunning zou zijn geweigerd;

      d. indien de houder:

      1°. binnen een termijn van twaalf maanden na de verlening van de vergunning daarvan geen gebruik heeft gemaakt;

      2°. uitdrukkelijk te kennen heeft gegeven geen gebruik van de vergunning te zullen maken;

      3°. het verrichten van werkzaamheden waarop de vergunning betrekking heeft gedurende een termijn van meer dan zes
      maanden heeft gestaakt; of

      4°. kennelijk opgehouden heeft effecteninstelling te zijn;

      e. indien de houder niet meer voldoet aan bij of krachtens deze wet gestelde regels of beperkingen of gegeven
      voorschriften;

      f. indien de houder niet of niet genoegzaam uitvoering heeft gegeven aan een aanwijzing of een aanzegging door Onze
      Minister op grond van deze wet gegeven.

      2 Indien Onze Minister vaststelt dat een kredietinstelling of financiële instelling als bedoeld in
      [artikel 28a, eerste lid][ref4], niet voldoet aan de in het tweede en derde lid van dat artikel bedoelde
      verplichting, kan Onze Minister bepalen dat [artikel 7, tweede lid, onder h][ref5], niet van toepassing is ten
      aanzien van die instelling.

      3 Degene wiens ontheffing of vergunning is ingetrokken, wikkelt binnen een door Onze Minister te stellen termijn
      alle lopende overeenkomsten af die door deze zijn aangegaan voordat de intrekking aan hem werd bekendgemaakt. Onze
      Minister kan deze termijn verlengen. Hij kan een ander met de afwikkeling belasten, die aan hem verantwoording
      schuldig is.


