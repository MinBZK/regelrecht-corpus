  - number: 28a
    text: |-
      1 Onze Minister pleegt overleg met representatieve organisaties van in Nederland gevestigde effecteninstellingen
      over de invoering van één of meer regelingen omtrent een garantie voor nader te bepalen vorderingen van
      beleggers in verband met beleggingsverrichtingen, tot een nader te bepalen maximum, op in Nederland gevestigde
      effecteninstellingen waaraan een vergunning als bedoeld in [artikel 7, eerste lid][ref1], is verleend, alsmede
      op kredietinstellingen en financiële instellingen waaraan het ingevolge [artikel 6][ref2] onderscheidenlijk
      [artikel 45 van de Wet toezicht kredietwezen 1992][ref3] is toegestaan diensten ter zake van effectenbemiddeling
      of vermogensbeheer aan te bieden of te verrichten, tegen het risico dat een zodanige instelling haar verplichtingen
      met betrekking tot die vorderingen niet nakomt.

      2 Indien het overleg, bedoeld in het eerste lid, leidt tot overeenstemming tussen Onze Minister en de betrokken
      representatieve organisaties, kan bij koninklijk besluit worden bepaald dat de instellingen, bedoeld in het eerste
      lid, verplicht zijn aan de uitvoering van een samenstel van regelingen mee te werken.

      3 Onze Minister kan besluiten dat een effecteninstelling die niet in een Lid-Staat is gevestigd en waaraan een
      vergunning als bedoeld in [artikel 7, eerste lid][ref4], is verleend onderscheidenlijk een kredietinstelling of een
      financiële instelling, waaraan het ingevolge [artikel 38 van de Wet toezicht kredietwezen 1992][ref5] is toegestaan
      in Nederland diensten ter zake van effectenbemiddeling of vermogensbeheer aan te bieden of te verrichten, verplicht
      is aan de uitvoering van een van de op hem toepasselijke regelingen, bedoeld in het eerste lid, mee te werken
      indien Onze Minister van oordeel is dat op vorderingen in verband met beleggingsverrichtingen op die onderneming of
      instelling geen beleggerscompensatieregeling van toepassing is waarvan de dekking gelijkwaardig is aan de dekking,
      bedoeld in [artikel 11, eerste lid][ref6], van [richtlijn nr. 97/9/EG](31997L0009) van het Europees Parlement en de
      Raad van de Europese Unie van 3 maart 1997 inzake de beleggerscompensatiestelsels (PbEG L 84).

      4 Indien het overleg, bedoeld in het eerste lid, niet binnen een door Onze Minister te bepalen termijn leidt tot
      overeenstemming dan wel indien de regeling of het samenstel van regelingen waaromtrent overeenstemming is bereikt,
      niet de instemming heeft van Onze Minister, kan bij koninklijk besluit een regeling als bedoeld in het eerste lid
      worden ingevoerd, nadat de in het eerste lid bedoelde organisaties van effecteninstellingen alsmede, indien van
      toepassing, de rechtspersoon, waaraan ingevolge [artikel 40][ref7] de in het eerste lid bedoelde bevoegdheid is
      overgedragen, in de gelegenheid zijn gesteld hun gevoelen omtrent de inhoud van de in te voeren regeling kenbaar
      te maken.

      5 Na inwerkingtreding van een koninklijk besluit als bedoeld in het vierde lid wordt zo spoedig mogelijk, maar
      uiterlijk binnen acht weken, een voorstel van wet tot goedkeuring van het koninklijk besluit aan de Tweede Kamer
      der Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien één van de Kamers der Staten-Generaal
      tot het niet-aannemen van het voorstel besluit, wordt zo spoedig mogelijk bij koninklijk besluit een nieuwe
      regeling als bedoeld in het eerste lid ingevoerd. Het vierde lid en de eerste twee volzinnen van dit lid zijn op
      het in de vorige volzin bedoelde koninklijk besluit van overeenkomstige toepassing.

      6 Het eerste, tweede, vierde en vijfde lid zijn van overeenkomstige toepassing op wijziging of intrekking van een
      met inachtneming van die leden tot stand gekomen regeling.


