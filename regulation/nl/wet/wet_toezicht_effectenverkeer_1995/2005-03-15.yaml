  - number: '6'
    text: |-
      1 Indien Onze Minister vaststelt dat een instelling te wier laste effecten zijn uitgegeven die zijn toegelaten tot
      de notering aan een op grond van [artikel 22][ref1] erkende effectenbeurs zich niet houdt of heeft gehouden aan de
      regels van de effectenbeurs waaraan die instelling in verband met die toelating is onderworpen, vestigt hij daarop
      de aandacht van de houder van die effectenbeurs. Zonodig doet Onze Minister deze mededeling vergezeld gaan van dan
      wel volgen door een aanwijzing met betrekking tot een door deze jegens de instelling te volgen gedragslijn met het
      oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.

      2 De houder van de effectenbeurs volgt de in het eerste lid bedoelde aanwijzing op binnen een door Onze Minister te
      bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
