  - number: '8'
    text: |-
      1 Indien een andere lid-staat de richtlijn beleggingsdiensten of de richtlijn kapitaaltoereikendheid niet of
      onvolledig heeft uitgevoerd, kan Onze Minister bepalen dat [artikel 7, tweede lid, aanhef en onder i en j][ref1],
      niet van toepassing is op effecteninstellingen die in die andere lid-staat zijn gevestigd.

      2 Met ingang van het tijdstip waarop de maatregel, bedoeld in het eerste lid, ten aanzien van een lid-
      staat wordt ingetrokken, wordt ten aanzien van een in die lid-staat gevestigde effecteninstelling
      die op dat moment het beroep of bedrijf van effecteninstelling door middel van een bijkantoor of
      door middel van het verrichten van diensten in Nederland uitoefent en die daarvoor een vergunning
      als bedoeld in [artikel 7, eerste lid][ref2], heeft verkregen, geacht te zijn voldaan aan
      [artikel 7, tweede lid, onderdeel i, onder 2° en 3°, onderscheidenlijk onderdeel j, onder 2°][ref3]. De aan de
      effecteninstelling verleende vergunning vervalt op dat tijdstip van rechtswege.


