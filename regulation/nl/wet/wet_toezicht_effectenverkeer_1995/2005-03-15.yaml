    text: |-
      Een instelling die effecten als bedoeld in [artikel 46, eerste lid, onder a][ref1], heeft uitgegeven of zal
      uitgeven, stelt een reglement vast waarin regels worden gesteld ten aanzien van het bezit van en transacties
