  - number: '45'
    text: |-
      1 Onze Minister kan, mede ter uitvoering van besluiten die zijn genomen ingevolge de bepalingen betreffende de
      betrekkingen met derde landen in de richtlijn beleggingsdiensten, bepalen dat:

      a. in afwijking van [artikel 7][ref1], de behandeling van aanvragen voor een vergunning als bedoeld in
      [artikel 7, eerste lid][ref2], die zijn ingediend door dochtermaatschappijen van ondernemingen of instellingen die
      niet in een lid-staat zijn gevestigd, voor een bepaalde termijn wordt opgeschort, dan wel dat dergelijke aanvragen
      slechts tot een door Onze Minister te bepalen aantal worden gehonoreerd;

      b. in afwijking van [artikel 16][ref3], de behandeling van aanvragen voor een verklaring van geen bezwaar als
      bedoeld in [artikel 16, derde lid][ref4], die zijn ingediend door ondernemingen of instellingen die niet in een
      lid-staat zijn gevestigd, voor een bepaalde termijn wordt opgeschort, met overeenkomstige opschorting van de
      termijn, bedoeld in [artikel 16, vierde lid][ref5], dan wel dat dergelijk aanvragen slechts tot een door Onze
      Minister te bepalen aantal worden gehonoreerd; en

      c. in afwijking van [artikel 7, tweede lid, aanhef en onder i of j][ref6], [artikel 7, vierde lid][ref7], van
      toepassing is op effecteninstellingen die zijn gevestigd in een staat, niet zijnde een lid-staat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, die dochtermaatschappij zijn
      van ondernemingen of instellingen die niet in een lid-staat zijn gevestigd.

      2 Het eerste lid is niet van toepassing indien de bedoelde dochtermaatschappijen of gekwalificeerde deelnemingen
      tevens dochtermaatschappijen onderscheidenlijk gekwalificeerde deelnemingen zijn van een onderneming of instelling
      die in een lid-staat is gevestigd en die een voor het als effectenbemiddelaar of vermogensbeheerder aanbieden of
      verrichten van diensten benodigde vergunning heeft verkregen.

      3 Onze Minister kan bepalen dat, in afwijking van [artikel 7, vierde lid][ref8], vergunningen voor bijkantoren in
      Nederland van effecteninstellingen die niet in een lid-staat zijn gevestigd niet dan wel slechts onder het stellen
      van beperkingen of het verbinden van voorschriften worden verleend.

      4 Indien een bijkantoor in Nederland van een effecteninstelling die niet in een lid-staat is gevestigd en die een
      vergunning als bedoeld in [artikel 7, eerste lid][ref9], heeft verkregen onder het stellen van beperkingen dan
      wel het verbinden van voorschriften als bedoeld in het derde lid, een handeling verricht zonder dat alle bij de
      vergunning gestelde beperkingen onderscheidenlijk alle aan de vergunning verbonden voorschriften zijn nagekomen,
      maakt de effecteninstelling binnen een door Onze Minister te bepalen termijn de verrichte handeling ongedaan
      of voldoet zij alsnog aan de niet nagekomen beperkingen onderscheidenlijk vervult zij alsnog de niet nagekomen
      voorschriften.


