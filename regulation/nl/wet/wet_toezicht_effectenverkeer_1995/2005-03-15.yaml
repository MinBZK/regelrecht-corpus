  - number: 48o
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat Onze Minister zijn handelen of nalaten op grond van [artikel 48n][ref1] ter openbare kennis zal
      brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48o
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
  - number: 48p
    text: |-
      1 Onze Minister geeft, indien hij voornemens is op grond van [artikel 48n][ref1] een feit ter openbare kennis te
      brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.

      2 In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref2], is Onze Minister niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48p
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:8
  - number: 48q
    text: |-
      De beschikking om op grond van [artikel 48n][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:

        - het feit dat ter openbare kennis wordt gebracht;
        - de wijze waarop het feit ter openbare kennis wordt gebracht; en
        - de termijn waarna het feit ter openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48q
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
  - number: 48r
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 48n][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48r
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
  - number: 48s
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking in werking op de dag
      waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien
      beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres
      ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel340
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48s
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:40
  - number: 48t
    text: |-
      1 De bevoegdheid om op grond van [artikel 48n][ref1] een feit ter openbare kennis te brengen vervalt indien ter
      zake van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen,
      dan wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].

      2 Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 48m][ref3] vervalt, indien Onze
      Minister het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel48m
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48t
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0007657
        artikel: 48m
        hoofdstuk: XII_B
  - number: 48u
    text: |-
      1 De bevoegdheid om op grond van [artikel 48n][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaats gehad.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48u
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
  - number: 48v
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 48n][ref1] ter openbare kennis brengen van een feit
      worden verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan
      voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48n
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel48v
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48n
        hoofdstuk: XIIC
  - number: '59'
    text: |-
      Van de verlening of intrekking van een vrijstelling, vergunning, erkenning of ontheffing en van het van kracht
      worden van het verbod, bedoeld in [artikel 12, vierde lid][ref1], wordt door de zorg van Onze Minister mededeling
      gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel12
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '60'
    text: |-
      1 Effectenbemiddelaars of vermogensbeheerders waarop op het tijdstip van inwerkingtreding van
      [artikel 7, eerste lid][ref1], van deze wet [artikel 8](onbekend) onderscheidenlijk [artikel 12 van de Wet
      toezicht effectenverkeer ](onbekend)van toepassing is, worden geacht op dat tijdstip een vergunning als bedoeld in
      [artikel 7, eerste lid][ref2], te hebben verkregen.

      2 Effectenbemiddelaars of vermogensbeheerders die op het tijdstip van inwerkingtreding van
      [artikel 7, eerste lid][ref3], van deze wet een vergunning als bedoeld in [artikel 6, eerste lid](onbekend),
      onderscheidenlijk [artikel 10, eerste lid, van de Wet toezicht effectenverkeer](onbekend) bezitten, worden geacht
      op dat tijdstip een vergunning als bedoeld in [artikel 7, eerste lid][ref4], van deze wet te hebben verkregen.


