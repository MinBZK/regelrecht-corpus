  - number: 48d
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze, voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 Onze Minister kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.

      5 Voor overtreding van voorschriften, gesteld bij of krachtens een algemene maatregel van bestuur op grond van
      de [artikelen 3, tweede lid, onder b en c][ref1], [5, eerste lid, tweede volzin][ref2],[ 6a, derde lid][ref3],
      [ 7, vierde lid][ref4], [11, eerste lid en tweede lid][ref5], [11a, vijfde lid][ref6], [17, eerste lid][ref7], of
      [18a, eerste lid][ref8], wordt het bedrag van de boete bepaald op de wijze als voorzien in die algemene maatregel
      van bestuur. Het eerste tot en met vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel5
