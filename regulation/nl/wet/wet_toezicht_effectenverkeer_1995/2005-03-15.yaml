  - number: '30'
    text: |-
      Indien een effecteninstelling die is toegelaten tot een op grond van [artikel 22][ref1] erkende effectenbeurs,
      ingevolge de op grond van dat artikel te hanteren regels verplicht is ter medewerking aan de controle op de
      nakoming van die regels persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref2] te verstrekken,
      behoeft de effecteninstelling voor deze verstrekking niet de toestemming van degene op wie de persoonsgegevens
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011468
