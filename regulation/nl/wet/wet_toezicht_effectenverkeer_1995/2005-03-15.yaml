  - number: '47'
    text: |-
      Het is een ieder die effecten uitgeeft of belast is met, of zijn medewerking verleent tot het plaatsen van
      effecten, verboden te trachten het publiek tot inschrijving of deelneming te bewegen door het opzettelijk
      verzwijgen of verminken van ware, of voorspiegelen van valse feiten of omstandigheden.
