  - number: '13'
    text: |-
      1 Een in Nederland gevestigde effecteninstelling waaraan een vergunning als bedoeld in
      [artikel 7, eerste lid][ref1], is verleend en die voornemens is met betrekking tot een of meer van de in deel B van
      de bijlage bij de richtlijn beleggingsdiensten genoemde instrumenten het beroep of bedrijf van effecteninstelling
      uit te oefenen door middel van een bijkantoor in een andere lid-staat, dient daartoe bij Onze Minister een aanvraag
      in. Het is de effecteninstelling verboden om aan haar voornemen gevolg te geven voordat zij van de toezichthoudende
      autoriteit van de lid-staat, bedoeld in het tweede lid, onder *a*, een mededeling heeft ontvangen die ertoe strekt
      dat met de werkzaamheden kan worden aangevangen dan wel, indien die mededeling uitblijft, er twee maanden zijn
      verstreken nadat de bekendmaking, bedoeld in het derde lid, door de effecteninstelling werd ontvangen.

      2 De aanvraag, bedoeld in het eerste lid, geschiedt onder opgave van:

      a. de lid-staat waar de effecteninstelling voornemens is het bijkantoor te vestigen;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van het
      bijkantoor zijn vermeld;

      c. het adres van het bijkantoor; en

      d. de identiteit van de personen die het dagelijks beleid van het bijkantoor bepalen.

      3 Onze Minister doet binnen drie maanden na ontvangst van de aanvraag, bedoeld in het eerste lid, aan de
      toezichthoudende autoriteit van de lid-staat, bedoeld in het tweede lid, onder *a*, mededeling van de gegevens,
      bedoeld in het tweede lid, onder *b* tot en met *d*, alsmede van gegevens omtrent de toepasselijkheid van
      een garantieregeling op de verplichtingen van het bijkantoor. Onze Minister maakt deze mededeling aan de
      effecteninstelling bekend.

      4 Indien Onze Minister van oordeel is dat de effecteninstelling, gelet op de werkzaamheden die zij door middel
      van het bijkantoor voornemens is te verrichten, redelijkerwijs niet zal kunnen voldoen aan de regels, bedoeld in
      [artikel 11, eerste lid][ref2], of indien de effecteninstelling is uitgezonderd van het toepassingsgebied van de
      richtlijn beleggingsdiensten, laat hij de in het derde lid bedoelde mededeling achterwege. Onze Minister maakt
      dit besluit binnen drie maanden na ontvangst van de aanvraag, bedoeld in het eerste lid, aan de effecteninstelling
      bekend.

      5 Indien zich een wijziging voordoet van de gegevens, bedoeld in het tweede lid, onder *b* tot en met *d*, of
      indien het voornemen bestaat om het verrichten van werkzaamheden door middel van het bijkantoor te staken, stelt
      de effecteninstelling Onze Minister en de toezichthoudende autoriteit van de lid-staat, bedoeld in het tweede lid,
      onder *a*, daarvan ten minste een maand voor de wijziging ingaat onderscheidenlijk het voornemen wordt uitgevoerd,
      schriftelijk in kennis.

      6 Indien zich een wijziging voordoet van de in het derde lid bedoelde gegevens omtrent de toepasselijkheid van een
      garantieregeling, stelt de effecteninstelling Onze Minister daarvan, ten minste een maand voor de wijziging ingaat,
      schriftelijk in kennis. Onze Minister stelt de toezichthoudende autoriteiten van de lid-staat waar het bijkantoor
      is gevestigd in kennis van de voorgenomen wijziging.

      7 Indien Onze Minister van oordeel is dat de effecteninstelling, gelet op de werkzaamheden die zij door
      middel van het bijkantoor verricht, redelijkerwijs niet langer zal kunnen voldoen aan de regels, bedoeld in
      [artikel 11, eerste lid][ref3], kan hij de effecteninstelling een aanwijzing geven om binnen een door hem te
      bepalen termijn ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen.

      8 Indien Onze Minister niet binnen de door hem in de aanwijzing bepaalde termijn een hem bevredigend antwoord
      van de effecteninstelling heeft ontvangen of indien naar zijn oordeel niet of onvoldoende aan de door hem gegeven
      aanwijzing gevolg is gegeven, trekt hij de mededeling, bedoeld in het derde lid, in. Onze Minister maakt deze
      intrekking aan de effecteninstelling bekend.

      9 Zodra de mededeling, bedoeld in het derde lid, is ingetrokken, is het de effecteninstelling verboden nog
      langer werkzaamheden te verrichten door middel van het bijkantoor en wikkelt zij binnen een door Onze Minister te
      stellen termijn alle lopende overeenkomsten af die door het bijkantoor zijn aangegaan voordat de intrekking aan de
      effecteninstelling werd bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel11
