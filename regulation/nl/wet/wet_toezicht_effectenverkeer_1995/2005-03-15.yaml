  - number: 29a
    text: |-
      Onze Minister is bevoegd de personen die het dagelijks beleid van de effecteninstelling bepalen of medebepalen en
      de personen, bedoeld in [artikel 11, tweede lid][ref1], op te roepen. Deze personen zijn verplicht op die oproeping
      te verschijnen. De oproeping geschiedt op een door Onze Minister te bepalen wijze. De personen zijn verplicht alle
      gevraagde inlichtingen te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel11
