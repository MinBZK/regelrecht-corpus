preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet toezicht effectenverkeer te wijzigen ter
    uitvoering van richtlijn nr. 93/6/EEG van de Raad van de Europese Gemeenschappen van 15 maart 1993 inzake de
    kapitaaltoereikendheid van beleggingsondernemingen en kredietinstellingen (PbEG L 141) alsmede van richtlijn nr.
    93/22/EEG van de Raad van de Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op het
    gebied van beleggingen in effecten (PbEG L 141), en dat het wenselijk is in verband hiermee alsmede in verband met
    enige noodzakelijke andere aanpassingen van die wet, de Wet toezicht effectenverkeer opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt - voor zover niet anders is bepaald - verstaan onder:

      a. effecten:

      1°. aandeelbewijzen, schuldbrieven, winst- en oprichtersbewijzen, optiebewijzen, warrants, en soortgelijke
      waardepapieren;

      2°. rechten van deelgenootschap, opties, rechten op overdracht op termijn van goederen, inschrijvingen in aandelen-
      en schuldregisters, en soortgelijke, al dan niet voorwaardelijke, rechten;

      3°. certificaten van waarden als hiervoor bedoeld;

      4°. recepissen van waarden als hiervoor bedoeld;

      b. effectenbemiddelaar:

      1°. degene die als tussenpersoon, anders dan op grond van een overeenkomst als bedoeld onder *c*, beroeps- of
      bedrijfsmatig werkzaam is bij de totstandkoming van transacties in effecten;

      2°. degene die beroeps- of bedrijfsmatig de mogelijkheid aanbiedt, door het openen van een rekening, vorderingen
      te verkrijgen luidende in effecten, waarbij door middel van deze rekening transacties in effecten kunnen worden
      bewerkstelligd;

      3°. degene die beroeps- of bedrijfsmatig, anders dan bij uitgifte van effecten, voor eigen rekening
      effectentransacties verricht teneinde een markt in effecten te onderhouden of een voordeel te behalen uit een
      verschil tussen vraag- en aanbodprijzen van effecten;

      4°. degene die beroeps- of bedrijfsmatig effecten, bij uitgifte ervan, overneemt of plaatst;

      5°. degene die, al dan niet als tussenpersoon en anders dan op grond van een overeenkomst als bedoeld onder *c*,
      beroeps- of bedrijfsmatig werkzaam is bij de totstandkoming van rente-, valuta- of aandelenswaps of soortgelijke
      overeenkomsten;

      c. vermogensbeheerder:

      1°. degene die beroeps- of bedrijfsmatig op grond van een overeenkomst het beheer voert over effecten die
      toebehoren aan een natuurlijke persoon of rechtspersoon dan wel over aan deze persoon toebehorende middelen ter
      belegging in effecten, daaronder begrepen het verrichten of doen verrichten van effectentransacties voor rekening
      van de persoon met wie de overeenkomst is gesloten;

      2°. degene die beroeps- of bedrijfsmatig op grond van een overeenkomst het beheer voert over rente-, valuta- of
      aandelenswaps of soortgelijke overeenkomsten;

      d. effecteninstelling: een effectenbemiddelaar of een vermogensbeheerder;

      e. effectenbeurs: een markt die aan regels is onderworpen en die bestemd is voor het bijeenbrengen van vraag en
      aanbod van effecten;

      f. gekwalificeerde deelneming: een rechtstreeks of middellijk belang van ten minste 10 procent van het geplaatste
      aandelenkapitaal van een onderneming of instelling, of het rechtstreeks of middellijk kunnen uitoefenen van ten
      minste 10 procent van de stemrechten in een onderneming of instelling, of het rechtstreeks of middellijk kunnen
      uitoefenen van een daarmee vergelijkbare zeggenschap in een onderneming of instelling; bij het bepalen van het
      aantal stemrechten, dat iemand in een onderneming of instelling heeft, worden tot diens stemrechten mede gerekend
      de stemrechten waarover hij beschikt of geacht wordt te beschikken op grond van artikel 12 van de Wet melding
      zeggenschap en kapitaalbelang in ter beurze genoteerde vennootschappen;

      g. groep: een groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1], met dien verstande
      dat indien een natuurlijk persoon, rechtspersoon of vennootschap:

      1°. via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of

      2°. in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in
      [artikel 24c van boek 2 van het Burgerlijk Wetboek][ref2], dan wel, voor zover het natuurlijke personen betreft,
      een met een deelneming overeenkomende positie,

      die natuurlijke persoon, rechtspersoon of vennootschap tezamen met die andere natuurlijke persoon, rechtspersoon of
      vennootschap dan wel natuurlijke personen, rechtspersonen of vennootschappen wordt aangemerkt als groep;

      h. dochtermaatschappij: een rechtspersoon of vennootschap als bedoeld in
      [artikel 24a van boek 2 van het Burgerlijk Wetboek][ref3];

      i. richtlijn kapitaaltoereikendheid: [richtlijn nr. 93/6/EEG](31993L0006) van de Raad van de Europese
      Gemeenschappen van 15 maart 1993 inzake de kapitaaltoereikendheid van beleggingsondernemingen en
      kredietinstellingen (*PbEG* L 141);

      j. richtlijn beleggingsdiensten: [richtlijn nr. 93/22/EEG](31993L0022) van de Raad van de Europese Gemeenschappen
      van 10 mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in effecten (*PbEG* L 141);

      k. lid-staat: een staat die lid is van de Europese Unie alsmede een staat, niet zijnde een lid-staat van de
      Europese Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;

      l. toezichthoudende autoriteit: de instantie waaraan in enige staat ingevolge een wettelijke regeling het toezicht
      op het effectenverkeer is opgedragen;

      m. bijkantoor: één of meer onderdelen zonder rechtspersoonlijkheid van een effecteninstelling die in een andere
      staat zijn gevestigd dan die waar de effecteninstelling is gevestigd;

      n. Onze Minister: Onze Minister van Financiën;

      o. openbaar bod: een door middel van een openbare mededeling gedaan aanbod als bedoeld in
      [artikel 217, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref4] buiten een besloten kring, op effecten,
      dan wel een uitnodiging tot het doen van een aanbod, buiten een besloten kring, op effecten, waarbij de bieder het
      oogmerk heeft deze effecten te verwerven;

      p. bieder: een natuurlijk persoon, rechtspersoon of vennootschap, dan wel enig naar buitenlands recht daarmee
      vergelijkbaar lichaam of samenwerkingsverband, door wie of namens wie al dan niet tezamen met een of meer andere
      natuurlijke personen, rechtspersonen, vennootschappen of daarmee vergelijkbare lichamen of samenwerkingsverbanden
      een openbaar bod wordt voorbereid of uitgebracht, dan wel is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel217
