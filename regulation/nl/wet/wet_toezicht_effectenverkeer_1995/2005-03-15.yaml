  - number: 6a
    text: |-
      1 Het is verboden een openbaar bod te doen op effecten die zijn toegelaten tot de notering aan een op grond van
      [artikel 22][ref1] erkende effectenbeurs of geregeld worden verhandeld in Nederland.

      2 Het eerste lid is niet van toepassing indien terzake van het openbaar bod een biedingsbericht algemeen
      verkrijgbaar is dat voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels, mits daarnaar in
      elke bekendmaking van het openbaar bod wordt verwezen.

      3 De bieder, de instelling te wier laste de effecten, bedoeld in het eerste lid, zijn
      uitgegeven en de bestuurders, commissarissen en andere functionarissen als bedoeld in
      [artikel 1, onder b, van de Wet conflictenrecht corporaties][ref2] van deze bieder en deze instelling, houden
      zich aan bij of krachtens algemene maatregel van bestuur met het oog op een adequate functionering van de
      effectenmarkten of de positie van de beleggers op die markten te stellen regels terzake van de voorbereiding, het
      uitbrengen en de gestanddoening van een openbaar bod.

      4 Een krachtens het tweede of derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking
      dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan beide kamers der Staten-Generaal.

      5 Onze Minister, kan, op verzoek, bepalen dat de bieder, de instelling te wier laste de effecten, bedoeld in
      het eerste lid, zijn uitgegeven of de bestuurders, commissarissen of andere functionarissen als bedoeld in
      [artikel 1, onder b, van de Wet conflictenrecht corporaties][ref3] van deze bieder en deze instelling, niet
      behoeven te voldoen aan alle in het tweede of derde lid bedoelde regels, indien de aanvrager aantoont dat daaraan
      redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt te bereiken anderszins
      voldoende zijn bereikt. Onze Minister kan een besluit als bedoeld in de vorige zin wijzigen of intrekken indien
      naar zijn oordeel de omstandigheden waaronder het besluit is genomen zodanig zijn gewijzigd dat het besluit in
      strijd is met het belang van een adequate functionering van de effectenmarkten of de positie van de belegger op
      de markten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009192#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009192#Artikel1
