  - number: '29'
    text: |-
      1 Onze Minister kan bij:

      a. instellingen te wier laste buiten een besloten kring effecten zijn uitgegeven;

      b. aanvragers van een ontheffing als bedoeld in [artikel 4, eerste lid][ref1];

      c. aanvragers van een ontheffing als bedoeld in [artikel 5, tweede lid][ref2];

      d. effecteninstellingen;

      e. aanvragers van een vergunning als bedoeld in [artikel 7, eerste lid][ref3];

      f. de bewaarder van zakelijke gegevens en bescheiden van een organisatie waarvan de leden toegang hadden tot een
      effectenbeurs waarvan de houder een erkenning had als bedoeld in [artikel 22][ref4];

      g. degenen die deel uitmaken van een groep waartoe een effecteninstelling behoort;

      h. houders van een gekwalificeerde deelneming;

      i. aanvragers van een verklaring van geen bezwaar als bedoeld in [artikel 16, eerste lid][ref5];

      j. degenen op wie een vrijstelling als bedoeld in [artikel 18][ref6] van toepassing is;

      k. instellingen als bedoeld in [artikel 18a, eerste lid][ref7];

      l. houders van een effectenbeurs;

      m. aanvragers van een erkenning als bedoeld in [artikel 22][ref8];

      n. aanvragers van een ontheffing als bedoeld in [artikel 25, eerste lid][ref9];

      o. bieders;

      p. iedere onderneming of instelling ten aanzien waarvan redelijkerwijs kan worden vermoed dat deze handelt in
      strijd met de bij of krachtens deze wet gestelde regels,

      alle inlichtingen inwinnen of doen inwinnen, die redelijkerwijs nodig zijn voor de uitoefening van de taken en
      bevoegdheden die hij op grond van deze wet heeft en teneinde na te gaan of de bij of krachtens deze wet gestelde
      bepalingen worden nageleefd.

      2 Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen de door Onze
      Minister te stellen termijn.

      3 Ten aanzien van de personen die door Onze Minister zijn belast met het inwinnen van inlichtingen of met de
      uitoefening van andere taken en bevoegdheden die Onze Minister heeft op grond van het bij of krachtens deze
      wet bepaalde, zijn de [artikelen 5:12][ref10], [5:13][ref11], [5:15][ref12], [5:16][ref13], [5:17][ref14] en
      [5:20 van de Algemene wet bestuursrecht][ref15] van overeenkomstige toepassing, met dien verstande dat indien
      een onderzoek als bedoeld in [artikel 36, eerste lid][ref16], wordt ingesteld, degene bij wie het onderzoek wordt
      ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen van inzage in
      zakelijke gegevens en bescheiden.


