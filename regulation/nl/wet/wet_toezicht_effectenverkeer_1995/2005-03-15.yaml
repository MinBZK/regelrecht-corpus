  - number: '11'
    text: |-
      1 Een effecteninstelling waaraan een vergunning als bedoeld in [artikel 7, eerste lid][ref1], is verleend, houdt
      zich aan bij of krachtens algemene maatregel van bestuur te stellen regels ten aanzien van:

      a. deskundigheid en betrouwbaarheid;

      b. financiële waarborgen, al dan niet tevens op geconsolideerde basis;

      c. bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
      en vestiging van het hoofdkantoor;

      d. aan Onze Minister en aan het publiek te verstrekken informatie; en

      e. waarborgen voor een adequaat toezicht op de naleving van de bij of krachtens deze wet gestelde regels;

      f. de bemiddeling terzake van een openbaar bod.

      2 Degenen, die rechtstreeks of middellijk bevoegd zijn de personen te benoemen of te ontslaan die een
      effecteninstelling krachtens wet, statuten of reglementen vertegenwoordigen dan wel het dagelijks beleid van een
      effecteninstelling bepalen, houden zich aan bij of krachtens algemene maatregel van bestuur te stellen regels ten
      aanzien van betrouwbaarheid.

      3 De regels, bedoeld in het eerste lid, kunnen voor onderscheiden groepen effecteninstellingen verschillend zijn.

      4 Onze Minister kan, op verzoek, bepalen dat een effecteninstelling niet behoeft te voldoen aan alle in het eerste
      lid bedoelde regels indien de aanvrager aantoont dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat
      de doeleinden die deze wet beoogt te bereiken anderszins voldoende zijn bereikt. Onze Minister kan een besluit als
      bedoeld in de vorige volzin wijzigen of intrekken indien naar zijn oordeel de omstandigheden waaronder het besluit
      is genomen zodanig zijn gewijzigd dat het besluit in strijd is met het belang van een adequate functionering van de
      effectenmarkten of de positie van de beleggers op die markten.

      5 het eerste, tweede en vierde lid zijn van overeenkomstige toepassing op een instelling als bedoeld in
      [artikel 7, tweede lid, onder h, i of j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel7
