  - number: '14'
    text: |-
      1 Een in Nederland gevestigde effecteninstelling waaraan een vergunning als bedoeld in
      [artikel 7, eerste lid][ref1], is verleend en die voornemens is met betrekking tot een of meer van de in deel B van
      de bijlage bij de richtlijn beleggingsdiensten genoemde instrumenten het beroep of bedrijf van effecteninstelling
      uit te oefenen, anders dan door middel van een bijkantoor, in een andere lid-staat, dient daartoe bij Onze
      Minister een aanvraag in. Het is de effecteninstelling verboden om aan haar voornemen gevolg te geven zolang de
      bekendmaking, bedoeld in het derde lid, niet is gedaan.

      2 De aanvraag, bedoeld in het eerste lid, geschiedt onder opgave van:

      a. de lid-staat waarin de effecteninstelling voornemens is de werkzaamheden te verrichten; en

      b. de werkzaamheden die de effecteninstelling voornemens is te verrichten.

      3 Onze Minister doet binnen een maand na ontvangst van de aanvraag, bedoeld in het eerste lid, aan de
      toezichthoudende autoriteit van de lid-staat, bedoeld in het tweede lid, onder *a*, mededeling van de gegevens,
      bedoeld in het tweede lid, onder *b*, tenzij de effecteninstelling is uitgezonderd van het toepassingsgebied van de
      richtlijn beleggingsdiensten. Onze Minister maakt deze mededeling aan de effecteninstelling bekend.

      4 Indien zich een wijziging voordoet van de gegevens, bedoeld in het tweede lid, onder *b*, of indien het voornemen
      bestaat om het verrichten van de werkzaamheden, bedoeld in het eerste lid, te staken, stelt de effecteninstelling
      Onze Minister en de toezichthoudende autoriteit van de lid-staat, bedoeld in het tweede lid, onder *a*, daarvan ten
      minste een maand voor de wijziging ingaat onderscheidenlijk het voornemen wordt uitgevoerd, schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
