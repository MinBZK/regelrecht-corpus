    text: |-
      Tegen een besluit van een houder van een op grond van [artikel 22][ref1] erkende effectenbeurs omtrent de
      toelating van effecten tot, of het doen vervallen van effecten uit de notering aan die effectenbeurs, staat voor
      belanghebbenden administratief beroep open bij Onze Minister, tenzij dit besluit strekt tot uitvoering van een
      aanwijzing als bedoeld in [artikel 6][ref2].


