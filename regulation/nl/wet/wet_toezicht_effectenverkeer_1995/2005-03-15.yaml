  - number: '5'
    text: |-
      1 Instellingen te wier laste in of vanuit Nederland buiten een besloten kring effecten zijn uitgegeven, zonder
      dat daartoe effecten behoren die zijn toegelaten tot de notering aan een op grond van [artikel 22][ref1] erkende
      effectenbeurs, stellen omtrent hun bedrijf informatie algemeen verkrijgbaar, voor zover deze verplichting niet
      reeds voortvloeit uit boek 2 van het Burgerlijk Wetboek. Deze informatie alsmede de wijze van verkrijgbaarstelling
      ervan dienen te voldoen aan bij of krachtens algemene maatregel van bestuur te stellen regels en heeft betrekking
      op periodieke verslaggeving inzake de financiële positie van de uitgevende instelling alsmede op feiten omtrent
      de uitgevende instelling waarvan een aanzienlijke invloed op de koers van de effecten van de uitgevende instelling
      kan uitgaan.

      2 Onze Minister kan van de op grond van het eerste lid gestelde regels vrijstelling of, op verzoek, ontheffing
      verlenen.

      3 Aan een vrijstelling en aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden
      met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.

      4 Het eerste lid is niet van toepassing op een beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18][ref2] van de Wet toezicht beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel5
