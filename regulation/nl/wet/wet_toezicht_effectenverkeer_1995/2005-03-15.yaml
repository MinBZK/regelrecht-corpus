  - number: '41'
    text: |-
      1 Het is een rechtspersoon als bedoeld in [artikel 40, eerste lid][ref1], verboden zijn statuten te wijzigen zonder
      voorafgaande toestemming van Onze Minister. De artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht
      zijn van overeenkomstige toepassing.

      2 Onze Minister kan een toestemming als bedoeld in het eerste lid weigeren indien de statuten na de wijziging
      onvoldoende zouden zijn afgestemd op het bepaalde in [artikel 40][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel40
