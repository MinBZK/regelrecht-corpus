  - number: '61'
    text: |-
      Ten aanzien van effectenbemiddelaars of vermogensbeheerders die zijn gevestigd in een andere lid-staat, niet zijnde
      een lid-staat ten aanzien waarvan Onze Minister een maatregel als bedoeld in [artikel 8, eerste lid][ref1], heeft
      genomen, en die op het tijdstip van inwerkingtreding van [artikel 7, tweede lid][ref2], van deze wet een vergunning
      als bedoeld in [artikel 6, eerste lid](onbekend), onderscheidenlijk [artikel 10, eerste lid, van de Wet toezicht
      effectenverkeer](onbekend) bezitten, wordt geacht te zijn voldaan aan [artikel 7, tweede lid, onderdeel ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel8
