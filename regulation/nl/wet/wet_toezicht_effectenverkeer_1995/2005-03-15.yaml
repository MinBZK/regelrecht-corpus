      1 In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.

      2 Op een besluit op grond van deze wet terzake van de regels, gesteld bij of krachtens hoofdstuk II A, met
      uitzondering van een besluit tot het opleggen van een bestuurlijke boete als bedoeld in [artikel 48c][ref2], is
      [artikel 7:1 van de Algemene wet bestuursrecht][ref3] niet van toepassing.

      3 In afwijking van het eerste lid is voor beroepen tegen besluiten terzake van de regels, gesteld bij of
      krachtens Hoofdstuk IIA, met uitzondering van besluiten tot het opleggen van een bestuurlijke boete als bedoeld in
      [artikel 48c][ref4], het College van Beroep voor het bedrijfsleven bevoegd.


