  - number: '26'
    text: |-
      Onze Minister kan een erkenning als bedoeld in [artikel 22][ref1] of een ontheffing als bedoeld in
      [artikel 25][ref2] intrekken indien voor het houden van de desbetreffende effectenbeurs onvoldoende waarborgen
      worden geboden met het oog op een adequate functionering van de effectenmarkten of de positie van de beleggers
      op die markten of indien de effectenbeurs niet of niet genoegzaam de bij of krachtens deze wet gestelde regels of
      gegeven voorschriften naleeft, gestelde beperkingen in acht neemt of gegeven aanwijzingen opvolgt.


