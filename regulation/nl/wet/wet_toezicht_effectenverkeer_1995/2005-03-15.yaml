  - number: '15'
    text: |-
      1 Indien Onze Minister door de toezichthoudende autoriteit van een andere lid-staat ervan in kennis is gesteld dat
      een in Nederland gevestigde effecteninstelling de in die andere lid-staat op de effecteninstelling van toepassing
      zijnde regels betreffende het toezicht niet of niet volledig naleeft, vestigt hij daarop de aandacht van die
      effecteninstelling.

      2 Zonodig doet Onze Minister de mededeling, bedoeld in het eerste lid, vergezeld gaan van dan wel volgen door een
      aanwijzing om binnen een door hem te bepalen termijn ten aanzien van met name aan te geven punten een bepaalde
      gedragslijn te volgen.

      3 Indien Onze Minister niet binnen de door hem in de aanwijzing bepaalde termijn een hem bevredigend antwoord
      van de effecteninstelling heeft ontvangen of indien naar zijn oordeel niet of onvoldoende aan de door hem gegeven
      aanwijzing gevolg is gegeven, trekt Onze Minister de mededeling, bedoeld in [artikel 13, derde lid][ref1], of
      [artikel 14, derde lid][ref2], in. Onze Minister maakt deze intrekking aan de effecteninstelling bekend.


