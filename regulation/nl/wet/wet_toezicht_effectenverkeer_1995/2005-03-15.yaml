  - number: '12'
    text: |-
      1 Indien Onze Minister vaststelt dat een instelling als bedoeld in [artikel 7, tweede lid, onder h, i of j][ref1],
      de in Nederland op de instelling van toepassing zijnde regels betreffende het toezicht niet of niet volledig
      naleeft, vestigt hij daarop de aandacht van die instelling.

      2 Zonodig doet Onze Minister de mededeling, bedoeld in het eerste lid, vergezeld gaan van dan wel volgen door een
      aanwijzing om binnen een door hem te bepalen termijn ten aanzien van met name aan te geven punten een bepaalde
      gedragslijn te volgen.

      3 Indien Onze Minister niet binnen de door hem in de aanwijzing bepaalde termijn een hem bevredigend antwoord van
      de instelling heeft ontvangen of indien naar zijn oordeel niet of onvoldoende aan de door hem gegeven aanwijzing
      gevolg is gegeven, maakt hij dit aan de instelling bekend.

      4 Zodra de bekendmaking, bedoeld in het derde lid, door de instelling is ontvangen, is het haar verboden nog
      langer als effectenbemiddelaar of vermogensbeheerder diensten aan te bieden of te verrichten en wikkelt zij binnen
      een door Onze Minister te bepalen termijn alle lopende overeenkomsten af die door haar zijn aangegaan voordat de
      bekendmaking door haar werd ontvangen.

      5 Indien een instelling in een andere lid-staat is gevestigd, stelt Onze Minister de toezichthoudende autoriteit
      van die andere lid-staat in kennis van de mededeling, bedoeld in het eerste lid, en van de bekendmaking, bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
