  - number: 11a
    text: |-
      1 Een in Nederland gevestigde effecteninstelling waaraan een vergunning als bedoeld in
      [artikel 7, eerste lid][ref1], is verleend, legt binnen zes maanden na afloop van het boekjaar een jaarrekening als
      bedoeld in [artikel 361, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref2] over aan Onze Minister.

      2 De effecteninstelling doet de jaarrekening, bedoeld in het eerste lid, vergezeld gaan
      van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref3]. Deze accountant staat niet in
      dienstbetrekking tot de betrokken effecteninstelling.

      3 De accountant, bedoeld in het tweede lid, meldt Onze Minister zo spoedig mogelijk elke omstandigheid waarvan hij
      bij de uitvoering van zijn werkzaamheden als bedoeld in het tweede lid kennis heeft gekregen en die:

      a. in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;

      b. in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;

      c. het voortbestaan van de effecteninstelling bedreigt; of

      d. leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.

      4 Op de accountant die naast zijn werkzaamheden voor de effecteninstelling ook werkzaamheden uitvoert voor een
      andere onderneming of instelling is de meldingsplicht, bedoeld in het derde lid, van overeenkomstige toepassing
      indien de effecteninstelling dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de
      andere onderneming of instelling dochtermaatschappij is van de effecteninstelling. Voor de toepassing van de
      eerste volzin wordt onder dochtermaatschappij verstaan een dochtermaatschappij als bedoeld in [artikel 24][ref4],
      met dien verstande dat een effecteninstelling tevens dochtermaatschappij kan zijn van een natuurlijk persoon of
      vennootschap.

      5 Onverminderd het bepaalde in het derde en vierde lid verstrekt de accountant, bedoeld in het tweede lid, aan Onze
      Minister zo spoedig mogelijk alle inlichtingen die redelijkerwijs nodig zijn ten behoeve van het toezicht op de
      naleving van deze wet met betrekking tot bij algemene maatregel van bestuur aan te wijzen onderwerpen.

      6 De accountant die op grond van het derde of vierde lid tot een melding of op grond van het vijfde lid tot
      het geven van inlichtingen aan Onze Minister is overgegaan, is niet aansprakelijk voor schade die een derde
      dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid
      niet tot melding had mogen worden overgegaan.

      7 Het derde tot en met zesde lid zijn van overeenkomstige toepassing op een niet in Nederland
      gevestigde effecteninstelling die op grond van de regels, bedoeld in [artikel 11, eerste lid][ref5],
      een jaarrekening overlegt die is onderzocht door een accountant als bedoeld in
      [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref6].


