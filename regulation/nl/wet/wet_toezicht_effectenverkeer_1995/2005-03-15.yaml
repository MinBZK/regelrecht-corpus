  - number: '46'
    text: |-
      1 Het is een ieder verboden om, beschikkende over voorwetenschap, in of vanuit Nederland een transactie te
      verrichten of te bewerkstelligen in:

      a. effecten die zijn genoteerd aan een op grond van [artikel 22][ref1] erkende effectenbeurs dan wel aan een buiten
      Nederland gevestigde en van overheidswege toegelaten effectenbeurs of effecten waarvan aannemelijk is dat deze
      spoedig aan een zodanige beurs zullen worden genoteerd; of

      b. effecten waarvan de waarde mede wordt bepaald door de waarde van onder a bedoelde effecten.

      2 Voorwetenschap is bekendheid met een bijzonderheid omtrent de rechtspersoon, vennootschap of instelling, waarop
      de effecten betrekking hebben of omtrent de handel in de effecten:

      a. die niet openbaar is gemaakt; en

      b. waarvan openbaarmaking, naar redelijkerwijs is te verwachten, invloed zou kunnen hebben op de koers van de
      effecten, ongeacht de richting van die koers.

      3 Het verbod van het eerste lid is niet van toepassing:

      a. op de tussenpersoon die, slechts beschikkend over voorwetenschap met betrekking tot de handel, volgens de regels
      van de goede trouw handelt ter bediening van opdrachtgevers;

      b. op de rechtspersoon, vennootschap of instelling waarvan de werknemers die zijn betrokken bij het verrichten of
      bewerkstelligen van de transactie slechts beschikken over voorwetenschap met betrekking tot de handel; en

      c. op degene die een transactie verricht of bewerkstelligt ter nakoming van een opeisbare verbintenis die reeds
      bestond op het tijdstip waarop hij kennis kreeg van de in het tweede lid bedoelde bijzonderheid.

      4 Bij algemene maatregel van bestuur kunnen categorieën van transacties worden aangewezen, waarop het in het eerste
      lid bedoelde verbod niet van toepassing is. Daarbij kan binnen een aan te wijzen categorie onderscheid worden
      gemaakt naar de personen door wie en de omstandigheden waaronder de transacties worden verricht of bewerkstelligd.

      5 Ten aanzien van strafbare feiten als bedoeld in het eerste lid is de rechtbank van Amsterdam in eerste aanleg bij
      uitsluiting bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel46
