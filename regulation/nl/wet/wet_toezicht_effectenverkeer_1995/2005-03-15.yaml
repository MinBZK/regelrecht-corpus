  - number: '64'
    text: |-
      Ingeval voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een op grond van de Wet
      toezicht effectenverkeer genomen besluit wordt op het beroep beslist met toepassing van het voor dat tijdstip
      geldende recht.
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel64
  - number: '65'
    text: De Wet toezicht effectenverkeer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel65
  - number: '66'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel66
