  - number: '23'
    text: |-
      Van iedere wijziging in de regels, bedoeld in [artikel 22, tweede lid][ref1], of in de controle op de naleving
      daarvan stelt de houder van de op grond van [artikel 22][ref2] erkende effectenbeurs Onze Minister vooraf in
      kennis.


