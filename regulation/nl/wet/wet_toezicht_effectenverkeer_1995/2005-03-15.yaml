  - number: 48b
    text: |-
      1 Onze Minister kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 3, tweede lid, onder b en c, ][ref1][4, tweede lid][ref2],
      [5, derde lid][ref3], [6, tweede lid][ref4], [6a, eerste en derde lid][ref5], [6b][ref6],
      [6c, tweede lid][ref7], [7, eerste, derde, vierde en zevende lid][ref8], [10, tweede lid][ref9],
      [11, eerste en tweede lid][ref10], [11a, eerste en tweede lid][ref11], [12, tweede en vierde lid][ref12],
      [13, eerste lid, tweede volzin, vijfde, zesde, zevende en negende lid][ref13], [15, tweede lid][ref14],
      [16, eerste, zevende, achtste en tiende lid][ref15], [17, eerste lid][ref16], [18, tweede lid][ref17],
      [18a, eerste lid][ref18], [18b, tweede lid][ref19], [19, derde lid][ref20], [21, zesde lid][ref21],
      [22, eerste en derde lid][ref22], [23][ref23], [24, eerste en derde lid][ref24],
      [26a, eerste, vijfde, zesde en negende lid][ref25], [28, derde en zesde lid, onder a][ref26],
      [28c, tweede, derde en vierde lid][ref27], [28a, tweede en vierde lid][ref28], [29, tweede en derde lid][ref29],
      voor zover het betreft het voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref30] en het
      voorschrift inzage te verlenen in zakelijke gegevens en bescheiden, [29a, tweede en vierde volzin][ref31],
      [36, tweede lid][ref32], [37, tweede lid][ref33], [39, derde lid][ref34], voor zover het betreft het voorschrift
      op grond van [artikel 5:20 van de Algemene wet bestuursrecht][ref35] inzage te verlenen in zakelijke gegevens en
      bescheiden, en [46c, vierde lid][ref36].

      2 De [artikelen 5:32, tweede tot en met vijfde lid][ref37], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref38] zijn van toepassing.

      3 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.


