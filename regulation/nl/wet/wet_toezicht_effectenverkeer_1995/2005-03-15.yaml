  - number: 6b
    text: |-
      Indien de bieder zijn openbaar bod gestand heeft gedaan, is het hem gedurende een periode van drie jaar na
      de verkrijgbaarstelling van het biedingsbericht niet toegestaan effecten van de soort waarop het openbaar bod
      betrekking had, direct of indirect, te verwerven tegen voor de rechthebbende van die effecten gunstiger voorwaarden
      dan volgens het openbaar bod.
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel6b
