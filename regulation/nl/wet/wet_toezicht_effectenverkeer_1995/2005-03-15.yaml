  - number: '34'
    text: |-
      1 Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref1] taken en bevoegdheden zijn
      overgedragen werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op effecteninstellingen
      die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de Wet toezicht kredietwezen 1992, de
      Wet toezicht verzekeringsbedrijf 1993, de Wet toezicht natura-uitvaartverzekeringsbedrijf en de Wet toezicht
      beleggingsinstellingen belast zijn met het toezicht op kredietinstellingen, verzekeraars onderscheidenlijk
      beleggingsinstellingen die tot diezelfde groep behoren.

      2 Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref2] taken en bevoegdheden zijn
      overgedragen pleegt in de gevallen, bedoeld in het eerste lid, waar nodig overleg met een autoriteit als bedoeld in
      het eerste lid.

      3 Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref3] taken en bevoegdheden zijn
      overgedragen werkt in de gevallen, bedoeld in het eerste lid, waar nodig samen op basis van een of meer daartoe met
      een autoriteit als bedoeld in het eerste lid overeen te komen regelingen. Deze regelingen betreffen in elk geval
      afspraken over het stellen van gemeenschappelijke regels, het coördineren van werkzaamheden uit hoofde van ieders
      uitoefening van het toezicht en het uitwisselen van gegevens en inlichtingen.

      4 Onze Minister dan wel een rechtspersoon waaraan ingevolge [artikel 40][ref4] taken en bevoegdheden zijn
      overgedragen, verstrekt aan een autoriteit als bedoeld in het eerste lid dan wel een autoriteit die is belast met
      de uitvoering van de [Wet inzake de geldtransactiekantoren](onbekend) of de [Wet toezicht trustkantoren][ref5] de
      gegevens of inlichtingen die hij verkregen heeft bij de vervulling van de hem bij of krachtens deze wet opgedragen
      taak en die betrekking hebben op de deskundigheid en betrouwbaarheid van personen als bedoeld in de algemene
      maatregel van bestuur ter uitvoering van [artikel 7, vierde lid, onder a][ref6], voor zover Onze Minister dan wel
      de rechtspersoon van oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het
      toezicht dat door die andere autoriteit wordt uitgeoefend.

      5 De verplichting, bedoeld in het vierde lid, geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in [artikel 33, eerste lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel40
