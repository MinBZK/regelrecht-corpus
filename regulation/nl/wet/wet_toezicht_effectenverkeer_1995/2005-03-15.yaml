  - number: '28'
    text: |-
      1 Indien Onze Minister vaststelt dat een instelling te wier laste effecten zijn uitgegeven, een bieder,
      bestuurder, commissaris of functionaris als bedoeld in [artikel 6a, derde lid][ref1], een effecteninstelling,
      niet zijnde een instelling als bedoeld in [artikel 7, tweede lid, onder h, i of j][ref2], of een instelling
      als bedoeld in [artikel 18a, eerste lid][ref3], de bij of krachtens de [artikelen 3 tot en met 5][ref4],
      [6a, tweede en derde lid][ref5], [6b][ref6], [11, eerste lid][ref7], [18a, eerste lid][ref8], onderscheidenlijk
      [18b, tweede lid][ref9], gestelde regels niet naleeft, vestigt hij daarop de aandacht van de betrokkene.

      2 Zonodig doet Onze Minister de mededeling, bedoeld in het eerste lid, vergezeld gaan van dan wel volgen door een
      aanwijzing om ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen met het oog op een
      adequate functionering van de effectenmarkten of de positie van de beleggers op die markten.

      3 De instelling volgt de in het tweede lid bedoelde aanwijzing op binnen een door Onze Minister te bepalen termijn.

      4 Indien de aanwijzing, bedoeld in het tweede lid, is gegeven aan een effecteninstelling niet zijnde een instelling
      als bedoeld in [artikel 18a, eerste lid][ref10], en Onze Minister niet binnen de termijn, bedoeld in het derde lid,
      een bevredigend antwoord van die instelling heeft ontvangen, of indien naar zijn oordeel niet of onvoldoende aan
      zijn aanwijzing gevolg is gegeven, kan Onze Minister, indien hij dit met het oog op een adequate functionering van
      de effectenmarkten of de positie van de beleggers op die markten noodzakelijk acht:

      a. de instelling schriftelijk aanzeggen, dat vanaf een bepaald tijdstip alle of bepaalde organen van de instelling
      hun bevoegdheden slechts mogen uitoefenen na goedkeuring door een of meer door Onze Minister aangewezen personen en
      met inachtneming van de opdrachten van deze personen, welke aanzegging terstond van kracht wordt;

      b. de instelling schriftelijk aanzeggen, dat Onze Minister zal overgaan tot publicatie van de aanwijzing, bedoeld
      in het tweede lid, bij welke publicatie, wanneer de instelling dit verlangt, tevens de correspondentie openbaar
      wordt gemaakt, die naar aanleiding van de aanwijzing tussen Onze Minister en de instelling is gevoerd.

      5 Indien Onze Minister van oordeel is dat ten aanzien van de instelling, bedoeld in het vierde lid, onverwijld
      maatregelen noodzakelijk zijn, kan hij zonder toepassing van de eerste twee leden onmiddellijk uitvoering geven
      aan onderdeel a van het vierde lid, nadat hij de instelling in de gelegenheid heeft gesteld haar mening over de
      onmiddellijke uitvoering te geven.

      6 Met betrekking tot een aanzegging als bedoeld in het vierde lid, onder a, is het volgende van toepassing:

      a. de organen van de instelling zijn verplicht de door Onze Minister aangewezen personen alle medewerking te
      verlenen;

      b. Onze Minister kan de betrokken organen van de instelling toestaan bepaalde handelingen zonder machtiging te
      verrichten;

      c. de door Onze Minister aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren na de
      aanzegging, bedoeld in het vierde lid, onder a, behoudens de bevoegdheid van Onze Minister om deze termijn telkens
      voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht;

      d. Onze Minister kan te allen tijde de door hem aangewezen personen door andere vervangen;

      e. voor schade ten gevolge van handelingen, welke zijn verricht in strijd met een aanzegging als bedoeld in
      het vierde lid, onder a, zijn degenen, die deel uit maken van het orgaan van de instelling dat deze handelingen
      verrichtte, persoonlijk aansprakelijk tegenover de instelling; de instelling kan de ongeldigheid van deze
      handelingen inroepen, indien de wederpartij wist, dat de vereiste goedkeuring ontbrak of daarvan redelijkerwijs
      niet onkundig kon zijn;

      f. zodra Onze Minister van oordeel is dat de naleving van de regels, bedoeld in het eerste lid, voldoende is
      gewaarborgd, beslist hij dat de betrokken organen van de instelling hun bevoegdheden weer onbeperkt kunnen
      uitoefenen.

      7 Het besluit tot publicatie van een aanwijzing als bedoeld in het vierde lid, onder b, wordt eerst van kracht,
      wanneer het onherroepelijk is geworden. Indien de instelling na de publicatie alsnog voldoet aan de aanwijzing dan
      wel indien Onze Minister de aanwijzing intrekt, zal Onze Minister hiervan op dezelfde wijze als bij de voorafgaande
      publicatie kennis geven.


