  - number: '2'
    text: |-
      Geen effecten in de zin van deze wet zijn:

      a. waarden die uitsluitend het karakter van betaalmiddel dragen;

      b. appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel2
  - number: 2a
    text: |-
      De omstandigheid dat de koper van effecten zich bij de koop heeft verbonden tot een latere overdracht van een
      gelijke hoeveelheid effecten van dezelfde soort aan de verkoper, brengt niet met zich dat die koop, in strijd met
      [artikel 84, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], ten doel heeft de effecten over te dragen tot
      zekerheid of de strekking mist de effecten na de overdracht in het vermogen van de koper te doen vallen, tenzij de
      effecten na de levering in handen van de verkoper blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel84
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel2a
