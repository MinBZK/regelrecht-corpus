  - number: 46b
    text: |-
      1 Een instelling die effecten als bedoeld in [artikel 46, eerste lid, onder a][ref1], heeft uitgegeven of zal
      uitgeven, doet onverwijld melding van door haar, anders dan ter bediening van derden, verrichte of bewerkstelligde
      transacties in op haar betrekking hebbende effecten als bedoeld in [artikel 46, eerste lid][ref2], aan
      Onze Minister dan wel, indien ingevolge [artikel 40][ref3] taken en bevoegdheden zijn overgedragen aan een
      rechtspersoon, aan die rechtspersoon.

      2 Het eerste lid is niet van toepassing op een vennootschap als bedoeld in
      [artikel 76a van boek 2 van het Burgerlijk Wetboek][ref4].

      3 Het eerste lid is, met betrekking tot door de betrokkene verrichte of bewerkstelligde transacties in de in dat
      lid bedoelde effecten, van overeenkomstige toepassing op:

      a. een ieder die het dagelijks beleid van de instelling bepaalt of mede bepaalt;

      b. een ieder die toezicht houdt op het beleid van het bestuur en de algemene gang van zaken in de vennootschap en
      de met haar verbonden onderneming; en

      c. een ieder die behoort tot een bij ministeriële regeling, onder daarbij te stellen voorwaarden, aan te wijzen
      andere categorie van personen.

      4 De in het derde lid, onder c, bedoelde aanwijzing vervalt na verloop van zes maanden na inwerkingtreding van de
      regeling waarbij zij tot stand is gekomen, tenzij de aanwijzing binnen deze termijn wordt goedgekeurd bij algemene
      maatregel van bestuur. De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum
      van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de
      beide kamers van de Staten-Generaal.

      5 De melding, bedoeld in het eerste en derde lid, voldoet aan bij ministeriële regeling te stellen regels.
      Hierbij kan ten aanzien van bepaalde categorieën van personen worden bepaald dat de melding kan worden gedaan
      door tussenkomst van een door de instelling waarop de effecten betrekking hebben aan te wijzen persoon. Tevens kan
      hierbij ten aanzien van de personen, bedoeld in het derde lid, onder c, worden afgeweken van de verplichting om de
      melding onverwijld te doen plaatsvinden.

      6 Aan de verplichting, bedoeld in het derde lid, is voldaan indien op grond van
      [artikel 2a, vierde lid, van de Wet melding zeggenschap in ter beurze genoteerde vennootschappen 1996][ref5] aan
      Onze Minister melding is gedaan van een door de betrokken transactie bewerkstelligde wijziging als bedoeld in dat
      lid.

      7 De instelling waarop de effecten betrekking hebben, stelt de personen bedoeld in het derde lid, onder c, voor
      zover bij de instelling bekend, ervan in kennis dat het eerste lid op hen van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel76a
      [ref5]: https://wetten.overheid.nl/BWBR0008369#Artikel2a
