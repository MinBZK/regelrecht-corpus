  - number: 46c
    text: |-
      1 Een melding als bedoeld in [artikel 46b, eerste of derde lid][ref1], wordt door Onze Minister opgenomen in een
      register. Onze Minister houdt het register voor een ieder ter inzage.

      2 Indien Onze Minister vermoedt dat een melding is gedaan die onjuist is, kan hij terzake een onderzoek instellen
      of doen instellen.

      3 Onze Minister kan opneming van de melding in het register voor de duur van het onderzoek opschorten. Hij stelt
      degene die de melding heeft gedaan van de opschorting in kennis.

      4 Degene die de melding heeft gedaan, verstrekt desgevraagd aan Onze Minister, binnen een door de Minister te
      stellen termijn, de gegevens op grond waarvan de melding is gedaan.

      5 Onze Minister kan een ieder die een melding heeft gedaan in de gelegenheid stellen de melding te herstellen.

      6 Indien een melding naar het oordeel van Onze Minister onjuist is en de melding niet is hersteld, kan hij in
      plaats van de gemelde gegevens de juiste gegevens in het register opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel46b
    url: https://wetten.overheid.nl/BWBR0007657/2005-03-15#Artikel46c
