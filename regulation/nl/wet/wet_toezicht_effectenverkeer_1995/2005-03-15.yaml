  - number: 33c
    text: |-
      1 Onze Minister werkt samen met de autoriteiten die ingevolge de [Wet toezicht beleggingsinstellingen][ref1],
      de [Wet toezicht kredietwezen 1992][ref2], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3], de
      [Pensioen- en spaarfondsenwet][ref4] onderscheidenlijk de [Wet toezicht verzekeringsbedrijf 1993][ref5], belast
      zijn met het toezicht op beleggingsinstellingen, kredietinstellingen, natura-uitvaartverzekeraars, pensioen- en
      spaarfondsen onderscheidenlijk verzekeraars, met het oog op coördinatie en afstemming van regelgeving en beleid ter
      uitvoering van de [artikelen 18a][ref6] en [18b][ref7].

      2 Onze Minister voert het toezicht ingevolge de [artikelen 18a][ref8] en [18b][ref9] uit met inachtneming van
      daartoe met de overige in het eerste lid bedoelde autoriteiten te sluiten overeenkomsten. Deze overeenkomsten
      bevatten afspraken over coördinatie en afstemming van regelgeving, beleid en de uitvoering van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
