preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is onder meer de Wet studiefinanciering 2000 te
    wijzigen in verband met aanpassing van de berekeningssystematiek voor de veronderstelde ouderlijke bijdrage
    en dat het wenselijk is om de Wet op het hoger onderwijs en wetenschappelijk onderzoek en de Experimentenwet
    vooropleidingseisen, selectie en collegegeldheffing te wijzigen om het experimenteerregime te continueren totdat is
    besloten om vooropleidingseisen, selectie en collegegeldheffing al dan niet definitief in de wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022034/2007-06-13#ArtikelAanhef
articles:
  - number: VII.1
    text: |-
      Studerenden die in 2007 op grond van [artikel 3.13 van de Wet studiefinanciering 2000][ref1] een
      aanvullende beurs toegekend hebben gekregen met toepassing van peiljaarverlegging als bedoeld in
      [artikel 3.10 van de Wet studiefinanciering 2000][ref2], hebben eenmalig aanspraak op compensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0022034/2007-06-13#ArtikelVII
