  - number: VII.2
    text: |-
      Het bedrag aan compensatie bedraagt het verschil tussen de uitkomst van de berekening, bedoeld in het derde lid, en
      de toegekende aanvullende beurs in 2007.
    url: https://wetten.overheid.nl/BWBR0022034/2007-06-13#ArtikelVII
  - number: VII.3
    text: |-
      De aanvullende beurs wordt opnieuw berekend, waarbij in afwijking van
