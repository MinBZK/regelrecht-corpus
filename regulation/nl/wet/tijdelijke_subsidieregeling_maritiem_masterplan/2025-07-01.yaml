        artikel: '1'
  - number: '2'
    text: |-
      Deze regeling heeft als doel het stimuleren van activiteiten gericht op het verduurzamen en versterken van de
      maritieme sector, binnen de kaders van het Maritiem Masterplan.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel2
  - number: '3.1'
    text: De minister kan aan een aanvrager subsidie verstrekken voor O&D-projecten.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel3
  - number: '3.2'
    text: |-
      Een O&D-project bevat een samenhangend geheel van activiteiten die passen binnen de doelstellingen en kaders van
      het Maritiem Masterplan en valt onder een van de volgende energielijnen, als omschreven in [bijlage 1][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0049626
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0049626
  - number: 3.2.a
    text: Energielijn waterstof;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel3
  - number: 3.2.b
    text: Energielijn methanol;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel3
  - number: 3.2.c
    text: Energielijn Carbon Capture gekoppeld aan een LNG aandrijflijn.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel3
  - number: '4.1'
    text: Een aanvraag voor subsidie wordt ingediend door een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel4
  - number: '4.2'
    text: De penvoerder van een samenwerkingsverband is een Nederlandse onderneming.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel4
  - number: '4.3'
    text: |-
      Een samenwerkingsverband bevat ten minste twee niet aan elkaar verbonden ondernemingen als bedoeld in artikel 3,
      derde lid, van bijlage I bij de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel4
  - number: '5.1'
    text: |-
      Als subsidiabele kosten komen uitsluitend in aanmerking de kosten, bedoeld in artikel 25, derde lid, van de
      algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5
  - number: '5.2'
    text: |-
      Onder artikel 25, derde lid, onderdeel e, van de algemene groepsvrijstellingsverordening vallen ook meerkosten
      brandstof en kosten om voor demonstratie noodzakelijke infrastructuur aan te leggen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5
  - number: '5.3'
    text: 'Als standaardberekeningswijzen voor de berekening van uurtarieven worden gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5
  - number: 5.3.a
    text: een berekening op basis van integrale kostensystematiek;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5
  - number: 5.3.b
    text: |-
      een berekening op basis van kosten per kostendrager vermeerderd met een forfaitair vastgestelde opslag voor
      indirecte kosten; of
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5
  - number: 5.3.c
    text: een forfaitair vastgesteld uurtarief voor loonkosten.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5
  - number: 5a.1
    text: |-
      Bij het hanteren van uurtarieven die tot stand zijn gekomen met de standaardberekeningswijze bedoeld in
      [artikel 5, derde lid, onderdeel a][ref1], worden de directe en indirecte kosten per kostendrager in een tarief per
      eenheid van deze kostendrager berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel5
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '5'
  - number: 5a.2
    text: |-
      De subsidiabele kosten worden berekend door het aantal eenheden van de kostendrager te vermenigvuldigen met het
      ingevolge het eerste lid berekende tarief, vermeerderd met de aan derden betaalde kosten voor zover deze geen deel
      uitmaken van het ingevolge het eerste lid vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5a
  - number: 5b.1
    text: |-
      Bij het hanteren van uurtarieven die tot stand zijn gekomen met de standaardberekeningswijze bedoeld in
      [artikel 5, derde lid, onderdeel b][ref1], worden de directe loonkosten per uur vermenigvuldigd met het aantal uren
      dat direct bij de subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten hebben gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel5
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '5'
  - number: 5b.2
    text: 'De subsidiabele kosten worden berekend door het ingevolge het eerste lid berekende bedrag te vermeerderen met:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5b
  - number: 5b.2.a
    text: een vaste opslag voor indirecte kosten van 50 procent van de loonkosten;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5b
  - number: 5b.2.b
    text: |-
      kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in de
      administratie te onderscheiden zijn; en
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5b
  - number: 5b.2.c
    text: aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5b
  - number: 5b.3
    text: |-
      Voor zover er geen loonkosten worden gemaakt, maar niettemin arbeid wordt verricht, wordt voor de berekening van de
      kosten van de arbeid uitgegaan van € 80,– per uur.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5b
  - number: 5c.1
    text: |-
      Bij het hanteren van uurtarieven die tot stand zijn gekomen met de standaardberekeningswijze bedoeld in
      [artikel 5, derde lid, onderdeel c][ref1], wordt een uurtarief gehanteerd van € 80,– per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel5
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '5'
  - number: 5c.2
    text: |-
      De subsidiabele kosten worden berekend door het ingevolge het eerste lid gehanteerde bedrag te vermenigvuldigen met
      het aantal uren dat de direct bij de subsidiabele activiteiten betrokken personen ten behoeve van deze activiteiten
      hebben gewerkt en te vermeerderen met:
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5c
  - number: 5c.2.a
    text: |-
      kosten van het gebruik van apparatuur en de kosten van verbruikte materialen en hulpmiddelen indien deze in de
      administratie te onderscheiden zijn; en
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5c
  - number: 5c.2.b
    text: aan derden betaalde kosten.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel5c
  - number: '6.1'
    text: 'De subsidie bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: 6.1.a
    text: 50% van de subsidiabele kosten, voor zover deze betrekking hebben op industrieel onderzoek door een onderneming;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: 6.1.b
    text: |-
      25% van de subsidiabele kosten, voor zover deze betrekking hebben op experimentele ontwikkeling door een
      onderneming;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: 6.1.c
    text: |-
      100% van de subsidiabele kosten, voor zover deze betrekking hebben op niet-economisch industrieel onderzoek of
      experimentele ontwikkeling door een onderzoeksorganisatie.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.2'
    text: 'De percentages, genoemd in het eerste lid, onderdelen a en b, worden verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: 6.2.a
    text: 10 procentpunten voor middelgrote ondernemingen en met 20 procentpunten voor kleine ondernemingen;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: 6.2.b
    text: |-
      15 procentpunten, indien voldaan wordt aan ten minste één van de voorwaarden, bedoeld in artikel 25, zesde lid,
      onderdeel b, van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.3'
    text: |-
      Van de totaal verleende subsidie aan het project bestaat ten hoogste 25% uit subsidiëring van meerkosten
      brandstof en ten hoogste 25%, met een maximum van € 2 miljoen, uit subsidiëring van kosten om de voor demonstratie
      noodzakelijke infrastructuur aan te leggen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.4'
    text: |-
      Van de totaal verleende subsidie aan het project bestaat ten hoogste 25% uit niet-economisch industrieel onderzoek
      of experimentele ontwikkeling door een onderzoeksorganisatie.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.5'
    text: De subsidie bedraagt ten hoogste € 15 miljoen per project.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.6'
    text: |-
      De subsidie bedraagt per onderneming, of per groep verbonden ondernemingen als bedoeld in artikel 3, derde lid,
      van bijlage I bij de algemene groepsvrijstellingsverordening, ten hoogste 80% van de totaal verleende subsidie aan
      het project.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.7'
    text: |-
      Ten minste 50% van de subsidiabele kosten van de deelnemers aan het samenwerkingsverband wordt gemaakt door
      Nederlandse ondernemingen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '6.8'
    text: De subsidiabele kosten bedragen niet minder dan € 25.000,– per deelnemer aan het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel6
  - number: '7.1'
    text: 'Het subsidieplafond bedraagt voor het jaar 2024 ten hoogste € 85 miljoen:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
  - number: 7.1.a
    text: |-
      voor de energielijn, bedoeld in [artikel 3, tweede lid, onderdeel a][ref1]: € 40 miljoen;


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel3
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '3'
  - number: 7.1.b
    text: |-
      voor de energielijn, bedoeld in [artikel 3, tweede lid, onderdeel b][ref1]: € 25 miljoen;


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel3
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '3'
  - number: 7.1.c
    text: |-
      voor de energielijn, bedoeld in [artikel 3, tweede lid, onderdeel c][ref1]: € 20 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel3
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '3'
  - number: '7.2'
    text: De minister verdeelt het beschikbare bedrag op basis van de volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien twee of meer aanvragen op dezelfde plaats in de rangschikking terechtkomen, wordt door middel van loting de
      definitieve plaats in de rangschikking bepaald.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
  - number: '7.4'
    text: |-
      Indien het beschikbare bedrag voor een van de energielijnen na toepassing van het tweede lid niet wordt uitgeput,
      wordt het resterende bedrag indien mogelijk toegekend aan het eerstvolgende project in de rangschikking binnen een
      van de overige energielijnen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel7
  - number: '8.1'
    text: 'De minister kent aan een O&D-project een hoger aantal punten toe naarmate:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: 8.1.a
    text: de bijdrage aan emissiereductie en klimaatneutraliteit hoger is;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: 8.1.b
    text: de aanpak voor het bewijzen van de effectiviteit en betrouwbaarheid van het energiesysteem beter is;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: 8.1.c
    text: de opschaalbaarheid en het verdienvermogen voor de strategische deelmarkten groter is;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: 8.1.d
    text: de ketensamenwerking en Nederlandse betrokkenheid groter is;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: 8.1.e
    text: |-
      de bijdrage van het project aan de samenwerking binnen het Maritiem Masterplan hoger is conform de
      beoordelingscriteria in [bijlage 2][ref1], door:


      [ref1]: https://wetten.overheid.nl/BWBR0049626
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0049626
  - number: 8.1.e.i
    text: de bijdrage aan het Joint Maritime Digital Platform; en
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: 8.1.e.ii
    text: de bijdrage aan human capital-activiteiten.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: '8.2'
    text: De minister kent per onderdeel van het eerste lid ten hoogste 20 punten toe.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel8
  - number: '9.1'
    text: |-
      Er is een Adviescommissie O&D-projecten, die tot taak heeft de minister op zijn verzoek te adviseren omtrent de
      rangschikking en toekenning van punten op basis van de rangschikkingscriteria, bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel8
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '8'
  - number: '9.2'
    text: De commissie bestaat uit ten minste 3 en ten hoogste 5 leden.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      De voorzitter en de andere leden van de commissie worden door de minister voor een termijn van ten hoogste één
      jaar benoemd.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel9
  - number: '10'
    text: |-
      De aanvraag voor subsidieverlening kan worden ingediend van 11 juni 2024, 9.00 uur tot en met 1 oktober 2024, 17.00
      uur.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel10
  - number: '11.1'
    text: Een aanvraag om subsidie heeft betrekking op één energielijn.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel11
  - number: '11.2'
    text: |-
      Een aanvrager kan de aanvraag bij de minister indienen door middel van een daartoe vastgesteld formulier dat
      beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel11
  - number: '11.3'
    text: |-
      Onverminderd [artikel 10 van het Kaderbesluit][ref1] bevat de aanvraag ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
  - number: 11.3.a
    text: een projectplan;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel11
  - number: 11.3.b
    text: de gegevens, bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel11
  - number: '12'
    text: |-
      Onverminderd de [artikelen 11][ref1] en [12 van het Kaderbesluit][ref2] wordt een subsidieaanvraag afgewezen
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel12
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '12'
  - number: 12.a
    text: |-
      er sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
  - number: 12.b
    text: |-
      er sprake is van een onderneming in moeilijkheden als bedoeld in artikel 2, achttiende lid, van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
  - number: 12.c
    text: de werkzaamheden aan het project reeds zijn aangevangen voordat de aanvraag voor dat project is ingediend;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
  - number: 12.d
    text: |-
      de subsidieverstrekking niet in overeenstemming is met enige andere bepaling van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
  - number: 12.e
    text: het aantal bij rangschikking toegekende punten in totaal minder is dan 65;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
  - number: 12.f
    text: |-
      het aantal bij rangschikking toegekende punten aan een van de criteria genoemd in
      [artikel 8, eerste lid, onderdelen a tot en met d][ref1], minder is dan 10.


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel8
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '8'
  - number: 12.g
    text: |-
      het aantal bij rangschikking toegekende punten aan een van de subonderdelen genoemd in
      [artikel 8, eerste lid, onderdeel e][ref1], minder is dan 5; of


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel8
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '8'
  - number: 12.h
    text: de subsidiabele kosten minder dan € 500.000,– per O&D-project bedragen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel12
  - number: '13'
    text: |-
      Voor zover de subsidie wordt verleend ten laste van de nog niet door de Staten-Generaal aangenomen rijksbegroting,
      onderdeel Infrastructuur en Waterstaat, wordt in de beschikking tot verlening van een subsidie vermeld dat de
      verlening plaatsvindt onder de voorwaarde dat voldoende gelden ter beschikking worden gesteld in de Wet tot
      vaststelling van de rijksbegroting, onderdeel Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel13
  - number: '14.1'
    text: Met de uitvoering van een O&D-project wordt gestart binnen 6 maanden na de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel14
  - number: '14.2'
    text: |-
      De maximale looptijd van het project is 8 jaar, bestaande uit maximaal 3 jaar ontwerpen en ontwikkelen, en maximaal
      5 jaar demonstreren en monitoren.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel14
  - number: '15.1'
    text: |-
      Indien in het O&D-project niet-economisch industrieel onderzoek of experimentele ontwikkeling door een
      onderzoeksorganisatie wordt verricht:
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.a
    text: |-
      wordt voorafgaand aan de start van het O&D-project een samenwerkingsovereenkomst gesloten tussen de deelnemers
      aan het O&D-project over de wijze waarop wordt omgegaan met de bijdrage in de kosten, het delen in de risico’s en
      uitkomsten, de verspreiding van de resultaten en de toegang tot en de regels voor de toewijzing van intellectuele
      eigendomsrechten;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.b
    text: 'worden de projectactiviteiten door de onderzoeksorganisatie:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.b.i
    text: |-
      uitgevoerd in daadwerkelijke samenwerking, als bedoeld in paragraaf 1.3, onderdeel 16, onder h, van het O&O&I-
      steunkader, met ondernemingen; en
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.b.ii
    text: in de boekhouding opgenomen als niet-economische activiteiten; en
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.c
    text: 'draagt de onderzoeksorganisatie er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.c.i
    text: |-
      de resultaten van de activiteiten waaraan geen intellectuele eigendomsrechten kunnen worden ontleend, ruim mogen
      worden verspreid en eventuele intellectuele eigendomsrechten die uit de activiteiten van de onderzoeksorganisatie
      voortvloeien, volledig aan haar worden toegekend;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.c.ii
    text: |-
      uit de activiteiten ontstane intellectuele eigendomsrechten, alsmede daarmee verband houdende toegangsrechten, aan
      de verschillende samenwerkende deelnemers worden toegekend op een wijze die een passende afspiegeling is van hun
      werkpakketten, bijdragen en respectieve belangen; of
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.1.c.iii
    text: |-
      het van de deelnemende ondernemingen een vergoeding ontvangt die overeenstemt met de marktprijs voor de
      intellectuele eigendomsrechten die voortvloeien uit het samenwerkingsproject die worden overgedragen aan de
      deelnemende ondernemingen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: '15.2'
    text: |-
      Het absolute bedrag van financiële en niet-financiële bijdragen van de deelnemende ondernemingen in de kosten van
      de activiteiten van de onderzoeksorganisatie die de betrokken intellectuele eigendomsrechten hebben opgeleverd, kan
      op de vergoeding, bedoeld in het eerste lid, onderdeel c, subonderdeel iii, in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: '15.3'
    text: 'De vergoeding, bedoeld in het eerste lid, onderdeel c, subonderdeel iii, stemt overeen met de marktprijs indien:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.3.a
    text: het bedrag van de vergoeding is vastgesteld via een publieke, open en transparante concurrerende verkoopprocedure;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.3.b
    text: een taxatie van een onafhankelijke deskundige bevestigt dat de prijs overeenstemt met de marktprijs;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.3.c
    text: |-
      de onderzoeksorganisatie als verkoper kan aantonen dat zij heeft onderhandeld over de vergoeding, om rekening
      houdende met haar algemene doelstellingen, maximaal economisch voordeel te behalen op het tijdstip dat de
      overeenkomst betreffende de vergoeding wordt afgesloten; of
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: 15.3.d
    text: |-
      in de gevallen waarin de samenwerkingsovereenkomst, bedoeld in het eerste lid onderdeel a, de onderneming een
      voorkeursrecht geeft ten aanzien van het door de onderzoeksorganisatie gegenereerde intellectuele eigendomsrecht,
      wanneer hieraan voor de onderzoeksorganisatie het recht is gekoppeld derden te verzoeken om economisch meer
      voordelige aanbiedingen, zodat de onderneming haar aanbod daaraan moet aanpassen.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: '15.4'
    text: |-
      De voorwaarden van een overeenkomst, gesloten ingevolge het derde lid, onderdeel c, wijken niet af van voorwaarden
      die onafhankelijke ondernemingen overeen zouden komen en behelzen geen enkele vorm van heimelijke verstandhouding.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel15
  - number: '16.1'
    text: |-
      Op verzoek van de minister verleent de subsidieontvanger medewerking aan het verspreiden van de resultaten van de
      op grond van deze titel gesubsidieerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel16
  - number: '16.2'
    text: |-
      De subsidieontvanger verstrekt gedurende de looptijd van het O&D-project jaarlijks een voortgangsrapportage over
      het project die de minister kan gebruiken voor de openbare brede verspreiding van de niet-bedrijfsgevoelige kennis
      en informatie die met het project worden opgedaan.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel16
  - number: '16.3'
    text: |-
      De subsidieontvanger maakt de niet bedrijfsgevoelige kennis en informatie die met het project worden opgedaan na
      afloop van het project openbaar in een verslag dat naar het oordeel van de minister van voldoende kwaliteit is.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel16
  - number: '16.4'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt vanaf de datum van de beschikking tot subsidieverlening tot vijf
      jaar na de datum van de beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel16
  - number: '16.5'
    text: |-
      De informatie, bedoeld in het tweede en derde lid, wordt verstrekt met gebruikmaking van een middel dat door de
      minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel16
  - number: '17.1'
    text: 'De minister verstrekt ambtshalve een voorschot, verdeeld over de volgende termijnen:'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel17
  - number: 17.1.a
    text: ten hoogste 15% bij de subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel17
  - number: 17.1.b
    text: ten hoogste 50% op het moment van de start van de werkzaamheden aan het schip;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel17
  - number: 17.1.c
    text: ten hoogste 15% bij de start van de monitoring;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel17
  - number: '17.2'
    text: De minister verstrekt het resterende bedrag bij de vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel17
  - number: '18.1'
    text: |-
      De aanvrager kan bij de minister een aanvraag tot vaststelling van de subsidie indienen door middel van een daartoe
      vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel18
  - number: '18.2'
    text: |-
      Onverminderd [artikel 24 van het Kaderbesluit][ref1] worden bij de aanvraag tot vaststelling van de subsidie in elk
      geval de volgende gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel24
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '24'
  - number: 18.2.a
    text: een omschrijving van de projectresultaten van het O&D-project;
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel18
  - number: 18.2.b
    text: |-
      op welke wijze het O&D-project heeft bijgedragen aan het doel, bedoeld in [artikel 2][ref1], en de energielijnen,
      bedoeld in [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049626#Artikel3
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0049626
        artikel: '3'
  - number: '18.3'
    text: |-
      Voorafgaand aan de aanvraag tot vaststelling van de subsidie dient de aanvrager bij RVO een verzoek in tot het
      bepalen van de restwaarde van de innovatieve aandrijflijn.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel18
  - number: '19'
    text: |-
      De subsidie voor de subsidiabele activiteiten, bedoeld in [artikel 3][ref1] bevat voor zover een O&D-project
      betrekking heeft op industrieel onderzoek of experimentele ontwikkeling door een onderneming staatssteun en wordt
      gerechtvaardigd door artikel 25 van de algemene groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0049626#Artikel3
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0049626
        artikel: '3'
  - number: '20'
    text: |-
      De minister publiceert uiterlijk op 1 april 2029 een tussentijds verslag en uiterlijk op 31 december 2033 een
      eindverslag over de doeltreffendheid en de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel20
  - number: '21'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 april 2029, met dien verstande dat zij van toepassing blijft op
      subsidies die voor die datum zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel21
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling Maritiem Masterplan.'
    url: https://wetten.overheid.nl/BWBR0049626/2025-07-01#Artikel22
