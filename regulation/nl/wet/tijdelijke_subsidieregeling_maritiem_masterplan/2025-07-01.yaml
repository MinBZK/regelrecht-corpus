  text: |-
    Gelet op artikel 3, eerste lid, onderdeel e, van de Kaderwet subsidies I en M en de artikelen 4, 6, zesde lid, 8,
    eerste en tweede lid, 9, 10, tweede lid, 13, 15, vierde en vijfde lid, 22, tweede lid, 23, derde en vijfde lid en
