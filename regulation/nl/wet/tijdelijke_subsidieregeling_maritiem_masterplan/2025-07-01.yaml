articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *experimentele ontwikkeling:* ontwikkeling als bedoeld in artikel 2,
      onderdeel 86, van de algemene groepsvrijstellingsverordening;
        - *grote onderneming:* onderneming als bedoeld in artikel 2, onderdeel 24, van de algemene
      groepsvrijstellingsverordening;
        - *Human Capital-activiteiten:* activiteiten als bedoeld in [bijlage 2][ref1];
        - *industrieel onderzoek:* onderzoek als bedoeld in artikel 2, onderdeel 85, van de algemene
      groepsvrijstellingsverordening;
        - *JMDP:* Joint Maritime Digital Platform als bedoeld in [bijlage 2][ref2];
        - *Kaderbesluit:* [Kaderbesluit subsidies I en M][ref3];
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *kleine onderneming:* onderneming als bedoeld in artikel 2, onderdeel 2, van de algemene
      groepsvrijstellingsverordening;
        - *Maritiem Masterplan:* plan zoals samengevat opgenomen in [bijlage 1][ref4];
        - *middelgrote onderneming:* onderneming als bedoeld in artikel 2, onderdeel 2, van de algemene
      groepsvrijstellingsverordening;
        - *Nederlandse onderneming:* onderneming die is ingeschreven bij de Kamer van Koophandel, met een hoofdvestiging
      of nevenvestiging als bedoeld in [artikel 1, eerste lid, onderdelen k en l, van de Handelsregisterwet 2007][ref5],
      in Nederland;
        - *O&D-project:* Onderzoek- en Demonstratieproject; samenhangend geheel van activiteiten van ontwerp, ontwikkeling
      en demonstratie van een technologie aan boord van het schip, bestaande uit experimentele ontwikkeling, eventueel
      aangevuld met industrieel onderzoek, door ten minste twee ondernemingen en daarnaast eventueel bestaande uit
      niet-economisch industrieel onderzoek of experimentele ontwikkeling door één of meer onderzoeksorganisaties dat
      onafhankelijk wordt uitgevoerd met het oog op meer kennis en een beter inzicht, gericht op het verduurzamen en
      versterken van de maritieme sector;
        - *O&O&I-steunkader:* Kaderregeling betreffende staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2022/C
      414/01 (PbEU 2022, C 414);
        - *onderzoeksorganisatie:* organisatie voor onderzoek en kennisverspreiding als bedoeld in paragraaf 1.3, onderdeel
      16, onder ff, van het O&O&I-steunkader;
        - *RVO:* Rijksdienst voor Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0049626
      [ref2]: https://wetten.overheid.nl/BWBR0049626
      [ref3]: https://wetten.overheid.nl/BWBR0036381
      [ref4]: https://wetten.overheid.nl/BWBR0049626
      [ref5]: https://wetten.overheid.nl/BWBR0021777#Artikel1
