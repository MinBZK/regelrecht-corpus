  - number: '5'
    text: |-
      1 Indien de financiële gegevens van een lichaam als bedoeld in [artikel 3][ref1] niet zijn opgenomen in een
      door een ander, in Nederland gevestigd, lichaam opgestelde geconsolideerde jaarrekening omdat het laatstgenoemde
      lichaam met toepassing van [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref2] daarvan heeft mogen afzien,
      is, in afwijking van artikel 3, het laatstgenoemde lichaam belastingplichtig indien de schriftelijke verklaring,
      bedoeld in artikel 403, onderdeel f, van Boek 2 van het Burgerlijk Wetboek, die is vereist voor het mogen afzien
      van een geconsolideerde jaarrekening, is afgegeven door een niet in Nederland gevestigd lichaam. Indien de
      financiële gegevens van een lichaam als bedoeld in artikel 3 niet zijn opgenomen in een door dat lichaam opgestelde
      geconsolideerde jaarrekening omdat dat lichaam met toepassing van artikel 403 van Boek 2 van het Burgerlijk
      Wetboek daarvan heeft mogen afzien, is dat lichaam niet op grond van artikel 3 maar op grond van dit artikel
      belastingplichtig indien de schriftelijke verklaring, bedoeld in artikel 403, onderdeel f, van Boek 2 van het
      Burgerlijk Wetboek, die is vereist voor het mogen afzien van een geconsolideerde jaarrekening, is afgegeven door
      een niet in Nederland gevestigd lichaam.

      2 [Artikel 4, tweede en derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031796#Artikel3
