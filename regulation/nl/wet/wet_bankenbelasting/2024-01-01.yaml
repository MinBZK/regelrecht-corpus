  - number: '8'
    text: |-
      De passiva, bedoeld in [artikel 7][ref1], zijn:

      a. ten aanzien van een belastingplichtige als bedoeld in [artikel 3, onderdeel a][ref2], [artikel 4][ref3] of
      [artikel 5][ref4]:

      1°. het toetsingsvermogen;

      2°. de deposito’s, voor zover die voor voldoening ingevolge een depositogarantiestelsel in aanmerking komen;

      3°. de passiva die betrekking hebben op de entiteit die het bedrijf van verzekeraar uitoefent;

      b. ten aanzien van een belastingplichtige als bedoeld in [artikel 3, onderdelen b of c][ref5]:

      1°. de passiva die niet zijn toe te rekenen aan het in Nederland gelegen bijkantoor;

      2°. het aan het bijkantoor toe te rekenen toetsingsvermogen;

      3°. de aan het bijkantoor toe te rekenen deposito’s, voor zover die voor voldoening ingevolge een
      depositogarantiestelsel in aanmerking komen.


