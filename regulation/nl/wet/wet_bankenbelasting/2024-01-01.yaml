  - number: '4'
    text: |-
      1 Indien de financiële gegevens van een lichaam als bedoeld in [artikel 3][ref1] zijn opgenomen in een door een in
      Nederland gevestigd lichaam opgestelde geconsolideerde jaarrekening:

      a. overeenkomstig de in artikel 4 van de IAS-verordening bedoelde internationale standaarden voor jaarrekeningen
      die volgens de procedure van artikel 6, tweede lid, van die verordening zijn goedgekeurd, of

      b. overeenkomstig [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2],

      is, in afwijking van [artikel 3][ref3], niet het eerstgenoemde lichaam belastingplichtig, maar het in Nederland
      gevestigde lichaam dat die geconsolideerde jaarrekening heeft opgesteld. Indien de financiële gegevens van een
      lichaam als bedoeld in artikel 3 zijn opgenomen in een door dat lichaam opgestelde geconsolideerde jaarrekening
      als bedoeld in de eerste volzin, is dat lichaam niet op grond van artikel 3 maar op grond van dit artikel
      belastingplichtig.

      2 Indien de financiële gegevens van een lichaam dat ingevolge het eerste lid belastingplichtig is, zijn opgenomen
      in de geconsolideerde jaarrekening van een ander lichaam dat ingevolge het eerste lid belastingplichtig is, is, in
      afwijking van het eerste lid, alleen het laatstgenoemde lichaam belastingplichtig.

      3 Het eerste lid vindt geen toepassing indien het balanstotaal van het lichaam, bedoeld in [artikel 3][ref4],
      van wie de financiële gegevens zijn opgenomen in de geconsolideerde jaarrekening, bedoeld in het eerste lid, of,
      ingeval de financiële gegevens van meerdere lichamen als bedoeld in artikel 3 zijn opgenomen in die geconsolideerde
      jaarrekening, het gezamenlijke bedrag van de balanstotalen van die lichamen:

      a. minder bedraagt dan het in [artikel 9][ref5] genoemde bedrag van de doelmatigheidsvrijstelling, of

      b. minder bedraagt dan 10% van het geconsolideerde balanstotaal zoals dat blijkt uit die geconsolideerde
      jaarrekening.


