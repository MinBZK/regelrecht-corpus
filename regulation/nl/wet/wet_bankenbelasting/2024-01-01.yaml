  - number: '12'
    text: |-
      De in [artikel 9][ref1] vermelde bedragen worden elke vijf jaar met ingang van 1 januari van een jaar
      bij ministeriële regeling gewijzigd. Deze wijziging vindt voor het eerst plaats op 1 januari 2018. De
      [artikelen 10.1][ref2] en [10.2 van de Wet inkomstenbelasting 2001][ref3] zijn van overeenkomstige toepassing, met
      dien verstande dat als correctiefactor wordt genomen het product van de tabelcorrectiefactoren van de laatste vijf
      kalenderjaren. Bij de berekening wordt het bedrag van de doelmatigheidsvrijstelling naar boven afgerond op een
      veelvoud van € 100 000 000.


      [ref1]: https://wetten.overheid.nl/BWBR0031796#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#Artikel12
