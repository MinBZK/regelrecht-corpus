        bwb_id: BWBR0031796
        artikel: '7'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 De belasting bedraagt de som van:

      a. 0,058% over het deel van het belastbare bedrag dat wordt verkregen door het belastbare bedrag te
      vermenigvuldigen met A/B, waarbij A is het totaalbedrag van de schulden op de in aanmerking te nemen balans of
      geconsolideerde balans die een looptijd hebben van minder dan één jaar en B het totaalbedrag van alle schulden op
      die balans of geconsolideerde balans, en

      b. 0,029% over het resterende deel van het belastbare bedrag.

      2 Indien de variabele beloning van ten minste één bestuurder van de belastingplichtige over het boekjaar waarover
      de balans of de geconsolideerde balans wordt opgemaakt meer bedraagt dan 25% van diens vaste beloning, worden de
      belastingpercentages, genoemd in het eerste lid, vermenigvuldigd met een factor 1,1.
    url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#Artikel10
  - number: '11'
    text: |-
      1 De belasting moet op aangifte worden voldaan.

      2 De belasting wordt verschuldigd op de eerste dag van de tiende kalendermaand na de datum naar welke de balans of
      de geconsolideerde balans is opgemaakt.

      3 Indien de voor de belastingheffing in aanmerking te nemen jaarrekening nog niet is vastgesteld op het tijdstip
      waarop de belasting op grond van het tweede lid zou zijn verschuldigd, wordt de belasting niet op dat tijdstip
      verschuldigd, maar op de eerste dag van de kalendermaand na het tijdstip waarop die jaarrekening is vastgesteld.

      4 In afwijking van het tweede en derde lid wordt bij een belastingplichtige als bedoeld in [artikel 5][ref1] de
      belasting verschuldigd op de eerste dag van de tiende kalendermaand na de datum naar welke de geconsolideerde
      balans zou moeten zijn opgemaakt als bedoeld in [artikel 7, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031796#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031796#Artikel7
    url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#Artikel11
