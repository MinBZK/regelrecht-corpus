preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in aanvulling op andere maatregelen ter versterking van
    de financiële stabiliteit in Nederland te voorzien in een bankenbelasting;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder de naam bankenbelasting wordt een belasting geheven van de in [paragraaf 2][ref1] vermelde
      belastingplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0031796#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#Artikel1
    references:
