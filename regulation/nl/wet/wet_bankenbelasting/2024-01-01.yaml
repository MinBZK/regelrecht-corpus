  - number: '9'
    text: |-
      1 De doelmatigheidsvrijstelling bedraagt € 23.500.000.000.

      2 Indien het bedrag van de belastbare som, bedoeld in [artikel 7][ref1], minder is dan € 23.500.000.000, bedraagt
      de doelmatigheidsvrijstelling het bedrag van de belastbare som.


      [ref1]: https://wetten.overheid.nl/BWBR0031796#Artikel7
    url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#Artikel9
    references:
