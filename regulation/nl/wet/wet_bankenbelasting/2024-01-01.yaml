        bwb_id: BWBR0031796
        paragraaf: '2'
  - number: '2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *balans:* balans die is opgemaakt als onderdeel van de enkelvoudige jaarrekening, bedoeld in
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], of van een naar aard en strekking vergelijkbare enkelvoudige
      jaarrekening volgens het recht van een andere staat;
        - *bank:* bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2];
        - *bijkantoor:* bijkantoor als bedoeld in onderdeel a van de definitie van bijkantoor in
      [artikel 1:1 van de Wet op het financieel toezicht][ref3];
        - *deposito:* deposito als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4] of een naar aard en
      strekking vergelijkbaar deposito volgens het recht van een andere staat;
        - *depositogarantiestelsel:* stelsel als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref5];
        - *geconsolideerde balans:* balans die is opgemaakt als onderdeel van de geconsolideerde jaarrekening, bedoeld in
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref6] of in artikel 4 van de IAS-verordening, dan wel van een naar
      aard en strekking vergelijkbare geconsolideerde jaarrekening volgens het recht van een andere staat;
        - *IAS-verordening:* Verordening (EG) nr. 1606/2002 van het Europees Parlement en de Raad van 19 juli 2002
      betreffende de toepassing van internationale standaarden voor jaarrekeningen (PbEG 2002, L 243);
        - *lidstaat:* lidstaat als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7];
        - *Nederlandsche Bank:* De Nederlandsche Bank N.V.;
        - *toetsingsvermogen:* vermogen dat wordt berekend overeenkomstig de bij algemene maatregel van bestuur
      vastgestelde regels, bedoeld in [artikel 3:57, tweede lid, van de Wet op het financieel toezicht][ref8], of naar
      aard en strekking vergelijkbare regels volgens het recht van een andere staat;
        - *variabele beloning:* beloningsbestanddeel waarvan de toekenning afhankelijk is gesteld van het bereiken van
      bepaalde doelen of van het zich voordoen van bepaalde omstandigheden;
        - *vaste beloning:* beloningsbestanddeel dat niet kan worden aangemerkt als variabele beloning;
        - *verzekeraar:* verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref9];
        - *zetel:* zetel als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref10].


