  - number: '13'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld volgens welke de inspecteur onder door hem te stellen
      voorwaarden de belastingplichtige op zijn verzoek kan toestaan het belastbare bedrag te berekenen in een
      andere geldeenheid dan de euro. Daarbij wordt onder meer aangegeven tegen welke koers het bedrag van de
      doelmatigheidsvrijstelling wordt omgerekend in de andere geldeenheid en tegen welke koers het in de andere
      geldeenheid berekende belastbare bedrag wordt omgerekend in euro’s. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0031796/2024-01-01#Artikel13
  - number: '15'
    text: |-
      Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip en vindt voor het eerst
      toepassing met betrekking tot belasting waarvan de verschuldigdheid is ontstaan op of na dat tijdstip, met dien
      verstande dat [artikel 14a][ref1]:

      a. met ingang van 1 juli 2012 in werking treedt ingeval het Staatsblad waarin deze wet wordt geplaatst wordt
      uitgegeven vóór 1 juli 2012;

      b. met ingang van de eerste dag van de maand volgend op die waarin de uitgifte van het Staatsblad waarin deze wet
      wordt geplaatst heeft plaatsgevonden, ingeval de uitgifte van dat Staatsblad plaatsvindt na 30 juni 2012 maar vóór
      1 oktober 2012;

      c. niet in werking treedt ingeval het Staatsblad waarin deze wet wordt geplaatst wordt uitgegeven na 30 september
      2012.


