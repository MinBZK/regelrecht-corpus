  - number: '7'
    text: |-
      1 Indien sprake is van een belastingplichtige als bedoeld in [artikel 3][ref1], is de belastbare som het
      balanstotaal van de balans, verminderd met de in [artikel 8][ref2] genoemde passiva van die balans.

      2 Indien sprake is van een belastingplichtige als bedoeld in [artikel 4][ref3], is de belastbare som het
      geconsolideerde balanstotaal van de geconsolideerde balans, verminderd met de in [artikel 8][ref4] genoemde passiva
      van die geconsolideerde balans.

      3 Indien sprake is van een belastingplichtige als bedoeld in [artikel 5][ref5], is de belastbare som het
      geconsolideerde balanstotaal van de geconsolideerde balans van de geconsolideerde jaarrekening die zou moeten
      zijn opgesteld als [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref6] niet van toepassing zou zijn geweest,
      verminderd met de in [artikel 8][ref7] genoemde passiva van die geconsolideerde balans.


