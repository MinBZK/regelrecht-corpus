  - number: '3'
    text: |-
      Belastingplichtig voor de bankenbelasting is:

      a. een lichaam met zetel in Nederland dat een vergunning als bedoeld in
      [artikel 2:11, eerste lid, van de Wet op het financieel toezicht][ref1] heeft voor het uitoefenen van het bedrijf
      van bank;

      b. een lichaam met zetel in een andere lidstaat dan Nederland dat vanuit een in Nederland gelegen
      bijkantoor het bedrijf van bank uitoefent, een door een toezichthoudende instantie als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2] van die lidstaat verleende vergunning voor
      het uitoefenen van het bedrijf van bank heeft en een mededeling van de Nederlandsche Bank als bedoeld in
      [artikel 2:14, eerste of tweede lid, van de Wet op het financieel toezicht][ref3] heeft ontvangen;

      c. een lichaam met zetel in een andere staat dan Nederland dat vanuit een in Nederland gelegen bijkantoor
      het bedrijf van bank uitoefent en een door de Nederlandsche Bank verleende vergunning als bedoeld in de
      [artikelen 2:16, eerste lid][ref4], of [2:20, eerste lid, van de Wet op het financieel toezicht][ref5] heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel211
