  - number: '6'
    text: |-
      1 De belasting wordt geheven naar het belastbare bedrag.

      2 Het belastbare bedrag is de belastbare som, bedoeld in [artikel 7][ref1], verminderd met de
      doelmatigheidsvrijstelling, bedoeld in [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031796#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031796#Artikel9
