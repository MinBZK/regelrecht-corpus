preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het kader van het alcoholmatigingsbeleid,
    in het bijzonder ter voorkoming van gezondheidsrisico's en maatschappelijke problemen door het misbruik van
    alcoholhoudende dranken, alsmede ter vereenvoudiging en actualisering, de Drank- en Horecawet te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011300/2010-07-14#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 Ten aanzien van degene die rechtmatig het horecabedrijf of slijtersbedrijf uitoefent in een inrichting
      waarvoor op het tijdstip van inwerkingtreding van [artikel I, onderdeel][ref1] MM, van deze wet, een op grond
      van [de artikelen 40][ref2], [43][ref3] of [44 van de Drank- en Horecawet][ref4] verleende ontheffing geldt,
      blijft de ontheffing gelden. Voornoemde ontheffing geldt ook voor degene die de uitoefening van het bedrijf in
      die inrichting rechtsgeldig voortzet. Het in de eerste volzin bepaalde geldt niet als er een onderbreking van de
      bedrijfsuitoefening is geweest gedurende een periode van langer dan een jaar. Ten aanzien van ontheffingen verleend
      voor een bepaalde tijd vervallen de aan die ontheffing verbonden tijdsbeperkingen. Dit lid vervalt op een bij
      koninklijk besluit te bepalen tijdstip, welk tijdstip voor de verschillende volzinnen verschillend kan zijn.

      2 [Artikel 5a van de Drank- en Horecawet][ref5] geldt niet ten aanzien van inrichtingen, zolang daarvoor een
      vergunning geldt die is verstrekt vóór het tijdstip van inwerkingtreding van [artikel I, onder H][ref6], van deze
      wet.

      3 [Artikel 29 (nieuw) van de Drank- en Horecawet][ref7] is niet van toepassing op de op het tijdstip van
      inwerkingtreding van [artikel I, onderdeel][ref8] DD, van deze wet geldende vergunningen.

      4 Zaken betreffende een overtreding als bedoeld in [artikel 71 van de Drank- en Horecawet][ref9] die op het
      tijdstip van inwerkingtreding van [artikel I, onder][ref10] VV, van deze wet bij enig rechterlijk college aanhangig
      zijn, worden, onverminderd [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref11], afgedaan volgens de tot
      dat tijdstip geldende regelen.


