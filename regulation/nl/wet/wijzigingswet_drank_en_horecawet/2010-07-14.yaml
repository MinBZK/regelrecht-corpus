  - number: VIII
    text: |-
      Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011300/2010-07-14#ArtikelVIII
