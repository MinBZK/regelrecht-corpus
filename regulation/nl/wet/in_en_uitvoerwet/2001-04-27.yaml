valid_from: '2001-04-27'
bwb_id: BWBR0002376
url: https://wetten.overheid.nl/BWBR0002376/2001-04-27
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter vervanging van bestaande wettelijke
    regelingen, een regeling op het gebied van de invoer en de uitvoer van goederen vast te stellen in het belang van
    de volkshuishouding, van de inwendige en uitwendige veiligheid des lands en van de internationale rechtsorde, mede
    in verband met daarop betrekking hebbende internationale afspraken of besluiten van volkenrechtelijke organisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onverminderd het bepaalde in [artikel 2, tweede lid][ref1], wordt in deze wet en de daarop berustende
      bepalingen verstaan onder: goederen: roerende lichamelijke zaken, met uitzondering van binnenlandse en
      buitenlandse wettige betaalmiddelen; Communautair douanewetboek: verordening (*EEG*) nr. 2913/92 van de
      Raad van de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek
      (*PbEG* L 302); communautaire goederen: goederen die voldoen aan de voorwaarden van artikel 4, onderdeel 7,
      van het Communautair douanewetboek; invoer van goederen: de plaatsing van goederen onder enige douaneregeling
      als bedoeld in artikel 4, onderdeel 16, onder *a*, *d* en *f*, van het Communautair douanewetboek, alsmede
      iedere handeling die daarop kennelijk rechtstreeks is gericht; uitvoer van goederen: de plaatsing van
      communautaire goederen onder een douaneregeling als bedoeld in artikel 4, onderdeel 16, onder *c*, *g* en *h*,
      van het Communautair douanewetboek, alsmede iedere handeling die daarop kennelijk rechtstreeks is gericht;
      College: 'het College van Beroep voor het bedrijfsleven; bedrijfslichaam: een bedrijfslichaam als bedoeld in'
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '1.2'
    text: Deze wet verstaat onder internationale afspraak mede een besluit van een volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van de bij of krachtens deze wet ter zake van invoer gestelde regelen worden goederen als
      bedoeld in de artikelen 202, eerste lid, en 203, eerste lid, alsmede goederen met betrekking tot welke niet
      is voldaan aan enige verplichting of voorwaarde als bedoeld in artikel 204, eerste lid, van het Communautair
      douanewetboek, geacht te zijn geplaatst onder de douaneregeling, bedoeld in artikel 4, onderdeel 16, onder *a*, van
      dat wetboek.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel1
  - number: '2.1'
    text: |-
      Indien het belang van de volkshuishouding, van de inwendige of uitwendige veiligheid des lands of van de
      internationale rechtsorde op zichzelf, dan wel een daarop betrekking hebbende internationale afspraak zulks
      naar Ons oordeel vereist, kunnen bij algemene maatregel van bestuur, in deze wet verder genoemd invoerbesluit,
      onderscheidenlijk uitvoerbesluit, regelen worden gesteld ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2.1.a
    text: de invoer of de uitvoer van daarbij aangewezen goederen,
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2.1.b
    text: |-
      de invoer of de uitvoer van goederen, die bestemd zijn voor, of van herkomst of oorsprong zijn uit daarbij
      aangewezen landen, dan wel een onbekende bestemming, herkomst of oorsprong hebben, of
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2.1.c
    text: de invoer of de uitvoer van goederen, die op een daarbij aangegeven wijze worden betaald.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: '2.2'
    text: |-
      In een invoer- of uitvoerbesluit kan worden bepaald dat bij of krachtens dat besluit ten aanzien van de invoer of
      uitvoer van goederen gestelde regelen slechts gelden met betrekking tot een of meer daarbij aangewezen bestemmingen
      onderscheidenlijk gevallen als bedoeld in de in [artikel 1][ref1] opgenomen definitie van invoer onderscheidenlijk
      uitvoer van goederen. Daarbij kan tevens worden bepaald, dat voor de toepassing van die regelen en de daarop
      berustende bepalingen de definitie van invoer onderscheidenlijk uitvoer slechts betrekking heeft op de aangewezen
      bestemmingen onderscheidenlijk gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel1
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '1'
  - number: '2.3'
    text: 'De in het eerste lid bedoelde regelen kunnen onder meer inhouden:'
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2.3.a
    text: een verbod van invoer, onderscheidenlijk uitvoer, zonder vergunning van Onze bij het besluit aangewezen Minister;
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2.3.b
    text: |-
      toekenning aan Onze bij het besluit aangewezen Minister van de bevoegdheid tot het vaststellen van rechten bij
      invoer, andere dan douanerechten, dan wel rechten bij uitvoer als bedoeld in artikel 1, tweede, onderscheidenlijk
      derde lid, van de [Douanewet][ref1], alsmede van restituties of bijdragen, door hem op aanvrage te verlenen ter
      zake van de invoer, dan wel de uitvoer van goederen;


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: 2.3.c
    text: |-
      toekenning aan Onze bij het besluit aangewezen Minister van de bevoegdheid van bij of krachtens het besluit
      gestelde regelen vrijstelling en, op aanvrage, ontheffing te verlenen;
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2.3.d
    text: |-
      al hetgeen naar Ons oordeel overigens is vereist ter voldoening aan een internationale afspraak als in het eerste
      lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: '2.4'
    text: |-
      Indien de regelen, bedoeld in het eerste tot en met derde lid, uitsluitend strekken ter uitvoering van
      verplichtingen die voortvloeien uit verdragen of uit bindende besluiten van volkenrechtelijke organisaties kan
      Onze Minister van Economische Zaken dan wel Onze Minister van Landbouw, Natuurbeheer en Visserij wat betreft
      verplichtingen op zijn terrein, in overeenstemming met Onze Minister wie het mede aangaat deze regelen vaststellen.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2
  - number: 2a.1
    text: |-
      Indien een in [artikel 2, eerste lid][ref1], bedoeld belang of internationale afspraak, ten behoeve waarvan in
      een invoer- of uitvoerbesluit ten aanzien van de invoer of uitvoer van goederen regelen worden gesteld, zulks
      naar Ons oordeel vereist, kunnen die regelen in dat besluit van overeenkomstige toepassing worden verklaard op
      andere handelingen, welke worden verricht met betrekking tot zodanige goederen, voor zover het, in de zin van het
      Communautair douanewetboek, betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
  - number: 2a.1.a
    text: |-
      goederen die op regelmatige wijze zijn aangebracht en aangegeven of op regelmatige wijze zijn aangebracht
      onder geleide van een document voor communautair douanevervoer en die nog niet zijn vrijgegeven voor een van de
      douanebestemmingen als bedoeld in artikel 4, onderdeel 16, onder *a, d* of *f*, van het Communautair douanewetboek;
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.1.b
    text: |-
      communautaire goederen die zijn aangegeven voor de douaneregeling uitvoer dan wel niet-communautaire goederen
      waarvoor een aangifte tot wederuitvoer is gedaan.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.2
    text: |-
      Voor de in het eerste lid bedoelde toepassing van de in een invoer- of uitvoerbesluit gestelde regelen worden onder
      krachtens dat lid aangewezen handelingen mede verstaan handelingen, die kennelijk rechtstreeks zijn gericht op het
      bewerkstelligen van een of meer van die handelingen.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.3
    text: |-
      Indien het belang van de internationale rechtsorde of een daarop betrekking hebbende internationale afspraak, ten
      behoeve waarvan in een uitvoerbesluit ten aanzien van de uitvoer van goederen regelen worden gesteld, zulks naar
      Ons oordeel vereist, kunnen die regelen in dat besluit van overeenkomstige toepassing worden verklaard op het doen
      uitgaan van zodanige goederen uit Nederland met als bestemming een andere Lid-Staat van de Europese Gemeenschappen.
      Het eerste lid, tweede volzin, en het tweede lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing met betrekking tot de in
      [artikel 2, vierde lid][ref1], bedoelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
  - number: 2a.5
    text: 'Met betrekking tot goederen:'
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.5.a
    text: ten aanzien van welker uitvoer in een invoer- of uitvoerbesluit regelen worden gesteld,
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.5.b
    text: die behoren tot een in dat besluit aangegeven categorie van strategische goederen en
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.5.c
    text: |-
      waarvoor op grond van het bij of krachtens dit artikel bepaalde geen verbod op de wederuitvoer zonder
      vergunning van Onze Minister van Economische Zaken geldt, kan Onze voornoemde minister, indien het belang van de
      internationale rechtsorde of een daarop betrekking hebbende internationale afspraak of van de uitwendige veiligheid
      van het land dat vereist, bij beschikking bepalen dat het doen uitgaan van die goederen uit Nederland zonder
      vergunning is verboden.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.6
    text: |-
      Indien er aanwijzingen bestaan dat bepaalde goederen, die zowel een civiele als een militaire bestemming kunnen
      hebben en waarvoor geen verbod op de uitvoer zonder vergunning van Onze Minister van Economische Zaken geldt, na te
      zijn uitgevoerd in het land van bestemming zullen of kunnen worden gebruikt om bij te dragen tot de ontwikkeling,
      de produktie, de behandeling en bediening, het onderhoud, de opslag, de opsporing, de identificatie of de
      verspreiding van chemische, biologische of nucleaire wapens of tot de ontwikkeling, de produktie, het onderhoud
      of de opslag van raketten die dergelijke wapens naar een doel kunnen voeren, kan Onze voornoemde minister bij
      beschikking bepalen dat de uitvoer van die goederen zonder vergunning is verboden.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.7
    text: |-
      Het zesde lid is van overeenkomstige toepassing ten aanzien van de wederuitvoer van niet-communautaire goederen als
      bedoeld in artikel 182 van het Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2a.8
    text: |-
      Degene die goederen uitvoert of wederuitvoert die zowel een civiele als een militaire bestemming kunnen hebben,
      wetende dat die goederen geheel of ten dele zijn bestemd om te worden gebruikt voor een van de in het zesde lid
      vermelde doeleinden, is verplicht daarvan onverwijld mededeling te doen aan Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2a
  - number: 2b.1
    text: |-
      Indien een in [artikel 2, eerste lid][ref1], bedoeld belang of internationale afspraak zulks naar Ons oordeel
      vereist, kunnen bij algemene maatregel van bestuur regelen worden gesteld ten aanzien van in het internationaal
      handelsverkeer omtrent goederen te bezigen verklaringen, of kan bij algemene maatregel van bestuur aan Onze daarbij
      aangewezen Ministers de bevoegdheid worden toegekend te dien aanzien regelen te stellen een en ander onverminderd
      het in [artikel 2][ref2] bepaalde. Bij of krachtens zodanige maatregel kan het orgaan worden aangewezen, dat met
      het verstrekken van dergelijke verklaringen is belast. Bij zodanige aanwijzing kan van het aangewezen orgaan de
      medewerking worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '2'
  - number: 2b.2
    text: |-
      Indien een in [artikel 2, eerste lid][ref1], bedoeld belang of internationale afspraak zulks naar Ons oordeel
      vereist, kunnen bij algemene maatregel van bestuur regelen worden gesteld met betrekking tot het doen van
      kennisgevingen in verband met het doen uitgaan van de goederen, bedoeld in [artikel 2a, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002376
        artikel: 2a
  - number: 2b.3
    text: |-
      [Artikel 2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
  - number: 2c.1
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een invoer- of uitvoerbesluit of een algemene
      maatregel van bestuur als bedoeld in [artikel 2][ref1] wordt Ons gedaan door Onze Minister van Economische Zaken in
      overeenstemming met Onze Minister wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2b
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2b
  - number: 2c.2
    text: |-
      Een invoer- of uitvoerbesluit, zomede een besluit tot wijziging of intrekking daarvan, treedt niet eerder in
      werking dan twee maanden na de datum van uitgifte van het *Staatsblad*, waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2c
  - number: 2c.3
    text: |-
      Met betrekking tot een op grond van het belang van de internationale rechtsorde op zichzelf, dan wel op grond
      van een daarop betrekking hebbende internationale afspraak, anders dan ter voldoening aan een verplichting die
      voortvloeit uit een verdrag of uit een bindend besluit van een volkenrechtelijke organisatie, vastgesteld invoer-
      of uitvoerbesluit, waarin regelen worden gesteld ten aanzien van daarbij aangewezen landen, zomede met betrekking
      tot een besluit tot intrekking of wijziging daarvan, is het bepaalde in het vierde en vijfde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2c
  - number: 2c.4
    text: |-
      Met betrekking tot een invoer- of uitvoerbesluit als bedoeld in het derde lid kan, binnen één maand na de datum
      van uitgifte van het *Staatsblad* waarin het betrokken besluit wordt geplaatst, door of namens één der Kamers
      der Staten-Generaal of door ten minste een vijfde van één dier Kamers de wens te kennen worden gegeven, dat het
      betrokken besluit bij de wet zal worden bekrachtigd. Indien zodanige wens te kennen is gegeven, wordt zo spoedig
      mogelijk een desbetreffend voorstel van wet aan de Tweede Kamer der Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2c
  - number: 2c.5
    text: |-
      Indien een overeenkomstig het vierde lid ingediend wetsontwerp door één der beide Kamers der Staten-Generaal wordt
      verworpen, wordt het desbetreffende besluit onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2c
  - number: 2c.6
    text: |-
      Een invoer- of uitvoerbesluit vervalt, behoudens eerdere intrekking, drie jaren na het in werking treden, tenzij
      bij nadere wet anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel2c
  - number: '4.1'
    text: |-
      Bij of krachtens een invoer- of uitvoerbesluit kunnen ter verzekering van een goede toepassing van hetgeen op grond
      van [artikel 2][ref1] of 2*a* bij of krachtens dat besluit wordt bepaald regelen worden gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
  - number: 4.1.a
    text: |-
      met betrekking tot het bij of in verband met de invoer of uitvoer van goederen, dan wel gedragingen als bedoeld in
      [artikel 2][ref1], doen van aangifte of van andere kennisgevingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2a
  - number: 4.1.b
    text: |-
      met betrekking tot het bij of in verband met de invoer of uitvoer van goederen, dan wel gedragingen als bedoeld in
      [artikel 2][ref1], verstrekken van gegevens en overleggen van bewijsstukken;


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2a
  - number: 4.1.c
    text: |-
      met het oog op het in verband met de invoer of uitvoer van goederen, dan wel gedragingen als bedoeld in
      [artikel 2][ref1], nemen van monsters en onderzoeken van die goederen;


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2a
  - number: 4.1.d
    text: |-
      met het oog op het in verband met de invoer of uitvoer van goederen, dan wel gedragingen als bedoeld in artikel
      2*a*, eerste of derde lid, op die goederen uit te oefenen toezicht;
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
  - number: 4.1.e
    text: |-
      met betrekking tot het in de uitoefening van een beroep of bedrijf aantekening houden van de invoer of uitvoer
      van goederen of gedragingen als bedoeld in [artikel 2][ref1], alsmede van de vervaardiging, de be- of verwerking,
      het bewaren dan wel het aan derden afleveren van ingevoerde of uitgevoerde goederen, en het bewaren van de
      desbetreffende aantekeningen en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2a
  - number: '4.2'
    text: |-
      Bij of krachtens een dergelijk besluit kan voorts worden bepaald, dat ter zake van het aanvragen en ter zake van
      het verkrijgen van een vergunning, een restitutie, een bijdrage of een ontheffing bij dat besluit vastgestelde
      bedragen moeten worden betaald, en kunnen regelen worden gesteld betreffende het tijdstip en de wijze van betaling.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
  - number: '4.3'
    text: |-
      [Artikel 2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
  - number: '5.1'
    text: |-
      De vergunningen, vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vergunningen,
      vrijstellingen en ontheffingen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5
  - number: '5.2'
    text: |-
      Deze voorschriften kunnen inhouden al hetgeen is vereist ter voldoening aan een internationale afspraak als in
      [artikel 2, eerste lid][ref1], bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
  - number: '5.3'
    text: |-
      De voorschriften, verbonden aan op invoer van goederen betrekking hebbende vergunningen, vrijstellingen of
      ontheffingen, kunnen de verplichting inhouden:
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5
  - number: 5.3.a
    text: |-
      die goederen te leveren aan bij die voorschriften aangewezen afnemers of aan afnemers, behorende tot een daarbij
      aangewezen groep;
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5
  - number: 5.3.b
    text: |-
      die goederen of de daaruit of met behulp daarvan verkregen goederen, indien die voorschriften tot uitvoer daarvan
      verplichten, niet uit te voeren naar in die voorschriften aangewezen landen.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5
  - number: '5.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing ten aanzien van vergunningen, vrijstellingen of ontheffingen,
      verleend ter zake van gedragingen als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2a
  - number: 5a
    text: |-
      Indien bij of krachtens een invoer- of uitvoerbesluit, dan wel bij een regeling op grond van
      [artikel 2, vierde lid][ref1], of [artikel 7, eerste lid][ref2], restituties of bijdragen als bedoeld in
      [artikel 2, derde lid, onder b][ref3], worden vastgesteld, worden bij of krachtens dat besluit, onderscheidenlijk
      bij die regeling, tevens regelen gesteld met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002376
        artikel: '2'
  - number: 5a.a
    text: |-
      de gevallen waarin aanspraak kan worden gemaakt op een restitutie of bijdrage, de grondslagen waarnaar de
      berekening van de uit te keren bedragen plaatsvindt en de tarieven van de restituties of bijdragen;
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5a
  - number: 5a.b
    text: de aanspraak op en de voldoening van de toegekende bedragen.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel5a
  - number: '6'
    text: De verlening van een restitutie of bijdrage geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister van Economische Zaken in overeenstemming met Onze Minister wie het mede aangaat, kan, wanneer hij
      overweegt een voordracht tot vaststelling, wijziging of intrekking van een invoer- of uitvoerbesluit te doen en
      naar zijn oordeel een gewichtige reden een onmiddellijke voorziening eist, bij ministeriële regeling overeenkomstig
      de in overweging zijnde maatregel regelen stellen en in het bestaande besluit vervatte regelen buiten werking
      stellen.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel7
  - number: '7.2'
    text: |-
      De [artikelen 2, tweede en derde lid][ref1], [2a, eerste tot en met derde lid][ref2],
      [4, eerste en tweede lid][ref3], [5][ref4], [5a][ref5] en [6][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0002376#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002376#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0002376#Artikel5a
      [ref6]: https://wetten.overheid.nl/BWBR0002376#Artikel6
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002376
        artikel: 2a
      - id: ref3
        bwb_id: BWBR0002376
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0002376
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0002376
        artikel: 5a
      - id: ref6
        bwb_id: BWBR0002376
        artikel: '6'
  - number: '8'
    text: |-
      Een regeling op grond van [artikel 7, eerste lid][ref1], blijft, behoudens eerdere intrekking, van kracht, totdat
      een krachtens [artikel 2, eerste lid][ref2], getroffen maatregel, welke hetzelfde onderwerp betreft, in werking
      treedt doch uiterlijk tot tien maanden na het in werking treden van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '2'
  - number: '9.1'
    text: |-
      Onze betrokken Minister kan een vergunning, een restitutie, een bijdrage of een ontheffing intrekken, indien de
      te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere
      beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel9
  - number: '9.2'
    text: |-
      Een bijdrage of een restitutie welke is verleend in het kader van de uitvoering van een regeling, vastgesteld
      door een orgaan van de Europese Gemeenschappen, kan eveneens worden ingetrokken indien ingevolge een toepasselijk
      voorschrift, vastgesteld door een zodanig orgaan, geen aanspraak kan worden gemaakt op die restitutie of bijdrage.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel9
  - number: '10.1'
    text: |-
      Onze betrokken Minister kan de vergunningen en ontheffingen, behorende tot een door hem aangewezen groep,
      gezamenlijk intrekken, indien een gewichtige reden dit naar zijn oordeel noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel10
  - number: '10.2'
    text: |-
      De bekendmaking van een krachtens het eerste lid vastgesteld besluit geschiedt door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel10
  - number: 10a
    text: |-
      Indien ter uitvoering van regelen, die mede op grond van [artikel 2, derde lid, onder d][ref1], zijn gesteld,
      Onze bij die regelen aangewezen Minister nadere regelen stelt, zijn ten aanzien van rechten en aanspraken te
      verlenen krachtens die regelen, de [artikelen 4, eerste en tweede lid][ref2], [5][ref3], [6][ref4], [9][ref5] en
      [10][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002376#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002376#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0002376#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0002376#Artikel10
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002376
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002376
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0002376
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0002376
        artikel: '10'
  - number: '11.1'
    text: |-
      Onze betrokken Minister kan bevoegdheden, welke hem ingevolge het bij of krachtens een invoer- of uitvoerbesluit,
      een algemene maatregel van bestuur als in [artikel 2][ref1] bedoeld of een krachtens [artikel 2, vierde lid][ref2],
      2b, derde lid, 4, derde lid, of 7 vastgestelde ministeriële regeling bepaalde, dan wel ingevolge [artikel 9][ref3]
      toekomen, delegeren aan het bestuur van een bedrijfslichaam of van een rechtspersoonlijkheid bezittend lichaam als
      bedoeld in [artikel 110 van de Wet op de bedrijfsorganisatie][ref4]. De vorige volzin geldt niet, voor zover de
      toepasselijkheid daarvan bij het invoer- of uitvoerbesluit, bij de betrokken maatregel, onderscheidenlijk bij de
      krachtens [artikel 2, vierde lid][ref5], 2b, derde lid, 4, derde lid, of 7 vastgestelde ministeriële regeling, is
      uitgesloten. Onze Minister van Economische Zaken kan aan een delegatie op grond van de eerste volzin beperkingen
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002376#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel110
      [ref5]: https://wetten.overheid.nl/BWBR0002376#Artikel2
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2b
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002376
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002058
        artikel: '110'
      - id: ref5
        bwb_id: BWBR0002376
        artikel: '2'
  - number: '11.2'
    text: |-
      Besluiten van algemene strekking, vastgesteld met gebruikmaking van een gedelegeerde bevoegdheid, behoeven de
      goedkeuring van Onze betrokken Minister. Goedkeuring kan slechts worden onthouden wegens strijd met het recht of
      het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel11
  - number: '11.3'
    text: |-
      Besluiten zonder algemene gelding, tot het nemen waarvan de bevoegdheid is gedelegeerd, kunnen worden genomen ten
      aanzien van een ieder.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel11
  - number: '11.4'
    text: |-
      De bekendmaking van een krachtens het eerste lid vastgesteld besluit of van een besluit tot wijziging of intrekking
      daarvan, geschiedt door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel11
  - number: '11.5'
    text: |-
      De besturen van de in het eerste lid bedoelde lichamen stellen jaarlijks een begroting en een jaarrekening op
      met betrekking tot de werkzaamheden voortvloeiend uit de gedelegeerde bevoegdheden, bedoeld in het eerste lid.
      De begroting en de jaarrekening behoeven de goedkeuring van Onze betrokken Minister. Bij of krachtens algemene
      maatregel van bestuur kunnen terzake nadere voorschriften worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel11
  - number: 12b.1
    text: |-
      Indien dit ingevolge een besluit, vastgesteld door een orgaan van de Europese Gemeenschappen, wordt vereist om te
      kunnen beoordelen of ten aanzien van de invoer of uitvoer van goederen maatregelen moeten worden getroffen, kan
      Onze Minister van Economische Zaken bij door hem aangewezen ondernemers onderzoekingen doen verrichten.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel12b
  - number: 12b.2
    text: |-
      Deze onderzoekingen kunnen uitsluitend worden gericht op het verzamelen van die gegevens, welker verkrijging
      naar het oordeel van Onze Minister van Economische Zaken noodzakelijk is om te voldoen aan hetgeen wordt vereist
      ingevolge een besluit als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel12b
  - number: 12b.3
    text: |-
      Voor het verrichten van onderzoekingen als in het eerste lid bedoeld geeft Onze Minister van Economische Zaken voor
      ieder afzonderlijk geval schriftelijk opdracht. In zodanige opdracht worden de daarmede belaste ambtenaren en de te
      verkrijgen gegevens vermeld.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel12b
  - number: 12b.4
    text: |-
      Ten aanzien van de ambtenaren, bedoeld in het derde lid, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3]
      tot en met [5:17][ref4] en [5:20 van de Algemene wet bestuursrecht][ref5] van overeenkomstige toepassing. Zo nodig
      oefenen zij de in artikel 5:17 van die wet bedoelde bevoegdheid uit met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 12b.5
    text: |-
      Onze Minister van Economische Zaken oefent de hem in dit artikel toegekende bevoegdheden niet uit dan in
      overeenstemming met Onze Ministers, wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel12b
  - number: '13.1'
    text: Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel13
  - number: '13.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de in [artikel 2a, vijfde en zesde lid][ref1], bedoelde
      beschikking van de Minister van Economische Zaken beschouwd als een beslissing als bedoeld in
      [artikel 6:3 van de Algemene wet bestuursrecht][ref2] inzake de procedure ter voorbereiding van de beslissing op de
      aanvraag van een ingevolge die beschikking vereiste vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '17'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel17
  - number: '18'
    text: |-
      Het is verboden ter zake van een aanvrage om vergunning, ontheffing, restitutie, bijdrage, een verklaring als in
      [artikel 2b, eerste lid][ref1], bedoeld, of een recht of aanspraak als in [artikel 10a][ref2] bedoeld onjuiste of
      onvolledige gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: 2b
      - id: ref2
        bwb_id: BWBR0002376
        artikel: 10a
  - number: '19.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Economische Zaken en Onze Ministers wie het mede aangaat tezamen aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel19
  - number: '19.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel19
  - number: '25'
    text: 'Deze wet kan worden aangehaald als: In- en uitvoerwet.'
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel25
  - number: '26'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002376/2001-04-27#Artikel26
