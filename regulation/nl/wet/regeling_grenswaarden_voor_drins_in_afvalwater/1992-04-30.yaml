$id: regeling_grenswaarden_voor_drins_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '1992-04-30'
bwb_id: BWBR0005449
url: https://wetten.overheid.nl/BWBR0005449/1992-04-30
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor DRINS voorkomend in afvalwater dat in
    oppervlaktewateren wordt gebracht ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen
    van 16 juni 1988 tot wijziging van bijlage II van Richtlijn 86/280/EEG betreffende grenswaarden en
    kwaliteitsdoelstellingen voor lozingen van bepaalde onder lijst I van de bijlage van Richtlijn 76/464/EEG vallende
    gevaarlijke stoffen, 88/347/EEG (PbEG L 158);

    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            DRINS:

              aldrin, dieldrin, endrin of isodrin;



            b
            aldrin:

              de chemische verbinding 1,2,3,4,10,10-hexachloor-1,4,4a,5,8,8a-hexahydro-1,4-endo-5,8-exodimethano-
      naftaleen (Cas nr. 309-00-2);



            c
            dieldrin:

              de chemische verbinding 1,2,3,4,10,10-hexachloor-6,7-epoxy-1,4,4a,5,6,7,8,8a-octahydro-1,4-endo-5,8-exo-
      dimethano-naftaleen (Cas nr. 60-57-1);



            d
            endrin:

              de chemische verbinding 1,2,3,4,10,10-hexachloor-6,7-epoxy-1,4,4a,5,6,7,8,8a-octahydro-1,4-endo-5,8-endo-
      dimethano-naftaleen (Cas nr. 72-20-8);



            e
            isodrin:

              de chemische verbinding 1,2,3,4,10,10-hexachloor-1,4,4a,5,8,8a-hexahydro-1,4-endo-5,8-endo-dimethano-
      naftaleen (Cas nr. 465-73-6);



            f
            verwerken van DRINS:

              elk industrieel proces waarbij DRINS of DRINS bevattende stoffen worden geproduceerd, omgezet of gebruikt,
      of waarbij DRINS of DRINS bevattende stoffen vrijkomen;



            g
            bestaand bedrijf:

              bedrijf dat DRINS verwerkt, dat op 24 juni 1989 in werking is en waarvan de capaciteit voor het verwerken
      van DRINS na 24 juni 1989 niet aanzienlijk is uitgebreid;



            h
            nieuw bedrijf:

              bedrijf dat DRINS verwerkt en geen bestaand bedrijf is;



            i
            bijlage I:

              bij deze regeling behorende bijlage I;



            j
            bijlage II:

              bij deze regeling behorende bijlage II.
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel1
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie DRINS voorkomend
      in afvalwater dat in oppervlaktewateren wordt gebracht, de grenswaarden die overeenkomen met de waarden die het
      resultaat zijn van toepassing van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf
      behorende tot een van de in bijlage I genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder
      geval niet hoger is dan de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel2
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie DRINS voorkomend in
      afvalwater dat in oppervlaktewateren wordt gebracht:

      a. indien dat bedrijf behoort tot een van de in bijlage I genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde;

      b. indien dat bedrijf niet behoort tot een in bijlage I genoemde bedrijfstak: de grenswaarden die op 24 juni 1989
      overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel3
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie DRINS, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel4
  - number: '5'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 12 december 1988,
      houdende regelen met betrekking tot grenswaarden voor aldrin, dieldrin, endrin en isodrin (Stb. 588) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor DRINS in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005449/1992-04-30#Artikel7
