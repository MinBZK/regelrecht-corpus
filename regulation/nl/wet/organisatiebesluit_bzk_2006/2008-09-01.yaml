  - number: '3.7'
    text: |-
      1 De Projectdirectie Nieuwbouw Justitie & BZK staat onder leiding van een directeur.

      2 De projectdirectie heeft de volgende taken:

      a. het bevorderen van het tot stand komen van nieuwe huisvesting en de bijbehorende voorzieningen voor het
      kerndepartement;

      b. het voorbereiden van de verhuizing;

      c. het voeren van overleg met de ontwerpende en uitvoerende partijen waaronder het verzorgen van
      interdepartementale afstemming en afstemming met de betrokken gemeente;

      d. de zorg voor een adequate informatievoorziening over het project.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen staat onder leiding van een secretaris.

      2 Het secretariaat heeft tot taak beide raden inhoudelijk en administratief te ondersteunen bij hun advisering.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 Het Secretariaat voor de Kiesraad staat onder leiding van een secretaris/directeur.

      2 Het secretariaat biedt ondersteuning aan de Kiesraad bij het vervullen van zijn wettelijke taken op het terrein
      van verkiezingen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Het Bureau Gemeenschappelijke Diensten staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het ondersteunen van de leiding van de organisatieonderdelen Bureau Gemeenschappelijke Diensten, bureau
      Strategie, Innovatie en Accountmanagement, directie Personeel en Organisatie, directie Financiële Bedrijfsvoering,
      directie Informatie en Communicatie Technologie, directie Communicatie en Informatie, directie Facilitaire Zaken
      bij de uitvoering en verantwoording van het integraal management;

      b. het uitvoeren van de integrale control voor de Staf.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.10
  - number: '3.11'
    text: |-
      1 Het bureau Strategie, Innovatie en Accountmanagement staat onder leiding van de plaatsvervangend secretaris-
      generaal.

      2 Het bureau heeft de volgende taken:

      a. het innoveren van en adviseren over de bedrijfsvoering van het Ministerie;

      b. het voeren van het accountmanagement.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 De directie Personeel en Organisatie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen implementeren en evalueren van het HRM- ARBO- en arbeidsvoorwaardenbeleid;

      b. het doen van onderzoek en het monitoren van het gevoerde beleid en beheer;

      c. het adviseren en ondersteunen op het terrein van HRM, organisatie, ARBO, juridisch aangelegenheden en
      medezeggenschap;

      d. het afstemmen van vraag en aanbod van personeel;

      e. het voeren van de personeels- en salarisadministratie;

      f. het beheren van personeelssystemen;

      g. het uitoefenen van taken als bedoeld in [artikel 2 van het Beheersbesluit KABGNA/KABGA 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009743#Artikel2
