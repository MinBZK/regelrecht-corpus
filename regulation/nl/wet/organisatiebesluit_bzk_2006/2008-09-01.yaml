        artikel: '2'
  - number: '3.13'
    text: |-
      1 De directie Financiële Bedrijfsvoering staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het verzorgen van de proces- en financiële infrastructuur;

      b. het verzorgen van de financiële administraties

      c. het ondersteunen van de (beleids)directies in sturings-, beheersings- en verantwoordingsvraagstukken;

      d. het verrichten van financieel onderzoek;

      e. het verzorgen van de uitvoering van de financiële verhoudingswet.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 De directie Informatie en Communicatie Technologie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen en adviseren over ICT-strategie, -beleid en -innovatie;

      b. het projectmatig opzetten en uitvoeren van ICT-ontwikkelingen en -⁠innovaties

      c. het ontwikkelen en uitvoeren van het technisch beheer van de ICT-infrastructuur;

      d. het leveren van directe gebruikersservice door de ICT-servicedesk;

      e. het voeren van het ICT-functioneel applicatiebeheer;

      f. het ondersteunen, monitoren en plannen van de bovenstaande processen op basis van het ITIL-kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 De directie Communicatie en Informatie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het adviseren over communicatie en woordvoering en over (beleids)kaders en acties in informatievoorziening;

      b. het voeren van redactie;

      c. het leveren van document-, informatie-, kennis, publicatie, tekst en webdiensten;

      d. het ontwikkelen en innoveren van het informatievoorziening- en communicatiebeleid;

      e. het voeren van relatiebeheer;

      f. het faciliteren van interactieve besluitvorming.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.15
  - number: '3.16'
    text: |-
      1 De directie Facilitaire Zaken staat onder leiding van een directeur.

      2 De directie heeft de tot taak het voorbereiden, ontwikkelen en uitvoeren van het beleid voor de onderdelen van
      het Ministerie die zijn gevestigd in nader te bepalen panden met betrekking tot:

      a. bouwzaken en huisvesting;

      b. algemene facilitaire dienstverlening (Servicedesk);

      c. verwerving van facilitaire goederen en diensten;

      d. het adviseren over de concernbrede verwerving van goederen en diensten;

      e. het voeren van het beheer van door FAZ afgesloten contracten;

      f. bewaking en beveiliging;

      g. bedrijfshulpverlening.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.16
  - number: '3.17'
    text: |-
      1 Het directoraat-generaal Bestuur staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het Ministerie, voor zover deze betreffen:

      a. het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen
      de identiteitsinfrastructuur en de relaties met de overige onderdelen van het koninkrijk, de EU en andere
      internationale instellingen;

      b. het zorgdragen voor goede relaties met en coördinatie van de samenwerking met de Nederlandse Antillen en Aruba;

      c. het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, onder
      andere met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het Provinciefonds);

      d. het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit
      de eigenstandige positie van provincies en gemeenten;

      e. het zorgdragen voor een goed Gemeentelijke Basis Administratiestelsel en voor een goed functionerend
      reisdocumentenstelsel en het daarbij behorende persoonsinformatiebeleid;

      f. het ontwikkelen van beleid op het gebied van arbeidsverhoudingen, -voorwaarden en arbeidsmarktvraagstukken voor
      de openbare sector;

      g. het ontwikkelen van het innovatie- en informatiebeleid voor de openbare sector;

      h. het ondersteunen van de elektronische dienstverlening aan burgers en bedrijven door de noodzakelijke
      infrastructurele basisvoorzieningen te beheren en verder te ontwikkelen.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het Bureau Directeur-Generaal van het directoraat-generaal Bestuur (BDGB);

      b. de directie Koninkrijksrelaties (KR);

      c. de directie Grotestedenbeleid en Interbestuurlijke Betrekkingen (GSIB);

      d. de directie Bestuurlijke en Financiële Organisatie (BFO);

      e. de afdeling Kabinetszaken (KZ);

      f. de Vertegenwoordiging van Nederland in Aruba (VNA);

      g. de Vertegenwoordiging van Nederland in de Nederlandse Antillen (VNNA);

      h. het agentschap Basisadministratie Persoonsgegevens en Reisdocumenten (BPR);

      i. het Bureau Verbond Sectorwerkgevers (VSO);

      j. de directie Arbeidszaken Openbare Sector (AOS);

      k. de directie Innovatie en Informatiebeleid Openbare Sector (IIOS);

      l. de Gemeenschappelijke Beheer Organisatie (GBO).
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.17
  - number: '3.18'
    text: |-
      1 Het Bureau Directeur-Generaal van het directoraat-generaal Bestuur staat onder leiding van een hoofd.

      2 Het bureau heeft tot taak de directeur-generaal te ondersteunen bij de uitvoering van de beleids- en
      beheerstaken.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.18
  - number: '3.19'
    text: |-
      1 De directie Koninkrijksrelaties staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen van het samenwerkingsbeleid in algemene zin respectievelijk van het Nederlands beleid met
      betrekking tot de samenwerkingsrelatie met de Nederlandse Antillen en Aruba;

      b. het ontwikkelen, coördineren en uitvoeren van de samenwerking en het onderhouden van betrekkingen met de
      Nederlandse Antillen en Aruba;

      c. het initiëren en coördineren van het Nederlandse beleid ten aanzien van de Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.19
  - number: '3.20'
    text: |-
      1 De directie Grotestedenbeleid en Interbestuurlijke Betrekkingen staat onder leiding van een directeur.

      2 De directie heeft tot taak het toezien op een heldere verantwoordelijkheidsverdeling tussen rijk, provincies en
      gemeenten en het bevorderen van de samenwerking tussen overheidslagen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.20
  - number: '3.21'
    text: |-
      1 De directie Bestuurlijke en Financiële Organisatie staat onder leiding van een directeur.

      2 De directie heeft tot taak het ontwikkelen van beleid met betrekking tot de inrichting, werking en financiering
      van het binnenlands bestuur, in het bijzonder de provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.21
  - number: '3.22'
    text: |-
      1 De afdeling Kabinetszaken staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het adviseren van de Minister over de benoeming, herbenoeming en het ontslag van burgemeesters en commissarissen
      van de Koningin.

      b. het uitvoeren van beleid en regelgeving inzake de rechtspositie van (de landelijke, de provinciale en de lokale)
      bestuurders en volksvertegenwoordigers;

      c. het voorbereiden van de benoeming en het ontslag van de leden van de Algemene Rekenkamer, de Raad van State, de
      Hoge Raad van Adel en het Kapittel voor de Civiele Orden;

      d. het ontwikkelen en uitvoeren van de personele zorg voor burgemeesters;

      e. het ontwikkelen en uitvoeren van beleid betreffende koninklijke onderscheidingen en het behandelen van zaken met
      betrekking tot de Kanselarij der Nederlandse Orden en het Kapittel voor de Civiele Orden;

      f. het uitvoeren van de [Wet op de Adeldom][ref1] en het behandelen van zaken met betrekking tot de Hoge Raad van
      Adel;

      g. het uitvoeren van de [Wet Subsidiëring politieke partijen][ref2];

      h. het uitvoeren van pensioenen, uitkeringen en wachtgelden van ministers en staatssecretarissen, leden Europees
      Parlement en burgemeesters.


      [ref1]: https://wetten.overheid.nl/BWBR0006667
      [ref2]: https://wetten.overheid.nl/BWBR0010465
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0006667
      - id: ref2
        bwb_id: BWBR0010465
  - number: '3.23'
    text: |-
      1 De Vertegenwoordiging van Nederland in Aruba staat onder leiding van een Vertegenwoordiger.

      2 De Vertegenwoordiging heeft bij koninklijk besluit van 24 april 1997, regelende de positie en functie van
      Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen onderscheidenlijk Aruba,
      de volgende taken:

      a. het optreden als vertegenwoordiger van de Nederlandse regering bij de regering van Aruba;

      b. het onderhouden van contacten met de regering van Aruba, alsmede met andere autoriteiten van Aruba;

      c. het informeren van de ministers en de ambtelijke leiding van het Ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in Aruba;

      het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en andere
      autoriteiten aan Aruba.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.23
  - number: '3.24'
    text: |-
      1 De Vertegenwoordiging van Nederland in de Nederlandse Antillen staat onder leiding van een Vertegenwoordiger.

      2 De Vertegenwoordiging heeft bij koninklijk besluit van 24 april 1997, regelende de positie en functie van
      Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen onderscheidenlijk Aruba
      de volgende taken:

      a. het optreden als vertegenwoordiger van de Nederlandse regering bij de regering en de eilandbesturen van de
      Nederlandse Antillen;

      b. het onderhouden van contacten met de regering en de eilandbesturen en met andere autoriteiten in de Nederlandse
      Antillen;

      c. het informeren van de ministers en de ambtelijke leiding van het Ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in de Nederlandse Antillen;

      d. het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan de Nederlandse Antillen;

      e. het zorgdragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.24
  - number: '3.25'
    text: |-
      1 Het agentschap Basisadministratie Persoonsgegevens en Reisdocumenten staat onder leiding van een directeur.

      2 Het agentschap is belast met taken met betrekking tot:

      a. de instandhouding van de gemeentelijke basisadministratie persoonsgegevens;

      b. het beleid inzake reisdocumenten en de uitvoering van de [Paspoortwet][ref1];

      c. het zorgdragen voor de implementatie van grootschalige ICT-projecten op het terrein van identiteitsmanagement;

      d. het beleid met betrekking tot de inrichting van het verkiezingsproces, de reguliere taken verkiezingsproces en
      de uitvoering van de vernieuwingsagenda.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: '3.26'
    text: |-
      1 Het Bureau Verbond Sectorwerkgevers staat onder leiding van een hoofd.

      2 Het bureau heeft tot taak het voeren van het secretariaat van het verbond van Sectorwerkgevers Overheid.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.26
  - number: '3.27'
    text: |-
      1 De directie Arbeidszaken Openbare Sector staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het in samenwerking met het veld ontwikkelen van beleidskaders en beleidsinstrumenten op het gebied van
      arbeidsverhoudingen, -voorwaarden en arbeidsmarktvraagstukken;

      b. het adviseren van de politiek en het veld over de ontwikkeling en/of toepassing van aanvullende of nieuwe
      beleidskaders en -instrumenten;

      c. het begeleiden van de implementatie en het gebruik van aangeboden voorzieningen door het vervullen van een
      stimulerende en faciliterende rol.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.27
  - number: '3.28'
    text: |-
      1 De directie Innovatie en Informatiebeleid Openbare Sector staat onder leiding van een directeur.

      2 De directie heeft tot taak het ontwikkelen van beleid waarbij de focus ligt op innovatie van werkprocessen en de
      toepassing van informatie en communicatie technologie (ICT) in de openbare sector. De taken zijn:

      a. het realiseren van elektronische publieke dienstverlening;

      b. het verbeteren van werkwijzen door innovatie;

      c. het verminderen van de administratieve lasten voor de burger;

      d. het bevorderen en faciliteren van informatiebeveiliging;

      e. het coördineren van Europese ontwikkelingen ten aanzien van innovatie en ICT en strategisch onderzoek op dit
      terrein;

      f. het in stand houden, optimaliseren en het bevorderen van het gebruik van gerealiseerde overheidsbrede ICT-
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.28
  - number: '3.29'
    text: |-
      1 De Gemeenschappelijke Beheer Organisatie staat onder leiding van een directeur.

      2 De Gemeenschappelijke Beheer Organisatie heeft tot taak het ondersteunen van de elektronische dienstverlening aan
      burgers en bedrijven door de noodzakelijke infrastructurele basisvoorzieningen te beheren en verder te ontwikkelen.
      De basisvoorzieningen zijn: identificatie en authenticatie; gegevensuitwisseling; berichtendiensten en inkijk;
      informatiebeveiliging en standaarden.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.29
  - number: '3.30'
    text: |-
      1 Het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het Ministerie, voor zover deze betreffen:

      a. het arbeidsvoorwaardenbeleid;

      b. het personeelsbeleid;

      c. de organisatie en kwaliteit van de rijksoverheid.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. Het Bureau Directeur-Generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (BDGOBR);

      b. de directie Personeel, Organisatie en Informatie Rijk (POI Rijk) ;

      c. de Werkmaatschappij (WMij);

      d. de baten-lastendienst P-Direkt i.o.;

      e. het agentschap Centrale Archief Selectiedienst (CAS).
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.30
  - number: '3.31'
    text: |-
      1 Het Bureau Directeur-Generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder
      leiding van een hoofd.

      2 Het bureau heeft tot taak de directeur-generaal te ondersteunen bij de uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.31
  - number: '3.32'
    text: |-
      1 De directie Personeel, Organisatie en Informatie Rijk staat onder leiding van een directeur.

      2 De directie draagt zorg voor het beleid aangaande:

      a. de arbeidsvoorwaarden van het Rijk;

      b. de arbeidskwaliteit van het Rijk;

      c. de organisatie van de Rijksoverheid en de daaraan verbonden uitvoeringsorganisaties op centraal niveau;

      d. de informatievoorziening op het vlak van de bedrijfsvoering bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.32
  - number: '3.33'
    text: |-
      1 De Werkmaatschappij staat onder leiding van een directeur.

      2 De Werkmaatschappij heeft tot taak onderdak te bieden aan interdepartementale samenwerkingsverbanden vooralsnog
      uitsluitend op het gebied van bedrijfsvoering en uitsluitend binnen de Rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.33
  - number: '3.34'
    text: |-
      1 De baten-lastendienst i.o. P-Direkt staat onder leiding van een directeur.

      2 P-Direkt heeft tot taak het ontwikkelen, beheren en exploiteren van gezamenlijke personeels- en salarissystemen
      voor de Rijksdienst (exclusief Defensie en de Staten-Generaal).
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.34
  - number: '3.35'
    text: |-
      1 Het agentschap Centrale Archief Selectiedienst staat onder leiding van een directeur.

      2 Het agentschap heeft de taken, bedoeld in het besluit van 12 december 1996, houdende regels met betrekking tot
      taak en werkwijze van de Centrale Archief Selectiedienst.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.35
  - number: '3.36'
    text: |-
      1 Het directoraat-generaal Veiligheid staat onder leiding van een Directeur-Generaal en een plaatsvervangend
      Directeur-Generaal.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het Ministerie, voorzover deze het bevorderen van de veiligheid betreffen.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het Bureau Directeur-Generaal Veiligheid (BDGV);

      b. de afdeling Financiën Directoraat-generaal Veiligheid;

      c. de directie Strategie (S);

      d. de directie Crisisbeheersing (CB);

      e. de directie Brandweer en Geneeskundige Hulp bij Ongevallen en Rampen (BG);

      f. de directie Politie (POL);

      g. het bureau Landelijk Management Development Politie en Brandweer (BLMD);

      h. het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA);

      i. het agentschap Korps landelijke politiediensten (KLPD);

      j. de baten-lastendienst Landelijke Faciliteit Rampenbeheersing (LFR).
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.36
  - number: '3.37'
    text: |-
      1 Het bureau Directeur-Generaal Veiligheid staat onder leiding van een hoofd.

      2 Het bureau heeft tot taak het ondersteunen van de Directeur-Generaal bij de uitvoering van de beleids- en
      beheertaken.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.37
  - number: '3.38'
    text: |-
      1 De afdeling Financiën Directoraat-generaal Veiligheid staat onder leiding van een hoofd.

      2 De afdeling Financiën Directoraat-generaal Veiligheid heeft tot taak het kwantitatief en kwalitatief verwerven
      van budget voor nieuw beleid en het verwezenlijken van een optimale aanwending van de budgetten van het
      Directoraat-generaal Veiligheid.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.38
  - number: '3.39'
    text: |-
      1 De directie Strategie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen van een strategische visie vanuit de kennis van de omgeving;

      b. het ontwikkelen van integraal veiligheidsbeleid vanuit een integraal beeld van alle partners in de
      veiligheidsketen, in het bijzonder gemeenten, private partners en andere departementen;

      c. het coördineren van internationaal beleid in de eerste plaats gericht op het inbrengen van de nationale ambities
      in de internationale omgeving, maar ook om de internationale ontwikkelingen vroegtijdig in het nationale debat
      te brengen;

      d. het ontwikkelen van informatiebeleid vanuit de kansen die het informatiebeleid biedt voor het beter presteren
      van de partners in veiligheid en de kansen en risico’s die ICT-ontwikkelingen bieden voor de samenleving.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.39
  - number: '3.40'
    text: |-
      1 De directie Crisisbeheersing staat onder leiding van een directeur, tevens Nationaal Coördinator Crisisbeheersing
      (NCCB).

      2 De directie heeft de volgende taken:

      a. het monitoren en analyseren van maatschappelijke ontwikkelingen om potentiële rampen en crises te identificeren;

      b. het ontwikkelen en (laten) vaststellen van integrale beleidskaders om crises en rampen waar mogelijk te
      voorkomen, beheersbaar te maken en om de gevolgen van crises en rampen in voorkomende gevallen adequaat bestuurlijk
      te coördineren en te regisseren en materiële en immateriële schade zoveel mogelijk te beperken;

      c. het zorgdragen voor – en toetsen van – het ontwikkelen, implementeren, beheren en handhaven van samenhangend
      beleid op het terrein van crisis- en rampenbeheersing door verantwoordelijke partners in veiligheid zowel binnen
      als buiten de overheid;

      d. het zorgdragen voor een integrale aanpak van de bescherming van de vitale infrastructuur;

      e. het ontwikkelen van kwaliteitscriteria en het vaststellen van normen op het terrein van crisis- en
      rampenbeheersing;

      f. het waar nodig stimuleren en faciliteren van de verantwoordelijke partners in veiligheid en het deels
      financieren van de kosten;

      g. het optreden als coördinator en het bieden van faciliteiten inzake crisis- en rampenbeheersing bij dreigende
      crises en rampen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.40
  - number: '3.41'
    text: |-
      1 De directie Brandweer en GHOR staat onder leiding van een directeur.

      2 De directie heeft tot taak het prestatievermogen van de brandweer en van de Geneeskundige Hulp bij Ongevallen en
      Rampen te vergroten door:

      a. het versterken van de bestuurlijke en financiële organisatie;

      b. het ontwikkelen van beleid ten aanzien van alle taken van de brandweer en GHOR op het terrein van pro-actie,
      preventie, preparatie, repressie en nazorg;

      c. het verbeteren van de kwaliteit van het personeel en het materieel.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.41
  - number: '3.42'
    text: |-
      1 De directie Politie staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a. het bevorderen van de eenheid van de Nederlandse politie door harmonisatie van inrichting, taken en uitvoering
      bij regionale korpsen en in dat licht een doelmatige en effectieve allocatie van middelen;

      b. het verhogen van het presterend vermogen van de politie, onder meer door het maken van afspraken met het
      ‘politieveld’ over prestatie en (kwaliteits)normen op het terrein van input en output en gewenste effecten van
      het veiligheidsbeleid.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.42
  - number: '3.43'
    text: |-
      1 Het bureau Landelijk Management Development Politie en Brandweer staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het samen met het politieveld en het brandweerveld vormgeven, ontwikkelen en uitvoeren van het landelijk
      management developmentbeleid voor de politie en brandweer en daarbij behorende instrumenten, in afstemming met het
      regionaal beleid;

      b. het realiseren van een landelijke infrastructuur van het management development voor de politie en brandweer;

      c. het zorgdragen voor de voorbereiding van en advisering over Kroonbenoemingen bij de politie;

      d. het adviseren over benoemingen in de strategische top van de brandweer.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.43
  - number: '3.44'
    text: |-
      1 Het bureau Korpsbeheer en relatiebeheer agentschappen staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het adviseren en ondersteunen van de Directeur-Generaal bij de uitvoering van diens taken als gemandateerd
      beheerder van het Korps landelijke politiediensten en als beheerder van het agentschap Landelijke Faciliteit
      Rampenbestrijding i.o. en de Onderzoeksraad voor Veiligheid;

      b. het faciliteren van het Korps landelijke politiediensten, het agentschap Landelijke Faciliteit Rampenbestrijding
      i.o. en de Onderzoeksraad voor Veiligheid in de relatie met de beheerder;

      c. het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het Korps landelijke politiediensten,
      het agentschap Landelijke Faciliteit Rampenbestrijding i.o. en de Onderzoeksraad voor Veiligheid;

      d. het faciliteren van het Korps landelijke politiediensten, het agentschap Landelijke Faciliteit Rampenbestrijding
      i.o. en de Onderzoeksraad voor Veiligheid in de relaties met het Ministerie.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.44
  - number: '3.45'
    text: |-
      1 Het agentschap Korps landelijke politiediensten staat onder leiding van een korpschef.

      2 Het agentschap is belast met de taken, bedoeld in [artikel 38 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
  - number: 3.45a
    text: |-
      1 De baten-lastendienst Landelijke Faciliteit Rampenbestrijding staat onder leiding van een directeur.

      2 De baten-lastendienst heeft de volgende taken:

      a. uitvoeren van opdrachten zoals verleend door de afdeling Kwaliteit Personeel en Materieel op het gebied
      van rampenbeheersing en brandweerzorg met betrekking tot benodigd materieel, telecommunicatie, geneeskundige
      hulpverlening, logistiek en met betrekking tot beleid betreffende het waarschuwen van bevolking;

      b. het verstrekken van extra materieel voor grootschalige brandbestrijding en technische hulpverlening aan de
      regionale brandweer;

      c. het verstrekken van extra materieel voor de geneeskundige hulpverlening bij ongevallen en rampen alsmede de
      bijzonder politiemiddelen voor de directie Politie.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.45a
  - number: '3.46'
    text: |-
      1 De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      3 De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:

      a. de directie Democratische Rechtsorde (DRO);

      b. de directie Staatsveiligheid (SV);

      c. de directie Beveiliging (BC);

      d. de directie Bijzondere Inlichtingenmiddelen (BI);

      e. de directie Bedrijfsvoering (BV);

      f. de directie Strategie en Juridische Zaken (SJZ);

      g. de directie Inlichtingen Buitenland (IB).


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: '3.47'
    text: |-
      1 De directie Democratische Rechtsorde staat onder leiding van een directeur.

      2 De directie heeft tot taak het verrichten van onderzoek naar personen en organisaties die een bedreiging kunnen
      vormen voor de democratische rechtsorde, de veiligheid van de Staat of andere gewichtige belangen van de Staat,
      aangaande:

      a. tegenkrachten bij integratie;

      b. terrorisme;

      c. politiek (gewelddadig) activisme.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.47
  - number: '3.48'
    text: |-
      1 De directie Staatsveiligheid staat onder leiding van een directeur.

      2 De directie heeft tot taak het verrichten van onderzoek naar personen en organisaties die een bedreiging kunnen
      vormen voor de democratische rechtsorde, de veiligheid van de Staat of andere gewichtige belangen van de Staat,
      aangaande:

      a. ongewenste bemoeienis van vreemde mogendheden;

      b. bedreiging internationale rechtsorde;

      c. integriteitaantastingen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.48
  - number: '3.49'
    text: |-
      1 De directie Beveiliging staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het bevorderen van de beveiliging van gegevens waarvan de geheimhouding door het belang van de Staat wordt
      geboden;

      b. het bevorderen van de beveiliging van onderdelen van overheid en bedrijfsleven die van vitaal belang zijn voor
      de instandhouding van het maatschappelijk leven;

      c. het bevorderen van de beveiliging van de aangewezen personen, objecten en diensten behorende tot het rijksdomein
      door het maken van dreigingsinschattingen en -meldingen en risicoanalyses;

      d. het verrichten van veiligheidsonderzoeken naar personen die vertrouwensfuncties vervullen of gaan vervullen bij
      overheid en bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.49
  - number: '3.50'
    text: |-
      1 De directie Bijzondere Inlichtingenmiddelen staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het toegankelijk maken en ontsluiten van open bronnen en open bronnen informatie;

      b. leveren van bijzondere operationele informatie en diensten;

      c. het verzorgen van de relaties met buitenlandse inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.50
  - number: '3.51'
    text: |-
      1 De directie Bedrijfsvoering staat onder leiding van een directeur.

      2 De directie heeft tot taak het ondersteunen van de organisatie op facilitair gebied, het geven van
      managementadvies en het leveren van centrale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.51
  - number: '3.52'
    text: |-
      1 De directie Strategie en Juridische Zaken staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ondersteunen van de dienstleiding en het managementteam van de Algemene Inlichtingen- en Veiligheidsdienst;

      b. het ontwikkelen en bewaken van de strategische koers, juridische en parlementaire aangelegenheden en de interne
      en externe communicatie.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.52
  - number: '3.53'
    text: |-
      1 De directie Inlichtingen Buitenland staat onder leiding van een directeur.

      2 De directie verricht de inlichtingentaak met betrekking tot het buitenland.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.53
  - number: '3.54'
    text: |-
      1 Het Bureau Algemene Bestuursdienst staat onder leiding van een Directeur-Generaal.

      2 Het bureau bestaat uit de volgende organisatieonderdelen:

      a. de eenheid Management Development (MD);

      b. de eenheid Innovatie, Ontwikkeling en Opleiding (IO&O);

      c. de eenheid Strategie, Informatiemanagement en Managementadvies (SIM).
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.54
  - number: '3.55'
    text: |-
      1 De eenheid Management Development staat onder leiding van een directeur.

      2 De eenheid heeft de volgende taken:

      a. het ontwikkelen, vormgeven en uitbouwen beleid en instrumentarium voor Concern Management Development in het
      algemeen en voor de ABD-schouw in het bijzonder;

      b. het vormgeven, ontwikkelen en ondersteunen van selectie voor ABD-vacatures;

      c. het voeren van regie ten aanzien van de uitvoering van concern Management Development beleid naar de onderdelen
      van de rijksoverheid;

      d. het vervullen van het werkgeverschap voor de Topmanagementgroep.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.55
  - number: '3.56'
    text: |-
      1 De eenheid Innovatie, Ontwikkeling en Opleiding staat onder leiding van een directeur.

      2 De eenheid heeft de volgende taken:

      a. het ontwikkelen, vormgeven en (doen) uitvoeren van primaire diensten met een bijzonder karakter;

      b. het realiseren van samenwerkingsverbanden tussen topmanagers van de rijksdienst;

      c. het geven van sturing aan de opbouw en het onderhoud van een internationaal management development netwerk;

      d. het vormgeven, ontwikkelen en uitvoeren van een managementpool;

      e. het zorgdragen voor de ontwikkeling, vormgeving en uitvoering van een loopbaanprogramma waaronder begrepen
      Intercollegiale consultatie en coaching;

      f. het ontwikkelen, vormgeven en uitvoeren van het kandidatenprogramma.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.56
  - number: '3.57'
    text: |-
      1 De eenheid Strategie, Informatiemanagement en Managementadvies staat onder leiding van een hoofd.

      2 De eenheid heeft de volgende taken:

      a. het adviseren over de strategische ontwikkeling van de Algemene Bestuursdienst en het management development
      beleid in het concern Rijk;

      b. het adviseren over ontwikkelingen met betrekking tot kennismanagement en in- en externe communicatie en
      informatievoorziening;

      c. het ondersteunen van de Directeur-Generaal bij de uitvoering van de beleids- en beheerstaken;

      d. het verzorgen van de secretariële ondersteuning van de Directeur-Generaal en de plaatsvervangend Directeur-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.57
  - number: '3.58'
    text: |-
      1 De eenheid ABD-Interim staat onder leiding van een directeur.

      2 De eenheid ABD-Interim heeft tot taak:

      a. het investeren in de verdere kwaliteitsontwikkeling van de rijksmanager.

      b. het behouden van kennis voor de rijksdienst door het verwerven en aanbieden van uitdagende interim posities.

      c. het bieden van een alternatief voor externe inhuur waardoor tevens kostenbesparing optreedt.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.58
  - number: '3.59'
    text: |-
      1 De Inspectie Openbare Orde en Veiligheid staat onder leiding van een hoofd.

      2 De inspectie heeft de taken, bedoeld in [artikel 53a van de Politiewet 1993][ref1] en
      [artikel 19 van de Brandweerwet 1985][ref2], en andere bij wet opgedragen taken.

      3 De inspectie bestaat uit de volgende onderdelen:

      a. de clusters Brandweerzorg, Rampenbestrijding, Politiezorg en Politieonderwijs;

      b. het stafbureau Inspectie Openbare Orde en Veiligheid (SIOOV).


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel19
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 53a
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '19'
  - number: '3.63'
    text: |-
      1 Het stafbureau Inspectie Openbare Orde en Veiligheid staat onder leiding van een hoofd.

      2 Het stafbureau heeft tot taak het ondersteunen van het hoofd van de inspectie en de onderdelen van de inspectie
      bij de uitvoering van de beleids- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.63
  - number: '4.1'
    text: |-
      Tot de taak van de Concernstaven, de Gemeenschappelijke Diensten de directoraten-generaal, de Algemene
      Inlichtingen- en Veiligheidsdienst en de Inspectie Openbare Orde en Veiligheid behoort voorts de uitvoering van
      andere taken dan hiervoor genoemd, in opdracht van een Minister of de secretaris-generaal, voor zover hogere wet-
      en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 De secretaris-generaal stelt met inachtneming van dit besluit de inrichting van de onder de plaatsvervangend
      secretaris-generaal, de directeuren-generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst en het
      hoofd van de Inspectie Openbare Orde en Veiligheid ressorterende dienstonderdelen voor zover nodig nader vast.

      2 De vaststelling, bedoeld in het eerste lid, geschiedt bij schriftelijk besluit op voordracht van de
      plaatsvervangend secretaris-generaal, de Directeur-Generaal, het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid, ieder voor zover het hem aangaat, na
      advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal, het hoofd van de
      Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid, ieder voor
      zover het hem aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur
      Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.3
  - number: '4.4'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties, in
      overeenstemming met de Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties, en geschiedt op voordracht
      van de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.4
  - number: '4.5'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 januari 2006
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.5
  - number: '4.6'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2006'
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Het [organisatiebesluit BZK 2003 van 1 september 2004][ref1] wordt ingetrokken.

      2 Na inwerkingtreding van het Organisatiebesluit BZK 2006 berust het
      [besluit Algemene Inlichtingen- en Veiligheidsdienst (Organisatiebesluit AIVD)][ref2] op [artikel 4.2][ref3] van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0017563
      [ref2]: https://wetten.overheid.nl/BWBR0013978
      [ref3]: https://wetten.overheid.nl/BWBR0020525#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel4.7
