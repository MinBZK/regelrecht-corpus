  - number: '3.2'
    text: |-
      1 De Staf staat beheersmatig onder leiding van de plaatsvervangend secretaris-generaal. Voor de inhoudelijke
      aansturing van de onderdelen van de Staf is het gestelde onder [artikel 3.1, lid 1, en lid 3 sub f][ref1] van
      toepassing.

      2 De Staf heeft tot taak het ondersteunen van de Algemene Leiding bij het aansturen en het coördineren van het
      Ministerie en het ontwikkelen en realiseren van een vraaggestuurde integrale en efficiënte bedrijfsvoering van
      het Ministerie.

      3 De Staf bestaat uit de volgende onderdelen:

      a. het Bureau Secretaris-Generaal (BSG);

      b. de directie Financieel-economische Zaken (FEZ);

      c. de Auditdienst (AD);

      d. de directie Constitutionele Zaken en Wetgeving (CZW);

      e. de projectdirectie Nieuwbouw Justitie & BZK (PNJB);

      f. het gemeenschappelijke secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen (SRob/Rfv);

      g. het secretariaat van de Kiesraad (SKR);

      h. het Bureau Gemeenschappelijke Diensten (BGD);

      i. het bureau Strategie, Innovatie en Accountmanagement (SIA);

      j. de directie Personeel en Organisatie (P&O);

      k. de directie Financiële Bedrijfsvoering (FB);

      l. de directie Informatie en Communicatie Technologie (ICT);

      m. de directie Communicatie en Informatie (C&I);

      n. de directie Facilitaire Zaken (FAZ).


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3.1
