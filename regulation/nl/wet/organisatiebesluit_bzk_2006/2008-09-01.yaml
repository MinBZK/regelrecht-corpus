  - number: '3.3'
    text: |-
      1 Het Bureau Secretaris-Generaal staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het beheers- en beleidsmatig ondersteunen en adviseren van de bewindspersonen, de secretaris-generaal en de
      plaatsvervangend secretaris-generaal;

      b. het voeren van het secretariaat van ministeriebrede overleggen;

      c. het coördineren van aangelegenheden met betrekking tot het parlement of de ministerraad;

      d. het ondersteunen van de secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      beveiliging van het Ministerie;

      e. het coördineren en bevorderen van strategische kennisontwikkeling;

      f. de vertegenwoordiging van het Ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie (PVEU);

      g. het coördineren van de internationale strategische adviesfunctie van BZK;

      h. het middels een projectenpool binnen BZK inzetten van hoog gekwalificeerde projectleiders met een gedegen kennis
      van de organisatie en haar beleidsterreinen.
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 De directie Financieel-economische Zaken staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het beoordelen en adviseren ten behoeve van besluitvorming over beleidsonderwerpen met financiële gevolgen,
      inclusief begrotingsuitvoering en -verantwoording;

      b. het beoordelen en adviseren ten behoeve van bedrijfsvoering;

      c. het verzorgen van het begrotingsproces, inclusief het adviseren tijdens het begrotingsproces over onder meer het
      vanuit concernbelang herschikken van middelen;

      d. het uitvoeren van doelmatigheidsonderzoek;

      e. het voeren van kasbeheer;

      f. het ontwerpen van kaderstelling inzake de uitvoering van Rijksbegrotingsvoorschriften.

      3 De directeur Financieel-economische Zaken is tevens Coördinerend Directeur Inkoop. Deze heeft de volgende taken:

      a. het ontwikkelen van en adviseren over het departementaal inkoopbeleid;

      b. het zorgdragen voor de coördinatie van het contractbeheer en de totstandkoming van een rechtmatig en doelmatig
      departementaal aanschaffingsbeleid, gericht op de verwerving van goederen en diensten, alsmede op het aanbesteden
      van werken;

      c. het zorgdragen voor de vastlegging van richtlijnen voor het contractbeheer en het inkoopproces in de
      administratieve organisatie van het ministerie en het toezien op de uitvoering van de vastgestelde procedures,
      waaronder de toepassing van de EG-richtlijnen voor leveringen, werken en diensten;

      d. het bevorderen van de aanwending en uitwisseling van beschikbare kennis en departementale inkoopgemachtigden
      en met de departementale vertegenwoordiger bij het Interdepartementaal Overlegorgaan Europese
      Aanbestedingsvoorschriften;

      e. het coördineren van de informatievoorziening aan de minister van Economische Zaken krachtens de
      [Raamwet EEG-voorschriften aanbestedingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005937
    url: https://wetten.overheid.nl/BWBR0020525/2008-09-01#Artikel3.4
    references:
      - id: ref1
