$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bescherming_staatsgeheimen
regulatory_layer: WET
publication_date: '1996-07-09'
valid_from: '2013-01-01'
bwb_id: BWBR0002074
url: https://wetten.overheid.nl/BWBR0002074/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nadere voorzieningen te treffen met betrekking tot de
    bescherming van gegevens, waarvan de geheimhouding door het belang van de staat wordt geboden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      Elke plaats in gebruik bij de staat of bij een staatsbedrijf kan ter bescherming van gegevens, waarvan de
      geheimhouding door het belang van de veiligheid van de staat wordt geboden, door Ons als verboden plaats worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelI
  - number: II.1
    text: |-
      Elke plaats, waar krachtens overeenkomst met de staat werkzaamheden worden verricht of goederen worden bewaard, die
      van belang zijn voor de veiligheid van de staat, kan ter bescherming van gegevens als bedoeld in [artikel I][ref1]
      voor het tijdvak, waarin de werkzaamheden worden verricht of de goederen worden bewaard, door Ons als verboden
      plaats worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002074#ArtikelI
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002074
        artikel: I
  - number: II.2
    text: |-
      Een aanwijzing als bedoeld in het voorgaande lid vindt buiten de in [artikel III, eerste lid][ref1], bedoelde
      buitengewone omstandigheden niet plaats, tenzij het voornemen daartoe vóór het tot stand komen van de overeenkomst
      van regeringswege aan de wederpartij is medegedeeld dan wel de wederpartij na het tot stand komen van de
      overeenkomst verklaart tegen zodanige aanwijzing geen bezwaar te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002074#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002074
        artikel: III
  - number: IIA
    text: |-
      Onder de veiligheid van de Staat wordt in de voorgaande artikelen mede verstaan de veiligheid van diens
      bondgenoten.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIIA
  - number: III.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kan, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, artikel III A in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
  - number: III.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII
  - number: III.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII
  - number: III.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII
  - number: III.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII
  - number: III.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII
  - number: III A
    text: |-
      Elk werk van openbaar verkeer en elk werk van openbaar nut kan ter bescherming van gegevens als bedoeld in
      [artikel I][ref1] bij koninklijk besluit of door bij algemene maatregel van bestuur aan te wijzen autoriteiten als
      verboden plaats worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002074#ArtikelI
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIII_A
    references:
      - id: ref1
        bwb_id: BWBR0002074
        artikel: I
  - number: IV
    text: |-
      Bij elk besluit, waarbij een plaats als verboden plaats wordt aangewezen, wordt tevens bepaald op welke wijze zal
      worden aangegeven, dat de plaats een verboden plaats is.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIV
  - number: V.1
    text: |-
      Hij die ingevolge enige wettelijke bepaling bevoegd is enige plaats tegen de wil van de rechthebbende te betreden,
      oefent deze bevoegdheid met betrekking tot een plaats, die ingevolge deze wet als verboden plaats is aangewezen,
      niet uit dan voorzover hij daartoe schriftelijk is gemachtigd door de advocaat-generaal bij het ressortsparket.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelV
  - number: V.2
    text: |-
      Het voorgaande lid is niet van toepassing op hem, die als officier van justitie, als rechter-commissaris of
      ingevolge de wet van 23 Mei 1899, *Staatsblad* n°. 128, bevoegd is enige plaats tegen de wil van de rechthebbende
      te betreden.
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelV
  - number: Va
    text: |-
      Deze wet is mede van toepassing op Bonaire, Sint Eustatius en Saba, met dien verstande dat de schriftelijke
      machtiging, bedoeld in [artikel V][ref1], wordt verleend door de procureur-generaal bij het Gemeenschappelijk Hof
      van Justitie van Aruba, Curaçao, Sint Maarten en Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0002074#ArtikelV
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelVa
    references:
      - id: ref1
        bwb_id: BWBR0002074
        artikel: V
  - number: IX
    text: Deze wet kan worden aangehaald als "Wet bescherming staatsgeheimen".
    url: https://wetten.overheid.nl/BWBR0002074/2013-01-01#ArtikelIX
