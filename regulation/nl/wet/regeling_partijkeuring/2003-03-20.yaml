---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_partijkeuring
regulatory_layer: WET
publication_date: '2005-12-29'
valid_from: '2003-03-20'
bwb_id: BWBR0005641
url: https://wetten.overheid.nl/BWBR0005641/2003-03-20
preamble:
  text: |-
    Gelet op artikel 3, tweede en derde lid, van richtlijn 90/677/EEG van de Raad van de Europese Gemeenschappen van
    13 december 1990 tot uitbreiding van de werkingssfeer van richtlijn 81/851/EEG betreffende onderlinge aanpassing
    van de wetgevingen der lidstaten inzake geneesmiddelen voor diergeneeskundig gebruik, en houdende aanvullende
    bepalingen voor immunologische geneesmiddelen voor diergeneeskundig gebruik, en houdende aanvullende bepalingen
    voor immunologische geneesmiddelen voor diergeneeskundig gebruik (PbEG L 373);

    Gelet op de artikelen 114 en 15 van de Diergeneesmiddelenwet (Stb. 1985, 410);

    Gehoord de Koninklijke Nederlandse Maatschappij voor Diergeneeskunde en de Vereniging van Fabrikanten en Importeurs
    van Diergeneesmiddelen in Nederland (Fidin);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

              wet:

                [Diergeneesmiddelenwet][ref1] (Stb. 1985, 410);



              partijprotocol:

                partijprotocol: document opgesteld door de bereider ter zake van een bepaalde partij
      van een diergeneesmiddel waarop het verloop en de technische en wetenschappelijke resultaten
      van de bij de registratie voorgeschreven controles zijn vermeld, of, indien het produkt is
      ingevoerd uit een land niet behorend tot een der lid-staten van de Europese Gemeenschap,
      het verloop en de technische en wetenschappelijke resultaten van de controles, bedoeld in
      [artikel 27, tweede lid, van het Eisen- en controlebesluit vergunningen diergeneesmiddelen 1993][ref2];



              partijvrijgifte-document:

                document opgesteld door de bereider ter zake van een bepaalde partij van een diergeneesmiddel waarop zijn
      vermeld de naam en het registratienummer van het middel, het nummer van de desbetreffende partij, de partijgrootte
      alsmede een verklaring van de voor controle verantwoordelijke persoon dat de partij aan de gestelde eisen aangaande
      produktie en controle voldoet;



              partijvrijgiftecertificaat:

                document afgegeven door het bureau op grond waarvan de desbetreffende partij in de handel mag worden
      gebracht;



              experimentele keuring:

                een zuiverheids- en onschadelijkheidstest met betrekking tot een bepaalde partij van een voor het eerst
      in de handel gebracht serum, entstof of biologisch diagnosticum;



              bureau:

                Bureau Registratie Diergeneesmiddelen, Postbus 289, 6700 AG Wageningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
      [ref2]: https://wetten.overheid.nl/BWBR0006290#Artikel27
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
      - id: ref2
        bwb_id: BWBR0006290
        artikel: '27'
  - number: '1.2'
    text: |-
      [Artikel 5][ref1] berust op [artikel 45 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005641#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel45
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005641
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '45'
  - number: '2.1'
    text: |-
      De aanvraag voor een keuring van een partij, als bedoeld in [artikel 15, eerste lid, van de wet][ref1] geschiedt
      door inzending bij het bureau van een volledig ingevuld formulier volgens het model dat als bijlage I bij deze
      regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel15
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '15'
  - number: '2.2'
    text: |-
      Binnen drie dagen na ontvangst van die aanvraag bevestigt het bureau schriftelijk die ontvangst onder vermelding
      van het nummer waaronder deze is ingeschreven en het voor de keuring verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel2
  - number: '3.1'
    text: |-
      Een overeenkomstig [artikel 2][ref1] ingediende aanvraag wordt slechts in behandeling genomen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005641#Artikel2
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005641
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: |-
      het in het derde lid, aanhef en onderdeel a, genoemde bedrag op de in het derde lid voorgeschreven wijze is voldaan
      in het geval de partijkeuring tevens een experimentele keuring betreft, tenzij door het bureau is medegedeeld dat
      een experimentele keuring niet noodzakelijk wordt geacht, danwel het een serum, entstof of biologisch diagnosticum
      betreft dat in een andere lid-staat van de Europese Unie of in een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte (Trb. 1992, 132), niet zijnde IJsland is bereid en de betrokken partij
      in dat geval vergezeld gaat van een verklaring van de ter zake de keuring van sera, entstoffen of biologische
      diagnostica in die lidstaat verantwoordelijke instantie, welke verklaring inhoudt dat die partij aldaar een
      dergelijke keuring heeft ondergaan en is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.1.b
    text: |-
      het in het derde lid, aanhef en onderdeel b, genoemde bedrag op de in het derde lid voorgeschreven wijze is
      voldaan, in het geval dat geen experimentele keuring noodzakelijk is of indien ten aanzien van het betrokken
      diergeneesmiddel reeds eerder een zodanige keuring heeft plaats gehad, waarbij goedkeuring plaatsvond, danwel
      indien een verklaring wordt overgelegd als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.1.c
    text: de aanvraag vergezeld gaat van het partijprotocol en het partijvrij gifte-document;
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.1.d
    text: het partijkeuringsprotocol is gedagtekend en ondertekend door de persoon die verantwoordelijk is voor de controle;
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.1.e
    text: 'de aanvrager schriftelijk verklaart dat van de ter keuring aangeboden partij:'
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.1.e.1
    text: |-
      een voor die partij representatief monster bewaard wordt van een zodanige grootte, dat daarop een controle op de
      conformiteit als bedoeld in [artikel 16 van de wet][ref1] kan worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel16
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '16'
  - number: 3.1.e.2
    text: het betrokken monster gedurende de houdbaarheidstermijn bewaard zal worden, en
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.1.e.3
    text: |-
      zo de partij uit verschillende voor de gebruiker bestemde typen recipiënten bestaat, het onder 1 bedoelde monster
      in elk geval een recipiënt van elk type omvat.
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: '3.2'
    text: |-
      De aanvrager dient het in het eerste lid, onderdeel e, bedoelde monster binnen vijf dagen op het eerste
      verzoek van het bureau beschikbaar te stellen aan het Centraal Diergeneeskundig Instituut, Afdeling Controle en
      Standaardisatie. Edelhertweg 15, 8219 PA Lelystad, vergezeld van een volledig ingevuld aanbiedingsformulier als
      bedoeld in bijlage II van deze regeling.
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: '3.3'
    text: |-
      De bedragen, bedoeld in het eerste lid, onderdeel 1 danwel onderdeel b, welke dienen te worden voldaan op
      postrekeningnummer 10.41.759 ten name van het bureau, onder vermelding van ‘Aanvraag voor een partijkeuring’ en van
      de naam waaronder het diergeneesmiddel is geregistreerd en het daarbij behorende batchnummer, zijn:
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.3.a
    text: |-
      een bedrag van: € 4.084,02 voor sera en entstoffen voor pluimvee; € 4.764,69 voor sera en entstoffen voor schaap of
      geit; € 5.445,36 voor sera en entstoffen voor varken, hond of kat; € 9.075,60 voor sera en entstoffen voor rund of
      paard; € 1.588,23 voor sera en entstoffen voor overige dieren; € 1.588,23 voor alle biologische diagnostica.
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: 3.3.b
    text: 'een bedrag van: € 90,76'
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel3
  - number: '4.1'
    text: |-
      De uitslag van de partijkeuring worden aanvrager uiterlijk binnen 60 dagen, nadat aan alle in [artikel 3][ref1]
      gestelde eisen is voldaan, medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005641#Artikel3
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005641
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: Bij de goedkeuring wordt een partijvrijgifte-certificaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel4
  - number: '5.1'
    text: |-
      Vrijstelling wordt verleend van het verbod, gesteld in [artikel 14, eerste lid, van de wet][ref1] met uitzondering
      van het verbod op het afleveren, voorhanden hebben, in voorraad hebben en toepassen van geregistreerde sera,
      entstoffen of biologische diagnostica die niet afkomstig zijn van een goedgekeurde partij.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel14
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '14'
  - number: '7.1'
    text: Deze regeling treedt in werking met ingang van 1 oktober 1992.
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel7
  - number: '7.2'
    text: 'Deze regeling kan worden aangehaald als: Regeling partijkeuring.'
    url: https://wetten.overheid.nl/BWBR0005641/2003-03-20#Artikel7
