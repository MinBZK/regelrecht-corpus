  - number: '20'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Wet van 10 juli 2013 tot wijziging van de Wet vervoer
      gevaarlijke stoffen en enige andere wetten in verband met de totstandkoming van een basisnet ([Wet basisnet][ref1])
      (Stb. 2013, 307), het Besluit van 3 september 2013 tot wijziging van het Besluit vervoer gevaarlijke stoffen in
      verband met de wijziging van de routeringsystematiek in de Wet vervoer gevaarlijke stoffen (Stb. 2013, 340) en het
      [Besluit externe veiligheid transportroutes][ref2] in werking treden.


