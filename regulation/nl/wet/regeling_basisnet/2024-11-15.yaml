        artikel: '2'
  - number: 6.1.d
    text: de kaart “Fairway” uit de Elektronische vaarwegkaarten; of
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel6
  - number: 6.1.e
    text: de kaart “Shoreline construction” uit de Elektronische vaarwegkaarten.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel6
  - number: '6.2'
    text: 'In afwijking van het eerste lid zijn de referentiepunten gelegen op:'
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel6
  - number: 6.2.a
    text: de Westerschelde met haar mondingen op de begrenzingen van de vaargeulen; en
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel6
  - number: 6.2.a
    text: |-
      de geometrische begrenzing van een vrijwaringsgebied van een rijksvaarweg, bedoeld in
      [artikel 2.12 van de Omgevingsregeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel6
