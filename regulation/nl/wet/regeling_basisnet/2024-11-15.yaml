  - number: 6.1.c
    text: |-
      de geometrische begrenzing van een oppervlaktewaterlichaam in beheer bij het Rijk, bedoeld in
      [artikel 2.2, derde lid, van de Omgevingsregeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel6
    references:
      - id: ref1
