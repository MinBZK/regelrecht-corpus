        paragraaf: '3'
  - number: '12.2'
    text: |-
      Indien de gegevens, bedoeld in [artikel 10, eerste tot en met derde lid][ref1], de prognose, bedoeld in
      [artikel 11, tweede en derde lid][ref2], of de analyse, bedoeld in het eerste lid, onvoldoende inzicht bieden
      om tijdig een overschrijding of dreigende overschrijding van een risicoplafond te signaleren, wordt het risico
      berekend door de minister.


