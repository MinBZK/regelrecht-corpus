        artikel: '2'
  - number: '6.1'
    text: |-
      Op een binnenwater als bedoeld in [artikel 2, eerste lid][ref1], wordt het referentiepunt bepaald vanuit de
      begrenzing van de vaarweg of oever zoals aangegeven in de hierna genoemde bronnen. Daarbij wordt de volgende
      voorkeursvolgorde gehanteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel2
