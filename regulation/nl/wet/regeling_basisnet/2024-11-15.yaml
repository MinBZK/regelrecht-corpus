        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035000
        artikel: '6'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid is vanaf de dag van vaststelling van een projectbesluit of een omgevingsplan,
      de dag waarop een instructieregel als bedoeld in [artikel 2.22][ref1] of [2.24 van de Omgevingswet][ref2] wordt
      gesteld, de dag van verlening van een omgevingsvergunning voor een omgevingsplanactiviteit of de dag waarop
      een instructie als bedoeld in [artikel 2.33][ref3] of [2.34 van de Omgevingswet][ref4] wordt gegeven inhoudende
      de wijziging van een weg, hoofdspoorweg of binnenwater, de ligging van de weg, van de hoofdspoorweg of van
      het binnenwater zoals weergegeven in dat besluit, voor de ligging van de referentiepunten bepalend, totdat de
      feitelijke situatie overeenstemt met dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel5
