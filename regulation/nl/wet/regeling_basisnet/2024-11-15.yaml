        artikel: '10'
        paragraaf: '3'
  - number: '11.3'
    text: |-
      De beheerder, bedoeld in [artikel 10, derde lid][ref1], voegt bij de rapportage elke tien jaar een prognose van de
      ontwikkeling van de omvang en de stromen van het vervoer van gevaarlijke stoffen over de binnenwateren van de tien
      jaar volgend op het jaar waarop de rapportage betrekking heeft. De eerste prognose wordt bij de rapportage over
      2015 gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel10
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel11
