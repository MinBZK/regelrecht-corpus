        bwb_id: BWBR0035000
      - id: ref4
        bwb_id: BWBR0007606
        artikel: '13'
  - number: '2.2'
    text: |-
      Wegen als bedoeld in het eerste lid zijn onderverdeeld in wegvakken waarvan het begin en einde van het wegvak wordt
      aangeduid door benoeming van een knooppunt of van een aansluiting. Voor zover het begin of einde van een wegvak
      wordt aangeduid door een knooppunt, begint of eindigt het betreffende wegvak op het geografische midden van het
      knooppunt. Voor zover het begin of einde van een wegvak wordt aangeduid door benoeming van een aansluiting, begint
      of eindigt het betreffende wegvak op het geografische midden van de kruising van de doorgaande rijbaan met de weg
      waar de afslag op uit komt.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel2
  - number: '2.3'
    text: Hoofdspoorwegen als bedoeld in het eerste lid zijn onderverdeeld in baanvakken.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel2
  - number: '2.4'
    text: |-
      Binnenwateren als bedoeld in het eerste lid zijn onderverdeeld in vaarwegen. In open verbinding met deze vaarwegen
      staande havens en zijwateren die niet voor doorgaand vervoer worden gebruikt, vormen geen onderdeel van deze
      vaarwegen.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel2
  - number: '3.1'
    text: |-
      Op een weg als bedoeld in [artikel 2, eerste lid][ref1], is het referentiepunt gelegen in het midden van de
      middenberm.


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035000
        artikel: '2'
        paragraaf: '1'
  - number: '3.2'
    text: 'In afwijking van het eerste lid is het referentiepunt gelegen op:'
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: 3.2.a
    text: 'het midden tussen de buitenste kantstrepen van een doorgaande rijbaan indien:'
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: 3.2.a.1°
    text: de betrokken weg bestemd is voor éénrichtingsverkeer, of
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: 3.2.a.2°
    text: de middenberm breder is dan 25 meter,
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: 3.2.b
    text: de scheiding van de rijrichtingen, indien het een weg zonder middenberm met twee rijrichtingen betreft;
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: 3.2.c
    text: het midden tussen de buitenste randen van het asfalt, indien de doorgaande rijbaan geen buitenste kantstreep heeft.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: '3.3'
    text: |-
      Een verbindingsboog wordt voor het bepalen van de ligging van het referentiepunt aangemerkt als een weg bestemd
      voor éénrichtingsverkeer.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel3
  - number: '4'
    text: |-
      Op een hoofdspoorweg als bedoeld in [artikel 2, eerste lid][ref1], is het referentiepunt gelegen in het midden
      tussen de buitenste spoorstaven van de buitenste sporen waar kan worden vervoerd met gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035000
        artikel: '2'
        paragraaf: '1'
  - number: '5.1'
    text: |-
      Voor de ligging van de referentiepunten, bedoeld in de [artikelen 3][ref1], [4][ref2] en [6][ref3], is de
      feitelijke situatie bepalend.


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035000#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035000#Artikel6
