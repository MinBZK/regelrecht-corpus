  text: |-
    Gelet op de artikelen 13, eerste lid, 14, eerste tot en met vierde lid, en 16, eerste lid, van de Wet vervoer
    gevaarlijke stoffen, en de artikelen 3, vijfde lid, 4, tweede lid, 8, vierde lid, 10, eerste lid, onderdeel a, en
    11, eerste en tweede lid, van het Besluit externe veiligheid transportroutes;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *baanvak:* gedeelte van de hoofdspoorweg waarvan het begin
      en einde wordt aangeduid met coördinaten uit het stelsel van de Rijksdriehoeksmeting, bedoeld in
      [artikel 52 van de Kadasterwet][ref1];
        - *binnenste kantstreep:* markering van de begrenzing van de binnenzijde van de binnenste rijstrook;
        - *buitenste kantstreep:* markering van de begrenzing van de buitenzijde van de buitenste rijstrook;
        - *doorgaande rijbaan:* elk voor in één rijrichting rijdende voertuigen bestemd weggedeelte, zonder de invoeg-
      en uitvoegstroken;
        - *GR-plafond:* plaats als bedoeld in [artikel 14, tweede lid, van de wet][ref2] waar het plaatsgebonden risico
      maximaal 10-7 of 10-8 per jaar is;
        - *HART:* de Handleiding risicoanalyse transport, versie 1;
        - *middenberm:* gebied gelegen tussen de binnenste kantstrepen van de twee doorgaande rijbanen die deel uitmaken
      van de weg;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *PR-plafond:* plaats als bedoeld in [artikel 14, eerste lid, van de wet][ref3] waar het plaatsgebonden risico
      maximaal 10-6 per jaar is;
        - *RBM II:* softwareprogramma voor de berekening van vervoersrisico’s, getiteld RBM II, versie 2;
        - *referentiepunt:* referentiepunt als bedoeld in [artikel 14, vierde lid, van de wet][ref4];
        - *rekenmethodiek transportrisico’s:* rekenmethodiek voor de vaststelling van risico’s vanwege het vervoer van
      gevaarlijke stoffen, bestaande uit RBM II en HART;
        - *spoorbundel:*geheel van alle naast elkaar liggende sporen waarover gevaarlijke stoffen kunnen worden vervoerd;
        - *verbindingsboog:* rijbaan die bij knooppunten doorgaande rijbanen met elkaar verbindt;
        - *wegvak:* gedeelte van een weg als bedoeld in [artikel 2, tweede lid][ref5];
        - *wet:* [Wet vervoer gevaarlijke stoffen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel14
