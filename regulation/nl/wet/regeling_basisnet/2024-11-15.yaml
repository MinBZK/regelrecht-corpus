  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 2.24, tweede lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel1a
