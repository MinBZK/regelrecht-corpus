        artikel: '2'
  - number: '7.1'
    text: |-
      De ligging van het PR-plafond wordt bepaald door de afstand met betrekking tot het plaatsgebonden risico 10-
      6 opgenomen in [bijlage I, kolom 3][ref1] voor wegvakken, onderscheidenlijk in [bijlage II, kolom 4][ref2], voor
      baanvakken, vanaf het betrokken referentiepunt naar weerszijden te meten.


      [ref1]: https://wetten.overheid.nl/BWBR0035000
      [ref2]: https://wetten.overheid.nl/BWBR0035000
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035000
      - id: ref2
        bwb_id: BWBR0035000
  - number: '7.2'
    text: |-
      Het PR-plafond voor een wegvak en een baanvak is gelegen op het referentiepunt indien de te meten afstand nul meter
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel7
  - number: '7.3'
    text: Het PR-plafond voor een binnenwater is gelegen op het referentiepunt.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel7
  - number: '7.4'
    text: |-
      De ligging van het PR-plafond bij een verbindingsboog wordt bepaald door de helft van de afstand die geldt voor het
      wegvak waarvan de verbindingsboog aftakt, naar weerszijden te meten.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel7
  - number: '8'
    text: |-
      Indien uit [bijlage I][ref1], onderscheidenlijk [bijlage II][ref2], blijkt dat er een GR-plafond is, wordt de
      ligging van dat GR-plafond bepaald overeenkomstig [artikel 7][ref3], met dien verstande dat gebruik wordt gemaakt
      van de afstanden opgenomen in bijlage I, kolom 4, voor wegvakken, onderscheidenlijk in bijlage II, kolommen 5 en 6,
      voor baanvakken, met betrekking tot het plaatsgebonden risico 10-7 of 10-8.


      [ref1]: https://wetten.overheid.nl/BWBR0035000
      [ref2]: https://wetten.overheid.nl/BWBR0035000
      [ref3]: https://wetten.overheid.nl/BWBR0035000#Artikel7
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035000
      - id: ref2
        bwb_id: BWBR0035000
      - id: ref3
        bwb_id: BWBR0035000
        artikel: '7'
        paragraaf: '2'
  - number: '9'
    text: |-
      Deze paragraaf is van toepassing op het onderzoek naar een overschrijding of dreigende overschrijding van een
      risicoplafond, bedoeld in [artikel 15, eerste of tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '15'
  - number: '10.1'
    text: |-
      De beheerder van de hoofdwegen, bedoeld in
      [artikel 2.19, derde lid, aanhef en onder a, onder 3°, van de Omgevingswet][ref1], maakt door middel van tellingen
      elk jaar de omvang van het vervoer van gevaarlijke stoffen over ten minste één vijfde deel van de wegen, bedoeld
      in [artikel 2, eerste lid][ref2], per stofcategorie inzichtelijk op zodanige wijze dat elke vijf jaar tellingen op
      alle wegen, bedoeld in artikel 2, eerste lid, hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035000#Artikel2
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035000
        artikel: '2'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      De beheerder van de hoofdspoorweginfrastructuur, bedoeld in [artikel 1 van de Spoorwegwet][ref1], maakt elk jaar de
      omvang van het vervoer van gevaarlijke stoffen over de hoofdspoorwegen, bedoeld in [artikel 2, eerste lid][ref2],
      per stofcategorie, alsmede de samenstelling van de treinen waarin deze stoffen worden vervoerd, inzichtelijk.
      Daarbij maakt de beheerder gebruik van de krachtens [artikel 15, vierde lid, van de wet][ref3] te verstrekken
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035000#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035000
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007606
        artikel: '15'
  - number: '10.3'
    text: |-
      De beheerder van de hoofdvaarwegen, bedoeld in [artikel 2.19, tweede lid, onder a, van de Omgevingswet][ref1],
      maakt elk jaar de omvang van het vervoer van gevaarlijke stoffen over de binnenwateren, bedoeld in
      [artikel 2, eerste lid][ref2], per stofcategorie inzichtelijk. Daarbij maakt de beheerder gebruik van de
      ladinggegevens, geregistreerd in het Informatie- en Volgsysteem voor de Scheepvaart, alsmede van de door de
      Havenbedrijven van Rotterdam en Amsterdam en het Gemeenschappelijk Nautisch Beheer Scheldegebied krachtens
      [artikel 15, vierde lid, van de wet][ref3] te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035000#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035000
        artikel: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007606
        artikel: '15'
  - number: '10.4'
    text: |-
      Op verzoek van de minister verhoogt de beheerder de frequentie van het inzichtelijk maken van de omvang van
      het vervoer van gevaarlijke stoffen over een gedeelte van een weg, hoofdspoorweg of binnenwater en, indien van
      toepassing, de samenstelling van de treinen, tot hoogstens vier keer per jaar indien dit naar het oordeel van
      de minister noodzakelijk is ten behoeve van het verkrijgen van tijdig inzicht in een overschrijding of dreigende
      overschrijding van een risicoplafond.
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel10
  - number: '11.1'
    text: |-
      De beheerders, bedoeld in [artikel 10, eerste tot en met derde lid][ref1], sturen jaarlijks of, in geval toepassing
      wordt gegeven aan artikel 10, vierde lid, overeenkomstig de desbetreffende frequentie, een rapportage aan de
      minister, die de gegevens, bedoeld in artikel 10, bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel10
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035000
        artikel: '10'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      De beheerders, bedoeld in [artikel 10, eerste en tweede lid][ref1], voegen bij de rapportage elke vijf jaar een
      prognose van de ontwikkeling van de omvang en de stromen van het vervoer van gevaarlijke stoffen over de wegen,
      onderscheidenlijk de hoofdspoorwegen, van de tien jaar volgend op het jaar waarop de rapportage betrekking heeft.
      De eerste prognose wordt bij de rapportage over 2015 gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035000#Artikel10
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel11
