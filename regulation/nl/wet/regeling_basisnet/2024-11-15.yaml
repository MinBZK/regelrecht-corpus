        bwb_id: BWBR0037885
        artikel: '2'
  - number: '2.1'
    text: |-
      De wegen, hoofdspoorwegen en binnenwateren, opgenomen in onderscheidenlijk [bijlage I][ref1],
      [bijlage II][ref2] en [bijlage III][ref3], zijn de wegen, hoofdspoorwegen en binnenwateren, bedoeld in
      [artikel 13, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0035000
      [ref2]: https://wetten.overheid.nl/BWBR0035000
      [ref3]: https://wetten.overheid.nl/BWBR0035000
      [ref4]: https://wetten.overheid.nl/BWBR0007606#Artikel13
    url: https://wetten.overheid.nl/BWBR0035000/2024-11-15#Artikel2
