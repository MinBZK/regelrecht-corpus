  - number: '12.1'
    text: |-
      Op basis van de gegevens, bedoeld in [artikel 10, eerste tot en met derde lid][ref1], maakt de minister een analyse
      van de te verwachten ontwikkeling van de omvang en de stromen van het vervoer van gevaarlijke stoffen in de drie
      jaar volgend op het jaar waarop de rapportage, bedoeld in [artikel 11, eerste lid][ref2], betrekking heeft.


