        bwb_id: BWBR0011685
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0011685
        artikel: '7'
  - number: '4'
    text: |-
      1 Criminele inlichtingen eenheden verrichten in ieder geval de volgende werkzaamheden:

      a. het verzamelen en verifiëren van criminele inlichtingen;

      b. het registreren van gegevens in een register zware criminaliteit en in een voorlopig register overeenkomstig de
      daartoe vastgestelde modelreglementen;

      c. het bevorderen van het gericht inwinnen en aanvullen van criminele inlichtingen en andere gegevens die in het
      kader van de strafrechtelijke handhaving van de rechtsorde in aanmerking komen voor registratie op grond van de
      [Wet politieregisters][ref1];

      d. het analyseren van criminele inlichtingen en het aan de hand daarvan:

      1°. signaleren van criminaliteitsontwikkelingen, voorzover het betreft misdrijven als bedoeld in
      [artikel 1, eerste lid, onder k, van de Wet politieregisters][ref2];

      2° periodiek verslag doen ten behoeve van criminaliteitsbeelden;

      e. het verstrekken van criminele inlichtingen overeenkomstig de daartoe vastgestelde modelreglementen.

      2 Ten behoeve van de werkzaamheden, bedoeld in het eerste lid, maken criminele inlichtingen eenheden gebruik van de
      door de Ministers aangewezen geautomatiseerde verwijzingsindex.

      3 De uitvoering van de werkzaamheden, bedoeld in het eerste lid, onder c, met medewerking van personen als
      omschreven in [artikel 1, onder d][ref3], wordt uitsluitend verricht door de criminele inlichtingen eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011685#Artikel1
