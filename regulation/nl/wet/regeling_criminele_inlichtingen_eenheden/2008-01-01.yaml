  - number: '2'
    text: |-
      Criminele inlichtingen eenheden zijn belast met de informatievoorziening in het kader
      van de uitvoering van de politietaak, voorzover het betreft misdrijven als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet politieregisters][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
  - number: '3'
    text: |-
      1 Criminele inlichtingen eenheden werken overeenkomstig deze regeling met elkaar samen.

      2 De samenwerking tussen de criminele inlichtingen eenheden strekt tot een zo doelmatig en doeltreffend mogelijke
      taakvervulling en bestaat in ieder geval uit:

      a. een uniforme gegevensverwerking als bedoeld in de [artikelen 4][ref1] en [5][ref2];

      b. onderlinge gegevensuitwisseling als bedoeld in [artikel 6][ref3];

      c. structurele gegevensverstrekking aan de nationale criminele inlichtingen eenheid als bedoeld in
      [artikel 7][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011685#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011685#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011685#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011685#Artikel7
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011685
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011685
        artikel: '5'
