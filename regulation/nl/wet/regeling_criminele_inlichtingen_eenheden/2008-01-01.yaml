  - number: '5'
    text: |-
      Criminele inlichtingen eenheden registreren informantgegevens overeenkomstig het daartoe vastgestelde
      modelreglement, onder gelijktijdige codetoekenning. Informantgegevens kunnen slechts worden verstrekt, voorzover
      dit noodzakelijk is voor de verantwoording van de verrichtingen naar aanleiding van de opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel5
  - number: '6'
    text: |-
      1 Criminele inlichtingen eenheden wisselen onderling, gevraagd en ongevraagd, criminele inlichtingen uit indien dit
      van belang kan zijn voor de uitvoering van de politietaak. Daartoe wordt gebruikgemaakt van het modelformulier dat
      is opgenomen in bijlage I bij deze regeling.

      2 Twee ambtenaren van de criminele inlichtingen eenheid worden aangewezen met het oog op de autorisatie als bedoeld
      in [artikel 17 van het Besluit politieregisters][ref1] ten aanzien van de registers zware criminaliteit bij de
      overige criminele inlichtingen eenheden.

      3 De korpsbeheerder draagt ervoor zorg voor dat aan de ingevolge het tweede lid aangewezen en hem bekendgemaakte
      ambtenaren van andere criminele inlichtingen eenheden autorisatie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel17
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004996
        artikel: '17'
  - number: '7'
    text: |-
      1 Criminele inlichtingen eenheden stellen de nationale criminele inlichtingen eenheid in kennis van:

      a. gegevens uit het register zware criminaliteit en uit het voorlopig register die van nationale of internationale
      betekenis zijn;

      b. personalia of bedrijfsgegevens van de overeenkomstig
      [artikel 13a, eerste lid, onder a en b, van de Wet politieregisters][ref1] geregistreerde personen;

      c. codes als bedoeld in [artikel 5][ref2];

      d. overige informatie die van belang kan zijn voor de landelijke en internationale coördinatie en ondersteuning
      door de nationale criminele inlichtingen eenheid.

      2 Ter uitvoering van het eerste lid, onder b, en met het oog op de verstrekking van de gegevens als opgenomen in
      bijlage II van deze regeling maken de criminele inlichtingen eenheden gebruik van de door de Ministers aangewezen
      geautomatiseerde verwijzingsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0011685#Artikel5
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0011685
        artikel: '5'
  - number: '8'
    text: |-
      1 De nationale criminele inlichtingen eenheid registreert:

      a. gegevens in het nationale register zware criminaliteit en het nationale voorlopig register voorzover deze
      gegevens van nationale of internationale betekenis zijn;

      b. personalia of bedrijfsgegevens van overeenkomstig
      [artikel 13a, eerste lid, onder a en b, van de Wet politieregisters][ref1] geregistreerde personen in de door de
      Ministers aangewezen geautomatiseerde verwijzingsindex;

      c. codes die zijn toegewezen in het kader van de registratie als bedoeld in [artikel 5][ref2].

      2 De nationale criminele inlichtingen eenheid analyseert de gegevens, bedoeld in het eerste lid, onder a, en
      verstrekt mede aan de hand daarvan de gegevens, bedoeld in het eerste lid, onder a en b, aan hen die daarop bij of
      krachtens de [Wet politieregisters][ref3] aanspraak kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0011685#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0011685
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004798
  - number: '9'
    text: |-
      1 De ambtenaar die deel uit maakt van een criminele inlichtingen eenheid voldoet aan de eindtermen van de door de
      Ministers aan te wijzen vervolgopleiding.

      2 De beheerder draagt ervoor zorg dat de kennis en vaardigheden van de ambtenaren, bedoeld in het eerste lid,
      worden onderhouden op minimaal het niveau van de aan de in het eerste lid bedoelde eindtermen.
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel9
  - number: '10'
    text: |-
      1 De beheerder bepaalt de termijn gedurende welke de ambtenaar die belast is met de werkzaamheden, bedoeld in
      [artikel 4, eerste lid, onder c][ref1], ononderbroken deel uitmaakt van een criminele inlichtingen eenheid.

      2 De termijn, bedoeld in het eerste lid, is ten hoogste vier jaar en kan tweemaal met twee jaar worden verlengd.

      3 Voor de ambtenaar die voor de inwerkingtreding van deze regeling is aangesteld, gaat de termijn, bedoeld in het
      eerste lid, in op het tijdstip, bedoeld in het [artikel 13, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011685#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011685#Artikel13
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011685
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011685
        artikel: '13'
  - number: '11'
    text: |-
      1 De bij de criminele inlichtingen eenheid in gebruik zijnde vertrekken zijn afsluitbaar en beveiligd. Tot deze
      vertrekken hebben slechts toegang ambtenaren die deel uitmaken van de criminele inlichtingen eenheid, personen die
      door deze ambtenaren worden begeleid en de CIE-officier van justitie.

      2 In afwijking van het eerste lid, tweede volzin, kan de korpsbeheerder aan anderen toegang zonder begeleiding
      toestaan, indien het betreden van de vertrekken alleen kan plaatsvinden nadat identiteitsgegevens elektronisch
      zijn vastgelegd en de toegang noodzakelijk is vanuit de verantwoordelijkheid voor de ambtenaren van de criminele
      inlichtingen eenheid.

      3 Bij afwezigheid van ambtenaren van de criminele inlichtingen eenheid zijn de vertrekken deugdelijk afgesloten.
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel11
  - number: '12'
    text: |-
      De beheerder draagt ervoor zorg dat onbevoegde kennisneming van criminele inlichtingen en informantgegevens niet
      kan plaatsvinden. In dat kader ziet de beheerder erop toe dat:

      a. deze informatie niet door onbevoegden waarneembaar is;

      b. deze informatie niet zonder toestemming wordt vermenigvuldigd of vernietigd dan wel uit de vertrekken, bedoeld
      in [artikel 11][ref1], wordt meegenomen;

      c. informatiedragers op afdoende wijze vernietigd kunnen worden;

      d. toegang tot geautomatiseerde registers wordt beveiligd met een gebruikersnaam en periodiek wisselende
      wachtwoorden;

      e. bij geautomatiseerd transport van criminele inlichtingen voldoende beveiligingsmaatregelen worden getroffen;

      f. bij gebruik van een netwerksysteem voldoende beveiligingsmaatregelen zijn getroffen tegen het verloren gaan van
      de informatie en ter voorkoming van onbevoegde bevraging.


      [ref1]: https://wetten.overheid.nl/BWBR0011685#Artikel11
    url: https://wetten.overheid.nl/BWBR0011685/2008-01-01#Artikel12
