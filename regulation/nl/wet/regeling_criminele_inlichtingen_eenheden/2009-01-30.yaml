preamble:
  text: |-
    Gezien het advies van de Registratiekamer;

    Gelet op de artikelen 38b, 46 en 48 van de Politiewet 1993 en de artikelen 2, 4, 5, 5a en 5b van het Besluit beheer
    regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0011685/2009-01-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *criminele inlichtingeneenheid:*


              de eenheid bij de regionale politiekorpsen, bedoeld in
      [artikel 5, eerste lid, van het Besluit beheer regionale politiekorpsen][ref1] alsmede de eenheid bij het Korps
      landelijke politiediensten, bij de bijzondere ambtenaren van politie (rijksrecherche) en bij de Koninklijke
      marechaussee, belast met de taak, bedoeld in [artikel 2][ref2];



            b

              *nationale criminele inlichtingen eenheid:*


              de eenheid bij de divisie Centrale Recherche Informatie van het Korps landelijke diensten als bedoeld in
      [artikel 8][ref3];



            c

              *Ministers:*


              de Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties gezamenlijk;



            d
            informantgegevens:

              gegevens omtrent een persoon, bedoeld in [artikel 12, zevende lid, van de Wet politiegegevens][ref4];



            e
            criminele inlichtingen:

              gegevens, die in aanmerking komen voor verwerking op grond van
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref5];



            f
            verantwoordelijke:

              de verantwoordelijke, bedoeld in [artikel 1, onderdeel f, van de Wet politiegegevens][ref6];



            g

              *CIE-officier van justitie:*


              de als zodanig aangewezen officier van justitie, verantwoordelijk voor de taakuitoefening van de CIE.


