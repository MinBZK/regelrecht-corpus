  - number: 24f
    text: |-
      De gemeenteraad stelt bij verordening regels over de informatieverstrekking door de gemeente aan vrijwillige
      inburgeraars ter zake van hun rechten en plichten uit hoofde van deze wet, de eventuele inning van de eigen
      bijdrage door het college en de mogelijkheid van betaling in termijnen, de niet-nakoming van de overeenkomst,
      bedoeld in [artikel 24d, tweede lid][ref1], alsmede het vaststellen van de identiteit van de vrijwillige
      inburgeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel24d
