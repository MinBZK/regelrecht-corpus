        artikel: '16'
  - number: '51'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het verstrekken van beleidsinformatie
      door de gemeenten, de cursusinstellingen en de exameninstellingen over uitvoering van de in de
      [hoofdstukken 4][ref1],[ 5, paragraaf 2][ref2], en [6][ref3] bedoelde taken, die niet reeds op grond van
      [artikel 47][ref4] of op grond van [artikel 5 van de Wet participatiebudget][ref5] is verstrekt.


