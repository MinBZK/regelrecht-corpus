  - number: '32'
    text: |-
      Het college stelt in de boetebeschikking, bedoeld in [artikel 31, eerste lid][ref1], een nieuwe termijn van ten
      hoogste twee jaren waarbinnen de inburgeringsplichtige na het bekendmaken van de boetebeschikking alsnog het
      inburgeringsexamen moet behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel31
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel32
