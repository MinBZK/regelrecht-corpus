  - number: '44'
    text: |-
      1 Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager kunnen de bestuurlijke
      boete verrekenen met algemene bijstand of verrekenen met dan wel inhouden op een uitkering op grond van
      een van de bij de algemene maatregel van bestuur, bedoeld in [artikel 19, vierde lid][ref1], aan te wijzen
      socialezekerheidswetten of socialezekerheidsregelingen.

      2 Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van een van de
      socialezekerheidswetten of socialezekerheidsregelingen, bedoeld in het eerste lid, die wordt uitgevoerd door
      het Uitvoeringsinstituut werknemersverzekeringen of de eigenrisicodrager, betaalt het Uitvoeringsinstituut
      werknemersverzekeringen of de eigenrisicodrager desgevraagd aan het college het bedrag van de boete.

      3 Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager zijn niet bevoegd tot
      verrekening dan wel inhouding voorzover beslag op hun vordering nietig zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel44
