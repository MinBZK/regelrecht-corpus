      Het college legt een bestuurlijke boete op aan de inburgeringsplichtige ten aanzien van wie een beschikking als
      bedoeld in [artikel 19a, eerste lid][ref1], of [22, eerste lid][ref2], is gegeven, ter zake van overtreding van
      [artikel 23, eerste lid][ref3], dan wel van de krachtens [artikel 23, derde lid][ref4], gestelde regels.


