  - number: 24e
    text: |-
      1 De vrijwillige inburgeraar met wie een inburgeringsvoorziening of een taalkennisvoorziening is overeengekomen, is
      de in [artikel 23, tweede lid][ref1], bedoelde eigen bijdrage verschuldigd.

      2 In afwijking van het eerste lid kan de gemeenteraad voor vrijwillige inburgeraars of bepaalde categorieën
      vrijwillige inburgeraars bij verordening bepalen dat:

      a. geen eigen bijdrage is verschuldigd, of

      b. een eigen bijdrage is verschuldigd die lager is dan het bedrag, genoemd in [artikel 23, tweede lid][ref2].

      3 De vrijwillige inburgeraar met wie een inburgeringsvoorziening of een taalkennisvoorziening is overeengekomen
      en die op last van het college, dan wel een andere instantie als bedoeld in [artikel 21, tweede lid][ref3], een
      gecombineerde voorziening als bedoeld in [artikel 24b, eerste lid][ref4], dient te volgen, is geen eigen bijdrage
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel24b
