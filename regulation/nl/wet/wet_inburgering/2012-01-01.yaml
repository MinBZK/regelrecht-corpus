preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het huidige stelsel van inburgering in de Nederlandse
    samenleving te herzien door een algemene plicht tot inburgeren voor vreemdelingen en een plicht tot inburgering
    voor enkele categorieën Nederlanders te introduceren, alsmede het verstrekken van bepaalde verblijfsvergunningen
    afhankelijk te maken van het behalen van het inburgeringsexamen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister voor Wonen, Wijken en Integratie;

      b. inburgeringsplichtige: de persoon die op grond van de [artikelen 3][ref1], [5][ref2] en [6][ref3]
      inburgeringsplichtig is;

      c. oudkomer: de vreemdeling die sedert het tijdstip van inwerkingtreding van deze wet rechtmatig verblijf
      heeft in de zin van [artikel 8, onderdelen a tot en met e, dan wel l, van de Vreemdelingenwet 2000][ref4]
      en die op grond van de [artikelen 3][ref5] en [5][ref6] inburgeringsplichtig wordt, voor zover die
      vreemdeling op de dag voorafgaand aan de inwerkingtreding van deze wet geen nieuwkomer was in de zin van de
      [Wet inburgering nieuwkomers][ref7];

      d. leerplichtige leeftijd: de leeftijd waarop bij verblijf in Nederland sprake is van een verplichting tot
      inschrijving als bedoeld in [artikel 3 van de Leerplichtwet 1969][ref8];

      e. inburgeringsplicht: de verplichting, bedoeld in [artikel 7][ref9];

      f. college: het college van burgemeester en wethouders van de gemeente waar de inburgeringsplichtige of vrijwillige
      inburgeraar woonplaats heeft in de zin van [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref10];

      g. geestelijke bedienaar: de persoon die een geestelijk, godsdienstig of levensbeschouwelijk ambt bekleedt, arbeid
      verricht als geestelijk voorganger, godsdienstleraar of zendeling, dan wel ten behoeve van een kerkgenootschap of
      een ander genootschap op geestelijke of levensbeschouwelijke grondslag werkzaamheden van overwegend godsdienstige,
      geestelijke of levensbeschouwelijke aard verricht;

      h. exameninstelling: een krachtens [artikel 15, eerste lid][ref11], aangewezen instelling;

      i. cursusinstelling: een rechtspersoon of een natuurlijk persoon die in het kader van de uitoefening van beroep
      of bedrijf werkzaamheden verricht, gericht op het toeleiden van inburgeringsplichtigen of vrijwillige inburgeraars
      naar het inburgeringsexamen en die:

      1°. zolang op grond van [artikel 9][ref12] geen regels zijn gesteld over de afgifte van een certificaat, in het
      bezit is van een door Onze Minister aan te wijzen keurmerk, of

      2°. indien op grond van [artikel 9][ref13] regels zijn gesteld over de afgifte daarvan: in het bezit is van een
      certificaat als bedoeld in [artikel 9][ref14];

      j. inburgeringsexamen: het examen, bedoeld in [artikel 13, eerste lid][ref15];

      k. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref16];

      l. overheidswerkgever: hetgeen daaronder wordt verstaan in [artikel 1, onderdeel i, van de Werkloosheidswet][ref17];

      m. burgerservicenummer: het als zodanig overeenkomstig de [Wet algemene bepalingen burgerservicenummer][ref18] aan
      een natuurlijke persoon toegekend nummer;

      n. eigenrisicodrager: de werkgever aan wie de toestemming is verleend, bedoeld in
      [artikel 40, eerste lid, aanhef en onder b of c, van de Wet financiering sociale verzekeringen][ref19];

      o. algemene bijstand: algemene bijstand als bedoeld in [artikel 5, onderdeel b, van de Wet werk en bijstand][ref20];

      p. kwalificatieplicht: de plicht tot inschrijving als bedoeld in
      [artikel 4a, eerste lid, van de Leerplichtwet 1969][ref21];

      q. vrijwillige inburgeraar: de Nederlander en een persoon als bedoeld in [artikel 5, tweede lid][ref22], die:

      1°. ouder is dan 15 jaar;

      2°. minder dan acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven;

      3°. niet beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document;

      4°. niet leerplichtig of kwalificatieplichtig is, dan wel een opleiding volgt waarvan de afronding leidt tot
      uitreiking van een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document;

      r. inburgeringsbedrijf: een natuurlijk persoon of rechtspersoon die in het kader van uitoefening van beroep of
      bedrijf de inburgering van personen in Nederland bevordert;

      s. persoonlijk inburgeringsbudget: een budget dat door het college, in het kader van een te sluiten overeenkomst
      met een inburgeringsbedrijf, ten behoeve van een inburgeringsplichtige of vrijwillige inburgeraar ter beschikking
      wordt gesteld met behulp waarvan de inburgeringsplichtige of vrijwillige inburgeraar zijn inburgering op een op
      zijn persoonlijke situatie afgestemde wijze vorm geeft.

      2 Bij regeling van Onze Minister kan de geestelijke bedienaar, bedoeld in het eerste lid, onderdeel g, nader worden
      omschreven.


