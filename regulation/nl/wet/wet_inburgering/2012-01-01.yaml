        artikel: 7.3.1
  - number: 24b
    text: |-
      1 Een aanbod voor een inburgeringsvoorziening of een taalkennisvoorziening aan de vrijwillige inburgeraar die
      algemene bijstand of een uitkering op grond van een van de bij algemene maatregel van bestuur aan te wijzen
      socialezekerheidswetten of socialezekerheidsregelingen ontvangt, en die tevens verplicht is om arbeid te verkrijgen
      en te aanvaarden, wordt uitsluitend gedaan in combinatie met een op grond van de [Wet werk en bijstand][ref1],
      dan wel een van de bij die algemene maatregel van bestuur aan te wijzen socialezekerheidswetten of
      socialezekerheidsregelingen, aangeboden voorziening gericht op arbeidsinschakeling. Binnen een gecombineerde
      voorziening kunnen onderdelen volgtijdelijk worden ingezet.

      2 Het college is verantwoordelijk voor het aanbieden van een gecombineerde voorziening als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 24c
    text: |-
      1 Het college, het Uitvoeringsinstituut werknemersverzekeringen of de door hem aangewezen deskundige, de
      desbetreffende eigenrisicodrager en de desbetreffende overheidswerkgever werken samen bij de uitvoering van de
      [artikelen 24a, derde lid][ref1], [24b, eerste lid][ref2], en [24d][ref3].

      2 Het college, het Uitvoeringsinstituut werknemersverzekeringen, de desbetreffende eigenrisicodrager en de
      desbetreffende overheidswerkgever maken in ieder geval afspraken met betrekking tot de inkoop van een gecombineerde
      voorziening als bedoeld in [artikel 24b, eerste lid][ref4], de wijze waarop die voorziening feitelijk wordt
      aangeboden en de onderlinge gegevensuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel24d
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel24b
