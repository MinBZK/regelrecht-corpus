  - number: '23'
    text: |-
      1 De inburgeringsplichtige verleent medewerking aan de uitvoering van de inburgeringsvoorziening of de
      taalkennisvoorziening.

      2 De inburgeringsplichtige voor wie een inburgeringsvoorziening of een taalkennisvoorziening is vastgesteld, is een
      eigen bijdrage verschuldigd van € 270, welk bedrag bij algemene maatregel van bestuur kan worden gewijzigd.

      3 De gemeenteraad stelt bij verordening regels over de rechten en plichten van de inburgeringsplichtige voor
      wie een inburgeringsvoorziening of een taalkennisvoorziening is vastgesteld. Deze regels hebben in ieder geval
      betrekking op de inning van de eigen bijdrage door het college en de mogelijkheid van betaling in termijnen.

      4 Indien de inburgeringsplichtige, voor wie een inburgeringsvoorziening of een taalkennisvoorziening is
      vastgesteld, op grond van [artikel 27 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1]
      wordt ingeschreven in een andere gemeente, wordt die voorziening voortgezet, tenzij het college van de andere
      gemeente binnen zes weken na die inschrijving te kennen heeft gegeven dat zij vervalt. In dat geval biedt hij de
      inburgeringsplichtige een gelijkwaardig inburgeringsalternatief aan.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het inburgeringsalternatief,
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel27
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel23
    references:
