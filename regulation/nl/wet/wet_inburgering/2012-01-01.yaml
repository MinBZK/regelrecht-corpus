  - number: '48'
    text: |-
      1 Er is een Bestand Potentiële Inburgeringsplichtigen, beheerd door Onze Minister. Dit bestand
      bevat persoonsgegevens van vreemdelingen van wie Onze Minister op basis van gegevens, vastgelegd
      in de gemeentelijke basisadministratie persoonsgegevens en het vestigingsregister, bedoeld
      in [artikel 112 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1], en van
      bij Onze Minister van Onderwijs, Cultuur en Wetenschap berustende gegevens inzake krachtens
      [artikel 5, eerste lid, onderdeel c, en derde lid][ref2] aangewezen diploma's, certificaten of andere documenten,
      niet met zekerheid kan vaststellen dat zij niet inburgeringsplichtig zijn.

      2 Het doel van het Bestand Potentiële Inburgeringsplichtigen is:

      a. het college, Onze Minister en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen
      uitvoerende instanties van zodanige informatie te voorzien dat zoveel mogelijk wordt voorkomen dat een vreemdeling
      ten onrechte als inburgeringsplichtige wordt aangemerkt, en

      b. het verstrekken aan een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen uitvoerende
      instanties van gegevens die van belang zijn voor de uitvoering van deze wet;

      c. het verstrekken aan Onze Minister van informatie met het oog op de evaluatie van bestaand beleid en de
      voorbereiding van toekomstig beleid.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het Bestand Potentiële
      Inburgeringsplichtigen. Daarbij worden in ieder geval regels gesteld met betrekking tot de in het Bestand
      Potentiële Inburgeringsplichtigen op te nemen gegevens en de verwerking van die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel48
