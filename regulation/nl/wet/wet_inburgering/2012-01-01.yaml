        artikel: '27'
  - number: '24'
    text: |-
      1 Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager kunnen de eigen
      bijdrage, bedoeld in [artikel 23, tweede lid][ref1], verrekenen met algemene bijstand of verrekenen met
      dan wel inhouden op een uitkering op grond van een van de bij de algemene maatregel van bestuur, bedoeld in
      [artikel 19, vierde lid][ref2], aan te wijzen socialezekerheidswetten of socialezekerheidsregelingen.

      2 Indien degene die de eigen bijdrage verschuldigd is een uitkering ontvangt op grond van een van de
      socialezekerheidswetten of socialezekerheidsregelingen, bedoeld in het eerste lid, die wordt uitgevoerd door
      het Uitvoeringsinstituut werknemersverzekeringen of de eigenrisicodrager, betaalt het Uitvoeringsinstituut
      werknemersverzekeringen of de eigenrisicodrager desgevraagd aan het college het bedrag van die bijdrage.

      3 Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager zijn niet bevoegd tot
      verrekening dan wel inhouding voorzover beslag op hun vordering nietig zou zijn.

      4 Het college kan de eigen bijdrage bij dwangbevel invorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel19
