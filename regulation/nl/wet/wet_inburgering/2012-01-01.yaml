  - number: '13'
    text: |-
      1 Onze Minister stelt het inburgeringsexamen vast.

      2 Het inburgeringsexamen omvat een onderzoek naar de kennis en vaardigheden die de inburgeringsplichtige ingevolge
      [artikel 7][ref1] moet hebben verworven.

      3 Het inburgeringsexamen bestaat uit een centraal deel en een praktijkdeel.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het inburgeringsexamen. Daarbij
      worden in ieder geval regels gesteld omtrent:

      a. de terzake van het inburgeringsexamen verschuldigde kosten;

      b. de identificatie van de persoon die aan het inburgeringsexamen deelneemt;

      c. de inhoud van het inburgeringsexamen;

      d. de examencommissie;

      e. het beroep tegen de uitslag van het praktijkdeel van het inburgeringsexamen, en

      f. het diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 Het inburgeringsexamen is behaald, indien:

      a. alle daartoe behorende examens met goed gevolg zijn afgelegd, of

      b. ingeval van gedeeltelijke vrijstelling, de overige daartoe behorende examens met goed gevolg zijn afgelegd.

      2 Ten bewijze dat het inburgeringsexamen is behaald, wordt een diploma uitgereikt.

      3 Bij regeling van Onze Minister wordt het model van het diploma vastgesteld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de geldigheidsduur van de
      uitslagen van de tot het inburgeringsexamen behorende examens.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel14
  - number: '15'
    text: |-
      1 Het praktijkdeel van het inburgeringsexamen wordt afgenomen door Onze Minister en de door Onze Minister
      aangewezen exameninstellingen.

      2 Onze Minister neemt het centrale deel van het inburgeringsexamen af.

      3 Aan een aanwijzing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de eisen waaraan de exameninstelling moet voldoen;

      b. de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;

      c. de gronden waarop aanwijzing kan worden geweigerd, geschorst en ingetrokken;

      d. de terzake van de aanwijzing verschuldigde kosten en de betaling daarvan, en

      e. de door de exameninstelling aan Onze Minister, aan gemeenten en aan anderen die betrokken zijn bij de uitvoering
      van deze wet te verstrekken gegevens.

      5 In de algemene maatregel van bestuur, bedoeld in het vierde lid, kan worden bepaald dat het praktijkdeel van
      het inburgeringsexamen of een onderdeel daarvan, in afwijking van het eerste lid, wordt afgenomen door een bij
      of krachtens die algemene maatregel van bestuur aangewezen exameninstelling, indien de kandidaat een geestelijk
      bedienaar is.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het toezicht op de
      exameninstellingen door een onafhankelijke instantie.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel15
  - number: '16'
    text: |-
      1 Onze Minister verstrekt op aanvraag een lening aan de inburgeringsplichtige indien is voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen regels omtrent de voorwaarden waaronder en de wijze waarop de
      lening wordt verstrekt.

      2 Het bedrag van de lening wordt betaald aan de door de inburgeringsplichtige aangewezen cursusinstelling en
      exameninstelling.

      3 De inburgeringsplichtige of gewezen inburgeringsplichtige betaalt de lening vermeerderd met de volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels berekende rente terug.

      4 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden tevens regels gesteld
      omtrent:

      a. de hoogte van de lening;

      b. de betaling en de terugbetaling van de lening, en

      c. kwijtschelding.

      5 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent het verstrekken van een lening aan een inburgeringsplichtige ten behoeve van het verwerven van kennis en
      vaardigheden op een hoger niveau dan is vastgesteld op grond van [artikel 7, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '17'
    text: |-
      1 De terugbetalingsperiode vangt niet eerder aan dan zes maanden nadat drie jaar zijn verstreken sedert de
      verstrekking van de lening of, indien dat eerder is, zes maanden nadat het inburgeringsexamen is behaald.

      2 Onze Minister kan het terug te betalen bedrag invorderen bij dwangbevel.

      3 Indien de lening wordt kwijtgescholden, gaat de over het kwijtgescholden bedrag opgebouwde rente op het tijdstip
      van kwijtschelding teniet.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels verstrekt Onze Minister een
      vergoeding aan de gewezen inburgeringsplichtige die binnen drie jaar het inburgeringsexamen heeft behaald.

      2 Voor de oudkomer vangt de termijn, bedoeld in het eerste lid, niet aan, dan nadat het college zulks ten aanzien
      van hem op grond van [artikel 26][ref1] heeft bepaald.

      3 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden tevens regels gesteld
      omtrent:

      a. de criteria voor het verstrekken van de vergoeding;

      b. de aanvraag van de vergoeding;

      c. de wijze waarop het bedrag wordt bepaald;

      d. de vaststelling van de vergoeding;

      e. de betaling,

      f. de verrekening met de lening, bedoeld in [artikel 16][ref2], en

      g. de verlenging van de termijn van drie jaar, bedoeld in het eerste lid.

      4 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent het verstrekken van een vergoeding aan de gewezen inburgeringsplichtige die kennis en vaardigheden heeft
      verworven op een hoger niveau dan is vastgesteld op grond van [artikel 7, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel26
