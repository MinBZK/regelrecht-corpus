  - number: '31'
    text: |-
      1 Het college legt de inburgeringsplichtige die niet binnen de in [artikel 7, eerste lid][ref1], bedoelde termijn
      of de op grond van het tweede lid, aanhef en onderdeel a of b, verlengde termijn, het inburgeringsexamen heeft
      behaald, een bestuurlijke boete op.

      2 In afwijking van het eerste lid:

      a. verlengt het college de in [artikel 7, eerste lid][ref2], bedoelde termijn, indien de inburgeringsplichtige
      aannemelijk maakt dat hem geen verwijt treft terzake van het niet behalen van het inburgeringsexamen;

      b. verlengt het college de in [artikel 7, eerste lid][ref3], bedoelde termijn eenmalig met ten
      hoogste twee jaar en zes maanden, indien aantoonbaar een alfabetiseringscursus als bedoeld in
      [artikel 7.3.1, eerste lid, onder e, van de Wet educatie en beroepsonderwijs][ref4] wordt of is gevolgd voor het
      verstrijken van de eerder bedoelde termijn, of

      c. verleent het college ontheffing van de inburgeringsplicht, indien het college op grond van door de
      inburgeringsplichtige aantoonbaar geleverde inspanningen tot het oordeel komt dat het voor hem redelijkerwijs niet
      mogelijk is het inburgeringsexamen te behalen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel31
