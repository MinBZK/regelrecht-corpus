  - number: 19A
    text: |-
      1 De gemeenteraad kan bij verordening bepalen dat het college een inburgeringsvoorziening of taalkennisvoorziening
      voor een inburgeringsplichtige kan vaststellen.

      2 Indien de gemeenteraad toepassing heeft gegeven aan het eerste lid:

      a. kan het college geen inburgeringsvoorziening of taalkennisvoorziening aanbieden;

      b. zijn de [artikelen 19][ref1], [20][ref2] en [21][ref3] van overeenkomstige toepassing, met uitzondering van
      [artikel 19, eerste lid][ref4], indien een inburgeringsplichtige als bedoeld in dat lid ten genoegen van het
      college aannemelijk heeft gemaakt dat hij een opleiding volgt of gaat volgen waarvan de afronding leidt tot
      uitreiking van een krachtens [artikel 5, eerste lid, onderdeel c][ref5], aangewezen diploma, certificaat of ander
      document, en

      c. geeft het college, indien de vaststelling betrekking heeft op een oudkomer, daarbij tevens toepassing aan
      [artikel 26][ref6].


