  - number: 24d
    text: |-
      1 Indien de vrijwillige inburgeraar in aanmerking wordt gebracht voor een inburgeringsvoorziening, een
      taalkennisvoorziening of een gecombineerde voorziening als bedoeld in [artikel 24b, eerste lid][ref1], doet het
      college de vrijwillige inburgeraar terzake een aanbod als bedoeld in [artikel 24a, eerste lid][ref2].

      2 Indien de vrijwillige inburgeraar het aanbod, bedoeld in het eerste lid, aanvaardt, sluit het college een
      overeenkomst met de vrijwillige inburgeraar.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel24d
