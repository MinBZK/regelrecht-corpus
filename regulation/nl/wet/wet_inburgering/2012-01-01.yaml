  - number: '34'
    text: |-
      De bestuurlijke boete kan niet hoger zijn dan:

      a. € 250 voor het handelen in strijd met [artikel 25][ref1];

      b. € 500 voor het handelen in strijd met [artikel 23, eerste lid][ref2], of de krachtens
      [artikel 23, derde lid][ref3], gestelde regels;

      c. € 500 voor het niet naleven van [artikel 7, eerste lid][ref4];

      d. € 1000 voor het niet behalen van het inburgeringsexamen binnen de bij of krachtens de [artikelen 32][ref5] en
      [33][ref6] gestelde termijnen.


