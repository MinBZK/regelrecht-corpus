  - number: '67'
    text: |-
      Op rijksbijdragen die op grond van de [Wet inburgering nieuwkomers][ref1] zijn verstrekt ten behoeve van tijdvakken
      voorafgaand aan de inwerkingtreding van deze wet, blijft het recht zoals dat voor het desbetreffende tijdvak gold
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '68'
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschap kan aan regionale opleidingencentra als bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref1] een vergoeding toekennen in verband met de invoering
      van deze wet.

      2 Bij regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap worden regels gesteld met betrekking tot de
      vergoeding. Deze regels hebben in ieder geval betrekking op:

      a. de criteria voor het verstrekken van de vergoeding;

      b. de hoogte van de vergoeding;

      c. de verantwoording;

      d. de betaling en de terugvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 1.3.1
  - number: '71'
    text: |-
      Onze Minister zendt binnen vier jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel71
  - number: '72'
    text: |-
      De [Wet inburgering nieuwkomers][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '73'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit kan worden bepaald dat
      [artikel 65][ref1] terugwerkt tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel73
    references:
