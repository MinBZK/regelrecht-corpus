  - number: '6'
    text: |-
      1 Het college ontheft de inburgeringsplichtige van de inburgeringsplicht, indien die inburgeringsplichtige heeft
      aangetoond door een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap, blijvend niet in
      staat te zijn het inburgeringsexamen te behalen.

      2 Bij of krachtens algemene maatregel van bestuur kan worden voorzien in:

      a. verdere ontheffing van de inburgeringsplicht, en

      b. nadere regels omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 De inburgeringsplichtige verwerft mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis
      van de Nederlandse samenleving. Hij draagt er zorg voor dat hij het inburgeringsexamen binnen drieënhalf jaar
      behaalt. De termijn voor de oudkomer vangt niet aan dan nadat het college zulks ten aanzien van hem op grond van
      [artikel 26][ref1] heeft bepaald.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. het niveau van de kennis en vaardigheden, bedoeld in het eerste lid, waarbij voor verschillende categorieën
      inburgeringsplichtigen verschillende niveaus kunnen worden vastgesteld;

      b. de verlenging van de termijn, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel26
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel7
