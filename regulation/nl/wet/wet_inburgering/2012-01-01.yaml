  - number: 24a
    text: |-
      1 Het college kan een inburgeringsvoorziening aanbieden aan een vrijwillige inburgeraar. Het college kan
      in afwijking van de eerste volzin aan een vrijwillige inburgeraar die een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref1] volgt of zal volgen
      een taalkennisvoorziening aanbieden.

      2 Indien de vrijwillige inburgeraar daarom verzoekt, kan de inburgeringsvoorziening, de taalkennisvoorziening
      of de inburgeringscomponent van de gecombineerde voorziening, bedoeld in [artikel 24b, eerste lid][ref2], worden
      aangeboden in de vorm van een persoonlijk inburgeringsbudget.

      3 Een inburgeringsvoorziening leidt toe naar het inburgeringsexamen of het staatsexamen Nederlands als tweede
      taal I of II, bedoeld in [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref3]
      en omvat het eenmaal kosteloos afleggen van het desbetreffende examen. Een taalkennisvoorziening is gericht
      op de verwerving van de kennis van de Nederlandse taal die noodzakelijk is voor het kunnen afronden van een
      beroepsopleiding als bedoeld in het eerste lid, tweede volzin.

      4 Een aanbod aan de vrijwillige inburgeraar die algemene bijstand of een uitkering op grond van een van
      de bij algemene maatregel van bestuur aan te wijzen socialezekerheidswetten of socialezekerheidsregelingen
      ontvangt, wordt afgestemd op diens mogelijkheden tot arbeidsinschakeling. Het college stemt het aanbod aan de
      vrijwillige inburgeraar af op de aard van de arbeid die de vrijwillige inburgeraar verricht of past de aangeboden
      inburgeringsvoorziening of taalkennisvoorziening zonodig aan aan de aard van de arbeid die de vrijwillige
      inburgeraar gaat verrichten.

      5 De gemeenteraad stelt bij verordening regels met betrekking tot het eerste, tweede en derde lid. Deze regels
      hebben in ieder geval betrekking op:

      a. de procedure die door het college wordt gevolgd voor het doen van een aanbod als bedoeld in het eerste en tweede
      lid en de criteria die daarbij worden gehanteerd, en

      b. de wijze waarop het college met een vrijwillige inburgeraar in overleg treedt om te komen tot een passende
      inburgeringsvoorziening of taalkennisvoorziening met inbegrip van de totstandkoming en de samenstelling van die
      voorziening.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het persoonlijk
      inburgeringsbudget.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het aanbod van de
      inburgeringsvoorziening aan de vrijwillige inburgeraar die geestelijke bedienaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel24a
