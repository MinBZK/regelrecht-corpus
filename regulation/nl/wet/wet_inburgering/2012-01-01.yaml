        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '8'
    text: |-
      De gemeenteraad stelt bij verordening regels over de informatieverstrekking door de gemeente aan
      inburgeringsplichtigen, ter zake van hun rechten en plichten uit hoofde van deze wet, alsmede van het aanbod van en
      de toegang tot inburgeringsvoorzieningen of taalkennisvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel8
  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte van een certificaat
      aan een rechtspersoon of een natuurlijk persoon die in het kader van de uitoefening van beroep of bedrijf
      werkzaamheden verricht gericht op het toeleiden van inburgeringsplichtigen of vrijwillige inburgeraars naar het
      inburgeringsexamen.

      2 Onze Minister dan wel een door Onze Minister op grond van [artikel 10][ref1] aangewezen instelling beslist
      op aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.

      3 Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.

      4 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent:

      a. de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;

      b. de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een
      afgegeven certificaat kan worden verlengd of ingetrokken;

      c. de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      1 Onze Minister kan op aanvraag een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 9, tweede lid][ref1], uitoefent.

      2 Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.

      3 Een krachtens dit artikel aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voorzover dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden voor:

      a. de gronden waarop de in het eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd;

      b. het opstellen van een verslag van werkzaamheden ten behoeve van Onze Minister;

      c. het toezicht op de instelling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel9
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '9'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      1 Onze Minister kan de krachtens [artikel 10][ref1] aangewezen instelling aanwijzingen geven met betrekking tot de
      uitoefening van haar taken. Hij treedt daarbij niet in individuele gevallen.

      2 De krachtens [artikel 10][ref2] aangewezen instelling is gehouden overeenkomstig de aanwijzing, bedoeld in het
      eerste lid, te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel10
