  - number: '63'
    text: |-
      Deze wet is niet van toepassing op de oudkomer die op het tijdstip waarop deze wet in werking treedt 60 jaar of
      ouder is.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel63
  - number: '64'
    text: |-
      1 Onverminderd [artikel 7][ref1] blijft het bepaalde bij en krachtens de [Wet inburgering nieuwkomers][ref2] van
      toepassing op de inburgeringsplichtige die op de dag voorafgaand aan de inwerkingtreding van deze wet:

      a. nieuwkomer was in de zin van [die wet][ref3], en

      b. heeft voldaan aan de in [artikel 2, eerste lid, van die wet][ref4] bedoelde verplichting.

      2 Een met toepassing van
      [artikel 3, eerste lid, onderdeel a, juncto derde lid, onderdeel a, van de Wet inburgering nieuwkomers][ref5]
      verleende ontheffing wordt aangemerkt als een ontheffing in de zin van [artikel 6, eerste lid][ref6], van deze wet.

      3 Zolang het bepaalde bij en krachtens de [Wet inburgering nieuwkomers][ref7] op hem van toepassing is, zijn de
      [artikelen 55][ref8], [56][ref9] en [62][ref10] niet van toepassing ten aanzien van de inburgeringsplichtige,
      bedoeld in het eerste lid.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      invoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009544
