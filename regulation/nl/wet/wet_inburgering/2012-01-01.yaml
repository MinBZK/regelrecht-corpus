  - number: '19'
    text: |-
      1 Het college biedt in ieder geval aan:

      a. een inburgeringsvoorziening of een taalkennisvoorziening aan de inburgeringsplichtige die houder is van een
      verblijfsvergunning als bedoeld in [artikel 28][ref1] of [33 van de Vreemdelingenwet 2000][ref2], dan wel

      b. een inburgeringsvoorziening aan de inburgeringsplichtige die geestelijke bedienaar is omtrent welk aanbod bij of
      krachtens algemene maatregel van bestuur regels kunnen worden gesteld.

      2 Indien de inburgeringsplichtige daarom verzoekt, kan de inburgeringsvoorziening, de taalkennisvoorziening of
      de inburgeringscomponent van de gecombineerde voorziening, bedoeld in [artikel 20, eerste lid][ref3], worden
      aangeboden in de vorm van een persoonlijk inburgeringsbudget.

      3 Een inburgeringsvoorziening leidt toe naar het inburgeringsexamen of het staatsexamen Nederlands als tweede taal
      I of II, bedoeld in [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref4] en omvat
      het eenmaal kosteloos afleggen van het desbetreffende examen. Een taalkennisvoorziening is gericht op de verwerving
      van de kennis van de Nederlandse taal die noodzakelijk is voor het kunnen afronden van een beroepsopleiding als
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref5].

      4 Een aanbod aan de inburgeringsplichtige die algemene bijstand of een uitkering op grond van een van de bij
      algemene maatregel van bestuur aan te wijzen socialezekerheidswetten of socialezekerheidsregelingen ontvangt, wordt
      afgestemd op diens mogelijkheden tot arbeidsinschakeling. Het college stemt het aanbod aan de inburgeringsplichtige
      af op de aard van de arbeid die de inburgeringsplichtige verricht of past de aangeboden inburgeringsvoorziening of
      taalkennisvoorziening zonodig aan aan de aard van de arbeid die de inburgeringsplichtige gaat verrichten.

      5 De gemeenteraad stelt bij verordening regels met betrekking tot het eerste, tweede en derde lid. Deze regels
      hebben in ieder geval betrekking op:

      a. de procedure die door het college wordt gevolgd voor het doen van een aanbod als bedoeld in het eerste lid, en
      de criteria die daarbij worden gehanteerd, en

      b. de vaststelling door het college van een passende inburgeringsvoorziening of taalkennisvoorziening, met inbegrip
      van de totstandkoming en de samenstelling van die voorziening.

      6 Voor de inburgeringsplichtige die houder is van een verblijfsvergunning als bedoeld in [artikel 28][ref6]
      of [33 van de Vreemdelingenwet 2000][ref7] maakt maatschappelijke begeleiding onderdeel uit van de
      inburgeringsvoorziening of de taalkennisvoorziening.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      persoonlijk inburgeringsbudget.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel20
