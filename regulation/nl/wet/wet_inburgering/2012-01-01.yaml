  - number: '49'
    text: |-
      Het college, de cursusinstellingen, de exameninstellingen en Onze Minister nemen in de registratie, die zij voor de
      uitvoering van deze wet aanleggen, het burgerservicenummer van de geregistreerde op.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel49
  - number: '50'
    text: |-
      1 Bijzondere persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] kunnen door
      het college, de cursusinstellingen, de exameninstellingen en Onze Minister worden verwerkt, voorzover deze gegevens
      noodzakelijk zijn voor de doelmatige en doeltreffende uitvoering van deze wet.

      2 Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij
      wordt in ieder geval geregeld:

      a. op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;

      b. op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;

      c. welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;

      d. op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel
      waarvoor ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt
      toegezien.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel50
    references:
