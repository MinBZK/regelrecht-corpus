  - number: '25'
    text: |-
      1 Het college kan de inburgeringsplichtige oproepen om te verschijnen en gegevens te verstrekken om toepassing te
      geven aan de [artikelen 19][ref1], [19a][ref2], en [26][ref3].

      2 Het college kan een persoon ten aanzien van wie het op redelijke gronden kan vermoeden dat deze
      inburgeringsplichtig is, oproepen om te verschijnen en gegevens te verstrekken die voor diens
      inburgeringsplichtigheid van belang zijn.

      3 De in het tweede lid bedoelde gegevens kunnen betrekking hebben op:

      a. het doel van het verblijf in Nederland;

      b. verblijf in Nederland tijdens de leerplichtige leeftijd;

      c. het bezit van diploma's, certificaten of andere documenten als bedoeld in
      [artikel 5, eerste lid, onderdeel c, en derde lid][ref4];

      d. het aansluitend op de volledige leerplicht volgen van een opleiding waarvan de afronding leidt tot uitreiking
      van een diploma, certificaat of ander document als bedoeld in [artikel 5, eerste lid, onderdeel c][ref5];

      e. het verrichten van arbeid als geestelijke bedienaar;

      f. de toepasselijkheid van een verdrag of besluit als bedoeld in [artikel 5, tweede lid][ref6];

      g. feiten of omstandigheden die op grond van [artikel 5, vierde lid, onderdeel a][ref7], kunnen leiden tot gehele
      of gedeeltelijke vrijstelling van de inburgeringsplicht;

      h. de aanwezigheid van een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap als bedoeld
      in [artikel 6, eerste lid][ref8];

      i. feiten of omstandigheden die op grond van [artikel 6, tweede lid, onderdeel a][ref9], kunnen leiden tot
      ontheffing van de inburgeringsplicht.

      4 De in het eerste en tweede lid bedoelde persoon geeft gehoor aan de oproep en verleent medewerking aan het
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
