  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het oproepen van
      personen krachtens [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel25
