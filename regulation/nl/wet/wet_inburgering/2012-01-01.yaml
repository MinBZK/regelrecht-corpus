  - number: '65'
    text: |-
      Het college van een gemeente die op 1 januari 2006 beschikt over een voor dit tijdstip opgebouwde reserve aan op
      grond van de [Wet inburgering nieuwkomers][ref1] verstrekte, maar niet bestede rijksbijdragen, wendt deze aan voor
      het aanbieden van inburgeringsprogramma's aan anderen dan nieuwkomers overeenkomstig door Onze Minister te stellen
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '66'
    text: |-
      Het college van een gemeente die op het tijdstip van inwerkingtreding van deze wet beschikt over een in
      [artikel 65][ref1] bedoelde reserve, wendt deze aan voor het aanbieden van inburgeringsvoorzieningen overeenkomstig
      de [artikelen 19, eerste lid][ref2], en [20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel20
