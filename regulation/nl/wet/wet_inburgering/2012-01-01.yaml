  - number: '26'
    text: |-
      Het college bepaalt voor de oudkomer de dag waarop de in de [artikelen 7, eerste lid, onderdeel b][ref1], en
      [18, eerste lid][ref2], bedoelde termijnen aanvangen. De termijnen vangen op dezelfde dag aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
