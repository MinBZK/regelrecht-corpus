      1 Een aanbod voor een inburgeringsvoorziening of een taalkennisvoorziening aan de inburgeringsplichtige, bedoeld
      in [artikel 19, vierde lid][ref1], die tevens verplicht is om arbeid te verkrijgen en te aanvaarden, wordt
      uitsluitend gedaan in combinatie met een op grond van de [Wet werk en bijstand][ref2], dan wel een van de bij de
      algemene maatregel van bestuur, bedoeld in [artikel 19, vierde lid][ref3], aan te wijzen socialezekerheidswetten
      of socialezekerheidsregelingen, aangeboden voorziening gericht op arbeidsinschakeling. Binnen een gecombineerde
      voorziening kunnen onderdelen volgtijdelijk worden ingezet.

      2 Het college is verantwoordelijk voor het aanbieden van een gecombineerde voorziening als bedoeld in het eerste
      lid.


