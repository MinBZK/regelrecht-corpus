        paragraaf: '2'
  - number: '47'
    text: |-
      1 Er is een Informatiesysteem Inburgering, beheerd door Onze Minister. Dit systeem bevat een systematisch geordende
      verzameling van gegevens die van belang zijn met betrekking tot de inburgering op grond van deze wet.

      2 Het Informatiesysteem Inburgering heeft tot doel de verstrekking:

      a. aan het college, Onze Minister en een of meer bij of krachtens algemene maatregel van bestuur aan te
      wijzen uitvoerende instanties van gegevens die van belang zijn voor de uitvoering van deze wet en van de
      [Wet participatiebudget][ref1], voor zover het betreft inburgeringsvoorzieningen en taalkennisvoorzieningen;

      b. aan Onze Minister van gegevens die van belang zijn voor de bekostiging, bedoeld in [artikel 52][ref2], en met
      het oog op de evaluatie van bestaand beleid en de voorbereiding van toekomstig beleid;

      c. aan Onze Minister van Justitie van gegevens die van belang zijn voor de uitvoering van de [artikelen 16a][ref3],
      [21][ref4] en [34 van de Vreemdelingenwet 2000][ref5] en voor de beoordeling van een verzoek tot verkrijging van
      het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref6].

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het Informatiesysteem Inburgering.
      Daarbij worden in ieder geval regels gesteld met betrekking tot de in het Informatiesysteem Inburgering op te nemen
      gegevens en de verwerking van die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025039
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel16a
