      De gemeenteraad stelt bij verordening het bedrag vast van de bestuurlijke boete die voor de verschillende
      overtredingen kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0020611/2012-01-01#Artikel35
  - number: '36'
    text: |-
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is van toepassing indien [artikel 30][ref2],
      [31, eerste lid][ref3], of [33][ref4] is overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel553
