  - number: 47.2.c
    text: |-
      aan Onze Minister van informatie met het oog op de evaluatie van bestaand beleid en de voorbereiding van toekomstig
      beleid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel47
  - number: '47.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het Informatiesysteem Inburgering.
      Daarbij worden in ieder geval regels gesteld met betrekking tot de in het Informatiesysteem Inburgering op te nemen
      gegevens en de verwerking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel47
  - number: '48.1'
    text: |-
      Er is een Bestand Potentiële Inburgeringsplichtigen, beheerd door de IB-Groep. Dit bestand
      bevat persoonsgegevens van personen van wie de IB-Groep op basis van gegevens, vastgelegd in
      de gemeentelijke basisadministratie persoonsgegevens en het vestigingsregister, bedoeld in
      [artikel 112 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1], en van bij de IB-Groep
      berustende gegevens inzake krachtens [artikel 5, eerste lid, onderdeel c, en derde lid][ref2] aangewezen diploma's,
      certificaten of andere documenten, niet met zekerheid kan vaststellen dat zij niet inburgeringsplichtig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '5'
        hoofdstuk: '2'
  - number: '48.2'
    text: 'Het doel van het Bestand Potentiële Inburgeringsplichtigen is:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel48
  - number: 48.2.a
    text: |-
      het college, de IB-Groep en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen uitvoerende
      instanties van zodanige informatie te voorzien dat zoveel mogelijk wordt voorkomen dat een persoon ten onrechte als
      inburgeringsplichtige wordt aangemerkt, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel48
  - number: 48.2.b
    text: |-
      het verstrekken aan een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen uitvoerende
      instanties van gegevens die van belang zijn voor de uitvoering van deze wet;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel48
  - number: 48.2.c
    text: |-
      het verstrekken aan Onze Minister van informatie met het oog op de evaluatie van bestaand beleid en de
      voorbereiding van toekomstig beleid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel48
  - number: '48.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het Bestand Potentiële
      Inburgeringsplichtigen. Daarbij worden in ieder geval regels gesteld met betrekking tot de in het Bestand
      Potentiële Inburgeringsplichtigen op te nemen gegevens en de verwerking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel48
  - number: '49'
    text: |-
      Het college, de cursusinstellingen, de exameninstellingen en de IB-Groep nemen in de registratie, die zij voor de
      uitvoering van deze wet aanleggen, het sociaal-fiscaalnummer van de geregistreerde op.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel49
  - number: '50.1'
    text: |-
      Bijzondere persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] kunnen door
      het college, de cursusinstellingen, de exameninstellingen en de IB-Groep worden verwerkt, voorzover deze gegevens
      noodzakelijk zijn voor de doelmatige en doeltreffende uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '50.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij wordt
      in ieder geval geregeld:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel50
  - number: 50.2.a
    text: op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel50
  - number: 50.2.b
    text: |-
      op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel50
  - number: 50.2.c
    text: welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel50
  - number: 50.2.d
    text: |-
      op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel waarvoor
      ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel50
  - number: '51'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het verstrekken van
      beleidsinformatie door de gemeenten, de cursusinstellingen en de exameninstellingen over
      uitvoering van de in de [hoofdstukken 4][ref1],[ 5, paragraaf 2][ref2], en [6][ref3] bedoelde
      taken, die niet reeds op grond van de [artikelen 47][ref4] of [52][ref5] of op grond van
      [artikel 18, tweede lid, van de Wet verzelfstandiging informatiseringsbank][ref6] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0006320#Artikel18
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020611
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020611
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '47'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '52'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0006320
        artikel: '18'
  - number: '52.1'
    text: |-
      Onze Minister verstrekt aan de gemeenten op de voet van [artikel 108, derde lid, van de Gemeentewet][ref1]
      jaarlijks een rijksbijdrage ten behoeve van de uitvoering van de [artikelen 6, eerste lid][ref2],
      [19 tot en met 33][ref3], [47][ref4] en [51][ref5] en ten behoeve van de informatieverstrekking over de
      inburgeringsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel51
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '47'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '51'
        hoofdstuk: '7'
  - number: '52.2'
    text: |-
      Het eerste lid is niet van toepassing op gemeenten die op grond van het
      [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1] een brede doeluitkering in het kader van het
      Grotestedenbeleid ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018238
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018238
  - number: '52.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de rijksbijdrage. Deze
      regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
  - number: 52.3.a
    text: de wijze waarop het bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
  - number: 52.3.b
    text: de aanvraag tot verlening;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
  - number: 52.3.c
    text: de verantwoording, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
  - number: 52.3.d
    text: de verlening van voorschotten, de betaling en de verrekening.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel52
  - number: '63'
    text: |-
      Deze wet is niet van toepassing op de oudkomer die op het tijdstip waarop deze wet in werking treedt 60 jaar of
      ouder is.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel63
  - number: '64.1'
    text: |-
      Onverminderd [artikel 7][ref1] blijft het bepaalde bij en krachtens de [Wet inburgering nieuwkomers][ref2] van
      toepassing op de inburgeringsplichtige die op de dag voorafgaand aan de inwerkingtreding van deze wet:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009544
  - number: 64.1.a
    text: |-
      nieuwkomer was in de zin van [die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 64.1.b
    text: |-
      heeft voldaan aan de in [artikel 2, eerste lid, van die wet][ref1] bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel2
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '2'
  - number: '64.2'
    text: |-
      Een met toepassing van
      [artikel 3, eerste lid, onderdeel a, juncto derde lid, onderdeel a, van de Wet inburgering nieuwkomers][ref1]
      verleende ontheffing wordt aangemerkt als een ontheffing in de zin van [artikel 6, eerste lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '6'
        hoofdstuk: '2'
  - number: '64.3'
    text: |-
      Zolang het bepaalde bij en krachtens de [Wet inburgering nieuwkomers][ref1] op hem van toepassing is, zijn de
      [artikelen 55][ref2], [56][ref3] en [62][ref4] niet van toepassing ten aanzien van de inburgeringsplichtige,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel62
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0009544
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '55'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '56'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '62'
        hoofdstuk: '10'
  - number: '64.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de invoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel64
  - number: '65'
    text: |-
      Het college van een gemeente die op 1 januari 2006 beschikt over een voor dit tijdstip opgebouwde reserve aan op
      grond van de [Wet inburgering nieuwkomers][ref1] verstrekte, maar niet bestede rijksbijdragen, wendt deze aan voor
      het aanbieden van inburgeringsprogramma's aan anderen dan nieuwkomers overeenkomstig door Onze Minister te stellen
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '66'
    text: |-
      Het college van een gemeente die op het tijdstip van inwerkingtreding van deze wet beschikt over een in
      [artikel 65][ref1] bedoelde reserve, wendt deze aan voor het aanbieden van inburgeringsvoorzieningen overeenkomstig
      de [artikelen 19, eerste lid][ref2], en [20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel20
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '65'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '67'
    text: |-
      Op rijksbijdragen die op grond van de [Wet inburgering nieuwkomers][ref1] zijn verstrekt ten behoeve van tijdvakken
      voorafgaand aan de inwerkingtreding van deze wet, blijft het recht zoals dat voor het desbetreffende tijdvak gold
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '68.1'
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap kan aan regionale opleidingencentra als bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref1] een vergoeding toekennen in verband met de invoering
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '68.2'
    text: |-
      Bij regeling van Onze Minister van Onderwijs, Cultuur en Wetenschap worden regels gesteld met betrekking tot de
      vergoeding. Deze regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel68
  - number: 68.2.a
    text: de criteria voor het verstrekken van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel68
  - number: 68.2.b
    text: de hoogte van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel68
  - number: 68.2.c
    text: de verantwoording;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel68
  - number: 68.2.d
    text: de betaling en de terugvordering.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel68
  - number: '71'
    text: |-
      Onze Minister zendt binnen vier jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel71
  - number: '72'
    text: |-
      De [Wet inburgering nieuwkomers][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '73'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit kan worden bepaald dat
      [artikel 65][ref1] terugwerkt tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '65'
        hoofdstuk: '11'
  - number: '74'
    text: 'Deze wet wordt aangehaald als: Wet inburgering.'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel74
