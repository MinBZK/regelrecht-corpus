preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het huidige stelsel van inburgering in de Nederlandse
    samenleving te herzien door een algemene plicht tot inburgeren voor vreemdelingen en een plicht tot inburgering
    voor enkele categorieën Nederlanders te introduceren, alsmede het verstrekken van bepaalde verblijfsvergunningen
    afhankelijk te maken van het behalen van het inburgeringsexamen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#ArtikelAanhef
