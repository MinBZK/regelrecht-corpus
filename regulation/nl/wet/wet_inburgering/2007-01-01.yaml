  - number: '1.2'
    text: |-
      Bij regeling van Onze Minister kan de geestelijke bedienaar, bedoeld in het eerste lid, onderdeel g, nader worden
      omschreven.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel1
  - number: '2'
    text: |-
      Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn met betrekking tot de
      uitoefening, onderscheidenlijk de nakoming van de voor hem uit deze wet en de daarop berustende bepalingen
      voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel2
  - number: '3.1'
    text: |-
      Inburgeringsplichtig is de vreemdeling met rechtmatig verblijf in de zin van
      [artikel 8, onderdelen a tot en met e, dan wel l, van de Vreemdelingenwet 2000][ref1], die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.1.a
    text: anders dan voor een tijdelijk doel in Nederland verblijft, of
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel3
  - number: 3.1.b
    text: geestelijke bedienaar is.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het voortduren van de inburgeringsplicht in geval van
      tijdelijke beëindiging van de in het eerste lid bedoelde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het tijdelijke doel, bedoeld in
      het eerste lid, waarbij zo veel mogelijk wordt aangesloten bij het verblijfsrecht van tijdelijke aard, bedoeld in
      [artikel 21, eerste lid, onderdeel f, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel21
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '21'
  - number: '4.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën Nederlanders worden aangewezen die eveneens
      inburgeringsplichtig zijn. Bij die algemene maatregel van bestuur kunnen regels worden gesteld, waarbij ten gunste
      van deze Nederlanders kan worden afgeweken van deze wet.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd, tenzij binnen die
      termijn door of namens een der kamers de wens te kennen wordt gegeven dat de voordracht niet wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Na plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur, dan
      wel nadat een der kamers der Staten-Generaal de wens te kennen heeft gegeven dat de voordracht, bedoeld in het
      tweede lid niet wordt gedaan, wordt een voorstel van wet tot wijziging van deze wet zo spoedig mogelijk bij de
      Staten-Generaal ingediend.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van de [artikelen 3][ref1] en [4][ref2] is niet inburgeringsplichtig degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel4
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.a
    text: jonger dan 16 jaar is dan wel 65 jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.1.b
    text: ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.1.c
    text: |-
      beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.1.d
    text: volledig leerplichtig is;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.1.e
    text: |-
      aansluitend op de volledige leerplicht een opleiding volgt waarvan de afronding leidt tot uitreiking van een
      krachtens onderdeel c aangewezen diploma, certificaat of ander document;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.1.f
    text: |-
      heeft aangetoond te beschikken over voldoende mondelinge en schriftelijke vaardigheden in de Nederlandse taal en
      evidente kennis van de Nederlandse samenleving.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: '5.2'
    text: 'Evenmin is inburgeringsplichtig:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.2.a
    text: |-
      de vreemdeling die onderdaan is van een lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.2.b
    text: |-
      de Nederlander die door de uitoefening van het recht van Unieburgers op vrij verkeer binnen de Europese Unie of de
      Europese Economische Ruimte inburgeringsplichtig zou zijn geworden;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.2.c
    text: |-
      het familielid van de persoon, bedoeld in de onderdelen a en b, dat onderdaan is van een derde staat en dat uit
      hoofde van [richtlijn 2004/38/EG](32004L0038), de Overeenkomst betreffende de Europese Economische Ruimte dan
      wel de Overeenkomst tussen de Europese Gemeenschappen en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat,
      anderzijds, over het vrije verkeer van personen, gerechtigd is Nederland binnen te komen en er te verblijven;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.2.d
    text: |-
      de vreemdeling die ingevolge de wetgeving van een lidstaat van de Europese Unie of een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte heeft voldaan aan een inburgeringsvereiste om de
      status van langdurig ingezetene in de zin van [richtlijn 2003/109/EG](32003L0109) van 25 november 2003 betreffende
      de status van langdurig ingezeten onderdanen van derde landen (PbEU L 16) te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.2.e
    text: |-
      de persoon die anderszins op grond van bepalingen van verdragen of besluiten van volkenrechtelijke organisaties
      geen inburgeringsplicht als bedoeld in [artikel 7][ref1] kan worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      De inburgeringsplichtige die beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen diploma,
      certificaat of ander document, waaruit blijkt dat hij reeds beschikt over een deel van de vaardigheden en kennis,
      bedoeld in [artikel 7][ref1], is vrijgesteld van de verplichting om dat deel van die kennis of vaardigheden te
      verwerven en het betreffende deel van het inburgeringsexamen te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '5.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.4.a
    text: verdere gehele of gedeeltelijke vrijstelling van de inburgeringsplicht;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.4.b
    text: het verblijf, bedoeld in het eerste lid, onderdeel b, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: 5.4.c
    text: de toepassing van het eerste lid, onderdeel f.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: '5.5'
    text: Onze Minister kan beleidsregels vaststellen omtrent de toepassing van het tweede lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het college ontheft de inburgeringsplichtige van de inburgeringsplicht, indien die inburgeringsplichtige heeft
      aangetoond door een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap, blijvend niet in
      staat te zijn het inburgeringsexamen te behalen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel6
  - number: '6.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden voorzien in:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel6
  - number: 6.2.a
    text: verdere ontheffing van de inburgeringsplicht, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel6
  - number: 6.2.b
    text: nadere regels omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel6
  - number: '7.1'
    text: |-
      De inburgeringsplichtige verwerft mondelinge en schriftelijke vaardigheden in de Nederlandse taal en kennis van de
      Nederlandse samenleving. Hij draagt er zorg voor dat hij het inburgeringsexamen behaalt:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel7
  - number: 7.1.a
    text: |-
      binnen drieënhalf jaar, indien hij het op grond van [artikel 16 van de Vreemdelingenwet 2000][ref1] vastgestelde
      basisexamen inburgering heeft behaald;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 7.1.b
    text: |-
      in de overige gevallen binnen vijf jaar, welke termijn voor de oudkomer niet aanvangt dan nadat het college zulks
      ten aanzien van hem op grond van [artikel 26][ref1] heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel26
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '7.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel7
  - number: 7.2.a
    text: |-
      het niveau van de kennis en vaardigheden, bedoeld in het eerste lid, waarbij voor verschillende categorieën
      inburgeringsplichtigen verschillende niveaus kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel7
  - number: 7.2.b
    text: de verlenging van de termijnen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel7
  - number: '8'
    text: |-
      De gemeenteraad stelt bij verordening regels over de informatieverstrekking door de gemeente aan
      inburgeringsplichtigen, ter zake van hun rechten en plichten uit hoofde van deze wet, alsmede van het aanbod van en
      de toegang tot inburgeringsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte van een certificaat
      aan een rechtspersoon die in het kader van de uitoefening van beroep of bedrijf werkzaamheden verricht gericht op
      het toeleiden van inburgeringsplichtigen naar het inburgeringsexamen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister dan wel een door Onze Minister op grond van [artikel 10][ref1] aangewezen instelling beslist op
      aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '9.3'
    text: |-
      Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
  - number: '9.4'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
  - number: 9.4.a
    text: de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
  - number: 9.4.b
    text: |-
      de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een afgegeven
      certificaat kan worden verlengd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
  - number: 9.4.c
    text: de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan op aanvraag een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 9, tweede lid][ref1], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel9
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '9'
        hoofdstuk: '3'
  - number: '10.2'
    text: Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
  - number: '10.3'
    text: |-
      Een krachtens dit artikel aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voorzover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
  - number: '10.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden voor:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
  - number: 10.4.a
    text: de gronden waarop de in het eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
  - number: 10.4.b
    text: het opstellen van een verslag van werkzaamheden ten behoeve van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
  - number: 10.4.c
    text: het toezicht op de instelling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan de krachtens [artikel 10][ref1] aangewezen instelling aanwijzingen geven met betrekking tot de
      uitoefening van haar taken. Hij treedt daarbij niet in individuele gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      De krachtens [artikel 10][ref1] aangewezen instelling is gehouden overeenkomstig de aanwijzing, bedoeld in het
      eerste lid, te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.1'
    text: |-
      Indien naar het oordeel van Onze Minister de krachtens [artikel 10][ref1] aangewezen instelling zijn taak ernstig
      verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de krachtens
      [artikel 10][ref1] aangewezen instelling in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog haar taak naar behoren uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.3'
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel12
  - number: '13.1'
    text: Onze Minister stelt het inburgeringsexamen vast.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het inburgeringsexamen omvat een onderzoek naar de kennis en vaardigheden die de inburgeringsplichtige ingevolge
      [artikel 7][ref1] moet hebben verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '13.3'
    text: Het inburgeringsexamen bestaat uit een centraal deel en een praktijkdeel.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: '13.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het inburgeringsexamen. Daarbij
      worden in ieder geval regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: 13.4.a
    text: de terzake van het inburgeringsexamen verschuldigde kosten;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: 13.4.b
    text: de identificatie van de persoon die aan het inburgeringsexamen deelneemt;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: 13.4.c
    text: de inhoud van het inburgeringsexamen;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: 13.4.d
    text: de examencommissie;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: 13.4.e
    text: het beroep tegen de uitslag van het praktijkdeel van het inburgeringsexamen, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: 13.4.f
    text: het diploma.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel13
  - number: '14.1'
    text: 'Het inburgeringsexamen is behaald, indien:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel14
  - number: 14.1.a
    text: alle daartoe behorende examens met goed gevolg zijn afgelegd, of
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel14
  - number: 14.1.b
    text: ingeval van gedeeltelijke vrijstelling, de overige daartoe behorende examens met goed gevolg zijn afgelegd.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel14
  - number: '14.2'
    text: Ten bewijze dat het inburgeringsexamen is behaald, wordt een diploma uitgereikt.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel14
  - number: '14.3'
    text: Bij regeling van Onze Minister wordt het model van het diploma vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel14
  - number: '14.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de geldigheidsduur van de
      uitslagen van de tot het inburgeringsexamen behorende examens.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het praktijkdeel van het inburgeringsexamen wordt afgenomen door de IB-Groep en de door een door Onze Minister aan
      te wijzen instantie aangewezen exameninstellingen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: '15.2'
    text: De IB-Groep neemt het centrale deel van het inburgeringsexamen af.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: '15.3'
    text: Aan een aanwijzing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: '15.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: 15.4.a
    text: de eisen waaraan de exameninstelling moet voldoen;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: 15.4.b
    text: de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: 15.4.c
    text: de gronden waarop aanwijzing kan worden geweigerd, geschorst en ingetrokken;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: 15.4.d
    text: de terzake van de aanwijzing verschuldigde kosten en de betaling daarvan, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: 15.4.e
    text: |-
      de door de exameninstelling aan Onze Minister, aan gemeenten en aan anderen die betrokken zijn bij de uitvoering
      van deze wet te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: '15.5'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het vierde lid, kan worden bepaald dat het praktijkdeel van
      het inburgeringsexamen of een onderdeel daarvan, in afwijking van het eerste lid, wordt afgenomen door een bij
      of krachtens die algemene maatregel van bestuur aangewezen exameninstelling, indien de kandidaat een geestelijk
      bedienaar is.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: '15.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het toezicht op de exameninstellingen
      door een onafhankelijke instantie.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      De IB-Groep verstrekt op aanvraag een lening aan de inburgeringsplichtige indien is voldaan aan bij of krachtens
      algemene maatregel van bestuur te stellen regels omtrent de voorwaarden waaronder en de wijze waarop de lening
      wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het bedrag van de lening wordt betaald aan de door de inburgeringsplichtige aangewezen cursusinstelling en
      exameninstelling.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      De inburgeringsplichtige of gewezen inburgeringsplichtige betaalt de lening vermeerderd met de volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels berekende rente terug.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: '16.4'
    text: 'Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden tevens regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: 16.4.a
    text: de hoogte van de lening;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: 16.4.b
    text: de betaling en de terugbetaling van de lening, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: 16.4.c
    text: kwijtschelding.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
  - number: '16.5'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent het verstrekken van een lening aan een inburgeringsplichtige ten behoeve van het verwerven van kennis en
      vaardigheden op een hoger niveau dan is vastgesteld op grond van [artikel 7, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '17.1'
    text: |-
      De terugbetalingsperiode vangt niet eerder aan dan zes maanden nadat drie jaar zijn verstreken sedert de
      verstrekking van de lening of, indien dat eerder is, zes maanden nadat het inburgeringsexamen is behaald.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel17
  - number: '17.2'
    text: De IB-Groep kan het terug te betalen bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel17
  - number: '17.3'
    text: |-
      Indien de lening wordt kwijtgescholden, gaat de over het kwijtgescholden bedrag opgebouwde rente op het tijdstip
      van kwijtschelding teniet.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel17
  - number: '18.1'
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels verstrekt de IB-Groep een
      vergoeding aan de gewezen inburgeringsplichtige die binnen drie jaar het inburgeringsexamen heeft behaald.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      Voor de oudkomer vangt de termijn, bedoeld in het eerste lid, niet aan, dan nadat het college zulks ten aanzien van
      hem op grond van [artikel 26][ref1] heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel26
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '18.3'
    text: 'Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden tevens regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: 18.3.a
    text: de criteria voor het verstrekken van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: 18.3.b
    text: de aanvraag van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: 18.3.c
    text: de wijze waarop het bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: 18.3.d
    text: de vaststelling van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: 18.3.e
    text: de betaling,
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: 18.3.f
    text: |-
      de verrekening met de lening, bedoeld in [artikel 16][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel16
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '16'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 18.3.g
    text: de verlenging van de termijn van drie jaar, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
  - number: '18.4'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent het verstrekken van een vergoeding aan de gewezen inburgeringsplichtige die kennis en vaardigheden heeft
      verworven op een hoger niveau dan is vastgesteld op grond van [artikel 7, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '19.1'
    text: 'Het college kan een inburgeringsvoorziening aanbieden aan de inburgeringsplichtige die:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: 19.1.a
    text: |-
      algemene bijstand of een uitkering op grond van een van de bij algemene maatregel van bestuur aan te wijzen
      socialezekerheidswetten of socialezekerheidsregelingen ontvangt, of
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: 19.1.b
    text: oudkomer is, en zelf geen inkomsten uit tegenwoordige arbeid, algemene bijstand of uitkering geniet.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: '19.2'
    text: 'Het college biedt in ieder geval een inburgeringsvoorziening aan aan de inburgeringsplichtige die:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: 19.2.a
    text: |-
      houder is van een verblijfsvergunning als bedoeld in [artikel 28][ref1] of [33 van de Vreemdelingenwet 2000][ref2],
      dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 19.2.b
    text: geestelijke bedienaar is.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: '19.3'
    text: |-
      Een inburgeringsvoorziening leidt toe naar het inburgeringsexamen en omvat het eenmaal kosteloos afleggen van het
      examen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: '19.4'
    text: |-
      Een aanbod wordt niet gedaan aan de inburgeringsplichtige, bedoeld in het eerste lid, onderdeel a, indien dat diens
      arbeidsinschakeling belemmert.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: '19.5'
    text: |-
      De gemeenteraad stelt bij verordening regels met betrekking tot het eerste, tweede en derde lid. Deze regels hebben
      in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: 19.5.a
    text: |-
      de procedure die door het college wordt gevolgd voor het doen van een aanbod aan de inburgeringsplichtigen, bedoeld
      in het eerste lid, en de criteria die daarbij worden gehanteerd, en
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: 19.5.b
    text: |-
      de vaststelling door het college van een passende inburgeringsvoorziening, met inbegrip van de totstandkoming en de
      samenstelling van de inburgeringsvoorziening.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
  - number: '19.6'
    text: |-
      Voor de inburgeringsplichtige die houder is van een verblijfsvergunning als bedoeld in [artikel 28][ref1]
      of [33 van de Vreemdelingenwet 2000][ref2] maakt maatschappelijke begeleiding onderdeel uit van de
      inburgeringsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: '20.1'
    text: |-
      Een aanbod voor een inburgeringsvoorziening aan de inburgeringsplichtige, bedoeld in
      [artikel 19, eerste lid, onderdeel a][ref1], die tevens verplicht is om arbeid te verkrijgen en te aanvaarden,
      wordt uitsluitend gedaan in combinatie met een op grond van de [Wet werk en bijstand][ref2], dan wel een van
      de bij de algemene maatregel van bestuur, bedoeld in [artikel 19, eerste lid, onderdeel a][ref3], aan te wijzen
      socialezekerheidswetten of socialezekerheidsregelingen, aangeboden voorziening gericht op arbeidsinschakeling.
      Binnen een gecombineerde voorziening kunnen onderdelen volgtijdelijk worden ingezet.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel19
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '20.2'
    text: Het college is verantwoordelijk voor het aanbieden van een gecombineerde voorziening als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het college, het Uitvoeringsinstituut werknemersverzekeringen of de door hem aangewezen deskundige, de
      desbetreffende eigenrisicodrager, de desbetreffende overheidswerkgever en de Centrale organisatie werk en inkomen
      werken samen bij de uitvoering van [artikel 19, eerste lid, onderdeel a][ref1], [artikel 20, eerste lid][ref2],
      en [artikel 22][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel22
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Het college, het Uitvoeringsinstituut werknemersverzekeringen, de desbetreffende eigenrisicodrager en de
      desbetreffende overheidswerkgever maken in ieder geval afspraken met betrekking tot de inkoop van een gecombineerde
      voorziening als bedoeld in [artikel 20, eerste lid][ref1], de wijze waarop die voorziening feitelijk wordt
      aangeboden en de onderlinge gegevensuitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel20
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Het college stelt de inburgeringsvoorziening vast, nadat de inburgeringsplichtige een door het college aangeboden
      inburgeringsvoorziening heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien de beschikking, bedoeld in het eerste lid, betrekking heeft op een oudkomer, geeft het college daarin tevens
      toepassing aan [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel26
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '23.1'
    text: De inburgeringsplichtige verleent medewerking aan de uitvoering van de inburgeringsvoorziening.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel23
  - number: '23.2'
    text: |-
      De inburgeringsplichtige voor wie een inburgeringsvoorziening is vastgesteld, is een eigen bijdrage verschuldigd
      van € 270, welk bedrag bij algemene maatregel van bestuur kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel23
  - number: '23.3'
    text: |-
      De gemeenteraad stelt bij verordening regels over de rechten en plichten van de inburgeringsplichtige voor wie
      een inburgeringsvoorziening is vastgesteld. Deze regels hebben in ieder geval betrekking op de inning van de eigen
      bijdrage door het college en de mogelijkheid van betaling in termijnen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien de inburgeringsplichtige, voor wie een inburgeringsvoorziening is vastgesteld, op grond van
      [artikel 27 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] wordt ingeschreven in een andere
      gemeente, wordt de inburgeringsvoorziening voortgezet, tenzij het college van de andere gemeente binnen zes weken
      na die inschrijving te kennen heeft gegeven dat de inburgeringsvoorziening vervalt. In dat geval biedt hij de
      inburgeringsplichtige een gelijkwaardig inburgeringsalternatief aan.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel27
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '27'
  - number: '23.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het inburgeringsalternatief, bedoeld
      in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager kunnen de eigen
      bijdrage, bedoeld in [artikel 23, tweede lid][ref1], verrekenen met algemene bijstand of verrekenen met
      dan wel inhouden op een uitkering op grond van een van de bij de algemene maatregel van bestuur, bedoeld in
      [artikel 19, eerste lid, onderdeel a][ref2], aan te wijzen socialezekerheidswetten of socialezekerheidsregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel19
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Indien degene die de eigen bijdrage verschuldigd is een uitkering ontvangt op grond van een van de
      socialezekerheidswetten of socialezekerheidsregelingen, bedoeld in het eerste lid, die wordt uitgevoerd door
      het Uitvoeringsinstituut werknemersverzekeringen of de eigenrisicodrager, betaalt het Uitvoeringsinstituut
      werknemersverzekeringen of de eigenrisicodrager desgevraagd aan het college het bedrag van die bijdrage.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager zijn niet bevoegd tot
      verrekening dan wel inhouding voorzover beslag op hun vordering nietig zou zijn.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel24
  - number: '24.4'
    text: Het college kan de eigen bijdrage bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het college kan de inburgeringsplichtige oproepen om te verschijnen en gegevens te verstrekken om toepassing te
      geven aan de [artikelen 19][ref1] en [26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel26
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '26'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Het college kan een persoon ten aanzien van wie het op redelijke gronden kan vermoeden dat deze
      inburgeringsplichtig is, oproepen om te verschijnen en gegevens te verstrekken die voor diens
      inburgeringsplichtigheid van belang zijn.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
  - number: '25.3'
    text: 'De in het tweede lid bedoelde gegevens kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
  - number: 25.3.a
    text: het doel van het verblijf in Nederland;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
  - number: 25.3.b
    text: verblijf in Nederland tijdens de leerplichtige leeftijd;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
  - number: 25.3.c
    text: |-
      het bezit van diploma's, certificaten of andere documenten als bedoeld in
      [artikel 5, eerste lid, onderdeel c, en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
        hoofdstuk: '2'
  - number: 25.3.d
    text: |-
      het aansluitend op de volledige leerplicht volgen van een opleiding waarvan de afronding leidt tot uitreiking van
      een diploma, certificaat of ander document als bedoeld in [artikel 5, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
        hoofdstuk: '2'
  - number: 25.3.e
    text: het verrichten van arbeid als geestelijke bedienaar;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
  - number: 25.3.f
    text: |-
      de toepasselijkheid van een verdrag of besluit als bedoeld in [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
        hoofdstuk: '2'
  - number: 25.3.g
    text: |-
      feiten of omstandigheden die op grond van [artikel 5, vierde lid, onderdeel a][ref1], kunnen leiden tot gehele of
      gedeeltelijke vrijstelling van de inburgeringsplicht;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
        hoofdstuk: '2'
  - number: 25.3.h
    text: |-
      de aanwezigheid van een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap als bedoeld in
      [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
        hoofdstuk: '2'
  - number: 25.3.i
    text: |-
      feiten of omstandigheden die op grond van [artikel 6, tweede lid, onderdeel a][ref1], kunnen leiden tot ontheffing
      van de inburgeringsplicht;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel6
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '6'
        hoofdstuk: '2'
  - number: 25.3.j
    text: |-
      de bij de algemene maatregel van bestuur, bedoeld in [artikel 4][ref1], genoemde feiten of omstandigheden die voor
      de inburgeringsplicht van de in die algemene maatregel van bestuur genoemde categorieën Nederlanders van belang
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel4
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '4'
        hoofdstuk: '2'
  - number: '25.4'
    text: |-
      De in het eerste en tweede lid bedoelde persoon geeft gehoor aan de oproep en verleent medewerking aan het
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel25
  - number: '26'
    text: |-
      Het college bepaalt voor de oudkomer de dag waarop de in de [artikelen 7, eerste lid, onderdeel b][ref1], en
      [18, eerste lid][ref2], bedoelde termijnen aanvangen. De termijnen vangen op dezelfde dag aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel18
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '27'
    text: |-
      Het college stelt de identiteit van de krachtens [artikel 25][ref1] opgeroepen personen vast aan de hand van een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het oproepen van
      personen krachtens [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel25
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '29'
    text: |-
      Het college legt een bestuurlijke boete op indien de krachtens [artikel 25, eerste of tweede lid][ref1], opgeroepen
      persoon handelt in strijd met [artikel 25, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel25
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '30'
    text: |-
      Het college legt een bestuurlijke boete op indien de inburgeringsplichtige ten aanzien van wie een beschikking als
      bedoeld in [artikel 22, eerste lid][ref1], is gegeven, handelt in strijd met [artikel 23, eerste lid][ref2], dan
      wel met de krachtens [artikel 23, derde lid][ref3], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel23
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '31.1'
    text: |-
      Het college legt de inburgeringsplichtige die niet binnen de in [artikel 7, eerste lid][ref1], bedoelde termijn of
      de op grond van het tweede lid, aanhef en onderdeel a, verlengde termijn, het inburgeringsexamen heeft behaald, een
      bestuurlijke boete op.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: '31.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel31
  - number: 31.2.a
    text: |-
      verlengt het college de in [artikel 7, eerste lid][ref1], bedoelde termijn, indien de inburgeringsplichtige
      aannemelijk maakt dat hem geen verwijt treft terzake van het niet behalen van het inburgeringsexamen, of


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: 31.2.b
    text: |-
      verleent het college ontheffing van de inburgeringsplicht, indien het college op grond van door de
      inburgeringsplichtige aantoonbaar geleverde inspanningen tot het oordeel komt dat het voor hem redelijkerwijs niet
      mogelijk is het inburgeringsexamen te behalen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel31
  - number: '31.3'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel31
  - number: '32'
    text: |-
      Het college stelt in de boetebeschikking, bedoeld in [artikel 31, eerste lid][ref1], een nieuwe termijn van ten
      hoogste twee jaren waarbinnen de inburgeringsplichtige na het bekendmaken van de boetebeschikking alsnog het
      inburgeringsexamen moet behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel31
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '33.1'
    text: |-
      Het college legt de inburgeringsplichtige die binnen de krachtens [artikel 32][ref1] vastgestelde termijn het
      inburgeringsexamen niet heeft behaald, een bestuurlijke boete op. [Artikel 31, tweede en derde lid][ref2], en
      [artikel 32][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel32
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '33.2'
    text: |-
      Zolang de inburgeringsplichtige na het verstrijken van de krachtens het eerste lid gestelde termijn het
      inburgeringsexamen nog steeds niet heeft behaald, legt het college iedere twee jaar een bestuurlijke boete op.
      [Artikel 31, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel31
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '34'
    text: 'De bestuurlijke boete kan niet hoger zijn dan:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel34
  - number: 34.a
    text: |-
      € 250 voor het handelen in strijd met [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel25
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 34.b
    text: |-
      € 500 voor het handelen in strijd met [artikel 23, eerste lid][ref1], of de krachtens
      [artikel 23, derde lid][ref2], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel23
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 34.c
    text: |-
      € 500 voor het niet naleven van [artikel 7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
  - number: 34.d
    text: |-
      € 1000 voor het niet behalen van het inburgeringsexamen binnen de bij of krachtens de [artikelen 32][ref1] en
      [33][ref2] gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '32'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '35'
    text: |-
      De gemeenteraad stelt bij verordening het bedrag vast van de bestuurlijke boete die voor de verschillende
      overtredingen kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel35
  - number: '36.1'
    text: |-
      Degene die wordt verhoord met het oog op het opleggen van een bestuurlijke boete, is niet verplicht ten behoeve
      daarvan verklaringen af te leggen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel36
  - number: '36.2'
    text: Voor het verhoor wordt aan de betrokkene medegedeeld dat hij niet verplicht is tot antwoorden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel36
  - number: '37'
    text: |-
      Het college legt geen bestuurlijke boete op indien voor dezelfde gedraging de bijstand kan worden verlaagd op grond
      van [artikel 18, tweede lid, van de Wet werk en bijstand][ref1], dan wel indien voor dezelfde gedraging een boete
      of maatregel kan of moet worden opgelegd op grond van een van de bij de algemene maatregel van bestuur, bedoeld in
      [artikel 19, eerste lid, onderdeel a][ref2], aan te wijzen socialezekerheidswetten of socialezekerheidsregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel19
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '38.1'
    text: Het college legt geen bestuurlijke boete op voorzover de overtreding niet aan de overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel38
  - number: '38.2'
    text: |-
      Het college stemt de bestuurlijke boete af op de ernst van de overtreding en de mate waarin deze aan de overtreder
      kan worden verweten. Het college houdt daarbij zo nodig rekening met de omstandigheden waaronder de overtreding
      is gepleegd.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel38
  - number: '39.1'
    text: De bestuurlijke boete wordt bij beschikking opgelegd.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel39
  - number: '39.2'
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel39
  - number: 39.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel39
  - number: 39.2.b
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel39
  - number: 39.2.c
    text: het feit ter zake waarvan de boete wordt opgelegd alsmede het overtreden wettelijke voorschrift;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel39
  - number: 39.2.d
    text: de termijn waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel39
  - number: '40.1'
    text: |-
      Het college stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop het opleggen van de bestuurlijke
      boete, dan wel het voornemen daartoe, berust, in te zien en daarvan afschriften te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel40
  - number: '40.2'
    text: |-
      Het college draagt zorg voor bijstand door een tolk, indien blijkt dat de verdediging van de overtreder dit
      redelijkerwijs vergt.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel40
  - number: '41.1'
    text: |-
      Het college maakt van de in de [artikelen 30][ref1], [31][ref2] en [33][ref3] bedoelde overtredingen binnen vier
      weken een rapport op. Dit rapport is gedagtekend en vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '30'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 41.1.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
  - number: 41.1.b
    text: de overtreding;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
  - number: 41.1.c
    text: het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
  - number: 41.1.d
    text: de hoogte van de op de overtreding ten hoogste gestelde boete.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
  - number: '41.2'
    text: |-
      Het college beslist binnen dertien weken na de dagtekening van het in het eerste lid bedoelde rapport omtrent het
      opleggen van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
  - number: '41.3'
    text: |-
      Mandaat tot het opleggen van een bestuurlijke boete wordt niet verleend aan degene die van de overtreding een
      rapport opgemaakt heeft.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel41
  - number: '42.1'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het college de overtreder van de
      in de [artikelen 30][ref2], [31][ref3] en [33][ref4] bedoelde feiten steeds in de gelegenheid zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '30'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '42.2'
    text: |-
      Het in [artikel 41][ref1] bedoelde rapport wordt bij de uitnodiging daartoe aan de overtreder toegezonden of
      uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel41
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '41'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '42.3'
    text: |-
      Het college zorgt voorts voor bijstand door een tolk, indien blijkt dat de verdediging van de overtreder dit
      redelijkerwijs vergt.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel42
  - number: '42.4'
    text: |-
      Indien het college nadat de overtreder zijn zienswijze naar voren heeft gebracht, beslist dat voor de overtreding
      geen boete zal worden opgelegd, wordt dit schriftelijk aan de overtreder medegedeeld.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel42
  - number: '43.1'
    text: Het college legt geen boete op indien de overtreder is overleden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
  - number: '43.2'
    text: |-
      Een bestuurlijke boete vervalt indien zij op het tijdstip van het overlijden van de overtreder niet onherroepelijk
      is. Een onherroepelijke bestuurlijke boete vervalt voorzover zij op dat tijdstip nog niet is betaald.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
  - number: '43.3'
    text: 'Het college legt geen bestuurlijke boete op:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
  - number: 43.3.a
    text: indien aan de overtreder wegens dezelfde overtreding reeds eerder een bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
  - number: 43.3.b
    text: voorzover voor de overtreding een rechtvaardigingsgrond bestond.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
  - number: '43.4'
    text: |-
      De bevoegdheid tot het opleggen van een boete als bedoeld in de [artikelen 30][ref1], [31][ref2] en [33][ref3]
      vervalt vijf jaren nadat de overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '30'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '43.5'
    text: |-
      De bevoegdheid tot het opleggen van een boete als bedoeld in [artikel 29][ref1] vervalt twee jaren nadat de
      overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel29
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '43.6'
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel43
  - number: '44.1'
    text: |-
      Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager kunnen de bestuurlijke
      boete verrekenen met algemene bijstand of verrekenen met dan wel inhouden op een uitkering op grond van een van
      de bij de algemene maatregel van bestuur, bedoeld in [artikel 19, eerste lid, onderdeel a][ref1], aan te wijzen
      socialezekerheidswetten of socialezekerheidsregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel19
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '44.2'
    text: |-
      Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van een van de socialezekerheidswetten
      of socialezekerheidsregelingen, bedoeld in het eerste lid, die wordt uitgevoerd door het Uitvoeringsinstituut
      werknemersverzekeringen of de eigenrisicodrager, betaalt het Uitvoeringsinstituut werknemersverzekeringen of de
      eigenrisicodrager desgevraagd aan het college het bedrag van de boete.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel44
  - number: '44.3'
    text: |-
      Het college, het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager zijn niet bevoegd tot
      verrekening dan wel inhouding voorzover beslag op hun vordering nietig zou zijn.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel44
  - number: '45.1'
    text: |-
      Indien de boete niet is betaald binnen de op grond van [artikel 39, tweede lid, onderdeel d][ref1], gestelde
      termijn, wordt de overtreder schriftelijk aangemaand binnen twee weken alsnog het bedrag van de boete, verhoogd met
      de kosten van de aanmaning, te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel39
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '39'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '45.2'
    text: |-
      Bij gebreke van betaling kan het college de boete, verhoogd met de op de aanmaning en invordering betrekking
      hebbende kosten, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel45
  - number: '45.3'
    text: |-
      De bevoegdheid tot invordering vervalt binnen vijf jaren nadat de beschikking inzake oplegging van de boete
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel45
  - number: '46.1'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '46.2'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      gemeente. Het verzet schorst de tenuitvoerlegging. Op verzoek van de gemeente kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel46
  - number: '46.3'
    text: De boete komt ten goede aan de gemeente.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel46
  - number: '47.1'
    text: |-
      Er is een Informatiesysteem Inburgering, beheerd door de IB-Groep. Dit systeem bevat een systematisch geordende
      verzameling van gegevens die van belang zijn met betrekking tot de inburgering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel47
  - number: '47.2'
    text: 'Het Informatiesysteem Inburgering heeft tot doel de verstrekking:'
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel47
  - number: 47.2.a
    text: |-
      aan het college, de IB-Groep en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen
      uitvoerende instanties van gegevens die van belang zijn voor de uitvoering van deze wet;
    url: https://wetten.overheid.nl/BWBR0020611/2007-01-01#Artikel47
  - number: 47.2.b
    text: |-
      aan Onze Minister van gegevens die van belang zijn voor de uitvoering van de [artikelen 16a][ref1], [21][ref2]
      en [34 van de Vreemdelingenwet 2000][ref3], voor de beoordeling van een verzoek tot verkrijging van het
      Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref4] en voor de bekostiging, bedoeld in de
      [artikelen 10, zevende lid][ref5], en [14, vierde lid, van de Wet verzelfstandiging Informatiseringsbank][ref6]
      en [artikel 52][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0003738
      [ref5]: https://wetten.overheid.nl/BWBR0006320#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0006320#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0020611#Artikel52
