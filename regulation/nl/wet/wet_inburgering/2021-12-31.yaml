    text: |-
      1 Er is een Informatiesysteem Inburgering, beheerd door Onze Minister. Dit systeem bevat een systematisch geordende
      verzameling van gegevens die noodzakelijk zijn met betrekking tot de inburgering op grond van deze wet.

      2 Het Informatiesysteem Inburgering heeft tot doel de verstrekking:

      a. aan Onze Minister, het college en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen
      uitvoerende instanties van gegevens die noodzakelijk zijn voor de uitvoering van deze wet;

      b. aan Onze Minister van gegevens met het oog op de evaluatie van bestaand beleid en de voorbereiding van
      toekomstig beleid;

      c. aan Onze Minister van Veiligheid en Justitie van de gegevens die noodzakelijk zijn voor de beoordeling van een
      verzoek tot verkrijging van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref1];

      d. aan Onze Minister van Onderwijs, Cultuur en Wetenschap van de gegevens over diploma’s
      voor het inburgeringsexamen ten behoeve van het register onderwijsdeelnemers, bedoeld in
      [artikel 4 van de Wet register onderwijsdeelnemers][ref2];

      e. aan Onze Minister van Veiligheid en Justitie van de gegevens die noodzakelijk zijn voor de uitvoering van de
      [artikelen 16a][ref3], [18][ref4], [19][ref5], [21][ref6] en [34 van de Vreemdelingenwet 2000][ref7];

      f. aan de rijksbelastingdienst van de gegevens die noodzakelijk zijn voor de uitvoering van
      [artikel 1.6, eerste lid, onderdeel g, van de Wet kinderopvang][ref8].

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het Informatiesysteem Inburgering.
      Daarbij worden in ieder geval regels gesteld met betrekking tot de in het Informatiesysteem Inburgering op te nemen
      gegevens en de verwerking van die gegevens.


