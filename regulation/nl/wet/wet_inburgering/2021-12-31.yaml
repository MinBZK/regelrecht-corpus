  - number: '49'
    text: |-
      Onze Minister, het college en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen instanties
      nemen in de registratie, die zij voor de uitvoering van deze wet aanleggen, het burgerservicenummer van de
      geregistreerde op.
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel49
  - number: '50'
    text: |-
      1 Bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] kunnen door Onze Minister, het
      college en een of meer bij of krachtens algemene maatregel van bestuur aan te wijzen instanties worden verwerkt,
      voorzover deze gegevens noodzakelijk zijn voor de doelmatige en doeltreffende uitvoering van deze wet.

      2 Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij
      wordt in ieder geval geregeld:

      a. op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;

      b. op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;

      c. welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;

      d. op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel
      waarvoor ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt
      toegezien.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '67'
    text: |-
      Op rijksbijdragen die op grond van de [Wet inburgering nieuwkomers][ref1] zijn verstrekt ten behoeve van tijdvakken
      voorafgaand aan de inwerkingtreding van deze wet, blijft het recht zoals dat voor het desbetreffende tijdvak gold
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '71'
    text: |-
      Onze Minister zendt binnen vier jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel71
  - number: '72'
    text: |-
      De [Wet inburgering nieuwkomers][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '73'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit kan worden bepaald dat
      [artikel 65][ref1] terugwerkt tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '65'
        hoofdstuk: '11'
  - number: '74'
    text: 'Deze wet wordt aangehaald als: Wet inburgering.'
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel74
