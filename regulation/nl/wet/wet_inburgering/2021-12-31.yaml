  - number: '31'
    text: |-
      1 Onze Minister legt een bestuurlijke boete op aan de inburgeringsplichtige die de onderdelen van het
      inburgeringsexamen, bedoeld in [artikel 7, tweede lid, onderdelen b en c][ref1], niet binnen de in
      [artikel 7b, eerste lid][ref2], genoemde termijn, of de met toepassing van artikel 7b, derde lid, of van de
      krachtens [artikel 8, eerste lid, aanhef en onderdeel a][ref3], gestelde regels verlengde termijn, heeft behaald.

      2 In afwijking van het eerste lid, legt Onze Minister geen boete op, indien bij of krachtens
      [artikel 18 van de Vreemdelingenwet 2000][ref4] de aanvraag tot het verlengen van de geldigheidsduur van de
      verblijfsvergunning voor bepaalde tijd wordt afgewezen dan wel bij of krachtens [artikel 19 van die wet][ref5] de
      verblijfsvergunning voor bepaalde tijd wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
