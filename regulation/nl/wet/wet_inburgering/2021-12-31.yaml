  - number: '8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de verdere verlenging van de termijnen, bedoeld in de [artikelen 7a, eerste lid][ref1], en
      [7b, eerste lid][ref2], en de toepassing van de artikelen 7a, derde lid, en 7b, derde lid;

      b. het afnemen van het inburgeringsexamen;

      c. de inhoud en vormgeving van het inburgeringsexamen;

      d. de ter zake van het inburgeringsexamen verschuldigde kosten;

      e. de identificatie van de persoon die aan het inburgeringsexamen deelneemt;

      f. de examencommissie, en

      g. het diploma.

      2 Bij ministeriële regeling wordt de tekst van de participatieverklaring vastgesteld. Het ontwerp van een regeling
      tot wijziging van de tekst van de participatieverklaring wordt aan beide kamers der Staten-Generaal overgelegd en
      wordt niet eerder vastgesteld dan vier weken na de overlegging van het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
