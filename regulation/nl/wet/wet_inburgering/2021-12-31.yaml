            value: $bewezen_inspanningen_niet_aan_onderdelen_bc
  - number: '7'
    text: |-
      1 De inburgeringsplichtige behaalt:

      a. het inburgeringsexamen, of

      b. een diploma, certificaat of ander document, bedoeld in [artikel 5, eerste lid, onderdeel c][ref1].

      2 Het inburgeringsexamen bestaat uit de volgende onderdelen:

      a. het participatieverklaringstraject;

      b. de examinering van mondelinge en schriftelijke vaardigheden in de Nederlandse taal op ten minste het niveau A2
      van het Europese Raamwerk voor Moderne Vreemde Talen, en

      c. de examinering van de kennis van de Nederlandse samenleving.

      3 Het college biedt het participatieverklaringstraject, bedoeld in het tweede lid, onderdeel a, aan.

      4 Onze Minister biedt de onderdelen van het inburgeringsexamen, bedoeld in het tweede lid, onderdelen b en c, aan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel7
