  - number: '34'
    text: |-
      De bestuurlijke boete kan niet hoger zijn dan:

      a. € 340 voor het niet naleven van [artikel 7a, eerste lid][ref1];

      b. € 340 voor het niet afronden van het participatieverklaringstraject, bedoeld in
      [artikel 7, tweede lid, onderdeel a][ref2], binnen de bij of krachtens de [artikelen 29][ref3] en [30][ref4]
      gestelde termijnen;

      c. € 1.250 voor het niet naleven van [artikel 7b, eerste lid][ref5];

      d. € 1.250 voor het niet behalen van de onderdelen van het inburgeringsexamen, bedoeld in
      [artikel 7, tweede lid, onderdelen b en c][ref6], binnen de bij of krachtens de [artikelen 32][ref7] en [33][ref8]
      gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref6]: https://wetten.overheid.nl/BWBR0020611#Artikel7
