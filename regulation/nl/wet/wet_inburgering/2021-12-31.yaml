  - number: '67'
    text: |-
      Op rijksbijdragen die op grond van de [Wet inburgering nieuwkomers][ref1] zijn verstrekt ten behoeve van tijdvakken
      voorafgaand aan de inwerkingtreding van deze wet, blijft het recht zoals dat voor het desbetreffende tijdvak gold
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '71'
    text: |-
      Onze Minister zendt binnen vier jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel71
  - number: '72'
    text: |-
      De [Wet inburgering nieuwkomers][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '73'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit kan worden bepaald dat
      [artikel 65][ref1] terugwerkt tot en met 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel65
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel73
    references:
