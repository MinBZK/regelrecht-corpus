              belemmering, dan wel een verstandelijke handicap, blijvend niet in staat te zijn
              het inburgeringsexamen te behalen (art. 6 lid 1)
          - name: bewezen_inspanningen_niet_aan_onderdelen_bc
            type: boolean
            required: true
            description: >-
