              van artikel 6, eerste lid
          - name: ontheven_van_examen_onderdelen_b_c
            type: boolean
            description: >-
              De Minister ontheft de inburgeringsplichtige van de onderdelen b en c van het
              inburgeringsexamen op grond van artikel 6, tweede lid
        actions:
