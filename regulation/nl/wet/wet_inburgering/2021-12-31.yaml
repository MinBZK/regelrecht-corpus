preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het huidige stelsel van inburgering in de Nederlandse
    samenleving te herzien door een algemene plicht tot inburgeren voor vreemdelingen en een plicht tot inburgering
    voor enkele categorieën Nederlanders te introduceren, alsmede het verstrekken van bepaalde verblijfsvergunningen
    afhankelijk te maken van het behalen van het inburgeringsexamen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. inburgeringsplichtige: de persoon die op grond van de [artikelen 3][ref1], [5][ref2] en [6][ref3]
      inburgeringsplichtig is;

      c. leerplichtige leeftijd: de leeftijd waarop bij verblijf in Nederland sprake is van een verplichting tot
      inschrijving als bedoeld in [artikel 3 van de Leerplichtwet 1969][ref4];

      d. inburgeringsplicht: de verplichting, bedoeld in [artikel 7][ref5], eerste lid;

      e. geestelijke bedienaar: de persoon die een geestelijk, godsdienstig of levensbeschouwelijk ambt bekleedt, arbeid
      verricht als geestelijk voorganger, godsdienstleraar of zendeling, dan wel ten behoeve van een kerkgenootschap of
      een ander genootschap op geestelijke of levensbeschouwelijke grondslag werkzaamheden van overwegend godsdienstige,
      geestelijke of levensbeschouwelijke aard verricht;

      f. inburgeringsexamen: het examen, bedoeld in [artikel 7, eerste lid, onderdeel a][ref6];

      g. burgerservicenummer: het als zodanig overeenkomstig de [Wet algemene bepalingen burgerservicenummer][ref7] aan
      een natuurlijke persoon toegekend nummer;

      h. kwalificatieplicht: de plicht tot inschrijving als bedoeld in
      [artikel 4a, eerste lid, van de Leerplichtwet 1969][ref8];

      i. college: het college van burgemeesters en wethouders van de gemeente waar de inburgeringsplichtige woonplaats
      heeft als bedoeld in de [artikelen 10, eerste lid][ref9], en [11 van Boek 1 van het Burgerlijk Wetboek][ref10].

      2 Bij regeling van Onze Minister kan de geestelijke bedienaar, bedoeld in het eerste lid, onderdeel e, nader worden
      omschreven.


