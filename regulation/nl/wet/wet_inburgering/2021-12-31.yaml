  - number: '5'
    text: |-
      1 In afwijking van [artikel 3][ref1] is niet inburgeringsplichtig degene die:

      a. jonger dan 16 jaar is dan wel de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt;

      b. ten minste acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven;

      c. beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen diploma, certificaat of ander
      document;

      d. leerplichtig of kwalificatieplichtig is;

      e. aansluitend op de leerplicht of kwalificatieplicht een opleiding volgt waarvan de afronding leidt tot uitreiking
      van een krachtens onderdeel c aangewezen diploma, certificaat of ander document.

      2 Evenmin is inburgeringsplichtig:

      a. de persoon die onderdaan is van een lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, of Zwitserland;

      b. het familielid van de persoon, bedoeld in onderdeel a, dat onderdaan is van een derde staat en dat uit
      hoofde van [richtlijn 2004/38/EG](32004L0038), de Overeenkomst betreffende de Europese Economische Ruimte dan
      wel de Overeenkomst tussen de Europese Gemeenschappen en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat,
      anderzijds, over het vrije verkeer van personen, gerechtigd is Nederland binnen te komen en er te verblijven;

      c. de vreemdeling die ingevolge de wetgeving van een lidstaat van de Europese Unie of een andere Staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte heeft voldaan aan een inburgeringsvereiste om de
      status van langdurig ingezetene in de zin van [richtlijn 2003/109/EG](32003L0109) van 25 november 2003 betreffende
      de status van langdurig ingezeten onderdanen van derde landen (PbEU L 16), gewijzigd door [richtlijn 2011/51]
      (32011L0051)/EU van het Europees Parlement en de Raad teneinde haar werkingssfeer uit te breiden tot personen die
      internationale bescherming genieten (PbEU 2011, L 132) te verkrijgen;

      d. de persoon die anderszins op grond van bepalingen van verdragen of besluiten van volkenrechtelijke organisaties
      geen inburgeringsplicht kan worden opgelegd.

      3 De inburgeringsplichtige die beschikt over een bij of krachtens algemene maatregel van bestuur aangewezen
      diploma, certificaat of ander document, waaruit blijkt dat hij reeds beschikt over een deel van de vaardigheden en
      kennis, bedoeld in [artikel 7, tweede lid, onderdelen b en c][ref3], is vrijgesteld van de verplichting om dat deel
      van die kennis of vaardigheden te verwerven.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. verdere gehele of gedeeltelijke vrijstelling van de inburgeringsplicht;

      b. het verblijf, bedoeld in het eerste lid, onderdeel b.

      5 Onze Minister kan beleidsregels vaststellen omtrent de toepassing van het tweede lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel7
