  - number: '2'
    text: |-
      Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn met betrekking tot de
      uitoefening, onderscheidenlijk de nakoming van de voor hem uit deze wet en de daarop berustende bepalingen
      voortvloeiende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel2
  - number: '3'
    text: |-
      1 Inburgeringsplichtig is de vreemdeling, die rechtmatig verblijf verkrijgt in de zin van
      [artikel 8, onderdelen a en c, van de Vreemdelingenwet 2000][ref1], die:

      a. anders dan voor een tijdelijk doel in Nederland verblijft, of

      b. geestelijke bedienaar is.

      2 Bij algemene maatregel van bestuur worden regels gesteld over het voortduren van de inburgeringsplicht in geval
      van tijdelijke beëindiging van de in het eerste lid bedoelde omstandigheden.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het tijdelijke doel, bedoeld in
      het eerste lid, waarbij zo veel mogelijk wordt aangesloten bij het verblijfsrecht van tijdelijke aard, bedoeld in
      [artikel 21, eerste lid, onderdeel f, van de Vreemdelingenwet 2000][ref2].

      4 De inburgeringsplicht, bedoeld in het eerste lid, wordt niet met terugwerkende kracht gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel21
