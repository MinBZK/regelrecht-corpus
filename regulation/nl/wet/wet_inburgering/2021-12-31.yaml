                  subject: $voldaan_aan_eu_inburgering_langdurig_ingezetene
                  value: true
          - output: is_niet_inburgeringsplichtig
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $vrijgesteld_lid1a
                  value: true
                - operation: EQUALS
                  subject: $vrijgesteld_lid1c
                  value: true
                - operation: EQUALS
                  subject: $vrijgesteld_lid1de
                  value: true
                - operation: EQUALS
                  subject: $vrijgesteld_lid2
