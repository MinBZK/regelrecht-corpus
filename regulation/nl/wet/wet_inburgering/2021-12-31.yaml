      1 Onze Minister stelt in de boetebeschikking, bedoeld in [artikel 28][ref1], een nieuwe termijn van ten
      hoogste één jaar waarbinnen de inburgeringsplichtige na het bekendmaken van de boetebeschikking alsnog het
      participatieverklaringstraject, bedoeld in [artikel 7, tweede lid, onderdeel a][ref2], moet afronden.

      2 Onze Minister verlengt de nieuwe termijn, bedoeld in het eerste lid, indien de inburgeringsplichtige aannemelijk
      maakt dat hem geen verwijt treft ter zake van het niet tijdig afronden van het participatieverklaringstraject.

      3 De verlenging, bedoeld in het tweede lid, kan telkens voor ten hoogste een jaar worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel28
