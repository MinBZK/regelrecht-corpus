  - number: 7a
    text: |-
      1 De inburgeringsplichtige rondt binnen één jaar het participatieverklaringstraject, bedoeld in
      [artikel 7, tweede lid, onderdeel a][ref1], af.

      2 De termijn van één jaar, genoemd in het eerste lid, vangt aan op het moment dat de vreemdeling
      inburgeringsplichtig is en ingeschreven is in de basisregistratie personen, met dien verstande dat indien
      hij rechtmatig verblijf heeft op grond van een verblijfsvergunning asiel bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref2], het gaat om de inschrijving in de gemeente waar hij op grond van
      [artikel 28 van de Huisvestingswet 2014][ref3] is gehuisvest.

      3 Onze Minister verlengt de termijn van één jaar, genoemd in het eerste lid, indien de inburgeringsplichtige
      aannemelijk maakt dat hem geen verwijt treft ter zake van het niet tijdig afronden van het
      participatieverklaringstraject, bedoeld in [artikel 7, tweede lid, onderdeel a][ref4].

      4 Het participatieverklaringstraject wordt afgesloten met het afleggen van een participatieverklaring. Deze
      verklaring bevat de volgende slotformule: Ik verklaar dat ik kennis heb genomen van de waarden en spelregels van
      de Nederlandse samenleving en dat ik deze respecteer. Ik verklaar dat ik actief een bijdrage wil leveren aan de
      Nederlandse samenleving en reken erop dat ik daarvoor ook de ruimte krijg van mijn medeburgers.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
