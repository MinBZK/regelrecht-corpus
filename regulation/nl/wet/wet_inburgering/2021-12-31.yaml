          - name: verblijft_niet_voor_tijdelijk_doel
            type: boolean
            required: true
            description: De vreemdeling verblijft anders dan voor een tijdelijk doel in Nederland (art. 3 lid 1a)
          - name: is_geestelijke_bedienaar
            type: boolean
            required: true
            description: De vreemdeling is geestelijke bedienaar als bedoeld in artikel 1 lid 1e (art. 3 lid 1b)
