      1 De terugbetalingsperiode vangt aan zes maanden na:

      a. het voldoen aan de inburgeringsplicht; of

      b. het vervallen van de aanspraak op een lening, op grond van [artikel 16, tweede lid][ref1].

      2 Onze Minister kan het terug te betalen bedrag invorderen bij dwangbevel.

      3 Indien de lening wordt kwijtgescholden, gaat de over het kwijtgescholden bedrag opgebouwde rente op het tijdstip
      van kwijtschelding teniet.


