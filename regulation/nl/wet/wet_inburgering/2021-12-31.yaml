        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
    machine_readable:
      execution:
        parameters:
          - name: pvt_termijn_startdatum
            type: date
            required: true
            description: >-
              Datum waarop de vreemdeling inburgeringsplichtig is en ingeschreven is in de
              basisregistratie personen; voor asielstatushouders de datum van inschrijving
              in de huisvestingsgemeente (art. 7a lid 2)
        output:
          - name: pvt_termijn_einddatum
            type: date
            description: Uiterste datum voor het afronden van het participatieverklaringstraject (art. 7a lid 1)
        actions:
          - output: pvt_termijn_einddatum
            value:
              operation: DATE_ADD
              date: $pvt_termijn_startdatum
              years: 1
  - number: 7b
    text: |-
      1 De inburgeringsplichtige behaalt binnen drie jaar de onderdelen van het inburgeringsexamen, bedoeld in
      [artikel 7, tweede lid, onderdelen b en c][ref1].

      2 De termijn van drie jaar, genoemd in het eerste lid, vangt aan op het moment dat de vreemdeling
      inburgeringsplichtig wordt.

      3 Onze Minister verlengt de termijn van drie jaar, genoemd in het eerste lid:

      a. indien de inburgeringsplichtige aannemelijk maakt dat hem geen verwijt treft ter zake van het niet tijdig
      behalen van deze onderdelen van het inburgeringsexamen, of

      b. eenmalig met ten hoogste twee jaren, indien aantoonbaar een alfabetiseringscursus wordt of is gevolgd voor het
      verstrijken van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
        hoofdstuk: '2'
    machine_readable:
      execution:
        parameters:
          - name: inburgeringsplichtig_datum
            type: date
            required: true
            description: Datum waarop de vreemdeling inburgeringsplichtig wordt (art. 7b lid 2)
          - name: heeft_alfabetiseringscursus_gevolgd
            type: boolean
            required: true
            description: >-
              Aantoonbaar een alfabetiseringscursus gevolgd voor het verstrijken van de
              driejarige termijn (art. 7b lid 3b); geeft recht op eenmalige verlenging
              met ten hoogste twee jaren
        output:
          - name: examen_termijn_einddatum
            type: date
            description: Uiterste datum voor het behalen van de examenonderdelen (art. 7b lid 1), drie jaar na aanvang
          - name: examen_termijn_einddatum_met_alfabetisering
            type: date
            description: >-
              Uiterste datum inclusief eenmalige verlenging van twee jaar wegens alfabetiseringscursus
              (art. 7b lid 3b); maximale termijn is vijf jaar na aanvang
        actions:
          - output: examen_termijn_einddatum
            value:
              operation: DATE_ADD
              date: $inburgeringsplichtig_datum
              years: 3
          - output: examen_termijn_einddatum_met_alfabetisering
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_alfabetiseringscursus_gevolgd
                    value: true
                  then:
                    operation: DATE_ADD
                    date: $inburgeringsplichtig_datum
                    years: 5
              default: $examen_termijn_einddatum
  - number: '8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de verdere verlenging van de termijnen, bedoeld in de [artikelen 7a, eerste lid][ref1], en
      [7b, eerste lid][ref2], en de toepassing van de artikelen 7a, derde lid, en 7b, derde lid;

      b. het afnemen van het inburgeringsexamen;

      c. de inhoud en vormgeving van het inburgeringsexamen;

      d. de ter zake van het inburgeringsexamen verschuldigde kosten;

      e. de identificatie van de persoon die aan het inburgeringsexamen deelneemt;

      f. de examencommissie, en

      g. het diploma.

      2 Bij ministeriële regeling wordt de tekst van de participatieverklaring vastgesteld. Het ontwerp van een regeling
      tot wijziging van de tekst van de participatieverklaring wordt aan beide kamers der Staten-Generaal overgelegd en
      wordt niet eerder vastgesteld dan vier weken na de overlegging van het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: 7a
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7b
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte van een certificaat
      aan een rechtspersoon of een natuurlijk persoon die in het kader van de uitoefening van beroep of bedrijf
      werkzaamheden verricht gericht op het toeleiden van inburgeringsplichtigen naar het inburgeringsexamen.

      2 Onze Minister dan wel een door Onze Minister op grond van [artikel 10][ref1] aangewezen instelling beslist
      op aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.

      3 Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.

      4 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent:

      a. de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;

      b. de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een
      afgegeven certificaat kan worden verlengd of ingetrokken;

      c. de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      1 Onze Minister kan op aanvraag een instelling aanwijzen die de bevoegdheden, bedoeld in
      [artikel 9, tweede lid][ref1], uitoefent.

      2 Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.

      3 Een krachtens dit artikel aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voorzover dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden voor:

      a. de gronden waarop de in het eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd;

      b. het opstellen van een verslag van werkzaamheden ten behoeve van Onze Minister;

      c. het toezicht op de instelling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel9
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '9'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      1 Onze Minister kan de krachtens [artikel 10][ref1] aangewezen instelling aanwijzingen geven met betrekking tot de
      uitoefening van haar taken. Hij treedt daarbij niet in individuele gevallen.

      2 De krachtens [artikel 10][ref2] aangewezen instelling is gehouden overeenkomstig de aanwijzing, bedoeld in het
      eerste lid, te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: '12'
    text: |-
      1 Indien naar het oordeel van Onze Minister de krachtens [artikel 10][ref1] aangewezen instelling zijn taak ernstig
      verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen.

      2 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de krachtens
      [artikel 10][ref2] aangewezen instelling in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog haar taak naar behoren uit te voeren.

      3 Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '10'
        hoofdstuk: '3'
  - number: 12a
    text: |-
      1 Zolang op grond van [artikel 9][ref1] geen regels zijn gesteld over de afgifte van een certificaat verleent Onze
      Minister, of een door Onze Minister aangewezen instelling, een keurmerk aan cursusinstellingen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de aanwijzing van een
      instelling en de verlening van een keurmerk aan cursusinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel9
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '9'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      1 Onze Minister verstrekt op aanvraag een lening aan de inburgeringsplichtige indien is voldaan aan bij
      of krachtens algemene maatregel van bestuur te stellen regels omtrent de voorwaarden waaronder en de
      wijze waarop de lening wordt verstrekt en omtrent het volgen bij een cursusinstelling van een cursus
      die opleidt tot het inburgeringsexamen, of een diploma, certificaat of ander document, bedoeld in
      [artikel 5, eerste lid, onderdeel c][ref1].

      2 Aanspraak op een lening bestaat niet of niet langer als de inburgeringsplichtige:

      a. na het verstrijken van de termijn, bedoeld in [artikel 7a, eerste lid][ref2], of de met toepassing van artikel
      7a, derde lid, of bij of krachtens [artikel 8, eerste lid, aanhef en onderdeel a][ref3], gestelde regels verlengde
      termijn de participatieverklaring niet heeft ondertekend;

      b. zes jaar na het verstrijken van de termijn, bedoeld in [artikel 7b, eerste lid][ref4], of de met toepassing van
      artikel 7b, derde lid, of bij of krachtens [artikel 8, eerste lid, aanhef en onderdeel a][ref5], gestelde regels
      verlengde termijn, niet aan de inburgeringsplicht heeft voldaan; of

      c. niet langer inburgeringsplichtig is.

      3 Het bedrag van de lening wordt betaald aan de door de inburgeringsplichtige aangewezen cursusinstelling en
      exameninstelling.

      4 De inburgeringsplichtige of gewezen inburgeringsplichtige betaalt de lening vermeerderd met de volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels berekende rente terug.

      5 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden tevens regels gesteld
      omtrent:

      a. de hoogte van de lening;

      b. de betaling en de terugbetaling van de lening, en

      c. kwijtschelding.

      6 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent het verstrekken van een lening aan anderen dan inburgeringsplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0020611#Artikel8
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: 7a
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020611
        artikel: '8'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0020611
        artikel: 7b
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0020611
        artikel: '8'
        hoofdstuk: '2'
    machine_readable:
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
          - name: peildatum
            type: date
            required: true
            description: Datum waarvoor de aanspraak op lening wordt beoordeeld
          - name: voldoet_aan_amvb_leenvoorwaarden
            type: boolean
            required: true
            description: >-
              Voldaan aan bij of krachtens AMvB te stellen regels over voorwaarden
              voor de lening en het volgen van een cursus (art. 16 lid 1); nader geregeld bij AMvB
          - name: participatieverklaring_ondertekend
            type: boolean
            required: true
            description: De inburgeringsplichtige heeft de participatieverklaring ondertekend
          - name: pvt_termijn_verstreken
            type: boolean
            required: true
            description: De termijn van artikel 7a lid 1 (of verlengde termijn) is verstreken
          - name: inburgeringsplicht_voldaan
            type: boolean
            required: true
            description: De inburgeringsplichtige heeft voldaan aan de inburgeringsplicht
          - name: is_nog_inburgeringsplichtig
            type: boolean
            required: true
            description: De persoon is nog steeds inburgeringsplichtig
        input:
          - name: examen_termijn_einddatum
            type: date
            source:
              output: examen_termijn_einddatum
        output:
          - name: heeft_aanspraak_op_lening
            type: boolean
            description: >-
              De inburgeringsplichtige heeft aanspraak op een lening (art. 16 lid 1), tenzij
              een van de weigeringsgronden van lid 2 van toepassing is
        actions:
          - output: verlies_aanspraak_pvt
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $pvt_termijn_verstreken
                  value: true
                - operation: NOT
                  value: $participatieverklaring_ondertekend
          - output: zes_jaar_grens_examen
            value:
              operation: DATE_ADD
              date: $examen_termijn_einddatum
              years: 6
          - output: verlies_aanspraak_zes_jaar
            value:
              operation: AND
              conditions:
                - operation: GREATER_THAN
                  subject: $peildatum
                  value: $zes_jaar_grens_examen
                - operation: NOT
                  value: $inburgeringsplicht_voldaan
          - output: verlies_aanspraak_niet_meer_plichtig
            value:
              operation: NOT
              value: $is_nog_inburgeringsplichtig
          - output: verlies_aanspraak
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $verlies_aanspraak_pvt
                  value: true
                - operation: EQUALS
                  subject: $verlies_aanspraak_zes_jaar
                  value: true
                - operation: EQUALS
                  subject: $verlies_aanspraak_niet_meer_plichtig
                  value: true
          - output: heeft_aanspraak_op_lening
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $voldoet_aan_amvb_leenvoorwaarden
                  value: true
                - operation: NOT
                  value: $verlies_aanspraak
  - number: '17'
    text: |-
      1 De terugbetalingsperiode vangt aan zes maanden na:

      a. het voldoen aan de inburgeringsplicht; of

      b. het vervallen van de aanspraak op een lening, op grond van [artikel 16, tweede lid][ref1].

      2 Onze Minister kan het terug te betalen bedrag invorderen bij dwangbevel.

      3 Indien de lening wordt kwijtgescholden, gaat de over het kwijtgescholden bedrag opgebouwde rente op het tijdstip
      van kwijtschelding teniet.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel16
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '16'
        hoofdstuk: '5'
    machine_readable:
      execution:
        parameters:
          - name: inburgeringsplicht_voldaan
            type: boolean
            required: true
            description: De inburgeringsplichtige heeft voldaan aan de inburgeringsplicht (art. 17 lid 1a)
          - name: datum_voldaan_inburgeringsplicht
            type: date
            required: false
            description: Datum waarop voldaan is aan de inburgeringsplicht (art. 17 lid 1a)
          - name: datum_verlies_aanspraak_lening
            type: date
            required: false
            description: Datum waarop de aanspraak op lening is vervallen op grond van artikel 16 lid 2 (art. 17 lid 1b)
        output:
          - name: terugbetalingsperiode_startdatum
            type: date
            description: >-
              Datum waarop de terugbetalingsperiode aanvangt: zes maanden na voldoen aan
              de inburgeringsplicht of na vervallen van de aanspraak op lening (art. 17 lid 1)
        actions:
          - output: terugbetalingsperiode_startdatum
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $inburgeringsplicht_voldaan
                    value: true
                  then:
                    operation: DATE_ADD
                    date: $datum_voldaan_inburgeringsplicht
                    months: 6
              default:
                operation: DATE_ADD
                date: $datum_verlies_aanspraak_lening
                months: 6
  - number: '18'
    text: |-
      1 Het college voorziet in de maatschappelijke begeleiding van de inburgeringsplichtige die rechtmatig verblijf
      heeft op grond van een:

      a. verblijfsvergunning asiel voor bepaalde tijd, of

      b. verblijfsvergunning regulier voor bepaalde tijd, verleend onder een beperking verband houdend met verblijf als
      familie- of gezinslid, voor verblijf bij:

      1°. een houder van een verblijfsvergunning asiel voor bepaalde tijd,

      2°. een houder van een verblijfsvergunning asiel voor onbepaalde tijd, of

      3°. een houder van een EU-verblijfsvergunning voor langdurig ingezetenen die is verleend met een aantekening inzake
      internationale bescherming als bedoeld in [artikel 45c, eerste lid, van de Vreemdelingenwet 2000][ref1].

      2 De maatschappelijke begeleiding vangt aan op het moment dat de vreemdeling inburgeringsplichtig
      is en ingeschreven is in de basisregistratie personen, met dien verstande dat indien hij
      rechtmatig verblijf heeft op grond van een verblijfsvergunning asiel bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref2], het gaat om de inschrijving in de gemeente waar hij op grond van
      [artikel 28 van de Huisvestingswet 2014][ref3] is gehuisvest.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud en vormgeving van de
      maatschappelijke begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0035303#Artikel28
    url: https://wetten.overheid.nl/BWBR0020611/2021-12-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 45c
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0035303
        artikel: '28'
    machine_readable:
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
          - name: heeft_verblijfsvergunning_asiel_bepaalde_tijd
            type: boolean
            required: true
            description: De inburgeringsplichtige heeft een verblijfsvergunning asiel voor bepaalde tijd (art. 18 lid 1a)
          - name: heeft_reguliere_vvn_als_gezinsmigrant_bij_asielhouder
            type: boolean
            required: true
            description: >-
              Verblijfsvergunning regulier voor bepaalde tijd wegens verblijf als familie-
              of gezinslid bij houder van verblijfsvergunning asiel bepaalde of onbepaalde tijd
              (art. 18 lid 1b onder 1° en 2°)
          - name: heeft_reguliere_vvn_als_gezinsmigrant_bij_eu_langdurig_ingezetene
            type: boolean
            required: true
            description: >-
              Verblijfsvergunning regulier voor bepaalde tijd wegens verblijf als familie-
              of gezinslid bij houder van EU-verblijfsvergunning langdurig ingezetene met
              internationale bescherming (art. 18 lid 1b onder 3°)
        output:
          - name: heeft_recht_op_maatschappelijke_begeleiding
            type: boolean
            description: Het college voorziet in maatschappelijke begeleiding (art. 18 lid 1)
        actions:
          - output: heeft_recht_op_maatschappelijke_begeleiding
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $heeft_verblijfsvergunning_asiel_bepaalde_tijd
                  value: true
                - operation: EQUALS
                  subject: $heeft_reguliere_vvn_als_gezinsmigrant_bij_asielhouder
                  value: true
                - operation: EQUALS
                  subject: $heeft_reguliere_vvn_als_gezinsmigrant_bij_eu_langdurig_ingezetene
                  value: true
  - number: '28'
    text: |-
      Onze Minister legt een bestuurlijke boete op aan de inburgeringsplichtige die het participatieverklaringstraject,
      bedoeld in [artikel 7, tweede lid, onderdeel a][ref1], niet binnen de in [artikel 7a, eerste lid][ref2],
      genoemde termijn, of de met toepassing van artikel 7a, derde lid, of van de krachtens
      [artikel 8, eerste lid, aanhef en onderdeel a][ref3], gestelde regels verlengde termijn, heeft afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel8
