  - number: '6'
    text: |-
      1 Onze Minister ontheft de inburgeringsplichtige van de inburgeringsplicht, indien de inburgeringsplichtige heeft
      aangetoond door een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap, blijvend niet in
      staat te zijn het inburgeringsexamen te behalen.

      2 Onze Minister ontheft de inburgeringsplichtige van de onderdelen uit het inburgeringsexamen, bedoeld in
      [artikel 7, tweede lid, onderdelen b en c][ref1], waarvan, op grond van door de inburgeringsplichtige aangetoonde
      geleverde inspanningen, blijkt dat hij redelijkerwijs niet aan deze onderdelen kan voldoen.

      3 Bij of krachtens algemene maatregel van bestuur kan worden voorzien in:

      a. verdere ontheffing van de inburgeringsplicht, en

      b. nadere regels omtrent de toepassing van het eerste en tweede lid.

      4 Voor het in behandeling nemen van een aanvraag van een ontheffing als bedoeld in het eerste, tweede
      of derde lid, dan wel voor een medisch onderzoek ten behoeve van de ontheffing, kan een bij ministeriële
      regeling te bepalen bedrag worden vastgesteld, dat de inburgeringsplichtige is verschuldigd. Onder de
      inburgeringsplichtige, bedoeld in de eerste zin, wordt mede verstaan de inburgeringsplichtige, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________________ (Stb. 2012, 430),
      die een ontheffing aanvraagt op grond van artikel 6, zoals dit artikel luidde op 31 december 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0032031#ArtikelX
