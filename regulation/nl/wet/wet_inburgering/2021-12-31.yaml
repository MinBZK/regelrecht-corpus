      1 Onze Minister legt de inburgeringsplichtige die niet binnen de krachtens [artikel 29][ref1] vastgestelde
      termijnen het participatieverklaringstraject, bedoeld in [artikel 7, tweede lid, onderdeel a][ref2], heeft
      afgerond, een bestuurlijke boete op. Artikel 29 is van overeenkomstige toepassing.

      2 Zolang de inburgeringsplichtige na het verstrijken van de krachtens het eerste lid gestelde termijn het
      participatieverklaringstraject, bedoeld in [artikel 7, tweede lid, onderdeel a][ref3], niet afrondt, legt Onze
      Minister ieder jaar een bestuurlijke boete op.


