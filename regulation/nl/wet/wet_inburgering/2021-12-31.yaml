  - number: 12a
    text: |-
      1 Zolang op grond van [artikel 9][ref1] geen regels zijn gesteld over de afgifte van een certificaat verleent Onze
      Minister, of een door Onze Minister aangewezen instelling, een keurmerk aan cursusinstellingen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de aanwijzing van een
      instelling en de verlening van een keurmerk aan cursusinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel9
