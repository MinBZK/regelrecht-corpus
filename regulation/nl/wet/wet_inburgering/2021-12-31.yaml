          legal_character: BESCHIKKING
          decision_type: AANSLAG
        parameters:
          - name: bsn
            type: string
            required: true
          - name: examen_tijdig_behaald
            type: boolean
            required: true
            description: >-
              De examenonderdelen zijn tijdig behaald binnen de termijn van artikel 7b lid 1
              of de verlengde termijn (art. 31 lid 1)
          - name: verblijfsvergunning_verlenging_afgewezen
            type: boolean
            required: true
            description: >-
              De aanvraag tot het verlengen van de geldigheidsduur van de verblijfsvergunning
              voor bepaalde tijd is afgewezen krachtens artikel 18 Vreemdelingenwet 2000 (art. 31 lid 2)
          - name: verblijfsvergunning_ingetrokken
            type: boolean
            required: true
            description: >-
              De verblijfsvergunning voor bepaalde tijd is ingetrokken krachtens artikel 19
              Vreemdelingenwet 2000 (art. 31 lid 2)
        output:
          - name: bestuurlijke_boete_examen_opleggen
            type: boolean
            description: >-
              Onze Minister legt een bestuurlijke boete op omdat de examenonderdelen niet tijdig
              zijn behaald, tenzij de verblijfsvergunning is afgewezen of ingetrokken (art. 31)
        actions:
          - output: uitzondering_verblijfsvergunning
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $verblijfsvergunning_verlenging_afgewezen
                  value: true
                - operation: EQUALS
                  subject: $verblijfsvergunning_ingetrokken
                  value: true
          - output: bestuurlijke_boete_examen_opleggen
            value:
              operation: AND
              conditions:
                - operation: NOT
                  value: $examen_tijdig_behaald
                - operation: NOT
                  value: $uitzondering_verblijfsvergunning
  - number: '32'
    text: |-
      1 Onze Minister stelt in de boetebeschikking, bedoeld in [artikel 31, eerste lid][ref1], een nieuwe termijn van
