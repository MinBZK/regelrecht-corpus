  - number: '31'
    text: |-
      1 Onze Minister legt een bestuurlijke boete op aan de inburgeringsplichtige die niet binnen de in
      [artikel 7, eerste lid][ref1], genoemde termijn, of de met toepassing van artikel 7, derde lid, of van de krachtens
      artikel 7, vierde lid, aanhef en onderdeel a, gestelde regels verlengde termijn, aan de inburgeringsplicht heeft
      voldaan.

      2 In afwijking van het eerste lid, legt Onze Minister geen boete op, indien bij of krachtens
      [artikel 18 van de Vreemdelingenwet 2000][ref2] de aanvraag tot het verlengen van de geldigheidsduur van de
      verblijfsvergunning voor bepaalde tijd wordt afgewezen dan wel bij of krachtens [artikel 19 van die wet][ref3] de
      verblijfsvergunning voor bepaalde tijd wordt ingetrokken.


