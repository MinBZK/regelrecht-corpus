      uitoefening van haar taken. Hij treedt daarbij niet in individuele gevallen.

      2 De krachtens [artikel 10][ref2] aangewezen instelling is gehouden overeenkomstig de aanwijzing, bedoeld in het
      eerste lid, te handelen.


