  - number: '6'
    text: |-
      1 Onze Minister ontheft de inburgeringsplichtige van de inburgeringsplicht, indien:

      a. de inburgeringsplichtige heeft aangetoond door een psychische of lichamelijke belemmering, dan wel een
      verstandelijke handicap, blijvend niet in staat te zijn het inburgeringsexamen te behalen;

      b. hij op grond van door de inburgeringsplichtige aantoonbaar geleverde inspanningen tot het oordeel komt dat het
      voor de inburgeringsplichtige redelijkerwijs niet mogelijk is aan de inburgeringsplicht te voldoen.

      2 Bij of krachtens algemene maatregel van bestuur kan worden voorzien in:

      a. verdere ontheffing van de inburgeringsplicht, en

      b. nadere regels omtrent de toepassing van het eerste lid.

      3 Voor het in behandeling nemen van een aanvraag van een ontheffing als bedoeld in het eerste of
      tweede lid, dan wel voor een medisch onderzoek ten behoeve van de ontheffing, kan een bij ministeriële
      regeling te bepalen bedrag worden vastgesteld, dat de inburgeringsplichtige is verschuldigd. Onder de
      inburgeringsplichtige, bedoeld in de eerste zin, wordt mede verstaan de inburgeringsplichtige, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________________ (Stb. 2012, 430),
      die een ontheffing aanvraagt op grond van artikel 6, zoals dit artikel luidde op 31 december 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0032031#ArtikelX
    url: https://wetten.overheid.nl/BWBR0020611/2014-03-29#Artikel6
