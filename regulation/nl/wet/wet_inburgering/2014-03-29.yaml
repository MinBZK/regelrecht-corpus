  - number: '7'
    text: |-
      1 De inburgeringsplichtige verwerft binnen drie jaar mondelinge en schriftelijke vaardigheden in de Nederlandse
      taal op ten minste het niveau A2 van het Europese Raamwerk voor Moderne Vreemde Talen en kennis van de Nederlandse
      samenleving.

      2 De inburgeringsplichtige heeft aan de inburgeringsplicht voldaan indien hij:

      a. het door Onze Minister vastgestelde examen heeft behaald, of

      b. een diploma, certificaat of ander document, bedoeld in [artikel 5, eerste lid, onderdeel c][ref1], heeft
      behaald.

      3 Onze Minister verlengt de in het eerste lid bedoelde termijn:

      a. indien de inburgeringsplichtige aannemelijk maakt dat hem geen verwijt treft terzake van het niet voldoen aan de
      inburgeringsplicht, of

      b. eenmalig met ten hoogste twee jaren, indien aantoonbaar een alfabetiseringscursus wordt of is gevolgd voor het
      verstrijken van die termijn.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de verdere verlenging van de termijn, bedoeld in het eerste lid, en de toepassing van het derde lid;

      b. het afnemen van het examen;

      c. de inhoud en vormgeving van het examen;

      d. de ter zake van het examen verschuldigde kosten;

      e. de identificatie van de persoon die aan het examen deelneemt;

      f. de examencommissie, en

      g. het diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0020611/2014-03-29#Artikel7
