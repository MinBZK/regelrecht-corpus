  - number: '17'
    text: |-
      1 De terugbetalingsperiode vangt aan zes maanden nadat de termijn, bedoeld in [artikel 7, eerste lid][ref1], is
      verstreken of, indien eerder aan de inburgeringsplicht is voldaan, zes maanden nadat aan de inburgeringsplicht is
      voldaan. Indien die termijn met toepassing van artikel 7, derde lid, of van de bij of krachtens artikel 7, vierde
      lid, aanhef en onderdeel a, gestelde regels is verlengd, vangt de terugbetalingsperiode aan zes maanden nadat die
      termijn is verstreken.

      2 Onze Minister kan het terug te betalen bedrag invorderen bij dwangbevel.

      3 Indien de lening wordt kwijtgescholden, gaat de over het kwijtgescholden bedrag opgebouwde rente op het tijdstip
      van kwijtschelding teniet.


