  - number: '33'
    text: |-
      1 Onze Minister legt de inburgeringsplichtige die niet binnen de krachtens [artikel 32][ref1] vastgestelde termijn
      aan de inburgeringsplicht heeft voldaan, een bestuurlijke boete op. Artikel 32 is van overeenkomstige toepassing.

      2 Zolang de inburgeringsplichtige na het verstrijken van de krachtens [artikel 32][ref2] gestelde termijn niet
      voldoet aan de inburgeringsplicht, legt Onze Minister iedere twee jaar een bestuurlijke boete op.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel32
    url: https://wetten.overheid.nl/BWBR0020611/2014-03-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '32'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '32'
        hoofdstuk: '6'
  - number: '34'
    text: |-
      De bestuurlijke boete kan niet hoger zijn dan:

      a. € 1250 voor het niet naleven van [artikel 7, eerste lid][ref1];

      b. € 1250 voor het niet voldoen aan de inburgeringsplicht binnen de bij of krachtens de [artikelen 32][ref2] en
      [33][ref3] gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel33
    url: https://wetten.overheid.nl/BWBR0020611/2014-03-29#Artikel34
