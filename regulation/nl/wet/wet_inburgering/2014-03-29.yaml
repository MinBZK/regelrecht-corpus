  - number: '36'
    text: |-
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is van toepassing indien [artikel 31, eerste lid][ref2], of
      [33][ref3] is overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel553
