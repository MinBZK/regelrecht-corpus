  - number: '16'
    text: |-
      1 Onze Minister verstrekt op aanvraag een lening aan de inburgeringsplichtige indien is voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen regels omtrent de voorwaarden waaronder en de wijze waarop de
      lening wordt verstrekt en omtrent het volgen bij een cursusinstelling van een cursus die opleidt tot het examen,
      bedoeld in [artikel 7, tweede lid, onderdeel a][ref1], of een diploma, certificaat of ander document, bedoeld in
      [artikel 5, eerste lid, onderdeel c][ref2].

      2 Het bedrag van de lening wordt betaald aan de door de inburgeringsplichtige aangewezen cursusinstelling en
      exameninstelling.

      3 De inburgeringsplichtige of gewezen inburgeringsplichtige betaalt de lening vermeerderd met de volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels berekende rente terug.

      4 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden tevens regels gesteld
      omtrent:

      a. de hoogte van de lening;

      b. de betaling en de terugbetaling van de lening, en

      c. kwijtschelding.

      5 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent het verstrekken van een lening aan anderen dan inburgeringsplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel5
