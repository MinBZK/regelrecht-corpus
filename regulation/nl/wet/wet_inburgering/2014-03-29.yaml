  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de afgifte van een certificaat
      aan een rechtspersoon of een natuurlijk persoon die in het kader van de uitoefening van beroep of bedrijf
      werkzaamheden verricht gericht op het toeleiden van inburgeringsplichtigen naar het inburgeringsexamen.

      2 Onze Minister dan wel een door Onze Minister op grond van [artikel 10][ref1] aangewezen instelling beslist
      op aanvraag over de afgifte van het certificaat, bedoeld in het eerste lid, en is tevens bevoegd een afgegeven
      certificaat in te trekken.

      3 Een certificaat wordt afgegeven voor een beperkte tijdsduur. Aan een certificaat kunnen voorschriften worden
      verbonden.

      4 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen tevens regels worden gesteld
      omtrent:

      a. de aanvraag en de gegevens die daarbij van de aanvrager worden verlangd;

      b. de gronden waarop en de gevallen waarin de afgifte van een certificaat kan worden geweigerd dan wel een
      afgegeven certificaat kan worden verlengd of ingetrokken;

      c. de vergoeding die verschuldigd is in verband met de afgifte van een certificaat en de betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel10
    url: https://wetten.overheid.nl/BWBR0020611/2014-03-29#Artikel9
