articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *besluit:*



      [Landbouwkwaliteitsbesluit geografische aanduidingen, oorsprongsbenamingen en specificiteitscertificering][ref1];




              *HPA:*


              Hoofdproduktschap voor Akkerbouwprodukten;




              *PBO-blad:*


              Mededelingen- en Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006327
    url: https://wetten.overheid.nl/BWBR0006397/1994-01-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006327
  - number: '2'
    text: Een aanvraag tot registratie, alsmede een verzoek tot wijziging van een produktdossier wordt ingediend bij het HPA.
    url: https://wetten.overheid.nl/BWBR0006397/1994-01-21#Artikel2
  - number: '3'
    text: |-
      1 Door de Commissie voorgenomen registraties, alsmede door de Commissie voorgenomen wijzigingen van een
      produktdossier worden door het HPA onmiddelijk na publicatie daarvan in het Publikatieblad van de Europese
      Gemeenschappen, bekendgemaakt in het PBO-blad.

      2 Door de Commissie ingeschreven registraties, alsmede door de Commissie ingeschreven wijzigingen van een
      produktdossier worden door het HPA onmiddellijk na publicatie daarvan in het Publikatieblad van de Europese
      Gemeenschappen, bekendgemaakt in het PBO-blad.
    url: https://wetten.overheid.nl/BWBR0006397/1994-01-21#Artikel3
  - number: '4'
    text: |-
      1 Iedere natuurlijke of rechtspersoon die kan aantonen een wettig economisch belang te hebben in verband met
      een door de Commissie voorgenomen registratie, onderscheidenlijk een door de Commissie voorgenomen wijziging
      van een produktdossier, kan binnen 5 maanden na de datum van bekendmaking in het Publikatieblad van de Europese
      Gemeenschappen, zijn bedenkingen daartegen kenbaar maken door middel van toezending van een gemotiveerde verklaring
      aan het HPA.

      2 De Minister betrekt de in het eerste lid bedoelde verklaring in zijn overweging om al dan niet bezwaar tegen die
      registratie of wijziging aan te tekenen bij de Commissie.

      3 Iedere producent of verwerker die het produktdossier van een specificiteitscertificering waarvoor een verzoek
      tot wijziging is ingediend, toepast, kan binnen drie maanden na publicatie van de voorgenomen wijziging in het
      Publikatieblad van de Europese Gemeenschappen, verzoeken om het oorspronkelijke produktdossier te mogen blijven
      toepassen door middel van de toezending van een gemotiveerde verklaring aan het HPA.
    url: https://wetten.overheid.nl/BWBR0006397/1994-01-21#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking op hetzelfde tijdstip als het
      [Landbouwkwaliteitsbesluit geografische aanduidingen, oorsprongsbenamingen en specificiteitscertificering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006327
    url: https://wetten.overheid.nl/BWBR0006397/1994-01-21#Artikel5
