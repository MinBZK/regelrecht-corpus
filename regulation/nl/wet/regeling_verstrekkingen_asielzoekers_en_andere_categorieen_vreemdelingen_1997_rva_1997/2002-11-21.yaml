---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_verstrekkingen_asielzoekers_en_andere_categorieen_vreemdelingen_1997_rva_1997
regulatory_layer: WET
publication_date: '2005-04-29'
valid_from: '2002-11-21'
bwb_id: BWBR0009205
url: https://wetten.overheid.nl/BWBR0009205/2002-11-21
preamble:
  text: |-
    Gelet op artikel 12 van de Wet Centraal Orgaan opvang asielzoekers;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

              a
              de minister:

                de Minister van Justitie;



              b
              asielaanvraag:

                een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in artikel 28 van de
      Vreemdelingenwet 2000;



              c
              asielzoeker:

                een vreemdeling aan wie de toegang tot Nederland niet is geweigerd, door wie of ten behoeve van wie een
      asielaanvraag is ingediend, die ten bewijze daarvan door de minister in het bezit is gesteld van een W-Document
      en wiens aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde tijd, bedoeld in artikel 28 van de
      Vreemdelingenwet 2000 niet binnen 48 proces-uren is afgewezen;



              d
              alleenstaande minderjarige vreemdeling:

                een asielzoeker die de leeftijd van 18 jaar nog niet heeft bereikt en die zonder begeleiding of
      verzorging van een ouder, voogd of andere meerderjarige naaste betrekking in Nederland verblijft;



              e
              opvangcentrum:

                een accommodatie waarin door of onder verantwoordelijkheid van het Centraal Orgaan opvang asielzoekers
      opvang wordt geboden aan asielzoekers.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder ‘rechtmatig verwijderbare vreemdeling’ een vreemdeling op
      wiens asielaanvraag in eerste aanleg in negatieve zin is beslist, tenzij:
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: 1.2.a
    text: |-
      de uitzetting van betrokkene ingevolge de Vreemdelingenwet 2000 of een rechterlijke uitspraak achterwege dient te
      blijven, of
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: 1.2.b
    text: |-
      de betrokkene in afwachting is van een rechterlijke uitspraak op een binnen de vertrektermijn ingediend verzoek om
      voorlopige voorziening tegen de beslissing dat de behandeling van het beroepschrift niet in Nederland mag worden
      afgewacht, tenzij dit verzoek op grond van de Vreemdelingencirculaire 2000 niet hier te lande mag worden afgewacht.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder `gezinslid'':'
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: 1.3.a
    text: de partner of huwelijkspartner van de asielzoeker;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: 1.3.b
    text: |-
      de ouders of stiefouders van de asielzoeker, indien deze jonger is dan 18 jaar en niet samenwoont met een partner
      of huwelijkspartner;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: 1.3.c
    text: |-
      een stiefkind van de asielzoeker die jonger is dan 18 jaar en niet samenwoont met een partner of huwelijkspartner
      en die met de asielzoeker in gezinsverband leeft.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van deze regeling wordt onder ‘asielzoeker’ tevens verstaan een vreemdeling aan wie de toegang
      tot Nederland niet is geweigerd en die een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld in de
      artikelen 14 van de Vreemdelingenwet 2000 heeft ingediend onder een beperking verband houdend met gezinshereniging
      met een asielzoeker aan wie met toepassing van deze regeling verstrekkingen wordt geboden.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van deze regeling wordt onder ‘asielzoeker’ tevens verstaan de vreemdeling aan wie de
      verblijfsvergunning, bedoeld in artikel 28 van de Vreemdelingenwet 2000 is verleend en die, met inachtneming van
      artikel 9 van deze regeling, in de centrale opvang verblijft in afwachting van het betrekken van woonruimte in
      een gemeente.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '1.6'
    text: |-
      Voor de toepassing van deze regeling wordt onder ‘asielzoeker’ tevens verstaan de vreemdeling die op grond van
      artikel 3, tweede lid, aanspraak maakt op opvang in een opvangcentrum.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '1.7'
    text: |-
      In afwijking van het eerste lid, onder c, wordt onder ‘asielzoeker’ ook verstaan een alleenstaande minderjarige
      vreemdeling wiens aanvraag binnen 48 proces-uren wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel1
  - number: '2.1'
    text: |-
      Deze regeling heeft betrekking op een asielzoeker die niet beschikt over voldoende middelen om in de noodzakelijke
      kosten van het bestaan te voorzien, zoals bedoeld in de [Algemene bijstandswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '2.2'
    text: |-
      Het Centraal Orgaan opvang asielzoekers kan deze regeling tevens van toepassing verklaren op asielzoekers die niet
      voldoen aan de voorwaarde zoals gesteld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel2
  - number: '3.1'
    text: |-
      Het Centraal Orgaan opvang asielzoekers draagt zorg voor de centrale opvang van asielzoekers door erin te voorzien
      dat aan hen opvang wordt geboden in een opvangcentrum.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel3
  - number: '3.2'
    text: |-
      Het Centraal Orgaan opvang asielzoekers draagt zorg voor de centrale opvang van andere categorieën vreemdelingen,
      bedoeld in [artikel 3, tweede lid, van de Wet Centraal Orgaan opvang asielzoekers][ref1] na een verzoek hiertoe van
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
  - number: '4.1'
    text: |-
      De minister is bevoegd om, indien het Centraal Orgaan opvang asielzoekers aangeeft dat sprake is van een
      capacitaire noodsituatie of enige andere bijzondere omstandigheid, het Centraal Orgaan opvang asielzoekers de
      bevoegdheid toe te kennen bepaalde categorieën asielzoekers uit te sluiten van de ontvangst van de verstrekkingen
      bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '4.2'
    text: De indiening van een tweede of volgende asielaanvraag geeft geen recht op opvang.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel4
  - number: '5.1'
    text: 'De opvang in een opvangcentrum omvat in elk geval de volgende verstrekkingen:'
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.a
    text: onderdak;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.b
    text: een wekelijkse financiële toelage;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.c
    text: een eenmalige bijdrage aan kleedgeld;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.d
    text: recreatieve en educatieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.e
    text: de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.f
    text: een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: 5.1.g
    text: betaling van buitengewone kosten.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: '5.2'
    text: |-
      Zo spoedig mogelijk nadat een asielzoeker voor de eerste keer in een opvangcentrum is opgevangen, vindt een eerste
      onderzoek naar zijn gezondheidstoestand plaats.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: '5.3'
    text: Tijdens het verblijf in het asielzoekerscentrum wordt de asielzoeker een programma voor dagstructurering geboden.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: '5.4'
    text: |-
      Voor bijzonder kwetsbare personen omvat de opvang naast de in het eerste lid bedoelde verstrekkingen, tevens
      specifieke begeleiding.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: '5.5'
    text: |-
      Het aanbieden van recreatieve en educatieve activiteiten en het in bruikleen geven van gebruiksvoorwerpen kan
      afhankelijk gesteld worden van de betaling door de asielzoeker van een waarborgsom.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel5
  - number: '6'
    text: |-
      De in [artikel 5, eerste lid][ref1], bedoelde verstrekkingen kunnen geheel of gedeeltelijk aan een asielzoeker
      worden onthouden indien de asielzoeker:


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: 6.a
    text: |-
      niet desgevraagd mededeling doet van op hem betrekking hebbende gegevens die nodig zijn voor het realiseren van
      de opvang, waaronder in elk geval zijn naam, geboortedatum, nationaliteit, land van herkomst, gezinssamenstelling,
      vermogenspositie en de datum waarop door of ten behoeve van hem een asielaanvraag is ingediend;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel6
  - number: 6.b
    text: |-
      een hem overeenkomstig het bepaalde in [artikel 17, tweede lid][ref1], in rekening gebrachte tegemoetkoming in de
      kosten van opvang niet betaalt;


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel17
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '17'
        hoofdstuk: III
  - number: 6.c
    text: |-
      het bepaalde in [artikel 16][ref1] niet naleeft;


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel16
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '16'
        hoofdstuk: III
  - number: 6.d
    text: |-
      overlast bezorgt aan asielzoekers die in hetzelfde centrum verblijven, aan personen die werkzaam zijn in het
      centrum of aan omwonenden.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel6
  - number: '7.1'
    text: |-
      Het Centraal Orgaan opvang asielzoekers bepaalt in welk centrum een asielzoeker wordt geplaatst en is bevoegd een
      asielzoeker naar een ander centrum over te plaatsen.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel7
  - number: '7.2'
    text: |-
      Na overplaatsing van een asielzoeker naar een ander centrum worden de in [artikel 5, eerste lid][ref1], bedoelde
      verstrekkingen in dit andere centrum aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      De in [artikel 5][ref1] bedoelde verstrekkingen, eindigen in de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: 8.1.a
    text: |-
      indien op de asielaanvraag inwilligend is beslist: op de dag waarop naar het oordeel van het Centraal Orgaan opvang
      asielzoekers passende huisvesting buiten een centrum kan worden gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: 8.1.b
    text: |-
      indien het een vreemdeling betreft die rechtmatig verwijderbaar is vanwege het niet inwilligen van de asielaanvraag
      die recht geeft op opvang: op de dag na de dag waarop de vreemdeling rechtmatig verwijderbaar is geworden;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: 8.1.c
    text: |-
      indien het een alleenstaande minderjarige asielzoeker betreft: op de dag waarop hem vervolgopvang kan worden
      geboden door of in opdracht van de landelijke voogdij-instelling De Opbouw.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: 8.1.d
    text: |-
      indien het een asielzoeker betreft die niet binnen 48 uur in een Asielzoekerscentrum of Aanvullende
      opvangvoorziening arriveert: op het moment waarop deze termijn verstrijkt.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: 8.1.e
    text: |-
      indien het een asielzoeker betreft die het opvangcentrum zonder bericht aan het Centraal Orgaan opvang asielzoekers
      heeft verlaten en twee opeenvolgende malen niet heeft voldaan aan de meldplicht bij de Vreemdelingendienst in het
      centrum: twee weken nadat hij voor de eerste maal heeft verzuimd zich bij de Vreemdelingendienst te melden.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: 8.1.f
    text: |-
      indien een asielzoeker in strijd met de waarheid gegevens heeft verstrekt of verzwegen, met het oogmerk om aldus
      voor zichzelf of voor degene voor wie hij zorgt, ten onrechte een aanspraak te doen ontstaan op de verstrekkingen,
      bedoeld in [artikel 5, eerste lid][ref1], dan wel ten onrechte de hoogte van de verstrekkingen te doen stijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Indien een asielzoeker niet binnen 24 uur in een Opvang- en onderzoekscentrum arriveert ontstaat geen recht op
      opvang.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: '8.3'
    text: |-
      De indiening van een tweede of volgende asielaanvraag is niet van invloed op het moment van beëindiging van de
      verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel8
  - number: '9.1'
    text: |-
      De vreemdeling aan wie de verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1] is verleend, en die in afwachting is van het betrekken van
      woonruimte in een gemeente, krijgt de verstrekkingen, bedoeld in [artikel 5, eerste lid][ref2], aangeboden indien
      het Centraal Orgaan opvang asielzoekers hiermee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      De vreemdeling, bedoeld in het eerste lid, zal iedere twee weken van het Centraal Orgaan opvang asielzoekers de
      instemming, bedoeld in het eerste lid, moeten hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel9
  - number: '10.1'
    text: |-
      De verstrekkingen, bedoeld in [artikel 5, eerste lid, onderdeel b tot en met g][ref1], vinden niet plaats indien de
      bewoner van het centrum geen gebruik maakt van het in het desbetreffende centrum geboden onderdak.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '10.2'
    text: Het Centraal Orgaan opvang asielzoekers kan in bijzondere gevallen afwijken van de bepaling in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel10
  - number: '11.1'
    text: |-
      Iedere asielzoeker verblijvend in een opvangcentrum hier te lande maakt aanspraak op de verstrekking van een
      wekelijkse financiële toelage, bedoeld in [artikel 5, eerste lid, onderdeel b][ref1], ten behoeve van voedsel,
      kleding en andere persoonlijke uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      De hoogte van de in het eerste lid bedoelde toelage is in de centra waarin de bewoners volledig zelf het eigen eten
      verzorgen als volgt: volwassene € 39,03, kinderen tot en met 11 jaar € 7,26, kinderen ouder dan 11 jaar en jonger
      dan 18 jaar € 11,34 en alleenstaande minderjarige asielzoekers € 31,76. Eenouder gezinnen krijgen daarboven een
      toeslag van € 26,32.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
  - number: '11.3'
    text: |-
      De hoogte van de in het eerste lid bedoelde toelage is in de centra waarin de bewoners het ontbijt en de lunch
      zelf verzorgen en niet de hoofdmaaltijd als volgt: volwassene € 28,13, kinderen tot en met 11 jaar € 4,99, kinderen
      ouder dan 11 jaar en jonger dan 18 jaar € 7,26 en alleenstaande minderjarige asielzoekers € 22,69. Eenouder
      gezinnen krijgen daarboven een toeslag van € 20,87.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
  - number: '11.4'
    text: |-
      De hoogte van de in het eerste lid bedoelde toelage is in de centra waarin aan de bewoners alle maaltijden in
      natura worden verstrekt als volgt: volwassene € 15,88, kinderen tot en met 11 jaar € 3,63, kinderen ouder dan 11
      jaar en jonger dan 18 jaar € 5,45 en alleenstaande minderjarige asielzoekers € 12,71. Eenouder gezinnen krijgen
      daarboven een toeslag van € 10,44.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
  - number: '11.5'
    text: |-
      De financiële toelage wordt iedere week bij vooruitbetaling op een door het Centraal Orgaan opvang asielzoekers
      vastgestelde tijd en plaats aan de asielzoeker beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
  - number: '11.6'
    text: |-
      Geen financiële toelage wordt verstrekt aan een kind drie maanden nadat het recht op een uitkering op grond van
      de [Algemene Kinderbijslagwet][ref1] is ontstaan. De ouder maakt wel aanspraak op de toeslag, als bedoeld in het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '11.7'
    text: |-
      De financiële toelage voor een asielzoeker jonger dan 18 jaar, die een kind is van, of verzorgd wordt door een of
      meer in het desbetreffende centrum verblijvende asielzoekers wordt uitbetaald aan één van die asielzoekers.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
  - number: '11.8'
    text: |-
      Het Centraal Orgaan opvang asielzoekers draagt zorg voor de maaltijden in centra waarin de bewoners niet in de
      gelegenheid zijn deze zelf te verzorgen.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel11
  - number: '12.1'
    text: |-
      Asielzoekers ontvangen bij aanvang van de opvang eenmalig een bedrag van € 36,30 ten behoeve van de aanschaf van
      kleding en schoeisel.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel12
  - number: '12.2'
    text: |-
      Deze toelage voor een asielzoeker jonger dan 18 jaar als bedoeld in [artikel 1, onderdeel d, onder c][ref1], wordt
      uitbetaald aan de (stief)ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel1
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '1'
        hoofdstuk: I
  - number: '12.3'
    text: |-
      De toelage bedoeld in het eerste lid en bedoeld in [artikel 11, eerste lid][ref1], voor een alleenstaande
      minderjarige asielzoeker kan, naast verstrekking ervan, ook ten behoeve van deze asielzoeker op een aparte rekening
      worden gereserveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel11
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '11'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Het treffen van een ziektekostenregeling bedoeld in [artikel 5, eerste lid, onderdeel e][ref1], houdt in het
      afsluiten van een ziektekostencontract ter dekking van de kosten van het door de Staatssecretaris van Justitie
      vastgestelde pakket medische verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Het verzekeren tegen de financiële gevolgen van wettelijke aansprakelijkheid, bedoeld in
      [artikel 5, eerste lid, onderdeel f][ref1], houdt in het ten behoeve van de asielzoeker afsluiten van een
      verzekering voor de wettelijke aansprakelijkheid van de asielzoeker jegens een derde voor een som van maximaal €
      453 per gebeurtenis, alsmede het betalen van de daarvoor verschuldigde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '14.1'
    text: |-
      Een asielzoeker kan een vergoeding ontvangen voor buitengewone kosten, bedoeld in
      [artikel 5, eerste lid, onderdeel g][ref1], die hij heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      Buitengewone kosten zijn noodzakelijke kosten die vanwege hun aard of hoogte in redelijkheid niet geacht kunnen
      worden door de asielzoeker zelf te worden betaald.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel14
  - number: '14.3'
    text: |-
      Buitengewone kosten worden slechts betaald voorzover vooraf door het Centraal Orgaans opvang asielzoekers aan de
      asielzoeker toestemming is verleend voor het maken van deze kosten, met uitzondering van kosten die voortvloeien
      uit noodsituaties waarin geen mogelijkheid bestond tot het verzoeken om toestemming.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel14
  - number: '14.4'
    text: |-
      De toestemming, bedoeld in het derde lid, wordt verleend voor zover de kosten noodzakelijk zijn en niet op andere
      wijze in de betaling kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel14
  - number: '14.5'
    text: |-
      Kosten die samenhangen met een door de asielzoeker gepleegde onrechtmatige daad, gepleegd misdrijf of begane
      overtreding zijn in ieder geval geen buitengewone kosten, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel14
  - number: '15.1'
    text: |-
      Een asielzoeker kan door het COA nader aan te wijzen werkzaamheden verrichten in en rondom het centrum, voor de
      uitvoering waarvan een vergoeding kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel15
  - number: '15.2'
    text: |-
      Het Centraal Orgaan opvang asielzoekers zorgt voor een evenredige verdeling van het aanbod van werkzaamheden,
      bedoeld in het eerste lid, over de in het opvangcentrum verblijvende asielzoekers die daarvoor in aanmerking wensen
      te komen.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel15
  - number: '15.3'
    text: |-
      De vergoeding die een asielzoeker ontvangt voor het verrichten van werkzaamheden als bedoeld in het eerste lid,
      bedraagt in totaal niet meer dan € 12,50 per week.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel15
  - number: '16'
    text: 'De asielzoeker die onderdak heeft in een opvangcentrum is verplicht:'
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel16
  - number: 16.a
    text: de huisregels na te leven die zijn neergelegd in het reglement van het desbetreffende opvangcentrum;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel16
  - number: 16.b
    text: gevolg te geven aan de aanwijzingen van het personeel van het desbetreffende opvangcentrum;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel16
  - number: 16.c
    text: schoonmaakwerkzaamheden te verrichten in en rond de woonruimte;
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel16
  - number: 16.d
    text: |-
      toegang te verlenen aan het personeel van het opvangcentrum tot zijn woonruimte indien er een redelijk vermoeden
      bestaat dat de asielzoeker de huisregels overtreedt.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel16
  - number: '17.1'
    text: |-
      Op verzoek van het Centraal Orgaan opvang asielzoekers geeft de asielzoeker aan over welk vermogen of inkomen hij
      beschikt, met dien verstande dat indien deze verklaring betrekking heeft op een kind de verklaring wordt gegeven
      door de asielzoeker te wiens laste het kind komt en in het geval dit meer dan één asielzoeker betreft, door één van
      die asielzoekers.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel17
  - number: '17.2'
    text: |-
      Indien een asielzoeker die verblijft in een opvangcentrum beschikt over een vermogen groter dan f 5.000,- of
      inkomsten heeft, anders dan een uitkering op grond van de Kinderbijslagwet of op basis van deze regeling, is die
      asielzoeker aan het Centraal Orgaan opvang asielzoekers een vergoeding verschuldigd in de kosten van zijn opvang
      alsmede van de opvang van zijn gezinsleden. De tegemoetkoming bedraagt per maand ten hoogste de economische waarde
      van de aan een asielzoeker feitelijk geboden verstrekkingen, vermeerderd met de economische waarde van de aan ieder
      gezinslid feitelijk geboden verstrekkingen, met dien verstande dat de vergoeding niet meer bedraagt dan het bedrag
      van het in de eerste volzin bedoelde vermogen of inkomsten.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel17
  - number: '17.3'
    text: |-
      Indien na zijn verblijf in een opvangcentrum blijkt dat een vreemdeling tijdens dit verblijf beschikte over een
      vermogen of inkomsten, bedoeld in het tweede lid, kan het Centraal Orgaan opvang asielzoekers de kosten van de
      opvang van deze vreemdeling alsmede de kosten van opvang van zijn gezinsleden van hem terugvorderen. De terug te
      vorderen kosten per maand zijn niet hoger dan de economische waarde van de aan de vreemdeling feitelijk geboden
      verstrekkingen, vermeerderd met de economische waarde van de aan ieder gezinslid feitelijk geboden verstrekkingen,
      met dien verstande dat het terug te vorderen bedrag niet meer bedraagt dan het bedrag van het in het tweede lid
      bedoelde vermogen of inkomsten.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel17
  - number: '18'
    text: |-
      Indien blijkt dat een asielzoeker in strijd met de waarheid gegevens heeft verstrekt of verzwegen,
      waardoor hij of zijn gezinsleden ten onrechte, of tot een te hoog bedrag, de verstrekkingen, bedoeld in
      [artikel 5, eerste lid][ref1], heeft verkregen, dan wel dit op andere wijze heeft bewerkstelligd, is het COA
      bevoegd de waarde van de ten onrechte toegekende verstrekkingen terug te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '19'
    text: |-
      Voor de verstrekkingen op basis van deze regeling geldt een beslagvrije voet ten aanzien van alle
      verstrekkingen die in natura geschieden en vier-vijfde deel van de verstrekkingen op grond van
      [artikel 5, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel5
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '5'
        hoofdstuk: II
  - number: '20'
    text: |-
      De Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen van 12 juli 1994 (Stcrt. 1994,
      140) wordt ingetrokken, met uitzondering van [artikel 8][ref1] en [artikel 9][ref2]. [Artikel 8][ref3] en
      [artikel 9][ref4] worden ingetrokken op 11 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009205#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009205#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009205#Artikel9
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009205
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009205
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009205
        artikel: '9'
        hoofdstuk: II
  - number: '21'
    text: |-
      Deze regeling treedt in werking de tweede dag na dagtekening van de Staatscourant waarin zij wordt geplaatst, met
      uitzondering van [artikel 11][ref1]. Dit artikel treedt in werking met ingang van 12 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009205#Artikel11
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009205
        artikel: '11'
        hoofdstuk: II
  - number: '22'
    text: |-
      Deze regeling kan wordt aangehaald als de Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen
      1997, afgekort als Rva 1997.
    url: https://wetten.overheid.nl/BWBR0009205/2002-11-21#Artikel22
