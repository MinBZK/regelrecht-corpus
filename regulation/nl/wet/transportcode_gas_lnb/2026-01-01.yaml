      als volgt: Met: waarin: OV = De OV-exitcapaciteit voor telemetriegrootverbruikers van een bepaalde erkende
      programmaverantwoordelijke voor een bepaald netgebied pf = De profielfactor telemetriegrootverbruik. GC = De som
      van de maxverbruiken van alle telemetriegrootverbruikers waarvoor een erkende programmaverantwoordelijke in een
      bepaald netgebied de programmaverantwoordelijkheid uitoefent. GC = Maxverbruik voor telemetriegrootverbruiker x
      waarvoor een erkende programmaverantwoordelijke de programmaverantwoordelijkheid uitoefent in een bepaald netgebied
      GC = De som van de maxverbruiken van alle telemetriegrootverbruikers in het land = som van GC van alle erkende
      programmaverantwoordelijken en voor alle netgebieden PC = De plancapaciteit telemetriegrootverbruikers FF =
