articles:
  - number: 2.1.1
    text: |-
      Transport vindt plaats op grond van een met de netbeheerder van het landelijk gastransportnet te sluiten
      overeenkomst en houdt in dat de netbeheerder van het landelijk gastransportnet gas aangeboden op een entrypunt in
      het landelijk gastransportnet inneemt en op een exitpunt ter beschikking stelt. Entrycapaciteit en exitcapaciteit
      kunnen onafhankelijk van elkaar bij de netbeheerder van het landelijk gastransportnet worden gecontracteerd.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1
  - number: 2.1.1a.1
    text: |-
      Ter uitvoering van [artikel 12b, lid 2a, onder sub b en c, van de Gaswet][ref1], wordt het volgende bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12b
  - number: 2.1.1a.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de netgebruikers op geschikte wijze over de actuele
      lijst van haar entry- en exitpunten, ingedeeld naar relevante marktsegmenten en publiceert de actuele lijst op
      haar website.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.3
    text: |-
      De netbeheerder van het landelijk gastransportnet stelt entrypunten en exitpunten vast op grond van objectieve,
      transparante en niet-discriminerende voorwaarden en met inachtneming van de belangen van netgebruikers.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.4
    text: |-
      Onder het vaststellen van entry- en exitpunten in dit artikel, wordt mede begrepen het laten vervallen van entry-
      en exitpunten.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.5
    text: |-
      Indien het entry- of exitpunt vervalt vanwege het wegvallen van fysieke gasstromen of er een entry-of exitpunt
      ontstaat vanwege nieuwe fysieke gasstromen, is de procedure als in dit artikel bepaald niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.6
    text: |-
      Een voornemen tot wijziging van de vaststelling van interconnectiepunt(en) dat leidt tot het laten vervallen
      van alle interconnectiepunten tussen twee entry-exitsystemen (marktintegratie), zal tenminste 18 maanden voor
      de geplande invoeringsdatum bekend worden gemaakt door de netbeheerder van het landelijk gastransportnet in
      samenwerking met de andere transmissiesysteembeheerder(s). Deze bekendmaking vindt plaats door publicatie van het
      voornemen op de website van de netbeheerder en door toezending van het voornemen aan de ACM.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.7
    text: 'Het voornemen, bedoeld in lid 6, bevat tenminste:'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.7.a
    text: een analyse van de kosten en baten van het laten vervallen van de betrokken interconnectiepunten;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.7.b
    text: |-
      een analyse van de financiële gevolgen van het laten vervallen van de betrokken interconnectiepunten voor de
      netgebruikers van de betrokken entry-exitsystemen. De netbeheerder van het landelijk gastransportnet maakt de
      financiële gevolgen inzichtelijk aan de hand van een naar jaar gespecificeerde berekening voor een periode van
      tenminste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.7.c
    text: |-
      informatie over de technische en operationele voorzieningen die ten behoeve van het laten vervallen van de
      betrokken interconnectiepunten moeten worden getroffen en de afspraken die daarover zijn gemaakt met de andere
      transmissiesysteembeheerder(s).
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.8
    text: |-
      De netbeheerder van het landelijk gastransportnet stelt netgebruikers in de gelegenheid om binnen zes weken na
      publicatie van het voornemen een schriftelijke reactie te geven op het voornemen. De netbeheerder van het landelijk
      gastransportnet zendt een afschrift van de ontvangen reacties op het voornemen aan de ACM.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.9
    text: 'De netbeheerder van het landelijk gastransportnet geeft niet eerder uitvoering aan het voornemen dan nadat:'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.9.a
    text: |-
      de ACM heeft beoordeeld of het laten vervallen van de betrokken interconnectiepunten plaatsvindt overeenkomstig de
      in lid 3 genoemde criteria;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.9.b
    text: |-
      de ACM en de betrokken buitenlandse nationale regulerende instantie(s) hebben vastgesteld welke technische en
      operationele maatregelen getroffen dienen te worden door de betrokken transmissiesysteembeheerders;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.9.c
    text: |-
      de ACM en de betrokken buitenlandse nationale regulerende instantie(s), hebben vastgesteld of en, zo ja, welke
      vergoedingsmaatregel vanwege het kostenveroorzakingsprincipe dient te worden getroffen ter vergoeding van het
      transport van gas tussen de betrokken transmissiesysteembeheerders. De vergoedingsmaatregel beperkt de nadelige
      effecten op de inkomsten van de betrokken transmissiesysteembeheerders en voorkomt ongeoorloofde kruissubsidiëring
      tussen netgebruikers. Verder draagt de vergoedingsmaatregel bij aan kostenreflectieve tarieven.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.10
    text: |-
      Het in lid 9 in de onderdelen a, b en c genoemde zal binnen een termijn van 12 maanden worden uitgevoerd of
      sneller indien dat mogelijk is. De overschrijding van deze termijn laat de verplichting van de netbeheerder van
      het landelijk gastransportnet om niet eerder uitvoering te geven aan het voornemen dan nadat het in lid 9 in de
      onderdelen a, b en c is doorlopen, onverlet. De ACM zal de uitkomsten van de in lid 9 in de onderdelen a tot en met
      c bedoelde onderzoeken, op geschikte wijze bekendmaken.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet het voornemen heeft om, anders dan vanwege
      marktintegratie, een entry- of exitpunt vast te stellen, dan geldt de hiernavolgende procedure:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11.a
    text: |-
      De netbeheerder van het landelijk gastransportnet meldt dit voornemen aan de ACM uiterlijk twee maanden voordat zij
      uitvoering wil geven aan dit voornemen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11.b
    text: |-
      De ACM beoordeelt dit voornemen op een materieel effect voor de netgebruikers en deelt de uitkomst van deze
      beoordeling met de netgebruikers.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11.c
    text: |-
      Indien er sprake is van een materieel effect zal de netbeheerder van het landelijk gastransportnet in overleg
      treden met de netgebruikers.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11.d
    text: |-
      Indien er sprake is van een materieel effect zal de ACM binnen een termijn van drie maanden of sneller indien dat
      mogelijk is:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11.d.1°
    text: beoordelen of het vaststellen van het entry- of exitpunt plaatsvindt overeenkomstig de in lid 3 genoemde criteria;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.11.d.2°
    text: |-
      vaststellen of en, zo ja, welke compenserende maatregel vanwege het kostenveroorzakingsprincipe dient te worden
      getroffen teneinde ongeoorloofde kruissubsidiëring tussen netgebruikers te voorkomen. De compenserende maatregel
      draagt bij aan kostenreflectieve tarieven.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.1a.12
    text: |-
      De netbeheerder van het landelijk gastransportnet geeft niet eerder uitvoering aan haar voornemen, bedoeld in lid
      11, dan dat de procedure in lid 11, onderdelen a tot en met d is doorlopen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.1a
  - number: 2.1.2
    text: |-
      Gecontracteerde entrycapaciteit geeft het recht om op een entrypunt een hoeveelheid gas per uur in het landelijk
      gastransportnet in te voeden. Gecontracteerde exitcapaciteit geeft het recht om op een exitpunt een hoeveelheid gas
      per uur aan het landelijk gastransportnet te onttrekken.

      Entry- en exitcapaciteit wordt onderscheiden in verschillende capaciteitsproducten. De capaciteitsproducten
      verschillen wat betreft de aanvangsdatum en aanvangstijd, de duur waarvoor entry- of exitcapaciteit wordt
      gecontracteerd en de prijs die op het capaciteitsproduct van toepassing is.

      Op interconnectiepunten biedt de netbeheerder van het landelijk gastransportnet overeenkomstig artikel 9 van NC-CAM
      standaard jaarcapaciteitsproducten, standaard kwartaalcapaciteitsproducten, standaard maandcapaciteitsproducten,
      standaard dagcapaciteitsproducten en standaard *within-day*-capaciteitsproducten aan. Deze standaard
      capaciteitsproducten worden gecontracteerd en aan erkende programmaverantwoordelijken toegewezen door middel van
      een veiling als bepaald in NC-CAM.

      Op binnenlandse entry- en exitpunten worden jaarcapaciteitsproducten, kwartaalcapaciteitsproducten,
      maandcapaciteitsproducten, dagcapaciteitsproducten en *within-day*-capaciteitsproducten onderscheiden. Jaar-,
      kwartaal-, maand-, dag- en *within-day*-capaciteitsproducten hebben op binnenlandse entry- en exitpunten dezelfde
      aanvangsdatum, aanvangstijd en duur als de standaard capaciteitsproducten zoals beschreven in artikel 9 van NC-
      CAM, met uitzondering van jaarcapaciteitsproducten die elke gasmaand kunnen aanvangen. Op binnenlandse entry- en
      exitpunten, niet zijnde exitpunten die de verbinding vormen tussen het landelijk gastransportnet en een regionaal
      gastransportnet, worden deze capaciteitsproducten gecontracteerd en aan erkende programmaverantwoordelijken
      of aangeslotenen met exitcapaciteit toegewezen volgens het *first come first served* principe. Op binnenlandse
      exitpunten die de verbinding vormen tussen het landelijk gastransportnet en een regionaal gastransportnet wordt de
      exitcapaciteit gecontracteerd overeenkomstig het bepaalde in [2.1.2b tot en met 2.1.2e][ref1].

      Indien een erkende programmaverantwoordelijken of aangeslotenen met exitcapaciteit op binnenlandse entry- en
      exitpunten op dezelfde dag op een entry- of exitpunt entry- of exitcapaciteit contracteert in een willekeurige
      combinatie van kwartaal-, maand- en dagcapaciteitsproducten, zal de netbeheerder van het landelijk gastransportnet
      op verzoek van de erkende programmaverantwoordelijken of aangeslotenen met exitcapaciteit per schijf van gelijke
      hoeveelheid gecontracteerde entry- of exitcapaciteit het volgende doen:

      a. Indien de te betalen prijs voor de combinatie van gecontracteerde kwartaal-, maand- en dagcapaciteitsproducten
      hoger is dan de prijs van een jaarcapaciteitsproduct, dan wordt voor die schijf het jaarcapaciteitsproduct
      gecontracteerd, mits de daartoe benodigde capaciteit op het betreffende entry- of exitpunt beschikbaar
      is; b. Indien de te betalen prijs voor de combinatie van gecontracteerde maand- en dagcapaciteitsproducten
      binnen één gaskwartaal hoger is dan de prijs voor het betreffende kwartaalcapaciteitsproduct, dan wordt het
      betreffende kwartaalcapaciteitsproduct gecontracteerd, mits de daartoe benodigde capaciteit op het betreffende
      entry- of exitpunt beschikbaar is; of c. Indien de te betalen prijs voor de combinatie van gecontracteerde
      dagcapaciteitsproducten binnen één maand hoger is dan de te betalen prijs voor het maandcapaciteitsproduct,
      dan wordt het betreffende maandcapaciteitsproduct gecontracteerd, mits de daartoe benodigde capaciteit op het
      betreffende entry- of exitpunt beschikbaar is.

      Entry- en exitcapaciteit kunnen door de landelijke netbeheerder van het gastransport in de vorm van afschakelbare
      transportcapaciteit worden aangeboden. Gecontracteerde afschakelbare entrycapaciteit geeft het voorwaardelijke
      recht om op een entrypunt een hoeveelheid gas per uur in het landelijk gastransportnet in te voeden.
      Gecontracteerde afschakelbare exitcapaciteit geeft het voorwaardelijke recht om op een exitpunt een hoeveelheid gas
      per uur aan het landelijk gastransportnet te onttrekken. De netbeheerder van het landelijk gastransportnet biedt
      afschakelbare entrycapaciteit of exitcapaciteit slechts aan indien vaste entrycapaciteit of vaste exitcapaciteit
      niet meer beschikbaar is. Van afschakelbare entry- of exitcapaciteit kan uitsluitend gebruik worden gemaakt
      indien de netgebruikers van het landelijk gastransportnet die op het betreffende entrypunt of exitpunt beschikken
      over vaste entry- of exitcapaciteit dan wel eerder gecontracteerde afschakelbare entry- of exitcapaciteit, niet
      (volledig) van hun entrycapaciteit respectievelijk exitcapaciteit gebruik maken. Indien niet aan deze voorwaarde
      wordt voldaan, kan de netgebruiker op het desbetreffende entry- of exitpunt (deels) worden afgeschakeld. Het
      afschakelen zal worden uitgevoerd in de volgorde van de volgens 5.1.6 vastgelegde tijdstempels, en bij gelijke
      tijdstempels naar rato van de nominaties.

      Op binnenlandse entry- en exitpunten zal de netbeheerder van het landelijk gastransportnet onverwijld, met
      inachtneming van [2.1.12][ref2], naar mate er bestaande vaste entrycapaciteit of bestaande vaste exitcapaciteit
      beschikbaar komt, de gecontracteerde afschakelbare capaciteit opwaarderen naar vaste entrycapaciteit
      respectievelijk vaste exitcapaciteit. Het opwaarderen zal worden uitgevoerd in de volgorde van de volgens
      [5.1.6][ref3] vastgelegde tijdstempels.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel5
