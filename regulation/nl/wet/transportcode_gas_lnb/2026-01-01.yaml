  - number: 4.1.4.10.3
    text: |-
      Als de voorspelling van het systeem balans signaal conform [artikel 4.1.4.1.][ref1] uitkomt in de oranje zone,
      wordt de heffing, zoals bedoeld in het eerste lid, berekend als 10% van de absolute waarde van het bedrag dat volgt
      uit de berekening van [artikel 4.1.4.2.][ref2] of de berekening van uit [artikel 4.1.4.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel4
