  - number: 2.1.2c.1
    text: |-
      De regionale netbeheerders doen aan de netbeheerder van het landelijk gastransportnet maandelijks uiterlijk op de
      zesde werkdag volgende op de eerste kalenderdag van de maand opgave van de volgende gegevens voor de aansluitingen
      direct aan gesloten op het regionaal gastransportnet, geldend per eerste kalenderdag van die maand, per exitpunt
      per erkende programmaverantwoordelijke per leverancier:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1.a
    text: 'Voor profielafnemers:'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1.a.i
    text: het aantal profielafnemers per profielcategorie;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1.a.ii
    text: de som van de standaardjaarverbruiken per profielcategorie.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1.b
    text: 'Voor telemetriegrootverbruikers:'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1.b.i
    text: het aantal telemetriegrootverbruikers;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1.b.ii
    text: |-
      de som van de maxverbruiken voor telemetriegrootverbruikers als vastgelegd in de aansluitingenregisters van de
      regionale netbeheerders.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.1
    text: 'Voor het netverlies: - De som van de uurlijkse netverliesvolumes van het desbetreffende kalenderjaar.'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.2
    text: |-
      Uiterlijk op de tiende werkdag van de vierde maand na afloop van de maand waarop de gegevens betrekking hebben
      verstrekken de regionale netbeheerders de genoemde gegevens nogmaals aan de netbeheerder van het landelijk
      gastransportnet, waarbij zij correcties verwerken die zijn aangebracht naar aanleiding van opmerkingen die zijn
      ingediend door erkende programmaverantwoordelijken en leveranciers bij de regionale netbeheerders.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.3
    text: |-
      De regionale netbeheerders zenden op dezelfde dagen de genoemde gegevens tevens naar de desbetreffende erkende
      programmaverantwoordelijken. Erkende programmaverantwoordelijken zijn gehouden de conform dit artikel door de
      regionale netbeheerder in de eerste maand verstrekte gegevens bij ontvangst te controleren op plausibiliteit en
      eventuele vermeende fouten zo spoedig mogelijk, doch in elk geval vijf werkdagen vóór de verstrekking van nieuwe
      gegevens in de vierde maand conform dit artikel, te melden bij de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.4
    text: |-
      De netbeheerder van het landelijk gastransportnet gebruikt de nogmaals verstrekte gegevens voor een herziening
      van de verdeling de standaardcapaciteit profielafnemers plus de plancapaciteit telemetriegrootverbruikers over de
      erkende programmaverantwoordelijken.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2c.5
    text: |-
      De regionale netbeheerder draagt er zorg voor dat informatie, die aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijken en leveranciers wordt verschaft, consistent is.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.2c
  - number: 2.1.2d
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt de in een maand door elke erkende
      programmaverantwoordelijke met erkenning LB ten behoeve van profielafnemers en voor het netverlies gecontracteerde
      hoeveelheid exitcapaciteit, op basis van de volgens [artikel 2.1.2b][ref1] en [2.1.2c][ref2] vastgestelde
      respectievelijk verstrekte gegevens dan wel informatie uit de aansluitingenregisters van de regionale netbeheerders
      als volgt: Waarbij de maandelijkse fractie voor de profielafname wordt bepaald met: waarin: OV = De OV-
      exitcapaciteit voor profielafnemers van een bepaalde erkende programmaverantwoordelijke voor een bepaald netgebied
      SJV = De som van de standaardjaarverbruiken voor alle profielafnemers met een bepaalde afnamecategorie voor een
      bepaalde erkende programmaverantwoordelijke voor een bepaald netgebied. Cat = Afnamecategorie JV = De som van de
      uurlijkse netverliesvolumes SC = De standaardcapaciteit profielafnemers PC = De plancapaciteit profielafnemers
      PC = De piekcapaciteit, zijnde dat deel van de plancapaciteit profielafnemers dat is bedoeld voor de pieklevering
      aan kleinverbruikers volgens [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref3] F = De
      maximale uurfractie voor de profielenmethodiek conform [bijlage 3 van de Informatiecode elektriciteit en gas][ref4]
      voor afnamecategorie x bij de referentietemperatuur behorend bij de onderhavige maand MC = De modelcapaciteit
      voor alle profielafnemers in Nederland, bepaald met de bovenstaande formule (d.w.z. door het product
      van het standaardjaarverbruik per categorie en maximale uurfractie te sommeren over alle erkende
      programmaverantwoordelijken en alle netgebieden). FF = De fitfactor profielafnemers De berekening wordt uitgevoerd
      volgens het volgende stappenplan:









