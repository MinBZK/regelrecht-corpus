        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert de actuele lijst met erkende
      programmaverantwoordelijken inclusief het type erkenning op zijn website.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      De erkende programmaverantwoordelijke dient er zorg voor te dragen dat zijn conform [3.2.0][ref1] bekende gegevens
      bij de netbeheerder van het landelijk gastransportnet actueel zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet kan besluiten om voor een bepaalde, beperkte periode schriftelijk
      vrijstelling te verlenen van één of meer van de in [3.2][ref1] genoemde voorwaarden in het geval tijdelijk niet aan
      deze voorwaarden kan worden voldaan. Bedoelde vrijstelling wordt verleend op gemotiveerd schriftelijk verzoek tot
      uiterlijk een maand voor de aanvang van de gecontracteerde transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.2
    text: |-
      Een erkenning is geldig tot het moment dat deze wordt ingetrokken. De netbeheerder van het landelijk
      gastransportnet trekt een erkenning slechts in op verzoek van de erkende programmaverantwoordelijke of als de
      erkende programmaverantwoordelijke niet langer voldoet aan de voorwaarden zoals genoemd in [3.2][ref1] of, na
      overleg met de Autoriteit Consument en Markt, indien de erkende programmaverantwoordelijke redelijkerwijs niet
      in staat wordt geacht de verplichtingen als opgenomen in deze Transportcode gas LNB na te komen. Intrekking
      van de erkenning op verzoek van de erkende programmaverantwoordelijke is uitsluitend mogelijk indien de erkende
      programmaverantwoordelijke geen gebruik (meer) maakt van de transportcapaciteit van de netbeheerder van het
      landelijk gastransportnet en de erkende programmaverantwoordelijke geen programmaverantwoordelijkheid meer
      draagt. De netbeheerder van het landelijk gastransportnet informeert elke regionale netbeheerder terstond over
      de intrekking van een erkenning LB. Indien de netbeheerder van het landelijk gastransportnet heeft besloten de
      erkenning van een erkende programmaverantwoordelijke in te trekken en deze intrekking is niet op het verzoek van
      de erkende programmaverantwoordelijke zelf, meldt hij dat aan de Autoriteit Consument en Markt en informeert hij
      de overige erkende programmaverantwoordelijken hierover. De erkende programmaverantwoordelijke wiens erkenning is
      ingetrokken of waarvan de intrekking van de erkenning is opgeschort zoals bedoeld in [artikel 3.3.4.1][ref2] wordt
      hierna de wegvallende erkende programmaverantwoordelijke genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert een aparte lijst met rechtspersonen en natuurlijke
      personen van wie de erkenning LB is ingetrokken op zijn website onder vermelding van de datum waarop de erkenning
      is ingetrokken. De reden van de intrekking wordt daarbij niet vermeld.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.3
  - number: 3.3.4.1
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet een erkende programmaverantwoordelijke redelijkerwijs niet
      meer in staat acht om aan de verplichtingen van de Transportcode gas LNB te voldoen dan bepaalt de netbeheerder van
      het landelijk gastransportnet na overleg met de Autoriteit Consument en Markt of, en zo ja onder welke voorwaarden,
      hij de erkende programmaverantwoordelijke dan wel de bewindvoerder en erkende programmaverantwoordelijke
      tezamen onderscheidenlijk de curator aanbiedt om intrekking van de erkenning als programmaverantwoordelijke op
      te schorten voor ten hoogste 10 werkdagen of voor ten hoogste 25 werkdagen indien de situatie als bedoeld in
      [artikel 3.3.7][ref1] van toepassing is. De genoemde voorwaarden kunnen onder andere bevatten: eisen aan de inkoop
      van energie gedurende de opschorting en zekerheidstelling voor eventuele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.2
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet besluit om conform [artikel 3 3.4.1][ref1] de
      intrekking van de erkenning op te schorten kan hij, na overleg met de Autoriteit Consument en Markt, aan de
      programmaverantwoordelijke aanbieden, voor zover dat redelijkerwijs noodzakelijk is, om geheel of gedeeltelijk
      garant te staan voor de aan deze opschorting gerelateerde kosten of verplichtingen. Deze kunnen onder meer bestaan
      uit de eventuele kosten of verplichtingen voor de inkoop van gas kosten ten gevolge van het niet in balans zijn
      van de erkende programmaverantwoordelijke en andere activiteiten rechtstreeks voortvloeiend uit de verplichtingen
      van de erkende programmaverantwoordelijke. Bij deze kosten zijn de eventueel door de overheid opgelegde heffingen
      inbegrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.3
    text: |-
      Indien het in [3.3.4.1][ref1] bedoelde overleg tot opschorting van de intrekking van de erkenning van de
      betreffende programmaverantwoordelijke leidt, worden gedurende de opschorting alle individuele verzoeken tot
      overdracht van programmaverantwoordelijkheid naar de betreffende programmaverantwoordelijke geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.4
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet besluit tot intrekking van de erkenning en over te
      gaan tot een verdeling als bedoeld in [artikel 3.3.5.1, eerste lid, onderdelen b en e][ref1], worden individuele
      verzoeken tot overdracht van de programmaverantwoordelijkheid van de wegvallende erkende programmaverantwoordelijke
      naar een andere erkende programmaverantwoordelijke geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.5
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert na een besluit tot opschorting van de intrekking
      van de erkenning van een erkende programmaverantwoordelijke de overige erkende programmaverantwoordelijken, de
      Autoriteit Consument en Markt en, indien het een erkenning LB betreft, de regionale netbeheerders daarover. Indien
      de wegvallende erkende programmaverantwoordelijke programmaverantwoordelijkheid draagt voor een aansluiting op
      het landelijk gastransportnet, informeert de netbeheerder van het landelijk gastransportnet tevens de betreffende
      aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.5
  - number: 3.3.4.6
    text: |-
      Een besluit van de netbeheerder van het landelijk gastranssportnet om de intrekking van de erkenning van een
      erkende programmaverantwoordelijke op te schorten, wordt in de in [artikel 3.3.3][ref1]. bedoelde lijst met erkende
      programmaverantwoordelijken van de netbeheerder van het landelijk gastransportnet verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.7
    text: |-
      Onverminderd het bepaalde in [artikel 3.3.5.1, vijfde lid][ref1], bevat de informatieverstrekking aan de regionale
      netbeheerders en aangeslotenen als bedoeld in [artikel 3.3.4.5][ref2] ook de voorziene reactietermijn voor de in
      artikel 3.3.5.1, eerste lid, onderdelen a, c en d, bedoelde kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.8
    text: |-
      De betrokken regionale netbeheerders communiceren de informatie als bedoeld in [artikelen 3.3.4.5][ref1] en
      [3.3.4.7][ref2] onverwijld aan:


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.8
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.8.a
    text: |-
      de leveranciers van de grootverbruikers voor wie de wegvallende erkende programmaverantwoordelijke
      programmaverantwoordelijkheid draagt, voor zo ver de leverancier door de grootverbruiker is gemachtigd om de
      programmaverantwoordelijkheid voor de aansluiting van die grootverbruikers te regelen;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.8
  - number: 3.3.4.8.b
    text: |-
      de grootverbruikers voor wie de wegvallende erkende programmaverantwoordelijke programmaverantwoordelijkheid
      draagt, indien geen sprake is van machtiging door de grootverbruiker aan een leverancier voor het regelen van de
      programmaverantwoordelijkheid:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.8
  - number: 3.3.4.8.c
    text: |-
      de vergunninghouders die de programmaverantwoordelijkheid voor aansluitingen van kleinverbruikers aan de
      wegvallende erkende programmaverantwoordelijke hebben overgedragen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.8
  - number: 3.3.4.9
    text: |-
      Behoudens de kosten uit [artikel 3.3.4.10][ref1] zullen de nog niet op de erkende programmaverantwoordelijke
      verhaalde kosten als gevolg van het verstrekken van een garantie als bedoeld in [artikel 3.3.4.2.][ref2] in
      kalenderjaar t+2 in de tarieven worden verwerkt. De Autoriteit Consument en Markt neemt hiertoe deze kosten op
      in het in [artikel 82, vijfde lid, van de Gaswet][ref3] bedoelde besluit. Eventuele ontvangsten zullen in het
      eerstvolgende besluit zoals bedoeld in artikel 82, vijfde lid, van de Gaswet, in mindering op de tarieven worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel82
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.9
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '82'
  - number: 3.3.4.10
    text: |-
      De balanceringskosten, zoals bedoeld in NC-BAL, van de netbeheerder van het landelijk gastransportnet die aan
      een erkende programmaverantwoordelijke zijn toegewezen, maar door wanbetaling niet zijn verhaald, worden conform
      [artikel 4.1.8, tweede lid, onderdeel d][ref1], verrekend in de neutraliteitsheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.4.10
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 3.3.5.1.1
    text: |-
      Als de netbeheerder van het landelijk gastransportnet heeft besloten om op grond van [artikel 3.3.4.1][ref1]
      de intrekking van de erkenning van een erkende programmaverantwoordelijke op te schorten, wordt de
      programmaverantwoordelijkheid over de erkende programmaverantwoordelijken als volgt verdeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5.1.1.a
    text: |-
      de programmaverantwoordelijkheid voor kleinverbruikers die de vergunninghouder aan de wegvallende erkende
      programmaverantwoordelijke, heeft overgedragen: aan de erkende programmaverantwoordelijke die de vergunninghouder
      onverwijld aan de netbeheerder van de betreffende kleinverbruikers opgeeft;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
  - number: 3.3.5.1.1.b
    text: |-
      de programmaverantwoordelijkheid voor kleinverbruikers waarvoor de in sub a bedoelde vergunninghouder niet
      tijdig de nieuwe erkende programmaverantwoordelijke heeft opgegeven: aan de erkende programmaverantwoordelijken
      van kleinverbruikers naar rato van het aantal kleinverbruikers waarvoor een erkende programmaverantwoordelijke
      programmaverantwoordelijkheid draagt. De verdeling wordt uitgedrukt in procenten, waarbij wordt afgerond op
      tienden van procenten, waarbij een minimum van vijf nieuwe aansluitingen van kleinverbruikers per erkende
      programmaverantwoordelijke geldt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
  - number: 3.3.5.1.1.c
    text: |-
      de programmaverantwoordelijkheid voor grootverbruikers waarvoor de leverancier, daartoe bepaaldelijk gemachtigd
      door de grootverbruiker, de programmaverantwoordelijkheid heeft geregeld: aan de erkende programmaverantwoordelijke
      die de leverancier onverwijld aan de netbeheerder van de betreffende grootverbruikers opgeeft;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
  - number: 3.3.5.1.1.d
    text: |-
      de programmaverantwoordelijkheid voor grootverbruikers en producenten die zelf een erkende
      programmaverantwoordelijke aanwijzen: aan de erkende programmaverantwoordelijke die de grootverbruiker of producent
      onverwijld aan diens netbeheerder opgeeft;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
  - number: 3.3.5.1.1.e
    text: |-
      de programmaverantwoordelijkheid voor grootverbruikers waarvoor de in sub c bedoelde leverancier en/of de in sub
      d bedoelde grootverbruiker of producent niet tijdig de nieuwe erkende programmaverantwoordelijke heeft doorgegeven
      en: '- de grootverbruiker een direct aangeslotene is: aan erkende programmaverantwoordelijken naar rato van de'
      gecontracteerde exitcapaciteit voor direct aangeslotenen;
        - de producent rechtstreeks of via een gasproductienet op het landelijk gastransportnet invoedt: aan erkende
      programmaverantwoordelijken naar rato van de gecontracteerde entrycapaciteit voor producenten die rechtstreeks of
      via een gasproductienet op het landelijk gastransportnet invoeden.
        - de grootverbruiker of producent is aangesloten op een regionaal gastransportnetwerk: aan erkende
      programmaverantwoordelijken met licentie LB naar rato van exitcapaciteit voor grootverbruikers zoals vastgesteld
      op basis van [artikel 2.1.2d][ref1] en [2.1.2e][ref2], respectievelijk naar rato van programmaverantwoordelijkheid
      voor op de regionale transportnetten ingevoed gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.5.1.2
    text: |-
      De erkende programmaverantwoordelijken die op grond van sub b en/of sub e van het eerste lid
      programmaverantwoordelijkheid toegewezen hebben gekregen, informeren zo spoedig mogelijk, maar uiterlijk binnen
      drie werkdagen na de verdeling de betrokken grootverbruikers, de betrokken producenten, en de vergunninghouder van
      de betrokken kleinverbruikers, over deze toewijzing, de bij hen geldende voorwaarden en de opzegmogelijkheden.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
  - number: 3.3.5.1.3
    text: |-
      Indien de programmaverantwoordelijkheid van klein- of grootverbruikers of van producenten als gevolg van
      het intrekken van erkenning van de erkende programmaverantwoordelijke wordt verdeeld op grond van sub b of
      sub e van de eerste lid, zorgt de netbeheerder van het landelijk gastransportnet ervoor dat de verdeling van
      programmaverantwoordelijkheid binnen één werkdag in zijn aansluitingenregister wordt verwerkt en verzoekt de
      netbeheerder van het landelijk gastransportnet de betrokken regionale netbeheerders deze verdeling binnen één
      werkdag in hun aansluitingenregister te verwerken.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
  - number: 3.3.5.1.4
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet op grond van [artikel 3 3.2][ref1] besluit tot
      onmiddellijke intrekking van een erkenning dan wordt de programmaverantwoordelijkheid verdeeld conform het bepaalde
      in [artikel 3.3.5.1, eerste lid, onderdelen b en e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5.1.5
    text: |-
      De netbeheerder van het landelijk gastransportnet heeft het recht om te allen tijde een opschortingsperiode
      van de intrekking van de erkenning voortijdig te beëindigen en over te gaan tot onmiddellijke
      intrekking van de erkenning. De programmaverantwoordelijkheid wordt verdeeld conform het bepaalde in
      [artikel 3.3.5.1, eerste lid, onderdelen b en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5.2
    text: |-
      De grootverbruiker of producent die via de in deze paragraaf bedoelde verdeling een andere erkende
      programmaverantwoordelijke heeft gekregen voor zijn aansluiting, heeft gedurende twee maanden na de verdeling het
      recht zonder opzegtermijn van erkende programmaverantwoordelijke te wisselen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.2
  - number: 3.3.5.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.3
  - number: 3.3.5.4
    text: |-
      In de in [artikel 3.3.5.1, eerste lid, sub b en sub e][ref1], genoemde verdeling wordt rekening gehouden met
      een verzoek van een erkende programmaverantwoordelijke om de aan hem toegewezen aansluitingen toe te wijzen
      aan een andere erkende programmaverantwoordelijke indien beide betrokken erkende programmaverantwoordelijken
      hiertoe gezamenlijk een verzoek hebben ingediend bij de netbeheerder van het landelijk gastransportnet. De
      verwerkingstermijn van een dergelijk verzoek bedraagt maximaal twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.6
    text: |-
      Indien een leverancier surseance van betaling is verleend respectievelijk failliet is verklaard, geldt voor de
      leveringen van de betreffende leverancier die niet vallen onder het [Besluit leveringszekerheid Gaswet][ref1],
      dat de erkende programmaverantwoordelijke die de programmaverantwoordelijkheid voor die aangeslotenen
      draagt, zijn programmaverantwoordelijkheid tijdelijk dient te continueren tegen redelijke tarieven. Betrokken
      partijen informeren elkaar onverwijld over de ontstane situatie. In verband met het continueren van de
      programmaverantwoordelijkheid informeren de erkende programmaverantwoordelijke en de betreffende netbeheerder de
      betrokken aangeslotenen onverwijld over de ontstane situatie. De erkende programmaverantwoordelijke dient zijn
      programmaverantwoordelijkheid voor die aangeslotenen te continueren tot het moment waarop die aangeslotene een
      nieuwe leveringsovereenkomst heeft gesloten dan wel de levering aan die aangeslotene is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0016605
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0016605
  - number: 3.3.7
    text: |-
      In geval van dezelfde partij het besluit wordt genomen de vergunning en de erkenning in te trekken geldt de
      aanvullende bepaling dat het besluit dat de vergunning wordt ingetrokken eerder geacht te zijn genomen dan het
      besluit tot intrekken van de erkenning als programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.7
  - number: 3.3.8
    text: |-
      In het geval de programmaverantwoordelijke waarvan de erkenning is ingetrokken eveneens leverancier was, zal bij de
      verdeling van de programmaverantwoordelijkheid conform [3.3.5.1][ref1], door de erkende programmaverantwoordelijke
      die programmaverantwoordelijkheid voor grootverbruikers krijgt toebedeeld, aan de betreffende netbeheerder bekend
      worden gemaakt welke leverancier verantwoordelijk wordt voor de levering bij de toebedeelde grootverbruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.3.8
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.1
    text: |-
      Een aangeslotene die voldoet aan het bepaalde in [3.2.0.a][ref1] is uitsluitend gerechtigd exitcapaciteit te
      contracteren op het landelijk gastransportnet aangesloten aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.4.2
    text: |-
      De betrokken aangeslotene is niet gerechtigd gebruik te maken van de andere diensten van de netbeheerder van het
      landelijk gastransportnet waaronder begrepen het deelnemen aan het gastransport. Dit is voorbehouden aan een ieder
      die voldoet aan de voorwaarden van [3.2.0.a t/m 3.2.0.c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.5.1.1
    text: |-
      Een aangeslotene die de programmaverantwoordelijkheid voor zijn aansluiting niet zelf zal uitoefenen, meldt aan
      zijn netbeheerder aan welke erkende programmaverantwoordelijke(n) hij zijn programmaverantwoordelijkheid heeft
      overgedragen. Deze melding kan door middel van een switchbericht van de daartoe gemachtigde leverancier dan wel
      door middel van een schriftelijke mededeling.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.5.1.1
  - number: 3.5.1.2
    text: |-
      Op een grenspunt en op een installatie voor de opslag van gas of LNG heeft de partij die het gebruiksrecht van de
      entry- en/of exitcapaciteit heeft programmaverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.5.1.2
  - number: 3.5.1.3
    text: |-
      Op een entrypunt waar een gasproductienet is verbonden met het landelijk gastransportnet, hebben de partijen
      aangesloten op dat gasproductienet programmaverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.5.1.3
  - number: 3.5.2
    text: |-
      Een erkende programmaverantwoordelijke is verplicht programmaverantwoordelijkheid uit te oefenen met betrekking
      tot de aansluitingen waarvoor hij in de aansluitingenregisters van de netbeheerders op enig moment als
      programmaverantwoordelijke is vermeld.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.5.2
  - number: 3.5.3
    text: |-
      De netbeheerders mogen afgaan op hetgeen in de aansluitingenregisters omtrent de programmaverantwoordelijkheid voor
      een aansluiting is vermeld, onverminderd het recht van de erkende programmaverantwoordelijke op correctie van een
      onjuiste vermelding.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.5.3
  - number: 4.1.0
    text: De erkende programmaverantwoordelijke is verantwoordelijk voor het bewaken van de balans per portfolio.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.0
  - number: 4.1.1.1
    text: |-
      Een erkende programmaverantwoordelijke dient dagelijks voor 14:00 uur bij de netbeheerder van het landelijk
      gastransportnet een entryprogramma en/of exitprogramma voor de volgende gasdag in.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.1.1
  - number: 4.1.1.2
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op zijn website een formule die de
      relatie voorschrijft tussen entry- en exithoeveelheden per uur voor een exitprogramma. De erkende
      programmaverantwoordelijke is verplicht de formule toe te passen in een exitprogramma, dat geheel of gedeeltelijk
      betrekking heeft op de levering van gas aan kleinverbruikers. De formule mag niet worden toegepast op de netto
      verkooppositie door transacties op het virtuele handelspunt. De parameters van deze formule die gelden voor de
      volgende gasdag publiceert de netbeheerder van het landelijk gastransportnet dagelijks voor 09:00 uur op zijn
      website. De formule wordt zodanig opgesteld dat na toepassing van de formule de entryhoeveelheid per gasdag gelijk
      is aan de exithoeveelheid.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.1.2
  - number: 4.1.1.3
    text: |-
      Uiterlijk een uur na het tijdstip waarop de in [4.1.1.1][ref1] bedoelde entry- en/of exitprogramma’s moeten zijn
      ingediend, informeert de netbeheerder van het landelijk gastransportnet de erkende programmaverantwoordelijke of
      de entry- en/of exitprogramma’s zijn goedgekeurd. De netbeheerder van het landelijk gastransportnet keurt in ieder
      geval een exitprogramma af indien het exitprogramma niet voldoet aan de eisen zoals beschreven in [4.1.1.2][ref2].
      Indien de erkende programmaverantwoordelijke afziet van het toepassen van de in 4.1.1.2 bedoelde formule in
      zijn exitprogramma, dan keurt de netbeheerder van het landelijk gastransportnet in ieder geval het exitprogramma
      af indien in dat exitprogramma de entry- en exithoeveelheid niet ieder uur gelijk is. De netbeheerder van het
      landelijk gastransportnet keurt in ieder geval een entryprogramma af indien in het entryprogramma de entry- en
      exithoeveelheid niet ieder uur gelijk is. De netbeheerder van het landelijk gastransportnet keurt in ieder geval
      een entry- of exitprogramma af indien de netbeheerder van het landelijk gastransportnet op het VPPV inconsistentie
      constateert met andere exit- respectievelijk entryprogramma’s van de erkende programmaverantwoordelijke zelf en/
      of van een andere erkende programmaverantwoordelijke. Dat een ander exit- of entryprogramma nog niet volledig
      is goedgekeurd, hoeft voor een programma waarin programmaverantwoordelijkheid overgaat van of naar het nog niet
      goedgekeurde programma, niet te leiden tot inconsistentie.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.1.4
    text: |-
      Nadat de erkende programmaverantwoordelijke van de netbeheerder van het landelijk gastransportnet bericht heeft
      ontvangen dat zijn entry- en/of exitprogramma is afgekeurd, dient hij een verbeterd entry- en/of exitprogramma in,
      die opnieuw de goedkeuring van de netbeheerder van het landelijk gastransportnet behoeven.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.1.4
  - number: 4.1.1.5
    text: |-
      Indien om 22:00 uur voorafgaand aan de gasdag geen goedgekeurd entry- en/of exitprogramma beschikbaar
      is, stelt de netbeheerder van het landelijk gastransportnet op basis van de hem bekende informatie dit
      entry- en/of exitprogramma vast. Indien op dit tijdstip de netbeheerder van het landelijk gastransportnet
      inconsistentie constateert op het VPPV tussen het programma van een beurs aangewezen conform
      [artikel 66b van de Gaswet][ref1] of een afwikkelonderneming (clearing house) die beschikt over een vergunning
      conform de [Wet op het financieel toezicht][ref2] (Wft) en een exit- en/of entryprogramma van een andere erkende
      programmaverantwoordelijke, dan stelt de netbeheerder van het landelijk gastransportnet de betrokken programma’s
      vast in lijn met het door een beurs of afwikkelonderneming ingediende programma.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66b
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 66b
      - id: ref2
        bwb_id: BWBR0020368
  - number: 4.1.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op basis van de goedgekeurde entry- en exitprogramma’s
      uiterlijk twee uur voor het begin van de gasdag voor een ieder opvraagbaar de uurwaarden van de grenzen van de
      zones voor balanshandhaving voor de betreffende gasdag, zijnde: - de grens tussen de donkergroene zone en de
      lichtgroene zone;
        - de grens tussen de lichtgroene zone en de oranje zone;
        - de grens tussen de oranje zone en de rode zone.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.1
  - number: 4.1.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert, zodra deze beschikbaar zijn, per uur voor een ieder
      opvraagbaar:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.2.a
    text: '[Vervallen];'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.2.b
    text: |-
      de hoeveelheid gas gekocht/verkocht middels WDM-transacties, de uren waarin het gas wordt geleverd/afgenomen en de
      WDM-transactieprijs;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.2.c
    text: '[Vervallen];'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.2.d
    text: de som van de posities van de onbalans veroorzakende programmaverantwoordelijken;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.2.e
    text: '[Vervallen];'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.2.f
    text: het systeem balans signaal.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.2
  - number: 4.1.2.3
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op uurbasis per portfolio per uur, zodra deze
      beschikbaar zijn, onderstaande informatie die alleen opvraagbaar is door geautoriseerde medewerkers van de
      betreffende erkende programmaverantwoordelijke:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.3
  - number: 4.1.2.3.a
    text: het goedgekeurde entry- en/of exitprogramma;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.3
  - number: 4.1.2.3.b
    text: |-
      de uuronbalans, zijnde de vastgestelde netto afwijking van de near real time allocaties ten opzichte van het
      goedgekeurde entry- en/of exitprogramma;
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.3
  - number: 4.1.2.3.c
    text: |-
      na een WDM-transactie: de hoeveelheid gas die ten gevolge van de WDM-transactie door de netbeheerder
      van het landelijk gastransportnet is gekocht van of verkocht aan de onbalans veroorzakende erkende
      programmaverantwoordelijken conform [4.1.4.2][ref1] en [4.1.4.3][ref2], het uur van de WDM-transactie en de prijs;


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.2.3.d
    text: de cumulatie van de uuronbalansen, zijnde het portfolio onbalans signaal.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.2.3
  - number: 4.1.4.1
    text: |-
      De positie van het systeem balans signaal bevindt zich in één van de volgende vier zones: donkergroen, lichtgroen,
      oranje, rood. Hierbij is de mate van systeemonbalans vanaf de donkergroene zone, in de volgorde zoals hiervoor
      benoemd, steeds oplopend, zowel in een tekortsituatie als in een overschotsituatie. In de eerste helft van ieder
      uur voorspelt de netbeheerder van het landelijk gastransportnet de positie van het systeem balans signaal aan
      het einde van dat uur. Als deze voorspelling in de donkergroene zone uitkomt, dan onderneemt de netbeheerder
      van het landelijk gastransportnet geen actie met betrekking tot balanshandhaving. Als deze voorspelling buiten
      de donkergroene zone uitkomt en toeneemt ten opzichte van de voorspelling van de systeemonbalans van het
      voorgaande uur, dan zal de netbeheerder van het landelijk gastransportnet een WDM-titletransactie aangaan om de
      systeemonbalans te verminderen. De hoeveelheid waarvoor de netbeheerder van het landelijk gastransportnet de WDM-
      titletransactie aangaat is het verschil tussen de voorspelde waarde van het systeem balans signaal aan het eind
      van het uur en de grens tussen de donkergroene zone en de lichtgroene zone, verminderd met de hoeveelheid gas die
      de netbeheerder van het landelijk gastransportnet middels eerdere WDM-titletransacties heeft gekocht/verkocht en
      die nog die nog geleverd/afgenomen moeten worden. Als deze voorspelling in de rode zone uitkomt en de netbeheerder
      van het landelijk gastransportnet verwacht dat de inzet van de WDM-transactie onvoldoende effect zal hebben,
      kan de netbeheerder van het landelijk gastransportnet een noodsituatie uitroepen en handelen zoals beschreven in
      [4.1.4.4][ref1]. Een WDM-transactie heeft invloed op het portfolio onbalans signaal van het betreffende portfolio.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.2
    text: |-
      De hoeveelheid gas die de netbeheerder van het landelijk gastransportnet koopt conform [4.1.4.1][ref1] verkoopt de
      netbeheerder van het landelijk gastransportnet in het uur van levering of afname tegen de WDM-transactieprijs aan
      de onbalans veroorzakende programmaverantwoordelijke(n) naar rato van de waarde van hun portfolio onbalans signaal
      die betrekking heeft op het begin van het uur van de WDM-transactie. Dit heeft invloed op het portfolio onbalans
      signaal in het uur van levering of afname van dit gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.3
    text: |-
      De hoeveelheid gas die de netbeheerder van het landelijk gastransportnet verkoopt conform [4.1.4.1][ref1] koopt de
      netbeheerder van het landelijk gastransportnet in het uur van levering of afname tegen de WDM-transactieprijs van
      de onbalans veroorzakende programmaverantwoordelijke(n) naar rato van de waarde van hun portfolio onbalans signaal
      die betrekking heeft op het begin van het uur van de WDM-transactie. Dit heeft invloed op het portfolio onbalans
      signaal in het uur van levering of afname van dit gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.4
    text: |-
      Als de netbeheerder van het landelijk gastransportnet een noodsituatie heeft uitgeroepen zoals beschreven in
      [4.1.4.1][ref1] of [4.1.4.5][ref2], dan kan de netbeheerder van het landelijk gastransportnet besluiten om (een
      van) de volgende maatregelen te treffen: - het opschorten van het proces dat de WDM-transacties initieert zoals
      omschreven in [4.1.4.1][ref3];
        - inzet van eventueel gecontracteerde middelen voor noodsituaties;
        - instructies betreffende installaties voor de opslag van gas of LNG en op entrypunten van het landelijk
      gastransportnet;
        - instructies op exitpunten van het landelijk gastransportnet. Erkende programmaverantwoordelijken zijn verplicht
      de instructie(s) op te volgen. Na afloop van de noodsituatie overleggen de netbeheerder van het landelijk
      gastransportnet en de betrokken erkende programmaverantwoordelijke over de afwikkeling van de ontstane situatie.
      Als de netbeheerder van het landelijk gastransportnet een noodsituatie heeft uitgeroepen zoals beschreven in
      [4.1.4.1][ref4], dan zal de netbeheerder van het landelijk gastransportnet dit publiceren onder vermelding van het
      uur van de start van de noodsituatie. Instructies van de netbeheerder van het landelijk gastransportnet in deze
      situatie hebben invloed op het portfolio onbalans signaal van het betreffende portfolio. Een hoeveelheid gas die
      de netbeheerder van het landelijk gastransportnet door middel van een instructie koopt of verkoopt, additioneel aan
      de WDM-transactie, wordt verrekend tegen de WDM-transactieprijs van het betreffende uur. Als de netbeheerder van
      het landelijk gastransportnet een noodsituatie heeft uitgeroepen zoals beschreven in [4.1.4.5][ref5], dan zal de
      netbeheerder van het landelijk gastransportnet dit zo spoedig mogelijk publiceren onder vermelding van het uur van
      de start van de noodsituatie. Instructies van de netbeheerder van het landelijk gastransportnet in deze situatie
      hebben geen invloed op het portfolio onbalans signaal van het betreffende portfolio, en worden via transacties
      tussen de netbeheerder van het landelijk gastransportnet en de erkende programmaverantwoordelijke op een virtueel
      punt afgehandeld tegen de neutrale gasprijs als bedoeld in [4.1.6.4][ref6]. Als de door de netbeheerder van
      het landelijk gastransportnet uitgeroepen noodsituatie ten einde is, zal de netbeheerder van het landelijk
      gastransportnet dit zo spoedig mogelijk publiceren onder vermelding van het tijdstip van einde van de noodsituatie.
      In geval van een noodsituatie zal de netbeheerder van het landelijk gastransportnet aan de betrokken erkende
      programmaverantwoordelijke geen tarief voor een overschrijding van de gecontracteerde entry- of exitcapaciteit
      conform [artikel 3.10 van de Tarievencode gas](onbekend) berekenen indien en voor zover deze overschrijding een
      gevolg is van een volgens dit artikel door de netbeheerder van het landelijk gastransportnet gegeven instructie.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.4
