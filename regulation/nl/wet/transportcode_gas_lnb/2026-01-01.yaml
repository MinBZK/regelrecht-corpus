  - number: 4.1.4.10.1
    text: |-
      Als de netbeheerder van het landelijk gastransportnet een WDM-transactie conform [artikel 4.1.4.1][ref1]
      uitvoert, brengt de netbeheerder van het landelijk gastransportnet bij iedere onbalansveroorzakende
      programmaverantwoordelijke een heffing, conform artikel 3, zeventiende lid van NC-BAL, in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.10
    references:
