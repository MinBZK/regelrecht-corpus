  - number: 4.1.4.5.1
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet geconfronteerd wordt met onverwachte grote storingen
      kan de netbeheerder van het landelijk gastransportnet een noodsituatie uitroepen en handelen zoals beschreven in
      [artikel 4.1.4.4][ref1]. Onder onverwachte grote storingen wordt ook begrepen een storing in de tot het landelijk
      gastransportnet behorende ondersteunende communicatie en besturingssystemen, waarbij de systeemintegriteit in het
      geding komt of kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.5.2
    text: |-
      Bij de afwikkeling van een noodsituatie als bedoeld in het eerste lid, zal een eventueel verschil tussen de
      hoeveelheid entrygas en de hoeveelheid exitgas onder aftrek van het verschil tussen entry- en exitgas op basis van
      [artikel 4.1.1.2][ref1] verrekend worden tegen de neutrale gasprijs als bedoeld in [artikel 4.1.6.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.5.3
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet in een noodsituatie als bedoeld in het eerste lid een WDM-
      transactie aangaat, dan ontstaat er een saldo door het prijsverschil tussen de neutrale gasprijs als bedoeld in
      [artikel 4.1.6.4][ref1] en de WDM-transactieprijs. Dit saldo wordt verrekend conform [artikel 4.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.6.1
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet geconfronteerd wordt met storingen in de
      informatievoorzieningssystemen betreffende het balanceringsregime, bedoeld om erkende programmaverantwoordelijken
      van informatie te voorzien, kan de netbeheerder van het landelijk gastransportnet besluiten tot het opschorten van
      het proces dat de WDM-transacties initieert zoals omschreven in [artikel 4.1.4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.6.2
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet het proces dat de WDM-transacties initieert heeft
      opgeschort, dan zal de netbeheerder van het landelijk gastransportnet dit zo spoedig mogelijk publiceren onder
      vermelding van het tijdstip waarop dit ingaat.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.6
  - number: 4.1.4.6.3
    text: |-
      Tijdens een situatie waarin de informatievoorzieningssystemen gestoord zijn, wordt een eventuele WDM-transactie
      met de onbalans veroorzakende erkende programmaverantwoordelijke(n) verrekend tegen de neutrale gasprijs conform
      [artikel 4.1.6.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.6.4
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet in deze situatie een WDM-transactie aangaat, dan ontstaat
      er een saldo door het prijsverschil tussen de neutrale gasprijs als bedoeld in [artikel 4.1.6.4][ref1] en de WDM-
      transactieprijs. Dit saldo wordt verrekend conform [artikel 4.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.6.5
    text: |-
      Indien de informatievoorzieningssystemen weer in orde zijn, zal de opschorting worden beëindigd. De netbeheerder
      van het landelijk gastransportnet zal dit zo spoedig mogelijk publiceren onder vermelding van het tijdstip van
      einde van de opschorting.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.6
  - number: 4.1.4.7.1
    text: |-
      Er is sprake van ongewenst balanceringsgedrag door een erkende programmaverantwoordelijke indien op enig heel
      uur (uu:00): a. Er in het vorige uur een balanceringsactie conform [artikel 4.1.4][ref1] is uitgevoerd, en b. De
      erkende programmaverantwoordelijke mede onbalansveroorzaker is geweest van die balanceringsactie zoals die volgens
      [artikel 4.1.4.2][ref2] of [artikel 4.1.4.3][ref3] is uitgevoerd, en c. De absolute waarde van haar portfolio
      onbalans signaal op uu:00 groter is dan 15% van de absolute grenswaarde van de donkergroene zone; en d. Er is
      sprake van minstens één van de volgende omstandigheden op uu:00: a. Het betreffende portfolio wordt vooral via
      TTF gebalanceerd. Dat is het geval indien één van de volgende situaties optreedt: i. De absolute waarde van de TTF
      near-real-time allocaties in de portfolio is groter dan de som van alle near-real-time entry en exit allocaties
      in de portfolio (in absolute zin) op entry- en exitpunten waar het gas fysiek stroomt, of; ii. Het portfolio heeft
      geen near-real-time allocatie op entrypunten waar het gas fysiek het netwerk wordt ingevoed; of; iii. Het portfolio
      heeft geen near-real-time allocatie op exitpunten waar het gas fysiek aan het netwerk wordt onttrokken. of b. De
      portfolio-onbalans is groter dan de portfolio omvang op dat betreffende uur. Dat is het geval indien de absolute
      waarde van het portfolio onbalans signaal groter is dan de som van de TTF near-real-time allocaties en alle near-
      real-time entry en exit allocaties in de portfolio (in absolute zin) op entry- en exitpunten waar het gas fysiek
      stroomt op dat betreffende uur.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.7.2a
    text: |-
      Indien een erkende programmaverantwoordelijke ongewenst balanceringsgedrag vertoont overeenkomstig het eerste lid,
      dan zal de netbeheerder van het landelijk gastransportnet bij deze erkende programmaverantwoordelijke een heffing,
      conform artikel 3, zeventiende lid van NC-BAL, in rekening brengen. De heffing is gelijk aan 30% van de absolute
      waarde van het bedrag dat volgt uit [artikel 4.1.4.2][ref1] of uit [artikel 4.1.4.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.7.2b
    text: |-
      Indien een erkende programmaverantwoordelijke voor de eerste keer ongewenst balanceringsgedrag vertoont
      overeenkomstig het eerste lid, dan zal de netbeheerder van het landelijk gastransportnet dit toelichten aan de
      erkende programmaverantwoordelijke en geen heffingen in rekening brengen tot het moment waarop de toelichting
      schriftelijk is verstuurd aan de betreffende erkende programmaverantwoordelijke. Vanaf de eerstvolgende gasdag,
      nadat de schriftelijke toelichting verstuurd is, is dit lid niet meer van toepassing voor die betreffende erkende
      programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.3
    text: |-
      De heffingen zullen op een inzichtelijke manier door de netbeheerder van het landelijk gastransportnet worden
      gefactureerd.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.4
    text: 'Van een onverwachte fysieke verstoring op een entry- of exitpunt op enig uur is sprake indien:'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.4.a
    text: |-
      De netbeheerder van het landelijk gastransportnet het geconfirmeerde gastransport op dat entry- of exitpunt geheel
      of gedeeltelijk onverwacht niet kan uitvoeren; en
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.4.b
    text: |-
      De oorzaak van deze verstoring niet te wijten valt aan de erkende programmaverantwoordelijke die voor dat
      betreffende entry- of exitpunt programmaverantwoordelijkheid draagt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.5
    text: |-
      Indien er sprake is van een onverwachte fysieke verstoring dan zal, gedurende vijf uren vanaf het ontstaan van
      de onverwachte fysieke verstoring het verschil tussen de confirmatie en de allocatie op het betreffende entry- of
      exitpunt niet worden meegenomen in de bepaling of er sprake is van ongewenst balanceringsgedrag als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.6
    text: |-
      De netbeheerder van het landelijk gastransportnet kan besluiten om de termijn als bedoeld in het vijfde lid
      te verlengen, indien de erkende programmaverantwoordelijke kan aantonen dat de specifieke omstandigheden
      rondom de onverwachte fysieke verstoring het haar onmogelijk maken om na de genoemde termijn geen ongewenst
      balanceringsgedrag als bedoeld in het eerste lid te vertonen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.7
    text: |-
      Indien er in aanvulling op het vijfde lid ook sprake is van een noodsituatie als bedoeld in [artikel 4.1.4.5][ref1]
      dan zal, gedurende de noodsituatie het verschil tussen de confirmatie en de allocatie op het betreffende entry- of
      exitpunt niet worden meegenomen in de bepaling of er sprake is van ongewenst balanceringsgedrag als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.7.8
    text: |-
      Op het moment dat de netbeheerder van het landelijk gastransportnet aanwijzingen heeft dat sprake is van
      gedrag, als bedoeld in het eerste lid, zal zij voordat zij een heffing in rekening brengt, als bedoeld in lid
      2a, de erkende programmaverantwoordelijke de gelegenheid geven zijn standpunt naar voren te brengen (hoor) en
      om te reageren op het standpunt van de netbeheerder van het landelijk gastransportnet (wederhoor). De erkende
      programmaverantwoordelijke kan van de mogelijkheid tot hoor en wederhoor gebruik maken binnen twee weken na
      de melding van de netbeheerder van het landelijk gastransportnet dat er gedrag, als bedoeld in het eerste lid,
      is vastgesteld. Indien de erkende programmaverantwoordelijke niet binnen voornoemde twee weken de netbeheerder
      van het landelijk gastransportnet zijn standpunt heeft kenbaar gemaakt, kan de netbeheerder van het landelijk
      gastransportnet de heffing, als bedoeld in lid 2a, in rekening brengen bij de erkende programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.7.9
    text: |-
      Als strikte toepassing van dit artikel naar het oordeel van de netbeheerder van het landelijk gastransportnet
      onevenredig zou zijn of naar haar oordeel het belang van het balanceringsregime minder is gediend met die strikte
      toepassing, kan de netbeheerder van het landelijk gastransportnet besluiten een heffing, als bedoeld in lid 2a,
      niet in rekening te brengen. De netbeheerder van het landelijk gastransportnet neemt in haar oordeel de hoor en
      wederhoor, als bedoeld in het achtste lid, mee.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.7
  - number: 4.1.4.8.1
    text: |-
      Indien de erkende programmaverantwoordelijke substantieel ongewenst balanceringsgedrag vertoont, dan voldoet de
      programmaverantwoordelijke niet langer aan de voorwaarde als bedoeld in [artikel 3.2.0, onderdeel c][ref1], en kan
      intrekking van de erkenning op grond van [artikel 3.3.2][ref2] onverwijld volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.8
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 4.1.4.8.2
    text: |-
      Een erkende programmaverantwoordelijke vertoont substantieel ongewenst balanceringsgedrag indien, gerekend over
      een aaneengesloten periode van twaalf maanden tot en met de datum waarop het ongewenste balanceringsgedrag voor
      het laatst plaatsvond: a. De erkende programmaverantwoordelijke drie of meer heffingen heeft gehad in één van de
      vier periodes van drie aaneengesloten maanden in die aaneengesloten periode van twaalf maanden en zeven of meer
      heffingen heeft gehad in die aaneengesloten periode van twaalf maanden; Of b. De erkende programmaverantwoordelijke
      in drie of vier van de vier periodes van drie aaneengesloten maanden in die aaneengesloten periode van twaalf
      maanden een heffing heeft gehad.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel4.1.4.8
  - number: 4.1.4.9
    text: |-
      De netbeheerder van het landelijk gastransportnet voert jaarlijks overleg met representatieve organisaties van
      netgebruikers op de gasmarkt over de werking van de [artikelen 4.1.4.7][ref1], [4.1.4.8][ref2] en [4.1.4.10][ref3],
      en stuurt de resultaten hiervan aan de Autoriteit Consument en Markt. Indien deze evaluatie daartoe aanleiding
      geeft, leggen de gezamenlijke netbeheerders een voorstel (tot wijziging) met betrekking tot de artikelen 4.1.4.7,
      4.1.4.8 en 4.1.4.10 ter goedkeuring voor aan Autoriteit Consument en Markt. De evaluatie waarvan sprake is in dit
      artikel kan op initiatief van de netbeheerder van het landelijk gastransportnet en/of de Autoriteit Consument en
      Markt uitgevoerd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel4
