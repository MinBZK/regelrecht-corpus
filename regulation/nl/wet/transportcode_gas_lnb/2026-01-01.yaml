  - number: 2.1.4
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.4
  - number: 2.1.7.1.1
    text: |-
      Diversion betreft het recht van een erkende programmaverantwoordelijke om gecontracteerde entrycapaciteit of
      exitcapaciteit te verplaatsen naar een ander op dezelfde locatie gelegen entrypunt respectievelijk exitpunt onder
      de voorwaarde dat er geen extra beslag op transportcapaciteit wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.1
  - number: 2.1.7.1.2
    text: |-
      In het geval van diversion tussen twee virtuele interconnectiepunten ligt minimaal een van de interconnectiepunten
      die geïntegreerd zijn tot een van beide virtuele interconnectiepunten op dezelfde locatie als een van de
      interconnectiepunten die geïntegreerd zijn tot het andere virtuele interconnectiepunt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.1
  - number: 2.1.7.1.3
    text: |-
      In het geval van diversion tussen een virtueel interconnectiepunt en een binnenlands entry- of exitpunt ligt
      minimaal één van de interconnectiepunten die geïntegreerd zijn tot het virtuele interconnectiepunt op dezelfde
      locatie als het betreffende binnenlandse entry- of exitpunt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.1
  - number: 2.1.7.2.1
    text: |-
      Diversion wordt aangevraagd via een formulier dat de netbeheerder van het landelijk gastransportnet op zijn website
      publiceert.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.2
  - number: 2.1.7.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet weigert de aanvraag indien de aangevraagde diversion extra beslag
      op transportcapaciteit legt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.2
  - number: 2.1.7.2.3
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op zijn website voor welke combinaties van entry- en
      exitpunten diversion wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.2
  - number: 2.1.7.3.1
    text: |-
      Alvorens een erkende programmaverantwoordelijke diversion kan uitvoeren naar een interconnectiepunt, moet
      de erkende programmaverantwoordelijke de capaciteit op dat interconnectiepunt contracteren via het reguliere
      veilingproces (zie referentie naar NC-CAM in [artikel 2.1.2][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.7.3.2
    text: |-
      De betalingsverplichting op het entry- of exitpunt waar capaciteit naar toe wordt verplaatst, volgt rechtstreekst
      uit lid 1.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.3
  - number: 2.1.7.3.3
    text: |-
      Indien de betalingsverplichting op het entry- of exitpunt waar capaciteit naar toe wordt verplaatst, lager
      is dan de betalingsverplichting op het oorspronkelijke entry- of exitpunt, dan blijft de oorspronkelijke
      betalingsverplichting in stand.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.3
  - number: 2.1.7.3.4
    text: |-
      Diversion, bedoeld in het eerste lid, kan voor een jaar-, kwartaal- of maandcapaciteitsproduct worden
      gecontracteerd.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.3
  - number: 2.1.7.4.1
    text: |-
      Diversion op de overige entry- of exitpunten wordt gecontracteerd en aan erkende programmaverantwoordelijken
      toegewezen volgens het first come first served principe.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.4
  - number: 2.1.7.4.2
    text: |-
      De betalingsverplichting op het entry- of exitpunt waar capaciteit naar toe wordt verplaatst, wordt afgeleid van
      het oorspronkelijke capaciteitsproduct en het tarief van dat product op het entry- of exitpunt waar capaciteit naar
      toe wordt verplaatst en de periode waarover wordt verplaatst.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.4
  - number: 2.1.7.4.3
    text: |-
      Indien de betalingsverplichting op het entry- of exitpunt waar capaciteit naar toe verplaatst wordt, lager
      is dan de betalingsverplichting op het oorspronkelijke entry- of exitpunt, dan blijft de oorspronkelijke
      betalingsverplichting in stand.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.4
  - number: 2.1.7.4.4
    text: |-
      Diversion, bedoeld in het eerste lid, kan voor een jaar-, kwartaal-, maand- of dag capaciteitsproduct worden
      gecontracteerd.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.4
  - number: 2.1.7.5
    text: |-
      De status van de door middel van diversion verplaatste entry- of exitcapaciteit zal niet worden aangetast tenzij
      deze verplaatsing de status van de entry- of exitcapaciteit van een andere erkende programmaverantwoordelijke zou
      aantasten.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.7.5
  - number: 2.1.8
    text: |-
      Verlegging geeft het recht om exitcapaciteit van een binnenlands exitpunt voor een bepaalde periode te verplaatsen
      naar een ander binnenlands exitpunt.

      Een erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit kan een verzoek voor verlegging indienen
      bij de netbeheerder van het landelijk gastransportnet. De netbeheerder van het landelijk gastransportnet beoordeelt
      het verzoek voor verlegging. De netbeheerder van het landelijk gastransportnet honoreert het verzoek voor
      verlegging indien het verzoek voldoet aan de volgende cumulatieve voorwaarden:

      a. De verlegging is gerelateerd aan onderhoud of incidenten aan de zijde van de aangeslotene die leiden tot
      merkbare beperking van technisch operationele en tijdelijke aard in de mogelijkheid om gas te onttrekken op
      het exitpunt waar de erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit exitcapaciteit
      heeft gecontracteerd; b. De verlegging heeft betrekking op een aaneengesloten periode die niet langer is dan de
      vooraf bepaalde duur van de merkbare beperking bedoeld in onderdeel a; c. De erkende programmaverantwoordelijke
      of aangeslotene met exitcapaciteit kan de gecontracteerde exitcapaciteit op het exitpunt waar de merkbare
      beperking, als bedoeld in onderdeel a, zich voordoet, geheel of gedeeltelijk benutten op een ander exitpunt
      binnen het portfolio van de erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit; d. De erkende
      programmaverantwoordelijke of aangeslotene met exitcapaciteit heeft in het kalenderjaar waarop het verzoek tot
      verlegging betrekking heeft minder dan tweemaal gebruik gemaakt van verlegging op een specifiek exitpunt; e. De
      te verleggen gecontracteerde exitcapaciteit is beschikbaar op het exitpunt waar de gecontracteerde exitcapaciteit
      naar toe moet worden verlegd; en f. De erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit heeft
      het verzoek voor verlegging zo spoedig mogelijk nadat zij op de hoogte was van de (aanstaande) merkbare beperking
      ingediend.

      De status van de door middel van verlegging verplaatste exitcapaciteit zal niet worden aangetast tenzij deze
      verplaatsing de status van de exitcapaciteit van een andere erkende programmaverantwoordelijke of aangeslotene met
      exitcapaciteit zou aantasten.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.8
  - number: 2.1.9.1
    text: |-
      Bij het opstarten of het uitbreiden van gasinstallaties met een aansluiting op het landelijk gastransportnet kan
      een erkende programmaverantwoordelijke of aangeslotene met transportcapaciteit de netbeheerder van het landelijk
      gastransportnet verzoeken om initieel een geschatte hoeveelheid transportcapaciteit te contracteren voor een
      periode van ten hoogste vier opeenvolgende gasmaanden en de gecontracteerde transportcapaciteit na afloop van deze
      periode bij te stellen naar het maximum van de gebruikte capaciteit per maand.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.9.1
  - number: 2.1.9.2
    text: |-
      De aanpassing of uitbreiding als bedoeld in [artikel 2.1.9.1][ref1] wordt vastgelegd in een aparte
      overeenkomst tussen enerzijds de netbeheerder van het landelijk gastransportnet en anderzijds de erkende
      programmaverantwoordelijke of aangeslotene met transportcapaciteit, met daarin opgenomen de geschatte
      transportcapaciteit. De geschatte transportcapaciteit dient een redelijke beoordeling te zijn van de benodigde
      transportcapaciteit en dient binnen een gasmaand constant te zijn. De geschatte transportcapaciteit vormt de basis
      voor de (voorlopige) berekening van het in rekening te brengen bedrag bij de erkende programmaverantwoordelijke of
      de aangeslotene met transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.9.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.9.3
    text: |-
      De erkende programmaverantwoordelijke of de aangeslotene met transportcapaciteit mag de geschatte
      transportcapaciteit overschrijden. Als hiervoor vooraf toestemming van de netbeheerder van het landelijk
      gastransportnet benodigd is, zal dit opgenomen worden in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.9.3
  - number: 2.1.9.4
    text: |-
      Het overdragen van transportcapaciteit of het gebruik van transportcapaciteit conform [2.1.10][ref1] met betrekking
      tot de geschatte transportcapaciteit als bedoeld in [artikel 2.1.9.2][ref2], is alleen mogelijk voor de gehele
      geschatte transportcapaciteit en voor de gehele periode waarvoor de transportcapaciteit wordt geschat.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.9.4
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.9.5
    text: |-
      Na afloop van de periode van ten hoogste vier maanden waarvoor de transportcapaciteit is geschat, bepaalt
      de netbeheerder van het landelijk gastransportnet voor elke gasmaand van de periode een waarde voor de
      transportcapaciteit in de betreffende gasmaand. Deze waarde is gelijk aan het maximum van de gebruikte
      transportcapaciteit in die maand, zoals gemeten op basis van de [Meetcode gas LNB][ref1]. De erkende
      programmaverantwoordelijke of aangeslotene met transportcapaciteit sluit een herziene overeenkomst met de
      netbeheerder van het landelijk gastransportnet waarmee deze transportcapaciteit wordt gecontracteerd en
      afgerekend op grond van het bepaalde in [artikel 3.6 tot en met 3.10 van de Tarievencode gas](onbekend). Indien
      geen toestemming vooraf is vereist voor het overschrijden van de geschatte transportcapaciteit is de waarde
      van de transportcapaciteit in de herziene overeenkomst gelijk aan de gebruikte transportcapaciteit. Indien wel
      vooraf toestemming is vereist voor het overschrijden van de geschatte transportcapaciteit is de waarde van de
      transportcapaciteit in de herziene overeenkomst gelijk aan de gebruikte transportcapaciteit voor zover de erkende
      programmaverantwoordelijke of aangeslotene met transportcapaciteit vooraf toestemming heeft gevraagd en ontvangen
      van de netbeheerder van het landelijk gastransportnet om de geschatte transportcapaciteit te overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0037935
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.9.5
    references:
      - id: ref1
        bwb_id: BWBR0037935
  - number: 2.1.9.6
    text: |-
      Indien er sprake is van overschrijding van de geschatte transportcapaciteit waarvoor de erkende
      programmaverantwoordelijke of aangeslotene met transportcapaciteit toestemming heeft gevraagd, maar niet heeft
      gekregen, of waarvoor voorafgaande toestemming vereist was maar welke niet is gevraagd, wordt deze overschrijding
      aangemerkt als een overschrijding bedoeld in [artikel 3.10 van de Tarievencode gas](onbekend), en als zodanig
      afgerekend na afloop van de periode van ten hoogste vier maanden waarvoor de transportcapaciteit wordt geschat. Dit
      geldt eveneens indien toestemming is verleend voor overschrijding, maar de erkende programmaverantwoordelijke of
      aangeslotene met transportcapaciteit meer transportcapaciteit gebruikt dan waarvoor toestemming was verkregen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.9.6
  - number: 2.1.10.1
    text: |-
      Een erkende programmaverantwoordelijke of een aangeslotene met exitcapaciteit heeft het recht gecontracteerde
      transportcapaciteit of het gebruik van transportcapaciteit (verder: gebruiksrecht) over te dragen aan een andere
      erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit. Het overdragen van transportcapaciteit of
      het gebruiksrecht is mogelijk tussen een aangeslotene met exitcapaciteit en een erkende programmaverantwoordelijke
      voor zover het de exitcapaciteit op het exitpunt van de aangeslotene met exitcapaciteit betreft of tussen erkende
      programmaverantwoordelijken onderling. Het overdragen van transportcapaciteit of het gebruiksrecht heeft betrekking
      op gecontracteerde transportcapaciteit of het gebruiksrecht voor één of meer gasdagen of voor één of meer
      gasmaanden in de toekomst gelegen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.1
  - number: 2.1.10.2
    text: |-
      Beide partijen dienen gezamenlijk bij de netbeheerder van het landelijk gastransportnet een verzoek in tot het
      overdragen van transportcapaciteit of het gebruiksrecht. Met de overdracht wordt het portfolio van de partij die
      het gebruiksrecht krijgt overgedragen uitgebreid. In verband met [artikel B1.10, lid 1][ref1] van de Transportcode
      gas LNB, toetst de netbeheerder van het landelijk gastransportnet of de actuele kredietruimte van deze partij
      nog toereikend is alvorens medewerking te verlenen aan de overdracht. Wordt een verzoek ingediend door middel
      van het elektronisch boekingsplatform, dan zal de netbeheerder van het landelijk gastransportnet de bevestiging
      van de medewerking nog dezelfde dag verzenden; een verzoek ingediend door middel van het standaard formulier zal
      binnen 4 werkdagen worden bevestigd. De overgedragen transportcapaciteit of het overgedragen gebruiksrecht kunnen
      op zijn vroegst door de overnemende partij worden gebruikt op de gasdag nadat de netbeheerder van het landelijk
      gastransportnet de bevestiging heeft verzonden. De overnemende partij draagt op het betreffende entry- of exitpunt
      programmaverantwoordelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
  - number: 2.1.10.3
    text: |-
      De overgedragen capaciteit wordt als een nieuw contract geregistreerd waarbij het type capaciteitsproduct, zoals
      bedoeld in [artikel 2.1.2][ref1], wordt overgenomen uit het oorspronkelijke contract.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.10.4
    text: |-
      De netbeheerder van het landelijk gastransportnet zal de erkende programmaverantwoordelijke of de aangeslotene met
      exitcapaciteit ter bevestiging van de medewerking een e-mail sturen met een link naar de nieuwe overeenkomsten.
      Indien geen gebruik is gemaakt van het elektronisch boekingsplatform, wordt de overdracht bevestigd per brief of e-
      mail met daarbij de nieuwe overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.4
  - number: 2.1.10.5
    text: |-
      Door alleen het gebruiksrecht over te dragen verkrijgt de overnemende erkende programmaverantwoordelijke het recht
      om de transportcapaciteit op het betreffende entry- of exitpunt te gebruiken. Het tarief voor het transport wordt
      ongewijzigd bij de partij die het gebruiksrecht heeft overgedragen in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.5
  - number: 2.1.10.6
    text: |-
      Wordt de overeenkomst betreffende transport (tussentijds) beëindigd en is het gebruiksrecht geheel of gedeeltelijk
      overgedragen, dan eindigt tevens dit gebruiksrecht. De netbeheerder van het landelijk gastransportnet zal in
      dat geval de partij die het gebruiksrecht overgedragen heeft gekregen van de partij die de transportcapaciteit
      rechtstreeks bij de netbeheerder van het landelijk gastransportnet heeft gecontracteerd de mogelijkheid bieden
      de transportcapaciteit behorende bij het gebruiksrecht te contracteren. Na melding door de netbeheerder van
      het landelijk gastransportnet dient de betreffende partij binnen drie werkdagen te besluiten of hij van deze
      mogelijkheid gebruik wenst te maken.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.6
  - number: 2.1.10.7
    text: |-
      Diversion zoals beschreven in 2.1.7 kan niet worden gecontracteerd met betrekking tot het gebruiksrecht dat een
      erkende programmaverantwoordelijke overgedragen heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.7
  - number: 2.1.10.8
    text: |-
      De netbeheerder van het landelijk gastransportnet zal medewerking aan het overdragen van het gebruiksrecht
      bevestigen door middel van een e-mail.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.8
  - number: 2.1.10.9
    text: |-
      Kosten verband houdende met het gebruiksrecht worden door de netbeheerder van het landelijk gastransportnet in
      rekening gebracht bij de erkende programmaverantwoordelijke die het gebruiksrecht overgedragen heeft gekregen.
      Kosten die verband houden met het gebruiksrecht zijn kosten in verband met overschrijdingen van de gecontracteerde
      capaciteit, kosten voortkomend uit de balancering en kosten gerelateerd aan het verrekenen van correcties op
      allocaties
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.10.9
  - number: 2.1.11
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.11
  - number: 2.1.12
    text: |-
      De netbeheerder van het landelijk gastransportnet waardeert gecontracteerde afschakelbare transportcapaciteit zoals
      beschreven in [2.1.2][ref1] en [2.1.2h][ref2] op naar vaste gecontracteerde transportcapaciteit tenzij de erkende
      programmaverantwoordelijke binnen uiterlijk vijf werkdagen na het sluiten van de betreffende overeenkomst bij de
      netbeheerder van het landelijk gastransportnet aangeeft dat hij voor deze overeenkomst niet in aanmerking wenst te
      komen voor het opwaarderen van de gecontracteerde afschakelbare transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.13
    text: |-
      Voor exitpunten die gekoppeld zijn aan de aansluiting van een verbruiker op het landelijk gastransportnet zal de
      netbeheerder van het landelijk gastransportnet de verzoeken tot het contracteren van exitcapaciteit van twee of
      meer partijen, die samen de totaal beschikbare exitcapaciteit op het betreffende exitpunt overschrijden, onder
      de volgende voorwaarden accepteren: - de verbruiker heeft schriftelijk verklaard dat de maximale afname op het
      betreffende exitpunt nimmer de totaal beschikbare exitcapaciteit zal overschrijden; en
        - ieder van de verzoeken van een van de partijen is kleiner dan of gelijk aan de totaal beschikbare exitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.13
  - number: 2.1.14
    text: |-
      De netbeheerder van het landelijk gastransportnet zal in overeenstemming met artikel 2.2.4 van Bijlage 1 bij de
      Verordening het teruggeven van gecontracteerde, vaste entry- en exitcapaciteit op interconnectiepunten faciliteren.
      De entry- en exitcapaciteit kan worden teruggegeven voor een periode van een jaar (beginnende op 1 oktober),
      een kwartaal of een maand. De aangeboden entry- en exitcapaciteit dient gedurende de gehele teruggaveperiode
      constant te zijn. Gedurende de periode tussen het teruggeven van de entry- en exitcapaciteit en het sluiten van
      de bijbehorende veiling kan de erkende programmaverantwoordelijke de betreffende entry- en exitcapaciteit niet op
      andere wijze verhandelen. Ingeval meerdere erkende programmaverantwoordelijken entry- en exitcapaciteit teruggeven,
      maar niet alle teruggegeven entry- en exitcapaciteit volledig kan worden geheralloceerd, zal herallocatie over deze
      erkende programmaverantwoordelijke plaatsvinden op volgorde van diens tijdstip van aanvraag voor teruggave van de
      entry- en exitcapaciteit. Indien en voor zover teruggegeven entry- en exitcapaciteit door de netbeheerder van het
      landelijk gastransportnet opnieuw wordt verkocht, wordt de teruggeven entry- en exitcapaciteit niet in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.14
  - number: 2.1.15
    text: |-
      De netbeheerder van het landelijk gastransportnet zal in overeenstemming met artikel 2.2.2 van Bijlage 1 bij de
      Verordening zo nodig het recht op het gebruik van entry- of exitcapaciteit terugkopen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15
  - number: 2.1.15.1
    text: |-
      In [Bijlage 2][ref1] wordt vastgelegd op welke wijze de netbeheerder van het landelijk gastransportnet de omvang
      van de technische, vaste entry- en exitcapaciteit en de overboekcapaciteit bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
  - number: 2.1.15.2
    text: |-
      Wanneer, ten gevolge van nominaties boven de technische capaciteit, de systeemintegriteit van het landelijk
      gastransportnet gevaar loopt, zal de netbeheerder van het landelijk gastransportnet op interconnectiepunten
      een terugkoopveiling starten om het voorziene knelpunt te voorkomen. De terugkoopveiling houdt in dat erkende
      programmaverantwoordelijken voor de betreffende uren het gebruik van hun transportrechten aanpassen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.2
  - number: 2.1.15.3
    text: |-
      Vanuit het boekingsplatform wordt 3 uur voor het uur (T) waarin het knelpunt optreedt een notificatie verzonden aan
      erkende programmaverantwoordelijken. In deze notificatie wordt aangegeven: - op welk(e) entry- en/of exitpunt(en)
      de terugkoopveiling betrekking heeft;
        - voor welke uurhoeveelheid en flowrichting terugkoop plaatsvindt;
        - de aaneengesloten uren waarvoor terugkoop plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.3
  - number: 2.1.15.4
    text: |-
      De erkende programmaverantwoordelijke die wenst deel te nemen aan de terugkoopveiling dient zijn bieding(en) te
      plaatsen tussen T-2¾ en T- 2¼. De erkende programmaverantwoordelijke dient een bieding te doen zodanig dat: -
      bij gecontracteerde entry- of exitcapaciteit in de flowrichting van de terugkoop de nominatie wordt verhoogd (tot
      maximaal de gecontracteerde entry- of exitcapaciteit);
        - bij gecontracteerde entry- of exitcapaciteit tegen de flowrichting van de terugkoop in de nominatie wordt
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.4
  - number: 2.1.15.5
    text: |-
      De veiling start op T-2¼ uur en vindt plaats conform het veilingalgoritme ‘uniform price auction’ als gedefinieerd
      in NC-CAM, echter met de volgende afwijkingen: - de terugkoopveiling kan op elk willekeurig uur van de gasdag
      starten;
        - de periode waarvoor de veiling plaatsvindt, kent geen standaard duur;
        - de terugkoopveiling kent geen gereguleerd tarief en heeft een bodemprijs van nul;
        - de erkende programmaverantwoordelijke geeft in de bieding(en) een minimumprijs aan die hij wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.5
  - number: 2.1.15.6
    text: |-
      Direct na de terugkoopveiling ontvangen erkende programmaverantwoordelijken die een succesvolle bieding hebben
      geplaatst hiervan bericht en zijn deze erkende programmaverantwoordelijken verplicht de in het bericht genoemde
      hoeveelheid voor de betreffende uren te hernomineren vóór uur T-2, oftewel de erkende programmaverantwoordelijke
      dient de nominatie op T-2 ten opzichte van de nominatie geldend op T-3 aan te passen conform de hoeveelheid in het
      bericht met het veilingresultaat.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.6
  - number: 2.1.15.7
    text: |-
      Alvorens de terugkoopveiling te starten zal de netbeheerder van het landelijk gastransportnet verifiëren of het
      voorziene knelpunt op andere wijze is op te lossen. Daartoe zal de netbeheerder van het landelijk gastransportnet
      onderzoeken of het voorziene knelpunt door het nemen van operationele maatregelen kan worden opgelost en zal
      de netbeheerder van het landelijk gastransportnet zo nodig met de aangrenzende netbeheerders overleggen of het
      voorziene knelpunt onderling is op te lossen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.7
  - number: 2.1.15.8
    text: |-
      De netbeheerder van het landelijk gastransportnet zal jaarlijks aan de Autoriteit Consument en Markt alle
      noodzakelijke informatie verstrekken om de werking van de overboekings- en terugkoopregeling te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.1.15.8
  - number: 2.2.1
    text: |-
      Het door de netbeheerder van het landelijk gastransportnet, op verzoek van een afnemer, met
      gebruikmaking van het landelijk gastransportnet bewerken, behandelen of mengen van het gas dat
      door die afnemer wordt ingevoed teneinde te voldoen aan de afleverspecificaties, opgenomen in
      de ministeriële regeling, bedoeld in [artikel 11 van de Gaswet][ref1], tegen een tarief conform
      [artikel 10a, eerste lid, onderdeel p van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 2.2.2.a
    text: |-
      De afnemer die gebruik wenst te maken van de dienst, vult op de website van de netbeheerder van het landelijk
      gastransportnet het aanvraagformulier in, waarbij tenminste wordt aangegeven wat de verwachte kwaliteit, omvang en
      locatie van het in te voeden gas is.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.b
    text: |-
      Nadat de afnemer voldoende informatie heeft verschaft omtrent het in te voeden gas neemt de netbeheerder van het
      landelijk gastransportnet de aanvraag in behandeling en sluit met de afnemer een overeenkomst over de reikwijdte,
      doorlooptijd en eventuele kosten van de door de netbeheerder van het landelijk gastransportnet uit te voeren studie
      naar de inpassingsmogelijkheden en mogelijke investeringskosten.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.c
    text: |-
      In overleg met de afnemer kan de studie leiden tot een offerte. In de offerte wordt inzicht gegeven in de
      verwachte kosten die leiden tot het tarief zoals omschreven in [artikel 3.11 Tarievencode gas](onbekend).
      Indien de afnemer van de offerte gebruik wenst te maken wordt ten aanzien van verwachte investeringskosten een
      investeringsovereenkomst gesloten. In het geval uitsluitend operationele kosten worden voorzien, wordt meteen
      overgegaan tot het sluiten van de onder d. en f. bedoelde tariefovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.d
    text: |-
      In de investeringsovereenkomst worden tenminste afspraken vastgelegd over omvang, aard en doorlooptijd van
      de door de netbeheerder van het landelijk gastransportnet te treffen maatregelen. Gelijktijdig met deze
      investeringsovereenkomst wordt een tariefovereenkomst overgelegd met betrekking tot het in rekening brengen van het
      tarief voor de door de netbeheerder van het landelijk gastransportnet gemaakte en nog te maken kosten ten behoeve
      van het uitvoeren van de dienst. In de tariefovereenkomst wordt, behoudens voor zover redenen van vertrouwelijkheid
      zich daar tegen verzetten, met inachtneming van [artikel 3.11 van de Tarievencode gas](onbekend), inzage gegeven
      in (de hoogte van) de gehanteerde kostencomponenten waarmee de afnemer inzicht krijgt in de (hoogte en) opbouw van
      het tarief.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.e
    text: |-
      Na ondertekening van de investeringsovereenkomst en de tariefovereenkomst, gaat de netbeheerder van het landelijk
      gastransportnet over tot uitvoering van de investering.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.f
    text: |-
      Na gereedkomen van de investering wordt het volgende door de netbeheerder van het landelijk gastransportnet aan de
      afnemer gezonden:
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.f.1°
    text: |-
      de definitieve tariefovereenkomst waarin de uiteindelijke kosten en elementen als bedoeld in [artikel 3.11
      Tarievencode gas](onbekend) zijn verwerkt; en
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
  - number: 2.2.2.f.2°
    text: |-
      de naar aanleiding van deze dienst aangepaste overeenkomst als bedoeld in [artikel 1.3 Invoedcode gas LNB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel1
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: '1'
  - number: 3.2.0
    text: |-
      Een ieder kan bij de netbeheerder van het landelijk gastransportnet een aanvraag indienen om erkende
      programmaverantwoordelijke te worden, volgens een door de netbeheerder van het landelijk gastransportnet
      vastgesteld en via de website op te vragen model. De netbeheerder van het landelijk gastransportnet accepteert een
      ieder als erkende programmaverantwoordelijke die
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.0
  - number: 3.2.0.a
    text: |-
      voldoende kredietwaardig is in relatie tot zijn beoogde verplichtingen, dat wil zeggen dat is voldaan aan de eisen
      met betrekking tot financiële zekerheidsstelling die past bij het kredietrisico dat volgens vastgestelde regels
      door de netbeheerder van het landelijk gastransportnet aan de partij is toegekend. Deze regels zijn opgenomen in
      [Bijlage 1][ref1] bij de Transportcode gas LNB; en


      [ref1]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.0
    references:
      - id: ref1
        bwb_id: BWBR0037950
  - number: 3.2.0.b
    text: |-
      voldoet aan de eisen met betrekking tot elektronisch berichtenverkeer met betrekking tot nominaties, entry- en
      exitprogramma’s, portfolio onbalans signaal en de inzet ten behoeve van WDM-transacties; deze worden gepubliceerd
      op de website van de netbeheerder van het landelijk gastransportnet; en
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.0
  - number: 3.2.0.c
    text: |-
      in alle opzichten uiting geeft te beschikken over de deskundigheid en zorgvuldigheid en over de technische,
      administratieve en organisatorische faciliteiten, die vereist zijn om deelnemer aan het gastransport in het
      landelijk gastransportnet te kunnen zijn en zich in overeenstemming daarmee gedraagt.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.0
  - number: 3.2.0.d
    text: beschikt over een EIC-code om zich te kunnen identificeren.
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.0
  - number: 3.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet onderscheidt drie typen erkenning voor een erkende
      programmaverantwoordelijke. Erkenning LA: rechtspersonen en natuurlijke personen met deze erkenning kunnen
      transportcapaciteit contracteren bij de netbeheerder van het landelijk gastransportnet, behoudens entry-
      en exitcapaciteit op een netwerkpunt tussen het landelijk gastransportnet en een regionaal gastransportnet.
      Rechtspersonen of natuurlijke personen met deze erkenning kunnen eveneens gas verhandelen op het virtuele
      handelspunt. In aanvulling op de eisen vermeld onder [3.2.0a t/m 3.2.0d][ref1] gelden de volgende voorwaarden:
      a. de partij dient te beschikken over een EAN-code ingeval deze partij programmaverantwoordelijkheid draagt
      op een binnenlands exitpunt; b. de partij dient te kunnen communiceren met de netbeheerder van het landelijk
      gastransportnet middels de online informatiedienst B2B. Erkenning LB: rechtspersonen en natuurlijke personen met
      deze erkenning kunnen transportcapaciteit contracteren bij de netbeheerder van het landelijk gastransportnet met
      inbegrip van entry- en exitcapaciteit op een netwerkpunt tussen het landelijk gastransportnet en een regionaal
      gastransportnet. Rechtspersonen of natuurlijke personen met deze erkenning kunnen eveneens gas verhandelen op
      het virtuele handelspunt. In aanvulling op de eisen vermeld onder [3.2.0a t/m 3.2.0d][ref2] gelden de volgende
      voorwaarden: a. de partij dient te beschikken over een EAN-code; b. de partij dient deel te nemen aan het
      berichtenverkeer met betrekking tot allocatie; c. de partij contracteert exitcapaciteit volgens [2.1.2b][ref3];
      d. de partij dient te kunnen communiceren met de netbeheerder van het landelijk gastransportnet middels de
      online informatiedienst B2B. Erkenning LC: rechtspersonen en natuurlijke personen met deze erkenning kunnen
      geen transportcapaciteit contracteren bij de netbeheerder van het landelijk gastransportnet. Rechtspersonen
      of natuurlijke personen met deze erkenning kunnen uitsluitend gas verhandelen op het virtuele handelspunt. In
      aanvulling op de eisen vermeld onder [3.2.0a t/m 3.2.0d][ref4] gelden geen verdere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037950#Artikel3
    url: https://wetten.overheid.nl/BWBR0037950/2026-01-01#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
