  - number: 2.1.2a
    text: |-
      De netbeheerder van het landelijk gastransportnet houdt exitcapaciteit aan ten behoeve van exitpunten die gekoppeld
      zijn aan de aansluiting van een direct aangeslotene. De netbeheerder van het landelijk gastransportnet houdt
      uitsluitend exitcapaciteit aan die gecontracteerd is voor de duur van een jaar of een maand. De exitcapaciteit
      voor een direct aangeslotene wordt aangehouden tot uiterlijk één maand voor het aflopen van de al gecontracteerde
      exitcapaciteit op het betreffende exitpunt.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.2a
  - number: 2.1.2b
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt voor alle exitpunten die de verbinding vormen tussen
      het landelijk gastransportnet en een regionaal gastransportnet gezamenlijk de planparameters en publiceert deze
      voorafgaand aan elk kalenderjaar op zijn website. De planparameters omvatten de plancapaciteit, de plancapaciteit
      profielafnemers, de standaardcapaciteit profielafnemers, de plancapaciteit telemetriegrootverbruikers
      en de exitcapaciteit benodigd voor pieklevering, als bedoeld en onder omstandigheden zoals omschreven in
      [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref1]. De netbeheerder van het landelijk
      gastransportnet publiceert de wijze waarop de planparameters worden bepaald in het document als bedoeld in
      [artikel 8, tweede lid, van de Gaswet][ref2]. Bij de bepaling als bedoeld in de vorige twee volzinnen geldt
      dat de som van de plancapaciteit profielafnemers en de plancapaciteit telemetriegrootverbruikers gelijk is aan
      de plancapaciteit. De standaardcapaciteit profielafnemers plus de plancapaciteit telemetriegrootverbruikers
      wordt geheel gecontracteerd door de gezamenlijke erkende programmaverantwoordelijken met erkenning LB. De
      standaardcapaciteit profielafnemers en plancapaciteit telemetriegrootverbruikers worden in de vorm van vaste
      exitcapaciteit gecontracteerd. De netbeheerder van het landelijk gastransportnet verdeelt de standaardcapaciteit
      profielafnemers, plus de plancapaciteit telemetriegrootverbruikers over de erkende programmaverantwoordelijken
      met erkenning LB op basis van gegevens uit de aansluitingenregisters van de regionale netbeheerders volgens de
      methodiek van [2.1.2d][ref3] respectievelijk [2.1.2e][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016605#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2d
      [ref4]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2e
