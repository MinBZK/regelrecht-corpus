  - number: 4.1.4.4
    text: |-
      Als de netbeheerder van het landelijk gastransportnet een noodsituatie heeft uitgeroepen zoals beschreven in
      [4.1.4.1][ref1] of [4.1.4.5][ref2], dan kan de netbeheerder van het landelijk gastransportnet besluiten om (een
      van) de volgende maatregelen te treffen:

        - het opschorten van het proces dat de WDM-transacties initieert zoals omschreven in [4.1.4.1][ref3];
        - inzet van eventueel gecontracteerde middelen voor noodsituaties;
        - instructies betreffende installaties voor de opslag van gas of LNG en op entrypunten van het landelijk
      gastransportnet;
        - instructies op exitpunten van het landelijk gastransportnet.

      Erkende programmaverantwoordelijken zijn verplicht de instructie(s) op te volgen.

      Na afloop van de noodsituatie overleggen de netbeheerder van het landelijk gastransportnet en de betrokken erkende
      programmaverantwoordelijke over de afwikkeling van de ontstane situatie.

      Als de netbeheerder van het landelijk gastransportnet een noodsituatie heeft uitgeroepen zoals beschreven in
      [4.1.4.1][ref4], dan zal de netbeheerder van het landelijk gastransportnet dit publiceren onder vermelding van het
      uur van de start van de noodsituatie. Instructies van de netbeheerder van het landelijk gastransportnet in deze
      situatie hebben invloed op het portfolio onbalans signaal van het betreffende portfolio. Een hoeveelheid gas die de
      netbeheerder van het landelijk gastransportnet door middel van een instructie koopt of verkoopt, additioneel aan de
      WDM-transactie, wordt verrekend tegen de WDM-transactieprijs van het betreffende uur.

      Als de netbeheerder van het landelijk gastransportnet een noodsituatie heeft uitgeroepen zoals beschreven in
      [4.1.4.5][ref5], dan zal de netbeheerder van het landelijk gastransportnet dit zo spoedig mogelijk publiceren
      onder vermelding van het uur van de start van de noodsituatie. Instructies van de netbeheerder van het
      landelijk gastransportnet in deze situatie hebben geen invloed op het portfolio onbalans signaal van het
      betreffende portfolio, en worden via transacties tussen de netbeheerder van het landelijk gastransportnet en de
      erkende programmaverantwoordelijke op een virtueel punt afgehandeld tegen de neutrale gasprijs als bedoeld in
      [4.1.6.4][ref6].

      Als de door de netbeheerder van het landelijk gastransportnet uitgeroepen noodsituatie ten einde is, zal de
      netbeheerder van het landelijk gastransportnet dit zo spoedig mogelijk publiceren onder vermelding van het tijdstip
      van einde van de noodsituatie.

      In geval van een noodsituatie zal de netbeheerder van het landelijk gastransportnet aan de betrokken erkende
      programmaverantwoordelijke geen tarief voor een overschrijding van de gecontracteerde entry- of exitcapaciteit
      conform [artikel 3.2.1.5 van de Tarievencode gas][ref7] berekenen indien en voor zover deze overschrijding een
      gevolg is van een volgens dit artikel door de netbeheerder van het landelijk gastransportnet gegeven instructie.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.5
