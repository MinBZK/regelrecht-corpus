  - number: 2.1.2c
    text: |-
      De regionale netbeheerders doen aan de netbeheerder van het landelijk gastransportnet maandelijks uiterlijk op de
      zesde werkdag volgende op de eerste kalenderdag van de maand opgave van de volgende gegevens, geldend per eerste
      kalenderdag van die maand, per exitpunt per erkende programmaverantwoordelijke per leverancier:

      Voor profielafnemers:

        - het aantal profielafnemers per profielcategorie;
        - de som van de standaardjaarverbruiken per profielcategorie.

      Voor telemetriegrootverbruikers:

        - het aantal telemetriegrootverbruikers;
        - de som van de maxverbruiken voor telemetriegrootverbruikers als vastgelegd in de aansluitingenregisters van de
      regionale netbeheerders.

      Uiterlijk op de tiende werkdag van de vierde maand na afloop van de maand waarop de gegevens betrekking hebben
      verstrekken de regionale netbeheerders de genoemde gegevens nogmaals aan de netbeheerder van het landelijk
      gastransportnet, waarbij zij correcties verwerken die zijn aangebracht naar aanleiding van opmerkingen die zijn
      ingediend door erkende programmaverantwoordelijken en leveranciers bij de regionale netbeheerders.

      De regionale netbeheerders zenden op dezelfde dagen de genoemde gegevens tevens naar de desbetreffende erkende
      programmaverantwoordelijken. Erkende programmaverantwoordelijken zijn gehouden de conform dit artikel door de
      regionale netbeheerder in de eerste maand verstrekte gegevens bij ontvangst te controleren op plausibiliteit en
      eventuele vermeende fouten zo spoedig mogelijk, doch in elk geval vijf werkdagen vóór de verstrekking van nieuwe
      gegevens in de vierde maand conform dit artikel, te melden bij de regionale netbeheerder.

      De netbeheerder van het landelijk gastransport gebruikt de nogmaals verstrekte gegevens voor een herziening van de
      verdeling de standaardcapaciteit profielafnemers plus de plancapaciteit telemetriegrootverbruikers over de erkende
      programmaverantwoordelijken.

      De regionale netbeheerder draagt er zorg voor dat informatie, die aan de netbeheerder van het landelijk
      gastransportnet, erkende programmaverantwoordelijken en leveranciers wordt verschaft, consistent is.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.2c
  - number: 2.1.2d
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt de in een maand door elke erkende
      programmaverantwoordelijke met erkenning LB ten behoeve van profielafnemers gecontracteerde hoeveelheid
      exitcapaciteit, op basis van de volgens [artikel 2.1.2b][ref1] en [2.1.2c][ref2] vastgestelde respectievelijk
      verstrekte gegevens dan wel informatie uit de aansluitingenregisters van de regionale netbeheerders als volgt:

      Waarbij de maandelijkse fractie voor de profielafname wordt bepaald met:

      waarin:

      OV = De OV-exitcapaciteit voor profielafnemers van een bepaalde erkende programmaverantwoordelijke voor een bepaald
      netgebied

      SJV = De som van de standaardjaarverbruiken voor alle profielafnemers met een bepaalde afnamecategorie voor een
      bepaalde erkende programmaverantwoordelijke voor een bepaald netgebied.

      Cat = Afnamecategorie

      SC = De standaardcapaciteit profielafnemers

      PC = De plancapaciteit profielafnemers

      PC = De piekcapaciteit, zijnde dat deel van de plancapaciteit profielafnemers dat is bedoeld voor de pieklevering
      aan kleinverbruikers volgens [artikel 2, eerste lid, van het Besluit leveringszekerheid Gaswet][ref3]

      F = De maximale uurfractie voor de profielenmethodiek conform
      [bijlage 3 van de Informatiecode elektriciteit en gas][ref4] voor afnamecategorie x bij de referentietemperatuur
      behorend bij de onderhavige maand

      MC = De modelcapaciteit voor alle profielafnemers in Nederland, bepaald met de bovenstaande formule (d.w.z. door
      het product van het standaardjaarverbruik per categorie en maximale uurfractie te sommeren over alle erkende
      programmaverantwoordelijken en alle netgebieden).

      FF = De fitfactor profielafnemers

