  - number: 4.1.5.3
    text: |-
      Het in een kalenderjaar voor de netbeheerder van het landelijk gastransportnet resulterende saldo van de
      onbalansverrekening zal de netbeheerder van het landelijk gastransportnet in het volgende kalenderjaar verrekenen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.5.3
  - number: 4.1.6.1
    text: |-
      Nadat de off line allocaties definitief zijn verklaard in de maand na afloop van de maand waarop de gegevens
      betrekking hebben, wordt het verschil tussen de near-real-time allocaties en de off line allocaties bepaald.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.6.1
  - number: 4.1.6.2
    text: |-
      Het verschil tussen de near-real-time allocaties en de off line allocaties wordt per gasdag verrekend tegen de
      neutrale gasprijs zoals bedoeld in [4.1.6.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.6.4
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 4.1.6.4
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.6.3
    text: |-
      De correctie van de off line allocaties van de exitpunten waar het landelijk gastransportnet is verbonden met
      het regionaal gastransportnet, in de vierde maand na afloop van de maand waarop de gegevens betrekking hebben en
      correcties van de offline allocaties van de overige entry- en exitpunten in de maand na afloop van de maand waarop
      de gegevens betrekking hebben, worden ook verrekend tegen de neutrale gasprijs zoals bedoeld in [4.1.6.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.6.4
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 4.1.6.4
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.6.4
    text: |-
      1 De neutrale gasprijs is de volumegewogen gemiddelde prijs van alle contracten die op de door de Minister van
      Economische Zaken en Klimaat op grond van de Gaswet aangewezen beurs worden afgesloten op D-2, D-1 en D voor
      levering op D (balansdag). Hierbij is de index calculatie een continu en real-time proces en vindt de index
      publicatie plaats op 'near real time’ basis en worden de historische gegevens op Internet gepubliceerd. In
      formulevorm wordt de neutrale gasprijs als volgt weergegeven:

      waarin:

      INDEX = ‘Neutrale Gasprijs’ voor de ‘balansdag’ (D) waarop contracten in levering gaan

      P t/m P = Prijzen van contracten voor levering van gas op balansdag (D)

      V t/m V = Volumes van contracten voor levering van gas op balansdag (D)

      = aantal contracten afgesloten van D-2 t/m D.

      2 Indien de neutrale gasprijs niet op basis van lid 1 berekend kan worden, dan zal de laatst berekende neutrale
      gasprijs gelden als neutrale gasprijs voor balansdag D.

      3 Het handelsplatform PEGAS van de door de Minister van Economische Zaken en Klimaat aangewezen beurs European
      Energy Exchange AG wordt gebruikt voor de in lid 1 bedoelde berekening van de neutrale gasprijs.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.6.4
  - number: 4.1.7
    text: |-
      Conform hoofdstuk 5 van NC-BAL verrekent de netbeheerder van het landelijk gastransportnet de positie
      (“dagelijkse onbalanshoeveelheid”) aan het einde van de dag met de erkende programmaverantwoordelijken. Voor
      dit doel maakt de netbeheerder van het landelijk gastransportnet gebruik van de mogelijkheid in hoofdstuk 9
      van NC-BAL, zijnde een leidingbufferflexibiliteitsdienst. De hoeveelheid leidingbuffer die de netbeheerder van
      het landelijk gastransportnet ter beschikking stelt aan de markt is gelijk aan de donkergroene zone conform
      [artikel 4.1.2.1][ref1]. Hierdoor is de dagelijkse onbalanshoeveelheid waarvan sprake is in artikel 21 van NC-BAL
      gelijk aan nul. De netbeheerder van het landelijk gastransportnet brengt voor de leidingbufferflexibiliteitsdienst
      een tarief in rekening conform de ‘kleine aanpassing’ uit artikel 22 van de NC-BAL. Bij de invoering van
      leidingbufferflexibiliteitsdienst is het tarief (LFS-tarief) vastgesteld op 0,4% van de neutrale gasprijs als
      bedoeld in [4.1.6.4][ref2]. De netbeheerder van het landelijk gastransportnet kan het tarief evalueren en, indien
      deze evaluatie daartoe aanleiding geeft, een gewijzigd tarief ter goedkeuring voorleggen aan Autoriteit Consument
      en Markt. Indien dit leidt tot een wijziging van het tarief, zal het gewijzigde tarief gepubliceerd worden op de
      website van de netbeheerder van het landelijk gastransportnet.

      De evaluatie waarvan sprake is in dit artikel kan op initiatief van de netbeheerder van het landelijk
      gastransportnet en/of de Autoriteit Consument en Markt uitgevoerd worden. De evaluatie neemt in ieder geval de
      volgende aspecten in ogenschouw:

        - de mate waarin het LFS-tarief bijdraagt aan de ontwikkeling van de within day market.
        - de mate waarin de balanceringskosten voor erkende programmaverantwoordelijken veroorzaakt worden door het LFS-
      tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.6.4
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.7
