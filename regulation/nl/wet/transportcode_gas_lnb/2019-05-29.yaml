  - number: 2.1.4
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.4
  - number: 2.1.7.1
    text: |-
      Diversion betreft het recht van een erkende programmaverantwoordelijke om gecontracteerde entrycapaciteit of
      exitcapaciteit te verplaatsen naar een ander op dezelfde locatie gelegen entrypunt respectievelijk exitpunt onder
      de voorwaarde dat er geen extra beslag op transportcapaciteit wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.7.1
  - number: 2.1.7.2
    text: |-
      Diversion dient te worden aangevraagd via een formulier dat de netbeheerder van het landelijk gastransportnet op
      zijn website publiceert. De netbeheerder van het landelijk gastransportnet publiceert op zijn website voor welke
      combinatie van entry- en exitpunten diversion wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.7.2
  - number: 2.1.7.3
    text: |-
      Diversion van een binnenlands entry- of exitpunt naar een interconnectiepunt wordt gecontracteerd en aan erkende
      programmaverantwoordelijken toegewezen via een veiling. Bovenop de reserveringsprijs zal, indien zich dat in de
      veiling voordoet, een veilingtoeslag in rekening gebracht worden. Voor de duur, de omvang en de prijs waarvoor
      de erkende programmaverantwoordelijke diversion heeft aangevraagd en in de veiling entry- of exitcapaciteit ten
      behoeve van diversion heeft gecontracteerd, wordt hij van zijn betalingsverplichting op het entry- en exitpunt,
      waarop het first come first served principe van toepassing is, ontslagen. Als de reserveringsprijs lager is dan
      de te betalen prijs op het binnenlandse entry- of exitpunt, wordt de erkende programmaverantwoordelijke enkel
      van zijn betalingsverplichting ontslagen voor zover de te betalen prijs op het interconnectiepunt dekkend is.
      Diversion van een binnenlands entry- of exitpunt naar een interconnectiepunt, kan voor een jaar-, kwartaal- of een
      maandcapaciteitsproduct worden gecontracteerd.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.7.3
  - number: 2.1.7.4
    text: |-
      Diversion op de overige entry- of exitpunten wordt gecontracteerd en aan erkende programmaverantwoordelijken
      toegewezen volgens het first come first served principe. De duur van diversion is niet korter dan een dag. Indien
      de te betalen prijs op het entry- of exitpunt waar capaciteit heen verplaatst wordt lager is dan de te betalen
      prijs op het oorspronkelijke entry- of exitpunt, wordt de erkende programmaverantwoordelijke op het oorspronkelijke
      punt enkel van zijn betalingsverplichting ontslagen voor zover de te betalen prijs op het entry-of exitpunt waar de
      capaciteit heen wordt verplaatst dekkend is. Bij de berekening van de te betalen prijs wordt gebruik gemaakt van de
      multiplicatoren en seizoensfactoren die gelden op het oorspronkelijke entry-of exitpunt.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.7.4
  - number: 2.1.7.5
    text: |-
      De status van de door middel van diversion verplaatste entry- of exitcapaciteit zal niet worden aangetast tenzij
      deze verplaatsing de status van de entry- of exitcapaciteit van een andere erkende programmaverantwoordelijke zou
      aantasten.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.7.5
  - number: 2.1.8
    text: |-
      Verlegging geeft het recht om exitcapaciteit van een binnenlands exitpunt voor een bepaalde periode te verplaatsen
      naar een ander binnenlands exitpunt.

      Een erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit kan een verzoek voor verlegging indienen
      bij de netbeheerder van het landelijk gastransportnet. De netbeheerder van het landelijk gastransportnet beoordeelt
      het verzoek voor verlegging. De netbeheerder van het landelijk gastransportnet honoreert het verzoek voor
      verlegging indien het verzoek voldoet aan de volgende cumulatieve voorwaarden:

      a. De verlegging is gerelateerd aan onderhoud of incidenten aan de zijde van de aangeslotene die leiden tot
      merkbare beperking van technisch operationele en tijdelijke aard in de mogelijkheid om gas te onttrekken op
      het exitpunt waar de erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit exitcapaciteit
      heeft gecontracteerd; b. De verlegging heeft betrekking op een aaneengesloten periode die niet langer is dan de
      vooraf bepaalde duur van de merkbare beperking bedoeld in onderdeel a; c. De erkende programmaverantwoordelijke
      of aangeslotene met exitcapaciteit kan de gecontracteerde exitcapaciteit op het exitpunt waar de merkbare
      beperking, als bedoeld in onderdeel a, zich voordoet, geheel of gedeeltelijk benutten op een ander exitpunt
      binnen het portfolio van de erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit; d. De erkende
      programmaverantwoordelijke of aangeslotene met exitcapaciteit heeft in het kalenderjaar waarop het verzoek tot
      verlegging betrekking heeft minder dan tweemaal gebruik gemaakt van verlegging op een specifiek exitpunt; e. De
      te verleggen gecontracteerde exitcapaciteit is beschikbaar op het exitpunt waar de gecontracteerde exitcapaciteit
      naar toe moet worden verlegd; en f. De erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit heeft
      het verzoek voor verlegging zo spoedig mogelijk nadat zij op de hoogte was van de (aanstaande) merkbare beperking
      ingediend.

      De status van de door middel van verlegging verplaatste exitcapaciteit zal niet worden aangetast tenzij deze
      verplaatsing de status van de exitcapaciteit van een andere erkende programmaverantwoordelijke of aangeslotene met
      exitcapaciteit zou aantasten.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.8
  - number: 2.1.9.1
    text: |-
      Bij het opstarten of het uitbreiden van gasinstallaties van een eindverbruiker met een aansluiting op het landelijk
      gastransportnet kan een erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit de netbeheerder van
      het landelijk gastransportnet verzoeken om initieel een geschatte hoeveelheid exitcapaciteit te contracteren voor
      een periode van ten hoogste vier opeenvolgende gasmaanden en de gecontracteerde exitcapaciteit na afloop van deze
      periode bij te stellen naar het maximum van de gebruikte capaciteit per maand. Dit verzoek kan geen betrekking
      hebben op een wintermaand.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.9.1
  - number: 2.1.9.2
    text: |-
      De aanpassing of uitbreiding als bedoeld in [artikel 2.1.9.1][ref1] wordt vastgelegd in een aparte
      overeenkomst tussen enerzijds de netbeheerder van het landelijk gastransportnet en anderzijds de erkende
      programmaverantwoordelijke of aangeslotene met exitcapaciteit, met daarin opgenomen de geschatte exitcapaciteit.
      De geschatte exitcapaciteit dient een redelijke beoordeling te zijn van de benodigde exitcapaciteit en dient binnen
      een gasmaand constant te zijn. De geschatte exitcapaciteit vormt de basis voor de (voorlopige) berekening van het
      in rekening te brengen bedrag bij de erkende programmaverantwoordelijke of de aangeslotene met exitcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.9.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.9.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 2.1.9.1
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.9.3
    text: |-
      De erkende programmaverantwoordelijke of de aangeslotene met exitcapaciteit mag de geschatte exitcapaciteit
      overschrijden. Als hiervoor vooraf toestemming van de netbeheerder van het landelijk gastransportnet benodigd is,
      zal dit opgenomen worden in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.9.3
  - number: 2.1.9.4
    text: |-
      Het overdragen van transportcapaciteit of het gebruik van transportcapaciteit conform [2.1.10][ref1] met betrekking
      tot de geschatte exitcapaciteit als bedoeld in [artikel 2.1.9.2][ref2], is alleen mogelijk voor de gehele geschatte
      exitcapaciteit en voor de gehele periode waarvoor de exitcapaciteit wordt geschat.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.9.2
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.9.4
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: 2.1.9.2
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.9.5
    text: |-
      Na afloop van de periode van ten hoogste vier maanden waarvoor de exitcapaciteit is geschat, bepaalt de
      netbeheerder van het landelijk gastransportnet voor elke gasmaand van de periode een waarde voor de exitcapaciteit
      in de betreffende gasmaand. Deze waarde is gelijk aan het maximum van de gebruikte exitcapaciteit in die maand,
      zoals gemeten op basis van de Meetcode gas LNB. De erkende programmaverantwoordelijke of aangeslotene met
      exitcapaciteit sluit een herziene overeenkomst met de netbeheerder van het landelijk gastransportnet waarmee deze
      exitcapaciteit wordt gecontracteerd en afgerekend op grond van het bepaalde in [artikel 3.2.3 van de Tarievencode
      gas](onbekend). Indien geen toestemming vooraf is vereist voor het overschrijden van de geschatte exitcapaciteit
      is de waarde van de exitcapaciteit in de herziene overeenkomst gelijk aan de gebruikte exitcapaciteit. Indien
      wel vooraf toestemming is vereist voor het overschrijden van de geschatte exitcapaciteit is de waarde van
      de exitcapaciteit in de herziene overeenkomst gelijk aan de gebruikte exitcapaciteit voor zover de erkende
      programmaverantwoordelijke of aangeslotene met exitcapaciteit vooraf toestemming heeft gevraagd en ontvangen van de
      netbeheerder van het landelijk gastransportnet om de geschatte exitcapaciteit te overschrijden.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.9.5
  - number: 2.1.9.6
    text: |-
      Indien er sprake is van overschrijding van de geschatte exitcapaciteit waarvoor de erkende
      programmaverantwoordelijke of aangeslotene met exitcapaciteit toestemming heeft gevraagd, maar niet heeft gekregen,
      of waarvoor voorafgaande toestemming vereist was maar welke niet is gevraagd, wordt deze overschrijding aangemerkt
      als een overschrijding bedoeld in [artikel 3.2.3.12 van de Tarievencode gas](onbekend), en als zodanig afgerekend
      na afloop van de periode van ten hoogste vier maanden waarvoor de exitcapaciteit wordt geschat. Dit geldt eveneens
      indien toestemming is verleend voor overschrijding, maar de erkende programmaverantwoordelijke of aangeslotene met
      exitcapaciteit meer exitcapaciteit gebruikt dan waarvoor toestemming was verkregen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.9.6
  - number: 2.1.10.1
    text: |-
      Een erkende programmaverantwoordelijke of een aangeslotene met exitcapaciteit heeft het recht gecontracteerde
      transportcapaciteit of het gebruik van transportcapaciteit (verder: gebruiksrecht) over te dragen aan een andere
      erkende programmaverantwoordelijke of aangeslotene met exitcapaciteit. Het overdragen van transportcapaciteit of
      het gebruiksrecht is mogelijk tussen een aangeslotene met exitcapaciteit en een erkende programmaverantwoordelijke
      voor zover het de exitcapaciteit op het exitpunt van de aangeslotene met exitcapaciteit betreft of tussen erkende
      programmaverantwoordelijken onderling. Het overdragen van transportcapaciteit of het gebruiksrecht heeft betrekking
      op gecontracteerde transportcapaciteit of het gebruiksrecht voor één of meer gasdagen of voor één of meer
      gasmaanden in de toekomst gelegen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.1
  - number: 2.1.10.2
    text: |-
      Beide partijen dienen gezamenlijk bij de netbeheerder van het landelijk gastransportnet een verzoek in tot het
      overdragen van transportcapaciteit of het gebruiksrecht. Met de overdracht wordt het portfolio van de partij die
      het gebruiksrecht krijgt overgedragen uitgebreid. In verband met de in artikel B1.5 van de Transportcode gas LNB
      bedoelde exposure, toetst de netbeheerder van het landelijk gastransportnet of de kredietlimiet van deze partij
      nog toereikend is alvorens medewerking te verlenen aan de overdracht. Wordt een verzoek ingediend door middel
      van het elektronisch boekingsplatform, dan zal de netbeheerder van het landelijk gastransportnet de bevestiging
      van de medewerking nog dezelfde dag verzenden; een verzoek ingediend door middel van het standaard formulier zal
      binnen 4 werkdagen worden bevestigd. De overgedragen transportcapaciteit of het overgedragen gebruiksrecht kunnen
      op zijn vroegst door de overnemende partij worden gebruikt op de gasdag nadat de netbeheerder van het landelijk
      gastransportnet de bevestiging heeft verzonden. De overnemende partij draagt op het betreffende entry- of exitpunt
      programmaverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.2
  - number: 2.1.10.3
    text: |-
      Bij het overdragen van transportcapaciteit voor een gasdag of een gasmaand wordt het gedeelte van de
      transportcapaciteit met het hoogste tarief bij voorrang overgedragen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.3
  - number: 2.1.10.4
    text: |-
      De netbeheerder van het landelijk gastransportnet zal de erkende programmaverantwoordelijke of de aangeslotene met
      exitcapaciteit ter bevestiging van de medewerking een e-mail sturen met een link naar de nieuwe overeenkomsten.
      Indien geen gebruik is gemaakt van het elektronisch boekingsplatform, wordt de overdracht bevestigd per brief of e-
      mail met daarbij de nieuwe overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.4
  - number: 2.1.10.5
    text: |-
      Door alleen het gebruiksrecht over te dragen verkrijgt de overnemende erkende programmaverantwoordelijke het recht
      om de transportcapaciteit op het betreffende entry- of exitpunt te gebruiken. Het tarief voor het transport wordt
      ongewijzigd bij de partij die het gebruiksrecht heeft overgedragen in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.5
  - number: 2.1.10.6
    text: |-
      Wordt de overeenkomst betreffende transport (tussentijds) beëindigd en is het gebruiksrecht geheel of gedeeltelijk
      overgedragen, dan eindigt tevens dit gebruiksrecht. De netbeheerder van het landelijk gastransportnet zal in
      dat geval de partij die het gebruiksrecht overgedragen heeft gekregen van de partij die de transportcapaciteit
      rechtstreeks bij de netbeheerder van het landelijk gastransportnet heeft gecontracteerd de mogelijkheid bieden
      de transportcapaciteit behorende bij het gebruiksrecht te contracteren. Na melding door de netbeheerder van
      het landelijk gastransportnet dient de betreffende partij binnen drie werkdagen te besluiten of hij van deze
      mogelijkheid gebruik wenst te maken.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.6
  - number: 2.1.10.7
    text: |-
      Diversion zoals beschreven in 2.1.7 kan niet worden gecontracteerd met betrekking tot het gebruiksrecht dat een
      erkende programmaverantwoordelijke overgedragen heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.7
  - number: 2.1.10.8
    text: |-
      De netbeheerder van het landelijk gastransportnet zal medewerking aan het overdragen van het gebruiksrecht
      bevestigen door middel van een e-mail.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.8
  - number: 2.1.10.9
    text: |-
      Kosten verband houdende met het gebruiksrecht worden door de netbeheerder van het landelijk gastransportnet in
      rekening gebracht bij de erkende programmaverantwoordelijke die het gebruiksrecht overgedragen heeft gekregen.
      Kosten die verband houden met het gebruiksrecht zijn kosten in verband met overschrijdingen van de gecontracteerde
      capaciteit, kosten voortkomend uit de balancering en kosten gerelateerd aan het verrekenen van correcties op
      allocaties
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.10.9
  - number: 2.1.11
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.11
  - number: 2.1.12
    text: |-
      De netbeheerder van het landelijk gastransportnet waardeert gecontracteerde afschakelbare transportcapaciteit zoals
      beschreven in [2.1.2][ref1] en [2.1.2h][ref2] op naar vaste gecontracteerde transportcapaciteit tenzij de erkende
      programmaverantwoordelijke binnen uiterlijk vijf werkdagen na het sluiten van de betreffende overeenkomst bij de
      netbeheerder van het landelijk gastransportnet aangeeft dat hij voor deze overeenkomst niet in aanmerking wenst te
      komen voor het opwaarderen van de gecontracteerde afschakelbare transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2h
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 2.1.2
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: 2.1.2h
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.13
    text: |-
      Voor exitpunten die gekoppeld zijn aan de aansluiting van een verbruiker op het landelijk gastransportnet zal de
      netbeheerder van het landelijk gastransportnet de verzoeken tot het contracteren van exitcapaciteit van twee of
      meer partijen, die samen de totaal beschikbare exitcapaciteit op het betreffende exitpunt overschrijden, onder de
      volgende voorwaarden accepteren:

        - de verbruiker heeft schriftelijk verklaard dat de maximale afname op het betreffende exitpunt nimmer de totaal
      beschikbare exitcapaciteit zal overschrijden; en
        - ieder van de verzoeken van een van de partijen is kleiner dan of gelijk aan de totaal beschikbare exitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.13
  - number: 2.1.14
    text: |-
      De netbeheerder van het landelijk gastransportnet zal in overeenstemming met artikel 2.2.4 van Bijlage 1 bij de
      Verordening het teruggeven van gecontracteerde, vaste entry- en exitcapaciteit op interconnectiepunten faciliteren.
      De entry- en exitcapaciteit kan worden teruggegeven voor een periode van een jaar (beginnende op 1 oktober),
      een kwartaal of een maand. De aangeboden entry- en exitcapaciteit dient gedurende de gehele teruggaveperiode
      constant te zijn. Gedurende de periode tussen het teruggeven van de entry- en exitcapaciteit en het sluiten van
      de bijbehorende veiling kan de erkende programmaverantwoordelijke de betreffende entry- en exitcapaciteit niet op
      andere wijze verhandelen. Ingeval meerdere erkende programmaverantwoordelijken entry- en exitcapaciteit teruggeven,
      maar niet alle teruggegeven entry- en exitcapaciteit volledig kan worden geheralloceerd, zal herallocatie over deze
      erkende programmaverantwoordelijke plaatsvinden op volgorde van diens tijdstip van aanvraag voor teruggave van de
      entry- en exitcapaciteit. Indien en voor zover teruggegeven entry- en exitcapaciteit door de netbeheerder van het
      landelijk gastransportnet opnieuw wordt verkocht, wordt de teruggeven entry- en exitcapaciteit niet in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.14
  - number: 2.1.15
    text: |-
      De netbeheerder van het landelijk gastransportnet zal in overeenstemming met artikel 2.2.2 van Bijlage 1 bij de
      Verordening zo nodig het recht op het gebruik van entry- of exitcapaciteit terugkopen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15
  - number: 2.1.15.1
    text: |-
      In [Bijlage 2][ref1] wordt vastgelegd op welke wijze de netbeheerder van het landelijk gastransportnet de omvang
      van de technische, vaste entry- en exitcapaciteit en de overboekcapaciteit bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
  - number: 2.1.15.2
    text: |-
      Wanneer, ten gevolge van nominaties boven de technische capaciteit, de systeemintegriteit van het landelijk
      gastransportnet gevaar loopt, zal de netbeheerder van het landelijk gastransportnet op interconnectiepunten
      een terugkoopveiling starten om het voorziene knelpunt te voorkomen. De terugkoopveiling houdt in dat erkende
      programmaverantwoordelijken voor de betreffende uren het gebruik van hun transportrechten aanpassen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.2
  - number: 2.1.15.3
    text: |-
      Vanuit het boekingsplatform wordt 3 uur voor het uur (T) waarin het knelpunt optreedt een notificatie verzonden aan
      erkende programmaverantwoordelijken. In deze notificatie wordt aangegeven:

        - op welk(e) entry- en/of exitpunt(en) de terugkoopveiling betrekking heeft;
        - voor welke uurhoeveelheid en flowrichting terugkoop plaatsvindt;
        - de aaneengesloten uren waarvoor terugkoop plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.3
  - number: 2.1.15.4
    text: |-
      De erkende programmaverantwoordelijke die wenst deel te nemen aan de terugkoopveiling dient zijn bieding(en) te
      plaatsen tussen T-2¾ en T- 2¼. De erkende programmaverantwoordelijke dient een bieding te doen zodanig dat:

        - bij gecontracteerde entry- of exitcapaciteit in de flowrichting van de terugkoop de nominatie wordt verhoogd (tot
      maximaal de gecontracteerde entry- of exitcapaciteit);
        - bij gecontracteerde entry- of exitcapaciteit tegen de flowrichting van de terugkoop in de nominatie wordt
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.4
  - number: 2.1.15.5
    text: |-
      De veiling start op T-2¼ uur en vindt plaats conform het veilingalgoritme ‘uniform price auction’ als gedefinieerd
      in NC-CAM, echter met de volgende afwijkingen:

        - de terugkoopveiling kan op elk willekeurig uur van de gasdag starten;
        - de periode waarvoor de veiling plaatsvindt, kent geen standaard duur;
        - de terugkoopveiling kent geen gereguleerd tarief en heeft een bodemprijs van nul;
        - de erkende programmaverantwoordelijke geeft in de bieding(en) een minimumprijs aan die hij wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.5
  - number: 2.1.15.6
    text: |-
      Direct na de terugkoopveiling ontvangen erkende programmaverantwoordelijken die een succesvolle bieding hebben
      geplaatst hiervan bericht en zijn deze erkende programmaverantwoordelijken verplicht de in het bericht genoemde
      hoeveelheid voor de betreffende uren te hernomineren vóór uur T-2, oftewel de erkende programmaverantwoordelijke
      dient de nominatie op T-2 ten opzichte van de nominatie geldend op T-3 aan te passen conform de hoeveelheid in het
      bericht met het veilingresultaat.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.6
  - number: 2.1.15.7
    text: |-
      Alvorens de terugkoopveiling te starten zal de netbeheerder van het landelijk gastransportnet verifiëren of het
      voorziene knelpunt op andere wijze is op te lossen. Daartoe zal de netbeheerder van het landelijk gastransportnet
      onderzoeken of het voorziene knelpunt door het nemen van operationele maatregelen kan worden opgelost en zal
      de netbeheerder van het landelijk gastransportnet zo nodig met de aangrenzende netbeheerders overleggen of het
      voorziene knelpunt onderling is op te lossen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.7
  - number: 2.1.15.8
    text: |-
      De netbeheerder van het landelijk gastransportnet zal jaarlijks aan de Autoriteit Consument en Markt alle
      noodzakelijke informatie verstrekken om de werking van de overboekings- en terugkoopregeling te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.15.8
  - number: 2.2.1
    text: |-
      Het door de netbeheerder van het landelijk gastransportnet, op verzoek van een afnemer, met
      gebruikmaking van het landelijk gastransportnet bewerken, behandelen of mengen van het gas dat
      door die afnemer wordt ingevoed teneinde te voldoen aan de afleverspecificaties, opgenomen in
      de ministeriële regeling, bedoeld in [artikel 11 van de Gaswet][ref1], tegen een tarief conform
      [artikel 10a, eerste lid, onderdeel p van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 2.2.2
    text: |-
      a. De afnemer die gebruik wenst te maken van de dienst, vult op de website van de netbeheerder van het landelijk
      gastransportnet het aanvraagformulier in, waarbij tenminste wordt aangegeven wat de verwachte kwaliteit, omvang en
      locatie van het in te voeden gas is.

      b. Nadat de afnemer voldoende informatie heeft verschaft omtrent het in te voeden gas neemt de netbeheerder van het
      landelijk gastransportnet de aanvraag in behandeling en sluit met de afnemer een overeenkomst over de reikwijdte,
      doorlooptijd en eventuele kosten van de door de netbeheerder van het landelijk gastransportnet uit te voeren studie
      naar de inpassingsmogelijkheden en mogelijke investeringskosten.

      c. In overleg met de afnemer kan de studie leiden tot een offerte. In de offerte wordt inzicht gegeven in
      de verwachte kosten die leiden tot het tarief zoals omschreven in [artikel 3.3.2 Tarievencode gas][ref1].
      Indien de afnemer van de offerte gebruik wenst te maken wordt ten aanzien van verwachte investeringskosten een
      investeringsovereenkomst gesloten. In het geval uitsluitend operationele kosten worden voorzien, wordt meteen
      overgegaan tot het sluiten van de onder d. en f. bedoelde tariefovereenkomst.

      d. In de investeringsovereenkomst worden tenminste afspraken vastgelegd over omvang, aard en doorlooptijd
      van de door de netbeheerder van het landelijk gastransportnet te treffen maatregelen. Gelijktijdig met deze
      investeringsovereenkomst wordt een tariefovereenkomst overgelegd met betrekking tot het in rekening brengen van het
      tarief voor de door de netbeheerder van het landelijk gastransportnet gemaakte en nog te maken kosten ten behoeve
      van het uitvoeren van de dienst. In de tariefovereenkomst wordt, behoudens voor zover redenen van vertrouwelijkheid
      zich daar tegen verzetten, met inachtneming van [artikel 3.3.2 van de Tarievencode gas][ref2], inzage gegeven in
      (de hoogte van) de gehanteerde kostencomponenten waarmee de afnemer inzicht krijgt in de (hoogte en) opbouw van
      het tarief.

      e. Na ondertekening van de investeringsovereenkomst en de tariefovereenkomst, gaat de netbeheerder van het
      landelijk gastransportnet over tot uitvoering van de investering.

      f. Na gereedkomen van de investering wordt het volgende door de netbeheerder van het landelijk gastransportnet aan
      de afnemer gezonden:

      1°. de definitieve tariefovereenkomst waarin de uiteindelijke kosten en elementen als bedoeld in
      [artikel 3.3.2 Tarievencode gas][ref3] zijn verwerkt; en

      2°. de naar aanleiding van deze dienst aangepaste overeenkomst als bedoeld in
      [artikel 1.3 Invoedcode gas LNB][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Paragraaf3.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Paragraaf3.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0037948#Paragraaf3.3.2
      [ref4]: https://wetten.overheid.nl/BWBR0037936#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037948
        paragraaf: 3.3.2
      - id: ref2
        bwb_id: BWBR0037948
        paragraaf: 3.3.2
      - id: ref3
        bwb_id: BWBR0037948
        paragraaf: 3.3.2
      - id: ref4
        bwb_id: BWBR0037936
        artikel: '1.3'
  - number: 3.2.0
    text: |-
      Een ieder kan bij de netbeheerder van het landelijk gastransportnet een aanvraag indienen om erkende
      programmaverantwoordelijke te worden, volgens een door de netbeheerder van het landelijk gastransportnet
      vastgesteld en via de website op te vragen model. De netbeheerder van het landelijk gastransportnet accepteert een
      ieder als erkende programmaverantwoordelijke die

      a. voldoende kredietwaardig is in relatie tot zijn beoogde verplichtingen, dat wil zeggen dat is voldaan aan de
      eisen met betrekking tot financiële zekerheidsstelling die past bij het kredietrisico dat volgens vastgestelde
      regels door de netbeheerder van het landelijk gastransportnet aan de partij is toegekend. Deze regels zijn
      opgenomen in [Bijlage 1][ref1] bij de Transportcode gas LNB; en

      b. voldoet aan de eisen met betrekking tot elektronisch berichtenverkeer met betrekking tot nominaties, entry- en
      exitprogramma’s, portfolio onbalans signaal en de inzet ten behoeve van WDM-transacties; deze worden gepubliceerd
      op de website van de netbeheerder van het landelijk gastransportnet; en

      c. in alle opzichten uiting geeft te beschikken over de deskundigheid en zorgvuldigheid en over de technische,
      administratieve en organisatorische faciliteiten, die vereist zijn om deelnemer aan het gastransport in het
      landelijk gastransportnet te kunnen zijn en zich in overeenstemming daarmee gedraagt.

      d. beschikt over een EIC-code om zich te kunnen identificeren.

      Indien aan de hiervoor genoemde voorwaarden is voldaan, verstrekt de netbeheerder van het landelijk gastransportnet
      de aanvrager een erkenning door middel van publicatie op zijn website, onder vermelding van de ingangsdatum van
      de erkenning.

      De netbeheerder van het landelijk gastransportnet verleent aan de erkende programmaverantwoordelijke
      toestemming om de taken verbonden aan de eisen in 3.2.0 b en c door een derde, die niet zelf een erkende
      programmaverantwoordelijke is, te laten uitvoeren, mits die derde voldoet aan de eisen in b en c en er geen
      zwaarwegende redenen bestaan om deze toestemming niet te verlenen.

      De juiste en tijdige uitvoering van deze taken wordt uitsluitend verricht door of namens de erkende
      programmaverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.2.0
    references:
      - id: ref1
        bwb_id: BWBR0037950
  - number: 3.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet onderscheidt drie typen erkenning voor een erkende
      programmaverantwoordelijke.

      Erkenning LA: rechtspersonen en natuurlijke personen met deze erkenning kunnen transportcapaciteit contracteren
      bij de netbeheerder van het landelijk gastransportnet, behoudens exitcapaciteit op een exitpunt tussen het
      landelijk gastransportnet en een regionaal gastransportnet. Rechtspersonen of natuurlijke personen met deze
      erkenning kunnen eveneens gas verhandelen op het virtuele handelspunt. In aanvulling op de eisen vermeld onder
      [3.2.0a t/m 3.2.0d][ref1] gelden de volgende voorwaarden:

      a. de partij dient te beschikken over een EAN-code ingeval deze partij programmaverantwoordelijkheid draagt op een
      binnenlands exitpunt;

      b. de partij dient te kunnen communiceren met de netbeheerder van het landelijk gastransportnet middels de online
      informatiedienst B2B.

      Erkenning LB: rechtspersonen en natuurlijke personen met deze erkenning kunnen transportcapaciteit contracteren
      bij de netbeheerder van het landelijk gastransportnet met inbegrip van exitcapaciteit op een exitpunt tussen
      het landelijk gastransportnet en een regionaal gastransportnet. Rechtspersonen of natuurlijke personen met deze
      erkenning kunnen eveneens gas verhandelen op het virtuele handelspunt. In aanvulling op de eisen vermeld onder
      [3.2.0a t/m 3.2.0d][ref2] gelden de volgende voorwaarden:

      a. de partij dient te beschikken over een EAN-code;

      b. de partij dient deel te nemen aan het berichtenverkeer met betrekking tot allocatie;

      c. de partij contracteert exitcapaciteit volgens 1.2b;

      d. de partij dient te kunnen communiceren met de netbeheerder van het landelijk gastransportnet middels de online
      informatiedienst B2B.

      Erkenning LC: rechtspersonen en natuurlijke personen met deze erkenning kunnen geen transportcapaciteit
      contracteren bij de netbeheerder van het landelijk gastransportnet. Rechtspersonen of natuurlijke personen met deze
      erkenning kunnen uitsluitend gas verhandelen op het virtuele handelspunt. In aanvulling op de eisen vermeld onder
      [3.2.0a t/m 3.2.0d][ref3] gelden geen verdere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.0
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.0
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.0
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.2.0
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: 3.2.0
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037950
        artikel: 3.2.0
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert de actuele lijst met erkende
      programmaverantwoordelijken inclusief het type erkenning op zijn website.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.2.2
  - number: 3.2.3
    text: |-
      De erkende programmaverantwoordelijke dient er zorg voor te dragen dat zijn conform [3.2.0][ref1] bekende gegevens
      bij de netbeheerder van het landelijk gastransportnet actueel zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.0
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.2.0
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet kan besluiten om voor een bepaalde, beperkte periode schriftelijk
      vrijstelling te verlenen van één of meer van de in [3.2][ref1] genoemde voorwaarden in het geval tijdelijk niet aan
      deze voorwaarden kan worden voldaan. Bedoelde vrijstelling wordt verleend op gemotiveerd schriftelijk verzoek tot
      uiterlijk een maand voor de aanvang van de gecontracteerde transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.2
    text: |-
      Een erkenning is geldig tot het moment dat deze wordt ingetrokken. De netbeheerder van het landelijk
      gastransportnet zal een erkenning slechts intrekken op verzoek van de erkende programmaverantwoordelijke of als
      de erkende programmaverantwoordelijke niet langer voldoet aan de voorwaarden zoals genoemd in [3.2][ref1] of,
      na overleg met de Autoriteit Consument en Markt, indien de erkende programmaverantwoordelijke redelijkerwijs
      niet in staat wordt geacht de verplichtingen als opgenomen in deze Transportcode gas LNB na te komen. Intrekking
      van de erkenning op verzoek van de erkende programmaverantwoordelijke is uitsluitend mogelijk indien de erkende
      programmaverantwoordelijke geen gebruik (meer) maakt van de transportcapaciteit van de netbeheerder van het
      landelijk gastransportnet en de erkende programmaverantwoordelijke geen programmaverantwoordelijkheid meer
      draagt. Voor het intrekken van de erkenning naar aanleiding van het niet langer voldoen aan de verplichtingen als
      opgenomen in deze Transportcode gas LNB gelden de regelingen zoals beschreven in [3.3.4][ref2] en [3.3.5][ref3]. De
      netbeheerder van het landelijk gastransportnet informeert elke regionale netbeheerder terstond over de intrekking
      van een erkenning LB.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert een aparte lijst met rechtspersonen en natuurlijke
      personen van wie de erkenning LB is ingetrokken op zijn website onder vermelding van de datum waarop de erkenning
      is ingetrokken. De reden van de intrekking wordt daarbij niet vermeld.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.3
  - number: 3.3.4.1
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet heeft besloten de erkenning van een erkende
      programmaverantwoordelijke in te trekken, meldt hij dat aan de Autoriteit Consument en Markt. De netbeheerder
      van het landelijk gastransportnet bepaalt na overleg met de Autoriteit Consument en Markt of, en zo ja
      onder welke voorwaarden, hij de erkende programmaverantwoordelijke dan wel de bewindvoerder en erkende
      programmaverantwoordelijke tezamen onderscheidenlijk de curator aanbiedt om intrekking van de erkenning als
      programmaverantwoordelijke op te schorten voor ten hoogste 10 werkdagen. In dat geval kan de netbeheerder van het
      landelijk gastransportnet aanbieden, voor zover dat redelijkerwijs noodzakelijk is, garant te staan voor de aan
      deze opschorting gerelateerde kosten. De genoemde voorwaarden kunnen onder andere bevatten: eisen aan de inkoop van
      energie gedurende de opschorting en zekerheidstelling voor eventuele kosten.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.4.1
  - number: 3.3.4.2
    text: |-
      Onder kosten in de zin van [3.3.4.1][ref1] worden verstaan de eventuele kosten voor de inkoop van gas kosten ten
      gevolge van het niet in balans zijn van de erkende programmaverantwoordelijke en andere activiteiten rechtstreeks
      voortvloeiend uit de verplichtingen van de erkende programmaverantwoordelijke. Bij deze kosten zijn de eventueel
      door de overheid opgelegde heffingen inbegrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.3.4.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.3.4.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4.3
    text: |-
      Indien het in [3.3.4.1][ref1] bedoelde overleg tot opschorting van de intrekking van de erkenning van de
      betreffende programmaverantwoordelijke leidt, worden gedurende de opschorting alle individuele verzoeken tot
      overdracht van programmaverantwoordelijkheid naar de betreffende programmaverantwoordelijke geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.3.4.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.3.4.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.5.1
    text: |-
      Als de erkenning van de programmaverantwoordelijke is ingetrokken, waarbij deze intrekking niet is toe
      te rekenen aan de betrokken grootverbruikers, wordt de programmaverantwoordelijkheid over de erkende
      programmaverantwoordelijken als volgt verdeeld:

      a. de programmaverantwoordelijkheid voor kleinverbruikers waarvoor de vergunninghouder de
      programmaverantwoordelijkheid heeft geregeld: aan de erkende programmaverantwoordelijke die de vergunninghouder
      onverwijld aan de netbeheerder van de betreffende kleinverbruikers opgeeft;

      b. de programmaverantwoordelijkheid voor kleinverbruikers waarvoor de in sub a bedoelde vergunninghouder niet de
      programmaverantwoordelijkheid heeft geregeld: aan erkende programmaverantwoordelijken van kleinverbruikers naar
      rato van het aantal kleinverbruikers waarvoor een erkende programmaverantwoordelijke programmaverantwoordelijkheid
      draagt. De verdeling zal worden uitgedrukt in procenten, waarbij zal worden afgerond op tienden van procenten;

      c. de programmaverantwoordelijkheid voor grootverbruikers waarvoor de leverancier, daartoe bepaaldelijk gemachtigd
      door de grootverbruiker, de programmaverantwoordelijkheid heeft geregeld: aan de erkende programmaverantwoordelijke
      die de leverancier onverwijld aan de netbeheerder van de betreffende grootverbruikers opgeeft;

      d. de programmaverantwoordelijkheid voor grootverbruikers die zelf een erkende programmaverantwoordelijke
      aanwijzen: aan de erkende programmaverantwoordelijke die de grootverbruiker onverwijld aan de netbeheerder van de
      betreffende grootverbruikers opgeeft;

      e. de programmaverantwoordelijkheid voor grootverbruikers waarvoor de in sub c bedoelde leverancier en/of sub d
      bedoelde grootverbruiker niet de programmaverantwoordelijkheid heeft geregeld:

        - aan erkende programmaverantwoordelijken naar rato van de exitcapaciteit zoals vastgesteld op basis van
      [2.1][ref1]. De verdeling zal worden uitgedrukt in procenten, waarbij zal worden afgerond op tienden van procenten.
      Bij verdeling van grootverbruikers met een substantiële hoeveelheid gecontracteerde capaciteit kan de netbeheerder
      van het landelijk gastransportnet vooraf in contact treden met de betrokken erkende programmaverantwoordelijke(n)
      ten aanzien van het aanpassen van de verdeling.

      De erkende programmaverantwoordelijken die op grond van sub b en/of sub e programmaverantwoordelijkheid toegewezen
      hebben gekregen, informeren zo spoedig mogelijk, maar uiterlijk binnen drie werkdagen na de verdeling de betrokken
      grootverbruikers en de vergunninghouder van de betrokken kleinverbruikers, over deze toewijzing, de bij hen
      geldende voorwaarden en de opzegmogelijkheden.

      Indien de programmaverantwoordelijkheid van klein- of grootverbruikers als gevolg van het intrekken van erkenning
      van de programmaverantwoordelijke wordt verdeeld op grond van sub b of sub e, zorgt de netbeheerder van het
      landelijk gastransportnet er voor dat de verdeling van programmaverantwoordelijkheid binnen één werkdag in zijn
      aansluitingenregister wordt verwerkt en verzoekt de netbeheerder van het landelijk gastransportnet de betrokken
      regionale netbeheerders deze verdeling binnen één werkdag in hun aansluitingenregister te verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.5.2
    text: |-
      De grootverbruiker die via de in deze paragraaf bedoelde verdeling een andere erkende programmaverantwoordelijke
      heeft gekregen voor zijn aansluiting, heeft gedurende twee maanden na de verdeling het recht zonder opzegtermijn
      van erkende programmaverantwoordelijke te wisselen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.5.2
  - number: 3.3.5.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.5.3
  - number: 3.3.5.4
    text: |-
      In de in [3.3.5.1][ref1] genoemde verdeling wordt rekening gehouden met een verzoek van een erkende
      programmaverantwoordelijke om de aan hem toegewezen aansluitingen toe te wijzen aan een andere erkende
      programmaverantwoordelijke indien beide betrokken erkende programmaverantwoordelijken hiertoe gezamenlijk een
      verzoek hebben ingediend bij de netbeheerder van het landelijk gastransportnet. De verwerkingstermijn van een
      dergelijk verzoek bedraagt maximaal twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.3.5.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.3.5.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.6
    text: |-
      Indien een leverancier surseance van betaling is verleend respectievelijk failliet is verklaard, geldt voor de
      leveringen van de betreffende leverancier die niet vallen onder het [Besluit leveringszekerheid Gaswet][ref1],
      dat de erkende programmaverantwoordelijke die de programmaverantwoordelijkheid voor die aangeslotenen
      draagt, zijn programmaverantwoordelijkheid tijdelijk dient te continueren tegen redelijke tarieven. Betrokken
      partijen informeren elkaar onverwijld over de ontstane situatie. In verband met het continueren van de
      programmaverantwoordelijkheid informeren de erkende programmaverantwoordelijke en de betreffende netbeheerder de
      betrokken aangeslotenen onverwijld over de ontstane situatie. De erkende programmaverantwoordelijke dient zijn
      programmaverantwoordelijkheid voor die aangeslotenen te continueren tot het moment waarop die aangeslotene een
      nieuwe leveringsovereenkomst heeft gesloten dan wel de levering aan die aangeslotene is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0016605
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.6
    references:
      - id: ref1
        bwb_id: BWBR0016605
  - number: 3.3.7
    text: |-
      In geval van dezelfde partij het besluit wordt genomen de vergunning en de erkenning in te trekken geldt de
      aanvullende bepaling dat het besluit dat de vergunning wordt ingetrokken eerder geacht te zijn genomen dan het
      besluit tot intrekken van de erkenning als programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.7
  - number: 3.3.8
    text: |-
      In het geval de programmaverantwoordelijke waarvan de erkenning is ingetrokken eveneens leverancier was, zal bij de
      verdeling van de programmaverantwoordelijkheid conform [3.3.5.1][ref1], door de erkende programmaverantwoordelijke
      die programmaverantwoordelijkheid voor grootverbruikers krijgt toebedeeld, aan de betreffende netbeheerder bekend
      worden gemaakt welke leverancier verantwoordelijk wordt voor de levering bij de toebedeelde grootverbruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.3.5.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.3.8
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.3.5.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.1
    text: |-
      Een aangeslotene die voldoet aan het bepaalde in [3.2.0.a][ref1] is uitsluitend gerechtigd exitcapaciteit te
      contracteren op het landelijk gastransportnet aangesloten aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.0
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.2.0
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.4.2
    text: |-
      De betrokken aangeslotene is niet gerechtigd gebruik te maken van de andere diensten van de netbeheerder van het
      landelijk gastransportnet waaronder begrepen het deelnemen aan het gastransport. Dit is voorbehouden aan een ieder
      die voldoet aan de voorwaarden van [3.2.0.a t/m 3.2.0.c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.0
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 3.2.0
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.5.1.1
    text: |-
      Een aangeslotene die de programmaverantwoordelijkheid voor zijn aansluiting niet zelf zal uitoefenen, meldt aan
      zijn netbeheerder aan welke erkende programmaverantwoordelijke(n) hij zijn programmaverantwoordelijkheid heeft
      overgedragen. Deze melding kan door middel van een switchbericht van de daartoe gemachtigde leverancier dan wel
      door middel van een schriftelijke mededeling.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.5.1.1
  - number: 3.5.1.2
    text: |-
      Op een grenspunt en op een installatie voor de opslag van gas of LNG heeft de partij die het gebruiksrecht van de
      entry- en/of exitcapaciteit heeft programmaverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.5.1.2
  - number: 3.5.1.3
    text: |-
      Op een entrypunt waar een gasproductienet is verbonden met het landelijk gastransportnet, hebben de partijen
      aangesloten op dat gasproductienet programmaverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.5.1.3
  - number: 3.5.2
    text: |-
      Een erkende programmaverantwoordelijke is verplicht programmaverantwoordelijkheid uit te oefenen met betrekking
      tot de aansluitingen waarvoor hij in de aansluitingenregisters van de netbeheerders op enig moment als
      programmaverantwoordelijke is vermeld.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.5.2
  - number: 3.5.3
    text: |-
      De netbeheerders mogen afgaan op hetgeen in de aansluitingenregisters omtrent de programmaverantwoordelijkheid voor
      een aansluiting is vermeld, onverminderd het recht van de erkende programmaverantwoordelijke op correctie van een
      onjuiste vermelding.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel3.5.3
  - number: 4.1.0
    text: De erkende programmaverantwoordelijke is verantwoordelijk voor het bewaken van de balans per portfolio.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.0
  - number: 4.1.1.1
    text: |-
      Een erkende programmaverantwoordelijke dient dagelijks voor 14:00 uur bij de netbeheerder van het landelijk
      gastransportnet een entryprogramma en/of exitprogramma voor de volgende gasdag in.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.1.1
  - number: 4.1.1.2
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op zijn website een formule die de
      relatie voorschrijft tussen entry- en exithoeveelheden per uur voor een exitprogramma. De erkende
      programmaverantwoordelijke is verplicht de formule toe te passen in een exitprogramma, dat geheel of gedeeltelijk
      betrekking heeft op de levering van gas aan kleinverbruikers. De formule mag niet worden toegepast op de netto
      verkooppositie door transacties op het virtuele handelspunt. De parameters van deze formule die gelden voor de
      volgende gasdag publiceert de netbeheerder van het landelijk gastransportnet dagelijks voor 09:00 uur op zijn
      website. De formule wordt zodanig opgesteld dat na toepassing van de formule de entryhoeveelheid per gasdag gelijk
      is aan de exithoeveelheid.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.1.2
  - number: 4.1.1.3
    text: |-
      Uiterlijk een uur na het tijdstip waarop de in [4.1.1.1][ref1] bedoelde entry- en/of exitprogramma’s moeten zijn
      ingediend, informeert de netbeheerder van het landelijk gastransportnet de erkende programmaverantwoordelijke of de
      entry- en/of exitprogramma’s zijn goedgekeurd.

      De netbeheerder van het landelijk gastransportnet keurt in ieder geval een exitprogramma af indien
      het exitprogramma niet voldoet aan de eisen zoals beschreven in [4.1.1.2][ref2]. Indien de erkende
      programmaverantwoordelijke afziet van het toepassen van de in 4.1.1.2 bedoelde formule in zijn exitprogramma,
      dan keurt de netbeheerder van het landelijk gastransportnet in ieder geval het exitprogramma af indien in dat
      exitprogramma de entry- en exithoeveelheid niet ieder uur gelijk is.

      De netbeheerder van het landelijk gastransportnet keurt in ieder geval een entryprogramma af indien in het
      entryprogramma de entry- en exithoeveelheid niet ieder uur gelijk is.

      De netbeheerder van het landelijk gastransportnet keurt in ieder geval een entry- of exitprogramma af indien
      de netbeheerder van het landelijk gastransportnet op het VPPV inconsistentie constateert met andere exit-
      respectievelijk entryprogramma’s van de erkende programmaverantwoordelijke zelf en/of van een andere erkende
      programmaverantwoordelijke.

      Dat een ander exit- of entryprogramma nog niet volledig is goedgekeurd, hoeft voor een programma waarin
      programmaverantwoordelijkheid overgaat van of naar het nog niet goedgekeurde programma, niet te leiden tot
      inconsistentie.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.1.2
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 4.1.1.1
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: 4.1.1.2
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.1.4
    text: |-
      Nadat de erkende programmaverantwoordelijke van de netbeheerder van het landelijk gastransportnet bericht heeft
      ontvangen dat zijn entry- en/of exitprogramma is afgekeurd, dient hij een verbeterd entry- en/of exitprogramma in,
      die opnieuw de goedkeuring van de netbeheerder van het landelijk gastransportnet behoeven.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.1.4
  - number: 4.1.1.5
    text: |-
      Indien om 22:00 uur voorafgaand aan de gasdag geen goedgekeurd entry- en/of exitprogramma beschikbaar is,
      stelt de netbeheerder van het landelijk gastransportnet op basis van de hem bekende informatie dit entry- en/of
      exitprogramma vast.

      Indien op dit tijdstip de netbeheerder van het landelijk gastransportnet inconsistentie constateert op het VPPV
      tussen het programma van een beurs aangewezen conform [artikel 66b van de Gaswet][ref1] of een afwikkelonderneming
      (clearing house) die beschikt over een vergunning conform de [Wet op het financieel toezicht][ref2] (Wft) en een
      exit- en/of entryprogramma van een andere erkende programmaverantwoordelijke, dan stelt de netbeheerder van het
      landelijk gastransportnet de betrokken programma’s vast in lijn met het door een beurs of afwikkelonderneming
      ingediende programma.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66b
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 66b
      - id: ref2
        bwb_id: BWBR0020368
  - number: 4.1.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op basis van de goedgekeurde entry- en exitprogramma’s
      uiterlijk twee uur voor het begin van de gasdag voor een ieder opvraagbaar de uurwaarden van de grenzen van de
      zones voor balanshandhaving voor de betreffende gasdag, zijnde:

        - de grens tussen de donkergroene zone en de lichtgroene zone;
        - de grens tussen de lichtgroene zone en de oranje zone;
        - de grens tussen de oranje zone en de rode zone.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.2.1
  - number: 4.1.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert, zodra deze beschikbaar zijn, per uur voor een ieder
      opvraagbaar:

      a. [Vervallen];

      b. de hoeveelheid gas gekocht/verkocht middels WDM-transacties, de uren waarin het gas wordt geleverd/afgenomen en
      de WDM-transactieprijs;

      c. [Vervallen];

      d. de som van de posities van de onbalans veroorzakende programmaverantwoordelijken;

      e. [Vervallen];

      f. het systeem balans signaal.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.2.2
  - number: 4.1.2.3
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op uurbasis per portfolio per uur, zodra deze
      beschikbaar zijn, onderstaande informatie die alleen opvraagbaar is door geautoriseerde medewerkers van de
      betreffende erkende programmaverantwoordelijke:

      a. het goedgekeurde entry- en/of exitprogramma;

      b. de uuronbalans, zijnde de vastgestelde netto afwijking van de near real time allocaties ten opzichte van het
      goedgekeurde entry- en/of exitprogramma;

      c. na een WDM-transactie: de hoeveelheid gas die ten gevolge van de WDM-transactie door de netbeheerder
      van het landelijk gastransportnet is gekocht van of verkocht aan de onbalans veroorzakende erkende
      programmaverantwoordelijken conform [4.1.4.2][ref1] en [4.1.4.3][ref2], het uur van de WDM-transactie en de prijs;

      d. de cumulatie van de uuronbalansen, zijnde het portfolio onbalans signaal.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.3
