  - number: 4.1.4.1
    text: |-
      In de eerste helft van ieder uur voorspelt de netbeheerder van het landelijk gastransportnet de positie van het
      systeem balans signaal aan het einde van dat uur.

      Als deze voorspelling in de donkergroene zone uitkomt, dan onderneemt de netbeheerder van het landelijk
      gastransportnet geen actie met betrekking tot balanshandhaving.

      Als deze voorspelling in de lichtgroene zone uitkomt en de systeemonbalans toeneemt ten opzichte van de
      voorspelling van een uur eerder, dan zal de netbeheerder van het landelijk gastransportnet een WDM-titletransactie
      aangaan om de systeemonbalans te verminderen. De hoeveelheid waarvoor de netbeheerder van het landelijk
      gastransportnet de WDM-titletransactie aangaat is het verschil tussen de voorspelde waarde van het systeem balans
      signaal aan het eind van het uur en de grens tussen de donkergroene zone en de lichtgroene zone, verminderd met de
      hoeveelheid gas die de netbeheerder van het landelijk gastransportnet middels eerdere WDM-titletransacties heeft
      gekocht/verkocht en die nog die nog geleverd/afgenomen moeten worden.

      Als deze voorspelling in de oranje zone of rode zone uitkomt, zal de netbeheerder van het landelijk gastransportnet
      een WDM-temporaltransactie aangaan om de systeemonbalans te verminderen. De hoeveelheid waarvoor de netbeheerder
      van het landelijk gastransportnet de WDM-temporaltransactie aangaat, is het verschil tussen de voorspelde waarde
      van het systeem balans signaal aan het eind van het uur en de grens tussen de donkergroene zone en de lichtgroene
      zone.

      Als deze voorspelling in de rode zone uitkomt en de netbeheerder van het landelijk gastransportnet verwacht dat de
      inzet van de WDM-transactie onvoldoende effect zal hebben, kan de netbeheerder van het landelijk gastransportnet
      een noodsituatie uitroepen en handelen zoals beschreven in [4.1.4.4][ref1]. Een WDM-transactie heeft invloed op het
      portfolio onbalans signaal van het betreffende portfolio.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.4
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.4.1
