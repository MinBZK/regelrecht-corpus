articles:
  - number: 2.1.1
    text: |-
      Transport vindt plaats op grond van een met de netbeheerder van het landelijk gastransportnet te sluiten
      overeenkomst en houdt in dat de netbeheerder van het landelijk gastransportnet gas aangeboden op een entrypunt in
      het landelijk gastransportnet inneemt en op een exitpunt ter beschikking stelt. Entrycapaciteit en exitcapaciteit
      kunnen onafhankelijk van elkaar bij de netbeheerder van het landelijk gastransportnet worden gecontracteerd.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.1
  - number: 2.1.1a
    text: |-
      1. Ter uitvoering van [artikel 12b, lid 2a, onder sub b en c, van de Gaswet][ref1], wordt het volgende bepaald.

      2. De netbeheerder van het landelijk gastransportnet informeert de netgebruikers op geschikte wijze over de actuele
      lijst van haar entry- en exitpunten, ingedeeld naar relevante marktsegmenten en publiceert de actuele lijst op
      haar website.

      3. De netbeheerder van het landelijk gastransportnet stelt entrypunten en exitpunten vast op grond van objectieve,
      transparante en niet-discriminerende voorwaarden en met inachtneming van de belangen van netgebruikers.

      4. Onder het vaststellen van entry- en exitpunten in dit artikel, wordt mede begrepen het laten vervallen van
      entry- en exitpunten.

      5. Indien het entry- of exitpunt vervalt vanwege het wegvallen van fysieke gasstromen of er een entry-of exitpunt
      ontstaat vanwege nieuwe fysieke gasstromen, is de procedure als in dit artikel bepaald niet van toepassing.

      6. Een voornemen tot wijziging van de vaststelling van interconnectiepunt(en) dat leidt tot het laten vervallen
      van alle interconnectiepunten tussen twee entry-exitsystemen (marktintegratie), zal tenminste 18 maanden voor
      de geplande invoeringsdatum bekend worden gemaakt door de netbeheerder van het landelijk gastransportnet in
      samenwerking met de andere transmissiesysteembeheerder(s). Deze bekendmaking vindt plaats door publicatie van het
      voornemen op de website van de netbeheerder en door toezending van het voornemen aan de ACM.

      7. Het voornemen, bedoeld in lid 6, bevat tenminste:

      a. een analyse van de kosten en baten van het laten vervallen van de betrokken interconnectiepunten;

      b. een analyse van de financiële gevolgen van het laten vervallen van de betrokken interconnectiepunten voor de
      netgebruikers van de betrokken entry-exitsystemen. De netbeheerder van het landelijk gastransportnet maakt de
      financiële gevolgen inzichtelijk aan de hand van een naar jaar gespecificeerde berekening voor een periode van
      tenminste vijf jaren;

      c. informatie over de technische en operationele voorzieningen die ten behoeve van het laten vervallen van de
      betrokken interconnectiepunten moeten worden getroffen en de afspraken die daarover zijn gemaakt met de andere
      transmissiesysteembeheerder(s).

      8. De netbeheerder van het landelijk gastransportnet stelt netgebruikers in de gelegenheid om binnen zes weken na
      publicatie van het voornemen een schriftelijke reactie te geven op het voornemen. De netbeheerder van het landelijk
      gastransportnet zendt een afschrift van de ontvangen reacties op het voornemen aan de ACM.

      9. De netbeheerder van het landelijk gastransportnet geeft niet eerder uitvoering aan het voornemen dan nadat:

      a. de ACM heeft beoordeeld of het laten vervallen van de betrokken interconnectiepunten plaatsvindt overeenkomstig
      de in lid 3 genoemde criteria;

      b. de ACM en de betrokken buitenlandse nationale regulerende instantie(s) hebben vastgesteld welke technische en
      operationele maatregelen getroffen dienen te worden door de betrokken transmissiesysteembeheerders;

      c. de ACM en de betrokken buitenlandse nationale regulerende instantie(s), hebben vastgesteld of en, zo ja, welke
      vergoedingsmaatregel vanwege het kostenveroorzakingsprincipe dient te worden getroffen ter vergoeding van het
      transport van gas tussen de betrokken transmissiesysteembeheerders. De vergoedingsmaatregel beperkt de nadelige
      effecten op de inkomsten van de betrokken transmissiesysteembeheerders en voorkomt ongeoorloofde kruissubsidiëring
      tussen netgebruikers. Verder draagt de vergoedingsmaatregel bij aan kostenreflectieve tarieven.

      10. Het in lid 9 in de onderdelen a, b en c genoemde zal binnen een termijn van 12 maanden worden uitgevoerd of
      sneller indien dat mogelijk is. De overschrijding van deze termijn laat de verplichting van de netbeheerder van
      het landelijk gastransportnet om niet eerder uitvoering te geven aan het voornemen dan nadat het in lid 9 in de
      onderdelen a, b en c is doorlopen, onverlet. De ACM zal de uitkomsten van de in lid 9 in de onderdelen a tot en met
      c bedoelde onderzoeken, op geschikte wijze bekendmaken.

      11. Indien de netbeheerder van het landelijk gastransportnet het voornemen heeft om, anders dan vanwege
      marktintegratie, een entry- of exitpunt vast te stellen, dan geldt de hiernavolgende procedure:

      a. De netbeheerder van het landelijk gastransportnet meldt dit voornemen aan de ACM uiterlijk twee maanden voordat
      zij uitvoering wil geven aan dit voornemen.

      b. De ACM beoordeelt dit voornemen op een materieel effect voor de netgebruikers en deelt de uitkomst van deze
      beoordeling met de netgebruikers.

      c. Indien er sprake is van een materieel effect zal de netbeheerder van het landelijk gastransportnet in overleg
      treden met de netgebruikers.

      d. Indien er sprake is van een materieel effect zal de ACM binnen een termijn van drie maanden of sneller indien
      dat mogelijk is:

      1°. beoordelen of het vaststellen van het entry- of exitpunt plaatsvindt overeenkomstig de in lid 3 genoemde
      criteria;

      2°. vaststellen of en, zo ja, welke compenserende maatregel vanwege het kostenveroorzakingsprincipe dient te worden
      getroffen teneinde ongeoorloofde kruissubsidiëring tussen netgebruikers te voorkomen. De compenserende maatregel
      draagt bij aan kostenreflectieve tarieven.

      12. De netbeheerder van het landelijk gastransportnet geeft niet eerder uitvoering aan haar voornemen, bedoeld in
      lid 11, dan dat de procedure in lid 11, onderdelen a tot en met d is doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
