        artikel: 4.1.4.1
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.3
    text: |-
      De hoeveelheid gas die de netbeheerder van het landelijk gastransportnet verkoopt conform [4.1.4.1][ref1] koopt de
      netbeheerder van het landelijk gastransportnet in het uur van levering of afname tegen de WDM-transactieprijs zoals
      bedoeld [4.1.5.1][ref2] van de onbalans veroorzakende programmaverantwoordelijke(n) naar rato van de waarde van hun
      portfolio onbalans signaal die betrekking heeft op het begin van het uur van de WDM-transactie. Dit heeft invloed
      op het portfolio onbalans signaal in het uur van levering of afname van dit gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.5.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.4.3
