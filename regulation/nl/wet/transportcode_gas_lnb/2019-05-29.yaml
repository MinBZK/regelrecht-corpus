  - number: 2.1.2e
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt de in een maand door elke erkende
      programmaverantwoordelijke met erkenning LB ten behoeve van telemetriegrootverbruikers gecontracteerde hoeveelheid
