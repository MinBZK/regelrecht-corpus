  - number: 4.2.1.1
    text: |-
      De netbeheerder van het landelijk gastransportnet kent aan elke erkende programmaverantwoordelijke voor elk
      portfolio een unieke identificatie toe.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.1.1
  - number: 4.2.1.2
    text: |-
      Berichtenuitwisseling tussen de erkende programmaverantwoordelijke en de netbeheerder van het landelijk
      gastransportnet met betrekking tot de uitvoering van transport zal plaatsvinden via een door deze netbeheerder
      geaccepteerd en vooraf afgestemd en getest communicatieprotocol.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.1.2
  - number: 4.2.2.1
    text: |-
      Nominaties van erkende programmaverantwoordelijken geven de door de erkende programmaverantwoordelijke
      gewenste hoeveelheid te transporteren gas op een entrypunt of exitpunt aan. De netbeheerder van het landelijk
      gastransportnet gebruikt de nominaties in de planning van het gastransport (met het oog op het efficiënt bedrijven
      van het landelijk gastransportnet), voor de toekenning van eventuele afschakelbare entry- of exitcapaciteit en in
      het allocatieproces.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.2.1
  - number: 4.2.2.2
    text: |-
      Een erkende programmaverantwoordelijke dient voor elke gasdag voor elk entrypunt en exitpunt voor elk portfolio een
      nominatie in bij de netbeheerder van het landelijk gastransportnet. Een nominatie dient uiterlijk om 14.00 uur op
      de dag vóór de gasdag waarop de nominatie betrekking heeft door de netbeheerder van het landelijk gastransportnet
      ontvangen te zijn. Indien een nominatie niet wordt ontvangen door deze netbeheerder, dan wordt aangenomen dat de
      nominatie nul is voor het desbetreffende uur en entrypunt of exitpunt.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.2.2
  - number: 4.2.2.3
    text: |-
      De erkende programmaverantwoordelijke is bevoegd hernominaties te sturen naar de netbeheerder van het landelijk
      gastransportnet. Van een ontvangen hernominatie neemt de netbeheerder van het landelijk gastransportnet alleen
      wijzigingen in behandeling die betrekking hebben op uren in de gasdag die na het ontvangsttijdstip van de
      hernominatie liggen, rekening houdend met de leadtime voor hernominaties. De leadtime bedraagt een half uur of twee
      uur. De netbeheerder van het landelijk gastransportnet publiceert op haar website een lijst met punten waarvoor
      de leadtime een half uur bedraagt en de per punt geldende voorwaarden. Voor alle overige punten waar hernominaties
      mogelijk zijn geldt een leadtime van twee uur.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.2.3
  - number: 4.2.2.4
    text: |-
      Voor een entrypunt vermeldt een nominatie voor een gasdag voor elk uur van die gasdag een hoeveelheid gas,
      de portfolio van de erkende programmaverantwoordelijke, het entrypunt en de partij waarvan gas (eventueel
      administratief) wordt overgenomen. Voor een exitpunt bevat een nominatie voor een gasdag voor elk uur van die
      gasdag een hoeveelheid gas, de portfolio van de erkende programmaverantwoordelijke, het exitpunt en de partij
      waaraan gas (eventueel administratief) wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.2.4
  - number: 4.2.2.5
    text: |-
      De netbeheerder van het landelijk gastransportnet kan de erkende programmaverantwoordelijke voor bepaalde
      entrypunten of exitpunten tijdelijk vrijstelling verlenen van de verplichting tot nomineren. De voorwaarden
      waaronder de netbeheerder van het landelijk gastransportnet deze vrijstelling verleent, worden door hem op
      zijn website vooraf gepubliceerd. De netbeheerder van het landelijk gastransportnet verleent geen vrijstelling
      voor zover een dergelijke vrijstelling zich niet zou verdragen met handhaving van de integriteit (veiligheid,
      doelmatigheid en betrouwbaarheid) van het landelijk gastransportnet of als de nominaties vereist zijn voor het
      allocatieproces.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.2.5
  - number: 4.2.3.1
    text: |-
      Confirmaties van de netbeheerder van het landelijk gastransportnet geven de hoeveelheden gas aan die hij voor de
      erkende programmaverantwoordelijke gaat transporteren. De netbeheerder van het landelijk gastransportnet stelt de
      inhoud van de confirmaties vast op basis van de nominaties van de erkende programmaverantwoordelijke en de uitkomst
      van een toetsingsprocedure.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.3.1
  - number: 4.2.3.2
    text: |-
      De toetsingsprocedure bestaat uit één of twee stappen: de netbeheerder van het landelijk gastransportnet toetst
      elke (her)nominatie van de erkende programmaverantwoordelijke aan de voorwaarden van de relevante overeenkomst en –
      indien van toepassing – vergelijkt deze met de (her)nominatie van andere erkende programmaverantwoordelijken in het
      landelijk gastransportnet of met informatie verkregen van aangrenzende netbeheerders.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.3.2
  - number: 4.2.3.3
    text: |-
      De netbeheerder van het landelijk gastransportnet stuurt – zo vroeg mogelijk in het tijdvak tussen 14.00 uur en
      18.00 uur op de dag vóór de gasdag waarop de (her)nominatie betrekking heeft die uiterlijk om 14.00 uur op die
      dag door hem is ontvangen – een confirmatie aan de erkende programmaverantwoordelijke. Voor zover meer dan de
      gecontracteerde entry- of exitcapaciteit wordt genomineerd stuurt de netbeheerder van het landelijk gastransportnet
      een afwijzing van de (her)nominatie naar de erkende programmaverantwoordelijke. In geval van afschakeling zal de
      erkende programmaverantwoordelijke middels een afschakelbericht op de hoogte worden gesteld. Dit afschakelbericht
      kan deel uitmaken van de confirmatie.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.3.3
  - number: 4.2.3.4
    text: |-
      In geval van een hernominatie stuurt de netbeheerder van het landelijk gastransportnet een confirmatie zo spoedig
      mogelijk, maar in ieder geval voor aanvang van het uur waarop de hernominatie betrekking heeft, aan de erkende
      programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.3.4
  - number: 4.2.3.5
    text: |-
      De hoeveelheden gas die in de nominaties zijn aangegeven, worden bevestigd in de confirmatie als uit de
      toetsingsprocedure in [4.2.3.2][ref1] blijkt dat dit toegestaan en mogelijk is. In andere gevallen wijken de
      gegevens in de confirmatie af van de gegevens in de nominaties. Het is de verantwoordelijkheid van de erkende
      programmaverantwoordelijke om te controleren of een confirmatie is ontvangen en om kennis te nemen van de inhoud
      van de confirmatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.2.3.2
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 4.2.3.2
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.1
    text: |-
      De netbeheerder van het landelijk gastransportnet gebruikt allocatiegegevens om het gebruik van het landelijk
      gastransportnet per uur door netgebruikers vast te stellen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.3.1.1
  - number: 4.3.1.2
    text: |-
      De netbeheerder van het landelijk gastransportnet maakt gebruik van allocatiegegevens bepaald conform het gestelde
      in de Allocatiecode gas.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.3.1.2
  - number: 4.4.1
    text: |-
      Activiteiten van de netbeheerder van het landelijk gastransportnet die naar zijn redelijke inschatting
      waarschijnlijk leiden tot beperking van de transportcapaciteit worden, tenzij er sprake is van omstandigheden
      waarin er onvoldoende tijd is om dit te doen, enkel ten uitvoer gebracht na overleg met de betrokken erkende
      programmaverantwoordelijken over het tijdstip en de duur van de beperking. Bij het vaststellen van het tijdstip en
      de duur van de beperking houdt de netbeheerder van het landelijk gastransportnet rekening met de belangen van de
      erkende programmaverantwoordelijken voor zover dat redelijkerwijs mogelijk is.

      Gepland onderhoud wordt ten minste twee maanden voorafgaand aan de gasdag waarop dit de transportcapaciteit van
      de netbeheerder van het landelijk gastransportnet zou kunnen beïnvloeden aangekondigd. Indien het noodzakelijk
      is om de transportcapaciteit te beperken, is de netbeheerder van het landelijk gastransportnet gerechtigd het
      betreffende transport te verminderen. De rechten van de erkende programmaverantwoordelijken op gebruik van de
      door hen bij de netbeheerder van het landelijk gastransportnet gecontracteerde transportcapaciteit worden in
      overeenstemming daarmee verminderd. Wanneer de netbeheerder van het landelijk gastransportnet gepland onderhoud,
      verlegging of nieuwbouw noodzakelijk acht, verschaft hij op verzoek van de erkende programmaverantwoordelijke
      passend bewijs van deze noodzaak. De netbeheerder van het landelijk gastransportnet spant zich in om beperking van
      de transportcapaciteit tot een absoluut minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.4.1
  - number: 4.4.2
    text: |-
      Voor zover de netbeheerder van het landelijk gastransportnet in enig uur, door een niet aan de erkende
      programmaverantwoordelijke toe te rekenen oorzaak, niet in staat is om (een deel van) het gecontracteerde transport
      uit te voeren en dit leidt tot een merkbare beperking in het gebruik van de gecontracteerde transportcapaciteit,
      wordt het verschuldigde bedrag voor bij de netbeheerder van het landelijk gastransportnet gecontracteerde entry-
      en/of exitcapaciteit verminderd naar verhouding van de beperking.

      In geval van niet gepland onderhoud/incidenten wordt de restitutie slechts geëffectueerd nadat de duur van de
      merkbare beperking een drempelwaarde van 24 uur, zijnde de lengte van elke aaneengesloten periode dat de merkbare
      beperking optreedt, heeft overschreden. Deze drempelwaarde geldt voor elk afzonderlijk entry- of exitpunt.

      De restitutie wordt gebaseerd op honderd procent van het verschuldigde bedrag voor de gecontracteerde
      transportcapaciteit, rekening houdend met de duur van de beperking voor zover deze de drempelwaarde overschrijdt en
      met de omvang van de beperking.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.4.2
  - number: 4.4.3
    text: |-
      In geval van beperking van entry- of exitcapaciteit wordt de voor de erkende programmaverantwoordelijken
      beschikbare entry- of exitcapaciteit door de netbeheerder van het landelijk gastransportnet pro rata toegewezen op
      basis van de door hen gecontracteerde entry- of exitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.4.3
  - number: 4.4.4
    text: |-
      Voor afschakelbare entry of exitcapaciteit vindt [4.4.2][ref1] geen toepassing in geval van een beperking van entry
      of exitcapaciteit door het gebruik van vaste entry of exitcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.4.2
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 4.4.2
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.5
    text: |-
      De netbeheerder van het landelijk gastransportnet monitort de hoeveelheid beschikbare kwaliteitsconversie. De
      netbeheerder van het landelijk gastransportnet kan kwaliteitsconversie uitvoeren tot het niveau waarop de haar
      ter beschikking staande middelen zijn uitgenut. Bij kwaliteitsconversie ter verlaging van de verbrandingswaarde
      gaat het om de beschikbaarheid van gas met een lagere verbrandingswaarde dan de doelwaarde, waaronder
      synthetisch geproduceerd stikstof. Bij kwaliteitsconversie ter verhoging van de verbrandingswaarde gaat het om
      de beschikbaarheid van gas met een hogere verbrandingswaarde dan de doelwaarde. De netbeheerder van het landelijk
      gastransportnet beschikt in dit geval niet over synthetisch geproduceerd gas. Op het moment dat er een tekort
      aan kwaliteitsconversie dreigt, zal de netbeheerder van het landelijk gastransportnet dit voor zover mogelijk
      aan de betrokken erkende programmaverantwoordelijken melden met een vooraankondigingstijd van minimaal 4 uur.
      Na deze melding kan de netbeheerder van het landelijk gastransportnet contact opnemen met betrokken erkende
      programmaverantwoordelijken met het verzoek het gebruik van de door hen gecontracteerde transportcapaciteit zodanig
      bij te stellen dat het dreigende tekort aan kwaliteitsconversie wordt afgewend.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.4.5
  - number: 4.4.6
    text: |-
      In uitzonderlijke gevallen kan de netbeheerder van het landelijk gastransportnet vanwege beperking van
      kwaliteitsconversie niet tegemoetkomen aan (her)nominaties voor het gebruik van vaste transportcapaciteit. In
      een dergelijk geval heeft de netbeheerder van het landelijk gastransportnet het recht aanwijzingen aan erkende
      programmaverantwoordelijken te geven hun (her)nominaties zodanig, als voorgeschreven door de netbeheerder van het
      landelijk gastransportnet, aan te passen dat de systeemintegriteit van het landelijk gastransportnet kan worden
      gehandhaafd. Erkende programmaverantwoordelijken zijn verplicht deze aanwijzingen op te volgen. Voor zover mogelijk
      zal de netbeheerder van het landelijk gastransportnet de aanwijzingen naar evenredigheid over de veroorzakers van
      het probleem verdelen.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.4.6
  - number: 5.1.1
    text: |-
      Een geïnteresseerde kan, onverminderd het bepaalde in [2.1.2b][ref1], en [3.2.1, laatste alinea][ref2],
      transportcapaciteit contracteren door daartoe een verzoek bij de netbeheerder van het landelijk gastransportnet in
      te dienen. Het verzoek dient volledig te zijn en dient tijdig, rekening houdende met de termijn van afhandeling,
      vóór de gewenste startdatum te zijn ingediend op een door de netbeheerder van het landelijk gastransportnet op zijn
      website aangegeven wijze. De termijn van afhandeling is de periode van maximaal 10 werkdagen vanaf de datum dat een
      verzoek tot offerte of contractering van transportcapaciteit, dat voldoet aan alle vereisten, door de netbeheerder
      van het landelijk gastransportnet is ontvangen. De termijn van afhandeling begint op de dag van ontvangst, mits het
      verzoek voor 12.00 uur is ontvangen. Komt het verzoek na 12.00 uur binnen, dan begint de termijn van afhandeling de
      volgende werkdag.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2b
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 2.1.2b
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 5.1.2
    text: |-
      Een overeenkomst betreffende een dagcapaciteitsproduct kan worden gesloten tot het moment van ingaan van de
      betreffende gasdag.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.2
  - number: 5.1.3
    text: |-
      De netbeheerder van het landelijk gastransportnet wijst transportcapaciteit toe aan geïnteresseerden op basis van
      transparantie, non-discriminatie en efficiënt gebruik van het landelijk gastransportnet. In [hoofdstuk 2][ref1] is
      aangegeven hoe de transportcapaciteit door de netbeheerder van het landelijk gastransportnet aan geïnteresseerden
      wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '2'
  - number: 5.1.4
    text: |-
      Voor elk verzoek voor transportcapaciteit toetst de netbeheerder van het landelijk gastransportnet aan de
      beschikbare kredietruimte en aan de op dat moment beschikbare entry of exitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.4
  - number: 5.1.5
    text: |-
      De netbeheerder van het landelijk gastransportnet reageert binnen de termijn van afhandeling zoals bedoeld in
      [5.1.1][ref1] op een verzoek door toezending van de contractdocumentatie aan de geïnteresseerde of – in het geval
      van weigering van het gevraagde – door een gemotiveerde afwijzing van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel5.1.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 5.1.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.6
    text: |-
      De netbeheerder van het landelijk gastransportnet voorziet elk volledig verzoek bij ontvangst van een tijdstempel.
      Deze netbeheerder gebruikt dit tijdstempel bij afschakelbare transportcapaciteit in voorkomende gevallen voor
      het bepalen van de afschakelvolgorde. Een volledig verzoek vermeldt in ieder geval het capaciteitsproduct, indien
      relevant het entrypunt of exitpunt, de identiteit van de geïnteresseerde, alsmede, indien relevant, de indicatie of
      deze ook afschakelbare transportcapaciteit accepteert.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.6
  - number: 5.1.7
    text: |-
      De netbeheerder van het landelijk gastransportnet kan met het oog op ingrijpende veranderingen in de gasmarkt
      tijdelijk voor bepaalde categorieën marktpartijen afwijken van de in [5.1][ref1] neergelegde regels. Zo heeft
      de netbeheerder van het landelijk gastransportnet in het verleden overgangsregelingen zoals leerjaren toegepast,
      teneinde de markt de mogelijkheid te geven te anticiperen op de veranderingen in de gasmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.1
    text: |-
      Vanaf het moment dat de netbeheerder van het landelijk gastransportnet op basis van [3.3][ref1] de erkenning van
      een erkende programmaverantwoordelijke intrekt of een transportovereenkomst beëindigt, heeft deze netbeheerder geen
      verplichting meer tot het uitvoeren van transport ten behoeve van deze partij c.q. met betrekking tot de beëindigde
      transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '6.1'
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert alle partijen die door een onderbreking van het
      landelijk gastransport worden getroffen zo spoedig mogelijk omtrent aard, omvang en duur van de onderbreking.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel6.1
  - number: '6.2'
    text: |-
      De netbeheerder van het landelijk gastransportnet verstrekt op zijn website informatie over dreigende schaarste in
      het gastransportnet. Deze informatie wordt maandelijks geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel6.2
  - number: '6.3'
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert op zijn website ten minste de volgende gegevens
      (behoudens de gegevens die op grond van [artikel 37 van de Gaswet][ref1] geheim moeten worden gehouden):

      a. een opsomming en beschrijving van alle entrypunten en exitpunten;

      b. een opsomming van alle in het tariefsysteem gehanteerde entrypunten en exitpunten; en

      c. van de entrypunten en exitpunten die op de Nederlandse grens liggen:










