  - number: 4.1.4.5
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet geconfronteerd wordt met onverwachte grote storingen,
      waaronder ook wordt begrepen een storing in de tot het landelijk gastransportnet behorende ondersteunende
      communicatie en besturingssystemen, waarbij de systeemintegriteit in het geding komt of kan komen, kan de
      netbeheerder van het landelijk gastransportnet een noodsituatie uitroepen en handelen zoals beschreven in
      [4.1.4.4][ref1]. Bij de afwikkeling van een dergelijke noodsituatie zal een eventueel verschil tussen de
      hoeveelheid entrygas en de hoeveelheid exitgas onder aftrek van het verschil tussen entry- en exitgas op basis van
      [4.1.1.2][ref2] verrekend worden tegen de neutrale gasprijs als bedoeld in [4.1.6.4][ref3]. Indien de netbeheerder
      van het landelijk gastransportnet in deze situatie een WDM-transactie aangaat, dan ontstaat er een saldo door
      het prijsverschil tussen de neutrale gasprijs als bedoeld in 4.1.6.4 en de WDM-transactieprijs. Dit saldo wordt
      verrekend conform [4.1.5.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.4
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.1.2
