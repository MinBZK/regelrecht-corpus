  - number: 2.1.2f
    text: |-
      De netbeheerder van het landelijk gastransportnet publiceert de te hanteren fitfactor profielafnemers, de
      fitfactor telemetriegrootverbruikers, de referentietemperaturen, de profielfracties voor profielafnemers en de
      profielfactoren telemetriegrootverbruik op zijn website.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.2f
  - number: 2.1.2g
    text: |-
      Voor profielafnemers achter een niet OV-exitpunt reserveert de netbeheerder van het landelijk gastransportnet
      voldoende exitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel2.1.2g
  - number: 2.1.2h
    text: |-
      Op entry- en exitpunten die op dezelfde locatie liggen, biedt de netbeheerder van het landelijk gastransportnet,
      naast de entry- en exitcapaciteit beschreven in [2.1.2][ref1], ook wheelingcapaciteit aan. Gecontracteerde
      wheelingcapaciteit geeft het recht om op een entrypunt een hoeveelheid gas per uur in het landelijk gastransportnet
      in te voeden en op een op dezelfde locatie gelegen exitpunt weer aan het landelijk gastransportnet te onttrekken
      tegen een gereduceerd entry- en exittarief. De hoeveelheid in een uur in te voeden gas dient gelijk te zijn aan de
      hoeveelheid te onttrekken gas in hetzelfde uur. De gecontracteerde wheelingcapaciteit wordt door de netbeheerder
      van het landelijk gastransportnet geregistreerd in een separaat portfolio.

      Wheelingcapaciteit wordt gecontracteerd en aan erkende programmaverantwoordelijken toegewezen volgens het first
      come first served principe. Wheelingcapaciteit kan vanaf 1 januari 2014 niet worden gecontracteerd tussen een
      binnenlands entry- of exitpunt en een interconnectiepunt. Wheelingcapaciteit die is gecontracteerd voor 1 januari
      2014 zal worden gerespecteerd. De netbeheerder van het landelijk gastransportnet biedt wheelingcapaciteit slechts
      aan indien de aangeboden wheelingcapaciteit niet van invloed is op de aangeboden entry- en exitcapaciteit als
      bedoeld in [artikel 2.1.2][ref2]. Wheelingcapaciteit wordt onderscheiden in dezelfde capaciteitsproducten als
      entry- en exitcapaciteit als bedoeld in 2.1.2. De combinatie van entry- en exitpunten waarvoor wheelingcapaciteit
      wordt aangeboden wordt door de netbeheerder van het landelijk gastransportnet op zijn website gepubliceerd.

      Wheelingcapaciteit kan door de netbeheerder van het landelijk gastransportnet als afschakelbare capaciteit
      worden aangeboden. Gecontracteerde afschakelbare wheelingcapaciteit geeft het voorwaardelijke recht om op een
      entrypunt een hoeveelheid gas per uur in het landelijk gastransportnet te voeden en dit gas op een op dezelfde
      locatie gelegen exitpunt weer aan het landelijk gastransportnet te onttrekken. De hoeveelheid in een uur in te
      voeden gas dient gelijk te zijn aan de hoeveelheid te onttrekken gas in hetzelfde uur. De netbeheerder van het
      landelijk gastransportnet biedt afschakelbare wheelingcapaciteit slechts aan indien vaste wheelingcapaciteit
      niet meer beschikbaar is. Van afschakelbare wheelingcapaciteit kan uitsluitend gebruik worden gemaakt indien
      de netgebruikers van het landelijk gastransportnet die op het betreffende entrypunt en exitpunt beschikken over
      vaste entrycapaciteit, vaste exitcapaciteit of vaste wheelingcapaciteit, eerder gecontracteerde afschakelbare
      entrycapaciteit respectievelijk eerder gecontracteerde afschakelbare exitcapaciteit of eerder gecontracteerde
      afschakelbare wheelingcapaciteit, niet (volledig) van hun entrycapaciteit, exitcapaciteit of wheelingcapaciteit
      gebruik maken. Indien niet aan deze voorwaarde wordt voldaan, kan de netgebruiker (deels) worden afgeschakeld. Het
      afschakelen zal worden uitgevoerd in de volgorde van de volgens [5.1.6][ref3] vastgelegde tijdstempels.

      Naar mate er bestaande vaste wheelingcapaciteit beschikbaar komt, zal de netbeheerder van het landelijk
      gastransportnet op binnenlandse entry- en exitpunten onverwijld, met in achtneming van [2.1.12][ref4], de
      gecontracteerde afschakelbare wheelingcapaciteit opwaarderen naar vaste wheelingcapaciteit. Het opwaarderen zal
      worden uitgevoerd in de volgorde van de volgens [5.1.6][ref5] vastgelegde tijdstempels.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0037950#Artikel5.1.6
      [ref4]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.12
      [ref5]: https://wetten.overheid.nl/BWBR0037950#Artikel5.1.6
