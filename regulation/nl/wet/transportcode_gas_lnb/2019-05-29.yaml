  - number: 4.1.4.2
    text: |-
      De hoeveelheid gas die de netbeheerder van het landelijk gastransportnet koopt conform [4.1.4.1][ref1] verkoopt de
      netbeheerder van het landelijk gastransportnet in het uur van levering of afname tegen de WDM-transactieprijs aan
      de onbalans veroorzakende programmaverantwoordelijke(n) naar rato van de waarde van hun portfolio onbalans signaal
      die betrekking heeft op het begin van het uur van de WDM-transactie. Dit heeft invloed op het portfolio onbalans
      signaal in het uur van levering of afname van dit gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4.1.4.1
    url: https://wetten.overheid.nl/BWBR0037950/2019-05-29#Artikel4.1.4.2
    references:
