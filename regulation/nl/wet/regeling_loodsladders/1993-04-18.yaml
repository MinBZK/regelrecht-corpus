  - number: '2'
    text: |-
      De schipper is verplicht ervoor zorg te dragen dat:

      a. aan boord een loodsladder aanwezig is die schoon is en in goede staat wordt gehouden;

      b. de loodsladder te allen tijde voldoet aan het bepaalde in de onderdelen 1, 2, 3, 4, 5 en 6 van bijlage II;

      c. aan boord voorzieningen als bedoeld in de onderdelen 7, 8, 9, 10 en 11 van de bijlage II worden getroffen om
      bevoegde opsporingsambtenaren veilig en gemakkelijk aan en van boord te doen gaan.
    url: https://wetten.overheid.nl/BWBR0005951/1993-04-18#Artikel2
  - number: '3'
    text: |-
      De schipper is op eerste vordering van een bevoegd opsporingsambtenaar verplicht:

      a. te stoppen, te manoeuvreren of andere handelingen te verrichten om het betreden van het te inspecteren vaartuig
      mogelijk te maken;

      b. communicatie-apparatuur en de communicatie-officier van het te inspecteren vaartuig ten behoeve van het
      verzenden en ontvangen van berichten in verband met de inspectie ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005951/1993-04-18#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005951/1993-04-18#Artikel4
  - number: '5'
    text: |-
      Deze regeling kan worden aangehaald als de Regeling loodsladders.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005951/1993-04-18#Artikel5
