articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            bevoegd opsporingsambtenaar:

              ambtenaar belast met de opsporing van overtredingen van de voorschriften gegeven bij of krachtens de
      [artikelen 3][ref1], [3a][ref2], [4][ref3], [5][ref4] en [9 van de Visserijwet 1963][ref5];



            b
            buitenlands vissersvaartuig:

              een vissersvaartuig dat de vlag voert van, of geregistreerd is in, een andere Lid-Staat van de Europese
      Gemeenschap dan Nederland;



            c
            schipper:

              elke gezagvoerder van een vissersvaartuig onderscheidenlijk buitenlands vissersvaartuig of degene die de
      schipper vervangt;



            d
            verordening:

              [verordening (EEG) nr. 1382/87](31987R1382) van de Commissie van de Europese Gemeenschappen van 20 mei 1987
      tot vaststelling van uitvoeringsbepalingen voor de inspectie van vissersvaartuigen (PbEG L 132);



            e
            bijlage II:

              bijlage II bij de verordening.


