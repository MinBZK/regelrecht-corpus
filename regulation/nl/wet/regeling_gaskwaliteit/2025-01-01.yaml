articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *calorische bovenwaarde:* de hoeveelheid energie, uitgedrukt in megajoule (MJ), afgerond op drie cijfers
      achter de komma, die vrijkomt bij de volledige verbranding van 1 m3(n) gas in lucht, wanneer de na de verbranding
      aanwezige componenten tot de uitgangscondities van temperatuur en druk worden teruggebracht, zijnde 298,15 K
      en een absolute druk van 101,325 kPa (1,01325 bar) en waarbij de bij de verbranding gevormde waterdamp wordt
      gecondenseerd;
        - *daggemiddeld:* waarde die gelijk is aan het voortschrijdende gemiddelde van alle meetwaarden in de voorgaande
      24 uren;
        - *G-gas:* gas van een kwaliteit als bedoeld in [bijlage 2][ref1] of [4][ref2];
        - *H-gas:* gas van een kwaliteit als bedoeld in [bijlage 1][ref3], [3][ref4] of [5][ref5];
        - *hogere koolwaterstoffen:* koolwaterstoffen met meer dan één koolstofatoom per molecuul;
        - *HTL-net:* gastransportnet dat wordt beheerd door de netbeheerder van het landelijk gastransportnet met een
      operationele absolute druk van circa 45 bar of hoger;
        - *L-gas:* gas van een kwaliteit als bedoeld in [bijlage 5][ref6], bestemd voor export;
        - *m3(n):* hoeveelheid gas die bij een temperatuur van 273,15 K en een druk van 101,325 kPa een volume inneemt van
      één m3;
        - *propaanequivalent:* eenheid van het gehalte aan hogere koolwaterstoffen in gas, berekend als de som van de
      aandelen in mol% van de hogere koolwaterstoffen in gas, waarbij iedere hogere koolwaterstof een wegingsfactor
      krijgt van het aantal koolstofatomen in de betreffende hogere koolwaterstof minus één, gedeeld door twee;
        - *relatieve dichtheid:* de dichtheid van een gas gedeeld door de dichtheid van droge lucht van de
      standaardsamenstelling bij normale condities, te weten een temperatuur van 273,15 K en een druk van 101,325 kPa;
        - *RNB-net:* gastransportnet dat niet wordt beheerd door de netbeheerder van het landelijke gastransportnet;
        - *RTL-net:* gastransportnet dat wordt beheerd door de netbeheerder van het landelijk gastransportnet met een
      operationele absolute druk van 40,5 bar of lager;
        - *Wobbe-index:* de calorische bovenwaarde gedeeld door de vierkantswortel van de relatieve dichtheid.


