  - number: '2'
    text: |-
      1 H-gas voldoet bij invoeding op een aansluiting aan de in [bijlage 1][ref1] bij deze regeling opgenomen waarden.

      2 G-gas voldoet bij invoeding op een aansluiting aan de in [bijlage 2][ref2] bij deze regeling opgenomen waarden.

      3 H-gas voldoet bij aflevering op een aansluiting aan de in [bijlage 3][ref3] bij deze regeling opgenomen waarden.

      4 G-gas voldoet bij aflevering op een aansluiting aan de in [bijlage 4][ref4] bij deze regeling opgenomen waarden.

      5 H-gas en L-gas dat op een grenspunt via het landelijk gastransportnet wordt ingevoerd of uitgevoerd, voldoet op
      dat grenspunt aan de in [bijlage 5][ref5] bij deze regeling opgenomen waarden.

      6 Gas dat op het gastransportnet wordt ingevoed of het gastransportnet verlaat is H-gas, G-gas of L-gas.


