---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_pdv_diervoeders_2003
regulatory_layer: WET
publication_date: '2014-12-24'
valid_from: '2004-08-15'
bwb_id: BWBR0014962
url: https://wetten.overheid.nl/BWBR0014962/2004-08-15
preamble:
  text: |-
    Gelet op de artikelen 93 en 96 van de Wet op de Bedrijfsorganisatie, de artikelen 2, 3 en 4 van de
    Instellingsverordening akkerbouwproductschappen 1997, artikel 20, tweede lid van het Besluit gemedicineerd voeder,
    artikel 4 van het Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke dierziekten;

    In aanmerking nemende Richtlijn 70/524/EEG, Richtlijn 79/373/EEG, Richtlijn 80/511/EEG, Richtlijn 82/471/EEG,
    Richtlijn 92/117/EEG, Richtlijn 93/74/ EEG, Richtlijn 95/69/EG, Richtlijn 96/25/EG en Richtlijn 1999/29/EG;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#ArtikelAanhef
articles:
  - number: 1:1
    text: 'Deze verordening verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.1
    text: 'productschap: Productschap Diervoeder;'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.2
    text: 'voorzitter: voorzitter van het productschap'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.3
    text: 'secretaris: secretaris van het productschap'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.4
    text: 'ondernemer: degene die een onderneming drijft waarvoor het productschap is ingesteld;'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.5
    text: |-
      producten die bedoeld zijn voor het voederen van dieren: voedermiddelen, voormengsels, toevoegingsmiddelen,
      diervoeders en alle andere producten die bedoeld zijn om te worden gebruikt of gebruikt worden voor het voederen
      van dieren;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.6
    text: |-
      in het verkeer brengen (“verkeer”): het in het bezit hebben van producten die bedoeld zijn voor het voederen van
      dieren, met het oog op de verkoop, met inbegrip van het aanbieden, of enige andere vorm van al dan niet gratis
      overdracht ervan aan derden, alsmede de verkoop en de andere vormen van overdracht zelf;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.7
    text: 'persoon die verantwoordelijk is voor het in het verkeer brengen van toevoegingsmiddelen:'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1
    text: |-
      de natuurlijke of rechtspersoon die de verantwoordelijkheid draagt voor de conformiteit van het toevoegingsmiddel
      waarvoor een communautaire vergunning is afgegeven, en het in het verkeer brengen daarvan;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.8
    text: 'invoer: het via Nederland binnenbrengen van producten uit derde landen op het douanegebied van de Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.9
    text: 'uitvoer: het brengen van producten buiten het douanegebied van de Gemeenschap via Nederland;'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.10
    text: |-
      diervoeders: producten van plantaardige of dierlijke oorsprong in natuurlijke staat, vers of verduurzaamd en de
      afgeleide producten van hun industriële verwerking, alsmede organische en anorganische stoffen, al dan niet in de
      vorm van een mengsel, met of zonder toevoegingsmiddelen en bestemd voor dierlijke voeding langs orale weg;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.11
    text: |-
      voedermiddelen: producten van plantaardige of dierlijke oorsprong in natuurlijke staat, vers of verduurzaamd, de
      afgeleide producten van de industriële verwerking ervan, alsmede organische of anorganische stoffen, met of zonder
      toevoegingsmiddelen, bestemd om te worden gebruikt voor vervoedering, hetzij als zodanig, hetzij na bewerking, voor
      de bereiding van mengvoeders of als dragers bij voormengsels;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.12
    text: |-
      bijzondere stikstofhoudende producten: producten die volgens bepaalde technische procédés worden vervaardigd
      met het oog op hun directe of indirecte eiwitvoorziening in de diervoeding behorende tot de groepen: - eiwitten,
      verkregen uit micro-organismen
        - eiwitvrije stikstofverbindingen
        - aminozuren en zouten daarvan
        - hydroxyanalogen van aminozuren; voor zover niet vallend onder [Verordening (EG) nr. 1829/2003](32003R1829)
      van het Europees Parlement en de Raad van 22 september 2003 inzake genetisch gemodificeerde levensmiddelen en
      diervoeders.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.13
    text: |-
      toevoegingsmiddelen: 'stoffen of preparaten die in diervoeding worden gebruikt teneinde: - de eigenschappen van de'
      diervoeders voor dieren of van de dierlijke producten gunstig te beïnvloeden, of
        - te voldoen aan de voedingsbehoeften van de dieren, of de dierlijke productie te verbeteren, door in te werken op
      de maag- en darmflora of op de verteerbaarheid van de diervoeders, of
        - aan de voeding elementen toe te voegen die het makkelijker maken om bijzondere voedingsdoelen te bereiken of
      tegemoet te komen aan specifieke tijdelijke behoeften inzake voeding bij de dieren, of
        - door dierlijke uitwerpselen veroorzaakte hinder te voorkomen of te beperken, of de leefomgeving van de dieren
      te verbeteren;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14
    text: |-
      groepen toevoegingsmiddelen: de groepen toevoegingsmiddelen op de lijst van de Europese Commissie in het kader van
      [Richtlijn 70/524/EEG](31970L0524), zijnde:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.A
    text: Antibiotica
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.B
    text: Oxydatie tegengaande stoffen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.C
    text: Oxydatie tegengaande stoffen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.D
    text: Aromatische en eetlust opwekkende stoffen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.E
    text: Coccidiostatica en andere geneeskrachtige stoffen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.F
    text: Emulgatoren, stabilisatoren, verdikkingsmiddelen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.G
    text: Kleurstoffen met inbegrip van pigmenten
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.H
    text: Conserveermiddelen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.I
    text: Vitaminen, provitaminen en stoffen met een gelijkwaardige werking
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.J
    text: Spoorelementen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.K
    text: Groeibevorderende stoffen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.L
    text: Bindmiddelen, verdunningsmiddelen en stollingsmiddelen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.M
    text: Zuurteregelaars
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.N
    text: Enzymen
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.O
    text: Micro-organismen (voorzover kolonievormend)
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.14.P
    text: Stoffen die complexen vormen met radio-nucliden
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.15
    text: |-
      voormengsels: mengsels van toevoegingsmiddelen onderling of mengsels van een of meer toevoegingsmiddelen met
      stoffen die dragers vormen, die als zodanig bestemd zijn voor de rechtstreekse verwerking in die moeders, alsmede
      halffabrikaten als bedoeld in het [Besluit uitzonderingen registratieregime diergeneesmiddelen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003929
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003929
  - number: 1:1.16
    text: |-
      mengvoeders: mengsels van voedermiddelen, met of zonder toevoegingsmiddelen, bestemd voor vervoedering in de vorm
      van volledige diervoeders of aanvullende diervoeders;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.17
    text: |-
      volledige diervoeders: mengsels van diervoeders die door hun samenstelling op zichzelf een totaal dagrantsoen
      vormen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.18
    text: |-
      aanvullende diervoeders: mengvoeders die een hoog gehalte aan bepaalde stoffen bevatten en door hun samenstelling
      slechts samen met andere diervoeders een totaal dagrantsoen vormen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.19
    text: |-
      mineraalmengsels: aanvullende diervoeders die hoofdzakelijk bestaan uit mineralen en die, herleid tot 12% vocht,
      tenminste 40% as bevatten;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.20
    text: |-
      kunstmelkvoeders: aanvullende of volledige diervoeders die in droge staat of na oplossing in een bepaalde
      hoeveelheid vloeistof kunnen dienen voor de voeding van jonge dieren in aanvulling op of in plaats van de
      postcolostrale melk of voor de voeding van vleeskalveren;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.21
    text: |-
      melassevoeders: aanvullende diervoeders die zijn bereid uit melasse en die, herleid tot 12% vocht, tenminste 14%
      totaal suiker, uitgedrukt in saccharose, bevatten;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.22
    text: |-
      dieetvoeders: aanvullende of volledige diervoeders die zich op grond van hun bijzondere samenstelling of het
      bijzondere bij hun vervaardiging toegepaste procédé, duidelijk onderscheiden van zowel gewone diervoeders als van
      gemedicineerde voeders en die geschikt zijn voor een bijzonder voedingsdoel en als zodanig in het verkeer worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.23
    text: |-
      bijzonder voedingsdoel: het voldoen aan specifieke voedingsbehoeften van bepaalde categorieën dieren waarvan het
      spijsvertering- of het absorptiemechanisme dan wel het metabolisme verstoord dreigt te worden dan wel tijdelijk
      of onherstelbaar verstoord is, welke dieren bijgevolg baat kunnen hebben bij de opneming van aan hun toestand
      aangepast voeder;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.24
    text: |-
      ongewenste stoffen: alle stoffen en producten, met uitzondering van ziekteverwekkers, die aanwezig zijn in of op
      het product dat is bedoeld voor het voederen van dieren en die een potentieel gevaar opleveren voor de gezondheid
      van mens en dier of voor het milieu of die de dierlijke productie ongunstig kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.25
    text: |-
      dieren: dieren behorend tot de soorten die gewoonlijk door de mens worden gevoederd en gehouden of gegeten, alsmede
      in de vrije natuur levende dieren voorzover hun voeding deels uit diervoeders bestaat;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.26
    text: |-
      gezelschapsdieren: dieren behorend tot de soorten die normaal door de mens worden gehouden en gevoederd, maar niet
      gegeten, met uitzondering van dieren die dienen voor de productie van pelzen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.27
    text: |-
      dagrantsoen: de totale hoeveelheid diervoeder, omgerekend naar een vochtgehalte van 12%, welke een dier van
      een bepaalde soort, leeftijdsklasse en prestatievermogen gemiddeld dagelijks nodig heeft om volledig in zijn
      voederbehoefte te voorzien;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.28
    text: 'Lidstaat: land, dat lid is van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.29
    text: 'derde land: land, dat geen Lidstaat is.'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 1:1.30
    text: 'EER: Europese Economische Ruimte, bestaande uit de Lidstaten, Lichtenstein, Noorwegen, IJsland en Zwitserland.'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel11
  - number: 3:2.1
    text: |-
      De ondernemer is verplicht, bij het in het verkeer brengen van voedermiddelen de volgende gegevens goed zichtbaar,
      duidelijk leesbaar en onuitwisbaar op of aan de buitenzijde van de verpakking of recipiënt aan te brengen, of op
      het begeleidend document te vermelden:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.a
    text: het woord "voedermiddel";
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.b
    text: de benaming van het voedermiddel;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.c
    text: |-
      voorzover van toepassing, de verplichte vermeldingen aan gehalten volgens Bijlage II, deel B (zijnde de niet-
      exclusieve lijst van de belangrijkste voedermiddelen), vierde kolom;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.d
    text: voorzover van toepassing, de verplichte vermeldingen aan gehalten volgens Bijlage II, deel C, tweede kolom;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.e
    text: voorzover van toepassing, de verplichte vermeldingen volgens Bijlage II, deel A;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.f
    text: |-
      de nettohoeveelheid, uitgedrukt in kilogrammen voor vaste voedermiddelen en in liters of kilogrammen voor vloeibare
      voedermiddelen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.g
    text: |-
      de naam of handelsnaam, het adres of de zetel van het bedrijf, het erkenningsnummer, alsmede het referentienummer
      van de partij of elke andere vermelding aan de hand waarvan het voedermiddel getraceerd kan worden, wanneer het
      productiebedrijf erkend moet worden overeenkomstig: - [Richtlijn 90/667/EEG](31990L0667),
        - andere communautaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.1.h
    text: |-
      wanneer het niet gaat om de onder g. bedoelde producent, de naam of handelsnaam en het adres of de zetel van de
      ondernemer die verantwoordelijk is voor de in dit hoofdstuk bedoelde vermeldingen. Als verantwoordelijke kan worden
      opgevat: producent, verpakker, importeur, verkoper of distributeur, al naar gelang hoe de afspraken tussen partijen
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.2
    text: |-
      Andere gegevens mogen eventueel op de verpakking, het etiket, de label of het begeleidend document worden vermeld,
      mits ze:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.2.a
    text: betrekking hebben op objectieve of meetbare elementen, die kunnen worden bewezen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.2.b
    text: de koper niet kunnen misleiden;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.2.c
    text: duidelijk gescheiden vermeld worden van de in het eerste lid bedoelde gegevens;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.3
    text: |-
      De in deel B van Bijlage II opgenomen voedermiddelen mogen slechts in het verkeer worden gebracht onder de daarin
      vermelde benaming en indien ze voldoen aan de daarin opgenomen omschrijving.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.4
    text: |-
      Andere voedermiddelen dan bedoeld in het derde lid mogen slechts in het verkeer worden gebracht onder andere
      benamingen dan in het derde lid bedoeld, die de koper niet kunnen misleiden over de werkelijke aard van het
      product.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.5
    text: |-
      In afwijking van het eerste en tweede lid mogen de daar bedoelde gegevens, bij hoeveelheden van 10 kg of minder,
      bestemd voor de eindgebruiker, op de plaats van verkoop onder de aandacht van de koper worden gebracht.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.6
    text: |-
      Indien een partij tijdens het verkeer in deelpartijen wordt opgesplitst, moeten de in het eerste lid bedoelde
      gegevens, overeenkomstig het eerste lid voor iedere deelpartij worden vermeld op de verpakking, de recipiënt, het
      etiket of het begeleidend document.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 3:2.7
    text: |-
      Indien de samenstelling van een voedermiddel tijdens het verkeer verandert, moeten de in het eerste lid bedoelde
      gegevens dienovereenkomstig worden gewijzigd onder de verantwoordelijkheid van de persoon die de nieuwe gegevens
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel32
  - number: 5:1:1.1
    text: |-
      Het is de ondernemer verboden toevoegingsmiddelen in het verkeer te brengen waarvoor niet overeenkomstig [Richtlijn
      70/524](31970L0524)/ EEG door de Europese Commissie een toelatingsvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel511
  - number: 5:1:1.2
    text: |-
      Vergunningen als bedoeld in het eerste lid worden door de ondernemer in Nederland aangevraagd bij het productschap
      en gaan vergezeld van een dossier, dat is samengesteld overeenkomstig het bepaalde in [Richtlijn 87/153/
      EEG](31987L0153) van de Raad van 16 februari 1987 tot vaststelling van richtsnoeren voor de beoordeling van
      toevoegingsmiddelen in diervoeding,
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel511
  - number: 5:1:1.3
    text: De procedure van aanvraag, behandeling en verlening van de vergunning geschiedt volgens de procedure in Bijlage IV.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel511
  - number: 5:1:1.4
    text: |-
      Bij aanvraag van een vergunning als bedoeld in het tweede lid is de ondernemer aan het productschap een retributie
      verschuldigd. De hoogte van de retributie wordt vastgesteld bij [Verordening PDV retributie diervoedersector 2003]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel511
  - number: 7:3:1.1
    text: |-
      De ondernemer is verplicht, bij het in het verkeer brengen van mengvoeders tezamen met de aanduidingen
      voortvloeiende uit het bepaalde in paragraaf van deze verordening, de volgende aanduidingen op of aan de
      buitenzijde van de verpakking of de recipiënt aan te brengen, of ingeval de mengvoeders in los gestorte vorm in het
      verkeer worden gebracht op een begeleidend document te vermelden:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.a
    text: |-
      de naam en de vestigingsplaats van het hoofdkantoor van de ondernemer die verantwoordelijk is voor de in dit
      hoofdstuk bedoelde vermeldingen; als verantwoordelijke kunnen warden opgevat: fabrikant, verpakker, importeur,
      verkoper of dealer, al naar gelang hoe de afspraken tussen deze partijen warden gemaakt;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.b
    text: |-
      de benaming "volledig diervoeder", "aanvullend diervoeder", "mineraalmengsel", "melassevoeder", "volledig
      kunstmelkvoeder", "aanvullend kunstmelkvoeder", "volledig dieetvoeder", "aanvullend dieetvoeder", "mineraal
      dieetvoeder" al naar gelang het geval;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.c
    text: |-
      de diersoort of categorie dieren waarvoor het mengvoeder bestemd is, met dien verstande dat het is toegestaan de
      aanduiding ingevolge het bepaalde onder b. in combinatie met de diersoort te gebruiken;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.d
    text: |-
      de gebruiksaanwijzing die de nauwkeurige bestemming van het mengvoeder aangeeft en een passend gebruik daarvan
      mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.e
    text: in voorkomend geval de vermeldingen inzake de analytische bestanddelen in de gevallen genoemd in de leden 3 en 4;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.f
    text: |-
      voor alle mengvoeders met uitzondering van die bestemd voor andere gezelschapsdieren dan honden en katten: de
      verwerkte voedermiddelen, aangeduid overeenkomstig artikel 7:3:2 te vermelden voedermiddelen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.g
    text: |-
      naar gelang van de gevallen, de vermeldingen genoemd in kolom 2, bij combinatie van de kolommen 1 en 3 van bijlage
      V;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.h
    text: |-
      het nettogewicht in kilogrammen of grammen dan wel voor vloeibare producten, het nettovolume in liters, centiliters
      of milliliters; de aanduidingen dienen te worden weergegeven in cijfers, gevolgd door de naam of het symbool van
      de meeteenheid;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.i
    text: de datum van minimumhoudbaarheid, aangegeven overeenkomstig artikel 7:3:3, eerste lid;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.j
    text: het referentienummer van de partij;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.k
    text: het erkennings- of registratienummer van de fabrikant, als bedoeld in artikel 2:3, derde lid;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.1.l
    text: |-
      in geval van andere mengvoeders dan die voor gezelschapsdieren, de vermelding "het exacte gewichtspercentage van
      de voedermiddelen voor diervoeder waaruit dit voeder is samengesteld, kan worden verkregen bij: ...." (vermelding
      van de naam of handelsnaam, het adres of hoofdkantoor tezamen met het telefoonnummer en het emailadres van diegene
      die verantwoordelijk is voor de in dit lid bedoelde vermeldingen). Deze informatie wordt verstrekt op verzoek van
      de klant.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.2
    text: 'Het vochtgehalte van het mengvoeder moet worden aangegeven als het hoger is dan:'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.2.a
    text: 7% in kunstmelkvoeders en in andere mengvoeders met een gehalte aan melkproducten van meer dan 40%;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.2.b
    text: 5% in mineraalmengsels zonder organische bestanddelen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.2.c
    text: 10% in mineraalmengsels met organische bestanddelen;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.2.d
    text: 14% in de andere mengvoeders.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.3
    text: 'In afwijking van artikel 7:1:2, derde lid onder b mag het gehalte van 2,2% overschreden worden bij:'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.3.a
    text: mengvoeders die toegestane minerale bindmiddelen bevatten,
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.3.b
    text: mineraalmengsels,
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.3.c
    text: mengvoeders, die voor meer dan 50% uit snijdsels of pulp van suikerbieten bestaan,
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.3.d
    text: |-
      mengvoeders voor gekweekte vissen, met een gehalte aan vismeel van meer dan 15%, indien dit gehalte op het etiket
      af een begeleidend document wordt vermeld in een percentage dat is uitgedrukt ten opzichte van het mengvoeder als
      zodanig.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4
    text: |-
      Het is de ondernemer toegestaan, tezamen met de in het eerste lid voorgeschreven aanduidingen, slechts de volgende
      aanvullende aanduidingen in een daarvoor bestemd kader op of aan de buitenzijde van de verpakking aan te brengen,
      of ingeval de mengvoeders in los gestorte vorm in het verkeer worden gebracht op een begeleidend document te
      vermelden:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.a
    text: het kenmerk of het handelskenmerk van degene die overeenkomstig het eerste lid onder a is vermeld;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.b
    text: de naam van het land van productie of fabricage;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.c
    text: de prijs van het product;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.d
    text: de handelsbenaming of het handelsmerk van het product;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.e
    text: de fabricagedatum, aangegeven overeenkomstig artikel 7:3:3, derde lid;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.f
    text: |-
      een vermelding betreffende de toestand waarin het mengvoeder zich bevindt of de bijzondere behandeling die het
      heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.g
    text: in voorkomend geval de vermeldingen inzake de analytische bestanddelen in de gevallen genoemd in lid 3 en 4;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.h
    text: de vermeldingen genoemd in kolom 2, bij combinatie van de kolommen 1 en 4 van bijlage V;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:1.4.i
    text: |-
      de naam van de bereider en de plaats van vestiging van de bedrijfseenheid waarin het mengvoeder is bereid, indien
      de bereider niet verantwoordelijk is voor de in dit artikel bedoelde aanduidingen.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel731
  - number: 7:3:2.1
    text: |-
      De ondernemer is verplicht bij het in het verkeer brengen van mengvoeders bestemd voor andere dieren dan
      gezelschapsdieren, bij de vermelding van voedermiddelen het volgende in acht te nemen:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
  - number: 7:3:2.1.a
    text: |-
      opsomming van de voedermiddelen met specifieke naam als opgenomen in [Bijlage II][ref1] met vermelding, in
      afnemende volgorde van belangrijkheid, van de gewichtspercentages die in de mengvoeders voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0014962
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0014962
  - number: 7:3:2.1.b
    text: voor deze gewichtspercentages wordt een marge van +/- 15% van de aangegeven waarde getolereerd.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
  - number: 7:3:2.2
    text: |-
      De ondernemer is verplicht bij het in het verkeer brengen van mengvoeders bestemd voor gezelschapsdieren het
      volgende in acht te nemen:
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
  - number: 7:3:2.2.a
    text: |-
      vermelding van de specifieke naam van alle voedermiddelen als opgenomen in [Bijlage II][ref1], hetzij onder opgave
      van het gehalte, hetzij in afnemende volgorde van belangrijkheid van hun gewichtspercentages, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0014962
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0014962
  - number: 7:3:2.2.b
    text: |-
      vermelding van de categorieën, genoemd in [bijlage VI][ref1], waartoe de betreffende voedermiddelen behoren, hetzij
      onder opgave van het gehalte hetzij in afnemende volgorde van belangrijkheid van hun gewichtspercentages. Indien
      van deze mogelijkheid gebruik wordt gemaakt. mag geen enkel voedermiddel worden vermeld behalve in de gevallen
      bedoeld in het vierde en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014962
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0014962
  - number: 7:3:2.3
    text: |-
      In afwijking van het bepaalde in het tweede lid, mogen ten aanzien van dieetvoeders de voedermiddelen worden
      vermeld als categorieën als genoemd in [bijlage VI][ref1], zelfs wanneer de vermelding van bepaalde voedermiddelen
      met hun specifieke naam vereist is ter staving van de voedingskenmerken van het voeder.


      [ref1]: https://wetten.overheid.nl/BWBR0014962
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0014962
  - number: 7:3:2.4
    text: |-
      Wanneer een voedermiddel tot geen enkele van de in [bijlage VI][ref1] vermelde categorieën behoort, geschiedt
      vermelding van het voedermiddel door vermelding van de specifieke naam in de volgorde die wordt bepaald op basis
      van het gewichtspercentage van het voedermiddel ten opzichte van de categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0014962
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0014962
  - number: 7:3:2.5
    text: |-
      Het is de ondernemer toegestaan op de etikettering van mengvoeders voor gezelschapsdieren de aandacht te
      vestigen op de aanwezigheid van of op het lage gehalte aan een of meer voedermiddelen die voor de eigenschappen
      van dat voeder van wezenlijk belang zijn. In dat geval moet het minimum- of maximumgehalte uitgedrukt in
      gewichtspercentages van de gebruikte voedermiddel(en) duidelijk worden aangegeven naast de vermelding van de
      voedermiddelen of de categorieën ingevolge dit artikel.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
  - number: 7:3:2.6
    text: |-
      Het is de ondernemer toegestaan op de etikettering van dieetvoeders bestemd voor andere dieren dan
      gezelschapsdieren de aandacht te vestigen op de aanwezigheid van of op het lage gehalte aan een of meer
      voedermiddelen die voor de eigenschappen van dat voeder van wezenlijk belang zijn.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
  - number: 7:3:2.7
    text: |-
      Voor de toepassing van dit artikel worden niet als voedermiddel beschouwd toevoegingsmiddelen en bijzondere eiwit
      houdende producten als bedoeld in [hoofdstuk 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014962#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel732
    references:
      - id: ref1
        bwb_id: BWBR0014962
        hoofdstuk: '4'
  - number: 7:3:3.1
    text: |-
      De datum van minimale houdbaarheid bedoeld in artikel 7:3:1, eerste lid onder i wordt als volgt aangegeven: -
      "te gebruiken vóór" gevolgd door de datum (dag, maand en jaar) voor in microbiologisch opzicht zeer bederfelijke
      mengvoeders;
        - "bij voorkeur te gebruiken vóór" gevolgd door de datum (dag indien gewenst, maand en jaar) voor de andere
      mengvoeders.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel733
  - number: 7:3:3.2
    text: |-
      Ingeval op grond van andere wettelijke voorschriften een datum van minimum houdbaarheid of een uiterste datum
      van garantie moet worden vermeld, wordt alleen de vermelding overeenkomstig het eerste lid aangebracht, waarbij
      uitsluitend de datum in aanmerking wordt genomen die het eerst verstrijkt.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel733
  - number: 7:3:3.3
    text: |-
      De fabricagedatum bedoeld in artikel 7:3:1, vierde lid onder e wordt als volgt aangegeven: "Gefabriceerd ....
      (aantal dagen, maanden of jaren aangegeven) vóór de aangegeven datum van minimale houdbaarheid."
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel733
  - number: 7:3:4
    text: In afwijking van het bepaalde in artikel 7:3:1, eerste lid en artikel 7:3:2.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.a
    text: |-
      is het voor kleine hoeveelheden mengvoeders die rechtstreeks bestemd zijn voor de eindgebruiker voldoende dat de in
      deze leden bedoelde aanduidingen bij het verkooppunt door middel van een bij de betrokken mengvoeders aangebrachte
      duidelijk leesbare mededeling ter kennis van de koper worden gebracht;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.b
    text: |-
      zijn voor mengvoeders die ten hoogste uit drie voedermiddelen zijn samengesteld de aanduidingen ingevolge het
      eerste lid onder c. en in voorkomend geval onder d. van artikel 7:3:1, eerste lid niet vereist, indien duidelijk
      uit de benaming blijkt welke voedermiddelen zijn gebruikt;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.c
    text: |-
      is het voor verpakte mengvoeders toegestaan de aanduidingen als bedoeld in het eerste lid onder c. tot en met h.
      van artikel 7:3:1 aan te brengen op een bij de desbetreffende partij mengvoeder behorend begeleidend document;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.d
    text: |-
      zijn voor mengsels van hele zaden de in het eerste lid, onder e. en f. van artikel 7:3:1 bedoelde vermeldingen niet
      vereist; zij mogen echter wel worden aangegeven;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.e
    text: |-
      kunnen de benamingen "volledig diervoeder of "aanvullend diervoeder" voor diervoeder dat voor andere
      gezelschapsdieren dan honden en katten bestemd is, worden vervangen door de benaming "mengvoeder". In dat geval
      zijn de in deze verordening vereiste of toegestane vermeldingen de vermeldingen die, voor volledige diervoeders
      zijn voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.f
    text: |-
      mogen voor mengvoeders voor gezelschapsdieren de benamingen "mengvoeder", "aanvullende diervoeder" en "volledig
      diervoeder" worden vervangen door onderscheidenlijk de benamingen "samengesteld voeder", "aanvullend samengesteld
      voeder" en "volledig samengesteld voeder";
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 7:3:4.g
    text: |-
      mogen de aanduidingen als bedoeld in het eerste lid onder h tot en met k van artikel 7:3:1 buiten het in dat
      lid bedoelde kader worden aangebracht; in dat geval wordt naast deze aanduidingen aangegeven op welke plaats die
      gegevens zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel734
  - number: 8:4.1
    text: |-
      Het is de ondernemer verboden producten die bedoeld zijn voor het voederen van dieren, bij de bereiding van
      diervoeders te gebruiken, indien ze niet zuiver, niet deugdelijk en niet van gebruikelijke handelskwaliteit zijn
      en bij correct gebruik een gevaar kunnen opleveren voor de gezondheid van mens en dier of voor het milieu en de
      dierlijke productie ongunstig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel84
  - number: 8:4.2
    text: |-
      In het bijzonder worden producten die bedoeld zijn voor het voederen van dieren niet geacht zuiver, deugdelijk en
      van gebruikelijke handeiskwaliteit te zijn wanneer het gehalte aan ongewenste stoffen hoger is dan de in bijlage IX
      vastgestelde maximumgehalten.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel84
  - number: 8:4.3
    text: |-
      Het is de ondernemer verboden de materialen, genoemd in bijlage XI, in het verkeer te brengen of te gebruiken in
      diervoeders.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel84
  - number: 9:1
    text: |-
      Indien een ondernemer onderzoek heeft laten uitvoeren naar de aanwezigheid van Salmonella in door de ondernemer
      zelf genomen monsters van pluimveevoeders, stelt hij het productschap onverwijld na het bekend worden van het
      resultaat hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel91
  - number: 9:2.1
    text: |-
      De ingevolge [artikel 11:5][ref1] aangewezen controle instantie neemt bij de bereiders van mengvoeders voor
      pluimveemonsters, ter controle op de aanwezigheid van Salmonella.


      [ref1]: https://wetten.overheid.nl/BWBR0014962#Artikel11
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0014962
        artikel: '11'
        hoofdstuk: '11'
  - number: 9:2.2
    text: |-
      Indien in de in het eerste lid bedoelde monsters Salmonella wordt aangetoond neemt de bereide van mengvoeders
      voor pluimvee de volgende maatregelen: zowel in het geval waarin de ondernemer is erkend ingevolge het [Besluit
      PDV erkenningsregeling GMP diervoedersector 2003](onbekend) als in het geval waarin de ondernemer niet GMP-erkend
      is, de acties en maatregelen als bedoeld in [paragraaf 4.13 en 4.14 van de Algemene GMP-code diervoedersector]
      (onbekend) en van de Aanvullende GMP-code Handel en Productie Mengvoeders, van genoemd besluit alsmede de acties
      en maatregelen als bedoeld in [artikel 3 sub d), laatste alinea van het Besluit Vvr bedrijfsinterne inspecties en
      controles GMP diervoedersector 1997](onbekend).
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel92
  - number: 9:2.3
    text: |-
      De secretaris kan de termijn bepalen waarbinnen de niet-erkende ondernemer de maatregelen, bedoeld in het tweede
      lid, moet hebben genomen.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel92
  - number: 9:3.1
    text: |-
      De in [artikel 9:1][ref1] bedoelde monsters worden onderzocht door
      een door het productschap erkend laboratorium dan wel een ingevolge
      __REF001___________________________________________________________________________________________________________
      ___ aangewezen laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0014962#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007820#Artikel3
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0014962
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007820
        artikel: '3'
  - number: 9:3.2
    text: |-
      De procedure en voorwaarden voor erkenning voor laboratoria als bedoeld in het eerste lid, worden door de
      voorzitter in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij en de Minister van
      Volksgezondheid, Welzijn en Sport bij besluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel93
  - number: 9:3.3
    text: De namen, adressen en vestigingsplaatsen van erkende laboratoria worden vastgelegd in een openbaar register.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel93
  - number: 10:1.1
    text: |-
      De in deze verordening voorgeschreven dan wel toegelaten aanduidingen dienen goed zichtbaar, duidelijk leesbaar en
      onuitwisbaar te zijn vermeld en op deugdelijke wijze te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel101
  - number: 10:1.2
    text: De aanduidingen dienen te worden aangebracht in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel101
  - number: 10:2
    text: |-
      Voor het in het verkeer brengen van producten binnen de Gemeenschap moeten de op het geleidedocument, op de
      verpakking, op de recipiënt of op het daaraan bevestigde etiket gedrukte gegevens zijn gesteld in tenminste één of
      meer talen die het land van bestemming kiest uit de nationale of officiële talen van de Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel102
  - number: 10:3
    text: |-
      In afwijking van het bepaalde in [artikel 10:1, tweede lid][ref1] is het de ondernemer die producten invoert,
      toegestaan de in het land van herkomst voorgeschreven of toegelaten aanduidingen in ten minste één der talen van
      het land van herkomst te vermelden, mits iedere zending tevens vergezeld gaat van een begeleidend document met de
      voorgeschreven aanduidingen in de Nederlandse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0014962#Artikel10
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0014962
        artikel: '10'
        hoofdstuk: '10'
  - number: 10:4.1
    text: |-
      Het bepaalde in deze verordening is niet van toepassing op producten, indien deze bestemd zijn voor uitvoer naar
      niet EER-landen en indien op de verpakking de aanduiding EXPORT is aangebracht: - in letters van ten minste 2 cm
      hoogte op of aan een verpakking van meer dan 5 kg netto of op het begeleidend document dan wel
        - in letters van ten minste 2 mm hoogte op een verpakking tot en met 5 kg netto.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel104
  - number: 10:4.2
    text: |-
      In afwijking van het eerste lid is het bepaalde in [hoofdstuk 8][ref1] wel van toepassing op producten bestemd om
      te worden uitgevoerd naar niet EER-landen.


      [ref1]: https://wetten.overheid.nl/BWBR0014962#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0014962
        hoofdstuk: '8'
  - number: 10:5
    text: |-
      Voor gebruik van bijzondere stikstofhoudende producten en toevoegingsmiddelen waarvoor geen vergunning of
      toestemming tot het gebruik onder andere voorwaarden is gegeven, kan een ontheffing worden verleend voor praktische
      proeven voor wetenschappelijke en niet-commerciële doeleinden voor zover - de proeven plaatsvinden overeenkomstig
      de bij [Richtlijn 87/153/EEG](31987L0153) vast te stellen beginselen en voorwaarden en
        - de ondernemer zich onderwerpt aan het toezicht als bedoeld in artikel 12:3
        - de Adviescommissie Productregistratie een positief advies heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel105
  - number: 11:1
    text: |-
      De bepalingen van deze verordening gelden mede voor andere natuurlijke en rechtspersonen, voor zover deze
      handelingen verrichten die bedrijfsmatig in de ondernemingen, waarvoor het productschap is ingesteld, plegen te
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel111
  - number: 11:2
    text: Overtredingen van het bepaalde bij of krachtens deze verordening worden aangemerkt als strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel112
  - number: 11:3.1
    text: |-
      Toezicht op de naleving van het bepaalde bij of krachtens deze verordening vindt plaats overeenkomstig een door het
      bestuur vast te stelten verordening.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel113
  - number: 11:3.2
    text: |-
      Toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 9][ref1]
      vindt plaats door medewerkers van het productschap, die hiertoe in het kader van
      [artikel 114, eerste lid van de Gezondheids- en welzijnswet voor dieren][ref2] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014962#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0014962
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 11:4
    text: |-
      Het College van Deskundigen Diervoedersector kan in voorkomend geval gevraagd of ongevraagd advies uitbrengen over
      het bepaalde bij of krachtens deze verordening.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel114
  - number: 11:5
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel115
  - number: 11:6
    text: De Verordening PDV diervoeders 1998 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel116
  - number: 11:7
    text: 'Deze verordening wordt aangehaald als: Verordening PDV diervoeders 2003.'
    url: https://wetten.overheid.nl/BWBR0014962/2004-08-15#Artikel117
