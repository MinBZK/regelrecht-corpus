      - id: ref1
        bwb_id: BWBR0043340
        artikel: '13'
  - number: '10'
    text: |-
      1 De hoogte van het bedrag van de subsidieverlening is de uitkomst van:

      A* x B* x 3 x 1,3 x 0,9

      Hierbij staat:

      A* voor het percentage van de door de werkgever verwachte omzetdaling;

      B* voor de loonsom waarbij wordt uitgegaan van de totale loonsom van werknemers waarvoor de werkgever het loon
      heeft uitbetaald in het tijdvak, bedoeld in het tweede, derde of vierde lid, met dien verstande dat het in
      aanmerking te nemen loon per werknemer niet meer bedraagt dan € 9.538.

      2 Voor de loonsom, bedoeld in de omschrijving van de constante B*, bedoeld in het eerste lid, wordt uitgegaan van
      het loon over het eerste aangiftetijdvak van het jaar 2020, met dien verstande dat indien er sprake is van een
      aangiftetijdvak van vier weken, de loonsom in dat aangiftetijdvak wordt verhoogd met 8,33 procent.

      3 Indien er geen loongegevens zijn over het tijdvak, bedoeld in het tweede lid, wordt uitgegaan van het loon over
      de maand november van het jaar 2019. Indien er sprake is van een aangiftetijdvak van vier weken, wordt uitgegaan
      van het loon over het twaalfde aangiftetijdvak van het jaar 2019, waarbij de loonsom in dat aangiftetijdvak wordt
      verhoogd met 8,33 procent.

      4 Indien er geen sprake is van een aangiftetijdvak van een maand of vier weken, wordt het loon per werknemer
      herleid naar een loon per aangiftetijdvak van een maand.

      5 De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van constante
      B*, bedoeld in het eerste lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 15 maart 2020
      is ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0043340/2022-01-01#Artikel10
  - number: '11'
    text: |-
      1 De Minister verstrekt de werkgever bij de beschikking tot subsidieverlening een voorschot.

      2 De hoogte van het voorschot bedraagt 80% van het bedrag van de verlening, bedoeld in [artikel 10][ref1].

      3 Het voorschot wordt betaald in ten hoogste drie termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0043340#Artikel10
