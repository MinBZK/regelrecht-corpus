  - number: 6a
    text: |-
      1 In afwijking van [artikel 6, vijfde lid][ref1], kan aan de werkgever die deel uitmaakt van een groep als
      bedoeld in dat lid, die daarom bij de aanvraag tot vaststelling van de subsidie heeft verzocht, subsidie worden
      verstrekt waarbij de omzetdaling wordt bepaald op basis van de omzetdaling van die rechtspersoon of vennootschap
      afzonderlijk, indien aan de volgende voorwaarden is voldaan:

      a. de rechtspersoon of vennootschap heeft geen bedrijfsmatige activiteiten die voor meer dan de helft bestaan uit
      het binnen de groep ter beschikking stellen van arbeidskrachten;

      b. de werkgever handelt in overeenstemming met een overeenkomst, die door hem voorafgaand aan de aanvraag van de
      vaststelling van de subsidie wordt aangegaan, inclusief dagtekening, met ten minste één belanghebbende vereniging
      van werknemers, bedoeld in [artikel 3, derde lid, van de Wet melding collectief ontslag][ref2], en bij gebreke
      daarvan een andere vertegenwoordiging van werknemers, over werkbehoud. Bij werkmaatschappijen met minder dan 20
      werknemers volstaat akkoord van een vertegenwoordiging van werknemers;

      c. het groepshoofd, bedoeld in [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] of de
      moedermaatschappij, bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref4], verklaart voorafgaand
      aan de aanvraag van de vaststelling van de subsidie dat over 2020 geen dividenden aan aandeelhouders of bonussen
      aan de Raad van Bestuur en directie van het concern en de rechtspersoon of vennootschap voor waarop dit artikel
      wordt toegepast, waaronder mede begrepen winstdelingen, zullen worden uitgekeerd of eigen aandelen zullen worden
      ingekocht door de rechtspersonen binnen de groep. Met dividend worden gelijkgesteld andere winstuitkeringen
      aan derden buiten de groep. Indien de rechtspersoon, natuurlijke persoon of groep verplicht is op grond van een
      vaststellingsverklaring met de Belastingdienst of een wettelijke plicht om dividend uit te keren dan blijft dit
      toegestaan voor het gedeelte waarover de plicht geldt;

      d. de andere rechtspersonen of vennootschappen binnen een groep als bedoeld in [artikel 6, vijfde lid][ref5],
      voeren geen opdrachten of projecten uit die ten koste kunnen gaan van de rechtspersoon of vennootschap waarvoor de
      omzetdaling met toepassing van dit artikel wordt bepaald; en

      e. de omzetdaling van de groep, bedoeld in [artikel 6, vijfde lid][ref6], bedraagt minder dan 20%, in de periode,
      bedoeld in [artikel 8, vierde lid, onderdeel c][ref7].

      2 Onverminderd [artikel 3][ref8] heeft de subsidie die verstrekt wordt aan de werkgever, bedoeld in het eerste lid,
      ten doel om de werkgever tegemoet te komen in de loonkosten, voor zover door de groep geen winst of bonussen worden
      uitgekeerd of eigen aandelen worden aangekocht.

      3 Indien en voor zover werknemers van de rechtspersoon of vennootschap, waarvan de omzet met toepassing van het
      eerste lid wordt vastgesteld, in de periode, bedoeld in [artikel 8, vierde lid, onderdeel c][ref9], werkzaamheden
      verrichten bij een andere rechtspersoon of vennootschap, wordt de omzet van de rechtspersoon naar boven bijgesteld.
      Voor de berekening van de verhoging wordt de omzet over 2019 afgezet tegen de loonkosten over 2019. Deze verdeling
      wordt toegepast op de loonkosten zoals deze zijn ingezet bij de andere rechtspersoon of vennootschap en toegerekend
      aan de omzet over de periode, bedoeld in artikel 8, vierde lid, onderdeel c.

      4 Bij toepassing van het eerste lid worden bij de berekening van de omzet:

      a. dezelfde verrekenprijsregels en grondslagen van waardering en resultaatbepaling gehanteerd als in de laatste
      voor 1 maart 2020 vastgestelde jaarrekening; en

      b. mutaties in de voorraden gereed product toegerekend aan de omzet.

      5 Bij toepassing van dit artikel kan een groepsdeel als bedoeld in
      [artikel 405, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref10] bestaande uit een tussenholding en haar
      groepsmaatschappijen worden behandeld als waren zij één rechtspersoon.

      6 Indien in strijd wordt gehandeld met het eerste lid, onderdeel e, of het derde lid, wordt voor de toepassing
      van dit artikel de omzet bijgesteld ten opzichte van de situatie waarin niet in strijd met die artikelen zou zijn
      gehandeld.


