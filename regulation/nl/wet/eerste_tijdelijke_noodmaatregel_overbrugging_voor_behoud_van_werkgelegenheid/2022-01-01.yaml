  - number: '8'
    text: |-
      1 De werkgever dient een subsidieaanvraag in door middel van een door de Minister beschikbaar gesteld formulier.

      2 Een aanvraag voor subsidie kan worden ingediend vanaf 14 april 2020, of een eerder tijdstip, dat bekend gemaakt
      wordt via www.uwv.nl, tot en met 5 juni 2020.

      3 De werkgever kan eenmaal per loonheffingennummer een subsidieaanvraag indienen.

      4 In de subsidieaanvraag wordt in ieder geval vermeld:

      a. indien de werkgever na 31 augustus 2019 een wtv-aanvraag heeft ingediend, het dossiernummer van de aanvraag;

      b. de verwachte omzetdaling, uitgedrukt in hele procenten, afrondend naar boven;

      c. in welke aaneengesloten periode van drie kalendermaanden binnen de periode van 1 maart tot en met 31 juli 2020
      de werkgever een omzetdaling verwacht;

      d. het loonheffingennummer; en

      e. het rekeningnummer waarop de werkgever betalingen van de Belastingdienst inzake loonheffingen ontvangt.

      5 Indien de werkgever onderdeel is van een groep als bedoeld in [artikel 6, vijfde lid][ref1], of indien de
      werkgever meerdere loonheffingennummers heeft, wordt hetzelfde percentage, bedoeld in het vierde lid, onderdeel
      b, alsook eenzelfde periode voor de verwachte omzetdaling, bedoeld in het vierde lid, onderdeel c, voor alle
      rechtspersonen en vennootschappen binnen de groep respectievelijk de loonheffingennummers gehanteerd. In afwijking
      van de eerste zin hoeft voor de werkgever die onderdeel is van een groep als bedoeld in artikel 6, vijfde lid,
      niet hetzelfde percentage, bedoeld in het vierde lid, onderdeel b te worden gehanteerd als het percentage dat
      voor de groep wordt gehanteerd, als de werkgever bij de aanvraag tot vaststelling verzoekt [artikel 6a][ref2] toe
      te passen.

      6 De werkgever, bedoeld in [artikel 2, derde lid][ref3], wordt in de gelegenheid gesteld zijn aanvraag om subsidie
      op grond van deze regeling binnen 4 weken aan te vullen, met de gegevens, bedoeld in het vierde lid.

      7 De subsidieaanvraag wordt elektronisch gedaan, tenzij op www.uwv.nl kenbaar wordt gemaakt dat een schriftelijke
      subsidieaanvraag ook mogelijk is.

      8 Indien het rekeningnummer, bedoeld in het vierde lid, onderdeel e, geen rekeningnummer betreft uit een land
      dat valt onder de EU-Verordening/260/2012, vult de werkgever op verzoek van de minister de aanvraag aan met een
      rekeningnummer uit een land dat valt onder die EU-verordening.

      9 Door het indienen van een aanvraag wordt de werkgever geacht ermee ingestemd te hebben dat de volgende gegevens
      uit het subsidiedossier openbaar gemaakt kunnen worden:

      a. de naam en de vestigingsplaats van werkgever;

      b. het verstrekte voorschot; en

      c. de vastgestelde subsidie.


