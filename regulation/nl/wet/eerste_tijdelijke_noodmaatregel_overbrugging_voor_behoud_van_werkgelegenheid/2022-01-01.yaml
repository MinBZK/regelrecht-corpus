      1 Op subsidies verleend op grond van deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van
      toepassing.

      2 Formulieren waarnaar in deze regeling wordt verwezen, worden door de Minister beschikbaar gesteld op www.uwv.nl.

      3 De werkgever die een wtv-aanvraag heeft ingediend en waarop voor de datum van inwerkingtreding van deze regeling
      nog niet is beslist, wordt geacht een aanvraag om subsidie te hebben ingediend op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
