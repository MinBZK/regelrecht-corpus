  - number: '13'
    text: |-
      1 Aan de werkgever aan wie subsidie wordt verleend, worden de volgende verplichtingen opgelegd:

      a. de werkgever is verplicht de loonsom zoveel mogelijk gelijk te houden;

      b. de werkgever doet na 17 maart 2020 geen verzoek om toestemming om de arbeidsovereenkomst op te zeggen op grond
      van [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref1], gedurende het tijdvak
      waarover subsidie is verleend;

      c. de werkgever is verplicht de subsidie uitsluitend aan te wenden voor de betaling van de loonkosten;

      d. de werkgever is verplicht de ondernemingsraad of personeelsvertegenwoordiging, bedoeld in de
      [Wet op de ondernemingsraden][ref2], of bij het ontbreken daarvan, de werknemers te informeren over de
      subsidieverlening;

      e. de werkgever voert een zodanig controleerbare administratie dat alle voor de vaststelling van de subsidie van
      belang zijnde gegevens kunnen worden nagegaan en verleent desgevraagd tot vijf jaar na de datum van vaststelling
      van de subsidie inzage in deze administratie;

      f. de werkgever doet de loonaangifte op grond van de [Wet op de loonbelasting 1964][ref3] op de voorgeschreven
      momenten;

      g. de werkgever meldt onverwijld en schriftelijk aan de Minister indien zich andere omstandigheden voordoen die van
      belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie;

      h. de werkgever overlegt na afloop van de periode waarover subsidie is verleend een definitieve opgave van de
      omzetdaling in de periode, bedoeld in [artikel 8, vierde lid, onderdeel c][ref4];

      i. de werkgever werkt tot vijf jaar na de datum van vaststelling van de subsidie, onder meer door het verschaffen
      van de daartoe benodigde inlichtingen, gegevens en bescheiden, mee aan door of namens de Minister ingesteld
      onderzoek dat erop is gericht de Minister inlichtingen te verschaffen die van belang zijn voor het nemen van een
      besluit over het verstrekken van de subsidie, de vaststelling van de rechtmatigheid daarvan, of de ontwikkeling van
      het beleid van de Minister.

      2 De aanvraag van de vaststelling gaat vergezeld van een verklaring over de naleving van de subsidievoorwaarden,
      afgegeven door een accountant als bedoeld in [artikel 1 van de Wet op het accountantsberoep][ref5]. Deze verklaring
      voldoet aan standaarden die door de Koninklijke Nederlandse Beroepsorganisatie van Accountants zijn vastgesteld,
      met inachtneming van het in de bijlage bij deze regeling opgenomen accountantsprotocol. Van de verplichting om
      een verklaring van een accountant over te leggen is de werkgever vrijgesteld, indien het totale voorschot dat is
      verstrekt aan die natuurlijke persoon, rechtspersoon of groep als bedoeld in [artikel 6, vijfde lid][ref6], minder
      is dan € 100.000,–. In afwijking van de vorige zin geldt de vrijstelling van de verplichting om een verklaring
      van een accountant over te leggen niet indien de totale subsidie voor die natuurlijke persoon, rechtspersoon of
      groep als bedoeld in artikel 6, vijfde lid, wordt vastgesteld op een bedrag van € 125.000,– of meer, of indien de
      werkgever heeft verzocht om toepassing van [artikel 6a][ref7].

      3 De werkgever die op grond van het tweede lid is vrijgesteld van de verplichting om een verklaring van een
      accountant over te leggen, overlegt ten behoeve van de vaststelling van de subsidie het in de bijlage bij deze
      regeling opgenomen formulier met een verklaring van een deskundige derde waarmee de omzetdaling wordt bevestigd. De
      Minister wijst aan welke deskundige derden een verklaring kunnen afgeven. Van de verplichting om een verklaring van
      een deskundige derde te overleggen is de werkgever vrijgesteld, indien het totale voorschot voor die natuurlijke
      persoon, rechtspersoon of groep als bedoeld in [artikel 6, vijfde lid][ref8], dat verstrekt is minder dan
      € 20.000,– bedraagt. In afwijking van de vorige zin geldt de vrijstelling van de verplichting om een verklaring van
      een deskundige derde te overleggen niet indien de totale subsidie voor die natuurlijke persoon, rechtspersoon of
      groep als bedoeld in artikel 6, vijfde lid, wordt vastgesteld op een bedrag van € 25.000,– of meer.


