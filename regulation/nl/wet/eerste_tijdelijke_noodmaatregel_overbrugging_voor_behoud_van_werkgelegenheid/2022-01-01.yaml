  - number: '14'
    text: |-
      1 De werkgever vraagt de vaststelling van de subsidie na 6 oktober 2020 en uiterlijk op 31 oktober 2021 aan, door
      middel van een door de Minister vast te stellen formulier. [Artikel 8, zevende lid][ref1], is van overeenkomstige
      toepassing.

      2 Bij de aanvraag van de vaststelling worden in ieder geval meegezonden:

      a. de definitieve gegevens over de omzetdaling in de periode, bedoeld in
      [artikel 8, vierde lid, onderdeel c][ref2], alsmede informatie waaruit dit blijkt;

      b. de verklaring van een accountant of een derde, bedoeld in [artikel 13, tweede en derde lid][ref3]; en

      c. een verklaring dat voldaan is aan de in [artikel 13, eerste lid, onderdelen a en c tot en met i][ref4], genoemde
      verplichtingen.

      3 De werkgever die bij de aanvraag van de vaststelling verzoekt om toepassing van [artikel 6a][ref5] verklaart dat
      voldaan is aan de voorwaarden van artikel 6a en zendt een verklaring van een accountant mee waaruit dat blijkt.

      4 Indien een natuurlijke persoon of rechtspersoon of groep als bedoeld in [artikel 6, vijfde lid][ref6], verplicht
      is een verklaring van een accountant op grond van [artikel 13, tweede lid][ref7], of een verklaring van een
      deskundige derde op grond van artikel 13, derde lid, te overleggen vult de werkgever, die geen verklaring van een
      accountant, respectievelijk verklaring van een deskundige derde heeft meegezonden, op verzoek van de minister de
      aanvraag binnen 14 weken aan met de benodigde verklaring.

      5 De subsidie wordt vastgesteld aan de hand van de berekeningswijze, bedoeld in [artikel 7][ref8], met dien
      verstande dat de subsidie in ieder geval op nihil wordt vastgesteld, indien:

      a. de omzetdaling in de periode, bedoeld in [artikel 8, vierde lid, onderdeel c][ref9], minder dan 20% bedraagt;

      b. de werkgever geen verklaring van een accountant, als bedoeld in [artikel 13, tweede lid][ref10], of een
      verklaring van een deskundige derde als bedoeld in artikel 13, derde lid, verstrekt, tenzij hij daarvan op grond
      van artikel 13, tweede of derde lid, is vrijgesteld; of

      c. de werkgever die verzocht heeft om toepassing van [artikel 6a][ref11], niet voldoet aan de voorwaarden in
      artikel 6a of indien in strijd is gehandeld met de verklaring, bedoeld in artikel 6a, eerste lid, onderdeel c.

      6 De Minister stelt de subsidie vast binnen 52 weken na de ontvangst van de aanvraag, bedoeld in het eerste lid.


