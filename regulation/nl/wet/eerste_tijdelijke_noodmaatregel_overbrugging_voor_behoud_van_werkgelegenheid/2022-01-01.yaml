preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 8, eerste lid, van de Kaderwet SZW-subsidies en artikel 32d, tweede lid,
    van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043340/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *loon:* het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref1], voor zover het
      betreft loon uit tegenwoordige dienstbetrekking;
        - *loonsom:* het loon van alle werknemers, behorende tot een loonheffingennummer;
        - *loonheffingennummer:* het nummer, genoemd in
      [artikel 1a.1, tweede lid, onderdeel b, onder 1, van de Regeling gegevensuitvraag loonaangifte][ref2];
        - *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *omzetdaling:* een daling van de omzet als bedoeld in [artikel 6, eerste lid][ref3];
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];
        - *werkgever:* een werkgever als bedoeld in
      [artikel 1, onderdeel q of r, van de Wet financiering sociale verzekeringen][ref5];
        - *werknemer:* een werknemer als bedoeld in
      [artikel 1, onderdeel o of p, van de Wet financiering sociale verzekeringen][ref6];
        - *wtv-aanvraag:* een aanvraag om ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref7] die voor 17 maart 2020, 18.45
      uur, door de werkgever is ingediend.

      2 Onder omzet wordt in deze regeling verstaan de netto-omzet zoals gedefinieerd in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref8] gecorrigeerd voor de in de winst-
      en-verliesrekening verantwoorde wijziging in onderhanden projecten en bepaald op basis van grondslagen en
      detailtoepassingen die consistent zijn met de grondslagen en detailtoepassingen zoals deze door de werkgever zijn
      gehanteerd in de laatste voor 1 maart 2020 vastgestelde jaarrekening, mits deze conform de wet- en regelgeving is
      opgesteld. Voor natuurlijke personen is dit de omzetbepaling die de basis is geweest voor de laatst vastgestelde
      aangifte voor de [Wet inkomstenbelasting 2001][ref9], mits deze conform de wet- en regelgeving is opgesteld. Alle
      baten die voortkomen uit de uitvoering van normale activiteiten van een organisatie, ook als deze gewoonlijk met
      een andere term dan omzet worden aangeduid, vallen onder omzet in de zin van deze regeling.


