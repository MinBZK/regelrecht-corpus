  - number: '12'
    text: |-
      Onverminderd [artikel 4:56 van de Algemene wet bestuursrecht][ref1], schort de Minister de betaling van een
      voorschot als bedoeld in [artikel 11][ref2] op, indien:

      a. sprake is van een ernstig vermoeden dat niet voldaan wordt aan de voorwaarden of de verplichtingen, bedoeld
      in [artikel 13, eerste lid, onderdelen a en c tot en met i, tweede en derde lid][ref3], die zijn verbonden aan de
      subsidie; of

      b. indien een melding van de werkgever daartoe aanleiding geeft.


