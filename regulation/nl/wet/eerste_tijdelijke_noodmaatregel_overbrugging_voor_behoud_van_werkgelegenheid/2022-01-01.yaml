  - number: '18'
    text: |-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.

      2 Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.

      4 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onder b, van de Regeling Wfsv][ref1], na
      overleg met het UWV maandelijks een periodiek voorschot op de rijksbijdrage, bedoeld in het derde lid, van:

      a. de door het UWV voorafgaand aan iedere maand geraamde subsidielasten met als valutadatum de tweeëntwintigste dag
      van elke maand; en

      b. de door het UWV voorafgaand aan iedere maand geraamde uitvoeringskosten met als valutadatum de vijftiende dag
      van elke maand.

      5 De Minister kan, na overleg met het UWV, van de in het vierde lid, onder a en b, bedoelde bedragen en data
      afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
