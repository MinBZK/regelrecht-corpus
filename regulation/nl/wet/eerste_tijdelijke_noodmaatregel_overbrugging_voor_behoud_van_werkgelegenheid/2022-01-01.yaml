    text: |-
      1 De omzetdaling wordt vastgesteld door het verschil tussen de referentie-omzet en de omzet in de periode als
      bedoeld in [artikel 8, vierde lid, onderdeel c][ref1], te delen door de referentie-omzet. De uitkomst van deze
      berekening wordt uitgedrukt, in hele procenten en naar boven afgerond.

      2 De referentie-omzet, bedoeld in het eerste lid, is de omzet over het kalenderjaar 2019, gedeeld door vier.

      3 In afwijking van het tweede lid, is de referentie-omzet, bedoeld in het eerste lid, de omzet, die is gerealiseerd
      in de periode tot en met 29 februari 2020, gedeeld door het aantal maanden waarvan de omzet in aanmerking wordt
      genomen, vermenigvuldigd met drie, gerekend vanaf de eerste volledige kalendermaand vanaf:

      a. de aanvang van de bedrijfsuitoefening, indien sprake is van een werkgever waarvan de bedrijfsuitoefening na
      1 januari 2019 is aangevangen; of

      b. de overgang, indien de werkgever na 1 januari 2019 een economische eenheid heeft overgenomen in de zin van
      [artikel 7:662 van het Burgerlijk Wetboek][ref2].

      4 Voor de omzetdaling wordt uitgegaan van de omzetdaling van de natuurlijke of rechtspersoon, tenzij
      [artikel 6a][ref3] van toepassing is.

      5 Indien de rechtspersoon of vennootschap onderdeel is van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref4], wordt, in afwijking van het vierde lid, uitgegaan van de
      omzetdaling van de groep zoals deze op 1 maart 2020 bestond. Indien de rechtspersoon een dochtermaatschappij is van
      een ander als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref5], worden de dochtermaatschappij
      en de rechtspersoon voor de werking van deze regeling behandeld als waren zij een groep. Voor de bepaling van de
      omzetdaling als bedoeld in de eerste zin worden de Nederlandse rechtspersonen en vennootschappen in aanmerking
      genomen, alsmede buitenlandse rechtspersonen en vennootschappen met loon in Nederland.

      6 Subsidies en baten die betrekking hebben op een langere periode dan de periode, bedoeld in
      [artikel 8, vierde lid, onderdeel c][ref6], en de periode, bedoeld in het tweede lid, worden naar rato aan de
      betreffende perioden toegerekend voor de bepaling van de omzetdaling, bedoeld in het eerste lid.

      7 Het derde lid, onderdeel b, wordt toegepast, indien de werkgever daarom verzoekt bij de aanvraag tot vaststelling
      van de subsidie.


