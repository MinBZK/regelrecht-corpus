  - number: '7'
    text: |-
      1 De hoogte van de subsidie is de uitkomst van:

      A x B x 3 x 1,3 x 0,9

      Hierbij staat:

      A voor het percentage van de omzetdaling;

      B voor de constante B*, zoals berekend op grond van [artikel 10][ref1], met dien verstande dat:

      a. de loonsom wordt verminderd met de werkloosheidsuitkeringen die het UWV over het gehanteerde aangiftetijdvak aan
      de werkgever heeft uitbetaald, voor zover die uitkeringen in de loonsom zijn inbegrepen;

      b. de uitbetaling van vakantiebijslag in het gehanteerde aangiftetijdvak niet wordt meegenomen
      bij de vaststelling van de loonsom, met uitzondering van de uitbetaling van vakantiebijslag
      door de werkgever die geen vakantiebijslag voor de werknemer reserveert, als bedoeld in
      [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref2] zoals dat luidde op 31 december 2021;

      c. de loonsom wordt vermenigvuldigd met 0,926, indien de werkgever geen vakantiebijslag voor de werknemer
      reserveert, als bedoeld in [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref3] zoals dat
      luidde op 31 december 2021;

      d. de loonsom wordt verminderd met een extra periode salaris dat naast het reguliere loon en vakantiebijslag
      wordt uitbetaald in het tijdvak, bedoeld in het [tweede, derde of vierde lid van artikel 10][ref4]. Onder extra
      periode salaris wordt verstaan extra loon dat naast het reguliere loon en vakantiebijslag wordt uitbetaald naar
      aanleiding van afspraken in de individuele of collectieve arbeidsovereenkomst, en dat niet afhankelijk is van
      bedrijfsresultaten of kwalitatieve of kwantitatieve prestaties van de werknemer; en

      e. de maximering van het loon per werknemer tot € 9.538 per tijdvak van een maand, bedoeld in [artikel 10][ref5],
      plaatsvindt na toepassing van de onderdelen a tot en met d.

      2 Indien de loonsom bedoeld onder de constante C lager is dan driemaal de loonsom als bedoeld onder de constante B
      in het eerste lid, wordt de subsidie verlaagd met:

      (B x 3 – C) x 1,3 x 0,9

      Hierbij staat:

      B voor de constante B, zoals berekend op grond van het eerste lid;

      C voor de loonsom over de periode 1 maart tot en met 31 mei 2020, met dien verstande dat het bepaalde onder het
      eerste lid, constante B, van overeenkomstige toepassing is, waarbij het in aanmerking te nemen loon per werknemer
      niet meer bedraagt dan € 9.538 per aangiftetijdvak van een maand en de gehanteerde aangiftetijdvakken het derde tot
      en met het vijfde aangiftetijdvak van het jaar 2020 zijn.

      3 Indien er sprake is van een werkgever die per vier weken aangifte doet voor de loonheffingen, wordt de loonsom,
      bedoeld in het tweede lid, constante C, verhoogd met 8,33 procent. [Artikel 10, vierde lid][ref6], is van
      overeenkomstige toepassing.

      4 De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de
      constante C worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 19 juli 2020 is ingediend,
      alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden. Indien de loonaangifte na
      laatstgenoemde datum naar beneden wordt bijgesteld, kan de Minister besluiten de gewijzigde loonaangifte in
      aanmerking te nemen voor de vaststelling van de loonsom, bedoeld in het tweede lid, constante C.

      5 Indien de werkgever na 17 maart 2020 een verzoek om toestemming heeft gedaan
      om de arbeidsovereenkomst van één of meer werknemers op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref7], wordt de subsidie verlaagd met:

      D x 1,5 x 3 x 1,3 x 0,9

      Hierbij staat D voor het loon dat de werknemers, bedoeld in de eerste zin, hebben ontvangen, berekend
      overeenkomstig het bepaalde in het eerste lid, constante B.

      6 Het vijfde lid is niet van toepassing voor zover de werkgever het verzoek om toestemming heeft ingetrokken binnen
      vijf werkdagen:

      a. na het tijdstip van inwerkingtreding van deze regeling, indien het verzoek om toestemming voor dat tijdstip is
      gedaan; of

      b. nadat het verzoek is ingediend.

      7 Indien de loonsom, bedoeld onder de constante E, hoger is dan driemaal de loonsom als bedoeld onder de variabele
      B, bedoeld in het eerste lid, wordt de subsidie verhoogd met:

      A x (E – B x 3) x 1,3 x 0,9

      Hierbij staat:

      A en B voor de variabelen A en B, bedoeld in het eerste lid;

      E voor de loonsom van 1 maart 2020 tot en met 31 mei 2020, met dien verstande dat:

      a. het bepaalde onder het tweede lid, constante B, van overeenkomstige toepassing is, waarbij het in aanmerking te
      nemen loon per werknemer niet meer bedraagt dan € 9.538 per aangiftetijdvak van een maand;

      b. de gehanteerde aangiftetijdvakken het derde tot en met het vijfde aangiftetijdvak van het jaar 2020 zijn; en

      c. de maximale hoogte van constante E driemaal de loonsom over het derde aangiftetijdvak van het jaar 2020 is.

      8 Het derde en vierde lid zijn van overeenkomstige toepassing op het zevende lid, constante E.

      9 In afwijking van het achtste lid worden de in aanmerking te nemen gegevens uit de loonaangifte van de werkgever
      ten behoeve van de bepaling van de maximale hoogte van constante E, met betrekking tot het derde aangiftetijdvak
      van het jaar 2020 beoordeeld op grond van de loonaangifte zoals die uiterlijk op 15 mei 2020 is ingediend en met
      betrekking tot het vierde en vijfde aangiftetijdvak van het jaar 2020 beoordeeld op grond van de loonaangifte
      zoals die uiterlijk op 19 juli 2020 is ingediend, alsmede de aanvullingen daarop die uiterlijk op 15 mei 2020,
      respectievelijk 19 juli 2020 hebben plaatsgevonden.


