  - number: '3'
    text: |-
      Het doel van deze regeling is om werkgevers tegemoet te komen in de betaling van de loonkosten, indien sprake
      is van een acute terugval in de omzet met ten minste 20% gedurende een periode van drie maanden, vanwege
      een vermindering in bedrijvigheid door buitengewone omstandigheden die in redelijkheid niet tot het normale
      ondernemersrisico kunnen worden gerekend, zodat zij werknemers in dienst kunnen houden voor de uren die zij werkten
      voordat sprake was van deze terugval.
    url: https://wetten.overheid.nl/BWBR0043340/2022-01-01#Artikel3
  - number: '4'
    text: |-
      De Minister kan aan een werkgever, die gedurende een aaneengesloten periode van drie kalendermaanden in de periode
      van 1 maart tot en met 31 juli 2020 verwacht te worden geconfronteerd met een daling van de omzet van ten minste
      20%, per loonheffingennummer een subsidie verlenen over de loonsom in de periode van 1 maart tot en met 31 mei
      2020.
    url: https://wetten.overheid.nl/BWBR0043340/2022-01-01#Artikel4
  - number: '5'
    text: |-
      Onverminderd [artikel 4:35, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] wordt de
      subsidieverlening geweigerd, indien of voor zover:

      a. niet of onvoldoende aannemelijk is dat de omzetdaling van de betreffende werkgever ten minste 20% zal zijn;

      b. het rekeningnummer dat bij de aanvraag is opgegeven niet correspondeert met het in de aanvraag opgegeven
      loonheffingennummer en de daaraan verbonden rekeninggegevens;

      c. geen loongegevens beschikbaar zijn in de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], over de aangiftetijdvakken, bedoeld
      in [artikel 10, tweede tot en met vierde lid][ref3] en [artikel 7, zevende lid][ref4]; of

      d. de aanvraag anderszins niet voldoet aan de in deze regeling gestelde eisen.


