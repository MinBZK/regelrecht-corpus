  - number: '11'
    text: |-
      1 Een waarborginstelling kan het besluit nemen om in afwijking van [artikel 4, eerste lid, onderdelen a en b][ref1],
      af te zien van het aanbrengen van een merk, indien dat niet zonder gevaar van beschadiging op het voorwerp
      aangebracht kan worden of indien het voorwerp van bijzondere oudheidkundige of kunstzinnige waarde is.

      2 Een besluit als bedoeld in het eerste lid bevat een nauwkeurige omschrijving van het desbetreffende voorwerp
      en de informatie die uit het merk zou kunnen zijn verkregen, indien van het aanbrengen van dat merk niet zou zijn
      afgezien.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel4
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12'
    text: |-
      1 Het aanbrengen van een merk gebeurt door stempeling of lasergravering of een andere bij of krachtens onderdeel
      5.2 van Bijlage II van het Verdrag toegestane methode.

      2 Bij ministeriële regeling kunnen eisen worden gesteld aan de toegestane methodes om een merk aan te brengen.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel12
  - number: '13'
    text: |-
      1 Indien een waarborginstelling specifieke taken uitbesteedt of door een dochteronderneming laat uitvoeren, draagt
      zij er zorg voor dat de onderaannemer of dochteronderneming voldoet aan de in [artikel 4, tweede lid][ref1],
      gestelde eisen en behoudt zij de volledige verantwoordelijkheid voor de taakuitvoering.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de rechtspersonen of natuurlijke
      personen die op grond van het eerste lid taken voor een waarborginstelling kunnen uitvoeren en met betrekking tot
      de verantwoordelijkheid en zorg, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel4
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel13
