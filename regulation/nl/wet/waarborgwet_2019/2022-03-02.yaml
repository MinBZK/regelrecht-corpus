  - number: '29'
    text: |-
      1 Een voorwerp, ten aanzien waarvan een gehalte als bedoeld in [artikel 27][ref1] is vastgesteld, en dat
      voldoet aan de vereisten, genoemd in bijlage I bij het Verdrag, wordt overeenkomstig het bij of krachtens het
      Verdrag bepaalde gemerkt met het in onderdeel 5.5 van bijlage II van het Verdrag voor het desbetreffende gehalte
      vastgestelde gehaltemerk.

      2 De [artikelen 9 tot en met 11][ref2] zijn van toepassing op het aanbrengen van merken bij platina, gouden en
      zilveren voorwerpen en van overeenkomstige toepassing op het aanbrengen van merken bij palladium voorwerpen en
      voorwerpen met een gehalte aan goud onder 585 duizendsten en boven of gelijk aan 375 duizendsten.


