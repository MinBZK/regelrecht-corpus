  - number: '30'
    text: |-
      1 Het is een ondernemer verboden een voltooid platina, gouden of zilveren voorwerp, dat op grond van het bij of
      krachtens deze wet bepaalde moet zijn gewaarborgd, in zijn bezit te hebben of daarmee handel te drijven, tenzij dat
      voorwerp is voorzien van een gehaltemerk of de ondernemer ten aanzien van het desbetreffende voorwerp beschikt over
      een besluit als bedoeld in [artikel 11, eerste lid][ref1].

      2 Het bepaalde in het eerste lid is ook van toepassing op voorwerpen die bestemd zijn voor persoonlijk gebruik door
      de ondernemer of een lid van zijn huishouden.

      3 Het bepaalde in het eerste lid omtrent het in het bezit hebben van voorwerpen is niet van toepassing op de
      ondernemer, die de desbetreffende voorwerpen minder dan vier weken in zijn bezit heeft, mits die voorwerpen niet
      onder de aandacht van het publiek worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel11
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel30
