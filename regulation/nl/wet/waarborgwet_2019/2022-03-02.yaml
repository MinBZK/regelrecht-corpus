  - number: '34'
    text: |-
      De [artikelen 30, eerste lid][ref1], [31][ref2], [32][ref3] en [33][ref4] zijn van overeenkomstige toepassing op
      degenen die verantwoordelijkheid dragen voor een verkoping, te weten:

      a. een notaris, deurwaarder of andere ambtenaar te wiens overstaan een openbare verkoping plaatsheeft;

      b. degene die, bij afwezigheid van een notaris, deurwaarder of andere ambtenaar als bedoeld in onderdeel a, de
      openbare verkoping houdt of is belast met het toezicht op die verkoping;

      c. het pandhuis ingeval van verkopingen van verpande zaken door een pandhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0042284#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0042284#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0042284#Artikel33
