  - number: '14'
    text: |-
      Indien een platina, gouden of zilveren voorwerp een gehalte aan platina, goud of zilver heeft dat niet gelijk
      is aan een krachtens [artikel 7, tweede lid][ref1], vastgesteld gehalte, wordt het voorwerp gewaarborgd op het
      naastgelegen lagere gehalte waarop het desbetreffende edelmetaal overeenkomstig artikel 7, eerste lid, of krachtens
      artikel 7, tweede lid, kan worden gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel7
