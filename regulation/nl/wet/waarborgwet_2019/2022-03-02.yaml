  - number: '40'
    text: |-
      1 Een ondernemer heeft op een voor het publiek zichtbare plaats een document aanwezig waarop de in de
      [artikelen 7, vierde lid][ref1], en [29, eerste lid][ref2], bedoelde gehaltemerken met toelichting staan afgebeeld.

      2 Een waarborginstelling verstrekt een document als bedoeld in het eerste lid desgevraagd aan een ondernemer of
      een ander. [Artikel 5][ref3] is van overeenkomstige toepassing, indien het gaat om de verstrekking aan anderen
      dan ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel7
