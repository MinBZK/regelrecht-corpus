  - number: '45'
    text: |-
      1 Indien de Permanente Commissie, bedoeld in artikel 10 van het Verdrag, conform het bepaalde in het Verdrag
      besluit tot wijziging van de:

      a. bij of krachtens onderdeel 2.2. van bijlage I van het Verdrag bedoelde gehalten;

      b. andere bij of krachtens onderdeel 5.2 van Bijlage II van het Verdrag toegestane methodes voor het aanbrengen van
      een merk;

      c. bij of krachtens onderdeel 3.1 van Bijlage II van het Verdrag toegestane onderzoeksmethodes voor het beoordelen
      van de homogeniteit;

      d. bij of krachtens onderdeel 3.2 van Bijlage II van het Verdrag goedgekeurde analysemethodes bij het keuren van
      voorwerpen van edelmetaal; of

      e. richtlijnen voor het nemen van monsters, bedoeld in onderdeel 4 van Bijlage II van het Verdrag,

      gaat deze wijziging voor de toepassing van deze wet gelden met ingang van de dag waarop het desbetreffende besluit
      van de Permanente Commissie in werking treedt.

      2 Onze Minister maakt een besluit als bedoeld in het eerste lid in de Staatscourant bekend.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel45
  - number: '46'
    text: |-
      1 Indien op basis van [artikel 7, eerste lid, van de Waarborgwet 1986][ref1], zoals dat luidde onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van [artikel 4, eerste lid][ref2], een rechtspersoon is
      aangewezen, wordt die aanwijzing voor de duur daarvan aangemerkt als een aanwijzing als bedoeld in artikel 4,
      eerste lid.

      2 Indien op basis van [artikel 52, eerste lid, van de Waarborgwet 1986][ref3], zoals dat luidde onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van [artikel 36, eerste lid][ref4], ambtenaren zijn aangewezen,
      wordt die aanwijzing voor de duur daarvan aangemerkt als een aanwijzing als bedoeld in artikel 36, eerste lid.

      3 Indien op basis van [artikel 7e van de Waarborgwet 1986][ref5], zoals dat luidde onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van [artikel 4, achtste lid][ref6], door Onze Minister regels zijn gesteld, worden
      die regels voor de duur daarvan aangemerkt als regels als bedoeld in artikel 4, achtste lid.

      4 Ingevolge wettelijke voorschriften tot stand gekomen meestertekens of invoertekens worden voor de duur van hun
      registratie aangemerkt als een verantwoordelijkheidsteken in de zin van [artikel 1][ref7].

      5 De op het tijdstip van inwerkingtreding van de desbetreffende bepalingen van deze wet aanhangige aanvragen tot,
      verzoeken om of bezwaren tegen besluiten op grond van [Waarborgwet 1986][ref8] worden met ingang van dat tijdstip
      aangemerkt als aanvragen tot, verzoeken om of bezwaren tegen besluiten op grond van deze wet.


