        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0042284
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '27'
    text: |-
      Waarborging van de in [artikel 26][ref1] bedoelde voorwerpen geschiedt op de bij of krachtens onderdeel 2.2 van
      Bijlage I van het Verdrag bedoelde gehalten.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel26
