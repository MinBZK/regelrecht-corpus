  - number: '5'
    text: |-
      1 De kosten die samenhangen met het verrichten van werkzaamheden en diensten door een waarborginstelling op grond
      van het bepaalde bij of krachtens deze wet, worden door de waarborginstelling ten laste gebracht van de betrokken
      ondernemer.

      2 Een waarborginstelling legt jaarlijks vóór 1 oktober de vanaf 1 januari daarop volgend aan de ondernemer
      te berekenen tarieven voor de werkzaamheden, bedoeld in de [artikelen 4, eerste lid, onderdeel a][ref1],
      [8, eerste en tweede lid][ref2], [9, tweede lid][ref3], [16, eerste lid][ref4], [17, eerste lid][ref5],
      [18, eerste lid][ref6], en [40, tweede lid][ref7], ter goedkeuring aan Onze Minister voor. De tarieven worden na
      goedkeuring door de waarborginstelling in de Staatscourant bekendgemaakt.

      3 Onverminderd [artikel 17 van de Kaderwet][ref8] kan Onze Minister goedkeuring als bedoeld in het tweede lid
      weigeren indien de tarieven hoger zijn dan, uitgaande van een redelijke toerekening van de aan het uitvoeren van de
      betreffende werkzaamheden verbonden kosten, noodzakelijk is.

      4 Het besluit omtrent goedkeuring van de vanaf 1 januari te rekenen tarieven, bedoeld in het tweede lid, eerste
      volzin, wordt uiterlijk 30 november daaraan voorafgaand bekendgemaakt.

      5 Indien de vanaf 1 januari te berekenen tarieven niet vóór 1 december daaraan voorafgaand zijn goedgekeurd, kan
      Onze Minister de tarieven zelf vaststellen.

      6 Van een besluit tot vaststelling van tarieven als bedoeld in het vijfde lid, wordt door Onze Minister mededeling
      gedaan door plaatsing in de Staatscourant.

      7 Een waarborginstelling kan de tarieven, bedoeld in het tweede lid, gedurende het jaar waarvoor zij gelden,
      wijzigen. Een wijziging van tarieven wordt ter goedkeuring aan Onze Minister voorgelegd. Het tweede lid, tweede
      volzin, alsmede het derde lid zijn van toepassing.

      8 Het besluit omtrent goedkeuring van een wijziging van de tarieven, bedoeld in het zevende lid, wordt uiterlijk
      acht weken nadat de waarborginstelling de wijziging ter goedkeuring aan Onze Minister heeft voorgelegd,
      bekendgemaakt.


