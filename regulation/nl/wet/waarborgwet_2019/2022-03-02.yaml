  - number: '35'
    text: |-
      1 Indien een openbare verkoping plaatsvindt waarvan platina, gouden of zilveren voorwerpen deel uitmaken, meldt
      de betrokken verantwoordelijke, bedoeld in [artikel 34][ref1], ten minste drie dagen voor de eerste kijkdag de
      voorgenomen verkoping aan de krachtens [artikel 36, eerste lid][ref2], aangewezen ambtenaren.

      2 De melding, bedoeld in het eerste lid, bevat:

      a. naam, adres en hoedanigheid van de melder;

      b. naam en adres van degene die de verkoping organiseert;

      c. het adres van de verkooplocatie; en

      d. de tijdstippen van de kijkdagen en de verkoopdagen.

      3 Bij periodieke openbare verkopingen op een vaste locatie volstaat, in afwijking van het tweede lid, een melding
      van de tijdstippen, bedoeld in het tweede lid, onder d, en van eventuele veranderingen van die tijdstippen of van
      de verkooplocatie.

      4 Het derde lid is van overeenkomstige toepassing op de verkopingen of dagelijkse verkoop door een pandhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0042284#Artikel36
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel35
