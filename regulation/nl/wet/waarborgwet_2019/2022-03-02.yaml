    text: |-
      1 De krachtens [artikel 36, eerste lid][ref1], aangewezen ambtenaren zijn bevoegd om, met medeneming van de
      benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.

      2 De krachtens [artikel 36, eerste lid][ref2], aangewezen ambtenaren oefenen de in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref3] genoemde bevoegdheden zo nodig uit met behulp van de sterke
      arm.


