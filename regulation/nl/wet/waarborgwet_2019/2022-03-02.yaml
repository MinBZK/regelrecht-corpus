preamble:
  text: |-
    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Waarborgwet 1986 inhoudelijk op enkele punten te
    wijzigen en wetgevingstechnisch in zijn geheel te moderniseren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *deel:* te onderscheiden bestanddeel of onderdeel van een voorwerp met dien verstande dat een legering van
      edelmetaal als één deel wordt beschouwd;
        - *edelmetaal:* platina, goud, palladium of zilver;
        - *edelmetalen voorwerp:* sieraad, edelsmidswerk, uurwerk of ander object dat geheel of gedeeltelijk van edelmetaal
      of van een legering van edelmetaal is vervaardigd;
        - *gehalte:* hoeveelheid van een bepaald edelmetaal uitgedrukt in duizendsten van de totale massa van de betrokken
      legering;
        - *gehalteproef:* onderzoek van een voorwerp op het gehalte aan edelmetaal;
        - *gehaltemerk:* gehaltemerk dat ingevolge wettelijke voorschriften bestemd is of op enig tijdstip bestemd is
      geweest om het gehalte van platina, gouden, palladium of zilveren voorwerpen te waarborgen;
        - *gouden voorwerp:* edelmetalen voorwerp met een gehalte aan goud dat niet lager is dan 585 duizendsten;
        - *Kaderwet:* [Kaderwet zelfstandige bestuursorganen][ref1];
        - *legering van edelmetaal:* vaste stof die bestaat uit een mengsel van ten minste één edelmetaal met andere
      metalen of elementen;
        - *nationale accreditatie-instantie:* nationale accreditatie-instantie als bedoeld in artikel 4 van de verordening
      (EG) nr. 765/2008 van het Europees Parlement en de Raad van de Europese Unie van 9 juli 2008 tot vaststelling
      van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van
      Verordening (EG) nr. 339/93 (PbEU 2008, L 218);
        - *ondernemer:* degene die 1°. in de uitoefening van een beroep of bedrijf edelmetalen voorwerpen vervaardigt,
      bewerkt, doet vervaardigen of bewerken, uitgezonderd degene die in loondienst deze voorwerpen vervaardigt of
      bewerkt; 2°. in de uitoefening van een beroep of bedrijf handel drijft met edelmetalen voorwerpen, waarbij onder
      handel drijven mede wordt verstaan actief bemiddelen bij het tot stand brengen van overeenkomsten van koop en
      verkoop van die voorwerpen;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *palladium voorwerp:* edelmetalen voorwerp met een gehalte aan palladium dat niet lager is dan 500 duizendsten;
        - *platina voorwerp:* edelmetalen voorwerp met een gehalte aan platina dat niet lager is dan 850 duizendsten;
        - *verantwoordelijkheidsteken:* het ingevolge wettelijke voorschriften als zodanig geregistreerde merk van de
      ondernemer die het edelmetalen voorwerp heeft vervaardigd of bewerkt dan wel van de ondernemer voor wie het
      voorwerp is bestemd;
        - *Verdrag:* op 15 november 1972 te Wenen tot stand gekomen Verdrag inzake het onderzoek en de stempeling van
      edelmetalen werken (Trb. 1991, 16);
        - *waarborgen:* onderzoeken en bepalen van het gehalte aan edelmetaal van een voorwerp en het aanbrengen van het
      daarbij passende gehaltemerk op dat voorwerp;
        - *waarborginstelling:* krachtens [artikel 4, eerste lid][ref2], door Onze Minister aangewezen rechtspersoon;
        - *zilveren voorwerp:* edelmetalen voorwerp met een gehalte aan zilver dat niet lager is dan 800 duizendsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0042284#Artikel4
