  - number: '39'
    text: |-
      Een waarborginstelling verstrekt een krachtens [artikel 36, eerste lid][ref1], aangewezen ambtenaar desgevraagd de
      gegevens en inlichtingen en verschaft hem desgevraagd inzage in de gegevens en bescheiden die redelijkerwijze nodig
      zijn voor de uitvoering van het in artikel 36, eerste lid, bedoelde toezicht op de naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel36
