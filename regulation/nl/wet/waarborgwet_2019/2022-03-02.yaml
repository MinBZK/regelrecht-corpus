  - number: '36'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij en krachtens de [artikelen 2][ref1] en
      [40, eerste lid][ref2], [hoofdstuk 4][ref3] en [hoofdstuk 5][ref4] zijn belast de bij besluit van Onze Minister
      aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


