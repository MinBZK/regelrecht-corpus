  - number: '4'
    text: |-
      1 Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben om overeenkomstig het bij of krachtens
      deze wet bepaalde:

      a. aangeboden voorwerpen te waarborgen op hun gehalte aan platina, goud, palladium of zilver;

      b. ter waarborging aangeboden platina, gouden, palladium of zilveren voorwerpen te voorzien van andere merken,
      indien dat voortvloeit uit het bepaalde bij en krachtens deze wet.

      2 Onze Minister wijst uitsluitend een rechtspersoon aan indien naar zijn oordeel bij en door de betrokken
      rechtspersoon is verzekerd dat de rechtspersoon de in het eerste lid bedoelde taken naar behoren en op deskundige
      en onafhankelijke wijze zal vervullen.

      3 Een waarborginstelling beschikt over een accreditatie van de Stichting Raad voor Accreditatie, genoemd in
      [artikel 2, eerste lid, van de Wet aanwijzing nationale accreditatie-instantie][ref1], of van een andere nationale
      accreditatie-instantie die het vertrouwen rechtvaardigt dat de waarborginstelling haar taken vervult overeenkomstig
      de eisen, bedoeld in het tweede lid. Bij ministeriële regeling worden nadere regels gesteld over de normen waarop
      wordt geaccrediteerd.

      4 Onze Minister kan een besluit tot aanwijzing schorsen of intrekken, indien de betrokken waarborginstelling daarom
      verzoekt, dan wel indien zij een of meer van de in het eerste lid bedoelde taken naar het oordeel van Onze Minister
      niet naar behoren vervult of niet meer voldoet aan de bij of krachtens het tweede en derde lid gestelde eisen. Een
      besluit tot schorsing kan betrekking hebben op één of meer van de in het eerste lid genoemde taken.

      5 Aan een schorsing kunnen voorschriften worden verbonden.

      6 [Artikel 10:44 van de Algemene wet bestuursrecht][ref2] is van toepassing op een besluit tot schorsing als
      bedoeld in het vierde lid.

      7 Onze Minister doet van een besluit tot aanwijzing als bedoeld in het eerste lid en van een besluit tot schorsing
      of intrekking van een aanwijzing mededeling in de Staatscourant.

      8 Indien er sprake is van meerdere waarborginstellingen, kan Onze Minister regels stellen ter coördinatie van de
      uitvoering van de door waarborginstellingen op grond van het bepaalde bij of krachtens deze wet te verrichten taken
      en werkzaamheden.

      9 De vaststelling of wijziging van de statuten van een waarborginstelling behoeft de goedkeuring van Onze Minister.
      Onze Minister kan de goedkeuring uitsluitend onthouden, indien de statuten na de vaststelling of wijziging naar
      zijn oordeel onvoldoende zouden zijn afgestemd op de in het eerste en tweede lid bedoelde taken en eisen.

      10 De [Kaderwet][ref3] is van toepassing op waarborginstellingen met inbegrip van de
      [artikelen 26 tot en met 32][ref4], [34][ref5] en [35, eerste lid, van die wet][ref6].
      [Artikel 22 van de Kaderwet][ref7] is niet van toepassing.

      11 In aanvulling op [artikel 27 van de Kaderwet][ref8] dient een waarborginstelling in de begroting tevens
      expliciet inzicht te bieden in aspecten die van belang zijn voor de continuïteit van de waarborginstelling.

      12 De jaarrekening, bedoeld in [artikel 35, eerste lid, van de Kaderwet][ref9] gaat vergezeld van
      een verklaring omtrent de getrouwheid van de rechtmatige inning en besteding van de middelen voor de
      wettelijke taken, afgegeven door een door de waarborginstelling aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref10]. Artikel 35, tweede lid, tweede volzin, van
      de Kaderwet is van toepassing.

      13 De accountant, bedoeld in het twaalfde lid, doet bij de jaarrekening verslag van zijn bevindingen ten aanzien
      van de wijze waarop de waarborginstelling rekening houdt met de aspecten die van belang zijn voor de continuïteit
      van de waarborginstelling, bedoeld in het elfde lid. Onze Minister kan bepalen dat de jaarrekening tevens vergezeld
      gaat van een verslag van de accountant van zijn bevindingen over de vraag of het beheer en de organisatie van de
      waarborginstelling voldoen aan de eisen van doelmatigheid.


