  - number: '32'
    text: |-
      1 Het is een ondernemer verboden op platina, gouden of zilveren voorwerpen lijkende voorwerpen samen met
      gewaarborgde platina, gouden of zilveren voorwerpen onder de aandacht van het publiek te brengen, tenzij
      eerstgenoemde voorwerpen op duidelijke wijze van de andere zijn onderscheiden.

      2 Het is een ondernemer verboden op platina, gouden of zilveren voorwerpen lijkende voorwerpen samen met platina,
      gouden of zilveren voorwerpen die op grond van het bepaalde bij of krachtens deze wet niet behoeven te worden
      gewaarborgd, onder de aandacht van het publiek te brengen, tenzij eerstgenoemde voorwerpen op duidelijke wijze van
      de andere zijn onderscheiden.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel32
  - number: '33'
    text: |-
      1 Het is een ondernemer verboden om een ander voorwerp onder de aandacht van het publiek te brengen met
      gebruikmaking van de woorden edelmetaal, platina, goud of zilver, of op zodanige andere wijze dat daaruit
      redelijkerwijs kan worden afgeleid dat het gaat om een platina, gouden of zilveren voorwerp, dan een voorwerp dat:

      a. ten minste voldoet aan het op grond van [artikel 7, eerste lid][ref1], voor het desbetreffende edelmetaal
      geldende laagste gehalte; en

      b. in geval van een voorwerp als bedoeld in [artikel 16, eerste lid][ref2], of [artikel 17, eerste lid][ref3],
      met een opperlaag van dat edelmetaal: die opperlaag overeenkomstig de bij ministeriële regeling gestelde eisen
      gewaarborgd is op ten minste het op grond van [artikel 7, eerste lid][ref4], voor dat edelmetaal geldende laagste
      gehalte.

      2 Onverminderd het eerste lid, is het een ondernemer verboden om een voorwerp als bedoeld in
      [artikel 16, eerste lid][ref5], of [artikel 17, eerste lid][ref6], onder de aandacht van het publiek te brengen
      indien niet duidelijk kenbaar is dat het een voorwerp betreft als bedoeld in artikel 16, eerste lid, of artikel 17,
      eerste lid.


