  - number: '7'
    text: |-
      1 Het laagste gehalte dat door een gehaltemerk wordt gewaarborgd, is:

      a. voor platina voorwerpen: 850 duizendsten;

      b. voor gouden voorwerpen: 585 duizendsten;

      c. voor zilveren voorwerpen: 800 duizendsten.

      2 Hogere gehalten die door een gehaltemerk worden gewaarborgd, worden vastgesteld bij ministeriële regeling.

      3 Platina, gouden en zilveren voorwerpen die in voltooide staat worden aangeboden en waarvan naar het oordeel van
      een waarborginstelling het gehalte niet met voldoende zekerheid kan worden vastgesteld zonder beschadiging van
      het desbetreffende voorwerp, worden, met inachtneming van een gehaltespeling van ten hoogste twintig duizendsten,
      gewaarborgd op de in het eerste lid genoemde of krachtens het tweede lid vastgestelde gehalten met anders
      vormgegeven gehaltemerken dan de gehaltemerken die worden gebruikt indien het gehalte met voldoende zekerheid kan
      worden vastgesteld.

      4 Bij ministeriële regeling worden de gehaltemerken vastgesteld en nadere regels gesteld over het gebruik ervan.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel7
  - number: '8'
    text: |-
      1 Behalve van het gehaltemerk, voorziet een waarborginstelling ter waarborging aangeboden gouden, zilveren en
      platina voorwerpen tevens van het verantwoordelijkheidsteken, indien een dergelijk merk nog ontbreekt op het
      voorwerp.

      2 Op verzoek van de aanbieder voorziet een waarborginstelling een ter waarborging aangeboden gouden, zilveren of
      platina voorwerp tevens van:

      a. het jaarlettermerk;

      b. het merk van de betrokken waarborginstelling.

      3 Bij ministeriële regeling worden de merken, bedoeld in het eerste en tweede lid, vastgesteld en kunnen regels
      worden gesteld over het gebruik ervan.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel8
  - number: '9'
    text: |-
      1 Voor registratie als verantwoordelijkheidsteken behoeft een ontwerpverantwoordelijkheidsteken de goedkeuring van
      een waarborginstelling.

      2 Een waarborginstelling geeft een beschikking omtrent goedkeuring op aanvraag van de betrokken ondernemer.

      3 De waarborginstelling onthoudt haar goedkeuring indien:

      a. het verantwoordelijkheidsteken niet meerdere letters bevat; of

      b. het verantwoordelijkheidsteken gelijk is aan dat van een andere ondernemer.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel9
  - number: '10'
    text: |-
      1 Na de goedkeuring, bedoeld in [artikel 9, eerste lid][ref1], wordt het goedgekeurde teken opgenomen in het
      register van verantwoordelijkheidstekens.

      2 Het register wordt beheerd door Onze Minister of een daartoe door Onze Minister aangewezen waarborginstelling.

      3 Indien de goedkeurende waarborginstelling niet de beheerder is van het register, zendt zij het goedgekeurde teken
      zo spoedig mogelijk ter registratie aan de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel9
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel10
