        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '31'
    text: |-
      1 Het is een ondernemer verboden een voorwerp dat op grond van het bepaalde bij of krachtens deze wet niet behoeft
      te worden gewaarborgd, in de handel te brengen als platina, gouden of zilveren voorwerp indien dat voorwerp niet
      ten minste voldoet aan het op grond van [artikel 7, eerste lid][ref1], voor het desbetreffende edelmetaal geldende
      laagste gehalte.

      2 Onverminderd het eerste lid, is het een ondernemer verboden een voorwerp als bedoeld in
      [artikel 16, eerste lid][ref2], of [artikel 17, eerste lid][ref3], in de handel te brengen als platina, gouden
      of zilveren voorwerp indien dat voorwerp voorzien is van een opperlaag van dat edelmetaal en die opperlaag
      niet overeenkomstig de bij ministeriële regeling gestelde eisen gewaarborgd is op ten minste het op grond van
      [artikel 7, eerste lid][ref4], voor dat edelmetaal geldende laagste gehalte.

      3 Onverminderd het eerste en tweede lid, is het een ondernemer verboden een voorwerp als bedoeld in
      [artikel 16, eerste lid][ref5], of [artikel 17, eerste lid][ref6], in de handel te brengen indien niet duidelijk
      kenbaar is dat het een voorwerp betreft als bedoeld in artikel 16, eerste lid, of artikel 17, eerste lid.


