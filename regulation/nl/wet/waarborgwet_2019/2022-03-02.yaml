  - number: '2'
    text: |-
      1 Een ondernemer is verplicht een platina, gouden of zilveren voorwerp te laten waarborgen voordat het in Nederland
      in de handel wordt gebracht, tenzij het voorwerp reeds beschikt over een gehaltemerk.

      2 Bij algemene maatregel van bestuur wordt vastgesteld beneden welke massa aan platina, goud of zilver een voorwerp
      niet behoeft te worden gewaarborgd. Voor de verschillende edelmetalen kan die ondergrens verschillend worden
      vastgesteld.

      3 Bij ministeriële regeling wordt geregeld welke categorieën van voorwerpen zijn uitgezonderd van de verplichting,
      bedoeld in het eerste lid.

      4 De verplichting, bedoeld in het eerste lid, is mede van toepassing op een voorwerp waarvan het reeds aangebrachte
      gehaltemerk niet langer leesbaar is.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel2
  - number: '3'
    text: |-
      Met de waarborging, vereist op grond van [artikel 2, eerste lid][ref1], wordt gelijkgesteld de waarborging door
      een onafhankelijke waarborginstelling in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, mits het desbetreffende gehaltemerk op grond van aldaar geldende wettelijke voorschriften wordt
      erkend en de waarborging een beschermingsniveau biedt dat ten minste gelijkwaardig is aan het niveau dat met de
      nationale waarborging wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel2
