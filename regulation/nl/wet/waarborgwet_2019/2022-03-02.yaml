    text: |-
      Onze Minister kan in geval van overtreding van het bepaalde bij of krachtens de [artikelen 2][ref1] of
      [40, eerste lid][ref2], of van de [hoofdstukken 4][ref3] of [5][ref4], aan de overtreder een last onder dwangsom
      opleggen.


