  - number: '6'
    text: |-
      1 Met het oog op de goedkeuring, bedoeld in [artikel 29, eerste lid, van de Kaderwet][ref1], zendt een
      waarborginstelling jaarlijks voor 1 oktober de door haar vastgestelde begroting aan Onze Minister.

      2 Indien de begroting van een waarborginstelling niet is goedgekeurd voor aanvang van het kalenderjaar waarop de
      begroting betrekking heeft, kan Onze Minister de betreffende waarborginstelling machtigen uitgaven te doen uit die
      posten waartegen hij geen bedenking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel6
