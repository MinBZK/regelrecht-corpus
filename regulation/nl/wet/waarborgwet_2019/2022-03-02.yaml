        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '15'
    text: |-
      Indien het gehalte aan een bepaald edelmetaal niet in het hele voorwerp gelijk is, wordt voor het waarborgen van
      dat voorwerp uitgegaan van het aangetroffen laagste gehalte.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel15
  - number: '16'
    text: |-
      1 Indien een voorwerp bestaat uit delen van verschillende edelmetalen worden die delen, met uitzondering van
      palladium delen, afzonderlijk gewaarborgd, mits het voorwerp voldoet aan bij ministeriële regeling te stellen
      eisen.

      2 Bij ministeriële regeling worden nadere regels gesteld over het afzonderlijk waarborgen, bedoeld in het eerste
      lid.

      3 Bij ministeriële regeling worden regels gesteld over het waarborgen van voorwerpen als bedoeld in het eerste lid,
      die niet voldoen aan de in dat lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel16
  - number: '17'
    text: |-
      1 Indien een voorwerp bestaat uit delen van goud, zilver of platina en uit delen van andere stoffen, worden de
      edelmetalen delen afzonderlijk gewaarborgd, mits het voorwerp voldoet aan bij ministeriële regeling te stellen
      eisen.

      2 [Artikel 16, tweede en derde lid][ref1], is van toepassing.

      3 Bij ministeriële regeling kunnen regels worden gesteld over het aanbrengen van andere aanduidingen op voorwerpen
      als bedoeld in het eerste lid. [Artikel 12][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0042284#Artikel12
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042284
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '18'
    text: |-
      1 Indien een partij platina, gouden, zilveren of palladium voorwerpen ter waarborging wordt aangeboden en het
      borderel vermeldt dat de voorwerpen in de partij telkens beschikken over hetzelfde gehalte aan edelmetaal, toetst
      de waarborginstelling de homogeniteit van het gehalte aan edelmetaal van de voorwerpen in die partij door middel
      van een bij of krachtens het Verdrag toegestane onderzoeksmethode.

      2 Onderdeel 4 van Bijlage II van het Verdrag is van toepassing.

      3 Indien de in het eerste lid bedoelde toets uitwijst dat de partij homogeen is, hoeft de waarborginstelling niet
      elk afzonderlijk voorwerp van die partij aan een gehalteproef te onderwerpen voordat zij de voorwerpen van die
      partij van het betreffende gehaltemerk voorziet.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel18
  - number: '19'
    text: |-
      Een waarborginstelling besluit het uitvoeren van een gehalteproef te weigeren, indien:

      a. het aangeboden voorwerp naar haar oordeel niet tot een staat van voltooiing is gebracht die zowel tegen een
      verandering van zijn oorspronkelijke bestemming als tegen een beschadiging van stempelmerken bij verdere bewerking
      beschermt;

      b. het aangeboden voorwerp niet vergezeld gaat van een ondertekend borderel dat opgave doet van metaalsoort, aantal
      aangeboden voorwerpen, gewicht en, zo mogelijk, gehalte;

      c. het aangeboden voorwerp naar haar oordeel ten onrechte niet is voorzien van een verlengstuk voor het uitvoeren
      van de gehalteproef;

      d. het vermoeden, bedoeld in [artikel 24, eerste lid][ref1], juist blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel24
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '20'
    text: |-
      Een waarborginstelling kan besluiten het voor de gehalteproef benodigde metaal te ontnemen aan het voorwerp zelf en
      niet aan het verlengstuk, bedoeld in [artikel 19, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel19
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '21'
    text: |-
      Voor het borderel, bedoeld in [artikel 19, onder b][ref1], wordt gebruik gemaakt van een door de betrokken
      waarborginstelling vastgesteld en tegen kostprijs ter beschikking gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel19
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22'
    text: |-
      1 Indien uit een gehalteproef blijkt dat het gehalte aan edelmetaal van een voorwerp lager is dan het gehalte dat
      in het desbetreffende borderel is opgegeven, verricht de betrokken waarborginstelling op verzoek van de aanbieder
      een tweede gehalteproef.

      2 Indien de tweede gehalteproef het op het borderel opgegeven gehalte bevestigt, is de aanbieder geen vergoeding
      verschuldigd voor de eerste gehalteproef.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel22
  - number: '23'
    text: |-
      1 Holle voorwerpen, draad- en knopwerk en alle andere voorwerpen waarvan het gehalte niet op reguliere wijze kan
      worden onderzocht, onderzoekt de betrokken waarborginstelling door samensmelting van een of meerdere voorwerpen van
      de betreffende aangeboden partij.

      2 Indien het onderzoek de juistheid van het op het borderel opgegeven gehalte bevestigt, vergoedt de betrokken
      waarborginstelling het maakloon van de aangeboden voorwerpen die zijn samengesmolten.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel23
  - number: '24'
    text: |-
      1 Indien een waarborginstelling vermoedt dat een ter waarborging aangeboden platina, gouden of zilveren voorwerp in
      afwijking van de opgave op het borderel met ijzer, koper, hars of enige andere stof is opgevuld of op bedekte wijze
      met soldeersel is overladen, is zij bevoegd dat voorwerp door te snijden.

      2 De doorsnijding geschiedt in aanwezigheid van de aanbieder, tenzij deze te kennen heeft gegeven niet aanwezig te
      willen zijn.

      3 Indien het vermoeden van de waarborginstelling onjuist blijkt, vergoedt de waarborginstelling het maakloon van
      het aangeboden voorwerp dat is doorgesneden.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel24
  - number: '25'
    text: |-
      Na de gehalteproef wordt elk stukje platina, goud of zilver dat voor die proef bestemd was, teruggegeven aan de
      aanbieder, tenzij de waarde ervan verwaarloosbaar is.
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel25
  - number: '26'
    text: |-
      Op verzoek van de aanbieder waarborgt een waarborginstelling palladium voorwerpen, voorwerpen met een gehalte aan
      goud onder 585 duizendsten en boven of gelijk aan 375 duizendsten en, in afwijking van [artikel 2][ref1] en de
      [paragrafen 2.3][ref2] en [2.4][ref3], platina, gouden en zilveren voorwerpen overeenkomstig het bij of krachtens
      dit hoofdstuk bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0042284#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0042284#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0042284/2022-03-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
