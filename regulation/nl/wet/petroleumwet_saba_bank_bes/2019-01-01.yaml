articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: - *Saba Bank* het onder de
      Caraïbische Zee in de nabijheid van het eiland Saba gelegen deel van de zeebodem en de ondergrond daarvan, waarop
      het Koninkrijk der Nederlanden mede overeenkomstig het op 10 december 1982 te Montego-Bay gesloten Verdrag inzake
      het recht van de zee (Trb. 1983, 83) soevereine rechten heeft en hetwelk aangegeven is op de bij deze wet als
      [bijlage I][ref1] gevoegde kaart en in [bijlage II][ref2] bij deze wet nader is omschreven.
        - *Petroleum:* aardolie en aardgas.
        - *Aardolie:* ruwe minerale olie, condensaat, asfalt, ozokeriet en alle soorten koolwaterstoffen, zwavel en
      bitumina, in vaste en in vloeibare vorm, in hun natuurlijke staat of verkregen uit aardgas door condensatie of
      extractie.
        - *Aardgas:* alle gasvormige koolwaterstoffen geproduceerd uit een put, inbegrepen nat aardgas, droog aardgas,
      puthoofdgas en residuëel gas, overblijvende na de extractie van vloeibare koolwaterstoffen uit nat gas, en gas niet
      bestaande uit koolwaterstoffen voorkomend in natuurlijke associatie met gasvormige of vloeibare koolwaterstoffen.
        - *Vat:* een hoeveelheid of eenheid olie gelijk aan tweeënveertig (42) Amerikaanse Gallon bij een temperatuur van
      60 graden Fahrenheit (60°F).
        - *Petroleuminstallatie:* a) een in, op of boven de Saba Bank geplaatste inrichting voor het onderzoek naar en
      de winning van petroleum; b) een samenstel van inrichtingen waarvan er tenminste één aan de onder a) gegeven
      omschrijving voldoet.
        - *Mijnraad:* de raad bedoeld in [artikel 9][ref3].
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat.
        - *Inspectie-ambtenaren:* de ambtenaren aangewezen krachtens [artikel 10, eerste lid][ref4].
        - *Rijk:* Nederland en Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028163
      [ref2]: https://wetten.overheid.nl/BWBR0028163
      [ref3]: https://wetten.overheid.nl/BWBR0028163#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0028163#Artikel10
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028163
      - id: ref2
        bwb_id: BWBR0028163
