        artikel: '10'
  - number: '1.2'
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op de Saba Bank en binnen de daarboven gelegen
      exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel1
  - number: '2.1'
    text: De in of op de Saba Bank aanwezige petroleum is eigendom van de het Rijk.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel2
  - number: '2.2'
    text: |-
      De eigendom van deze petroleum gaat door de winning over op de in [artikel 3][ref1] genoemde naamloze vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel3
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '3'
  - number: '3.1'
    text: |-
      De naamloze vennootschap Saba Bank Resources N.V., gevestigd op Saba, heeft het exclusieve recht op het onderzoek
      naar- en de winning van petroleum in of op Saba Bank, behoudens het bepaalde in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel6
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '6'
  - number: '3.2'
    text: De aandelen van Saba Bank Resources N.V. kunnen slechts gehouden worden door het Rijk.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel3
  - number: '4.1'
    text: |-
      Saba Bank Resources N.V. is gerechtigd om, indien en voorzover zij zulks noodzakelijk oordeelt, met betrekking tot
      het onderzoek naar- en de winning van petroleum in of op de Saba Bank overeenkomsten met derden aan te gaan, welke
      alvorens in werking te kunnen treden de goedkeuring behoeven van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel4
  - number: '4.2'
    text: |-
      Ingeval een overeenkomst als bedoeld in het eerste lid betrekking heeft op onderzoek met gebruikmaking van boringen
      en op winning van petroleum, verleent Onze Minister zijn goedkeuring slechts indien de overeenkomst wordt aangegaan
      met een of meer volgens het recht van Bonaire, Sint Eustatius en Saba opgerichte en aldaar gevestigde naamloze
      vennootschappen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur, worden, de Mijnraad gehoord, regelen gesteld betreffende het aangaan van de in
      [artikel 4, eerste lid][ref1] bedoelde overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur, worden, de Mijnraad gehoord, nadere regelen gesteld met betrekking tot het
      onderzoek naar- en de winning van petroleum in, op of boven de Saba Bank. De in de vorige volzin bedoelde algemene
      maatregel van bestuur, dient in ieder geval bepalingen te bevatten:
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.a)
    text: |-
      ter bescherming van en controle op de ontwikkeling van de levende en niet-levende natuurlijke rijkdommen, waaronder
      petroleum.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.b)
    text: ter voorkoming van verontreiniging van het milieu.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.c)
    text: |-
      ten behoeve van de scheepvaart, de luchtvaart, de visserij, het zuiver wetenschappelijk onderzoek, het leggen en
      onderhouden van onderzeese kabels en pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.d)
    text: |-
      omtrent de arbeid en in het belang van de gezondheid van de personen, die bij het onderzoek naar- en de winning van
      petroleum betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.e)
    text: in het belang van de veiligheid van personen en goederen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.f)
    text: ter bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.g)
    text: omtrent het gebruik van electromagnetische golven.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.2.h)
    text: |-
      ten behoeve van andere in het volkenrecht erkende belangen, waaronder verplichtingen voortvloeiende uit
      internationale overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de in het eerste en tweede lid bedoelde algemene maatregel van bestuur kan worden bepaald, dat Onze Minister
      en de Ministers wie het mede aangaat daarbij omschreven bevoegdheden hebben ter uitvoering van daarbij aangewezen
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur kan voorts aan Onze Minister de bevoegdheid worden
      toegekend, om in gevallen waarin ernstige aantasting van de in het tweede lid bedoelde belangen ontstaat of dreigt
      te ontstaan:
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.4.a)
    text: maatregelen voor te schrijven ten aanzien van het onderzoek naar- en de winning van petroleum;
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.4.b)
    text: deze werkzaamheden te doen staken, zolang de voorgeschreven maatregelen niet zijn getroffen;
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: 5.4.c)
    text: de voorgeschreven maatregelen op kosten van de nalatige te doen verrichten.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister kan op daartoe strekkend verzoek, na overleg met Saba Bank Resources N.V. en in overeenstemming met
      Onze Minister van Onderwijs, Cultuur en Wetenschap aan derden vergunning verlenen tot het instellen van een zuiver
      wetenschappelijk onderzoek in, op of boven de Saba Bank.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel6
  - number: '6.2'
    text: Onze Minister kan, de Mijnraad gehoord, aan de in het eerste lid bedoelde vergunning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel6
  - number: '7.1'
    text: |-
      Saba Bank Resources N.V. is in verband met het in [artikel 3, eerste lid][ref1], aan haar verleende recht, een
      heffing verschuldigd aan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel3
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '3'
  - number: '7.2'
    text: |-
      De grondslag van deze heffing is het aantal vaten aardolie, dat gemiddeld per dag door Saba Bank Resources N.V. en/
      of elke derde, waarmede een overeenkomst als bedoeld in [artikel 4, eerste lid][ref1], is aangegaan, afzonderlijk
      wordt geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '7.3'
    text: |-
      Deze heffing bedraagt, indien het volume van de gemiddelde dagproduktie als bedoeld in lid 2 niet meer dan 24 999
      vaten beloopt, 12½ ten honderd van het gemiddelde dagvolume. Beloopt de gemiddelde dagproduktie als bedoeld in lid
      2 meer dan 24 999 doch niet meer dan 74 999 vaten, dan bedraagt deze heffing 3125 vaten per dag benevens 25 ten
      honderd van het gemiddelde dagvolume dat 24 999 vaten te boven gaat. Beloopt de gemiddelde dagproduktie als bedoeld
      in lid 2 meer dan 74 999 doch niet meer dan 199 999 vaten, dan bedraagt deze heffing 15 625 vaten per dag benevens
      35 ten honderd van het gemiddelde dagvolume dat 74 999 vaten te boven gaat. Beloopt de gemiddelde dagproduktie
      als bedoeld in lid 2 meer dan 199 999 doch niet meer dan 299 999 vaten, dan bedraagt deze heffing 59 375 vaten per
      dag benevens 37½ ten honderd van het gemiddelde dagvolume dat 199 999 vaten te boven gaat. Beloopt de gemiddelde
      dagproduktie als bedoeld in lid 2 meer dan 299 999 vaten, dan bedraagt deze heffing 96 875 vaten per dag benevens
      40 ten honderd van het gemiddelde dagvolume dat 299 999 vaten te boven gaat.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
  - number: '7.4'
    text: |-
      Voor de toepassing van het in lid 3 genoemde tarief van de heffing wordt het volume van de gemiddelde dagproduktie
      als bedoeld in lid 2 berekend aan het eind van iedere kalendermaand aan de hand van de in de voorafgaande maand
      behaalde werkelijke dagproduktie. Deze berekening is de basis voor de afrekening van de heffing met het Rijk in de
      daaropvolgende kalendermaand.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij algemene maatregel van bestuur, kan de omrekening van de krachtens dit artikel verschuldigde vaten aardolie
      naar de tegenwaarde in USD worden geregeld.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
  - number: '7.6'
    text: |-
      De leden 2 tot en met 5 zijn van overeenkomstige toepassing op aardgas, met dien verstande dat bij algemene
      maatregel van bestuur, een omrekeningsformule wordt vastgesteld krachtens welke een verband wordt gelegd tussen
      gewonnen aardgas en vaten aardolie op basis van de geldende relatieve waarden van aardgas en aardolie bij de bron.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
  - number: '7.7'
    text: |-
      De gelden welke uit hoofde van de in het eerste lid bedoelde heffing aan het Rijk verschuldigd zijn, worden door de
      zorg van Onze Minister van Financiën gestort in een bij landsbesluit aan te wijzen dan wel bij algemene maatregel
      van bestuur, op te richten fonds ten behoeve van de economische ontwikkeling van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel7
  - number: '8.1'
    text: |-
      Derden waarmede een overeenkomst tot winning van petroleum als bedoeld in [artikel 4, eerste lid][ref1], is
      aangegaan, zijn belasting verschuldigd op hun belastbare winst als omschreven in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '8.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder belastbare winst verstaan dat bedrag dat een derde, waarmede een
      overeenkomst tot winning van petroleum als bedoeld in [artikel 4, eerste lid][ref1], is aangegaan, jaarlijks
      verkrijgt door verkoop van de hoeveelheid aardolie welke aan deze derde krachtens bedoelde overeenkomst in natura
      is toegewezen, verminderd met de kosten tot verwerving, inning en behoud der inkomsten. Deze kosten mogen niet meer
      belopen dan een bedrag, welke voor analoge transacties tussen derden als redelijk kan worden aangemerkt en zullen
      het bij bovenbedoelde overeenkomst vastgestelde percentage niet kunnen overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '8.3'
    text: |-
      Indien en voorzover een overeenkomst tot winning van petroleum als bedoeld in [artikel 4, eerste lid][ref1],
      voorziet in betaling door Saba Bank Resources N.V. van de belasting, als bedoeld in dit artikel, wordt de
      belastbare winst verhoogd met een bedrag gelijk aan de door Saba Bank Resources N.V. te betalen winstbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '8.4'
    text: |-
      Onverkort het bepaalde in het tweede lid, worden kosten die het in dat lid bedoelde percentage overtreffen,
      toegevoegd aan de kosten van een volgend jaar.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
  - number: '8.5'
    text: |-
      Bij algemene maatregel van bestuur, kan de omrekening van de hoeveelheid aardolie bedoeld in het tweede lid naar de
      tegenwaarde in USD worden geregeld.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
  - number: '8.6'
    text: |-
      De door een derde waarmede een overeenkomst tot winning van petroleum als bedoeld in [artikel 4, eerste lid][ref1],
      is aangegaan, verschuldigde winstbelasting bedraagt dertig ten honderd van de belastbare winst, indien er vanwege
      het Rijk geen opcentenheffing plaats vindt. De verschuldigde winstbelasting, wordt ingeval van opcenten-heffing
      vanwege het Rijk zodanig bepaald, dat de winstbelasting en de opcenten tezamen dertig ten honderd van de belastbare
      winst bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '8.7'
    text: |-
      Voor de duur van een overeenkomst tot winning van petroleum als bedoeld in [artikel 4, eerste lid][ref1], wordt
      door het Rijk geen hogere belasting dan bedoeld in het zesde lid van dit artikel geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel4
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '4'
  - number: '8.8'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing op aardgas, met dien verstande dat bij algemene maatregel
      van bestuur, een omrekeningsformule wordt vastgesteld krachtens welke een verband wordt gelegd tussen gewonnen
      aardgas en vaten aardolie op basis van de geldende relatieve waarden van aardgas en aardolie bij de bron.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
  - number: '8.9'
    text: |-
      Voorzover daarvan in dit artikel niet uitdrukkelijk is afgeweken, blijven de bepalingen van hoofdstuk IV van
      de Belastingwet BES van toepassing. De winst, behaald uit andere hoofde dan met de aktiviteiten welke specifiek
      omschreven zijn in bovenbedoelde overeenkomst, blijft onderworpen aan de bepalingen van voornoemde wet.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel8
  - number: '9.1'
    text: Er is een Mijnraad, welke tot taak heeft Onze Minister te adviseren omtrent de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel9
  - number: '9.2'
    text: |-
      Saba Bank Resources N.V. is verplicht de Mijnraad alle verlangde inlichtingen en gegevens te verschaffen
      betreffende het onderzoek naar- en de winning van petroleum in of op de Saba Bank.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij algemene maatregel van bestuur, worden regelen gesteld betreffende de samenstelling en werkwijze van de
      Mijnraad.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel9
  - number: '9.4'
    text: |-
      De Mijnraad brengt jaarlijks vóór 31 december aan Onze Minister schriftelijk verslag uit omtrent haar
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel9
  - number: '10.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij ministeriële
      regeling aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: '10.2'
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: 10.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: 10.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: 10.2.c
    text: |-
      goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: 10.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: '10.3'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: '10.5'
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel10
  - number: '11.1'
    text: |-
      Hij die opzettelijk zonder vergunning als bedoeld in [artikel 6, eerste lid][ref1], handelt, maakt zich aan een
      misdrijf schuldig en wordt gestraft met gevangenisstraf van ten hoogste zes jaren en geldboete van ten hoogste
      vijfhonderdduizend gulden, hetzij met een van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel6
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '6'
  - number: '11.2'
    text: |-
      Voor zover de handeling als in het eerste lid bedoeld niet opzettelijk is verricht, wordt zij beschouwd als
      overtreding en gestraft met hechtenis van ten hoogste een jaar en geldboete van ten hoogste duizend gulden, hetzij
      met een van deze straffen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel11
  - number: '12.1'
    text: |-
      Overtreding van het bij [artikel 9, lid 2][ref1] en [artikel 10, lid 4][ref2], bepaalde en van krachtens
      [artikel 5][ref3] gestelde regelen en voorschriften, wordt gestraft met hechtenis van ten hoogste een jaar en/of
      geldboete van ten hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028163#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028163#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028163#Artikel5
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028163
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028163
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0028163
        artikel: '5'
  - number: '12.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel12
  - number: '13'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel13
  - number: '14'
    text: |-
      De strafwet van Bonaire, Sint Eustatius en Saba is van toepassing op ieder die zich op een petroleuminstallatie aan
      enig strafbaar feit schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel14
  - number: '15'
    text: |-
      Voor de toepassing van het bij of krachtens [hoofdstuk II van de Douane- en Accijnswet BES][ref1] bepaalde wordt in
      of op de Saba Bank gewonnen petroleum geacht gewonnen te zijn in het binnenland van Bonaire, Sint Eustatius en Saba
      en gedurende het rechtstreekse vervoer naar een der eilanden van Bonaire, Sint Eustatius en Saba in het binnenland
      te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0029236#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0029236
        hoofdstuk: II
  - number: '16'
    text: Deze wet kan worden aangehaald als «Petroleumwet Saba Bank BES».
    url: https://wetten.overheid.nl/BWBR0028163/2019-01-01#Artikel16
