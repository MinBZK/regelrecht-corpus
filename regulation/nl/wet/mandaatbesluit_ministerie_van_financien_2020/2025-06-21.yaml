$id: mandaatbesluit_ministerie_van_financien_2020
regulatory_layer: WET
publication_date: '2026-04-02'
valid_from: '2025-06-21'
bwb_id: BWBR0043022
url: https://wetten.overheid.nl/BWBR0043022/2025-06-21
preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:9 en 10:12 van de Algemene wet bestuursrecht en artikel 4.6, eerste lid, van de
    Comptabiliteitswet 2016.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.a
    text: |-
      *het Ministerie van Financiën:* het kernministerie, de directoraten-generaal Belastingdienst (DGBD), Toeslagen
      (DGTSL) en Douane (DGD) en de inspectie belastingen, toeslagen en douane (IBTD);
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.b
    text: |-
      *het kernministerie:* de Generale Thesaurie, het directoraat-generaal Rijksbegroting, het directoraat-generaal
      Fiscale Zaken en het cluster secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.c
    text: '*de minister:* de Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.d
    text: '*de staatssecretaris:* de Staatssecretaris van Financiën;'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.e
    text: '*bewindspersoon:* de Minister of de Staatssecretaris van Financiën;'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.f
    text: |-
      *algemene leiding:* de secretaris-generaal (SG), de plaatsvervangend secretaris-generaal (pSG), de directeuren-
      generaal (DG), en de thesaurier- generaal (TG);
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.g
    text: '*mandaat:* de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.h
    text: |-
      *volmacht:* volmacht als bedoeld in [artikel 3:60, eerste lid, van het Burgerlijk Wetboek][ref1], om namens de
      Staat der Nederlanden rechtshandelingen te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel60
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '60'
  - number: 1.i
    text: |-
      *medewerker:* de ambtenaar in de zin van de [Ambtenarenwet 2017][ref1] die werkzaam is bij het ministerie;


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 1.j
    text: |-
      *(hoofd)budgethouder:* hoofd van een organisatie-eenheid verantwoordelijk voor het financieel beheer van één of
      meer budgetten;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.k
    text: |-
      *Bedrijfsvoering:* onderwerpen op de terreinen van personeel en organisatie, informatievoorziening en ict, inkoop,
      huisvesting, facilitaire zaken en beveiliging;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.l
    text: |-
      *cao Rijk:* de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren werkzaam binnen de sector
      Rijk;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.m
    text: |-
      de organisatieonderdelen van het DGBD, het DGTSL en het DGD: de organisatieonderdelen genoemd in
      [artikel 3, eerste, tweede en derde lid, van de Uitvoeringsregeling Belastingdienst 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '3'
  - number: 1.n
    text: |-
      de (algemeen) directeuren: de (algemeen) directeuren van de organisatieonderdelen van het DGBD,
      het DGTSL en het DGD genoemd in [artikel 3, eerste, tweede en derde lid][ref1], en bedoeld in
      [artikel 4, vierde lid, van de Uitvoeringsregeling Belastingdienst 2003][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014506#Artikel4
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014506
        artikel: '4'
  - number: 1.o
    text: |-
      Woo-verzoek: een verzoek om informatie op grond van de [Wet open overheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 1.p
    text: |-
      inspecteur: functionaris die als zodanig is aangewezen in
      [artikel 5 van de Uitvoeringsregeling Belastingdienst 2003][ref1] en
      [artikel 1:4 van de Algemene douaneregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel1
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024291
        artikel: '1'
  - number: 1.q
    text: |-
      ontvanger: functionaris die als zodanig is aangewezen in
      [artikel 5 van de Uitvoeringsregeling Belastingdienst 2003][ref1] en
      [artikel 1:4 van de Algemene douaneregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel1
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024291
        artikel: '1'
  - number: 1.r
    text: 'IG: inspecteur-generaal inspectie belastingen, toeslagen en douane;'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.s
    text: |-
      *topstructuur van het Ministerie van Financiën:* de algemene leiding en de directeuren van het kernministerie, de
      IG en de topstructuren van DGBD, DGD en DGTSL;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.t
    text: |-
      *topstructuur DGBD:* de algemene leiding DGBD en de directeuren als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __________________;


      [ref1]: https://wetten.overheid.nl/BWBR0045076#Artikel1
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0045076
        artikel: '1'
  - number: 1.u
    text: |-
      *topstructuur DGD:* de algemene leiding DGD als bedoeld in
      [artikel 1, aanhef en onder i][ref1], en de directeuren als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ______________________________________;


      [ref1]: https://wetten.overheid.nl/BWBR0045076#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0045076#Artikel9
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0045076
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0045076
        artikel: '9'
  - number: 1.v
    text: |-
      *topstructuur DGTSL:* de algemene leiding DGTSL als bedoeld in [artikel 1, aanhef en onder h][ref1],
      de algemeen directeur als bedoeld in [artikel 7a, eerste lid][ref2], de directeuren als bedoeld
      in het eerste lid van de [artikelen 7b tot en met 7g][ref3] en het afdelingshoofd als bedoeld in
      __REF003___________________________________________________________________________________________________________
      _______;


      [ref1]: https://wetten.overheid.nl/BWBR0045076#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0045076#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0045076#Artikel7b
      [ref4]: https://wetten.overheid.nl/BWBR0045076#Artikel7h
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0045076
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0045076
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0045076
        artikel: 7b
      - id: ref4
        bwb_id: BWBR0045076
        artikel: 7h
  - number: 1.w
    text: '*pDGBD:* de plaatsvervangend directeuren-generaal Belastingdienst;'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: 1.x
    text: |-
      *taakverdelingsbesluit:* het laatstelijk vastgestelde besluit van de Minister houdende bekendmaking van de taken
      waarmee de Staatssecretaris van Financiën of Staatssecretarissen van Financiën in het bijzonder is respectievelijk
      zijn belast.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel2
  - number: 2.a
    text: volmacht om in naam van een bewindspersoon privaatrechtelijke rechtshandelingen te verrichten, en
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel2
  - number: 2.b
    text: |-
      machtiging om in naam van een bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel2
  - number: '3.1'
    text: |-
      De SG kan een mandaatbesluit vaststellen voor het ministerie, met inbegrip van de op grond van
      [artikel 11, eerste lid, van het Organisatiebesluit Ministerie van Financiën 2020][ref1] ingestelde tijdelijke
      directoraten-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel11
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '11'
  - number: '3.2'
    text: |-
      De SG stelt, in overeenstemming met de DGBD, de DGTSL en de DGD, een organisatiebesluit en een mandaatbesluit voor
      de directoraten-generaal Belastingdienst, Toeslagen en Douane vast.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel3
  - number: '4.1'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van de tot de verantwoordelijkheid van de
      bewindspersoon behorende aangelegenheden, met uitzondering van de bevoegdheden als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel11
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '11'
        hoofdstuk: '4'
  - number: '4.2'
    text: |-
      De SG en DG’s hebben binnen het kader van de jaarplannen en binnen eventueel door de minister of namens de minister
      door de SG gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken betreffende
      alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de bevoegdheid
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel4
  - number: '4.3'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt: De Minister van Financiën, respectievelijk De
      Staatssecretaris van Financiën – *[aanduiding in overeenstemming met het taakverdelingsbesluit],* namens deze,
      gevolgd door de naam en functie van de (onder)gemandateerde.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel4
  - number: '5.1'
    text: De SG en de DG’s kunnen ieder voor hun werkterrein ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel5
  - number: '5.2'
    text: Directeuren kunnen het aan hen verleende ondermandaat doormandateren.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel5
  - number: '5.3'
    text: In een ondermandaat wordt de omvang ervan aangegeven.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel5
  - number: 5a
    text: |-
      Indien beslissingsbevoegde functionarissen zoals bedoeld in dit besluit in een organisatieonderdeel niet voorkomen,
      behoren de bevoegdheden toe aan de naasthogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel5a
  - number: '6.1'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister. Het mandaatregister bevat de functienamen van de in dit
      besluit gemandateerde, ondergemandateerde en gevolmachtigde functionarissen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel6
  - number: '6.2'
    text: |-
      De directeur Juridische Zaken draagt zorg voor het bijhouden en online publiceren van het mandaatregister.
      Het mandaatregister wordt gepubliceerd op de webpagina van het ministerie van Financiën, te vinden via
      www.rijksoverheid.nl.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel6
  - number: '7.1'
    text: |-
      De SG en DG’s zijn hoofdbudgethouder voor wat betreft hun taken en zijn uit dien hoofde bevoegd verplichtingen –
      met financiële consequenties – aan te gaan en uitgaven goed te keuren binnen hun budgetten.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel7
  - number: '7.2'
    text: De hoofdbudgethouders zijn verantwoordelijk voor een adequaat financieel beheer.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel7
  - number: '8.1'
    text: |-
      Het mandaat van de DG met betrekking tot het aangaan van financiële verplichtingen en het doen van uitgaven is
      beperkt tot het budget dat aan de DG ter beschikking is gesteld op basis van een door de secretaris-generaal en de
      directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor
      het diensthoofd verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel8
  - number: '8.2'
    text: |-
      De SG en DG’s kunnen voor de in [artikel 7][ref1] genoemde bevoegdheden ondermandaat verlenen aan budgethouders. In
      een ondermandaat kan een maximumbedrag worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel7
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '7'
        hoofdstuk: '3'
  - number: '9'
    text: 'Instemming van de directeur Financieel-Economische Zaken is vereist:'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel9
  - number: 9.a
    text: |-
      voor zover voorgenomen besluiten met financiële consequenties niet passen binnen de door de SG vastgestelde
      budgetten;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel9
  - number: 9.b
    text: voor de benoeming van de directeuren control van het DGBD, het DGTSL en het DGD.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel9
  - number: '10'
    text: |-
      Aan de DG is voorbehouden te beslissen over het afwijken van de procedures als bedoeld in de
      [Aanbestedingswet 2012][ref1], alsmede over het toepassen van een uitzonderingsgrond als bedoeld in de
      [artikelen 2.24 tot en met 2.24c van de Aanbestedingswet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032203
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0032203
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
  - number: '11'
    text: 'Aan de bewindspersonen is voorbehouden het afdoen en ondertekenen van stukken:'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.a
    text: gericht aan de Koning;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.b
    text: gericht aan de Raad van State;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.c
    text: gericht aan de ministerraad (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.d
    text: gericht aan de Eerste of Tweede Kamer der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.e
    text: gericht aan de president van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.f
    text: gericht aan de Nationale Ombudsman;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.g
    text: gericht aan autoriteiten in binnen- en buitenland, gelijk of hoger in rang dan een minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: 11.h
    text: zijnde Ministeriële regelingen houdende algemeen verbindende voorschriften.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel11
  - number: '12'
    text: |-
      Onverminderd de overige bepalingen van dit besluit waarin aan de SG mandaat wordt verleend, wordt aan de SG mandaat
      verleend voor:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: 12.a
    text: |-
      aangelegenheden op het gebied van de ambtelijke leiding van al hetgeen
      het ministerie betreft, zoals nader omschreven in de toelichting bij het
      [Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref1] (Stb. 1988, 499);


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: 12.b
    text: |-
      het vaststellen van circulaires, met uitzondering van circulaires die naar het oordeel van de SG door een ander
      organisatieonderdeel genoemd in het [Organisatiebesluit Ministerie van Financiën 2020][ref1] moeten worden
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0043027
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043027
  - number: 12.c
    text: |-
      het vaststellen van de werkterreinen van de directeuren-generaal, genoemd in het
      [Organisatiebesluit Ministerie van Financiën 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043027
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043027
  - number: 12.d
    text: |-
      het uitoefenen van de bevoegdheden van de minister inzake benoeming, schorsing, ontslag en vergoeding van
      medewerkers en andere personen in organen van rechtspersonen en colleges, voor zover daarvoor geen mandaat,
      volmacht en machtiging is verleend aan een andere medewerker binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: 12.e
    text: |-
      het doen van voorstellen omtrent de vaststelling van de topstructuur van het ministerie, tot en met het niveau van
      directies, en hiermee samenhangend het besluiten tot reorganisaties;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: 12.f
    text: |-
      het vaststellen van de formatie, en hiermee samenhangend het besluiten tot reorganisaties
      van het kernministerie en van de topstructuren van het DGBD, DGD en DGTSL, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______, en na gehoord hebbende de bestuursraad;


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: 12.g
    text: |-
      het aangaan (waaronder mede wordt verstaan het maken van afspraken over beloning), wijzigen en beëindigen van de
      arbeidsovereenkomst met medewerkers in functies behorende tot de topstructuur van het Ministerie van Financiën,
      waarbij het aangaan van een arbeidsovereenkomst plaatsvindt na overleg met de bestuursraad;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: 12.h
    text: |-
      het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in het vorige
      onderdeel;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: 12.i
    text: het aanwijzen van vertrouwenspersonen integriteit en ongewenste omgangsvormen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: 12.j
    text: het voeren van overleg met bonden over onderwerpen van algemeen belang voor de rechtstoestand van werknemers.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel12
  - number: '13'
    text: |-
      Met inachtneming van [artikel 12][ref1] is aan de pSG voorbehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel12
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '12'
        hoofdstuk: '4'
  - number: 13.a
    text: |-
      het, na overleg met de bestuursraad, doen van voorstellen omtrent de vaststelling van de organisatie van het
      kernministerie vanaf het niveau van afdelingen (of daarmee vergelijkbare organisatieonderdelen) en lager, en
      hiermee samenhangend het besluiten tot reorganisaties;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.b
    text: |-
      het vaststellen van de formatie van het DGBD, het DGTSL en het DGD, voor zover het een uitbreiding van de totale
      formatie betreft;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.c
    text: |-
      het aangaan (waaronder mede wordt verstaan het maken van afspraken over beloning) en wijzigen van de
      arbeidsovereenkomst van medewerkers werkzaam in functies bij het kernministerie met een bezoldiging van
      salarisschaal 15 of hoger. Het aangaan van de arbeidsovereenkomst vindt plaats na overleg met de bestuursraad;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.d
    text: |-
      het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in het vorige
      onderdeel;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.e
    text: het toekennen van een bijzondere beloning aan functionarissen van het kernministerie;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.f
    text: |-
      het voeren van overleg met bonden over onderwerpen van algemeen belang voor de rechtstoestand van werknemers bij
      afwezigheid van de SG;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.g
    text: het vaststellen van regelingen of maken van afspraken met betrekking tot sociaal flankerend beleid;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.h
    text: |-
      het vaststellen van regels en beleid(skaders) inzake de bedrijfsvoering, waaronder regels die leiden tot
      wijzigingen in de rechten of verplichtingen van medewerkers, voor zover van toepassing op medewerkers van het
      gehele ministerie of het kernministerie;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.i
    text: |-
      het opleggen van ordemaatregelen en straffen aan functionarissen behorende tot de topstructuur van het Ministerie
      van Financiën;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.j
    text: |-
      het (beslissen tot het) beëindigen van de arbeidsovereenkomst van medewerkers werkzaam bij het kernministerie,
      tenzij de bevoegdheid is voorbehouden aan de algemene leiding van een DG zoals bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel14
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '14'
        hoofdstuk: '4'
  - number: 13.k
    text: |-
      het (beslissen tot het) beëindigen van de arbeidsovereenkomst van medewerkers werkzaam bij het DGBD, het DGTSL, het
      DGD of de IBTD om de redenen als bedoeld in Bijlage 1;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.l
    text: |-
      het sluiten van een vaststellingsovereenkomst in verband met het beëindigen van de arbeidsovereenkomst of
      tewerkstelling bij het ministerie of een wijziging van een reeds afgesloten vaststellingsovereenkomst, voor zover
      deze bevoegdheid niet is toegekend aan een directeur-generaal of directeur;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.m
    text: |-
      alle met cassatie verband houdende beslissingen zowel als eisende partij als verwerende partij met betrekking tot
      personeelsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: 13.n
    text: |-
      het ten aanzien van onder hem ressorterende medewerkers geven van toestemming op verzoeken om systemen te mogen
      raadplegen naar aanleiding van vermoedens van niet integer gedrag door medewerkers.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel13
  - number: '14'
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de algemene leiding van een DG van het
      kernministerie ten aanzien van onder hen ressorterende medewerkers voorbehouden het nemen van beslissingen:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14.a
    text: tot het sluiten van een tijdelijke arbeidsovereenkomst in bijzondere situaties;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14.b
    text: |-
      tot beloning van directeuren (niet zijnde algemeen directeuren), sectormanagers en de manager van de stafafdeling
      bestuursondersteuning en vaktechniek bij de ADR;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14.c
    text: |-
      tot het opleggen van ordemaatregelen en straffen, met uitzondering van de wettelijke mogelijkheden het
      dienstverband te beëindigen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14.d
    text: |-
      over aansprakelijkheid, tot schadeloosstelling of schadevergoeding vanaf € 25.000, waarbij de pSG door de algemene
      leiding wordt geïnformeerd voor zover het gaat om dienstongevallen, beroepsziektes en beroepsincidenten als bedoeld
      in de cao Rijk;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14.e
    text: |-
      het (beslissen tot het) beëindigen van de arbeidsovereenkomst van medewerkers, inclusief het sluiten van een
      vaststellingsovereenkomst om de redenen als bedoeld in Bijlage 1;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14.f
    text: |-
      tot het geven van toestemming op verzoeken om systemen te mogen raadplegen naar aanleiding van vermoedens van niet
      integer gedrag door medewerkers.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14
  - number: 14a.1
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is elk van de leden van de algemene leiding van een DG,
      uitgezonderd de DGBD, de DGTSL en de DGD, bevoegd om ten aanzien van de medewerkers van het kernministerie de eed
      en belofte af te nemen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14a
  - number: 14a.2
    text: |-
      In geval van verhindering kan de algemene leiding van een DG zich bij het afnemen van de eed en belofte laten
      vervangen door de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel14a
  - number: '15'
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de algemene leiding van het DGBD, het DGTSL en het
      DGD, ten aanzien van onder hen ressorterende medewerkers voorbehouden, het nemen van beslissingen:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.a
    text: |-
      tot het vaststellen van de organisatie tot en met directieniveau en hiermee samenhangend het besluiten tot
      reorganisaties;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.b
    text: |-
      tot het vaststellen van de formatie, waarbij tot wijzigingen in formatie van functies met salarisschaal 16 en hoger
      na overleg met de bestuursraad besloten wordt;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.c
    text: |-
      tot het aangaan (waaronder mede wordt verstaan het maken van afspraken over beloning) en wijzigen van de
      arbeidsovereenkomst van medewerkers in functies met een bezoldiging van salarisschaal 16 of hoger. Benoemingen
      worden afgestemd met de bestuursraad en over de arbeidsvoorwaarden dient vooraf afstemming met de pSG plaats te
      vinden;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.d
    text: tot het sluiten van een tijdelijke arbeidsovereenkomst waarbij wordt afgeweken van de cao Rijk;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.e
    text: |-
      tot het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de onderdelen c
      en d;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.f
    text: |-
      het binnen de rijksbrede of ministeriebrede kaders vaststellen van regels en beleid(skaders) inzake de
      bedrijfsvoering voor zover specifiek van toepassing bij het DGBD, DGD en DGTSL;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.g
    text: |-
      tot het opleggen van ordemaatregelen en straffen, met uitzondering van de wettelijke mogelijkheden het
      dienstverband te beëindigen, aan leidinggevende functionarissen en (strategische) functionarissen met een
      bezoldiging van salarisschaal 15 of hoger;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.h
    text: |-
      over aansprakelijkheid, schadeloosstelling of schadevergoeding vanaf € 25.000, waarbij de pSG door de algemene
      leiding wordt geïnformeerd voor zover het gaat om dienstongevallen, beroepsziektes en beroepsincidenten als bedoeld
      in de cao Rijk;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.i
    text: |-
      het (beslissen tot het) beëindigen van de arbeidsovereenkomst van medewerkers om de redenen als bedoeld in Bijlage
      1;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.j
    text: |-
      tot het wijzigen van een arbeidsovereenkomst met medewerkers met salarisschaal 15 of hoger in functies met een
      lagere schaal dan de voor de medewerker tot dan toe geldende schaal;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.k
    text: |-
      het voordragen van functies die ten behoeve van het instellen van een veiligheidsonderzoek voor aanwijzing als
      vertrouwensfuncties in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.l
    text: het beslissen tot directieoverstijgende groepsgewijze werving en selectie voor (groeps)functies;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.m
    text: het aanwijzen van vertrouwenspersonen integriteit en ongewenste omgangsvormen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.n
    text: het beslissen over de afwijkingen bij de toepassing van het sociaal flankerend beleid;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.o
    text: |-
      het geven van toestemming op verzoeken om systemen te mogen raadplegen naar aanleiding van vermoedens van niet
      integer gedrag door medewerkers;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.p
    text: |-
      het aanwijzen van de voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangend leden, de
      secretaris en de plaatsvervangend secretaris van de Klachtencommissie ongewenste omgangsvormen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.q
    text: handelingen en beslissingen verband houdende met de klachtenregeling ongewenste omgangsvormen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.r
    text: handelingen en beslissingen verband houdende met een adviesaanvraag bij het College voor de Rechten van de Mens;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
  - number: 15.s
    text: |-
      met inachtneming van de [artikelen 11 tot en met 13][ref1] worden
      de bevoegdheden opgenomen in de [artikelen 7][ref2], [10][ref3] en
      [11 van het Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref4] uitgeoefend door
      de algemene leiding voor zover het rechtspositionele handelingen en beslissingen betreft aangaande directeuren van
      de topstructuren DGBD, DGTSL en DGD.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0045076#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0045076#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0045076#Artikel11
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0045076
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0045076
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0045076
        artikel: '11'
  - number: 15a
    text: |-
      Met inachtneming van hetgeen is bepaald in voorgaande artikelen
      is de pDGBD bevoegd om ten aanzien van de directies als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __ de navolgende handelingen te verrichten en beslissingen te nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0045078#Artikel7
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0045078
        artikel: '7'
  - number: 15a.a
    text: het beslissen tot groepsgewijze werving en selectie voor (groeps)functies voor zover niet directieoverstijgend;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15a
  - number: 15a.b
    text: |-
      het vaststellen van de organisatie op afdelings- en teamniveau en hiermee samenhangend het beslissen tot
      reorganisaties van deze onderdelen. Het vaststellen van de organisatie en hiermee samenhangende beslissingen tot
      reorganisatie op het niveau van afdelingen vindt plaats na instemming van de DG.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15a
  - number: 15b
    text: |-
      Met inachtneming van hetgeen is bepaald in voorgaande artikelen zijn de algemeen directeuren bevoegd de navolgende
      handelingen te verrichten en beslissingen te nemen:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15b
  - number: 15b.a
    text: |-
      het vaststellen van de organisatie op afdelings- en teamniveau en hiermee samenhangend het beslissen tot
      reorganisaties van deze onderdelen binnen de eigen directie. Het vaststellen van de organisatie en hiermee
      samenhangende beslissingen tot reorganisatie op het niveau van afdelingen vindt plaats na instemming van de DGBD,
      respectievelijk de DGTSL, respectievelijk de DGD;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15b
  - number: 15b.b
    text: het beslissen tot groepsgewijze werving en selectie voor (groeps)functies;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15b
  - number: 15b.c
    text: |-
      tot het aangaan (waaronder mede wordt verstaan het maken van afspraken over beloning), wijzigen en beëindigen
      van de arbeidsovereenkomst van medewerkers in de functie van overige directeur of daarmee gelijk te stellen
      leidinggevende functies, na afstemming met de DGBD, respectievelijk de DGTSL, respectievelijk de DGD.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15b
  - number: 15c
    text: |-
      Met inachtneming van hetgeen is bepaald in voorgaande artikelen zijn de directeuren van de topstructuur DGBD,
      DGTSL en DGD bevoegd om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel de navolgende
      handelingen te verrichten en beslissingen te nemen:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15c
  - number: 15c.a
    text: |-
      het geven van een opdracht tot het verrichten van onderzoek naar de integriteit van medewerkers en het beslissen
      tot opleggen van straffen (conform cao Rijk), met uitzondering van de wettelijke mogelijkheden het dienstverband te
      beëindigen, aan functionarissen tot en met schaal 14 voor zover het geen leidinggevende functionarissen betreft;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15c
  - number: 15c.b
    text: tot het aangaan van een arbeidsovereenkomst met medewerkers met een bezoldiging van schaal 15;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15c
  - number: 15c.c
    text: |-
      het niet instellen van een vordering of het niet opleggen van een terugbetalingsverplichting, dan wel het
      (gedeeltelijk) kwijtschelden van een vordering op medewerkers;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15c
  - number: 15c.d
    text: |-
      (het beslissen tot) het beëindigen van de arbeidsovereenkomst van medewerkers, inclusief het sluiten van een
      vaststellingsovereenkomst om de redenen als bedoeld in Bijlage 1;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15c
  - number: 15c.e
    text: |-
      bij het ontbreken van een algemeen directeur en in afwijking van [artikel 5a][ref1] het aangaan (waaronder mede
      wordt verstaan het maken van afspraken over beloning), wijzigen en beëindigen van de arbeidsovereenkomst van
      medewerkers in de functie van overige directeur of daarmee gelijk te stellen leidinggevende functies, na afstemming
      met de DGBD, respectievelijk de DGTSL, respectievelijk de DGD.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel5a
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: 5a
        hoofdstuk: '2'
  - number: '16.1'
    text: |-
      De directeuren van de in het [Organisatiebesluit Ministerie van Financiën 2020][ref1] genoemde directies en hun
      plaatsvervangers hebben binnen het kader van hun jaarplannen en binnen door de minister of namens de minister door
      de secretaris-generaal of de algemene leiding van het directoraat-generaal gegeven richtlijnen en behoudens de
      voorgaande bepalingen mandaat tot het nemen van besluiten en afdoen van stukken betreffende alle aangelegenheden
      die behoren tot hun beleidsterrein genoemd in het Organisatiebesluit Ministerie van Financiën 2020, tenzij bij wet
      anders is bepaald of de aard van de bevoegdheid zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0043027
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0043027
  - number: '16.2'
    text: |-
      De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door de onder
      de directeuren ressorterende functionarissen die daartoe worden gemandateerd in het mandaatregister.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: '16.3'
    text: |-
      Onverminderd het eerste lid is de bevoegdheid tot het nemen van beslissingen namens de in het eerste lid
      gevolmachtigde functionarissen toegekend aan de directeur en de plaatsvervangend directeur van de concerndirectie
      Mens en Organisatie.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: '16.4'
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de directeuren en hun plaatsvervangers ten aanzien
      van onder hen ressorterende medewerkers voorbehouden het nemen van beslissingen:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.a
    text: |-
      tot het aangaan (waaronder mede wordt verstaan het maken van afspraken over beloning), wijzigen en beëindigen van
      de arbeidsovereenkomst in de functie van afdelingshoofd of daarmee gelijk te stellen leidinggevende functies, na
      afstemming met de thesaurier-generaal dan wel de directeur-generaal van het betreffende directoraat-generaal dan
      wel de (plaatsvervangend) secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.b
    text: het toekennen dan wel stopzetten van een bovenschaalse periodiek;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.c
    text: |-
      het beslissen over aansprakelijkheid, tot schadeloosstelling dan wel schadevergoeding tot € 25.000, waarbij
      de pSG door de algemene leiding wordt geïnformeerd voor zover het gaat om dienstongevallen, beroepsziektes en
      beroepsincidenten als bedoeld in de cao Rijk;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.d
    text: het opschorten dan wel stopzetten van het salaris in verband met het niet nakomen van re-integratieverplichtingen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.e
    text: het toekennen van een stimuleringspremie;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.f
    text: op verzoeken tot het niet laten vervallen dan wel verjaren van wettelijke vakantie-uren;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.g
    text: handelingen en beslissingen met betrekking tot het treffen van ordemaatregelen als opgenomen in de cao Rijk;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.h
    text: |-
      het opdracht geven tot het verrichten van feitenonderzoek naar aanleiding van het vermoeden van een
      integriteitsschending;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.i
    text: |-
      het niet instellen van een vordering of het niet opleggen van een terugbetalingsverplichting, dan wel het
      (gedeeltelijk) kwijtschelden van een vordering op medewerkers;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: 16.4.j
    text: het toekennen van maatregelen van sociaal flankerend beleid.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: '16.5'
    text: |-
      De afdelingshoofden en hun plaatsvervangers kunnen het op grond van het tweede lid aan hen door de directeur of
      zijn plaatsvervanger verleende ondermandaat, doormandateren aan onder hen ressorterende teamleiders of daarmee
      gelijk te stellen leidinggevende functies, die daartoe eveneens worden gemandateerd in het mandaatregister.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: '16.6'
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de in het vorige onderdeel bedoelde
      ondergemandateerde functionarissen voorbehouden het nemen van beslissingen tot het aangaan (waaronder mede wordt
      verstaan het maken van afspraken over beloning), wijzigen en beëindigen van de arbeidsovereenkomst van medewerkers
      in de functie van teamleider of daarmee gelijk te stellen leidinggevende functies, na afstemming met de directeur.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel16
  - number: '17'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treedt de algemene leiding in
      contact met de bewindspersoon die het aangaat, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel17
  - number: '18'
    text: |-
      Bij het maken van afspraken, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot alle
      personeelsaangelegenheden, bedoeld in Bijlage 2 bij deze regeling, betreffende het kernministerie is advies van de
      directeur van de concerndirectie Mens en Organisatie vereist.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel18
  - number: '19'
    text: |-
      In situaties waarin het bevoegd gezag een beloning aan een medewerker wil toekennen, waarbij wordt afgeweken van de
      reguliere beloningsregels dient vooraf overleg met de pSG plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19
  - number: 19aa.1
    text: |-
      Met inachtneming van de voorgaande artikelen van dit besluit is aan de IG ten aanzien van onder hem ressorterende
      medewerkers voorbehouden, het nemen van beslissingen betreffende:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.a
    text: |-
      het vaststellen van de organisatie van de IBTD, en hiermee samenhangend het besluiten tot reorganisaties. In die
      gevallen wordt de bestuursraad niet gehoord;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.b
    text: het aangaan, het plaatsen en het beëindigen van de arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.c
    text: het maken van afspraken over de beloning en het toekennen van maatregelen van sociaal flankerend beleid;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.d
    text: het toekennen van een (bijzondere) beloning;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.e
    text: |-
      het opleggen van ordemaatregelen en straffen, met uitzondering van de wettelijke mogelijkheden het dienstverband
      te beëindigen;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.f
    text: |-
      het geven van toestemming op verzoeken om systemen te mogen raadplegen naar aanleiding van vermoedens van niet
      integer gedrag door onder hem ressorterende medewerkers;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.g
    text: het sluiten van een tijdelijke arbeidsovereenkomst in bijzondere situaties;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.h
    text: opzegging wegens bereiken AOW-gerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.i
    text: (verlenging) tijdelijke arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.j
    text: een (tijdelijke) uitzending in het buitenland;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.k
    text: schadeloosstelling;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.l
    text: het verzoeken van toestemming aan het UWV tot ontslag wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.1.m
    text: |-
      (de aansprakelijkheidsstelling als gevolg van) dienstongevallen, beroepsziekten en beroepsincidenten als bedoeld in
      de cao Rijk, waarbij de pSG door de IG wordt geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.2
    text: |-
      De afdelingshoofden van de IBTD hebben, voor zover het hun werkterrein betreft en binnen door de minister
      of namens de minister door de IG gegeven richtlijnen en behoudens de voorgaande bepalingen, mandaat tot
      het nemen van besluiten en afdoen van stukken betreffende de taken die behoren tot de IBTD genoemd in het
      [Organisatiebesluit Ministerie van Financiën 2020][ref1], tenzij bij wet anders is bepaald of de aard van de
      bevoegdheid zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0043027
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
    references:
      - id: ref1
        bwb_id: BWBR0043027
  - number: 19aa.3
    text: |-
      De functionarissen zoals bedoeld in het tweede lid zijn bevoegd tot het afdoen en ondertekenen van beslissingen
      aangaande de:
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.a
    text: vaststelling feitelijk opgedragen functie;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.b
    text: ver- en herplaatsing;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.c
    text: tijdelijk opdragen van andere werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.d
    text: toekenning extra periodieke verhoging;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.e
    text: onthouding van een periodieke verhoging;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.f
    text: wijziging van salarisschaal;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.g
    text: incidentele beloning voor bijzondere prestaties;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.h
    text: korting beloning bij arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.3.i
    text: het maken van afspraken tot uitbreiding van een arbeidsduur van meer dan 36 uur per week.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
  - number: 19aa.4
    text: |-
      De [artikelen 4][ref1], [5][ref2], [7 tot en met 10][ref3] en [19][ref4] worden op de IG van overeenkomstige
      toepassing verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043022#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0043022#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0043022#Artikel19
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043022
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0043022
        artikel: '7'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0043022
        artikel: '19'
        hoofdstuk: '4'
  - number: 19aa.5
    text: |-
      [Artikel 18][ref1] en de in dat artikel bedoelde bijlage is van overeenkomstige toepassing. De IG hoeft echter
      geen voorafgaand advies aan de directeur CDMO te vragen als het gaat om de personeelsaangelegenheid *wijziging van
      de salarisschaal zonder wijziging van de functie*.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel18
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19aa
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '18'
        hoofdstuk: '4'
  - number: 19a.1
    text: |-
      Aan de directeur Informatievoorziening en Openbaarmaking en het (plaatsvervangend) afdelingshoofd Openbaarmaking en
      Transparantie van de concerndirectie Informatievoorziening en Openbaarmaking wordt mandaat verleend om te besluiten
      op Woo-verzoeken die betrekking hebben op informatie die berust bij het kernministerie. Op deze verzoeken wordt met
      inachtneming van het taakverdelingsbesluit beslist namens de Minister of de Staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19a
  - number: 19a.2
    text: |-
      Ten aanzien van informatie die berust binnen het DGBD, het DGD en het DGTSL wordt aan de directeur
      Informatievoorziening en Openbaarmaking en het (plaatsvervangend) afdelingshoofd Openbaarmaking en Transparantie
      van de concerndirectie Informatievoorziening en Openbaarmaking mandaat verleend om te besluiten op Woo- verzoeken
      die afkomstig zijn van een journalist of een belangengroepering of die betrekking hebben op de (nasleep van de)
      toeslagenaffaire en op Woo-verzoeken die betrekking hebben op informatie die berust bij meerdere directoraten-
      generaal. Op deze Woo-verzoeken wordt beslist namens de Staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19a
  - number: 19a.3
    text: |-
      Op Woo-verzoeken als bedoeld in het tweede lid die zijn ingediend bij de inspecteur of de ontvanger wordt
      overeenkomstig het tweede lid beslist namens de Staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19a
  - number: 19a.4
    text: |-
      Aan het (plaatsvervangend) afdelingshoofd Openbaarmaking en Transparantie wordt mandaat verleend voor het
      ondertekenen van correspondentie van procedurele aard. Hij kan aan onder hem ressorterende medewerkers ter zake
      ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19a
  - number: 19b.1
    text: |-
      Aan de directeur Informatievoorziening en Openbaarmaking en het (plaatsvervangend) afdelingshoofd Openbaarmaking
      en Transparantie van de concerndirectie Informatievoorziening en Openbaarmaking wordt mandaat verleend tot de
      behandeling van procedures bij de rechtbanken inzake het niet tijdig beslissen op Woo-verzoeken bedoeld in artikel
      19a. Zij kunnen aan onder hen ressorterende medewerkers ter zake ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19b
  - number: 19b.2
    text: |-
      Aan de secretaris-generaal, de (plaatsvervangend) directeur en het afdelingshoofd Publiekrecht van de directie
      Juridische Zaken wordt mandaat verleend om de tegen de in artikel 19a bedoelde besluiten gerichte bezwaren te
      behandelen en daarop te beslissen. Zij kunnen aan onder hen ressorterende medewerkers ter zake het behandelen
      ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19b
  - number: 19b.3
    text: |-
      Aan de directeur van de directie Juridische Zaken wordt mandaat verleend tot de behandeling van procedures bij de
      rechtbanken en in hoger beroep bij de Afdeling bestuursrechtspraak van de Raad van State en tot het instellen van
      hoger beroep ter zake van de besluiten bedoeld in het tweede lid alsmede voor het ondertekenen van correspondentie
      van procedurele aard. Hij kan aan onder hem ressorterende medewerkers ter zake ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19b
  - number: 19c.1
    text: |-
      Aan de directeur-generaal van het DGBD en aan de (algemeen) directeuren van de organisatieonderdelen van het DGTSL
      en het DGD wordt mandaat verleend om te beslissen op andere Woo-verzoeken betreffende informatie die berust bij
      het betreffende organisatieonderdeel dan bedoeld in [artikel 19a][ref1]. De directeur-generaal van het DGBD en de
      (algemeen) directeuren van de organisatieonderdelen van het DGTSL en het DGD kunnen aan onder hen ressorterende
      medewerkers ter zake ondermandaat verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel19a
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: 19a
        hoofdstuk: 4a
  - number: 19c.2
    text: |-
      Aan de directeuren-generaal van respectievelijk DGBD, DGTSL en DGD wordt mandaat verleend om de tegen de in het
      eerste lid bedoelde besluiten gerichte bezwaren te behandelen en daarop te beslissen. De directeuren-generaal
      kunnen aan onder hen ressorterende medewerkers ter zake ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19c
  - number: 19c.3
    text: |-
      Aan de directeuren-generaal van respectievelijk DGBD, DGTSL en DGD wordt mandaat verleend tot de behandeling van
      procedures bij de rechtbanken en in hoger beroep bij de Afdeling bestuursrechtspraak van de Raad van State en tot
      het instellen van hoger beroep ter zake van de Woo-verzoeken bedoeld in het eerste lid. Zij kunnen aan onder hen
      ressorterende medewerkers ter zake ondermandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19c
  - number: 19c.4
    text: |-
      Rechterlijke uitspraken in procedures van de organisatieonderdelen van het DGBD, het DGTSL en het DGD worden zo
      spoedig mogelijk na ontvangst door het betreffende directoraat-generaal in afschrift toegezonden aan de directie
      Juridische Zaken.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel19c
  - number: '20'
    text: |-
      Wijzigingen van dit besluit treden in werking per 1 januari, 1 april, 1 juli of 1 oktober, behoudens spoedeisende
      gevallen.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel20
  - number: '21.1'
    text: |-
      De volgende regelingen worden ingetrokken: [Organisatie- en mandaatbesluit Ministerie van Financiën][ref1],
      zoals laatstelijk gewijzigd bij besluit van 1 juli 2018, het Organisatie- en mandaatbesluit SG-cluster van
      26 maart 2014, het Organisatie- en mandaatbesluit voor de Generale Thesaurie van 14 september 2016, het
      [Organisatie- en mandaatbesluit directoraat-generaal voor Fiscale Zaken][ref2] van 23 mei 2014 en het Organisatie-
      en mandaatbesluit directoraat-generaal Rijksbegroting van 1 februari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037135
      - id: ref2
        bwb_id: BWBR0035773
  - number: '21.2'
    text: |-
      Het [Organisatie- en mandaatbesluit Ministerie van Financiën][ref1] van 1 juli 2018 blijft onverminderd het
      eerste lid, na de inwerkingtreding van deze regeling van toepassing ten aanzien van personele aangelegenheden
      waarop na 1 januari 2020 het recht van toepassing is dat gold direct voor de inwerkingtreding van de
      [Wet normalisering rechtspositie ambtenaren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0039393
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037135
      - id: ref2
        bwb_id: BWBR0039393
  - number: '22'
    text: |-
      Deze regeling treedt in werking met ingang van de eerste dag van de kalendermaand na de datum van uitgifte in de
      Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel22
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Mandaatbesluit Ministerie van Financiën 2020.'
    url: https://wetten.overheid.nl/BWBR0043022/2025-06-21#Artikel23
