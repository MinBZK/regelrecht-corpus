  - number: '14'
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de algemene leiding van een DG, uitgezonderd
      het DGBD, het DGTSL en het DGD, ten aanzien van onder hen ressorterende medewerkers voorbehouden het nemen van
      beslissingen:

      a. betreffende de plaatsing, beëindiging van de arbeidsovereenkomst en beloning van medewerkers vanaf schaal 15,
      behoudens het bepaalde in [artikel 13][ref1];

      b. tot het sluiten van een tijdelijke arbeidsovereenkomst in bijzondere situaties;

      c. tot een (tijdelijke) uitzending in het buitenland;

      d. het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de vorige twee
      onderdelen;

      e. tot beloning van:

      i. afdelingshoofden of daarmee gelijk te stellen functionarissen;

      ii. directeuren (m.u.v. Algemeen directeur), sectormanagers en manager Bestuursondersteuning en Vaktechniek bij
      de ADR;

      f. tot het opleggen van ordemaatregelen en straffen, met uitzondering van de wettelijke mogelijkheden het
      dienstverband te beëindigen;

      g. tot schadeloosstelling;

      h. tot het verzoeken van toestemming aan het UWV tot ontslag wegens ziekte;

      i. met betrekking tot (de aansprakelijkheidsstelling als gevolg van) dienstongevallen, beroepsziekten en
      beroepsincidenten als bedoeld in de CAO Rijk, waarbij de pSG door de algemene leiding wordt geïnformeerd;

      j. tot het geven van toestemming op verzoeken om systemen te mogen raadplegen naar aanleiding van vermoedens van
      niet integer gedrag door medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel13
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel14
