  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a. volmacht om in naam van een bewindspersoon privaatrechtelijke rechtshandelingen te verrichten, en

      b. machtiging om in naam van een bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel2
  - number: '3'
    text: |-
      1 De SG kan een mandaatbesluit vaststellen voor het ministerie, met inbegrip van de op grond van
      [artikel 11, eerste lid, van het Organisatiebesluit Ministerie van Financiën 2020][ref1] ingestelde tijdelijke
      directoraten-generaal.

      2 De SG stelt, in overeenstemming met de DGBD, de DGTSL en de DGD, een organisatiebesluit en een mandaatbesluit
      voor de directoraten-generaal Belastingdienst, Toeslagen en Douane vast.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel11
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: '11'
  - number: '4'
    text: |-
      1 Aan de secretaris-generaal wordt mandaat verleend ten aanzien van de tot de verantwoordelijkheid van de
      bewindspersoon behorende aangelegenheden, met uitzondering van de bevoegdheden als bedoeld in [artikel 11][ref1].

      2 De SG en DG’s hebben binnen het kader van de jaarplannen en binnen eventueel door de minister of namens de
      minister door de SG gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken
      betreffende alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de
      bevoegdheid zich daartegen verzet.

      3 De ondertekening van uitgaande stukken zal luiden als volgt:

      De Minister van Financiën, resp. De Staatssecretaris van Financiën – Toeslagen en Douane, resp. De Staatssecretaris
      van Financiën – Fiscaliteit en Belastingdienst,

      namens deze,

      gevolgd door de naam en functie van de (onder)gemandateerde.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel11
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '11'
        hoofdstuk: '4'
  - number: '5'
    text: |-
      1 De SG en de DG’s kunnen ieder voor hun werkterrein ondermandaat verlenen.

      2 Directeuren kunnen het aan hen verleende ondermandaat doormandateren.

      3 In een ondermandaat wordt de omvang ervan aangegeven.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel5
  - number: '6'
    text: |-
      1 Onderdeel van deze regeling vormt een mandaatregister. Het mandaatregister bevat de namen van de in dit besluit
      gemandateerde, ondergemandateerde en gevolmachtigde functionarissen.

      2 De directeur Juridische Zaken draagt zorg voor het bijhouden en online publiceren van het mandaatregister.
      Het mandaatregister wordt gepubliceerd op de webpagina van het ministerie van Financiën, te vinden via
      www.rijksoverheid.nl.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel6
  - number: '7'
    text: |-
      1 De SG en DG’s zijn hoofdbudgethouder voor wat betreft hun taken en zijn uit dien hoofde bevoegd verplichtingen –
      met financiële consequenties – aan te gaan en uitgaven goed te keuren binnen hun budgetten.

      2 De hoofdbudgethouders zijn verantwoordelijk voor een adequaat financieel beheer.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel7
  - number: '8'
    text: |-
      1 Het mandaat van de DG met betrekking tot het aangaan van financiële verplichtingen en het doen van uitgaven is
      beperkt tot het budget dat aan de DG ter beschikking is gesteld op basis van een door de secretaris-generaal en de
      directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor
      het diensthoofd verantwoordelijk is.

      2 De SG en DG’s kunnen voor de in [artikel 7][ref1] genoemde bevoegdheden ondermandaat verlenen aan budgethouders.
      In een ondermandaat kan een maximumbedrag worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel7
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel8
    references:
