  - number: '17'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treedt de algemene leiding in
      contact met de bewindspersoon die het aangaat, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel17
  - number: '18'
    text: |-
      Bij het maken van afspraken, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot alle
      personeelsaangelegenheden, bedoeld in de bijlage bij deze regeling, betreffende het kernministerie is advies van
      het hoofd Eenheid Organisatie en Personeel van de directie Bedrijfsvoering vereist.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel18
  - number: '19'
    text: |-
      1 In situaties waarin het bevoegd gezag een beloning aan een medewerker wil toekennen, waarbij wordt afgeweken van
      de reguliere beloningsregels dient vooraf overleg met de pSG plaats te vinden.

      2 De bevoegdheid tot het toekennen van maatregelen sociaal flankerend beleid is voorbehouden aan de directeur van
      het organisatieonderdeel waar betrokkene is geplaatst, voor zover die bevoegdheid niet op grond van dit besluit aan
      een ander is voorbehouden.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel19
  - number: 19a
    text: |-
      1 Aan de directeuren-generaal van het kernministerie wordt mandaat verleend om te besluiten op Woo-verzoeken
      die betrekking hebben op informatie die berust bij het kernministerie. Zij kunnen aan onder hen ressorterende
      ambtenaren ter zake ondermandaat verlenen.

      2 Aan de secretaris-generaal en het hoofd Openbaarheid van bestuur van de directie Juridische Zaken en, bij diens
      afwezigheid, de directeur of plaatsvervangend directeur van die directie, wordt mandaat verleend om de tegen de in
      het eerste lid bedoelde besluiten gerichte bezwaren te behandelen en daarop te beslissen. Beiden kunnen aan onder
      hen ressorterende ambtenaren ter zake ondermandaat verlenen.

      3 Aan de directeur van de directie Juridische Zaken wordt machtiging verleend tot de behandeling van procedures bij
      de rechtbanken en in hoger beroep bij de Afdeling bestuursrechtspraak van de Raad van State en tot het instellen
      van hoger beroep ter zake van de Woo-verzoeken bedoeld in het eerste lid. Hij kan aan onder hem ressorterende
      ambtenaren ter zake ondermachtiging verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel19a
  - number: 19b
    text: |-
      1 Ten aanzien van informatie die berust binnen het eigen directoraat-generaal, wordt aan de directeuren-generaal
      van DGBD, DGTSL en DGD mandaat verleend om te besluiten op zwaarwegende of politiek-bestuurlijk gevoelige Woo-
      verzoeken, tot welke categorie in ieder geval behoren de Woo-verzoeken van vertegenwoordigers van de media, van
      politieke en maatschappelijke organisaties en van belangengroeperingen. Op zwaarwegende of politiek-bestuurlijk
      gevoelige Woo-verzoeken wordt beslist namens de Staatssecretaris. De directeur-generaal kan aan onder hem
      ressorterende ambtenaren ter zake ondermandaat verlenen.

      2 Op zwaarwegende of politiek-bestuurlijk gevoelige Woo-verzoeken die zijn ingediend bij de inspecteur of de
      ontvanger wordt overeenkomstig het eerste lid beslist namens de Staatssecretaris.

      3 Aan de secretaris-generaal en het hoofd Openbaarheid van bestuur van de directie Juridische Zaken en, bij diens
      afwezigheid, de directeur of plaatsvervangend directeur van die directie, wordt mandaat verleend om de tegen de in
      het eerste lid bedoelde besluiten gerichte bezwaren te behandelen en daarop te beslissen. Beiden kunnen aan onder
      hen ressorterende ambtenaren ter zake ondermandaat verlenen.

      4 Aan de directeur van de directie Juridische Zaken wordt machtiging verleend tot de behandeling van procedures bij
      de rechtbanken en in hoger beroep bij de Afdeling bestuursrechtspraak van de Raad van State en tot het instellen
      van hoger beroep ter zake van de Woo-verzoeken bedoeld in het eerste lid. Hij kan aan onder hem ressorterende
      ambtenaren ter zake ondermachtiging verlenen.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel19b
  - number: 19c
    text: |-
      1 Aan de (algemeen) directeuren van de organisatieonderdelen van het DGBD, het DGTSL en het DGD wordt mandaat
      verleend om te beslissen op andere Woo-verzoeken betreffende informatie die berust bij het betreffende
      organisatieonderdeel dan bedoeld in [artikel 19b, eerste lid][ref1]. De (algemeen) directeuren kunnen aan onder hen
      ressorterende ambtenaren ter zake ondermandaat verlenen.

      2 Aan de directeuren-generaal van respectievelijk DGBD, DGTSL en DGD wordt mandaat verleend om de tegen de in
      het eerste lid bedoelde besluiten gerichte bezwaren te behandelen en daarop te beslissen. De directeuren-generaal
      kunnen aan onder hen ressorterende ambtenaren ter zake ondermandaat verlenen.

      3 Aan de directeuren-generaal van respectievelijk DGBD, DGTSL en DGD wordt machtiging verleend tot de behandeling
      van procedures bij de rechtbanken en in hoger beroep bij de Afdeling bestuursrechtspraak van de Raad van State en
      tot het instellen van hoger beroep ter zake van de Woo-verzoeken bedoeld in het eerste lid. Zij kunnen aan onder
      hen ressorterende ambtenaren ter zake ondermachtiging verlenen.

      4 Rechterlijke uitspraken in procedures van de organisatieonderdelen van het DGBD, het DGTSL en het DGD, worden zo
      spoedig mogelijk na ontvangst door het betreffende directoraat-generaal in afschrift toegezonden aan de directie
      Juridische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel19b
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel19c
