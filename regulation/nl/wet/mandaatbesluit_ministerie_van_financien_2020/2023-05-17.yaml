  - number: '16'
    text: |-
      1 De directeuren van de in het [Organisatiebesluit Ministerie van Financiën 2020][ref1] genoemde directies en
      hun plaatsvervangers, uitgezonderd het DGBD, het DGTSL en het DGD, hebben binnen het kader van hun jaarplannen
      en binnen door de minister of namens de minister door de secretaris-generaal of de algemene leiding van het
      directoraat-generaal gegeven richtlijnen en behoudens de voorgaande bepalingen volmacht tot het nemen van
      besluiten en afdoen van stukken betreffende alle aangelegenheden die behoren tot hun beleidsterrein genoemd in het
      Organisatiebesluit Ministerie van Financiën 2020, tenzij bij wet anders is bepaald of de aard van de bevoegdheid
      zich daartegen verzet.

      2 De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door de
      onder de directeuren ressorterende functionarissen die daartoe worden gemandateerd in het mandaatregister.

      3 Onverminderd het eerste lid is de bevoegdheid tot het afdoen van besluiten namens de in het eerste lid
      gevolmachtigde functionarissen toegekend aan het hoofd en het plaatsvervangend hoofd van de eenheid Organisatie &
      Personeel van de directie Bedrijfsvoering.

      4 Aan de in het eerste lid gevolmachtigde functionarissen is voorbehouden het afdoen en ondertekenen van
      beslissingen aangaande:

      a. vaststelling feitelijk opgedragen functie;

      b. opzegging wegens bereiken AOW-gerechtigde leeftijd;

      c. (verlenging) tijdelijke arbeidsovereenkomst;

      d. ver- en herplaatsing;

      e. het aangaan van een arbeidsovereenkomst voor onbepaalde tijd;

      f. tijdelijk opdragen van andere werkzaamheden;

      g. toekenning extra periodieke verhoging;

      h. onthouding van een periodieke verhoging;

      i. wijziging van salarisschaal;

      j. incidentele beloning voor bijzondere prestaties;

      k. korting beloning bij arbeidsongeschiktheid;

      l. het maken van afspraken tot uitbreiding van een arbeidsduur van meer dan 36 uur per week.


      [ref1]: https://wetten.overheid.nl/BWBR0043027
