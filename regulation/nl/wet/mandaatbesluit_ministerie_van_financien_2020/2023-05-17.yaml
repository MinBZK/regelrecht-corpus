articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *het Ministerie van Financiën:* het kernministerie, de directoraten-generaal Belastingdienst (DGBD), Toeslagen
      (DGTSL) en Douane (DGD) en de inspectie belastingen, toeslagen en douane (IBTD);

      b. *het kernministerie:* de Generale Thesaurie, het directoraat-generaal Rijksbegroting, het directoraat-generaal
      Fiscale Zaken en het cluster secretaris-generaal;

      c. *de minister:* de Minister van Financiën;

      d. *de staatssecretaris:* de Staatssecretaris van Financiën;

      e. *bewindspersoon:* de Minister of de Staatssecretaris van Financiën;

      f. *algemene leiding:* de secretaris-generaal (SG), de plaatsvervangend secretaris-generaal (pSG), de directeuren-
      generaal (DG);

      g. *mandaat:* de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;

      h. *volmacht:* volmacht als bedoeld in [artikel 3:60, eerste lid, van het Burgerlijk Wetboek][ref1], om namens de
      Staat der Nederlanden rechtshandelingen te verrichten;

      i. *medewerker:* de ambtenaar in de zin van de [Ambtenarenwet 2017][ref2] die werkzaam is bij het ministerie;

      j. *(hoofd)budgethouder:* hoofd van een organisatie-eenheid verantwoordelijk voor het financieel beheer van één of
      meer budgetten;

      k. *Bedrijfsvoering:* onderwerpen op de terreinen van personeel en organisatie, informatievoorziening en ict,
      inkoop, huisvesting, facilitaire zaken en beveiliging;

      l. *CAO Rijk:* de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren werkzaam binnen de sector
      Rijk;

      m. de organisatieonderdelen van het DGBD, het DGTSL en het DGD: de organisatieonderdelen genoemd in
      [artikel 3, eerste, tweede en derde lid, van de Uitvoeringsregeling Belastingdienst 2003][ref3];

      n. de (algemeen) directeuren: de (algemeen) directeuren van de organisatieonderdelen van het DGBD,
      het DGTSL en het DGD genoemd in [artikel 3, eerste, tweede en derde lid][ref4], en bedoeld in
      [artikel 4, vierde lid, van de Uitvoeringsregeling Belastingdienst 2003][ref5];

      o. Woo-verzoek: een verzoek om informatie op grond van de [Wet open overheid][ref6];

      p. inspecteur: functionaris die als zodanig is aangewezen in
      [artikel 5 van de Uitvoeringsregeling Belastingdienst 2003][ref7] en
      [artikel 1:4 van de Algemene douaneregeling][ref8];

      q. ontvanger: functionaris die als zodanig is aangewezen in
      [artikel 5 van de Uitvoeringsregeling Belastingdienst 2003][ref9] en
      [artikel 1:4 van de Algemene douaneregeling][ref10].


