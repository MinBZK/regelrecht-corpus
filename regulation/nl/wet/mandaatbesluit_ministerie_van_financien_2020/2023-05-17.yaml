    text: |-
      Wijzigingen van dit besluit treden in werking per 1 januari, 1 april, 1 juli of 1 oktober, behoudens spoedeisende
      gevallen.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel20
  - number: '21'
    text: |-
      1 De volgende regelingen worden ingetrokken: [Organisatie- en mandaatbesluit Ministerie van Financiën][ref1],
      zoals laatstelijk gewijzigd bij besluit van 1 juli 2018, het Organisatie- en mandaatbesluit SG-cluster van
      26 maart 2014, het Organisatie- en mandaatbesluit voor de Generale Thesaurie van 14 september 2016, het
      [Organisatie- en mandaatbesluit directoraat-generaal voor Fiscale Zaken][ref2] van 23 mei 2014 en het Organisatie-
      en mandaatbesluit directoraat-generaal Rijksbegroting van 1 februari 2012.

      2 Het [Organisatie- en mandaatbesluit Ministerie van Financiën][ref3] van 1 juli 2018 blijft onverminderd het
      eerste lid, na de inwerkingtreding van deze regeling van toepassing ten aanzien van personele aangelegenheden
      waarop na 1 januari 2020 het recht van toepassing is dat gold direct voor de inwerkingtreding van de
      [Wet normalisering rechtspositie ambtenaren][ref4].


