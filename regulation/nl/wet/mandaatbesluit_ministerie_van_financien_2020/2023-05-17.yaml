  - number: 19d
    text: |-
      1 Indien een Woo-verzoek betrekking heeft op informatie die berust bij meerdere directoraten-generaal
      of dienstonderdelen van het DGBD, het DGTSL en het DGD, dan is diegene bij wiens directoraat-generaal
      of organisatieonderdeel van het DGBD, het DGTSL of het DGD het zwaartepunt van het verzoek ligt, bevoegd
      overeenkomstig de [artikelen 19a tot en met 19c][ref1]. De bevoegdheden worden uitgeoefend in overeenstemming
      met de directoraten-generaal of dienstonderdelen van het DGBD, het DGTSL en het DGD waar tevens informatie berust
      waarop het Woo-verzoek betrekking heeft.

      2 Bij welk organisatieonderdeel het zwaartepunt van het verzoek ligt, wordt in onderling overleg tussen de
      betrokken directoraten-generaal of organisatieonderdelen van het DGBD, het DGTSL en het DGD bepaald.


