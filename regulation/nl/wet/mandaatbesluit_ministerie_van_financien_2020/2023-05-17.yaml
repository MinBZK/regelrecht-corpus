        artikel: '13'
        hoofdstuk: '4'
  - number: 14a
    text: |-
      1 Met inachtneming van voorgaande artikelen van dit besluit is elk van de leden van de algemene leiding van een DG,
      uitgezonderd de DGBD, de DGTSL en de DGD, bevoegd om ten aanzien van de medewerkers van het kernministerie de eed
      en belofte af te nemen.

      2 In geval van verhindering kan de algemene leiding van een DG zich bij het afnemen van de eed en belofte laten
      vervangen door de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel14a
  - number: '15'
    text: |-
      Met inachtneming van voorgaande artikelen van dit besluit is aan de algemene leiding van het DGBD, het DGTSL en het
      DGD, ten aanzien van onder hen ressorterende medewerkers voorbehouden, het nemen van beslissingen:

      a. tot het vaststellen van de organisatie tot en met afdelingsniveau, en hiermee samenhangend het besluiten tot
      reorganisaties;

      b. tot het vaststellen van de formatie, waarbij tot wijzigingen in formatie van functies met salarisschaal 16 en
      hoger na overleg met de bestuursraad besloten wordt;

      c. tot het – met inachtneming van [artikel 12][ref1] – aangaan van de arbeidsovereenkomst, benoemen, plaatsen
      en beëindigen van de arbeidsovereenkomst van ambtenaren in overige leidinggevende functies tot het niveau van
      afdelingshoofden of daarmee gelijk te stellen leidinggevende functies;

      d. tot het – met inachtneming van [artikel 12][ref2] – aangaan van de arbeidsovereenkomst, benoemen, plaatsen
      en beëindigen van de arbeidsovereenkomst van ambtenaren in functies met een bezoldiging van salarisschaal 16 of
      hoger is verbonden. Benoemingen worden afgestemd met de bestuursraad, en over de arbeidsvoorwaarden dient vooraf
      afstemming met de pSG plaats te vinden.

      e. tot het sluiten van een tijdelijke arbeidsovereenkomst waarbij wordt afgeweken van de CAO Rijk;

      f. tot een (tijdelijke) uitzending naar het buitenland;

      g. tot het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de onderdelen
      c, d en e van dit artikel.

      h. tot en met inachtneming van [artikel 12][ref3] – beloning van ambtenaren in:

      i. overige leidinggevende functies tot het niveau van afdelingshoofden of daarmee gelijk te stellen leidinggevende
      functies, of

      ii. overige functies met een beloning van salarisschaal 16 of hoger, waarbij afstemming met de pSG dient plaats
      te vinden.

      i. het binnen de rijksbrede en/of ministeriebrede kaders vaststellen van regels en beleid(skaders) inzake de
      bedrijfsvoering voor zover specifiek van toepassing bij het DGBD;

      j. tot het opleggen van ordemaatregelen en straffen, met uitzondering van de wettelijke mogelijkheden het
      dienstverband te beëindigen, aan:

      i. leidinggevende functionarissen;

      ii. (strategische) functionarissen met een bezoldiging van salarisschaal 15 of hoger.

      k. tot het verzoeken van toestemming aan het UWV tot ontslag wegens ziekte;

      l. met betrekking tot (de aansprakelijkheidsstelling als gevolg van) dienstongevallen, beroepsziekten en
      beroepsincidenten, waarbij de pSG door de algemene leiding wordt geïnformeerd.


