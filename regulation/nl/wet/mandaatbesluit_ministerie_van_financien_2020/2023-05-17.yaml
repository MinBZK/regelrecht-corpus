      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2.24'
  - number: '11'
    text: |-
      Aan de bewindspersonen is voorbehouden het afdoen en ondertekenen van stukken:

      a. gericht aan de Koning;

      b. gericht aan de Raad van State;

      c. gericht aan de ministerraad (van het Koninkrijk);

      d. gericht aan de Eerste of Tweede Kamer der Staten-Generaal;

      e. gericht aan de president van de Algemene Rekenkamer;

      f. gericht aan de Nationale Ombudsman;

      g. gericht aan autoriteiten in binnen- en buitenland, gelijk of hoger in rang dan een minister of staatssecretaris;

      h. zijnde Ministeriële regelingen houdende algemeen verbindende voorschriften.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel11
  - number: '12'
    text: |-
      Onverminderd de overige bepalingen van dit besluit waarin aan de SG mandaat wordt verleend, wordt aan de SG mandaat
      verleend voor:

      a. aangelegenheden op het gebied van de ambtelijke leiding van al hetgeen
      het ministerie betreft, zoals nader omschreven in de toelichting bij het
      [Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref1] (Stb. 1988, 499);

      b. het vaststellen van circulaires, met uitzondering van circulaires die naar het oordeel van de SG door een
      ander organisatieonderdeel genoemd in het [Organisatiebesluit Ministerie van Financiën 2020][ref2] moeten worden
      vastgesteld;

      c. het vaststellen van de werkterreinen van de directeuren-generaal, genoemd in het
      [Organisatiebesluit Ministerie van Financiën 2020][ref3];

      d. het uitoefenen van de bevoegdheden van de minister inzake benoeming, schorsing, ontslag en vergoeding van
      ambtenaren en andere personen in organen van rechtspersonen en colleges, voor zover daarvoor geen mandaat, volmacht
      en machtiging is verleend aan een andere ambtenaar binnen het ministerie;

      e. het doen van voorstellen omtrent de vaststelling van de topstructuur van het ministerie, tot en met het niveau
      van directies, en hiermee samenhangend het besluiten tot reorganisaties;

      f. het vaststellen van de formatie, en hiermee samenhangend het besluiten tot reorganisaties
      van het kernministerie en van de topstructuur van het DGBD, als opgenomen in het
      [Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref4] als bedoeld in
      artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering 2011, en na gehoord hebbende de
      bestuursraad;

      g. het aangaan van de arbeidsovereenkomst, het plaatsen en het beëindigen van de arbeidsovereenkomst met ambtenaren
      in functies behorende tot de topstructuur van het ministerie en de directoraten-generaal, waarbij het aangaan van
      een arbeidsovereenkomst plaatsvindt na overleg met de bestuursraad;

      h. het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in het vorige
      onderdeel;

      i. het maken van afspraken over beloning, van functionarissen behorende tot de topstructuur van het ministerie en
      de directoraten-generaal;

      j. het voeren van overleg met bonden over onderwerpen van algemeen belang voor de rechtstoestand van werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
      [ref2]: https://wetten.overheid.nl/BWBR0043027
      [ref3]: https://wetten.overheid.nl/BWBR0043027
      [ref4]: https://wetten.overheid.nl/BWBR0045076
