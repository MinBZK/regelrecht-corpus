  - number: '13'
    text: |-
      Met inachtneming van [artikel 12][ref1] is aan de pSG voorbehouden:

      a. het, na overleg met de bestuursraad, doen van voorstellen omtrent de vaststelling van de organisatie van het
      kernministerie vanaf het niveau van afdelingen (of daarmee vergelijkbare organisatieonderdelen) en lager, en
      hiermee samenhangend het besluiten tot reorganisaties;

      b. het vaststellen van de formatie van het DGBD, het DGTSL en het DGD, voor zover het een uitbreiding van de totale
      formatie betreft;

      c. het – met inachtneming van [artikel 12][ref2] – aangaan van de arbeidsovereenkomst, plaatsen en het beëindigen
      van de arbeidsovereenkomst van ambtenaren in overige leidinggevende functies bij het kernministerie tot het niveau
      van afdelingshoofden of daarmee gelijk te stellen leidinggevende functies.

      d. het – met inachtneming van [artikel 12][ref3] – aangaan van de arbeidsovereenkomst, plaatsen en het beëindigen
      van de arbeidsovereenkomst van ambtenaren werkzaam in functies bij het kernministerie met een bezoldiging van
      salarisschaal 15 of hoger. Het aangaan van de arbeidsovereenkomst vindt plaats na overleg met de bestuursraad;

      e. het toekennen van maatregelen van sociaal flankerend beleid aan functionarissen als bedoeld in de vorige twee
      onderdelen;

      f. het toekennen van een (bijzondere) beloning van functionarissen van het kernministerie;

      g. het voeren van overleg met bonden over onderwerpen van algemeen belang voor de rechtstoestand van werknemers bij
      afwezigheid van de SG;

      h. het vaststellen van regelingen of maken van afspraken met betrekking tot sociaal flankerend beleid;

      i. het vaststellen van regels en beleid(skaders) inzake de bedrijfsvoering, waaronder regels die leiden tot
      wijzigingen in de rechten of verplichting van ambtenaren, voor zover van toepassing op ambtenaren van het gehele
      ministerie of het kernministerie;

      j. het ondertekenen van de rijksbrede overeenkomsten in het kader van categoriemanagement, voor zover het de
      categorieën betreft die ressorteren onder het ministerie;

      k. het opleggen van ordemaatregelen en straffen aan functionarissen behorende tot de topstructuur van het
      ministerie en de directoraten-generaal;

      l. het verzoeken om toestemming aan het UWV tot ontslag wegens bedrijfseconomische redenen;

      m. het verzoeken om ontbinding van de arbeidsovereenkomst wegens bedrijfseconomische redenen;

      n. het verzoeken om ontbinding van de arbeidsovereenkomst wegens gewetensbezwaren/werkweigering;

      o. het verzoeken om ontbinding van de arbeidsovereenkomst wegens verstoorde arbeidsverhouding;

      p. het verzoeken om ontbinding van de arbeidsovereenkomst wegens verwijtbaar handelen, een dringende reden of
      wegens wanprestatie;

      q. het verzoeken van ontbinding van de arbeidsovereenkomst wegens andere omstandigheden die zodanig zijn dat in
      redelijkheid niet kan worden verwacht dat de arbeidsovereenkomst wordt voortgezet;

      r. het verzoeken van ontbinding van de arbeidsovereenkomst wegens een combinatie van ontslaggronden, voor zover één
      van de gronden is voorbehouden aan de pSG;

      s. het sluiten van een vaststellingsovereenkomst in verband met het beëindigen van de arbeidsovereenkomst of
      tewerkstelling bij het ministerie of een wijziging van een reeds afgesloten vaststellingsovereenkomst;

      t. het beslissen op verzoeken doorwerken na AOW-gerechtigde leeftijd voor functionarissen van het kernministerie;

      u. alle met cassatie verband houdende beslissingen zowel als eisende partij als verwerende partij met betrekking
      tot personeelsaangelegenheden;

      v. het ten aanzien van onder hem ressorterende medewerkers geven van toestemming op verzoeken om systemen te mogen
      raadplegen naar aanleiding van vermoedens van niet integer gedrag door medewerkers.


