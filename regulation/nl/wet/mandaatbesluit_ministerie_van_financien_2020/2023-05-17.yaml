        artikel: '7'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Instemming van de directeur Financieel-Economische Zaken is vereist:

      a. voor zover voorgenomen besluiten met financiële consequenties niet passen binnen de door de SG vastgestelde
      budgetten;

      b. voor de benoeming van de directeuren control van het DGBD, het DGTSL en het DGD.
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel9
  - number: '10'
    text: |-
      Aan de DG is voorbehouden te beslissen over het afwijken van de procedures als bedoeld in de
      [Aanbestedingswet 2012][ref1], alsmede over het toepassen van een uitzonderingsgrond als bedoeld in de
      [artikelen 2.24 tot en met 2.24c van de Aanbestedingswet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032203
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2.24
    url: https://wetten.overheid.nl/BWBR0043022/2023-05-17#Artikel10
