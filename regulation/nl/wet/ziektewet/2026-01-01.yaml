  - number: '62'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt, volgens nadere bij ministeriële regeling vast te
      stellen regels, uit de door dit instituut gevoerde administratie aan een daartoe door Onze Minister aangewezen
      onder hem ressorterende ambtenaar, gegevens omtrent het ziekteverzuim van werknemers.
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel62
  - number: 63a
    text: |-
      1 De eigenrisicodrager verricht met betrekking tot de personen, bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c][ref1], die laatstelijk tot hem in dienstbetrekking stonden,
      de werkzaamheden ter zake van de voorbereiding van besluiten op grond van deze wet inzake uitkeringen, met
      uitzondering van besluiten op grond van [artikel 45a][ref2] en besluiten op grond van bezwaar of beroep. De
      eigenrisicodrager begeleidt de personen, bedoeld in [artikel 29, tweede lid, onderdelen a, b en c][ref3],
      die laatstelijk tot hem in dienstbetrekking stonden, bij gebleken ongeschiktheid tot het verrichten van
      arbeid wegens ziekte als zou hij in een privaatrechtelijke dienstbetrekking tot de eigenrisicodrager staan,
      met toepassing van [artikel 26, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref4] dan wel
      [artikel 71b, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref5].

      2 Bij de uitvoering van het eerste lid treedt de eigenrisicodrager voor de toepassing van de
      [artikelen 28, eerste lid][ref6], [29g, tweede lid][ref7], [30, derde lid][ref8], [37, eerste lid][ref9], en
      [39, eerste en tweede lid][ref10], in de plaats van het Uitvoeringsinstituut werknemersverzekeringen. De eerste zin
      blijft buiten toepassing voorzover noodzakelijk voor het verrichten van werkzaamheden op grond van het vierde of
      vijfde lid door het Uitvoeringsinstituut werknemersverzekeringen.

      3 De eigenrisicodrager betaalt het door het Uitvoeringsinstituut werknemersverzekeringen toegekende
      ziekengeld namens het Uitvoeringsinstituut werknemersverzekeringen aan de personen, bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c][ref11], die laatstelijk tot hem in dienstbetrekking stonden.
      Indien de eigenrisicodrager het ziekengeld niet betaalt, wordt dit betaald door het Uitvoeringsinstituut
      werknemersverzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen verhaalt het ziekengeld, alsmede de
      op grond van enige wet over deze uitkering verschuldigde premies die niet op deze uitkering in mindering kunnen
      worden gebracht en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref12], op
      de eigenrisicodrager.

      4 Op verzoek van een eigenrisicodrager verricht het Uitvoeringsinstituut werknemersverzekeringen de
      werkzaamheden als bedoeld in de eerste zin van het eerste lid, of onderdelen hiervan. Het Uitvoeringsinstituut
      werknemersverzekeringen brengt de kosten daarvan, alsmede de kosten die voortvloeien uit het derde lid, in rekening
      bij de eigenrisicodrager.

      5 Indien de eigenrisicodrager werkzaamheden als bedoeld in het eerste lid naar het oordeel van het
      Uitvoeringsinstituut werknemersverzekeringen niet, niet voldoende of niet juist verricht, verricht het
      Uitvoeringsinstituut werknemersverzekeringen die werkzaamheden. Het Uitvoeringsinstituut werknemersverzekeringen
      brengt de kosten daarvan, alsmede de kosten die voortvloeien uit het derde lid, in rekening bij de
      eigenrisicodrager.

      6 In afwijking van het eerste en vierde lid verricht het Uitvoeringsinstituut werknemersverzekeringen de
      werkzaamheden in verband met de uitvoering van de artikelen [19aa][ref13] en [19ab][ref14].

      7 Het Uitvoeringsinstituut werknemersverzekeringen kan de in het derde, vierde en vijfde lid bedoelde bedragen
      invorderen bij dwangbevel.

      8 Het Uitvoeringsinstituut werknemersverzekeringen vergoedt aan de eigenrisicodrager op aanvraag de schade die deze
      lijdt door toepassing van [artikel 30b, eerste lid][ref15].

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.


