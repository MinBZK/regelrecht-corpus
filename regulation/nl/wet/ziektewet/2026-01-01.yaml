        artikel: 7:10
  - number: '75'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. medische beschikking: een beschikking waaraan een beoordeling van medische gegevens ten grondslag ligt;

      b. werknemer: de persoon op wiens medische gegevens de beoordeling betrekking heeft;

      c. werkgever: de belanghebbende bij een medische beschikking, die niet de werknemer is.
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel75
  - number: 75b
    text: |-
      1 De inzage in, dan wel kennisname of toezending van stukken die medische gegevens bevatten, is voorbehouden aan
      de bedrijfsarts of de arbodienst van de eigenrisicodrager dan wel aan een gemachtigde van de eigenrisicodrager
      of van de werkgever die advocaat of arts is dan wel daarvoor van het Uitvoeringsinstituut werknemersverzekeringen
      bijzondere toestemming heeft gekregen.

      2 De gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de eigenrisicodrager of van de werkgever bij
      de voorbereiding van een medische beschikking voorzover betrekking hebbend op medische gegevens.

      3 De arbodienst of de bedrijfsarts dan wel de gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de
      eigenrisicodrager bij:

      a. het opstellen van een bezwaar- of beroepschrift; en

      b. de behandeling van een bezwaar;

      voorzover betrekking hebbend op medische gegevens.

      4 [Artikel 7:4, tweede, vierde en zesde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op
      stukken of inlichtingen die medische gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel74
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:4
  - number: 75c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen vermeldt de motivering van een medische beschikking, voorzover
      betrekking hebbend op medische gegevens, in een aparte bijlage.

      2 De bijlage wordt behalve aan de werknemer uitsluitend verstrekt aan de bedrijfsarts of de arbodienst van
      de eigenrisicodrager dan wel aan de gemachtigde van de eigenrisicodrager of van de werkgever, bedoeld in
      [artikel 75b][ref1].

      3 Het tweede lid is van overeenkomstige toepassing op een rapport of een advies van een arts of een psycholoog,
      waarnaar bij de motivering van een medische beschikking wordt verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel75b
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel75c
