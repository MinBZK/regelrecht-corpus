  - number: '20'
    text: De werknemers in de zin van deze wet zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel20
  - number: '21'
    text: |-
      In afwijking van [artikel 20][ref1] wordt voor de toepassing van de tweede afdeling, hoofdstuk II en van
      [artikel 64][ref2], de werknemer niet als verzekerde beschouwd voor zover hij werknemer is als bedoeld in
      [artikel 8a][ref3] of werknemer is als bedoeld in [artikel 8c, onderdeel a][ref4], voor zover hij gelijkgestelde is
      als bedoeld in [artikel 3.6, eerste lid, onderdeel b, onder 2, van de Wet arbeid en zorg][ref5].


