  - number: '4'
    text: |-
      1 Als dienstbetrekking wordt mede beschouwd de arbeidsverhouding van:

      a. degene, die anders dan als zelfstandige en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming
      van werk als bedoeld in [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand
      brengt;

      b. degene, die de onderdeel *a* bedoelde persoon bij het tot stand brengen van dat werk bijstaat;

      c. degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;

      d. degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;

      e. de bestuurder van een vennootschap als bedoeld in
      [artikel 132, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], dan wel, indien een vennootschap
      toepassing geeft aan [artikel 129a van Boek 2 van het Burgerlijk Wetboek][ref3], de uitvoerend bestuurder, bedoeld
      in artikel 129a, eerste lid, van Boek 2 van het Burgerlijk Wetboek, van een vennootschap als bedoeld in artikel
      132, derde lid, van Boek 2 van het Burgerlijk Wetboek, met uitsluiting van de directeur-grootaandeelhouder, bedoeld
      in [artikel 6, eerste lid, onderdeel d][ref4];

      f. degene, die als lid van de bemanning van een vissersvaartuig aanspraak heeft op een aandeel in de besomming,
      tenzij hij

      1°. als zodanig tegen geldelijke gevolgen van arbeidsongeschiktheid verzekerd is bij het Sociaal Fonds voor de
      Maatschapsvisserij of

      2°. exploitant of mede-exploitant van het vaartuig is;

      g. degene, die werkzaam is om vakbekwaamheid te verwerven, onder wie mede wordt begrepen degene, die als leerling
      van een instelling van onderwijs praktisch werkzaam is, alsmede degene, die aan een bedrijfsschool opleiding
      ontvangt, een en ander indien een beloning wordt genoten, die niet uitsluitend bestaat in het ontvangen van
      onderricht;

      h. degene, die als bestuurder werkzaam is ten behoeve van een coöperatie die met haar leden uitsluitend
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref5] sluit,
      indien hij lid is van de coöperatie en deze blijkens haar statuten en met inachtneming van de vereisten gesteld in
      het derde lid en krachtens het vierde lid kan worden beschouwd als een coöperatie met werknemerszelfbestuur;

      i. de persoon die op grond van de [Kaderwet dienstplicht][ref6] zijn militaire dienstplicht vervult dan wel de
      persoon die op grond van de [Wet gewetensbezwaren militaire dienst][ref7] is verplicht tot het verrichten van
      vervangende dienst;

      j. de persoon die op grond van [artikel 37 van de Oorlogswet voor Nederland][ref8] is aangemerkt als militair.

      2 Het bepaalde in het vorige lid, onderdelen a en b, blijft buiten toepassing, indien de onderdeel a
      bedoelde overeenkomst rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke
      aangelegenheden.

      3 Een coöperatie als bedoeld in het eerste lid, onderdeel *h*, dient te voldoen aan de vereisten, dat:

      a. doorgaans ten minste twee derde deel van het aantal van de personen met wie de coöperatie een
      arbeidsovereenkomst als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref9] heeft
      gesloten, lid van de coöperatie is;

      b. het lidmaatschap van de coöperatie door ieder van de in onderdeel *a* bedoelde personen onder dezelfde
      voorwaarden kan worden verkregen en voorwaarden van geldelijke aard geen wezenlijke belemmering vormen voor de
      verkrijging van het lidmaatschap;

      c. de leden van de coöperatie ieder één stem hebben;

      d. de arbeidsvoorwaarden van de leden van de coöperatie niet wezenlijk verschillen van hetgeen gebruikelijk is bij
      gelijksoortige ondernemingen in de desbetreffende bedrijfstak;

      e. een lid van de coöperatie, behoudens in geval van liquidatie van de coöperatie, bij beëindiging van zijn
      lidmaatschap ten hoogste aanspraak kan maken op het door hem uit hoofde van een geldelijke voorwaarde als bedoeld
      in onderdeel *b*, hetzij uit anderen hoofde aan de coöperatie betaalde bedrag, herrekend naar geldontwaarding.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld waarbij de in het derde lid genoemde vereisten

      a. nader worden bepaald;

      b. worden aangevuld met andere vereisten op grond waarvan de coöperatie kan worden beschouwd als een coöperatie
      met werknemerszelfbestuur.

      5 Voor de toepassing van het eerste lid, onderdeel a, wordt onder zelfstandige verstaan de persoon die:

      a. in Nederland woont en die belastbare winst uit onderneming geniet als bedoeld in
      [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref10], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft; of

      b. niet in Nederland woont en die belastbare winst uit Nederlandse onderneming geniet als bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref11], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;

      c. directeur-grootaandeelhouder is als bedoeld in [artikel 6, eerste lid, onderdeel d][ref12], en het werk tot
      stand brengt uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij directeur-
      grootaandeelhouder is.


