  - number: 75f
    text: |-
      1 Indien [artikel 8:32, tweede lid, van de Algemene wet bestuursrecht][ref1] is toegepast, vindt in afwijking van
      [artikel 8:62, eerste lid, van die wet][ref2] het onderzoek ter zitting, voorzover betrekking hebbend op medische
      gegevens, met gesloten deuren plaats, tenzij de bestuursrechter ambtshalve of op verzoek van een van de partijen
      bepaalt dat het onderzoek openbaar is.

      2 In de uitnodiging, bedoeld in [artikel 8:56 van de Algemene wet bestuursrecht][ref3], wordt mededeling gedaan van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel832
