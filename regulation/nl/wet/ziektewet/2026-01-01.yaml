  - number: '76'
    text: |-
      Deze afdeling is van toepassing op personen die:

      a. anders dan op grond van een arbeidsovereenkomst in dienst zijn van staat, provincie, gemeente, waterschap of
      enig ander publiekrechtelijk lichaam; en

      b. op grond van de [Kaderwet dienstplicht][ref1] de militaire dienst vervullen dan wel die op grond van de
      [Wet gewetensbezwaren militaire dienst][ref2] zijn verplicht tot het verrichten van vervangende dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008589
      [ref2]: https://wetten.overheid.nl/BWBR0002386
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008589
      - id: ref2
        bwb_id: BWBR0002386
  - number: 76a
    text: |-
      1 Bij verhindering wegens ongeschiktheid als gevolg van ziekte, zwangerschap of bevalling om de dienst te
      verrichten of het ambt te vervullen bestaat ten aanzien van de werkgever jegens wie de persoon, bedoeld in
      [artikel 76][ref1], krachtens publiekrechtelijke aanstelling gehouden is tot het verrichten van arbeid, gedurende
      een tijdvak van 104 weken aanspraak op 70% van de bezoldiging, bedoeld in de toepasselijke rechtspositieregeling,
      dan wel van hetgeen daarmee overeenkomt, voorzover deze bezoldiging niet meer bedraagt dan hetgeen overeenkomt met
      het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2]. De aanspraak
      bedraagt de eerste 52 weken echter minimaal het bedrag van het minimumloon dat voor betrokkene zou gelden indien
      de [Wet minimumloon en minimumvakantiebijslag][ref3] op hem van toepassing zou zijn. De eerste twee volzinnen zijn
      van overeenkomstige toepassing voorzover in verband met ziekte, zwangerschap of bevalling ook na ontslag aanspraak
      bestaat op betaling van bezoldiging of van hetgeen daarmee overeenkomt.

      2 Is bezoldiging of hetgeen daarmee overeenkomt, op een andere wijze dan naar tijdruimte vastgesteld, dan is deze
      afdeling van toepassing, met dien verstande dat als bezoldiging wordt beschouwd de gemiddelde bezoldiging die
      betrokkene, wanneer hij niet verhinderd was geweest, gedurende die tijd had kunnen verdienen.

      3 Van het eerste lid kan bij algemeen verbindend voorschrift ten nadele van betrokkene slechts in zoverre worden
      afgeweken dat betrokkene voor de eerste twee dagen van het in het eerste lid bedoelde tijdvak van 104 weken
      onderscheidenlijk het in het achtste lid, eerste volzin, bedoelde tijdvak van zes weken geen aanspraak heeft op
      bezoldiging of hetgeen daarmee overeenkomt.

      4 In afwijking van het eerste lid heeft de vrouwelijke werknemer de in dat lid bedoelde aanspraak
      niet gedurende de periode dat zij zwangerschaps- of bevallingsverlof geniet overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref4].

      5 Voor de toepassing van het eerste en derde lid worden perioden waarin betrokkene wegens ongeschiktheid ten
      gevolge van ziekte, zwangerschap of bevalling verhinderd is om zijn dienst te verrichten of zijn ambt te vervullen,
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref5], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      6 Het tijdvak van 104 weken, bedoeld in het eerste lid, wordt verlengd:

      a. met de duur van de vertraging indien de aanvraag, bedoeld in
      [artikel 64, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref6] later wordt gedaan dan in of op
      grond van dat artikel is voorgeschreven.

      b. met de duur van de verlenging van het tijdvak waarin recht bestaat op loon of bezoldiging
      op grond van [artikel 24, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref7]
      dan wel met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, zevende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref8]; en

      c. met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond
      van [artikel 25, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref9] dan wel
      [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref10] heeft vastgesteld.

      7 Het eerste lid is niet van toepassing op zakgeldgenietenden.

      8 In afwijking van het eerste lid bestaat de in dat lid bedoelde aanspraak gedurende
      een tijdvak van zes weken voor de persoon, bedoeld in [artikel 76][ref11], die de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref12] bedoelde leeftijd heeft bereikt. Indien
      de ongeschiktheid als gevolg van ziekte een aanvang heeft genomen voor de datum waarop de werknemer
      de in de vorige volzin bedoelde leeftijd heeft bereikt, geldt vanaf die datum het in die volzin
      genoemde tijdvak, voor zover het totale tijdvak waarin aanspraak bestaat op bezoldiging, bedoeld in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref13], dan wel van hetgeen daarmee overeenkomt niet meer
      bedraagt dan 104 weken.


