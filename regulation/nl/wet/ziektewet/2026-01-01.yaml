  - number: 63f
    text: |-
      1 Een beschikking tot verhaal van ziekengeld als bedoeld in [artikel 63e][ref1] wordt niet meer gegeven indien
      meer dan vijf jaren sedert het einde van het kalenderjaar zijn verstreken, waarin zij is betaald.

      2 Ziekengeld dat niet is ingevorderd binnen tien jaren na het geven van de beschikking tot verhaal, wordt niet
      meer ingevorderd.

      3 De rechtsvordering tot terugbetaling van een onverschuldigd betaald bedrag in verband met verhaal van ziekengeld
      verjaart door verloop van vijf jaren sedert het einde van het kalenderjaar waarin de beschikking tot verhaal is
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63e
