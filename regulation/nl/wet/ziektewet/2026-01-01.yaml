  - number: 29d
    text: |-
      1 De werknemer die is geboren voor 8 juli 1954 en die onmiddellijk voorafgaand aan een dienstbetrekking als bedoeld
      in [artikel 3][ref1], [4][ref2] of [5][ref3], welke is aangevangen vóór het bereiken van de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], en gedurende ten minste 52 weken
      recht had op een uitkering op grond van [hoofdstuk II van de Werkloosheidswet][ref5], heeft vanaf de eerste dag
      van zijn ongeschiktheid tot werken wegens ziekte recht op ziekengeld over perioden van ongeschiktheid tot werken
      wegens ziekte die zijn aangevangen in de vijf jaren na aanvang van zijn dienstbetrekking. Voor het bepalen van de
      perioden van ongeschiktheid tot werken wegens ziekte is [artikel 29, vijfde lid, tweede en derde zin][ref6], van
      overeenkomstige toepassing. De uitbetaling van het ziekengeld, bedoeld in de eerste zin, vindt niet eerder plaats
      dan de eerste dag van de veertiende week van de ongeschiktheid tot werken.

      2 Het ziekengeld, bedoeld in het eerste lid, bedraagt 70% van het dagloon van de werknemer.

      3 In afwijking van het tweede lid wordt het ziekengeld in het tijdvak van 52 weken vanaf de eerste dag van
      ongeschiktheid tot werken wegens ziekte van de werknemer, bedoeld in [artikel 3][ref7], op verzoek van de werkgever
      gesteld op het dagloon, met dien verstande dat het ziekengeld niet meer kan bedragen dan de aanspraak van de
      werknemer op het loon dat de werkgever verschuldigd zou zijn, indien daarop geen ziekengeld in mindering zou zijn
      gebracht.

      4 Dit artikel is niet van toepassing indien de werknemer werkzaam is in een dienstbetrekking in de zin van
      [artikel 2][ref8] of [7 van de Wet sociale werkvoorziening][ref9].

      5 Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden onderbrekingen van het recht op
      uitkering op grond van de [Werkloosheidswet][ref10] van ten hoogste vier weken gelijkgesteld met perioden waarin de
      werknemer recht had op een uitkering op grond van de [Werkloosheidswet][ref11].

      6 De werknemer die is geboren voor 1 januari 1962 en die onmiddellijk voorafgaand aan een dienstbetrekking
      als bedoeld in [artikel 3][ref12], [4][ref13] of [5][ref14], welke is aangevangen in de periode van 1 januari
      2018 tot en met 31 december 2019, gedurende ten minste 52 weken recht had op een uitkering op grond van
      [hoofdstuk II van de Werkloosheidswet][ref15], heeft vanaf de eerste dag van zijn ongeschiktheid tot werken wegens
      ziekte recht op ziekengeld over perioden van ongeschiktheid tot werken wegens ziekte die zijn aangevangen in de
      vijf jaren na aanvang van zijn dienstbetrekking.

      7 Met uitzondering van de eerste volzin van het eerste lid, zijn het eerste tot en met vijfde lid van
      overeenkomstige toepassing op het zesde lid.


