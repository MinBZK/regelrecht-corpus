      [Artikel 29b][ref1], zoals dat luidde op de dag voor de inwerkingtreding van
      [artikel 1.4, onderdeel G, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2],
      blijft van toepassing op de werknemer die op of voor die dag recht had op ziekengeld op grond van
      [dat artikel][ref3]. Het ziekengeld, bedoeld in de eerste volzin, wordt niet betaald na de periode waarover
      de werknemer op grond van [artikel 29b][ref4], zoals dat luidde op de dag voor de inwerkingtreding van
      [artikel 1.4, onderdeel G, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref5],
      recht had.


