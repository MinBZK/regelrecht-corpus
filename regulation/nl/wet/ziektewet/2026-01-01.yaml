  - number: '7'
    text: |-
      Voor de toepassing van deze wet wordt als werknemer beschouwd:

      a. degene, die krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref1] uitkering ontvangt;

      b. in door Onze Minister aan te wijzen gevallen degene die:

      1° in een kalenderweek ten minste vijf arbeidsuren minder heeft dan zijn gemiddeld aantal arbeidsuren per
      kalenderweek of een aantal arbeidsuren heeft dat ten hoogste gelijk is aan de helft van zijn gemiddeld aantal
      arbeidsuren per kalenderweek als bedoeld in [artikel 16, eerste lid, onderdeel a, van de Werkloosheidswet][ref2],
      doch aan wie geen uitkering wordt verleend op grond van enige bepaling van die wet; of

      2° als gevolg van de regels gesteld in de ministeriële regeling op grond van artikel 1a, tweede lid, van de
      Werkloosheidswet geen arbeidsuren minder heeft als bedoeld onder 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel7
