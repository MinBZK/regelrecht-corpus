  - number: 29g
    text: |-
      1 De verzekerde die ziekengeld ontvangt is verplicht in voldoende mate te trachten mogelijkheden tot het verrichten
      van passende arbeid te behouden of te verkrijgen.

      2 Ter naleving van de plicht, bedoeld in het eerste lid, is de verzekerde die ziekengeld ontvangt in elk geval
      verplicht:

      a. zich geneeskundig te laten behandelen of aanwijzingen van een arts op te volgen indien het
      Uitvoeringsinstituut werknemersverzekeringen of het re-integratiebedrijf in opdracht van het Uitvoeringsinstituut
      werknemersverzekeringen, daartoe opdracht geeft en zijn genezing niet te belemmeren;

      b. mee te werken aan activiteiten of werkzaamheden, gericht op zijn inschakeling in de arbeid, die het
      Uitvoeringsinstituut werknemersverzekeringen wenselijk acht voor verkrijging van mogelijkheden tot verrichten van
      passende arbeid;

      c. mee te werken aan aanpassing van de arbeidsplaats en aan persoonsgebonden voorzieningen die het
      Uitvoeringsinstituut werknemersverzekeringen verstrekt voor verkrijging van mogelijkheden tot het verrichten van
      passende arbeid en zo nodig trachten die aanpassing en die voorzieningen te verkrijgen;

      d. mee te werken aan het opstellen van het plan van aanpak, bedoeld in
      [artikel 26, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], en het re-integratieplan, bedoeld
      in [artikel 30a, zesde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      e. te voldoen aan verplichtingen die zijn opgenomen in het plan van aanpak en het re-integratieplan, bedoeld in
      onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
