  - number: '34'
    text: |-
      1 In afwijking van [artikel 33, eerste lid][ref1], kan het Uitvoeringsinstituut werknemersverzekeringen, op verzoek
      van de werknemer, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering af te zien
      bij medewerking aan een schuldregeling, indien:

      a. redelijkerwijs te voorzien is dat de werknemer niet zal kunnen voortgaan met het betalen van zijn schulden of
      indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;

      c. een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen betrouwbaar voorstel voor
      een schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref2];

      d. aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en

      e. uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref3].

      2 Het eerste lid is niet van toepassing indien een vordering is ontstaan door het opzettelijk of door grove
      schuld niet nakomen door de werknemer van de verplichting, bedoeld in [artikel 31][ref4], en hiervoor een boete
      als bedoeld in [artikel 45a][ref5] is opgelegd, dan wel met betrekking tot het niet naleven van die verplichting
      aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref6].

      3 Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van
      de werknemer gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. de werknemer zijn schuld aan het Uitvoeringsinstituut werknemersverzekeringen niet overeenkomstig de
      schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel33
