    text: |-
      [Artikel 19aa][ref1] is niet van toepassing op de verzekerde die:

      a. verzekerd is op grond van [artikel 16 van de Wet op de arbeidsongeschiktheidsverzekering][ref2]; of

      b. recht heeft op toekenning of heropening van een arbeidsongeschiktheidsuitkering op grond van
      de [artikelen 19a][ref3], [20][ref4], [43a][ref5] onderscheidenlijk [47][ref6], [47a][ref7] of
      [47b van die wet][ref8].


