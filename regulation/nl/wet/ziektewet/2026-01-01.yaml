  - number: '30'
    text: |-
      1 De zieke werknemer is verplicht:

      a. passende arbeid te verrichten indien hij daartoe in de gelegenheid wordt gesteld;

      b. in voldoende mate te trachten passende arbeid te verkrijgen; en

      c. geen eisen te stellen in verband met door hem te verrichten arbeid die het aanvaarden of verkrijgen van passende
      arbeid belemmeren.

      2 Weigert de werknemer die aanspraak maakt op ziekengeld zonder deugdelijke grond de arbeid, bedoeld in het eerste
      lid, te verrichten, dan wordt het loon dat hij zou hebben ontvangen indien hij deze arbeid wel verricht had,
      beschouwd als inkomen als bedoeld in [artikel 31, eerste lid][ref1].

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde werknemer verplichten zich als
      werkzoekende te laten registreren en die registratie tijdig te doen verlengen, indien hem daartoe het recht toekomt
      op grond van [artikel 30b van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].

      4 Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen
      deskundige kunnen degene aan wie ziekengeld is toegekend voorschriften geven in het belang
      van een behandeling of van genezing dan wel voorzover dit voortvloeit uit de taak, bedoeld in
      [artikel 30 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], tot behoud, herstel en bevordering
      van de mogelijkheid tot het verrichten van arbeid.

      5 Onder passende arbeid als bedoeld in het eerste lid wordt, gedurende de eerste periode van zes maanden
      waarin recht bestaat op ziekengeld, verstaan arbeid die aansluit bij de arbeid waaruit de werknemer ziek is
      geworden. Na deze periode van zes maanden is alle arbeid die voor de krachten en bekwaamheden van de werknemer
      is berekend, passend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem
      kan worden gevergd. Niet als passend wordt beschouwd arbeid op grond van een dienstbetrekking als bedoeld in
      [hoofdstuk 2][ref4] of [3 van de Wet sociale werkvoorziening][ref5] of arbeid op grond waarvan men niet als
      werknemer in de zin van de Werkloosheidswet wordt aangemerkt. Bij of krachtens algemene maatregel van bestuur
      worden nadere regels gesteld omtrent het begrip passende arbeid, waarbij tevens wordt bepaald op welke wijze wordt
      vastgesteld of arbeid aansluit bij de arbeid waaruit de werknemer ziek is geworden, alsmede in welke gevallen een
      periode waarin een recht op uitkering op grond van de [Werkloosheidswet][ref6] bestaat, wordt meegeteld bij de
      vaststelling van de periode, bedoeld in de eerste zin.


