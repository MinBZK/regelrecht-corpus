  - number: '66'
    text: |-
      1 Het verzoek om toelating tot de vrijwillige verzekering wordt ingediend bij het Uitvoeringsinstituut
      werknemersverzekeringen:

      a. door de in [artikel 64, eerste lid, onderdelen a, b en c][ref1], bedoelde personen binnen dertien weken na het
      einde van hun verplichte verzekering;

      b. door de in [artikel 64, eerste lid, onderdeel f][ref2], bedoelde personen binnen dertien weken na dagtekening
      van de beschikking waarbij het recht op een uitkering werd beëindigd;

      c. door de in [artikel 64, eerste lid, onderdelen g, h en i][ref3], bedoelde personen binnen dertien weken na
      de dagtekening van de beschikking, waarbij de arbeidsongeschiktheidsuitkering onderscheidenlijk werd toegekend,
      herzien of ingetrokken.

      d. door de in [artikel 64, eerste lid, onderdeel j][ref4], bedoelde persoon: binnen dertien weken na de dag, waarop
      zijn werkzaamheden als zelfstandige of zijn werkzaamheden als echtgenoot van de zelfstandige in diens bedrijfs- of
      beroepsuitoefening, een aanvang hebben genomen;

      e. door de in [artikel 64, tweede lid, onderdeel a][ref5], bedoelde persoon: binnen dertien weken na de dag, waarop
      de verplichte verzekering is geëindigd;

      f. door de in [artikel 64, tweede lid, onderdelen b, c en e][ref6] bedoelde persoon: binnen dertien weken na de dag
      van zijn vertrek naar het buitenland dan wel, indien de in [artikel 64, tweede lid, onderdeel c][ref7], bedoelde
      werkzaamheden worden verricht in Nederland, binnen dertien weken na de dag waarop die werkzaamheden een aanvang
      hebben genomen;

      g. door de in [artikel 64, tweede lid, onderdeel d][ref8], bedoelde persoon: binnen dertien weken na de dag, waarop
      zijn werkzaamheden buiten Nederland een aanvang hebben genomen.

      2 De in het eerste lid, onderdeel c, bedoelde personen worden geacht een verzoek om toelating binnen dertien weken
      na de dagtekening van de beschikking te hebben gedaan, indien dit verzoek geschiedt binnen vier weken na de dag,
      waarop zij redelijkerwijze hebben kunnen kennis nemen van die beschikking.

      3 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek om toelating tot de
      vrijwillige verzekering, ingediend na de daartoe op grond van deze wet of de daarop berustende bepalingen gestelde
      termijn, geacht wordt tijdig te zijn ingekomen, indien de persoon die het verzoek heeft gedaan, redelijkerwijs niet
      geacht kan worden in verzuim te zijn geweest.

      4 De vrijwillige verzekering vangt aan:

      a. voor de in [artikel 64, eerste lid, onderdelen a, b en c, en tweede lid, onderdeel a][ref9], bedoelde persoon:
      op de dag na die, waarop de verplichte verzekering is geëindigd;

      b. voor de in [artikel 64, eerste lid, onderdelen d, e en j][ref10], bedoelde persoon: op de dag van ontvangst van
      zijn verzoek om toelating;

      c. voor de in [artikel 64, eerste lid, onderdeel f][ref11], bedoelde persoon: op de dag met ingang waarvan het
      recht op een uitkering krachtens de Wet werk en inkomen naar arbeidsvermogen is beëindigd;

      d. voor de in [artikel 64, eerste lid, onderdelen g, h en i][ref12], bedoelde persoon: op de dag met ingang
      waarvan de arbeidsongeschiktheidsuitkering krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref13] wordt
      toegekend, herzien of ingetrokken;

      e. voor de in [artikel 64, tweede lid, onderdelen b, c en e][ref14] bedoelde persoon: op de dag van zijn vertrek
      naar het buitenland dan wel, indien de in [artikel 64, tweede lid, onderdeel c][ref15], bedoelde werkzaamheden
      worden verricht in Nederland, op de dag waarop die werkzaamheden een aanvang hebben genomen;

      f. voor de in [artikel 64, tweede lid, onderdeel d][ref16], bedoelde persoon: op de dag, waarop zijn werkzaamheden
      buiten Nederland een aanvang hebben genomen.


