  - number: 19a
    text: |-
      1 Geen recht op ziekengeld heeft de verzekerde gedurende de periode dat hij niet in Nederland woont.

      2 Het eerste lid is niet van toepassing indien de verzekerde woont in een land waarin op grond van een verdrag of
      een besluit van een volkenrechtelijke organisatie recht op ziekengeld kan bestaan.

      3 Indien het recht op ziekengeld op grond van het eerste lid is geëindigd dan wel niet is ontstaan, wordt
      betrokkene vanaf de dag:

      a. dat hij in Nederland woont; of

      b. dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een
      volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op ziekengeld kan bestaan; weer als
      verzekerde aangemerkt indien hij op die dag aan de overige voorwaarden, bedoeld in de [artikelen 19][ref1] en
      [19aa][ref2], voldoet. Deze verzekerde heeft aanspraak op heropening dan wel toekenning van het recht op ziekengeld
      voor de resterende periode, bedoeld in [artikel 29, vijfde lid][ref3], dan wel [artikel 29a, vierde lid][ref4], met
      inachtneming van de bepalingen van deze wet.

      4 Bij of krachtens algemene maatregel van bestuur kan bepaald worden dat de verzekerde of zijn in hetzelfde land
      wonende gezinslid gedurende de periode dat de verzekerde niet in Nederland woont recht heeft op ziekengeld indien
      hij:

      a. werkzaamheden verricht in het algemeen belang; of

      b. in Curaçao, Aruba, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel19a
