  - number: 8a
    text: |-
      1 Voor de toepassing van deze wet wordt mede als werknemer beschouwd degene, die op grond van de
      verplichte verzekering ingevolge de [Wet werk en inkomen naar arbeidsvermogen][ref1] dan wel ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] uitkering ontvangt.

      2 Het eerste lid is niet van toepassing op diegene die niet in Nederland woont.


