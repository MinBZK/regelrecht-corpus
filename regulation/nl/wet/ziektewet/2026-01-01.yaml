      2 In afwijking van [artikel 7:4, tweede lid, van de Algemene wet bestuursrecht][ref3], en met inachtneming van de
      overige artikelen van deze paragraaf, worden in een geschil als bedoeld in [artikel 75j][ref4] het bezwaarschrift
