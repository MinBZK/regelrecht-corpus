        artikel: 29b
        hoofdstuk: II
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0035333
        artikel: V
  - number: 52e
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de eigenrisicodrager kunnen, in het kader van de bevordering
      van de inschakeling in de arbeid, toestemming verlenen aan de persoon aan wie ziekengeld is toegekend, om op een
      proefplaats bij een werkgever gedurende maximaal zes maanden onbeloonde werkzaamheden te verrichten.

      2 Tijdens het verrichten van werkzaamheden op een proefplaats wordt het ziekengeld niet ingetrokken of herzien.

      3 De onbeloonde werkzaamheden op een proefplaats zijn:

      a. werkzaamheden, waartoe de persoon, bedoeld in het eerste lid, met zijn krachten en bekwaamheden in staat is;

      b. werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheidsverzekering ten
      behoeve van de persoon, bedoeld in het eerste lid, heeft afgesloten;

      c. werkzaamheden, die de persoon, bedoeld in het eerste lid, niet reeds eerder onbeloond op een proefplaats bij die
      werkgever of diens rechtsvoorganger heeft verricht; en

      d. werkzaamheden waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel
      uitzicht is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor
      ten minste 6 maanden.

      4 Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode van
      onderbreking, voor de toepassing van dat lid buiten beschouwing gelaten.

      5 In afwijking van [artikel 30, eerste lid, onderdeel b][ref1], is de persoon die onbeloonde werkzaamheden op een
      proefplaats als bedoeld in het eerste of tweede lid verricht, voor de duur van de proefplaatsing niet verplicht
      passende arbeid te verkrijgen.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel30
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel52e
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '30'
        hoofdstuk: II
        afdeling: Tweede
  - number: 52f
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag van toestemming als
      bedoeld in [artikel 52e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel52e
