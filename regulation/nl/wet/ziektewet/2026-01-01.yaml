  - number: 29b
    text: |-
      1 De werknemer:

      a. die onmiddellijk voorafgaand aan een dienstbetrekking als bedoeld in [artikel 3][ref1], [4][ref2] of
      [5][ref3], recht had op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4],

      b. van wie in een arbeidskundig onderzoek is vastgesteld dat hij op de eerste dag na afloop
      van de wachttijd, bedoeld in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref5]
      of van het tijdvak, bedoeld in [artikel 24, eerste lid][ref6], [25, negende lid][ref7], of
      [26, tweede lid, tweede zin, van die wet][ref8] of na afloop van het tijdvak, bedoeld in
      [artikel 629, elfde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref9] dan wel van het tijdvak, bedoeld
      in [artikel 29, tiende lid, onderdeel a][ref10], of [artikel 76a, zesde lid, onderdeel a][ref11],:

      1°. minder dan 35% arbeidsongeschikt is,

      2°. alsmede op de eerste dag van elf weken voorafgaand aan die dag geen dienstbetrekking meer had of geen
      dienstbetrekking had met een andere werkgever dan zijn eigen werkgever, tenzij de dienstbetrekking met die andere
      werkgever reeds bestond op de eerste dag van de wachttijd,

      3°. niet in staat is tot het verrichten van eigen of andere passende arbeid bij de eigen werkgever, en

      4°. binnen vijf jaar na die dag in dienstbetrekking werkzaamheden gaat verrichten bij een werkgever,

      c. die de leeftijd van achttien jaar nog niet heeft bereikt en in verband met ziekte of gebrek een belemmering
      ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat onderwijs
      arbeid in dienstbetrekking gaat verrichten, of

      d. die geen werknemer is als bedoeld in het tweede lid, onderdeel a, achttien jaar is of ouder en in verband met
      ziekte of gebrek een belemmering ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar
      na afronding van dat onderwijs arbeid in dienstbetrekking gaat verrichten,

      heeft vanaf de eerste dag van zijn ongeschiktheid tot werken recht op ziekengeld over perioden van ongeschiktheid
      tot werken wegens ziekte die zijn aangevangen in de vijf jaren na aanvang van de dienstbetrekking.

      2 De werknemer:

      a. die voorafgaand aan zijn dienstbetrekking, bedoeld in [artikel 3][ref12], [4][ref13] of [5][ref14],
      recht had of heeft gehad op een arbeidsongeschiktheidsuitkering of arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref15],

      b. die een arbeidsovereenkomst heeft gesloten met een werkgever als bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref16],

      c. wiens dienstbetrekking, bedoeld in [artikel 3][ref17], [4][ref18] of [5][ref19], is aangevangen
      voordat zijn recht op een arbeidsongeschiktheidsuitkering of arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref20] ontstond, omdat die dienstbetrekking is
      aangevangen voordat hij achttien jaar werd,

      d. die onmiddellijk voorafgaande aan zijn dienstbetrekking met een werkgever, niet zijnde een werkgever
      als bedoeld in [artikel 7 van de Wet sociale werkvoorziening][ref21], een dienstbetrekking had als bedoeld
      in [artikel 2 van de Wet sociale werkvoorziening][ref22] of een dienstbetrekking had, die is aangewezen op
      grond van [artikel 38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref23] of een nog geldende
      indicatiebeschikking had op grond van [artikel 11 van de Wet sociale werkvoorziening][ref24], zoals dat artikel
      luidde op 31 december 2014,

      e. die, voorafgaand aan zijn dienstbetrekking, bedoeld in [artikel 3][ref25], [4][ref26] of [5][ref27] die
      is aangevangen op of na 1 januari 2015, een persoon is die met ondersteuning bij de arbeidsinschakeling van
      het college van burgemeester en wethouders op grond van [artikel 7, eerste lid, onderdeel a][ref28], of
      artikel [7a, eerste lid, onderdeel a, of derde lid, van de Participatiewet][ref29] naar een dienstbetrekking
      is of werd toegeleid of een persoon is ten behoeve van wie loonkostensubsidie wordt verstrekt op grond
      van [artikel 10d, tweede lid, van de Participatiewet][ref30], en van wie door het Uitvoeringsinstituut
      werknemersverzekeringen is vastgesteld dat hij niet in staat is tot het verdienen van het wettelijk minimumloon,
      bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref31], dan wel van wie door het college van
      burgemeester en wethouders in overeenstemming met de eisen gesteld aan een loonwaardevaststelling op grond van
      artikel 10d, eerste of tweede lid, van de Participatiewet een loonwaarde is vastgesteld die minder bedraagt dan het
      wettelijk minimumloon, bedoeld in artikel 2, onderdeel c, van de Participatiewet, of

      f. die arbeid verricht in een dienstbetrekking als bedoeld in
      [artikel 10b, eerste lid, van de Participatiewet][ref32], niet zijnde een werknemer als bedoeld in onderdeel e

      heeft vanaf de eerste dag van zijn ongeschiktheid tot werken recht op ziekengeld over perioden van
      ongeschiktheid tot werken wegens ziekte die zijn aangevangen na aanvang van de dienstbetrekking.
      Het recht op ziekengeld van de werknemer, bedoeld in onderdeel c, ontstaat niet eerder dan
      zijn recht op een arbeidsongeschiktheidsuitkering of arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref33]. Het recht op ziekengeld van de werknemer,
      bedoeld in onderdeel e, ontstaat niet eerder dan het moment waarop hij een arbeidsbeperkte wordt als bedoeld in
      [artikel 38b, eerste of tweede lid, van de Wet financiering sociale verzekeringen][ref34].

      3 Op de werknemer, bedoeld in het tweede lid, onderdelen d, e en f, zijn het eerste lid, onderdelen c en d, niet
      van toepassing.

      4 De werknemer die recht heeft op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref35]
      en ten aanzien van wie een dienstbetrekking, bedoeld in [artikel 3][ref36], [4][ref37] of [5][ref38], bij diens
      werkgever wordt voortgezet nadat dat recht is vastgesteld, heeft vanaf de eerste dag van zijn ongeschiktheid tot
      werken recht op ziekengeld over perioden van ongeschiktheid tot werken wegens ziekte die zijn aangevangen in de
      vijf jaren na vaststelling van het recht op uitkering.

      5 Het ziekengeld, bedoeld in het eerste, tweede en vierde lid, bedraagt 70% van het dagloon van de verzekerde.

      6 In afwijking van het vijfde lid wordt het ziekengeld in het tijdvak van 52 weken vanaf de eerste dag van
      ongeschiktheid tot werken van de werknemer, bedoeld in [artikel 3][ref39], op verzoek van de werkgever gesteld
      op het dagloon, met dien verstande dat het ziekengeld niet meer kan bedragen dan de aanspraak van de werknemer
      op het loon dat de werkgever verschuldigd zou zijn, indien daarop geen ziekengeld in mindering zou zijn
      gebracht. Indien de werknemer op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref40] over
      de eerste twee dagen van het tijdvak, bedoeld in de eerste zin, geen recht op loon heeft, wordt, in afwijking
      van de eerste zin, het ziekengeld over elk van deze dagen gesteld op de hoogte van het ziekengeld op de dag
      direct volgend op die twee dagen. Voor het bepalen van het tijdvak van 52 weken zijn de tweede en derde zin van
      [artikel 29, vijfde lid][ref41], van overeenkomstige toepassing.

      7 Indien de werknemer, bedoeld in het tweede lid, werkzaam is op een arbeidsovereenkomst als bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref42], wordt het dagloon, bedoeld in het vijfde en zesde
      lid, verminderd met het, naar werkdagen herleide, aan de werkgever verstrekte subsidiebedrag, bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref43].

      8 Dit artikel is niet van toepassing indien de werknemer werkzaam is in een dienstbetrekking in de zin van
      [artikel 2 van de Wet sociale werkvoorziening][ref44].

      9 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van het tweede lid.

      10 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt op verzoek van de werknemer of de persoon die
      verwacht een dienstbetrekking met een werkgever te zullen aangaan een verklaring of de aanvrager naar het oordeel
      van het Uitvoeringsinstituut werknemersverzekeringen voldoet aan de voorwaarden voor toepassing van het eerste lid,
      onderdeel c of d.

      11 Het bepaalde in het tweede en derde lid inzake het tweede lid, onderdeel e, is van overeenkomstige toepassing op
      een arbeidsbeperkte als bedoeld in:

      a. [artikel 38b, eerste lid, onderdelen d, e en f, van de Wet financiering sociale verzekeringen][ref45];

      b. [artikel 38b, tweede lid, van de Wet financiering sociale verzekeringen][ref46].

      12 Voor de toepassing van dit artikel wordt onder een werknemer als bedoeld in het tweede lid of
      arbeidsbeperkte als bedoeld in het elfde lid tevens verstaan de persoon die niet langer aan de voorwaarden
      op grond van het tweede of elfde lid voldoet en als arbeidsbeperkte wordt beschouwd op grond van
      [artikel 38b, zesde lid, van de Wet financiering sociale verzekeringen][ref47] voor zover het betreft zijn
      perioden van ongeschiktheid tot werken wegens ziekte die zijn aangevangen voordat zijn opname in de registratie van
      arbeidsbeperkten, bedoeld in [artikel 38d, eerste lid, van die wet][ref48], eindigt.


