  - number: '104'
    text: |-
      1 In afwijking van het in de [artikelen 29, vijfde lid][ref1], en [76a, derde en achtste lid][ref2], genoemde
      tijdvak van 6 weken, geldt tot een bij koninklijk besluit te bepalen tijdstip een tijdvak van dertien weken voor de
      werknemer die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref3] bedoelde leeftijd heeft bereikt.

      2 Indien de ongeschiktheid wegens ziekte een aanvang heeft genomen voor de datum waarop de werknemer
      de in het eerste lid bedoelde leeftijd heeft bereikt, geldt vanaf die datum voor de toepassing van
      [artikel 76a, derde en achtste lid][ref4], de in het eerste lid genoemde tijdvak, voor zover het totale tijdvak
      niet meer bedraagt dan 104 weken.

      3 Indien de ongeschiktheid tot het verrichten van arbeid wegens ziekte een aanvang heeft genomen voor het op grond
      van het eerste lid vast te stellen tijdstip blijft het in het eerste lid genoemde tijdvak van dertien weken gelden.

      4 Het tijdstip, bedoeld in het eerste lid, wordt niet eerder vastgesteld, dan nadat:

      a. Onze Minister een verslag over de doeltreffendheid en de effecten van de
      [Wet werken na de AOW-gerechtigde leeftijd][ref5] (Kamerstukken ) in de praktijk gedurende de eerste twee jaren na
      inwerkingtreding van die wet, aan de beide kamers der Staten-Generaal heeft gezonden; en

      b. acht weken zijn verstreken nadat het voornemen tot het vaststellen van dat tijdstip is meegedeeld aan de beide
      kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
