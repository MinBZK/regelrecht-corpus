      1 Als werknemer in de zin van [artikel 29b, eerste lid][ref1], wordt, naast de werknemers
      bedoeld in dat lid, eveneens aangemerkt de persoon die voorafgaand aan de inwerkingtreding van
      [artikel 1.4, onderdeel G, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2]
      arbeidsgehandicapte was op grond van [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref3],
      zoals dat luidde op de dag voorafgaand aan de dag waarop [dat artikel][ref4] vervalt op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref5], voor de duur
      van:

      a. zijn arbeidsongeschiktheidsuitkering en vijf jaar na die periode voor de arbeidsgehandicapte, bedoeld in dat
      [artikel 2, eerste lid, onderdeel a, van de Wet op de (re)integratie arbeidsgehandicapten][ref6];

      b. de toekenning van de voorziening en vijf jaar na die periode voor de arbeidsgehandicapte, bedoeld in dat
      [artikel 2, eerste lid, onderdeel b, van de Wet op de (re)integratie arbeidsgehandicapten][ref7];

      c. de indicatiebeschikking of herindicatiebeschikking op grond van de
      [Wet sociale werkvoorziening][ref8] voor de arbeidsgehandicapte, bedoeld in dat
      [artikel 2, eerste lid, onderdeel c, van de Wet op de (re)integratie arbeidsgehandicapten][ref9];

      d. vijf jaar na de beëindiging van zijn dienstbetrekking op grond van de
      [Wet sociale werkvoorziening][ref10] voor de arbeidsgehandicapte, bedoeld in dat
      [artikel 2, eerste lid, onderdeel d, van de Wet op de (re)integratie arbeidsgehandicapten][ref11];

      e. vijf jaar na de herindicatiebeschikking op grond van de
      [Wet sociale werkvoorziening][ref12] voor de arbeidsgehandicapte, bedoeld in dat
      [artikel 2, eerste lid, onderdeel e, van de Wet op de (re)integratie arbeidsgehandicapten][ref13];

      f. vijf jaar na beëindiging van zijn arbeidsongeschiktheidsuitkering
      of de eindiging van de voorziening, bedoeld in dat
      __REF000___________________________________________________________________________________________________________
      _________, bedoeld in het [tweede lid van dat artikel][ref15];

      g. vijf jaar na de dag waarop, in verband met ziekte of gebrek een belemmering bij het
      verkrijgen of verrichten van arbeid is ontstaan voor de arbeidsgehandicapte, bedoeld in dat
      [artikel 2, derde of vierde lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref16].

      2 In afwijking van het eerste lid, onderdeel a, geldt geen duurbeperking
      voor de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.4, onderdeel G, van de Wet Invoering en financiering Wet Werk en inkomen naar arbeidsvermogen][ref17]
      arbeidsgehandicapte was op grond van zijn recht op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref18].


