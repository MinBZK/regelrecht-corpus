        artikel: 72c
        paragraaf: '1'
        afdeling: Derde
  - number: 72c
    text: |-
      1 Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van deze wet kan door
      de werknemer uitsluitend bij het Uitvoeringsinstituut werknemersverzekeringen worden ingediend. Het
      Uitvoeringsinstituut werknemersverzekeringen geeft de beschikking binnen dertien weken na ontvangst van de
      aanvraag.

      2 Een beschikking die uitsluitend betrekking heeft op het al dan niet bestaan of voortbestaan van de
      ongeschiktheid tot werken, waarvoor geen beoordeling als bedoeld in [artikel 19ab, eerste lid][ref1], nodig
      is, wordt gegeven binnen vier weken na ontvangst van de aanvraag, de aangifte van de ongeschiktheid of van de
      ziekmelding aan het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in de [artikelen 29a, vierde lid][ref2],
      [38, tweede lid][ref3], [38a, tweede en derde lid][ref4], [38aa, eerste lid][ref5], en [38ab, eerste lid][ref6].

      3 Indien een beschikking als bedoeld in het eerste of tweede lid niet binnen de toepasselijke termijn kan worden
      gegeven, wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19ab
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel38
