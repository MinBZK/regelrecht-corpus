  - number: 76b
    text: |-
      1 Bij algemeen verbindend voorschrift kan worden bepaald dat de aanspraak, bedoeld in
      [artikel 76a, eerste lid][ref1], niet bestaat indien:

      a. de ziekte is voorgewend, althans zodanig overdreven is voorgesteld, dat reden voor verhindering niet kan worden
      aangenomen;

      b. de ziekte door opzet van de betrokkene is veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand
      geen verwijt kan worden gemaakt;

      c. de verhindering het gevolg is van een ziekte of gebrek waarover betrokkene bij het aangaan van de
      arbeidsverhouding opzettelijk valse inlichtingen aan de werkgever jegens wie de persoon, bedoeld in
      [artikel 76][ref2], krachtens publiekrechtelijke aanstelling gehouden is tot het verrichten van arbeid, heeft
      verstrekt.

      2 Bij algemeen verbindend voorschrift kan worden bepaald dat de aanspraak, bedoeld in
      [artikel 76a, eerste lid][ref3], vervalt wanneer en voor zolang betrokkene:

      a. weigert zich te onderwerpen aan een onderzoek vanwege de bedrijfsgeneeskundige of een daarmee gelijk te stellen
      geneeskundige of, na voor zulk een onderzoek te zijn opgeroepen, zonder geldige reden niet verschijnt;

      b. weigert de volledige medewerking te verlenen aan een geneeskundig onderzoek, een observatie of een maatregel
      in het belang van het behoud, het herstel of de bevordering van zijn arbeidsgeschiktheid, tenzij de maatregel een
      ingreep van heelkundige aard mocht zijn;

      c. zonder voldoende gronden nalaat zich onder behandeling van een geneeskundige te stellen of blijven stellen, dan
      wel zich niet houdt aan de voorschriften hem door de behandelende geneeskundige gegeven, met dien verstande dat te
      dezen voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard zijn uitgezonderd;

      d. zich zodanig gedraagt dat zijn genezing wordt belemmerd of vertraagd;

      e. tijdens de verhindering dienst te verrichten, voor zichzelf of derden arbeid verricht tenzij dit door de
      bedrijfsgeneeskundige of een daarmee gelijk te stellen geneeskundige in het belang van zijn genezing wenselijk
      wordt geacht;

      f. in gebreke blijft op het door de bedrijfsgeneeskundige of een daarmee gelijk te stellen geneeskundige bepaalde
      tijdstip en in de door deze bepaalde mate zijn dienst te hervatten, tenzij hij daarvoor een inmiddels opgekomen,
      door deze als geldig erkende reden heeft opgegeven;

      g. weigert passende arbeid te verrichten welke door het bevoegd gezag wordt opgedragen en waartoe hij door de
      bedrijfsgeneeskundige of een daarmee gelijk te stellen geneeskundige in staat wordt geacht;

      h. zonder deugdelijke grond weigert mee te werken aan door de werkgever, bedoeld in het eerste lid, onderdeel c, of
      een door hem aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen die erop gericht zijn
      de betrokkene in staat te stellen passende arbeid te verrichten;

      i. zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan
      van aanpak als bedoeld in [artikel 25, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref4] en
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref5].

      3 Bij algemeen verbindend voorschrift kan worden bepaald dat de aanspraak, bedoeld in
      [artikel 76a, eerste lid][ref6], geheel of ten dele vervallen kan worden verklaard indien betrokkene de voor hem
      terzake van afwezigheid tijdens ziekte gestelde voorschriften overtreedt.

      4 Algemeen verbindende voorschriften waarin geen speciale regeling is getroffen voor de aanspraken bij ziekte op
      bezoldiging of hetgeen daarmee overeenkomt gelden voor de toepassing van [76a, derde lid][ref7], als voorschriften
      waarbij van [artikel 76a, eerste lid][ref8], wordt afgeweken.

      5 Het tweede lid, onderdeel i, is niet van toepassing indien de betrokkene de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref9] bedoelde leeftijd heeft bereikt.


