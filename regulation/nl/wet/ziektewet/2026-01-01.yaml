  - number: 8c
    text: |-
      Voor de toepassing van deze wet wordt mede als werknemer beschouwd:

      a. de werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van de Wet arbeid en zorg][ref1] aan wie
      uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van die wet](onbekend);

      b. in door Onze Minister aan te wijzen gevallen, degene die in verband met zwangerschap en bevalling niet werkt,
      anders dan bedoeld in [artikel 29a][ref2], doch aan wie geen uitkering wordt betaald op grond van [hoofdstuk 3,
      afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend);

      c. de werknemer, bedoeld in [artikel 3:6, eerste lid, onderdeel a, van de Wet arbeid en zorg][ref3] aan
      wie een uitkering wordt betaald op grond van de [artikelen 4:2b, eerste tot en met zesde lid][ref4], of
