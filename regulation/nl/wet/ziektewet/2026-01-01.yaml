  - number: '105'
    text: |-
      1 Het in [artikel 76a, eerste lid][ref1], genoemde tijdvak van 104 weken blijft gedurende zes maanden na het tijdstip
      van inwerkingtreding van [artikel III, onderdeel F, van de Wet werken na de AOW-gerechtigde leeftijd][ref2] van
      toepassing op de werknemer:

      a. die op de dag voor het tijdstip van inwerkingtreding ten minste de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref3] bedoelde leeftijd heeft, dan wel binnen zes maanden
      na dat tijdstip deze leeftijd bereikt, en

      b. die voor het tijdstip van inwerkingtreding en tevens, al dan niet na een onderbreking gedurende minder dan vier
      weken, na dat tijdstip verhinderd is om de dienst te verrichten of het ambt te vervullen wegens ongeschiktheid als
      gevolg van ziekte.

      2 Na afloop van de in het eerste lid genoemde termijn van zes maanden, geldt het in [artikel 104][ref4] genoemde
      tijdvak van dertien weken voor zover het totale tijdvak waarin aanspraak bestaat op bezoldiging, bedoeld in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref5], dan wel van hetgeen daarmee overeenkomt niet meer
      bedraagt dan 104 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
