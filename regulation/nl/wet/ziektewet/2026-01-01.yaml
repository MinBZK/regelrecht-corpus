  - number: '61'
    text: |-
      1 In afwijking van [artikel 60][ref1] komen de uitkeringen op grond van deze wet ten aanzien van overheidswerknemers
      en degenen die op grond van [artikel 7][ref2], [artikel 8][ref3] of [artikel 8a][ref4] werknemer zijn wegens
      het ontvangen van een uitkering uit hoofde van een dienstbetrekking als overheidswerknemer, ten laste van het
      Uitvoeringsfonds voor de overheid, bedoeld in [artikel 106 van de Wet financiering sociale verzekeringen][ref5].

      2 In afwijking van het eerste lid en [artikel 60][ref6] komen de uitgaven en de kosten
      verbonden aan de verstrekking van uitkeringen en aan de reïntegratie van personen als bedoeld in
      [artikel 4, eerste lid, onderdelen i en j][ref7], alsmede de op grond van enige wet over deze uitkeringen door het
      Uitvoeringsinstituut werknemersverzekeringen verschuldigde premies die niet op deze uitkeringen in mindering kunnen
      worden gebracht en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref8], ten
      laste van het Rijk.


