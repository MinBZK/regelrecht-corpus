  - number: 39a
    text: |-
      1 Indien bij de behandeling van de aangifte of de beoordeling, bedoeld in [artikel 38, tweede lid][ref1],
      blijkt dat de werkgever zonder deugdelijke grond zijn verplichtingen op grond van de tweede zin van dat lid
      of [artikel 71a, eerste, tweede, of vijfde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      dan wel de krachtens het [zevende lid van dat artikel][ref3] gestelde regels of op grond van
      [artikel 25, eerste, tweede, of vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref4] dan wel
      de krachtens het zevende lid van dat artikel gestelde regels, niet of niet volledig nakomt of onvoldoende
      reïntegratie-inspanningen heeft verricht, verhaalt het Uitvoeringsinstituut werknemersverzekeringen op die
      werkgever het ziekengeld, alsmede de op grond van enige wet over deze uitkering verschuldigde premies die
      niet op deze uitkering in mindering kunnen worden gebracht en de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 42 van de Zorgverzekeringswet][ref5], dat zal worden betaald over een door het Uitvoeringsinstituut
      werknemersverzekeringen vast te stellen tijdvak. Dit tijdvak vangt aan op de eerste dag van ongeschiktheid tot
      werken nadat de dienstbetrekking is geëindigd en wordt afgestemd op de periode waarin de werkgever de in de vorige
      volzin bedoelde verplichtingen of regels niet is nagekomen of onvoldoende reïntegratie-inspanningen heeft verricht.
      Het tijdvak bedraagt ten hoogste 52 weken. Indien binnen het door het Uitvoeringsinstituut werknemersverzekeringen
      vastgestelde tijdvak een periode van ongeschiktheid tot werken gedurende een periode van vier weken of meer wordt
      onderbroken door geschiktheid tot werken, wordt het ziekengeld over de periode van ongeschiktheid tot werken
      die is gelegen na die vier weken of meer weken, niet verhaald op de werkgever, bedoeld in de eerste zin. Het
      Uitvoeringsinstituut werknemersverzekeringen stelt regels met betrekking tot het vaststellen van het in de tweede
      zin bedoelde tijdvak. Deze regels behoeven de goedkeuring van Onze Minister.

      2 Indien de werkgever, bedoeld in het eerste lid, niet meer bestaat, wordt voor de toepassing van het eerste lid
      onder werkgever verstaan de rechtsopvolger van die werkgever. De eerste zin is niet van toepassing met betrekking
      tot de rechtsopvolger na faillissement.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde bedragen invorderen bij
      dwangbevel.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld.


