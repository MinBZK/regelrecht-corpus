  - number: 45a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste het
      benadelingsbedrag wegens het niet of niet behoorlijk nakomen door de verzekerde van de verplichting,
      bedoeld in [artikel 31, eerste lid][ref1], of [49][ref2]. Indien de feiten en omstandigheden, bedoeld in
      artikel 31, eerste lid, of 49, niet of niet behoorlijk zijn medegedeeld en deze overtredingen opzettelijk
      zijn begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3]. Indien de feiten en omstandigheden, bedoeld in
      artikel 31, eerste lid, of 49, niet of niet behoorlijk zijn medegedeeld en deze overtredingen niet opzettelijk zijn
      begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde
      lid, van het Wetboek van Strafrecht.

      2 In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in de [artikelen 31, eerste lid][ref4] of [49][ref5], ten onrechte
      of tot een te hoog bedrag aan ziekengeld is ontvangen.

      3 Indien het niet of niet behoorlijk nakomen door de verzekerde van de verplichting, bedoeld in de
      [artikelen 31, eerste lid][ref6] of [49][ref7], niet heeft geleid tot een benadelingsbedrag, legt het
      Uitvoeringsinstituut werknemersverzekeringen een bestuurlijke boete op van ten hoogste het bedrag van de tweede
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref8].

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete en
      volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen door de
      verzekerde van de verplichting, bedoeld in de [artikelen 31, eerste lid][ref9] of [49][ref10], in situaties die
      bij algemene maatregel van bestuur worden bepaald, tenzij het niet of niet behoorlijk nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde een zodanige
      waarschuwing is gegeven.

      5 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op wegens het niet of niet
      behoorlijk nakomen door de verzekerde van de verplichting, bedoeld in de [artikelen 31, eerste lid][ref11],
      of [49][ref12], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan ziekengeld is ontvangen, van ten
      hoogste 150 procent van het benadelingsbedrag, met overeenkomstige toepassing van het eerste lid, indien binnen
      een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de overtreding een eerdere bestuurlijke boete
      of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde gedraging, die
      onherroepelijk is geworden.

      6 Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in de [artikelen 31, eerste lid][ref13], of
      [49][ref14] van deze wet, [12 van de Toeslagenwet][ref15], [25 van de Werkloosheidswet][ref16],
      [12, eerste lid, van de Wet inkomensvoorziening oudere werklozen][ref17],
      [80 van de Wet op de arbeidsongeschiktheidsverzekering][ref18], of
      [27, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref19] als gevolg waarvan ten onrechte of tot een
      te hoog bedrag aan uitkering, ziekengeld of toeslag is verleend.

      7 In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens
      de eerdere overtreding, bedoeld in het vijfde lid, de verzekerde is gestraft met een onvoorwaardelijke
      gevangenisstraf.

      8 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete indien
      daarvoor dringende redenen aanwezig zijn.

      9 Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van
      belang zijn.

      10 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.

      11 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.

      12 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref20] kan de rechter in beroep of hoger
      beroep het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de verzekerde wijzigen.

      13 Er wordt geen bestuurlijke boete opgelegd indien voor dezelfde gedraging een bestuurlijke boete als bedoeld in
      [artikel 27a van de Werkloosheidswet][ref21] wordt opgelegd.

      14 Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest
      van opzet of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd
      niet nogmaals een overtreding wegens eenzelfde gedraging als bedoeld in het zesde lid is begaan, is het
      Uitvoeringsinstituut werknemersverzekeringen bevoegd op verzoek van degene aan wie de bestuurlijke boete is
      opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij medewerking aan een schuldregeling.
      [Artikel 34, eerste, derde en vierde lid][ref22], is van overeenkomstige toepassing.

      15 Het besluit tot kwijtschelding, bedoeld in het veertiende lid, wordt ingetrokken of ten nadele van degene aan
      wie de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding is begaan wegens eenzelfde gedraging als bedoeld in het zesde lid.


