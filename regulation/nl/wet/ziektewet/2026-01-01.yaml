  - number: 29f
    text: |-
      1 Het arbeidsverleden, bedoeld in [artikel 29e][ref1], wordt berekend door samentelling van:

      a. het aantal kalenderjaren, gelegen in de periode vanaf en met inbegrip van 1998 tot en met het kalenderjaar
      voorafgaand aan het kalenderjaar waarin de dag is gelegen waarop het recht op ziekengeld op grond van deze wet is
      ontstaan, waarover de werknemer aantoont over 52 of meer dagen per jaar loon te hebben ontvangen; en

      b. het aantal kalenderjaren vanaf en met inbegrip van het jaar waarin de werknemer zijn 18e verjaardag bereikte
      tot 1998.

      2 Een kalenderjaar wordt in aanmerking genomen bij de berekening, bedoeld in het eerste lid, onderdeel a, indien
      volgens de informatie als bedoeld in artikel 33d van de Wet structuur uitvoeringsorganisatie werk en inkomen, de
      werknemer in dat jaar over 52 of meer dagen loon heeft ontvangen.

      3 Voor de toepassing van het eerste lid, onderdeel a, worden met dagen waarover loon is ontvangen, gelijkgesteld:

      a. dagen waarover recht bestond op een uitkering die naar aard en strekking overeenkomt met een uitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] of met een uitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref3] voor zover deze uitkering wordt toegekend naar een
      arbeidsongeschiktheid van ten minste 80% respectievelijk wordt toegekend over periodes waarin de verzekerde slechts
      in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen per uur;

      b. dagen waarover een persoon een uitkering ontvangt op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref4], berekend naar een
      arbeidsongeschiktheid van ten minste 80% of een toelage op grond van dat hoofdstuk, die al dan niet
      vermeerderd met de arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend.

      4 Voor de toepassing van het eerste lid, onderdeel a, worden niet reeds in aanmerking genomen kalenderjaren
      waarin een persoon recht heeft op kinderbijslag op grond van [artikel 7 van de Algemene Kinderbijslagwet][ref5]
      of een andere gezinsbijslag als bedoeld in artikel 3, eerste lid, onderdeel j, van Verordening (EG) nr. 883/2004
      betreffende de coördinatie van socialezekerheidsstelsels (PbEU L166) voor een tot zijn huishouden behorend kind dat
      bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, voor de helft gelijkgesteld met
      kalenderjaren waarin over 52 of meer dagen loon is ontvangen. De in de eerste zin bedoelde persoon wordt aangemerkt
      als verzorgend persoon.

      5 In afwijking van het vierde lid worden over de periode tot 1 januari 2005, waarin een persoon recht heeft op
      kinderbijslag op grond van [artikel 7 van de Algemene Kinderbijslagwet][ref6] of een andere gezinsbijslag als
      bedoeld in artikel 3, eerste lid, onderdeel j, van Verordening (EG) nr. 883/2004 betreffende de coördinatie
      van socialezekerheidsstelsels (PbEU L166) voor een tot zijn huishouden behorend kind dat bij de aanvang van dat
      kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, gelijkgesteld met, en worden dergelijke kalenderjaren
      over de periode van 1 januari 2005 tot 1 januari 2007 voor drie kwart gelijkgesteld met, kalenderjaren waarin over
      52 of meer dagen loon is ontvangen.

      6 Voor de toepassing van het eerste lid, onderdeel a, worden niet reeds in aanmerking genomen kalenderjaren
      vanaf en met in begrip van een bij ministeriële regeling nader te bepalen kalenderjaar, waarin een persoon
      inkomsten ontvangt voor het verlenen van zorg op grond van een regeling voor persoonsgebonden budget, die
      is gegrond op [artikel 44, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref7]
      of op [artikel 5, eerste lid, van de Wet maatschappelijke ondersteuning][ref8], of die voldoet aan
      [artikel 14a van de Zorgverzekeringswet][ref9], voor de helft gelijkgesteld met kalenderjaren waarin
      over 52 of meer dagen loon is ontvangen, tenzij hij deze inkomsten ontvangt uit arbeid als bedoeld in
      [artikel 6, eerste lid, onderdeel e][ref10], van de Ziektewet. De eerste zin is uitsluitend van toepassing indien
      de in de eerste zin bedoelde persoon aantoont dat deze zorgverlening aan deze voorwaarden voldoet of heeft voldaan.
      Die persoon wordt aangemerkt als verzorgend persoon. Bij ministeriële regeling kunnen nadere regels worden gesteld
      met betrekking tot de uitvoering van dit lid.

      7 Het vierde, vijfde en zesde lid vinden geen toepassing indien de verzorgende persoon in een kalenderjaar voor
      een periode langer dan een half jaar als werknemer in de zin van een wettelijke regeling inzake werkloosheid recht
      heeft op een uitkering ter zake van werkloosheid of op de loongerelateerde uitkering op grond van hoofdstuk 7 van
      deze wet.

      8 Voor de toepassing van het vierde en vijfde lid wordt onder:

      a. een kind verstaan een eigen, aangehuwd of pleegkind;

      b. een pleegkind verstaan een kind dat als een eigen kind wordt onderhouden en opgevoed.

      9 Voor de toepassing van het eerste lid, onderdeel a, worden dagen, tot een maximum van achttien maanden, waarover
      de werknemer onbetaald verlof heeft genoten, gelijkgesteld met dagen, waarover loon is ontvangen.

      10 Voor de toepassing van dit artikel wordt niet als loon beschouwd een uitkering:

      a. op grond van de [Werkloosheidswet][ref11], met uitzondering van een uitkering op grond van
      [hoofdstuk IV van die wet][ref12];

      b. op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref13], met uitzondering van een
      uitkering aan de persoon die slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen
      per uur;

      c. op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref14], berekend naar een arbeidsongeschiktheid
      van minder dan 80%; of

      d. die naar aard en strekking overeenkomt met een uitkering als bedoeld in onderdeel a, b of c.

      11 Bij algemene maatregel van bestuur kunnen regels worden gesteld:

      a. ter vaststelling van het aantal dagen waarover loon is ontvangen, bedoeld in het eerste lid, onderdeel a, en
      tweede lid;

      b. op grond waarvan voor het bepalen van het aantal van 52 dagen, bedoeld in het eerste lid, onderdeel a, en tweede
      lid, dagen waarover, anders dan bedoeld in het negende lid, geen loon is ontvangen, worden gelijkgesteld met dagen
      waarover loon is ontvangen.


