  - number: 30aa
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 29g][ref1] en [30, eerste en tweede lid][ref2].

      2 Bij ministeriële regeling kunnen regels worden gesteld waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van de [artikelen 29g][ref3] en [30, eerste lid][ref4], opgelegd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan werknemers
      in individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hun op grond van
      [artikel 30, eerste lid][ref5], opgelegd.


