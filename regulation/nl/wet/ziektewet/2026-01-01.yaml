    text: |-
      1 De [artikelen 15][ref1] en [16][ref2] en de daarop berustende bepalingen en [artikel 29, zevende lid][ref3],
      zoals deze luidden voor 1 juli 2015 blijven van toepassing met betrekking tot de werknemer wiens eerste
      dag van werkloosheid op grond van de [Werkloosheidswet][ref4] is gelegen voor die inwerkingtreding mits
      het recht op ziekengeld, bedoeld in artikel 29, tweede lid, is ontstaan voor de omzetting, bedoeld in
      [artikel 130z, tweede lid][ref5], of [130aa, eerste lid, van de Werkloosheidswet][ref6].

      2 [Artikel 29h][ref7] is niet van toepassing met betrekking tot de werknemer wiens eerste dag van werkloosheid
      op grond van de [Werkloosheidswet][ref8] is gelegen voor 1 juli 2015, mits het recht op ziekengeld, bedoeld in
      [artikel 29, tweede lid][ref9], is ontstaan voor de omzetting, bedoeld in [artikel 130z, tweede lid][ref10], of
      [130aa, eerste lid, van de Werkloosheidswet][ref11].

      3 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


