  - number: 29a
    text: |-
      1 De vrouwelijke verzekerde heeft, indien zij, voorafgaand aan de dag waarop zij recht
      heeft op uitkering op grond van [artikel 3:7, eerste lid][ref1], [3:8, tweede lid][ref2],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref3], ongeschikt wordt tot het verrichten van haar arbeid en
      die ongeschiktheid haar oorzaak vindt in de zwangerschap recht op ziekengeld ter hoogte van haar dagloon vanaf de
      eerste dag waarop die ongeschiktheid bestaat.

      2 De vrouwelijke verzekerde die in de periode, waarin zij recht had kunnen hebben op uitkering op grond van
      [artikel 3:7, eerste lid][ref4], [3:8, tweede lid][ref5], of [3:10, eerste lid, van de Wet arbeid en zorg][ref6]
      doch die uitkering nog niet is aangevangen, wegens ziekte ongeschikt is tot het verrichten van haar arbeid,
      heeft recht op ziekengeld ter hoogte van haar dagloon. Dit ziekengeld wordt uitgekeerd vanaf de eerste dag van de
      ongeschiktheid tot werken.

      3 De vrouwelijke verzekerde heeft geen recht op ziekengeld over perioden waarover zij uitkering op grond van
      [artikel 3:7, eerste lid][ref7], [3:8, eerste lid][ref8], of [3:10, eerste lid, van de Wet arbeid en zorg][ref9]
      geniet.

      4 Nadat het recht op uitkering op grond van [artikel 3:7, eerste lid][ref10], [3:8, derde lid][ref11],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref12] is geëindigd, heeft de vrouwelijke verzekerde, indien
      zij aansluitend ongeschikt is tot het verrichten van haar arbeid en die ongeschiktheid haar oorzaak vindt in de
      bevalling of de daaraan voorafgaande zwangerschap, recht op ziekengeld ter hoogte van haar dagloon, zolang die
      ongeschiktheid duurt, doch ten hoogste gedurende 104 aaneengesloten weken. Dit ziekengeld wordt uitgekeerd vanaf de
      eerste dag nadat het recht op uitkering, bedoeld in de eerste zin, is geëindigd.

      5 [Artikel 29][ref13], vijfde lid, blijft buiten toepassing ten aanzien van de vrouwelijke verzekerde die, op grond
      van het tweede of vierde lid van dit artikel, recht heeft op ziekengeld ter hoogte van haar dagloon.

      6 De [artikelen 29g][ref14] en [30][ref15] blijven buiten toepassing ten aanzien van de vrouwelijke verzekerde die
      op grond van het eerste of tweede lid recht heeft op ziekengeld.


