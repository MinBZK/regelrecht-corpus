    text: |-
      1 De [artikelen 19, vijfde lid][ref1], [29, zesde lid][ref2], [30, vijfde en zesde lid][ref3], en [38ab][ref4] zijn
      niet van toepassing met betrekking tot het recht op ziekengeld van personen die voor de dag van de inwerkingtreding
      van de Wet van 12 december 2007, houdende regels tot bevordering van de activering van personen die aanspraak maken
      op een uitkering op grond van de Ziektewet (Stb. 2007, 553) recht hadden op ziekengeld.

      2 Ten aanzien van personen die voor de inwerkingtreding van de Wet van 12 december 2007, houdende regels tot
      bevordering van de activering van personen die aanspraak maken op een uitkering op grond van de Ziektewet (Stb.
      2007, 553) recht hadden op ziekengeld zijn met betrekking tot dat recht de [artikelen 29a, zesde lid][ref5],
      [38a][ref6], [45, eerste lid][ref7], en [72c, tweede lid][ref8], zoals deze luidden op de dag voor de
      inwerkingtreding van de in het eerste lid bedoelde wet van toepassing.


