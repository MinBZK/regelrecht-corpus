      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: '45'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen weigert het ziekengeld geheel of gedeeltelijk, tijdelijk of
      blijvend:

      a. indien de verzekerde niet binnen redelijke termijn geneeskundige hulp inroept en niet zich gedurende het gehele
      verloop van de ziekte onder behandeling blijft stellen of indien hij de voorschriften van de behandelende arts
      niet opvolgt;

      b. indien de verzekerde gedurende de ongeschiktheid tot werken zich schuldig maakt aan gedragingen, waardoor zijn
      genezing wordt belemmerd of nalaat voldoende mee te werken om aanpassing aan zijn ziekte of gebrek te verkrijgen;

      c. indien de verzekerde zonder deugdelijke grond nalaat gevolg te geven aan een verzoek, ingevolge deze wet gedaan
      door het Uitvoeringsinstituut werknemersverzekeringen om te verschijnen of indien het geneeskundig onderzoek door
      een door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige door toedoen van de verzekerde niet
      kan plaatshebben;

      d. indien de verzekerde het voorschrift, gegeven in [artikel 38a, eerste lid][ref1], of in
      [artikel 38ab, eerste lid][ref2], niet opgevolgd heeft;

      e. indien de verzekerde zich niet houdt aan de in [artikel 39, tweede lid][ref3], bedoelde controlevoorschriften;

      f. indien met betrekking tot de ongeschiktheid tot werken bij de uitvoering van de
      [Wet werk en inkomen naar arbeidsvermogen][ref4], de [Wet op de arbeidsongeschiktheidsverzekering][ref5],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] onderscheidelijk de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7] toepassing wordt gegeven aan
      [artikel 88 van de Wet werk en inkomen naar arbeidsvermogen][ref8] in verband met het niet naleven van
      de [artikelen 27, tweede lid, onderdelen a tot en met c, of vijfde lid][ref9], [28, eerste lid][ref10],
      [29][ref11] of [30, eerste of tweede lid, van laatstgenoemde wet][ref12], [artikel 25][ref13] of
      [28, onderdeel a of b, van de Wet op de arbeidsongeschiktheidsverzekering][ref14], [artikel 45][ref15] of
      [46, onderdeel a of b, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref16], [artikel 3:37][ref17]
      of [3:38, eerste lid, onderdeel a of b, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref18]
      onderscheidelijk [artikel 2:67 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref19] in
      verband met het niet naleven van de [artikelen 2:7, tweede lid, onderdelen a tot en met c, en zesde lid][ref20],
      [2:8, eerste lid][ref21], [2:31][ref22] of [2:32, tweede lid, van laatstgenoemde wet][ref23];

      g. indien de verzekerde zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;

      h. indien de verzekerde de verplichting bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref24] niet of niet
      behoorlijk is nagekomen;

      i. indien de verzekerde de verplichting bedoeld in [artikel 31, eerste lid][ref25], of [49][ref26] niet binnen de
      door het Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;

      j. indien de verzekerde door zijn doen en laten het Algemeen Werkloosheidsfonds, het Uitvoeringsfonds
      voor de overheid, de Werkhervattingskas of de eigenrisicodrager benadeelt of zou kunnen benadelen. Onder
      benadeling in de zin van dit onderdeel is niet begrepen het niet nakomen van de verplichtingen, bedoeld in de
      [artikelen 31, eerste lid][ref27], en [49][ref28];

      k. indien de verzekerde een hem op grond van de [artikelen 29g][ref29] of [30][ref30] opgelegde verplichting niet
      nakomt, tenzij artikel 30, tweede lid, van toepassing is;

      l. indien de verzekerde zonder redelijke gronden niet meewerkt aan een scholing of opleiding die wenselijk wordt
      geacht voor zijn inschakeling in de arbeid;

      m. indien de verzekerde zonder deugdelijke grond weigert of heeft geweigerd mee te werken aan door zijn werkgever
      of door een door die werkgever aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen
      die erop gericht zijn om de verzekerde in staat te stellen passende arbeid te verrichten, dan wel indien bij de
      behandeling van de aangifte of de beoordeling, bedoeld in [artikel 38, tweede lid][ref31], blijkt dat de verzekerde
      zonder deugdelijke grond onvoldoende reïntegratie-inspanningen heeft verricht;

      n. indien de verzekerde zich niet houdt aan het voorschrift, bedoeld in [artikel 38, tweede lid, derde zin][ref32];

      o. indien de belanghebbende zonder redelijke gronden niet meewerkt aan het opstellen van het plan van aanpak, bedoeld
      in [artikel 26, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref33], of het re-integratieplan,
      bedoeld in [artikel 30a, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref34] tenzij
      de belanghebbende de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref35] bedoelde leeftijd heeft
      bereikt;

      p. indien de belanghebbende de verplichtingen die zijn opgenomen in het plan van aanpak, bedoeld in
      [artikel 26, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref36], of in het re-integratieplan,
      bedoeld in [artikel 30a, zesde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref37],
      niet of niet behoorlijk is nagekomen tenzij de belanghebbende de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref38] bedoelde leeftijd heeft bereikt;

      q. indien de verzekerde die recht heeft op arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref39] op grond van artikel 2:39, vierde lid, van die wet
      geen inkomensvoorziening ontvangt;

      r. indien de verzekerde zich niet onthoudt van zeer ernstige misdragingen jegens de met de uitvoering van
      deze wet belaste personen en instanties en jegens de eigenrisicodrager en de bedrijfsarts of arbodienst van de
      eigenrisicodrager tijdens het verrichten van hun werkzaamheden.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      verzekerde de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien
      elke vorm van verwijtbaarheid ontbreekt.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld
      in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig
      nakomen van de verplichting, bedoeld in [artikel 31, eerste lid][ref40], [38, tweede lid, derde zin][ref41],
      of [49][ref42], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten onrechte of tot
      een te hoog bedrag verlenen van uitkering, of ter zake van het zich niet houden aan een voorschrift als bedoeld
      in [artikel 30, eerste lid, onderdeel b][ref43], tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige
      waarschuwing is gegeven.

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.

      5 Het opleggen van een maatregel blijft achterwege, indien voor dezelfde gedraging:

      a. een bestuurlijke boete als bedoeld in [artikel 45a][ref44] wordt opgelegd;

      b. een maatregel op grond van [artikel 27, vierde lid, van de Werkloosheidswet][ref45] wordt opgelegd, of

      c. een bestuurlijke boete als bedoeld in [artikel 27a van de Werkloosheidswet][ref46] wordt opgelegd.

      6 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het tweede lid.

      7 Onder benadeling als bedoeld in het eerste lid, onderdeel j, wordt mede verstaan de situatie dat de verzekerde
      zonder deugdelijke grond heeft nagelaten verweer te voeren tegen of heeft ingestemd met een beëindiging van de
      dienstbetrekking in de periode, bedoeld in [artikel 29, eerste lid][ref47].

      8 Indien aan de persoon, bedoeld in [artikel 29, tweede lid, onderdeel d, aanhef en onder 1°][ref48], in de
      eerste dertien weken van zijn ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte een maatregel
      op grond van [artikel 27, vierde lid, van de Werkloosheidswet][ref49] is opgelegd, wordt de beschikking
      waarbij die maatregel is opgelegd vanaf de eerste dag van de veertiende week van zijn ongeschiktheid of
      zoveel eerder als de uitkering op grond van de [Werkloosheidswet][ref50] eindigt op grond van het bepaalde in
      [artikel 20, eerste lid, onderdelen a en b, van de Werkloosheidswet][ref51], geacht gebaseerd te zijn op het eerste
      lid.


