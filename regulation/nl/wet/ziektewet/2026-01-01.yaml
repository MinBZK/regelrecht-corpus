  - number: '100'
    text: |-
      1 [Artikel 19aa][ref1] is niet van toepassing op de verzekerde wiens eerste dag van
      ongeschiktheid tot het verrichten van arbeid is gelegen voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel B, van de Wet beperking ziekteverzuim en arbeidsongeschiktheid vangnetters][ref2]. De
      [artikelen 19a, derde lid, onderdeel b][ref3], [19b, tweede lid][ref4], en [19c, tweede lid][ref5], zoals deze
      artikelen luidden op de dag voor inwerkingtreding van die wet blijven van toepassing op de verzekerde, bedoeld in
      de eerste zin.

      2 Op de verzekerde, wiens eerste dag van ongeschiktheid tot het
      verrichten van arbeid is gelegen voor de dag van inwerkingtreding van
      [artikel I, onderdeel E, van de Wet beperking ziekteverzuim en arbeidsongeschiktheid vangnetters][ref6] is
      [artikel 29g][ref7] niet van toepassing en blijft [artikel 30, eerste lid][ref8], zoals dat luidde op de dag voor
      inwerkingtreding van artikel I, onderdeel F, van die wet, van toepassing.


