  - number: 19aa
    text: |-
      1 In afwijking van [artikel 19][ref1] heeft de verzekerde die geen werkgever heeft jegens wie hij, bij
      ongeschiktheid tot het verrichten van arbeid wegens ziekte, zwangerschap of bevalling, recht heeft op loon als
      bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref2] dan wel aanspraak heeft op bezoldiging op
      grond van [artikel 76a, eerste lid][ref3], van deze wet, nadat na de eerste dag van de ongeschiktheid tot werken
      een tijdvak van 52 weken van ongeschiktheid tot werken is verstreken, recht op ziekengeld overeenkomstig het bij of
      krachtens deze wet bepaalde, indien de verzekerde:

      a. ongeschikt is tot het verrichten van zijn arbeid, als bedoeld in [artikel 19][ref4]; en

      b. als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte, gebrek, zwangerschap of bevalling
      slechts in staat is met arbeid ten hoogste 65% te verdienen van het maatmaninkomen per uur.

      2 In afwijking van het eerste lid, onderdeel b, heeft de verzekerde, bedoeld in het eerste lid, recht op ziekengeld
      tot een maand na de dag waarop hij in staat is om meer dan 65% van het maatmaninkomen per uur te verdienen.

      3 Op de verzekerde, bedoeld in het eerste lid, die op of na de dag waarop het tijdvak van 52 weken, bedoeld in
      het eerste lid, is verstreken met arbeid meer verdient dan 65% van het maatmaninkomen per uur, is het eerste
      lid, onderdeel b, niet van toepassing tot zes maanden na de dag waarop hij met arbeid meer dan 65% van het
      maatmaninkomen per uur ging verdienen.

      4 Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden tijdvakken van ongeschiktheid
      tot werken samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij
      direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op
      grond van [artikel 3:7, eerste lid][ref5], [3:8][ref6] of [3:10, eerste lid, van de Wet arbeid en zorg][ref7] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.

      5 Onder maatmaninkomen wordt verstaan hetgeen gezonde personen met soortgelijke opleiding en ervaring, ter plaatse
      waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan met arbeid gewoonlijk verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
