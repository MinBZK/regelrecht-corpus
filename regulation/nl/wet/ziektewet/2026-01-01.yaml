  - number: '11'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen wordt als werkgever beschouwd in de gevallen, bedoeld in de
      [artikelen 7, onderdeel a][ref1], [8, onderdelen a en c][ref2], [8a][ref3] en [8c, onderdelen a en c][ref4].

      2 In de gevallen, bedoeld in de [artikelen 7, onderdeel b][ref5], [8, onderdeel b][ref6], en
      [8c, onderdeel b][ref7] wordt als werkgever beschouwd degene, die door Onze Minister als werkgever wordt
      aangewezen.

      3 Ingeval het Uitvoeringsinstituut werknemersverzekeringen, de uitkering of toeslag, bedoeld in de artikelen
      genoemd in het eerste lid, vermeerderd met de daarover door de werkgever verschuldigde premies en de
      inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref8], betaalt aan de werkgever,
      bedoeld in [artikel 9][ref9], [10][ref10] of [12][ref11], teneinde deze uitkering of toeslag door diens tussenkomst
      te doen uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het Uitvoeringsinstituut
      werknemersverzekeringen, onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.

      4 Indien een eigenrisicodrager de uitkering, bedoeld in [artikel 8, onderdeel a][ref12],
      ingevolge [artikel 63a][ref13] betaalt of de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref14], bedoeld in [artikel 8a, eerste lid][ref15], ingevolge
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref16] betaalt, treedt deze eigenrisicodrager als
      werkgever in de plaats van het Uitvoeringsinstituut werknemersverzekeringen, onafhankelijk van het voortbestaan van
      de dienstbetrekking met die eigenrisicodrager.

      5 Bij ministeriële regeling kunnen met betrekking tot de door de werkgever verschuldigde premies, bedoeld in het
      derde lid, nadere regels worden gesteld.


