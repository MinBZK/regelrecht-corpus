      De [artikelen 38a][ref1] en [38b][ref2], zoals die luidden op de dag voorafgaand aan de inwerkingtreding van
      [artikel VIII, onderdelen L en M, van de Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving][ref3],
