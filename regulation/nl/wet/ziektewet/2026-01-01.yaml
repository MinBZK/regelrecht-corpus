  - number: 63c
    text: |-
      1 De eigenrisicodrager laat zich ter zake van de begeleiding bij gebleken
      ongeschiktheid tot het verrichten van arbeid wegens ziekte van de personen, bedoeld in
      [artikel 63a, eerste lid, tweede zin][ref1], bijstaan door een bedrijfsarts of arbodienst. Hetgeen bij
      of krachtens de [artikelen 14, tweede, vierde tot en met elfde, en vijftiende lid][ref2], [14a][ref3],
      __REF003___________________________________________________________________________________________________________
      _____ is bepaald met betrekking tot de bedrijfsarts of arbodienst is van overeenkomstige toepassing, met dien
      verstande dat voor «werkgever» wordt gelezen «de eigenrisicodrager» en voor «werknemer» «de persoon, bedoeld in
      artikel 63a, eerste lid, tweede zin, van de Ziektewet» en dat de verplichting tot schriftelijke vastlegging door
      of vanwege een overeenkomst, bedoeld in [artikel 14, vierde en vijfde lid, van de Arbeidsomstandighedenwet][ref5],
      slechts betrekking heeft op de taak, bedoeld in de eerste zin.

      2 Met het toezicht op de naleving en met de uitoefening van specifieke handhavingsbevoegdheden ten aanzien
      van het eerste lid is belast de toezichthouder, bedoeld in de Arbeidsomstandighedenwet, respectievelijk de
      aangewezen toezichthouder of ambtenaar, bedoeld in de [artikelen 27][ref6], [28a][ref7], [28b][ref8], [30][ref9]
      en [34 van de Arbeidsomstandighedenwet][ref10]. Bij de uitoefening van het toezicht op en de handhaving van het
      eerste lid, beschikken de toezichthouder en de aangewezen toezichthouder of ambtenaar over dezelfde bevoegdheden
      als waarover zij, ten aanzien van de artikelen, genoemd in het eerste lid, tweede zin, beschikken in het kader van
      de [Arbeidsomstandighedenwet][ref11], met dien verstande dat in [artikel 24][ref12] en de genoemde artikelen van
      de Arbeidsomstandighedenwet voor «werkgever» wordt gelezen «de eigenrisicodrager» en voor «werknemer» «de persoon,
      bedoeld in [artikel 63a, eerste lid, tweede zin][ref13], van de Ziektewet».

      3 Het niet naleven van het eerste lid, eerste zin, en van de in het eerste lid, tweede zin, van overeenkomstige
      toepassing verklaarde [artikelen 14, tweede lid, onder a tot en met f, vierde en vijfde lid][ref14], en
      [14a, tweede en derde lid, van de Arbeidsomstandighedenwet][ref15] wordt als overtreding aangemerkt. Het niet
      naleven van het van overeenkomstige toepassing verklaarde [artikel 16, tiende lid][ref16], en van de krachtens
      de in het eerste lid, tweede zin, genoemde artikelen vastgestelde voorschriften voor zover het niet naleven
      van die voorschriften op grond van het genoemde [artikel 16, tiende lid][ref17], als overtreding is aangemerkt,
      wordt als overtreding aangemerkt. De [artikelen 34 tot en met 43 van de Arbeidsomstandighedenwet][ref18] zijn van
      overeenkomstige toepassing.

      4 De werkgever legt bij de aanvraag, bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref19], een afschrift over van
      de schriftelijke vastlegging, bedoeld in het eerste lid, tweede zin.

      5 Indien de eigenrisicodrager zich met betrekking tot de begeleiding, bedoeld in het eerste lid, niet
      meer laat bijstaan door een bedrijfsarts of een arbodienst meldt hij dat zo spoedig mogelijk aan de
      inspecteur, bedoeld in [artikel 1 van de Wet financiering sociale verzekeringen][ref20], en aan het
      Uitvoeringsinstituut werknemersverzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen legt een
      bestuurlijke boete op van ten hoogste € 455 indien de eigenrisicodrager deze verplichting niet is nagekomen.
      De [artikelen 45a, derde, vierde en vijfde lid][ref21], [45c][ref22], en [45g, vierde lid][ref23], zijn van
      overeenkomstige toepassing.

      6 De toestemming, bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref24]
      kan, onverminderd het tiende lid van dat artikel, door de inspecteur, bedoeld in
      [artikel 1 van de Wet financiering sociale verzekeringen][ref25], zonder aanvraag van de eigenrisicodrager met
      onmiddellijke ingang bij voor bezwaar vatbare beschikking worden beëindigd, indien de eigenrisicodrager zich met
      betrekking tot de begeleiding, bedoeld in het eerste lid, niet meer laat bijstaan door een bedrijfsarts of een
      arbodienst.


