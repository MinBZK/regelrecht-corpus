  - number: '39'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verricht bij verzekerden van wie op grond van
      [artikel 38, tweede lid][ref1] of [38a][ref2] een aangifte van ziekte of van wie een ziekmelding is ontvangen,
      controle op het bestaan van ongeschiktheid tot het verrichten van hun arbeid wegens ziekte en hij beoordeelt
      bij gebleken ongeschiktheid of de werkgever zijn taak met betrekking tot verzuimbegeleiding op adequate wijze
      uitoefent.

      2 Het Uitvoeringsinstituut werknemersverzekeringen stelt ter uitvoering van de controle op het bestaan van
      ongeschiktheid tot het verrichten van arbeid controlevoorschriften vast, die voor een of meer bepaalde groepen van
      werknemers kunnen verschillen.

      3 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd zijn controlebevindingen mee te delen aan de
      werkgever tot wie de aan controle onderworpen werknemer in dienstbetrekking staat. Het deelt de werkgever op
      diens verzoek mee of een bepaalde, tot hem in dienstbetrekking staande werknemer volgens de gegevens die het
      Uitvoeringsinstituut werknemersverzekeringen ter beschikking staan geschikt is tot het verrichten van zijn arbeid.

      4 Het Uitvoeringsinstituut werknemersverzekeringen stelt het percentage van het maatmaninkomen dat de verzekerde
      kan verdienen, bedoeld in [artikel 19aa][ref3], vast, en controleert of de verzekerde, bedoeld in artikel 19aa,
      eerste lid, recht heeft op ziekengeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
