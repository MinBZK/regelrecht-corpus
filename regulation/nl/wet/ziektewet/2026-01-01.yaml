  - number: 38aa
    text: |-
      1 In afwijking van [artikel 38, tweede lid][ref1], en [artikel 38a, tweede lid, onderdeel a][ref2], is de termijn
      voor het doen van de aangifte of melding aan het Uitvoeringsinstituut werknemersverzekeringen van de ongeschiktheid
      tot werken van een verzekerde voor een eigenrisicodrager:

      a. uiterlijk zes weken na de laatste dag van het dienstverband indien de verzekerde aanspraak maakt op ziekengeld
      op grond van [artikel 29, tweede lid, onderdeel a of c][ref3], en

      b. uiterlijk zes weken na de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid indien de verzekerde
      aanspraak maakt op ziekengeld op grond van artikel 29, tweede lid, onderdeel b.

      2 De eigenrisicodrager, bedoeld in het eerste lid, meldt, na ontvangst van de melding van de verzekerde dat deze
      weer in staat is tot het verrichten van zijn arbeid, aan het Uitvoeringsorgaan werknemersverzekeringen, uiterlijk
      op de tweede dag na de hersteldmelding door de verzekerde, de eerste dag waarop die verzekerde weer geschikt is
      tot het verrichten van zijn arbeid. Deze melding wordt door de eigenrisicodrager niet eerder gedaan dan de melding
      bedoeld in het eerste lid.

      3 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste € 455 indien
      de eigenrisicodrager de verplichting, bedoeld in het eerste of tweede lid, niet of niet behoorlijk is nagekomen.
      De [artikelen 45a, achtste tot en met elfde lid][ref4], en [45g, vierde lid][ref5], zijn van overeenkomstige
      toepassing.


