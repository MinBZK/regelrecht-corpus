  - number: 19d
    text: |-
      Geen recht op ziekengeld heeft de verzekerde die geen werkgever heeft jegens wie hij bij ongeschiktheid
      tot het verrichten van arbeid wegens ziekte, zwangerschap of bevalling, recht heeft op loon als bedoeld
      in [artikel 629 van Boek 7 van het Burgerlijk wetboek][ref1] dan wel aanspraak heeft op bezoldiging op
      grond van [artikel 76a, eerste lid][ref2], van deze wet en die recht heeft op een uitkering op grond
      van [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref3] en ten aanzien van wie het
      Uitvoeringsinstituut werknemersverzekeringen een verkorte wachttijd heeft vastgesteld als bedoeld in
      [artikel 23, zesde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref4].


