      1 [Artikel 30, vijfde en zesde lid][ref1], en de daarop berustende bepalingen zoals deze luidden op de dag voor de
      datum waarop [artikel XXVIII, onderdeel B, van de Wet werk en zekerheid][ref2] inwerking is getreden, blijven van
      toepassing op een recht op uitkering waarvan de eerste ziektedag is gelegen voor de dag van inwerkingtreding.

      2 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


