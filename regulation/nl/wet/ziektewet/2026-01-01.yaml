  - number: 39b
    text: |-
      1 Een beschikking tot verhaal van uitkering, premies en vergoeding als bedoeld in [artikel 39a, eerste lid][ref1],
      wordt niet meer gegeven indien meer dan vijf jaren sedert het einde van het kalenderjaar zijn verstreken, waarin
      zij zijn betaald of afgedragen.

      2 Uitkeringen, premies en vergoedingen die niet zijn ingevorderd binnen tien jaren na het geven van de beschikking
      tot verhaal, worden niet meer ingevorderd.

      3 De rechtsvordering tot terugbetaling van een onverschuldigd betaald bedrag in verband met verhaal van uitkering,
      premies en vergoeding verjaart door verloop van vijf jaren sedert het einde van het kalenderjaar waarin de
      beschikking tot verhaal is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel39a
    url: https://wetten.overheid.nl/BWBR0001888/2026-01-01#Artikel39b
