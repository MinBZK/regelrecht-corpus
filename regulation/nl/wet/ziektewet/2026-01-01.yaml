  - number: 29e
    text: |-
      1 Als het gaat om een werknemer waarvoor de werkgever loonkostensubsidie als bedoeld in
      [artikel 10d, eerste of tweede lid, van de Participatiewet][ref1] ontvangt en de werknemer recht heeft op
      ziekengeld als bedoeld in de [artikelen 29, tweede lid, onderdeel e][ref2], [29a][ref3], [29b][ref4], of
      [29d][ref5], wordt het ziekengeld vermenigvuldigd met de voor die werknemer vastgestelde loonwaarde, bedoeld in
      [artikel 6, eerste lid, onderdeel g, van de Participatiewet][ref6].

      2 Voor de toepassing van het eerste lid wordt:

      a. indien de voor de werknemer vastgestelde loonwaarde lager is dan 30 procent, de loonwaarde gesteld op
      30 procent;

      b. indien de loonkostensubsidie, met toepassing van
      [artikel 10d, eerste lid, onderdeel b, van de Participatiewet][ref7] wordt verstrekt zonder dat de loonwaarde is
      vastgesteld, de loonwaarde gesteld op 50 procent.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10d
