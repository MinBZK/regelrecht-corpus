  - number: '37'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd verzekerden bij ongeschiktheid tot het verrichten van
      hun arbeid wegens ziekte op te roepen en te ondervragen op plaats, dag en uur, door hem te bepalen.

      2 Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten
      en tijdverlies vergoed in de gevallen en volgens regels, door het Uitvoeringsinstituut werknemersverzekeringen vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel37
  - number: '38'
    text: |-
      1 De werkgever van de verzekerde die bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte
      recht heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel
      aanspraak heeft op bezoldiging op grond van [artikel 76a, eerste lid][ref2], doet, uiterlijk op de eerste
      dag nadat de ongeschiktheid van die werknemer 42 weken heeft geduurd, aangifte van die ongeschiktheid bij het
      Uitvoeringsinstituut werknemersverzekeringen. De werkgever geeft daarbij de eerste dag van de ongeschiktheid
      tot werken op. Voor het bepalen van het tijdvak van 42 weken worden tijdvakken van ongeschiktheid tot werken
      samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op
      grond van [artikel 3:7, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van het
      tijdvak van 42 weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid, van de Wet arbeid en zorg][ref4] wordt genoten, buiten beschouwing.

      2 Onverminderd het eerste lid doet de werkgever van de verzekerde, bedoeld in
      [artikel 29, tweede lid, onderdeel c][ref5], aangifte van de ongeschiktheid tot werken van die verzekerde aan het
      Uitvoeringsinstituut werknemersverzekeringen, op de laatste werkdag voordat de dienstbetrekking eindigt. Indien
      tussen de eerste dag van de ongeschiktheid tot werken en de laatste werkdag, bedoeld in de eerste zin, ten minste
      zes weken is gelegen stelt de werkgever, die geen eigenrisicodrager is, uiterlijk op die laatste werkdag in overleg
      met de werknemer een reïntegratieverslag op en verstrekt de werkgever hiervan een afschrift aan de werknemer. De
      werknemer verstrekt op diens verzoek het reïntegratieverslag aan het Uitvoeringsinstituut werknemersverzekeringen.
      Het Uitvoeringsinstituut werknemersverzekeringen beoordeelt of de werkgever en de werknemer in redelijkheid hebben
      kunnen komen tot de reïntegratie-inspanningen, die zijn verricht.

      3 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste € 455
      indien de werkgever de verplichting, bedoeld in het eerste lid, of in de eerste zin van het tweede lid,
      niet of niet behoorlijk is nagekomen. De [artikelen 45a, derde, vierde en vijfde lid][ref6], [45c][ref7], en
      [45g, vierde lid][ref8], zijn van overeenkomstige toepassing.

      4 Dit artikel is, met uitzondering van de tweede, derde en vierde zin van het tweede lid en het zesde
      en zevende lid, niet van toepassing op de verzekerde, die aanspraak maakt op ziekengeld op grond van
      [artikel 29, tweede lid, onderdeel e, f of g][ref9], en de werkgever van die verzekerde. Bij de toepassing van
      het zesde en zevende lid wordt voor «de behandeling van de aangifte, bedoeld in het tweede lid» gelezen «de
      beoordeling, bedoeld in de vierde zin van het tweede lid».

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aangifte van de
      ongeschiktheid tot het verrichten van arbeid, bedoeld in het eerste lid, en met betrekking tot het tweede lid.

      6 Indien bij de behandeling van de aangifte, bedoeld in het tweede lid, blijkt dat de werkgever zijn verplichting
      om een reïntegratieverslag op te stellen niet of niet volledig is nagekomen, stelt het Uitvoeringsinstituut
      werknemersverzekeringen aan de werkgever een termijn waarbinnen het reïntegratieverslag wordt verstrekt of
      aangevuld.

      7 Indien bij de behandeling van de aangifte, bedoeld in het tweede lid, blijkt dat de werknemer zijn verplichting
      tot het verstrekken van het reïntegratieverslag aan het Uitvoeringsinstituut werknemersverzekeringen niet of
      niet volledig is nagekomen, stelt het Uitvoeringsinstituut werknemersverzekeringen aan de werknemer een termijn
      waarbinnen het reïntegratieverslag wordt verstrekt onderscheidenlijk aangevuld.

      8 Indien een aanvraag tot verkorte wachttijd als bedoeld in
      [artikel 23, zesde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref10], of een verzoek om verlenging
      van het tijdvak waarin een verzekerde jegens zijn werkgever recht heeft op loon of bezoldiging als bedoeld in
      [artikel 24, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref11], wordt ingediend zonder dat
      een aangifte op grond van het eerste lid heeft plaatsgevonden, wordt deze aanvraag, respectievelijk dit verzoek,
      beschouwd als een aangifte op grond van het eerste lid.


