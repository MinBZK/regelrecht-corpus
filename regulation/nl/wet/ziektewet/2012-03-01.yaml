  - number: 75c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen vermeldt de motivering van een medische beschikking, voorzover
      betrekking hebbend op medische gegevens, in een aparte bijlage.

      2 Indien de werknemer geen toestemming heeft gegeven als bedoeld in [artikel 75a][ref1], wordt de bijlage, bedoeld
      in het eerste lid, niet aan de eigenrisicodrager of de werkgever verstrekt.

      3 De bijlage wordt verstrekt aan de bedrijfsarts of de arbodienst van de eigenrisicodrager dan wel aan de
      gemachtigde van de eigenrisicodrager of van de werkgever, bedoeld in [artikel 75b][ref2].

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op een rapport of een advies van een arts of een
      psycholoog, waarnaar bij de motivering van een medische beschikking wordt verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel75a
