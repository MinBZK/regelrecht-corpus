  - number: 26a
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regelen geven in geval van samenloop van verzekering
      ingevolge deze wet uit meerderen hoofde.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel26a
  - number: '28'
    text: |-
      1 De verzekerde is bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht, zo dikwijls dit
      nodig wordt geoordeeld, zich te onderwerpen aan een geneeskundig onderzoek door een door het Uitvoeringsinstituut
      werknemersverzekeringen aangewezen arts, zich op last van de arts tot het ondergaan van zodanig onderzoek te laten
      opnemen in de hem aangewezen inrichting, en in het algemeen de voorschriften van de arts die ertoe strekken om een
      geneeskundig onderzoek mogelijk te maken, op te volgen.

      2 De voor de verzekerde aan een geneeskundig onderzoek verbonden kosten worden aan hem door het
      Uitvoeringsinstituut werknemersverzekeringen vergoed. Door het Uitvoeringsinstituut werknemersverzekeringen kunnen
      dienaangaande regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel28
  - number: '29'
    text: |-
      1 Behoudens het tweede lid, onderdeel e, en de [artikelen 29a][ref1], [29b][ref2] en [29d][ref3] wordt geen
      ziekengeld uitgekeerd, indien de verzekerde uit hoofde van de dienstbetrekking op grond waarvan hij de arbeid
      behoort te verrichten:

      a. recht heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref4], dan wel indien
      het recht op loon door toepassing van het [derde, vijfde, zesde of negende lid van dat artikel][ref5] geheel of
      gedeeltelijk ontbreekt;

      b. recht heeft op bezoldiging als bedoeld in [artikel 76a, eerste lid][ref6], dan wel indien
      het recht op die bezoldiging op grond van [artikel 76a, derde of zevende lid][ref7], of
      [artikel 76b, eerste, tweede of derde lid][ref8], geheel of gedeeltelijk ontbreekt.

      2 Het ziekengeld wordt uitgekeerd over iedere dag van ongeschiktheid tot werken, doch over maximaal vijf dagen per
      kalenderweek en niet over zaterdagen en zondagen. In de eerste kalenderweek wordt in afwijking van het bepaalde in
      de eerste zin het ziekengeld uitgekeerd over zaterdag en zondag, doch over maximaal vijf dagen per kalenderweek,
      indien de zaterdag of zondag aantoonbaar een werkdag zou zijn geweest, met dien verstande dat:

      1°. als de zaterdag aantoonbaar een werkdag zou zijn geweest, uitkering van ziekengeld plaatsvindt over de
      zaterdag;

      2°. als de zaterdag en zondag aantoonbaar werkdagen zouden zijn geweest, uitkering van ziekengeld plaatsvindt over
      de zaterdag en zondag;

      3°. als de zondag aantoonbaar een werkdag zou zijn geweest, uitkering van ziekengeld plaatsvindt over de zondag.

      Het ziekengeld wordt uitgekeerd aan:

      a. de verzekerde van wie de arbeidsverhouding op grond van [artikel 4][ref9] of [5][ref10] als dienstbetrekking
      wordt beschouwd, vanaf de derde dag van de ongeschiktheid tot werken;

      b. degene wiens aanspraak berust op [artikel 46][ref11], vanaf de derde dag van de ongeschiktheid tot werken;

      c. de verzekerde van wie de dienstbetrekking, bedoeld in [artikel 3][ref12], binnen het in het vijfde lid genoemde
      tijdvak van 104 weken eindigt, vanaf de eerste dag van ongeschiktheid tot werken nadat de dienstbetrekking is
      geëindigd, doch niet eerder dan vanaf de derde dag van de ongeschiktheid tot werken;

      d. de verzekerde die:

      1°. op grond van [artikel 7, onderdeel a][ref13], als werknemer wordt beschouwd, vanaf de eerste dag van de
      veertiende week van de ongeschiktheid tot werken of zo veel eerder als de uitkering, bedoeld in dat onderdeel,
      eindigt op grond van [artikel 20, eerste lid, onderdeel a, b, d of e, van de Werkloosheidswet][ref14];

      2°. op grond van [artikel 7, onderdeel b][ref15], als werknemer wordt beschouwd, vanaf de eerste dag van de
      ongeschiktheid tot werken;

      e. de verzekerde die wegens orgaandonatie ongeschikt is tot het verrichten van zijn arbeid, vanaf de eerste dag van
      de ongeschiktheid tot werken;

      f. de vrouwelijke verzekerde, overeenkomstig [artikel 29a][ref16];

      g. de werknemer, bedoeld in de [artikelen 29b][ref17] en [29d][ref18].

      3 Als eerste dag van de ongeschiktheid tot werken geldt de eerste werkdag waarop wegens ziekte niet is gewerkt of
      het werken tijdens de werktijd is gestaakt. Bij ministeriële regeling kunnen nadere en afwijkende regels worden
      gesteld in verband met het voor bijzondere gevallen vaststellen van welke dag als eerste werkdag wordt aangemerkt.

      4 Geen ziekengeld wordt uitgekeerd op en na de eerste dag van de maand waarin de verzekerde de leeftijd van 65 jaar
      bereikt alsmede over de periode waarover de verzekerde een uitkering op grond van [artikel 3:7, tweede lid][ref19],
      [3:9][ref20] of [3:10, tweede en derde lid van de Wet arbeid en zorg][ref21] ontvangt.

      5 Geen ziekengeld wordt uitgekeerd nadat een tijdvak van 104 weken van ongeschiktheid tot werken is verstreken,
      te rekenen vanaf de eerste dag van de ongeschiktheid tot werken. Voor het bepalen van dit tijdvak worden
      tijdvakken van ongeschiktheid tot werken samengeteld, indien zij elkaar met een onderbreking van minder
      dan vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref22], [3:8][ref23] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref24] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak. In de gevallen waarin de tweede volzin toepassing vindt,
      worden gedurende de desbetreffende periode van 104 weken de eerste twee dagen van de ongeschiktheid tot werken,
      waarover op grond van het tweede lid, onderdelen a, b en c, geen ziekengeld wordt uitgekeerd, slechts eenmaal in
      aanmerking genomen.

      6 Geen ziekengeld wordt uitgekeerd voor zover de verzekerde, bedoeld in het tweede lid, onderdeel
      e, [artikel 29a][ref25], [artikel 29b][ref26] of [artikel 29d][ref27], door toepassing van
      [artikel 629, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref28] geen recht heeft op loon dan wel op grond
      van [artikel 76b, tweede lid][ref29], geen recht heeft op bezoldiging.

      7 Het ziekengeld, bedoeld in het tweede lid, onderdelen a tot en met d, bedraagt 70% van het dagloon van de
      verzekerde.

      8 Het ziekengeld, bedoeld in het tweede lid, onderdeel e, wordt gesteld op het dagloon.

      9 Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regels stellen met betrekking tot het tweede lid,
      onderdeel e.

      10 Het tijdvak van 104 weken, bedoeld in het vijfde lid, wordt verlengd met de duur
      van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 26, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref30] of
      [artikel 71b, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref31] heeft vastgesteld.

      11 Het tweede lid, onderdeel a, b of c, is niet van toepassing indien onderdeel g van dat lid van toepassing is.

      12 Het tweede lid, onderdeel d, is niet van toepassing indien onderdeel e of f van dat lid van toepassing is.

      13 Voor de toepassing van het tweede lid, onderdeel d, onder 1°, worden perioden van ongeschiktheid samengeteld,
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan
      aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref32], [3:8][ref33] of [3:10, eerste lid, van de Wet arbeid en zorg][ref34] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


