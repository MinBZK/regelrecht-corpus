  - number: 63c
    text: |-
      Indien de werkgever zich met betrekking tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door
      een persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de
      bijstand, bedoeld in onderdeel b van dat lid of een arbodienst als bedoeld in die wet meldt hij dat zo spoedig
      mogelijk. Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste € 455
      indien de werkgever deze verplichting niet is nagekomen. De [artikelen 45a, derde, vierde en vijfde lid][ref2],
      [45c][ref3], en [45g, vierde lid][ref4], zijn van overeenkomstige toepassing.


