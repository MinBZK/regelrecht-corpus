  - number: 47a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen betaalt geen voorschot indien onzekerheid bestaat over het recht
      op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] of het recht op bezoldiging op
      grond van [artikel 76a, eerste lid][ref2].

      2 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van ziekengeld op of schorst de betaling,
      indien het van oordeel is of het gegronde vermoeden heeft dat:

      a. het recht op ziekengeld niet of niet meer bestaat;

      b. recht op een lagere ziekengelduitkering bestaat;

      c. de verzekerde of zijn wettelijk vertegenwoordiger een verplichting als bedoeld in [artikel 30][ref3],
      [31][ref4], [45][ref5] of [49][ref6] niet of niet behoorlijk is nagekomen.

      3 Indien een reïntegratiebedrijf aan het Uitvoeringsinstituut werknemersverzekeringen heeft gemeld dat het
      gegronde vermoeden bestaat dat een persoon aan wie ziekengeld is toegekend, onvoldoende medewerking verleent
      aan de op hem betrekking hebbende werkzaamheden van het reïntegratiebedrijf, neemt het Uitvoeringsinstituut
      werknemersverzekeringen een besluit omtrent de gehele of gedeeltelijke opschorting of schorsing van de betaling van
      het ziekengeld aan die persoon voor de duur van ten hoogste acht weken.

      4 Het Uitvoeringsinstituut werknemersverzekeringen stelt het reïntegratiebedrijf in kennis van een besluit tot
      opschorting of schorsing als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
