  - number: 29b
    text: |-
      1 De werknemer:

      a. die onmiddellijk voorafgaand aan een dienstbetrekking als bedoeld in [artikel 3][ref1], [4][ref2] of
      [5][ref3], recht had op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4],

      b. die onmiddellijk voorafgaand aan zijn dienstbetrekking met een werkgever, niet zijnde een werkgever als
      bedoeld in [artikel 7 van de Wet sociale werkvoorziening][ref5], een indicatiebeschikking als bedoeld in
      [artikel 11 van die wet][ref6] had,

      c. van wie in een arbeidskundig onderzoek is vastgesteld dat hij op de eerste dag na afloop van de wachttijd,
      bedoeld in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref7] of van het tijdvak, bedoeld in
      [artikel 24][ref8] of [25, negende lid, van die wet][ref9]:

      1°. minder dan 35% arbeidsongeschikt is,

      2°. alsmede op de eerste dag van dertien weken voorafgaand aan die dag geen dienstbetrekking had met een andere
      dan zijn eigen werkgever, tenzij de dienstbetrekking met die andere werkgever reeds bestond op de eerste dag van
      de wachttijd,

      3°. niet in staat is tot het verrichten van eigen of andere passende arbeid bij de eigen werkgever, en

      4°. binnen vijf jaar na die dag in dienstbetrekking werkzaamheden gaat verrichten bij een werkgever,

      d. die de leeftijd van achttien jaar nog niet heeft bereikt en in verband met ziekte of gebrek een belemmering
      ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat onderwijs
      arbeid in dienstbetrekking gaat verrichten, of

      e. die geen werknemer is als bedoeld in het derde lid, onderdeel a, achttien jaar is of ouder en in verband met
      ziekte of gebrek een belemmering ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar
      na afronding van dat onderwijs arbeid in dienstbetrekking gaat verrichten,

      heeft vanaf de eerste dag van zijn ongeschiktheid tot werken recht op ziekengeld over perioden van ongeschiktheid
      tot werken wegens ziekte die zijn aangevangen in de vijf jaren na aanvang van de dienstbetrekking.

      2 Het eerste lid is van overeenkomstige toepassing op de werknemer die, onmiddellijk voorafgaand aan
      een dienstbetrekking als bedoeld in [artikel 3][ref10], [4][ref11] of [5][ref12], naar het oordeel van
      het Uitvoeringsinstituut werknemersverzekeringen een structurele functionele beperking had en voor wiens
      ondersteuning bij arbeidsinschakeling het college van burgemeester en wethouders, onmiddellijk voorafgaand aan die
      dienstbetrekking, op grond van [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref13]
      verantwoordelijk was.

      3 De werknemer:

      a. die voorafgaand aan zijn dienstbetrekking, bedoeld in [artikel 3][ref14], [4][ref15] of [5][ref16],
      recht had of heeft gehad op een arbeidsongeschiktheidsuitkering of arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref17],

      b. die een arbeidsovereenkomst heeft gesloten met een werkgever als bedoeld in artikel 7 van de Wet sociale
      werkvoorziening, of

      c. wiens dienstbetrekking, bedoeld in [artikel 3][ref18], [4][ref19] of [5][ref20], is aangevangen
      voordat zijn recht op een arbeidsongeschiktheidsuitkering of arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref21] ontstond, omdat die dienstbetrekking is aangevangen
      voordat hij achttien jaar werd,

      heeft vanaf de eerste dag van zijn ongeschiktheid tot werken recht op ziekengeld over perioden van ongeschiktheid
      tot werken wegens ziekte die zijn aangevangen na aanvang van de dienstbetrekking. Het recht op ziekengeld van de
      werknemer, bedoeld in onderdeel c, ontstaat niet eerder dan zijn recht op een arbeidsongeschiktheidsuitkering of
      arbeidsondersteuning op grond van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref22].

      4 De werknemer die recht heeft op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref23]
      en ten aanzien van wie een dienstbetrekking, bedoeld in [artikel 3][ref24], [4][ref25] of [5][ref26], bij diens
      werkgever wordt voortgezet nadat dat recht is vastgesteld, heeft vanaf de eerste dag van zijn ongeschiktheid tot
      werken recht op ziekengeld over perioden van ongeschiktheid tot werken wegens ziekte die zijn aangevangen in de
      vijf jaren na vaststelling van het recht op uitkering.

      5 Het ziekengeld, bedoeld in het eerste, derde en vierde lid, bedraagt 70% van het dagloon van de verzekerde.

      6 In afwijking van het vijfde lid wordt het ziekengeld in het tijdvak van 52 weken vanaf de eerste dag
      van ongeschiktheid tot werken van de werknemer, bedoeld in [artikel 3][ref27], op verzoek van de werkgever
      gesteld op het dagloon, met dien verstande dat het ziekengeld niet meer kan bedragen dan de aanspraak van de
      werknemer op het loon dat de werkgever verschuldigd zou zijn, indien daarop geen ziekengeld in mindering zou
      zijn gebracht. Indien de werknemer op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref28]
      over de eerste twee dagen van het tijdvak, bedoeld in de eerste zin, geen recht op loon heeft, wordt,
      in afwijking van de eerste zin, het ziekengeld over elk van deze dagen gesteld op de hoogte van het
      ziekengeld op de dag direct volgend op die twee dagen. Voor het bepalen van het tijdvak van 52 weken zijn de
      [tweede en derde zin van artikel 29, vijfde lid][ref29], van overeenkomstige toepassing.

      7 Indien de werknemer, bedoeld in het derde lid, werkzaam is op een arbeidsovereenkomst als bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref30], wordt het dagloon, bedoeld in het vijfde en zesde
      lid, verminderd met het, naar werkdagen herleide, aan de werkgever verstrekte subsidiebedrag, bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref31].

      8 Dit artikel is niet van toepassing indien de werknemer werkzaam is in een dienstbetrekking in de zin van
      [artikel 2 van de Wet sociale werkvoorziening][ref32].

      9 Ter uitvoering van het tweede lid wordt op verzoek van het college van burgemeester en wethouders, bedoeld in
      dat lid, de aanwezigheid van een structurele functionele beperking vastgesteld. Bij ministeriële regeling kunnen
      nadere regels worden gesteld voor het tweede lid en dit lid in ieder geval met betrekking tot de gegevens, die
      bij de aanvraag worden verstrekt en de kosten die voor de beoordeling van de aanvraag bij de aanvrager in rekening
      worden gebracht.

      10 Bij ministeriële regeling kunnen voorwaarden worden gesteld met betrekking tot de toepassing van het tweede lid.

      11 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt op verzoek van de werknemer of de persoon die
      verwacht een dienstbetrekking met een werkgever te zullen aangaan een verklaring of de aanvrager naar het oordeel
      van het Uitvoeringsinstituut werknemersverzekeringen voldoet aan de voorwaarden voor toepassing van het eerste lid,
      onderdeel d of e.


