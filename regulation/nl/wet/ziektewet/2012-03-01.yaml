      1 Het Uitvoeringsinstituut werknemersverzekeringen kan de onverschuldigd betaalde uitkering, bedoeld in
      [artikel 33, eerste lid][ref1], invorderen bij dwangbevel.

      2 [Artikel 45g][ref2] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref3] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref4] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


