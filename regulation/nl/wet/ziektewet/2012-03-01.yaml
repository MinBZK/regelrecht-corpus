    text: |-
      Deze afdeling is van toepassing op personen die:

      a. in dienst zijn van staat, provincie, gemeente, waterschap of enig ander publiekrechtelijk lichaam; en

      b. op grond van de Kaderwet dienstplicht de militaire dienst vervullen dan wel die op grond van de
      [Wet gewetensbezwaren militaire dienst][ref1] zijn verplicht tot het verrichten van vervangende dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002386
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel76
