  - number: 67a
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beëindigt de vrijwillige verzekering:

      a. op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;

      b. met ingang van de dag, waarop de termijn van vijf jaar, bedoeld in [artikel 64][ref1], tweede lid, onderdeel
      *a*, is verstreken;

      c. met ingang van de dag, waarop de werkzaamheden bedoeld in [artikel 64][ref2], tweede lid, worden beëindigd en de
      vrijwillige verzekerde niet langer geacht kan worden inkomsten te verkrijgen wegens eindiging van die werkzaamheden
      dan wel inkomsten te derven in geval van ziekte

      d. met ingang van de dag, waarop de vrijwillig verzekerde verplicht verzekerd wordt ingevolge deze wet;

      e. indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet
      tijdig wordt betaald; of

      f. indien niet langer wordt voldaan aan andere vereisten voor toelating tot de vrijwillige verzekering, bedoeld in
      [artikel 64][ref3], tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel64
