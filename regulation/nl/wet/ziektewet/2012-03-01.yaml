  - number: '64'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen is verplicht overeenkomstig het bij of krachtens dit hoofdstuk
      bepaalde tot de vrijwillige verzekering toe te laten, mits hij de leeftijd van 65 jaar nog niet heeft bereikt en
      hier te lande woont:

      a. degene, wiens verplichte verzekering is geëindigd en te wiens aanzien op grond van gebleken omstandigheden
      redelijkerwijze valt aan te nemen, dat onderbreking van die verplichte verzekering van korte duur zal zijn, dan wel
      dat het zijn bedoeling is bij geboden gelegenheid opnieuw een dienstbetrekking aan te gaan;

      b. degene, die, terwijl hij hier te lande woonde, in het buitenland verplicht verzekerd was tegen geldelijke
      gevolgen van ziekte, mits:

      1°. hij niet meer in het buitenland verzekerd is, omdat hij niet langer werkzaamheden verricht in het buitenland;

      2°. op grond van gebleken omstandigheden redelijkerwijze valt aan te nemen, dat het zijn bedoeling is bij geboden
      gelegenheid opnieuw een dienstbetrekking aan te gaan;

      c. degene, wiens verplichte verzekering is geëindigd en die als zelfstandige als bedoeld in
      [artikel 4, vijfde lid][ref1], werkzaamheden verricht of gaat verrichten, of als echtgenoot van die zelfstandige
      meewerkt of gaat meewerken in diens onderneming, indien gedurende één jaar, onmiddellijk voorafgaande aan het einde
      van zijn verplichte verzekering, onafgebroken, al dan niet in Nederland, bij of krachtens een wettelijke regeling
      een voorziening tegen geldelijke gevolgen van ziekte op hem van toepassing is geweest;

      d. degene wiens dienstbetrekking ertoe strekt, dat slechts een gedeelte van een normale werkweek arbeid wordt
      verricht - niet uitsluitend als gevolg van een voor betrokkene geldende werktijdregeling, krachtens welke een
      normale werkweek van gemiddeld minder dan zes dagen van toepassing is - en die uit hoofde van die dienstbetrekking
      verplicht verzekerd is, indien gedurende de drie jaren, onmiddellijk voorafgaande aan de dag van aanvang van zijn
      vrijwillige verzekering, onafgebroken, al dan niet hier te lande, ingevolge het bepaalde bij of krachtens een
      wettelijke regeling een voorziening tegen geldelijke gevolgen van ziekte op hem van toepassing is geweest;

      e. degene, wiens arbeidsverhouding op grond van [artikel 6, eerste lid, onderdeel c][ref2], niet als
      dienstbetrekking wordt beschouwd;

      f. degene wiens recht op een uitkering krachtens de [Wet werk en inkomen naar arbeidsvermogen][ref3] is beëindigd;

      g. degene, aan wie een arbeidsongeschiktheidsuitkering krachtens de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4] is toegekend, berekend naar een arbeidsongeschiktheid van
      minder dan 45%;

      h. degene, wiens arbeidsongeschiktheidsuitkering krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref5],
      berekend naar een arbeidsongeschiktheid van ten minste 45%, wegens afneming van de arbeidsongeschiktheid is herzien
      naar een arbeidsongeschiktheid van minder dan 45%;

      i. degene, wiens arbeidsongeschiktheidsuitkering krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref6],
      berekend naar een arbeidsongeschiktheid van ten minste 45%, is ingetrokken;

      j. degene, die op grond van [artikel 7][ref7] als werknemer wordt beschouwd en tevens als zelfstandige een bedrijf
      of beroep uitoefent of gaat uitoefenen of als echtgenoot van die zelfstandige in dat bedrijf of beroep meewerkt
      of gaat meewerken, indien gedurende de drie jaren, onmiddellijk voorafgaand aan de dag van aanvang van zijn
      vrijwillige verzekering, onafgebroken, al dan niet in Nederland, bij of krachtens een wettelijke regeling een
      voorziening tegen geldelijke gevolgen van ziekte op hem van toepassing is geweest.

      2 De in het eerste lid bedoelde verplichting bestaat eveneens ten aanzien van de persoon, jonger dan 65 jaar, die
      op grond van het bepaalde bij of krachtens [artikel 3, tweede, vierde en vijfde lid][ref8], niet als werknemer
      wordt beschouwd, en

      a. wiens verplichte verzekering is geëindigd en die buiten Nederland woont, aldaar direct aansluitend op de
      beëindiging van de verplichte verzekering een dienstbetrekking vervult voor de duur van maximaal vijf jaar en wiens
      werkgever binnen Nederland woont of gevestigd is;

      b. die Nederlander is en die is uitgezonden om werkzaamheden te verrichten voor door Onze Minister in
      overeenstemming met Onze Minister van Buitenlandse Zaken aan te wijzen organisaties voor ontwikkelingssamenwerking;

      c. die Nederlander is en die is uitgezonden om, in of buiten Nederland, werkzaamheden te verrichten voor een
      volkenrechtelijke organisatie, waarvan Nederland lid is dan wel waarvan de werkzaamheden door Nederland worden
      ondersteund;

      d. die in Nederland woont, en buiten Nederland een dienstbetrekking vervult; of

      e. die Nederlander is en buiten Nederland werkzaamheden verricht die worden bekostigd door het Rijk en die tevens
      in opdracht van het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een
      internationaal verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke
      organisatie.

      3 Aan het vervullen van een dienstbetrekking, bedoeld in het tweede lid, onderdeel *a*, dient een aaneengesloten
      periode van verplichte verzekering van tenminste één jaar te zijn voorafgegaan.

      4 Met de Nederlander, bedoeld in het tweede lid, onderdeel b, c en e, wordt gelijkgesteld de persoon, die onderdaan
      is van één van de lidstaten van de Europese Gemeenschap of onderdaan is van een Staat, waarmee Nederland een
      verdrag inzake sociale zekerheid heeft gesloten, mits hij voor hij werd uitgezonden in Nederland woonde.


