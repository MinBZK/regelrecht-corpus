  - number: 30a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van ziekengeld en terzake van weigering van ziekengeld, herziet het Uitvoeringsinstituut werknemersverzekeringen
      een dergelijk besluit of trekt hij dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 30][ref1], [31][ref2],
      [38][ref3], [45][ref4] of [49][ref5] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      ziekengeld;

      b. indien anderszins het ziekengeld ten onrechte of tot een te hoog bedrag is verleend;

      c. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 31][ref6], [45][ref7] of
      [49][ref8] ertoe leidt dat niet kan worden vastgesteld of nog recht op ziekengeld bestaat.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan geheel of gedeeltelijk van herziening of intrekking afzien
      indien daarvoor dringende redenen zijn.


