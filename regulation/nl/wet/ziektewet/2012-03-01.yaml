      2008 tot wijziging van de Ziektewet om uitkering van ziekengeld mogelijk te maken aan personen die op zaterdagen
      en zondagen werken (Stb. 152) is niet van toepassing op verzekerden voor wie de eerste kalenderweek van de
      ongeschiktheid tot het verrichten van arbeid volledig is gelegen voor de datum van inwerkingtreding van deze wet.


