      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '8'
    text: |-
      Voor de toepassing van deze wet wordt mede als werknemer beschouwd:

      a. degene, die krachtens de verplichte verzekering ingevolge deze wet ziekengeld ontvangt;

      b. in door Onze Minister aan te wijzen gevallen degene, die wegens ziekte niet werkt, doch aan wie geen ziekengeld
      wordt verleend op grond van enige bepaling van deze wet;

      c. degene, die wegens ziekte niet werkt, doch aan wie geen ziekengeld wordt betaald op grond van
      [artikel 29, eerste lid][ref1], maar wel een toeslag op grond van de [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel8
