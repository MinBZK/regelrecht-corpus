  - number: '7'
    text: |-
      Voor de toepassing van deze wet wordt als werknemer beschouwd:

      a. degene, die krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref1] uitkering ontvangt;

      b. in door Onze Minister aan te wijzen gevallen degene, die ten minste vijf of ten
      minste de helft van zijn arbeidsuren per kalenderweek heeft verloren als bedoeld in
      [artikel 16, eerste lid, onderdeel a, van de Werkloosheidswet][ref2], doch aan wie geen uitkering wordt verleend
      op grond van enige bepaling van die wet of van het uitkeringsreglement werkloosheidsverzekeringen van het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel7
