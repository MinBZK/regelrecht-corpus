    text: |-
      1 [Artikel 31, eerste en tweede lid][ref1], zoals dat luidde op de dag voor de inwerkingtreding van
      [artikel II, onderdeel B, van de Wet wijziging verrekening inkomsten met ziekengeld][ref2], blijft van toepassing
      op de verzekerde wiens eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte is gelegen
      voor de dag waarop artikel II, onderdeel B, van die wet in werking is getreden.

      2 Dit artikel vervalt drie jaar na de dag waarop
      [artikel II, onderdeel B, van de Wet wijziging verrekening inkomsten met ziekengeld][ref3] in werking is
      getreden.


