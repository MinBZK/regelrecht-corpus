        artikel: '8'
  - number: '19'
    text: |-
      1 De verzekerde heeft bij ongeschiktheid tot het verrichten van zijn arbeid als rechtstreeks en objectief medisch
      vast te stellen gevolg van ziekte recht op ziekengeld overeenkomstig het bij of krachtens deze wet bepaalde.

      2 De vrouwelijke verzekerde heeft bij ongeschiktheid tot het verrichten van haar arbeid die haar oorzaak vindt in
      zwangerschap of bevalling recht op ziekengeld overeenkomstig het bij of krachtens deze wet bepaalde.

      3 De vrouwelijke verzekerde heeft geen recht op ziekengeld gedurende de periode dat zwangerschaps- of
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1]
      of een uitkering op grond van [artikel 3:8 van die wet][ref2].

      4 Voor de toepassing van deze wet worden onder ziekte mede verstaan gebreken.

      5 Ten aanzien van een verzekerde die geen werkgever heeft als bedoeld in [artikel 9][ref3], [10][ref4] of
      [12][ref5] wordt onder ongeschiktheid tot het verrichten van zijn arbeid verstaan: ongeschiktheid tot het
      verrichten van werkzaamheden die bij een soortgelijke werkgever gewoonlijk kenmerkend voor zijn arbeid zijn. In
      afwijking van de eerste zin wordt indien de verzekerde de arbeid gedurende minder dan een week heeft verricht en
      daaraan voorafgaand gedurende ten minste zes maanden andere arbeid heeft verricht onder ongeschiktheid tot het
      verrichten van zijn arbeid verstaan: ongeschiktheid tot het verrichten van werkzaamheden die gewoonlijk kenmerkend
      zijn voor de andere arbeid die in die zes maanden hoofdzakelijk is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel12
