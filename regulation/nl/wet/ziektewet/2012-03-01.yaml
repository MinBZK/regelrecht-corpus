  - number: 91a
    text: |-
      Met betrekking tot personen die op of na 1 januari 2004 maar voor 15 augustus 2004 ziek zijn geworden
      wordt in [artikel 29b, eerste lid, onderdeel c, aanhef][ref1], voor «bedoeld in [artikel 24][ref2] of
      [25, negende lid, van die wet][ref3]» gelezen: bedoeld in [artikel 24 van die wet][ref4] of het tijdvak dat
      voortvloeit uit de toepassing van [artikel 123b, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref5].


