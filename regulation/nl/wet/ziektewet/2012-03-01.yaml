  - number: 19a
    text: |-
      1 Geen recht op ziekengeld heeft de verzekerde gedurende de periode dat hij niet in Nederland woont.

      2 Het eerste lid is niet van toepassing indien de verzekerde woont in een land waarin op grond van een verdrag of
      een besluit van een volkenrechtelijke organisatie recht op ziekengeld kan bestaan.

      3 Indien het recht op ziekengeld op grond van het eerste lid is geëindigd dan wel niet is ontstaan, wordt
      betrokkene vanaf de dag:

      a. dat hij in Nederland woont; of

      b. dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een
      volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op ziekengeld kan bestaan; weer als
      verzekerde aangemerkt indien hij op die dag aan de overige voorwaarden, bedoeld in [artikel 19][ref1], voldoet.
      Deze verzekerde heeft aanspraak op heropening dan wel toekenning van het recht op ziekengeld voor de resterende
      periode, bedoeld in [artikel 29][ref2], vijfde lid, dan wel [artikel 29a][ref3], vierde lid, met inachtneming van
      de bepalingen van deze wet.

      4 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:

      a. de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;

      b. de verzekerde, die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.

      5 Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op ziekengeld kan bestaan. In deze mededeling wordt tevens opgenomen:

      a. de vindplaats van het desbetreffende verdrag of besluit, en

      b. de eventueel in dat verdrag of besluit aanwezige beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel19a
