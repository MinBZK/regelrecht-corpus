  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:

      a. degene, die als thuiswerker arbeid verricht;

      b. degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;

      c. degene, die als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent;

      d. degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel5
  - number: '6'
    text: |-
      1 Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van:

      a. degene, die minister, staatssecretaris, commissaris van de Koning, burgemeester, Nationale ombudsman,
      substituut-ombudsman, lid van gedeputeerde staten, wethouder, waaronder begrepen een lid van het dagelijks bestuur
      van een deelgemeente, voorzitter van een waterschap of de Rijksvertegenwoordiger voor de openbare lichamen Bonaire,
      Sint Eustatius en Saba, is;

      b. degene die als vrijwilliger werkzaamheden verricht als politiebeambte, alsmede van degene die als vrijwilliger
      al dan niet tegen loon werkzaamheden verricht bij de brandweer;

      c. degene die doorgaans op minder dan vier dagen per week uitsluitend of nagenoeg uitsluitend diensten verricht ten
      behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat;

      d. de directeur-grootaandeelhouder;

      e. een persoon, indien degene met wie hij de arbeidsverhouding heeft, met betrekking tot die arbeidsverhouding op
      grond van [artikel 6a van de Wet op de loonbelasting 1964][ref1] niet als inhoudingsplichtige wordt beschouwd;

      f. degene die als vrijwilliger als bedoeld in [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref2],
      uitsluitend vergoedingen of verstrekkingen als bedoeld in dat lid ontvangt met een gezamenlijke waarde van ten
      hoogste € 150 per maand en € 1 500 per kalenderjaar.

      2 Geen dienstbetrekking wordt geacht aanwezig te zijn op dagen, waarop geen arbeid wordt verricht en geen uitkering
      of een uitkering van minder dan de helft van het normale loon van de werkgever wordt genoten, tenzij het niet
      verrichten van de arbeid zijn oorzaak vindt in:

      a. een normale onderbreking van of verhindering tot het verrichten van de arbeid, zolang deze onderbreking of
      verhindering niet langer dan een maand heeft geduurd;

      b. weersinvloeden, gebrek aan materialen of dergelijke omstandigheden;

      c.

      d. de omstandigheid, dat de dienstbetrekking er toe strekt, dat slechts een gedeelte van een normale werkweek
      arbeid wordt verricht;

      e. de omstandigheid, dat de dienstbetrekking er toe strekt, dat niet regelmatig in elke kalenderweek arbeid wordt
      verricht, voor zover het betreft de kalenderweek waarin arbeid wordt verricht of arbeid zou worden verricht, indien
      de betrokkene niet arbeidsongeschikt was geworden;

      f. arbeidsongeschiktheid terzake waarvan ziekengeld op grond van deze wet is toegekend of terzake waarvan
      recht bestaat op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref3] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4].

      3 Voor de toepassing van het eerste lid, onderdeel c, wordt onder het verrichten van diensten ten behoeve van een
      huishouden mede verstaan het verlenen van zorg aan de leden van dat huishouden.

      4 Het eerste en tweede lid zijn alleen van toepassing op de aldaar bedoelde arbeidsverhoudingen.

      5 Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen
      onder directeur-grootaandeelhouder, bedoeld in het eerste lid, onderdeel *d*, wordt verstaan.


