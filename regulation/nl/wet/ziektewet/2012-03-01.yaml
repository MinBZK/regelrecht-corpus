        artikel: 72c
        paragraaf: '1'
        afdeling: Derde
  - number: 72b
    text: |-
      1 Onverminderd [artikel 72c][ref1], worden beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel72c
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 72c
        paragraaf: '1'
        afdeling: Derde
  - number: 72c
    text: |-
      1 Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van deze wet kan door
      de werknemer uitsluitend bij het Uitvoeringsinstituut werknemersverzekeringen worden ingediend. Het
      Uitvoeringsinstituut werknemersverzekeringen geeft de beschikking binnen dertien weken na ontvangst van de
      aanvraag.

      2 Een beschikking die uitsluitend betrekking heeft op het al dan niet bestaan of voortbestaan van de
      ongeschiktheid tot werken wordt gegeven binnen vier weken na ontvangst van de aanvraag, de aangifte van
      de ongeschiktheid of van de ziekmelding aan het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in
      de [artikelen 29a, vierde lid][ref1], [38, tweede lid][ref2], [artikel 38a, tweede en derde lid][ref3], en
      [38ab, eerste lid][ref4].

      3 Indien een beschikking als bedoeld in het eerste of tweede lid niet binnen de toepasselijke termijn kan worden
      gegeven, wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel38ab
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel72c
