  - number: '40'
    text: |-
      1 Indien de degene aan wie ziekengeld is toegekend, aanspraak heeft op verstrekking of vergoeding van zorg als
      bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van die wet een bijdrage voor die zorg
      verschuldigd is, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd het ziekengeld tot het bedrag van die
      bijdrage in plaats van aan degene aan wie het ziekengeld is toegekend, zonder diens machtiging uit te betalen aan
      het College voor zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].

      2 Indien degene, aan wie ziekengeld is toegekend, in een inrichting ter verpleging van geesteszieken of van
      zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen, van de desbetreffende inrichting
      of van het college van burgemeester en wethouders van de gemeente die de opnamekosten betaalt, het verzoek
      ontvangt om het ziekengeld aan die inrichting of die gemeente uit te betalen, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd dat verzoek zonder het stellen van andere voorwaarden in te willigen.

      3 Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het
      gedeelte van het ziekengeld, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.

      4 Een herziening van de betaling op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
