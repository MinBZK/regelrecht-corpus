  - number: '94'
    text: |-
      In gedingen aangevangen voor het van toepassing worden van [artikel 52a, derde lid][ref1], bepaalt de rechter
      op verzoek van een van de partijen of ambtshalve een termijn waarbinnen partijen de gelegenheid wordt geboden
      hun stellingen en conclusies voor zover nodig aan te passen aan [artikel 52a, derde lid][ref2]. Stelt de rechter
      partijen tot een zodanige aanpassing in de gelegenheid, dan staat tegen die beslissing geen rechtsmiddel open;
      wijst de rechter een daartoe strekkend verzoek af, dan staat een rechtsmiddel daartegen slechts gelijktijdig met de
      einduitspraak open.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel52a
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel94
