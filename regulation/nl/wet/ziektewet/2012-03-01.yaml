  - number: '97'
    text: |-
      Ten aanzien van verzekerden die aanspraak maken op ziekengeld op grond van
      [artikel 29, tweede lid, onderdeel e, f of g][ref1], wier eerste dag van ongeschiktheid tot
      het verrichten van hun arbeid wegens ziekte is gelegen voor de dag van inwerkingtreding van
      [artikel II, onderdeel C, onder 2, van de Wet wijziging verrekening inkomsten met ziekengeld][ref2] en de
      werkgevers van die verzekerden is [artikel 38, vierde lid][ref3], zoals dat luidde op de dag voor inwerkingtreding
      van artikel II, onderdeel C, onder 2, van de Wet wijziging verrekening inkomsten met ziekengeld, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0030113#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel38
