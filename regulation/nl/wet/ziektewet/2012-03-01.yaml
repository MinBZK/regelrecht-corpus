  - number: '9'
    text: |-
      Werkgever is de overheidswerkgever onderscheidenlijk de natuurlijke persoon tot wie of het lichaam tot welk een of
      meer natuurlijke personen in dienstbetrekking staan.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel9
  - number: '10'
    text: |-
      Als werkgever wordt beschouwd:

      1°. in de gevallen, bedoeld in [artikel 4, eerste lid][ref1], onder:

      *a* en *b*: de aanbesteder;

      *c* en *d*: degene, met wie de overeenkomst tot bemiddeling is gesloten;

      *f*: de exploitant of mede-exploitant van het vaartuig;

      *g*: degene, bij wie de werkzaamheden worden verricht of de opleiding wordt genoten;

      *h*: de coöperatie;

      *i*: Onze Minister van Defensie onderscheidenlijk Onze Minister;

      *j*: Onze Minister van Defensie.

      2°. in de gevallen, bedoeld in [artikel 5][ref2], onder: a: de opdrachtgever;

      *b*: de thuiswerker;

      *c*: degene, met wie het optreden of de sportbeoefening is overeengekomen;

      *d*: degene, die bij de in [artikel 5][ref3] bedoelde algemene maatregel van bestuur als werkgever wordt
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel5
