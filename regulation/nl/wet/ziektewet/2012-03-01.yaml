  - number: 19b
    text: |-
      1 Geen recht op ziekengeld heeft de verzekerde gedurende de periode dat hem rechtens zijn vrijheid is ontnomen,
      vanaf de dag dat deze vrijheidsontneming één maand heeft geduurd. Indien de eerste dag van de ongeschiktheid tot
      het verrichten van zijn arbeid is gelegen in een periode dat de verzekerde rechtens zijn vrijheid is ontnomen,
      ontstaat geen recht op ziekengeld.

      2 Indien het recht op ziekengeld op grond van het eerste lid is geëindigd dan wel niet is ontstaan wordt betrokkene
      vanaf de dag dat hij in vrijheid wordt gesteld weer als verzekerde aangemerkt, indien hij op die dag aan de
      overige voorwaarden, bedoeld in [artikel 19][ref1], voldoet. Deze verzekerde heeft aanspraak op heropening dan wel
      toekenning van het recht op ziekengeld voor de resterende periode, bedoeld in [artikel 29][ref2], vijfde lid, dan
      wel [artikel 29a][ref3], vierde lid, met inachtneming van de bepalingen van deze wet.

      3 Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.

      4 Het eerste lid is niet van toepassing en het tweede lid is van overeenkomstige toepassing op bij algemene
      maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.

      5 De verzekerde ten aanzien van wie [artikel 19c, eerste lid][ref4], op de dag voorafgaande aan de
      vrijheidsontneming van toepassing is, heeft, in afwijking van het eerste lid, geen recht op ziekengeld vanaf de dag
      dat de vrijheidsontneming ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel19c
