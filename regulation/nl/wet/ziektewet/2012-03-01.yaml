  - number: '69'
    text: |-
      1 De vrijwillig verzekerde heeft recht op ziekengeld, indien hij wegens ziekte, zwangerschap of bevalling
      ongeschikt is tot het verrichten van hem passende arbeid.

      2 De vrouwelijke verzekerde heeft geen recht op ziekengeld gedurende de periode dat zwangerschaps- of
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1]
      of een uitkering op grond van [artikel 3:8 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel38
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel69
