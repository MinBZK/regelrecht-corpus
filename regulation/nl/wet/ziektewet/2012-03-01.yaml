  - number: '35'
    text: |-
      1 Na het overlijden van degene, aan wie ziekengeld is toegekend, wordt met ingang van de dag na het overlijden,
      ziekengeld in de vorm van een overlijdensuitkering uitbetaald:

      a. aan de langstlevende van de echtgenoten;

      b. bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;

      c. bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen, aan degenen met wie de overledene in
      gezinsverband leefde.

      2 Met degene aan wie ziekengeld is toegekend, wordt voor de toepassing van dit artikel gelijkgesteld, degene wiens
      overlijden heeft plaats gevonden in de maand waarin hij de leeftijd van 65 jaar zou hebben bereikt doch voor het
      bereiken van deze leeftijd is overleden, en die uitsluitend ingevolge [artikel 29][ref1], vierde lid, over de dag
      van zijn overlijden geen recht op ziekengeld had.

      3 De overlijdensuitkering is gelijk aan het bedrag van het ziekengeld over één maand doch niet over de zaterdagen
      en zondagen, berekend naar de hoogte van dat ziekengeld op de dag of laatstelijk voor de dag van overlijden van
      degene aan wie het ziekengeld is toegekend.

      4 In verband met het overlijden van degene aan wie ziekengeld is toegekend, is [artikel 29][ref2], vierde lid, niet
      van toepassing.

      5 De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden genoemd in het
      eerste lid, door het Uitvoeringsinstituut werknemersverzekeringen uitbetaald.

      6 De overlijdensuitkering wordt in een bedrag ineens uitbetaald.

      7 Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan ziekengeld dat, over na het overlijden
      gelegen dagen, reeds is uitbetaald.

      8 De overlijdensuitkering is niet vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel35
