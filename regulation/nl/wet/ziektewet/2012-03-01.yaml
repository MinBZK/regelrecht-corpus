  - number: '92'
    text: |-
      Geen recht op ziekengeld heeft de persoon die belanghebbende is als bedoeld in
      [artikel 1 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002822#Artikel1
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel92
