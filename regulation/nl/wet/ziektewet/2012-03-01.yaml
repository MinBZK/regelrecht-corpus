  - number: '68'
    text: |-
      1 De persoon, die om toelating tot de vrijwillige verzekering verzoekt, bedoeld in
      [artikel 64, eerste en tweede lid][ref1], bepaalt bij de aanvang van de vrijwillige verzekering de hoogte van het
      dagloon, met dien verstande dat:

      a. dit niet meer kan bedragen dan het in [artikel 17, eerste lid, van de Wet financiering sociale verzekering][ref2]
      bedoelde bedrag met betrekking tot een loontijdvak van een dag, eventueel verhoogd of verlaagd op grond van
      [artikel 18 van die wet][ref3];

      b. dit niet meer kan bedragen dan het loon of het inkomen dat hij in geval van ziekte naar het oordeel van het
      Uitvoeringsinstituut werknemersverzekeringen derft; en

      c. dit, ingeval naast de vrijwillige verzekering een vrijwillige verzekering als bedoeld in
      [hoofdstuk III van de Werkloosheidswet][ref4] is afgesloten, gelijk is aan het dagloon dat ten grondslag ligt aan
      de vrijwillige werkloosheidsverzekering.

      2 De uitkering op grond van de vrijwillige verzekering wordt berekend naar het in het eerste lid bedoelde dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
