  - number: 38a
    text: |-
      1 De verzekerde die een werkgever heeft als bedoeld in de eerste afdeling, paragraaf 3, en die aanspraak maakt
      op ziekengeld is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit op de
      tweede dag van die ongeschiktheid te melden aan zijn werkgever.

      2 De werkgever meldt uiterlijk op de vierde dag:

      a. waarop de verzekerde wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, na ontvangst van de in
      het eerste lid bedoelde melding, aan het Uitvoeringsinstituut werknemersverzekeringen, de eerste werkdag waarop de
      verzekerde wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, of

      b. vanaf de dag waarop de vrouwelijke werknemer recht had kunnen hebben op een uitkering op grond van
      [artikel 3:7, eerste lid][ref1], [3:8, tweede lid][ref2], of [3:10, eerste lid, van de Wet arbeid en zorg][ref3]
      doch die uitkering nog niet is aangevangen aan het Uitvoeringsinstituut werknemersverzekeringen, de eerste werkdag
      waarop de verzekerde wegens ziekte ongeschikt is tot het verrichten van haar arbeid.

      3 In afwijking van het tweede lid, onderdeel a, meldt de werkgever de eerste werkdag waarop de verzekerde
      wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, uiterlijk op de eerste dag na zes weken
      gerekend vanaf die eerste werkdag, indien de verzekerde aanspraak maakt op ziekengeld op grond van
      [artikel 29, tweede lid, onderdeel e][ref4], [artikel 29a, eerste lid][ref5], of [artikel 29b][ref6]. In afwijking
      van de vorige volzin meldt de werkgever de eerste werkdag waarop de verzekerde wegens ziekte ongeschikt is tot het
      verrichten van zijn arbeid op de laatste dag van de dienstbetrekking, indien de dienstbetrekking in de periode,
      bedoeld in de vorige zin, eindigt.

      4 Indien de verzekerde na een ziekmelding als bedoeld in het eerste lid weer geschikt is tot het verrichten van
      zijn arbeid, meldt hij aan de werkgever uiterlijk de tweede dag van die geschiktheid, de eerste dag waarop hij weer
      geschikt is tot het verrichten van zijn arbeid.

      5 De werkgever meldt na ontvangst van de in het vierde lid bedoelde melding, aan het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk op de tweede dag na de hersteldmelding door de verzekerde, de eerste dag waarop
      die verzekerde weer geschikt is tot het verrichten van zijn arbeid.

      6 In afwijking van het vijfde lid meldt de werkgever, indien de verzekerde aanspraak maakt op ziekengeld op grond
      van [artikel 29, tweede lid, onderdeel e][ref7], [artikel 29a, eerste lid][ref8], of [artikel 29b][ref9], de eerste
      werkdag waarop de verzekerde weer geschikt is tot het verrichten van zijn arbeid niet eerder dan de ziekmelding
      bedoeld in het derde lid.

      7 Indien de verzekerde door toepassing van [artikel 629, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref10]
      geen recht heeft op loon dan wel op grond van [artikel 76b, tweede lid][ref11], geen recht heeft op bezoldiging,
      meldt de werkgever dit aan het Uitvoeringsinstituut werknemersverzekeringen.

      8 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste € 455 indien de
      werkgever de verplichting, bedoeld in het tweede, derde, vijfde, zesde of zevende lid, niet of niet behoorlijk is
      nagekomen. De [artikelen 45a, derde, vierde en vijfde lid][ref12], [45c][ref13] en [45g, vierde lid][ref14], zijn
      van overeenkomstige toepassing.

      9 Indien de werkgever de melding, bedoeld in het tweede of derde lid, niet tijdig doet, kent het
      Uitvoeringsinstituut werknemersverzekeringen het ziekengeld met terugwerkende kracht toe over de verstreken
      periode, doch ten hoogste over een jaar.


