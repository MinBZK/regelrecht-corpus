  - number: '65'
    text: |-
      1 De in [artikel 64, eerste lid, onderdeel c respectievelijk d][ref1], genoemde termijn van één jaar
      respectievelijk van drie jaren wordt geacht niet te zijn onderbroken:

      a. indien de betrokkene gedurende niet meer dan zestig dagen niet verzekerd is geweest;

      b. gedurende de wachttijd als bedoeld in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref2] dan wel
      de [artikelen 19][ref3], [37][ref4] en [38 van de Wet op de arbeidsongeschiktheidsverzekering][ref5];

      c. gedurende het tijdvak, waarover een uitkering krachtens de [Wet werk en inkomen naar arbeidsvermogen][ref6]
      is genoten dan wel waarover een arbeidsongeschiktheidsuitkering krachtens de
      [Wet op de arbeidsongeschiktheidsverzekering][ref7] is genoten, berekend naar een arbeidsongeschiktheid van ten
      minste 45%.

      2 De in [artikel 64, eerste lid, onderdeel c respectievelijk d][ref8], genoemde voorwaarde van een
      verzekeringsduur van één jaar respectievelijk van drie jaren wordt geacht te zijn vervuld, indien de betrokkene
      in het genot is van een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref9] dan wel een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref10].


