  - number: 19c
    text: |-
      1 De verzekerde die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel
      heeft geen recht op ziekengeld.

      2 Indien het recht op ziekengeld op grond van het eerste lid is geëindigd dan wel niet is ontstaan wordt betrokkene
      vanaf de dag dat hij zich niet langer aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel onttrekt weer als verzekerde aangemerkt, indien hij op die dag aan de overige voorwaarden,
      bedoeld in [artikel 19][ref1], voldoet. Deze verzekerde heeft aanspraak op heropening dan wel toekenning
      van het recht op ziekengeld voor de resterende periode, bedoeld in [artikel 29, vijfde lid][ref2], dan wel
      [artikel 29a, vierde lid][ref3], met inachtneming van de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
