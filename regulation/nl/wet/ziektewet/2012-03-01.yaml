        artikel: 7:3
  - number: '73'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de behandeling van
      bezwaarschriften tegen besluiten, waaraan een medische beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel73
  - number: '74'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '75'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. medische beschikking: een beschikking waaraan een beoordeling van medische gegevens ten grondslag ligt;

      b. werknemer: de persoon op wiens medische gegevens de beoordeling betrekking heeft;

      c. werkgever: de belanghebbende bij een medische beschikking, die niet de werknemer is;

      d. bedrijfsarts: de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1], die belast
      is met de bijstand, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 75a
    text: |-
      1 Stukken die medische gegevens bevatten worden door het Uitvoeringsinstituut werknemersverzekeringen niet aan de
      eigenrisicodrager of de werkgever ter inzage of ter kennisname gegeven of toegezonden, tenzij de werknemer hiervoor
      schriftelijk toestemming heeft gegeven.

      2 De toestemming kan te allen tijde schriftelijk worden ingetrokken.

      3 Tijdens het horen in bezwaar kan de toestemming ook mondeling worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001888/2012-03-01#Artikel75a
  - number: 75b
    text: |-
      1 Indien door de werknemer geen toestemming is gegeven als bedoeld in [artikel 75a][ref1], is de inzage in, dan
      wel kennisname of toezending van stukken die medische gegevens bevatten, voorbehouden aan de bedrijfsarts of de
      arbodienst van de eigenrisicodrager dan wel aan een gemachtigde van de eigenrisicodrager of van de werkgever die
      advocaat of arts is dan wel daarvoor van het Uitvoeringsinstituut werknemersverzekeringen bijzondere toestemming
      heeft gekregen.

      2 De gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de eigenrisicodrager of van de werkgever bij
      de voorbereiding van een medische beschikking voorzover betrekking hebbend op medische gegevens.

      3 De arbodienst of de bedrijfsarts dan wel de gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de
      eigenrisicodrager bij:

      a. het opstellen van een bezwaar- of beroepschrift; en

      b. de behandeling van een bezwaar;

      voorzover betrekking hebbend op medische gegevens.

      4 [Artikel 7:4, tweede, vierde en zesde lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing op
      stukken of inlichtingen die medische gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel74
