  - number: 87a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in afwijking van
      [artikel 29, eerste lid][ref1], ziekengeld wordt uitgekeerd aan verzekerden die in dienstbetrekking staan tot bij
      of krachtens die maatregel te bepalen werkgevers.

      2 [Artikel 88][ref2] is van overeenkomstige toepassing.

      3 De werkgever kan een verzekeringsovereenkomst met betrekking tot zijn verplichting tot doorbetaling van loon
      als bedoeld in [629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref3] of bezoldiging als bedoeld in
      [artikel 76a, eerste lid][ref4] opzeggen met ingang van de dag dat de algemene maatregel van bestuur, bedoeld in
      het eerste lid, te zijnen aanzien in werking treedt, of, indien de opzegging later geschiedt, met ingang van de
      dag waarop deze de verzekeraar bereikt. In het geval dat de premie is vooruitbetaald wordt deze door de verzekeraar
      naar evenredigheid aan de werkgever terugbetaald.

      4 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
