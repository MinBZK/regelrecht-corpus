  - number: '3.3'
    text: |-
      De ondertekening bedoeld in het eerste lid, onderscheidenlijk derde lid, luidt: "De voorzitter van het Productschap
      Vee en Vlees, Voor deze, De voorzitter van (de naam van de uitgevende instantie)."
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel3
  - number: '4.1'
    text: |-
      De directeur van de Gezondheidsdienst voor Dieren b.v. wordt mandaat verleend om namens de voorzitter, met
      inachtneming van het bij of krachtens de verordening bepaalde, te besluiten en stukken te ondertekenen betreffende
      het uitgeven van certificaten als bedoeld in [artikel 5 van de verordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel5
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '5'
  - number: '4.2'
    text: |-
      De ondertekening bedoeld in het eerste lid luidt: "De voorzitter van het Productschap Vee en Vlees, Voor deze, De
      directeur van de Gezondheidsdienst voor Dieren b.v.."
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel4
  - number: '5.1'
    text: |-
      De op grond van de [artikelen 2][ref1], [3][ref2] of [4][ref3] gemandateerde personen dragen zorg voor een juiste
      en volledige registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0019797#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019797#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0019797#Artikel4
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019797
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019797
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0019797
        artikel: '4'
  - number: '5.2'
    text: |-
      De in het eerste lid genoemde registratie dient tenminste de volgende gegevens te bevatten: - de naam en adres van
      de aanvrager;
        - het levensnummer en genotypering van het schaap;
        - datum van afgifte van het dekcertificaat;
        - indien geen certificaat als bedoeld in [artikel 5 van de verordening][ref1] kan worden afgegeven, de reden
      hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel5
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '5'
  - number: '5.3'
    text: De voorzitter heeft te allen tijde inzage in de in het eerste lid genoemde registratie.
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel5
  - number: '5.4'
    text: |-
      Indien het bij dit besluit verleende mandaat wordt ingetrokken, wordt de registratie ter beschikking gesteld aan
      de voorzitter.
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel5
  - number: '6.1'
    text: 'Dit besluit wordt aangehaald als: Besluit certificeren van TSE-ongevoelige schapen (PVV) 2006.'
