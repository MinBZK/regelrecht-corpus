  - number: '3.2'
    text: |-
      De voorzitter van de hierna genoemde stamboeken met een op grond van de
      [Verordening ter uitvoering van de Verordening fokken van TSE-ongevoelige schapen (PVV) 2004][ref1] erkend
      fokprogramma wordt mandaat verleend om namens de voorzitter, met inachtneming van het bij of krachtens de
      verordening bepaalde, te besluiten en stukken te ondertekenen betreffende het uitgeven van certificaten als bedoeld
      in [artikel 5 van de verordening][ref2]: - Vereniging Het Zeeuwse Melkschaap
        - Vereniging Stamboek Friese Melkschaap


