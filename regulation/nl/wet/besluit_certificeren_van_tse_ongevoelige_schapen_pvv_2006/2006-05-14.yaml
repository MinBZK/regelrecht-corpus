  - number: '2.1'
    text: |-
      De directeur van een laboratorium als bedoeld in [artikel 4, derde lid, van de verordening][ref1] wordt
      mandaat verleend om namens de voorzitter, met inachtneming van het bij of krachtens de verordening
      bepaalde, te besluiten en stukken te ondertekenen betreffende het uitgeven van certificaten als bedoeld in
      [artikel 5 van de verordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017171#Artikel5
