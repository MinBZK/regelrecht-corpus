  - number: '6.2'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dag van dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019797/2006-05-14#Artikel6
