  - number: '2.1'
    text: |-
      Vervoerseenheden die worden gebruikt voor het vervoer van mest van evenhoevigen, diervoeders of rauwe melk en
      gebracht worden op bedrijven of andere plaatsen waar evenhoevigen worden gehouden, zijn voorzien van een kenteken
      als bedoeld in [bijlage II][ref1], dat overeenkomt met een van de gebieden waarbinnen voornoemde bedrijven of
      plaatsen bezocht worden.


      [ref1]: https://wetten.overheid.nl/BWBR0012537
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012537
  - number: '2.2'
    text: |-
      Vervoerseenheden die worden gebruikt voor het vervoer van gestorven slachtdieren als bedoeld in
      [artikel 2, eerste lid, onderdeel a, van de Destructiewet][ref1] voorzover afkomstig van plaatsen
      waar evenhoevigen worden gehouden, zijn voorzien van een kenteken als bedoeld in [bijlage II][ref2],
      dat overeenkomt met een van de gebieden waarbinnen gestorven slachtdieren als bedoeld in
      [artikel 2, eerste lid, onderdeel a, van de Destructiewet][ref3] voorzover afkomstig van plaatsen waar evenhoevigen
      worden gehouden, wordt opgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012537
      [ref3]: https://wetten.overheid.nl/BWBR0002244#Artikel2
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012537
      - id: ref3
        bwb_id: BWBR0002244
        artikel: '2'
  - number: '2.3'
    text: |-
      Het is verboden vervoerseenheden die overeenkomstig het eerste lid voorzien zijn van een kenteken in een ander
      gebied te brengen op bedrijven of andere plaatsen waar evenhoevigen worden gehouden, met dien verstande dat de
      gebieden Noord 1, Noord 2, Noord 3, Zuid 1, Zuid 2 en Zuid 3 als een gebied worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden met vervoerseenheden die overeenkomstig het tweede lid voorzien zijn van een kenteken in een ander
      gebied gestorven slachtdieren als bedoeld in [artikel 2, eerste lid, onderdeel a, van de Destructiewet][ref1]
      voorzover afkomstig van plaatsen waar evenhoevigen worden gehouden, op te halen, met dien verstande dat de gebieden
      Noord 1, Noord 2, Noord 3, Zuid 1, Zuid 2 en Zuid 3 als een gebied worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '2'
  - number: '2.5'
    text: |-
      Het kenteken, bedoeld in het eerste en tweede lid, wordt afgegeven door de Dienst Wegverkeer op aanvraag van
      de belanghebbende en na legitimatie van de bestuurder door middel van het rijbewijs en na overlegging van het
      kentekenbewijs of registratiebewijs van het betreffende vervoermiddel, met dien verstande dat per vervoerseenheid
      ten hoogste een kenteken wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel2
  - number: '2.6'
    text: |-
      Het eerste tot en met vijfde lid, zijn uitsluitend van toepassing op vervoermiddelen ten aanzien waarvan op
      grond van [artikel 36 van de Wegenverkeerswet 1994][ref1] een kentekenbewijs, dan wel een registratiebewijs is
      afgegeven, en op vervoermiddelen waarvan in het land van herkomst, indien dat niet Nederland is, een gelijkwaardig
      kentekenbewijs of registratiebewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: '3.1'
    text: |-
      Vervoerseenheden die worden gebruikt voor het vervoer van evenhoevigen en gebracht worden op bedrijven of andere
      plaatsen waar evenhoevigen worden gehouden, teneinde evenhoevigen op te halen, zijn voorzien van een kenteken als
      bedoeld in [bijlage II][ref1], dat overeenkomt met een van de gebieden waarbinnen voornoemde bedrijven of plaatsen
      bezocht worden.


      [ref1]: https://wetten.overheid.nl/BWBR0012537
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012537
  - number: '3.2'
    text: |-
      Het is verboden vervoerseenheden die overeenkomstig het eerste lid voorzien zijn van een kenteken in een ander
      gebied te brengen, met dien verstande dat de gebieden Noord 1, Noord 2, Noord 3, Zuid 1, Zuid 2 en Zuid 3 als een
      gebied worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel3
  - number: '3.3'
    text: |-
      Het kenteken, bedoeld in het eerste lid, wordt afgegeven door de Dienst Wegverkeer op aanvraag van de
      belanghebbende en na legitimatie van de bestuurder door middel van het rijbewijs en na overlegging van het
      kentekenbewijs of registratiebewijs van het betreffende vervoermiddel, met dien verstande dat per vervoerseenheid
      ten hoogste een kenteken wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel3
  - number: '3.4'
    text: |-
      Het eerste, tweede en derde lid zijn uitsluitend van toepassing op vervoermiddelen ten aanzien waarvan op grond van
      [artikel 36 van de Wegenverkeerswet 1994][ref1] een kentekenbewijs, dan wel een registratiebewijs is afgegeven, en
      op vervoermiddelen waarvan in het land van herkomst, indien dat niet Nederland is, een gelijkwaardig kentekenbewijs
      of registratiebewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: '4'
    text: |-
      In afwijking van [artikel 2, vijfde lid][ref1], onderscheidenlijk [artikel 3, derde lid][ref2], kan ten aanzien
      van een vervoerseenheid waarvoor reeds een kenteken is afgeven, aan de belanghebbende op aanvraag door de Dienst
      Wegverkeer een ander kenteken worden afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012537#Artikel3
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012537
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012537
        artikel: '3'
        paragraaf: '2'
  - number: 4.a
    text: |-
      de vervoerseenheden zijn gereinigd en ontsmet op een door de Minister geregistreerde wasplaats overeenkomstig een
      door de Minister goedgekeurd hygiëneprotocol en van deze reiniging en ontsmetting een verklaring wordt afgegeven;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel4
  - number: 4.b
    text: |-
      het overeenkomstig [artikel 2, vijfde lid][ref1], of [artikel 3, derde lid][ref2], afgegeven kenteken aan de Dienst
      Wegverkeer wordt geretourneerd, en


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012537#Artikel3
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012537
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012537
        artikel: '3'
        paragraaf: '2'
  - number: 4.c
    text: |-
      ten genoegen van de Dienst Wegverkeer is aangetoond dat de vervoerseenheid in de 72 uur voorafgaand aan de aanvraag
      geen bedrijf met evenhoevigen heeft bezocht.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel4
  - number: '5.1'
    text: |-
      Het buiten een gebied brengen van vervoermiddelen, die worden gebruikt voor het vervoer van evenhoevigen,
      mest van evenhoevigen, diervoeders of rauwe melk en die niet zijn voorzien van een krachtens
      [artikel 36 van de Wegenverkeerswet 1994][ref1] afgegeven kentekenbewijs, dan wel registratiebewijs is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: '5.2'
    text: |-
      Het buiten een gebied brengen van vervoermiddelen die worden gebruikt voor het vervoer van evenhoevigen, mest van
      evenhoevigen, diervoeders of rauwe melk en afkomstig zijn uit een land, niet zijnde Nederland, ten aanzien waarvan
      in het land van herkomst geen kentekenbewijs of registratiebewijs is afgegeven, is verboden.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van het eerste lid worden de gebieden Noord 1, Noord 2, Noord 3, Zuid 1, Zuid 2 en Zuid 3
      aangemerkt als een gebied.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel5
  - number: '7.1'
    text: |-
      Een persoon die ter uitoefening van beroep of bedrijf in contact komt met evenhoevigen dan wel een deel van een
      bedrijfsgebouw betreedt waarbinnen evenhoevigen verblijven:
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel7
  - number: 7.1.a
    text: |-
      gebruikt bedrijfseigen kleding en schoeisel of eigen kleding, mits hij met die kleding geen ander bedrijf bezoekt
      waar evenhoevigen verblijven;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel7
  - number: 7.1.b
    text: reinigt en ontsmet zijn schoeisel voor het betreden en bij het verlaten van het bedrijfsgebouw, en
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel7
  - number: 7.1.c
    text: |-
      gebruikt zoveel mogelijk de reeds op het bedrijf aanwezige gereedschappen. Indien de benodigde gereedschappen
      niet op het bedrijf aanwezig zijn, draagt de bezoeker zorg voor reiniging en ontsmetting van de gebruikte
      gereedschappen.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel7
  - number: '7.2'
    text: |-
      Onder bedrijfsgebouw, bedoeld in het eerste lid, wordt niet verstaan een bedrijfsgebouw dat deel
      uitmaakt van een op grond van de [Regeling betreffende het bijeenbrengen van dieren 2000][ref1] erkend
      varkensverzamelcentrum, runderverzamelcentrum, schapenverzamelcentrum of geitenverzamelcentrum dan wel,
      indien van toepassing, een plaats waar een tentoonstelling of keuring wordt gehouden, mits voldaan is aan
      [paragraaf 5 van de Regeling betreffende het bijeenbrengen van dieren 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011441
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011441
      - id: ref2
        bwb_id: BWBR0011441
        paragraaf: '5'
  - number: '8.1'
    text: |-
      Ter voorkoming van overdraagbare spongiforme encefalopathieën bij schapen en ter uitvoering van artikel 2 van
      beschikking (EG) nr. 2003/100 wordt medewerking gevorderd van het Productschap Vee en Vlees.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: '8.2'
    text: 'De in het eerste lid gevorderde medewerking bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: 8.2.a
    text: |-
      de opstelling van en het uitvoering geven aan het fokprogramma voor schapen, bedoeld in artikel 2 van beschikking
      (EG) nr. 2003/100, en
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: 8.2.b
    text: |-
      het bij verordening stellen van regels ten aanzien van het fokken van schapen ter voorkoming van overdraagbare
      spongiforme encefalopathieën, waaronder in ieder geval wordt begrepen een verbod op het fokken met schapen die
      niet in het bezit zijn van een erkenning van het Productschap Vee en Vlees en het stellen van voorwaarden aan het
      verkrijgen van deze erkenning.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: '8.3'
    text: |-
      Uiterlijk op 1 april 2005 is het fokprogramma, bedoeld in het tweede lid, onderdeel a, verplicht voor schapen als
      bedoeld in artikel 2, tweede lid, van beschikking (EG) nr. 2003/100.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: '8.4'
    text: |-
      Het Productschap Vee en Vlees kan vrijstelling of ontheffing verlenen van deelname aan het fokprogramma, bedoeld in
      het tweede lid, onderdeel a, overeenkomstig bijlage I, Deel 3, van beschikking (EG) nr. 2003/100.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: '8.5'
    text: |-
      Het Productschap Vee en Vlees kan bij verordening bepalen dat bij overtreding van artikel 3, tweede lid, van de
      Verordening fokken van TSE-ongevoelige schapen (PVV) 2004 van het Productschap Vee en Vlees, tuchtrechtelijke
      maatregelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel8
  - number: '9.1'
    text: |-
      De TSE-resistente status van een koppel schapen als bedoeld in artikel 4 in samenhang met bijlage II van
      beschikking (EG) nr. 2003/100 kan worden erkend, indien bij de aanvraag van een erkenning aangetoond wordt dat het
      een koppel schapen betreft:
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9
  - number: 9.1.a
    text: dat uitsluitend bestaat uit schapen met genotype ARR/ARR of
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9
  - number: 9.1.b
    text: waarvan het nageslacht uitsluitend is verwekt door rammen met genotype ARR/ARR.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9
  - number: '9.2'
    text: Ter uitvoering van het eerste lid wordt medewerking gevorderd van het Productschap Vee en Vlees.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9
  - number: '9.3'
    text: |-
      De in het tweede lid bedoelde medewerking bestaat uit het verlenen van de erkenning door het Productschap Vee en
      Vlees.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9
  - number: 9a.1
    text: |-
      Een aanvraag voor een erkenning als bedoeld in artikel 8, tweede lid, onderdeel b, en [artikel 9, derde lid]
      (onbekend), wordt ingediend bij het Productschap Vee en Vlees.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a.2
    text: |-
      Het Productschap Vee en Vlees kan een erkenning als bedoeld in artikel 8, tweede lid, onderdeel b, en artikel 9,
      derde lid, intrekken. Een erkenning als bedoeld in artikel 9, derde lid, wordt in ieder geval ingetrokken, indien
      bij het onderzoek, bedoeld in bijlage II, punt 2, van beschikking (EG) nr. 2003/100, een ander genotype wordt
      geconstateerd dan het genotype, bedoeld in artikel 9, eerste lid.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a.3
    text: |-
      Voor de behandeling van een aanvraag van een erkenning, of voor de behandeling van een aanvraag van een wijziging
      daarvan, en voor de instandhouding van een erkenning, bedoeld in artikel 8, tweede lid, onderdeel b, en artikel
      9, derde lid, kan het Productschap Vee en Vlees een vergoeding van kosten heffen, overeenkomstig een door haar
      vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a.4
    text: |-
      Het Productschap Vee en Vlees kan voor de onderzoeken en verrichtingen die zij uitvoert in het kader van het
      artikel 8, tweede lid, onderdeel a, en andere onderzoeken of verrichtingen met betrekking tot schapen of producten
      of voorwerpen die dragers van smetstof kunnen zijn afkomstig van schapen, voorzover de onderzoeken of verrichtingen
      zijn voorgeschreven bij besluit krachtens het Verdrag tot oprichting van de Europese Gemeenschap, of op verzoek van
      betrokkene plaatsvinden, een vergoeding van kosten heffen.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a.5
    text: |-
      De minister kan beleidsregels vaststellen met betrekking tot de in artikel 8, eerste lid, en artikel 9, tweede lid,
      gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a_bis.1
    text: |-
      Ter uitvoering van
      [artikel 3a van het Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke dierziekten][ref1]
      wordt medewerking gevorderd van het Productschap Pluimvee en Eieren, het Productschap Vee en Vlees, het
      Productschap Diervoeder en het Productschap Zuivel.


      [ref1]: https://wetten.overheid.nl/BWBR0007820#Artikel3a
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0007820
        artikel: 3a
  - number: 9a_bis.2
    text: |-
      De in het eerste lid gevorderde medewerking bestaat uit het stellen van regels ten behoeve van onderzoek naar
      de aanwezigheid van zoönosen, zoönoseverwekkers, antimicrobiële resistentie bij zoönoseverwekkers en bij andere
      verwekkers, wanneer deze een gevaar opleveren voor de volksgezondheid, overeenkomstig [richtlijn nr. 2003/99/EG]
      (32003L0099);
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a_bis.3
    text: |-
      Het Productschap Pluimvee en Eieren, het Productschap Vee en Vlees, het Productschap Diervoeder en het Productschap
      Zuivel verstrekken de minister de gegevens die zij hebben verzameld in het kader van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9a_bis.4
    text: |-
      Het Productschap Pluimvee en Eieren, het Productschap Vee en Vlees, het Productschap Diervoeder en het Productschap
      Zuivel kunnen voor de onderzoeken of verrichtingen die de productschappen uitvoeren in het kader van het eerste en
      tweede lid een vergoeding van kosten heffen.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9a
  - number: 9b.1
    text: |-
      Ter uitvoering van [artikel 3a van het Besluit bescherming tegen bepaalde zoönosen en bestrijding besmettelijke
      dierziekten](onbekend) wordt medewerking gevorderd van het Productschap Pluimvee en Eieren.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2
    text: 'De in het eerste lid gevorderde medewerking bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.a
    text: |-
      het stellen van regels met betrekking tot het verrichten van onderzoek ten behoeve van de monitoring van zoönosen,
      zoönoseverwekkers, antimicrobiële resistentie bij zoönoseverwekkers en bij andere verwekkers, wanneer deze een
      gevaar opleveren voor de volksgezondheid, ter uitvoering van de door de Commissie van de Europese Gemeenschappen
      vastgestelde voorschriften ter uitvoering van artikel 4 [verordening (EG) nr. 2160/2003](32003R2160);
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.b
    text: |-
      het stellen van regels met betrekking tot de uitvoering van het nationale bestrijdingsprogramma zoönosen en
      zoönoseverwekkers, bedoeld in artikel 5 van [verordening (EG) nr. 2160/2003](32003R2160), voorzover het gaat om:
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.b.1°
    text: |-
      hygiënemaatregelen en vervoersbeperkingen op pluimveebedrijven en bedrijven die producten van pluimvee verwerken
      ter voorkoming van een besmetting met, naar aanleiding van een verdenking van een besmetting met en naar aanleiding
      van een besmetting met een zoönose of een zoönoseverwekker;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.b.2°
    text: het doen van onderzoek ten behoeve van de controle op een besmetting met een zoönose of een zoönoseverwekker;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.b.3°
    text: |-
      het traceren van de dieren en dierlijke producten die aanwezig zijn of zijn geweest op een pluimveebedrijf en
      worden verdacht van of zijn besmet met een zoönose of een zoönoseverwekker;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.b.4°
    text: |-
      het afvoeren, vernietigen en behandelen van de dieren en dierlijke producten die aanwezig zijn op een
      pluimveebedrijf en worden verdacht van of zijn besmet met een zoönose of een zoönoseverwekker;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.b.5°
    text: het vergoeden van de dieren en dierlijke producten, bedoeld onder 4°.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.c
    text: |-
      het stellen van regels met betrekking tot de uitvoering van de speciale bestrijdingsmethoden die de Commissie van
      de Europese Gemeenschappen op basis van artikel 8 van [verordening (EG) nr. 2160/2003](32003R2160) voorschrijft;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.2.d
    text: |-
      het verrichten van de noodzakelijke werkzaamheden ter uitvoering en controle van de regels die op grond van de
      onderdelen a, b en c worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.3
    text: |-
      Het Productschap Pluimvee en Eieren verstrekt de minister de gegevens die het productschap verzamelt in het kader
      van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.4
    text: |-
      Het Productschap Pluimvee en Eieren kan in de artikelen 2, 3, 4 en 5 van de Verordening Hygiënevoorschriften
      pluimveehouderij (PPE) 2005, de artikelen 2, 3, 4 en 6 van de Verordening Hygiënevoorschriften pluimveeverwerkende
      industrie (PPE) 2005 en de artikelen 2, 3, 4 en 5 van de Verordening Hygiënevoorschriften kalkoenhouderij (PPE)
      2005, bepalen dat bij overtreding van deze artikelen tuchtrechtelijke maatregelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.5
    text: |-
      Het Productschap Pluimvee en Eieren kan personen aanwijzen die zijn belast met het toezicht op de naleving van de
      regels waarvoor, overeenkomstig het vierde lid, tuchtrechtelijke maatregelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9b.6
    text: |-
      Het Productschap Pluimvee en Eieren kan voor de onderzoeken of verrichtingen die het productschap uitvoert in het
      kader van het eerste en tweede lid een vergoeding van kosten heffen.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9b
  - number: 9c
    text: |-
      De termijn, bedoeld in [artikel 2, eerste lid, onderdeel b, van het Besluit bescherming tegen bepaalde zoönosen en
      bestrijding besmettelijke dierziekten](onbekend) bedraagt twee jaar.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9c
  - number: 9d.1
    text: |-
      Artikel 9a en artikel 9b zijn van toepassing vanaf het moment dat de Commissie van de Europese Gemeenschappen
      overeenkomstig artikel 5 van [verordening (EG) nr. 2160/2003](32003R2160) het nationale bestrijdingsprogramma
      zoönosen en zoönoseverwekkers heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9d
  - number: 9d.2
    text: |-
      Van de goedkeuring, bedoeld in het eerste lid, doet de Minister van Landbouw, Natuur en Voedselkwaliteit mededeling
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9d
  - number: 9d.3
    text: |-
      Overeenkomstig artikel 15 van [richtlijn 2003/99/EG](32003L0099) zijn tot het moment van goedkeuring, bedoeld
      in het eerste lid, de maatregelen van toepassing die zijn vastgesteld en uitgevoerd overeenkomstig [richtlijn
      92/117/EEG](31992L0117) van de Raad van de Europese Gemeenschappen van 17 december 1992 inzake maatregelen voor
      de bescherming tegen bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren en in producten van dierlijke
      oorsprong teneinde door voedsel overgedragen infecties en vergiftigingen te voorkomen (PbEG 1993 L 62).
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel9d
  - number: '10.1'
    text: |-
      Onverminderd het bepaalde in de Regeling handel levende dieren en levende producten is het verboden evenhoevigen,
      niet zijnde varkens en ingeschaarde schapen, van een bedrijf of andere plaats, niet zijnde een erkend
      verzamelcentrum, af te voeren indien in de periode van 21 dagen voorafgaand aan het voorgenomen vervoer op dat
      bedrijf of die plaats evenhoevigen zijn aangevoerd.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.2'
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet voor de afvoer van: - evenhoevigen rechtstreeks naar een
      slachthuis, of
        - evenhoevigen, niet zijnde weiderunderen, als bedoeld in de Regeling betreffende het bijeenbrengen van dieren
      2000, via een erkend verzamelcentrum naar een slachthuis, indien de af te voeren evenhoevigen direct voorafgaand
      aan de afvoer tenminste 21 aaneengesloten dagen op de plaats van afvoer hebben verbleven.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.3'
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet voor de afvoer van runderen van een opfokbedrijf naar een
      melkveehouderijbedrijf, mits het opfokbedrijf:
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.3.a
    text: is geregistreerd door de Minister;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.3.b
    text: |-
      uitsluitend runderen, jonger dan 26 maanden, die op ten hoogste drie verschillende bedrijven zijn geboren, en
      droogstaande koeien houdt.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.3.c
    text: uitsluitend runderen afvoert naar het melkveehouderijbedrijf van herkomst of een slachthuis;
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.3.d
    text: geen andere evenhoevigen houdt dan de onder b bedoelde runderen, en
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.3.e
    text: documenten aanwezig heeft waaruit blijkt op welk bedrijf de gehouden runderen zijn geboren.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.4'
    text: |-
      Het in het eerste lid bedoelde verbod geldt niet voor de afvoer van runderen, jonger dan 12 maanden, en
      droogstaande koeien van een melkveehouderijbedrijf, naar:
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.4.a
    text: |-
      een op grond van het derde lid, onderdeel a, geregistreerd opfokbedrijf, indien deze runderen van het opfokbedrijf
      worden afgevoerd naar het melkveehouderijbedrijf van herkomst of een slachthuis, of
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.4.b
    text: een erkend runderverzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.5'
    text: Het melkveehouderijbedrijf, bedoeld in het vierde lid, is geregistreerd door de Minister.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.6'
    text: |-
      Het is een bedrijf, niet zijnde een erkend varkens- of runderverzamelcentrum, waarop evenhoevigen worden gehouden
      verboden om op dezelfde dag evenhoevigen aan te voeren en af te voeren.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.7'
    text: |-
      Het in het eerste en zesde lid bedoelde verbod alsmede de verplichting, bedoeld in het tweede lid, gelden niet voor
      het vervoer van meer dan licht zieke of licht gewonde evenhoevigen ter noodslachting, bedoeld in artikel 10 van het
      Besluit dierenvervoer 1994, en voor het vervoer van runderen, jonger dan zes maanden, van een op grond van artikel
      9 van het Besluit eisen dierlijk sperma en spermawincentra erkend runderspermawincentrum naar een slachthuis.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.8'
    text: |-
      Indien voor het vervoer van varkens naar een lidstaat of een derde land, nadat deze reeds van een bedrijf zijn
      afgevoerd, ingevolge artikel 59, tweede lid, onderdeel e, van de wet in samenhang met artikel 6, eerste lid, van
      het Besluit dierenvervoer 1994 geen certificaat wordt afgegeven, is het in zoverre in afwijking van het zesde lid
      toegestaan, deze varkens op de dag dat dit certificaat geweigerd wordt weer op het bedrijf van herkomst aan te
      voeren en, na gedeeltelijke lossing, de niet geloste varkens direct weer af te voeren.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.9'
    text: |-
      De aanvraag voor de registratie, bedoeld in het derde lid, onderdeel a, onderscheidenlijk het vijfde lid, wordt bij
      de Voedsel en Waren Autoriteit ingediend op een daartoe ter beschikking gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '10.10'
    text: Het in het eerste lid bedoelde verbod geldt niet voor
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.10.a
    text: |-
      de afvoer van runderen, schapen of geiten van een plaats waar een tentoonstelling of keuring heeft plaatsgevonden,
      mits voldaan is aan paragraaf 5 van de Regeling betreffende het bijeenbrengen van dieren 2000, en
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: 10.10.b
    text: |-
      de afvoer van evenhoevigen van een plaats, voorzover daar geen evenhoevigen bijeen zijn gebracht afkomstig van
      verschillende plaatsen.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel10
  - number: '12.1'
    text: |-
      Het is verboden evenhoevigen, niet zijnde runderen, varkens, schapen of geiten, afkomstig van verschillende
      plaatsen, voor een kortere periode dan 21 dagen bijeen te brengen op een plaats, waaronder mede wordt verstaan
      een vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel12
  - number: '12.2'
    text: Het in het eerste lid bedoelde verbod geldt niet voor het bijeenbrengen van evenhoevigen op een slachthuis.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel12
  - number: '12.3'
    text: Het is verboden evenhoevigen, niet zijnde runderen, varkens, schapen, of geiten, af te voeren van een slachthuis.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel12
  - number: '13.1'
    text: |-
      Evenhoevigen, die binnen Nederland worden gebracht, worden rechtstreeks vervoerd naar en afgeleverd
      op één bedrijf, waaronder worden begrepen een erkend runderverzamelcentrum of een op grond van
      [artikel 9l van de Regeling betreffende het bijeenbrengen van dieren 2000][ref1] erkend schapen- of
      geitenverzamelcentrum, of één slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9l
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011441
        artikel: 9l
  - number: '13.2'
    text: |-
      Het eerste lid is niet van toepassing voorzover evenhoevigen rechtstreeks worden vervoerd naar een land, niet
      zijnde Nederland.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel13
  - number: '15.1'
    text: |-
      De registratie van een opfokbedrijf, bedoeld in [artikel 10, derde lid, onderdeel a][ref1], kan door de Minister
      worden doorgehaald, indien het opfokbedrijf niet voldoet aan [artikel 10, derde lid, onderdelen b, c, d of e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012537#Artikel10
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012537
        artikel: '10'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012537
        artikel: '10'
        paragraaf: '5'
  - number: '15.2'
    text: |-
      De registratie van een melkveehouderijbedrijf, bedoeld in [artikel 10, vijfde lid][ref1],
      kan door de Minister worden doorgehaald, indien het melkveehouderijbedrijf niet voldoet aan
      [artikel 10, vierde lid, onderdeel a of b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012537#Artikel10
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012537
        artikel: '10'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012537
        artikel: '10'
        paragraaf: '5'
  - number: '17.1'
    text: |-
      Een hygiëneprotocol dat op grond van artikel 4.2, eerste lid, onderdelen a en b, van de Regeling compartimentering
      Nederland mond- en klauwzeer 2001 III door of namens de Minister is goedgekeurd, geldt als een door de Minister op
      grond van [artikel 7, eerste lid, onderdelen a en b][ref1] goedgekeurd hygiëneprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel7
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012537
        artikel: '7'
        paragraaf: '3'
  - number: '17.2'
    text: |-
      Een kenteken dat op grond van artikel 2.1, vijfde lid, 2.2, derde lid, of 4 van de Regeling compartimentering
      Nederland mond- en klauwzeer 2001 III door de Dienst Wegverkeer is afgegeven, geldt als een door de Dienst
      Wegverkeer op grond van [artikel 2, vijfde lid][ref1], 3, derde lid, of 4 afgegeven kenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel2
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012537
        artikel: '2'
        paragraaf: '2'
  - number: '19'
    text: De Regeling compartimentering Nederland mond- en klauwzeer 2001 III wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel19
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvullende voorschriften besmettelijke dierziekten en zoönosen.'
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel20
  - number: '21'
    text: |-
      Deze regeling wordt op 6 juni 2001 om 19:00 uur bekendgemaakt aan de media en treedt onmiddellijk daarna in
      werking.
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel21
  - number: '22.1'
    text: |-
      Deze regeling berust op de [artikelen 17][ref1], [18, tweede lid][ref2], [30, eerste en derde lid][ref3],
      en [77][ref4] en [94, eerste lid, onderdelen i, j en k][ref5], [108][ref6] en
      [108a van de Gezondheids- en welzijnswet voor dieren][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel77
      [ref5]: https://wetten.overheid.nl/BWBR0005662#Artikel94
      [ref6]: https://wetten.overheid.nl/BWBR0005662#Artikel108
      [ref7]: https://wetten.overheid.nl/BWBR0005662#Artikel108a
    url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '30'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '77'
      - id: ref5
        bwb_id: BWBR0005662
        artikel: '94'
      - id: ref6
        bwb_id: BWBR0005662
        artikel: '108'
      - id: ref7
        bwb_id: BWBR0005662
        artikel: 108a
  - number: '22.2'
    text: |-
      Deze regeling berust mede op de [artikelen 3][ref1] en
