preamble:
  text: |-
    Gelet op artikel 10, eerste lid, van Richtlijn 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni
    1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende
    dieren en produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224) en op Beschikking
    2001/327/EG van de Commissie van de Europese Gemeenschappen van 24 april 2001 tot vaststelling van beperkende
    maatregelen met betrekking tot verplaatsingen van dieren van voor mond- en klauwzeer gevoelige soorten en houdende
    intrekking van beschikking 2001/263/EG (PbEG L 115) en op Beschikking 2001/223/EG van de Commissie van de Europese
    Gemeenschappen van 21 maart 2001 tot vaststelling van beschermende maatregelen in verband met mond- en klauwzeer in
    Nederland (PbEG L 82);

    Gelet op de artikelen 17, 18, eerste en tweede lid, 30, eerste en vierde lid, 31 en 77 van de Gezondheids- en
    welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012537/2004-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *gebied:*


              een van de al dan niet met name genoemde gebieden als bedoeld in [bijlage I][ref1] bij deze regeling;



            b

              *bijlage II:*


              [ bijlage II][ref2] bij deze regeling;



            c

              *Minister:*


              Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;



            d

              *vervoermiddel:*


              voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat voertuig
      voortbewogen aanhangwagens, opleggers of containers;



            e

              *vervoerseenheid:*


              voertuig dat danwel aanhangwagen, oplegger of container die deel uitmaakt van een combinatie als bedoeld in
      onderdeel d;



            f

              *erkend varkensverzamelcentrum:*


              verzamelcentrum, dat op grond van
      [artikel 4 van de Regeling betreffende het bijeenbrengen van dieren 2000][ref3] door de Minister is erkend;



            g

              *erkend runderverzamelcentrum:*


              runderverzamelcentrum, dat op grond van
      [artikel 9b van de Regeling betreffende het bijeenbrengen van dieren 2000][ref4] door de Minister is erkend;



            h






            i

              *melkveehouderijbedrijf:*


              bedrijf waar runderen worden gehouden voor de productie van melk;



            j

              *opfokbedrijf:*


              bedrijf waar uitsluitend runderen, jonger dan 26 maanden, worden gehouden die zijn bestemd om te worden
      afgevoerd naar het melkveehouderijbedrijf van herkomst;



            k
             UBN:

              UBN als bedoeld in de [Regeling identificatie en registratie van dieren 2003][ref5];



            l
            ingeschaarde schapen:

              schapen, die op een bedrijf uitsluitend ter beweiding voor een beperkte periode aanwezig zijn, niet in
      contact komen met evenhoevigen op het bedrijf waar ze beweid worden en die zijn afgevoerd van één bedrijf, terwijl
      de verantwoordelijkheid voor het voeden en verzorgen van deze dieren bij de houder die deze dieren heeft afgevoerd
      blijft berusten en de betrokken dieren na afloop van deze periode weer afgevoerd worden naar het bedrijf van
      herkomst;



            m
            beschikking (EG) nr. 2003/100:

              beschikking (EG) nr. 2003/100 van de Commissie van de Europese Gemeenschappen van 13 februari 2003 tot
      vaststelling van minimumeisen voor fokprogramma’s ter verkrijging van resistentie tegen overdraagbare spongiforme
      encefalopathieën bij schapen (PbEG L 41);



            n

              [verordening (EG) nr. 2160/2003](32003R2160):

              [verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en de Raad van de Europese
      Unie van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen
      zoönoseverwekkers (PbEU L 325);



            o

              [richtlijn nr. 2003/99/EG](32003L0099):

              [richtlijn nr. 2003/99/EG](32003L0099) van het Europees Parlement en de Raad van de Europese Unie van 17
      november 2003 inzake de bewaking van zoönoses en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG
      van de Raad en intrekking van [Richtlijn 92/117/EEG](31992L0117) van de Raad (PbEU L 325).


