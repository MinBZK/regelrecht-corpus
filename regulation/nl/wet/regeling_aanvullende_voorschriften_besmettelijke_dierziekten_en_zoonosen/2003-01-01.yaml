  - number: '3'
    text: |-
      1 Vervoerseenheden die worden gebruikt voor het vervoer van evenhoevigen en gebracht worden op bedrijven of andere
      plaatsen waar evenhoevigen worden gehouden, teneinde evenhoevigen op te halen, zijn voorzien van een kenteken als
      bedoeld in [bijlage II][ref1], dat overeenkomt met een van de gebieden waarbinnen voornoemde bedrijven of plaatsen
      bezocht worden.

      2 Het is verboden vervoerseenheden die overeenkomstig het eerste lid voorzien zijn van een kenteken in een ander
      gebied te brengen, met dien verstande dat de gebieden Noord 1, Noord 2, Noord 3, Zuid 1, Zuid 2 en Zuid 3 als een
      gebied worden aangemerkt.

      3 Het kenteken, bedoeld in het eerste lid, wordt afgegeven door de Dienst Wegverkeer op aanvraag van de
      belanghebbende en na legitimatie van de bestuurder door middel van het rijbewijs en na overlegging van het
      kentekenbewijs of registratiebewijs van het betreffende vervoermiddel, met dien verstande dat per vervoerseenheid
      ten hoogste een kenteken wordt afgegeven.

      4 Het eerste, tweede en derde lid zijn uitsluitend van toepassing op vervoermiddelen ten aanzien waarvan op
      grond van [artikel 36 van de Wegenverkeerswet 1994][ref2] een kentekenbewijs, dan wel een registratiebewijs is
      afgegeven, en op vervoermiddelen waarvan in het land van herkomst, indien dat niet Nederland is, een gelijkwaardig
      kentekenbewijs of registratiebewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0012537
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel36
