  - number: '5'
    text: |-
      1 Het buiten een gebied brengen van vervoermiddelen, die worden gebruikt voor het vervoer van
      evenhoevigen, mest van evenhoevigen, diervoeders of rauwe melk en die niet zijn voorzien van een krachtens
      [artikel 36 van de Wegenverkeerswet 1994][ref1] afgegeven kentekenbewijs, dan wel registratiebewijs is verboden.

      2 Het buiten een gebied brengen van vervoermiddelen die worden gebruikt voor het vervoer van evenhoevigen, mest van
      evenhoevigen, diervoeders of rauwe melk en afkomstig zijn uit een land, niet zijnde Nederland, ten aanzien waarvan
      in het land van herkomst geen kentekenbewijs of registratiebewijs is afgegeven, is verboden.

      3 Voor de toepassing van het eerste lid worden de gebieden Noord 1, Noord 2, Noord 3, Zuid 1, Zuid 2 en Zuid 3
      aangemerkt als een gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0012537/2003-01-01#Artikel5
