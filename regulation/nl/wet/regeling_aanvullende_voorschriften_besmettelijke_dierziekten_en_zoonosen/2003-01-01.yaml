      - id: ref2
        bwb_id: BWBR0011441
        paragraaf: '5'
  - number: '13'
    text: |-
      1 Evenhoevigen, die binnen Nederland worden gebracht, worden rechtstreeks vervoerd naar en afgeleverd op één
      bedrijf, waaronder wordt begrepen een runderverzamelcentrum, of één slachthuis.

      2 Het eerste lid is niet van toepassing voorzover evenhoevigen rechtstreeks worden vervoerd naar een land, niet
      zijnde Nederland.
    url: https://wetten.overheid.nl/BWBR0012537/2003-01-01#Artikel13
  - number: '14'
    text: |-
      In afwijking van [artikel 2 van de Regeling halteplaatsen][ref1] is het verboden evenhoevigen tijdens het vervoer
      uit te laden op een halteplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0010527#Artikel2
