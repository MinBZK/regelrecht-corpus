        artikel: '36'
  - number: '7'
    text: |-
      1 Een persoon die ter uitoefening van beroep of bedrijf in contact komt met evenhoevigen dan wel een deel van een
      bedrijfsgebouw betreedt waarbinnen evenhoevigen verblijven:

      a. gebruikt bedrijfseigen kleding en schoeisel of eigen kleding, mits hij met die kleding geen ander bedrijf
      bezoekt waar evenhoevigen verblijven;

      b. reinigt en ontsmet zijn schoeisel voor het betreden en bij het verlaten van het bedrijfsgebouw, en

      c. gebruikt zoveel mogelijk de reeds op het bedrijf aanwezige gereedschappen. Indien de benodigde gereedschappen
      niet op het bedrijf aanwezig zijn, draagt de bezoeker zorg voor reiniging en ontsmetting van de gebruikte
      gereedschappen.

      2 De houder van evenhoevigen houdt een register bij van alle bedrijfsmatige bezoeken, bedoeld in het eerste lid,
      waarin tenminste wordt opgenomen de datum van het bezoek alsmede de naam van de bezoeker en, indien van toepassing,
      de naam van het bedrijf in opdracht waarvan hij het bedrijf waar evenhoevigen verblijven bezoekt.

      3 De houder van evenhoevigen bewaart het register, bedoeld in het tweede lid, gedurende tenminste 3 maanden.

      4 Onder bedrijfsgebouw, bedoeld in het eerste lid, wordt niet verstaan een bedrijfsgebouw dat deel
      uitmaakt van een op grond van de [Regeling betreffende het bijeenbrengen van dieren 2000][ref1] erkend
      varkensverzamelcentrum, runderverzamelcentrum, schapenverzamelcentrum of geitenverzamelcentrum dan wel,
      indien van toepassing, een plaats waar een tentoonstelling of keuring wordt gehouden, mits voldaan is aan
      [paragraaf 5 van de Regeling betreffende het bijeenbrengen van dieren 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011441
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0012537/2003-01-01#Artikel7
    references:
      - id: ref1
