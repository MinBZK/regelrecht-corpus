      Deze regeling berust op de [artikelen 17, tweede lid][ref1], [18, tweede lid][ref2],
      [30, eerste en derde lid][ref3], en [77 van de Gezondheids- en welzijnswet voor dieren][ref4]
      zoals die luiden met ingang van het tijdstip waarop de wet van 30 januari 2002 tot wijziging van de
      [Gezondheids- en welzijnswet voor dieren][ref5] (veterinair complex) (Stb. 88) in werking treedt.


