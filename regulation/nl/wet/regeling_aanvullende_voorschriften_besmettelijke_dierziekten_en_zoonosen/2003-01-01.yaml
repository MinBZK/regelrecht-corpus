  - number: '4'
    text: |-
      In afwijking van [artikel 2, vijfde lid][ref1], onderscheidenlijk [artikel 3, derde lid][ref2], kan ten aanzien
      van een vervoerseenheid waarvoor reeds een kenteken is afgeven, aan de belanghebbende op aanvraag door de Dienst
      Wegverkeer een ander kenteken worden afgegeven indien:

      a. de vervoerseenheden zijn gereinigd en ontsmet op een door de Minister geregistreerde wasplaats overeenkomstig
      een door de Minister goedgekeurd hygiëneprotocol en van deze reiniging en ontsmetting een verklaring wordt
      afgegeven;

      b. het overeenkomstig [artikel 2, vijfde lid][ref3], of [artikel 3, derde lid][ref4], afgegeven kenteken aan de
      Dienst Wegverkeer wordt geretourneerd, en

      c. ten genoegen van de Dienst Wegverkeer is aangetoond dat de vervoerseenheid in de 72 uur voorafgaand aan de
      aanvraag geen bedrijf met evenhoevigen heeft bezocht.


      [ref1]: https://wetten.overheid.nl/BWBR0012537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012537#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012537#Artikel3
