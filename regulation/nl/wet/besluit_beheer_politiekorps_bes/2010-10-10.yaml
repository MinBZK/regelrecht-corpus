---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_beheer_politiekorps_bes
regulatory_layer: WET
publication_date: '2010-10-07'
valid_from: '2010-10-10'
bwb_id: BWBR0028780
url: https://wetten.overheid.nl/BWBR0028780/2010-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van
    Justitie van 13 juli 2010, nr. 2010-0000460988, CZW/WSG;

    Gelet op artikel 14, derde lid, van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint
    Eustatius en Saba en artikel 2 van de Veiligheidswet BES;

    De Raad van State gehoord (advies van 28 juli 2010, nr. W04.10.0296/1);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 28 september
    2010, nr. 2010-0000592855, uitgebracht mede namens Onze Minister van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel1
  - number: 1.a
    text: |-
      *ingeslotene:* persoon die rechtens van zijn vrijheid is beroofd, alsmede de persoon die ten behoeve van de
      hulpverlening aan hem op een bureau van het politiekorps is ondergebracht;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel1
  - number: 1.b
    text: '*Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel1
  - number: 1.c
    text: |-
      *politiecellencomplex:* in een gebouw te onderscheiden ruimte waarin een of meer gangen met daaraan grenzend een of
      meer ruimten liggen die worden gebruikt voor het insluiten van personen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      De korpsbeheerder politie draagt zorg voor het inrichten van één of meerdere eenheden in elk van de openbare
      lichamen die uitsluitend of in hoofdzaak zijn belast met de basispolitiezorg.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Aan het hoofd van de eenheden, bedoeld in het eerste lid, staat het hoofd basispolitiezorg. Het hoofd
      basispolitiezorg wordt aangewezen door de korpsbeheerder politie in overeenstemming met de procureur-generaal en
      na verkregen instemming van de gezaghebbers. Het hoofd van een eenheid wordt aangewezen door de korpsbeheerder
      politie, in overeenstemming met de procureur-generaal en na verkregen instemming van de desbetreffende gezaghebber.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Plaatsing van andere ambtenaren van politie bij een eenheid die uitsluitend of in hoofdzaak is belast met de
      basispolitiezorg geschiedt niet dan na overleg met de gezaghebber. Indien de taakvervulling van een ambtenaar van
      politie dit naar het oordeel van de gezaghebber noodzakelijk maakt, draagt de korpsbeheerder politie zorg voor
      vervanging.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De korpsbeheerder politie draagt ten behoeve van de opsporing van strafbare feiten zorg voor het inrichten van de
      recherchefunctie bij het politiekorps.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      De korpsbeheerder politie draagt er zorg voor dat het politiekorps ten behoeve van de uitoefening van de
      recherchefunctie beschikt, onderscheidenlijk kan beschikken over voorzieningen op het gebied van:
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: 3.2.a
    text: tactische recherche;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: 3.2.b
    text: technische recherche;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: 3.2.c
    text: financiële recherche;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: 3.2.d
    text: digitale recherche, en
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: 3.2.e
    text: informatie- en analysevoorziening.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen voorzieningen op andere gebieden dan die, genoemd in het tweede
      lid, aanwijzen waarover het politiekorps beschikt, onderscheidenlijk kan beschikken ten behoeve van de uitoefening
      van de recherchefunctie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: '3.4'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Justitie kunnen regels worden gegeven over de taken en de
      uitvoering van de werkzaamheden ten behoeve van de uitoefening van de recherchefunctie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: '3.5'
    text: |-
      Met inachtneming van de regels, bedoeld in het vierde lid, kunnen bij regeling van Onze Minister regels worden
      gesteld over het beheer van de voorzieningen, bedoeld in het tweede en derde lid. Indien deze regels voorschriften
      betreft die aan de inrichting van de voorzieningen worden gesteld, worden zij gegeven bij regeling van Onze
      Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De korpsbeheerder politie draagt er zorg voor dat het politiekorps beschikt, onderscheidenlijk kan
      beschikken over ambtenaren die kunnen worden belast met het, ten behoeve van de recherchefunctie,
      verwerken van gegevens die noodzakelijk zijn voor de opsporing van misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: '4.2'
    text: |-
      Het politiekorps beschikt, onderscheidenlijk kan beschikken over ambtenaren die kunnen worden belast met de
      uitvoering van een bevel tot observatie als bedoeld in [artikel 177l van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177l
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 177l
  - number: '4.3'
    text: |-
      Het politiekorps beschikt, onderscheidenlijk kan beschikken over ambtenaren die
      kunnen worden belast met de uitvoering van een bevel tot infiltratie als bedoeld in
      [artikel 177m, eerste of tweede lid, van het Wetboek van Strafvordering BES][ref1] en met de begeleiding
      van personen die op grond van [artikel 177x, eerste lid, van het Wetboek van Strafvordering BES][ref2]
      bijstand verlenen aan de opsporing. Daarnaast kunnen deze ambtenaren worden belast met de uitvoering van
      een bevel tot pseudo-koop of pseudo-dienstverlening als bedoeld in [artikel 177n, eerste lid][ref3], of
      [artikel 177w, eerste lid, van het Wetboek van Strafvordering BES][ref4] en een bevel tot stelselmatige inwinning
      van informatie als bedoeld in [artikel 177o, eerste lid][ref5], of artikel 177w, eerste lid, van het Wetboek van
      Strafvordering BES.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel177m
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel177x
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel177n
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel177w
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel177o
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: 177m
      - id: ref2
        bwb_id: BWBR0028681
        artikel: 177x
      - id: ref3
        bwb_id: BWBR0028681
        artikel: 177n
      - id: ref4
        bwb_id: BWBR0028681
        artikel: 177w
      - id: ref5
        bwb_id: BWBR0028681
        artikel: 177o
  - number: '4.4'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Justitie kunnen regels worden gegeven over de taken en de
      uitvoering van de werkzaamheden van de ambtenaren, bedoeld in het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      Met inachtneming van de regels, bedoeld in het vierde lid, kunnen bij regeling van Onze Minister regels worden
      gesteld over het beheer van het politiekorps, voor zover het betreft de ambtenaren, bedoeld in het eerste, tweede
      en derde lid. Indien deze regels voorschriften bevatten die aan de organisatie van het politiekorps worden gesteld,
      worden zij gegeven door Onze Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel4
  - number: '5'
    text: |-
      De korpsbeheerder politie draagt er zorg voor dat het politiekorps ten behoeve van de
      recherchefunctie beschikt over een gegevensbestand voor de verwerking van politiegegevens, bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '10'
  - number: '6.1'
    text: |-
      De korpsbeheerder politie draagt er zorg voor dat het politiekorps beschikt, onderscheidenlijk kan beschikken, over
      ambtenaren die, indien redelijkerwijs mag worden aangenomen dat levensbedreigende omstandigheden tegen de politie
      of anderen dreigen, de volgende werkzaamheden uitvoeren:
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: 6.1.a
    text: het verrichten van planmatige aanhoudingen;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: 6.1.b
    text: het bewaken en beveiligen van politie-infiltranten;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: 6.1.c
    text: het assisteren bij het bewaken en beveiligen van het transport van getuigen, verdachten of gedetineerden;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: 6.1.d
    text: het assisteren bij het bewaken en beveiligen van objecten;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: 6.1.e
    text: |-
      andere werkzaamheden waarvoor toestemming is verkregen van Onze Minister in overeenstemming met Onze Minister van
      Justitie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het beheer van het politiekorps, voor zover het
      betreft de ambtenaren, bedoeld in het eerste lid. Indien deze regels voorschriften bevatten die aan de organisatie
      van het politiekorps worden gesteld, worden zij gegeven door Onze Minister in overeenstemming met Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel6
  - number: '7'
    text: |-
      De korpsbeheerder politie stelt de ambtenaar van politie in de gelegenheid de noodzakelijke training en opleiding
      te volgen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel7
  - number: '8.1'
    text: Onze Minister geeft regels met betrekking tot het politielegitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel8
  - number: '8.2'
    text: Onze Minister kan regels stellen met betrekking tot het gebruik van de politiehuisstijl.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel8
  - number: '9.1'
    text: 'De korpsbeheerder politie treft voorzieningen opdat de ingeslotene in ieder geval beschikt over:'
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: 9.1.a
    text: slaapgelegenheid;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: 9.1.b
    text: eten en drinken in overeenstemming met medische en levensbeschouwelijke of godsdienstige eisen;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: 9.1.c
    text: sanitair;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: 9.1.d
    text: de noodzakelijke medische zorg, en
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: 9.1.e
    text: informatie over de gang van zaken in het politiecellencomplex.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Tenzij het politiecellencomplex geen luchtplaats heeft, draagt de korpsbeheerder politie er zorg voor dat de
      ingeslotene tweemaal daags wordt gelucht.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      In verband met het eerste lid, onderdeel d, treft de korpsbeheerder politie een regeling met artsen in het openbaar
      lichaam waar het politiecellencomplex is gelegen teneinde van hulp verzekerd te zijn voor de medische zorg van
      ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      Met inachtneming van het bij of krachtens de wet bepaalde treft de korpsbeheerder politie een regeling met
      betrekking tot het roken, de ontspanning, het telefoneren en het ontvangen van bezoek van de ingeslotene.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '9.5'
    text: Onze Minister geeft regels over de inrichting van een politiecellencomplex.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '9.6'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Justitie wordt bepaald welke gegevens worden geregistreerd
      over ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '9.7'
    text: |-
      In geval van overlijden of poging tot zelfdoding van een ingeslotene draagt de korpsbeheerder politie er zorg voor
      dat het openbaar ministerie hiervan onverwijld in kennis wordt gesteld en dat aan Onze Minister en Onze Minister
      van Justitie hiervan een schriftelijk rapport wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      De korpsbeheerder politie wijst een ambtenaar aan die wordt belast met de leiding van het politiecellencomplex en
      het toezicht op de ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Met inachtneming van de [artikelen41][ref1], [42][ref2], [48 tot en met 52 van de Ambtsinstructie politie BES][ref3]
      stelt de korpsbeheerder politie een instructie vast voor het personeel, niet zijnde ambtenaren van politie, dat is
      belast met de zorg voor ingeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028717#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0028717#Artikel48
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0028717
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0028717
        artikel: '48'
  - number: '10.3'
    text: |-
      Onze Minister kan regels geven over de eisen van bekwaamheid waaraan het personeel, bedoeld in het tweede lid,
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      De commissie, bedoeld in [artikel 16, tweede lid, onderdeel a, van de Veiligheidswet BES][ref1] heeft mede tot
      taak:


      [ref1]: https://wetten.overheid.nl/BWBR0028586#Artikel16
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028586
        artikel: '16'
  - number: 11.1.a
    text: |-
      toezicht te houden op de huisvesting, veiligheid, verzorging en bejegening van ingeslotenen in de
      politiecellencomplexen;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel11
  - number: 11.1.b
    text: jaarlijks rapport uit te brengen aan de korpsbeheerder politie over haar werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel11
  - number: 11.1.c
    text: |-
      gevraagd en ongevraagd aan de korpsbeheerder politie advies uit te brengen en inlichtingen te geven omtrent
      aangelegenheden betreffende de politiecellencomplexen.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Jaarlijks zendt de korpsbeheerder politie een verslag van de werkzaamheden en bevindingen van de commissie als
      bedoeld in het eerste lid aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      De korpsbeheerder politie doet jaarlijks verslag over de omvang en samenstelling, alsmede over de werkdruk en de
      taakuitvoering van het politiekorps aan Onze Minister en Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel12
  - number: '12.2'
    text: De korpsbeheerder politie verstrekt de gegevens die Onze Minister van Justitie overigens noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van het tijdstip waarop de [Veiligheidswet BES][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028586
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028586
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit beheer politiekorps BES.'
    url: https://wetten.overheid.nl/BWBR0028780/2010-10-10#Artikel14
