preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige regels te stellen op het gebied van de
    distributie van elektriciteit, gas en warmte, alsmede met betrekking tot de taak en het functioneren van
    distributiebedrijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008429/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: distributie van elektriciteit: het
      leveren van elektriciteit aan beschermde afnemers, bedoeld in [artikel 56 van de Elektriciteitswet 1998][ref1];
      distributie van gas: het leveren van gas aan beschermde afnemers, bedoeld in
      [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref2], met uitzondering van de leveringen van gas bedoeld
      in [artikel 21, tweede lid, onder b, van die wet][ref3]; distributie van warmte: het leveren van warmte aan
      verbruikers, behoudens voor zover dit leveren geschiedt door een natuurlijke persoon of een rechtspersoon die -
      hetzij warmte levert aan niet meer dan tien verbruikers tegelijk,
        - hetzij per jaar niet meer warmte aan verbruikers levert dan 10 000 gigajoules,
        - hetzij eigenaar is van de gebouwen, ten behoeve waarvan de warmte wordt geleverd; verbruiker van elektriciteit:
      een afnemer als bedoeld in [artikel 1, eerste lid, onderdeel c, van de Elektriciteitswet 1998][ref4];
      distributiebedrijf: een organisatorische eenheid die zich bezighoudt met het geheel of ten dele in het kader van
      de distributie leveren van elektriciteit of gas of met de distributie van warmte; Onze Minister: Onze Minister van
      Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0008429/2003-01-01#Artikel1
    references:
