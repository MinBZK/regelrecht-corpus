$id: geneesmiddelenwet
regulatory_layer: WET
publication_date: '2023-09-13'
valid_from: '2009-07-01'
bwb_id: BWBR0021505
url: https://wetten.overheid.nl/BWBR0021505/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke regels op het terrein van de
    geneesmiddelenvoorziening te moderniseren en met het oog daarop een nieuwe Geneesmiddelenwet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.b
    text: |-
      geneesmiddel: een substantie of een samenstel van substanties die bestemd is om te worden toegediend of aangewend
      voor dan wel op enigerlei wijze wordt gepresenteerd als zijnde geschikt voor:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.b.1°
    text: het genezen of voorkomen van een ziekte, gebrek, wond of pijn bij de mens,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.b.2°
    text: het stellen van een geneeskundige diagnose bij de mens, of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.b.3°
    text: |-
      het herstellen, verbeteren of anderszins wijzigen van fysiologische functies bij de mens door een farmacologisch,
      immunologisch of metabolisch effect te bewerkstelligen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.b.1
    text: 'geneesmiddel voor geavanceerde therapie: een geneesmiddel als bedoeld in artikel 2 van verordening 1394/2007;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.c
    text: 'immunologisch geneesmiddel: een vaccin, toxine, serum of allergeen;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.d
    text: 'bloedproduct: een uit menselijk bloed of menselijk plasma bereid geneesmiddel;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.e
    text: |-
      geneesmiddel voor onderzoek: een geneesmiddel als bedoeld in
      [artikel 1, eerste lid, onder o, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '1'
  - number: 1.1.f
    text: |-
      homeopathisch geneesmiddel: een geneesmiddel dat volgens een homeopathisch fabricageprocédé, beschreven in de
      krachtens het Verdrag inzake de samenstelling van een Europese farmacopee van 22 juli 1964, Trb.1966, nr. 115,
      samengestelde Europese farmacopee of, bij ontstentenis daarvan, in een in een lidstaat officieel in gebruik zijnde
      farmacopee, wordt verkregen uit grondstoffen die in de homeopathisch-farmaceutische literatuur worden aangeduid als
      homeopathische grondstoffen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.g
    text: |-
      kruidensubstantie: verse of gedroogde, hele, gesneden of gebroken planten, delen van planten, algen, fungi en
      korstmossen, die zijn gedefinieerd door het gebruikte plantendeel en de botanische naam volgens het binominale
      systeem;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.h
    text: |-
      kruidenpreparaat: een preparaat dat wordt verkregen door kruidensubstanties te onderwerpen aan extractie,
      destillatie, uitpersen, fractionering, zuivering, concentratie of fermentatie;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.i
    text: |-
      kruidengeneesmiddel: een geneesmiddel dat als werkzame bestanddelen uitsluitend een of meer kruidensubstanties, een
      of meer kruidenpreparaten dan wel een combinatie van een of meer kruidensubstanties en kruidenpreparaten bevat;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.j
    text: |-
      biologische substantie: een substantie die wordt geproduceerd door of geëxtraheerd uit een biologische bron en
      waarvan de typering en de bepaling van de kwaliteit alleen kan plaatsvinden aan de hand van een combinatie van
      fysisch-chemisch-biologische proeven in samenhang met het productieprocédé en de beheersing van dat procédé;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.k
    text: 'biologisch geneesmiddel: een geneesmiddel waarvan de werkzame stof een biologische substantie is;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.l
    text: 'radiofarmaceuticum: een geneesmiddel dat radionucliden bevat;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.m
    text: |-
      generator van radionucliden: een systeem dat een gebonden ouderradionuclide bevat waaruit een dochterradionuclide
      ontstaat die in een radiofarmaceuticum wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.n
    text: 'kit: een preparaat dat wordt geconstrueerd of gecombineerd met radionucliden tot een radiofarmaceuticum;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.o
    text: |-
      uitgangsstof van radionucliden: een radionuclide, geproduceerd voor het radioactief labelen van een andere stof,
      vóór de toediening ervan;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.p
    text: |-
      referentiegeneesmiddel: een geneesmiddel waarvoor in een lidstaat of door de Europese Gemeenschap een
      handelsvergunning is verleend en waarnaar bij de aanvraag bij het College om een handelsvergunning wordt verwezen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.q
    text: |-
      generiek geneesmiddel: een geneesmiddel waarvan de samenstelling van de werkzame stoffen zowel kwalitatief als
      kwantitatief dezelfde is als die van het referentiegeneesmiddel, de farmaceutische vorm dezelfde is als die van
      het referentiegeneesmiddel en de biologische equivalentie met het referentiegeneesmiddel in wetenschappelijke
      studies inzake biologische beschikbaarheid is aangetoond, dan wel naar zijn aard biologisch equivalent is aan het
      referentiemiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.r
    text: |-
      weesgeneesmiddel: een geneesmiddel dat krachtens [Verordening (EG) Nr. 141/2000](32000R0141) van het Europees
      Parlement en de Raad van 16 december 1999 (PbEG L 18) inzake weesgeneesmiddelen als zodanig is aangewezen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.s
    text: 'UR-geneesmiddel: een geneesmiddel dat uitsluitend op recept ter hand mag worden gesteld;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.s.1
    text: 'UA-geneesmiddel: een geneesmiddel dat zonder recept en uitsluitend in een apotheek te hand mag worden gesteld;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.t
    text: |-
      UAD-geneesmiddel: een geneesmiddel dat zonder recept, doch uitsluitend in een apotheek of een verkooppunt onder
      toezicht van een drogist ter hand mag worden gesteld, niet zijnde een UA-geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.u
    text: |-
      AV-geneesmiddel: een geneesmiddel dat zonder recept ook buiten een apotheek of een verkooppunt onder toezicht van
      een drogist, ter hand mag worden gesteld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.v
    text: |-
      farmaceutische vorm: de fysieke vorm waarin een geneesmiddel is gebracht met het oog op de toediening of aanwending
      bij de mens;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.w
    text: |-
      naam van een geneesmiddel: een fantasienaam dan wel een algemene of wetenschappelijke benaming, vergezeld van een
      merk of van de naam van de houder van de handelsvergunning;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.x
    text: |-
      algemene benaming: de door de wereldgezondheidsorganisatie aanbevolen internationale benaming of, bij ontstentenis
      daarvan, de gangbare benaming;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ij
    text: |-
      sterkte: het gehalte aan werkzame stoffen, uitgedrukt in een hoeveelheid per doserings-, volume- of
      gewichtseenheid;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.z
    text: |-
      biologische beschikbaarheid: de maat van de snelheid en de hoeveelheid van een werkzame stof van een geneesmiddel
      bij opname in de bloedsomloop;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.aa
    text: 'primaire verpakking: de verpakking die rechtstreeks met het geneesmiddel in aanraking komt;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.bb
    text: 'buitenverpakking: de verpakking waarin de primaire verpakking zich bevindt;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.cc
    text: |-
      lidstaat: een staat die lid is van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.dd
    text: 'derde land: een land, niet zijnde een lidstaat;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ee
    text: 'bereiden: het geheel of gedeeltelijk vervaardigen van geneesmiddelen dan wel het verpakken of etiketteren daarvan;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ff
    text: |-
      charge: een hoeveelheid eenheden van een geneesmiddel in dezelfde farmaceutische vorm of van een gedeeltelijk
      bereid geneesmiddel in dezelfde fysieke vorm, die uit één homogene uitgangsmassa is bereid en dezelfde reeks van
      bereidingshandelingen heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.gg
    text: 'etiketteren: het aanbrengen van vermeldingen op de buitenverpakking of op de primaire verpakking;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.hh
    text: 'invoeren: het vanuit een derde land binnen het grondgebied van Nederland brengen van geneesmiddelen;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ii
    text: 'afleveren: het anders dan door terhandstelling of uitvoer leveren van geneesmiddelen;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.jj
    text: |-
      uitvoeren: het vanuit het grondgebied van Nederland naar het grondgebied van een derde land brengen van
      geneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.kk
    text: |-
      het drijven van een groothandel: het geheel van activiteiten, bestaande uit het aanschaffen, in voorraad hebben en
      afleveren of uitvoeren van door derden bereide of ingevoerde geneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ll
    text: |-
      ter hand stellen: het rechtstreeks verstrekken of doen bezorgen van een geneesmiddel aan de
      patiënt voor wie het geneesmiddel is bestemd, dan wel aan beroepsbeoefenaren als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, mondhygiënisten of optometristen die geneesmiddelen onder zich hebben ten behoeve van toediening aan hun
      patiënten;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
  - number: 1.1.mm
    text: |-
      fabrikant: degene aan wie krachtens [artikel 18][ref1] vergunning is verleend voor het bereiden of invoeren van
      geneesmiddelen en het afleveren of uitvoeren van door hem bereide of ingevoerde geneesmiddelen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.1.nn
    text: |-
      groothandelaar: degene aan wie krachtens [artikel 18][ref1] een vergunning is verleend voor het drijven van een
      groothandel;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.1.oo
    text: |-
      apotheek: een lokaal of een samenhangend geheel van lokalen waarin geneesmiddelen worden bereid, ter hand gesteld
      en ten behoeve van terhandstelling worden opgeslagen, dan wel alleen ter hand worden gesteld en daartoe opgeslagen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.pp
    text: |-
      recept: een door een met naam en werkadres aangeduide beroepsbeoefenaar als bedoeld in
      [artikel 36, veertiende lid][ref1], van de onder ll genoemde wet, opgesteld document waarin aan een persoon of
      instantie als bedoeld in [artikel 61, eerste lid][ref2], een voorschrift wordt gegeven om een met zijn stofnaam
      of merknaam aangeduid geneesmiddel in de aangegeven hoeveelheid, sterkte en wijze van gebruik ter hand te
      stellen aan een te identificeren patiënt, en dat is ondertekend door de desbetreffende beroepsbeoefenaar dan wel,
      zonder te zijn ondertekend, met een zodanige code is beveiligd dat een daartoe bevoegde persoon of instantie de
      authenticiteit ervan kan vaststellen;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
