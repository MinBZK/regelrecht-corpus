  - number: '101.2'
    text: |-
      Een gedraging als bedoeld in het eerste lid die geen economisch delict is in de zin van de
      [Wet op de economische delicten][ref1], is een strafbaar feit indien in de daaraan voorafgaande 24 maanden tweemaal
      een bestuurlijke boete ter zake van een zelfde gedraging is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002063
  - number: '101.3'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die een
      strafbaar feit als bedoeld in het tweede lid pleegt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel101
  - number: '101.4'
    text: Een strafbaar feit als bedoeld in het tweede lid is een overtreding.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel101
  - number: '113'
    text: |-
      De [artikelen 5:10a][ref1], [5:45][ref2], [5:46, tweede lid][ref3], [5:48 tot en met 5:52][ref4] en
      [10:3, vierde lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing op de uitoefening
      van de bevoegdheden, bedoeld in [artikel 115][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0021505#Artikel115
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0021505
        artikel: '115'
        hoofdstuk: '11'
  - number: '114'
    text: |-
      De ambtenaren van het Staatstoezicht op de volksgezondheid zijn bevoegd tot oplegging van een last onder
      bestuursdwang ter handhaving van de bij [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1]
      gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '115'
    text: |-
      De ambtenaren van het Staatstoezicht op de volksgezondheid zijn, voorzover dit redelijkerwijs voor hun
      taakuitoefening noodzakelijk is, bevoegd om:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel115
  - number: 115.a
    text: |-
      te allen tijde geneesmiddelen of substanties die kennelijk bestemd zijn ter bereiding van geneesmiddelen, in beslag
      te nemen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel115
  - number: 115.b
    text: de handel, aflevering, bereiding, invoer of terhandstelling van een geneesmiddel te doen opschorten of beëindigen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel115
  - number: 115.c
    text: |-
      een apotheek te sluiten indien in deze apotheek, naar hun oordeel, niet de nodige waarborgen aanwezig zijn
      voor een veilige opslag, bereiding of terhandstelling van geneesmiddelen en zulks gevaar kan opleveren voor de
      volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel115
  - number: '116.1'
    text: |-
      De ambtenaren van het Staatstoezicht op de volksgezondheid, de personen, aangewezen bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] en de ambtenaren van de rijksbelastingdienst, bevoegd inzake
      douane zijn belast met de opsporing van de strafbare feiten, bedoeld in [artikel 101][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel101
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '101'
        hoofdstuk: '11'
  - number: '116.2'
    text: |-
      De in het eerste lid zijn bedoelde ambtenaren zijn te allen tijde bevoegd tot inbeslagneming alsmede ter
      inbeslagneming de uitlevering te vorderen van de substanties en voorwerpen die tot ontdekking van de waarheid
      kunnen dienen of waarvan de verbeurdverklaring, onttrekking aan het verkeer, vernietiging of onbruikbaarmaking kan
      worden bevolen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel116
  - number: '117.1'
    text: |-
      De vergunningen die vóór de inwerkingtreding van deze wet krachtens de [Wet op de Geneesmiddelenvoorziening][ref1]
      zijn verleend voor zowel het bereiden als het afleveren van geneesmiddelen, worden voor de toepassing van deze wet
      gelijkgesteld met vergunningen voor het bereiden en afleveren van zodanige middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '117.2'
    text: |-
      De vergunningen die vóór de inwerkingtreding van deze wet krachtens de [Wet op de Geneesmiddelenvoorziening][ref1]
      zijn verleend uitsluitend voor het afleveren van geneesmiddelen na invoer, worden voor de toepassing van deze wet
      gelijkgesteld met vergunningen voor het invoeren van zodanige middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '117.3'
    text: |-
      De vergunningen die vóór de inwerkingtreding van deze wet krachtens de [Wet op de Geneesmiddelenvoorziening][ref1]
      zijn verleend voor het uitsluitend afleveren van geneesmiddelen anders dan na invoer, worden voor de toepassing van
      deze wet gelijkgesteld met vergunningen voor het drijven van een groothandel.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '117.4'
    text: |-
      De inschrijvingen in een register als bedoeld in [artikel 3 van de Wet op de Geneesmiddelenvoorziening][ref1] die
      vóór de inwerkingtreding van deze wet zijn geschied dan wel de vergunningen die krachtens die wet zijn verleend
      voor het verpakken, etiketteren en afleveren van uit een andere lidstaat betrokken geneesmiddelen worden voor de
      toepassing van deze wet gelijkgesteld met handelsvergunningen onderscheidenlijk parallelhandelsvergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '117.4'
    text: |-
      De inschrijvingen in een register als bedoeld in [artikel 3 van de Wet op de Geneesmiddelenvoorziening][ref1]
      onderscheidenlijk de aanvragen om zodanige inschrijving die vóór de inwerkingtreding van deze wet
      zijn geschied onderscheidenlijk zijn ingediend en waarop nog niet onherroepelijk is beslist, worden
      voor de toepassing van deze wet gelijkgesteld met handelsvergunningen onderscheidenlijk aanvragen
      om een handelsvergunning. De in de eerste volzin bedoelde gelijkstelling geldt evenwel niet voor
      de toepassing van de in de [artikelen 42, vijfde lid, onder a][ref2], en [43, tweede lid][ref3],
      bedoelde perioden ten aanzien van referentiegeneesmiddelen waarvoor vóór de inwerkingtreding van deze
      wet een inschrijving of een aanvraag om inschrijving als bedoeld in de eerste volzin, is geschied
      onderscheidenlijk is ingediend en waarop nog niet onherroepelijk is beslist. Ten aanzien van de
      inschrijvingen in een register als bedoeld in de eerste volzin, die vóór 30 oktober 2005 zijn geschied,
      en de vóór die datum ingediende aanvragen om inschrijving, blijft de beschermingsperiode, bedoeld in
      [artikel 2, achtste lid, aanhef en onder a, van het Besluit registratie geneesmiddelen][ref4] zoals dat luidde vóór
      de inwerkingtreding van deze wet, van toepassing, onverminderd het recht met betrekking tot de bescherming van de
      industriële en commerciële eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003114
        artikel: '2'
  - number: '117.5'
    text: |-
      De vergunningen die krachtens de [Wet op de Geneesmiddelenvoorziening][ref1] zijn verleend voor het verpakken,
      etiketteren en afleveren van uit een andere lidstaat betrokken geneesmiddelen, onderscheidenlijk de aanvragen tot
      zodanige vergunningen die zijn ingediend vóór de inwerkingtreding van deze wet en waarop nog niet onherroepelijk
      is beslist, worden voor de toepassing van deze wet gelijkgesteld met parallelhandelsvergunningen onderscheidenlijk
      aanvragen om een parallelhandelsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '117.6'
    text: |-
      De geneesmiddelen, bedoeld in de bijlagen VII, IX, XI, XII en XIII bij de Toetredingsakte waarvoor
      onderscheidenlijk in Cyprus, Litouwen, Malta, Polen en Slovenië een handelsvergunning is verleend,
      komen niet in aanmerking voor behandeling door het College in het kader van de procedure, bedoeld in
      [artikel 44, derde lid][ref1], totdat die geneesmiddelen in overeenstemming zijn gebracht met de bepalingen van
      deze wet inzake kwaliteit, veiligheid en werkzaamheid van geneesmiddelen, doch uiterlijk tot onderscheidenlijk 31
      december 2005, 1 januari 2007, 31 december 2006, 31 december 2008 en 31 december 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel44
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '117.7'
    text: |-
      Aanvragen om een vergunning voor het bereiden en afleveren of het uitsluitend afleveren van geneesmiddelen
      die zijn ingediend vóór de inwerkingtreding van deze wet en waarop nog niet onherroepelijk is beslist,
      worden voor de toepassing van deze wet gelijkgesteld met aanvragen voor vergunningen als bedoeld in
      [artikel 18, eerste lid, tweede en derde volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '117.8'
    text: |-
      De vergunningen die vóór de inwerkingtreding van deze wet op grond van de
      [Wet op de Geneesmiddelenvoorziening][ref1] zijn verleend voor het bereiden of het invoeren van geneesmiddelen voor
      onderzoek, worden voor de toepassing van deze wet gelijkgesteld met de vergunningen voor het bereiden of invoeren
      van geneesmiddelen voor onderzoek. Aanvragen om vergunningen voor het bereiden of invoeren van geneesmiddelen voor
      onderzoek die zijn ingediend vóór de inwerkingtreding van deze wet en waarop nog niet onherroepelijk is beslist,
      worden voor de toepassing van deze wet gelijkgesteld met aanvragen daarvoor op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '117.9'
    text: |-
      Een erkenning van een laboratorium die voor het tijdstip van inwerkingtreding van deze wet krachtens
      [artikel 5, vierde lid, van het Besluit bereiding en aflevering van farmaceutische producten][ref1]
      is verleend, wordt voor de toepassing van deze wet gelijkgesteld met een aanwijzing als bedoeld in
      [artikel 26, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel26
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '118.1'
    text: |-
      Degene die een aanvraag voor een handelsvergunning voor een traditioneel kruidengeneesmiddel wil indienen voor
      een product dat ten tijde van de inwerkingtreding van deze wet in de handel was, dient binnen acht maanden na de
      inwerkingtreding van deze wet een aanvraag tot voorlopige toelating in, onder overlegging van de gegevens waaruit
      blijkt dat het desbetreffende product voldoet aan de voorwaarden van [artikel 42, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '118.2'
    text: |-
      Het College beslist zo spoedig mogelijk, doch uiterlijk binnen acht weken, of het desbetreffende product naar zijn
      oordeel voldoet aan de voorwaarden van [artikel 42, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '118.3'
    text: |-
      Ter zake van producten die naar het oordeel van het College voldoen aan [artikel 42, achtste lid][ref1],
      wordt de aanvraag voor een handelsvergunning voor een traditioneel kruidengeneesmiddel binnen één jaar en
      acht maanden na de inwerkingtreding van deze wet ingediend, onder overlegging van de desbetreffende krachtens
      [artikel 42, tweede lid][ref2], aangewezen gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '118.4'
    text: |-
      Op verzoek van de aanvrager kan het College tot vier jaren en acht maanden na de inwerkingtreding van deze wet
      uitstel verlenen voor het overleggen van de gegevens en bescheiden, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel118
  - number: '118.5'
    text: |-
      Tot acht maanden na de inwerkingtreding van deze wet of, indien voor de afloop van deze periode een aanvraag als
      bedoeld in het eerste lid is ingediend, tot twee maanden na het moment waarop onherroepelijk is beslist op die
      aanvraag, is [artikel 40, eerste en tweede lid][ref1], niet van toepassing op kruidengeneesmiddelen als bedoeld in
      [artikel 42, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '118.6'
    text: |-
      Tot twee jaren en acht maanden na de inwerkingtreding van deze wet of, indien vóór deze datum een aanvraag als
      bedoeld in het derde lid is ingediend, tot twee maanden na het moment waarop onherroepelijk is beslist op die
      aanvraag doch uiterlijk tot 27 januari 2011, is [artikel 40, eerste en tweede lid][ref1], niet van toepassing op
      overeenkomstig het eerste en tweede lid voorlopig toegelaten kruidengeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '119'
    text: |-
      De arts die onmiddellijk vóór de inwerkingtreding van deze wet krachtens
      [artikel 6 van de Wet op de Geneesmiddelenvoorziening][ref1] bevoegd is tot uitoefening van de artsenijbereidkunst
      in een uitsluitend aan hem toebehorende apotheek, is bevoegd geneesmiddelen ter hand te stellen aan de patiënten
      van zijn praktijk. Indien de in de eerste zin bedoelde bevoegdheid is verkregen door een vergunning, wordt deze
      vergunning gelijkgesteld met de vergunningen, bedoeld in [artikel 61, tiende onderscheidenlijk elfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '61'
        hoofdstuk: '6'
  - number: '120.1'
    text: |-
      Voor middelen, bedoeld in
      [bijlage II, behorende bij artikel 21, eerste lid, van het Besluit registratie geneesmiddelen][ref1], zoals deze
      luidde voor het tijdstip van inwerkintreding van deze wet, is [artikel 40, eerste en tweede lid][ref2], gedurende
      vijf jaren, te rekenen vanaf dat tijdstip, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003114
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003114
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '120.3'
    text: 'Een wijziging van:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel120
  - number: 120.3.a
    text: |-
      [richtlijn 85/374/EEG](31985L0374) van de Raad van 25 juli 1985 betreffende de onderlinge aanpassing van de
      wettelijke en bestuursrechtelijke bepalingen van de lidstaten inzake de aansprakelijkheid voor producten met
      gebreken (PbEG L 210),
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel120
  - number: 120.3.b
    text: |-
      [richtlijn 87/22/EEG](31987L0022) van de Raad van de Europese Gemeenschappan van 22 december 1986 tot onderlinge
      aanpassing van de nationale maatregelen inzake het in de handel brengen van met behulp van hoogwaardige technieken,
      met name biotechnieken, vervaardigde geneesmiddelen (PbEG L 15), of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel120
  - number: 120.3.c
    text: '[richtlijn 2001/83](32001L0083),'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel120
  - number: '121.1'
    text: |-
      De krachtens [artikel 6, vierde, vijfde, zesde of zevende lid, van de Wet op de Geneesmiddelenvoorziening][ref1]
      genomen beslissingen behouden na de intrekking van die wet hun rechtskracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel6
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '6'
  - number: '121.2'
    text: |-
      De op het tijdstip van die intrekking aanhangige zaken worden op de voet van het in
      [artikel 6 van de Wet op de Geneesmiddelen][ref1] bepaalde afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel6
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '6'
  - number: '122'
    text: |-
      Waar in deze wet wordt verwezen naar de [Wet medisch-wetenschappelijk onderzoek met mensen][ref1], wordt daaronder
      verstaan de [Wet medisch-wetenschappelijk onderzoek met mensen][ref2] zoals deze komt te luiden indien het
      bij koninklijke boodschap van 27 februari 2003 ingediende voorstel van Wet tot wijziging van de Wet medisch-
      wetenschappelijk onderzoek met mensen ter implementatie van [richtlijn nr. 2001/20/EG](32001L0020) inzake de
      toepassing van goede klinische praktijken bij de uitvoering van klinische proeven met geneesmiddelen voor menselijk
      gebruik (Wetenschappelijk onderzoek met geneesmiddelen), Kamerstukken II, nr. 28 804, tot wet zal zijn verheven en
      in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0009408
      [ref2]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0009408
      - id: ref2
        bwb_id: BWBR0009408
  - number: '131'
    text: |-
      Ter uitvoering van krachtens het Verdrag tot oprichting van de Europese Gemeenschap, de Overeenkomst betreffende
      de Europese Economische Ruimte of het Verdrag tot instelling van de Benelux Economische Unie tot stand gekomen
      verordeningen of richtlijnen betreffende de in deze wet geregelde onderwerpen kunnen bij algemene maatregel van
      bestuur regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel131
  - number: '132'
    text: |-
      De [Wet op de Geneesmiddelenvoorziening][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '133'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      en onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel133
  - number: '134'
    text: 'Deze wet wordt aangehaald als: Geneesmiddelenwet.'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel134
