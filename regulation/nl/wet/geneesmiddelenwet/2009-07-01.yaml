        artikel: '61'
        hoofdstuk: '6'
  - number: 1.1.qq
    text: |-
      onderzoeksdossier: het dossier, bedoeld in
      [artikel 1, onder p, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '1'
  - number: 1.1.rr
    text: |-
      proefpersoon: de persoon, bedoeld in
      [artikel 1, eerste lid, onder c, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '1'
  - number: 1.1.ss
    text: |-
      bijwerking: een reactie op een geneesmiddel die schadelijk en onbedoeld is en optreedt indien het geneesmiddel in
      gebruikelijke doses wordt toegediend aan of aangewend bij de mens;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.tt
    text: |-
      ernstige bijwerking: een bijwerking die tot de dood leidt, levensgevaar oplevert, opneming in een ziekenhuis of
      verlenging van het verblijf in een ziekenhuis vereist, blijvende invaliditeit of arbeidsongeschiktheid veroorzaakt
      dan wel zich uit in een geboorteafwijking of -misvorming;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.uu
    text: |-
      onverwachte bijwerking: een bijwerking waarvan de aard, de ernst of het gevolg niet verenigbaar is met de
      samenvatting van de kenmerken van het geneesmiddel, bedoeld in [artikel 46, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel46
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 1.1.vv
    text: |-
      misbruik van geneesmiddelen: een opzettelijk overmatig gebruik van geneesmiddelen dat gepaard gaat met schadelijke
      lichamelijke of psychische effecten;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ww
    text: |-
      geneesmiddelenbewaking: het systematisch verzamelen en beheren van gegevens over bijwerkingen en het gebruik en
      misbruik van geneesmiddelen waarvoor een handelsvergunning is verleend, alsmede het leggen van verbindingen tussen
      deze gegevens en de nationale geneesmiddelenconsumptie;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.xx
    text: |-
      reclame: elke vorm van beïnvloeding met het kennelijke doel het voorschrijven, ter hand stellen of gebruiken van
      een geneesmiddel te bevorderen, dan wel het geven van de opdracht daartoe;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ijij
    text: |-
      publieksreclame: reclame voor een geneesmiddel die, gezien haar inhoud en de wijze waarop zij wordt geuit,
      kennelijk ook voor anderen dan beroepsbeoefenaren als bedoeld in [artikel 82, onder a][ref1], is bestemd;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel82
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '82'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 1.1.zz
    text: |-
      gunstbetoon: het in het vooruitzicht stellen, aanbieden of toekennen van geld of op geld waardeerbare diensten
      of goederen met het kennelijke doel het voorschrijven, ter hand stellen of gebruiken van een geneesmiddel te
      bevorderen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.aaa
    text: |-
      bijeenkomst: een georganiseerde samenkomst van beroepsbeoefenaren als bedoeld in [artikel 82, onder a][ref1], die
      kennelijk uitsluitend tot doel heeft hun wetenschappelijke kennis en kunde op het gebied van de geneeskunst, de
      farmacie, de tandheelkunst of de verloskunst te bevorderen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel82
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '82'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 1.1.bbb
    text: |-
      manifestatie: een georganiseerde samenkomst van beroepsbeoefenaren als bedoeld in [artikel 82, onder a][ref1], die
      tot doel heeft het voorschrijven of ter hand stellen van geneesmiddelen te bevorderen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel82
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '82'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 1.1.ccc
    text: |-
      gastvrijheid: vergoeding van kosten van deelname aan een bijeenkomst of een manifestatie of in de daaraan verbonden
      reis- en verblijfkosten dan wel het niet in rekening brengen van zodanige kosten;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ddd
    text: |-
      telewinkelboodschap: rechtstreekse aanbieding aan het publiek in een televisieprogramma met het oog op de levering
      van een geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.eee
    text: |-
      [richtlijn 2001/83](32001L0083): [Richtlijn 2001/83/EG](32001L0083) van het Europees Parlement en de Raad van 6
      november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor menselijk gebruik (PbEG
      L 311);
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.fff
    text: |-
      verordening 726/2004: [Verordening (EG) nr. 726/2004](32004R0726) van het Europees Parlement en de Raad van 31
      maart 2004 tot vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op
      geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau
      (PbEG L 136);
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.fff.1
    text: |-
      verordening 1394/2007: Verordening (EG) 1394/2007 van het Europees Parlement en de Raad van 13 november 2007
      betreffende geneesmiddelen voor geavanceerde therapie en tot wijziging van Richtlijn 2001/83 en Verordening (EG)
      nr. 726/2004 (Pb EU L 324);
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ggg
    text: 'Commissie: de Commissie van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.hhh
    text: 'Bureau: het Europees Geneesmiddelenbureau, opgericht krachtens artikel 55 van verordening 726/2004;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.iii
    text: |-
      Geneesmiddelencomité: het comité voor geneesmiddelen voor menselijk gebruik, opgericht krachtens artikel 5 van
      verordening 726/2004;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.jjj
    text: |-
      Comité voor kruidengeneesmiddelen: het Comité, opgericht krachtens artikel 16 nonies van [richtlijn 2001/83]
      (32001L0083);
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.kkk
    text: |-
      College: het College ter beoordeling van geneesmiddelen, ingesteld krachtens [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel2
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.1.lll
    text: 'handelsvergunning: een vergunning voor het in het handelsverkeer brengen van een geneesmiddel;'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.mmm
    text: |-
      parallelhandelsvergunning: een vergunning, verleend krachtens [artikel 48, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel48
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 1.1.nnn
    text: |-
      risico, verbonden aan het gebruik van een geneesmiddel: een risico, verbonden aan de kwaliteit, veiligheid of
      werkzaamheid van een geneesmiddel voor de gezondheid van de patiënt of de volksgezondheid dan wel het risico van
      ongewenste effecten op het milieu;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ooo
    text: |-
      afweging van voordelen en risico’s: de afweging tussen de therapeutische werking van een geneesmiddel in relatie
      tot een risico als bedoeld in onderdeel nnn;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.ppp
    text: |-
      Toetredingsacte: de Akte betreffende de toetredingsvoorwaarden voor Tjechië, Cyprus, Estland, Letland, Litouwen,
      Hongarije, Malta, Polen, Slovenië en Slowakije van 16 april 2003 (PbEG L 236);
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.qqq
    text: |-
      drogist: degene die in het bezit is van een aan hem uitgereikt getuigschrift voor drogist dat is afgegeven door een
      door Onze Minister aangewezen organisatie;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.1.rrr
    text: |-
      assistent-drogist: degene die in het bezit is van een aan hem uitgereikt getuigschrift voor assistent-drogist dat
      is afgegeven door de in onderdeel qqq bedoelde organisatie.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt met gunstbetoon gelijk gesteld het doen van een
      aanbod om het voorschrijven, ter hand stellen of gebruiken van een geneesmiddel te bevorderen met het kennelijke
      doel daarvoor geld of op geld waardeerbare diensten of goederen te ontvangen, dan wel het aanvaarden van zodanige
      gelden, diensten of goederen na een aanbod te hebben gedaan het voorschrijven, ter hand stellen of gebruiken van
      een geneesmiddel te bevorderen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder ter hand stellen mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.3.a
    text: |-
      het rechtstreeks verstrekken of doen bezorgen van geneesmiddelen aan dierenartsen ten behoeve van de uitoefening
      van hun praktijk;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: 1.3.b
    text: |-
      het aan de kapitein van een schip dat is bestemd en wordt gebruikt voor de bedrijfsmatige zeevaart of zeevisserij,
      rechtstreeks verstrekken of doen bezorgen van geneesmiddelen als bedoeld in [artikel 57][ref1] door een apotheker,
      dan wel van andere geneesmiddelen dan die bedoeld in [artikel 57][ref2] door een apotheker of door een persoon
      of een rechtspersoon als bedoeld in [artikel 62, eerste lid, onder d][ref3], een en ander voor zover die
      geneesmiddelen bij ministeriële regeling zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel62
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '57'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '57'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '62'
        hoofdstuk: '6'
  - number: '1.4'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden met de werkzame stoffen van een generiek
      geneesmiddel gelijkgesteld de zouten, esters, ethers, isomeren, mengsels van isomeren, complexen of derivaten
      voor zover de eigenschappen daarvan niet aanmerkelijk afwijken wat betreft veiligheid of werkzaamheid van de
      desbetreffende werkzame stoffen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van deze wet wordt onder kruidengeneesmiddel tevens verstaan een geneesmiddel dat als werkzame
      bestanddelen behalve een of meer kruidensubstanties, een of meer kruidenpreparaten dan wel een combinatie van een
      of meer kruidensubstanties en kruidenpreparaten, tevens vitaminen of mineralen bevat waarvan de veiligheid op grond
      van voldoende bewijsstukken gegarandeerd is en de werkzaamheid van de vitaminen of mineralen de werkzaamheid van de
      werkzame kruidenbestanddelen aanvult met betrekking tot de gespecificeerde indicaties.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: '1.6'
    text: |-
      Indien een product, voor zover het zijn kenmerken betreft, zowel voldoet aan de definitie van geneesmiddel als aan
      de definitie van een product in een andere wettelijke regeling, is deze wet onverminderd van toepassing ten aanzien
      van dat product.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: '1.7'
    text: |-
      Deze wet is niet van toepassing op bloed, plasma of bloedcellen van menselijke oorsprong met uitzondering van
      plasma dat door middel van een industrieel procédé is bewerkt met het oog op de bereiding van geneesmiddelen. Deze
      wet is voorts niet van toepassing op radionucliden die in de vorm van verzegelde bronnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel1
  - number: '2.1'
    text: Er is een College ter beoordeling van geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel2
  - number: '2.2'
    text: Het College heeft zijn zetel in een door Onze Minister te bepalen gemeente.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel2
  - number: '3.1'
    text: Het College bestaat uit ten hoogste zeventien leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      De leden worden door benoemd voor een periode van ten hoogste vier jaren en zijn herbenoembaar. Zij worden door
      Onze Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel3
  - number: '3.3'
    text: |-
      Schorsing en ontslag vinden slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel
      wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts plaats op verzoek
      van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel3
  - number: '3.4'
    text: Een lid van het College kan niet tevens zijn een aan Onze Minister ondergeschikte ambtenaar.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel3
  - number: '4.1'
    text: Het College stelt een bestuursreglement vast. Het reglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde goedkeuring kan worden onthouden wegens strijd met het recht of op de grond dat het
      reglement naar het oordeel van Onze Minister een goede taakuitoefening door het College kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel4
  - number: '4.3'
    text: Het College maakt zijn bestuursreglement openbaar.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het College maakt, met weglating van commercieel vertrouwelijke gegevens, de agenda’s en de notulen van zijn
      vergaderingen openbaar, alsmede zijn besluiten, met inbegrip van minderheidsstandpunten en bijzonderheden over de
      stemmingen en motiveringen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel5
  - number: '5.2'
    text: |-
      De vergaderingen van het College zijn openbaar voor zover het daarbij niet gaat om het nemen van beslissingen
      waarbij commercieel vertrouwelijke gegevens en bescheiden aan de orde zijn.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Een lid van het College oefent naast zijn functie bij het College geen functies uit die ongewenst zijn met het
      oog op een goede vervulling van zijn functie als lid van het College dan wel met het oog op de handhaving van zijn
      onafhankelijkheid of het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel6
  - number: '6.2'
    text: |-
      Een lid van het College meldt het voornemen tot het aanvaarden van een functie naast zijn functie bij het College
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel6
  - number: '6.3'
    text: |-
      Functies van een lid van het College naast zijn lidmaatschap van het College worden openbaar gemaakt.
      Openbaarmaking geschiedt door het ter inzage leggen van een opgave van die functies ten kantore van het College en
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel6
  - number: '7.1'
    text: |-
      Aan het lidmaatschap van het College, niet zijnde het voorzitterschap, is een schadeloosstelling verbonden. Aan het
      voorzitterschap is een bezoldiging verbonden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel7
  - number: '7.2'
    text: Onze Minister stelt de bezoldiging en de schadeloosstelling vast.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel7
  - number: '8.1'
    text: |-
      Het College wordt ondersteund door een secretariaat, waarvan de ambtenaren door Onze Minister worden benoemd,
      geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel8
  - number: '8.2'
    text: |-
      Het secretariaat staat onder gezag van het College voor zover het werkzaamheden betreft ten behoeve van de taken
      van het College. Het secretariaat legt over die werkzaamheden uitsluitend aan het College verantwoording af.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel8
  - number: '8.3'
    text: |-
      De ambtenaren van het secretariaat hebben geen financiële of andere belangen in de farmaceutische industrie die
      hun onpartijdigheid in het gedrang kunnen brengen. Zij verstrekken jaarlijks een verklaring omtrent hun financiële
      belangen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel8
  - number: '9.1'
    text: 'Het College is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: 9.1.a
    text: |-
      het nemen van besluiten met betrekking tot handelsvergunningen en parallelhandelsvergunningen overeenkomstig
      [Hoofdstuk 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021505
        hoofdstuk: '4'
  - number: 9.1.b
    text: |-
      het nemen van besluiten met betrekking tot de indeling van geneesmiddelen overeenkomstig [Hoofdstuk 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021505
        hoofdstuk: '5'
  - number: 9.1.c
    text: |-
      de geneesmiddelenbewaking overeenkomstig [Hoofdstuk 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021505
        hoofdstuk: '8'
  - number: 9.1.d
    text: |-
      het uitvoering geven aan verordeningen van de Raad van de Europese Unie, van de Raad en het Europees Parlement
      gezamenlijk of van de Commissie van de Europese Gemeenschappen die betrekking hebben op taken die bij of krachtens
      deze wet aan het College zijn toebedeeld, alsmede aan beschikkingen van de Raad of de Commissie die zijn gericht
      tot het College;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: 9.1.e
    text: |-
      de werkzaamheden, bedoeld in
      [artikel 13m, tweede lid, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel13m
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: 13m
  - number: 9.1.f
    text: in voorkomende gevallen deel uitmaken van de Nederlandse delegatie bij comité’s en organen van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: 9.1.g
    text: |-
      het op verzoek van de ter zake bevoegde autoriteit van een andere lidstaat beoordelen van een aanvraag om een
      vergunning voor het in de handel brengen van een geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: 9.1.h
    text: |-
      het desgevraagd verstrekken van wetenschappelijk advies over farmaceutische, preklinische en klinische proeven met
      geneesmiddelen aan de fabrikant of onderzoeker die aan het College het voornemen heeft geuit een handelsvergunning
      aan te vragen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: 9.1.i
    text: |-
      het op verzoek van een aangemelde instantie als bedoeld in [artikel 10 van de Wet op de medische hulpmiddelen][ref1]
      geven van advies over de kwaliteit, de veiligheid en het nut van een geneesmiddel dat in een medisch hulpmiddel als
      bedoeld in [artikel 1 van de Wet op de medische hulpmiddelen][ref2] als integrerend bestanddeel is verwerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '1'
  - number: 9.1.j
    text: |-
      het gevolg geven aan een verzoek van het Bureau om gegevens, bescheiden of andere vormen van informatie, gedaan
      krachtens verordening 726/2004, onderscheidenlijk aan een verzoek van de bevoegde instantie van een andere lidstaat
      om zodanige informatie, gedaan krachtens wetgeving van die lidstaat waarin het bij of krachtens [richtlijn 2001/83]
      (32001L0083) bepaalde is omgezet.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      Voor zover het College bij de werkzaamheden, verbonden aan de beoordeling van farmaceutisch-chemische,
      toxicologische of farmacologische aspecten van de aanvraag om een handelsvergunning, niet wordt ondersteund door
      het secretariaat, wordt de desbetreffende ondersteuning geboden door het Rijksinstituut voor volksgezondheid en
      milieu.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Bij ministeriële regeling worden tarieven vastgesteld ter dekking van de kosten van de vervulling van de in
      [artikel 9, eerste lid, onder a, b, c, d, g, h, i en j][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel9
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '9'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Het College stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen en
      de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar. Het verslag
      wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel11
  - number: '11.2'
    text: Het College zendt jaarlijks voor 1 april aan Onze Minister de ontwerpbegroting voor het daarop volgende jaar.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel11
  - number: '12'
    text: |-
      Het College verstrekt desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden voor zover dat voor de vervulling van zijn
      taak redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel12
  - number: '13'
    text: |-
      Het College verstrekt desgevraagd aan het College voor zorgverzekeringen, bedoeld in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1], de inlichtingen die laatstgenoemd college
      redelijkerwijs nodig heeft voor het vormen van een oordeel in de gevallen waarin het door Onze Minister wordt
      gehoord over een aanvraag om een geneesmiddel aan te wijzen als behorende tot de farmaceutische zorg waarop
      aanspraak bestaat krachtens de wettelijke sociale ziektekostenverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '14.1'
    text: |-
      Indien naar het oordeel van Onze Minister het College zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het College in de
      gelegenheid is gesteld om binnen een door Onze Minister te bepalen termijn alsnog zijn taak uit te voeren.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel14
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaren na de inwerkingtreding van deze wet en vervolgens telkens na vier jaren aan
      de Staten-Generaal een verslag over de doelmatigheid en doeltreffendheid van het functioneren van het College.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel15
  - number: '16'
    text: |-
      Het College draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de nodige
      technische en organisatorische voorzieningen ter beveiliging van zijn gegevens tegen verlies of aantasting en tegen
      onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel16
  - number: '17'
    text: |-
      [Afdeling 4.1.2.][ref1] en de [hoofdstukken 6][ref2], [7][ref3] en [8 van de Algemene wet bestuursrecht][ref4]
      zijn niet van toepassing op besluiten van het College waarmee gevolg wordt gegeven aan een beschikking van de
      Commissie als bedoeld in artikel 34, derde lid, van [richtlijn 2001/83](32001L0083).


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '18.1'
    text: |-
      Het is verboden om zonder vergunning van Onze Minister geneesmiddelen voor onderzoek te bereiden of in te voeren.
      Het is voorts verboden om zonder vergunning van Onze Minister andere geneesmiddelen dan die bedoeld in de eerste
      volzin, te bereiden, in te voeren, af te leveren of uit te voeren dan wel een groothandel te drijven. Het is tevens
      verboden om een groothandel te drijven in geneesmiddelen waarvoor geen handelsvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: '18.2'
    text: |-
      Aan een vergunning kunnen, teneinde naleving van de bij of krachtens deze wet gestelde verplichtingen van de houder
      van de vergunning te verzekeren, voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: '18.3'
    text: |-
      Een vergunning voor het bereiden of invoeren van geneesmiddelen omvat tevens een vergunning voor het afleveren
      en uitvoeren van zelf bereide of ingevoerde geneesmiddelen. Onze Minister zendt een afschrift van een vergunning
      voor het bereiden of invoeren aan het Europees Bureau. Onze Minister zendt voorts, desgevraagd, aan de Commissie
      of aan een andere lidstaat de relevante gegevens omtrent een door hem verleende vergunning voor het drijven van
      een groothandel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: '18.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het verlenen, wijzigen en
      intrekken van vergunningen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: '18.5'
    text: |-
      Het eerste lid, tweede volzin, is niet van toepassing op het op kleine schaal bereiden van geneesmiddelen ten
      behoeve van terhandstelling in een apotheek door of in opdracht van een apotheker of van een apotheekhoudende arts
      als bedoeld in [artikel 61, tiende lid][ref1], dan wel van de in [artikel 61, elfde lid][ref2], bedoelde arts, die
      gezamenlijk met een apotheekhoudend arts de praktijk uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '61'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '61'
        hoofdstuk: '6'
  - number: '18.6'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: 18.6.a
    text: |-
      het invoeren, uitvoeren of anderszins binnen of buiten het grondgebied van Nederland brengen van geneesmiddelen die
      kennelijk zijn bestemd voor eigen gebruik door de persoon die de desbetreffende geneesmiddelen vervoert;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: 18.6.b
    text: |-
      het invoeren van geneesmiddelen door een fabrikant, groothandelaar of apotheker indien daarvoor op zijn aanvraag
      door het Staatstoezicht op de volksgezondheid ontheffing is verleend teneinde te kunnen voldoen aan een verzoek van
      een arts voor een bijzonder in de ontheffing aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: '18.7'
    text: |-
      Het eerste lid, eerste volzin, is niet van toepassing op bereidingshandelingen met betrekking tot een
      geneesmiddel voor onderzoek die voorafgaan aan het gebruik door een patiënt in een instelling in de zin van
      de [Wet toelating zorginstellingen][ref1] indien deze worden verricht door een apotheker en de desbetreffende
      geneesmiddelen voor onderzoek bestemd zijn voor gebruik in die instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: '18.8'
    text: |-
      Het in het eerste lid, tweede volzin, bedoelde verbod een groothandel te drijven is niet van toepassing op een
      onderneming die over een in een andere lidstaat afgegeven groothandelsvergunning beschikt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel18
  - number: '19.1'
    text: |-
      Voor de behandeling van een aanvraag om een vergunning als bedoeld in
      [artikel 18, eerste lid, eerste of tweede volzin][ref1], of een wijziging daarvan is de aanvrager een vergoeding
      verschuldigd aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '19.2'
    text: |-
      De houder van een vergunning als bedoeld in het eerste lid, is jaarlijks een vergoeding verschuldigd aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel19
  - number: '19.3'
    text: |-
      De hoogte van de vergoedingen, bedoeld in het eerste en tweede lid, wordt bij ministeriële regeling vastgesteld
      en kan per categorie van vergunningen, wijzigingen van vergunningen daaronder begrepen, of van geneesmiddelen
      verschillend worden vastgesteld. Indien een vergunning geldt voor een periode die korter is dan 1 jaar, wordt de
      vergoeding, bedoeld in het tweede lid, naar evenredigheid op een lager bedrag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel19
  - number: '20'
    text: |-
      Behoudens ingeval toepassing is gegeven aan [artikel 4:5 van de Algemene wet bestuursrecht][ref1], stelt
      Onze Minister de aanvrager binnen 90 dagen na de ontvangst van de aanvraag om een vergunning als bedoeld in
      [artikel 18, eerste lid, eerste of tweede volzin][ref2], in kennis van zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.1'
    text: |-
      Een vergunning voor het bereiden of invoeren van geneesmiddelen wordt verleend indien de aanvrager de
      desbetreffende gegevens en bescheiden, bedoeld in [artikel 25][ref1], heeft overgelegd en heeft aangetoond dat zal
      worden voldaan aan de [artikelen 27][ref2], [28][ref3] en [29][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0021505#Artikel29
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0021505
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Een vergunning voor het drijven van een groothandel wordt verleend indien de aanvrager de gegevens en
      bescheiden, bedoeld in [artikel 25][ref1], heeft overgelegd en heeft aangetoond dat zal worden voldaan aan de
      [artikelen 36][ref2] en [37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel37
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22'
    text: 'Een vergunning vervalt indien:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel22
  - number: 22.a
    text: |-
      de rechtspersoon aan wie de vergunning is verleend, wordt ontbonden, fuseert en niet de verkrijgende rechtspersoon
      is, of wordt gesplitst;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel22
  - number: 22.b
    text: |-
      degene aan wie de vergunning is verleend, Onze Minister schriftelijk heeft bericht dat hij is opgehouden de
      werkzaamheden te verrichten waarvoor de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel22
  - number: '23.1'
    text: 'Een vergunning kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel23
  - number: 23.1.a
    text: |-
      de houder van de vergunning een bij of krachtens dit hoofdstuk gestelde verplichting of een aan de vergunning
      verbonden voorschrift of beperking niet naleeft;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel23
  - number: 23.1.b
    text: |-
      degene aan wie de vergunning is verleend, naar het oordeel van Onze Minister is opgehouden de werkzaamheden te
      verrichten waarvoor de vergunning was verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel23
  - number: '23.2'
    text: |-
      Een vergunning wordt niet ingetrokken indien aan de overtreder ter zake van dezelfde gedraging reeds een
      bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel23
  - number: '24.1'
    text: |-
      Indien een vergunning wordt ingetrokken naar aanleiding van een melding door het bevoegde gezag van een andere
      lidstaat dat de houder van een vergunning als bedoeld in [artikel 18, eerste lid, eerste of tweede volzin][ref1],
      een bij of krachtens dit hoofdstuk gestelde verplichting of een aan de vergunning verbonden voorschrift of
      beperking niet naleeft, deelt Onze Minister zodanig besluit mee aan het bevoegde gezag van de andere lidstaat, aan
      de Europese Commissie en aan het Europees Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '24.2'
    text: |-
      Indien Onze Minister na zodanige melding besluit geen maatregelen te treffen ten aanzien van de houder van de
      vergunning, worden aan het bevoegde gezag van de andere lidstaat, de Europese Commissie en het Europees Bureau de
      redenen van dat besluit meegedeeld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel24
  - number: '25'
    text: |-
      Bij de indiening van een aanvraag om een vergunning voor het bereiden of invoeren van geneesmiddelen dan wel voor
      het drijven van een groothandel worden de volgende bescheiden verstrekt:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel25
  - number: 25.a
    text: het desbetreffende daartoe door Onze Minister beschikbaar te stellen formulier, dat door de aanvrager is ingevuld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel25
  - number: 25.b
    text: de documenten die op het formulier zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel25
  - number: 25.c
    text: |-
      een machtiging aan Onze Minister om een vergoeding als bedoeld in [artikel 19, tweede lid][ref1], te innen in de
      gevallen waarin zodanige vergoeding verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel19
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '26.1'
    text: |-
      De fabrikant brengt zonder vergunning van Onze Minister geen wijzigingen aan in feiten of omstandigheden die zijn
      beschreven in de door hem verstrekte bescheiden, bedoeld in [artikel 25, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '26.2'
    text: |-
      Onze Minister stelt de fabrikant zo spoedig mogelijk, doch uiterlijk binnen 30 dagen na ontvangst van de aanvraag
      om een vergunning als bedoeld in het eerste lid, in kennis van zijn besluit. Indien de wijziging betrekking heeft
      op bedrijfsruimten, technische uitrusting of controlemogelijkheden, kan die periode worden verlengd tot 90 dagen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel26
  - number: '26.3'
    text: |-
      Onze Minister kan op verzoek van de fabrikant een niet in de in [artikel 25][ref1] bedoelde bescheiden aangeduid
      laboratorium aanwijzen waarin controles als bedoeld in [artikel 28, eerste lid, onder b, c of e][ref2], mogen
      worden uitgevoerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel28
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 26.3.a
    text: het laboratorium beschikt over de daarvoor geschikte lokalen en uitrusting;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel26
  - number: 26.3.b
    text: |-
      de controles worden uitgevoerd door of in opdracht van een persoon die voldoet aan de in [artikel 29][ref1]
      bedoelde vakbekwaamheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel29
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '27.1'
    text: |-
      De fabrikant draagt ervoor zorg dat het bereiden van geneesmiddelen geschiedt overeenkomstig bij ministeriële
      regeling vast te stellen voorschriften inzake goede praktijken bij de vervaardiging. Hij gebruikt uitsluitend
      werkzame stoffen als grondstoffen voor geneesmiddelen of bij de regeling aangewezen hulpstoffen die overeenkomstig
      voorschriften als bedoeld in de eerste volzin zijn bereid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel27
  - number: '27.2'
    text: |-
      Degene die werkzame stoffen als grondstoffen voor geneesmiddelen invoert, draagt ervoor zorg dat de werkzame
      stoffen in het derde land zijn vervaardigd overeenkomstig voorschriften die gelijkwaardig zijn aan de op de
      vervaardiging van grondstoffen betrekking hebbende voorschriften van de ministeriële regeling, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel27
  - number: '28.1'
    text: 'De fabrikant belast een of meer personen met de taak:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: 28.1.a
    text: |-
      ervoor zorg te dragen dat de bereiding van geneesmiddelen geschiedt overeenkomstig de desbetreffende krachtens
      [artikel 27][ref1] gestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel27
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28.1.b
    text: |-
      ervoor zorg te dragen dat de bereiding van elke charge van geneesmiddelen, niet zijnde geneesmiddelen voor
      onderzoek, alsmede de kwaliteitscontrole daarop in overeenstemming zijn met de eisen die daaromtrent in het dossier
      op grond waarvan de handelsvergunning wordt verleend, zijn beschreven;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: 28.1.c
    text: |-
      in geval van invoer van geneesmiddelen, niet zijnde geneesmiddelen voor onderzoek: ervoor zorg te dragen dat elke
      ingevoerde charge zodanige kwalitatieve en kwantitatieve analyses, proeven en controles ondergaat, de kwantitatieve
      analyses van alle werkzame stoffen daaronder begrepen, dat gewaarborgd wordt dat de kwaliteit van de geneesmiddelen
      in overeenstemming is met de beschrijving daarvan in het dossier op grond waarvan de handelsvergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: 28.1.d
    text: |-
      indien een charge van geneesmiddelen, niet zijnde geneesmiddelen voor onderzoek, gereed is voor het in
      de handel brengen, aan de hand van het verslag, bedoeld in het tweede lid, en de bescheiden, bedoeld in
      [artikel 30, eerste lid, onder a en b][ref1], dan wel, in geval van invoer, aan de hand van de bescheiden, bedoeld
      in [artikel 30, tweede lid, onder a][ref2], een document te ondertekenen waarin is vastgelegd dat de charge voldoet
      aan de onder b onderscheidenlijk de onder c bedoelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel30
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 28.1.e
    text: |-
      ervoor zorg te dragen dat de bereiding van elke charge van geneesmiddelen voor onderzoek alsmede de
      kwaliteitscontrole daarop in overeenstemming is met de eisen die daaromtrent zijn beschreven in de
      productspecificatie en in het onderzoeksdossier;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: 28.1.f
    text: |-
      indien een charge van geneesmiddelen voor onderzoek is bereid dan wel ingevoerd, aan de hand van het verslag,
      bedoeld in het tweede lid, een document te ondertekenen waarin is vastgelegd dat de charge voldoet aan de onder e
      bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: '28.2'
    text: |-
      De fabrikant draagt ervoor zorg dat de personen, bedoeld in het eerste lid, de taken waarmee zij zijn belast naar
      behoren uitoefenen en verslag maken van hun bevindingen bij de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: '28.3'
    text: |-
      Indien de fabrikant een natuurlijke persoon is die voldoet aan de krachtens [artikel 29][ref1] vastgestelde
      eisen van vakbekwaamheid met betrekking tot de in het eerste en tweede lid bedoelde taken en zelf zodanige taken
      verricht, is de verplichting om anderen daarmee te belasten niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel29
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '28.4'
    text: |-
      De verplichting tot het verrichten van de in het eerste lid, onder c, bedoelde analyses, proeven en controles geldt
      niet indien in het derde land waarin de bereiding van het geneesmiddel heeft plaatsgevonden, zodanige proeven,
      analyses en controles zijn uitgevoerd en er tussen de Europese Gemeenschap en het derde land een overeenkomst is
      gesloten, inhoudende dat elk der partijen de voor de andere partij geldende voorschriften inzake goede praktijken
      bij de vervaardiging als gelijkwaardig erkent. Onze Minister draagt ervoor zorg dat zodanige overeenkomsten in de
      Staatscourant bekend worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: '28.5'
    text: |-
      Het eerste lid, onder d onderscheidenlijk onder f, is niet van toepassing op de gedeeltelijke bereiding van een
      geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: '28.6'
    text: |-
      Charges van bij ministeriële regeling aangewezen geneesmiddelen die in Nederland zijn bereid dan wel zijn
      ingevoerd, worden eerst afgeleverd nadat een bij ministeriële regeling aangewezen persoon of instantie heeft
      vastgesteld dat aan de in het eerste lid, onder b en c, onderscheidenlijk onder e, bedoelde eisen is voldaan.
      Bij de regeling worden regels gesteld ter zake van de gegevens die moeten worden overgelegd om een onderzoek als
      bedoeld in de eerste volzin, te kunnen uitvoeren en ter zake van de vergoeding die voor de uitvoering van zodanig
      onderzoek verschuldigd is. De hoogte van de vergoeding kan voor verschillende categorieën van geneesmiddelen
      verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel28
  - number: '29'
    text: |-
      Degenen die de taken, bedoeld in [artikel 28, eerste lid][ref1], verrichten, voldoen aan bij ministeriële regeling
      te stellen eisen met betrekking tot hun vakbekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel28
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.1'
    text: |-
      De fabrikant draagt ervoor zorg dat met betrekking tot elke charge van geneesmiddelen, niet zijnde geneesmiddelen
      voor onderzoek, die hij bereidt:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
  - number: 30.1.a
    text: |-
      een genummerd protocol wordt bijgehouden waaruit blijkt dat de bereiding is geschied overeenkomstig de in het
      dossier op grond waarvan de handelsvergunning is verleend, beschreven wijze;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
  - number: 30.1.b
    text: |-
      genummerde protocollen worden bijgehouden waaruit blijkt dat alle analyses, proeven en controles op de voor de
      bereiding gebruikte bestanddelen en op het geneesmiddel zelf zijn verricht overeenkomstig de in het dossier op
      grond waarvan de handelsvergunning is verleend, beschreven analyse- en controlemethoden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
  - number: 30.1.c
    text: |-
      een zodanige hoeveelheid monsters wordt aangehouden dat daarmee de kwaliteit van het geneesmiddel en zijn
      bestanddelen voldoende kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
  - number: '30.2'
    text: |-
      De fabrikant draagt ervoor zorg dat hij met betrekking tot elke charge van geneesmiddelen, niet zijnde
      geneesmiddelen voor onderzoek, die hij invoert:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
  - number: 30.2.a
    text: |-
      in het bezit is van een exemplaar van de protocollen waaruit blijkt dat de bereiding en de controle daarop in het
      derde land is geschied overeenkomstig de eisen die daaromtrent zijn beschreven in het dossier op grond waarvan
      de handelsvergunning is verleend en die zijn opgesteld en bijgehouden door degene die in het derde land het
      geneesmiddel heeft bereid;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
  - number: 30.2.b
    text: |-
      over voldoende monsters beschikt om analyses, proeven en controles als bedoeld in
      [artikel 28, eerste lid, onder c][ref1], te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel28
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.3'
    text: |-
      De fabrikant die geneesmiddelen, niet zijnde geneesmiddelen voor onderzoek die in een andere lidstaat zijn bereid
      of daarin vanuit een derde land zijn ingevoerd, verpakt en etiketteert, is in het bezit van een exemplaar van
      het document, bedoeld in [artikel 28, eerste lid, onder d][ref1], en van het verslag van de op de ingevoerde
      geneesmiddelen uitgevoerde analyses, proeven en controles die zijn opgesteld en ondertekend door degene die in de
      andere lidstaat is belast met de desbetreffende in [artikel 28, eerste lid][ref2], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel28
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.4'
    text: |-
      De fabrikant draagt ervoor zorg dat hij met betrekking tot elke charge van geneesmiddelen voor onderzoek die
      hij invoert, in het bezit is van een exemplaar van de protocollen waaruit blijkt dat de bereiding daarvan en
      de controle daarop in het derde land is geschied overeenkomstig voorschriften die gelijkwaardig zijn aan de
      desbetreffende krachtens [artikel 27][ref1] vastgestelde voorschriften, en overigens overeenkomstig de eisen die
      zijn beschreven in de productspecificatie en het onderzoeksdossier.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel27
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '30.5'
    text: |-
      Indien een geneesmiddel voor onderzoek dat dient ter vergelijking en waarvoor reeds een handelsvergunning is
      verleend, wordt ingevoerd en de fabrikant ter zake van dat geneesmiddel niet over documenten beschikt waaruit
      blijkt dat elke charge is bereid overeenkomstig voorschriften die gelijkwaardig zijn aan de desbetreffende
      krachtens [artikel 27][ref1] vastgestelde voorschriften, draagt de fabrikant ervoor zorg dat de controles, proeven
      en analyses worden uitgevoerd die nodig zijn om te waarborgen dat de kwaliteit van de desbetreffende geneesmiddelen
      voor onderzoek in overeenstemming is met de eisen, bedoeld in [artikel 28, eerste lid, onder e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel28
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31.1'
    text: |-
      De fabrikant bewaart het document, bedoeld in [artikel 28, eerste lid, onder d of f][ref1], de protocollen, bedoeld
      in [artikel 30, eerste lid, onder a en b, tweede lid, onder a, en vierde lid][ref2], alsmede het verslag en het
      document, bedoeld in [artikel 30, derde lid][ref3], tot een jaar nadat de termijn waarop de geschiktheid voor
      gebruik van de tot de desbetreffende charge behorende geneesmiddelen is verstreken, doch ten minste vijf jaren, te
      rekenen vanaf de datum waarop de desbetreffende bescheiden zijn opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel30
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '31.2'
    text: |-
      De fabrikant bewaart de monsters, bedoeld in [artikel 30, eerste lid, onder c, en tweede lid, onder b][ref1], op
      deugdelijke wijze en in een zodanige verpakking dat deze niet zonder kenbare beschadiging kan worden geopend. De
      fabrikant bewaart voorts de op de desbetreffende monsters betrekking hebbende protocollen. De termijn gedurende
      welke deze monsters en protocollen moeten worden bewaard, eindigt op de datum waarop de geschiktheid voor het
      gebruik van het monster als geneesmiddel eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel30
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '32'
    text: |-
      De fabrikant draagt ervoor zorg dat de primaire verpakking dan wel de buitenverpakking van een zodanige sluiting is
      voorzien dat opening van de verpakking leidt tot zichtbare beschadiging daarvan.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel32
  - number: '33'
    text: |-
      Indien de fabrikant geneesmiddelen aflevert aan degenen die ter hand stellen, draagt hij ervoor zorg dat deze door
      middel van het nummer van de charge waartoe zij behoren, kan worden getraceerd tot en met degenen aan wie hij heeft
      afgeleverd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel33
  - number: '34.1'
    text: |-
      Geneesmiddelen worden door de fabrikant slechts afgeleverd aan andere fabrikanten, groothandelaren en degenen die
      bevoegd zijn de desbetreffende geneesmiddelen, niet zijnde geneesmiddelen voor onderzoek, ter hand te stellen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel34
  - number: '34.2'
    text: |-
      Geneesmiddelen voor onderzoek worden door de fabrikant slechts afgeleverd aan degene die het onderzoek uitvoert,
      bedoeld in [artikel 1, eerste lid, onder g, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '1'
  - number: '35.1'
    text: |-
      De groothandelaar brengt zonder vergunning van Onze Minister geen wijzigingen aan in de feiten of omstandigheden
      die zijn beschreven in de door hem verstrekte bescheiden, bedoeld in [artikel 25, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel25
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '35.2'
    text: |-
      In afwijking van [artikel 20][ref1], stelt Onze Minister de groothandelaar zo spoedig mogelijk, doch uiterlijk
      binnen 30 dagen na ontvangst van de aanvraag om een vergunning voor een wijziging die geen betrekking heeft op
      opslag- of distributieruimten, in kennis van zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel20
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '36.1'
    text: |-
      De groothandelaar draagt ervoor zorg dat de opslag en de distributie van geneesmiddelen geschieden overeenkomstig
      de bij ministeriële regeling vast te stellen voorschriften inzake goede distributiepraktijken. Ter uitvoering van
      deze taak beschikt hij over een persoon die voor deze taak gekwalificeerd is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel36
  - number: '36.2'
    text: |-
      De groothandelaar draagt er voorts voor zorg dat hij over een zodanig assortiment en een zodanige voorraad van
      geneesmiddelen beschikt dat hij snel kan voldoen aan de vraag naar geneesmiddelen van degenen die bevoegd zijn
      geneesmiddelen ter hand te stellen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel36
  - number: '36.3'
    text: |-
      Het eerste lid, tweede volzin, is niet van toepassing indien de groothandelaar een natuurlijke persoon is die zelf
      gekwalificeerd is om de taak, bedoeld in het eerste lid, uit te voeren en dat ook doet.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel36
  - number: '37'
    text: |-
      De groothandelaar beschikt over een plan waardoor de tenuitvoerlegging wordt gewaarborgd van een actie tot het
      uit de handel nemen van een geneesmiddel op last van het Staatstoezicht op de volksgezondheid of op verzoek van de
      fabrikant of de houder van de handelsvergunning.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel37
  - number: '38.1'
    text: |-
      De groothandelaar houdt een administratie bij waarin ter zake van elke inkoop of verkoop van geneesmiddelen de
      volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel38
  - number: 38.1.a
    text: de datum van de desbetreffende inkoop of verkoop;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel38
  - number: 38.1.b
    text: de naam, de sterkte en de verpakkingsgrootte van het geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel38
  - number: 38.1.c
    text: |-
      de door hem ontvangen en de door hem geleverde hoeveelheid van het geneesmiddel en het daarbij behorende
      chargenummer;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel38
  - number: 38.1.d
    text: |-
      de naam en het adres van degene aan wie hij het geneesmiddel heeft geleverd en van degene van wie hij het heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel38
  - number: '38.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden ten minste vijf jaren bewaard, te rekenen vanaf de datum waarop zij
      zijn aangetekend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel38
  - number: '39.1'
    text: |-
      Geneesmiddelen worden door de groothandelaar slechts ingekocht bij andere groothandelaren, fabrikanten of degenen
      die in een andere lidstaat een vergunning tot het bereiden of invoeren van geneesmiddelen dan wel tot het drijven
      van een groothandel hebben verkregen van de daartoe bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel39
  - number: '39.2'
    text: |-
      Geneesmiddelen worden door de groothandelaar slechts afgeleverd aan andere groothandelaren en aan degenen die
      bevoegd zijn de desbetreffende geneesmiddelen ter hand te stellen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel39
  - number: '40.1'
    text: |-
      Het is verboden een geneesmiddel in het handelsverkeer te brengen zonder handelsvergunning van de Europese
      Gemeenschap, verleend krachtens verordening 726/2004 dan wel krachtens die verordening juncto verordening
      1394/2007, of van het College, verleend krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '40.2'
    text: |-
      Het is verboden een geneesmiddel waarvoor geen handelsvergunning geldt, in voorraad te hebben, te verkopen, af te
      leveren, ter hand te stellen of in te voeren.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '40.3'
    text: 'Een verbod als bedoeld in het tweede lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: 40.3.a
    text: |-
      op geneesmiddelen die door of in opdracht van een apotheker in diens apotheek op kleine schaal zijn bereid en ter
      hand worden gesteld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: 40.3.b
    text: op geneesmiddelen voor onderzoek;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: 40.3.c
    text: |-
      op geneesmiddelen die overeenkomstig bij ministeriële regeling vast te stellen regels in de handel worden gebracht
      naar aanleiding van een bestelling op initiatief van een arts, die bestemd zijn voor gebruik door individuele
      patiënten van die arts onder zijn toezicht en die hetzij zijn bereid volgens zijn specificaties, hetzij in een
      andere lidstaat of een derde land in de handel zijn en op zijn verzoek zijn ingevoerd of anderszins binnen het
      grondgebied van Nederland zijn gebracht;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: 40.3.d
    text: |-
      op geneesmiddelen voor geavanceerde therapie die met toestemming van het Staatstoezicht op de volksgezondheid
      worden bereid door een fabrikant volgens een recept voor een op bestelling gemaakt geneesmiddel dat voor een
      bepaalde patiënt op niet routinematige basis volgens specifieke kwaliteitsnormen en binnen dezelfde lidstaat in een
      ziekenhuis wordt gebruikt onder de exclusieve professionele verantwoordelijkheid van een arts;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: 40.3.e
    text: |-
      indien voor het geneesmiddel door het College een parallelhandelsvergunning als bedoeld in [artikel 48][ref1] is
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel48
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 40.3.f
    text: |-
      indien het een geneesmiddel betreft waarvoor hetzij een aanvraag om een handelsvergunning bij het Bureau is
      ingediend, hetzij waarmee nog klinische proeven gaande zijn en dat overeenkomstig bij ministeriële regeling te
      stellen voorwaarden beschikbaar is gesteld voor gebruik in schrijnende gevallen als bedoeld in artikel 83 van
      verordening 726/2004;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: 40.3.g
    text: |-
      indien door Onze Minister ontheffing is verleend aan een in de ontheffing aangeduide natuurlijke persoon of
      rechtspersoon voor het in het handelsverkeer brengen van een geneesmiddel teneinde de verspreiding van een door
      Onze Minister in de ontheffing aangewezen ziekteverwekker, gifstof, chemische agens of nucleaire straling die
      schadelijk kan zijn voor de volksgezondheid, tegen te gaan gedurende een in de ontheffing omschreven periode.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '40.4'
    text: |-
      Het is voorts verboden om generatoren van radionucliden, kits, uitgangsstoffen voor radiofarmaceutica en
      industrieel bereide radiofarmaceutica in het handelsverkeer te brengen zonder handelsvergunning.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '40.5'
    text: |-
      Indien een geneesmiddel onder dezelfde benaming in meer dan één farmaceutische vorm of in verschillende
      kwantitatieve samenstellingen in de handel zal worden gebracht, is voor elke vorm en samenstelling een
      afzonderlijke vergunning vereist. Zodanige afzonderlijk verleende vergunningen maken voor de toepassing van
      deze wet, met uitzondering van [artikel 54][ref1], deel uit van de voor het referentiegeneesmiddel verleende
      handelsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel54
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '40.6'
    text: |-
      Indien een geneesmiddel in de handel zal worden gebracht in een farmaceutische vorm die moet worden samengevoegd
      met een vloeistof en op de verpakking of in de bijsluiter voor aanwending of gebruik verschillende concentraties
      worden opgegeven die kwalitatief verschillende werkingen hebben, is voor elke concentratie een afzonderlijke
      vergunning vereist.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '40.7'
    text: |-
      Het is verboden met betrekking tot geneesmiddelen waarvoor door de Gemeenschap een handelsvergunning is verleend,
      te handelen in strijd met artikel 16, eerste of tweede lid, 23 of 24, eerste, tweede, derde of vijfde lid, eerste
      en tweede alinea, van verordening 726/2004.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '40.8'
    text: |-
      Het Staatstoezicht ziet erop toe dat bij de bereiding van een geneesmiddel voor geavanceerde therapie als bedoeld
      in het derde lid, onder d, de eisen ter zake van de traceerbaarheid, de geneesmiddelenbewaking en de kwaliteit
      van het middel gelijkwaardig zijn aan die welke gelden voor de bereiding van geneesmiddelen voor geavanceerde
      therapieën waarvoor een vergunning voor het in de handel brengen is vereist op grond van verordening 726/2004.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel40
  - number: '41.1'
    text: |-
      Onverminderd het tweede lid, kan, met uitzondering van de Staat der Nederlanden, niemand aansprakelijk worden
      gesteld voor de schade aan de gezondheid van een persoon indien Onze Minister het gebruik van een geneesmiddel
      voor een indicatie die niet is opgenomen in het dossier op grond waarvan de handelsvergunning is verleend, dan wel
      van een geneesmiddel waarvoor geen handelsvergunning geldt, heeft aanbevolen of daarom dringend heeft verzocht,
      teneinde een vermeende of geconstateerde verspreiding van een ziekteverwekker, gifstof, chemisch agens of nucleaire
      straling die schadelijk kan zijn voor de volksgezondheid, tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel41
  - number: '41.2'
    text: |-
      De Staat de Nederlanden is niet aansprakelijk voor de schade van het gebruik van een geneesmiddel op de voet van
      het bepaalde in het eerste lid, voor zover er voor het desbetreffende geneesmiddel aansprakelijkheid geldt in de
      zin van de [artikelen 185 tot en met 193 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel185
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '185'
  - number: '42.1'
    text: |-
      De handelsvergunning wordt door het College slechts verleend op aanvraag van een natuurlijke persoon of
      rechtspersoon die in Nederland of in een andere lidstaat is gevestigd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden bij de aanvraag worden overgelegd en welke
      van die gegevens en bescheiden worden opgesteld en ondertekend door bij de regeling te bepalen deskundigen. In de
      regeling kan ter zake van de over te leggen gegevens en bescheiden onderscheid worden gemaakt tussen categorieën
      van geneesmiddelen. Farmaceutische, preklinische en klinische informatie maakt deel uit van de over te leggen
      gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.3'
    text: |-
      De aanvrager is niet gehouden preklinische en klinische gegevens over te leggen indien de aanvraag betrekking heeft
      op homeopathische geneesmiddelen die voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.3.a
    text: het middel is voor oraal of uitwendig gebruik bestemd;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.3.b
    text: noch in of op de verpakking ervan noch in de bijsluiter wordt melding gemaakt van enige therapeutische indicatie;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.3.c
    text: |-
      de verdunningsgraad is zodanig dat het middel gegarandeerd onschadelijk is en in elk geval niet meer bevat dan één
      deel per 10 000 van de oertinctuur dan wel één honderdste van de kleinste in de allopathische geneeskunde gebruikte
      dosis werkzame stoffen die in een UR-geneesmiddel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.4'
    text: |-
      Onverminderd het tweede lid, kunnen bij ministeriële regeling ten aanzien van andere homeopathische geneesmiddelen
      dan die bedoeld in het derde lid, bijzondere voorschriften worden gegeven met betrekking tot het overleggen van
      preklinische en klinische gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.5'
    text: |-
      Onverminderd het recht met betrekking tot de bescherming van de industriële en commerciële eigendom, is de
      aanvrager niet gehouden de resultaten van preklinische en klinische proeven over te leggen indien:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.5.a
    text: |-
      hij aantoont dat het geneesmiddel waarop de aanvraag betrekking heeft generiek is ten opzichte van een
      referentiegeneesmiddel waarvoor ten minste acht jaren voor de datum van de aanvraag een handelsvergunning is
      verleend,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.5.b
    text: |-
      hij met behulp van passende wetenschappelijke literatuur aantoont dat de werkzame stoffen van het geneesmiddel
      waarop de aanvraag betrekking heeft, reeds ten minste tien jaren in de Gemeenschap in de medische praktijk
      worden gebruikt en een wetenschappelijk erkende werkzaamheid alsmede een aanvaardbaar veiligheidsniveau bieden
      overeenkomstig de voorwaarden van bijlage 1 bij [richtlijn 2001/83](32001L0083), of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.5.c
    text: |-
      het een aanvraag betreft voor een geneesmiddel met dezelfde kwalitatieve en kwantitatieve samenstelling aan
      werkzame stoffen en met dezelfde farmaceutische vorm als het referentiegeneesmiddel en de aanvrager met toestemming
      van de houder van de handelsvergunning voor het referentiegeneesmiddel gebruik maakt van de in het dossier op grond
      waarvan de handelsvergunning is verleend, opgenomen farmaceutische, preklinische en klinische documentatie.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.6'
    text: 'Indien de aanvraag een geneesmiddel betreft:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.6.a
    text: dat niet voldoet aan de definitie van generiek geneesmiddel,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.6.b
    text: |-
      waarvan de biologische equivalentie niet door middel van wetenschappelijke studies inzake biologische
      beschikbaarheid kan worden aangetoond,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.6.c
    text: |-
      waarvan de concentratie, de farmaceutische vorm of de wijze van toediening ten opzichte van die van het
      referentiegeneesmiddel wordt gewijzigd, of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.6.d
    text: waarvan werkzame stoffen of therapeutische indicaties worden gewijzigd ten opzichte van het referentiegeneesmiddel,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.7'
    text: |-
      Indien in de aanvraag om een handelsvergunning het referentiegeneesmiddel een biologisch geneesmiddel
      is en het geneesmiddel waarvoor de handelsvergunning wordt aangevraagd biologisch equivalent is aan het
      referentiegeneesmiddel, maar niet op dezelfde manier is bereid als het referentiegeneesmiddel dan wel daarin niet
      dezelfde grondstoffen worden gebruikt, is de aanvrager gehouden de resultaten van preklinische en klinische proeven
      met betrekking tot de desbetreffende aspecten waarin het geneesmiddel verschilt met het referentiegeneesmiddel,
      over te leggen. Deze aanvullende gegevens dienen wat betreft aantal en aard te voldoen aan de desbetreffende
      criteria, bedoeld in bijlage 1 bij [richtlijn 2001/83](32001L0083) en aan de desbetreffende krachtens die richtlijn
      door de Commissie vastgestelde richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.8'
    text: |-
      Onverminderd het recht met betrekking tot de bescherming van de industriële en commerciële eigendom, is de
      aanvrager niet gehouden klinische en preklinische gegevens over te leggen indien de aanvraag betrekking heeft op
      een kruidengeneesmiddel dat voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.8.a
    text: |-
      het middel heeft indicaties die uitsluitend passen bij een kruidengeneesmiddel dat uit hoofde van zijn
      samenstelling en doelstelling bedoeld en ontworpen is als geneesmiddel dat is bedoeld en ontworpen voor gebruik
      zonder tussenkomst van een arts,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.8.b
    text: het middel is uitsluitend bestemd om in een gespecificeerde concentratie en dosering te worden toegediend,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.8.c
    text: het is een middel voor oraal of uitwendig gebruik dan wel voor inhalatie,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.8.d
    text: |-
      het middel dan wel een daaraan gelijkwaardig of daarmee vergelijkbaar middel is gedurende ten minste dertig
      jaren voor de datum van de aanvraag om een handelsvergunning in de medische praktijk gebruikt, waarvan ten minste
      vijftien jaren in de Gemeenschap,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.8.e
    text: |-
      er zijn voldoende gegevens beschikbaar die aantonen dat het middel een traditioneel gebruik kent en onschadelijk
      is, en
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: 42.8.f
    text: |-
      door het langdurige gebruik en de ervaringen die daarmee zijn opgedaan is het aannemelijk dat het middel een
      farmacologisch effect heeft of anderszins werkzaam is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '42.9'
    text: |-
      Indien een geneesmiddel werkzame stoffen bevat die zijn opgenomen in geneesmiddelen waarvoor reeds een
      handelsvergunning is verleend, maar die niet eerder met therapeutisch oogmerk in één geneesmiddel zijn
      samengevoegd, worden bij de aanvraag om een handelsvergunning de resultaten van de nieuwe preklinische of klinische
      proeven met betrekking tot de samenvoeging overgelegd. Het overleggen van de documentatie betreffende de werkzame
      stoffen afzonderlijk kan achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel42
  - number: '43.1'
    text: |-
      Het College zendt, na ontvangst van een verzoek van de bevoegde autoriteit van een andere lidstaat bij wie een
      aanvraag om een handelsvergunning voor een generiek geneesmiddel is ingediend, binnen een maand een bevestiging of
      voor het in het verzoek vermelde referentiegeneesmiddel in Nederland een handelsvergunning is verleend, vergezeld
      van de samenstelling van het referentiegeneesmiddel en andere gegevens die door het College van belang worden
      geacht.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel43
  - number: '43.2'
    text: |-
      Een geneesmiddel waarvoor met toepassing van [artikel 42, vijfde lid, onder a, zesde en zevende lid][ref1], een
      handelsvergunning is verleend, wordt niet in het handelsverkeer gebracht voor het verstrijken van een periode
      van tien jaren volgend op de datum waarop de handelsvergunning voor het referentiegeneesmiddel is verleend. Deze
      periode wordt verlengd tot ten hoogste elf jaren indien de handelsvergunning voor het referentiegeneesmiddel:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 43.2.a
    text: |-
      binnen een periode van acht jaren nadat zij is verleend, wordt uitgebreid met een nieuwe indicatie die kan worden
      beschouwd als een belangrijk klinisch voordeel ten opzichte van de bestaande indicaties, dan wel
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel43
  - number: 43.2.b
    text: |-
      door het College wordt uitgebreid met een nieuwe indicatie voor een bekende stof en de noodzakelijke preklinische
      en klinische proeven met betrekking tot de nieuwe indicatie zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel43
  - number: '44.1'
    text: |-
      Het College bevestigt de ontvangst van een aanvraag om een handelsvergunning of van een aanvulling daarop als
      bedoeld in [artikel 4:5 van de Algemene wet bestuursrecht][ref1], schriftelijk binnen een week.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '44.2'
    text: |-
      Het College neemt binnen 210 dagen na ontvangst van een aanvraag een besluit of een handelsvergunning wordt
      verleend. Deze termijn wordt opgeschort gedurende een door het College gestelde termijn waarbinnen de aanvrager de
      gelegenheid heeft door het College verlangde aanvullende gegevens over te leggen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '44.3'
    text: |-
      Bij ministeriële regeling worden, met het oog op de volgtijdelijke of de gelijktijdige verlening van een
      handelsvergunning voor hetzelfde geneesmiddel in meer dan één lidstaat, regels gesteld met betrekking tot de door
      de aanvrager en het College te volgen procedure. De termijn van 210 dagen, bedoeld in het tweede lid, is niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '44.4'
    text: |-
      Indien bij het College een aanvraag om een handelsvergunning is ingediend en het College constateert dat in een
      andere lidstaat reeds een aanvraag om een handelsvergunning voor hetzelfde geneesmiddel in behandeling is, staakt
      hij de behandeling en deelt de aanvrager mede dat de procedure, bedoeld in het derde lid, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '44.5'
    text: |-
      Indien de aanvraag een geneesmiddel betreft waarvoor in een andere lidstaat reeds een handelsvergunning is verleend
      en de aanvraag niet overeenkomstig de procedure, bedoeld in het derde lid, is ingediend, wijst het College de
      aanvraag af.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '44.6'
    text: |-
      Het College maakt bij het Comité de arbitrageprocedure, bedoeld in de artikelen 32, 33 en 34 van [richtlijn
      2001/83](32001L0083), aanhangig:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: 44.6.a
    text: |-
      indien voor hetzelfde geneesmiddel in verschillende lidstaten aanvragen om een handelsvergunning zijn ingediend en
      de betrokken bevoegde instanties op de aanvragen onderscheidenlijk met betrekking tot de op de aanvragen verleende
      vergunning onderling afwijkende besluiten hebben genomen omtrent het verlenen onderscheidenlijk het schorsen of
      intrekken van de handelsvergunning;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: 44.6.b
    text: |-
      in bijzondere gevallen, wanneer de belangen van de Gemeenschap in het geding zijn, voordat het College een besluit
      neemt over het verlenen, schorsen of intrekken van een handelsvergunning.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '44.7'
    text: |-
      De aanvrager of houder van een handelsvergunning kan eveneens de arbitrageprocedure, bedoeld in zesde lid,
      aanhangig maken indien hij van oordeel is dat ten aanzien van het geneesmiddel waarvoor die handelsvergunning is
      verleend een situatie als bedoeld in dat lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '44.8'
    text: |-
      Binnen dertig dagen na de kennisgeving van de beslissing van de Commissie in de arbitrageprocedure geeft het
      College aan die beslissing uitvoering. Het College stelt de Commissie en het Bureau hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel44
  - number: '45.1'
    text: |-
      Het College verleent een handelsvergunning voor een geneesmiddel, niet zijnde een kruidengeneesmiddel als bedoeld
      in [artikel 42, achtste lid][ref1], indien na onderzoek van de overgelegde gegevens en bescheiden blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 45.1.a
    text: de afweging van voordelen en risico’s gunstig uitvalt,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: 45.1.b
    text: het geneesmiddel de gestelde therapeutische werking bezit,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: 45.1.c
    text: het geneesmiddel de opgegeven kwalitatieve en kwantitatieve samenstelling bezit, en
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: 45.1.d
    text: |-
      de tot staving van de aanvraag verstrekte gegevens of bescheiden in overeenstemming zijn met het bij of krachtens
      deze wet ter zake bepaalde.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: '45.2'
    text: |-
      Het College verleent een handelsvergunning voor een kruidengeneesmiddel als bedoeld in
      [artikel 42, achtste lid][ref1], – hierna te noemen handelsvergunning voor een traditioneel kruidengeneesmiddel –
      indien na onderzoek blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 45.2.a
    text: |-
      aan de voorwaarden, bedoeld in [artikel 42, achtste lid][ref1], is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 45.2.b
    text: het middel in normale gebruiksomstandigheden onschadelijk is;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: 45.2.c
    text: het middel farmacologische effecten of een werkzaamheid heeft;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: 45.2.d
    text: de farmaceutische kwaliteit afdoende is aangetoond; en
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: 45.2.e
    text: |-
      het middel geen homeopathisch geneesmiddel als bedoeld in [artikel 42, derde lid][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '45.3'
    text: |-
      De aanvrager of houder van een handelsvergunning is verantwoordelijk voor de juistheid van de ingediende gegevens
      en bescheiden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: '45.4'
    text: |-
      In uitzonderlijke omstandigheden kan het College, na overleg met de aanvrager, een handelsvergunning voorwaardelijk
      verlenen. Deze vergunning is gebaseerd op een van gronden, beschreven in bijlage 1 bij [richtlijn 2001/83]
      (32001L0083). De voorwaarden betreffen de veiligheid van het geneesmiddel, de melding van elk met het gebruik
      verband houdend incident aan het College, alsmede de dan te treffen maatregelen. Deze voorwaarden worden, tezamen
      met de termijnen en de data waarop aan deze voorwaarden moet zijn voldaan, onverwijld door het College voor het
      publiek toegankelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: '45.5'
    text: |-
      De verlenging van een handelsvergunning als bedoeld in het vierde lid, wordt gekoppeld aan een jaarlijkse
      herbeoordeling van de voorwaarden waaronder zij is verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: '45.6'
    text: |-
      Het College betrekt in zijn beoordeling van een aanvraag om een handelsvergunning voor een traditioneel
      kruidengeneesmiddel door het Comité voor kruidengeneesmiddelen opgestelde communautaire kruidenmonografieën en,
      zonodig, handelsvergunningen of soortgelijke vergunningen die in een andere lidstaat zijn verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: '45.7'
    text: |-
      Het College stelt de Commissie alsmede de bevoegde autoriteit van een andere lidstaat die daarom verzoekt,
      in kennis van een door hem genomen beslissing tot weigering van een handelsvergunning voor een traditioneel
      kruidengeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel45
  - number: '46.1'
    text: |-
      Het besluit van het College tot het verlenen van de handelsvergunning bevat tevens het besluit dat de samenvatting
      van de kenmerken van het geneesmiddel is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel46
  - number: '46.2'
    text: |-
      Het College maakt onverwijld de handelsvergunning alsmede de samenvatting van de kenmerken van het geneesmiddel
      toegankelijk voor het publiek.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel46
  - number: '46.3'
    text: |-
      Het College stelt een rapport op met een beoordeling van en opmerkingen over het dossier voor zover het de
      resultaten van de farmaceutische, preklinische en klinische proeven met het desbetreffende geneesmiddel betreft.
      Dit beoordelingsrapport wordt bijgewerkt zodra er nieuwe gegevens beschikbaar komen die voor de beoordeling van de
      kwaliteit, de veiligheid en de werkzaamheid van het geneesmiddel van belang zijn.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel46
  - number: '46.4'
    text: |-
      Het College maakt het beoordelingsrapport onverwijld toegankelijk voor het publiek, inclusief de motieven van zijn
      advies en met weglating van alle commercieel vertrouwelijke gegevens. De motivering wordt voor iedere aangevraagde
      indicatie afzonderlijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel46
  - number: '46.5'
    text: |-
      Het College brengt zijn besluiten, strekkende tot het verlenen, weigeren, schorsen of intrekken van een
      handelsvergunning of tot het vernietigen van een besluit tot weigering of intrekking van een handelsvergunning,
      terstond ter kennis van het Bureau. De kennisgeving van een besluit, strekkende tot het verlenen van een
      handelsvergunning, gaat vergezeld van de samenvatting van de kenmerken van het geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel46
  - number: '46.6'
    text: |-
      Het College maakt zijn besluiten, strekkende tot het weigeren, schorsen of intrekken van een handelsvergunning,
      toegankelijk voor het publiek, met weglating van alle commercieel vertrouwelijke informatie. Het College maakt
      voorts de intrekking van een aanvraag om een handelsvergunning of om een uitbreiding van die vergunning met
      een nieuwe indicatie op een voor het publiek toegankelijke manier bekend, met weglating van alle commercieel
      vertrouwelijke informatie.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel46
  - number: '47.1'
    text: Een handelsvergunning is vijf jaren geldig, behoudens het vierde lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel47
  - number: '47.2'
    text: |-
      De houder van de handelsvergunning legt ten minste zes maanden voordat de vergunning haar geldigheid verliest,
      aan het College een versie van het dossier over dat betrekking heeft op de kwaliteit, veiligheid en werkzaamheid
      van het geneesmiddel, waaronder begrepen de wijzigingen die ter zake van die aspecten zijn aangebracht sinds de
      verlening van de handelsvergunning.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel47
  - number: '47.3'
    text: |-
      Na afweging van de voordelen en risico’s kan het College de handelsvergunning voor onbepaalde tijd verlengen dan
      wel, in verband met de geneesmiddelenbewaking, éénmaal voor vijf jaar.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel47
  - number: '47.4'
    text: |-
      Indien een geneesmiddel gedurende drie opeenvolgende jaren niet daadwerkelijk in de handel is gebracht of is
      geweest, vervalt de desbetreffende handelsvergunning. Het College doet daarvan mededeling aan de vergunninghouder.
      In uitzonderlijke omstandigheden kan het College, om redenen van volksgezondheid, de handelsvergunning in stand
      laten.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel47
  - number: '48.1'
    text: |-
      Het College verleent, op aanvraag, binnen vijfenveertig dagen een parallelhandelsvergunning indien het geneesmiddel
      waarop de aanvraag betrekking heeft, is betrokken uit een andere lidstaat en gelijk of nagenoeg gelijk is aan een
      referentiegeneesmiddel waarvoor het College een handelsvergunning heeft verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
  - number: '48.2'
    text: |-
      Een parallelhandelsvergunning geldt voor dezelfde indicaties, contra-indicaties, bijwerkingen,
      dosering, wijze van gebruik en van toediening als die van het referentiegeneesmiddel. Het overeenkomstig
      [artikel 35, eerste lid][ref1], genomen besluit tot goedkeuring van de samenvatting van de kenmerken
      van het referentiegeneesmiddel, is tevens van toepassing op het geneesmiddel waarvoor de desbetreffende
      parallelhandelsvergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel35
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '48.3'
    text: |-
      Het College schorst een parallelhandelsvergunning zolang de handelsvergunning voor het referentiegeneesmiddel is
      geschorst.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
  - number: '48.4'
    text: |-
      Het College trekt een parallelhandelsvergunning in zodra de handelsvergunning voor het referentiegeneesmiddel
      anders dan op verzoek van de houder daarvan wordt ingetrokken dan wel van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
  - number: '48.5'
    text: |-
      De houder van een parallelhandelsvergunning stelt de houder van de handelsvergunning voor het
      referentiegeneesmiddel onverwijld ervan in kennis dat hem door het College een parallelhandelsvergunning is
      verleend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
  - number: '48.6'
    text: |-
      Na intrekking van de handelsvergunning voor het referentiegeneesmiddel op verzoek van de houder daarvan blijft de
      parallelhandelsvergunning van kracht, tenzij het College besluit dat door het geneesmiddel in de handel te laten
      een reëel gevaar voor de gezondheid van personen ontstaat.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
  - number: '48.7'
    text: |-
      Indien de aanvraag betrekking heeft op een in Nederland octrooirechtelijk of door middel van een aanvullend
      beschermingscertificaat beschermd geneesmiddel dat wordt betrokken uit Estland, Hongarije, Letland, Litouwen,
      Polen, Slovenië, Slowakije of Tsjechië en daarvoor ten tijde van de registratie van het octrooi of het aanvullende
      beschermingscertificaat in de desbetreffende nieuwe lidstaat niet een dergelijke bescherming kon worden verkregen,
      wordt bij de aanvraag om een parallelhandelsvergunning tevens overgelegd een afschrift van de schriftelijke
      kennisgeving aan de houder van het octrooi of het aanvullende beschermingscertificaat of de begunstigde van die
      bescherming met betrekking tot het referentiegeneesmiddel waaruit blijkt dat de kennisgeving is gedaan ten minste 1
      maand vóór de dag waarop de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel48
  - number: '49.1'
    text: |-
      De houder van de handelsvergunning brengt na voorafgaande toestemming van het College wijziging aan in de methoden
      van bereiding van een geneesmiddel en van controle daarop indien deze wijziging strekt tot het in overeenstemming
      brengen van de desbetreffende methoden met de vooruitgang van de wetenschap en de techniek ter zake en noodzaakt
      tot aanpassing van de bij de aanvraag om de handelsvergunning overgelegde bescheiden met betrekking tot de
      methoden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
  - number: '49.2'
    text: |-
      De houder van de handelsvergunning stelt het College onverwijld in kennis van alle nieuwe informatie die kan leiden
      tot wijziging van de gegevens en bescheiden, bedoeld in [42, tweede lid][ref1], en in bijlage 1 bij [richtlijn
      2001/83](32001L0083).


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '49.3'
    text: |-
      De houder van de handelsvergunning stelt het College onverwijld in kennis van alle door de bevoegde autoriteiten
      van andere lidstaten opgelegde verboden en beperkingen alsmede van alle andere nieuwe gegevens die op de
      beoordeling van de voordelen en risico’s van het geneesmiddel van invloed kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
  - number: '49.4'
    text: |-
      De houder van de handelsvergunning verstrekt te allen tijde op verzoek van het College gegevens waaruit blijkt dat
      de afweging van voordelen en risico’s van het geneesmiddel gunstig blijft uitvallen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
  - number: '49.5'
    text: |-
      De houder van de handelsvergunning deelt het College de datum mee waarop het geneesmiddel daadwerkelijk in de
      handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
  - number: '49.6'
    text: |-
      De houder van de handelsvergunning deelt het College mee wanneer de handel in een geneesmiddel tijdelijk of
      blijvend wordt stopgezet. Behoudens uitzonderlijke omstandigheden, vindt deze mededeling plaats uiterlijk twee
      maanden voor de onderbreking of stopzetting.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
  - number: '49.7'
    text: |-
      Onverminderd [artikel 77, eerste lid, onder d][ref1], verstrekt de houder van de handelsvergunning voor een
      geneesmiddel desgevraagd aan het College gegevens over het afzetvolume van het geneesmiddel en de in zijn bezit
      zijnde gegevens betreffende het aantal recepten.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel77
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '77'
        hoofdstuk: '8'
  - number: '49.8'
    text: |-
      De houder van een handelsvergunning draagt ervoor zorg dat het geneesmiddel waarop de handelsvergunning betrekking
      heeft, in voldoende mate voorradig is voor groothandelaren of apothekers teneinde in de behoeften van patiënten te
      kunnen voorzien.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel49
  - number: '50.1'
    text: |-
      De houder van een handelsvergunning brengt zonder voorafgaande toestemming van het College geen wijziging aan
      in een geneesmiddel indien die wijziging noodzaakt tot aanpassing van de bij de aanvraag overgelegde gegevens en
      bescheiden. Indien het een handelsvergunning voor een traditioneel kruidengeneesmiddel betreft, verzoekt de houder
      daarvan het College tevens om toestemming gegevens of bescheiden die bij de aanvraag zijn overgelegd, te wijzigen
      indien door het Comité voor kruidengeneesmiddelen een nieuwe communautaire kruidenmonografie is vastgesteld waarvan
      redelijkerwijs mag worden aangenomen dat deze noodzaakt tot aanpassing van zodanige gegevens of bescheiden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel50
  - number: '50.2'
    text: |-
      De houder van een handelsvergunning legt voorgenomen wijzigingen van de buitenverpakking, de primaire verpakking of
      de tekst van de bijsluiter voor aan het College.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel50
  - number: '50.3'
    text: |-
      De houder van een handelsvergunning stelt het College in kennis van een wijziging van de bereidingswijze en van een
      wijziging van de niet-werkzame bestanddelen van een geneesmiddel, voorzover deze wijzigingen naar redelijkerwijs
      mag worden aangenomen geen invloed hebben op de werking van het geneesmiddel. Indien het College van oordeel is dat
      een wijziging als bedoeld in de eerste volzin, wel van invloed is op de werking van een geneesmiddel, deelt hij dit
      onverwijld mede en behandelt hij deze mededeling als een verzoek om toestemming voor een wijziging als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel50
  - number: '50.4'
    text: |-
      De houder van een handelsvergunning stelt het College terstond in kennis van elke stap die door hem is gezet om
      het in de handel brengen van een geneesmiddel op te schorten of een geneesmiddel uit de handel te nemen, onder
      opgave van de redenen van die stap indien deze betrekking heeft op de werkzaamheid van het geneesmiddel of op de
      bescherming van de volksgezondheid. Het College draagt ervoor zorg dat deze informatie ter kennis van het Bureau
      wordt gebracht. Indien de informatie een weerslag kan hebben op de volksgezondheid in een derde land, brengt het
      College die informatie ook ter kennis van de Wereldgezondheidsorganisatie.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel50
  - number: '51.1'
    text: 'Het College schorst een handelsvergunning, wijzigt deze of trekt deze in indien:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: 51.1.a
    text: het geneesmiddel bij normaal gebruik schadelijk is,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: 51.1.b
    text: |-
      de therapeutische werking ontbreekt dan wel indien de afweging van voordelen en risico’s bij normaal gebruik niet
      gunstig is,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: 51.1.c
    text: het geneesmiddel niet de opgegeven kwalitatieve en kwantitatieve eigenschappen bezit,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: 51.1.d
    text: |-
      de krachtens [artikel 42][ref1] overgelegde gegevens en bescheiden onjuist zijn of niet zijn gewijzigd
      overeenkomstig [artikel 49][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel49
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 51.1.e
    text: |-
      de in [artikel 28, eerste lid][ref1], bedoelde controles niet hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel28
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '51.2'
    text: |-
      Indien werkzame bestanddelen van een kruidengeneesmiddel als bedoeld in [artikel 42, achtste lid][ref1], worden
      afgevoerd van de door het Comité voor kruidengeneesmiddelen opgestelde lijst van zodanige bestanddelen, trekt het
      College de desbetreffende handelsvergunning voor een traditioneel kruidengeneesmiddel in.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '51.3'
    text: Het College trekt een handelsvergunning in op schriftelijk verzoek van de houder.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: '51.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het verlenen, wijzigen, schorsen
      en intrekken van een handelsvergunning.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: '51.5'
    text: Het College maakt een besluit tot schorsing of intrekking van een handelsvergunning toegankelijk voor het publiek.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel51
  - number: '52.1'
    text: |-
      Het College kan om volksgezondheidsredenen een handelsvergunning verlenen aan een naar zijn oordeel daarvoor in
      aanmerking komende rechtspersoon die met de verlening kan instemmen, indien het desbetreffende geneesmiddel niet in
      Nederland in de handel is, maar wel in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel52
  - number: '52.2'
    text: |-
      Het College brengt de houder van de handelsvergunning in de andere lidstaat op de hoogte van zijn voornemen een
      vergunning te verlenen op de voet van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel52
  - number: '52.3'
    text: |-
      Het College verzoekt de bevoegde autoriteit van de andere lidstaat om toezending van een kopie van het
      beoordelingsrapport en van de in de andere lidstaat geldende handelsvergunning.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel52
  - number: '52.4'
    text: |-
      Het College stelt de Commissie in kennis van de verlening van een handelsvergunning overeenkomstig het eerste lid.
      Deze kennisgeving gaat vergezeld van een opgave van de naam en het adres van de rechtspersoon aan wie de vergunning
      is verleend. Hetzelfde geldt indien het College de desbetreffende handelsvergunning intrekt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel52
  - number: '53'
    text: |-
      Het College houdt een openbaar register bij van geneesmiddelen waarvoor door hem een handelsvergunning of een
      parallelhandelsvergunning is verleend. Dit register bevat ten minste de aanduiding van het nummer waaronder het
      geneesmiddel is geregistreerd, de benaming van het geneesmiddel en de naam van de vergunninghouder. Het College
      registreert schorsingen van een handelsvergunning en schrijft geneesmiddelen waarvan de handelsvergunning is
      ingetrokken dan wel van rechtswege is vervallen, uit het register.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel53
  - number: '54.1'
    text: |-
      Voor de behandeling van een aanvraag om een handelsvergunning of een parallelhandelsvergunning is de aanvrager het
      College een vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel54
  - number: '54.2'
    text: |-
      De houder van een handelsvergunning is voorts een vergoeding verschuldigd voor de behandeling van een verzoek
      om toestemming voor het aanbrengen van een wijziging als bedoeld in [artikel 49, eerste lid][ref1], of
      [50, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel50
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '54.3'
    text: |-
      Voor de instandhouding van de registratie van een handelsvergunning of een parallelhandelsvergunning in het
      openbare register, bedoeld in [artikel 53][ref1], is de houder van zodanige vergunning aan het College jaarlijks
      een vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel53
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '54.4'
    text: |-
      Onverminderd [artikel 10][ref1], wordt bij ministeriële regeling het tarief van de in het eerste, tweede en derde
      lid bedoelde vergoedingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel10
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '10'
        hoofdstuk: '2'
  - number: '55.1'
    text: |-
      De [artikelen 44, derde, vierde en vijfde lid][ref1], [46, derde en vierde lid][ref2], van deze wet en de artikelen
      32, 33 en 34 van [richtlijn 2001/83](32001L0083), zijn niet van toepassing op kruidengeneesmiddelen als bedoeld
      in [artikel 42, achtste lid][ref3], tenzij ter zake van het desbetreffende kruidengeneesmiddel een communautaire
      kruidenmonografie als bedoeld in [artikel 45, zesde lid][ref4], is opgesteld dan wel werkzame bestanddelen daarvan
      op een lijst als bedoeld in [artikel 51, tweede lid][ref5], voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0021505#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0021505#Artikel51
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0021505
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0021505
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '55.2'
    text: |-
      [Artikel 45, tweede lid, onder b en c][ref1], is niet van toepassing indien werkzame bestanddelen
      van een kruidengeneesmiddel als bedoeld in [artikel 42, achtste lid][ref2], op de lijst, bedoeld in
      [artikel 51, tweede lid][ref3], zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel51
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '55.3'
    text: |-
      De [artikelen 44, derde, vierde en vijfde lid][ref1], [46, derde en vierde lid][ref2], zijn niet van toepassing op
      andere homeopathische geneesmiddelen dan die bedoeld in [artikel 42, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '55.4'
    text: |-
      De artikelen 32, 33 en 34 van [richtlijn 2001/83](32001L0083) zijn niet van toepassing op homeopathische
      geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel55
  - number: '55.5'
    text: |-
      [Artikel 45, eerste lid, onder b][ref1], is niet van toepassing op homeopathische geneesmiddelen als bedoeld in
      [artikel 42, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '56'
    text: |-
      Het College neemt bij de verlening van een handelsvergunning tevens een besluit over de indeling van een
      geneesmiddel. Een geneesmiddel wordt in een van de volgende categorieën ingedeeld:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel56
  - number: 56.a
    text: UR-geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel56
  - number: 56.b
    text: UA-geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel56
  - number: 56.c
    text: UAD-geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel56
  - number: 56.d
    text: AV-geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel56
  - number: '57.1'
    text: 'Het College besluit tot indeling van een geneesmiddel als UR-geneesmiddel indien het:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
  - number: 57.1.a
    text: |-
      ook bij normaal gebruik direct of indirect gevaar kan opleveren wanneer het zonder medische begeleiding wordt
      gebruikt,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
  - number: 57.1.b
    text: |-
      veelvuldig en in zeer ruime mate niet overeenkomstig het gebruiksvoorschrift wordt gebruikt, ten gevolge waarvan de
      gezondheid direct of indirect in gevaar kan komen,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
  - number: 57.1.c
    text: |-
      een substantie of bereiding daarvan bevat die vanwege haar nieuwheid nader moet worden bestudeerd op werkzaamheid
      of bijwerkingen, of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
  - number: 57.1.d
    text: bestemd is voor parenterale toediening.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
  - number: '57.2'
    text: |-
      Het College kan besluiten dat een handelsvergunning voor een UR-geneesmiddel wordt verleend onder de voorwaarde
      dat het:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
  - number: 57.2.a
    text: |-
      uitsluitend ter hand mag worden gesteld of mag worden toegediend in een krachtens
      [artikel 5 van de Wet toelating zorginstellingen][ref1] als algemeen onderscheidenlijk als psychiatrisch ziekenhuis
      aangewezen instelling, of


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
  - number: 57.2.b
    text: |-
      uitsluitend mag worden voorgeschreven door een arts of een tandarts die is ingeschreven in een door het College
      aangewezen, krachtens [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] ingesteld
      register van medische onderscheidenlijk tandheelkundige specialisten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
  - number: '58.1'
    text: |-
      Het College besluit tot indeling van een geneesmiddel als UA-geneesmiddel indien dit naar zijn oordeel uit een
      oogpunt van medicatiebewaking, voorlichting of begeleiding bij de terhandstelling noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel58
  - number: '58.2'
    text: |-
      Het College besluit tot indeling van een geneesmiddel als AV-geneesmiddel indien dit naar zijn oordeel uit een
      oogpunt van veilig gebruik verantwoord is, gelet op de werkzame stof, de dosering en de verpakkingsgrootte.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel58
  - number: '58.3'
    text: |-
      Het College besluit tot indeling van een geneesmiddel als UAD-geneesmiddel indien het niet voor indeling als UA-
      geneesmiddel of als AV-geneesmiddel in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel58
  - number: '58.4'
    text: |-
      Indien bij de verlening van een handelsvergunning door de Gemeenschap een geneesmiddel niet is ingedeeld als UR-
      geneesmiddel, bepaalt het College de indeling op de voet van het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel58
  - number: '58.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ter zake van de criteria aan de hand waarvan het College
      besluit tot indeling van een geneesmiddel als UA-geneesmiddel of als AV-geneesmiddel. Het ontwerp van de regeling
      wordt ten minste 4 weken voor de vaststelling overgelegd aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel58
  - number: '59.1'
    text: |-
      Het College neemt, met inachtneming van de criteria, bedoeld in de [artikelen 57][ref1] en [58][ref2], opnieuw
      een besluit met betrekking tot de indeling van een geneesmiddel indien aan het College uit nieuwe gegevens die te
      zijner kennis zijn gebracht, is gebleken dat de indeling moet worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel58
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '57'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '58'
        hoofdstuk: '5'
  - number: '59.2'
    text: |-
      Onze Minister kan het College verzoeken de indeling van een door Onze Minister aangewezen geneesmiddel opnieuw
      te beoordelen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel59
  - number: '59.3'
    text: |-
      Indien het College, op verzoek van de houder van de handelsvergunning, de indeling van een geneesmiddel heeft
      gewijzigd op basis van significante preklinisch of klinische proeven, kan het College gedurende een periode van
      één jaar, te rekenen vanaf de datum van het nieuwe indelingsbesluit van het College, de indeling van een ander
      geneesmiddel niet wijzigen op basis van die proeven.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel59
  - number: '59.4'
    text: |-
      Indien het College, anders dan op verzoek van de houder van de handelsvergunning, de indeling van een
      geneesmiddel wil wijzigen, wordt het besluit tot wijziging van de indeling niet genomen dan nadat de houder
      van de handelsvergunning, binnen een door het College aangegeven termijn, het dossier op grond waarvan de
      handelsvergunning is verleend, heeft aangepast aan de nieuwe indeling.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel59
  - number: '60'
    text: |-
      Het College stelt een lijst op van UR-geneesmiddelen, van UA-geneesmiddelen, van UAD-geneesmiddelen en van AV-
      geneesmiddelen. Deze lijsten worden algemeen verkrijgbaar gesteld. Het College actualiseert deze lijsten ten minste
      een maal per jaar.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel60
  - number: '61.1'
    text: 'Het is een ieder verboden UR-geneesmiddelen of UA-geneesmiddelen ter hand te stellen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: 61.1.a
    text: apothekers die hun beroep in een apotheek uitoefenen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: 61.1.b
    text: huisartsen die in het bezit zijn van een vergunning als bedoeld in het achtste of negende lid;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: 61.1.c
    text: daartoe bij ministeriële regeling aangewezen personen en instanties in de in de regeling bedoelde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.2'
    text: |-
      Het is een ieder, behoudens apothekers die hun beroep uitoefenen in een apotheek, en bij ministeriële regeling
      aangewezen personen verboden geneesmiddelen voor onderzoek ter hand te stellen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.3'
    text: De apotheker of de apotheekhoudend arts mag de artsenijbereidkunst slechts in één apotheek uitoefenen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.4'
    text: Bij afwezigheid van de apotheker voorziet hij binnen de beroepsgroep in waarneming.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.5'
    text: |-
      De apothekers die in een apotheek hun beroep uitoefenen, zijn evenwel niet bevoegd tot het ter hand stellen van UR-
      geneesmiddelen dan nadat degenen onder hen die belast zijn met de leiding van de apotheek, op hun verzoek, zijn
      ingeschreven in het door het Staatstoezicht op de volksgezondheid ingestelde register van gevestigde apothekers. In
      het register wordt aangetekend op welk adres de apotheek is gevestigd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.6'
    text: |-
      Een inschrijving in het register van gevestigde apothekers wordt geweigerd indien de aanvrager niet is ingeschreven
      in het krachtens [artikel 3, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1]
      ingestelde register van apothekers dan wel zijn inschrijving in dat register is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '61.7'
    text: |-
      De inschrijving in het register van gevestigde apothekers vervalt van rechtswege indien betrokkene niet meer
      staat ingeschreven in het krachtens [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1]
      ingestelde register van apothekers. De inschrijving wordt doorgehaald indien de betrokkene daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '61.8'
    text: |-
      Aan beroepsbeoefenaren als bedoeld in [artikel 1, eerste lid, onder ll, en derde lid][ref1], worden geneesmiddelen
      slechts ter hand gesteld na ontvangst van een daartoe strekkend schriftelijk verzoek. Het verzoek vermeldt de naam,
      het adres en de hoedanigheid van de verzoeker alsmede de naam en de hoeveelheid van het geneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
        hoofdstuk: I
  - number: '61.9'
    text: |-
      Een apotheker die in een apotheek werkt, is bevoegd in spoedgevallen een UR-geneesmiddel ter hand te stellen zonder
      dat een recept wordt overgelegd, indien hij zich voldoende zekerheid heeft verschaft dat gevaar voor misbruik niet
      kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.10'
    text: |-
      Onze Minister verleent desgevraagd aan een huisarts die de geneeskundige praktijk uitoefent in een aaneengesloten
      gebied, een vergunning tot het bereiden en het ter hand stellen van UR-geneesmiddelen aan patiënten van zijn
      praktijk, indien de afstand tussen de meest dichtbij dat gebied gevestigde apotheker en de in dat gebied meest
      dichtbij die apotheek wonende potentiële patiënt ten minste 4,5 kilometer is. Indien de in het eerste volzin
      bedoelde afstand minder dan 4,5 kilometer is, maar meer dan 3,5 kilometer, verleent Onze Minister de vergunning
      indien dit in het belang is van de geneesmiddelenvoorziening.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.11'
    text: |-
      Onze Minister verleent aan de huisarts die de geneeskundige praktijk uitoefent gezamenlijk met een huisarts aan
      wie een vergunning als bedoeld in het tiende lid is verleend, desgevraagd, een vergunning om UR-geneesmiddelen aan
      de patiënten die hij behandelt, te bereiden en ter hand te stellen in de apotheek van de huisarts met wie hij de
      praktijk uitoefent.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.12'
    text: |-
      Een vergunning als bedoeld in het tiende lid vervalt van rechtswege indien de vergunninghouder
      de geneeskundige praktijk beëindigt dan wel niet meer staat ingeschreven in het krachtens
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] ingestelde register van artsen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: '61.13'
    text: |-
      Onze Minister trekt een vergunning als bedoeld in het tiende lid in indien de grond van de verlening daarvan is
      vervallen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '61.14'
    text: |-
      Een vergunning als bedoeld in het elfde lid vervalt van rechtswege indien de huisarts met wie de houder van die
      vergunning gezamenlijk de praktijk uitoefent, niet meer over een vergunning als bedoeld in het tiende lid beschikt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel61
  - number: '62.1'
    text: 'Het is een ieder verboden UAD-geneesmiddelen ter hand te stellen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: 62.1.a
    text: apothekers die in een apotheek werken;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: 62.1.b
    text: |-
      huisartsen die in het bezit zijn van een vergunning als bedoeld in [artikel 61, tiende of elfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '61'
        hoofdstuk: '6'
  - number: 62.1.c
    text: |-
      de krachtens [artikel 61, eerste lid, onder c][ref1], aangewezen personen of instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '61'
        hoofdstuk: '6'
  - number: 62.1.d
    text: drogisten.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: '62.2'
    text: |-
      Degene die in de uitoefening van een bedrijf verkoopactiviteiten verricht en in dat kader door de in het eerste
      lid, onder d, bedoelde personen UAD-geneesmiddelen ter hand laat stellen, dient verantwoorde zorg aan te bieden.
      Onder het aanbieden van verantwoorde zorg wordt in ieder geval verstaan dat:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: 62.2.a
    text: de terhandstelling geschiedt onder verantwoordelijkheid en onder toezicht van een drogist;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: 62.2.b
    text: |-
      degene aan wie een UAD-geneesmiddel ter hand wordt gesteld, op duidelijke wijze wordt ingelicht over hetgeen hij
      redelijkerwijze moet weten over de aard en het doel van het geneesmiddel en de te verwachten gevolgen en risico’s
      daarvan voor zijn gezondheid, tenzij hij te kennen heeft gegeven daar geen behoefte aan te hebben;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: 62.2.c
    text: uitsluitend een drogist of een assistent-drogist de in onderdeel b bedoelde voorlichting mag geven, en
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: 62.2.d
    text: |-
      in het verkooppunt voldoende drogisten en assistent-drogisten aanwezig zijn die klanten deze voorlichting kunnen
      geven.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
  - number: '62.3'
    text: |-
      Het is een ieder verboden AV-geneesmiddelen ter hand te stellen, met uitzondering van de in het eerste lid,
      onder a, b, c en d bedoelde personen of instanties, alsmede met uitzondering van degenen die in de uitoefening
      van een bedrijf verkoopactiviteiten verrichten en daartoe zijn ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: '63'
    text: |-
      De [artikelen 61][ref1] en [62][ref2] zijn niet van toepassing op artsen en apothekers die in die hoedanigheid in
      dienst zijn van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel62
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '61'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '62'
        hoofdstuk: '6'
  - number: '64'
    text: |-
      Het is artsen en apothekers als bedoeld in [artikel 63][ref1], verboden geneesmiddelen ter hand te stellen
      aan personen buiten de krijgsmacht, tenzij dat kennelijk noodzakelijk is ter uitvoering van aan de krijgsmacht
      opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel63
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '63'
        hoofdstuk: '6'
  - number: '65'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld voor de geneesmiddelenvoorziening binnen de
      krijgsmacht. Indien dit kennelijk noodzakelijk is met het oog op de operationele inzet van de krijgsmacht of de
      voorbereiding daarop, kan daarbij worden afgeweken van deze wet.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel65
  - number: '66.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het bereiden
      en het ter hand stellen van geneesmiddelen in de apotheek.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel66
  - number: '66.2'
    text: |-
      De apothekers en de apotheekhoudende huisartsen dragen ervoor zorg dat recepten, geneesmiddelen en vergiften worden
      bewaard overeenkomstig bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel66
  - number: '67'
    text: |-
      Het is een ieder verboden via internet geneesmiddelen voor te schrijven aan personen die de voorschrijver nog nooit
      persoonlijk heeft ontmoet, of die de voorschrijver niet kent of van wie de voorschrijver de medicatiehistorie niet
      beschikbaar heeft.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel67
  - number: '68'
    text: |-
      Het buiten de door het College geregistreerde indicaties voorschrijven van geneesmiddelen is alleen geoorloofd
      wanneer daarover binnen de beroepsgroep protocollen of standaarden zijn ontwikkeld. Als de protocollen en
      standaarden nog in ontwikkeling zijn, is overleg tussen de behandelend arts en apotheker noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel68
  - number: '69.1'
    text: |-
      Op de buitenverpakking en de primaire verpakking van een geneesmiddel, niet zijnde een geneesmiddel voor onderzoek
      of voor geavanceerde therapie dan wel een in een apotheek bereid geneesmiddel, worden de volgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.a
    text: |-
      de naam van het geneesmiddel, in gewone letters en in braille, gevolgd door de sterkte en de farmaceutische vorm
      alsmede, voor zover van toepassing, de vermelding zuigelingen, kinderen of volwassenen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.b
    text: |-
      indien het geneesmiddel niet meer dan drie werkzame bestanddelen bevat, de internationale generieke benaming of,
      indien deze niet bestaat, de algemene benaming;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.c
    text: |-
      de kwalitatieve en kwantitatieve samenstelling aan werkzame bestanddelen per doseringseenheid of, afhankelijk van
      de toedieningsvorm, voor een bepaald volume of gewicht, waarbij de algemene benamingen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.d
    text: de farmaceutische vorm en de inhoud uitgedrukt in gewicht, volume of doseringseenheden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.e
    text: |-
      een opgave van de in het geneesmiddel aanwezige hulpstoffen met een bekende werking of een bekend effect, met
      dien verstande dat, indien er sprake is van een injecteerbaar geneesmiddel of een geneesmiddel bestemd voor lokaal
      gebruik of oogheelkundig gebruik, alle hulpstoffen worden vermeld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.f
    text: |-
      de wijze van gebruik en, in daarvoor in aanmerking komende gevallen, de toedieningsweg, waarbij ruimte wordt
      vrijgelaten voor vermelding van de dosering door de apotheker of de apotheekhoudende huisarts;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.g
    text: |-
      een speciale waarschuwing dat het geneesmiddel buiten het bereik en het zicht van kinderen dient te worden
      gehouden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.h
    text: een speciale waarschuwing indien dat voor het gebruik van het geneesmiddel kennelijk noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.i
    text: |-
      een in begrijpelijke woorden gestelde aanduiding van de uiterste gebruiksdatum met de vermelding van maand en
      jaartal;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.j
    text: de wijze waarop het geneesmiddel bewaard dient te worden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.k
    text: |-
      de voorzorgsmaatregelen die getroffen dienen te worden bij het verwijderen van niet-gebruikte geneesmiddelen of van
      zodanige geneesmiddelen afgeleide afvalstoffen en eventueel bestaande inzamelingssystemen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.l
    text: |-
      naam en adres van de houder van de handelsvergunning en, voor zover van toepassing, de naam van de door de houder
      van de handelsvergunning aangewezen vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.m
    text: het nummer van de handelsvergunning;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.n
    text: het chargenummer;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.o
    text: of het een UR-, een UA-, een UAD- of een AV-geneesmiddel is;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.p
    text: een vermelding dat vóór gebruik de bijsluiter geraadpleegd dient te worden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.1.q
    text: een gebruiksaanwijzing indien het een UA-, UAD- of een AV-geneesmiddel is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: '69.2'
    text: |-
      Op de buitenverpakking worden andere gegevens dan die, bedoeld in eerste lid, slechts aangebracht indien het gaat
      om:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.2.a
    text: tekens of pictogrammen ter verduidelijking van de in het eerste lid bedoelde gegevens;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.2.b
    text: |-
      andere gegevens, mits deze niet strijdig zijn met de goedgekeurde samenvatting van de kenmerken van het
      geneesmiddel en nuttig zijn voor de patiënt, een en ander met uitzondering van vermeldingen ter aanprijzing van
      het geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.2.c
    text: gegevens ter identificatie of ter vaststelling van de authenticiteit van het geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: 69.2.d
    text: de prijs van het geneesmiddel of de van toepassing zijnde vergoedingsregeling.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: '69.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het tweede lid, onder b, c en d,
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel69
  - number: '70.1'
    text: |-
      In afwijking van [artikel 69, eerste lid][ref1], kan op een primaire blisterverpakking die geplaatst is in een
      buitenverpakking die voldoet aan [artikel 69][ref2], worden volstaan met de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel69
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
  - number: 70.1.a
    text: |-
      de naam van het geneesmiddel, gevolgd door de sterkte en de farmaceutische vorm en, voor zover van toepassing, de
      vermelding zuigelingen, kinderen of volwassenen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.1.b
    text: |-
      indien het geneesmiddel niet meer dan drie werkzame bestanddelen bevat, de internationale generieke benaming of,
      indien deze niet bestaat, de algemene benaming;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.1.c
    text: de naam van de houder van de handelsvergunning;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.1.d
    text: de uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.1.e
    text: het chargenummer.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: '70.2'
    text: |-
      In afwijking van [artikel 69, eerste lid][ref1], kan op een primaire verpakking die zo klein is dat het niet
      mogelijk is daarop de in die bepaling bedoelde gegevens aan te brengen, worden volstaan met de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel69
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
  - number: 70.2.a
    text: |-
      de naam van het geneesmiddel, gevolgd door de sterkte en de farmaceutische vorm en, voor zover van toepassing, de
      vermelding zuigelingen, kinderen of volwassenen en, in daarvoor in aanmerking komende gevallen, de toedieningsweg;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.2.b
    text: |-
      indien het geneesmiddel niet meer dan drie werkzame bestanddelen bevat, de internationale generieke benaming of,
      indien deze niet bestaat, de algemene benaming;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.2.c
    text: de wijze van gebruik;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.2.d
    text: de uiterste gebruiksdatum;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.2.e
    text: het chargenummer;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: 70.2.f
    text: de inhoud, uitgedrukt in gewicht, volume of eenheden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel70
  - number: '71.1'
    text: |-
      De verpakking van een geneesmiddel, niet zijnde een geneesmiddel voor onderzoek of een in een apotheek bereid
      geneesmiddel, bevat een bijsluiter. Deze verplichting geldt niet indien de gegevens, bedoeld in het tweede lid, op
      de buitenverpakking of op de primaire verpakking zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: '71.2'
    text: |-
      De bijsluiter, niet zijnde die van een geneesmiddel voor geavanceerde therapie, wordt opgesteld overeenkomstig de
      samenvatting van de kenmerken van het geneesmiddel en bevat in onderstaande volgorde de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.a
    text: |-
      de naam van het geneesmiddel, gevolgd door de sterkte en de farmaceutische vorm en, voor zover van toepassing, de
      vermelding zuigelingen, kinderen of volwassen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.b
    text: |-
      de algemene benaming, indien het geneesmiddel slechts één werkzame stof bevat en de naam van het geneesmiddel een
      fantasienaam is;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.c
    text: de farmacotherapeutische groep of het soort werking, in voor de patiënt gemakkelijk te begrijpen bewoordingen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.d
    text: de therapeutische indicaties;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.e
    text: |-
      contra-indicaties, de nodige voorzorgsmaatregelen bij gebruik, interacties met andere geneesmiddelen of andere
      stoffen die de werking van het geneesmiddel kunnen beïnvloeden en speciale waarschuwingen, waarbij:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.e.1°
    text: |-
      rekening wordt gehouden met de bijzondere situatie van bepaalde gebruikersgroepen, waaronder begrepen zwangere of
      lacterende vrouwen, kinderen, bejaarden en lijders aan een specifieke ziekte;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.e.2°
    text: |-
      de effecten van het gebruik op de rijvaardigheid of op het vermogen om bepaalde machines te bedienen worden
      vermeld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.e.3°
    text: |-
      de lijst van hulpstoffen wordt vermeld waarvan de kennis belangrijk is om het geneesmiddel doelmatig en veilig te
      kunnen gebruiken;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f
    text: 'de informatie die noodzakelijk is voor een goed en veilig gebruik van het geneesmiddel, waaronder wordt begrepen:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.1°
    text: de dosering;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.2°
    text: de wijze van gebruik en, voor daarvoor in aanmerking komende gevallen, de toedieningsweg;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.3°
    text: |-
      de toedieningsfrequentie waarbij, in daarvoor in aanmerking komende gevallen, het tijdstip waarop het geneesmiddel
      kan of moet worden toegediend, wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.4°
    text: de duur van de behandeling indien hiervoor een speciale instructie geldt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.5°
    text: de te nemen maatregelen in geval van overdosering;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.6°
    text: de te nemen maatregelen indien een of meer doses niet zijn toegediend;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.7°
    text: de vermelding dat ontwenningsverschijnselen kunnen optreden, indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.f.8°
    text: |-
      in daarvoor aanmerking komende gevallen een specifieke aanbeveling de arts of apotheker ter raadplegen voor nadere
      informatie omtrent het gebruik van het geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.g
    text: |-
      een beschrijving van de bijwerkingen die kunnen optreden bij een normaal gebruik van het geneesmiddel en, indien
      deze zich voordoen, van de maatregelen die alsdan dienen te worden getroffen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.h
    text: |-
      een vermelding waarin de gebruiker uitdrukkelijk wordt verzocht aan zijn arts of apotheker iedere bijwerking te
      melden die niet in de bijsluiter is vermeld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.i
    text: 'een verwijzing naar de uiterste gebruiksdatum op de verpakking die tevens omvat:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.i.1°
    text: een waarschuwing tegen gebruik na overschrijding van deze datum;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.i.2°
    text: bijzondere voorzorgsmaatregelen in verband met bewaring,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.i.3°
    text: een waarschuwing tegen bepaalde tekenen van bederf, indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.j
    text: |-
      voor elke aandieningsvorm een kwalitatieve en kwantitatieve opgave van werkzame bestanddelen alsmede een
      kwalitatieve opgave van hulpstoffen, waarbij de algemene benaming van de werkzame stoffen wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.k
    text: |-
      voor elke aandieningsvorm de farmaceutische vorm en de inhoud, uitgedrukt in gewichts-, volume- of
      doseringseenheden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.l
    text: |-
      de naam en het adres van de houder van de handelsvergunning en, indien hij niet in Nederland is gevestigd, de naam
      van degene die hem vertegenwoordigt in Nederland;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.m
    text: de naam en het adres van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.n
    text: indien het geneesmiddel onder andere namen in andere lidstaten in de handel is, een lijst van die namen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: 71.2.o
    text: de datum waarop de bijsluiter voor het laatst is herzien.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: '71.3'
    text: |-
      De bijsluiter is in overeenstemming met de uitkomsten van het overleg dat degene die een handelsvergunning
      heeft aangevraagd voor het desbetreffende geneesmiddel, op verzoek van de organisatie van patiënten voor wie het
      geneesmiddel bestemd is, dan wel, indien zodanige organisatie niet bestaat, met de overkoepelende instantie van
      patiëntenorganisaties heeft gevoerd over de duidelijkheid en gebruiksvriendelijkheid van de bijsluiter. Het verslag
      van dit overleg maakt deel uit van het dossier dat bij de aanvrage om de handelsvergunning wordt overgelegd. De
      houder van de handelsvergunning draagt ervoor zorg dat op verzoek van patiëntenorganisaties de bijsluiter in een
      voor blinden en slechtzienden geschikte vorm beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: '71.4'
    text: |-
      De bijsluiter is zodanig geschreven en ontworpen dat deze de gebruiker in staat stelt, zonodig met hulp van de
      beroepsbeoefenaar in de individuele gezondheidszorg die het geneesmiddel heeft voorgeschreven of ter hand gesteld,
      het geneesmiddel op de juiste wijze te gebruiken.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
  - number: '71.5'
    text: |-
      [Artikel 69, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van de bijsluiter.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel69
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
  - number: '72.1'
    text: |-
      De gegevens, bedoeld in de [artikelen 69][ref1], [70][ref2] en [71][ref3], worden duidelijk leesbaar, in de
      Nederlandse taal, goed te begrijpen en onuitwisbaar op de verpakking en in de bijsluiter aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel71
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '70'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '71'
        hoofdstuk: '7'
  - number: '72.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, kunnen tevens in een andere taal worden vermeld, mits de gegevens in iedere
      taal dezelfde zijn.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel72
  - number: '72.3'
    text: |-
      Het College kan op een met redenen omkleed verzoek besluiten dat op de buitenverpakking van bepaalde
      weesgeneesmiddelen de in [artikel 69][ref1] bedoelde gegevens in één van de officiële talen van de Europese
      Gemeenschap worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel69
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
  - number: '72.4'
    text: |-
      Het College kan, desgevraagd, wanneer het geneesmiddel niet bestemd is om rechtstreeks aan de patiënt ter hand te
      worden gesteld, ontheffing verlenen van de verplichting om bepaalde gegevens op het etiket en in de bijsluiter van
      het betrokken geneesmiddel te vermelden en van de verplichting om de bijsluiter in het Nederlands op te stellen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel72
  - number: '73.1'
    text: |-
      Op de buitenverpakking of, bij het ontbreken daarvan, op de primaire verpakking van een homeopathisch geneesmiddel,
      niet zijnde een in een apotheek bereid homeopathisch geneesmiddel, wordt duidelijk leesbaar vermeld dat het om een
      homeopathisch geneesmiddel gaat.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: '73.2'
    text: |-
      De [artikelen 69 tot en met 72][ref1] zijn niet van toepassing op homeopathische geneesmiddelen als bedoeld
      in [artikel 42, derde lid][ref2]. Op de buitenverpakking of de primaire verpakking van deze homeopathische
      geneesmiddelen worden de volgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '69'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 73.2.a
    text: |-
      de wetenschappelijke benaming van de homeopathische grondstoffen, gevolgd door de verdunningsgraad in de vorm
      van de daarvoor in een farmacopee als bedoeld in [artikel 1, eerste lid, onder f][ref1], gebruikte symbolen,
      met dien verstande dat, indien het homeopathische geneesmiddel is samengesteld uit verschillende homeopathische
      grondstoffen, de wetenschappelijke benaming kan worden aangevuld met een fantasienaam;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
        hoofdstuk: I
  - number: 73.2.b
    text: naam en adres van de houder van de handelsvergunning;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.c
    text: de wijze van gebruik en, zo nodig, de wijze van toediening;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.d
    text: |-
      de datum tot welke het homeopathische geneesmiddel geschikt voor gebruik wordt geacht, voorafgegaan door de woorden
      «niet te gebruiken na»;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.e
    text: de farmaceutische vorm;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.f
    text: de inhoud van de verpakking, uitgedrukt in gewicht of volume, dan wel doseringseenheden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.g
    text: zo nodig, bijzondere voorzorgsmaatregelen voor de bewaring;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.h
    text: zo nodig, een bijzondere waarschuwing, verband houdende met het gebruik;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.i
    text: het charge-nummer van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.j
    text: het nummer van de handelsvergunning;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.k
    text: de vermelding «homeopathisch geneesmiddel zonder goedgekeurde therapeutische indicaties»;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.l
    text: een waarschuwing waarbij de gebruiker wordt geadviseerd een arts te raadplegen indien de klachten aanhouden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: 73.2.m
    text: |-
      de prijs alsmede de eventuele regeling voor vergoeding, voor zover deze vermelding door Onze Minister is
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: '73.3'
    text: |-
      Indien de buitenverpakking van een in het tweede lid bedoeld homeopathisch geneesmiddel een bijsluiter bevat,
      worden de in het tweede lid bedoelde gegevens tevens in de bijsluiter vermeld.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel73
  - number: '74.1'
    text: |-
      Op de buitenverpakking of, bij het ontbreken daarvan, op de primaire verpakking van een kruidengeneesmiddel
      als bedoeld in [artikel 42, achtste lid][ref1], en in de bijsluiter wordt vermeld dat het om een traditioneel
      kruidengeneesmiddel gaat voor gebruik bij een of meer met name genoemde indicaties en dat de desbetreffende
      indicaties zijn gebaseerd op langdurig gebruik in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '74.2'
    text: |-
      Op de verpakking, bedoeld in het eerste lid, wordt tevens vermeld dat de gebruiker van het kruidengeneesmiddel een
      arts of een andere ter zake gekwalificeerde beroepsbeoefenaar in de individuele gezondheidszorg moet raadplegen
      indien de symptomen tijdens het gebruik van het middel aanhouden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel74
  - number: '75.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter zake van de etikettering van
      geneesmiddelen die in een apotheek zijn bereid en ter zake van de etikettering van geneesmiddelen voor onderzoek.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel75
  - number: '75.2'
    text: 'Dit hoofdstuk is niet van toepassing op geneesmiddelen die:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel75
  - number: 75.2.a
    text: zijn herverpakt door een arts die in die hoedanigheid in dienst is van het Ministerie van Defensie, of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel75
  - number: 75.2.b
    text: |-
      ter hand worden gesteld door daartoe opgeleide militairen van de krijgsmacht voor zover de terhandstelling door die
      militairen plaatsvindt onder operationele omstandigheden dan wel bij de voorbereiding daarop.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel75
  - number: '76.1'
    text: Het College is belast met de geneesmiddelenbewaking.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel76
  - number: '76.2'
    text: |-
      Onze Minister bevordert de totstandkoming en samenwerking van organen van beroepsbeoefenaren en
      patiëntenorganisaties in de gezondheidszorg die tot doel hebben gegevens over bijwerkingen en het gebruik en
      misbruik van geneesmiddelen waarvoor een handelsvergunning is verleend, te verzamelen, te registreren en te
      analyseren.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel76
  - number: '77.1'
    text: |-
      De houder van de handelsvergunning draagt bij aan de bewaking van de geneesmiddelen waarop de vergunning betrekking
      heeft, door:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: 77.1.a
    text: |-
      het systematisch verzamelen, registreren, ordenen en beheren van gegevens over alle vermoedelijke bijwerkingen die
      ter kennis komen van hem en degenen die in dienst van of ten behoeve van zijn onderneming werken;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: 77.1.b
    text: |-
      het systeem, bedoeld onder a, op ten minste één plaats in de Gemeenschap toegankelijk te doen zijn voor daartoe
      bevoegden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: 77.1.c
    text: |-
      het melden van bijwerkingen aan het Bureau, het College of de desbetreffende bevoegde autoriteit van een andere
      lidstaat;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: 77.1.d
    text: |-
      op verzoek van het College, binnen een door het College gestelde termijn, de aanvullende gegevens te verstrekken
      ten behoeve van de afweging van voordelen en risico’s, met inbegrip van gegevens over het afzetvolume van of het
      aantal recepten voor het desbetreffende geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.2'
    text: |-
      De houder van de handelsvergunning belast een daartoe gekwalificeerde persoon met de werkzaamheden, bedoeld in het
      eerste lid, alsmede met de voorbereiding van de veiligheidsverslagen, bedoeld in het derde lid. Deze persoon heeft
      zijn woonplaats in de Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.3'
    text: |-
      Tenzij als voorwaarde aan de verlening van een handelsvergunning of, nadien, krachtens ministeriële regeling,
      andere eisen zijn gesteld, worden meldingen van alle bijwerkingen door de houder van de handelsvergunning in
      de vorm van een periodiek veiligheidsverslag bij het College ingediend, hetzij onmiddellijk op verzoek van het
      College, hetzij ten minste elke zes maanden, te rekenen vanaf de datum van de verlening van de handelsvergunning
      tot aan de datum waarop het geneesmiddel in de handel wordt gebracht. Voorts dient de houder van de
      handelsvergunning geactualiseerde veiligheidsverslagen bij het College in, hetzij onmiddellijk op verzoek van
      het College, hetzij ten minste elke zes maanden, te rekenen vanaf de datum waarop het geneesmiddel in de handel
      is gebracht, gedurende de eerste twee jaren nadat het geneesmiddel in de handel is gebracht. Gedurende de daarop
      volgende twee jaren dient de houder van de handelsvergunning zodanig verslag eenmaal per jaar in bij het College.
      Na laatstbedoelde periode van twee jaren wordt zodanig verslag om de drie jaren ingediend dan wel onmiddellijk
      indien het College daarom verzoekt. Het periodieke veiligheidsverslag bevat een wetenschappelijke afweging van
      voordelen en risico’s van het geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.4'
    text: |-
      De houder van de handelsvergunning kan het College verzoeken om de in het derde lid genoemde perioden te wijzigen
      volgens de procedure van [Verordening (EG) nr. 1084/2003](32003R1084) van de Commissie betreffende het onderzoek
      van wijzigingen in de voorwaarden van een door een bevoegde instantie van een lidstaat verleende vergunning voor
      het in de handel brengen van geneesmiddelen voor menselijk gebruik en geneesmiddelen voor diergeneeskundig gebruik
      (PbEG L 159).
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.5'
    text: |-
      De houder van de handelsvergunning stelt het College in kennis van elke vermoedelijke ernstige bijwerking in
      Nederland waarvan hij door een beroepsbeoefenaar in de gezondheidszorg in kennis is gesteld, onmiddellijk en
      uiterlijk binnen vijftien dagen nadat de desbetreffende bijwerking te zijner kennis is gekomen. Indien hij in
      kennis is gesteld van een vermoedelijke ernstige bijwerking op het grondgebied van een andere lidstaat, stelt
      hij de bevoegde autoriteit van die lidstaat onmiddellijk en uiterlijk binnen vijftien dagen van die bijwerking
      in kennis.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.6'
    text: 'Indien het gaat om een geneesmiddel ter zake waarvan Nederland referentielidstaat is en:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: 77.6.a
    text: |-
      zodanig geneesmiddel viel binnen het toepassingsgebied van [richtlijn 87/22/EEG](31987L0022) van de Raad van de
      Europese Gemeenschappen van 22 december 1986 tot onderlinge aanpassing van de nationale maatregelen inzake het in
      de handel brengen van met behulp van hoogwaardige technieken, met name biotechnieken, vervaardigde geneesmiddelen
      (PbEG L 15), of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: 77.6.b
    text: |-
      waarvoor een handelsvergunning is verleend nadat de procedure, bedoeld in [artikel 44, derde lid][ref1], is
      gevolgd, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel44
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 77.6.c
    text: |-
      waarvoor een handelsvergunning is verleend nadat de arbitrageprocedure, bedoeld in de artikelen 32, 33 en 34 van
      [richtlijn 2001/83](32001L0083) is gevolgd,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.7'
    text: |-
      De houder van de handelsvergunning meldt aan het College elke vermoedelijke ernstige onverwachte bijwerking en elke
      vermoedelijke overdracht via een geneesmiddel van infecties veroorzakende agentia op het grondgebied van een derde
      land die hem ter kennis komen, binnen vijftien dagen na ontvangst van de informatie.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '77.8'
    text: |-
      De houder van de handelsvergunning verstrekt aan het publiek alleen objectieve informatie betreffende mogelijke
      bijwerkingen van het geneesmiddel waarop de handelsvergunning betrekking heeft. Hij verstrekt geen informatie
      aan het publiek over bezorgdheid in verband met geneesmiddelenbewaking dan nadat hij het College ter zake heeft
      geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel77
  - number: '78.1'
    text: |-
      Beroepsbeoefenaars in de gezondheidszorg melden aan de instantie die in opdracht van de overheid tot doel
      heeft gegevens over vermoedelijke bijwerkingen van geneesmiddelen waarvoor een handelsvergunning is verleend,
      te verzamelen, te registreren en te analyseren, onmiddellijk elke vermoedelijke bijwerking die leidt tot
      overlijden, blijvende invaliditeit, ziekenhuisopname of verlenging hiervan of aangeboren afwijking, alsmede
      elke vermoedelijke overdracht via een geneesmiddel van infecties veroorzakende agentia. Deze verplichting geldt
      ook voor bij ministeriële regeling aan te wijzen geneesmiddelen, indien een vermoeden bestaat op een bijzonder
      gezondheidsrisico.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel78
  - number: '78.2'
    text: |-
      De instantie die in opdracht van de overheid tot doel heeft gegevens over vermoedelijke bijwerkingen van
      geneesmiddelen waarvoor een handelsvergunning is verleend, te verzamelen, te registreren en te analyseren draagt er
      zorg voor dat alle gemelde bijwerkingen voor ieder toegankelijk zijn, met inachtneming de regels die gelden voor de
      bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel78
  - number: '78.3'
    text: |-
      Ten minste elke drie maanden wordt door de instantie die in opdracht van de overheid tot doel heeft gegevens
      over vermoedelijke bijwerkingen van geneesmiddelen waarvoor een handelsvergunning is verleend, te verzamelen, te
      registreren en te analyseren een overzicht van gevonden signalen aan het College ter Beoordeling van Geneesmiddelen
      ter kennis gesteld. Deze informatie is voor iedereen toegankelijk.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel78
  - number: '79.1'
    text: |-
      Het College stelt het Bureau, de desbetreffende bevoegde autoriteiten van de andere lidstaten en de houder van de
      handelsvergunning voor het desbetreffende geneesmiddel onmiddellijk en in elk geval binnen vijftien dagen in kennis
      van een vermoedelijke ernstige bijwerking die zich in Nederland heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel79
  - number: '79.2'
    text: |-
      Indien het College van mening is dat een vergunning voor het in de handel brengen van een geneesmiddel moet worden
      geschorst, ingetrokken of gewijzigd, stelt hij het Bureau, de bevoegde autoriteiten van de andere lidstaten en de
      houder van de handelsvergunning hiervan onmiddellijk in kennis.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel79
  - number: '79.3'
    text: |-
      Indien zulks in het belang van de volksgezondheid dringend noodzakelijk is, kan het College een handelsvergunning
      onmiddellijk schorsen. Het College stelt het Bureau, de Europese Commissie en de desbetreffende bevoegde
      autoriteiten van de andere lidstaten op de eerste werkdag, volgend op de dag van de schorsing, hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel79
  - number: '80.2'
    text: |-
      Bij ministeriële regeling kunnen voorts eisen worden gesteld aan de vorm waarin een melding van vermoedelijke
      ernstige of onverwachte bijwerkingen door de houder van de handelsvergunning wordt gedaan. Tevens kunnen bij de
      regeling regels worden gesteld ter zake van de vorm waarin andere gegevens dan die, bedoeld in de eerste volzin,
      krachtens [artikel 77][ref1] of [79][ref2] moeten worden gemeld door of aan het College dan wel aan het Bureau of
      de desbetreffende bevoegde autoriteit van een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel79
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '77'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '79'
        hoofdstuk: '8'
  - number: '81'
    text: |-
      Dit hoofdstuk is niet van toepassing op homeopathische geneesmiddelen als bedoeld in [artikel 42, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '82'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel82
  - number: 82.a
    text: |-
      beroepsbeoefenaar: een arts, apotheker, tandarts, verloskundige, verpleegkundige als bedoeld in
      [artikel 36, veertiende lid, onder d, van de Wet op de beroepen in de individuele gezondheidszorg][ref1],
      apothekersassistent of een natuurlijke persoon of een rechtspersoon als bedoeld in
      [artikel 62, eerste lid, onder d][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel62
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '62'
        hoofdstuk: '6'
  - number: 82.b
    text: |-
      ondernemer: de houder van een handelsvergunning of van een vergunning als bedoeld in
      [artikel 18, eerste lid, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '83'
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel83
  - number: 83.a
    text: geneesmiddelen voor onderzoek;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel83
  - number: 83.b
    text: de bijsluiter bij en de etikettering van een geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel83
  - number: 83.c
    text: een brief of een emailbericht ter inwilliging van een verzoek om informatie over een geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel83
  - number: 83.d
    text: informatie betreffende gezondheid of ziekte bij de mens.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel83
  - number: '84.1'
    text: |-
      Reclame voor dan wel gunstbetoon met betrekking tot een geneesmiddel waarvoor geen handelsvergunning is verleend,
      is verboden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel84
  - number: '84.2'
    text: |-
      Andere gegevens dan die, bedoeld in [artikel 73, tweede lid, onder a tot en met l][ref1], worden niet in reclame
      voor homeopathische geneesmiddelen als bedoeld in [artikel 42, derde lid][ref2], gebruikt. Alle aspecten van
      reclame voor andere geneesmiddelen dan die, bedoeld in de eerste volzin, zijn in overeenstemming met de gegevens
      die in de samenvatting van de productkenmerken van het desbetreffende geneesmiddel zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '73'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '84.3'
    text: |-
      Reclame die het rationele gebruik van een geneesmiddel niet bevordert wegens het ontbreken van een objectieve
      voorstelling van zaken, is verboden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel84
  - number: '84.4'
    text: Misleidende reclame is verboden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel84
  - number: '85'
    text: 'Publieksreclame is verboden voor geneesmiddelen die:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel85
  - number: 85.a
    text: uitsluitend op recept ter hand mogen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel85
  - number: 85.b
    text: |-
      zonder recept ter hand mogen worden gesteld en middelen bevatten als bedoeld in [lijst I][ref1] of
      [II van de Opiumwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: '86'
    text: 'Publieksreclame voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel86
  - number: 86.a
    text: |-
      de reclame is zodanig weergegeven dat de boodschap als reclame overkomt bij het publiek en voor het publiek
      volstrekt duidelijk is dat het om een geneesmiddel gaat;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel86
  - number: 86.b
    text: |-
      de reclame bevat de naam alsmede de algemene benaming indien het geneesmiddel slechts één werkzaam bestanddeel
      bevat;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel86
  - number: 86.c
    text: de reclame bevat gegevens die voor een goed gebruik van het geneesmiddel onontbeerlijk zijn;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel86
  - number: 86.d
    text: de reclame bevat het uitdrukkelijke verzoek om de bijsluiter dan wel de tekst op de buitenverpakking te lezen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel86
  - number: '87'
    text: |-
      Reclame voor een kruidengeneesmiddel als bedoeld in [artikel 42, achtste lid][ref1], bevat de vermelding dat het om
      een traditioneel kruidengeneesmiddel gaat, bij welke indicaties het wordt gebruikt en dat de indicaties uitsluitend
      zijn gebaseerd op een reeds lang bestaand gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '88'
    text: |-
      Publieksreclame is verboden indien deze vermeldt dan wel door zijn formuleringen of afbeeldingen de indruk wekt
      dat:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel88
  - number: 88.a
    text: het gebruik van het geneesmiddel een geneeskundig onderzoek of een chirurgische ingreep overbodig maakt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel88
  - number: 88.b
    text: |-
      het geneesmiddel geen bijwerkingen kent of dat de werking beter is dan of gelijk is aan de werking van een ander
      geneesmiddel dan wel een andere geneeskundige behandeling;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel88
  - number: 88.c
    text: de normale goede gezondheid van een persoon door het gebruik van het geneesmiddel kan worden verbeterd;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel88
  - number: 88.d
    text: de normale goede gezondheid van een persoon kan worden aangetast wanneer het geneesmiddel niet wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel88
  - number: 88.e
    text: |-
      de veiligheid of de werkzaamheid van het geneesmiddel te danken is aan het feit dat het om een natuurlijke stof
      gaat.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel88
  - number: '89'
    text: 'Publieksreclame is voorts verboden indien:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.a
    text: deze uitsluitend of voornamelijk is gericht op kinderen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.b
    text: |-
      deze een aanprijzing dan wel een verwijzing naar een aanprijzing bevat van wetenschapsbeoefenaren,
      beroepsbeoefenaren of bij het publiek bekende personen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.c
    text: daarin het geneesmiddel gelijk wordt gesteld met een voedingsmiddel, een cosmetisch product of andere waren;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.d
    text: |-
      deze door de beschrijving of de gedetailleerde uitbeelding van een ziektegeschiedenis tot een verkeerde
      zelfdiagnose kan leiden;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.e
    text: daarin op misleidende wijze wordt verwezen naar genezenverklaringen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.f
    text: |-
      daarin op schrikwekkende of misleidende wijze gebruik wordt gemaakt van uitbeeldingen van veranderingen van het
      menselijk lichaam ten gevolge van een ziekte of letsel of van de werking van het geneesmiddel in het menselijk
      lichaam;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: 89.g
    text: |-
      daarin wordt aangegeven dat op verstrekking van het geneesmiddel aanspraak bestaat krachtens de wettelijke sociale
      ziektekostenverzekeringen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel89
  - number: '90'
    text: |-
      De verboden, bedoeld in de [artikelen 85][ref1], [88, onder d][ref2], en [89, onder g][ref3], gelden niet voor
      publieksreclame ter bevordering van deelname aan een nationaal vaccinatieprogramma waarop aanspraak bestaat
      krachtens de [Algemene Wet Bijzondere Ziektekosten][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '85'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '88'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021505
        artikel: '89'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002614
  - number: '91.1'
    text: |-
      Onverminderd [artikel 84][ref1], vermeldt reclame die is gericht op beroepsbeoefenaren:


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel84
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '84'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 91.1.a
    text: |-
      de samenstelling, therapeutische indicaties, contra-indicaties, werking en bijwerkingen van het geneesmiddel die
      overeenstemmen met de samenvatting van de kenmerken van het geneesmiddel;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: 91.1.b
    text: de indeling van het geneesmiddel met betrekking tot de terhandstelling.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: '91.2'
    text: |-
      In documenten vastgelegde reclame die aan beroepsbeoefenaren wordt overhandigd of toegezonden, vermeldt, behalve de
      in het eerste lid bedoelde gegevens, tevens:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: 91.2.a
    text: |-
      of op verstrekking van het geneesmiddel aanspraak bestaat krachtens de wettelijke sociale
      ziektekostenverzekeringen;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: 91.2.b
    text: de datum waarop de documenten zijn opgesteld dan wel laatstelijk zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: '91.3'
    text: |-
      De gegevens, opgenomen in documenten als bedoeld in het tweede lid, zijn zodanig exact, actueel, verifieerbaar en
      volledig dat de beroepsbeoefenaar zich een oordeel kan vormen over de therapeutische waarde van het geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: '91.4'
    text: |-
      In documenten als bedoeld in het tweede lid, opgenomen citaten dan wel tabellen of andere illustraties die zijn
      ontleend aan wetenschappelijke publicaties of medische tijdschriften, zijn exact weergegeven met nauwkeurige
      bronvermelding.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: '91.5'
    text: |-
      De in de documenten vastgelegde teksten, met uitzondering van opschriften, worden in dezelfde lettergrootte
      weergegeven. Voorts wordt de tekst betreffende een onderwerp niet onderbroken door teksten of afbeeldingen die
      betrekking hebben op een ander onderwerp.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel91
  - number: '92.1'
    text: 'Het is verboden gratis monsters te verstrekken, tenzij:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: 92.1.a
    text: |-
      daartoe een gedateerde en persoonlijk ondertekende aanvraag door een arts, tandarts of verloskundige is ingediend
      bij de betrokken ondernemer,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: 92.1.b
    text: het monster niet groter is dan de kleinste verpakking die in de handel is,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: 92.1.c
    text: |-
      aan een arts, tandarts of verloskundige niet meer dan 2 monsters van hetzelfde geneesmiddel per kalenderjaar worden
      verstrekt,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: 92.1.d
    text: op het monster is vermeld dat het gratis is en niet verkocht mag worden,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: 92.1.e
    text: bij het monster een exemplaar van de samenvatting van de kenmerken van het geneesmiddel is gevoegd, en
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: 92.1.f
    text: |-
      degene die het gratis monster verstrekt, een administratie bijhoudt waarin is vastgelegd aan wie, op welke datum en
      in welke hoeveelheid het is verstrekt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
  - number: '92.2'
    text: |-
      Het is verboden aan een beroepsbeoefenaar monsters te verstrekken die middelen bevatten als bedoeld in
      [lijst I][ref1] of [II van de Opiumwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941
      [ref2]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001941
      - id: ref2
        bwb_id: BWBR0001941
  - number: '93'
    text: |-
      De ondernemer draagt ervoor zorg dat degene die in opdracht van of namens hem artsen, apothekers, tandartsen of
      verloskundigen bezoekt om reclame te maken voor en informatie te verstrekken over een geneesmiddel:
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel93
  - number: 93.a
    text: |-
      een zodanige opleiding tot artsenbezoeker met goed gevolg heeft afgesloten dat hij beschikt over voldoende
      wetenschappelijke kennis om over de geneesmiddelen waarvoor hij reclame maakt, nauwkeurig en zo volledig mogelijk
      informatie te geven;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel93
  - number: 93.b
    text: |-
      bij elk bezoek aan een arts, apotheker, tandarts of verloskundige de samenvatting van de kenmerken van het
      geneesmiddel aan de betrokkene verstrekt of te diens beschikking houdt;
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel93
  - number: 93.c
    text: |-
      aan de in [artikel 95][ref1] bedoelde wetenschappelijke dienst de aan hem door een arts, apotheker, tandarts of
      verloskundige verstrekte inlichtingen meldt over ongewenste bijwerkingen van geneesmiddelen waarvoor hij reclame
      maakt, en over alle andere aspecten die verband houden met het gebruik of de werking van die geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel95
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '95'
        hoofdstuk: '9'
        paragraaf: '5'
  - number: '94'
    text: 'Gunstbetoon is verboden, tenzij:'
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel94
  - number: 94.a
    text: |-
      tegenover de aan een beroepsbeoefenaar in het vooruitzicht gestelde, aangeboden of toegekende gelden of op geld
      waardeerbare diensten of goederen dan wel tegenover zodanige door een beroepsbeoefenaar aanvaarde of ontvangen
      gelden, diensten of goederen, op basis van een schriftelijke overeenkomst door de beroepsbeoefenaar een prestatie
      wordt verricht die in een redelijke verhouding staat tot die gelden, diensten of goederen en van belang is voor de
      uitoefening van de geneeskunst, de farmacie, de tandheelkunst of de verloskunst,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel94
  - number: 94.b
    text: |-
      het een bijeenkomst of manifestatie betreft waarbij de gastvrijheid die wordt geboden, beperkt blijft tot hetgeen
      strikt noodzakelijk is om aan de bijeenkomst of de manifestatie te kunnen deelnemen,
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel94
  - number: 94.c
    text: |-
      het geld of op geld waardeerbare diensten of goederen, niet zijnde een bijeenkomst of een manifestatie, betreft
      waartegenover geen prestatie van de beroepsbeoefenaar staat, die een geringe waarde hebben en relevant zijn voor de
      uitoefening van de geneeskunst, de farmacie, de tandheelkunst of de verloskunst, of
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel94
  - number: 94.d
    text: |-
      het om kortingen en bonussen gaat met betrekking tot de inkoop van geneesmiddelen door personen en rechtspersonen
      als bedoeld in [artikel 62, eerste lid, onder a, b en d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel62
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '62'
        hoofdstuk: '6'
  - number: '95.1'
    text: |-
      De houder van de handelsvergunning beschikt over een wetenschappelijke dienst die is belast met de voorlichting
      over de geneesmiddelen die hij in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel95
  - number: '95.2'
    text: |-
      De ondernemer houdt een kopie van elke reclameboodschap die van hem is uitgegaan, met vermelding van de categorie
      van personen, rechtspersonen daaronder begrepen, tot wie de reclame was gericht, van de wijze waarop de reclame is
      verspreid en van de datum van eerste verspreiding, ter beschikking van de ambtenaren van het Staatstoezicht op de
      volksgezondheid die met het toezicht op de naleving van deze wet zijn belast of zendt dit, desgevraagd, toe.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel95
  - number: '96'
    text: Het uitzenden van telewinkelboodschappen is verboden.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel96
  - number: '97.1'
    text: |-
      Onze Minister draagt ervoor zorg dat aan een verzoek van het Bureau of een instantie die in een andere lidstaat
      is belast met het verlenen van vergunningen als bedoeld in [artikel 18, eerste lid][ref1], om informatie te
      verstrekken over de naleving van de wettelijke verplichtingen of de aan een vergunning verbonden voorwaarden die
      op een fabrikant of een groothandelaar van toepassing zijn, zo spoedig mogelijk gevolg wordt gegeven. Hetzelfde
      geldt voor een verzoek van het Bureau of van zodanige instantie om informatie over een certificaat als bedoeld in
      [artikel 99, tweede of vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel99
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '99'
        hoofdstuk: '10'
  - number: '97.2'
    text: |-
      Het College draagt ervoor zorg dat aan een verzoek van het Bureau of een instantie die in een andere lidstaat
      is belast met het verlenen van vergunningen voor het in de handel brengen van geneesmiddelen, om informatie te
      verstrekken over de naleving van de wettelijke verplichtingen of de aan een handelsvergunning verbonden voorwaarden
      die op de houder van een handelsvergunning van toepassing zijn, zo spoedig mogelijk gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
  - number: '97.3'
    text: |-
      Aan een met redenen omkleed verzoek om een afschrift van een verslag als bedoeld in [artikel 99, tweede lid][ref1],
      wordt terstond gevolg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel99
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '99'
        hoofdstuk: '10'
  - number: '97.4'
    text: |-
      Een certificaat dat in een andere lidstaat is verstrekt krachtens een bepaling die materieel overeenkomt
      met [artikel 99, derde of vierde lid][ref1], heeft dezelfde rechtsgevolgen als een in Nederland krachtens de
      desbetreffende bepaling afgegeven certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel99
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '99'
        hoofdstuk: '10'
  - number: '97.5'
    text: |-
      Een verslag dat in een andere lidstaat is opgesteld krachtens een bepaling die materieel overeenkomt met
      [artikel 99, tweede lid][ref1], heeft dezelfde rechtsgevolgen als een in Nederland krachtens die bepaling opgesteld
      verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel99
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '99'
        hoofdstuk: '10'
  - number: '97.6'
    text: |-
      Indien Onze Minister om redenen die verband houden met de volksgezondheid, van mening is dat een in een andere
      lidstaat afgegeven certificaat als bedoeld in het vierde lid, of een in een andere lidstaat opgesteld verslag als
      bedoeld in het vijfde lid, voor Nederland niet dezelfde rechtsgevolgen dient te hebben als de rechtsgevolgen voor
      de andere lidstaat, stelt hij de Commissie, het Bureau en de betrokken lidstaat daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
  - number: '97.7'
    text: |-
      Indien een andere lidstaat van mening is dat een in Nederland afgegeven certificaat als bedoeld in het vierde lid,
      of een in Nederland opgesteld verslag als bedoeld in [artikel 99, tweede lid][ref1], niet dezelfde rechtsgevolgen
      dient te hebben als de rechtsgevolgen daarvan in Nederland en de Commissie de inspecteur die de inspectie heeft
      uitgevoerd, verzoekt een nieuwe inspectie uit te voeren, wordt aan dit verzoek gevolg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel99
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '99'
        hoofdstuk: '10'
  - number: '97.8'
    text: |-
      De hoofdinspecteur, bedoeld in [99, eerste lid][ref1], draagt ervoor zorg dat een besluit tot het uit de handel
      nemen of het verbieden van de aflevering een geneesmiddel terstond ter kennis wordt gebracht van het Bureau. Indien
      zodanig besluit een weerslag kan hebben op de volksgezondheid in een derde land, draagt Onze Minister ervoor zorg
      dat die informatie ook ter kennis wordt gebracht van de Wereldgezondheidsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel99
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '99'
        hoofdstuk: '10'
  - number: '98.1'
    text: |-
      Onze Minister draagt ervoor zorg dat gevolg wordt gegeven aan een verzoek van een overheidsinstantie van een
      derde land, van een fabrikant of van een groothandelaar die geneesmiddelen uitvoert, om de vergunning voor het
      bereiden van geneesmiddelen van een fabrikant te certificeren. Het certificeren geschiedt overeenkomstig de
      administratieve voorschriften van de Wereldgezondheidsorganisatie ter zake en gaat vergezeld van een afschrift van
      de overeenkomstig [artikel 46, eerste lid][ref1], goedgekeurde samenvatting van de kenmerken van het geneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel46
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '98.2'
    text: |-
      Indien de fabrikant niet beschikt over een handelsvergunning, legt hij, met het oog op een certificering als
      bedoeld in het eerste lid, desgevraagd, aan Onze Minister een verklaring voor waarin de reden daarvan wordt
      uitgelegd.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel98
  - number: '99.1'
    text: |-
      De hoofdinspecteur die aan het hoofd staat van het onderdeel van het Staatstoezicht op de volksgezondheid dat is
      aangewezen krachtens het besluit van Onze Minister, bedoeld in [artikel 100, eerste lid][ref1], draagt ervoor zorg
      dat gevolg wordt gegeven aan het verzoek van de Commissie, het Bureau, de toezichthoudende instantie van een andere
      lidstaat of de instantie die in een andere lidstaat bevoegd is tot het verlenen van handelsvergunningen, om een
      inspectie uit te voeren bij de fabrikant van een bepaald geneesmiddel, bij degene die een werkzame grondstof voor
      een bepaald geneesmiddel bereidt, niet zijnde de fabrikant, of bij de houder van de handelsvergunning voor een
      bepaald geneesmiddel, indien de verzoeker het vermoeden heeft geuit dat de voorschriften inzake goede praktijken
      bij de vervaardiging, bedoeld in [artikel 27][ref2], niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel27
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '100'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '99.2'
    text: |-
      De hoofdinspecteur, bedoeld in het eerste lid, draagt ervoor zorg dat van een inspectie naar de naleving van de
      voorschriften inzake goede praktijken bij de vervaardiging, verslag wordt gemaakt en dat de inhoud daarvan wordt
      meegedeeld aan degene bij wie de inspectie is verricht. Hetzelfde geldt indien een inspectie is uitgevoerd naar de
      naleving van de bepalingen inzake geneesmiddelenbewaking.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel99
  - number: '99.3'
    text: |-
      Indien een inspectie is uitgevoerd bij een natuurlijke persoon of een rechtspersoon die in een derde land
      geneesmiddelen geheel of gedeeltelijk vervaardigt dan wel grondstoffen als bedoeld in het eerste lid vervaardigt
      en wiens producten worden ingevoerd, draagt de hoofdinspecteur ervoor zorg dat, indien de betrokken persoon bij
      de vervaardiging voorschriften naleeft die gelijkwaardig zijn aan die, bedoeld in [artikel 27][ref1], binnen
      negentig dagen, te rekenen vanaf de dag van de beëindiging van de inspectie, een certificaat wordt verstrekt aan de
      betrokkene waarin de naleving is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel27
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '99.4'
    text: |-
      Indien een inspectie is uitgevoerd in het kader van de krachtens het verdrag, bedoeld in
      [artikel 1, eerste lid, onder f][ref1], vastgestelde procedure voor het verkrijgen van een certificaat van
      overeenstemming met de monografieën van de Europese Farmacopee, draagt de hoofdinspecteur ervoor zorg dat er een
      certificaat wordt opgesteld en overgelegd aan degene die om de inspectie heeft gevraagd. Een afschrift van het
      certificaat wordt verstrekt aan degene bij wie de inspectie is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
        hoofdstuk: I
  - number: '99.5'
    text: |-
      De hoofdinspecteur draagt ervoor zorg dat een afschrift van een certificaat als bedoeld in het derde en vierde
      lid, wordt gezonden aan het Bureau met het verzoek om dit op te nemen in de door het Bureau opgezette communautaire
      databank voor zodanige certificaten.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel99
  - number: '99.6'
    text: |-
      Indien tijdens een inspectie is geconstateerd dat een fabrikant zich niet houdt aan de beginselen inzake goede
      praktijken bij de vervaardiging, bedoeld in [artikel 27][ref1], draagt de hoofdinspecteur er voorts voor zorg dat
      deze informatie wordt gezonden aan het Bureau teneinde dit te doen opnemen in de databank, bedoeld in het vijfde
      lid, en aan het College.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel27
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '100.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid die daartoe bij besluit van Onze Minister zijn aangewezen. Van zodanig besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel100
  - number: '100.2'
    text: |-
      In afwijking van het eerste lid, zijn met het toezicht op de naleving van deze wet aan boord van schepen die zijn
      bestemd en worden gebruikt voor de bedrijfsmatige zeevaart of zeevisserij belast de bij besluit van Onze Minister
      van Verkeer en Waterstaat aangewezen ambtenaren van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel100
  - number: '100.3'
    text: |-
      In afwijking van het eerste lid, is Onze Minister van Defensie belast met het toezicht op de naleving van deze wet
      voor zover betrekking hebbende op haar uitvoering binnen de Nederlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel100
  - number: '100.4'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder Onze Minister tevens verstaan Onze Minister van Verkeer en
      Waterstaat of Onze Minister van Defensie voor zover het toezicht op de naleving van deze wet plaatsvindt op grond
      van het tweede onderscheidenlijk het derde lid.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel100
  - number: '100.5'
    text: |-
      De ambtenaren, bedoeld in het eerste en tweede, en de ambtenaren die door en namens Onze Minister van Defensie
      belast zijn met de in het derde lid bedoelde taak, hebben geen financiële belangen of andere belangen in de
      farmaceutische industrie die hun onpartijdigheid in het gedrang kunnen brengen. Zij verstrekken jaarlijks een
      verklaring omtrent hun financiële belangen.
    url: https://wetten.overheid.nl/BWBR0021505/2009-07-01#Artikel100
  - number: '101.1'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen van ten hoogste € 450 000 ter zake van overtreding van het
      bepaalde bij of krachtens [artikel 18][ref1], [26][ref2], [27][ref3], [28][ref4], [29][ref5], [30][ref6],
      [31][ref7], [32][ref8], [33][ref9], [34][ref10], [35][ref11], [36][ref12], [37][ref13], [38][ref14], [39][ref15],
      [40][ref16], [48][ref17], [49][ref18], [50][ref19], [61][ref20], [62][ref21], [64][ref22], [65][ref23],
      [66][ref24], [69][ref25], [70][ref26], [71][ref27], [72][ref28], [73][ref29], [74][ref30], [75][ref31],
      [77][ref32], [80][ref33], [84][ref34], [85][ref35], [86][ref36], [87][ref37], [88][ref38], [89][ref39],
      [91][ref40], [92][ref41], [93][ref42], [94][ref43], [95][ref44], [96][ref45] of [120][ref46].


