preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen met betrekking tot de
    bodemproductie in geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel1
  - number: 1.b
    text: |-
      "bodemproductie": elke handeling, welke een onderdeel uitmaakt of kan uitmaken van den akkerbouw, den weidebouw,
      den tuinbouw, de ooftteelt, de veeteelt, de pluimveeteelt, de houtteelt en den boschbouw.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel1
  - number: '5'
    text: |-
      Bij de uitvoering van deze wet doet Onze Minister zich bijstaan door een regeeringscommissaris voor de
      bodemproductie; deze wordt door Ons benoemd, geïnstrueerd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel5
  - number: '16'
    text: Deze wet kan worden aangehaald onder den titel "Bodemproductiewet 1939".
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel16
  - number: '17.1'
    text: |-
      Deze wet treedt in werking, voor wat betreft de [artikelen 1][ref1], [5][ref2], [6][ref3] en [7][ref4], met
      ingang van den dag na dien harer afkondiging.


      [ref1]: https://wetten.overheid.nl/BWBR0001996#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001996#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001996#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001996#Artikel7
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001996
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001996
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001996
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001996
        artikel: '7'
  - number: '17.2'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de overige artikelen in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
  - number: '17.3'
    text: |-
      Wanneer het in het tweede lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
  - number: '17.4'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het tweede lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
  - number: '17.5'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het tweede lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
  - number: '17.6'
    text: |-
      Het besluit, bedoeld in het tweede, vierde en vijfde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
  - number: '17.7'
    text: Het besluit, bedoeld in het tweede, vierde en vijfde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0001996/2012-02-08#Artikel17
