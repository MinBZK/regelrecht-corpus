  - number: '3'
    text: |-
      Bij of krachtens algemeenen maatregel van bestuur kunnen algemeene en bijzondere voorschriften worden gegeven met
      betrekking tot de bodemproductie en de bestemming van den bodem.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel3
  - number: '4'
    text: |-
      In verband met de in het vorige artikel bedoelde voorschriften kunnen uitkeeringen in geld worden gedaan
      overeenkomstig bij of krachtens algemeenen maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel4
  - number: '5'
    text: |-
      Bij de uitvoering van deze wet doet Onze Minister zich bijstaan door een regeeringscommissaris voor de
      bodemproductie; deze wordt door Ons benoemd, geïnstrueerd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel5
  - number: '8'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de krachtens deze wet
      gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel8
  - number: '10.1'
    text: |-
      Indien de regeeringscommissaris voor de bodemproductie of door hem gemachtigde personen het voor de uitvoering van
      deze wet noodig achten iemands grond te betreden of bedrijfsgebouwen binnen te gaan, moeten zoowel de eigenaren als
      de gebruikers van dien grond en die bedrijfsgebouwen dit te allen tijde gedoogen.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel10
  - number: '10.2'
    text: |-
      Worden de in het vorige lid bedoelde handelingen niet gedoogd, dan wordt de tusschenkomst van den burgemeester
      of van den kantonrechter ingeroepen, op wiens bevel het verrichten der handelingen, desnoods met behulp van den
      sterken arm, wordt mogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel10
  - number: 10a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de personen, die
      daartoe zijn aangewezen bij besluit van Onze Minister of bij besluit van de in [artikel 5][ref1] bedoelde
      regeringscommissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001996#Artikel5
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001996
        artikel: '5'
  - number: '16'
    text: Deze wet kan worden aangehaald onder den titel "Bodemproductiewet 1939".
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel16
  - number: '17.1'
    text: |-
      Deze wet treedt in werking, voor wat betreft de [artikelen 1][ref1], [5][ref2], [6][ref3] en [7][ref4], met
      ingang van den dag na dien harer afkondiging.


      [ref1]: https://wetten.overheid.nl/BWBR0001996#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001996#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001996#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001996#Artikel7
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001996
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001996
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001996
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0001996
        artikel: '7'
  - number: '17.2'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de overige artikelen in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
  - number: '17.3'
    text: |-
      Wanneer het in het tweede lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
  - number: '17.4'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het tweede lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
  - number: '17.5'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het tweede lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
  - number: '17.6'
    text: |-
      Het besluit, bedoeld in het tweede, vierde en vijfde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
  - number: '17.7'
    text: Het besluit, bedoeld in het tweede, vierde en vijfde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0001996/2019-01-01#Artikel17
