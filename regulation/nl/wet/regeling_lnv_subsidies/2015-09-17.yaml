preamble:
  text: |-
    Gelet op:

    – verordening (EG) nr. 70/2001 van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de
    toepassing van de artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote ondernemingen
    (PbEG L 10);

    – verordening (EG) nr. 1698/2005 van de Raad van de Europese Unie van 20 september 2005 inzake steun voor
    plattelandsontwikkeling uit het Europees Landbouwfonds voor plattelandsontwikkeling (ELFPO) (PbEU L 277);

    – verordening (EG) nr. 1857/2006 van de Commissie van de Europese Gemeenschappen van 15 december 2006 betreffende
    de toepassing van de artikelen 87 en 88 van het Verdrag op staatssteun voor kleine en middelgrote ondernemingen die
    landbouwproducten produceren, en tot wijziging van verordening (EG) nr. 70/2001 (PbEU L 358);

    – de artikelen 2, 4 en 7 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In deze regeling wordt verstaan onder: - bancair aansprakelijk vermogen: a. het eigen vermogen van de onderneming
      van de aanvrager; b. zekerheidsstelling door derden ten behoeve van de onderneming van de aanvrager, en c.
      vermogensbestanddelen van de aanvrager privé, bestaande uit: 1. bij eenmanszaken, vennootschappen onder firma
      en maatschappen: privé-bezittingen; 2. bij besloten vennootschappen met beperkte aansprakelijkheid of naamloze
      vennootschappen: privé-bezittingen voor zover deze door zekerheidsstelling ten behoeve van de bank zijn verbonden;
      3. achtergestelde leningen.
        - bank: binnen het grondgebied van de Europese Unie gevestigde bank die is toegelaten het bedrijf van bank uit
      te oefenen;
        - Europese subsidies: subsidies: a) verstrekt op basis van of in nauwe samenhang met een bindend besluit van de
      Raad, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Unie; b) verstrekt met
      het oog op cofinanciering van een door de Raad of de Commissie van de van de Europese Unie goedgekeurd programma,
      of c) die als staatssteun als bedoeld in artikel 107 van het Verdrag betreffende de werking van de Europese Unie
      zijn aan te merken;
        - EG-maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 288 van het Verdrag betreffende de
      werking van de Europese Unie;
        - lening: door een bank verstrekte geldlening, niet zijnde een rekening-courantkrediet;
        - liquiditeitstoename: som van het bedrijfsresultaat, de afschrijving en de privé-toevoegingen verminderd met de
      aflossingen, de privé-onttrekkingen en de vervangingsinvesteringen;.
        - landbouwonderneming: onderneming waarin de primaire productie van landbouwproducten plaatsvindt;
        - landbouwproducten: producten als bedoeld in bijlage I bij het Verdrag betreffende de werking van de Europese
      Unie, met uitzondering van de producten genoemd in hoofdstuk 3 van die bijlage;
        - landbouwsector: gehele complex van landbouwondernemingen, landbouwproducten verwerkende ondernemingen en aan de
      landbouw gerelateerde afzet, handel, dienstverlening, logistiek, en toeleverende industrie;
        - Minister: Minister van Economische Zaken;
        - plattelandsontwikkelingsprogramma: plattelandsontwikkelingsprogramma als bedoeld in artikel 15, eerste lid, van
      verordening (EG) nr. 1698/2005, van Nederland;
        - probleemgebied: gebied zoals aangewezen in bijlage 2 bij maatregelfiche 212 van het
      plattelandsontwikkelingsprogramma;
        - project: geheel van activiteiten gericht op concrete resultaten ter verwezenlijking van de in deze regeling
      omschreven subsidiedoelstellingen;
        - Richtlijn 2001/80/EG: Richtlijn 2001/80/EG van het Europees Parlement en de Raad van 23 oktober 2001 inzake de
      beperking van de emissies van bepaalde verontreinigende stoffen in de lucht door grote stookinstallaties (PbEU
      L 309);
        - Rijksdienst voor Ondernemend Nederland: Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische
      Zaken;
        - [verordening (EG) nr. 1698/2005](32005R1698): [verordening (EG) nr. 1698/2005](32005R1698) van de Raad van
      de Europese Unie van 20 september 2005 inzake steun uit het Europees Landbouwfonds voor plattelandsontwikkeling
      (ELFPO) (PbEU L 277);
        - verordening (EG) nr. 1857/2006: verordening (EG) nr. 1857/2006 van de Commissie van 15 december 2006 betreffende
      de toepassing van de artikelen 87 en 88 van het Verdrag op staatssteun voor kleine en middelgrote ondernemingen die
      landbouwproducten produceren, en tot wijziging van Verordening (EG) nr. 70/2001;
        - *de-minimis verordening:* verordening (EG) nr. 1535/2007 van de Commissie van 20 december 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector (PbEU
      L 337);
        - verordening (EG) nr. 800/2008: verordening (EG) nr. 800/2008 van de Commissie van 6 augustus 2008 waarbij
      bepaalde categorieën steun op grond van de artikelen 87 en 88 van het Verdrag met de gemeenschappelijke markt
      verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’) (PbEU L 214);
        - visserijproducten: producten, genoemd in hoofdstuk 3 van bijlage I bij het Verdrag betreffende de werking van de
      Europese Unie;
        - visserijsector: gehele complex van ondernemingen, gericht op de vangst of de primaire productie van
      visserijproducten, visserijproducten verwerkende ondernemingen en aan de visserij gerelateerde afzet, handel,
      dienstverlening, logistiek, en toeleverende industrie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel11
  - number: 1:2.1
    text: |-
      Op grond van deze regeling kan op aanvraag door de Minister subsidie worden verstrekt voor de uitvoering van
      activiteiten in Nederland die bijdragen aan:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel12
  - number: 1:2.1.a
    text: de verbetering van het concurrentievermogen van de landbouwsector, bosbouwsector of visserijsector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel12
  - number: 1:2.1.b
    text: |-
      het behoud of de verbetering van de natuur en het landelijk en cultureel erfgoed, de ontwikkeling van
      landschapskwaliteit dan wel bevordering van kennis en deskundigheid op het gebied van de recreatie, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel12
  - number: 1:2.1.c
    text: een duurzame exploitatie van de levende aquatische rijkdommen en een duurzame aquacultuur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel12
  - number: 1:2.1.d
    text: |-
      het landbouwonderwijs en onderzoek op het terrein van de landbouw, de bosbouw, de natuur, het landschap, de
      visserij en de openluchtrecreatie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel12
  - number: 1:2.2
    text: Subsidie kan uitsluitend worden verstrekt voor activiteiten die zijn aangevangen op of na de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel12
  - number: 1:3.1
    text: |-
      Op grond van deze regeling kan uitsluitend subsidie worden verstrekt indien de Minister de mogelijkheid tot het
      doen van een aanvraag tot subsidieverlening, subsidievaststelling of subsidieverstrekking heeft opengesteld door
      vaststelling van een subsidieplafond en een periode voor indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel13
  - number: 1:3.2
    text: |-
      De Minister kan de openstelling beperken tot bepaalde activiteiten, categorieën van aanvragers of een bepaald
      aantal aanvragen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel13
  - number: 1:3.3
    text: |-
      De Minister kan verschillende subsidieplafonds vaststellen voor verschillende activiteiten of categorieën van
      aanvragers.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel13
  - number: 1:3.4
    text: De Minister maakt een besluit als bedoeld in dit artikel bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel13
  - number: 1:3.5
    text: De Minister wijst Europese subsidies aan bij de openstelling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel13
  - number: 1:4.1
    text: |-
      De Minister rangschikt aanvragen tot subsidieverlening die in een zelfde aanvraagperiode zijn ingediend, waarbij
      een aanvraag hoger wordt gerangschikt naarmate de activiteit waarop deze betrekking heeft naar het oordeel van de
      Minister een grotere bijdrage levert aan de doelstelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel14
  - number: 1:4.2
    text: |-
      Volgens de rangschikking, bedoeld in het eerste lid, komt de hoogst gerangschikte aanvraag het eerst voor subsidie
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel14
  - number: 1:4.3
    text: |-
      De Minister kan één of meer beoordelingscommissies instellen die tot taak hebben aanvragen overeenkomstig het
      tweede lid te beoordelen en hierover advies uit te brengen aan de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel14
  - number: 1:4.4
    text: |-
      De beoordelingscommissie, bedoeld in het derde lid, kan de minister adviseren om een aanvraag tot subsidieverlening
      af te wijzen, indien deze aanvraag naar haar oordeel niet of niet voldoende bijdraagt aan het realiseren van de
      doelstelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel14
  - number: 1:5.1
    text: |-
      In afwijking van [artikel 1:4][ref1] is het onderhavige artikel van toepassing, ingeval dit in deze regeling van
      toepassing is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:5.2
    text: |-
      De Minister rangschikt aanvragen tot subsidieverlening die in een zelfde aanvraagperiode zijn ingediend door
      loting.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel15
  - number: 1:5.3
    text: |-
      Volgens de rangschikking, bedoeld in het tweede lid, komt de hoogst gerangschikte aanvraag het eerst voor subsidie
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel15
  - number: 1:6.1
    text: |-
      In afwijking van [artikel 1:4][ref1] is het onderhavige artikel van toepassing, ingeval dit in deze regeling van
      toepassing is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:6.2
    text: |-
      De Minister rangschikt aanvragen tot subsidieverlening die in een zelfde aanvraagperiode zijn ingediend in volgorde
      van ontvangst, waarbij aanvragen met dezelfde ontvangstdatum worden gerangschikt door loting voor zover op die
      datum het subsidieplafond wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel16
  - number: 1:6.3
    text: |-
      Volgens de rangschikking, bedoeld in het tweede lid, komt de hoogst gerangschikte aanvraag het eerst voor subsidie
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel16
  - number: 1:6.4
    text: |-
      Ingeval een aanvraag onvolledig is, wordt de aanvraag voor de toepassing van het tweede lid geacht te zijn
      ontvangen op de datum waarop de ontbrekende gegevens en bescheiden zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel16
  - number: 1:7.1
    text: |-
      Indien per categorie van aanvragers een subsidieplafond is vastgesteld, vindt rangschikking als bedoeld in
      [artikel 1:4][ref1], [1:5][ref2] of [1:6][ref3] per categorie plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:7.2
    text: |-
      Bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], kan de Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:7.2.a
    text: besluiten dat rangschikking plaatsvindt op een andere wijze dan bepaald in deze regeling;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel17
  - number: 1:7.2.b
    text: |-
      toetsingscriteria vaststellen voor rangschikking als bedoeld in [artikel 1:4, tweede lid][ref1], in voorkomend
      geval in aanvulling op toetsingscriteria die in deze regeling zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:8.1
    text: |-
      Een aanvraag tot subsidieverlening, subsidievaststelling of voorschotverlening wordt ingediend bij de Minister met
      gebruikmaking van een daartoe door de Minister verstrekt formulier.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel18
  - number: 1:8.2
    text: |-
      In aanvulling op de voorschriften, gesteld in deze regeling, kan de Minister bij de openstelling, bedoeld in
      [artikel 1:3, eerste lid][ref1], nadere voorschriften stellen over de indiening van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:9.1
    text: |-
      Bij een aanvraag tot subsidieverlening wordt in voorkomend geval mededeling gedaan van andere inkomsten, waaronder
      subsidies, waarmee de activiteit waarop de subsidie betrekking heeft wordt of zal worden gefinancierd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2
    text: |-
      Een aanvraag tot subsidieverlening voor een project gaat vergezeld van een projectplan, waarin ten minste is
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.a
    text: 'een beschrijving van het project, waaronder:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.a.1°
    text: de doelstellingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.a.2°
    text: |-
      een probleemanalyse waaruit onder andere de noodzaak van het project en de ter uitvoering daarvan te maken kosten
      blijkt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.a.3°
    text: de activiteiten en de wijze van uitvoering;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.a.4°
    text: |-
      voor zover van toepassing een overzicht van de aan het samenwerkingsverband deelnemende ondernemingen en de
      verdeling van verantwoordelijkheden, bevoegdheden en financiële verplichtingen van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.b
    text: informatie waaruit blijkt in hoeverre het project bijdraagt aan de doeleinden waarvoor de subsidie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.c
    text: |-
      een sluitende begroting voor het project, die een meerjarenbegroting is met liquiditeitsplanning per jaar voor
      zover het project langer dan een jaar duurt, met toelichting daarop;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.d
    text: criteria voor het toetsen van de resultaten van het project;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:9.2.e
    text: |-
      de verwachte realisatietermijn, met een beschrijving van het tijdpad en mijlpalen indien die termijn langer dan een
      jaar is.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel19
  - number: 1:10.1
    text: |-
      Bij toepassing van de procedure, bedoeld in [artikel 1:4][ref1], wordt een beschikking omtrent subsidieverlening
      gegeven binnen 22 weken na afloop van de periode voor het aanvragen van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:10.2
    text: |-
      Bij toepassing van de procedures, bedoeld in de [artikelen 1:5][ref1] en [1:6][ref2], wordt een beschikking omtrent
      subsidieverlening gegeven binnen 13 weken na afloop van de periode voor het aanvragen van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:11
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:12.1
    text: 'De subsidieontvanger voert de activiteiten waarvoor subsidie is verleend uit met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.1.a
    text: bij of krachtens deze regeling gestelde vereisten voor of voorwaarden bij subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.1.b
    text: overige wettelijke voorschriften die van toepassing zijn op die activiteiten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.2
    text: |-
      De subsidieontvanger voert een administratie die te allen tijde voldoende gegevens bevat voor een juist inzicht in
      de realisatie van de te subsidiëren activiteiten en voor een juiste subsidieverstrekking.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.3
    text: 'In de administratie, bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.3.a
    text: zijn alle ontvangsten en uitgaven vastgelegd met de onderliggende bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.3.b
    text: |-
      zijn bewijsstukken ten name van de subsidieontvanger aanwezig, waaruit de aard van geleverde goederen en diensten
      duidelijk blijkt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.4
    text: |-
      De administratie, bedoeld in het tweede lid, wordt ten minste gedurende vijf jaar na de datum van
      subsidievaststelling bewaard.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.5
    text: |-
      De subsidieontvanger verstrekt aan de ambtenaren, bedoeld in [artikel 6:1][ref1], desgevraagd de nodige gegevens en
      bescheiden waaruit blijkt dat wordt voldaan aan de vereisten, voorwaarden of voorschriften, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel6
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '6'
        hoofdstuk: '6'
  - number: 1:12.6
    text: |-
      [Artikel 8 van het Besluit aanbestedingsregels voor overheidsopdrachten][ref1] is van overeenkomstige toepassing op
      de verstrekking van opdrachten voor werken of diensten aan derden door een subsidieontvanger die geen aanbestedende
      dienst als bedoeld in [artikel 1, onderdeel r, van dat besluit][ref2] is.


      [ref1]: https://wetten.overheid.nl/BWBR0018607#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0018607
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018607
        artikel: '1'
  - number: 1:12.7
    text: |-
      De Minister kan de subsidieontvanger bij subsidieverlening ook andere verplichtingen opleggen die strekken tot
      verwezenlijking van het doel van de subsidie, waaronder een termijn waarbinnen de activiteiten waarop de subsidie
      betrekking heeft worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.8
    text: |-
      Indien de verleende subsidie minder bedraagt dan € 125.000 zijn het tweede tot en met het vierde lid niet
      van toepassing; in dat geval levert de subsidie-ontvanger tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling desgevraagd die gegevens die nodig zijn om aan te tonen dat de subsidiabele activiteiten
      waarvoor subsidie is verstrekt zijn verricht en dat is voldaan aan de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:12.9
    text: |-
      In afwijking van het achtste lid zijn het tweede tot en met het vierde lid van toepassing op verleende Europese
      subsidies lager dan € 125.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel112
  - number: 1:13.1
    text: |-
      Ingeval subsidie is verleend voor de uitvoering van een project, voert de subsidieontvanger dat project uit
      overeenkomstig het projectplan dat onderdeel vormt van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.2
    text: |-
      Ingeval een project langer dan een jaar duurt, informeert de subsidieontvanger de Minister telkens nadat een jaar
      is verstreken binnen drie maanden over de voortgang van het project door middel van een verslag, dat ten minste een
      beschrijving bevat van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.2.a
    text: de activiteiten die tot dan toe in het kader van het project zijn verricht;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.2.b
    text: de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het projectplan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.3
    text: 'De Minister kan goedkeuring verlenen aan een tussentijdse wijziging van een projectplan, tenzij de wijziging:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.3.a
    text: de doelstellingen, omschreven in het projectplan, betreft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.3.b
    text: |-
      verhoging van het bedrag van de subsidie of het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld, tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.4
    text: |-
      Bij een goedkeuring als bedoeld in het derde lid kan de Minister de beschikking tot subsidieverlening alsmede de
      aan de subsidieontvanger opgelegde verplichtingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.5
    text: |-
      Verslagen als bedoeld in het tweede lid en aanvragen tot een goedkeuring als bedoeld in het derde lid worden
      ingediend bij de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:13.6
    text: |-
      Bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], kan de Minister besluiten dat een project moet
      zijn aangevangen of uitgevoerd binnen een andere termijn dan bepaald in deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:13.7
    text: |-
      Indien de subsidie minder bedraagt dan € 25.000 is het tweede lid niet van toepassing en worden er geen
      tussentijdse verslagen opgevraagd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel113
  - number: 1:14.1
    text: |-
      Tenzij de beschikking tot subsidieverlening tevens de subsidievaststelling inhoudt, dient de subsidie-ontvanger
      zijn aanvraag om subsidievaststelling in, binnen dertien weken na het tijdstip waarop de activiteiten moeten zijn
      voltooid, tenzij de Minister bij subsidieverlening een andere periode voor het indienen van de aanvraag heeft
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.2
    text: |-
      Bij een aanvraag tot subsidievaststelling wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft is gefinancierd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.3
    text: |-
      Bij de rekening en verantwoording, bedoeld in [artikel 4:45, tweede lid, van de Algemene wet bestuursrecht][ref1],
      maakt de subsidieontvanger een onderverdeling naar de onderscheiden subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:14.4
    text: |-
      Een aanvraag tot vaststelling van een subsidie voor de uitvoering van een project gaat vergezeld van een
      eindverslag, dat ten minste bevat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.4.a
    text: een beschrijving van de activiteiten die in het kader van het project zijn verricht;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.4.b
    text: |-
      een evaluatie van de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het
      projectplan dat onderdeel vormt van de beschikking tot subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.4.c
    text: de kennis en informatie die met het project zijn opgedaan, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.4.d
    text: |-
      de wijze waarop de kennis en informatie, bedoeld in onderdeel c, openbaar is of zal worden gemaakt, ingeval in deze
      regeling is bepaald dat openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.5
    text: |-
      Indien de verleende subsidie minder bedraagt dan € 125.000 is het derde lid niet van toepassing; in dat geval
      overlegt de subsidie-ontvanger de gegevens die nodig zijn om aan te tonen dat de subsidiabele activiteiten zijn
      verricht en dat is voldaan aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14.6
    text: |-
      In afwijking van het vijfde lid is het derde lid van toepassing op Europese subsidies die minder bedragen dan
      € 125.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114
  - number: 1:14a
    text: |-
      De Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114a
  - number: 1:14b.1
    text: 'Indien de verleende subsidie minder bedraagt dan € 25.000 wordt de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14b.1.a
    text: direct vastgesteld zonder voorafgaande beschikking tot subsidieverlening, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14b.1.b
    text: |-
      ambtshalve vastgesteld, uiterlijk op een in een voorafgaande beschikking tot subsidieverlening vermelde datum, doch
      niet later dan tweeëntwintig weken nadat de activiteiten op grond van de beschikkingen moeten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14b.2
    text: |-
      Indien een beschikking tot subsidieverlening als bedoeld in het eerste lid, onder b, wordt gegeven, vermeldt de
      beschikking tot subsidieverlening de datum waarop de activiteiten uiterlijk moeten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14b.3
    text: |-
      Desgevraagd overlegt de subsidie-ontvanger de gegevens die nodig zijn om aan te tonen dat de subsidiabele
      activiteiten zijn verricht en dat is voldaan aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14b.4
    text: |-
      De artikelen betreffende subsidieverlening in dit hoofdstuk zijn van overeenkomstige toepassing op aanvragen tot
      subsidievaststelling, als bedoeld in onderdeel a van het eerst lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14b.5
    text: Indien de subsidie direct wordt vastgesteld, vindt de betaling van het subsidiebedrag in één keer plaats.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114b
  - number: 1:14c
    text: |-
      [Artikel 1:14b][ref1] is niet van toepassing op verleende Europese subsidies die minder bedragen dan € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:14d
    text: |-
      De subsidieontvanger doet onverwijld een schriftelijke melding zodra aannemelijk is dat de activiteiten waarvoor
      de subsidie is verleend, niet, niet tijdig of niet geheel zullen worden verricht of dat niet, niet tijdig of niet
      geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114d
  - number: 1:14e.1
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van een controleverklaring van een accountant indien dat in
      deze regeling of in de beschikking tot subsidieverlening is bepaald.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114e
  - number: 1:14e.2
    text: |-
      In de beschikking tot subsidieverlening kan uitsluitend worden bepaald dat de aanvraag tot subsidievaststelling
      vergezeld gaat van een controleverklaring, indien het in die beschikking vermelde subsidiebedrag € 125.000 of meer
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114e
  - number: 1:14e.3
    text: |-
      De controleverklaring bestaat uit een verklaring van een accountant of een accountant-administratieconsulent als
      bedoeld in [artikel 393, eerste lid, Boek 2 van het Burgerlijk Wetboek][ref1], waaruit blijkt dat met de aanvraag
      wordt voldaan aan de voorschriften uit [artikel 4:45 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114e
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:14e.4
    text: |-
      De accountant of accountant-administratiefconsulent controleert en stelt de controleverklaring vast met
      inachtneming de voorschriften, gesteld in [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel114e
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 1:15.1
    text: 'De volgende kosten komen niet in aanmerking voor subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.1.a
    text: kosten die uit andere hoofde zijn of worden gesubsidieerd of gefinancierd van overheidswege;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.1.b
    text: kosten die niet aantoonbaar rechtstreeks aan de activiteit waarop de subsidie betrekking heeft zijn toe te rekenen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.1.c
    text: debetrente;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.1.d
    text: |-
      kosten voor activiteiten die worden uitgevoerd in strijd met EG-maatregelen of nationale voorschriften die daarop
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.2
    text: |-
      Kosten voor aankoop van grond komen uitsluitend in aanmerking voor subsidie tot een hoogte van 10% van de
      subsidiabele kosten van de investering.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.3
    text: |-
      Verschuldigde BTW komt uitsluitend voor subsidie in aanmerking ingeval de aanvrager de BTW niet kan verrekenen met
      de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.4
    text: |-
      In aanvulling op de voorschriften, gesteld in deze regeling, kan de Minister bij de openstelling, bedoeld in
      [artikel 1:3, eerste lid][ref1], nadere voorschriften stellen over de voor een subsidie in aanmerking komende
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:15.5
    text: 'Indien in deze regeling is bepaald dat loonkosten in aanmerking komen voor een subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.5.a
    text: |-
      worden de kosten bepaald aan de hand van een uurtarief dat wordt berekend door eerst het bruto jaarloon te
      verminderen met de volledig winstafhankelijke uitkeringen en te verhogen met de premies voor sociale verzekeringen,
      VUT en pensioen, en dat bedrag vervolgens te delen door 1600,
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.5.b
    text: |-
      komen de kosten uitsluitend in aanmerking tot ten hoogste het bedrag dat wordt berekend door de salariskosten per
      mensjaar in Euro, opgenomen in de Handleiding Overheidstarieven van het Ministerie van Financiën, te delen door het
      in die handleiding opgenomen afgeronde aantal direct productieve uren. Hierbij wordt uitgegaan van ten hoogste de
      volgende salarisschalen:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.5.b.1°
    text: schaal 6 voor ondersteunend personeel;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.5.b.2°
    text: schaal 11 voor uitvoerend personeel;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.5.b.3°
    text: schaal 13 voor toezichthoudend personeel.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:15.6
    text: |-
      Indien in deze regeling is bepaald dat kosten voor eigen arbeid in aanmerking komen voor een subsidie wordt het
      uurtarief vastgesteld op het in het vijfde lid, onderdeel b, afhankelijk van het type werkzaamheden bedoelde
      bedrag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel115
  - number: 1:16.1
    text: |-
      Indien in deze regeling is bepaald dat een subsidie ten hoogste een bepaald bedrag of percentage van de
      subsidiabele kosten bedraagt, wordt het subsidiebedrag bepaald met inachtneming van dat bedrag of percentage,
      tenzij de Minister bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], een lager subsidiebedrag of
      lager percentage heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:16.2
    text: |-
      Ingeval in deze regeling niet is bepaald welk bedrag of percentage van de subsidiabele kosten een subsidie
      bedraagt, bedraagt de subsidie ten hoogste 100% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel116
  - number: 1:16.3
    text: |-
      Ingeval een activiteit gedeeltelijk uit andere hoofde wordt gesubsidieerd, wordt op grond van deze regeling een
      zodanig subsidiebedrag vastgesteld dat het totaal van alle subsidies voor die activiteit niet hoger is dan het
      totale subsidiebedrag dat op grond van deze regeling kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel116
  - number: 1:16.4
    text: |-
      Indien subsidies worden verstrekt voor investeringen door een landbouwonderneming op grond van [artikel 2:42][ref1]
      of [artikel 2:47][ref2], of voor investeringen als bedoeld in Hoofdstuk 1, 4 of 5 van [Bijlage 2][ref3], bedraagt
      het totaal van de subsidies die tijdens een periode van drie fiscale jaren aan de landbouwonderneming voor
      desbetreffende activiteiten wordt toegekend ingevolge artikel 4 van verordening (EG) nr. 1857/2006 niet meer dan
      € 400.000 of € 500.000 indien de landbouwonderneming is gevestigd in een probleemgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0021281
  - number: 1:17.1
    text: |-
      De Minister verstrekt voor een subsidie die nog niet is vastgesteld binnen twee weken na de datum van de
      beschikking tot subsidieverlening ambtshalve een voorschot, tenzij de Minister deze mogelijkheid bij de
      openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], heeft uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:17.2
    text: Het voorschot bedraagt 80% van het ten hoogste te verstrekken subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel117
  - number: 1:17.3
    text: |-
      Bevoorschotting vindt plaats aan de hand van het bevoorschottingsregime dat in de beschikking tot subsidieverlening
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel117
  - number: 1:17.4
    text: |-
      De Minister kan bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], bepalen dat een aanvraag tot
      subsidieverlening vergezeld gaat van een overzicht van liquiditeitsbehoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:17.5
    text: |-
      In afwijking van het tweede lid, bedraagt het voorschot 100% van de maximale hoogte van de subsidie indien de
      verleende subsidie minder bedraagt dan € 25.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel117
  - number: 1:18
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1],
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] of [artikel 1:20, derde of vijfde lid][ref3], worden terug
      te vorderen bedragen vermeerderd met de wettelijke rente die wordt berekend over de periode die verstrijkt
      tussen de kennisgeving van de terugvorderingsverplichting aan de subsidieontvanger en de terugbetaling door de
      subsidieontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:19.1
    text: |-
      Indien in deze regeling is bepaald dat een subsidie kan worden verstrekt aan een samenwerkingsverband, komen voor
      de subsidie in aanmerking samenwerkingsverbanden die:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
  - number: 1:19.1.a
    text: zijn gericht op het realiseren van een van de doelstellingen waarvoor de subsidie kan worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
  - number: 1:19.1.b
    text: |-
      waarvan de deelnemers natuurlijke personen of rechtspersonen, ieder met een andere eigenaar en niet in eigendom van
      een deelnemende natuurlijke persoon, zijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
  - number: 1:19.2
    text: 'Ingeval een subsidie wordt verstrekt aan een samenwerkingsverband:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
  - number: 1:19.2.a
    text: berusten de verplichtingen die daaruit voortvloeien hoofdelijk op iedere deelnemer aan het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
  - number: 1:19.2.b
    text: |-
      kunnen onverschuldigd betaalde subsidiebedragen overeenkomstig
      [artikel 4:57 van de Algemene wet bestuursrecht][ref1] hoofdelijk worden teruggevorderd bij iedere deelnemer aan
      het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:19.3
    text: |-
      De Minister kan bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], in afwijking van het tweede
      lid bepalen dat ingeval een subsidie wordt verstrekt aan een samenwerkingsverband, onverschuldigde betaalde
      subsidiebedragen overeenkomstig [artikel 4:57 van de Algemene wet bestuursrecht][ref2] worden teruggevorderd
      bij iedere deelnemer aan het samenwerkingsverband voor wat betreft het door de deelnemer ontvangen deel van de
      onverschuldigde betaalde subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:20.1
    text: |-
      Dit artikel is uitsluitend van toepassing op een subsidie die wordt verstrekt ter uitvoering van het
      plattelandsontwikkelingsprogramma.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.2
    text: 'De subsidie wordt verleend onder voorbehoud dat:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.2.a
    text: |-
      de Commissie van de Europese Gemeenschappen goedkeuring als bedoeld in artikel 18, vierde lid, van [verordening
      (EG) nr. 1698/2005](32005R1698) verleent aan een programma als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.2.b
    text: |-
      de activiteit waarop de subsidie betrekking heeft op grond van het programma, bedoeld in onderdeel a, kan worden
      gefinancierd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.3
    text: |-
      Onverminderd de [artikelen 4:35][ref1], [4:48][ref2] en [4:49 van de Algemene wet bestuursrecht][ref3] weigert de
      Minister subsidieverlening of trekt de Minister een subsidieverlening of subsidievaststelling in, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:20.3.a
    text: in het kader van de aanvraag met opzet onjuiste of onvolledige gegevens zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.3.b
    text: |-
      in het voorafgaande of hetzelfde jaar met opzet onjuiste of onvolledige gegevens zijn verstrekt bij een aanvraag
      tot subsidieverlening of subsidievaststelling met betrekking tot dezelfde activiteit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.3.c
    text: de aanvrager kunstgrepen heeft uitgevoerd om aan de eisen voor subsidieverstrekking te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.4
    text: |-
      Indien het bij de aanvraag tot subsidievaststelling of de betalingsaanvraag gevraagde subsidiebedrag meer dan
      drie procent hoger is dan het bedrag dat op grond van deze regeling kan worden verstrekt, wordt een subsidiebedrag
      vastgesteld dat is verlaagd met het verschil tussen die twee bedragen, tenzij de aanvrager aantoont dat de aanvraag
      buiten zijn schuld onjuist is.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.5
    text: |-
      Indien subsidie wordt verstrekt voor een investering, wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken indien de investering gedurende vijf jaar te
      rekenen vanaf de datum van subsidievaststelling een belangrijke wijziging ondergaat die:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 1:20.5.a
    text: de aard van de investering of de bij of krachtens deze regeling opgelegde uitvoeringsvoorwaarden raakt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.5.b
    text: een onderneming of overheidsinstantie onrechtmatig voordeel oplevert, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.5.c
    text: |-
      het gevolg is hetzij van een verandering in de aard van de eigendom van een infrastructuurvoorziening, hetzij van
      de beëindiging of verplaatsing van productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.6
    text: |-
      Bijlage VI, onderdelen 2.2 en 3.2, van [verordening (EG) nr. 1974/2006](32006R1974) van de Commissie van de
      Europese Gemeenschappen van 15 december 2006 tot vaststelling van uitvoeringsbepalingen van [Verordening (EG) nr.
      1698/2005](32005R1698) van de Raad van de Europese Unie inzake steun voor plattelandsontwikkeling uit het Europees
      Landbouwfonds voor Plattelandsontwikkeling (ELFPO) (PbEU L 368) is van toepassing.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.7
    text: |-
      In afwijking van [artikel 1:17, eerste lid][ref1], kan de Minister op aanvraag uitsluitend voorschot verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:20.7.a
    text: |-
      kosten die door de subsidieontvanger zijn gemaakt en betaald alsmede kosten van eigen arbeid van de betrokken
      ondernemer, voor zover die kosten op grond van deze regeling subsidiabel zijn, waarbij het voorschot wordt berekend
      naar rato van gemaakte en betaalde kosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.7.b
    text: |-
      kosten van activiteiten die kunnen worden gefinancierd op grond van een programma als bedoeld in het eerste lid
      waarvoor een goedkeuring als bedoeld in het tweede lid, onderdeel a, is verleend.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 1:20.8
    text: |-
      De Minister wijst subsidies als bedoeld in het eerste lid aan bij de openstelling, bedoeld in
      [artikel 1:3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 1:20.9
    text: Van de goedkeuring, bedoeld in het tweede lid, onderdeel a, wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel120
  - number: 2:1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - agro-MKB-onderneming: kleine of middelgrote onderneming die in de
      landbouwsector werkzaam is, met uitzondering van een landbouwonderneming;
        - bosbouwonderneming: onderneming waarin de primaire productie van bosbouwproducten plaatsvindt;
        - communautaire voedselkwaliteitsregeling: een kwaliteitsschema voor een landbouwproduct dat is erkend in het kader
      van: a. [verordening (EG) nr. 510/2006](32006R0510) van de Raad van de Europese Unie van 20 maart 2006 inzake de
      bescherming van geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen PbEU
      L 93); b. [verordening (EG) nr. 509/2006](32006R0509) van de Raad van de Europese Unie van 20 maart 2006 inzake
      gegarandeerde traditionele specialiteiten voor landbouwproducten en levensmiddelen (PbEU L 93); c. [verordening
      (EEG) nr. 2092/91](31991R2092) van de Raad van de Europese Gemeenschappen van 24 juni 1991 inzake de biologische
      produktiemethode en aanduidingen dienaangaande op landbouwproducten en levensmiddelen (PbEG L 198); d. titel VI
      van [verordening (EG) nr. 1493/1999](31999R1493) van de Raad van de Europese Unie van 17 mei 1999 houdende een
      gemeenschappelijke ordening van de wijnmarkt (PbEG L 179);
        - deskundige: persoon die vanuit zijn beroep deskundig is op het terrein waarvoor zijn kennis wordt ingezet en die
      onafhankelijk is van de subsidieontvanger;
        - *dierlijke productieketen:* keten van veehouderijbedrijven, ondernemingen die dieren en dierlijke
      producten verwerken en verhandelen, en ondernemingen die productiegerelateerde producten, zoals grondstoffen,
      uitgangsmateriaal, installaties en houderijsystemen leveren aan veehouderijbedrijven, met uitzondering van
      adviseurs en adviesbureaus;
        - groep: groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1];
        - innovatieproject: 'project dat een samenhangend geheel van activiteiten vormt, welke zijn gericht op: a.'
      het creëren van nieuwe, gewijzigde of verbeterde producten, technieken, systemen, processen, diensten of
      organisatievormen tot aan, maar niet met inbegrip van commerciële toepassing op praktijkschaal, en b. het verwerven
      van kennis ten behoeve van de activiteiten, bedoeld in onderdeel a;
        - jonge landbouwer: natuurlijke persoon die ten hoogste 39 jaar oud is en sinds ten hoogste drie jaar voor het
      eerst voor eigen rekening en risico een landbouwonderneming beheert die hij: a. alleen in eigendom, pacht of
      erfpacht heeft, of b. volledig in eigendom, pacht of erfpacht heeft met een andere natuurlijke persoon die niet
      eerder een landbouwonderneming volledig in eigendom, pacht of erfpacht heeft gehad;
        - kleine of middelgrote onderneming: kleine of middelgrote onderneming als bedoeld in artikel 2, zevende lid, van
      verordening (EG) nr. 800/2008;
        - producentengroepering: organisatie, van welke juridische vorm dan ook, bestaande uit personen die actief opereren
      in een voedselkwaliteitsregeling, met uitzondering van een professionele of interprofessionele organisatie die een
      of meer sectoren vertegenwoordigt;
        - *udv-ambities:* doelstellingen, geformuleerd in de Uitvoeringsagenda duurzame veehouderij, die zijn opgenomen in
      de bijlage 4 bij deze regeling;
        - *udv-project:* samenhangend geheel van activiteiten, gericht op: a. het uitvoeren van een verbeterplan; b. de
      ontwikkeling van een nieuwe bedrijfsvoering, een nieuw bedrijfsproces, een nieuw product of een prototype, met het
      oog op het wegnemen van drempels die de ontwikkeling of toepassing belemmeren van een nieuw product of proces dat
      bijdraagt aan de verbetering van de duurzaamheid binnen een of meer udv- ambities;
        - *udv-verbeterplan:* document waarin een beschrijving is opgenomen van samenhangende activiteiten, gericht op het
      oplossen van een of meer problemen die verduurzaming in ten minste één van de udv-ambities in de weg staan;
        - verordening (EG) nr. 73/2009: Verordening (EG) nr. 73/2009 van de Raad van 19 januari 2009 tot vaststelling
      van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening aan landbouwers in het
      kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers,
      tot wijziging van Verordeningen (EG) nr. 1290/2005, (EG) nr. 247/2006, (EG) nr. 378/2007 en tot intrekking van
      Verordening (EG) nr. 1782/2003 (PbEU L 30);
        - vervangingsinvestering: investering voor het eenvoudige vervangen van een bestaand gebouw of een bestaande
      machine, of delen daarvan, door een nieuw modern gebouw of een nieuwe moderne machine, zonder dat daarbij de
      productiecapaciteit met meer dan 25% wordt verhoogd of de betrokken productie of technologie fundamenteel wordt
      gewijzigd;
        - voedselkwaliteitsregeling: een communautaire voedselkwaliteitsregeling of een door de Minister erkende
      kwaliteitsregeling als bedoeld in artikel 32, eerste lid, onderdeel b, van [verordening (EG) nr. 1698/2005]
      (32005R1698).


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 2:1a
    text: 'Aan een onderneming, landbouwonderneming of agro-MKB-onderneming wordt geen subsidie verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel21a
  - number: 2:1a.a
    text: |-
      de onderneming moet worden aangemerkt als een onderneming als bedoeld in paragraaf 2.1 van de communautaire
      richtsnoeren voor reddings- en herstructureringssteun (PbEU C 244);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel21a
  - number: 2:1a.b
    text: |-
      overeenkomstig artikel 1, zesde lid, onderdeel a, van Verordening (EG) nr. 800/2008 er ten aanzien van de
      onderneming een uitstaand bevel tot terugvordering is ingevolge een eerdere beschikking van de Europese Commissie
      waarin de steun onrechtmatig en onverenigbaar met de gemeenschappelijke markt is verklaard.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel21a
  - number: 2:1b
    text: |-
      Aan een landbouwonderneming wordt geen subsidie verstrekt indien daardoor zou worden gehandeld in strijd met
      verordeningen als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie, houdende een
      gemeenschappelijke marktordening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel21b
  - number: 2:2.1
    text: |-
      In aanvulling op [artikel 1:15][ref1], komen de volgende kosten niet in aanmerking voor subsidie op grond van dit
      hoofdstuk:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:2.1.a
    text: de aankoop van agrarische productierechten, dieren, planten en de aanplant van planten voor éénjarige gewassen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
  - number: 2:2.1.b
    text: vervangingsinvesteringen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
  - number: 2:2.1.c
    text: legeskosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
  - number: 2:2.1.d
    text: |-
      reguliere investeringen in de onderneming van de subsidieontvanger en kosten van eigen arbeid van de betrokken
      ondernemer;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
  - number: 2:2.1.e
    text: kosten voor de vervaardiging van producten die melk en zuivelproducten imiteren of vervangen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
  - number: 2:2.2
    text: |-
      In afwijking van [artikel 1:15, derde lid][ref1], komt niet verrekenbare BTW niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:3.1
    text: |-
      Ter stimulering van de duurzame ontwikkeling van de land- en bosbouwsector kan de Minister aan een
      landbouwonderneming, agro-MKB-onderneming of bosbouwonderneming subsidie verstrekken voor de uitvoering van de
      volgende activiteiten:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.1.a
    text: het inwinnen van een bedrijfsconsult bij een daartoe gespecialiseerde adviseur, instelling of organisatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.1.b
    text: |-
      het volgen van opleidingen, trainingen of voorlichtingsbijeenkomsten door ondernemers of in de onderneming werkzame
      personen bij daartoe gespecialiseerde instellingen of organisaties.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2
    text: |-
      Een bedrijfsconsult bevat een op de onderneming toegesneden advies omtrent de ontwikkeling of beëindiging van die
      onderneming en heeft betrekking op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.a
    text: het verrichten van bedrijfsdoorlichtingen, met uitzondering van kwaliteits- en productcontroles door deskundigen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.b
    text: |-
      het laten verrichten van onderzoek, met uitzondering van kwaliteits- en productcontroles door deskundigen, met het
      oog op de ontwikkeling van landbouwproducten van hoge kwaliteit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.c
    text: het opstellen van plannen gericht op de ontwikkeling van de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.d
    text: het opstellen van plannen gericht op de beëindiging van de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.e
    text: het opstellen van plannen gericht op de toepassing van kwaliteitsregelgeving op de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.f
    text: het opstellen van plannen gericht op risicobeheer, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.2.g
    text: |-
      het opstellen van plannen gericht op het ontwikkelen van samenwerkingsverbanden tussen landbouwondernemingen
      onderling, of met agro-MKB-ondernemingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.3
    text: 'Een opleiding, training of voorlichtingsbijeenkomst heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.3.a
    text: |-
      het voldoen aan wettelijke normen inzake milieu of waterbeheer, aan veterinaire, sanitaire of fytosanitaire
      regelgeving, aan hygiëne- of dierenwelzijnsregelgeving of aan arbeidsomstandighedenregelgeving;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.3.b
    text: |-
      het verkrijgen of vergroten van kennis en vaardigheden waarmee nieuwe, betere of hoogwaardigere producten kunnen
      worden verkregen of deze productiewijzen of productieprocessen kunnen worden verbeterd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.3.c
    text: begeleiding bij het starten of beëindigen van de onderneming of een onderdeel daarvan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.4
    text: |-
      De daartoe gespecialiseerde adviseur, instelling of organisatie die activiteiten als bedoeld in het eerste lid,
      onderdeel a of b uitvoert, staat ingeschreven in het handelsregister als onderneming of rechtspersoon die zich het
      geven van adviezen of het ontwikkelen en overdragen van kennis en vaardigheden in de vorm van opleiding of training
      ten doel stelt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.5
    text: 'Geen subsidie wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.5.a
    text: |-
      opleidingen, trainingen of voorlichtingsbijeenkomsten die onderdeel van normale programma’s of van leergangen voor
      middelbaar of hoger landbouw- en bosbouwonderwijs vormen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:3.5.b
    text: activiteiten waarvan de subsidiabele kosten in totaal minder bedragen dan € 250.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel23
  - number: 2:4
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:4a.1
    text: |-
      [Artikel 1:9, eerste lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:4a.2
    text: 'De aanvrager vermeldt op het aanvraagformulier:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel24a
  - number: 2:4a.2.a
    text: |-
      de naam van de daartoe gespecialiseerde adviseur, instelling of organisatie, bedoeld in
      [artikel 2:3, eerste lid, onderdeel a of b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:4a.2.b
    text: het nummer waaronder de adviseur, de instelling of de organisatie in het handelsregister is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel24a
  - number: 2:4a.2.c
    text: een korte omschrijving van het bedrijfsconsult, de opleiding of de training.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel24a
  - number: 2:5
    text: |-
      De subsidieontvanger voert de activiteiten waarvoor subsidie is verleend uit binnen zes maanden na de datum van
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel25
  - number: 2:6.1
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling binnen negen maanden
      na de datum van subsidieverlening ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:6.2
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van facturen en betaalwijzen die betrekking hebben op het
      bedrijfsconsult, de opleiding of de training.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel26
  - number: 2:6.3
    text: |-
      De Minister kan ter controle een daartoe gespecialiseerde adviseur, instelling of organisatie als bedoeld in
      [artikel 2:3, eerste lid, onderdeel a of b][ref1], verzoeken het adviesrapport, certificaten of deelnemerslijsten
      over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:6.4
    text: |-
      [Artikel 1:14b][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:7.1
    text: De subsidie bedraagt ten hoogste 50% van de totale kosten van een bedrijfsconsult, opleiding of training.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel27
  - number: 2:7.2
    text: De subsidie bedraagt ten hoogste € 1.500 per jaar per onderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel27
  - number: 2:7.3
    text: |-
      De subsidie, bedoeld in [artikel 2:3, eerste lid, onderdeel a of b][ref1], wordt uitbetaald aan de adviseur, de
      instelling of de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:8.1
    text: |-
      De Minister kan subsidie aan een landbouwonderneming of bosbouwonderneming verstrekken voor een schriftelijk
      advies door een bedrijfsadviesdienst omtrent de wijze waarop de onderneming kan worden ontwikkeld of voortgezet
      overeenkomstig ten minste:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.1.a
    text: de beheerseisen, bedoeld in artikel 5 en bijlage II van verordening (EG) nr. 73/2009,
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.1.b
    text: |-
      de minimumeisen inzake goede landbouw- en milieuconditie, bedoeld in artikel 6 en bijlage III van verordening (EG)
      nr.73/2009, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.1.c
    text: arbeidsveiligheidsstandaards die zijn gebaseerd op EG-maatregelen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2
    text: 'De bedrijfsadviesdienst:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.a
    text: |-
      heeft de beschikking over voldoende personeel dat beschikt over de voor het verstrekken van bedrijfsadviezen
      vereiste kwalificaties op een voor de inhoud van het advies relevant terrein;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.b
    text: beschikt over de benodigde administratieve en technische faciliteiten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.c
    text: is ervaren in het verstrekken van adviezen met betrekking tot de in het eerste lid genoemde onderwerpen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.d
    text: staat als betrouwbaar te boek;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.e
    text: staat ingeschreven bij een Kamer van Koophandel als organisatie die zich het geven van adviezen ten doel stelt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.f
    text: |-
      heeft ten minste één jaar ervaring in het verstrekken van adviezen op ten minste één van de in het eerste lid,
      onderdelen a tot en met c genoemde aspecten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.2.g
    text: |-
      is in het betrokken kalenderjaar ten minste 28 dagen voor de eerste mogelijkheid tot het doen van een aanvraag door
      de Minister is opengesteld, aangemeld als bedrijfsadviesdienst bij de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.3
    text: |-
      Het advies is gebaseerd op een op de betrokken landbouwonderneming of bosbouwonderneming uitgevoerd onderzoek,
      waarin wordt aangegeven welke eisen als bedoeld in het eerste lid op de onderneming van toepassing zijn en in
      hoeverre aan die eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:8.4
    text: De subsidie wordt betaald aan de bedrijfsadviesdienst.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel28
  - number: 2:9.1
    text: |-
      In afwijking van [artikel 1:4][ref1] rangschikt de Minister aanvragen tot subsidieverlening die in een zelfde
      aanvraagperiode zijn ingediend in de navolgende volgorde van categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:9.1.a
    text: |-
      aanvragen, afkomstig van ondernemingen die in de drie jaren voorafgaand aan de aanvraag geen gebruik hebben gemaakt
      van de subsidie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29
  - number: 2:9.1.b
    text: overige aanvragen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29
  - number: 2:9.2
    text: |-
      Indien het aantal aanvragen hoger is dan het beschikbare budget, worden binnen de categorie, bedoeld in het eerste
      lid, onderdeel a, aanvragen door loting gerangschikt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29
  - number: 2:9.3
    text: |-
      Indien het aantal aanvragen hoger is dan het beschikbare budget en nadat voor de aanvragen, bedoeld
      in het eerste lid, onderdeel a, een beschikking omtrent subsidieverlening is afgegeven als bedoeld in
      [artikel 1:10, tweede lid][ref1], worden binnen de categorie, bedoeld in het eerste lid, onderdeel b, aanvragen
      door loting gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:9a
    text: |-
      De subsidieontvanger laat de activiteiten waarvoor subsidie is verleend binnen zes maanden uitvoeren na de datum
      van subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29a
  - number: 2:9b
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling binnen negen maanden
      na de datum van subsidieverlening ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:10.1
    text: De subsidie bedraagt ten hoogste 50% van de kosten van een bedrijfsadvies.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel210
  - number: 2:10.2
    text: De subsidie bedraagt ten hoogste € 1.500.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel210
  - number: 2:10.3
    text: De subsidie wordt ten hoogste eenmaal per drie jaar verleend.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel210
  - number: 2:11.1
    text: |-
      De Minister kan aan een samenwerkingsverband van landbouwondernemingen, agro-MKB-ondernemingen,
      bosbouwondernemingen, kennisinstellingen of verenigingen van agrariërs subsidie verstrekken voor de uitvoering
      van een project dat is gericht op de onderlinge uitwisseling van voor elk van de aan het samenwerkingsverband
      deelnemende ondernemingen relevante kennis en ervaring met betrekking tot werkzaamheden in de landbouwsector of
      bosbouwsector.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel211
  - number: 2:11.2
    text: 'Het project heeft een duur van ten hoogste vijf jaar en heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel211
  - number: 2:11.2.a
    text: |-
      het voldoen aan wettelijke normen inzake milieu of waterbeheer, aan veterinaire, sanitaire regelgeving, aan
      fytosanitaire, hygiëne- of dierenwelzijnsregelgeving of aan arbeidsomstandighedenregelgeving,
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel211
  - number: 2:11.2.b
    text: |-
      het verkrijgen of vergroten van kennis en vaardigheden waarmee nieuwe, betere of hoogwaardigere producten kunnen
      worden verkregen of deze productiewijzen of productieprocessen kunnen worden verbeterd, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel211
  - number: 2:11.2.c
    text: |-
      het verkrijgen of vergroten van kennis op het gebied van klimaatverandering, hernieuwbare energie, kwantitatief en
      kwalitatief waterbeheer (grond- en oppervlaktewater) dan wel biodiversiteit en innovaties op deze terreinen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel211
  - number: 2:11a
    text: De subsidieontvanger vangt het project aan binnen drie maanden na de datum van de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel211a
  - number: 2:12
    text: 'De volgende kosten komen in aanmerking voor subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel212
  - number: 2:12.a
    text: de kosten van een procesbegeleider of projectuitvoerder;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel212
  - number: 2:12.b
    text: |-
      de kosten voor de organisatie en facilitering van het samenwerkingsverband, waaronder begrepen zaalhuur,
      vergaderfaciliteiten en bureaukosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel212
  - number: 2:12.c
    text: |-
      de kosten van het vastleggen en verspreiden van kennis, waaronder begrepen drukwerk en de kosten van de
      ontwikkeling en het beheer van internetapplicaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel212
  - number: 2:12.d
    text: |-
      de kosten voor het inhuren van kennis van overige landbouwondernemingen, deskundigen, onderzoekers of
      kennisinstellingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel212
  - number: 2:13
    text: De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel213
  - number: 2:14.1
    text: |-
      Ter bevordering van de concurrentiekracht van de land- en bosbouw en van productiemethoden die verenigbaar zijn
      met de eisen inzake milieubescherming en natuurbeheer kan de Minister subsidie verstrekken voor de uitvoering van
      een project waarvan de activiteiten zijn gericht op het in de praktijk uittesten en demonstreren van de resultaten
      van vernieuwingen bij landbouwondernemingen, bosbouwondernemingen of agro-MKB-ondernemingen, met uitzondering van
      beroepsopleidingen en aan beroepsopleidingen gerelateerde cursussen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2
    text: 'Voor de subsidie komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.a
    text: landbouwondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.b
    text: 'samenwerkingsverbanden van landbouwondernemingen onderling, of van ten minste één landbouwonderneming en:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.b.1°
    text: agro-MKB-ondernemingen, bosbouwondernemingen of ondernemingen, werkzaam in de voedselindustrie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.b.2°
    text: verenigingen of stichtingen, werkzaam op het gebied van de landbouwondernemingen of bosbouwondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.b.3°
    text: adviesbureaus;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.b.4°
    text: onderwijs- en opleidingsinstellingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.b.5°
    text: overheidsinstanties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:14.2.c
    text: verenigingen van agrariërs.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel214
  - number: 2:15.1
    text: 'Een project heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.a
    text: biologische landbouw, geïntegreerde landbouw of gesloten teeltsystemen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.b
    text: milieuverantwoorde benutting van meststoffen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.c
    text: beperking van de ammoniakemissies in de veehouderij;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.d
    text: verwijdering en verwerking van organische afvalstoffen voor zover betrekking hebbende op de substraatteelt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.e
    text: |-
      beperking van milieubelasting door ondernemingen die zich richten op de be- of verwerking van, of handel in
      producten van de land- of bosbouw;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.f
    text: terugdringing van het gebruik of de emissie van gewasbeschermingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.g
    text: duurzame energie, energiebesparing, energie-efficiency en energiemanagement;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.h
    text: |-
      toepassing van nieuwe marktgerichte productiemethoden of verwerkingstechnieken, waaronder de ontwikkeling van
      nieuwe landbouwproducten of bijproducten en het openen van nieuwe markten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.i
    text: verbetering van logistieke systemen en informatietechnologie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.j
    text: verbetering van de kwaliteit van productieprocessen of -systemen, waaronder integrale borgingssystemen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.k
    text: |-
      verbetering van de horizontale, onderscheidenlijk verticale samenwerking in, onderscheidenlijk tussen opeenvolgende
      schakels in de productieketen van land- of bosbouwproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.l
    text: verbetering van arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.m
    text: verbetering van hygiëne;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.n
    text: verbetering van de gezondheid of het welzijn van dieren;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.o
    text: benutten en verbeteren van genetische en functionele agro-biodiversiteit om duurzame productie te bevorderen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.p
    text: |-
      verbetering van de kwaliteit en vergroting van de variatie van het bodemleven door goede bodembewerkingsmethoden,
      bemestingsmethoden en –technieken waardoor het watervasthoudend vermogen van de bodem toeneemt en uitspoeling van
      nutriënten vermindert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.q
    text: voorkomen van en omgaan met bodemverdichting en bestrijding van erosie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.r
    text: behouden en ontwikkelen van natuur- en landschapswaarden in agrarische gebieden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.s
    text: nemen van beheersmaatregelen die verdroging van natuurgebieden tegengaan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.t
    text: horizontale of verticale samenwerking;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.u
    text: effectief kwantitatief en kwalitatief waterbeheer;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.1.v
    text: reductie van broeikasgassen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.2
    text: 'Een project komt voor de subsidie in aanmerking indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.2.a
    text: |-
      het kan bijdragen aan de bevordering van de toepassing van nieuwe kennis of technologieën, die verder gaat dan de
      wettelijke minimumnormen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.2.b
    text: |-
      het betrekking heeft op vernieuwingen in de productiekolom van land- en bosbouwproducten die voldoende perspectief
      bieden voor toepassing op bedrijfsniveau;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.2.c
    text: |-
      het, gelet op de doelstelling, de inhoud en het geografisch bereik, niet gelijk is aan projecten waarvoor in het
      kader van deze regeling eerder een subsidie is verleend;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.2.d
    text: de uitvoeringstermijn ten hoogste drie jaar bedraagt, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:15.2.e
    text: de subsidiabele kosten in totaal ten minste € 25.000 bedragen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel215
  - number: 2:16
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:16.a
    text: 'het project waarop de aanvraag betrekking heeft:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel216
  - number: 2:16.a.1°
    text: |-
      gericht is op vernieuwingen die: - meer perspectief bieden voor toepassing op bedrijfsniveau, en
        - zich in een meer vergevorderd stadium van ontwikkeling bevinden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel216
  - number: 2:16.a.2°
    text: meer bijdraagt aan het bevorderen van de toepassing van nieuwe kennis of technologieën in de gehele sector, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel216
  - number: 2:16.a.3°
    text: een groter draagvlak heeft bij relevante vaktechnische-, dienstverlenende-, branche- of standsorganisaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel216
  - number: 2:16.b
    text: |-
      uit het communicatieplan, bedoeld in [artikel 2:17][ref1], blijkt dat met het project de relevante doelgroepen
      beter worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:17
    text: |-
      De aanvraag tot subsidieverlening gaat vergezeld van een op het project toegesneden communicatieplan waarin wordt
      aangegeven wie de doelgroep is.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel217
  - number: 2:18.1
    text: |-
      De subsidieontvanger voert het project in Nederland uit, behoudens toestemming van de Minister tot gedeeltelijke
      uitvoering buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel218
  - number: 2:18.2
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel218
  - number: 2:18.3
    text: |-
      De subsidieontvanger maakt de kennis en informatie die met het project zijn opgedaan onmiddellijk na afloop van het
      project openbaar in ten minste één vakblad.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel218
  - number: 2:18.4
    text: |-
      De Minister kan de subsidieontvanger aanvullende verplichtingen opleggen omtrent de wijze van openbaarmaking van de
      kennis en informatie die met het project zijn opgedaan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel218
  - number: 2:20.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.a
    text: kosten gemoeid met het demonstreren van de producten, procedés en technologieën;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.b
    text: opleidings- en trainingskosten van de met de uitvoering van het project belaste personen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.c
    text: kosten van leveringen van materiaal en diensten door derden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.d
    text: kosten voor het verstrekken van informatie en het verzorgen van publiciteit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.e
    text: kosten van huur of huurkoop van voor het project noodzakelijke bedrijfsmiddelen, waaronder onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.f
    text: loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.g
    text: |-
      kosten van eigen arbeid van de betrokken ondernemer, in afwijking van
      [artikel 2:2, aanhef in samenhang met onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:20.1.h
    text: uitvoeringskosten, zoals reiskosten en de kosten van de huur van vergaderzalen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.1.i
    text: kosten van de voor de subsidievaststelling benodigde controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.2
    text: 'De volgende kosten komen niet in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.2.a
    text: overheadkosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.2.b
    text: kosten voor de aankoop van bedrijfsmiddelen, met uitzondering van huurkoop;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.2.c
    text: de kosten die betrekking hebben op het kunnen indienen van een voldoende gespecificeerde aanvraag;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.2.d
    text: ten behoeve van de financiering van het project te betalen rente en kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.3
    text: |-
      Ingeval wordt aangetoond dat een bedrijfsmiddel een noodzakelijk onderdeel is van het demonstratieproject en niet
      op andere wijze kan worden verkregen dan door de subsidie, is het tweede lid, aanhef in samenhang met onderdeel b,
      niet van toepassing, met dien verstande dat uitsluitend voor de subsidie in aanmerking komt het bij de aanvraag tot
      subsidievaststelling aangegeven verschil tussen de aankoopprijs en:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.3.a
    text: |-
      de gerealiseerde verkoopprijs, ingeval deze hoger is dan de getaxeerde verkoopprijs zoals deze is vastgesteld voor
      de datum waarop de uitvoering van het project is voltooid;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:20.3.b
    text: de getaxeerde verkoopprijs, bedoeld in onderdeel a, in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel220
  - number: 2:21.1
    text: De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel221
  - number: 2:21.2
    text: |-
      Indien het project wordt uitgevoerd door een samenwerkingsverband van landbouwondernemingen, bedraagt de subsidie
      in afwijking van het eerste lid ten hoogste 70% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel221
  - number: 2:21.3
    text: |-
      Ingeval aan een landbouwonderneming subsidie is verleend voor een project dat gedeeltelijk uit andere hoofde wordt
      gesubsidieerd, wordt in afwijking van [artikel 1:16, derde lid][ref1], een zodanig subsidiebedrag vastgesteld dat
      het totaal van alle subsidies voor dat project niet hoger is dan 90% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:21.4
    text: |-
      De subsidie bedraagt voor landbouwondernemingen ten hoogste 100% van de subsidiabele kosten, indien het project
      wordt uitgevoerd door een landbouwonderneming of een samenwerkingsverband van landbouwondernemingen en het
      project strekt tot uitvoering van een activiteit in verband met een prioriteit als bedoeld in artikel 16 bis van
      Verordening (EG) 1698/2005.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel221
  - number: 2:22.1
    text: |-
      De Minister kan op aanvraag een voucher verstrekken aan een landbouwonderneming of agro-MKB-onderneming voor
      de uitvoering van een activiteit die is gericht op de beantwoording van een toepassingsgerichte kennisvraag
      met betrekking tot voor de onderneming relevante nieuwe kennis over producten, processen of diensten door een
      kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel222
  - number: 2:22.2
    text: |-
      Er wordt geen voucher verstrekt aan een onderneming die in de drie jaar, voorafgaand aan de ontvangstdatum van
      de aanvraag tot verstrekking van een voucher, de minimis-steun als bedoeld in artikel 3 van [verordening (EG) nr.
      1860/2004](32004R1860) van de Commissie van de Europese Gemeenschappen van 6 oktober 2004 betreffende de toepassing
      van de artikelen 87 en 88 van het EG-Verdrag op de de minimis-steun in de landbouwsector en de visserijsector (PbEU
      L 325) heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel222
  - number: 2:22.3
    text: |-
      Er wordt geen voucher verstrekt aan een onderneming die in het jaar, voorafgaand aan de ontvangstdatum van de
      aanvraag tot verstrekking van een voucher, van een bestuursorgaan een document heeft ontvangen dat kan worden
      ingeleverd bij een kennisinstelling ten behoeve van de uitvoering van een activiteit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel222
  - number: 2:23.1
    text: 'Een voucher kan uitsluitend worden aangevraagd indien de Minister heeft vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel223
  - number: 2:23.1.a
    text: in welke periode de voucher kan worden aangevraagd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel223
  - number: 2:23.1.b
    text: hoeveel vouchers beschikbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel223
  - number: 2:23.1.c
    text: welke activiteiten tegen welke kosten in ruil voor de vouchers kunnen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel223
  - number: 2:23.2
    text: |-
      De Minister bepaalt per aanvraagperiode tot welke datum de in die aanvraagperiode verstrekte vouchers kunnen worden
      ingeleverd bij een kennisinstelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel223
  - number: 2:23.3
    text: De Minister maakt een besluit als bedoeld in dit artikel bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel223
  - number: 2:24
    text: |-
      [Artikel 1:5][ref1] is van overeenkomstige toepassing op de aanvraag tot verstrekking van een voucher.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:25.1
    text: |-
      De Minister verstrekt op aanvraag een vergoeding aan een kennisinstelling die voor eigen rekening en risico een
      activiteit als bedoeld in [artikel 2:22, eerste lid][ref1], heeft uitgevoerd en in verband daarmee een of meer
      geldige vouchers overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:25.2
    text: |-
      Geen vergoeding wordt verstrekt voor de uitvoering van een activiteit waartoe de onderneming en de kennisinstelling
      reeds voor de afgiftedatum van de voucher verplichtingen jegens elkaar zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel225
  - number: 2:25.3
    text: |-
      Voor vergoeding komen de door de kennisinstelling voor de activiteit gemaakte kosten in aanmerking, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel225
  - number: 2:25.3.a
    text: niet meer wordt vergoed dan de waarde van de door de kennisinstelling overgelegde vouchers;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel225
  - number: 2:25.3.b
    text: per activiteit ten hoogste tien vouchers voor vergoeding kunnen worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel225
  - number: 2:25.3.c
    text: |-
      uitsluitend vouchers die op naam staan van de onderneming voor wie de activiteit is uitgevoerd voor vergoeding
      kunnen worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel225
  - number: 2:26
    text: |-
      Een aanvraag als bedoeld in [artikel 2:22, eerste lid][ref1], of [2:25, eerste lid][ref2], wordt ingediend bij de
      Minister met gebruikmaking van een daartoe door de Minister vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:27.1
    text: |-
      Ter stimulering van het innovatieve vermogen in de landbouwsector of de bosbouwsector kan de Minister subsidie
      verstrekken voor de uitvoering van een innovatieproject aan:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel227
  - number: 2:27.1.a
    text: een landbouwonderneming, agro-MKB-onderneming of bosbouwonderneming, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel227
  - number: 2:27.1.b
    text: |-
      een samenwerkingsverband van ondernemingen als bedoeld in onderdeel a die voor gezamenlijke rekening en risico het
      project uitvoeren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel227
  - number: 2:27.2
    text: |-
      Geen subsidie wordt verstrekt voor activiteiten waarvan de subsidiabele kosten in totaal minder bedragen dan
      € 10.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel227
  - number: 2:28
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:28.a
    text: een meer innovatief karakter heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228
  - number: 2:28.b
    text: meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228
  - number: 2:28.c
    text: een groter uitstralingseffect kan hebben voor toepassing door andere ondernemingen, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228
  - number: 2:28.d
    text: een meer duurzaam karakter heeft.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228
  - number: 2:28a
    text: |-
      In aanvulling op [artikel 1:9, tweede lid][ref1], gaat de aanvraag tot subsidieverlening vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:28a.a
    text: |-
      een op naam van de aanvrager gestelde offerte van de meetinstantie en de betrokken laboratoria, die zodanig
      gespecificeerd is dat de verschillende onderdelen expliciet herkenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228a
  - number: 2:28a.b
    text: een meetplan per bedrijfslocatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228a
  - number: 2:28a.c
    text: een overzicht met daarin alle relevante publicaties van de meetinstantie en de betrokken laboratoria.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel228a
  - number: 2:29.1
    text: 'De subsidieontvanger voert het project uit:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229
  - number: 2:29.1.a
    text: in Nederland, behoudens toestemming van de Minister tot gedeeltelijke uitvoering buiten Nederland, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229
  - number: 2:29.1.b
    text: binnen drie jaar na de datum waarop de beschikking tot subsidieverlening is gegeven.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229
  - number: 2:29.2
    text: |-
      De subsidieontvanger maakt de kennis en informatie die met het project worden opgedaan onmiddellijk na afloop
      van het project openbaar, tenzij hij in de aanvraag tot subsidieverlening heeft gekozen voor vaststelling van een
      subsidiebedrag overeenkomstig [artikel 2:31, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:29a
    text: |-
      In aanvulling op [artikel 1:14][ref1] gaat de aanvraag tot subsidievaststelling vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:29a.a
    text: |-
      facturen of andere schriftelijke bewijsstukken, waarop prijzen inclusief en exclusief BTW worden opgevoerd, waarop
      in ieder geval het onderscheid tussen de kostenonderdelen is aangegeven en waaruit blijkt dat het meetprogramma
      volgens de offerte is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229a
  - number: 2:29a.b
    text: bankafschriften waaruit de betaling van de facturen blijkt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229a
  - number: 2:29a.c
    text: het voor publicatie bestemde rapport van de meetresultaten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel229a
  - number: 2:30
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel230
  - number: 2:30.a
    text: loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel230
  - number: 2:30.b
    text: |-
      aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces-en ketenmanagement, de
      verwerving van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die rechten, met
      uitzondering van winstopslagen bij transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel230
  - number: 2:30.c
    text: |-
      de kosten van aangeschafte machines en apparatuur, gebaseerd op historische aanschafprijzen of de aan het project
      toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij transacties binnen een
      groep, tot ten hoogste 50%.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel230
  - number: 2:31.1
    text: 'De subsidie bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel231
  - number: 2:31.1.a
    text: 50% van de subsidiabele kosten tot en met € 900.000 en 25% van de subsidiabele kosten boven € 900.000, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel231
  - number: 2:31.1.b
    text: |-
      25% van de subsidiabele kosten, ingeval de subsidieontvanger ervoor kiest de kennis en informatie die met het
      project worden opgedaan niet openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel231
  - number: 2:31.2
    text: De subsidie bedraagt ten hoogste € 1.000.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel231
  - number: 2:31.3
    text: |-
      Ingeval aan een landbouwonderneming subsidie is verleend voor een project dat gedeeltelijk uit andere hoofde wordt
      gesubsidieerd, wordt in afwijking van [artikel 1:16, derde lid][ref1], een zodanig subsidiebedrag vastgesteld dat
      het totaal van alle subsidies voor dat project niet hoger is dan 75% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:32.1
    text: |-
      Ter bevordering van de samenwerking tussen landbouwondernemingen, bosbouwondernemingen en agro-MKB-ondernemingen
      kan de Minister subsidie verstrekken ter dekking van de voor de samenwerking gemaakte kosten voor de uitvoering van
      een innovatieproject.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel232
  - number: 2:32.2
    text: |-
      Voor de subsidie komt in aanmerking een samenwerkingsverband van landbouwondernemingen of bosbouwondernemingen
      onderling, dan wel met agro-MKB-ondernemingen, die voor gezamenlijke rekening en risico het project uitvoeren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel232
  - number: 2:32.3
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel232
  - number: 2:32.3.a
    text: aan ondernemingen die zijn gericht op onderzoek, scholing, opleiding, voorlichting, advies of begeleiding;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel232
  - number: 2:32.3.b
    text: voor projecten waarvan de subsidiabele kosten in totaal minder bedragen dan € 10.000;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel232
  - number: 2:32.3.c
    text: voor projecten met een duur van meer dan drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel232
  - number: 2:33
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      aanvraag betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:33.a
    text: een meer innovatief karakter heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel233
  - number: 2:33.b
    text: meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel233
  - number: 2:33.c
    text: een groter uitstralingseffect kan hebben voor toepassing door andere ondernemingen, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel233
  - number: 2:33.d
    text: een meer duurzaam karakter heeft.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel233
  - number: 2:34.1
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel234
  - number: 2:34.2
    text: |-
      De subsidieontvanger maakt de kennis en informatie die met het project worden opgedaan onmiddellijk na afloop van
      het project openbaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel234
  - number: 2:35.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.a
    text: loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.b
    text: |-
      aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces- en ketenmanagement en ter
      zake van de verwerving van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die
      rechten, met uitzondering van winstopslagen bij transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.c
    text: |-
      kosten voor de aanschaf van machines en apparatuur, nieuw of tweedehands, in geval van huurkoop gebaseerd op
      de aan het project toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij
      transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.d
    text: |-
      kosten voor organisatie en facilitering van het samenwerkingsverband, waaronder begrepen verwerving van onroerende
      zaken, zaalhuur, vergaderfaciliteiten en bureaukosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.e
    text: kosten voor een procesbegeleider of ketenmanager;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.f
    text: |-
      kosten voor een studie naar de haalbaarheid van de ontwikkeling van nieuwe producten, procédés en technologieën in
      de landbouw-, de voedsel- en bosbouwsector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.g
    text: kosten gemoeid met het testen van de nieuwe producten, procédés en technologieën;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.h
    text: kosten voor investeringen in onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:35.1.i
    text: |-
      kosten van eigen arbeid van de betrokken ondernemer, in afwijking van
      [artikel 2:2, aanhef in samenhang met onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:35.2
    text: |-
      De in het eerste lid bedoelde kosten komen uitsluitend in aanmerking voor de subsidie voor zover zij worden
      gemaakt vóórdat de nieuwe producten, procédés en technologieën, bedoeld in het eerste lid, onderdelen f en g, voor
      commerciële doeleinden toegepast worden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel235
  - number: 2:36.1
    text: De subsidie bedraagt ten hoogste 35% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236
  - number: 2:36.2
    text: De subsidie bedraagt ten hoogste € 500.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236
  - number: 2:36a
    text: |-
      In deze paragraaf wordt verstaan onder:

            –
            diervoeders:

              alle stoffen en producten, inclusief additieven, verwerkt, gedeeltelijk verwerkt of onverwerkt, die bestemd
      zijn om te worden gebruikt voor orale vervoedering aan dieren;



            –
            industrieel onderzoek:

              industrieel onderzoek als bedoeld in artikel 30 van de verordening (EG) nr. 800/2008;



            –
            onderzoeksproject diervoeders:

              industrieel onderzoek naar diervoeders of naar de productiemethode van diervoeders met het oog op
      persistente reductie van de methaanvorming in de pens of dikke darm van melkvee met minimaal behoud van de
      melkproductie, met dien verstande dat het onderzoek zich richt op:
              het vaststellen van de potentie van diervoeders of van de productiemethode van diervoeders, middels in vivo
      experimenten, of
      het vaststellen van het werkingsmechanisme van diervoeders of van de productiemethode van diervoeders, indien de
      potentie van de diervoeders of van de productiemethode van diervoeders reeds is vastgesteld;



            –
            onderneming:

              iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;



            –
            onderzoeksorganisatie:

              een onderzoeksorganisatie als bedoeld in artikel 30 van de verordening (EG) nr. 800/2008;



            –
            productiemethode van diervoeders:

              het fysisch, mechanisch of chemisch bewerken van diervoeders gericht op het beïnvloeden van de
      eigenschappen ervan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236a
  - number: 2:36b.1
    text: |-
      De Minister kan subsidie verstrekken voor de uitvoering van een onderzoeksproject diervoeders aan een onderneming
      of een samenwerkingsverband van ondernemingen onderling, dan wel met een onderzoeksorganisatie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236b
  - number: 2:36b.2
    text: 'Geen subsidie wordt verstrekt aan een onderzoeksproject gericht op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236b
  - number: 2:36b.2.a
    text: |-
      de ontwikkeling van mathematische modellen die de effectiviteit van diervoeders of van de productiemethode van
      diervoeders voorspellen onder uiteenlopende omstandigheden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236b
  - number: 2:36b.2.b
    text: het primair verhogen van de melkproductie per eenheid nutriëntenaanbod;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236b
  - number: 2:36b.2.c
    text: |-
      onderzoek naar de potentie van weidegras, graskuil, snijmais, maiszetmeel, graanzetmeel of zetmeelrijke producten
      uit de aardappelverwerkende industrie op het vlak van de reductie van methaanemissie in de pens of dikke darm van
      melkvee.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236b
  - number: 2:36b.3
    text: |-
      De Minister beslist afwijzend op een aanvraag om subsidie indien aannemelijk is dat de activiteiten ook zonder
      subsidie zonder belangrijke vertraging zouden worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236b
  - number: 2:36c
    text: |-
      Aanvragen tot subsidieverlening en subsidievaststelling voor een onderzoeksproject worden ingediend bij de Minister
      met gebruikmaking van een daartoe door de Minister verstrekt formulier en gaan vergezeld van een projectplan
      respectievelijk eindverslag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236c
  - number: 2:36d.1
    text: 'In het projectplan is ten minste opgenomen:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.1.a
    text: |-
      een onderbouwde hypothese of in vitro onderzoeksgegevens van de potentie van de te onderzoeken diervoeders
      of productiemethode van diervoeders of een onderbouwde hypothese of in vitro onderzoeksgegevens van het
      werkingsmechanisme van de te onderzoeken diervoeders of productiemethode van diervoeders;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.1.b
    text: |-
      verwachte gegevens omtrent de afwenteling naar andere (milieu)effecten, waaronder in ieder geval wordt begrepen:
      stikstofemissie, de kwaliteit en kwantiteit van de melkproductie, gezondheid van mens of dier, het milieu, en de
      dierlijke productie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.1.c
    text: verwachte netto-effect op de broeikasgasemissies.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.2
    text: |-
      In aanvulling op [artikel 1:14, vierde lid][ref1], moet in het eindverslag worden opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:36d.2.a
    text: een wetenschappelijke rapportage van de gegevens gegenereerd in het onderzoeksproject;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.2.b
    text: |-
      gegevens over het werkingsmechanisme of hypotheses over het werkingsmechanisme van het onderzochte diervoeder of
      productiemethode van diervoeder;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.2.c
    text: |-
      gegevens over de afwenteling naar andere (milieu) effecten, waaronder in ieder geval wordt begrepen:
      stikstofemissie, de kwaliteit en kwantiteit van de melkproductie, gezondheid van mens of dier, het milieu, en de
      dierlijke productie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36d.2.d
    text: een analyse van het netto-effect op de broeikasgasemissies.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236d
  - number: 2:36e.1
    text: |-
      In aanvulling, onderscheidenlijk afwijking van [artikel 1:15][ref1] zijn de subsidiabele kosten van een
      onderzoeksproject de volgende rechtstreeks aan de uitvoering van het onderzoeksproject toe te rekenen kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:36e.1.a
    text: loonkosten van direct bij het project betrokken personeel;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
  - number: 2:36e.1.b
    text: kosten van aanschaf van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
  - number: 2:36e.1.c
    text: |-
      afschrijvingskosten van machines en apparatuur op basis van de technische levensduur naar rato van het gebruik voor
      het project gedurende de projectperiode uitgaande van de historische aanschafwaarde verminderd met de restwaarde,
      met dien verstande dat in geval van lease wordt uitgegaan van de contante waarde van de gedurende de projectperiode
      betaalde leasetermijnen naar rato van het gebruik van de machines en apparatuur voor het project onder aftrek van
      de in de leasetermijnen begrepen vergoedingen voor financiering en afschrijving;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
  - number: 2:36e.1.d
    text: huurkosten van machines en apparatuur naar rato van het gebruik voor het project gedurende de projectperiode;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
  - number: 2:36e.1.e
    text: |-
      aan derden verschuldigde kosten ter zake van studies en onderzoeksactiviteiten en ter zake van de aanschaf van
      kennis en intellectuele eigendomsrechten alsmede ter zake van bescherming van die rechten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
  - number: 2:36e.2
    text: |-
      Voor subsidie komen alleen de kosten voor vergoeding in aanmerking die voldoen aan de eisen van de verordening
      (EG) nr. 800/2008.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236e
  - number: 2:36f.1
    text: De subsidie bedraagt per onderzoeksproject 50% van de subsidiabele kosten tot een maximum van € 250.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236f
  - number: 2:36f.2
    text: De subsidiabele kosten bedragen ten minste € 250.000 per onderzoeksproject.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236f
  - number: 2:36g.1
    text: |-
      De subsidieontvanger voert het onderzoeksproject in Nederland uit, behoudens toestemming van de Minister tot
      gedeeltelijke uitvoering buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236g
  - number: 2:36g.2
    text: |-
      De subsidieontvanger voert het onderzoeksproject uit binnen een periode van twee jaar na datum van
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236g
  - number: 2:36g.3
    text: |-
      De Minister kan de subsidieontvanger verplichten de gegevens genoemd in
      [artikel 2:36d, tweede lid, onderdelen a en b][ref1] te verstrekken aan het Rijksinstituut voor Volksgezondheid en
      Milieu voor de Nederlandse emissieregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236g
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:36h.1
    text: |-
      Er is een Adviescommissie Onderzoek naar emissiearm veevoeder die tot taak heeft de Minister op zijn verzoek te
      adviseren omtrent aanvragen om subsidie op grond van [artikel 2:36b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236h
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:36h.2
    text: De voorzitter en de leden worden benoemd voor een termijn van één jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236h
  - number: 2:36i.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het onderzoeksproject waarop
      de aanvraag betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:36i.1.a
    text: meer bijdraagt aan de doelstelling van deze subsidiemodule;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:36i.1.b
    text: van een betere kwaliteit is en de slaagkans van het project groter is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:36i.1.c
    text: |-
      wordt uitgevoerd in een samenwerkingsverband dat beter gericht is op het behalen van de doelstelling van deze
      subsidiemodule;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:36i.1.d
    text: een hogere kosteneffectiviteit kent;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:36i.1.e
    text: meer internationale uitwisseling van ervaringen, kennis en resultaten genereert.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:36i.2
    text: |-
      Voor de rangschikking weegt het in het eerste lid, onderdeel a, genoemde criterium, waarbij maximaal 35 punten te
      behalen zijn, mee voor 35/100, het in het eerste lid, onderdeel b, genoemde criterium, waarbij maximaal 30 punten
      te behalen zijn, mee voor 30/100, het in het eerste lid, onderdeel c, genoemde criterium, waarbij maximaal
      15 punten te behalen zijn, mee voor 15/100, het in het eerste lid, onderdeel d, genoemde criterium, waarbij
      maximaal 15 punten te behalen zijn, mee voor 15/100, het in het tweede lid, onderdeel e, genoemde criterium,
      waarbij maximaal 5 punten te behalen zijn, mee voor 5/100. Er geldt een drempel van 60 punten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:36i.3
    text: |-
      Aanvragen voor onderzoeksprojecten met minder dan 60 punten komen niet in aanmerking voor subsidie en zullen door
      de Minister worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel236i
  - number: 2:37.1
    text: |-
      De Minister kan voor een investering als bedoeld in [bijlage 2][ref1] bij deze regeling subsidie verstrekken aan
      landbouwondernemingen of samenwerkingsverbanden, genoemd bij die investering, voor zover die investering leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:37.1.a
    text: |-
      een hoger niveau van diergezondheid in Nederland en daardoor tot een beter technisch en economisch perspectief van
      en continuïteit binnen landbouwondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.b
    text: verlaging van de productiekosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.c
    text: de verbetering en omschakeling van de productie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.d
    text: |-
      de instandhouding en verbetering van het natuurlijk milieu, de hygiënische omstandigheden, dierenwelzijn,
      voedselveiligheid of duurzaam gebruik van energiebronnen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.e
    text: herstructurering en ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.f
    text: verhoging van de kwaliteit en toegevoegde waarde van producten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.g
    text: verbetering van de arbeidsomstandigheden in de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.h
    text: behoud en duurzaam gebruik van biodiversiteit en natuurlijke hulpbronnen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.i
    text: verhoging van de doelmatigheid bij inzet en gebruik van middelen, machines en menskracht, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.j
    text: het tot waarde brengen van bij-, rest- en afvalproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.1.k
    text: verbetering van de leefkwaliteit op het platteland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.2
    text: 'Een landbouwonderneming komt voor de subsidie in aanmerking indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.2.a
    text: door de investering de algehele prestatie van de landbouwonderneming wordt verbeterd, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.2.b
    text: de investering voldoet aan de daarvoor geldende EG-maatregelen en nationale voorschriften.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:37.3
    text: |-
      Aan een landbouwonderneming wordt geen subsidie verstrekt indien de subsidie betrekking heeft op
      vervangingsinvesteringen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel237
  - number: 2:38
    text: |-
      Een aanvraag tot subsidieverlening, subsidievaststelling of voorschotverlening gaat vergezeld van de documenten die
      in [bijlage 2][ref1] bij deze regeling zijn genoemd bij de investering waarop de subsidie betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:38a
    text: |-
      [Artikel 1:5][ref1] is van toepassing op aanvragen tot verlening van een subsidie voor een investering als bedoeld
      in [bijlage 2, hoofdstuk 7, punt A, categorieën 1 tot en met 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel238a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
  - number: 2:38b
    text: |-
      [Artikel 1:6][ref1] is van toepassing op aanvragen tot verlening van een subsidie voor een investering als bedoeld
      in [bijlage 2, hoofdstuk 8, punt A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel238b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
  - number: 2:39
    text: |-
      De subsidieontvanger voldoet in voorkomend geval aan de verplichtingen die in [bijlage 2][ref1] bij deze regeling
      zijn genoemd bij de investering waarop de subsidie betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:40.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
  - number: 2:40.1.a
    text: kosten voor de bouw, verwerving, inrichting of verbetering van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
  - number: 2:40.1.b
    text: kosten voor de aanschaf van nieuwe machines en apparatuur, waarvan de aanvrager eerste gebruiker is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
  - number: 2:40.1.c
    text: |-
      kosten voor de aanschaf van plantmateriaal en de kosten van derden voor het planten van blijvende teelten, bedoeld
      in artikel 2, onderdeel b, van verordening 1120/2009.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
  - number: 2:40.2
    text: |-
      Bij de kosten voor de verwerving van onroerende zaken zijn inbegrepen de daaraan verbonden kosten van
      overdrachtsbelasting, notariële kosten en de kosten van inschrijving bij het kadaster.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
  - number: 2:40.3
    text: |-
      Voor de subsidie komen niet in aanmerking kosten voor de verwerving van onroerende zaken met uitzondering van
      grond, ten behoeve waarvan subsidie door een bestuursorgaan is verleend in de periode van tien jaar voorafgaand aan
      de ontvangstdatum van de aanvraag tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
  - number: 2:40.4
    text: |-
      In [bijlage 2][ref1] bij deze regeling kan bij de investering waarop de subsidie betrekking heeft zijn bepaald dat
      kosten in aanmerking komen voor de subsidie, in aanvulling of in afwijking van het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:41
    text: 'De subsidie bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.a
    text: '60% van de subsidiabele kosten voor de investeringen door jonge landbouwers in:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.a.1°
    text: |-
      de door Nederland ter uitvoering van artikel 50, tweede en derde lid, van verordening (EG) nr. 1698/2005 aangewezen
      gebieden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.a.2°
    text: |-
      de door Nederland ter uitvoering van artikel 4 van [richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de
      Europese Gemeenschappen van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en
      fauna (PbEG L 206) op de lijst van beschermde gebieden opgenomen gebieden, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.a.3°
    text: |-
      de door Nederland ter uitvoering van artikel 6 van [richtlijn nr. 60/2000/EG](31960L2000) van het Europees
      Parlement en de Raad van de Europese Unie van 23 oktober 2000 tot vaststelling van een kader voor communautaire
      maatregelen betreffende het waterbeleid (PbEG L 327) in het register van beschermde gebieden aangewezen gebieden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.b
    text: |-
      50% van de subsidiabele kosten voor de investeringen door andere landbouwers dan jonge landbouwers in de gebieden,
      bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.c
    text: |-
      50% van de subsidiabele kosten voor de investeringen door jonge landbouwers in andere gebieden dan de gebieden,
      bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.d
    text: |-
      40% van de subsidiabele kosten voor de investeringen door andere landbouwers dan jonge landbouwers in andere
      gebieden dan de gebieden, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:41.e
    text: |-
      60% van de subsidiabele kosten voor investeringen voor zover het de noodzakelijke extra in aanmerking komende
      kosten betreft van investeringen die verder gaan dan volgens communautaire minimumeisen noodzakelijk is, dan wel
      60% van de subsidiabele kosten voor investeringen voor zover het de noodzakelijke extra in aanmerking komende
      kosten betreft van investeringen die verder gaan dan bij of krachtens wet vastgelegde minimumeisen noodzakelijk is
      indien deze minimumeisen verder gaan dan communautaire minimumeisen, en voor zover de extra in aanmerking komende
      kosten niet leiden tot investeringen die een stijging van de productiecapaciteit tot gevolg hebben.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel241
  - number: 2:42.1
    text: |-
      In aanvulling op [artikel 2:37, eerste lid][ref1], kan de Minister voor andere investeringen dan de investeringen,
      bedoeld in [bijlage 2][ref2] bij deze regeling, subsidie als bedoeld in dat artikel verstrekken aan een persoon die
      op het tijdstip van ontvangst van de aanvraag tot subsidieverlening een jonge landbouwer is en aan ten minste één
      van de volgende voorwaarden voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021281
  - number: 2:42.1.a
    text: |-
      hij beschikt over een getuigschrift van afronding van een erkende landbouwkundige opleiding of een opleiding van
      gelijkwaardig niveau, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
  - number: 2:42.1.b
    text: hij kan aantonen dat hij ten minste drie jaar op een landbouwonderneming werkzaam is geweest.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
  - number: 2:42.2
    text: |-
      In aanvulling op [artikel 2:37, derde lid][ref1], wordt geen subsidie verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:42.2.a
    text: de subsidie in totaal € 5.000 of minder bedraagt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
  - number: 2:42.2.b
    text: |-
      de jonge landbouwer met het oog op de investeringen een geldlening is aangegaan voordat de verlening van de
      subsidie hem schriftelijk is bevestigd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
  - number: 2:42.2.c
    text: |-
      op grond van deze paragraaf of de [Subsidieregeling jonge agrariërs][ref1], zoals deze gold voor het tijdstip van
      inwerkingtreding van deze regeling, eerder aan de jonge landbouwer subsidie is verstrekt of terzake van een eerdere
      aanvraag op grond van deze paragraaf nog een beslissing tot vaststelling van de subsidie moet worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0018190
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0018190
  - number: 2:42.2.d
    text: |-
      het eigen vermogen van de jonge landbouwer meer dan 60% van de fiscale balanswaarde van zijn landbouwonderneming
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
  - number: 2:42.2.e
    text: |-
      de jonge landbouwer uitsluitend beschikt over grond, waarvoor hij een pachtovereenkomst als bedoeld in
      [artikel 7:396 van het Burgerlijk Wetboek][ref1] heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel396
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '396'
  - number: 2:43
    text: |-
      [Artikel 1:5][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:44
    text: |-
      In afwijking van [artikel 2:38][ref1] gaat de aanvraag tot verlening van een subsidie als bedoeld in
      [artikel 2:42, eerste lid][ref2], vergezeld van een investeringsplan, waarin de investeringen waarvoor de subsidie
      wordt aangevraagd zijn opgenomen en waaruit blijkt hoe die investeringen bijdragen aan de doelstellingen, genoemd
      in [artikel 2:37, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:45.1
    text: |-
      Een subsidie als bedoeld in [artikel 2:42, eerste lid][ref1], wordt verleend onder de voorwaarde dat de
      subsidieontvanger met het oog op de investeringen een schriftelijke overeenkomst van geldlening met een looptijd
      van ten minste drie jaar afsluit met een bank.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:45.2
    text: |-
      De overeenkomst tot geldlening, bedoeld in het eerste lid, wordt aangegaan voor ten minste de hoogte van de
      subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel245
  - number: 2:45.3
    text: 'Ingeval de subsidie strekt tot verwerving van onroerende zaken, wordt deze verleend onder de voorwaarde dat:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel245
  - number: 2:45.3.a
    text: |-
      de daaraan verbonden kosten, met uitzondering van kosten van overdrachtsbelasting, notariële kosten en de kosten
      van inschrijving bij het kadaster, niet hoger zijn dan een door een taxateur vastgestelde vrije verkoopwaarde van
      de onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel245
  - number: 2:45.3.b
    text: |-
      een taxateur heeft vastgesteld dat gebouwen voldoen aan de nationale voorschriften die op gebouwen van toepassing
      zijn, voor zover de onroerende zaken gebouwen betreffen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel245
  - number: 2:45.4
    text: |-
      Een taxateur als bedoeld in het tweede lid voldoet aan de vakbekwaamheidseisen, bedoeld in
      [artikel 3 van de Uitvoeringsregeling vakbekwaamheidseisen Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007229#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0007229
        artikel: '3'
  - number: 2:46.1
    text: De subsidiabele kosten bedragen nooit meer dan € 150.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel246
  - number: 2:46.2
    text: De subsidie bedraagt ten minste € 5000 en ten hoogste 35% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel246
  - number: 2:47.1
    text: |-
      De Minister kan subsidie verstrekken voor de uitvoering van een project dat een samenhangend geheel van
      activiteiten vormt, welke de algehele prestatie van de onderneming verbeteren en betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.1.a
    text: de verwerking of de afzet van landbouwproducten of bosbouwproducten, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.1.b
    text: de ontwikkeling van nieuwe producten, procédés en technologieën voor de landbouwproducten of bosbouwproducten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.2
    text: 'De activiteiten zijn gericht op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.2.a
    text: |-
      rationalisatie en ontwikkeling van het verkoopklaar maken, de verduurzaming, de behandeling en de verwerking van
      landbouwproducten, het hergebruik van bijproducten of fabricageresiduen dan wel de verwijdering of zuivering van
      afval;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.2.b
    text: |-
      toepassing van nieuwe verwerkingstechnieken, waaronder de ontwikkeling van nieuwe producten en bijproducten en het
      openen van nieuwe markten, alsmede innoverende investeringen met betrekking tot producten, procédés en processen,
      technologieën, product-marktcombinaties en andere innovaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.2.c
    text: verbetering van de afzet op de markt, met inbegrip van verbetering van de doorzichtigheid van de prijsvorming, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.2.d
    text: verbetering van de kwaliteit van de producten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.3
    text: 'Voor de subsidie komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.3.a
    text: landbouwondernemingen of bosbouwondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.3.b
    text: samenwerkingsverbanden van landbouwondernemingen of bosbouwondernemingen onderling of met agro-MKB-ondernemingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.4
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.4.a
    text: voor projecten die erop zijn gericht om te voldoen aan EG-maatregelen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:47.4.b
    text: |-
      aan ondernemingen als bedoeld in paragraaf 2.1 van de communautaire richtsnoeren voor reddings- en
      herstructureringssteun (PbEU C 244).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel247
  - number: 2:48.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:48.1.a
    text: kosten voor de bouw, verwerving, verbetering of inrichting van onroerende goederen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:48.1.b
    text: |-
      kosten voor de aankoop of huurkoop van nieuwe machines en apparatuur, inclusief computersoftware tot aan de
      marktwaarde van het goed;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:48.1.c
    text: kosten voor de ontwikkeling van nieuwe machines of apparatuur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:48.1.d
    text: |-
      kosten voor de ontwikkeling en operationalisering van processen, procédés, technologieën, marketingconcepten,
      product-marktcombinaties en andere innovaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:48.1.e
    text: |-
      algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met d, zoals kosten voor de architecten
      en ingenieurs, honoraria van adviseurs tot een hoogte van 15% van het totale subsidiebedrag, haalbaarheidsstudies,
      controleverklaring van een accountant, verwerven van patenten en vergunningen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:48.2
    text: |-
      Geen subsidie wordt verstrekt voor kosten met betrekking tot een leasecontract, zoals de marge van de
      leaseorganisatie, herfinancieringskosten, overheadkosten en verzekeringspremies.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel248
  - number: 2:49
    text: De subsidie bedraagt ten hoogste 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel249
  - number: 2:50
    text: De Minister kan aan een landbouwonderneming subsidie verstrekken voor deelname aan een voedselkwaliteitsregeling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel250
  - number: 2:51
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:52
    text: |-
      Voor de subsidie komen in aanmerking de vaste kosten verbonden aan deelname aan de voedselkwaliteitsregeling met
      inbegrip van de kosten voor controles die zijn verbonden aan de deelname.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel252
  - number: 2:53.1
    text: |-
      De subsidie bedraagt ten hoogste € 3.000 per jaar dat een landbouwonderneming deelneemt aan een
      voedselkwaliteitsregeling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel253
  - number: 2:53.2
    text: |-
      Ingeval een landbouwonderneming voor een deel van een jaar deelneemt aan een voedselkwaliteitsregeling, wordt een
      subsidiebedrag dat in verhouding staat tot dat deel vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel253
  - number: 2:53.3
    text: De subsidie wordt ten hoogste voor vijf jaar verleend.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel253
  - number: 2:53.4
    text: |-
      De subsidie wordt niet verstrekt indien de landbouwonderneming eerder subsidie heeft ontvangen voor deelname aan
      een voedselkwaliteitsregeling en daarmee in het totaal meer dan 5 jaar subsidie zou ontvangen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel253
  - number: 2:54
    text: De Minister verleent jaarlijks ambtshalve voorschot.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel254
  - number: 2:55.1
    text: |-
      In aanvulling op [paragraaf 1][ref1] is deze paragraaf van toepassing ingeval de
      subsidie, bedoeld in [artikel 2:50][ref2], wordt aangevraagd ter stimulering van de
      omschakeling naar of voortzetting van de biologische productiemethode, bedoeld in
      [artikel 1, eerste lid, van het Landbouwkwaliteitsbesluit biologische productiemethode][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005740#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0021281
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005740
        artikel: '1'
  - number: 2:55.2
    text: |-
      Voor de subsidie komt in aanmerking een landbouwonderneming die is aangesloten bij de Stichting Skal, statutair
      gevestigd te Zwolle.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel255
  - number: 2:56
    text: |-
      Met de indiening van een aanvraag tot verlening van de subsidie stemt de aanvrager ermee in dat de Stichting Skal
      aan de Minister alle gegevens overlegt die betrekking hebben op de uitoefening van de biologische productiemethode
      op zijn landbouwonderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel256
  - number: 2:57.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel257
  - number: 2:57.1.a
    text: |-
      de eenmalige aansluitingsbijdrage, bedoeld in [artikel 2 van het Skal-bijdragereglement][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0018852#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0018852
        artikel: '2'
  - number: 2:57.1.b
    text: |-
      de basisbijdrage, bedoeld in [artikel 3, onderdeel a, van het Skal-bijdragereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018852#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0018852
        artikel: '3'
  - number: 2:57.2
    text: |-
      Incassokosten, administratiekosten en overige kosten die zijn verbonden aan de inning van de in het eerste lid
      bedoelde bijdragen komen niet in aanmerking voor de subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel257
  - number: 2:58.1
    text: |-
      De Minister kan aan een producentengroepering subsidie verstrekken voor activiteiten die bedoeld zijn om
      consumenten aan te zetten tot aankoop van landbouwproducten die vallen onder een voedselkwaliteitsregeling, al dan
      niet via distributeurs of verwerkers van die producten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.2
    text: |-
      De activiteiten vestigen de aandacht op specifieke kenmerken van producten die voortvloeien uit
      voedselkwaliteitsregelingen, waaronder met name de kwaliteit, productiemethode, het niveau van dierenwelzijn en
      milieuvriendelijkheid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.3
    text: 'Geen subsidie wordt verstrekt voor activiteiten:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.3.a
    text: ter promotie van geregistreerde merken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.3.b
    text: waarmee de consument ertoe wordt aangezet om een product te kopen vanwege de specifieke herkomst van het product;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.3.c
    text: |-
      waarbij de verwijzing naar de oorsprong van een product niet ondergeschikt is aan de hoofdboodschap van de
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.3.d
    text: |-
      waarvoor reeds subsidie is verstrekt ter uitvoering van [verordening (EG) nr. 2826/2000](32000R2826) van de Raad
      van de Europese Unie betreffende voorlichtings- en afzetbevorderingsacties voor landbouwproducten op de binnenmarkt
      (PbEG L 328);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.3.e
    text: die worden uitgevoerd buiten de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.4
    text: |-
      Het derde lid, aanhef in samenhang met onderdeel b, is niet van toepassing ingeval het gaat om producten waarvoor
      een kwaliteitsschema is erkend in het kader van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.4.a
    text: |-
      titel VI van [verordening (EG) nr. 1493/1999](31999R1493) van de Raad van de Europese Unie van 17 mei 1999 houdende
      een gemeenschappelijke ordening van de wijnmarkt (PbEG L 179);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:58.4.b
    text: |-
      [verordening (EG) nr. 510/2006](32006R0510) van de Raad van de Europese Unie van 20 maart 2006 inzake de
      bescherming van geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU
      L 93).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel258
  - number: 2:59
    text: 'De subsidieontvanger:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel259
  - number: 2:59.a
    text: zendt het materiaal dat hij voornemens is te gebruiken bij de activiteiten aan de Minister, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel259
  - number: 2:59.b
    text: gebruikt het materiaal uitsluitend binnen de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel259
  - number: 2:60
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel260
  - number: 2:60.a
    text: |-
      kosten voor het verspreiden van technische en wetenschappelijke kennis over producten die het voorwerp zijn van
      een voedselkwaliteitsregeling;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel260
  - number: 2:60.b
    text: |-
      kosten voor de organisatie van of deelname aan beurzen, tentoonstellingen of vergelijkbare public relations-
      evenementen die betrekking hebben op producten die het voorwerp zijn van een voedselkwaliteitsregeling;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel260
  - number: 2:60.c
    text: |-
      kosten voor het adverteren via diverse media of bij verkooppunten over producten die het voorwerp zijn van een
      voedselkwaliteitsregeling;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel260
  - number: 2:60.d
    text: kosten voor marktverkenning.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel260
  - number: 2:61
    text: De subsidie bedraagt ten hoogste 70% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel261
  - number: 2:62
    text: |-
      Ter verbetering van de bedrijfsstructuur van de glastuinbouwsector kan de Minister aan eigenaren van glasopstanden
      die hun onderneming staken subsidie verstrekken voor de afbraak van verouderde glasopstanden en daarbij behorende
      bedrijfsgebouwen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel262
  - number: 2:63
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:64.1
    text: 'De subsidieontvanger draagt er zorg voor dat binnen een jaar na de datum van subsidieverlening:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.1.a
    text: |-
      de glasopstanden, de daarbij behorende bedrijfsgebouwen, overige vaste installaties en ondergrondse voorzieningen
      worden afgebroken en verwijderd, alsmede nieuwe sloten worden gegraven;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.1.b
    text: |-
      hij en in voorkomend geval diens echtgenoot, geregistreerde partner of aandeelhouders, de bedrijfsmatige
      glastuinbouw definitief staakt, onderscheidenlijk staken, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.1.c
    text: |-
      de tot uitoefening van de betrokken glastuinbouwonderneming bestemde gronden gebruiksvrij worden overgedragen aan
      een natuurlijke persoon of rechtspersoon, niet zijnde een vennootschap waarin de stakende eigenaar aandelen heeft.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.2
    text: 'De overdracht, bedoeld in het eerste lid, onderdeel c, vindt plaats door middel van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.2.a
    text: overdracht van eigendom;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.2.b
    text: vestiging van erfpacht;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.2.c
    text: vestiging van een recht van opstal, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:64.2.d
    text: vestiging van een pachtrecht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel264
  - number: 2:65
    text: |-
      De aanvraag tot subsidievaststelling wordt ingediend binnen vier maanden nadat de overdracht van gronden, bedoeld
      in [artikel 2:64, eerste lid, onderdeel c][ref1], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:66.1
    text: 'De subsidie bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel266
  - number: 2:66.1.a
    text: € 3,50 per m2 glasoppervlak dat wordt afgebroken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel266
  - number: 2:66.1.b
    text: € 25 per m2 bedrijfsgebouw dat wordt afgebroken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel266
  - number: 2:66.1.c
    text: € 2,50 per m2 betonnen teeltvloer dat wordt afgebroken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel266
  - number: 2:66.1.d
    text: € 4 per m3 per nieuw gegraven sloot.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel266
  - number: 2:66.2
    text: |-
      Subsidies die in de vijf jaar voorafgaand aan de ontvangstdatum van de aanvraag tot subsidieverlening door een
      bestuursorgaan zijn verstrekt met betrekking tot de bouw of verbouwing van de glasopstanden en bedrijfsgebouwen,
      worden in mindering gebracht op de subsidie voor de afbraak daarvan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel266
  - number: 2:67
    text: Een aanvraag tot subsidieverlening gaat vergezeld van een overzicht van liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel267
  - number: 2:68
    text: |-
      De Minister kan een tegemoetkoming verstrekken voor door weersomstandigheden veroorzaakte schade aan gewassen
      overeenkomstig [Bijlage 3][ref1] en [3a][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
      [ref2]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0021281
      - id: ref2
        bwb_id: BWBR0021281
  - number: 2:69
    text: |-
      De Minister kan een tegemoetkoming verstrekken voor premies voor weerschadeverzekeringen overeenkomstig
      [Bijlage 4][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:69a
    text: |-
      Voor de toepassing van [paragraaf 3 van titel 11][ref1] wordt verstaan onder communautaire richtsnoeren: Mededeling
      van de Commissie van de Europese Gemeenschappen van 1 oktober 2004 aangaande communautaire richtsnoeren inzake
      reddings- en herstructureringssteun aan ondernemingen in moeilijkheden (PbEU C 244).


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69b
    text: |-
      [Artikel 2:1a, onderdeel a][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:69c.1
    text: |-
      De minister kan subsidie verstrekken aan een onderneming die zodanig ernstig is getroffen door maatregelen ter
      bestrijding van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.1.a
    text: |-
      een dierziekte als bedoeld in de
      __REF000___________________________________________________________________________________________________________
      ________________________, of


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '2'
  - number: 2:69c.1.b
    text: |-
      een schadelijk organisme als bedoeld in [artikel 3 van de Regeling aanwijzing schadelijke organismen 1998][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009774#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
    references:
      - id: ref1
        bwb_id: BWBR0009774
        artikel: '3'
  - number: 2:69c.2
    text: De subsidie, bedoeld in het eerste lid, wordt verstrekt in de vorm van reddingssteun of herstructureringssteun.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3
    text: 'De subsidie, bedoeld in het eerste lid, wordt niet verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.a
    text: |-
      aan ondernemingen waar 50 of meer personen werkzaam zijn of waarvan de omzet of het balanstotaal meer bedraagt dan
      € 10.000.000,– per jaar;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.b
    text: aan andere ondernemingen dan landbouwondernemingen die niet voldoen aan punt 10 van de communautaire richtsnoeren;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.c
    text: aan ondernemingen die korter dan drie jaar actief zijn;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.d
    text: |-
      indien er een mogelijkheid bestaat voor de onderneming zich te verzekeren tegen de gevolgen van de maatregelen,
      bedoeld in het eerste lid, onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.e
    text: indien een onderneming deel uitmaakt van een concern of wordt overgenomen door een concern;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.f
    text: |-
      indien een onderneming in staat is met eigen middelen, met middelen van haar eigenaren of aandeelhouders of met op
      de markt verkregen kapitaal haar herstel te verwezenlijken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.g
    text: indien de gevraagde subsidie minder dan € 5.000,– bedraagt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.h
    text: |-
      aan ondernemingen die actief zijn op een markt waarbij sprake is van een structureel overschot aan
      productiecapaciteit, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69c.3.i
    text: |-
      aan ondernemingen die in aanmerking kunnen komen voor steun op grond van titel IV, hoofdstuk I, II en III, van
      verordening (EG) nr. 1198/2006 van de Raad van de Europese Unie van 20 maart 2006 inzake het Europees Visserijfonds
      (PbEU L 223).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269c
  - number: 2:69d
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:69e
    text: |-
      De subsidie, bedoeld in [artikel 2:69c, eerste lid][ref1], bedraagt per onderneming in moeilijkheden ten hoogste
      € 100.000,– met inbegrip van subsidie uit eventuele andere bronnen of op grond van andere regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269e
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69f.1
    text: |-
      Subsidie zijnde reddingssteun is een subsidie die eenmalig wordt verstrekt in de vorm van een lening of een
      leninggarantie die afloopt binnen zes maanden na de uitkering van het eerste bedrag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269f
  - number: 2:69f.2
    text: 'De subsidie, bedoeld in het eerste lid, wordt niet verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269f
  - number: 2:69f.2.a
    text: indien de onderneming reeds eerder reddings- of herstructureringssteun heeft ontvangen, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269f
  - number: 2:69f.2.b
    text: |-
      indien deze niet wordt gerechtvaardigd door ernstige sociale moeilijkheden of buitengewoon ongunstige spill-
      overeffecten als bedoeld in de communautaire richtsnoeren heeft naar andere lidstaten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269f
  - number: 2:69g.1
    text: |-
      [Artikel 2:69f][ref1] is van toepassing ongeacht wijzigingen in eigendomsstructuur van de onderneming na
      verstrekking van de subsidie, of eventuele gerechtelijke of administratieve procedures die tot gevolg hebben dat
      de vermogenspositie van de onderneming wordt gesaneerd, haar passiva worden verminderd of vroegere schulden worden
      aangezuiverd, zolang het dezelfde onderneming is die de exploitatie voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269g
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69g.2
    text: |-
      Indien een onderneming activa van een andere onderneming heeft overgenomen en de overgenomen onderneming heeft
      reddings- of herstructureringssteun ontvangen, kan overeenkomstig deze regeling eenmalig reddingssteun aan de
      onderneming worden verstrekt mits:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269g
  - number: 2:69g.2.a
    text: de onderneming duidelijk los staat van de overgenomen onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269g
  - number: 2:69g.2.b
    text: de onderneming de activa van de overgenomen onderneming tegen de marktprijs heeft verworven, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269g
  - number: 2:69g.2.c
    text: |-
      de liquidatie of het beheer onder gerechtelijk toezicht of overname van de activa niet louter middelen zijn om te
      ontsnappen aan de toepassing van [artikel 2:69f][ref1], ingeval de overgenomen onderneming aan een collectieve
      insolventieprocedure of aan een van de in het eerste lid genoemde procedures is onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269g
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69h.1
    text: 'De ontvanger van subsidie zijnde reddingssteun:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269h
  - number: 2:69h.1.a
    text: betaalt de subsidie in de vorm van een lening binnen zes maanden na verstrekking terug, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269h
  - number: 2:69h.1.b
    text: |-
      dient binnen twee maanden na verstrekking van de subsidie een herstructureringsplan ter goedkeuring in bij de
      Minister. Op het herstructureringsplan is [artikel 2:69n][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269h
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69h.2
    text: |-
      Indien de ontvanger, bedoeld in het eerste lid, een herstructureringsplan heeft ingediend, zijn de
      [artikelen 2:69m][ref1] en [2:69o][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269h
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69h.3
    text: |-
      Indien een onderneming nadat de subsidie zijnde reddingssteun is ontvangen, binnen de periode, bedoeld in het
      eerste lid, onderdeel a, haar bedrijfsvoering beëindigt, doet de ontvanger daarvan melding aan de Minister en geeft
      de ontvanger desgevraagd alle informatie aan de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269h
  - number: 2:69i.1
    text: |-
      De aanvrager van subsidie zijnde reddingssteun verstrekt bij de aanvraag in ieder geval de volgende gegevens aan
      de Minister:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.1.a
    text: naam van de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.1.b
    text: de code van de bedrijfstak waartoe zij behoort, overeenkomstig de uit twee cijfers bestaande NACE-code;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.1.c
    text: het aantal werknemers van de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.1.d
    text: een recente balans, de jaarrekeningen van de afgelopen 3 jaren en een recent fiscaal rapport;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.1.e
    text: een bankverklaring waarin de bank verklaart dat alle gebruikelijke financieringsmogelijkheden zijn benut;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.1.f
    text: in voorkomend geval, gegevens over in het verleden verleende herstructureringssteun of daarmee vergelijkbare steun.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.2
    text: |-
      In zijn aanvraag geeft de aanvrager aan wat de oorzaken zijn van de moeilijkheden en onderbouwt hij de hoogte van
      de aangevraagde subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69i.3
    text: De aanvrager geeft desgevraagd aan de Minister alle informatie omtrent zijn financiële situatie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269i
  - number: 2:69j.1
    text: |-
      Onverminderd [artikel 2:69e][ref1] bedraagt de subsidie per onderneming in moeilijkheden niet meer dan het bedrag,
      berekend volgens de in de bijlage bij de communautaire richtsnoeren beschreven formule.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269j
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69j.2
    text: |-
      De subsidie bedraagt niet meer dan het bedrag dat nodig is om de exploitatie van de onderneming voort te zetten
      gedurende een periode van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269j
  - number: 2:69j.3
    text: |-
      Het rentepercentage op de verstrekte lening is vergelijkbaar aan het rentepercentage dat van toepassing is op
      leningen aan gezonde ondernemingen en met name aan de referentiepercentages, bedoeld in punt 25, onderdeel a, van
      de communautaire richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269j
  - number: 2:69k.1
    text: |-
      Subsidie zijnde herstructureringssteun is een subsidie die eenmalig wordt verstrekt in de vorm van een
      gekapitaliseerde rentesubsidie voor een lening bij een bank.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269k
  - number: 2:69k.2
    text: De lening, bedoeld in het eerste lid, heeft een looptijd van ten hoogste 10 jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269k
  - number: 2:69k.3
    text: |-
      De subsidie zijnde herstructureringssteun wordt niet verstrekt indien de onderneming eerder reddings- of
      herstructureringssteun heeft ontvangen, tenzij de subsidie is aangevraagd in vervolg op de verstrekking van
      reddingssteun als bedoeld in [artikel 2:69h, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269k
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69l.1
    text: |-
      [Artikel 2:69k][ref1] is van toepassing ongeacht wijzigingen in de eigendomsstructuur van de onderneming na
      verstrekking van de subsidie, of eventuele gerechtelijke of administratieve procedures die tot gevolg hebben dat
      de vermogenspositie van de onderneming wordt gesaneerd, haar passiva worden verminderd of vroegere schulden worden
      aangezuiverd, zolang het dezelfde onderneming is die de exploitatie voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269l
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69l.2
    text: |-
      Indien een onderneming activa van een andere onderneming heeft overgenomen en de overgenomen onderneming heeft
      reddings- of herstructureringssteun ontvangen, kan overeenkomstig deze regeling eenmalig herstructureringssteun aan
      de onderneming worden verstrekt mits:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269l
  - number: 2:69l.2.a
    text: de onderneming duidelijk los staat van de overgenomen onderneming,
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269l
  - number: 2:69l.2.b
    text: de onderneming de activa van de overgenomen onderneming tegen de marktprijs heeft verworven, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269l
  - number: 2:69l.2.c
    text: |-
      de liquidatie of het beheer onder gerechtelijk toezicht of overname van de activa niet louter middelen zijn om te
      ontsnappen aan de toepassing van [artikel 2:69k][ref1], ingeval de overgenomen onderneming aan een collectieve
      insolventieprocedure of aan een van de in het eerste lid genoemde procedures is onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269l
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69m.1
    text: 'De onderneming ten behoeve waarvan subsidie zijnde herstructureringsteun is ontvangen:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269m
  - number: 2:69m.1.a
    text: werkt volgens het door de Minister goedgekeurde herstructureringsplan en voert het plan volledig uit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269m
  - number: 2:69m.1.b
    text: |-
      neemt, indien het een landbouwonderneming betreft, compenserende maatregelen als bedoeld in punt 38 tot en met 42
      van de communautaire richtsnoeren waarbij de levensvatbaarheid van de onderneming niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269m
  - number: 2:69m.2
    text: |-
      Gedurende de looptijd van het herstructureringsplan is het ondernemingen niet toegestaan om de productiecapaciteit
      van de desbetreffende onderneming te verhogen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269m
  - number: 2:69m.3
    text: |-
      De subsidie wordt niet gebruikt voor de financiering van activiteiten die met het herstructureringsproces geen
      verband houden of voor nieuwe investeringen die niet noodzakelijk zijn voor herstel van de levensvatbaarheid van
      de onderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269m
  - number: 2:69n.1
    text: |-
      De aanvrager dient bij zijn aanvraag een herstructureringsplan in dat is gericht op herstel van de
      levensvatbaarheid van de onderneming op lange termijn, als bedoeld in punt 34 tot en met 37 van de communautaire
      richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.2
    text: |-
      Het herstructureringsplan houdt rekening met de actuele situatie en de verwachte ontwikkeling van vraag en aanbod
      aan de hand van best-case, worst-case en neutrale scenario’s, alsmede de specifieke sterke en zwakke punten van de
      onderneming en stelt de onderneming in staat de overgang te maken naar een nieuwe structuur die uitzicht biedt op
      levensvatbaarheid op lange termijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3
    text: |-
      Om voor subsidie in aanmerking te komen bevat het herstructureringsplan, bedoeld in het eerste lid, ten minste de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.a
    text: prijzen van producten en diensten onderbouwd door een onafhankelijke marktstudie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.b
    text: een analyse van de oorzaken van de moeilijkheden van de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.c
    text: een uiteenzetting van de toekomststrategie van de onderneming en hoe deze tot levensvatbaarheid zal leiden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.d
    text: een overzicht en beschrijving van de voorgenomen herstructureringsmaatregelen en de daaraan verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.e
    text: de termijnen voor de tenuitvoerlegging van de maatregelen en de tenuitvoerlegging van het herstructureringsplan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.f
    text: |-
      informatie over de productiecapaciteit van de onderneming, met name over de bezetting van deze capaciteit en
      eventuele capaciteitsverminderingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.g
    text: |-
      een beschrijving van de financiële regelingen met het oog op de herstructurering, waarbij ingegaan wordt op: -
      gebruik van eventuele beschikbare eigen middelen;
        - verkoop van activa of dochterondernemingen om bij te dragen aan de financiering van de herstructurering;
        - financiële toezeggingen van aandeelhouders en derden;
        - het gewenste bedrag van de overheidssteun en de motivering van de noodzaak van deze steun;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.h
    text: |-
      de verwachte resultatenrekeningen voor de eerstkomende vijf jaar met een raming van de rentabiliteit van het eigen
      vermogen en een gevoeligheidsanalyse op basis van de in het tweede lid bedoelde scenario’s, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.3.i
    text: naam van de opsteller van het herstructureringsplan en de datum waarop dit is opgesteld.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.4
    text: |-
      In zijn aanvraag geeft de aanvrager aan wat de oorzaken zijn van de moeilijkheden en onderbouwt hij de hoogte van
      de aangevraagde subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.5
    text: |-
      Bij zijn aanvraag verstrekt de aanvrager een bankverklaring waarin de bank verklaart dat alle gebruikelijke
      financieringsmogelijkheden zijn benut.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69n.6
    text: De aanvrager geeft desgevraagd aan de Minister alle informatie omtrent zijn financiële situatie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269n
  - number: 2:69o.1
    text: |-
      Het herstructureringsplan vormt onderdeel van de beschikking tot subsidieverstrekking en wordt door de
      subsidieontvanger volledig uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269o
  - number: 2:69o.2
    text: De minister kan goedkeuring verlenen aan tussentijdse wijzigingen van het herstructureringsplan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269o
  - number: 2:69o.3
    text: |-
      De goedkeuring, bedoeld in het tweede lid, wordt uitsluitend verleend, indien wijziging van het plan, voor zover
      van toepassing, in overeenstemming is met punt 52 en 53 van de communautaire richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269o
  - number: 2:69p.1
    text: |-
      Onverminderd [artikel 2:69e][ref1] bedraagt de subsidie niet meer dan het bedrag dat strikt noodzakelijk is voor
      uitvoering van de herstructurering van de onderneming, in samenhang met eerder toegekende reddingssteun en de
      voorhanden zijnde financiële middelen van de onderneming of van haar aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269p
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:69p.2
    text: |-
      De subsidie wordt uitsluitend verstrekt indien de onderneming met eigen middelen of door externe financiering een
      financiële bijdrage aan het herstructureringsplan levert die zo hoog mogelijk is, minstens 25% bedraagt van de
      kosten die aan het herstructureringsplan verbonden zijn, en reëel en actueel is onder uitsluiting van alle voor de
      toekomst verwachte winst en kasstromen van de onderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269p
  - number: 2:69p.3
    text: |-
      In aanvulling op het eerste lid wordt de subsidie op een zodanig bedrag vastgesteld dat daarmee uitgesloten is dat
      de subsidie mede kan worden gebruikt voor financiering van activiteiten die met het herstructureringsproces geen
      verband houden of voor nieuwe investeringen die voor het herstel van de levensvatbaarheid van de onderneming niet
      onmisbaar zijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel269p
  - number: 2:70.1
    text: |-
      De Minister kan subsidie in de vorm van een garantstelling verstrekken voor de terugbetaling van een lening, voor
      zover deze strekt tot financiering van investeringen in de stichting, overname, instandhouding of verbetering van
      een kleine of middelgrote landbouwonderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel270
  - number: 2:70.2
    text: 'Investeringen als bedoeld in het eerste lid zijn gericht op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel270
  - number: 2:70.2.a
    text: verlaging van de productiekosten van landbouwproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel270
  - number: 2:70.2.b
    text: verbetering en omschakeling van de productie van landbouwproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel270
  - number: 2:70.2.c
    text: verhoging van de kwaliteit van landbouwproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel270
  - number: 2:70.2.d
    text: |-
      instandhouding en verbetering van het natuurlijke milieu of de verbetering van de hygiëneomstandigheden of de
      normen inzake dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel270
  - number: 2:71
    text: 'Geen garantstelling wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.a
    text: |-
      voor de terugbetaling van leningen die zijn gericht op de herfinanciering van schulden, daaronder mede begrepen
      niet door een bank verstrekte leningen alsmede leningen welke worden aangegaan om kapitaalbehoefte, ontstaan door
      het uittreden van een commanditaire vennoot uit een commanditaire vennootschap, te dekken, behoudens ingeval van
      overmacht;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.b
    text: indien ten aanzien van de investeringen reeds een krediet is verstrekt of onvoorwaardelijk is toegezegd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.c
    text: aan andere landbouwondernemingen dan kleine of middelgrote ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.d
    text: |-
      indien de landbouwonderneming een bruto-jaaromzet heeft of zal hebben die voor de helft of minder wordt verkregen
      uit de primaire productie van landbouwproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.e
    text: |-
      indien aan de aanvrager reeds een garantstelling is verstrekt door de Minister of het bestuur van de Stichting
      Borgstellingsfonds voor de Landbouw, en: - die garantstelling is verleend in het tijdvak van twee jaren voorafgaand
      aan de datum van ontvangst van de aanvraag, of
        - met garantstelling waarop de aanvraag betrekking heeft het totaal aan garantstellingen, verleend aan de
      landbouwonderneming € 2.500.000 of hoger wordt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.f
    text: |-
      voor de terugbetaling van leningen met betrekking tot een landbouwonderneming die wordt uitgeoefend door een
      commanditaire vennootschap, tenzij uit de betrokken vennootschapsovereenkomst blijkt dat deze ten minste is
      aangegaan voor een periode, overeenkomende met de looptijd van de lening, waarvoor de aanvraag wordt ingediend, en
      in elk geval gedurende deze looptijd niet kan worden opgezegd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.g
    text: indien het bancair aansprakelijk vermogen van de aanvrager minder dan 15% bedraagt van het balanstotaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.h
    text: |-
      indien de verstrekking van de garantstelling de landbouwonderneming naar het oordeel van de Minister onvoldoende
      liquiditeitstoename oplevert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.i
    text: |-
      indien de begroting van de landbouwonderneming naar het oordeel van de Minister onvoldoende middelen bevat om
      eventuele exploitatietekorten van de landbouwonderneming op te vangen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.j
    text: |-
      indien de begroting van de landbouwonderneming naar het oordeel van de Minister onvoldoende middelen bevat om in de
      toekomst noodzakelijke investeringen te kunnen verrichten in de landbouwonderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:71.k
    text: ingeval de lening waarvoor de garantstelling wordt verstrekt in totaal minder dan € 50.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel271
  - number: 2:72.1
    text: 'De garantstelling wordt uitsluitend verstrekt aan aanvragers die:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.1.a
    text: |-
      wegens het ontbreken van de daartoe benodigde zekerheden volgens normaal bankgebruik onvoldoende financiering voor
      de landbouwonderneming kunnen krijgen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.1.b
    text: |-
      voor zover rechtens is toegestaan, op alle hen toebehorende zaken goederenrechtelijke zekerheid verlenen voor alle
      door de bank te verstrekken financieringen, waaronder de lening waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.1.c
    text: |-
      beschikken over de wettelijk vereiste bescheiden ter zake van de vestiging en uitoefening van de
      landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.1.d
    text: |-
      de Minister machtigen tot gebruik van de door hen op grond van [artikel 24, eerste lid, van de Landbouwwet][ref1]
      verstrekte gegevens voor de controle van de te verlenen garantstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
  - number: 2:72.2
    text: 'Voor de garantstelling komen natuurlijke personen in aanmerking indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.2.a
    text: |-
      zij de landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft voor eigen rekening en risico
      beheren;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.2.b
    text: 'zij aan ten minste één van de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.2.b.1°
    text: |-
      zij beschikken over een getuigschrift van afronding van een erkende landbouwkundige opleiding of opleiding van
      gelijkwaardig niveau, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.2.b.2°
    text: zij kunnen aantonen dat zij ten minste drie jaar op een landbouwonderneming werkzaam zijn geweest, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.2.c
    text: |-
      elk van hen aan de vereisten uit het eerste lid voldoet, en een van hen aan de voorwaarden uit onderdeel b voldoet,
      ingeval meer dan een persoon voor gezamenlijke rekening en risico de landbouwonderneming beheren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.3
    text: 'Voor de garantstelling komen rechtspersonen in aanmerking indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.3.a
    text: zij blijkens de statuten de exploitatie van een of meer landbouwondernemingen ten doel hebben;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.3.b
    text: |-
      zij de landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft onder leiding van een
      bedrijfsleider hebben gesteld die voldoet aan één van de voorwaarden, gesteld in het tweede lid, onderdeel b, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.3.c
    text: |-
      de bestuurders zich hoofdelijk verbinden tot de volledige terugbetaling van de lening waarop de aanvraag betrekking
      heeft, alsmede hun hele vermogen tot zekerheid terzake stellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:72.4
    text: De Minister kan ontheffing verlenen van het bepaalde in het derde lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel272
  - number: 2:73.1
    text: 'De garantstelling wordt uitsluitend verstrekt ten behoeve van een lening die:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.1.a
    text: |-
      is verstrekt door een bank waarmee de Minister een raamovereenkomst, waarin de rechten en plichten van de Minister
      en de bank zijn vastgelegd, heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.1.b
    text: |-
      een looptijd heeft van ten hoogste twintig jaar, met dien verstande dat de bank de looptijd met ten hoogste twee
      jaar kan verlengen in geval van betalingsmoeilijkheden, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.1.c
    text: lineair wordt afgelost.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.2
    text: |-
      Uiterlijk één jaar na de datum van de beschikking tot verlening van de garantstelling neemt de subsidie-ontvanger
      de lening waarop de garantstelling betrekking heeft volledig op.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.3
    text: |-
      Bij de bepaling of de landbouwonderneming naar het oordeel van de Minister voldoende liquiditeitstoename oplevert,
      wordt uitgegaan van een, zo nodig door de Minister gewijzigde, begroting die op de ondernemerscapaciteiten van de
      aanvrager is afgestemd en waaruit onder meer blijkt dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.3.a
    text: |-
      rente- en aflossingsverplichtingen, overige bedrijfsuitgaven, belastingen, premies en, voor zover geen sprake is
      van inkomsten uit tegenwoordige of vroegere arbeid van buiten de landbouwonderneming waaruit deze kunnen worden
      bestreden, gezinsbestedingen kunnen worden betaald;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.3.b
    text: de noodzakelijke vervangingsinvesteringen kunnen worden gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73.3.c
    text: |-
      de liquiditeitstoename voldoende ruimte biedt om tegenvallers in de exploitatie op te vangen alsmede
      om aan toekomstige financieringsverplichtingen, onder andere als gevolg van noodzakelijke diepte- of
      uitbreidingsinvesteringen, te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273
  - number: 2:73a.1
    text: |-
      In zoverre in afwijking van [artikel 2:73, eerste lid, aanhef en onderdeel b][ref1], kan de bank de looptijd van
      de lening, waarvoor de Minister onder de voorwaarden van deze paragraaf een garantstelling heeft verstrekt, met ten
      hoogste drie jaar verlengen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:73a.1.a
    text: de totale looptijd van de lening daarmee niet meer dan twee en twintig jaar bedraagt, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273a
  - number: 2:73a.1.b
    text: |-
      verlenging noodzakelijk is in verband met betalingsmoeilijkheden van de landbouwonderneming die zijn opgetreden als
      gevolg van de recente uitbraak van de EHEC-bacterie in Noord-Duitsland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273a
  - number: 2:73a.2
    text: |-
      Het eerste lid is niet van toepassing op garantstellingen als bedoeld in [artikel 2:80, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:73a.3
    text: |-
      De kredietinstelling kan de verlenging van de looptijd, bedoeld in het eerste lid, onder de in dat lid in de
      onderdelen a en b gestelde voorwaarden, overeenkomstig toepassen op leningen met een looptijd van maximaal 20 jaar,
      niet zijnde achtergestelde leningen, waarvoor garantie is verstrekt op grond van het Besluit Borgstellingsfonds of
      het Besluit BF bijzondere borgstellingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel273a
  - number: 2:74
    text: |-
      Aanvragen tot garantstelling worden overeenkomstig [artikel 1:6][ref1] gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:75.1
    text: 'De aanvraag tot garantstelling gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.a
    text: een investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.b
    text: een overzicht van de stand van leningen en kredieten voor uitvoering van het investeringsplan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.c
    text: |-
      een specificatie van de zekerheden voor alle door de bank te verstrekken financieringen aan de landbouwonderneming,
      vergezeld van een taxatierapport ter zake van de executiewaarde van de roerende en onroerende zaken die tot
      zekerheid strekken, alsmede een specificatie van de totale financiering inclusief de daaraan verbonden voorwaarden
      na uitvoering van het investeringsplan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.d
    text: een berekening van het eigen en aansprakelijk vermogen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.e
    text: |-
      een door de bank getoetste, op de ondernemerscapaciteiten van de aanvrager afgestemde begroting, waaruit blijkt dat
      de landbouwonderneming:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.e.1
    text: |-
      een bruto-jaaromzet heeft die voor meer dan de helft wordt verkregen uit de primaire productie van
      landbouwproducten, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.e.2
    text: voldoende liquiditeitstoename oplevert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.f
    text: de boekhoudverslagen en de aangiften inkomstenbelasting over de voorliggende drie boekjaren, indien beschikbaar;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.g
    text: een toelichting van de bank op de verstrekte gegevens, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.1.h
    text: de statuten van de landbouwonderneming, indien de aanvraag betrekking heeft op een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.2
    text: 'In aanvulling op het eerste lid verstrekt de aanvrager op verzoek van de Minister:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.2.a
    text: |-
      een taxatierapport ter zake van de executiewaarde van de roerende en onroerende zaken die tot zekerheid strekken,
      dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.2.a.1
    text: niet ouder is dan zes maanden rekenend vanaf de dag van indiening van de aanvraag, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.2.a.2
    text: is opgesteld door een ter zake deskundig en onafhankelijk taxateur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:75.2.b
    text: alle bescheiden en informatie die de Minister noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel275
  - number: 2:76
    text: |-
      De Minister verstrekt de bank, bedoeld in [artikel 2:73, eerste lid][ref1], een afschrift van de beschikking tot
      verlening van de garantstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:77
    text: |-
      In aanvulling op, onderscheidenlijk afwijking van [artikel 1:15][ref1] komen de volgende kosten in aanmerking voor
      de garantstelling:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:77.a
    text: kosten voor de bouw, verwerving of verbetering van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel277
  - number: 2:77.b
    text: |-
      kosten voor de koop of huurkoop van machines en materieel, met inbegrip van computerprogrammatuur, tot ten hoogste
      de marktwaarde van de activa;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel277
  - number: 2:77.c
    text: |-
      algemene kosten in verband met uitgaven als bedoeld in onderdelen a of b, zoals kosten voor architecten, ingenieurs
      en adviseurs, haalbaarheidsstudies en het verkrijgen van octrooien en licenties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel277
  - number: 2:77.d
    text: |-
      kosten voor de aankoop van tweedehands materieel, voor zover het gaat om landbouwondernemingen met een zeer
      beperkte technische startbasis en weinig kapitaal en zij dankzij de lagere kosten van dergelijk materieel met
      moderniseringswerkzaamheden kunnen beginnen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel277
  - number: 2:78
    text: |-
      In aanvulling op de [artikelen 1:15][ref1] en [2:2][ref2] komen de volgende kosten niet in aanmerking voor de
      garantstelling:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:78.a
    text: bedrijfskosten die de begunstigde normaal zou moeten dragen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.b
    text: |-
      kosten voor activiteiten die verband houden met de uitvoer als bedoeld in artikel 1 van verordening (EG)
      nr. 1857/2006;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.c
    text: |-
      kosten voor investeringen waarvoor productiebeperkingen of beperkingen op communautaire steunverlening in het kader
      van de gemeenschappelijke marktordeningen zijn vastgesteld, zoals toeslagrechten en quota;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.d
    text: |-
      kosten voor investeringen die tot doel hebben de financiële situatie van producenten te verbeteren, maar in geen
      enkel opzicht bijdragen aan de ontwikkeling van de sector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.e
    text: kosten voor landbouwproducten waarvoor geen normale afzetmogelijkheden kunnen worden gevonden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.f
    text: kosten voor activiteiten die de landbouwonderneming ook onder marktvoorwaarden alleen zou kunnen uitvoeren;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.g
    text: kosten voor de aankoop van bouwgrond;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:78.h
    text: |-
      andere dan de in [artikel 2:77, onderdeel b][ref1], genoemde kosten in verband met een huurkoopcontract,
      waaronder belastingen, marge voor de verhuurder, kosten voor de herfinanciering van rente, overheadkosten en
      verzekeringspremies;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:78.i
    text: kosten voor investeringen in verband met de naleving van bestaande nationale maatregelen of EG-maatregelen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel278
  - number: 2:79.1
    text: De lening waarvoor de garantstelling wordt verstrekt bedraagt ten hoogste € 600.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
  - number: 2:79.2
    text: |-
      In afwijking van het eerste lid, bedraagt de lening waarvoor de garantstelling wordt verstrekt ten hoogste
      € 1.200.000 ingeval een aanvraag tot garantstelling is ingediend door een natuurlijke persoon die op het tijdstip
      van ontvangst van de aanvraag ten hoogste 39 jaar oud is, en die tot doel heeft voor het eerst voor eigen rekening
      en risico een landbouwonderneming te stichten of over te nemen die hij:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
  - number: 2:79.2.a
    text: alleen in eigendom, pacht of erfpacht krijgt, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
  - number: 2:79.2.b
    text: |-
      volledig in eigendom, pacht of erfpacht krijgt met een andere natuurlijke persoon die op het tijdstip van ontvangst
      van de aanvraag ten hoogste 39 jaar oud is en die niet eerder een landbouwonderneming volledig in eigendom, pacht
      of erfpacht heeft gehad.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
  - number: 2:79.3
    text: |-
      De lening waarvoor de garantstelling wordt verstrekt bedraagt ten hoogste twee derde van de
      financieringen die benodigd zijn voor de investeringen, opgenomen in het investeringsplan, bedoeld in
      [artikel 2:75, eerste lid, onderdeel a][ref1], verminderd met de eigen beschikbare middelen, rekening houdende met
      de financieringsmogelijkheden op basis van beschikbare zekerheden en de wijze waarop de beschikbare eigen middelen
      optimaal kunnen worden aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:79.4
    text: |-
      De hoogte van de garantstelling vermindert naar rato van de aflossingen die worden gedaan op de lening waarop
      de garantstelling betrekking heeft, volgens het aflossingsschema dat is vastgesteld bij verlening van de
      garantstelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
  - number: 2:79.5
    text: |-
      Ingeval de bank nakoming vordert van de garantstelling, wordt ten hoogste vier vijfde van de restantschuld van de
      lening waarop de garantstelling betrekking heeft uitbetaald.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel279
  - number: 2:80.1
    text: |-
      In afwijking van [artikel 2:79, eerste lid][ref1], bedraagt de lening waarvoor de garantstelling wordt verstrekt
      ten hoogste € 2.500.000 ingeval aan de bepalingen van dit artikel is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:80.2
    text: |-
      De aanvraag tot garantstelling is gericht op de terugbetaling van een lening die strekt tot financiering van de
      volgende investeringen:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.2.a
    text: 'investeringen in een duurzame melkveestal, varkensstal of pluimveestal die:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.2.a.1
    text: |-
      voldoet aan de eisen van het certificatieschema Maatlat Duurzame Veehouderij, hetgeen blijkt uit een voorlopig
      certificaat dat is afgegeven door een door de Raad voor Accreditatie hiervoor geaccrediteerde organisatie, en
      waarvoor geldt dat: - binnen twee jaar na afgifte van het voorlopig certificaat een definitief certificaat wordt
      overgelegd, dan wel
        - binnen drie jaar een definitief certificaat wordt overgelegd volgens de dan vigerende Maatlat Duurzame
      Veehouderij, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.2.a.2
    text: |-
      bestaat uit ruimten waarin dieren worden gehuisvest, stalinrichting, klimaattechnische en voertechnische systemen,
      ammoniakemissiereducerende systemen, mestafvoer en mestopslag;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.2.b
    text: |-
      investeringen in een Groen Label Kas, die is bestemd voor het bedrijfsmatig telen van gewassen, en is aangewezen op
      grond van de [artikelen 3.31, eerste lid][ref1], of [3.42a, tweede lid, van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2:80.2.c
    text: |-
      aankoop van grond voor de uitoefening van de glastuinbouw, mits de betrokken kavel ten minste 80 meter breed is met
      een lengte-breedte-verhouding van ten hoogste 2:1.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.3
    text: |-
      De garantstelling wordt verstrekt ter zake van een investeringsplan, waarbij ten minste de helft van de
      investeringen betrekking heeft op investeringen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.4
    text: |-
      Een garantstelling als bedoeld in dit artikel kan tevens worden verstrekt voor de terugbetaling van leningen die
      zijn achtergesteld ten opzichte van andere vorderingen van de bank, waarbij geldt dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.4.a
    text: |-
      slechts garantstelling wordt verstrekt voor zover de omvang van de achtergestelde lening kleiner is dan het eigen
      vermogen van de landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
  - number: 2:80.4.b
    text: |-
      [artikel 2:72, eerste lid, onderdeel b][ref1], niet van toepassing is, en


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:80.4.c
    text: |-
      achtergestelde leningen een looptijd hebben van ten hoogste tien jaar en niet lineair hoeven te worden afgelost, in
      afwijking van [artikel 2:73, eerste lid, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:81
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:81.a
    text: |-
      *werkkapitaal:* kapitaal ter dekking van uitgaven die moeten worden gemaakt om de lopende bedrijfsvoering van de
      landbouwonderneming doorgang te doen vinden, niet zijnde kosten als bedoeld in [artikel 2:77][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:81.b
    text: |-
      *Verordening (EG) nr. 1535/2007:* Verordening (EG) nr. 1535/2007 van de Commissie van 20 december 2007 betreffende
      de toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector (PbEU
      L 337);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:81.c
    text: '*de-minimissteun:* de-minimissteun als bedoeld in artikel 3 van Verordening (EG) nr. 1535/2007;'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:81.d
    text: '*Commissie:* Commissie van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:81.e
    text: |-
      *Tijdelijke communautaire kaderregeling:* Mededeling van de Commissie – Tijdelijke communautaire kaderregeling
      inzake staatssteun ter stimulering van de toegang tot financiering in de huidige financiële en economische crisis
      (PbEU C 16);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:81.f
    text: |-
      *Tijdelijke communautaire kaderregeling 2011:* mededeling van de Commissie – Tijdelijke kaderregeling van de Unie
      inzake staatssteun ter stimulering van de toegang tot financiering in de huidige financiële en economische crisis
      (PbEU 2011 C 6);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:81.g
    text: |-
      *subsidie-equivalent:* subsidie-equivalent als bedoeld in punt 4.4. van de Mededeling van de Commissie betreffende
      de toepassing van de artikelen 87 en 88 van het EG-Verdrag op staatssteun in de vorm van garanties (PbEU C 155).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel281
  - number: 2:82
    text: |-
      De Minister kan tot en met 31 december 2011 subsidie in de vorm van een garantstelling verstrekken aan een
      landbouwonderneming voor de terugbetaling van een lening, voor zover deze strekt tot financiering van werkkapitaal.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel282
  - number: 2:83.1
    text: |-
      Op de verstrekking van de garantstelling, bedoeld in [artikel 2:82][ref1], zijn van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:83.1.a
    text: |-
      [artikel 2:71, aanhef en onderdelen a, c, d, f en h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:83.1.b
    text: |-
      [artikel 2:72, eerste tot en met derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:83.1.c
    text: |-
      [artikel 2:73, eerste lid, aanhef en onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:83.1.d
    text: |-
      [artikel 2:74][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:83.1.e
    text: |-
      [artikel 2:76][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:83.2
    text: |-
      Op de verstrekking van de garantstelling, bedoeld in [artikel 2:82][ref1], is van overeenkomstige toepassing
      [artikel 2:71, aanhef en onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:83.3
    text: |-
      De garantstelling, bedoeld in [artikel 2:82][ref1], wordt uitsluitend verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:83.3.a
    text: 'aan een landbouwonderneming die:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
  - number: 2:83.3.a.1
    text: na 1 juli 2008 in liquiditeitsproblemen is gekomen, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
  - number: 2:83.3.a.2
    text: |-
      in zoverre in afwijking van [artikel 2:1a][ref1], op 1 juli 2008 niet in moeilijkheden verkeerde, doch vervolgens
      in moeilijkheden is gekomen als bedoeld in punt 2.2, onderdeel d, van de Tijdelijke communautaire kaderregeling
      2011,


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:83.3.b
    text: |-
      ten behoeve van een lening van ten hoogste € 850.000 die een looptijd heeft van maximaal drie jaar en uitsluitend
      bestemd is voor financiering van werkkapitaal dat de onderneming de eerstkomende 12 maanden na indiening van de
      aanvraag tot garantstelling nodig heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
  - number: 2:83.3.c
    text: |-
      indien aan de landbouwonderneming na 1 juli 2008 ten minste twee jaar uitstel van betaling is verleend op alle door
      de landbouwonderneming met banken afgesloten leningen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
  - number: 2:83.4
    text: |-
      [Artikel 2:2, aanhef en onderdeel a][ref1], is niet van toepassing op de verstrekking van de garantstelling,
      bedoeld in [artikel 2:82][ref2], voor zover het kosten voor dieren, planten en de aanplant van planten voor niet-
      permanente gewassen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:83.5
    text: Per onderneming kan slechts één garantstelling worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
  - number: 2:83.6
    text: |-
      Onder landbouwonderneming in moeilijkheden als bedoeld in het derde lid, wordt verstaan een landbouwonderneming
      in moeilijkheden zoals gedefinieerd in punt 2.1 van de communautaire richtsnoeren inzake reddings- en
      herstructureringssteun aan ondernemingen in moeilijkheden (PbEU C 244).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel283
  - number: 2:84.1
    text: |-
      De aanvraag tot garantstelling wordt namens de natuurlijke persoon of rechtspersoon als bedoeld in
      [artikel 2:72][ref1] ingediend door de bank die de lening verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:84.2
    text: 'De aanvraag gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.2.a
    text: |-
      een verklaring van de bank dat de landbouwonderneming voldoet aan de in deze paragraaf gestelde voorwaarden
      om de garantstelling te kunnen verstrekken en waarin de bank met name aangeeft dat inzichtelijk is dat de
      landbouwonderneming in liquiditeitsproblemen als bedoeld in [artikel 2:83, derde lid][ref1], verkeert;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:84.2.b
    text: |-
      een door de landbouwonderneming opgemaakte verklaring, waarin opgave wordt gedaan van alle vanaf 1 januari 2008
      verstrekte de-minimissteun, steun verstrekt op grond van punt 4.2.2 van de Tijdelijke communautaire kaderregeling
      en steun verstrekt op grond van punt 2.2 van de Tijdelijke communautaire kaderregeling 2011.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3
    text: |-
      De aanvrager of de bank verstrekt op verzoek van de Minister alle bescheiden en informatie die de Minister
      noodzakelijk acht, waaronder:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.a
    text: een overzicht van de liquiditeitsbehoefte van de landbouwonderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.b
    text: een overzicht van de stand van de leningen en kredieten van de landbouwonderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.c
    text: |-
      een specificatie van de zekerheden voor alle door de bank te verstrekken financieringen aan de landbouwonderneming,
      vergezeld van een taxatierapport ter zake van de executiewaarde van de roerende en onroerende zaken die tot
      zekerheid strekken, alsmede een specificatie van de totale financiering die onder de garantstelling zal vallen
      inclusief de daaraan door de bank verbonden voorwaarden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.d
    text: een berekening van het eigen en aansprakelijk vermogen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.e
    text: |-
      een door de bank getoetste, op de ondernemerscapaciteiten van de aanvrager afgestemde begroting, waaruit blijkt
      dat de landbouwonderneming een bruto-jaaromzet heeft die voor meer dan de helft wordt verkregen uit de primaire
      productie van landbouwproducten en voldoende liquiditeitstoename oplevert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.f
    text: |-
      de boekhoudverslagen en aangiften inkomstenbelasting of vennootschapsbelasting over de voorliggende drie boekjaren,
      indien beschikbaar;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.g
    text: een toelichting van de bank op de verstrekte gegevens;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.h
    text: |-
      voor zover van toepassing, maatschapovereenkomsten, overeenkomsten inzake vennootschappen onder firma of
      commanditaire vennootschappen, of statuten van de landbouwonderneming indien de aanvraag betrekking heeft op een
      rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.3.i
    text: |-
      een verklaring van de bank dat aan de landbouwonderneming na 1 juli 2008 voor ten minste twee jaar uitstel van
      betaling is verleend, of verleend zal worden, op alle door banken aan de onderneming verstrekte leningen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:84.4
    text: |-
      Ingeval de bank nakoming vordert van de garantstelling, wordt deze uitsluitend uitgekeerd indien op grond van de
      bescheiden en de informatie, bedoeld in het tweede lid en derde lid, wordt vastgesteld dat de landbouwonderneming
      ten tijde van de aanvraag voldeed aan de in deze paragraaf gestelde voorwaarden om voor garantstelling in
      aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel284
  - number: 2:85.1
    text: |-
      De garantstelling bedraagt ten hoogste de helft van het bedrag van de lening die met de bank is aangegaanvoor de
      financiering van het werkkapitaal, met dien verstande dat de garantstelling ten minste € 25.000 en ten hoogste
      € 425.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel285
  - number: 2:85.2
    text: |-
      De hoogte van de garantstelling wordt verminderd naar rato van de extra aflossingen die worden gedaan op leningen
      waarvoor de garantstelling is verstrekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel285
  - number: 2:85.3
    text: |-
      Ingeval de bank nakoming vordert van de garantstelling, wordt ten hoogste de helft van de restantschuld van de
      lening waarop de garantstelling betrekking heeft uitbetaald.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel285
  - number: 2:87
    text: |-
      De Minister verleent de subsidie, bedoelt in [artikel 2:82][ref1], binnen twee weken na ontvangst van de aanvraag,
      bedoeld in [artikel 2:84][ref2], indien aan de in [dat artikel][ref3] gestelde voorwaarden is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel287
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:88.1
    text: |-
      De subsidieontvanger betaalt aan de bank eenmalig 4,5% provisie over het totale bedrag van de lening die onder
      garantstelling wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel288
  - number: 2:88.2
    text: De bank betaalt de provisie aan de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel288
  - number: 2:89
    text: |-
      Gedurende de periode van 1 januari 2008 tot en met 31 december 2011 bedraagt het totaal aan de-minimissteun, steun
      verstrekt op grond van punt 4.2.2 van de Tijdelijke kaderregeling en steun verstrekt op grond van punt 2.2 van de
      Tijdelijke communautaire kaderregeling 2011, met in begrip van steun die in de vorm van een garantstelling aan een
      landbouwonderneming op grond van deze paragraaf is toegekend, niet meer dan het subsidie-equivalent van ten hoogste
      € 15.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel289
  - number: 3:1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - beheer: al hetgeen in een terrein wordt verricht ten behoeve
      van instandhouding en ontwikkeling van de in dat terrein aanwezige waarden van natuurwetenschappelijke,
      landschappelijke of cultuurhistorische betekenis of vanwege de bosbouwkundige waarden, alsmede de daarmee verbonden
      administratie;
        - bos: aaneengesloten terrein, waarop de meldings- en herplantplicht, bedoeld in de [artikelen 2][ref1] en
      [3 van de Boswet][ref2], van toepassing is;
        - bosgroep: coöperatieve vereniging van bos-, natuur en landgoedeigenaren die bos-, natuur en landgoedeigenaren
      ondersteunt bij het beheer van hun bos, natuur en landschap;
        - gescheperde schaapskudde: kudde die gedurende een periode van minimaal 150 dagen per jaar, en binnen die periode
      tenminste vijf dagen in de week, tenminste vijf uur per dag, rondtrekt, gehoed door een herder met een of meer
      honden;
        - inrichting: het geschikt maken van een terrein voor de instandhouding, het herstel of de ontwikkeling van de
      natuurwaarden, landschappelijke waarden, cultuurhistorische waarden of bosbouwkundige waarden en het daarmee
      samenhangende beheer;
        - landschapsontwikkelingsplan: plan voor het grondgebied van één of meer gemeenten ter verbetering van de
      landschapskwaliteit in het desbetreffende gebied;
        - Landschappen: Stichting Unie van provinciale landschappen, statutair gevestigd te de Bilt;
        - natuurgebied: 'natuurgebied dat als zodanig is begrensd in een natuurgebiedsplan: a. als bedoeld in'
      [artikel 13 van de Subsidieregeling natuurbeheer 2000][ref3], zoals die luidde tot 1 januari 2007, of b. dat is
      vastgesteld op grond van een ingevolge [artikel 11, derde lid, van de Wet inrichting landelijk gebied][ref4] door
      provinciale staten van de onderscheiden provincies vastgestelde verordening inzake subsidies voor natuurbeheer;
        - natuurontwikkeling: het scheppen van de abiotische en biotische omstandigheden voor de ontwikkeling van
      natuurwaarden van nationale of internationale betekenis door middel van daarop toegesneden eenmalige maatregelen
      voor inrichting en beheer;
        - natuurterrein: 'terrein, met uitzondering van bos, dat: a. bestaat uit hoogveen, zandverstuiving, droge'
      heide of droog schraal grasland, natte heide of nat schraal grasland, vennen, plassen of andere wateren, en b.
      aaneengesloten is dan wel over meer dan 100 meter niet is onderbroken door een spoordijk, kanaal, rivier, rijksweg
      of op andere wijze;
        - terreinen: gronden, daaronder begrepen natuurterreinen, wateren, landgoederen, bossen en andere
      houtopstanden, alsmede de op die gronden gelegen objecten, die van belang of van potentieel belang zijn om hun
      natuurwetenschappelijke, landschappelijke of cultuur-historische betekenis of vanwege bosbouwkundige waarden;
        - Unie van Bosgroepen: Unie van Bosgroepen, u.a., statutair gevestigd te Ede;
        - Vereniging Natuurmonumenten: Vereniging tot Behoud van Natuurmonumenten in Nederland, statutair gevestigd te
      ’s-Graveland;
        - Vereniging Platform Soortenbeschermende Organisaties: Vereniging Platform Soortenbeschermende Organisaties,
      statutair gevestigd te Wageningen;
        - verwerving: verwerving van het recht van eigendom of het recht van erfpacht;
        - zeldzaam schapenras: Drents heideschaap, Kempens heideschaap, Mergelandschaap, Schoonebeeker en Veluws
      heideschaap.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0020748#Artikel11
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
      - id: ref2
