  - number: 4:40.1
    text: |-
      De Minister kan aan een visserijonderneming of samenwerkingsverband van deze ondernemingen subsidie verstrekken
      voor de uitvoering van een project betreffende de bouw, de uitbreiding, de uitrusting en de modernisering van
      productie-installaties voor aquacultuur, voorzover het project is gericht op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.1.a
    text: |-
      invoering van aquacultuurmethoden die de negatieve gevolgen voor het milieu aanzienlijk terugdringen of de
      positieve gevolgen voor het milieu ten opzichte van de gangbare praktijk in de aquacultuursector vergroten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.1.b
    text: |-
      op nieuwe vissoorten gerichte diversificatie van het productieproces of productie van vissoorten met goede
      afzetvooruitzichten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.2
    text: |-
      Subsidie wordt enkel verleend aan kleine, middelgrote en micro-ondernemingen en aan ondernemingen die minder dan
      750 werknemers hebben of een omzet van minder dan 200 miljoen euro hebben.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.3
    text: 'Geen subsidie wordt verstrekt voor een project dat:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.3.a
    text: |-
      er op gericht is om te voldoen aan verplichte EG-normen inzake het milieu, de gezondheid van mens en dier, de
      hygiëne of het dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.3.b
    text: bijdraagt aan een vergroting van de productie van forel, paling, meerval, zeebaars en zeebrasem;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.3.c
    text: betrekking heeft op siervissen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.3.d
    text: |-
      betrekking heeft op aquacultuur van dieren die niet mogen worden gehouden op grond van de
      [Gezondheids- en welzijnswet][ref1] voor dieren of in strijd is met overige wet- of regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 4:40.3.e
    text: in vergelijking met de gangbare praktijk in de aquacultuursector leidt tot een zwaardere belasting van het milieu;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.3.f
    text: |-
      ziet op een experimentele toepassing van een nieuwe aquacultuurmethode, techniek of proces, zonder commerciële
      toepassing op praktijkschaal.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:40.4
    text: |-
      Geen subsidie wordt verstrekt aan projecten waarvan de subsidiabele kosten in totaal minder bedragen dan
      € 10.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel440
  - number: 4:41.1
    text: |-
      De Minister rangschikt aanvragen overeenkomstig [artikel 1:4][ref1], waarbij een aanvraag hoger wordt gerangschikt
      indien het wordt uitgevoerd door een kleine of micro-onderneming en naarmate het project waarop de subsidie
      betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:41.1.a
    text: meer economisch of technisch perspectief heeft in de toepassing op praktijkschaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
  - number: 4:41.1.b
    text: meer wordt uitgevoerd in ketenverband;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
  - number: 4:41.1.c
    text: eveneens toepasbaar is bij andere aquacultuurbedrijven;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
  - number: 4:41.1.d
    text: leidt tot een verhoging in productkwaliteit en kwantiteit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
  - number: 4:41.1.e
    text: bijdraagt aan verbetering van het dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
  - number: 4:41.2
    text: |-
      Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref1], en
      adviseert de Minister over de rangschikking van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:41.3
    text: |-
      De Minister kan in afwijking van het tweede lid voor specifieke categorieën aanvragen een andere
      beoordelingscommissie instellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel441
  - number: 4:42.1
    text: |-
      In het projectplan, bedoeld in [artikel 1:9, tweede lid][ref1], is de geografische locatie van het project
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:42.2
    text: |-
      De aanvraag tot verlening van een subsidie als bedoeld in [artikel 4:40, eerste lid, onderdeel b][ref1], gaat
      vergezeld van een marktanalyse waaruit naar het oordeel van de Minister blijkt dat er op de middellange termijn
      voor de geproduceerde soort op de markt waarschijnlijk meer vraag dan aanbod zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:42.3
    text: |-
      Indien de subsidie wordt aangevraagd door een rechtspersoon dan wel een samenwerkingsverband waaraan één of meer
      rechtspersonen deelnemen, gaat de aanvraag tevens vergezeld van de statuten van de betrokken rechtspersoon of
      rechtspersonen
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel442
  - number: 4:43.1
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van drie jaar na de datum van subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel443
  - number: 4:43.2
    text: |-
      In afwijking van het eerste lid kan de Minister voor de uitvoering van het project een andere termijn dan drie
      jaar vaststellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel443
  - number: 4:43.3
    text: |-
      De Minister kan, in afwijking van [artikel 1:2, aanhef en eerste lid][ref1], toestemming geven voor de uitvoering
      van het project buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel443
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:44
    text: De aanvraag tot subsidievaststelling gaat vergezeld van een controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel444
  - number: 4:45.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.1.a
    text: kosten van apparatuur of voorzieningen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.1.b
    text: |-
      kosten van aankoop van onroerende zaken, of de kosten van bouw of modernisering van gebouwen voor zover de kosten
      van aankoop van gebouwen of de kosten van bouw of modernisering van gebouwen niet meer dan het totaal van de
      overige subsidiabele kosten van het project bedragen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.1.c
    text: |-
      kosten van modernisering van vaartuigen die worden ingezet voor de aquacultuur en die niet zijn uitgerust voor de
      commerciële exploitatie van levende aquatische hulpbronnen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.1.d
    text: kosten van een controleverklaring van een accountant, voor zover deze kosten niet meer bedragen dan € 2500,–;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.1.e
    text: |-
      kosten voor architecten, ingenieurs en overige deskundigen, die uit hoofde van hun beroep adviezen verstrekken,
      voor zover deze kosten niet meer dan 12% van de totale subsidiabele kosten bedragen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.1.f
    text: loonkosten en kosten voor eigen arbeid voor zover ze betrekking hebben op de uitvoering van het project.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.2
    text: 'Voor de subsidie komen niet in aanmerking kosten voor:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.2.a
    text: de overdracht van de eigendom van een onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:45.2.b
    text: de aankoop van broed en onvolwassen dieren ten behoeve van de kweek.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel445
  - number: 4:46.1
    text: Voor kleine, middelgrote en micro-ondernemingen bedraagt de subsidie ten hoogste 30% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel446
  - number: 4:46.2
    text: |-
      Voor andere ondernemingen dan bedoeld in het eerste lid, bedraagt de subsidie ten hoogste 20% van de subsidiabele
      kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel446
  - number: 4:46.3
    text: De subsidie bedraagt ten hoogste € 800.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel446
  - number: 4:47.1
    text: |-
      De Minister kan aan een visserijonderneming of samenwerkingsverband van deze ondernemingen subsidie verstrekken
      voor de uitvoering van een project betreffende nieuwe voorzieningen aan de wal ten behoeve van de verwerking
      en afzet van visserijproducten met het doel het productieproces duurzamer te maken en de kwaliteit van
      visserijproducten te verbeteren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.2
    text: 'De nieuwe voorzieningen aan de wal, bedoeld in het eerste lid, zijn met name gericht op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.2.a
    text: productie van kwalitatief hoogwaardige producten voor nichemarkten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.2.b
    text: een beter gebruik van weinig benutte soorten, bijproducten en afval;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.2.c
    text: |-
      productie of afzet van nieuwe producten, toepassing van nieuwe technologieën of ontwikkeling van innovatieve
      productiemethoden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.3
    text: |-
      Subsidie wordt enkel verleend aan kleine, middelgrote en micro-ondernemingen en aan ondernemingen die minder dan
      750 werknemers hebben of een omzet van minder dan 200 miljoen euro hebben en die investeringen doen ten behoeve van
      een project als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.4
    text: 'Geen subsidie wordt verstrekt voor investeringen:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.4.a
    text: |-
      die betrekking hebben op visserijproducten die bestemd zijn om te worden gebruikt en te worden verwerkt voor andere
      doeleinden dan menselijke consumptie, behalve indien het gaat om investeringen die uitsluitend zijn bestemd voor de
      behandeling, de verwerking en de afzet van afval van visserijproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.4.b
    text: |-
      die er op gericht zijn om te voldoen aan verplichte EG-normen inzake het milieu, de gezondheid van mens en dier, de
      hygiëne of het dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:47.4.c
    text: ten behoeve van de kleinhandel.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel447
  - number: 4:48.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:48.1.a
    text: meer bijdraagt aan de duurzaamheid van het productieproces in de keten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.b
    text: meer bijdraagt aan de kwaliteit van het product;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.c
    text: is gericht op bevordering van duurzame werkgelegenheid in de visserijsector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.d
    text: wordt uitgevoerd door kleine en micro-ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.e
    text: wordt uitgevoerd door een samenwerkingsverband van visserijondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.f
    text: een innovatief karakter heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.g
    text: meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.1.h
    text: een groter uitstralingseffect heeft voor toepassing door andere ondernemingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:48.2
    text: |-
      Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref1], en
      adviseert de Minister over de rangschikking van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:48.3
    text: |-
      De Minister kan in afwijking van het tweede lid voor specifieke categorieën aanvragen een andere
      beoordelingscommissie instellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel448
  - number: 4:49.1
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel449
  - number: 4:49.2
    text: |-
      In afwijking van het eerste lid kan de Minister voor de uitvoering van het project een andere termijn dan drie
      jaar vaststellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel449
  - number: 4:49.3
    text: |-
      De Minister kan, in afwijking van [artikel 1:2, aanhef en eerste lid][ref1], toestemming geven voor de uitvoering
      van het project buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel449
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:50.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.1.a
    text: |-
      kosten voor de bouw, verwerving, verbetering of inrichting van onroerende goederen, voor zover deze kosten niet
      meer dan 50% van de totale subsidiabele kosten bedragen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.1.b
    text: |-
      kosten voor de aankoop of huurkoop van nieuwe machines en apparatuur, inclusief computersoftware tot aan de
      marktwaarde van het goed;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.1.c
    text: kosten voor de ontwikkeling van nieuwe machines of apparatuur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.1.d
    text: |-
      kosten voor de ontwikkeling en operationalisering van processen, procédés, technologieën, product-marktcombinaties
      en andere innovaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.1.e
    text: |-
      algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met d, zoals kosten voor adviseurs,
      zoals architecten en ingenieurs, tot een hoogte van 25% van de totale subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.1.f
    text: |-
      overige algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met d, zoals kosten voor een
      controleverklaring van een accountant tot een hoogte van € 2500, haalbaarheidsstudies, verwerven van patenten en
      vergunningen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.2
    text: 'Geen subsidie wordt verstrekt voor kosten:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.2.a
    text: |-
      met betrekking tot een leasecontract, zoals de marge van de leaseorganisatie, herfinancieringskosten,
      overheadkosten en verzekeringspremies;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.2.b
    text: voor de overname van de eigendom van een onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:50.2.c
    text: voor de aankoop van grond.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel450
  - number: 4:51
    text: De aanvraag tot subsidievaststelling gaat vergezeld van een controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel451
  - number: 4:52.1
    text: De subsidie bedraagt voor kleine, middelgrote en micro-ondernemingen ten hoogste 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel452
  - number: 4:52.2
    text: |-
      Voor andere ondernemingen dan bedoeld in het eerste lid, bedraagt de subsidie ten hoogste 20% van de subsidiabele
      kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel452
  - number: 4:52.3
    text: De subsidie bedraagt ten hoogste € 500.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel452
  - number: 4:53.1
    text: |-
      De Minister kan op aanvraag subsidie verstrekken in de vorm van een garantstelling voor de terugbetaling van
      leningen die naar het oordeel van de Minister gericht zijn op investeringen als bedoeld in de artikelen 25 en 35
      van verordening nr. 1198/2006, met inachtneming van de bepalingen van deze paragraaf, de bepalingen van verordening
      nr. 1198/2006 en de relevante Europese richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.2
    text: |-
      De garantstelling kan worden verstrekt aan een ondernemer die eigenaar of reder is van een vissersvaartuig
      dat behoort tot het segment MFL 1 of MFL 2, een tonnage heeft van minder dan 1.200 BT en waarvoor een
      garnalenvergunning is verleend of een contingent is toegekend.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3
    text: 'Geen garantstelling wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.a
    text: |-
      aan ondernemingen, bedoeld in punt 2.1 van de Mededeling van de Commissie aangaande Communautaire richtsnoeren
      inzake reddings- en herstructureringssteun aan ondernemingen in moeilijkheden (OJ C 244, 1.10.2004, p. 2);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.b
    text: |-
      voor de terugbetaling van leningen die gericht zijn op de herfinanciering van schulden, daaronder mede begrepen
      niet door een bank verstrekte leningen alsmede leningen welke worden aangegaan om kapitaalbehoefte, ontstaan door
      het uittreden van een commanditaire vennoot uit een commanditaire vennootschap te dekken, behoudens ingeval van
      overmacht;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.c
    text: |-
      voor de terugbetaling van leningen indien ten aanzien van de investeringen door de aanvrager reeds verplichtingen
      zijn aangegaan voordat de ontvangst van de aanvraag door de Minister schriftelijk is bevestigd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.d
    text: |-
      voor de terugbetaling van leningen indien ten aanzien van de investeringen door een bank reeds een lening is
      verstrekt of onvoorwaardelijk is toegezegd voordat de ontvangst van de aanvraag door de Minister schriftelijk is
      bevestigd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.e
    text: |-
      voor de terugbetaling van leningen met betrekking tot een visserijonderneming die wordt uitgeoefend door een
      commanditaire vennootschap, tenzij uit de betrokken vennootschapsovereenkomst blijkt dat deze ten minste is
      aangegaan voor een periode, overeenkomende met de looptijd van de lening, waarvoor de aanvraag wordt ingediend, en
      in elk geval gedurende deze looptijd niet kan worden opgezegd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.f
    text: |-
      indien reeds een krediet is verstrekt voor dezelfde investering op basis van andere garantstellingen door de
      overheid;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.g
    text: |-
      indien aan de aanvrager in het tijdvak van twee jaren voorafgaand aan de datum van ontvangst van de aanvraag reeds
      een garantstelling op grond van deze regeling is verstrekt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.3.h
    text: indien het bancair aansprakelijk vermogen van de aanvrager minder dan 5 % bedraagt van het balanstotaal.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
  - number: 4:53.4
    text: |-
      [Artikel 1:2, tweede lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel453
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:54.1
    text: |-
      Een garantstelling wordt verstrekt voor een lening met een minimumbedrag van € 50.000 en een maximumbedrag van
      € 450.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
  - number: 4:54.2
    text: |-
      De lening waarvoor garantstelling wordt verstrekt bedraagt ten hoogste twee derde van de voor de investeringen
      benodigde financieringen, minus de eigen beschikbare middelen, rekening houdende met de financieringsmogelijkheden
      op basis van de beschikbare zekerheden en de wijze waarop de beschikbare eigen middelen optimaal kunnen worden
      aangewend.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
  - number: 4:54.3
    text: |-
      De looptijd van de lening waarvoor garantstelling wordt verstrekt kan ten hoogste 10 jaar bedragen en de lening
      wordt lineair afgelost.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
  - number: 4:54.4
    text: |-
      De uiterste datum waarop de lening volledig moet zijn opgenomen, mag niet later liggen dan een jaar na de datum van
      de beschikking tot verstrekking van garantstelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
  - number: 4:54.5
    text: |-
      De garantstelling kan slechts worden verstrekt ten behoeve van een lening verstrekt door een bank waarmee de
      Minister een raamovereenkomst heeft gesloten, waarin de rechten en plichten van de Minister en de bank zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
  - number: 4:54.6
    text: |-
      [Artikel 4:1, derde lid][ref1], is niet van toepassing op een beschikking tot verstrekking van garantstelling op
      grond van [artikel 4:53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:54.7
    text: |-
      Ingeval de bank nakoming vordert van de garantstelling, wordt ten hoogste viervijfde van de restantschuld van de
      lening waarop de garantstelling betrekking heeft uitbetaald.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel454
  - number: 4:55.1
    text: 'De garantstelling kan worden verstrekt ten behoeve van leningen aangegaan door natuurlijke personen indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.1.a
    text: deze een visserijonderneming voor eigen rekening en risico in stand houden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.1.b
    text: de bruto-jaaromzet van de in onderdeel a bedoelde onderneming voor meer dan de helft uit visserij is verkregen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.1.c
    text: de in onderdeel a bedoelde onderneming naar het oordeel van de Minister een voldoende liquiditeitstoename oplevert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.1.d
    text: |-
      deze wegens het ontbreken van de daartoe benodigde zekerheden volgens normaal bankgebruik onvoldoende financiering
      voor de visserijonderneming kunnen verkrijgen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.1.e
    text: |-
      deze voor zover rechtens is toegestaan, op alle toebehorende goederen goederenrechtelijke zekerheid verlenen voor
      alle door de bank te verstrekken financieringen, waaronder de lening waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.1.f
    text: deze beschikt over een visvergunning.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.2
    text: |-
      Indien meer dan een natuurlijke persoon voor gezamenlijke rekening een visserijonderneming in stand houdt, voldoet
      elk van hen aan het eerste lid, onderdelen d en e.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.3
    text: 'De garantstelling kan worden verstrekt ten behoeve van leningen aangegaan door rechtspersonen indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.3.a
    text: zij blijkens de statuten de exploitatie van een of meer visserijondernemingen ten doel hebben
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.3.b
    text: |-
      de bruto-jaaromzet van de onderneming waarvoor een aanvraag wordt ingediend voor meer dan de helft uit visserij
      is verkregen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.3.c
    text: de in onderdeel b bedoelde onderneming naar het oordeel van de Minister een voldoende liquiditeitstoename oplevert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.3.d
    text: zij voldoen aan het eerste lid, d, e, en f.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.4
    text: |-
      Bij de bepaling of wordt voldaan aan het bepaalde in het eerste lid, onderdeel c, en tweede lid, onderdeel c,
      wordt uitgegaan van een, zo nodig door de Minister gewijzigde, begroting die op de ondernemerscapaciteiten van de
      aanvrager is afgestemd en waaruit onder meer moet blijken dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.4.a
    text: |-
      rente- en aflossingsverplichtingen, overige bedrijfsuitgaven, belastingen, premies en, voor zover geen sprake is
      van inkomsten uit tegenwoordige of vroegere arbeid van buiten de visserij waaruit deze kunnen worden bestreden,
      gezinsbestedingen kunnen worden betaald;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.4.b
    text: de noodzakelijke vervangingsinvesteringen kunnen worden gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:55.4.c
    text: |-
      de liquiditeitstoename voldoende ruimte biedt om tegenvallers in de exploitatie op te vangen alsmede
      om aan toekomstige financieringsverplichtingen, onder andere als gevolg van noodzakelijke diepte- of
      uitbreidingsinvesteringen, te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel455
  - number: 4:56.1
    text: |-
      Indien de aanvraag wordt ingediend door een rechtspersoon verbinden de bestuurders zich hoofdelijk tot de volledige
      terugbetaling van de lening waarop de aanvraag betrekking heeft, alsmede verbinden zij ter zake hun hele vermogen
      tot zekerheid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel456
  - number: 4:56.2
    text: De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel456
  - number: 4:57.1
    text: |-
      Jaarlijks kan de Minister overeenkomstig [artikel 1:3][ref1] een aanvraagperiode en een maximumbedrag vaststellen
      voor het totaal van de leningen waarvoor in het betrokken jaar garantstellingen kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:57.2
    text: |-
      Een garantstelling wordt niet verstrekt indien door verstrekking daarvan het maximumbedrag, bedoeld in het eerste
      lid, wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel457
  - number: 4:57.3
    text: |-
      Aanvragen voor garantstellingen worden overeenkomstig [artikel 1:6][ref1] gerangschikt, met dien verstande dat
      wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvraag volledig is, als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4:57.4
    text: |-
      De Minister kan besluiten dat indien het krachtens het eerste lid vastgestelde maximumbedrag is bereikt, de
      mogelijkheid tot het indienen van aanvragen tot verstrekking van garantstellingen uit hoofde van deze regeling voor
      de rest van het betrokken begrotingsjaar wordt geschorst.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel457
  - number: 4:57.5
    text: De Minister maakt een besluit als bedoeld in het vierde lid bekend in de Staatscourant
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel457
  - number: 4:58.1
    text: 'De aanvraag gaat vergezeld van een rapportage omvattende:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.1.a
    text: |-
      een investerings- en financieringsplan, met een gedegen onderbouwing van de verenigbaarheid van de investeringen
      met de artikelen 25 en 35 van verordening nr. 1198/2006;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.1.b
    text: een overzicht van de stand van leningen en kredieten voor uitvoering van het investeringsplan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.1.c
    text: |-
      een specificatie van de zekerheden, vergezeld van een taxatierapport ter zake van de executiewaarde van de
      onderscheiden roerende en onroerende goederen die tot zekerheid strekken, alsmede een specificatie van de totale
      financiering inclusief de daaraan verbonden voorwaarden na uitvoering van het investeringsplan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.1.d
    text: een berekening van het eigen en aansprakelijk vermogen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.1.e
    text: |-
      een door de bank getoetste, op de ondernemerscapaciteiten van de aanvrager
      afgestemde begroting, waaruit blijkt dat aanvrager voldoet aan het gestelde in
      [artikel 4:55, eerste lid, onderdelen b en c, en derde lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:58.1.f
    text: de boekhoudverslagen en de aangiften inkomstenbelasting over de voorliggende drie boekjaren, indien beschikbaar;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.1.g
    text: een toelichting van de bank op de verstrekte gegevens;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.2
    text: |-
      Onverminderd het bepaalde in het eerste lid kan de Minister besluiten dat de aanvrager zijn aanvraag aanvult met
      een taxatierapport ter zake van de executiewaarde van de onderscheiden roerende en onroerende goederen die tot
      zekerheid strekken, dat niet ouder is dan zes maanden op de dag van indiening van de aanvraag, en is opgesteld door
      een ter zake kundig en onafhankelijk taxateur.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.3
    text: |-
      De aanvrager is voorts verplicht alle bescheiden en informatie te verstrekken die door de Minister noodzakelijk
      worden geacht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
  - number: 4:58.4
    text: |-
      De [artikelen 1:8][ref1] en [1:9][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:59.1
    text: De Minister beslist binnen 16 weken na ontvangst van de aanvraag
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.2
    text: 'De beschikking tot verlening van de garantstelling bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.2.a
    text: de hoogte van de lening die onder garantstelling kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.2.b
    text: de uiterste datum waarop de lening onder garantstelling kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.2.c
    text: het schema volgens welke de lening dient te worden afgelost;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.2.d
    text: het investerings- en financieringsplan op grond waarvan de garantstelling wordt verleend;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.2.e
    text: |-
      de natuurlijke personen of rechtspersonen die zich hoofdelijk aansprakelijk dienen te stellen voor de terugbetaling
      van de lening onder garantstelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
  - number: 4:59.3
    text: |-
      De Minister verstrekt de bank, bedoeld in [artikel 4:54, vijfde lid][ref1], een afschrift van de beschikking tot
      verlening van de garantstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60.1
    text: |-
      Na inwerkingtreding van deze regeling berust het [Besluit maximumbedrag garantstelling visserij 2007][ref1] op
      [artikel 4:57][ref2] van deze regeling en geldt het als een besluit op grond van [artikel 1:3][ref3] van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022477
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460
    references:
      - id: ref1
        bwb_id: BWBR0022477
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:60.2
    text: |-
      De [Regeling garantstelling visserij][ref1] blijft van kracht voor zover dat nodig is voor een juiste toepassing
      van de raamovereenkomst, bedoeld in [artikel 4:54][ref2], die is gesloten tussen de banken en de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0022476
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460
    references:
      - id: ref1
        bwb_id: BWBR0022476
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60a.1
    text: |-
      De Minister kan op aanvraag subsidie verstrekken in de vorm van een garantstelling voor de terugbetaling van
      leningen die naar het oordeel van de Minister gericht zijn op investeringen als bedoeld in artikel 29, eerste lid,
      van verordening nr. 1198/2006.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460a
  - number: 4:60a.2
    text: |-
      De garantstelling kan worden verstrekt aan kleine of middelgrote ondernemingen als bedoeld in artikel 2, onderdeel
      g, van verordening nr. 736/2008, met in achtneming van artikel 10 van verordening nr. 498/2007.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460a
  - number: 4:60a.3
    text: |-
      [Artikel 1:2, tweede lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:60b
    text: 'Geen garantstelling wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460b
  - number: 4:60b.a
    text: aan ondernemingen in moeilijkheden, als bedoeld in artikel 2, onderdeel i, van verordening nr. 736/2008;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460b
  - number: 4:60b.b
    text: |-
      in de in [artikel 4:53, derde lid, onderdeel b tot en met e][ref1], bedoelde gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60b.c
    text: |-
      indien aan de aanvrager reeds een garantstelling is verstrekt door de Minister, en: - die garantstelling is
      verstrekt in het tijdvak van twee jaren voorafgaand aan de datum van ontvangst van de aanvraag, of
        - met de garantstelling waarop de aanvraag betrekking heeft het totaal aan garantstellingen, verstrekt aan de
      aanvrager, € 2.500.000 of hoger wordt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460b
  - number: 4:60b.d
    text: indien het bancair aansprakelijk vermogen van de aanvrager minder dan 15% bedraagt van het balanstotaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460b
  - number: 4:60b.e
    text: |-
      aan een onderneming ten aanzien waarvan een uitstaand bevel tot terugvordering geldt krachtens een eerdere
      beschikking van de Europese Commissie waarin de steun onrechtmatig en onverenigbaar met de gemeenschappelijke markt
      is verklaard.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460b
  - number: 4:60c.1
    text: |-
      Een garantstelling wordt verstrekt voor een lening met een minimumbedrag van € 50.000 en een maximumbedrag van
      € 600.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
  - number: 4:60c.2
    text: |-
      Op de verstrekking van de garantstelling, bedoeld in [artikel 4:60a, eerste lid][ref1], zijn de
      [artikelen 4:54, tweede tot en met zevende lid][ref2] en [4:55 tot en met 4:59][ref3] van toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60c.2.a
    text: |-
      de in [artikel 4:54, derde lid][ref1], genoemde termijn 20 jaar bedraagt en de bank de looptijd met ten hoogste
      twee jaar kan verlengen in geval van betalingsmoeilijkheden;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60c.2.b
    text: |-
      in [artikel 4:55, eerste lid, onder f][ref1], voor ‘een visvergunning’ wordt gelezen: een vergunning op grond van
      [artikel 2.1.1 van de Regeling aquacultuur][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024256#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0024256
        artikel: '2'
  - number: 4:60c.2.c
    text: |-
      bij de rangschikking van de aanvragen overeenkomstig [artikel 4:57, derde lid][ref1], een aanvraag hoger wordt
      gerangschikt indien het wordt uitgevoerd door een kleine of micro-onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60c.2.d
    text: |-
      in [artikel 4:58, eerste lid, onder a][ref1], voor ‘de artikelen 25 en 35’ wordt gelezen: artikel 29;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60c.2.e
    text: |-
      de in [artikel 4:59, eerste lid][ref1], genoemde termijn 13 weken bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60c.3
    text: |-
      Op de verstrekking van de garantstelling, bedoeld in [artikel 4:60a, eerste lid][ref1], is
      [artikel 4:42, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:60c.4
    text: De subsidieontvanger voldoet aan de regels van het gemeenschappelijk visserijbeleid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
  - number: 4:60c.5
    text: |-
      Indien de subsidieontvanger niet voldoet aan het vierde lid, wordt, naar gelang van de ernst van de inbreuk, de
      subsidie geheel of gedeeltelijk ingetrokken.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
  - number: 4:60c.6
    text: |-
      In afwijking van het eerste lid bedraagt de lening waarvoor een garantstelling wordt verstrekt ten hoogste
      € 1.200.000 ingeval een aanvraag tot garantstelling is ingediend door een natuurlijk persoon die op het tijdstip
      van ontvangst van de aanvraag ten hoogste 39 jaar oud is, en die tot doel heeft voor het eerst voor eigen rekening
      en risico een visserijonderneming te stichten of over te nemen die hij:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
  - number: 4:60c.6.a
    text: alleen in eigendom, pacht of erfpacht krijgt, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
  - number: 4:60c.6.b
    text: |-
      volledig in eigendom, pacht of erfpacht krijgt met een andere natuurlijke persoon die op het tijdstip van ontvangst
      van de aanvraag ten hoogste 39 jaar oud is en die niet eerder een visserijonderneming volledig in eigendom, pacht
      of erfpacht heeft gehad.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460c
  - number: 4:60d.1
    text: |-
      In afwijking van [artikel 4:60c, eerste lid][ref1], bedraagt de lening waarvoor een garantstelling wordt verstrekt
      ten hoogste € 2.500.000 als:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4a
  - number: 4:60d.1.a
    text: |-
      de aanvraag tot garantstelling is gericht op de terugbetaling van een lening die strekt tot financiering van
      investeringen als bedoeld in [artikel 4:60a, eerste lid][ref1], die voldoen aan de eisen van het certificatieschema
      Maatlat Duurzame Veehouderij en Aquacultuur, hetgeen blijkt uit een voorlopig certificaat dat is afgegeven door een
      door de Raad voor Accreditatie hiervoor geaccrediteerde organisatie, en waarvoor geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4a
  - number: 4:60d.1.a.1°
    text: binnen twee jaar na afgifte van het voorlopig certificaat een definitief certificaat wordt overgelegd, dan wel
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
  - number: 4:60d.1.a.2°
    text: |-
      binnen drie jaar een definitief certificaat wordt overgelegd volgens de dan vigerende Maatlat Duurzame Veehouderij
      en Aquacultuur.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
  - number: 4:60d.1.b
    text: |-
      de garantstelling wordt verstrekt ter zake van een investeringsplan, waarbij ten minste de helft van de
      investeringen betrekking heeft op de in onderdeel a bedoelde investeringen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
  - number: 4:60d.2
    text: |-
      Een garantstelling als bedoeld in dit artikel kan tevens worden verstrekt voor de terugbetaling van leningen die
      zijn achtergesteld ten opzichte van andere vorderingen van de bank, waarbij geldt dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
  - number: 4:60d.2.a
    text: |-
      slechts een garantstelling wordt verstrekt voor zover de omvang van de achtergestelde lening kleiner is dan het
      eigen vermogen van de visserijonderneming waarop de aanvraag tot garantstelling betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
  - number: 4:60d.2.b
    text: |-
      in afwijking van [artikel 4:60c, tweede lid][ref1], [artikel 4:55, eerste lid, onderdeel e][ref2], niet van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:60d.2.c
    text: |-
      in afwijking van [artikel 4:60c, tweede lid, aanhef en onder a][ref1], achtergestelde leningen een looptijd hebben
      van ten hoogste tien jaar en niet lineair hoeven te worden afgelost.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4a
  - number: 4:60e
    text: |-
      In afwijking van [artikel 1:15, eerste lid, onderdeel a][ref1], komen kosten die op grond van
      [hoofdstuk 4, titel 4, paragraaf 2][ref2], worden gesubsidieerd eveneens in aanmerking voor subsidie op grond van
      deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel460e
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:61.1
    text: |-
      De Minister kan aan de eigenaar van een vissersvaartuig subsidie verstrekken voor de aanschaf en installatie van
      elektronische registratie- en meldapparatuur aan boord van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:61.1.a
    text: een vissersvaartuig met een lengte over alles van meer dan 24 meter, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:61.1.b
    text: een vissersvaartuig met een lengte over alles van 15 tot en met 24 meter.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:61.2
    text: 'Aan een eigenaar van een vissersvaartuig wordt slechts subsidie verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:61.2.a
    text: de elektronische registratie- en meldapparatuur voldoet aan de vereisten, bedoeld in verordening nr. 1077/2008;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:61.2.b
    text: |-
      de kosten voor de aanschaf en installatie van elektronische registratie- en meldapparatuur aan boord van een
      vissersvaartuig zijn gemaakt na 1 januari 2009, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:61.2.c
    text: |-
      de elektronische registratie- en meldapparatuur geïnstalleerd wordt op een vissersvaartuig als bedoeld in artikel
      1, eerste lid, onderdelen a en b, van verordening nr. 1077/2008.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel461
  - number: 4:62
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:63.1
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van nota’s en betaalbewijzen van de aanschaf en installatie van
      de elektronische registratie- en meldapparatuur waarop de gemaakte kosten zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel463
  - number: 4:63.2
    text: |-
      In afwijking van [artikel 1:8, eerste lid][ref1], wordt een aanvraag tot subsidievaststelling ingediend bij
      de Directeur Agroketens en Visserij met gebruikmaking van een daartoe door de Directie Agroketens en Visserij
      verstrekt formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel463
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:63.3
    text: |-
      De subsidie wordt vastgesteld onder voorbehoud van geen bezwaar van de Commissie van de Europese Gemeenschappen
      tegen de melding, bedoeld in artikel 9 van verordening (EG) 2007/391 van de Commissie van de Europese
      Gemeenschappen van 11 april 2007 tot vaststelling van de uitvoeringsbepalingen van Verordening (EG) nr. 861/2006
      van de Raad, wat beteft de uitgaven die de lidstaten doen bij de tenuitvoerlegging van de in het kader van het
      gemeenschappelijk visserijbeleid geldende toezicht- en controleregelingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel463
  - number: 4:64
    text: |-
      De subsidieontvanger heeft de activiteiten, bedoeld in [artikel 4:61, eerste lid][ref1], uitgevoerd respectievelijk
      voert die activiteiten, uit:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:64.a
    text: |-
      voor 1 januari 2010 indien de subsidie verstrekt wordt voor de aanschaf en installatie van
      elektronische registratie- en meldapparatuur aan boord van een vissersvaartuig als bedoeld in
      [artikel 4:61, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:64.b
    text: |-
      voor 1 juli 2010 indien de subsidie verstrekt wordt voor de aanschaf en installatie van elektronische registratie-
      en meldapparatuur aan boord van een vissersvaartuig als bedoeld in [artikel 4:61, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:65.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel465
  - number: 4:65.1.a
    text: |-
      kosten voor de aanschaf van apparatuur als bedoeld in [artikel 4:61][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel465
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:65.1.b
    text: |-
      kosten voor de installatie van apparatuur als bedoeld in [artikel 4:61][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel465
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:65.1.c
    text: |-
      kosten voor de aanpassing van het vissersvaartuig ten behoeve van de installatie van apparatuur als bedoeld in
      [artikel 4:61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel465
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:65.2
    text: Verschuldigde BTW komt niet in aanmerking voor subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel465
  - number: 4:66.1
    text: De subsidie bedraagt ten hoogste 95% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466
  - number: 4:66.2
    text: De subsidie bedraagt ten hoogste € 4500,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466
  - number: 4:66a.1
    text: |-
      De Minister kan aan een onderneming die zich bezighoudt met het slachten of doden van aal voor de verkoop of een
      samenwerkingsverband van dergelijke ondernemingen als bedoeld in [artikel 1:19][ref1], subsidie verstrekken voor de
      aanschaf en installatie van aalbedwelmingsapparatuur die bestemd is voor de verdoving van aal bij de slacht.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:66a.2
    text: 'Subsidie wordt slechts verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
  - number: 4:66a.2.a
    text: |-
      de aalbedwelmingsapparatuur, bedoeld in het eerste lid, in afwijking van [artikel 1:2, tweede lid][ref1], na
      16 juni 2011 en uiterlijk op het moment van de subsidieaanvraag betaald, geleverd en geïnstalleerd is;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:66a.2.b
    text: |-
      de onderneming of het samenwerkingsverband, bedoeld in het eerste lid, een verklaring van de bouwer van de
      aalbedwelmingsapparatuur kan afgeven waaruit blijkt dat door middel van een hersenfilm wetenschappelijk is
      aangetoond dat het desbetreffende type aalbedwelmingsapparatuur ervoor zorgt dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
  - number: 4:66a.2.b.1°
    text: een aal voorafgaand aan het doden binnen één seconde wordt verdoofd door middel van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
  - number: 4:66a.2.b.2°
    text: |-
      een aal pas wordt blootgesteld aan de elektrische stroom op het moment dat de aal zich tussen de elektroden
      bevindt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
  - number: 4:66a.2.b.3°
    text: |-
      de toestand van bewusteloosheid en gevoelloosheid ten gevolge van de bedwelming wordt aangehouden totdat het
      dodingsproces voltooid is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
  - number: 4:66a.2.c
    text: |-
      aan de onderneming, bedoeld in het eerste lid, of aan één van de deelnemers in het samenwerkingsverband, bedoeld
      in het eerste lid, niet op een eerder moment al subsidie is verstrekt door een bestuursorgaan of door een orgaan
      van de Europese Unie voor de investering in of ontwikkeling van aalbedwelmingsapparatuur dat gebruikt wordt voor de
      verdoving van aal bij de slacht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466a
  - number: 4:66b
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:66c.1
    text: 'De aanvraag tot subsidievaststelling gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466c
  - number: 4:66c.1.a
    text: |-
      nota's en betaalbewijzen van de aanschaf en installatie van de aalbedwelmingsapparatuur waarop de gemaakte kosten
      zijn gespecificeerd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466c
  - number: 4:66c.1.b
    text: |-
      een verklaring van de bouwer van de aalbedwelmingsapparatuur als bedoeld in
      [artikel 4:66a, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 4:66c.2
    text: |-
      De aanvrager overlegt desgevraagd het wetenschappelijk rapport dat ten grondslag ligt aan de verklaring van de
      bouwer, bedoeld in [artikel 4:66a, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 4:66d.1
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.1.a
    text: kosten voor de aanschaf van de aalbedwelmingsapparatuur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.1.b
    text: kosten voor de installatie van de aalbedwelmingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.2
    text: 'Niet in aanmerking voor subsidie komen:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.2.a
    text: verschuldigde BTW, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.2.b
    text: kosten voor eigen arbeid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.3
    text: |-
      Onder aanschaf van de aalbedwelmingsapparatuur, bedoeld in het eerste lid, onderdeel a, wordt niet verstaan
      aanschaf door middel van huurkoop.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66d.4
    text: |-
      De kosten, bedoeld in het eerste lid, komen slechts voor subsidie in aanmerking, indien deze kosten minimaal
      € 3.000,– bedragen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466d
  - number: 4:66e.1
    text: De subsidie bedraagt ten hoogste 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466e
  - number: 4:66e.2
    text: |-
      De subsidie bedraagt ten hoogste € 30.000,– voor aalbedwelmingsapparatuur die in een slachtlijn wordt geïntegreerd
      en die meer dan 500 kilogram aal per dag kan verdoven.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466e
  - number: 4:66e.3
    text: De subsidie bedraagt ten hoogste € 3.400,– voor alle overige aalbedwelmingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel466e
  - number: 4:67
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel467
  - number: 4:67.a
    text: |-
      *kustwateren:* wateren als bedoeld in [artikel 2 van het Besluit aanwijzing zeegebied en kustwateren 1970][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel467
    references:
      - id: ref1
        bwb_id: BWBR0002703
        artikel: '2'
  - number: 4:67.b
    text: |-
      *binnenwateren:* overige wateren als bedoeld in [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel467
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: 4:67.c
    text: '*referentieperiode:* maanden september, oktober en november van de jaren 2006, 2007 en 2008.'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel467
  - number: 4:68
    text: |-
      De Minister kan op aanvraag een tegemoetkoming verstrekken aan beroepsvissers die vissen
      in de kust- en binnenwateren en die als gevolg van het visverbod op aal, bedoeld in
      [artikel 32a van de Uitvoeringsregeling visserij][ref1], in de maanden september, oktober en november 2012 schade
      lijden en aan beroepsvissers die deelnemen aan een pilot in het kader van decentraal aalbeheer, waarvoor op grond
      van [artikel 11 van het Reglement voor de binnenvisserij 1985][ref2] ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0009027#Artikel11
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel468
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: 32a
      - id: ref2
        bwb_id: BWBR0009027
        artikel: '11'
  - number: 4:69.1
    text: Een tegemoetkoming wordt alleen verstrekt voor schade die betrekking heeft op de vissoort aal.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel469
  - number: 4:69.2
    text: |-
      De Minister verstrekt op aanvraag een tegemoetkoming aan beroepsvissers die in de referentieperiode jaarlijks
      gemiddeld minstens € 3.000 hebben verdiend aan de verkoop van door de betreffende aanvrager gevangen aal.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel469
  - number: 4:70.1
    text: |-
      De tegemoetkoming wordt berekend naar rato van de gemiddelde inkomsten per jaar uit de verkoop van door de
      aanvrager gevangen aal in de referentieperiode.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel470
  - number: 4:70.2
    text: De tegemoetkoming bedraagt maximaal 100% van de totale inkomsten in de referentieperiode.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel470
  - number: 4:71.1
    text: |-
      Een aanvraag tot verstrekking van een tegemoetkoming als bedoeld in [artikel 4:68][ref1] gaat vergezeld van een
      overzicht van de opbrengsten uit de verkoop van door de betreffende aanvrager gevangen aal in de referentieperiode
      met de daarbij behorende:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel471
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:71.1.a
    text: kopieën van verkoopbonnen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel471
  - number: 4:71.1.b
    text: kopieën van kasboekoverzichten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel471
  - number: 4:71.1.c
    text: |-
      kopieën van veilingbonnen van visafslagen als genoemd in
      [artikel 1 van het Besluit aanwijzing bevoegde afslagen voor inning productschapsheffingen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0026263#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel471
    references:
      - id: ref1
        bwb_id: BWBR0026263
        artikel: '1'
  - number: 4:71.1.d
    text: een combinatie van a, b en c.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel471
  - number: 4:71.2
    text: |-
      Indien de aanvrager een aanvraag heeft ingediend op grond van de Regeling van de Minister van Landbouw, Natuur
      en Voedselkwaliteit van 4 januari 2010, nr 79904, houdende wijziging van de Regeling LNV-subsidies en het
      Openstellingsbesluit LNV-subsidies 2010 (Stcrt. 2012, 284) of de Regeling van de Staatssecretaris van Economische
      Zaken, Landbouw en Innovatie van 14 juli 2011 houdende wijziging van het Mandaatbesluit LNV Dienst Regelingen
      2011, de Regeling LNV-subsidies en de Uitvoeringsregeling visserij in verband met een compensatieregeling voor
      aalvisserij en enkele andere zaken (Stcrt. 2011, 13462), en deze geleid heeft tot verstrekking van de in die
      regelingen bedoelde tegemoetkomingen, wordt, voor zover het de maanden september, oktober en november uit de jaren
      van de referentieperiode betreft, uitgegaan van de opbrengsten uit de verkoop van door de betreffende aanvrager
      gevangen aal zoals deze in het kader van die regelingen in aanmerking zijn genomen voor de verstrekking van de
      daar bedoelde tegemoetkomingen en behoeft de aanvrager in afwijking van het eerste lid de gegevens over de maanden
      september, oktober en november niet te verstrekken.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel471
  - number: 4:72.1
    text: |-
      Een aanvraag tot een verstrekking van een tegemoetkoming van een beroepsvisser die zich niet voor het einde
      van de openstellingperiode waarin hij zijn aanvraag heeft gedaan, heeft geregistreerd bij het Productschap Vis
      overeenkomstig de op grond van [artikel 93, tweede lid, onderdeel a, van de Wet op de bedrijfsorganisaties][ref1]
      geldende registratieplicht, wordt afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel93
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel472
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '93'
  - number: 4:72.2
    text: |-
      Een aanvraag tot verstrekking van een tegemoetkoming van een beroepsvisser met visrechten op de binnenwateren,
      uitgezonderd het IJsselmeer, die zich niet voor het einde van de openstellingsperiode waarin de aanvraag is gedaan
      overeenkomstig [artikel 55][ref1] of [56 van de Uitvoeringsregeling visserij][ref2] heeft gemeld bij de Minister,
      of die vist in dienst van een rechtspersoon en deze rechtspersoon zich niet overeenkomstig artikel 55 of 56 van de
      Uitvoeringsregeling visserij heeft gemeld bij de Minister, wordt afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel56
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel472
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0024539
        artikel: '56'
  - number: 4:72.3
    text: |-
      Het tweede lid is niet van toepassing indien de aanvrager op grond van [artikel 4:68][ref1] een aanvraag heeft
      ingediend in de periode van 7 november tot en met 19 december 2011 en die aanvraag heeft geleid tot het verstrekken
      van een tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel472
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:73
    text: |-
      Een beschikking omtrent verstrekking van de tegemoetkoming wordt gegeven binnen drie maanden na afloop van de
      openstellingsperiode in enig jaar waarin de aanvraag kon worden gedaan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel473
  - number: 4:75
    text: |-
      In deze paragraaf wordt verstaan onder ‘nettoresultaat’; omzet verminderd met de vaste kosten en de variabele
      kosten, voordat dit bedrag is verminderd met de verschuldigde inkomsten- en vennootschapsbelasting.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel475
  - number: 4:76.1
    text: |-
      De Minister kan op aanvraag een tegemoetkoming verstrekken aan degene die tenminste tot 1 september 2010
      viste in de wateren, bedoeld in [bijlage 15][ref1] en [16 van de Uitvoeringsregeling visserij][ref2],
      en die schade lijdt als gevolg van het visverbod, bedoeld in de [artikelen 23b][ref3] en
      [28b van de Uitvoeringsregeling visserij][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024539
      [ref2]: https://wetten.overheid.nl/BWBR0024539
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel23b
      [ref4]: https://wetten.overheid.nl/BWBR0024539#Artikel28b
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
    references:
      - id: ref1
        bwb_id: BWBR0024539
      - id: ref2
        bwb_id: BWBR0024539
      - id: ref3
        bwb_id: BWBR0024539
        artikel: 23b
      - id: ref4
        bwb_id: BWBR0024539
        artikel: 28b
  - number: 4:76.2
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, bedraagt een gemiddeld nettojaarresultaat, berekend uit de
      nettojaarresultaten die zijn behaald in de jaren 2009 en 2010 uit de vangst van aal en wolhandkrab in de gebieden,
      waarop het verbod, bedoeld in het eerste lid, ziet, vermenigvuldigd met vijf.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.3
    text: |-
      In afwijking van het tweede lid kan de Minister het nettojaarresultaat behaald uit de visserij op aal in het jaar
      2009 of 2010 hanteren, indien
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.3.a
    text: |-
      uit de boekhouding blijkt dat de opbrengst uit de visserij op aal in één van de betreffende jaren significant lager
      is dan hetgeen te verwachten is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.3.b
    text: de aanvrager aannemelijk maakt dat dit te wijten is aan omstandigheden die buiten zijn invloedsfeer liggen, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.3.c
    text: de aanvrager zulks verzoekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.4
    text: |-
      Indien de aanvrager aannemelijk maakt dat de opbrengsten uit de visserij op aal zowel in 2009 als in 2010, als
      gevolg van omstandigheden, als bedoeld in lid 3, onderdeel b, significant lager zijn geweest dan hetgeen in normale
      omstandigheden te verwachten is, kan de Minister het nettojaarresultaat behaald uit de visserij op aal in 2008
      hanteren, indien van dat resultaat in de boekhouding separaat melding wordt gemaakt en indien de aanvrager zulks
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.5
    text: |-
      In afwijking van het tweede lid kan de Minister het nettojaarresultaat behaald uit de visserij op wolhandkrab in
      het jaar 2009 of 2010 hanteren, indien van dat resultaat in de boekhouding separaat melding wordt gemaakt en indien
      de aanvrager zulks verzoekt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.6
    text: |-
      Het bedrag, bedoeld in het tweede lid, in voorkomend geval berekend met inachtneming van het bepaalde in het
      derde, vierde of vijfde lid, wordt vermeerderd met een bedrag dat gelijkstaat aan vijf maal het gemiddelde
      nettojaarresultaat in de jaren 2009 en 2010, voor zover dat resultaat is verkregen uit de vangst van
      schubvissen in de gebieden, bedoeld in [artikel 23][ref1] en [28 van de Uitvoeringsregeling visserij][ref2],
      die ingevolge een toestemming als bedoeld in [artikel 7, tweede lid, onderdeel a][ref3], en
      [21, eerste lid, van de Visserijwet 1963][ref4], voor het vissen op aal of wolhandkrab, of ingevolge een
      huurovereenkomst als bedoeld in [artikel 25, eerste lid, van de Visserijwet 1963][ref5], voor het vissen op aal
      of wolhandkrab door de aanvrager, mag worden behouden en verkocht, voor zover van dat resultaat in de boekhouding
      separaat melding wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002416#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002416#Artikel25
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0024539
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0002416
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0002416
        artikel: '25'
  - number: 4:76.7
    text: |-
      Indien een aanvrager aannemelijk maakt dat de afschrijvingskosten in de jaren die als referentie worden gehanteerd,
      of in geval van toepassing van het derde, vierde of vijfde lid, in het jaar dat als referentie wordt gehanteerd,
      significant hoger zijn dan de kosten die in de jaren 2011 tot en met 2015, redelijkerwijs hadden mogen worden
      verwacht, wordt het nettojaarresultaat vermeerderd met het verschil tussen op de boekhouding opgenomen afschrijving
      en de afschrijving die redelijkerwijs mag worden verwacht.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:76.8
    text: |-
      In voorkomend geval wordt het nettoresultaat verminderd met de tegemoetkoming die in het betreffende jaar voor de
      betreffende wateren is uitgekeerd op grond van [artikel 4:68][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:76.9
    text: |-
      Bij toepassing van het vierde lid wordt het nettoresultaat uit de vangst van aal over het jaar 2008 verminderd met
      het resultaat dat in de betreffende wateren met die vangst is behaald in de maanden september tot en met november
      van dat jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel476
  - number: 4:77.1
    text: |-
      Een aanvraag als bedoeld in [artikel 4:75, eerste lid][ref1], kan gedurende een periode van zes weken worden
      ingediend. De periode vangt aan met ingang van de zevende dag volgend op de dag van inwerkingtreding van deze
      paragraaf van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:77.2
    text: 'Een aanvraag gaat in ieder geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel477
  - number: 4:77.2.a
    text: |-
      een toestemming als bedoeld in [artikel 7, tweede lid, onderdeel a][ref1], en
      [21, eerste lid, van de Visserijwet 1963][ref2], voor het vissen op aal of wolhandkrab, of ingevolge een
      huurovereenkomst als bedoeld in [artikel 25, eerste lid, van de Visserijwet 1963][ref3], op grond waarvan de
      aanvrager in ieder geval tot 1 april 2011 gerechtigd was te vissen;


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel25
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '25'
  - number: 4:77.2.b
    text: |-
      de jaarrekeningen en de boekhouding van 2008, 2009 of 2010 voor zover relevant op grond van [artikel 4:76][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:77.2.c
    text: |-
      documenten ter onderbouwing van een beroep op het [derde tot en met zesde lid van artikel 4:76][ref1], voor zover
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel477
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 5:2
    text: |-
      In deze titel wordt verstaan onder: - *diversificatie:* geheel van maatregelen die gericht zijn op de duurzame
      ontwikkeling van de suikerbietenteelt, versterking van de suikersector of het ontwikkelen van alternatieven voor de
      suikerbietenteelt en suikerproductie;
        - *suikersector:* gehele complex van ondernemingen, gericht op de productie van suiker, suikerproducten verwerkende
      ondernemingen en aan de suiker gerelateerde afzet, handel, dienstverlening, logistiek en toeleverende industrie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel52
  - number: 5:3.1
    text: |-
      De Minister kan subsidie verstrekken aan telers van suikerbieten en samenwerkingsverbanden uit regio’s die
      betrokken zijn bij de herstructurering van de suikersector op grond van Verordening (EG) nr. 320/2006 van de Raad
      van de Europese Unie van 20 februari 2006 tot instelling van een tijdelijke regeling voor de herstructurering van
      de suikerindustrie in de Europese Gemeenschap en tot wijziging van Verordening (EG) nr. 1290/2005 betreffende de
      financiering van het gemeenschappelijk landbouwbeleid (PbEU L 58).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.2
    text: 'Voor subsidie komen de volgende activiteiten in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.2.a
    text: het doen van investeringen door suikerbietentelers gericht op diversificatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.2.b
    text: |-
      het vormen van samenwerkingsverbanden gericht op innovatieve vormen van productie, verwerking en afzet voor
      suikerbieten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.2.c
    text: het ontwikkelen van initiatieven gericht op vakmanschap en management.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3
    text: 'De activiteiten, bedoeld in het tweede lid, onderdeel a, leiden tot:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.a
    text: |-
      een hoger niveau van diergezondheid in Nederland en daardoor tot een beter technisch en economisch perspectief van
      en continuïteit binnen landbouwondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.b
    text: verlaging van de productiekosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.c
    text: de verbetering en omschakeling van de productie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.d
    text: |-
      de instandhouding en verbetering van het natuurlijk milieu, de hygiënische omstandigheden, dierenwelzijn,
      voedselveiligheid of duurzaam gebruik van energiebronnen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.e
    text: herstructurering en ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.f
    text: verhoging van de kwaliteit en toegevoegde waarde van producten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.g
    text: verbetering van de arbeidsomstandigheden in de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.h
    text: behoud en duurzaam gebruik van biodiversiteit en natuurlijke hulpbronnen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.i
    text: verhoging van de doelmatigheid bij inzet en gebruik van middelen, machines en menskracht, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.3.j
    text: het tot waarde brengen van bij-, rest- en afvalproducten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.4
    text: 'De activiteiten, bedoeld in het tweede lid, onderdeel b, hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.4.a
    text: de verwerking of de afzet van suikerbieten, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.4.b
    text: de ontwikkeling van nieuwe producten, procédés en technologieën voor suikerbieten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.5
    text: |-
      De activiteiten, bedoeld in het tweede lid, onderdeel c, zien op een bedrijfsconsult of het volgen van opleidingen,
      trainingen of voorlichtingsbijeenkomsten en hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.5.a
    text: de verbetering van de bedrijfsvoering en de verduurzaming daarvan;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.5.b
    text: |-
      het voldoen aan wettelijke normen inzake milieu of waterbeheer, aan veterinaire, sanitaire of fytosanitaire
      regelgeving, aan hygiëne- of dierenwelzijnsregelgeving of aan arbeidsomstandighedenregelgeving;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.5.c
    text: |-
      het verkrijgen of vergroten van kennis waarmee nieuwe of hoogwaardigere producten kunnen worden verkregen of deze
      productiewijzen of productieprocessen kunnen worden verbeterd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.5.d
    text: begeleiding bij het starten of beëindigen van de onderneming of een onderdeel daarvan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.6
    text: 'Geen subsidie wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.6.a
    text: |-
      de activiteiten, bedoeld in het tweede lid, onderdeel a en onderdeel b, waarvan de subsidiabele kosten in totaal
      minder bedragen dan € 10.000;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.6.b
    text: |-
      de activiteiten, bedoeld in het tweede lid, onderdeel c, waarvan de subsidiabele kosten in totaal minder bedragen
      dan € 250;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:3.6.c
    text: |-
      aan ondernemingen als bedoeld in paragraaf 2.1 van de Mededeling van de Commissie van de Europese Gemeenschappen
      van 1 oktober 2004 aangaande communautaire richtsnoeren inzake reddings- en herstructureringssteun aan
      ondernemingen in moeilijkheden (PbEU C 244).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel53
  - number: 5:4.1
    text: |-
      De volgende kosten voor de uitvoering van de activiteiten, bedoeld in [artikel 5:3, tweede lid, onderdeel a][ref1],
      komen in aanmerking voor de subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:4.1.a
    text: kosten voor de bouw, inrichting of verbetering van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.1.b
    text: |-
      kosten voor verwerving van onroerende zaken, met uitzondering van grond, waarin zijn begrepen de daaraan verbonden
      kosten van overdrachtsbelasting, notariële kosten en de kosten van inschrijving bij het kadaster;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.1.c
    text: kosten voor de aanschaf van nieuwe machines en apparatuur, waarvan de aanvrager eerste gebruiker is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.1.d
    text: |-
      kosten voor de aanschaf van plantmateriaal en de kosten van derden voor het planten van blijvende teelten, bedoeld
      in artikel 2, onderdeel b, van verordening 1120/2009.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.2
    text: |-
      De volgende kosten voor de uitvoering van de activiteiten, bedoeld in [artikel 5:3, tweede lid, onderdeel b][ref1],
      komen in aanmerking voor de subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:4.2.a
    text: |-
      kosten voor de bouw, verwerving, verbetering of inrichting van onroerende goederen, met uitzondering van de
      verwerving van grond;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.2.b
    text: |-
      kosten voor de aankoop of huurkoop van nieuwe machines en apparatuur, inclusief computersoftware tot aan de
      marktwaarde van het goed;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.2.c
    text: kosten voor de ontwikkeling van nieuwe machines of apparatuur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.2.d
    text: |-
      kosten voor de ontwikkeling en operationalisering van processen, procédés, technologieën, marketingconcepten,
      product-marktcombinaties en andere innovaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.2.e
    text: |-
      algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met d, zoals kosten voor de architecten
      en ingenieurs, honoraria van adviseurs tot een hoogte van 15% van het totale subsidiebedrag, haalbaarheidsstudies,
      controleverklaring van een accountant, verwerven van patenten en vergunningen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.3
    text: |-
      Voor de subsidie voor de uitvoering van activiteiten bedoeld in [artikel 5:3, tweede lid, onderdeel a][ref1],
      komen niet in aanmerking kosten voor de verwerving van onroerende zaken, ten behoeve waarvan subsidie door een
      bestuursorgaan is verleend in de periode van tien jaar voorafgaand aan de ontvangstdatum van de aanvraag tot
      subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:4.4
    text: |-
      Geen subsidie wordt verstrekt voor kosten voor de uitvoering van de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref1], met betrekking tot een leasecontract, zoals de marge van de
      leaseorganisatie, herfinancieringskosten, overheadkosten en verzekeringspremies.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:4.5
    text: |-
      Indien subsidie wordt verstrekt voor een investering, wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken indien de investering gedurende vijf jaar te
      rekenen vanaf de datum van subsidievaststelling een belangrijke wijziging ondergaat die:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5:4.5.a
    text: de aard van de investering of de bij of krachtens deze regeling opgelegde uitvoeringsvoorwaarden raakt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.5.b
    text: een onderneming of overheidsinstantie onrechtmatig voordeel oplevert, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:4.5.c
    text: |-
      het gevolg is hetzij van een verandering in de aard van de eigendom van een infrastructuurvoorziening, hetzij van
      de beëindiging of verplaatsing van productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel54
  - number: 5:5.1
    text: |-
      De Minister rangschikt een aanvraag tot subsidieverlening voor activiteiten, als bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref1], overeenkomstig [artikel 1:4][ref2] hoger naarmate de maatregelen
      waarop de aanvraag betrekking heeft meer bijdragen aan een duurzame diversificatie in de suikersector.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 5:5.2
    text: |-
      Op aanvragen tot subsidieverlening voor activiteiten als bedoeld in
      [artikel 5:3, tweede lid, onderdelen a en c][ref1], is [artikel 1:6][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 5:6.1
    text: |-
      Een aanvraag tot verlening van een subsidie voor de uitvoering van activiteiten als bedoeld in
      [artikel 5:3, tweede lid, onderdeel a][ref1], gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:6.1.a
    text: |-
      een plan, waarin de activiteiten waarvoor de subsidie wordt aangevraagd zijn opgenomen en waaruit blijkt hoe die
      activiteiten bijdragen aan de doelstelling, bedoeld in [artikel 5:3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:6.1.b
    text: |-
      een op naam van de aanvrager gestelde offerte van de bouwers of leveranciers van de investeringen waarvoor subsidie
      wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:6.2
    text: |-
      Een aanvraag tot verlening van een subsidie voor de uitvoering van activiteiten als bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref1], gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:6.2.a
    text: |-
      een projectplan dat helder onderbouwt dat uitvoering van het plan en van de daarin opgenomen investeringen waarvoor
      subsidie wordt aangevraagd, bijdraagt aan het verbeteren van de algehele prestaties van de betrokken ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:6.2.b
    text: een analyse van vraag- en aanbod in de betreffende markt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:6.2.c
    text: een uitvoerige beschrijving van de geplande activiteiten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:6.2.d
    text: de bijdrage van die activiteiten aan het verhogen van de toegevoegde waarde;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:6.2.e
    text: melding van een beslismoment ten aanzien van de overgang van ontwikkel- naar uitvoeringsfase;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:6.2.f
    text: een investerings- en indien relevant een exploitatiebegroting met een dekkingsvoorstel.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel56
  - number: 5:7
    text: |-
      De subsidieontvanger voert de activiteiten, bedoeld in [artikel 5:3, tweede lid, onderdelen a en c][ref1], vóór 30
      september 2010 uit, en de activiteiten, bedoeld in artikel 5:3, tweede lid, onderdeel b, vóór 30 september 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:8.1
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling ingediend binnen één
      maand na afloop van de activiteit waarvoor subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 5:8.2
    text: |-
      De aanvraag tot subsidievaststelling voor de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel a en onderdeel b][ref1], gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:8.2.a
    text: |-
      facturen of andere schriftelijke bewijsstukken, waarop prijzen inclusief en exclusief BTW worden opgevoerd, waaruit
      blijkt dat de investering(en) volgens de offerte is of zijn gedaan en waarop in ieder geval de typering van het
      product en het onderscheid tussen kostenonderdelen is aangegeven, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
  - number: 5:8.2.b
    text: bankafschriften waaruit de betaling van de facturen blijkt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
  - number: 5:8.3
    text: |-
      De aanvraag tot subsidievaststelling voor de activiteiten, bedoeld in [artikel 5:3, tweede lid, onderdeel c][ref1],
      gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:8.3.a
    text: facturen of andere schriftelijke bewijsstukken, waarop prijzen inclusief en exclusief BTW worden opgevoerd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
  - number: 5:8.3.b
    text: bankafschriften waaruit de betaling van de facturen blijkt, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
  - number: 5:8.3.c
    text: |-
      een bewijs van deelname aan de opleiding, training of voorlichtingsbijeenkomst of in het geval van een
      bedrijfsconsult een op schrift gesteld advies aan de begunstigde.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel58
  - number: 5:9.1
    text: |-
      De subsidie bedraagt ten hoogste 40% van de subsidiabele kosten, met dien verstande dat de subsidie voor de
      activiteiten bedoeld in [artikel 5:3, tweede lid, onderdeel a][ref1], ten hoogste € 20.000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:9.2
    text: |-
      Indien het gaat om subsidie verleend voor de activiteit, bedoeld in [artikel 5:3, tweede lid, onderdeel c][ref1],
      is het subsidiebedrag niet hoger dan 50% van de subsidiabele kosten met dien verstande dat de subsidie ten hoogste
      € 1.500 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel5
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '5'
        hoofdstuk: '5'
  - number: 6:1
    text: |-
      Als personen als bedoeld in [artikel 8 van de Kaderwet EZ-subsidies][ref1] worden aangewezen de ambtenaren van:


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel8
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '8'
  - number: 6:1.a
    text: de Rijksdienst voor Ondernemend Nederland;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel61
  - number: 6:1.b
    text: de Nederlandse Voedsel en Warenautoriteit van het Ministerie van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel61
  - number: 6:1.c
    text: de Auditdienst Rijk.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel61
  - number: 6:2
    text: 'De volgende regelingen en besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel62
  - number: 6:2.a
    text: |-
      [Beëindigingsregeling varkensbedrijven in de EHS][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010149
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0010149
  - number: 6:2.b
    text: |-
      [Besluit aanwijzing toezichthouders Kaderwet LNV-subsidies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011970
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011970
  - number: 6:2.c
    text: |-
      [Investeringsregeling biologische varkenshouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013021
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013021
  - number: 6:2.d
    text: |-
      [Investeringsregeling energiebesparing][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020502
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020502
  - number: 6:2.e
    text: |-
      [Investeringsregeling markt en concurrentiekracht][ref1];


