  - number: 6:3.1
    text: |-
      Het recht zoals dat gold voorafgaand aan de tijdstippen van intrekking van de regelingen, genoemd in
      [artikel 6:2][ref1], blijft van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel6
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '6'
        hoofdstuk: '6'
  - number: 6:3.1.a
    text: op een aanvraag tot subsidieverlening die is ingediend voorafgaand aan dat tijdstip;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.1.b
    text: |-
      met betrekking tot een subsidie die is of wordt verleend op een aanvraag tot subsidieverlening als bedoeld in
      onderdeel a, alsmede de uit die subsidieverlening voortvloeiende rechten, aanspraken en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.2
    text: |-
      Bij intrekking van de door het bestuur van de Stichting Borgstellingsfonds voor de Landbouw vastgestelde Besluit
      Borgstellingsfonds en Besluit BF bijzondere borgstellingen:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.2.a
    text: 'blijft het recht zoals dat gold voorafgaand aan de tijdstippen van intrekking van die besluiten van toepassing:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.2.a.1
    text: op een aanvraag tot subsidieverlening die op grond van die besluiten is ingediend;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.2.a.2
    text: |-
      met betrekking tot een subsidie die is verleend op een aanvraag tot subsidieverlening als bedoeld onder 1°, alsmede
      de uit die subsidieverleningen voortvloeiende rechten, aanspraken en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.2.b
    text: |-
      gaan de rechten, aanspraken en verplichtingen van het bestuur van de Stichting Borgstellingsfonds voor de Landbouw
      die zijn aangegaan op grond of ter uitvoering van die besluiten, over op de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.3
    text: |-
      Na ontbinding van de Stichting fonds MKZ-AI gaan de rechten, aanspraken of verplichtingen van het bestuur van de
      Stichting fonds MKZ-AI die zijn aangegaan op grond of ter uitvoering van de regelingen, bedoeld in het eerste lid,
      over op de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.4
    text: |-
      Het recht, zoals dat gold voorafgaand aan het moment van inwerkingtreding van [artikel 2:2, tweede lid][ref1],
      blijft van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
        hoofdstuk: '2'
  - number: 6:3.4.a
    text: op aanvragen tot subsidieverlening die zijn ingediend voorafgaand aan dat tijdstip;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.4.b
    text: |-
      met betrekking tot een subsidie die is of wordt verleend op een aanvraag tot subsidieverlening als bedoeld in
      onderdeel a, alsmede de uit die subsidieverlening voortvloeiende rechten, aanspraken en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.5
    text: |-
      [Artikel 1:15][ref1], zoals dat gold voorafgaand aan het moment van inwerkingtreding op 1 juli 2012, blijft van
      toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 6:3.5.a
    text: op aanvragen tot subsidieverlening voor de kosten van eigen arbeid die zijn ingediend voorafgaand aan dat tijdstip;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3.5.b
    text: |-
      met betrekking tot een subsidie die is of wordt verleend op een aanvraag tot subsidieverlening als bedoeld in
      onderdeel a, alsmede de uit die subsidieverlening voortvloeiende rechten, aanspraken en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63
  - number: 6:3a
    text: |-
      Deze regeling berust mede op [artikel 3 van de Kaderwet EZ-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: 6:4
    text: Deze regeling treedt in werking met ingang van 1 april 2007.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel64
  - number: 6:5
    text: 'Deze regeling wordt aangehaald als: Regeling LNV-subsidies.'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel65
