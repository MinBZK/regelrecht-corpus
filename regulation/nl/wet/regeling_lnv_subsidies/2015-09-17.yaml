  - number: 4:30.4
    text: |-
      De subsidieontvanger staat toe dat de Minister de kennis en informatie die met het project worden opgedaan openbaar
      maakt ten behoeve van de visserijsector.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel430
  - number: 4:31
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:31.a
    text: |-
      de kosten van reclamebureaus en andere dienstverleners die betrokken zijn bij de voorbereiding en uitvoering van de
      in [artikel 4:27, eerste lid][ref1], bedoelde activiteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4:31.b
    text: de kosten van het ontwerpen en introduceren van een kwaliteitscertificaat;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:31.c
    text: de uitgaven voor publicaties en het voor campagnes benodigde extern personeel;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:31.d
    text: de organisatie van en deelname aan vakbeurzen en tentoonstellingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:31.e
    text: |-
      de aankoop of huur van advertentieruimte en het bedenken van slagzinnen en labels voor de duur van een
      promotiecampagne;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:31.f
    text: loonkosten en kosten voor eigen arbeid voor zover ze betrekking hebben op de uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:31.g
    text: kosten van een controleverklaring van een accountant, voor zover deze kosten niet meer bedragen dan € 2500,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel431
  - number: 4:32.1
    text: De subsidie bedraagt ten hoogste 100% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel432
  - number: 4:32.2
    text: De subsidie bedraagt ten hoogste € 250.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel432
  - number: 4:33
    text: De aanvraag tot subsidievaststelling gaat vergezeld van een controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433
  - number: 4:33a
    text: |-
      Als visserijgebieden als bedoeld in artikel 43 van verordening nr. 1198/2006, worden aangewezen de gebieden zoals
      opgenomen in [bijlage 5][ref1], onderdeel A, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433a
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 4:33b
    text: |-
      Als lokale groepen als bedoeld in artikel 45 van verordening nr. 1198/2006, worden aangewezen de groepen zoals
      opgenomen in [bijlage 5][ref1], onderdeel B, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433b
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 4:33c.1
    text: |-
      De Minister kan subsidie verstrekken ter stimulering van duurzame ontwikkeling en verbetering van de
      levenskwaliteit in visserijgebieden als bedoeld in [artikel 4:33a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4:33c.2
    text: |-
      Voor subsidie komen in aanmerking projecten die bijdragen aan de doelstelling, bedoeld in het eerste lid, en
      gericht zijn op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.2.a
    text: de versterking van het concurrentievermogen van een visserijgebied;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.2.b
    text: |-
      de herstructurering en heroriëntering van economische activiteiten, met name door stimulering van het ecotoerisme,
      mits deze activiteiten niet leiden tot een verhoging van de visserij-inspanning;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.2.c
    text: |-
      de diversificatie van activiteiten, door een gecombineerde beroepsactiviteit voor vissers te bevorderen, via het
      scheppen van extra werkgelegenheid buiten de visserijsector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.2.d
    text: het bieden van meerwaarde aan visserijproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.2.e
    text: |-
      de ondersteuning van infrastructuurvoorzieningen voor kleinschalige visserij en toerisme, alsmede van diensten ten
      voordele van kleine vissersgemeenschappen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.2.f
    text: |-
      de bescherming van het milieu in een visserijgebied zodat deze hun aantrekkelijkheid behoudt, het rehabiliteren
      en ontwikkelen van kustdorpjes en -dorpen met visserijactiviteiten, en de bescherming en verbetering van het
      natuurlijke en architecturale erfgoed.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33c.3
    text: |-
      Voor subsidie op grond van het tweede lid, onderdelen b en c, komen slechts in aanmerking aanvragers die werkzaam
      zijn in de visserijsector of een met deze sector verbonden beroep uitoefenen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433c
  - number: 4:33d.1
    text: |-
      De lokale groepen, bedoeld in [artikel 4:33b][ref1], worden aangewezen als beoordelingscommissies als bedoeld in
      [artikel 1:4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:33d.2
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4, eerste lid][ref1], op grond van een advies van de
      betreffende beoordelingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:33d.3
    text: |-
      De beoordelingscommissie rangschikt een project hoger naarmate het project beter aansluit bij de doelstellingen,
      bedoeld in [artikel 4:33c][ref1], en de doelstellingen, bedoeld in de betreffende ontwikkelingsstrategie als
      bedoeld in [bijlage 5][ref2], onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433d
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0021281
  - number: 4:33e
    text: |-
      In het projectplan, bedoeld in [artikel 1:9, tweede lid][ref1], wordt de geografische locatie opgenomen waarop het
      project zal worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433e
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:33f.1
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433f
  - number: 4:33f.2
    text: |-
      In afwijking van het eerste lid kan de Minister voor de uitvoering van het project een andere termijn dan drie
      jaar vaststellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433f
  - number: 4:33f.3
    text: |-
      De subsidieontvanger voert het project uit in het visserijgebied, bedoeld in de beschikking tot subsidieverlening,
      behoudens toestemming van de Minister tot gedeeltelijke uitvoering buiten dat visserijgebied.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433f
  - number: 4:33g
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.a
    text: loonkosten en kosten voor eigen arbeid voor zover ze betrekking hebben op de uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.b
    text: kosten van een controleverklaring van een accountant, voor zover deze kosten niet meer bedragen dan € 2500;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.c
    text: |-
      kosten verbonden aan ontwikkeling, aanschaf of het testen van nieuwe apparaten, diensten, technologieën of andere
      innovaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.d
    text: kosten verbonden aan de uitvoering van promotie, voorlichting of publicaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.e
    text: |-
      kosten voor organisatie en facilitering van een samenwerkingsverband, waaronder begrepen zaal- en locatiehuur,
      vergaderfaciliteiten en bureaukosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.f
    text: kosten voor de bouw, verwerving, verbetering of inrichting van onroerende goederen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33g.g
    text: |-
      algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met f, zoals kosten voor adviseurs,
      architecten of ingenieurs, tot een hoogte van 25% van de totale subsidiabele kosten en haalbaarheidsstudies,
      verwerven van patenten en vergunning.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433g
  - number: 4:33h
    text: |-
      Indien het in de beschikking tot subsidieverlening vermelde subsidiebedrag € 125.000 of meer bedraagt, kan in de
      beschikking tot subsidieverlening worden bepaald dat de aanvraag tot subsidievaststelling vergezeld gaat van een
      controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433h
  - number: 4:33i.1
    text: De subsidie bedraagt ten hoogste 60% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433i
  - number: 4:33i.2
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie ten hoogste 40% van de subsidiabele kosten van projecten als
      bedoeld in groep 2 en groep 4 van bijlage II bij verordening nr. 1198/2006.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433i
  - number: 4:33i.3
    text: De subsidie bedraagt ten hoogste € 300.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel433i
  - number: 4:34.1
    text: |-
      De Minister kan aan de eigenaar van een vissersvaartuig subsidie verstrekken voor het moderniseren van
      vissersvaartuigen en het aanbrengen van voorzieningen aan boord van vissersvaartuigen ter verbetering van de
      veiligheid aan boord, de arbeidsomstandigheden, de hygiëne, de productkwaliteit en met name energie-efficiëntie
      en selectiviteit.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel434
  - number: 4:34.2
    text: 'Aan een eigenaar van een vissersvaartuig wordt geen subsidie verstrekt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel434
  - number: 4:34.2.a
    text: indien het betrokken vissersvaartuig op het moment van het indienen van de aanvraag nog geen vijf jaar oud is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel434
  - number: 4:34.2.b
    text: |-
      indien de voorziening of modernisering waarvoor de subsidie wordt aangevraagd, naar het oordeel van de Minister zou
      leiden tot een toename van de vangstcapaciteit van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel434
  - number: 4:34.2.c
    text: voor de bouw van een vissersvaartuig en de vergroting van een visruim.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel434
  - number: 4:34.3
    text: |-
      Per vissersvaartuig wordt op grond van deze paragraaf gedurende de programmaperiode van het Europees
      visserijfonds 2007–2013 niet meer financiële steun toegekend dan een kwart van de nieuwwaarde van het betreffende
      vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel434
  - number: 4:35.1
    text: |-
      Investeringen ter verbetering van de selectiviteit van vistuigen, inclusief maximaal twee vervangingen van vistuig
      in de periode 2007–2013, zijn subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.1.a
    text: |-
      het betrokken vissersvaartuig in het bezit is van een speciaal visdocument voor een herstelplan als bedoeld in
      artikel 5 van verordening nr. 2371/2002 en de eigenaar met dat vaartuig na de aanvraag overschakelt op een andere
      visserijmethode en de visserij uitoefent op een andere doelsoort, waarvan de toestand van het bestand nog toelaat
      te vissen, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.1.b
    text: |-
      het nieuwe tuig selectiever is en beantwoordt aan de erkende milieucriteria en praktijken die verder reiken dan de
      bestaande wettelijke verplichtingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.2
    text: |-
      In afwijking van en onverminderd het eerste lid kan de Minister aan een aanvrager in de periode 2007 – 2013 eenmaal
      subsidie als bedoeld in [artikel 4:34][ref1] verlenen voor het vervangen van vistuig indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:35.2.a
    text: |-
      de subsidieontvanger overeenkomstig artikel 25, achtste lid, van verordening nr. 1198/2006 met het vervangen van
      het oude vistuig voldoet aan de nieuwe technische eisen inzake selectiviteit uit hoofde van het communautaire recht
      en deze eisen nog niet verplicht zijn gesteld of de Europese verordening waarin de eisen zijn opgenomen een periode
      bepaalt waarin subsidiëring is toegestaan, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.2.b
    text: |-
      de visserij met het nieuwe vistuig aantoonbaar minder effect heeft op niet-commerciële aquatische soorten dan
      visserij met het vervangen vistuig.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.3
    text: |-
      De Minister kan per vissersvaartuig in de periode 2007 – 2013 eenmaal subsidie als bedoeld in [artikel 4:34][ref1]
      verlenen voor het vervangen van de hoofdmotor, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:35.3.a
    text: het vaartuig een lengte van ten hoogste 24 meter heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.3.b
    text: het vaartuig bij de visserij gebruik maakt van gesleept vistuig, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:35.3.c
    text: de nieuwe motor ten minste 20% minder vermogen heeft dan het vermogen vermeld op de visvergunning.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel435
  - number: 4:36
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:37.1
    text: |-
      De subsidieontvanger draagt er zorg voor dat de activiteiten waarvoor de subsidie is verleend binnen twaalf maanden
      na de datum van subsidieverlening zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel437
  - number: 4:37.2
    text: De Minister kan een andere termijn dan de termijn, bedoeld in het eerste lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel437
  - number: 4:37.3
    text: |-
      De Minister kan, in afwijking van [artikel 1:2, aanhef en eerste lid][ref1], toestemming geven voor de uitvoering
      van het project buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:38
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel438
  - number: 4:38.a
    text: kosten voor de aanschaf van nieuwe apparatuur of nieuwe voorzieningen waarvan de aanvrager de eerste gebruiker is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel438
  - number: 4:38.b
    text: kosten voor de installatie van nieuwe apparatuur of voorzieningen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel438
  - number: 4:38.c
    text: |-
      kosten voor de aanpassing van het vissersvaartuig ten behoeve van de installatie van nieuwe apparatuur of het
      toepassen van nieuwe voorzieningen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel438
  - number: 4:38.d
    text: loonkosten en kosten voor eigen arbeid voor zover ze betrekking hebben op de uitvoering van het project.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel438
  - number: 4:39.1
    text: De subsidie bedraagt ten hoogste 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439
  - number: 4:39.2
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie voor activiteiten als bedoel in
      [artikel 4:35, derde lid][ref1], ten hoogste 20% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:39.3
    text: De subsidie bedraagt ten hoogste € 500.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439
  - number: 4:39a.1
    text: |-
      De Minister kan aan de eigenaar van een vissersvaartuig subsidie verstrekken voor de aanschaf en installatie
      aan boord van een vissersvaartuig met een lengte over alles van tenminste 12 meter van deiningsgecompenseerde
      elektronische weegapparatuur ten behoeve van de weging, bedoeld in artikel 60, derde lid, van verordening (EG)
      nr. 1224/2009 van de Raad van 20 november 2009 tot vaststelling van een communautaire controleregeling die de
      naleving van de regels van het gemeenschappelijk visserijbeleid moet garanderen (PBEU L 343).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439a
  - number: 4:39a.2
    text: 'Aan een eigenaar van een vissersvaartuig wordt slechts subsidie verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439a
  - number: 4:39a.2.a
    text: |-
      de elektronische weegapparatuur gekoppeld wordt aan een systeem van elektronische registratie- en meldapparatuur,
      bedoeld in artikel 15 van Verordening (EG) nr. 1224/2009 van de Raad van 20 november 2009 tot vaststelling van
      een communautaire controleregeling die de naleving van de regels van het gemeenschappelijk visserijbeleid moet
      garanderen (PBEU L 343);
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439a
  - number: 4:39a.2.b
    text: |-
      de elektronische weegapparatuur voldoet aan de voorschriften van richtlijn nr. 2009/23/EG van het Europees
      Parlement en de Raad van 23 april 2009 betreffende niet-automatische weegwerktuigen (PBEU L 122) voor een
      weegwerktuig van ten hoogste klasse IIII, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439a
  - number: 4:39a.2.c
    text: |-
      de aanschaf en installatie van de elektronische weegapparatuur aan boord van een vissersvaartuig plaatsvinden na
      1 juni 2011 doch uiterlijk 1 oktober 2012.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439a
  - number: 4:39a.3
    text: |-
      [Artikel 4:34, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439a
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:39b
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:39c
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van nota’s en betaalbewijzen van de aanschaf en installatie
      van de elektronische weegapparatuur en de koppeling daarvan aan het systeem van elektronische registratie- en
      meldapparatuur waarop de gemaakte kosten zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel439c
  - number: 4:39d
    text: |-
      De subsidieontvanger voert de activiteiten, bedoeld in [artikel 4:39a, eerste lid][ref1], uit uiterlijk op
