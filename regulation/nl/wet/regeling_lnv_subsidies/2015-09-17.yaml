        bwb_id: BWBR0010999
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0020748
        artikel: '11'
  - number: 3:2.1
    text: |-
      [Artikel 1:13, tweede lid, aanhef in samenhang met onderdeel b][ref1], is niet van toepassing op de ontvanger van
      een subsidie voor de uitvoering een project op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:2.2
    text: |-
      [Artikel 1:13, derde lid][ref1], is niet van toepassing op de ontvanger van een subsidie voor de uitvoering van een
      project op grond van [Titel 2a][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        hoofdstuk: '3'
  - number: 3:10a
    text: |-
      In deze titel wordt verstaan onder duurzaam voedsel: voedsel geproduceerd om te voorzien in de behoefte van de
      huidige generatie zonder dat daarbij de mogelijkheden van toekomstige generaties worden verminderd om in hun
      behoeften te voorzien.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310a
  - number: 3:10b.1
    text: |-
      De Minister kan aan stichtingen en verenigingen zonder winstoogmerk, of samenwerkingsverbanden daarvan, subsidie
      verstrekken voor de uitvoering van een project dat een geheel van afgebakende en eenmalige activiteiten vormt, en:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.1.a
    text: |-
      is gericht op het in de Nederlandse samenleving vergroten van de aandacht voor duurzaam voedsel of het draagvlak
      voor duurzaam voedsel, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.1.b
    text: |-
      aansluit op het beleid zoals beschreven in speerpunt 2 van de nota Duurzaam voedsel (Kamerstukken II 2008/2009, 31
      532, nr.18).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.2
    text: |-
      Voor subsidie komen in ieder geval in aanmerking projecten die op doelmatige wijze bijdragen aan de doelstelling
      van het eerste lid door:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.2.a
    text: |-
      het vergroten van kennis van duurzaam voedsel door het ontwikkelen van modelprogramma’s en bijbehorende trainingen
      voor intermediairs en leerkrachten, voor gebruik bij binnen- en buitenschoolse educatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.2.b
    text: |-
      het vergroten van kennis van duurzaam voedsel bij groepen in de samenleving die een bijdrage kunnen leveren aan de
      realisering van de doelstellingen uit de nota Duurzaam voedsel, door het geven van voorlichting of het ontwikkelen
      van voorlichtingsmateriaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.2.c
    text: |-
      het vergroten van de aandacht voor duurzaam voedsel door het ontwikkelen van een visie op het belang van duurzaam
      voedsel, het inbrengen van deze visie in overlegsituaties en het vragen van de publieke aandacht voor deze visie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.2.d
    text: |-
      het verhogen van de organisatiegraad en verbeteren van onderlinge contacten door het stimuleren van samenwerking
      tussen organisaties op het gebied van duurzaam voedsel en het bevorderen van informatie-uitwisseling tussen die
      organisaties.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3
    text: 'Geen subsidie wordt verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3.a
    text: het project niet uitsluitend een publieksgericht of openbaar karaker heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3.b
    text: het project een looptijd heeft van meer dan één jaar;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3.c
    text: de subsidiabele kosten in totaal minder bedragen dan € 15.000;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3.d
    text: |-
      de subsidie geheel of gedeeltelijk ten goede komt aan instellingen of instanties die opereren met winstoogmerk of
      aan ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3.e
    text: |-
      het project tevens wordt bekostigd door instellingen of instanties die opereren met winstoogmerk of door
      ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10b.3.f
    text: |-
      het project geheel of gedeeltelijk uit andere hoofde op grond van deze regeling kan worden gesubsidieerd, ongeacht
      of de mogelijkheid tot het doen van een aanvraag tot subsidieverlening is opengesteld.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310b
  - number: 3:10c
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      aanvraag betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:10c.a
    text: |-
      doelmatiger kan worden uitgevoerd als gevolg van de kennis, de kunde, de capaciteit, het netwerk en het
      maatschappelijk draagvlak van de uitvoerende organisatie of organisaties;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310c
  - number: 3:10c.b
    text: meer aansluit bij het beleid zoals beschreven in speerpunt 2 van de nota Duurzaam voedsel.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310c
  - number: 3:10d
    text: |-
      De subsidieontvanger vangt het project waarvoor de subsidie is verleend aan binnen één jaar na de datum van
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310d
  - number: 3:10e
    text: |-
      Een beschikking omtrent subsidievaststelling wordt gegeven binnen vier maanden na ontvangst van de aanvraag tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310e
  - number: 3:10f
    text: 'De volgende kosten komen in aanmerking voor subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.a
    text: loonkosten van het direct bij de uitvoering van het project betrokken personeel in dienst van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.b
    text: kosten van verbruikte materialen of hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.c
    text: |-
      kosten van vrijwilligers, voor zover deze een vrijwilligersvergoeding ontvangen, per kalenderjaar tot ten hoogste
      het bedrag dat jaarlijks belastingvrij als vrijwilligersvergoeding kan worden verstrekt, met dien verstande dat het
      maximum evenredig wordt aangepast indien een vrijwilliger dat kalenderjaar niet volledig werkzaam is geweest;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.d
    text: |-
      aan derden verschuldigde kosten ter zake van planvormings- en uitvoeringsactiviteiten tot ten hoogste 35% van de in
      de onderdelen a, b en c genoemde kosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.e
    text: reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.f
    text: |-
      kosten voor overhead tot ten hoogste een bedrag dat gelijk is aan 10% van de ingevolge onderdeel a voor subsidie in
      aanmerking komende loonkosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10f.g
    text: |-
      kosten als bedoeld in de onderdelen b tot en met e die onvoorzien zijn, tot ten hoogste 15% van het bedrag dat wel
      is voorzien.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310f
  - number: 3:10g.1
    text: De subsidie bedraagt ten hoogste € 75.000.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310g
  - number: 3:10g.2
    text: |-
      Een voorschot van ten hoogtse 40% van het subsidiebedrag wordt uitsluitend verleend indien het project binnen 3
      maanden na subsidieverlening van start gaat.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel310g
  - number: 3:34
    text: |-
      De Minister kan op aanvraag aan de IVN Vereniging voor natuur- en milieueducatie, statutair gevestigd te Amsterdam,
      subsidie verstrekken voor projecten gericht op kwaliteitsverbetering, samenwerking, educatie, voorlichting en
      onderzoek van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel334
  - number: 3:34.a
    text: een door de Minister aangewezen nationaal park dan wel nationaal park in oprichting,
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel334
  - number: 3:34.b
    text: |-
      een door het Rijk gezamenlijk met het Koninkrijk België of de Bondsrepubliek Duitsland als grensoverschrijdende
      park aangewezen of aan te wijzen gebied, waarvoor afspraken gelden met betrekking tot het beheer en de inrichting
      daarvan, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel334
  - number: 3:34.c
    text: het particuliere nationale park De Hoge Veluwe of Veluwezoom.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel334
  - number: 3:35.1
    text: |-
      In afwijking van de [artikelen 1:8, eerste lid][ref1], en [1:13, vijfde lid][ref2], wordt de aanvraag tot
      subsidieverlening of subsidievaststelling, onderscheidenlijk tot goedkeuring als bedoeld in artikel 1:13, derde
      lid, ingediend bij de Directeur Natuur, Landschap en Platteland van het Ministerie van Economische Zaken, Landbouw
      en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:35.2
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling ingediend voor 31
      december van het kalenderjaar volgend op het jaar waarvoor de subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:36
    text: |-
      In afwijking van [artikel 1:10, eerste lid][ref1], wordt een beschikking omtrent subsidieverlening gegeven voor 15
      februari van het jaar waarin het project wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel336
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:37
    text: |-
      [Artikel 1:13, tweede lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel337
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:39.1
    text: |-
      De Minister betaalt subsidiebedragen en voorschotten aan de IVN Vereniging voor natuur- en milieueducatie via het
      Groenfonds.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel339
  - number: 3:39.2
    text: |-
      In afwijking van [artikel 1:17, tweede lid][ref1], kan de Minister aan de Stichting Samenwerkingsverband Nationale
      Parken voorschotten verlenen tot ten hoogste 95% van het te verstrekken subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel339
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:51.1
    text: |-
      De Minister kan subsidie verstrekken aan de Unie van Bosgroepen voor projecten die een bijdrage leveren aan
      rendementsverbetering binnen de bos- en natuursector alsmede aan verbetering van de kwaliteit van het bos en de
      natuur.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
  - number: 3:51.2
    text: 'De volgende activiteiten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
  - number: 3:51.2.a
    text: |-
      het verbeteren van de advisering en opleiding aan bos- en natuureigenaren met een bezit kleiner dan 250 hectare
      over het beheer van bos- en natuurterreinen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
  - number: 3:51.2.b
    text: het verzamelen van natuurgegevens;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
  - number: 3:51.2.c
    text: 'het opstellen van aanvragen tot verlening van een subsidie als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
  - number: 3:51.2.c.a
    text: |-
      [artikel 20a van de Subsidieregeling natuurbeheer 2000][ref1], zoals die luidde tot 1 januari 2007, of


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: 20a
  - number: 3:51.2.c.b
    text: |-
      een met de subsidie, bedoeld onder 1, overeenkomende subsidie die door provinciale staten kan worden verstrekt op
      grond van een ingevolge [artikel 11, derde lid, van de Wet inrichting landelijk gebied][ref1] door hen vastgestelde
      verordening, of


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel11
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '11'
  - number: 3:51.2.c.c
    text: |-
      [artikel 3:11][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel351
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '3'
        hoofdstuk: '3'
  - number: 3:52
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel352
  - number: 3:52.a
    text: loonkosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel352
  - number: 3:52.b
    text: aan derden verschuldigde kosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel352
  - number: 3:52.c
    text: en kosten van de voor de subsidievaststelling benodigde controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel352
  - number: 3:53.1
    text: |-
      De Minister kan aan het Kenniscentrum Recreatie subsidie verstrekken voor de uitvoering van programma’s die een
      bijdrage leveren aan de bevordering van kennis en deskundigheid op het gebied van de recreatie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel353
  - number: 3:53.2
    text: De programma’s hebben betrekking op een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel353
  - number: 3:54
    text: |-
      In afwijking van [artikel 1:8, eerste lid][ref1], wordt de aanvraag tot subsidieverlening of subsidievaststelling
      ingediend bij de Directeur Natuur, Landschap en Platteland van het Ministerie van Economische Zaken, Landbouw en
      Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel354
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:55.1
    text: Een aanvraag tot subsidieverlening gaat vergezeld van een werkprogramma.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel355
  - number: 3:55.2
    text: 'Het werkprogramma bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel355
  - number: 3:55.2.a
    text: |-
      een beschrijving van de werkzaamheden en activiteiten van de instelling voor het kalenderjaar waarop de aanvraag
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel355
  - number: 3:55.2.b
    text: een beschrijving van de financiële gevolgen van de werkzaamheden en de activiteiten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel355
  - number: 3:55.2.c
    text: een meerjarenperspectief;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel355
  - number: 3:55.2.d
    text: een plan voor de uitvoering van een evaluatie waarin wordt aangegeven in hoeverre de beoogde doelen bereikt zijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel355
  - number: 3:56
    text: |-
      In afwijking van [artikel 1:10, eerste lid][ref1], wordt een beschikking omtrent subsidieverlening gegeven binnen
      drie maanden na afloop van de periode voor het aanvragen van subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel356
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:57
    text: |-
      De subsidieontvanger voert het programma uit overeenkomstig het werkprogramma waarop de beschikking tot
      subsidieverlening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel357
  - number: 3:58
    text: 'De aanvraag tot vaststelling van de subsidie gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel358
  - number: 3:58.a
    text: een financiële verantwoording van het programma;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel358
  - number: 3:58.b
    text: de eindrapportage van het programma.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel358
  - number: 3:59
    text: |-
      Een beschikking omtrent subsidievaststelling wordt gegeven binnen vier maanden na ontvangst van de aanvraag tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel359
  - number: 3:60.1
    text: |-
      In afwijking van [artikel 1:17, tweede lid][ref1], kan de Minister voorschotten verlenen tot ten hoogste 95% van
      het te verstrekken subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel360
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:60.2
    text: |-
      De aanvraag tot subsidieverlening gaat in verband met het vaststellen van een voorschot vergezeld van de
      liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel360
  - number: 3:61
    text: |-
      De Minister kan aan de Stichting Zeldzame Huisdieren subsidie verstrekken voor de begeleiding van stamboek-, ras-
      en fokverenigingen:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel361
  - number: 3:61.a
    text: bij het opstellen van strategische meerjarenplannen en van project- en subsidieaanvragen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel361
  - number: 3:61.b
    text: |-
      bij het bevorderen van de relaties met regionale en landelijke organisaties met (potentiële) interesse voor de
      instandhouding van zeldzame landbouwhuisdierenrassen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel361
  - number: 3:62
    text: |-
      In afwijking van [artikel 1:8, eerste lid][ref1], wordt de aanvraag tot subsidieverlening ingediend bij de
      Directeur Agroketens en Visserij van het Ministerie van Economische Zaken, Landbouw en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel362
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:63.1
    text: Een aanvraag tot subsidieverlening gaat vergezeld van een werkprogramma.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel363
  - number: 3:63.2
    text: 'Het werkprogramma bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel363
  - number: 3:63.2.a
    text: |-
      een beschrijving van de werkzaamheden en activiteiten van de instelling voor het kalenderjaar waarop de aanvraag
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel363
  - number: 3:63.2.b
    text: een beschrijving van de financiële gevolgen van de werkzaamheden en de activiteiten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel363
  - number: 3:63.2.c
    text: een meerjarenperspectief; en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel363
  - number: 3:63.2.d
    text: een plan voor de uitvoering van een evaluatie waarin wordt aangegeven in hoeverre de beoogde doelen bereikt zijn.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel363
  - number: 3:64
    text: 'Een aanvraag tot vaststelling van de subsidie gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel364
  - number: 3:64.a
    text: een financiële verantwoording van het programma;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel364
  - number: 3:64.b
    text: de eindrapportage van het programma.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel364
  - number: 3:65
    text: |-
      Een beschikking omtrent subsidievaststelling wordt gegeven binnen vier maanden na ontvangst van de aanvraag tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel365
  - number: 3:66
    text: |-
      In deze titel wordt verstaan onder: - *kennisinstelling:* 1° een onder a, b, c, g of h van de [bijlage van de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs, 2°
      een andere dan onder 1° bedoelde geheel of gedeeltelijk door de rijksoverheid gefinancierde onderzoeksorganisatie
      die activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit te breiden, 3° een
      geheel of gedeeltelijk door een andere staat gefinancierde openbare instelling voor hoger onderwijs gelijkwaardig
      aan een instelling als bedoeld onder 1°, of 4° een geheel of gedeeltelijk door een andere staat gefinancierde
      onderzoeksinstelling die activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit
      te breiden;
        - *Mitigatieladder:* bedrijfsstrategie voor No Net Loss in vier stappen: eerst kijken naar de mogelijkheden om
      negatieve impacts te vermijden, dan naar de mogelijkheden om negatieve impacts te verminderen, vervolgens naar
      de mogelijkheden reeds opgetreden schade te herstellen en daarna als sluitstuk de resterende negatieve impacts
      compenseren.
        - *No Net Loss:* activiteiten van een onderneming hebben bij elkaar opgeteld geen negatieve gevolgen voor de
      biodiversiteit en de daarmee verbonden ecosysteemdiensten;
        - *non-gouvernementele organisatie:* organisatie, niet zijnde een onderneming, die onafhankelijk is van de overheid
      en zich richt op natuur-, milieu of ontwikkelingssamenwerking;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent, niet zijnde een landbouwonderneming, een onderneming behorend tot visserijsector, een onderneming die
      zich richt op recreatieve natuurbeleving, of een onderneming die zich richt op het beheren van een terrein dat
      bestemd is als natuurgebied;
        - *penvoerder:* door het samenwerkingsverband aangewezen onderneming die als gemachtigde van het
      samenwerkingsverband optreedt;
        - *project:* project a of project b;
        - *project a:* een samenhangend geheel van activiteiten gericht op het incorporeren van No Net Loss in de strategie
      en de bedrijfsvoering van een onderneming of een samenwerkingsverband;
        - *project b:* een samenhangend geheel van technologische innovatieve activiteiten van een onderneming of
      een samenwerkingsverband in combinatie met een afnemer in de keten, al dan niet deelnemer zijnde van het
      samenwerkingsverband, waarbij deze afnemer actief betrokken is bij de activiteiten en de intentie heeft om
      de technologische innovatie toe te passen, gericht op het incorporeren van No Net Loss in de strategie en de
      bedrijfsvoering van een onderneming of een samenwerkingsverband en een afnemer;
        - *samenwerkingsverband:* een geen rechtspersoonlijkheid bezittend verband tussen twee of meer ondernemingen die
      gezamenlijk een project uitvoeren;
        - *verordening (EG) Nr. 1998/2006:* verordening (EG) nr. 1998/2006 van de Commissie van 15 december 2006
      betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU 2006 L 379).
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel366
  - number: 3:67.1
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan een onderneming of een samenwerkingsverband die een project
      uitvoert.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel367
  - number: 3:67.2
    text: |-
      Binnen de projectperiode dient de verandering in de strategie en de bedrijfsvoering doorgevoerd te worden. De
      overall impact op biodiversiteit en ecosystemen hoeft niet binnen de projectperiode behaald te worden, echter
      aannemelijk dient te worden gemaakt dat de beoogde veranderingen in de strategie en de bedrijfsvoering wel leiden
      tot deze impact.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel367
  - number: 3:67.3
    text: |-
      Bij een project van een onderneming of een samenwerkingsverband wordt ten minste een non-gouvernementele
      organisatie of een kennisinstelling als externe partij betrokken.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel367
  - number: 3:67.4
    text: |-
      In afwijking van [artikel 1:2, eerste lid, aanhef][ref1], kan ook subsidie worden verstrekt voor activiteiten
      buiten Nederland, indien die gericht zijn op behoud en herstel van biodiversiteit en ecosystemen ter plaatse en
      worden uitgevoerd ten behoeve van het incorporeren van No Net Loss in de bedrijfsvoering en bedrijfsprocessen van
      een in Nederland gevestigde onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel367
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:68.1
    text: |-
      De subsidie bedraagt maximaal 50% van de subsidiabele projectkosten tot een maximum van € 500.000,– per project
      waarbinnen een maximum geldt van € 200.000 per deelnemende onderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel368
  - number: 3:68.2
    text: |-
      Geen subsidie wordt verstrekt, voor zover daardoor het voor de onderneming geldende maximum de-minimissteunbedrag
      genoemd in artikel 2 van verordening (EG) Nr. 1998/2006 wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel368
  - number: 3:68.3
    text: |-
      In geval van een samenwerkingsverband wordt het subsidiepercentage van 50% toegepast op de subsidiabele
      projectkosten van elk van de ondernemingen in het samenwerkingsverband afzonderlijk tot het maximum per onderneming
      en per project.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel368
  - number: 3:68.4
    text: |-
      Indien de totale subsidiabele projectkosten voor de deelnemers van een samenwerkingsverband voor de uitvoering
      van een project meer bedraagt dan € 1.000.000,–, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken ondernemingen te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel368
  - number: 3:69.1
    text: |-
      In aanvulling op, onderscheidenlijk in afwijking van [artikel 1:15][ref1] zijn de subsidiabele kosten van een
      project de volgende rechtstreeks aan de uitvoering van het project toe te rekenen kosten, gemaakt na indiening van
      de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:69.1.a
    text: |-
      kosten van direct bij het project betrokken personeel, waarvoor geldt het aantal uren vermenigvuldigd met het vaste
      uurtarief van € 60,–;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.1.b
    text: kosten van verbruikte materialen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.1.c
    text: |-
      kosten voor opleiding, kosten van een onderneming niet zijnde een kennisinstelling die deskundig advies geeft
      binnen een bepaald kennisgebied en de afschrijvingskosten voor de speciaal voor het project aangeschafte apparatuur
      lineair berekend als fractie van de aanschafprijs op basis van bedrijfseconomische grondslagen en normen met een
      afschrijvingstermijn van vijf jaar, gezamenlijk tot een maximum van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.1.c.1
    text: 40% van de totale subsidiabele projectkosten in geval van een project a;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.1.c.2
    text: 60% van de totale subsidiabele projectkosten in geval van een project b;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.1.d
    text: |-
      kosten voor het verzamelen van informatie over de herkomst van grondstoffen of over de impact via de keten, voor
      zover deze kosten gezamenlijk minder dan 50% van de totale subsidiabele projectkosten uitmaken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.1.e
    text: door derden gemaakte kosten anders dan de kosten genoemd bij onderdeel c en d.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.2
    text: |-
      In aanvulling op, onderscheidenlijk in afwijking van [artikel 1:15][ref1] zijn de volgende kosten niet-subsidiabel:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:69.2.a
    text: |-
      kosten voor het nemen van voor de onderneming of deelnemers van het samenwerkingsverband wettelijk verplichte
      maatregelen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.2.b
    text: kosten voor de verwerving van de subsidie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:69.2.c
    text: kosten voor reizen binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel369
  - number: 3:70
    text: 'Geen subsidie wordt verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.a
    text: de aanvraag niet voldoet aan het bepaalde in deze titel;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.b
    text: het project uit activiteiten bestaat die reeds gangbaar zijn in de onderneming of de eigen sector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.c
    text: de subsidiabele projectkosten minder bedragen dan € 200.000,–;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.d
    text: 'een project in hoofdzaak of uitsluitend gericht is op:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.d.1°
    text: de ontwikkeling van nieuwe meetmethoden, meetinstrumenten of certificering;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.d.2°
    text: |-
      theoretische kennisontwikkeling dan wel de ontwikkeling van kennis binnen de projectperiode zonder dat er
      activiteiten worden uitgevoerd binnen het project die leiden tot een positieve impact op biodiversiteit;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.d.3°
    text: duurzame energie of emissie van broeikasgassen die geen directe impact hebben op biodiversiteit en ecosystemen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.d.4°
    text: |-
      het saneren van milieuverontreinigende situaties, tenzij dat noodzakelijk is voor en substantieel bijdraagt aan het
      doel van het project;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.d.5°
    text: |-
      bewustwording dan wel attitudeverandering ten aanzien van maatschappelijk verantwoord ondernemen dan wel gedrag
      binnen of buiten de onderneming;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.e
    text: een project geheel dan wel ten dele wordt uitgevoerd na 31 december 2016;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.f
    text: de minister onvoldoende vertrouwen heeft dat het project economisch, technisch of organisatorisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:70.g
    text: |-
      de score van het project, op een of meer van de in [artikel 3:71, eerste lid][ref1], genoemde criteria minder dan
      60% van de te behalen punten is;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '3'
        hoofdstuk: '3'
  - number: 3:70.h
    text: |-
      indien een onderneming of deelnemers van het samenwerkingsverband op grond van verordening (EG) nr. 1998/2006 geen
      steun mag of mogen ontvangen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel370
  - number: 3:71.1
    text: |-
      In aanvulling op [artikel 1:4][ref1] rangschikt de Minister, afzonderlijk voor de projecten a en de projecten b, de
      aanvragen waarop niet afwijzend is beslist, hoger naarmate er hoger gescoord wordt op de volgende criteria met de
      daarbij aangegeven punten en weegfactoren:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:71.1.a
    text: 'de organisatie van het project en de kwaliteit van het projectvoorstel, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.a.1°
    text: |-
      de organisatie van het project en de kwaliteit van het projectvoorstel wat het gehalte van de koppeling betreft
      tussen doelen, resultaten en activiteiten, maximaal 5 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.a.2
    text: |-
      de specificiteit, meetbaarheid, acceptatie, resultaatgerichtheid en tijdsgebondenheid van de resultaten, maximaal
      5 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.a.3°
    text: |-
      de mate waarin de projectleiding het project effectief kan aansturen, gelet op kennis en beslissingsbevoegdheid bij
      de onderneming of penvoerder, maximaal 2 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.a.4°
    text: de mate waarin deelnemers aan het project elkaar aanvullen danwel versterken, maximaal 4 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.a.5°
    text: |-
      de effectiviteit en efficiëntie van de in te zetten middelen in relatie tot het gestelde doel van het project,
      maximaal 4 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.b
    text: 'de realisatie van No Net Loss, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.b.1°
    text: |-
      de mate waarin een substantiële bijdrage wordt geleverd aan het stoppen van biodiversiteitsverlies door
      aanpassingen in de bedrijfsvoering en bedrijfsstrategie van: - indien de aanvraag een project a betreft: de
      onderneming of in geval van een samenwerkingsverband, alle ondernemingen van het samenwerkingsverband, maximaal 20
      punten, of
        - indien de aanvraag een project b betreft: de onderneming en de afnemer of in geval van een samenwerkingsverband,
      alle ondernemingen van het samenwerkingsverband en de afnemer, maximaal 20 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.b.2°
    text: |-
      de mate waarin een methodische aanpak volgens de mitigatieladder inclusief eventuele compensatie voor No Net Loss
      wordt gevolgd, maximaal 10 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.b.3°
    text: |-
      de mate en wijze van het monitoren van de aanpassingen in de strategie en de bedrijfsvoering en van de verwachte
      impact van maatregelen op drukfactoren, biodiversiteit en ecosystemen, maximaal 10 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.c
    text: |-
      de kwaliteit van de risicoanalyse in verband met de levensvatbaarheid en continuïteit van de aanpassingen in
      bedrijfsvoering of -strategie na afloop van het project, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.c.1°
    text: |-
      aansluiting van het project bij de lopende bedrijfsvoering of bedrijfsstrategie van: - indien de aanvraag
      een project a betreft: de onderneming of in geval van een samenwerkingsverband, alle ondernemingen van het
      samenwerkingsverband, maximaal 6 punten, of
        - indien de aanvraag een project b betreft: de onderneming en de afnemer of in geval van een samenwerkingsverband,
      het samenwerkingsverband en de afnemer, maximaal 6 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.c.2°
    text: |-
      de mate waarin aannemelijk wordt gemaakt dat de voorgestelde activiteit structureel in de strategie en
      bedrijfsvoering wordt opgenomen, maximaal 8 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.c.3°
    text: de mate van technische en economische haalbaarheid van het project, maximaal 6 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.d
    text: 'spin-off, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.d.1°
    text: |-
      vergroting van kennis en draagvlak bij de onderneming, alle ondernemingen van een samenwerkingsverband, indien de
      aanvraag project b betreft tevens de afnemer, en belangrijke partijen in de keten en daarbuiten, maximaal 8 punten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.1.d.2°
    text: |-
      de potentie van het project om na afloop door te groeien binnen de eigen sector of binnen de keten en ook
      daarbuiten toepasbaar te zijn, maximaal 12 punten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:71.2
    text: |-
      Bij meerdere soortgelijke projecten wordt geen subsidie verleend aan een project dat lager scoort, tenzij het
      betrokken project het hoogst scorende project versterkt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel371
  - number: 3:72.1
    text: |-
      De subsidieontvanger maakt, behoudens bedrijfsgevoelige informatie, de kennis en informatie die met het project
      worden opgedaan onmiddellijk na afloop van het project openbaar in een kwalitatief voldoende verslag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel372
  - number: 3:72.2
    text: |-
      De Minister kan de subsidieontvanger aanvullende verplichtingen opleggen omtrent de wijze waarop de
      openbaarmaking, bedoeld in het eerste lid, plaatsvindt, de vormen van kennisverspreiding en de evaluatie van de
      subsidieverstrekking.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel372
  - number: 3:73.1
    text: |-
      De aanvraag tot subsidieverlening of subsidievaststelling, onderscheidenlijk tot goedkeuring als bedoeld in
      [artikel 1:13, derde lid][ref1], wordt ingediend bij de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel373
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:73.2
    text: |-
      De aanvraag tot subsidieverlening gaat, in afwijking van [artikel 1:9][ref1], vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel373
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 3:73.2.a
    text: een projectplan, waarvan het model bij Agentschap NL verkrijgbaar is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel373
  - number: 3:73.2.b
    text: |-
      een ingevulde verklaring betreffende verordening (EG) Nr. 1998/2006 van de onderneming en indien sprake is van
      een samenwerkingsverband van alle deelnemers van het samenwerkingsverband, waarvan het model bij Agentschap NL
      verkrijgbaar is;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel373
  - number: 3:73.2.c
    text: andere in het in het eerste lid bedoelde formulier genoemde gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel373
  - number: 3:73.3
    text: |-
      Indien ondernemingen samenwerken in een samenwerkingsverband, dienen zij hun aanvraag in via een penvoerder, met
      daarbij gevoegd een verklaring van de deelnemers van het samenwerkingsverband waarin een penvoerder is aangewezen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel373
  - number: 3:74.1
    text: |-
      De Minister kan aan de eigenaar van een gescheperde schaapskudde een subsidie voor de exploitatie van de
      schaapskudde verstrekken gericht op de instandhouding van zeldzame schapenrassen en het behoud van gescheperde
      schaapskuddes als Nederlands cultuurhistorisch erfgoed.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel374
  - number: 3:74.2
    text: |-
      Voor een subsidie als bedoeld in het eerste lid komen uitsluitend gescheperde schaapskuddes in aanmerking die
      bestaan uit 100 of meer ooien van een zeldzaam schapenras.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel374
  - number: 3:74.3
    text: |-
      De Minister kan besluiten om de subsidie, bedoeld in het eerste lid, te verlenen voor een gescheperde kudde,
      bestaande uit minder dan 100 en ten minste 50 ooien van een zeldzaam schapenras, indien de aanvrager aannemelijk
      kan maken dat de kudde in 2015 uit meer dan 100 ooien van een zeldzaam schapenras zal bestaan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel374
  - number: 3:75.1
    text: |-
      [Artikel 1:9, eerste lid][ref1], is van toepassing op aanvragen voor een subsidie als bedoeld in
      [artikel 3:74][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel375
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '3'
        hoofdstuk: '3'
  - number: 3:75.2
    text: 'Een aanvraag gaat vergezeld van een begrazingsplan, waarin de aanvrager in ieder geval vermeldt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel375
  - number: 3:75.2.a
    text: het aantal en het ras van de schapen in de kudde;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel375
  - number: 3:75.2.b
    text: de route waarlangs en de periode waarbinnen de kudde in 2012 rondtrekt;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel375
  - number: 3:75.2.c
    text: de naam van de beheerder van de terreinen waar de kudde graast in de periode, genoemd onder b.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel375
  - number: 3:75.3
    text: |-
      De Minister neemt de beschikking tot subsidieverlening niet dan onder de opschortende voorwaarde dat de Europese
      Commissie van de Europese Unie expliciet goedkeuring heeft verleend aan de verlening van de subsidie, bedoeld in
      [artikel 3:74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel375
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '3'
        hoofdstuk: '3'
  - number: 3:76
    text: De subsidieontvanger draagt zorg voor de uitvoering van het begrazingsplan.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel376
  - number: 3:77.1
    text: |-
      De Minister stelt de subsidie ambtshalve vast nadat de Europese Commissie van de Europese Unie expliciet
      goedkeuring heeft verleend aan de verlening van de subsidie, bedoeld in [3:74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel3
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel377
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '3'
        hoofdstuk: '3'
  - number: 3:77.2
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel377
  - number: 3:77.2.a
    text: 'Voor kuddes met ten hoogste 250 ooien: € 18.000;'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel377
  - number: 3:77.2.b
    text: 'Voor kuddes met 250 ooien of meer: € 28.000.'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel377
  - number: 3:77.3
    text: |-
      Het bedrag van uit andere hoofde verleende subsidies voor de instandhouding van de kudde wordt in mindering
      gebracht op het subsidiebedrag, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel377
  - number: 3:77.4
    text: |-
      De bedragen, bedoeld in het derde lid, worden evenredig verlaagd voor alle voor de subsidie in aanmerking te nemen
      aanvragen, indien het totaal van de goedgekeurde aanvragen het steunplafond overstijgt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel377
  - number: 4:1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - verordening nr. 1198/2006: Verordening (EG) nr. 1198/2006 van de Raad van
      27 juli 2006 inzake het Europese Visserijfonds (PbEU L 223);
        - verordening nr. 510/2006: Verordening (EG) nr. 510/2006 van de Raad van 20 maart 2006 inzake de bescherming van
      geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU L 93);
        - verordening nr. 498/2007: Verordening (EG) nr. 498/2007 van de Commissie van 26 maart 2007 tot vaststelling
      van uitvoeringsbepalingen van Verordening (EG) nr. 1198/2006 van de Raad inzake het Europees Visserijfonds (PbEU
      L 120);
        - verordening nr. 736/2008: Verordening (EG) nr. 736/2008 van de Commissie van 22 juli 2008 betreffende de
      toepassing van de artikelen 87 en 88 van het Verdrag op staatssteun voor kleine en middelgrote ondernemingen die
      visserijproducten produceren, verwerken en afzetten (PbEU L 201);
        - verordening nr. 1077/2008: Verordening (EG) nr. 1077/2008 van de Commissie van de Europese Gemeenschappen van 3
      november 2008 tot vaststelling van toepassingsbepalingen voor Verordening (EG) 06/1966 van de Raad betreffende de
      elektronische registratie en melding van visserijactiviteiten en een systeem voor teledetectie en tot intrekking
      van Verordening (EG) nr. 07/1566;
        - Besluit: [Besluit registratie vissersvaartuigen 1998][ref1];
        - kleine, middelgrote en micro-ondernemingen: kleine, middelgrote en micro-onderneming in de zin van Aanbeveling
      2003/361/EG van de Commissie van 6 mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen
      (PbEU L 124);
        - visserijonderneming: onderneming die actief is binnen de visserijsector;
        - visser: natuurlijk persoon die zijn hoofdberoep uitoefent aan boord van een in bedrijf zijnd vissersvaartuig;
        - vissersvaartuig: vaartuig dat gebruikt wordt voor de uitoefening van de bedrijfsmatige visserij, dat
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref2] als Nederlands geldt en
      dat overeenkomstig het bij of krachtens het besluit bepaalde staat geregistreerd;
        - binnenvisserij: visserij voor commerciële doeleinden met vaartuigen die uitsluitend actief zijn in de
      binnenwateren en die niet in het communautaire register van vissersvaartuigen zijn opgenomen;
        - aquacultuur: de kweek of teelt van aquatische organismen, waarbij technieken worden gebruikt om de aangroei van
      de betrokken organismen te verhogen tot boven de natuurlijke capaciteiten van het milieu;
        - gangbare praktijk in de aquacultuursector: aquacultuuractiviteiten die worden uitgevoerd overeenkomstig de
      bindende gezondheids-, veterinaire of milieuwetgeving;
        - visvergunning: aan een ondernemer ten aanzien van een vissersvaartuig toegekende visvergunning als bedoeld in
      [artikel 1, eerste lid, van de Uitvoeringsregeling zeevisserij][ref3];
        - garnalenvergunning: vergunning als bedoeld in
      [artikel 11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref4] verleend voor het vissen
      met enig vistuig geschikt voor het vangen van garnalen (Crangon, crangon) in de visserijzone, het zeegebied of
      de kustwateren;
        - contingent: contingent als bedoeld in [artikel 1, eerste lid, van de Uitvoeringsregeling zeevisserij][ref5];
        - meetbrief: document als bedoeld in [artikel 4 van de Meetbrievenwet 1981][ref6];
        - brutoton: maat ter bepaling van de scheepsinhoud overeenkomstig bijlage I van het op 23 juni 1969 te Londen tot
      stand gekomen Internationaal Verdrag betreffende de meting van schepen (Trb. 1970, 122 en 194);
        - innovatieproject: project dat een samenhangend geheel van activiteiten vormt, welke zijn gericht op het verwerven
      en verspreiden van nieuwe technische kennis die wordt verkregen door: a. het ontwikkelen van een innoverende
      technologie en het onder realistische omstandigheden in de productiesector testen van de technische en economische
      levensvatbaarheid van deze technologie; b. testen uit te voeren in verband met beheersplannen en plannen voor het
      toewijzen van visserij-inspanningen, waaronder desnoods het sluiten van gebieden voor de visserij om de biologische
      en financiële gevolgen te kunnen evalueren, en het experimenteel uitzetten van vis; c. methoden te ontwikkelen en
      te testen om de selectiviteit van het vistuig te verbeteren of om de bijvangsten, de overboord gezette hoeveelheden
      of de gevolgen voor het milieu te beperken, of d. alternatieve soorten visserijbeheerstechnieken te testen;
        - Visserij Innovatie Platform: door de Minister van LNV ingesteld platform dat adviseert over kansrijke innovaties
      in de visserij, zoals meegedeeld bij brief aan de Tweede Kamer van 27 juni 2006 (Kamerstukken II 2005-06, 29675,
      nr. 19);
        - experimentele visserij; het gebruik van vistuig en andere apparatuur voor de detectie van vis om vast te stellen
      welke vissoorten in welke hoeveelheden aanwezig zijn, teneinde een indruk te krijgen van de omvang van de bestanden
      in dat gebied en van de economische perspectieven van commerciële exploitatie van deze bestanden;
        - maatschappelijke organisatie: rechtspersoon zonder winstoogmerk, niet zijnde een overheidsorganisatie of
      onderneming in Europeesrechtelijke zin;
        - ondernemer: natuurlijk persoon of rechtspersoon te wiens naam het vissersvaartuig in het visserijregister staat
      geregistreerd; - vissoorten: alle soorten van vis, schaal-, schelp- en weekdieren;
        - aanlandplicht: verplichting tot het aanlanden van alle vangsten, zoals voorzien in artikel 15 van het politieke
      akkoord tussen de Raad en het Europees Parlement van 30 mei 2013 over het voorstel voor een Verordening van het
      Europees Parament en de Raad inzake het gemeenschappelijk visserijbeleid (COM(2011) 425 definitief) zoals opgenomen
      in [bijlage 6][ref7] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009353
      [ref2]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0030288#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003150#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0030288#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0003378#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009353
      - id: ref2
        bwb_id: BWBR0002897
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0030288
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0003150
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0030288
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0003378
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0021281
  - number: 4:1.2
    text: |-
      In aanvulling op [artikel 1:15, eerste lid][ref1], komen kosten voor huisvesting niet in aanmerking voor subsidie
      op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:1.3
    text: |-
      In aanvulling op [artikel 1:15, vijfde lid, onder a][ref1], is het uurtarief voor eigen arbeid € 35,– per uur voor
      subsidie op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:1.4
    text: |-
      De Minister kan tot 5 jaar na de subsidievaststelling de subsidie op grond van dit hoofdstuk geheel of gedeeltelijk
      intrekken indien naar de mening van de Minister het resultaat van het project of de activiteit waarvoor subsidie is
      verstrekt, wordt gewijzigd:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
  - number: 4:1.4.a
    text: waardoor de aard van het resultaat van het project of de activiteit is veranderd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
  - number: 4:1.4.b
    text: waardoor in strijd met de uitvoeringsvoorwaarden van de subsidie wordt gehandeld;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
  - number: 4:1.4.c
    text: waardoor de subsidieontvanger een onrechtmatig voordeel heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
  - number: 4:1.4.d
    text: tengevolge van een verandering in de eigendom van een infrastructuurvoorziening, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
  - number: 4:1.4.e
    text: tengevolge van de beëindiging of verplaatsing van een productieve activiteit.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
  - number: 4:1.5
    text: |-
      De Minister kan in het besluit op grond van [artikel 1:3][ref1] bepalen dat [artikel 1:2, tweede lid][ref2], niet
      van toepassing is op subsidies verleend op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:1.6
    text: |-
      Onverminderd [artikel 1:12, vierde lid][ref1], bewaart de ontvanger van een subsidie, verstrekt op grond van dit
      hoofdstuk, de in dat lid bedoelde administratie tot en met 31 december 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:1a.1
    text: |-
      Als beheersautoriteit als bedoeld in artikel 58, eerste lid, onderdeel a, van verordening nr. 1198/2006 wordt
      aangewezen de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41a
  - number: 4:1a.2
    text: |-
      Als certificeringsautoriteit als bedoeld in artikel 58, eerste lid, onderdeel b, van verordening nr. 1198/2006
      wordt aangewezen de Rijksdienst voor Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41a
  - number: 4:1a.3
    text: |-
      Als auditautoriteit als bedoeld in artikel 58, eerste lid, onderdeel c, van verordening nr. 1198/2006 wordt
      aangewezen de Rijksauditdienst van het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41a
  - number: 4:1a.4
    text: |-
      Als bemiddelende instantie als bedoeld in artikel 58, tweede lid, van verordening nr. 1198/2006 wordt aangewezen de
      Rijksdienst voor Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41a
  - number: 4:1b.1
    text: |-
      [Artikel 1:17][ref1] is niet van toepassing op subsidie op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:1b.2
    text: |-
      De Minister kan voor subsidie op grond van dit hoofdstuk op aanvraag een voorschot verlenen voor subsidiabele
      kosten:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41b
  - number: 4:1b.2.a
    text: |-
      tot een maximum van 80% van het ten hoogste te verstrekken subsidiebedrag voor zover de kosten door de
      subsidieontvanger zijn gemaakt en betaald, alsmede voor kosten van eigen arbeid, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41b
  - number: 4:1b.2.b
    text: |-
      tot een maximum van 50% van het ten hoogste te verstrekken subsidiebedrag voor kosten die nog niet door de
      subsidieontvanger zijn gemaakt, indien de Minister in de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1],
      heeft bepaald dat de aanvraag tot voorschotverlening vergezeld gaat van een liquiditeitsoverzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:2.1
    text: |-
      De Minister kan op aanvraag aan de eigenaar van een vissersvaartuig overeenkomstig het bepaalde in deze regeling
      subsidie verlenen ter zake van:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel42
  - number: 4:2.1.a
    text: de definitieve beëindiging van de visserijactiviteiten met dat vissersvaartuig, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel42
  - number: 4:2.1.b
    text: |-
      de eigendomsoverdracht van het vissersvaartuig in het kader van de definitieve beëindiging van de
      visserijactiviteiten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel42
  - number: 4:2.2
    text: 'Onder definitieve beëindiging als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel42
  - number: 4:2.2.a
    text: sloop van het vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel42
  - number: 4:2.2.b
    text: |-
      het definitieve gebruik van het vissersvaartuig voor andere doeleinden dan visserij, onder de vlag van een lidstaat
      van de Europese Unie en voor dat gebruik geregistreerd in de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel42
  - number: 4:3.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het aangevraagde
      subsidiebedrag een lager percentage is van het maximale subsidiebedrag dat voor het betrokken vaartuig kan worden
      betaald op grond van [artikel 4:7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:3.2
    text: |-
      Indien bij de toepassing van het eerste lid aanvragen op dezelfde hoogte worden gerangschikt, wordt de onderlinge
      rangorde tussen deze aanvragen bepaald in volgorde van ontvangst overeenkomstig [artikel 1:6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:4
    text: De aanvraag tot subsidieverlening gaat vergezeld van een kopie van de meetbrief.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel44
  - number: 4:5.1
    text: |-
      De subsidieontvanger is verplicht om binnen drie maanden, te rekenen vanaf de datum van de beschikking tot
      subsidieverlening, ervoor zorg te dragen dat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
  - number: 4:5.1.a
    text: |-
      hetzij de sloop van het vissersvaartuig, hetzij de definitieve bestemming van het vissersvaartuig voor andere
      doeleinden dan de visserij heeft plaatsgevonden, waarbij in het laatstbedoelde geval de op het vissersvaartuig
      aanwezige vistuigen en de overige apparatuur specifiek bestemd en geschikt voor de visserij zijn verwijderd;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
  - number: 4:5.1.b
    text: |-
      het registratienummer van het vissersvaartuig, bedoeld in
      [artikel 9, eerste lid, van de Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1]
      is verwijderd;


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel9
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '9'
  - number: 4:5.1.c
    text: |-
      de inschrijving van het vissersvaartuig in het register, bedoeld in [artikel 4 van het besluit][ref1], is
      doorgehaald;


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: 4:5.1.d
    text: |-
      de teboekstelling van het vissersvaartuig in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], ongedaan is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 4:5.1.e
    text: |-
      het vaartuig wordt ingeschreven in het register van de lidstaat van de Europese Unie onder de vlag
      van welke het vaartuig wordt gebracht, indien de visserijactiviteit wordt beëindigd overeenkomstig
      [artikel 4:2, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:5.2
    text: |-
      De Minister kan de in het eerste lid genoemde termijn op een met redenen omkleed verzoek van de subsidieontvanger
      eenmalig met ten hoogste vier weken verlengen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
  - number: 4:5.3
    text: |-
      In geval van definitieve beëindiging als bedoeld in [artikel 4:2, tweede lid, onderdeel b][ref1], is de
      subsidieontvanger verplicht om ervoor zorg te dragen dat het vaartuig niet op enig tijdstip terugkeert in de
      hoedanigheid van vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:6.1
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], dient de subsidieontvanger binnen vier weken na afloop van de
      termijn, bedoeld in [artikel 4:5, eerste lid][ref2], een aanvraag tot subsidievaststelling in.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:6.2
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
  - number: 4:6.2.a
    text: 'een verklaring van een ambtenaar van de Algemene Inspectiedienst dat is voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
  - number: 4:6.2.a.1°
    text: |-
      [artikel 4:5, eerste lid, onderdeel a][ref1], voor zover het betreft de sloop van het vissersvaartuig of het
      verwijderen van de aanwezige vistuigen en de overige apparatuur specifiek bestemd en geschikt voor de visserij, en


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:6.2.a.2°
    text: |-
      [artikel 4:5, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:6.2.b
    text: |-
      overige bescheiden waarmee naar het oordeel van de Minister wordt aangetoond dat aan de in
      [artikel 4:5, eerste lid][ref1], bedoelde verplichtingen is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:6.2.c
    text: het originele exemplaar van de ten aanzien van het betreffende vissersvaartuig toegekende visvergunning;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
  - number: 4:6.2.d
    text: |-
      het originele exemplaar van de garnalenvergunning en van de vergunning voor het vissen met een sleepnet in de
      Oosterschelde, voor zover deze vergunningen ten aanzien van het betreffende vissersvaartuig zijn toegekend;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
  - number: 4:6.2.e
    text: |-
      het originele exemplaar van de vismachtiging, bedoeld in artikel 7, eerste lid, van de controleverordening,
      bedoeld in [artikel 1, tweede lid, van de Uitvoeringregeling zeevisserij][ref1], voor zover ten aanzien van het
      desbetreffende vissersvaartuig een vismachtiging is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0030288#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0030288
        artikel: '1'
  - number: 4:6.2.f
    text: |-
      een taxatierapport van het vaartuig van een beëdigd taxateur, indien de visserijactiviteit beëindigd wordt
      overeenkomstig [artikel 4:2, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:7.1
    text: |-
      De Minister bepaalt de maximale hoogte van de subsidie volgens de formule: forfaitair subsidiebedrag per brutoton
      maal brutotonnage van het vissersvaartuig plus een aanvullend bedrag.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel47
  - number: 4:7.2
    text: |-
      De Minister bepaalt de hoogte van het forfaitaire subsidiebedrag per brutoton en van het aanvullende bedrag,
      waarbij een klasse-indeling in brutotonnage kan worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel47
  - number: 4:7.3
    text: |-
      De formule ter bepaling van de maximale hoogte van de subsidie kan uitgebreid worden om rekening te houden met de
      leeftijd van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel47
  - number: 4:7.4
    text: |-
      Indien de visserijactiviteit beëindigd wordt overeenkomstig [artikel 4:2, tweede lid, onderdeel b][ref1], wordt
      de subsidie verminderd met de marktwaarde van het vaartuig, die is bepaald in het taxatierapport, bedoeld in
      [artikel 4:6, tweede lid, onderdeel f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:7.5
    text: |-
      Indien het vaartuig verloren gaat op een tijdstip tussen het moment van subsidieverlening en de
      subsidievaststelling, wordt de subsidie verminderd met het bedrag van de door de verzekering uitgekeerde
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel47
  - number: 4:8
    text: |-
      Ten aanzien van contingenten die zijn toegekend ten behoeve van vaartuigen waarvoor
      subsidie wordt verleend, wordt de periode van aanhouden van een contingent als bedoeld in
      [artikel 14 van de Regeling contingentering zeevis][ref1] vastgesteld op ten hoogste 36 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel14
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008477
        artikel: '14'
  - number: 4:9.1
    text: 'De Minister kan op aanvraag aan een visser subsidie verstrekken:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel49
  - number: 4:9.1.a
    text: voor de verbetering van de beroepsvaardigheden, met name van jonge vissers;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel49
  - number: 4:9.1.b
    text: voor de omscholing naar een beroep buiten de zeevisserij;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel49
  - number: 4:9.1.c
    text: |-
      als eenmalige compensatie indien de visserijactiviteit van het vaartuig waarop de visser ten minste twaalf maanden
      heeft gewerkt, definitief is beëindigd in de zin van [artikel 4:2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:9.1.d
    text: voor het vroegtijdig uittreden uit de visserij
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel49
  - number: 4:9.2
    text: |-
      De aanvraag voor subsidie wordt afgewezen indien de aanvrager reeds eerder een subsidie voor
      een activiteit als bedoeld in het eerste lid, onderdeel b en d, heeft ontvangen op grond
      van deze paragraaf, de Vergoedingsregeling voor uittreding van vissers uit de visserij,
      de [Vergoedingsregeling voor uittreding van vissers uit de visserij 2002][ref1], de
      [Vergoedingsregeling voor uittreding van vissers uit de visserij 2003][ref2] of in de twaalf maanden voorafgaande
      aan de aanvraag op grond van paragraaf 1 van hoofdstuk 4 een aanvraag tot subsidieverlening heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0021774
      [ref2]: https://wetten.overheid.nl/BWBR0016104
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021774
      - id: ref2
        bwb_id: BWBR0016104
  - number: 4:10
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:11.1
    text: |-
      [Artikel 1:2, tweede lid][ref1], is niet van toepassing op subsidieverlening op grond van [artikel 4:9][ref2], met
      dien verstande dat activiteiten verricht voor 1 januari 2007 niet in aanmerking komen voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:11.2
    text: |-
      Binnen een termijn van drie maanden na de beschikking tot verlening van de subsidie, bedoeld in
      [artikel 4:9, eerste lid, onderdeel d][ref1], toont de subsidieontvanger ten genoegen van de Minister aan dat hij
      zijn werkzaamheden als visser definitief heeft beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:11.3
    text: |-
      Na uitkering van de subsidie, bedoeld in [artikel 4:9, eerste lid, onderdeel b][ref1], is het de subsidieontvanger
      verboden binnen vijf jaar zijn beroepsactiviteit als visser te hervatten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:11.4
    text: |-
      Na uitkering van de subsidie, bedoeld in [artikel 4:9, eerste lid, onderdeel c][ref1], is het de subsidieontvanger
      verboden binnen twaalf maanden zijn beroepsactiviteit als visser te hervatten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:12.1
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], dient de subsidieontvanger 24 maanden na de beschikking tot
      subsidieverlening op grond van [artikel 4:9, onderdeel a of b][ref2], een aanvraag tot subsidievaststelling in.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel412
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:12.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een afschrift van het certificaat of diploma van de
      gevolgde cursus.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel412
  - number: 4:13
    text: |-
      Binnen acht weken na ontvangst van de gegevens, bedoeld in [artikel 4:11, tweede lid][ref1], stelt de Minister de
      subsidie, bedoeld in [artikel 4:9, eerste lid, onderdeel d][ref2], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:14.1
    text: |-
      De subsidie bedraagt ten hoogste: voor de activiteit, bedoeld in [artikel 4:9, eerste lid, onderdeel a][ref1]:
      100% van de totale kosten van deelname aan de cursus; voor de activiteit, bedoeld in
      [artikel 4:9, eerste lid, onderdeel b][ref2]: 100% van de totale kosten van deelname aan de cursus; voor de
      activiteit, bedoeld in [artikel 4:9, eerste lid, onderdeel c][ref3]: € 6.000,– . voor de activiteit, bedoeld in
      [artikel 4:9, eerste lid, onderdeel d][ref4]: € 600,– voor iedere kalendermaand gedurende de periode die aanvangt
      op de eerste dag van de maand waarin de arbeids- of maatschapsovereenkomst is of wordt beëindigd en die eindigt op
      de eerste dag van de maand waarin de 65-jarige leeftijd wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:14.2
    text: |-
      Indien de subsidieontvanger niet langer voldoet aan [artikel 4:11, vierde lid][ref1], betaalt hij een door de
      Minister te bepalen evenredig deel van de subsidie bedoeld in [artikel 4:9, eerste lid, onderdeel c][ref2], terug.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:15.1
    text: |-
      Ter stimulering van het innovatieve vermogen in de visserijsector, kan de Minister subsidie verstrekken voor de
      uitvoering van een innovatieproject aan
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.1.a
    text: een visserijonderneming of een erkende beroepsorganisatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.1.b
    text: een samenwerkingsverband van aanvragers als bedoeld in onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.1.c
    text: |-
      een samenwerkingsverband van aanvragers als bedoeld in onderdeel a met een maatschappelijke organisatie op het
      gebied van visserij.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.2
    text: Het innovatieproject wordt uitgevoerd in partnerschap met een wetenschappelijke of technische instantie.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.3
    text: 'Geen subsidie wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.3.a
    text: projecten waarvan de subsidiabele kosten in totaal minder bedragen dan € 10.000,–;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.3.b
    text: projecten waarbinnen nieuwe technische kennis direct op praktijkschaal commercieel toegepast wordt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:15.3.c
    text: experimentele visserij.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel415
  - number: 4:16
    text: |-
      De aanvraag gaat vergezeld van een beschrijving van het partnerschap met de wetenschappelijke of technische
      instantie, waarin in elk geval de taakverdeling en de aard van de wetenschappelijke begeleiding worden beschreven.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel416
  - number: 4:17.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:17.1.a
    text: een meer innovatief karakter heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.b
    text: meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.c
    text: een groter uitstralingseffect heeft voor toepassing door andere ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.d
    text: een meer duurzaam karakter heeft waaronder tevens wordt verstaan het bijdragen aan dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.e
    text: minder effecten heeft op de natuur;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.f
    text: meer bijdraagt aan de selectiviteit van vismethoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.g
    text: meer bijdraagt aan de toegevoegde waarde van visserijproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.h
    text: bij toepassing in de praktijk leidt tot meer energiebesparing in de visserijsector;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.i
    text: bij toepassing in de praktijk leidt tot meer kostenbesparingen voor de visserijsector, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:17.1.j
    text: |-
      wordt uitgevoerd door een samenwerkingsverband als bedoel in [artikel 4:15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:17.2
    text: |-
      Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref1], en
      adviseert de Minister over de rangschikking van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:17.3
    text: |-
      De Minister kan in afwijking van het tweede lid voor specifieke categorieën aanvragen een andere
      beoordelingscommissie instellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel417
  - number: 4:18.1
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel418
  - number: 4:18.2
    text: |-
      In afwijking van het eerste lid kan de Minister voor de uitvoering van het project een andere termijn dan drie
      jaar vaststellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel418
  - number: 4:18.3
    text: |-
      De Minister kan, in afwijking van [artikel 1:2, aanhef en eerste lid][ref1], toestemming geven voor de uitvoering
      van het project buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:18.4
    text: Het project gaat gepaard met naar het oordeel van de Minister adequate wetenschappelijke begeleiding.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel418
  - number: 4:18.5
    text: |-
      De subsidieontvanger maakt de kennis en informatie die met het project worden opgedaan onmiddellijk na afloop van
      het project openbaar in een verslag dat naar het oordeel van de Minister van afdoende kwaliteit is.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel418
  - number: 4:18.6
    text: |-
      De Minister kan de subsidieontvanger aanvullende verplichtingen opleggen omtrent de wijze waarop de openbaarmaking,
      bedoeld in het vierde lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel418
  - number: 4:19.1
    text: 'volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.1.a
    text: loonkosten en kosten voor eigen arbeid voor zover ze betrekking hebben op de uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.1.b
    text: |-
      aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces- en ketenmanagement,
      wetenschappelijke begeleiding van het project en ter zake van de verwerving van kennis en intellectuele
      eigendomsrechten alsmede ter zake van de bescherming van die rechten, met uitzondering van winstopslagen bij
      transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.1.c
    text: |-
      kosten voor de aanschaf van machines en apparatuur, nieuw of tweedehands, in geval van huurkoop gebaseerd op
      de aan het project toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij
      transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.1.d
    text: kosten voor een studie naar de haalbaarheid van de ontwikkeling van nieuwe technologieën, technieken en methoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.1.e
    text: kosten gemoeid met het testen van de nieuwe technologieën, technieken en methoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.1.f
    text: kosten van een controleverklaring van een accountant, voor zover deze kosten niet meer bedragen dan € 2500,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.2
    text: |-
      In aanvulling op het eerste lid komen voor aanvragen ingediend door een samenwerkingsverband als bedoeld in
      [artikel 4:15, eerste lid][ref1], tevens de volgende kosten in aanmerking voor subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4:19.2.a
    text: |-
      kosten voor organisatie en facilitering van het samenwerkingsverband, waaronder begrepen zaal- en locatiehuur,
      vergaderfaciliteiten en bureaukosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:19.2.b
    text: kosten voor een procesbegeleider of ketenmanager.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel419
  - number: 4:20
    text: De aanvraag tot subsidievaststelling gaat vergezeld van een controleverklaring van een accountant.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel420
  - number: 4:21.1
    text: De subsidie bedraagt ten hoogste 100 % van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel421
  - number: 4:21.2
    text: De subsidie bedraagt ten hoogste € 500.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel421
  - number: 4:21.3
    text: |-
      Innovatieprojecten mogen geen direct commercieel doel hebben. Inkomsten gerelateerd aan het innovatieproject, die
      ontstaan tijdens de uitvoering daarvan, worden afgetrokken van de subsidiabele kosten voor het project.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel421
  - number: 4:22.1
    text: |-
      De Minister kan subsidie verstrekken voor de uitvoering van een project ter bevordering van samenwerkingsvormen
      in de visserij of ter versterking van praktijknetwerken die samenwerking of innovatie ondersteunen en dat met name
      gericht is op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.a
    text: beter beheer van visbestanden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.b
    text: duurzame vismethoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.c
    text: ketensamenwerking;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.d
    text: samenwerking tussen onderzoekers en vissers of visserijondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.e
    text: uitwisseling van kennis;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.f
    text: internationale samenwerking;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.1.g
    text: ontwikkeling van de aquacultuursector.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.2
    text: 'Voor de subsidie komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.2.a
    text: een visserijonderneming of een erkende beroepsorganisatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.2.b
    text: een samenwerkingsverband van aanvragers als bedoeld in onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.2.c
    text: |-
      een samenwerkingsverband van aanvragers als bedoeld in onderdeel a met een maatschappelijke organisatie op het
      gebied van visserij.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:22.3
    text: Geen subsidie wordt verstrekt voor projecten die zijn gericht op experimentele visserij.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel422
  - number: 4:23.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:23.1.a
    text: meer bijdraagt aan de samenwerking tussen verschillende partijen in de visserij;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:23.1.b
    text: |-
      een groter uitstralingseffect heeft naar andere partijen in de visserijsector ten aanzien van de voordelen en
      mogelijkheden van samenwerking;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:23.1.c
    text: een meer duurzaam karakter heeft;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:23.1.d
    text: een resultaat zal opleveren dat ten goede komt van andere visserijondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:23.1.e
    text: |-
      meer bijdraagt aan de verbetering van kwaliteit van visserijproducten en de toevoeging van waarde aan een
      visserijproduct in de keten, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:23.1.f
    text: meer bijdraagt aan de traceerbaarheid van visserijproducten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:23.2
    text: |-
      Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref1], en
      adviseert de Minister over de rangschikking van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:23.3
    text: |-
      De Minister kan in afwijking van het tweede lid voor specifieke categorieën aanvragen een andere
      beoordelingscommissie instellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel423
  - number: 4:24.1
    text: |-
      De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel424
  - number: 4:24.2
    text: |-
      In afwijking van het eerste lid kan de Minister voor de uitvoering van het project een andere termijn dan drie
      jaar vaststellen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel424
  - number: 4:24.3
    text: |-
      De Minister kan, in afwijking van [artikel 1:2, aanhef en eerste lid][ref1], toestemming geven voor de uitvoering
      van het project buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:24.4
    text: |-
      De subsidieontvanger staat toe dat de Minister de kennis en informatie die met het project worden opgedaan openbaar
      maakt ten behoeve van de visserijsector.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel424
  - number: 4:25
    text: 'De volgende kosten komen in aanmerking voor de subsidie:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.a
    text: loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.b
    text: |-
      aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces- en ketenmanagement en
      ter zake van de verwerving van kennis en intellectuele eigendomsrechten, met uitzondering van winstopslagen bij
      transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.c
    text: |-
      kosten voor de aanschaf van machines en apparatuur, nieuw of tweedehands, in geval van huurkoop gebaseerd op
      de aan het project toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij
      transacties binnen een groep;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.d
    text: kosten voor een studie naar de haalbaarheid van de ontwikkeling van nieuwe technologieën, technieken en methoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.e
    text: kosten gemoeid met het testen van de nieuwe technologieën, technieken en methoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.f
    text: kosten van eigen arbeid van de betrokken ondernemer;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.g
    text: |-
      kosten voor organisatie en facilitering van het samenwerkingsverband, waaronder begrepen zaal- en locatiehuur,
      vergaderfaciliteiten en bureaukosten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.h
    text: kosten voor een procesbegeleider of ketenmanager;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:25.i
    text: kosten van een controleverklaring van een accountant, voor zover deze kosten niet meer bedragen dan € 2500,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel425
  - number: 4:26.1
    text: De subsidie bedraagt ten hoogste 100% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426
  - number: 4:26.2
    text: De subsidie bedraagt ten hoogste € 500.000,–.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426
  - number: 4:26a.1
    text: |-
      De Minister verstrekt in overeenstemming met artikel 37 van verordening nr. 1198/2006 subsidie voor de uitvoering
      van een project dat gericht is op het in het gemeenschappelijk belang ontwikkelen van systemen, procedures of
      processen ter bevordering van de invoering van de aanlandplicht, waaronder projecten die gericht zijn op:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.a
    text: |-
      ontwikkeling van duurzame vismethoden welke bijdragen aan het vergroten van selectiviteit en het beperken van
      ongewenste bijvangsten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.b
    text: |-
      ontwikkeling van systemen, procedures of processen voor de sortering en opslag van vis aan boord, die noodzakelijk
      worden geacht in verband met de verplichting om ongewenste bijvangsten aan boord te houden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.c
    text: |-
      ontwikkeling van systemen, procedures of processen om vissen met een hoge overlevingskans, waaronder vissen die
      niet aan boord mogen zijn, snel en ongedeerd overboord te kunnen zetten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.d
    text: ontwikkeling van systemen, procedures of processen voor beheer van de quota, en de documentatie van (bij)vangsten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.e
    text: ontwikkeling van systemen, procedures of processen voor inrichting van de controle;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.f
    text: ontwikkeling van systemen, procedures of processen voor traceerbaarheid en verwerking van ongewenste bijvangsten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.g
    text: |-
      ontwikkeling van systemen, procedures of processen voor opslag- en afzetmogelijkheden voor aan wal gebrachte
      ongewenste bijvangsten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.h
    text: uitwisseling van kennis;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.1.i
    text: internationale samenwerking.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.2
    text: 'Voor de subsidie komt in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.2.a
    text: een samenwerkingsverband dat bestaat uit visserijondernemingen, erkende beroepsorganisaties of beide;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.2.b
    text: |-
      een samenwerkingsverband van aanvragers als bedoeld onder a met een maatschappelijke organisatie op het gebied van
      visserij of met andere partijen in de visserijsector.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.3
    text: 'Geen subsidie wordt verstrekt voor projecten:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.3.a
    text: die zijn gericht op experimentele visserij, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26a.3.b
    text: die niet verder reiken dan de maatregelen die normaliter door particuliere ondernemingen worden genomen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426a
  - number: 4:26b.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:26b.1.a
    text: een meer duurzaam karakter heeft in relatie tot de implementatie van de aanlandplicht;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
  - number: 4:26b.1.b
    text: een groter uitstralingseffect heeft op andere ondernemingen;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
  - number: 4:26b.1.c
    text: de ontwikkeling van nieuwe markten en afzetmogelijkheden in de gehele keten van visserijproducten meer bevordert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
  - number: 4:26b.1.d
    text: |-
      een grotere bijdrage levert aan het ontwikkelen van duurzame vismethoden om selectiviteit te vergroten en
      ongewenste bijvangsten te beperken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
  - number: 4:26b.1.e
    text: het rendement van visserijondernemingen in relatie tot de verplichtingen van de aanlandplicht meer bevordert.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
  - number: 4:26b.2
    text: |-
      Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref1], dat de
      Minister adviseert over de rangschikking van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426b
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:26c
    text: |-
      Op de verstrekking van de subsidie zijn de [artikelen 4:24 tot en met 4:26][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel426c
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:27.1
    text: |-
      De Minister kan subsidie verstrekken voor de uitvoering van een project dat is gericht op de algemene bevordering
      van kwaliteit en rendement of op de ontwikkeling van nieuwe markten voor visserijproducten en dat met name één van
      de volgende activiteiten omvat:
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.a
    text: |-
      het voorzien van de markt met soorten waarvan er een overschot is of die onderbevist zijn, die normaliter worden
      teruggegooid of die geen handelswaarde hebben;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.b
    text: de uitvoering van een kwaliteitsbeleid voor visserijproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.c
    text: de bevordering van de afzet van producten die zijn verkregen met methoden met een gering milieueffect;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.d
    text: de bevordering van de afzet van producten die zijn erkend op grond van verordening nr. 510/2006;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.e
    text: |-
      kwaliteitscertificering, met inbegrip van het creëren van etiketten en de certificering van producten die zijn
      gevangen of gekweekt met milieuvriendelijke productiemethoden;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.f
    text: de bevordering van traceerbaarheid van visserijproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.1.g
    text: de uitvoering van marktonderzoeken.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.2
    text: 'Voor de subsidie komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.2.a
    text: een visserijonderneming of een erkende beroepsorganisatie;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.2.b
    text: een samenwerkingsverband van aanvragers als bedoeld in onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.2.c
    text: |-
      een samenwerkingsverband van aanvragers als bedoeld in onderdeel a met een maatschappelijke organisatie op het
      gebied van visserij.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.3
    text: 'Geen subsidie wordt verstrekt voor projecten:'
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.3.a
    text: die zijn gericht op handelsmerken;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:27.3.b
    text: |-
      waarin wordt verwezen naar specifieke landen of geografische gebieden, tenzij het producten betreft die zijn erkend
      op grond van verordening nr. 510/2006.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel427
  - number: 4:28
    text: |-
      In het projectplan, bedoeld in [artikel 1:9, tweede lid][ref1], is de geografische locatie opgenomen waar het
      project wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:29.1
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel429
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
        hoofdstuk: '1'
  - number: 4:29.1.a
    text: de kwaliteit en rendement van visserijproducten meer bevordert;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel429
  - number: 4:29.1.b
    text: een grotere betekenis heeft voor de ontwikkeling van nieuwe markten voor visserijproducten;
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel429
  - number: 4:29.1.c
    text: een meer duurzaam karakter heeft, en
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel429
  - number: 4:29.1.d
    text: een groter uitstralingseffect heeft voor toepassing door andere ondernemingen.
    url: https://wetten.overheid.nl/BWBR0021281/2015-09-17#Artikel429
  - number: 4:29.2
    text: |-
      Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref1], en
      adviseert de Minister over de rangschikking van aanvragen.


