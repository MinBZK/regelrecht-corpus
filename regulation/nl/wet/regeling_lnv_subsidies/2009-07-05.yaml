  - number: 4:6
    text: |-
      1 In afwijking van [artikel 1:14, eerste lid][ref1], dient de subsidieontvanger binnen vier weken na afloop van de
      termijn, bedoeld in [artikel 4:5, eerste lid][ref2], een aanvraag tot subsidievaststelling in.

      2 De aanvraag gaat vergezeld van:

      a. een verklaring van een ambtenaar van de Algemene Inspectiedienst dat is voldaan aan:

      1°. [artikel 4:5, eerste lid, onderdeel a][ref3], voor zover het betreft de sloop van het vissersvaartuig of het
      verwijderen van de aanwezige vistuigen en de overige apparatuur specifiek bestemd en geschikt voor de visserij, en

      2°. [artikel 4:5, eerste lid, onderdeel b][ref4];

      b. overige bescheiden waarmee naar het oordeel van de Minister wordt aangetoond dat aan de in
      [artikel 4:5, eerste lid][ref5], bedoelde verplichtingen is voldaan;

      c. het originele exemplaar van de ten aanzien van het betreffende vissersvaartuig toegekende visvergunning;

      d. het originele exemplaar van de garnalenvergunning en van de vergunning voor het vissen met een sleepnet in de
      Oosterschelde, voor zover deze vergunningen ten aanzien van het betreffende vissersvaartuig zijn toegekend;

      e. het originele exemplaar van het speciale visdocument, bedoeld in
      [artikel 4, tweede lid, onderdeel a, van de Regeling technische maatregelen 2000][ref6], voor zover ten aanzien van
      het betreffende vissersvaartuig een speciaal visdocument is toegekend;

      f. een taxatierapport van het vaartuig van een beëdigd taxateur, indien de visserijactiviteit beëindigd wordt
      overeenkomstig [artikel 4:2, tweede lid, onderdeel b][ref7].


