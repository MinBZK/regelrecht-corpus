      1 Ter stimulering van het innovatieve vermogen in de visserijsector, kan de Minister subsidie verstrekken voor de
      uitvoering van een innovatieproject aan

      a. een visserijonderneming of een erkende beroepsorganisatie;

      b. een samenwerkingsverband van aanvragers als bedoeld in onderdeel a, of

      c. een samenwerkingsverband van aanvragers als bedoeld in onderdeel a met een maatschappelijke organisatie op het
      gebied van visserij.

      2 Het innovatieproject wordt uitgevoerd in partnerschap met een wetenschappelijke of technische instantie.

      3 Geen subsidie wordt verstrekt voor:

      a. projecten waarvan de subsidiabele kosten in totaal minder bedragen dan € 10.000,–;

      b. projecten waarbinnen nieuwe technische kennis direct op praktijkschaal commercieel toegepast wordt.

      c. experimentele visserij.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel415
  - number: 4:16
    text: |-
      De aanvraag gaat vergezeld van een beschrijving van het partnerschap met de wetenschappelijke of technische
      instantie, waarin in elk geval de taakverdeling en de aard van de wetenschappelijke begeleiding worden beschreven.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel416
  - number: 4:17
    text: |-
      1 De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:

      a. een meer innovatief karakter heeft;

      b. meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;

      c. een groter uitstralingseffect heeft voor toepassing door andere ondernemingen;

      d. een meer duurzaam karakter heeft;

      e. minder effecten heeft op de natuur;

      f. meer bijdraagt aan de selectiviteit van vismethoden;

      g. meer bijdraagt aan de toegevoegde waarde van visserijproducten;

      h. bij toepassing in de praktijk leidt tot meer energiebesparing in de visserijsector;

      i. bij toepassing in de praktijk leidt tot meer kostenbesparingen voor de visserijsector, en

      j. wordt uitgevoerd door een samenwerkingsverband als bedoel in [artikel 4:15, eerste lid][ref2].

      2 Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref3], en
      adviseert de Minister over de rangschikking van aanvragen.

      3 De Minister kan in afwijking van het tweede lid voor specifieke categorieën aanvragen een andere
      beoordelingscommissie instellen.


