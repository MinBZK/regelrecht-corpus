  - number: 4:1
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

        - verordening nr. 1198/2006: Verordening (EG) nr. 1198/2006 van de Raad van 27 juli 2006 inzake het Europese
      Visserijfonds (PbEU L 223);
        - verordening nr. 510/2006: Verordening (EG) nr. 510/2006 van de Raad van 20 maart 2006 inzake de bescherming van
      geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU L 93);
        - Besluit: [Besluit registratie vissersvaartuigen 1998][ref1];
        - kleine, middelgrote en micro-ondernemingen: kleine, middelgrote en micro-onderneming in de zin van Aanbeveling
      2003/361/EG van de Commissie van 6 mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen
      (PbEU L 124);
        - visserijonderneming: onderneming die actief is binnen de visserijsector;
        - visser: natuurlijk persoon die zijn hoofdberoep uitoefent aan boord van een in bedrijf zijnd vissersvaartuig;
        - vissersvaartuig: vaartuig dat gebruikt wordt voor de uitoefening van de bedrijfsmatige visserij, dat
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref2] als Nederlands geldt en
      dat overeenkomstig het bij of krachtens het besluit bepaalde staat geregistreerd;
        - binnenvisserij: visserij voor commerciële doeleinden met vaartuigen die uitsluitend actief zijn in de
      binnenwateren en die niet in het communautaire register van vissersvaartuigen zijn opgenomen;
        - aquacultuur: de kweek of teelt van aquatische organismen, waarbij technieken worden gebruikt om de aangroei van
      de betrokken organismen te verhogen tot boven de natuurlijke capaciteiten van het milieu;
        - gangbare praktijk in de aquacultuursector: aquacultuuractiviteiten die worden uitgevoerd overeenkomstig de
      bindende gezondheids-, veterinaire of milieuwetgeving;
        - visvergunning: aan een ondernemer ten aanzien van een vissersvaartuig toegekende visvergunning als bedoeld in
      [artikel 1 van de Regeling visvergunning][ref3];
        - garnalenvergunning: vergunning als bedoeld in
      [artikel 11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref4] verleend voor het vissen
      met enig vistuig geschikt voor het vangen van garnalen (Crangon, crangon) in de visserijzone, het zeegebied of
      de kustwateren;
        - contingent: contingent als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Regeling contingentering zeevis][ref5];
        - meetbrief: document als bedoeld in [artikel 4 van de Meetbrievenwet 1981][ref6];
        - brutoton: maat ter bepaling van de scheepsinhoud overeenkomstig bijlage I van het op 23 juni 1969 te Londen tot
      stand gekomen Internationaal Verdrag betreffende de meting van schepen (Trb. 1970, 122 en 194);
        - innovatieproject: project dat een samenhangend geheel van activiteiten vormt, welke zijn gericht op het verwerven
      en verspreiden van nieuwe technische kennis die wordt verkregen door: a. het ontwikkelen van een innoverende
      technologie en het onder realistische omstandigheden in de productiesector testen van de technische en economische
      levensvatbaarheid van deze technologie; b. testen uit te voeren in verband met beheersplannen en plannen voor het
      toewijzen van visserij-inspanningen, waaronder desnoods het sluiten van gebieden voor de visserij om de biologische
      en financiële gevolgen te kunnen evalueren, en het experimenteel uitzetten van vis; c. methoden te ontwikkelen en
      te testen om de selectiviteit van het vistuig te verbeteren of om de bijvangsten, de overboord gezette hoeveelheden
      of de gevolgen voor het milieu te beperken, of d. alternatieve soorten visserijbeheerstechnieken te testen;
        - Visserij Innovatie Platform: door de Minister van LNV ingesteld platform dat adviseert over kansrijke innovaties
      in de visserij, zoals meegedeeld bij brief aan de Tweede Kamer van 27 juni 2006 (Kamerstukken II 2005-06, 29675,
      nr. 19);
        - experimentele visserij; het gebruik van vistuig en andere apparatuur voor de detectie van vis om vast te stellen
      welke vissoorten in welke hoeveelheden aanwezig zijn, teneinde een indruk te krijgen van de omvang van de bestanden
      in dat gebied en van de economische perspectieven van commerciële exploitatie van deze bestanden;
        - maatschappelijke organisatie: rechtspersoon zonder winstoogmerk, niet zijnde een overheidsorganisatie of
      onderneming in Europeesrechtelijke zin;
        - ondernemer: natuurlijk persoon of rechtspersoon te wiens naam het vissersvaartuig in het visserijregister staat
      geregistreerd;

        - vissoorten: alle soorten van vis, schaal-, schelp- en weekdieren.

      2 In aanvulling op [artikel 1:15][ref7] komen kosten voor huisvesting niet in aanmerking voor subsidie op grond van
      dit hoofdstuk.

      3 De Minister kan tot 5 jaar na de subsidievaststelling de subsidie op grond van dit hoofdstuk geheel of
      gedeeltelijk intrekken indien naar de mening van de Minister het resultaat van het project of de activiteit
      waarvoor subsidie is verstrekt, wordt gewijzigd:

      a. waardoor de aard van het resultaat van het project of de activiteit is veranderd;

      b. waardoor in strijd met de uitvoeringsvoorwaarden van de subsidie wordt gehandeld;

      c. waardoor de subsidieontvanger een onrechtmatig voordeel heeft;

      d. tengevolge van een verandering in de eigendom van een infrastructuurvoorziening, of

      e. tengevolge van de beëindiging of verplaatsing van een productieve activiteit.

      4 De Minister kan in het besluit op grond van [artikel 1:3][ref8] bepalen dat [artikel 1:2, tweede lid][ref9], niet
      van toepassing is op subsidies verleend op grond van dit hoofdstuk.

      5 In afwijking van [artikel 1:12, vierde lid][ref10], bewaart de ontvanger van een subsidie, verstrekt op grond van
      dit hoofdstuk, de in dat lid bedoelde administratie tot en met 31 december 2020.


