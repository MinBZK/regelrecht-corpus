  - number: 4:19
    text: |-
      1 volgende kosten komen in aanmerking voor de subsidie:

      a. loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;

      b. aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces- en ketenmanagement,
      wetenschappelijke begeleiding van het project en ter zake van de verwerving van kennis en intellectuele
      eigendomsrechten alsmede ter zake van de bescherming van die rechten, met uitzondering van winstopslagen bij
      transacties binnen een groep;

      c. kosten voor de aanschaf van machines en apparatuur, nieuw of tweedehands, in geval van huurkoop gebaseerd op
      de aan het project toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij
      transacties binnen een groep;

      d. kosten voor een studie naar de haalbaarheid van de ontwikkeling van nieuwe technologieën, technieken en
      methoden;

      e. kosten gemoeid met het testen van de nieuwe technologieën, technieken en methoden;

      f. kosten van eigen arbeid van de betrokken ondernemer;

      g. kosten van een accountantsverklaring, voor zover deze kosten niet meer bedragen dan € 2500,–.

      2 In aanvulling op het eerste lid komen voor aanvragen ingediend door een samenwerkingsverband als bedoeld in
      [artikel 4:15, eerste lid][ref1], tevens de volgende kosten in aanmerking voor subsidie:

      a. kosten voor organisatie en facilitering van het samenwerkingsverband, waaronder begrepen zaal- en locatiehuur,
      vergaderfaciliteiten en bureaukosten;

      b. kosten voor een procesbegeleider of ketenmanager.


