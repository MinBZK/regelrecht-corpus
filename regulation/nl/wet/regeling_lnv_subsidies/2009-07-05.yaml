    text: |-
      1 De Minister kan subsidie verstrekken aan de Unie van Bosgroepen voor projecten die een bijdrage leveren aan
      rendementsverbetering binnen de bos- en natuursector alsmede aan verbetering van de kwaliteit van het bos en de
      natuur.

      2 De volgende activiteiten komen in aanmerking voor de subsidie:

      a. het verbeteren van de advisering en opleiding aan bos- en natuureigenaren met een bezit kleiner dan 250 hectare
      over het beheer van bos- en natuurterreinen;

      b. het verzamelen van natuurgegevens;

      c. het opstellen van aanvragen tot verlening van een subsidie als bedoeld in:

      a. [artikel 20a van de Subsidieregeling natuurbeheer 2000][ref1], zoals die luidde tot 1 januari 2007, of

      b. een met de subsidie, bedoeld onder 1, overeenkomende subsidie die door provinciale staten kan worden verstrekt
      op grond van een ingevolge [artikel 11, derde lid, van de Wet inrichting landelijk gebied][ref2] door hen
      vastgestelde verordening, of

      c. [artikel 3:11][ref3] van deze regeling.


