  - number: 5:6
    text: |-
      1 Een aanvraag tot verlening van een subsidie voor de uitvoering van activiteiten als bedoeld in
      [artikel 5:3, tweede lid, onderdeel a][ref1], gaat vergezeld van:

      a. een plan, waarin de activiteiten waarvoor de subsidie wordt aangevraagd zijn opgenomen en waaruit blijkt hoe die
      activiteiten bijdragen aan de doelstelling, bedoeld in [artikel 5:3, eerste lid][ref2];

      b. een op naam van de aanvrager gestelde offerte van de bouwers of leveranciers van de investeringen waarvoor
      subsidie wordt aangevraagd, en

      c. een verklaring van een bank dat de onderneming levensvatbaar is.

      2 Een aanvraag tot verlening van een subsidie voor de uitvoering van activiteiten als bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref3], gaat vergezeld van:

      a. een projectplan dat helder onderbouwt dat uitvoering van het plan en van de daarin opgenomen investeringen
      waarvoor subsidie wordt aangevraagd, bijdraagt aan het verbeteren van de algehele prestaties van de betrokken
      ondernemingen;

      b. een analyse van vraag- en aanbod in de betreffende markt;

      c. een uitvoerige beschrijving van de geplande activiteiten;

      d. de bijdrage van die activiteiten aan het verhogen van de toegevoegde waarde;

      e. melding van een beslismoment ten aanzien van de overgang van ontwikkel- naar uitvoeringsfase;

      f. een investerings- en indien relevant een exploitatiebegroting met een dekkingsvoorstel.


