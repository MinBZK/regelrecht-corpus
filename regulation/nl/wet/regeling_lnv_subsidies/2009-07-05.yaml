  - number: 1:7
    text: |-
      1 Indien per categorie van aanvragers een subsidieplafond is vastgesteld, vindt rangschikking als bedoeld in
      [artikel 1:4][ref1], [1:5][ref2] of [1:6][ref3] per categorie plaats.

      2 Bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref4], kan de Minister:

      a. besluiten dat rangschikking plaatsvindt op een andere wijze dan bepaald in deze regeling;

      b. toetsingscriteria vaststellen voor rangschikking als bedoeld in [artikel 1:4, tweede lid][ref5], in voorkomend
      geval in aanvulling op toetsingscriteria die in deze regeling zijn gesteld.


