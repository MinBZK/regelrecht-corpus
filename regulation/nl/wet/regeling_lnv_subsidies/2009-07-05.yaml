        artikel: 2:64
        hoofdstuk: '2'
  - number: 2:66
    text: |-
      1 De subsidie bedraagt ten hoogste:

      a. € 3,50 per m2 glasoppervlak dat wordt afgebroken;

      b. € 25 per m2 bedrijfsgebouw dat wordt afgebroken;

      c. € 2,50 per m2 betonnen teeltvloer dat wordt afgebroken;

      d. € 4 per m3 per nieuw gegraven sloot.

      2 Subsidies die in de vijf jaar voorafgaand aan de ontvangstdatum van de aanvraag tot subsidieverlening door een
      bestuursorgaan zijn verstrekt met betrekking tot de bouw of verbouwing van de glasopstanden en bedrijfsgebouwen,
      worden in mindering gebracht op de subsidie voor de afbraak daarvan.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel266
  - number: 2:67
    text: Een aanvraag tot voorschotverlening gaat vergezeld van een overzicht van liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel267
  - number: 2:68
    text: |-
