  - number: 4:2
    text: |-
      1 De Minister kan op aanvraag aan de eigenaar van een vissersvaartuig overeenkomstig het bepaalde in deze regeling
      subsidie verlenen ter zake van:

      a. de definitieve beëindiging van de visserijactiviteiten met dat vissersvaartuig, of

      b. de eigendomsoverdracht van het vissersvaartuig in het kader van de definitieve beëindiging van de
      visserijactiviteiten.

      2 Onder definitieve beëindiging als bedoeld in het eerste lid wordt verstaan:

      a. sloop van het vissersvaartuig;

      b. het definitieve gebruik van het vissersvaartuig voor andere doeleinden dan visserij, onder de vlag van een
      lidstaat van de Europese Unie en voor dat gebruik geregistreerd in de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel42
  - number: 4:3
    text: |-
      1 De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het aangevraagde
      subsidiebedrag een lager percentage is van het maximale subsidiebedrag dat voor het betrokken vaartuig kan worden
      betaald op grond van [artikel 4:7][ref2].

      2 Indien bij de toepassing van het eerste lid aanvragen op dezelfde hoogte worden gerangschikt, wordt de onderlinge
      rangorde tussen deze aanvragen bepaald in volgorde van ontvangst overeenkomstig [artikel 1:6][ref3].


