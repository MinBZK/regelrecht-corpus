  - number: 6:3
    text: |-
      1 Het recht zoals dat gold voorafgaand aan de tijdstippen van intrekking van de regelingen, genoemd in
      [artikel 6:2][ref1], blijft van toepassing:

      a. op een aanvraag tot subsidieverlening die is ingediend voorafgaand aan dat tijdstip;

      b. met betrekking tot een subsidie die is of wordt verleend op een aanvraag tot subsidieverlening als bedoeld in
      onderdeel a, alsmede de uit die subsidieverlening voortvloeiende rechten, aanspraken en verplichtingen.

      2 Bij intrekking van de door het bestuur van de Stichting Borgstellingsfonds voor de Landbouw vastgestelde Besluit
      Borgstellingsfonds en Besluit BF bijzondere borgstellingen:

      a. blijft het recht zoals dat gold voorafgaand aan de tijdstippen van intrekking van die besluiten van toepassing:

      1. op een aanvraag tot subsidieverlening die op grond van die besluiten is ingediend;

      2. met betrekking tot een subsidie die is verleend op een aanvraag tot subsidieverlening als bedoeld onder 1°,
      alsmede de uit die subsidieverleningen voortvloeiende rechten, aanspraken en verplichtingen;

      b. gaan de rechten, aanspraken en verplichtingen van het bestuur van de Stichting Borgstellingsfonds voor de
      Landbouw die zijn aangegaan op grond of ter uitvoering van die besluiten, over op de Minister.

      3 Na ontbinding van de Stichting fonds MKZ-AI gaan de rechten, aanspraken of verplichtingen van het bestuur van de
      Stichting fonds MKZ-AI die zijn aangegaan op grond of ter uitvoering van de regelingen, bedoeld in het eerste lid,
      over op de Minister.


