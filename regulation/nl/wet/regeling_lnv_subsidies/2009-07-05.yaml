  - number: 4:53
    text: |-
      1 De Minister kan op aanvraag subsidie verstrekken in de vorm van een garantstelling voor de terugbetaling van
      leningen die naar het oordeel van de Minister gericht zijn op investeringen als bedoeld in de artikelen 25 en 35
      van verordening nr. 1198/2006, met inachtneming van de bepalingen van deze paragraaf, de bepalingen van verordening
      nr. 1198/2006 en de relevante Europese richtsnoeren.

      2 De garantstelling kan worden verstrekt aan een ondernemer die eigenaar of reder is van een vissersvaartuig
      dat behoort tot het segment MFL 1 of MFL 2, een tonnage heeft van minder dan 1.200 BT en waarvoor een
      garnalenvergunning is verleend of een contingent is toegekend.

      3 Geen garantstelling wordt verstrekt:

      a. aan ondernemingen, bedoeld in punt 2.1 van de Mededeling van de Commissie aangaande Communautaire richtsnoeren
      inzake reddings- en herstructureringssteun aan ondernemingen in moeilijkheden (OJ C 244, 1.10.2004, p. 2);

      b. voor de terugbetaling van leningen die gericht zijn op de herfinanciering van schulden, daaronder mede begrepen
      niet door een kredietinstelling verstrekte leningen alsmede leningen welke worden aangegaan om kapitaalbehoefte,
      ontstaan door het uittreden van een commanditaire vennoot uit een commanditaire vennootschap te dekken, behoudens
      ingeval van overmacht;

      c. voor de terugbetaling van leningen indien ten aanzien van de investeringen door de aanvrager reeds
      verplichtingen zijn aangegaan voordat de ontvangst van de aanvraag door de Minister schriftelijk is bevestigd;

      d. voor de terugbetaling van leningen indien ten aanzien van de investeringen door een kredietinstelling reeds
      een lening is verstrekt of onvoorwaardelijk is toegezegd voordat de ontvangst van de aanvraag door de Minister
      schriftelijk is bevestigd;

      e. voor de terugbetaling van leningen met betrekking tot een visserijonderneming die wordt uitgeoefend door
      een commanditaire vennootschap, tenzij uit de betrokken vennootschapsovereenkomst blijkt dat deze ten minste is
      aangegaan voor een periode, overeenkomende met de looptijd van de lening, waarvoor de aanvraag wordt ingediend, en
      in elk geval gedurende deze looptijd niet kan worden opgezegd;

      f. indien reeds een krediet is verstrekt voor dezelfde investering op basis van andere garantstellingen door de
      overheid;

      g. indien aan de aanvrager in het tijdvak van twee jaren voorafgaand aan de datum van ontvangst van de aanvraag
      reeds een garantstelling op grond van deze regeling is verstrekt;

      h. indien het bancair aansprakelijk vermogen van de aanvrager minder dan 5 % bedraagt van het balanstotaal.

      4 [Artikel 1:2, tweede lid][ref1], is niet van toepassing.


