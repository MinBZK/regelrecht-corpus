    text: |-
      1 De subsidie bedraagt ten hoogste 40% van de subsidiabele kosten, met dien verstande dat de subsidie voor de
      activiteiten bedoeld in [artikel 5:3, tweede lid, onderdeel a][ref1], ten hoogste € 20.000 bedraagt.

      2 Indien het gaat om subsidie verleend voor de activiteit, bedoeld in [artikel 5:3, tweede lid, onderdeel c][ref2],
      is het subsidiebedrag niet hoger dan 50% van de subsidiabele kosten met dien verstande dat de subsidie ten hoogste
      € 1.500 bedraagt.


