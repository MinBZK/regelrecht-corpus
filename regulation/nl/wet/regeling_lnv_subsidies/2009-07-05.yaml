  - number: 2:58
    text: |-
      1 De Minister kan aan een producentengroepering subsidie verstrekken voor activiteiten die bedoeld zijn om
      consumenten aan te zetten tot aankoop van landbouwproducten die vallen onder een voedselkwaliteitsregeling, al dan
      niet via distributeurs of verwerkers van die producten.

      2 De activiteiten vestigen de aandacht op specifieke kenmerken van producten die voortvloeien uit
      voedselkwaliteitsregelingen, waaronder met name de kwaliteit, productiemethode, het niveau van dierenwelzijn en
      milieuvriendelijkheid.

      3 Geen subsidie wordt verstrekt voor activiteiten:

      a. ter promotie van geregistreerde merken;

      b. waarmee de consument ertoe wordt aangezet om een product te kopen vanwege de specifieke herkomst van het
      product;

      c. waarbij de verwijzing naar de oorsprong van een product niet ondergeschikt is aan de hoofdboodschap van de
      activiteiten;

      d. waarvoor reeds subsidie is verstrekt ter uitvoering van [verordening (EG) nr. 2826/2000](32000R2826) van de Raad
      van de Europese Unie betreffende voorlichtings- en afzetbevorderingsacties voor landbouwproducten op de binnenmarkt
      (PbEG L 328);

      e. die worden uitgevoerd buiten de Europese Unie.

      4 Het derde lid, aanhef in samenhang met onderdeel b, is niet van toepassing ingeval het gaat om producten waarvoor
      een kwaliteitsschema is erkend in het kader van:

      a. titel VI van [verordening (EG) nr. 1493/1999](31999R1493) van de Raad van de Europese Unie van 17 mei 1999
      houdende een gemeenschappelijke ordening van de wijnmarkt (PbEG L 179);

      b. [verordening (EG) nr. 510/2006](32006R0510) van de Raad van de Europese Unie van 20 maart 2006 inzake de
      bescherming van geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU
      L 93).
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel258
  - number: 2:59
    text: |-
      De subsidieontvanger:

      a. zendt het materiaal dat hij voornemens is te gebruiken bij de activiteiten aan de Directeur van de Dienst
      Regelingen, en

      b. gebruikt het materiaal uitsluitend binnen de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel259
  - number: 2:60
    text: |-
      De volgende kosten komen in aanmerking voor de subsidie:

      a. kosten voor het verspreiden van technische en wetenschappelijke kennis over producten die het voorwerp zijn van
      een voedselkwaliteitsregeling;

      b. kosten voor de organisatie van of deelname aan beurzen, tentoonstellingen of vergelijkbare public relations-
      evenementen die betrekking hebben op producten die het voorwerp zijn van een voedselkwaliteitsregeling;

      c. kosten voor het adverteren via diverse media of bij verkooppunten over producten die het voorwerp zijn van een
      voedselkwaliteitsregeling;

      d. kosten voor marktverkenning.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel260
  - number: 2:61
    text: De subsidie bedraagt ten hoogste 70% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel261
  - number: 2:62
    text: |-
      Ter verbetering van de bedrijfsstructuur van de glastuinbouwsector kan de Minister aan eigenaren van glasopstanden
      die hun onderneming staken subsidie verstrekken voor de afbraak van verouderde glasopstanden en daarbij behorende
      bedrijfsgebouwen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel262
  - number: 2:63
    text: |-
      [Artikel 1:6][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel16
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel263
    references:
