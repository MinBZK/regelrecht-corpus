  - number: 4:47
    text: |-
      1 De Minister kan aan een visserijonderneming of samenwerkingsverband van deze ondernemingen subsidie verstrekken
      voor de uitvoering van een project betreffende nieuwe voorzieningen aan de wal ten behoeve van de verwerking
      en afzet van visserijproducten met het doel het productieproces duurzamer te maken en de kwaliteit van
      visserijproducten te verbeteren.

      2 De nieuwe voorzieningen aan de wal, bedoeld in het eerste lid, zijn met name gericht op:

      a. productie van kwalitatief hoogwaardige producten voor nichemarkten;

      b. een beter gebruik van weinig benutte soorten, bijproducten en afval;

      c. productie of afzet van nieuwe producten, toepassing van nieuwe technologieën of ontwikkeling van innovatieve
      productiemethoden.

      3 Subsidie wordt enkel verleend aan kleine, middelgrote en micro-ondernemingen en aan ondernemingen die minder dan
      750 werknemers hebben of een omzet van minder dan 200 miljoen euro hebben en die investeringen doen ten behoeve van
      een project als bedoeld in het eerste lid.

      4 Geen subsidie wordt verstrekt voor investeringen:

      a. die betrekking hebben op visserijproducten die bestemd zijn om te worden gebruikt en te worden verwerkt voor
      andere doeleinden dan menselijke consumptie, behalve indien het gaat om investeringen die uitsluitend zijn bestemd
      voor de behandeling, de verwerking en de afzet van afval van visserijproducten;

      b. die er op gericht zijn om te voldoen aan verplichte EG-normen inzake het milieu, de gezondheid van mens en dier,
      de hygiëne of het dierenwelzijn;

      c. ten behoeve van de kleinhandel.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel447
  - number: 4:48
    text: |-
      1 De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft, naar het oordeel van de Minister:

      a. meer bijdraagt aan de duurzaamheid van het productieproces in de keten;

      b. meer bijdraagt aan de kwaliteit van het product;

      c. is gericht op bevordering van duurzame werkgelegenheid in de visserijsector;

      d. wordt uitgevoerd door kleine en micro-ondernemingen;

      e. wordt uitgevoerd door een samenwerkingsverband van visserijondernemingen.

      2 Voor zover een aanvraag betrekking heeft op de ontwikkeling van innovatieve productiemethoden, betrekt de
      Minister in aanvulling op het eerste lid bij de rangschikking de mate waarin het project:

      a. een innovatief karakter heeft;

      b. meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;

      c. een groter uitstralingseffect heeft voor toepassing door andere ondernemingen.

      3 Het Visserij Innovatie Platform is een beoordelingscommissie als bedoeld in [artikel 1:4, derde lid][ref2], en
      adviseert de Minister over de rangschikking van aanvragen.

      4 De Minister kan in afwijking van het tweede lid voor specifieke categorieën aanvragen een andere
      beoordelingscommissie instellen.


