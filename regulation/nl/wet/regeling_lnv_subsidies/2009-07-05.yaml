  - number: 2:79
    text: |-
      1 De garantstelling bedraagt ten hoogste € 600.000.

      2 In afwijking van het eerste lid, bedraagt de garantstelling ten hoogste € 1.200.000 ingeval een aanvraag tot
      garantstelling is ingediend door een natuurlijke persoon die op het tijdstip van ontvangst van de aanvraag ten
      hoogste 39 jaar oud is, en die tot doel heeft voor het eerst voor eigen rekening en risico een landbouwonderneming
      te stichten of over te nemen die hij:

      a. alleen in eigendom, pacht of erfpacht krijgt, of

      b. volledig in eigendom, pacht of erfpacht krijgt met een andere natuurlijke persoon die op het tijdstip van
      ontvangst van de aanvraag ten hoogste 39 jaar oud is en die niet eerder een landbouwonderneming volledig in
      eigendom, pacht of erfpacht heeft gehad.

      3 De garantstelling bedraagt ten hoogste twee derde van de financieringen die benodigd zijn voor de investeringen,
      opgenomen in het investeringsplan, bedoeld in [artikel 2:75, eerste lid, onderdeel a][ref1], verminderd met de
      eigen beschikbare middelen, rekening houdende met de financieringsmogelijkheden op basis van beschikbare zekerheden
      en de wijze waarop de beschikbare eigen middelen optimaal kunnen worden aangewend.

      4 De hoogte van de garantstelling vermindert naar rato van de aflossingen die worden gedaan op de lening
      waarop de garantstelling betrekking heeft, volgens het aflossingsschema dat is vastgesteld bij verlening van de
      garantstelling.

      5 Ingeval de kredietinstelling nakoming vordert van de garantstelling, wordt ten hoogste vier vijfde van de
      restantschuld van de lening waarop de garantstelling betrekking heeft uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel275
