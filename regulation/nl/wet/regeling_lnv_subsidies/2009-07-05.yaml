    text: |-
      1 Indien in deze regeling is bepaald dat een subsidie ten hoogste een bepaald bedrag of percentage van de
      subsidiabele kosten bedraagt, wordt het subsidiebedrag bepaald met inachtneming van dat bedrag of percentage,
      tenzij de Minister bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], een lager subsidiebedrag of
      lager percentage heeft vastgesteld.

      2 Ingeval in deze regeling niet is bepaald welk bedrag of percentage van de subsidiabele kosten een subsidie
      bedraagt, bedraagt de subsidie ten hoogste 100% van de subsidiabele kosten.

      3 Ingeval een activiteit gedeeltelijk uit andere hoofde wordt gesubsidieerd, wordt op grond van deze regeling een
      zodanig subsidiebedrag vastgesteld dat het totaal van alle subsidies voor die activiteit niet hoger is dan het
      totale subsidiebedrag dat op grond van deze regeling kan worden verstrekt.

      4 Indien subsidies worden verstrekt voor investeringen door een landbouwonderneming op
      grond van [artikel 2:42][ref2] of [artikel 2:47][ref3], of voor investeringen als bedoeld in
      [Hoofdstuk 1 of 4 van Bijlage 2][ref4], bedraagt het totaal van de subsidies die tijdens een periode van drie
      fiscale jaren aan de landbouwonderneming voor desbetreffende activiteiten wordt toegekend ingevolge artikel 4 van
      verordening (EG) nr. 1857/2006 niet meer dan € 400.000 of € 500.000 indien de landbouwonderneming is gevestigd in
      een probleemgebied.


