  - number: 2:27
    text: |-
      1 Ter stimulering van het innovatieve vermogen in de landbouwsector of de bosbouwsector kan de Minister subsidie
      verstrekken voor de uitvoering van een innovatieproject aan:

      a. een landbouwonderneming, agro-MKB-onderneming of bosbouwonderneming, of

      b. een samenwerkingsverband van ondernemingen als bedoeld in onderdeel a die voor gezamenlijke rekening en risico
      het project uitvoeren.

      2 Geen subsidie wordt verstrekt voor activiteiten waarvan de subsidiabele kosten in totaal minder bedragen dan
      € 10.000.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel227
  - number: 2:28
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      subsidie betrekking heeft:

      a. een meer innovatief karakter heeft;

      b. meer economisch of technisch perspectief heeft op toepassing op praktijkschaal, en

      c. een groter uitstralingseffect kan hebben voor toepassing door andere ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel14
