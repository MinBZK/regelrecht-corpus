    text: |-
      1 De subsidieontvanger voert het project uit:

      a. in Nederland, behoudens toestemming van de Minister tot gedeeltelijke uitvoering buiten Nederland, en

      b. binnen drie jaar na de datum waarop de beschikking tot subsidieverlening is gegeven.

      2 De subsidieontvanger maakt de kennis en informatie die met het project worden opgedaan onmiddellijk na afloop
      van het project openbaar, tenzij hij in de aanvraag tot subsidieverlening heeft gekozen voor vaststelling van een
      subsidiebedrag overeenkomstig [artikel 2:31, eerste lid, onderdeel b][ref1].


