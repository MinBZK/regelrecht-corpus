        artikel: 1:16
        hoofdstuk: '1'
  - number: 2:22
    text: |-
      1 De Minister kan op aanvraag een voucher verstrekken aan een landbouwonderneming of agro-MKB-onderneming voor
      de uitvoering van een activiteit die is gericht op de beantwoording van een toepassingsgerichte kennisvraag
      met betrekking tot voor de onderneming relevante nieuwe kennis over producten, processen of diensten door een
      kennisinstelling.

      2 Er wordt geen voucher verstrekt aan een onderneming die in de drie jaar, voorafgaand aan de ontvangstdatum van
      de aanvraag tot verstrekking van een voucher, de minimis-steun als bedoeld in artikel 3 van [verordening (EG) nr.
      1860/2004](32004R1860) van de Commissie van de Europese Gemeenschappen van 6 oktober 2004 betreffende de toepassing
      van de artikelen 87 en 88 van het EG-Verdrag op de de minimis-steun in de landbouwsector en de visserijsector (PbEU
      L 325) heeft ontvangen.

      3 Er wordt geen voucher verstrekt aan een onderneming die in het jaar, voorafgaand aan de ontvangstdatum van de
      aanvraag tot verstrekking van een voucher, van een bestuursorgaan een document heeft ontvangen dat kan worden
      ingeleverd bij een kennisinstelling ten behoeve van de uitvoering van een activiteit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel222
  - number: 2:23
    text: |-
      1 Een voucher kan uitsluitend worden aangevraagd indien de Minister heeft vastgesteld:

      a. in welke periode de voucher kan worden aangevraagd;

      b. hoeveel vouchers beschikbaar zijn, en

      c. welke activiteiten tegen welke kosten in ruil voor de vouchers kunnen worden uitgevoerd.

      2 De Minister bepaalt per aanvraagperiode tot welke datum de in die aanvraagperiode verstrekte vouchers kunnen
      worden ingeleverd bij een kennisinstelling.

      3 De Minister maakt een besluit als bedoeld in dit artikel bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel223
  - number: 2:24
    text: |-
      [Artikel 1:5][ref1] is van overeenkomstige toepassing op de aanvraag tot verstrekking van een voucher.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel15
