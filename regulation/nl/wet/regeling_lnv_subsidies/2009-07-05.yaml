  - number: 2:17
    text: De aanvraag tot subsidieverlening gaat vergezeld van een op het project toegesneden communicatieplan.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel217
  - number: 2:18
    text: |-
      1 De subsidieontvanger voert het project in Nederland uit, behoudens toestemming van de Minister tot gedeeltelijke
      uitvoering buiten Nederland.

      2 De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van drie jaar.

      3 De subsidieontvanger maakt de kennis en informatie die met het project zijn opgedaan onmiddellijk na afloop van
      het project openbaar in ten minste één vakblad.

      4 De Minister kan de subsidieontvanger aanvullende verplichtingen opleggen omtrent de wijze waarop de
      openbaarmaking, bedoeld in het tweede lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel218
  - number: 2:19
    text: |-
      Indien het in de beschikking tot subsidieverlening vermelde subsidiebedrag € 125.000 of meer bedraagt, kan in de
      beschikking tot subsidieverlening worden bepaald dat de aanvraag tot subsidievaststelling vergezeld gaat van een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel219
  - number: 2:20
    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      b. opleidings- en trainingskosten van de met de uitvoering van het project belaste personen;

      c. kosten van leveringen van materiaal en diensten door derden;

      d. kosten voor het verstrekken van informatie en het verzorgen van publiciteit;

      e. kosten van huur of huurkoop van voor het project noodzakelijke bedrijfsmiddelen, waaronder onroerende zaken;

      f. loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;

      g. kosten van eigen arbeid van de betrokken ondernemer, in afwijking van
      [artikel 2:2, aanhef in samenhang met onderdeel d][ref1];

      h. uitvoeringskosten, zoals reiskosten en de kosten van de huur van vergaderzalen;

      i. kosten van de voor de subsidievaststelling benodigde accountantsverklaring.

      2 De volgende kosten komen niet in aanmerking voor de subsidie:

      a. overheadkosten;

      b. kosten voor de aankoop van bedrijfsmiddelen, met uitzondering van huurkoop;

      c. de kosten die betrekking hebben op het kunnen indienen van een voldoende gespecificeerde aanvraag;

      d. ten behoeve van de financiering van het project te betalen rente en kosten.

      3 Ingeval wordt aangetoond dat een bedrijfsmiddel een noodzakelijk onderdeel is van het demonstratieproject en niet
      op andere wijze kan worden verkregen dan door de subsidie, is het tweede lid, aanhef in samenhang met onderdeel b,
      niet van toepassing, met dien verstande dat uitsluitend voor de subsidie in aanmerking komt het bij de aanvraag tot
      subsidievaststelling aangegeven verschil tussen de aankoopprijs en:

      a. de gerealiseerde verkoopprijs, ingeval deze hoger is dan de getaxeerde verkoopprijs zoals deze is vastgesteld
      voor de datum waarop de uitvoering van het project is voltooid;

      b. de getaxeerde verkoopprijs, bedoeld in onderdeel a, in andere gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel22
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 2:2
        hoofdstuk: '2'
  - number: 2:21
    text: |-
      1 De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten.

      2 Indien het project wordt uitgevoerd door een samenwerkingsverband van landbouwondernemingen, bedraagt de subsidie
      in afwijking van het eerste lid ten hoogste 70% van de subsidiabele kosten.

      3 Ingeval aan een landbouwonderneming subsidie is verleend voor een project dat gedeeltelijk uit andere hoofde
      wordt gesubsidieerd, wordt in afwijking van [artikel 1:16, derde lid][ref1], een zodanig subsidiebedrag vastgesteld
      dat het totaal van alle subsidies voor dat project niet hoger is dan 90% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel116
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel221
    references:
