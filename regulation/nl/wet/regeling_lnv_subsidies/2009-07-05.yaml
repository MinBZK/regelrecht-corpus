  - number: 2:64
    text: |-
      1 De subsidieontvanger draagt er zorg voor dat binnen een jaar na de datum van subsidieverlening:

      a. de glasopstanden, de daarbij behorende bedrijfsgebouwen, overige vaste installaties en ondergrondse
      voorzieningen worden afgebroken en verwijderd, alsmede nieuwe sloten worden gegraven;

      b. hij en in voorkomend geval diens echtgenoot, geregistreerde partner of aandeelhouders, de bedrijfsmatige
      glastuinbouw definitief staakt, onderscheidenlijk staken, en

      c. de tot uitoefening van de betrokken glastuinbouwonderneming bestemde gronden gebruiksvrij worden overgedragen
      aan een natuurlijke persoon of rechtspersoon, niet zijnde een vennootschap waarin de stakende eigenaar aandelen
      heeft.

      2 De overdracht, bedoeld in het eerste lid, onderdeel c, vindt plaats door middel van:

      a. overdracht van eigendom;

      b. vestiging van erfpacht;

      c. vestiging van een recht van opstal, of

      d. vestiging van een pachtrecht.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel264
  - number: 2:65
    text: |-
      De aanvraag tot subsidievaststelling wordt ingediend binnen vier maanden nadat de overdracht van gronden, bedoeld
      in [artikel 2:64, eerste lid, onderdeel c][ref1], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel264
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel265
