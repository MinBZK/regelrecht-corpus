      In afwijking van [artikel 2:38][ref1] gaat de aanvraag tot verlening van een subsidie als bedoeld in
      [artikel 2:42, eerste lid][ref2], vergezeld van:

      a. een investeringsplan, waarin de investeringen waarvoor de subsidie wordt aangevraagd zijn opgenomen en waaruit
      blijkt hoe die investeringen bijdragen aan de doelstellingen, genoemd in [artikel 2:37, eerste lid][ref3];

      b. een verklaring van een bank dat de onderneming levensvatbaar is.


