      1 Een aanvraag tot subsidieverlening gaat vergezeld van een werkprogramma.

      2 Het werkprogramma bevat in ieder geval:

      a. een beschrijving van de werkzaamheden en activiteiten van de instelling voor het kalenderjaar waarop de aanvraag
      betrekking heeft;

      b. een beschrijving van de financiële gevolgen van de werkzaamheden en de activiteiten;

      c. een meerjarenperspectief;

      d. een plan voor de uitvoering van een evaluatie waarin wordt aangegeven in hoeverre de beoogde doelen bereikt
      zijn.
