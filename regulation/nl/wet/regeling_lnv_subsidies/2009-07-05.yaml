  - number: 5:7
    text: De subsidieontvanger voert de activiteiten, waarvoor subsidie is verleend, vóór 30 september 2010 uit.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel57
  - number: 5:8
    text: |-
      1 In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling ingediend binnen
      één maand na afloop van de activiteit waarvoor subsidie is verleend.

      2 De aanvraag tot subsidievaststelling voor de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel a en onderdeel b][ref2], gaat vergezeld van:

      a. facturen of andere schriftelijke bewijsstukken, waarop prijzen inclusief en exclusief BTW worden opgevoerd,
      waaruit blijkt dat de investering(en) volgens de offerte is of zijn gedaan en waarop in ieder geval de typering van
      het product en het onderscheid tussen kostenonderdelen is aangegeven, en

      b. bankafschriften waaruit de betaling van de facturen blijkt.

      3 De aanvraag tot subsidievaststelling voor de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel c][ref3], gaat vergezeld van:

      a. facturen of andere schriftelijke bewijsstukken, waarop prijzen inclusief en exclusief BTW worden opgevoerd;

      b. bankafschriften waaruit de betaling van de facturen blijkt, en

      c. een bewijs van deelname aan de opleiding, training of voorlichtingsbijeenkomst of in het geval van een
      bedrijfsconsult een op schrift gesteld advies aan de begunstigde.


