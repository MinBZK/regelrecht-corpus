  - number: 3:17
    text: |-
      1 De aanvraag tot subsidievaststelling gaat vergezeld van een accountantsverklaring.

      2 In afwijking van [artikel 1:14][ref1] en het eerste lid, wordt, indien er sprake is van een specifieke
      uitkering in de zin van de Financiële-verhoudingswet of indien de subsidieontvanger een openbaar lichaam is, dat
      met toepassing van de Wet gemeenschappelijke regelingen is ingesteld, een subsidievaststelling aangevraagd door
      verantwoordingsinformatie aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties te verstrekken, op een
      wijze als bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
