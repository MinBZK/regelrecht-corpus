    text: |-
      1 De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van ten hoogste drie jaar.

      2 In afwijking van het eerste lid kan de Minister voor de uitvoering van het project een kortere termijn dan drie
      jaar vaststellen.

      3 De subsidieontvanger voert het project uit in Nederland, behoudens toestemming van de Minister tot uitvoering
      buiten Nederland.

      4 Het project gaat gepaard met naar het oordeel van de Minister adequate wetenschappelijke begeleiding.

      5 De subsidieontvanger maakt de kennis en informatie die met het project worden opgedaan onmiddellijk na afloop van
      het project openbaar in een verslag dat naar het oordeel van de Minister van afdoende kwaliteit is.

      6 De Minister kan de subsidieontvanger aanvullende verplichtingen opleggen omtrent de wijze waarop de
      openbaarmaking, bedoeld in het vierde lid, plaatsvindt.
