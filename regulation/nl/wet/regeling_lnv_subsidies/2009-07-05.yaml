  - number: 3:23
    text: |-
      De Stichting draagt er zorg voor dat:

      a. op tenminste de helft van het aantal beschermde historische buitenplaatsen onderhoudswerkzaamheden ter
      uitvoering van projecten als bedoeld in [artikel 3:21, derde lid, onderdeel a][ref1];

      b. tenminste vijftien projecten, als bedoeld in [artikel 3:21, derde lid, onderdeel b][ref2],

      worden uitgevoerd.


