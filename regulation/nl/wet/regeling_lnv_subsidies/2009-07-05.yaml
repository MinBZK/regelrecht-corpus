  - number: 4:5
    text: |-
      1 De subsidieontvanger is verplicht om binnen drie maanden, te rekenen vanaf de datum van de beschikking tot
      subsidieverlening, ervoor zorg te dragen dat:

      a. hetzij de sloop van het vissersvaartuig, hetzij de definitieve bestemming van het vissersvaartuig voor andere
      doeleinden dan de visserij heeft plaatsgevonden, waarbij in het laatstbedoelde geval de op het vissersvaartuig
      aanwezige vistuigen en de overige apparatuur specifiek bestemd en geschikt voor de visserij zijn verwijderd;

      b. het registratienummer van het vissersvaartuig, bedoeld in
      [artikel 9, eerste lid, van de Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1]
      is verwijderd;

      c. de inschrijving van het vissersvaartuig in het register, bedoeld in [artikel 4 van het besluit][ref2], is
      doorgehaald;

      d. de teboekstelling van het vissersvaartuig in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3], ongedaan is gemaakt;

      e. het vaartuig wordt ingeschreven in het register van de lidstaat van de Europese Unie onder de vlag
      van welke het vaartuig wordt gebracht, indien de visserijactiviteit wordt beëindigd overeenkomstig
      [artikel 4:2, tweede lid, onderdeel b][ref4].

      2 De Minister kan de in het eerste lid genoemde termijn op een met redenen omkleed verzoek van de subsidieontvanger
      eenmalig met ten hoogste vier weken verlengen.

      3 In geval van definitieve beëindiging als bedoeld in [artikel 4:2, tweede lid, onderdeel b][ref5], is de
      subsidieontvanger verplicht om ervoor zorg te dragen dat het vaartuig niet op enig tijdstip terugkeert in de
      hoedanigheid van vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel9
