  - number: 2:30
    text: |-
      De volgende kosten komen in aanmerking voor de subsidie:

      a. loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;

      b. aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces-en ketenmanagement, de
      verwerving van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die rechten, met
      uitzondering van winstopslagen bij transacties binnen een groep;

      c. de kosten van aangeschafte machines en apparatuur, gebaseerd op historische aanschafprijzen of de aan het
      project toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij transacties
      binnen een groep, tot ten hoogste 50%.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel230
  - number: 2:31
    text: |-
      1 De subsidie bedraagt ten hoogste:

      a. 50% van de subsidiabele kosten tot en met € 900.000 en 25% van de subsidiabele kosten boven € 900.000, of

      b. 25% van de subsidiabele kosten, ingeval de subsidieontvanger ervoor kiest de kennis en informatie die met het
      project worden opgedaan niet openbaar te maken.

      2 De subsidie bedraagt ten hoogste € 1.000.000.

      3 Ingeval aan een landbouwonderneming subsidie is verleend voor een project dat gedeeltelijk uit andere hoofde
      wordt gesubsidieerd, wordt in afwijking van [artikel 1:16, derde lid][ref1], een zodanig subsidiebedrag vastgesteld
      dat het totaal van alle subsidies voor dat project niet hoger is dan 75% van de subsidiabele kosten.


