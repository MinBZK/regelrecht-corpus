    text: |-
      1 De Minister kan subsidie verstrekken voor de uitvoering van een project dat is gericht op de algemene bevordering
      van kwaliteit en rendement of op de ontwikkeling van nieuwe markten voor visserijproducten en dat met name één van
      de volgende activiteiten omvat:

      a. het voorzien van de markt met soorten waarvan er een overschot is of die onderbevist zijn, die normaliter worden
      teruggegooid of die geen handelswaarde hebben;

      b. de uitvoering van een kwaliteitsbeleid voor visserijproducten;

      c. de bevordering van de afzet van producten die zijn verkregen met methoden met een gering milieueffect;

      d. de bevordering van de afzet van producten die zijn erkend op grond van verordening nr. 510/2006;

      e. kwaliteitscertificering, met inbegrip van het creëren van etiketten en de certificering van producten die zijn
      gevangen of gekweekt met milieuvriendelijke productiemethoden;

      f. de bevordering van traceerbaarheid van visserijproducten;

      g. de uitvoering van marktonderzoeken.

      2 Voor de subsidie komen in aanmerking:

      a. een visserijonderneming of een erkende beroepsorganisatie;

      b. een samenwerkingsverband van aanvragers als bedoeld in onderdeel a, of

      c. een samenwerkingsverband van aanvragers als bedoeld in onderdeel a met een maatschappelijke organisatie op het
      gebied van visserij.

      3 Geen subsidie wordt verstrekt voor projecten:

      a. die zijn gericht op handelsmerken;

      b. waarin wordt verwezen naar specifieke landen of geografische gebieden, tenzij het producten betreft die zijn
      erkend op grond van verordening nr. 510/2006.
