  - number: 3:41
    text: |-
      1 Een landschapsontwikkelingsplan komt als volgt tot stand:

      a. het wordt opgesteld door een bureau waarbij ten minste één tuin- en landschapsarchitect werkzaam is die
      ingevolge de [Wet op de architectentitel][ref1] is ingeschreven in het architectenregister en die actief
      participeert in het opstellen van het landschapsontwikkelingsplan;

      b. het wordt vastgesteld dan wel goedgekeurd door de gemeenteraad van de gemeente of gemeenten op welker
      grondgebied het plan betrekking heeft, of door Provinciale Staten van een provincie ingeval het een aanvraag van
      een provincie betreft.

      2 In een landschapsontwikkelingsplan wordt aandacht besteed aan de volgende aspecten van het landschap:

      a. de opbouw van het landschap;

      b. de identiteit en verscheidenheid van het landschap, gerelateerd aan kenmerkende landschappen in Nederland;

      c. het watersysteem;

      d. de visuele kenmerken;

      e. de betekenis van de gebruiksfuncties, inclusief verwachte ontwikkelingen, voor het landschap en omgekeerd;

      f. de cultuurhistorische en aardkundige waarden;

      g. de ecologische waarden;

      h. de culturele vernieuwing van het landschap, waaronder de toepassing van landschapsarchitectuur en beeldende
      kunst;

      i. de omvang en de landschappelijke en ecologische kwaliteit van opgaande begroeiing;

      j. de omvang en kwaliteit van de recreatieve ontsluiting en de toegankelijkheid en bereikbaarheid, en

      k. de waardering van het landschap door gebruikers.

      3 Een landschapsontwikkelingsplan bevat de volgende onderdelen:

      a. een kwantitatieve en kwalitatieve systematische beschrijving en analyse van het bestaande landschap;

      b. een beschrijving van de doelstellingen inzake de ontwikkeling van het landschap;

      c. ten minste twee wezenlijk verschillende visies op hoofdlijnen met een onderbouwde gekozen ontwikkelingsrichting;

      d. een landschapsontwikkelingsvisie waarin wordt aangegeven:

      1°. in welke mate de in het tweede lid genoemde aspecten worden ontwikkeld en beschermd;

      2°. de gebieden en functies met accenten op behoud dan wel vernieuwing, scheiding dan wel combinatie van functies;

      e. een uitvoeringsplan waarin op basis van de in ondereel d genoemde landschapsontwikkelingsvisie zijn aangegeven:

      1°. de maatregelen voor de uitvoering van de ontwikkeling, bescherming en beheer van het landschap, inclusief een
      tijdsplanning;

      2°. de eisen die bij landschappelijk relevante ingrepen worden gesteld aan te treffen landschappelijke
      voorzieningen;

      3°. de wijze waarop de doorwerking van het landschapsontwikkelingsplan in het bestemmingsplan en in de
      vergunningverlening wordt gerealiseerd, inclusief een tijdsplanning;

      f. een financieringsplan waarin toegezegde bijdragen van derden worden gekoppeld aan de realisering van het in
      onderdeel e bedoelde uitvoeringsplan en een tijdsplanning;

      g. een opsomming en omschrijving van activiteiten ter verzekering van het maatschappelijke en financiële draagvlak
      van het betreffende landschapsontwikkelingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0004189
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0004189
  - number: 3:42
    text: |-
      1 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een kaart tot een schaal van 1:100.000 van het gebied waarop het landschapsontwikkelingsplan betrekking zal
      hebben;

      b. een redengeving voor het opstellen van het landschapsontwikkelingsplan;

      c. een sluitende begroting op basis van één uit drie offertes van een bureau als bedoeld in
      [artikel 3:41, eerste lid, onderdeel a][ref1], alsmede een verklaring waarom gekozen is voor de offerte waarop de
      begroting is gebaseerd;

      d. een korte evaluatie van het landschapsontwikkelingsplan, indien een plan herzien wordt.

      2 [Artikel 1:9, tweede lid][ref2], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel19
