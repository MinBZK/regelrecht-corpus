  - number: 1:2
    text: |-
      1 Op grond van deze regeling kan op aanvraag door de Minister subsidie worden verstrekt voor de uitvoering van
      activiteiten in Nederland die bijdragen aan:

      a. de verbetering van het concurrentievermogen van de landbouwsector, bosbouwsector of visserijsector;

      b. het behoud of de verbetering van de natuur en het landelijk en cultureel erfgoed, de ontwikkeling van
      landschapskwaliteit dan wel bevordering van kennis en deskundigheid op het gebied van de recreatie, of

      c. een duurzame exploitatie van de levende aquatische rijkdommen en een duurzame aquacultuur;

      d. het landbouwonderwijs en onderzoek op het terrein van de landbouw, de bosbouw, de natuur, het landschap, de
      visserij en de openluchtrecreatie.

      2 Subsidie kan uitsluitend worden verstrekt voor activiteiten die zijn aangevangen op of na de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel12
  - number: 1:3
    text: |-
      1 Op grond van deze regeling kan uitsluitend subsidie worden verstrekt indien de Minister de mogelijkheid tot het
      doen van een aanvraag tot subsidieverlening heeft opengesteld door vaststelling van een subsidieplafond en een
      periode voor indiening van de aanvraag.

      2 De Minister kan de openstelling beperken tot bepaalde activiteiten, categorieën van aanvragers of een bepaald
      aantal aanvragen.

      3 De Minister kan verschillende subsidieplafonds vaststellen voor verschillende activiteiten of categorieën van
      aanvragers.

      4 De Minister maakt een besluit als bedoeld in dit artikel bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel13
  - number: 1:4
    text: |-
      1 De Minister rangschikt aanvragen tot subsidieverlening die in een zelfde aanvraagperiode zijn ingediend, waarbij
      een aanvraag hoger wordt gerangschikt naarmate de activiteit waarop deze betrekking heeft naar het oordeel van de
      Minister een grotere bijdrage levert aan de doelstelling van de subsidie.

      2 Volgens de rangschikking, bedoeld in het eerste lid, komt de hoogst gerangschikte aanvraag het eerst voor
      subsidie in aanmerking.

      3 De Minister kan één of meer beoordelingscommissies instellen die tot taak hebben aanvragen overeenkomstig het
      tweede lid te beoordelen en hierover advies uit te brengen aan de Minister.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel14
  - number: 1:5
    text: |-
      1 In afwijking van [artikel 1:4][ref1] is het onderhavige artikel van toepassing, ingeval dit in deze regeling van
      toepassing is verklaard.

      2 De Minister rangschikt aanvragen tot subsidieverlening die in een zelfde aanvraagperiode zijn ingediend door
      loting.

      3 Volgens de rangschikking, bedoeld in het tweede lid, komt de hoogst gerangschikte aanvraag het eerst voor
      subsidie in aanmerking.


