        artikel: 1:14
        hoofdstuk: '1'
  - number: 3:31
    text: |-
      1 In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling ingediend binnen
      twee maanden na afloop van de werkzaamheden waarvoor subsidie is verleend.

      2 De aanvraag gaat vergezeld van een accountantsverklaring ingeval de subsidiabele kosten in totaal meer bedragen
      dan € 22.500.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel114
