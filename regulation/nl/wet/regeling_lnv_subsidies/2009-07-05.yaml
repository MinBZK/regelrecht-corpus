    text: |-
      1 Dit artikel is uitsluitend van toepassing op een subsidie die wordt verstrekt ter uitvoering van het
      plattelandsontwikkelingsprogramma.

      2 De subsidie wordt verleend onder voorbehoud dat:

      a. de Commissie van de Europese Gemeenschappen goedkeuring als bedoeld in artikel 18, vierde lid, van [verordening
      (EG) nr. 1698/2005](32005R1698) verleent aan een programma als bedoeld in het eerste lid, en

      b. de activiteit waarop de subsidie betrekking heeft op grond van het programma, bedoeld in onderdeel a, kan worden
      gefinancierd.

      3 Onverminderd de [artikelen 4:35][ref1], [4:48][ref2] en [4:49 van de Algemene wet bestuursrecht][ref3] weigert de
      Minister subsidieverlening of trekt de Minister een subsidieverlening of subsidievaststelling in, indien:

      a. in het kader van de aanvraag met opzet onjuiste of onvolledige gegevens zijn verstrekt;

      b. in het voorafgaande of hetzelfde jaar met opzet onjuiste of onvolledige gegevens zijn verstrekt bij een aanvraag
      tot subsidieverlening of subsidievaststelling met betrekking tot dezelfde activiteit;

      c. de aanvrager kunstgrepen heeft uitgevoerd om aan de eisen voor subsidieverstrekking te kunnen voldoen.

      4 Indien het bij de aanvraag tot subsidievaststelling gevraagde subsidiebedrag meer dan drie procent hoger is
      dan het bedrag dat op grond van deze regeling kan worden verstrekt, wordt een subsidiebedrag vastgesteld dat is
      verlaagd met het verschil tussen die twee bedragen, tenzij de aanvrager aantoont dat de aanvraag buiten zijn schuld
      onjuist is.

      5 Indien subsidie wordt verstrekt voor een investering, wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref4] ingetrokken indien de investering gedurende vijf jaar te
      rekenen vanaf de datum van subsidievaststelling een belangrijke wijziging ondergaat die:

      a. de aard van de investering of de bij of krachtens deze regeling opgelegde uitvoeringsvoorwaarden raakt;

      b. een onderneming of overheidsinstantie onrechtmatig voordeel oplevert, of

      c. het gevolg is hetzij van een verandering in de aard van de eigendom van een infrastructuurvoorziening, hetzij
      van de beëindiging of verplaatsing van productiecapaciteit.

      6 Bijlage VI, onderdelen 2.2 en 3.2, van [verordening (EG) nr. 1974/2006](32006R1974) van de Commissie van de
      Europese Gemeenschappen van 15 december 2006 tot vaststelling van uitvoeringsbepalingen van [Verordening (EG) nr.
      1698/2005](32005R1698) van de Raad van de Europese Unie inzake steun voor plattelandsontwikkeling uit het Europees
      Landbouwfonds voor Plattelandsontwikkeling (ELFPO) (PbEU L 368) is van toepassing.

      7 In afwijking van [artikel 1:17, eerste lid][ref5], kan de Minister uitsluitend voorschot verlenen voor:

      a. kosten die door de subsidieontvanger zijn gemaakt en betaald alsmede kosten van eigen arbeid van de betrokken
      ondernemer, voor zover die kosten op grond van deze regeling subsidiabel zijn, waarbij het voorschot wordt berekend
      naar rato van gemaakte en betaalde kosten;

      b. kosten van activiteiten die kunnen worden gefinancierd op grond van een programma als bedoeld in het eerste lid
      waarvoor een goedkeuring als bedoeld in het tweede lid, onderdeel a, is verleend.

      8 De Minister wijst subsidies als bedoeld in het eerste lid aan bij de openstelling, bedoeld in
      [artikel 1:3, eerste lid][ref6].

      9 Van de goedkeuring, bedoeld in het tweede lid, onderdeel a, wordt mededeling gedaan in de Staatscourant.


