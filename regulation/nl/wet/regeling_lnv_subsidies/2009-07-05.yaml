        bwb_id: BWBR0021281
        artikel: 4a:3
        hoofdstuk: 4a
  - number: 4a:10
    text: De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a10
  - number: 5:2
    text: |-
      In deze titel wordt verstaan onder:

        - *diversificatie:* geheel van maatregelen die gericht zijn op de duurzame ontwikkeling van de suikerbietenteelt,
      versterking van de suikersector of het ontwikkelen van alternatieven voor de suikerbietenteelt en suikerproductie;
        - *suikersector:* gehele complex van ondernemingen, gericht op de productie van suiker, suikerproducten verwerkende
      ondernemingen en aan de suiker gerelateerde afzet, handel, dienstverlening, logistiek en toeleverende industrie.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel52
  - number: 5:3
    text: |-
      1 De Minister kan subsidie verstrekken aan telers van suikerbieten en samenwerkingsverbanden uit regio’s die
      betrokken zijn bij de herstructurering van de suikersector op grond van Verordening (EG) nr. 320/2006 van de Raad
      van de Europese Unie van 20 februari 2006 tot instelling van een tijdelijke regeling voor de herstructurering van
      de suikerindustrie in de Europese Gemeenschap en tot wijziging van Verordening (EG) nr. 1290/2005 betreffende de
      financiering van het gemeenschappelijk landbouwbeleid (PbEU L 58).

      2 Voor subsidie komen de volgende activiteiten in aanmerking:

      a. het doen van investeringen door suikerbietentelers gericht op diversificatie;

      b. het vormen van samenwerkingsverbanden gericht op innovatieve vormen van productie, verwerking en afzet voor
      suikerbieten;

      c. het ontwikkelen van initiatieven gericht op vakmanschap en management.

      3 De activiteiten, bedoeld in het tweede lid, onderdeel a, leiden tot:

      a. een hoger niveau van diergezondheid in Nederland en daardoor tot een beter technisch en economisch perspectief
      van en continuïteit binnen landbouwondernemingen;

      b. verlaging van de productiekosten;

      c. de verbetering en omschakeling van de productie;

      d. de instandhouding en verbetering van het natuurlijk milieu, de hygiënische omstandigheden, dierenwelzijn,
      voedselveiligheid of duurzaam gebruik van energiebronnen;

      e. herstructurering en ontwikkeling;

      f. verhoging van de kwaliteit en toegevoegde waarde van producten;

      g. verbetering van de arbeidsomstandigheden in de onderneming;

      h. behoud en duurzaam gebruik van biodiversiteit en natuurlijke hulpbronnen;

      i. verhoging van de doelmatigheid bij inzet en gebruik van middelen, machines en menskracht, of

      j. het tot waarde brengen van bij-, rest- en afvalproducten.

      4 De activiteiten, bedoeld in het tweede lid, onderdeel b, hebben betrekking op:

      a. de verwerking of de afzet van suikerbieten, of

      b. de ontwikkeling van nieuwe producten, procédés en technologieën voor suikerbieten.

      5 De activiteiten, bedoeld in het tweede lid, onderdeel c, zien op een bedrijfsconsult of het volgen van
      opleidingen, trainingen of voorlichtingsbijeenkomsten en hebben betrekking op:

      a. de verbetering van de bedrijfsvoering en de verduurzaming daarvan;

      b. het voldoen aan wettelijke normen inzake milieu of waterbeheer, aan veterinaire, sanitaire of fytosanitaire
      regelgeving, aan hygiëne- of dierenwelzijnsregelgeving of aan arbeidsomstandighedenregelgeving;

      c. het verkrijgen of vergroten van kennis waarmee nieuwe of hoogwaardigere producten kunnen worden verkregen of
      deze productiewijzen of productieprocessen kunnen worden verbeterd;

      d. begeleiding bij het starten of beëindigen van de onderneming of een onderdeel daarvan.

      6 Geen subsidie wordt verstrekt voor:

      a. de activiteiten, bedoeld in het tweede lid, onderdeel a en onderdeel b, waarvan de subsidiabele kosten in totaal
      minder bedragen dan € 10.000;

      b. de activiteiten, bedoeld in het tweede lid, onderdeel c, waarvan de subsidiabele kosten in totaal minder
      bedragen dan € 250;

      c. aan ondernemingen als bedoeld in paragraaf 2.1 van de Mededeling van de Commissie van de Europese Gemeenschappen
      van 1 oktober 2004 aangaande communautaire richtsnoeren inzake reddings- en herstructureringssteun aan
      ondernemingen in moeilijkheden (PbEU C 244).
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel53
  - number: 5:4
    text: |-
      1 De volgende kosten voor de uitvoering van de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel a][ref1], komen in aanmerking voor de subsidie:

      a. kosten voor de bouw, inrichting of verbetering van onroerende zaken;

      b. kosten voor verwerving van onroerende zaken, met uitzondering van grond, waarin zijn begrepen de daaraan
      verbonden kosten van overdrachtsbelasting, notariële kosten en de kosten van inschrijving bij het kadaster;

      c. kosten voor de aanschaf van nieuwe machines en apparatuur, waarvan de aanvrager eerste gebruiker is;

      d. kosten voor de aanschaf van plantmateriaal en de kosten van derden voor het planten van blijvende teelten en
      meerjarige gewassen als bedoeld in artikel 2, onderdeel c, onderscheidenlijk onderdeel d, van verordening (EG) nr.
      795/2004 van de Commissie van de Europese Gemeenschappen van 21 april 2004, houdende bepalingen voor de uitvoering
      van de bedrijfstoeslagregeling waarin is voorzien in verordening (EG) nr. 1782/2003 (PbEU L 141).

      2 De volgende kosten voor de uitvoering van de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref2], komen in aanmerking voor de subsidie:

      a. kosten voor de bouw, verwerving, verbetering of inrichting van onroerende goederen, met uitzondering van de
      verwerving van grond;

      b. kosten voor de aankoop of huurkoop van nieuwe machines en apparatuur, inclusief computersoftware tot aan de
      marktwaarde van het goed;

      c. kosten voor de ontwikkeling van nieuwe machines of apparatuur;

      d. kosten voor de ontwikkeling en operationalisering van processen, procédés, technologieën, marketingconcepten,
      product-marktcombinaties en andere innovaties;

      e. algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met d, zoals kosten voor de
      architecten en ingenieurs, honoraria van adviseurs tot een hoogte van 15% van het totale subsidiebedrag,
      haalbaarheidsstudies, accountantsverklaring, verwerven van patenten en vergunningen.

      3 Voor de subsidie voor de uitvoering van activiteiten bedoeld in [artikel 5:3, tweede lid, onderdeel a][ref3],
      komen niet in aanmerking kosten voor de verwerving van onroerende zaken, ten behoeve waarvan subsidie door een
      bestuursorgaan is verleend in de periode van tien jaar voorafgaand aan de ontvangstdatum van de aanvraag tot
      subsidieverlening.

      4 Geen subsidie wordt verstrekt voor kosten voor de uitvoering van de activiteiten, bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref4], met betrekking tot een leasecontract, zoals de marge van de
      leaseorganisatie, herfinancieringskosten, overheadkosten en verzekeringspremies.

      5. Indien subsidie wordt verstrekt voor een investering, wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref5] ingetrokken indien de investering gedurende vijf jaar te
      rekenen vanaf de datum van subsidievaststelling een belangrijke wijziging ondergaat die:

      a. de aard van de investering of de bij of krachtens deze regeling opgelegde uitvoeringsvoorwaarden raakt;

      b. een onderneming of overheidsinstantie onrechtmatig voordeel oplevert, of

      c. het gevolg is hetzij van een verandering in de aard van de eigendom van een infrastructuurvoorziening, hetzij
      van de beëindiging of verplaatsing van productiecapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0021281#Artikel53
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel449
