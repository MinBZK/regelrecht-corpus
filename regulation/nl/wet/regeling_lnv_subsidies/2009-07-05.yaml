  - number: 1:12
    text: |-
      1 De subsidieontvanger voert de activiteiten waarvoor subsidie is verleend uit met inachtneming van:

      a. bij of krachtens deze regeling gestelde vereisten voor of voorwaarden bij subsidieverlening;

      b. overige wettelijke voorschriften die van toepassing zijn op die activiteiten.

      2 De subsidieontvanger voert een administratie die te allen tijde voldoende gegevens bevat voor een juist inzicht
      in de realisatie van de te subsidiëren activiteiten en voor een juiste subsidieverstrekking.

      3 In de administratie, bedoeld in het tweede lid:

      a. zijn alle ontvangsten en uitgaven vastgelegd met de onderliggende bewijsstukken;

      b. zijn bewijsstukken ten name van de subsidieontvanger aanwezig, waaruit de aard van geleverde goederen en
      diensten duidelijk blijkt.

      4 De administratie, bedoeld in het tweede lid, wordt ten minste gedurende vijf jaar na de datum van
      subsidievaststelling bewaard.

      5 De subsidieontvanger verstrekt aan de ambtenaren, bedoeld in [artikel 6:1][ref1], desgevraagd de nodige gegevens
      en bescheiden waaruit blijkt dat wordt voldaan aan de vereisten, voorwaarden of voorschriften, bedoeld in het
      eerste lid.

      6 [Artikel 8 van het Besluit aanbestedingsregels voor overheidsopdrachten][ref2] is van overeenkomstige toepassing
      op de verstrekking van opdrachten voor werken of diensten aan derden door een subsidieontvanger die geen
      aanbestedende dienst als bedoeld in [artikel 1, onderdeel r, van dat besluit][ref3] is.

      7 De Minister kan de subsidieontvanger bij subsidieverlening ook andere verplichtingen opleggen die strekken tot
      verwezenlijking van het doel van de subsidie, waaronder een termijn waarbinnen de activiteiten waarop de subsidie
      betrekking heeft worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0018607#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0018607#Artikel1
