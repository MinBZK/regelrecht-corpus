      1 De Minister kan aan de Stichting Recreatie subsidie verstrekken voor de uitvoering van programma’s die een
      bijdrage leveren aan de bevordering van kennis en deskundigheid op het gebied van de recreatie.

      2 De programma’s hebben betrekking op een kalenderjaar.
