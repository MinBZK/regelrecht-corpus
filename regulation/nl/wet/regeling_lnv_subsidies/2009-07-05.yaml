  - number: 4:7
    text: |-
      1 De Minister bepaalt de maximale hoogte van de subsidie volgens de formule: forfaitair subsidiebedrag per brutoton
      maal brutotonnage van het vissersvaartuig plus een aanvullend bedrag.

      2 De Minister bepaalt de hoogte van het forfaitaire subsidiebedrag per brutoton en van het aanvullende bedrag,
      waarbij een klasse-indeling in brutotonnage kan worden aangehouden.

      3 De formule ter bepaling van de maximale hoogte van de subsidie kan uitgebreid worden om rekening te houden met de
      leeftijd van het vaartuig.

      4 Indien de visserijactiviteit beëindigd wordt overeenkomstig [artikel 4:2, tweede lid, onderdeel b][ref1], wordt
      de subsidie verminderd met de marktwaarde van het vaartuig, die is bepaald in het taxatierapport, bedoeld in
      [artikel 4:6, tweede lid, onderdeel f][ref2].

      5 Indien het vaartuig verloren gaat op een tijdstip tussen het moment van subsidieverlening en de
      subsidievaststelling, wordt de subsidie verminderd met het bedrag van de door de verzekering uitgekeerde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel46
