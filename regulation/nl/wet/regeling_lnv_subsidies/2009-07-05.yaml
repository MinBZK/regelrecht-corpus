  - number: 3:11
    text: |-
      1 De Minister kan subsidie verstrekken voor de uitvoering van activiteiten die zijn gericht op het verminderen of
      ongedaan te maken van de effecten van verzuring, vermesting en verdroging in bestaande bossen of natuurterreinen.

      2 Voor de subsidie komen de volgende activiteiten in aanmerking:

      a. in natuurterreinen of bossen:

      1°. het maaien;

      2°. het geschikt maken voor begrazing;

      3°. het chopperen;

      4°. het plaggen;

      5°. het baggeren;

      6°. het aanleggen van depots ten behoeve van tijdelijke opslag van gemaaid, geplagd of gebaggerd materiaal;

      7°. het verbeteren van de hydrologische situatie;

      8°. het werkzaamheden ten behoeve van het meten en registreren van ontwikkelingen, voorafgaande aan en volgend op
      activiteiten als bedoeld onder 1° tot en met 7°;

      9°. het werkzaamheden ter zake van planvorming en directievoering;

      10°. het aanpassen van de morfologie;

      11°. de toevoer van diasporen en faunamateriaal;

      12°. het beheer van de voedselketen, of

      13°. het verwijderen van bosopslag;

      b. het aanpassen van bosvegetatie door structuurdunning ter verbetering van het bosecosysteem;

      c. het toevoegen van basische stoffen aan natuurterreinen teneinde de mineralenbalans of zuurgraad te herstellen;

      d. experimenten om de werking van andere activiteiten dan de activiteiten, bedoeld in de onderdelen a tot en met c,
      aan te tonen voor zover aannemelijk is dat met die activiteiten de effecten van verdroging, verzuring en vermesting
      in bestaande bossen of natuurterreinen worden verminderd of ongedaan gemaakt;

      e. de activiteiten, bedoeld in onderdeel d, voor zover is aangetoond dat die de effecten van verdroging, verzuring
      en vermesting in bossen of natuurterreinen verminderen of ongedaan maken;

      f. activiteiten die erop zijn gericht de effectiviteit van de activiteiten, bedoeld in de onderdelen a tot en met
      c, te toetsen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel311
  - number: 3:12
    text: |-
      1 Voor subsidie voor de uitvoering van activiteiten als bedoeld in
      [artikel 3:11, tweede lid, onderdelen a, b, c en e][ref1], komen in aanmerking:

      a. een natuurlijke persoon, privaatrechtelijke rechtspersoon, gemeente, provincie, waterschap of een lichaam dat op
      grond van de [Wet gemeenschappelijke regelingen][ref2] rechtspersoonlijkheid bezit en die, onderscheidenlijk dat,
      krachtens eigendom of enig ander zakelijk recht het genot heeft van de bossen of natuurterreinen;

      b. de Unie van Bosgroepen;

      c. de Landschappen.

      2 Voor subsidie voor de uitvoering van activiteiten als bedoeld in
      [artikel 3:11, tweede lid, onderdelen d en f][ref3], komen in aanmerking:

      a. de Vereniging Natuurmonumenten;

      b. de provinciale landschappen, na tussenkomst van de Landschappen;

      c. natuurlijke personen en privaatrechtelijke rechtspersonen als bedoeld in het eerste lid, onderdeel a, na
      tussenkomst van de Unie van Bosgroepen.

      3 Geen subsidie wordt verstrekt:

      a. aan Staatsbosbeheer of voor de uitvoering van activiteiten met betrekking tot terreinen die eigendom zijn van
      Staatsbosbeheer;

      b. voor activiteiten met betrekking tot terreinen die eigendom zijn van andere publiekrechtelijke lichamen dan de
      publiekrechtelijke lichamen, bedoeld in het eerste lid, onderdeel a;

      c. indien de aanvrager krachtens erfpacht het genot heeft van de grond en de duur van de erfpachtovereenkomst
      minder dan 25 jaar bedraagt;

      d. voor activiteiten die in onvoldoende mate bijdragen aan het verminderen of ongedaan maken van effecten van
      verzuring, vermesting of verdroging in bossen en natuurterreinen;

      e. voor activiteiten die onevenredig schade toebrengen aan aanwezige natuurwaarden, of

      f. voor activiteiten waarvan de subsidiabele kosten in totaal minder dan € 5.000 bedragen.


