      subsidieverlening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel357
  - number: 3:58
    text: |-
      De aanvraag tot vaststelling van de subsidie gaat vergezeld van:

      a. een financiële verantwoording van het programma;

      b. een accountantsverklaring ingeval de subsidiabele kosten in totaal meer bedragen dan € 34.035 bedragen;

      c. de eindrapportage van het programma.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel358
  - number: 3:59
    text: |-
      Een beschikking omtrent subsidievaststelling wordt gegeven binnen vier maanden na ontvangst van de aanvraag tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel359
