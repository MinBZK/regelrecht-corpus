      aan de cursus;

      voor de activiteit, bedoeld in [artikel 4:9, eerste lid, onderdeel b][ref2]: 100% van de totale kosten van deelname
      aan de cursus;

      voor de activiteit, bedoeld in [artikel 4:9, eerste lid, onderdeel c][ref3]: € 6.000,– .

      voor de activiteit, bedoeld in [artikel 4:9, eerste lid, onderdeel d][ref4]: € 600,– voor iedere kalendermaand
      gedurende de periode die aanvangt op de eerste dag van de maand waarin de arbeids- of maatschapsovereenkomst is of
      wordt beëindigd en die eindigt op de eerste dag van de maand waarin de 65-jarige leeftijd wordt bereikt.

