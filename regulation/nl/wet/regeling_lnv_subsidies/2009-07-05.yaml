  - number: 2:32
    text: |-
      1 Ter bevordering van de samenwerking tussen landbouwondernemingen, bosbouwondernemingen en agro-MKB-ondernemingen
      kan de Minister subsidie verstrekken ter dekking van de voor de samenwerking gemaakte kosten voor de uitvoering van
      een innovatieproject.

      2 Voor de subsidie komt in aanmerking een samenwerkingsverband van landbouwondernemingen of bosbouwondernemingen
      onderling, dan wel met agro-MKB-ondernemingen, die voor gezamenlijke rekening en risico het project uitvoeren.

      3 Geen subsidie wordt verstrekt:

      a. aan ondernemingen die zijn gericht op onderzoek, scholing, opleiding, voorlichting, advies of begeleiding;

      b. voor projecten waarvan de subsidiabele kosten in totaal minder bedragen dan € 10.000;

      c. voor projecten met een duur van meer dan drie jaar.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel232
  - number: 2:33
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project waarop de
      aanvraag betrekking heeft:

      a. een meer innovatief karakter heeft;

      b. meer economisch of technisch perspectief heeft op toepassing op praktijkschaal;

      c. een groter uitstralingseffect kan hebben voor toepassing door andere ondernemingen, en

      d. een meer duurzaam karakter heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel14
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 1:4
        hoofdstuk: '1'
  - number: 2:34
    text: |-
      1 De subsidieontvanger vangt het project aan binnen zes maanden na de datum van subsidieverlening en voert het
      project uit binnen een periode van drie jaar.

      2 De subsidieontvanger maakt de kennis en informatie die met het project worden opgedaan onmiddellijk na afloop van
      het project openbaar.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel234
  - number: 2:34a
    text: |-
      Indien het in de beschikking tot subsidieverlening vermelde subsidiebedrag € 125.000 of meer bedraagt, kan in de
      beschikking tot subsidieverlening worden bepaald dat de aanvraag tot subsidievaststelling vergezeld gaat van een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel234a
  - number: 2:35
    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. loonkosten van het direct bij de uitvoering van het project betrokken personeel van de subsidieontvanger;

      b. aan derden verschuldigde kosten ter zake van studies, onderzoeksactiviteiten, proces- en ketenmanagement en ter
      zake van de verwerving van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die
      rechten, met uitzondering van winstopslagen bij transacties binnen een groep;

      c. kosten voor de aanschaf van machines en apparatuur, nieuw of tweedehands, in geval van huurkoop gebaseerd op
      de aan het project toe te rekenen leasetermijnen, met uitzondering van financieringskosten en winstopslagen bij
      transacties binnen een groep;

      d. kosten voor organisatie en facilitering van het samenwerkingsverband, waaronder begrepen verwerving van
      onroerende zaken, zaalhuur, vergaderfaciliteiten en bureaukosten;

      e. kosten voor een procesbegeleider of ketenmanager;

      f. kosten voor een studie naar de haalbaarheid van de ontwikkeling van nieuwe producten, procédés en technologieën
      in de landbouw-, de voedsel- en bosbouwsector;

      g. kosten gemoeid met het testen van de nieuwe producten, procédés en technologieën;

      h. kosten voor investeringen in onroerende zaken;

      i. kosten van eigen arbeid van de betrokken ondernemer, in afwijking van
      [artikel 2:2, aanhef in samenhang met onderdeel d][ref1].

      2 De in het eerste lid bedoelde kosten komen uitsluitend in aanmerking voor de subsidie voor zover zij worden
      gemaakt vóórdat de nieuwe producten, procédés en technologieën, bedoeld in het eerste lid, onderdelen f en g, voor
      commerciële doeleinden toegepast worden.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel22
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 2:2
        hoofdstuk: '2'
  - number: 2:36
    text: |-
      1 De subsidie bedraagt ten hoogste 35% van de subsidiabele kosten.

      2 De subsidie bedraagt ten hoogste € 500.000.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel236
  - number: 2:37
    text: |-
      1 De Minister kan voor een investering als bedoeld in [bijlage 2][ref1] bij deze regeling subsidie verstrekken aan
      landbouwondernemingen of samenwerkingsverbanden, genoemd bij die investering, voor zover die investering leidt tot:

      a. een hoger niveau van diergezondheid in Nederland en daardoor tot een beter technisch en economisch perspectief
      van en continuïteit binnen landbouwondernemingen;

      b. verlaging van de productiekosten;

      c. de verbetering en omschakeling van de productie;

      d. de instandhouding en verbetering van het natuurlijk milieu, de hygiënische omstandigheden, dierenwelzijn,
      voedselveiligheid of duurzaam gebruik van energiebronnen;

      e. herstructurering en ontwikkeling;

      f. verhoging van de kwaliteit en toegevoegde waarde van producten;

      g. verbetering van de arbeidsomstandigheden in de onderneming;

      h. behoud en duurzaam gebruik van biodiversiteit en natuurlijke hulpbronnen;

      i. verhoging van de doelmatigheid bij inzet en gebruik van middelen, machines en menskracht, of

      j. het tot waarde brengen van bij-, rest- en afvalproducten.

      2 Een landbouwonderneming komt voor de subsidie in aanmerking indien:

      a. door de investering de algehele prestatie van de landbouwonderneming wordt verbeterd, en

      b. de investering voldoet aan de daarvoor geldende EG-maatregelen en nationale voorschriften.

      3 Aan een landbouwonderneming wordt geen subsidie verstrekt indien:

      a. daardoor zou worden gehandeld in strijd met verordeningen als bedoeld in artikel 249 van het Verdrag tot
      oprichting van de Europese Gemeenschap, houdende een gemeenschappelijke marktordening;

      b. de subsidie betrekking heeft op vervangingsinvesteringen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:38
    text: |-
      Een aanvraag tot subsidieverlening, subsidievaststelling of voorschotverlening gaat vergezeld van de documenten die
      in [bijlage 2][ref1] bij deze regeling zijn genoemd bij de investering waarop de subsidie betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel238
