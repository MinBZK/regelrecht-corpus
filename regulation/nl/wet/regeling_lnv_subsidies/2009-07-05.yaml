  - number: 3:32
    text: |-
      1 Voor de subsidie komen de volgende kosten in aanmerking, voor zover die zijn opgenomen in het werkplan, bedoeld
      in [artikel 3:29, eerste lid, onderdeel a][ref1]:

      a. 80% van de volgende kosten:

      1°. kosten van materialen;

      2°. loonkosten voor werkzaamheden verricht door derden;

      3°. loonkosten van het direct bij de uitvoering van het project betrokken personeel in dienst van de
      subsidieontvanger;

      b. de volgende kosten voor het opstellen van het werkplan, met uitzondering van af te dragen omzetbelasting:

      1°. 14% van de kosten vanaf € 2.250 tot € 4.500;

      2°. 12% van de kosten vanaf € 4.500 tot € 9.000;

      3°. 10% van de kosten vanaf € 9.000 tot € 22.500;

      4°. 8% van de kosten vanaf € 22.500;

      c. de kosten van de voor de subsidievaststelling benodigde accountantsverklaring tot een maximum van € 1.800.

      2 [Artikel 1:15, vijfde lid][ref2], is niet van toepassing op de loonkosten, bedoeld in het eerste lid, onderdeel
      a, subonderdelen 2° en 3°.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel329
