      1 [Artikel 1:2, tweede lid][ref1], is niet van toepassing op subsidieverlening op grond van [artikel 4:9][ref2],
      met dien verstande dat activiteiten verricht voor 1 januari 2007 niet in aanmerking komen voor subsidie.

      2 Binnen een termijn van drie maanden na de beschikking tot verlening van de subsidie, bedoeld in
