    text: |-
      1 De subsidiabele kosten bedragen nooit meer dan € 100.000.

      2 De subsidie bedraagt ten minste € 5000 en ten hoogste 20% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel246
  - number: 2:47
    text: |-
      1 De Minister kan subsidie verstrekken voor de uitvoering van een project dat een samenhangend geheel van
      activiteiten vormt, welke de algehele prestatie van de onderneming verbeteren en betrekking hebben op:

      a. de verwerking of de afzet van landbouwproducten of bosbouwproducten, of

      b. de ontwikkeling van nieuwe producten, procédés en technologieën voor de landbouwproducten of bosbouwproducten.

      2 De activiteiten zijn gericht op:

      a. rationalisatie en ontwikkeling van het verkoopklaar maken, de verduurzaming, de behandeling en de verwerking
      van landbouwproducten, het hergebruik van bijproducten of fabricageresiduen dan wel de verwijdering of zuivering
      van afval;

      b. toepassing van nieuwe verwerkingstechnieken, waaronder de ontwikkeling van nieuwe producten en bijproducten
      en het openen van nieuwe markten, alsmede innoverende investeringen met betrekking tot producten, procédés en
      processen, technologieën, product-marktcombinaties en andere innovaties;

      c. verbetering van de afzet op de markt, met inbegrip van verbetering van de doorzichtigheid van de prijsvorming,
      of

      d. verbetering van de kwaliteit van de producten.

      3 Voor de subsidie komen in aanmerking:

      a. landbouwondernemingen of bosbouwondernemingen;

      b. samenwerkingsverbanden van landbouwondernemingen of bosbouwondernemingen onderling of met agro-MKB-
      ondernemingen.

      4 Geen subsidie wordt verstrekt:

      a. voor projecten die erop zijn gericht om te voldoen aan EG-maatregelen;

      b. aan ondernemingen als bedoeld in paragraaf 2.1 van de communautaire richtsnoeren voor reddings- en
      herstructureringssteun (PbEU C 244).
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel247
  - number: 2:48
    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. kosten voor de bouw, verwerving, verbetering of inrichting van onroerende goederen;

      b. kosten voor de aankoop of huurkoop van nieuwe machines en apparatuur, inclusief computersoftware tot aan de
      marktwaarde van het goed;

      c. kosten voor de ontwikkeling van nieuwe machines of apparatuur;

      d. kosten voor de ontwikkeling en operationalisering van processen, procédés, technologieën, marketingconcepten,
      product-marktcombinaties en andere innovaties;

      e. algemene kosten verbonden aan de kosten, bedoeld in de onderdelen a tot en met d, zoals kosten voor de
      architecten en ingenieurs, honoraria van adviseurs tot een hoogte van 15% van het totale subsidiebedrag,
      haalbaarheidsstudies, accountantsverklaring, verwerven van patenten en vergunningen.

      2 Geen subsidie wordt verstrekt voor kosten met betrekking tot een leasecontract, zoals de marge van de
      leaseorganisatie, herfinancieringskosten, overheadkosten en verzekeringspremies.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel248
  - number: 2:49
    text: De subsidie bedraagt ten hoogste 40% van de subsidiabele kosten.
