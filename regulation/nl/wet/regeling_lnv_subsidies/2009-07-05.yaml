  - number: 3:27
    text: |-
      1 Ter instandhouding van beschermde historische buitenplaatsen kan de Minister aan een particuliere eigenaar
      subsidie verstrekken voor technische werkzaamheden aan onderdelen van een tuin of park van zijn beschermde
      historische buitenplaats, voor zover:

      a. de onderdelen van belang zijn vanwege cultuurhistorische of natuurwetenschappelijke waarden, dan wel uit oogpunt
      van recreatie, en

      b. de werkzaamheden het normale onderhoud te boven gaan en zijn gericht op het behoud van het oorspronkelijke
      karakter van de tuin of het park.

      2 Voor subsidie komen in aanmerking particuliere eigenaren van beschermde historische buitenplaatsen waarvan de
      aanleg dateert van voor 1850 en herkenbaar aanwezig is.

      3 Geen subsidie wordt verstrekt voor werkzaamheden waarvan de subsidiabele kosten in totaal minder dan € 2.250
      bedragen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel327
  - number: 3:28
    text: |-
      In aanvulling op [artikel 1:4, tweede lid][ref1], rangschikt de Minister aanvragen tot verlening van de subsidie na
      overleg met de Minister van Onderwijs, Cultuur en Wetenschap, waarbij aanvragen hoger worden gerangschikt naarmate:

      a. de uit te voeren werkzaamheden een grotere bijdrage leveren aan de instandhouding en het herstel van de
      beschermde historische buitenplaats;

      b. de uit te voeren werkzaamheden meer van belang zijn voor de cultuurhistorische of natuurwetenschappelijke waarde
      van de beschermde historische buitenplaats of voor de recreatie;

      c. een grotere urgentie bestaat voor de uit te voeren werkzaamheden, en

      d. er samenhang is met andere gesubsidieerde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel14
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 1:4
        hoofdstuk: '1'
  - number: 3:29
    text: |-
      1 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een werkplan;

      b. een kaart met ten minste een schaal van 1:1000, waarop de terreingedeelten of onderdelen aangegeven zijn waarop
      de werkzaamheden plaatsvinden, en

      c. een advies van de Stichting met betrekking tot de werkzaamheden.

      2 In het werkplan wordt ten minste opgenomen:

      a. een beschrijving van:

      1°. de huidige situatie;

      2°. de te verrichten werkzaamheden;

      3°. de doelstellingen van de werkzaamheden;

      b. informatie waaruit blijkt in hoeverre de werkzaamheden bijdragen aan de doeleinden waarvoor de subsidie wordt
      verstrekt;

      c. een sluitende begroting voor de werkzaamheden, die een meerjarenbegroting is met liquiditeitsplanning per jaar
      voor zover het project of programma langer dan een jaar duurt, met toelichting daarop;

      d. de kosten voor het werkplan, met toelichting daarop;

      e. de realisatietermijn.

      3 In het advies, bedoeld in het eerste lid, onderdeel c, wordt ten minste opgenomen:

      a. informatie waaruit blijkt in hoeverre de werkzaamheden het normale onderhoud te boven gaan;

      b. advies over:

      1°. de bijdrage die de uit te voeren werkzaamheden leveren aan de instandhouding en het herstel van de beschermde
      historische buitenplaats;

      2°. het cultuurhistorische, natuurwetenschappelijke of recreatieve belang van de uit te voeren werkzaamheden;

      3°. de urgentie van de uit te voeren werkzaamheden;

      4°. de wijze van uitvoering en de te gebruiken materialen, en

      5°. de mogelijke samenhang met andere gesubsidieerde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel329
  - number: 3:30
    text: |-
      1 De subsidieontvanger vangt de werkzaamheden waarvoor subsidie is verleend aan binnen één jaar na de datum van
      subsidieverlening.

      2 De subsidieontvanger voert de werkzaamheden uit overeenkomstig het werkplan.

      3 Ingeval subsidie is verleend voor meer dan één jaar, legt de subsidieontvanger aan de Minister telkens nadat
      een jaar is verstreken binnen twee maanden financiële verantwoording af over de werkzaamheden, met een daarbij
      behorende accountantsverklaring.

      4 [Artikel 1:14, vijfde en zesde lid][ref1], is van overeenkomstige toepassing op de situatie, bedoeld in het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel114
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel330
