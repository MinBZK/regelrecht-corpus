  - number: 4a:2
    text: |-
      In deze titel wordt verstaan onder:

        - *HBO:* Hoger beroepsonderwijs, als bedoeld in
      [artikel 1.1, onderdeel d, van de Wet op Hoger Onderwijs en Wetenschappelijk onderzoek][ref1];
        - *agrarische HBO-instelling:* instelling voor hoger onderwijs, als bedoeld in
      [artikel 1.2., onderdeel a, van de Wet op het Hoger Onderwijs en Wetenschappelijk onderzoek][ref2], op het gebied
      van landbouw en natuurlijke omgeving;
        - *lector:* hoog gekwalificeerde professional die ruime ervaring heeft met onderwijs en onderzoek op een bepaald
      vakgebied en die door zijn prestaties een groot gezag geniet als deskundige;
        - *lectoraat:* samenwerkingsverband dat onder leiding staat van een lector;
        - *groene-plus lectoraat:* lectoraat dat zich op basis van deze regeling bezighoudt met thema’s op het gebied van
      landbouw en natuurlijke omgeving;
        - *kenniskring:* samenwerkingsverband van een lectoraat, docenten en anderen waarbinnen inhoudelijke expertise op
      een bepaald gebied gebundeld en verder ontwikkeld wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1.2'
  - number: 4a:3
    text: |-
      1 Ter versterking van de lectoraten op het gebied van landbouw en natuurlijke omgeving, kan de Minister subsidie
      aan het bevoegd gezag van een agrarische HBO-instelling verstrekken voor activiteiten die leiden tot het vergroten
      van kennisinnovatie en de daarmee samenhangende kwaliteitsverbetering van het onderwijs en de externe oriëntatie
      naar bedrijfsleven en maatschappelijke organisaties.

      2 De activiteiten, bedoeld in het eerste lid, zijn gericht op:

      a. het uitvoeren van vraaggestuurd praktijkgericht onderzoek;

      b. de doorvertaling van de kennisontwikkeling in het onderwijs;

      c. het professionaliseren van docenten en kenniskringleden;

      d. een landelijke doorwerking, het versterken van de kenniscirculatie tussen onderwijs, onderzoek en praktijk via
      kenniskringen op het gebied van landbouw en natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a3
  - number: 4a:4
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate de activiteiten waarop de
      aanvraag betrekking heeft:

      a. qua thema waarop het groene-plus lectoraat betrekking heeft, beter aansluiten bij de strategische
      beleidsprioriteiten van de beleidsagenda in de begroting van LNV;

      b. qua werkveld meer vernieuwend zijn ten opzichte van de werkvelden van bestaande lectoraten op het gebied van
      landbouw en natuurlijke omgeving;

      c. een grotere bijdrage leveren aan de doelstelling en subsidiabele activiteiten, bedoeld in [artikel 4a:3][ref2];

      d. meer kwaliteitswinst in de groene kennisinfrastructuur opleveren en een betere borging van een landelijke
      doorwerking van verworven kennis;

      e. een grotere robuustheid en een goede benutting van eerder gedane investeringen in de groene kennisinfrastructuur
      bewerkstelligen;

      f. beter uitvoerbaar zijn en een goede aanpak gewaarborgd is;

      g. een grotere betrokkenheid van het bedrijfsleven of maatschappelijke organisaties in de regio van de
      subsidieaanvrager bewerkstelligen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel4a3
