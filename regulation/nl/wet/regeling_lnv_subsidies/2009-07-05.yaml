      a. meer bijdraagt aan de samenwerking tussen verschillende partijen in de visserij;

      b. een groter uitstralingseffect heeft naar andere partijen in de visserijsector ten aanzien van de voordelen en
      mogelijkheden van samenwerking;

      c. een meer duurzaam karakter heeft;

      d. een resultaat zal opleveren dat ten goede komt van andere visserijondernemingen;

      e. meer bijdraagt aan de verbetering van kwaliteit van visserijproducten en de toevoeging van waarde aan een
      visserijproduct in de keten, en

      f. meer bijdraagt aan de traceerbaarheid van visserijproducten.

