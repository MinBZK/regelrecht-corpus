    text: |-
      1 Een subsidie als bedoeld in [artikel 2:42, eerste lid][ref1], wordt verleend onder de voorwaarde dat de
      subsidieontvanger met het oog op de investeringen een schriftelijke overeenkomst van geldlening met een looptijd
      van ten minste drie jaar afsluit met een kredietinstelling.

      2 Ingeval de subsidie strekt tot verwerving van onroerende zaken, wordt deze verleend onder de voorwaarde dat:

      a. de daaraan verbonden kosten, met uitzondering van kosten van overdrachtsbelasting, notariële kosten en de kosten
      van inschrijving bij het kadaster, niet hoger zijn dan een door een taxateur vastgestelde vrije verkoopwaarde van
      de onroerende zaken;

      b. een taxateur heeft vastgesteld dat gebouwen voldoen aan de nationale voorschriften die op gebouwen van
      toepassing zijn, voor zover de onroerende zaken gebouwen betreffen.

      3 Een taxateur als bedoeld in het tweede lid voldoet aan de vakbekwaamheidseisen, bedoeld in
      [artikel 3 van de Uitvoeringsregeling vakbekwaamheidseisen Wet waardering onroerende zaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel242
