  - number: 1:14
    text: |-
      1 Een aanvraag tot subsidievaststelling wordt binnen vier maanden na afloop van de activiteiten waarvoor subsidie
      is verleend ingediend, tenzij de Minister bij subsidieverlening een andere periode voor het indienen van de
      aanvraag heeft vastgesteld.

      2 Bij een aanvraag tot subsidievaststelling wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft is gefinancierd.

      3 Bij de rekening en verantwoording, bedoeld in [artikel 4:45, tweede lid, van de Algemene wet bestuursrecht][ref1],
      maakt de subsidieontvanger een onderverdeling naar de onderscheiden subsidiabele kosten.

      4 Een aanvraag tot vaststelling van een subsidie voor de uitvoering van een project gaat vergezeld van een
      eindverslag, dat ten minste bevat:

      a. een beschrijving van de activiteiten die in het kader van het project zijn verricht;

      b. een evaluatie van de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het
      projectplan dat onderdeel vormt van de beschikking tot subsidieverlening;

      c. de kennis en informatie die met het project zijn opgedaan, en

      d. de wijze waarop de kennis en informatie, bedoeld in onderdeel c, openbaar is of zal worden gemaakt, ingeval in
      deze regeling is bepaald dat openbaarmaking plaatsvindt.

      5 Indien in deze regeling is bepaald dat de aanvraag tot subsidievaststelling vergezeld gaat van een
      accountantsverklaring, bestaat deze uit een verklaring van een accountant of een accountant-administratieconsulent
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], waaruit blijkt dat met de
      aanvraag wordt voldaan aan de voorschriften uit [artikel 4:45 van de Algemene wet bestuursrecht][ref3].

      6 De accountant of accountant-administratieconsulent controleert en stelt de verklaring vast met inachtneming van
      de voorschriften, gesteld in [bijlage 1][ref4] bij deze regeling.


