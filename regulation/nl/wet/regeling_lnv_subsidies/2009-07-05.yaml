      De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een topografische kaart met schaal 1:10.000, waarop het terrein en de plaats waar de verschillende activiteiten
      waarvoor subsidie wordt gevraagd zijn aangegeven;

      b. een plan dat inzicht biedt in de aard van de werkzaamheden, de doelstelling, de effectiviteit en de kansrijkdom
      van de maatregelen;

      c. een begroting van de met de werkzaamheden gemoeide kosten en opbrengsten;

      d. een overzicht van de bijdragen van derden en eventuele andere subsidies voor de betrokken werkzaamheden.
