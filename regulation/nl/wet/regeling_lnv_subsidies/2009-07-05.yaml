      1 De Minister kan aan een visserijonderneming of samenwerkingsverband van deze ondernemingen subsidie verstrekken
      voor de uitvoering van een project betreffende de bouw, de uitbreiding, de uitrusting en de modernisering van
      productie-installaties voor aquacultuur, voorzover het project is gericht op:

      a. invoering van aquacultuurmethoden die de negatieve gevolgen voor het milieu aanzienlijk terugdringen of de
      positieve gevolgen voor het milieu ten opzichte van de gangbare praktijk in de aquacultuursector vergroten;

      b. op nieuwe vissoorten gerichte diversificatie van het productieproces of productie van vissoorten met goede
      afzetvooruitzichten.

      2 Subsidie wordt enkel verleend aan kleine, middelgrote en micro-ondernemingen en aan ondernemingen die minder dan
      750 werknemers hebben of een omzet van minder dan 200 miljoen euro hebben.

      3 Geen subsidie wordt verstrekt voor een project dat:

      a. er op gericht is om te voldoen aan verplichte EG-normen inzake het milieu, de gezondheid van mens en dier, de
      hygiëne of het dierenwelzijn;

      b. bijdraagt aan een vergroting van de productie van forel, paling, meerval, zeebaars en zeebrasem;

      c. betrekking heeft op siervissen;

      d. betrekking heeft op aquacultuur van dieren die niet mogen worden gehouden op grond van de
      [Gezondheids- en welzijnswet][ref1] voor dieren of in strijd is met overige wet- of regelgeving;

      e. in vergelijking met de gangbare praktijk in de aquacultuursector leidt tot een zwaardere belasting van het
      milieu;

      f. ziet op een experimentele toepassing van een nieuwe aquacultuurmethode, techniek of proces, zonder commerciële
      toepassing op praktijkschaal.

      4 Geen subsidie wordt verstrekt aan projecten waarvan de subsidiabele kosten in totaal minder bedragen dan
      € 10.000,–.


