      1 De Minister rangschikt een aanvraag tot subsidieverlening voor activiteiten, als bedoeld in
      [artikel 5:3, tweede lid, onderdeel b][ref1], overeenkomstig [artikel 1:4][ref2] hoger naarmate de maatregelen
