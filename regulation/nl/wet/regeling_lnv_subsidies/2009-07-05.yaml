        bwb_id: BWBR0021281
  - number: 2:40
    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. kosten voor de bouw, verwerving, inrichting of verbetering van onroerende zaken;

      b. kosten voor de aanschaf van nieuwe machines en apparatuur, waarvan de aanvrager eerste gebruiker is;

      c. kosten voor de aanschaf van plantmateriaal en de kosten van derden voor het planten van blijvende teelten en
      meerjarige gewassen als bedoeld in artikel 2, onderdeel c, onderscheidenlijk onderdeel d, van [verordening (EG) nr.
      795/2004](32004R0795) van de Commissie van de Europese Gemeenschappen van 21 april 2004, houdende bepalingen voor
      de uitvoering van de bedrijfstoeslagregeling waarin is voorzien in [verordening (EG) nr. 1782/2003](32003R1782)
      (PbEU L 141).

      2 Bij de kosten voor de verwerving van onroerende zaken zijn inbegrepen de daaraan verbonden kosten van
      overdrachtsbelasting, notariële kosten en de kosten van inschrijving bij het kadaster.

      3 Voor de subsidie komen niet in aanmerking kosten voor de verwerving van onroerende zaken met uitzondering van
      grond, ten behoeve waarvan subsidie door een bestuursorgaan is verleend in de periode van tien jaar voorafgaand aan
      de ontvangstdatum van de aanvraag tot subsidieverlening.

      4 In [bijlage 2][ref1] bij deze regeling kan bij de investering waarop de subsidie betrekking heeft zijn bepaald
      dat kosten in aanmerking komen voor de subsidie, in aanvulling of in afwijking van het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: 2:41
    text: |-
      De subsidie bedraagt ten hoogste:

      a. 60% van de subsidiabele kosten voor de investeringen door jonge landbouwers in:

      1°. de door Nederland ter uitvoering van artikel 50, tweede en derde lid, van [verordening (EG) nr. 1998/2005]
      (32005R1998) aangewezen gebieden;

      2°. de door Nederland ter uitvoering van artikel 4 van [richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de
      Europese Gemeenschappen van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en
      fauna (PbEG L 206) op de lijst van beschermde gebieden opgenomen gebieden, of

      3°. de door Nederland ter uitvoering van artikel 6 van [richtlijn nr. 60/2000/EG](31960L2000) van het Europees
      Parlement en de Raad van de Europese Unie van 23 oktober 2000 tot vaststelling van een kader voor communautaire
      maatregelen betreffende het waterbeleid (PbEG L 327) in het register van beschermde gebieden aangewezen gebieden;

      b. 50% van de subsidiabele kosten voor de investeringen door andere landbouwers dan jonge landbouwers in de
      gebieden, bedoeld in onderdeel a;

      c. 50% van de subsidiabele kosten voor de investeringen door jonge landbouwers in andere gebieden dan de gebieden,
      bedoeld in onderdeel a;

      d. 40% van de subsidiabele kosten voor de investeringen door andere landbouwers dan jonge landbouwers in andere
      gebieden dan de gebieden, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel241
  - number: 2:42
    text: |-
      1 In aanvulling op [artikel 2:37, eerste lid][ref1], kan de Minister voor andere investeringen dan de
      investeringen, bedoeld in [bijlage 2][ref2] bij deze regeling, subsidie als bedoeld in dat artikel verstrekken aan
      een persoon die op het tijdstip van ontvangst van de aanvraag tot subsidieverlening een jonge landbouwer is en aan
      ten minste één van de volgende voorwaarden voldoet:

      a. hij beschikt over een getuigschrift van afronding van een erkende landbouwkundige opleiding of een opleiding van
      gelijkwaardig niveau, of

      b. hij kan aantonen dat hij ten minste drie jaar op een landbouwonderneming werkzaam is geweest.

      2 In aanvulling op [artikel 2:37, derde lid][ref3], wordt geen subsidie verstrekt indien:

      a. de subsidie in totaal € 5.000 of minder bedraagt;

      b. de jonge landbouwer met het oog op de investeringen een geldlening is aangegaan voordat de verlening van de
      subsidie hem schriftelijk is bevestigd;

      c. op grond van deze paragraaf of de [Subsidieregeling jonge agrariërs][ref4], zoals deze gold voor het tijdstip
      van inwerkingtreding van deze regeling, eerder aan de jonge landbouwer subsidie is verstrekt of terzake van een
      eerdere aanvraag op grond van deze paragraaf nog een beslissing tot vaststelling van de subsidie moet worden
      genomen;

      d. het eigen vermogen van de jonge landbouwer meer dan 60% van de fiscale balanswaarde van zijn landbouwonderneming
      bedraagt.


