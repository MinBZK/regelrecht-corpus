      1 De subsidie bedraagt ten hoogste € 3.000 per jaar dat een landbouwonderneming deelneemt aan een
      voedselkwaliteitsregeling.

      2 Ingeval een landbouwonderneming voor een deel van een jaar deelneemt aan een voedselkwaliteitsregeling, wordt een
      subsidiebedrag dat in verhouding staat tot dat deel vastgesteld.

      3 De subsidie wordt ten hoogste voor vijf jaar verleend.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel253
