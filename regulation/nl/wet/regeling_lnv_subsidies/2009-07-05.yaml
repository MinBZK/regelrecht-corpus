  - number: 4a:8
    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een rapport over de activiteiten waarvoor subsidie is verleend en het eindresultaat daarvan;

      b. een financiële verantwoording van de activiteiten waarvoor subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a8
  - number: 4a:9
    text: |-
      De volgende kosten komen in aanmerking voor de subsidie:

      a. de loonkosten van het bij de uitvoering van de in [artikel 4a:3][ref1] bedoelde activiteiten betrokken personeel
      van de subsidieontvanger;

      b. de kosten, die aantoonbaar noodzakelijk zijn en daadwerkelijk door de subsidieontvanger zijn betaald, voor het
      inhuren van ondersteuningsinstellingen, bedrijven, maatschappelijke organisaties en onderzoeksinstellingen vanwege
      hun expertise of specifieke voorzieningen tot ten hoogste 10% van de subsidiabele kosten;

      c. materiële kosten die aantoonbaar noodzakelijk zijn en daadwerkelijk door de subsidieontvanger zijn betaald voor
      de uitvoering van de activiteiten tot ten hoogste 15% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4a3
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a9
    references:
