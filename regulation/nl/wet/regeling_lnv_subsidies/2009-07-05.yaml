      In deze titel wordt verstaan onder programma: project dat een samenhangend geheel van activiteiten vormt, waarbij
      de uitvoering op grond van ontwikkelingen binnen het project of maatschappelijke ontwikkelingen gedurende de
      looptijd kan worden aangepast.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel33
  - number: 3:4
    text: |-
      1 De Minister kan aan stichtingen, verenigingen of samenwerkingsverbanden daarvan, waarvan het werkgebied zich
      uitstrekt over meer dan twee provincies, subsidie verstrekken voor de uitvoering in dat werkgebied van een project
      dat een geheel van afgebakende en eenmalige activiteiten vormt of van een programma, welk project of programma is
      gericht op versterking van het draagvlak voor de natuur in de Nederlandse samenleving.

      2 Voor de subsidie komen in ieder geval in aanmerking projecten die op een doelmatige wijze bijdragen aan de
      doelstelling van het eerste lid door:

      a. het vergroten van de kennis van de natuur door het ontwikkelen van modelprogramma's en bijbehorende trainingen
      voor intermediairs en leerkrachten, voor gebruik bij binnen- en buitenschoolse natuur- en milieueducatie;

      b. het vergroten van de kennis van de natuur bij groepen die een bijdrage kunnen leveren aan de realisering van
      natuurdoelstellingen, door het geven van voorlichting of het ontwikkelen van voorlichtingsmateriaal;

      c. het vergroten van de aandacht voor natuur door het ontwikkelen van een visie op de positie van de natuur in de
      samenleving, het inbrengen van deze visie in overlegsituaties en het vragen van publieke aandacht voor deze visie,
      of

      d. het verhogen van de organisatiegraad en verbeteren van de onderlinge contacten door het stimuleren van
      samenwerking tussen organisaties op het gebied van natuur en het bevorderen van informatie-uitwisseling tussen
      die organisaties.

      3 Voor de subsidie komen in ieder geval in aanmerking programma’s die op een doelmatige wijze bijdragen aan de
      doelstelling, bedoeld in het eerste lid, door:

      a. het uitwisselen van kennis en ideeën over natuur met betrokken partijen in de maatschappij, het ontwikkelen
      en structureren van deze kennis binnen de eigen organisatie ten behoeve van beleidsprocessen bij overheden en het
      inbrengen van deze kennis in alle fasen van deze beleidsprocessen, of

      b. het verbreden van de resultaten van eerder uitgevoerde projecten, waarvan de doelstelling past binnen het tweede
      lid, door de bevordering van het gebruik en de acceptatie van in deze projecten ontwikkelde methoden, programma's,
      ideeën en materialen bij de geëigende doelgroepen.

      4 Geen subsidie wordt verstrekt voor projecten:

      a. die een looptijd hebben van meer dan 3 jaar, of

      b. waarvan de subsidiabele kosten in totaal minder bedragen dan € 11.350.

      5 Geen subsidie wordt verstrekt voor programma's:

      a. die een looptijd hebben korter dan 3 jaar of langer dan 5 jaar, of

      b. waarvan de subsidiabele kosten jaarlijks gemiddeld minder bedragen dan € 22.675.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel34
  - number: 3:5
    text: |-
      1 De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate het project of programma
      waarop de aanvraag betrekking heeft:

      a. doelmatiger kan worden uitgevoerd als gevolg van de kennis, de kunde, de capaciteit, het netwerk en het
      maatschappelijk draagvlak van de uitvoerende organisatie of uitvoerende organisaties;

      b. meer aansluit bij het beleid zoals beschreven in de nota’s ‘Natuur voor Mensen, Mensen voor
      Natuur’ (Kamerstukken II 1999/2000, 27 235, nr. 1), ‘Vitaal en Samen’ (Kamerstukken II 2003/04, 29 200, nr.
      2) en ‘Kiezen, leren en meedoen, naar een effectieve inzet van natuur- en milieueducatie in Nederland, 2008–
      2011’ (Kamerstukken II 2007/08, 20 487, nr. 21).

      2 Voor zover na de rangschikking, bedoeld in het eerste lid, sprake is van gelijke geschiktheid en er in verband
      met het bereiken van het subsidieplafond nog enkel één subsidie kan worden verleend, rangschikt de Minister
      overeenkomstig [artikel 1:4][ref2] een aanvraag hoger naarmate het project of programma waarop de aanvraag
      betrekking heeft, meer wordt bekostigd uit andere subsidies of financiële middelen.


