    text: |-
      1 De Minister kan op aanvraag aan een visser subsidie verstrekken:

      a. voor de verbetering van de beroepsvaardigheden, met name van jonge vissers;

      b. voor de omscholing naar een beroep buiten de zeevisserij;

      c. als eenmalige compensatie indien de visserijactiviteit van het vaartuig waarop de visser ten minste twaalf
      maanden heeft gewerkt, definitief is beëindigd in de zin van [artikel 4:2][ref1];

      d. voor het vroegtijdig uittreden uit de visserij

      2 De aanvraag voor subsidie wordt afgewezen indien de aanvrager reeds eerder een subsidie
      voor een activiteit als bedoeld in het eerste lid, onderdeel b en d, heeft ontvangen
      op grond van deze paragraaf, de Vergoedingsregeling voor uittreding van vissers uit de
      visserij, de [Vergoedingsregeling voor uittreding van vissers uit de visserij 2002][ref2], de
      [Vergoedingsregeling voor uittreding van vissers uit de visserij 2003][ref3] of in de twaalf maanden voorafgaande
      aan de aanvraag op grond van paragraaf 1 van hoofdstuk 4 een aanvraag tot subsidieverlening heeft gedaan.


