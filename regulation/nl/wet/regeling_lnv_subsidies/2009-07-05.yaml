      1 De Minister kan aan gemeenten en provincies subsidie verstrekken voor de uitvoering van projecten die een
      bijdrage leveren aan de bevordering van een samenhangend en doelmatig beleid met betrekking tot het beheer en de
      ontwikkeling van een kwalitatief hoogwaardig landschap.

      2 De projecten hebben betrekking op:

      a. het voorbereiden, opstellen of herzien van een landschapsontwikkelingsplan, of

      b. het herzien van een landschapsbeleidsplan of landschapsstructuurplan waarvoor ten laste van de Rijksbegroting
      subsidie is verstrekt vóór 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel340
