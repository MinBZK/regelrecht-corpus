    text: |-
      1 De aanvraag gaat vergezeld van een rapportage omvattende:

      a. een investerings- en financieringsplan, met een gedegen onderbouwing van de verenigbaarheid van de investeringen
      met de artikelen 25 en 35 van verordening nr. 1198/2006;

      b. een overzicht van de stand van leningen en kredieten voor uitvoering van het investeringsplan;

      c. een specificatie van de zekerheden, vergezeld van een taxatierapport ter zake van de executiewaarde van de
      onderscheiden roerende en onroerende goederen die tot zekerheid strekken, alsmede een specificatie van de totale
      financiering inclusief de daaraan verbonden voorwaarden na uitvoering van het investeringsplan;

      d. een berekening van het eigen en aansprakelijk vermogen;

      e. een door de kredietinstelling getoetste, op de ondernemerscapaciteiten van de
      aanvrager afgestemde begroting, waaruit blijkt dat aanvrager voldoet aan het gestelde in
      [artikel 4:55, eerste lid, onderdelen b en c, en derde lid, onderdelen b en c][ref1];

      f. de boekhoudverslagen en de aangiften inkomstenbelasting over de voorliggende drie boekjaren, indien beschikbaar;

      g. een toelichting van de kredietinstelling op de verstrekte gegevens;

      h. de statuten, indien de aanvraag betrekking heeft op een rechtspersoon.

      2 Onverminderd het bepaalde in het eerste lid kan de Minister besluiten dat de aanvrager zijn aanvraag aanvult
      met een taxatierapport ter zake van de executiewaarde van de onderscheiden roerende en onroerende goederen die tot
      zekerheid strekken, dat niet ouder is dan zes maanden op de dag van indiening van de aanvraag, en is opgesteld door
      een ter zake kundig en onafhankelijk taxateur.

      3 De aanvrager is voorts verplicht alle bescheiden en informatie te verstrekken die door de Minister noodzakelijk
      worden geacht.

      4 De [artikelen 1:8][ref2] en [1:9][ref3] zijn van overeenkomstige toepassing.


