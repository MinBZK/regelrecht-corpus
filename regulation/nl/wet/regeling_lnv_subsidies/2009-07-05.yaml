  - number: 2:70
    text: |-
      1 De Minister kan subsidie in de vorm van een garantstelling verstrekken voor de terugbetaling van een lening, voor
      zover deze strekt tot financiering van investeringen in de stichting, overname, instandhouding of verbetering van
      een kleine of middelgrote landbouwonderneming.

      2 Investeringen als bedoeld in het eerste lid zijn gericht op:

      a. verlaging van de productiekosten van landbouwproducten;

      b. verbetering en omschakeling van de productie van landbouwproducten;

      c. verhoging van de kwaliteit van landbouwproducten;

      d. instandhouding en verbetering van het natuurlijke milieu of de verbetering van de hygiëneomstandigheden of de
      normen inzake dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel270
  - number: 2:71
    text: |-
      Geen garantstelling wordt verstrekt:

      a. voor de terugbetaling van leningen die zijn gericht op de herfinanciering van schulden, daaronder mede begrepen
      niet door een kredietinstelling verstrekte leningen alsmede leningen welke worden aangegaan om kapitaalbehoefte,
      ontstaan door het uittreden van een commanditaire vennoot uit een commanditaire vennootschap, te dekken, behoudens
      ingeval van overmacht;

      b. indien ten aanzien van de investeringen reeds een krediet is verstrekt of onvoorwaardelijk is toegezegd;

      c. aan andere landbouwondernemingen dan kleine of middelgrote ondernemingen;

      d. indien de landbouwonderneming een bruto-jaaromzet heeft of zal hebben die voor de helft of minder wordt
      verkregen uit de primaire productie van landbouwproducten;

      e. indien aan de aanvrager reeds een garantstelling is verstrekt door:

      1°. de Minister of het bestuur van de Stichting Borgstellingsfonds voor de Landbouw, en:

        - die garantstelling is verleend in het tijdvak van twee jaren voorafgaand aan de datum van ontvangst van de
      aanvraag, of
        - met de garantstelling waarop de aanvraag betrekking heeft het totaal aan garantstellingen, verleend aan de
      landbouwonderneming, € 2.500.000 of hoger wordt, of

      2°. een ander bestuursorgaan dan bedoeld onder 1°;

      f. voor de terugbetaling van leningen met betrekking tot een landbouwonderneming die wordt uitgeoefend door
      een commanditaire vennootschap, tenzij uit de betrokken vennootschapsovereenkomst blijkt dat deze ten minste is
      aangegaan voor een periode, overeenkomende met de looptijd van de lening, waarvoor de aanvraag wordt ingediend, en
      in elk geval gedurende deze looptijd niet kan worden opgezegd;

      g. indien het bancair aansprakelijk vermogen van de aanvrager minder dan 15% bedraagt van het balanstotaal;

      h. indien de verstrekking van de garantstelling de landbouwonderneming naar het oordeel van de Minister onvoldoende
      liquiditeitstoename oplevert;

      i. indien de begroting van de landbouwonderneming naar het oordeel van de Minister onvoldoende middelen bevat om
      eventuele exploitatietekorten van de landbouwonderneming op te vangen;

      j. indien de begroting van de landbouwonderneming naar het oordeel van de Minister onvoldoende middelen bevat om in
      de toekomst noodzakelijke investeringen te kunnen verrichten in de landbouwonderneming;

      k. ingeval de garantstelling in totaal minder dan € 50.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel271
  - number: 2:72
    text: |-
      1 De garantstelling wordt uitsluitend verstrekt aan aanvragers die:

      a. wegens het ontbreken van de daartoe benodigde zekerheden volgens normaal bankgebruik onvoldoende financiering
      voor de landbouwonderneming kunnen krijgen;

      b. voor zover rechtens is toegestaan, op alle hen toebehorende zaken goederenrechtelijke zekerheid verlenen voor
      alle door de kredietinstelling te verstrekken financieringen, waaronder de lening waarop de aanvraag betrekking
      heeft;

      c. beschikken over de wettelijk vereiste bescheiden ter zake van de vestiging en uitoefening van de
      landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft, en

      d. de Dienst Regelingen machtigen tot gebruik van de door hen op grond van
      [artikel 24, eerste lid, van de Landbouwwet][ref1] verstrekte gegevens voor de controle van de te verlenen
      garantstelling.

      2 Voor de garantstelling komen natuurlijke personen in aanmerking indien:

      a. zij de landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft voor eigen rekening en risico
      beheren;

      b. zij aan ten minste één van de volgende voorwaarden voldoen:

      1°. zij beschikken over een getuigschrift van afronding van een erkende landbouwkundige opleiding of opleiding van
      gelijkwaardig niveau, of

      2°. zij kunnen aantonen dat zij ten minste drie jaar op een landbouwonderneming werkzaam zijn geweest, en

      c. elk van hen aan de vereisten uit het eerste lid voldoet, en een van hen aan de voorwaarden uit onderdeel b
      voldoet, ingeval meer dan een persoon voor gezamenlijke rekening en risico de landbouwonderneming beheren.

      3 Voor de garantstelling komen rechtspersonen in aanmerking indien:

      a. zij blijkens de statuten de exploitatie van een of meer landbouwondernemingen ten doel hebben;

      b. zij de landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft onder leiding van een
      bedrijfsleider hebben gesteld die voldoet aan één van de voorwaarden, gesteld in het tweede lid, onderdeel b, en

      c. de bestuurders zich hoofdelijk verbinden tot de volledige terugbetaling van de lening waarop de aanvraag
      betrekking heeft, alsmede hun hele vermogen tot zekerheid terzake stellen.

      4 De Minister kan ontheffing verlenen van het bepaalde in het derde lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
  - number: 2:73
    text: |-
      1 De garantstelling wordt uitsluitend verstrekt ten behoeve van een lening die:

      a. is verstrekt door een kredietinstelling waarmee de Minister een raamovereenkomst, waarin de rechten en plichten
      van de Minister en de kredietinstelling zijn vastgelegd, heeft gesloten;

      b. een looptijd heeft van ten hoogste twintig jaar, met dien verstande dat de kredietinstelling de looptijd met ten
      hoogste twee jaar kan verlengen in geval van betalingsmoeilijkheden, en

      c. lineair wordt afgelost.

      2 Uiterlijk één jaar na de datum van de beschikking tot verlening van de garantstelling neemt de subsidie-ontvanger
      de lening waarop de garantstelling betrekking heeft volledig op.

      3 Bij de bepaling of de landbouwonderneming naar het oordeel van de Minister voldoende liquiditeitstoename
      oplevert, wordt uitgegaan van een, zo nodig door de Minister gewijzigde, begroting die op de
      ondernemerscapaciteiten van de aanvrager is afgestemd en waaruit onder meer blijkt dat:

      a. rente- en aflossingsverplichtingen, overige bedrijfsuitgaven, belastingen, premies en, voor zover geen sprake
      is van inkomsten uit tegenwoordige of vroegere arbeid van buiten de landbouwonderneming waaruit deze kunnen worden
      bestreden, gezinsbestedingen kunnen worden betaald;

      b. de noodzakelijke vervangingsinvesteringen kunnen worden gerealiseerd;

      c. de liquiditeitstoename voldoende ruimte biedt om tegenvallers in de exploitatie op te vangen alsmede
      om aan toekomstige financieringsverplichtingen, onder andere als gevolg van noodzakelijke diepte- of
      uitbreidingsinvesteringen, te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel273
  - number: 2:74
    text: |-
      Aanvragen tot garantstelling worden overeenkomstig [artikel 1:6][ref1] gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel16
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 1:6
        hoofdstuk: '1'
  - number: 2:75
    text: |-
      1 De aanvraag tot garantstelling gaat vergezeld van de volgende documenten:

      a. een investerings- en financieringsplan;

      b. een overzicht van de stand van leningen en kredieten voor uitvoering van het investeringsplan;

      c. een specificatie van de zekerheden voor alle door de kredietinstelling te verstrekken financieringen aan de
      landbouwonderneming, vergezeld van een taxatierapport ter zake van de executiewaarde van de roerende en onroerende
      zaken die tot zekerheid strekken, alsmede een specificatie van de totale financiering inclusief de daaraan
      verbonden voorwaarden na uitvoering van het investeringsplan;

      d. een berekening van het eigen en aansprakelijk vermogen;

      e. een door de kredietinstelling getoetste, op de ondernemerscapaciteiten van de aanvrager afgestemde begroting,
      waaruit blijkt dat de landbouwonderneming:

      1. een bruto-jaaromzet heeft die voor meer dan de helft wordt verkregen uit de primaire productie van
      landbouwproducten, en

      2. voldoende liquiditeitstoename oplevert;

      f. de boekhoudverslagen en de aangiften inkomstenbelasting over de voorliggende drie boekjaren, indien beschikbaar;

      g. een toelichting van de kredietinstelling op de verstrekte gegevens, en

      h. de statuten van de landbouwonderneming, indien de aanvraag betrekking heeft op een rechtspersoon.

      2 In aanvulling op het eerste lid verstrekt de aanvrager op verzoek van de Minister:

      a. een taxatierapport ter zake van de executiewaarde van de roerende en onroerende zaken die tot zekerheid
      strekken, dat:

      1. niet ouder is dan zes maanden rekenend vanaf de dag van indiening van de aanvraag, en

      2. is opgesteld door een ter zake deskundig en onafhankelijk taxateur;

      b. alle bescheiden en informatie die de Minister noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel275
  - number: 2:76
    text: |-
      De Minister verstrekt de kredietinstelling, bedoeld in [artikel 2:73, eerste lid][ref1], een afschrift van de
      beschikking tot verlening van de garantstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel273
