    text: |-
      1 De garantstelling kan worden verstrekt ten behoeve van leningen aangegaan door natuurlijke personen indien:

      a. deze een visserijonderneming in stand houden;

      b. de bruto-jaaromzet van de in onderdeel a bedoelde onderneming voor meer dan de helft uit visserij is verkregen;

      c. de in onderdeel a bedoelde onderneming naar het oordeel van de Minister een positieve liquiditeitstoename
      oplevert;

      d. deze wegens het ontbreken van de daartoe benodigde zekerheden volgens normaal bankgebruik onvoldoende
      financiering voor de visserijonderneming kunnen verkrijgen;

      e. deze voor zover rechtens is toegestaan, op alle toebehorende goederen goederenrechtelijke zekerheid verlenen
      voor alle door de kredietinstelling te verstrekken financieringen, waaronder de lening waarop de aanvraag
      betrekking heeft;

      f. deze beschikt over een visvergunning.

      2 Indien meer dan een natuurlijke persoon voor gezamenlijke rekening een visserijonderneming in stand houdt,
      voldoet elk van hen aan het eerste lid, onderdelen d en e.

      3 De garantstelling kan worden verstrekt ten behoeve van leningen aangegaan door rechtspersonen indien:

      a. zij blijkens de statuten de exploitatie van een of meer visserijondernemingen ten doel hebben

      b. de bruto-jaaromzet van de onderneming waarvoor een aanvraag wordt ingediend voor meer dan de helft uit visserij
      is verkregen;

      c. de in onderdeel b bedoelde onderneming naar het oordeel van de Minister een voldoende liquiditeitstoename
      oplevert;

      d. zij voldoen aan het eerste lid, d, e, en f.

      4 Bij de bepaling of wordt voldaan aan het bepaalde in het eerste lid, onderdeel c, en tweede lid, onderdeel c,
      wordt uitgegaan van een, zo nodig door de Minister gewijzigde, begroting die op de ondernemerscapaciteiten van de
      aanvrager is afgestemd en waaruit onder meer moet blijken dat:

      a. rente- en aflossingsverplichtingen, overige bedrijfsuitgaven, belastingen, premies en, voor zover geen sprake
      is van inkomsten uit tegenwoordige of vroegere arbeid van buiten de visserij waaruit deze kunnen worden bestreden,
      gezinsbestedingen kunnen worden betaald;

      b. de noodzakelijke vervangingsinvesteringen kunnen worden gerealiseerd;

      c. de liquiditeitstoename voldoende ruimte biedt om tegenvallers in de exploitatie op te vangen alsmede
      om aan toekomstige financieringsverplichtingen, onder andere als gevolg van noodzakelijke diepte- of
      uitbreidingsinvesteringen, te kunnen voldoen.
