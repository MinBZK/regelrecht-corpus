  - number: 2:10
    text: |-
      1 De subsidie bedraagt ten hoogste 50% van de kosten van een bedrijfsadvies.

      2 De subsidie bedraagt ten hoogste € 1.500.

      3 De subsidie wordt ten hoogste eenmaal per drie jaar verleend.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel210
  - number: 2:11
    text: |-
      1 De Minister kan aan een samenwerkingsverband van landbouwondernemingen, agro-MKB-ondernemingen,
      bosbouwondernemingen of kennisinstellingen subsidie verstrekken voor de uitvoering van een project dat is gericht
      op de onderlinge uitwisseling van voor elk van de aan het samenwerkingsverband deelnemende ondernemingen relevante
      kennis en ervaring met betrekking tot werkzaamheden in de landbouwsector of bosbouwsector.

      2 Het project heeft een duur van ten hoogste vijf jaar en heeft betrekking op:

      a. het voldoen aan wettelijke normen inzake milieu of waterbeheer, aan veterinaire, sanitaire regelgeving, aan
      fytosanitaire, hygiëne- of dierenwelzijnsregelgeving of aan arbeidsomstandighedenregelgeving, of

      b. het verkrijgen of vergroten van kennis en vaardigheden waarmee nieuwe, betere of hoogwaardigere producten kunnen
      worden verkregen of deze productiewijzen of productieprocessen kunnen worden verbeterd.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel211
  - number: 2:11a
    text: De subsidieontvanger vangt het project aan binnen drie maanden na de datum van de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel211a
  - number: 2:11b
    text: |-
      Indien het in de beschikking tot subsidieverlening vermelde subsidiebedrag € 125.000 of meer bedraagt, kan in de
      beschikking tot subsidieverlening worden bepaald dat de aanvraag tot subsidievaststelling vergezeld gaat van een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel211b
  - number: 2:12
    text: |-
      De volgende kosten komen in aanmerking voor de subsidie:

      a. de kosten van een procesbegeleider of projectuitvoerder;

      b. de kosten voor de organisatie en facilitering van het samenwerkingsverband, waaronder begrepen zaalhuur,
      vergaderfaciliteiten en bureaukosten;

      c. de kosten van het vastleggen en verspreiden van kennis, waaronder begrepen drukwerk en de kosten van de
      ontwikkeling en het beheer van internetapplicaties;

      d. de kosten voor het inhuren van kennis van overige landbouwondernemingen, deskundigen, onderzoekers of
      kennisinstellingen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel212
  - number: 2:13
    text: De subsidie bedraagt ten hoogste 80% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel213
  - number: 2:14
    text: |-
      1 Ter bevordering van de concurrentiekracht van de land- en bosbouw en van productiemethoden die verenigbaar zijn
      met de eisen inzake milieubescherming en natuurbeheer kan de Minister subsidie verstrekken voor de uitvoering van
      een project waarvan de activiteiten zijn gericht op het in de praktijk uittesten en demonstreren van de resultaten
      van vernieuwingen bij landbouwondernemingen, bosbouwondernemingen of agro-MKB-ondernemingen, met uitzondering van
      beroepsopleidingen en aan beroepsopleidingen gerelateerde cursussen.

      2 Voor de subsidie komen in aanmerking:

      a. landbouwondernemingen;

      b. samenwerkingsverbanden van landbouwondernemingen onderling, of van ten minste één landbouwonderneming en:

      1°. agro-MKB-ondernemingen, bosbouwondernemingen of ondernemingen, werkzaam in de voedselindustrie;

      2°. verenigingen of stichtingen, werkzaam op het gebied van de landbouwondernemingen of bosbouwondernemingen;

      3°. adviesbureaus;

      4°. onderwijs- en opleidingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel214
  - number: 2:15
    text: |-
      1 Een project heeft betrekking op:

      a. biologische landbouw, geïntegreerde landbouw of gesloten teeltsystemen;

      b. milieuverantwoorde benutting van meststoffen;

      c. beperking van de ammoniakemissies in de veehouderij;

      d. verwijdering en verwerking van organische afvalstoffen voor zover betrekking hebbende op de substraatteelt;

      e. beperking van milieubelasting door ondernemingen die zich richten op de be- of verwerking van, of handel in
      producten van de land- of bosbouw;

      f. terugdringing van het gebruik of de emissie van gewasbeschermingsmiddelen;

      g. duurzame energie, energiebesparing, energie-efficiency en energiemanagement;

      h. toepassing van nieuwe marktgerichte productiemethoden of verwerkingstechnieken, waaronder de ontwikkeling van
      nieuwe landbouwproducten of bijproducten en het openen van nieuwe markten;

      i. verbetering van logistieke systemen en informatietechnologie;

      j. verbetering van de kwaliteit van productieprocessen of -systemen, waaronder integrale borgingssystemen;

      k. verbetering van de horizontale, onderscheidenlijk verticale samenwerking in, onderscheidenlijk tussen
      opeenvolgende schakels in de productieketen van land- of bosbouwproducten;

      l. verbetering van arbeidsomstandigheden;

      m. verbetering van hygiëne;

      n. verbetering van de gezondheid of het welzijn van dieren;

      o. benutten en verbeteren van genetische en functionele agro-biodiversiteit om duurzame productie te bevorderen;

      p. verbetering van de kwaliteit en vergroting van de variatie van het bodemleven door goede
      bodembewerkingsmethoden, bemestingsmethoden en –technieken waardoor het watervasthoudend vermogen van de bodem
      toeneemt en uitspoeling van nutriënten vermindert;

      q. voorkomen van en omgaan met bodemverdichting en bestrijding van erosie;

      r. behouden en ontwikkelen van natuur- en landschapswaarden in agrarische gebieden;

      s. nemen van beheersmaatregelen die verdroging van natuurgebieden tegengaan.

      2 Een project komt voor de subsidie in aanmerking indien:

      a. het kan bijdragen aan de bevordering van de toepassing van nieuwe kennis of technologieën, die verder gaat dan
      de wettelijke minimumnormen;

      b. het betrekking heeft op vernieuwingen in de productiekolom van land- en bosbouwproducten die voldoende
      perspectief bieden voor toepassing op bedrijfsniveau;

      c. het, gelet op de doelstelling, de inhoud en het geografisch bereik, niet gelijk is aan projecten waarvoor in het
      kader van deze regeling eerder een subsidie is verleend;

      d. de uitvoeringstermijn ten hoogste drie jaar bedraagt, en

      e. de subsidiabele kosten in totaal ten minste € 15.000 bedragen.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel215
  - number: 2:16
    text: |-
      De Minister rangschikt een aanvraag overeenkomstig [artikel 1:4][ref1] hoger naarmate:

      a. het project waarop de aanvraag betrekking heeft:

      1°. gericht is op vernieuwingen die:

        - meer perspectief bieden voor toepassing op bedrijfsniveau, en
        - zich in een meer vergevorderd stadium van ontwikkeling bevinden;

      2°. meer bijdraagt aan het bevorderen van de toepassing van nieuwe kennis of technologieën in de gehele sector, en

      3°. een groter draagvlak heeft bij relevante vaktechnische-, dienstverlenende-, branche- of standsorganisaties;

      b. uit het communicatieplan, bedoeld in [artikel 2:17][ref2], blijkt dat met het project de relevante doelgroepen
      beter worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel217
