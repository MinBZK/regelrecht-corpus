      1 Indien in deze regeling is bepaald dat een subsidie kan worden verstrekt aan een samenwerkingsverband, komen voor
      de subsidie in aanmerking samenwerkingsverbanden die:

      a. zijn gericht op het realiseren van een van de doelstellingen waarvoor de subsidie kan worden verstrekt, en

      b. waarvan de deelnemers natuurlijke personen of rechtspersonen, ieder met een andere eigenaar en niet in eigendom
      van een deelnemende natuurlijke persoon, zijn.

      2 Ingeval een subsidie wordt verstrekt aan een samenwerkingsverband:

      a. berusten de verplichtingen die daaruit voortvloeien hoofdelijk op iedere deelnemer aan het samenwerkingsverband;

      b. kunnen onverschuldigd betaalde subsidiebedragen overeenkomstig
      [artikel 4:57 van de Algemene wet bestuursrecht][ref1] hoofdelijk worden teruggevorderd bij iedere deelnemer aan
      het samenwerkingsverband.


