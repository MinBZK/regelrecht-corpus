  - number: 2:56
    text: |-
      Met de indiening van een aanvraag tot verlening van de subsidie stemt de aanvrager ermee in dat de Stichting
      Skal aan de Dienst Regelingen alle gegevens overlegt die betrekking hebben op de uitoefening van de biologische
      productiemethode op zijn landbouwonderneming.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel256
  - number: 2:57
    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. de eenmalige aansluitingsbijdrage, bedoeld in [artikel 2 van het Skal-bijdragereglement][ref1], en

      b. de basisbijdrage, bedoeld in [artikel 3, onderdeel a, van het Skal-bijdragereglement][ref2].

      2 Incassokosten, administratiekosten en overige kosten die zijn verbonden aan de inning van de in het eerste lid
      bedoelde bijdragen komen niet in aanmerking voor de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0018852#Artikel2
