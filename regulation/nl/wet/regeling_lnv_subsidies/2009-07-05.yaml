  - number: 2:3
    text: |-
      1 Ter stimulering van de duurzame ontwikkeling van de land- en bosbouwsector kan de Minister aan een
      landbouwonderneming, agro-MKB-onderneming of bosbouwonderneming subsidie verstrekken voor de uitvoering van de
      volgende activiteiten:

      a. een bedrijfsconsult;

      b. het volgen van opleidingen, trainingen of voorlichtingsbijeenkomsten door ondernemers of in de onderneming
      werkzame personen bij daartoe gespecialiseerde instellingen of organisaties.

      2 Een bedrijfsconsult bevat een op de onderneming toegesneden advies omtrent de ontwikkeling of beëindiging van die
      onderneming en heeft betrekking op:

      a. het verrichten van bedrijfsdoorlichtingen, met uitzondering van kwaliteits- en productcontroles door
      deskundigen;

      b. het laten verrichten van onderzoek, met uitzondering van kwaliteits- en productcontroles door deskundigen, met
      het oog op de ontwikkeling van landbouwproducten van hoge kwaliteit;

      c. het opstellen van plannen gericht op de ontwikkeling van de onderneming;

      d. het opstellen van plannen gericht op de beëindiging van de onderneming;

      e. het opstellen van plannen gericht op de toepassing van kwaliteitsregelgeving op de onderneming;

      f. het opstellen van plannen gericht op risicobeheer, of

      g. het opstellen van plannen gericht op het ontwikkelen van samenwerkingsverbanden tussen landbouwondernemingen
      onderling, of met agro-MKB-ondernemingen.

      3 Een opleiding, training of voorlichtingsbijeenkomst heeft betrekking op:

      a. het voldoen aan wettelijke normen inzake milieu of waterbeheer, aan veterinaire, sanitaire of fytosanitaire
      regelgeving, aan hygiëne- of dierenwelzijnsregelgeving of aan arbeidsomstandighedenregelgeving;

      b. het verkrijgen of vergroten van kennis en vaardigheden waarmee nieuwe, betere of hoogwaardigere producten kunnen
      worden verkregen of deze productiewijzen of productieprocessen kunnen worden verbeterd;

      c. begeleiding bij het starten of beëindigen van de onderneming of een onderdeel daarvan.

      4 Geen subsidie wordt verstrekt voor:

      a. opleidingen, trainingen of voorlichtingsbijeenkomsten die onderdeel van normale programma’s of van leergangen
      voor middelbaar of hoger landbouw- en bosbouwonderwijs vormen;

      b. activiteiten waarvan de subsidiabele kosten in totaal minder bedragen dan € 250.
