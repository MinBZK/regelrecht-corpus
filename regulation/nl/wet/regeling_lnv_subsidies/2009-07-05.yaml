  - number: 1:9
    text: |-
      1 Bij een aanvraag tot subsidieverlening wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft wordt of zal worden gefinancierd.

      2 Een aanvraag tot subsidieverlening voor een project gaat vergezeld van een projectplan, waarin ten minste is
      opgenomen:

      a. een beschrijving van het project, waaronder:

      1°. de doelstellingen;

      2°. een probleemanalyse waaruit onder andere de noodzaak van het project en de ter uitvoering daarvan te maken
      kosten blijkt;

      3°. de activiteiten en de wijze van uitvoering;

      4°. voor zover van toepassing een overzicht van de aan het samenwerkingsverband deelnemende ondernemingen en de
      verdeling van verantwoordelijkheden, bevoegdheden en financiële verplichtingen van de deelnemers.

      b. informatie waaruit blijkt in hoeverre het project bijdraagt aan de doeleinden waarvoor de subsidie wordt
      verstrekt;

      c. een sluitende begroting voor het project, die een meerjarenbegroting is met liquiditeitsplanning per jaar voor
      zover het project langer dan een jaar duurt, met toelichting daarop;

      d. criteria voor het toetsen van de resultaten van het project;

      e. de verwachte realisatietermijn, met een beschrijving van het tijdpad en mijlpalen indien die termijn langer dan
      een jaar is.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel19
  - number: 1:10
    text: |-
      1 Bij toepassing van de procedure, bedoeld in [artikel 1:4][ref1], wordt een beschikking omtrent subsidieverlening
      gegeven binnen vier maanden na afloop van de periode voor het aanvragen van subsidieverlening.

      2 Bij toepassing van de procedure, bedoeld in [artikel 1:5][ref2], wordt een beschikking omtrent subsidieverlening
      gegeven binnen acht weken na afloop van de periode voor het aanvragen van subsidieverlening.


