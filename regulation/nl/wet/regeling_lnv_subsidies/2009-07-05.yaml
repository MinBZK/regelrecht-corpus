  - number: 3:34
    text: |-
      De Minister kan op aanvraag aan de IVN Vereniging voor natuur- en milieueducatie, statutair gevestigd te Amsterdam,
      en de Stichting Samenwerkingsverband Nationale Parken, statutair gevestigd te ’s-Gravenhage, subsidie verstrekken
      voor projecten gericht op kwaliteitsverbetering, samenwerking, educatie, voorlichting en onderzoek van:

      a. een door de Minister aangewezen nationaal park dan wel nationaal park in oprichting, of

      b. een door het Rijk gezamenlijk met het Koninkrijk België of de Bondsrepubliek Duitsland als grensoverschrijdende
      park aangewezen of aan te wijzen gebied, waarvoor afspraken gelden met betrekking tot het beheer en de inrichting
      daarvan.
