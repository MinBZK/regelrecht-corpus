    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. bijdragen aan derden voor het opstellen dan wel het laten opstellen van landschapsontwikkelingsplannen;

      b. kosten van onderzoeken die nodig zijn voor het opstellen van landschapsontwikkelingsplannen;

      c. kosten van de in [artikel 3:41, derde lid, onderdeel g][ref1], bedoelde activiteiten, in totaal tot ten hoogste
      € 75.000, voor zover het betreft:

      1°. het ontwikkelen en inzetten van communicatie-instrumenten die het draagvlak voor het
      landschapsontwikkelingsplan bevorderen, waaronder het geven van voorlichting en het organiseren van een
      maatschappelijk debat over het landschapsontwikkelingsplan;

      2°. het voorbereiden en afsluiten van overeenkomsten met derden op het gebied van financiering, inrichting en
      beheer;

      3°. het bevorderen van de beschikbaarstelling van lokale middelen voor de uitvoering van het
      landschapsontwikkelingsplan.

      2 In afwijking van [artikel 1:2, tweede lid][ref2], komen de kosten, bedoeld in het eerste lid, onderdeel
      c, uitsluitend voor subsidie in aanmerking ingeval de activiteiten waarop die kosten betrekking hebben zijn
      aangevangen op of na de datum van de subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel12
