    text: |-
      De aanvraag tot subsidievaststelling gaat vergezeld van een accountantsverklaring ingeval de subsidiabele kosten in
      totaal meer bedragen dan € 22.500.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel37
  - number: 3:8
    text: |-
      Een beschikking omtrent subsidievaststelling wordt gegeven binnen vier maanden na ontvangst van de aanvraag tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel38
  - number: 3:9
    text: |-
      1 De volgende kosten komen in aanmerking voor de subsidie:

      a. loonkosten van het direct bij de uitvoering van het project of programma betrokken personeel in dienst van de
      subsidieontvanger;

      b. kosten van verbruikte materialen of hulpmiddelen;

      c. kosten van vrijwilligers, voor zover deze een vrijwilligersvergoeding ontvangen, per kalenderjaar tot ten
      hoogste het bedrag dat jaarlijks belastingvrij als vrijwilligersvergoeding kan worden verstrekt, met dien verstande
      dat het maximum evenredig wordt aangepast indien een vrijwilliger dat kalenderjaar niet volledig werkzaam is
      geweest;

      d. aan derden verschuldigde kosten ter zake van planvormings- en uitvoeringsactiviteiten tot ten hoogste 35% van de
      in de onderdelen a, b en c genoemde kosten;

      e. reis- en verblijfkosten;

      f. de voor de vaststelling van de subsidie benodigde accountantsverklaring, tot ten hoogste € 1.800;

      g. kosten voor overhead tot ten hoogste een bedrag dat gelijk is aan 10% van de ingevolge onderdeel a voor subsidie
      in aanmerking komende loonkosten;

      h. kosten als bedoeld in de onderdelen b tot en met f die onvoorzien zijn, tot ten hoogste 15% van het bedrag dat
      wel is voorzien.

      2 In aanvulling op het eerste lid komen voor subsidies voor programma’s tevens in aanmerking de kosten van de in
      [artikel 1:13, tweede lid, aanhef in samenhang met onderdeel b][ref1], bedoelde beschrijving tot ten hoogste 10%
      van de in het eerste lid, onderdelen a tot en met e, bedoelde kosten.


