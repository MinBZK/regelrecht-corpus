      1 Als beheersautoriteit als bedoeld in artikel 58, eerste lid, onderdeel a, van verordening nr. 1198/2006 wordt
      aangewezen de Minister.

      2 Als certificeringsautoriteit als bedoeld in artikel 58, eerste lid, onderdeel b, van verordening nr. 1198/2006
      wordt aangewezen de Afdeling CA van de Dienst Regelingen.

      3 Als auditautoriteit als bedoeld in artikel 58, eerste lid, onderdeel c, van verordening nr. 1198/2006 wordt
      aangewezen de Rijksauditdienst van het Ministerie van Financiën.

      4 Als bemiddelende instantie als bedoeld in artikel 58, tweede lid, van verordening nr. 1198/2006 wordt aangewezen
      de Back Office West van de Dienst Regelingen.
