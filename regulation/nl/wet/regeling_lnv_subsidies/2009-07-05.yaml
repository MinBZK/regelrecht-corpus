  - number: 3:18
    text: |-
      De volgende kosten komen in aanmerking voor de subsidie:

      a. kosten die gemaakt worden teneinde de uitgangssituatie van het terrein vast te leggen;

      b. kosten van een wetenschappelijk advies;

      c. kosten van planvoorbereiding;

      d. kosten van directie en toezicht;

      e. kosten van uitvoering en aanleg;

      f. kosten van monitoring en effectmeting van de maatregel;

      g. kosten van terreingebonden voorlichting, voor zover de voorlichting betrekking heeft op de activiteit waarop de
      subsidie betrekking heeft;

      h. legeskosten voor vergunningen;

      i. aan- en afvoerkosten van materieel;

      j. kosten van terreinvoorbereiding ten behoeve van de uit te voeren activiteit.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel318
  - number: 3:19
    text: |-
      1 De subsidie bedraagt ten hoogste 95% van de subsidiabele kosten.

      2 Opbrengsten die voortvloeien uit de werkzaamheden waarvoor de subsidie wordt verstrekt, worden in mindering
      gebracht op de subsidie.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel319
  - number: 3:20
    text: |-
      1 In deze titel wordt verstaan onder:

        - beschermde historische buitenplaats: in het register, bedoeld in [artikel 6 van de Monumentenwet 1988][ref1], als
      historische buitenplaats vermeld complex;
        - particulier eigenaar: a. natuurlijke persoon die het recht van eigendom of een ander zakelijk recht heeft op
      een beschermde historische buitenplaats of een gedeelte daarvan; b. naamloze vennootschap of besloten vennootschap
      met beperkte aansprakelijkheid als bedoeld in [artikel 7a van de Natuurschoonwet 1928][ref2], voor zover de
      aandeelhouders uitsluitend natuurlijke personen zijn, die het recht van eigendom of een ander zakelijk recht heeft
      op een beschermde historische buitenplaats of een gedeelte hiervan; c. rechtspersoon die krachtens privaatrecht
      is ingesteld en die het recht van eigendom of een ander zakelijk recht op een beschermde historische buitenplaats
      of een gedeelte hiervan heeft verkregen van een natuurlijke persoon als bedoeld in het eerste lid of van een
      vennootschap als bedoeld in het tweede lid, en die zich uitsluitend of nagenoeg uitsluitend ten doel stelt die
      buitenplaats in stand te houden;
        - Stichting: Stichting tot behoud van Particuliere Historische Buitenplaatsen te Heerde, statutair gevestigd te
      Heerde.

      2 Onder beschermde historische buitenplaats wordt in [paragraaf 2][ref3] van deze titel mede verstaan: als
      historische buitenplaats aan te merken complex waarvoor een verzoek tot aanwijzing als beschermd monument
      overeenkomstig [artikel 3 van de Monumentenwet 1988][ref4] in de procedure is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel3
