      op [artikel 4:57][ref2] van deze regeling en geldt het als een besluit op grond van [artikel 1:3][ref3] van deze
      regeling.

      2 De [Regeling garantstelling visserij][ref4] blijft van kracht voor zover dat nodig is voor een juiste toepassing
      van de raamovereenkomst, bedoeld in [artikel 4:54][ref5], die is gesloten tussen de kredietinstellingen en de
      Minister.


