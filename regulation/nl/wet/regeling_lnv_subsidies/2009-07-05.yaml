  - number: 2:80
    text: |-
      1 In afwijking van [artikel 2:79, eerste lid][ref1], bedraagt de garantstelling ten hoogste € 2.500.000 ingeval aan
      de bepalingen van dit artikel is voldaan.

      2 De aanvraag tot garantstelling is gericht op de terugbetaling van een lening die strekt tot financiering van de
      volgende investeringen:

      a. investeringen in een duurzame melkveestal, varkensstal of pluimveestal die:

      1. voldoet aan de eisen van het certificatieschema Maatlat Duurzame Veehouderij, hetgeen blijkt uit een voorlopig
      certificaat dat is afgegeven door een door de Raad voor Accreditatie hiervoor geaccrediteerde organisatie, en
      waarvoor geldt dat:

        - binnen twee jaar na afgifte van het voorlopig certificaat een definitief certificaat wordt overgelegd, dan wel
        - binnen drie jaar een definitief certificaat wordt overgelegd volgens de dan vigerende Maatlat Duurzame
      Veehouderij, en

      2. bestaat uit ruimten waarin dieren worden gehuisvest, stalinrichting, klimaattechnische en voertechnische
      systemen, ammoniakemissiereducerende systemen, mestafvoer en mestopslag;

      b. investeringen in een Groen Label Kas als bedoeld in
      [artikel 1, onderdeel g, van de Regeling groenprojecten 2005][ref2];

      c. aankoop van grond voor de uitoefening van de glastuinbouw, mits de betrokken kavel ten minste 80 meter breed is
      met een lengte-breedte-verhouding van ten hoogste 2:1.

      3 De garantstelling wordt verstrekt ter zake van een investeringsplan, waarbij ten minste de helft van de
      investeringen betrekking heeft op investeringen als bedoeld in het tweede lid.

      4 Een garantstelling als bedoeld in dit artikel kan tevens worden verstrekt voor de terugbetaling van leningen die
      zijn achtergesteld ten opzichte van andere vorderingen van de kredietinstelling, waarbij geldt dat:

      a. slechts garantstelling wordt verstrekt voor zover de omvang van de achtergestelde lening kleiner is dan het
      eigen vermogen van de landbouwonderneming waarop de aanvraag tot garantstelling betrekking heeft;

      b. [artikel 2:72, eerste lid, onderdeel b][ref3], niet van toepassing is, en

      c. achtergestelde leningen een looptijd hebben van ten hoogste tien jaar en niet lineair hoeven te worden afgelost,
      in afwijking van [artikel 2:73, eerste lid, onderdelen b en c][ref4].


