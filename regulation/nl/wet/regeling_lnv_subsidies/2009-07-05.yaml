  - number: 4:34
    text: |-
      1 De Minister kan aan de eigenaar van een vissersvaartuig subsidie verstrekken voor het moderniseren van
      vissersvaartuigen en het aanbrengen van voorzieningen aan boord van vissersvaartuigen ter verbetering van de
      veiligheid aan boord, de arbeidsomstandigheden, de hygiëne, de productkwaliteit en met name energie-efficiëntie
      en selectiviteit.

      2 Aan een eigenaar van een vissersvaartuig wordt geen subsidie verstrekt:

      a. indien het betrokken vissersvaartuig op het moment van het indienen van de aanvraag nog geen vijf jaar oud is;

      b. indien de voorziening of modernisering waarvoor de subsidie wordt aangevraagd, naar het oordeel van de Minister
      zou leiden tot een toename van de vangstcapaciteit van het vaartuig;

      c. voor de bouw van een vissersvaartuig en de vergroting van een visruim.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel434
  - number: 4:35
    text: |-
      1 Het moderniseren van vissersvaartuigen en het aanbrengen van voorzieningen aan boord ter verbetering van de
      selectiviteit van vistuigen, inclusief maximaal twee vervangingen van vistuig in de periode 2007-2013, is enkel
      subsidiabel indien:

      a. het betrokken vissersvaartuig in het bezit is van een speciaal visdocument voor een herstelplan als bedoeld in
      artikel 5 van verordening nr. 2371/2002 en de eigenaar met dat vaartuig na de aanvraag overschakelt op een andere
      visserijmethode en de visserij uitoefent op een andere doelsoort, waarvan de toestand van het bestand nog toelaat
      te vissen, of

      b. het nieuwe tuig selectiever is en beantwoordt aan de erkende milieucriteria en praktijken die verder reiken dan
      de bestaande wettelijke verplichtingen.

      2 In afwijking van en onverminderd het eerste lid kan de Minister aan een aanvrager in de periode 2007 – 2013
      eenmaal subsidie als bedoeld in [artikel 4:34][ref1] verlenen voor het vervangen van vistuig indien:

      a. de subsidieontvanger overeenkomstig artikel 25, achtste lid, van verordening nr. 1198/2006 met het vervangen van
      het oude vistuig voldoet aan de nieuwe technische eisen inzake selectiviteit uit hoofde van het communautaire recht
      en deze eisen nog niet verplicht zijn gesteld of de Europese verordening waarin de eisen zijn opgenomen een periode
      bepaalt waarin subsidiëring is toegestaan, of

      b. de visserij met het nieuwe vistuig aantoonbaar minder effect heeft op niet-commerciële aquatische soorten dan
      visserij met het vervangen vistuig.

      3 De Minister kan per vissersvaartuig in de periode 2007 – 2013 eenmaal subsidie als bedoeld in
      [artikel 4:34][ref2] verlenen voor het vervangen van de hoofdmotor, indien:

      a. het vaartuig een lengte van ten hoogste 24 meter heeft;

      b. het vaartuig bij de visserij gebruik maakt van gesleept vistuig, en

      c. de nieuwe motor ten minste 20% minder vermogen heeft dan het vermogen vermeld op de visvergunning.


