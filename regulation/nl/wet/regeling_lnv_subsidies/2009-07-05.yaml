  - number: 1:6
    text: |-
      1 In afwijking van [artikel 1:4][ref1] is het onderhavige artikel van toepassing, ingeval dit in deze regeling van
      toepassing is verklaard.

      2 De Minister rangschikt aanvragen tot subsidieverlening die in een zelfde aanvraagperiode zijn ingediend in
      volgorde van ontvangst, waarbij aanvragen met dezelfde ontvangstdatum worden gerangschikt door loting voor zover op
      die datum het subsidieplafond wordt overschreden.

      3 Volgens de rangschikking, bedoeld in het tweede lid, komt de hoogst gerangschikte aanvraag het eerst voor
      subsidie in aanmerking.

      4 Ingeval een aanvraag onvolledig is, wordt de aanvraag voor de toepassing van het tweede lid geacht te zijn
      ontvangen op de datum waarop de ontbrekende gegevens en bescheiden zijn ontvangen.


