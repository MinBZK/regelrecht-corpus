  - number: 1:15
    text: |-
      1 De volgende kosten komen niet in aanmerking voor subsidie:

      a. kosten die uit andere hoofde zijn of worden gesubsidieerd of gefinancierd van overheidswege;

      b. kosten die niet aantoonbaar rechtstreeks aan de activiteit waarop de subsidie betrekking heeft zijn toe te
      rekenen;

      c. debetrente;

      d. kosten voor activiteiten die worden uitgevoerd in strijd met EG-maatregelen of nationale voorschriften die
      daarop van toepassing zijn.

      2 Kosten voor aankoop van grond komen uitsluitend in aanmerking voor subsidie tot een hoogte van 10% van het totale
      subsidiebedrag.

      3 Verschuldigde BTW komt uitsluitend voor subsidie in aanmerking ingeval de aanvrager de BTW niet kan verrekenen
      met de door hem af te dragen omzetbelasting.

      4 In aanvulling op de voorschriften, gesteld in deze regeling, kan de Minister bij de openstelling, bedoeld in
      [artikel 1:3, eerste lid][ref1], nadere voorschriften stellen over de voor een subsidie in aanmerking komende
      kosten.

      5 Indien in deze regeling is bepaald dat loonkosten of kosten voor eigen arbeid in aanmerking komen voor een
      subsidie:

      a. worden de kosten bepaald aan de hand van een uurtarief dat wordt berekend door eerst het bruto jaarloon te
      verminderen met de volledig winstafhankelijke uitkeringen en te verhogen met de premies voor sociale verzekeringen,
      VUT en pensioen, en dat bedrag vervolgens te delen door 1600, en

      b. komen de kosten uitsluitend in aanmerking tot ten hoogste het bedrag dat als normbedrag is opgenomen in de
      Handleiding Overheidstarieven van het Ministerie van Financiën. Hierbij wordt uitgegaan van ten hoogste de volgende
      salarisschalen:

      1°. schaal 6 voor ondersteunend personeel;

      2°. schaal 11 voor uitvoerend personeel;

      3°. schaal 13 voor toezichthoudend personeel.


