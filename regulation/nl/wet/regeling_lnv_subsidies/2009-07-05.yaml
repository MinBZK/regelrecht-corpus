  - number: 4a:5
    text: |-
      In afwijking van [artikel 1:8, eerste lid][ref1], wordt de aanvraag tot subsidieverlening, subsidievaststelling of
      voorschotverlening ingediend bij de Directeur van de Directie Kennis en Innovatie van het Ministerie van Landbouw,
      Natuur en Voedselkwaliteit, met gebruikmaking van een daartoe vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel18
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a5
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 1:8
        hoofdstuk: '1'
  - number: 4a:6
    text: |-
      De aanvraag tot subsidieverlening gaat vergezeld van een beschrijving van de doelen en van de activiteiten die
      ondernomen worden, welke bijdrage aan innovatie en duurzaamheid gerealiseerd wordt, welke partijen, doelgroepen en
      bestaande kennisnetwerken betrokken worden en welke instrumenten ingezet worden om het doel te bereiken.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a6
  - number: 4a:7
    text: |-
      1 De subsidieontvanger draagt zorg voor een functionerend kwaliteitszorg-mechanisme dat zorgt voor een samenhang
      tussen de doelstelling en activiteiten van de groene-plus lectoraten.

      2 De subsidieontvanger moet in elk geval meer dan 40% van de verleende subsidie gebruiken voor het
      professionaliseren van docenten ter verhoging van het kennisniveau en om de deelname van studenten en docenten, die
      niet al deel uitmaken van het groene-plus lectoraat, aan onderzoek te vergroten.

      3 De subsidieontvanger en de deelnemers aan de groene-plus lectoraten werken mee aan door of namens de Minister
      ingestelde activiteiten die gericht zijn op het monitoren en verspreiden van kennis.

      4 De subsidieontvanger brengt uiterlijk op 1 juli van elk jaar en 1 oktober van het jaar daarop een
      tussenrapportage uit van de voortgang van het groene-plus lectoraat voor wat betreft de doelstelling en de
      subsidiabele activiteiten, bedoeld in [artikel 4a:3][ref1].

      5 De tussenrapportages bedoeld in het vierde lid worden ingediend bij de Directeur van de Directie Kennis en
      Innovatie van het Ministerie van Landbouw, Natuur en Voedselkwaliteit volgens een daartoe vastgesteld format en
      bevatten een beschrijving van

      a. de activiteiten die tot dan toe zijn verricht;

      b. de mate waarin de activiteiten hebben bijgedragen aan de in de aanvraag omschreven doelstelling;

      c. de stand van zaken en planning ter zake van de financiën.

      6 In de administratie, bedoeld in [artikel 1:12, tweede lid][ref2], zijn de loonkosten en de kosten voor door het
      personeel van de subsidieontvanger verrichte arbeid door middel van een sluitende urenregistratie vastgelegd.

      7 De subsidieontvanger legt jaarlijks in het jaarverslag verantwoording af over de inzet van de op basis van deze
      titel verstrekte subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel4a3
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel112
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel4a7
    references:
