  - number: 1:8
    text: |-
      1 Een aanvraag tot subsidieverlening, subsidievaststelling of voorschotverlening wordt ingediend bij de Directeur
      van de Dienst Regelingen met gebruikmaking van een daartoe door de Dienst Regelingen verstrekt formulier.

      2 In aanvulling op de voorschriften, gesteld in deze regeling, kan de Minister bij de openstelling, bedoeld in
      [artikel 1:3, eerste lid][ref1], nadere voorschriften stellen over de indiening van een aanvraag.


