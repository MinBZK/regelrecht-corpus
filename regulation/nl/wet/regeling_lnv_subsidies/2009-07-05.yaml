  - number: 2:1a
    text: |-
      Aan een landbouwonderneming of agro-MKB-onderneming wordt geen subsidie verstrekt indien:

      a. de onderneming moet worden aangemerkt als een onderneming als bedoeld in paragraaf 2.1 van de communautaire
      richtsnoeren voor reddings- en herstructureringssteun (PbEU C 244);

      b. overeenkomstig artikel 1, zesde lid, onderdeel a, van Verordening (EG) nr. 800/2008 er ten aanzien van de
      onderneming een uitstaand bevel tot terugvordering is ingevolge een eerdere beschikking van de Europese Commissie
      waarin de steun onrechtmatig en onverenigbaar met de gemeenschappelijke markt is verklaard.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel21a
  - number: 2:2
    text: |-
      In aanvulling op [artikel 1:15][ref1], komen de volgende kosten niet in aanmerking voor subsidie op grond van dit
      hoofdstuk:

      a. de aankoop van agrarische productierechten, dieren, planten en de aanplant van planten voor niet-permanente
      gewassen;

      b. vervangingsinvesteringen;

      c. legeskosten;

      d. reguliere investeringen in de onderneming van de subsidieontvanger en kosten van eigen arbeid van de betrokken
      ondernemer;

      e. kosten voor de vervaardiging van producten die melk en zuivelproducten imiteren of vervangen.


