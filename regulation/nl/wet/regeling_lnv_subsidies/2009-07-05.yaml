      aanvragen van subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel315
  - number: 3:16
    text: |-
      1 De subsidieontvanger aan wie een subsidie voor activiteiten als bedoeld in
      [artikel 3:11, tweede lid, onderdeel a, onder 11° of 12°, en onderdeel c][ref1], is verleend, meldt aan
      de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit de datum waarop de
      werkzaamheden zullen worden uitgevoerd.

      2 De subsidieontvanger draagt er zorg voor dat de melding uiterlijk de tweede dag vóór de dag van uitvoering van
      de werkzaamheden door de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit is
      ontvangen.


