  - number: 3:43
    text: |-
      De Stichting Landschapsbeheer Nederland adviseert de Minister bij de beoordeling van aanvragen tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel343
  - number: 3:44
    text: |-
      1 Het project wordt vóór 1 november in het tweede jaar volgend op de aanvraag tot subsidieverlening uitgevoerd.

      2 De Minister kan op verzoek van de subsidieontvanger uitstel van uitvoering van de verplichting, bedoeld in het
      eerste lid, verlenen met ten hoogste één jaar.

      3 Ten minste één jaar doch uiterlijk 15 maanden na de datum van subsidievaststelling dient de subsidieontvanger
      bij de Directeur van de Dienst Regelingen een rapportage in waarin is aangegeven op welke wijze het
      landschapsontwikkelingsplan is en zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel344
  - number: 3:45
    text: |-
      In afwijking van [artikel 1:14][ref1], wordt een subsidievaststelling aangevraagd door verantwoordingsinformatie
      aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties te verstrekken, op een wijze als bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref2].


