    text: |-
      1 Een garantstelling wordt verstrekt voor een minimumbedrag van € 90.000,– en een maximumbedrag van € 450.000,–.

      2 De garantie wordt ten hoogste verstrekt voor twee derde van voor de investeringen benodigde financieringen, minus
      de eigen beschikbare middelen, rekening houdende met de financieringsmogelijkheden op basis van de beschikbare
      zekerheden en de wijze waarop de beschikbare eigen middelen optimaal kunnen worden aangewend.

      3 De looptijd van de lening waarvoor garantstelling wordt verstrekt kan ten hoogste 10 jaar bedragen en de lening
      wordt lineair afgelost.

      4 De uiterste datum waarop de lening volledig moet zijn opgenomen, mag niet later liggen dan een jaar na de datum
      van de beschikking tot verstrekking van garantstelling.

      5 De garantstelling kan slechts worden verstrekt ten behoeve van een lening verstrekt door een kredietinstelling
      waarmee de Minister een raamovereenkomst heeft gesloten, waarin de rechten en plichten van de Minister en de
      kredietinstelling zijn vastgelegd.

      6 [Artikel 4:1, derde lid][ref1], is niet van toepassing op een beschikking tot verstrekking van garantstelling op
      grond van [artikel 4:53][ref2].


