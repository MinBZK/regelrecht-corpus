  - number: 2:25
    text: |-
      1 De Minister verstrekt op aanvraag een vergoeding aan een kennisinstelling die voor eigen rekening en risico een
      activiteit als bedoeld in [artikel 2:22, eerste lid][ref1], heeft uitgevoerd en in verband daarmee een of meer
      geldige vouchers overlegt.

      2 Geen vergoeding wordt verstrekt voor de uitvoering van een activiteit waartoe de onderneming en de
      kennisinstelling reeds voor de afgiftedatum van de voucher verplichtingen jegens elkaar zijn aangegaan.

      3 Voor vergoeding komen de door de kennisinstelling voor de activiteit gemaakte kosten in aanmerking, met dien
      verstande dat:

      a. niet meer wordt vergoed dan de waarde van de door de kennisinstelling overgelegde vouchers;

      b. per activiteit ten hoogste tien vouchers voor vergoeding kunnen worden overgelegd;

      c. uitsluitend vouchers die op naam staan van de onderneming voor wie de activiteit is uitgevoerd voor vergoeding
      kunnen worden overgelegd.


