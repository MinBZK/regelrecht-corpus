  - number: 2:8
    text: |-
      1 De Minister kan subsidie aan een landbouwonderneming of bosbouwonderneming verstrekken voor een schriftelijk
      advies door een bedrijfsadviesdienst omtrent de wijze waarop de onderneming kan worden ontwikkeld of voortgezet
      overeenkomstig ten minste:

      a. de beheerseisen, bedoeld in artikel 4 van [verordening (EG) nr. 1782/2003](32003R1782), in samenhang met bijlage
      III bij [verordening (EG) nr. 1782/2003](32003R1782);

      b. de minimumeisen inzake goede landbouw- en milieuconditie, bedoeld in artikel 5 van [verordening (EG) nr.
      1782/2003](32003R1782), in samenhang met bijlage IV bij [verordening (EG) nr. 1782/2003](32003R1782), en

      c. arbeidsveiligheidsstandaards die zijn gebaseerd op EG-maatregelen.

      2 De bedrijfsadviesdienst:

      a. heeft de beschikking over voldoende personeel dat beschikt over de voor het verstrekken van bedrijfsadviezen
      vereiste kwalificaties op een voor de inhoud van het advies relevant terrein;

      b. beschikt over de benodigde administratieve en technische faciliteiten;

      c. is ervaren in het verstrekken van adviezen met betrekking tot de in het eerste lid genoemde onderwerpen;

      d. staat als betrouwbaar te boek;

      e. staat ingeschreven bij een Kamer van Koophandel als organisatie die zich het geven van adviezen ten doel stelt;

      f. heeft ten minste één jaar ervaring in het verstrekken van adviezen op ten minste één van de in het eerste lid,
      onderdelen a tot en met c genoemde aspecten;

      g. is in het betrokken kalenderjaar ten minste 28 dagen voor de eerste mogelijkheid tot het doen van een aanvraag
      door de Minister is opengesteld, aangemeld als bedrijfsadviesdienst bij de Dienst Regelingen.

      3 Het advies is gebaseerd op een op de betrokken landbouwonderneming of bosbouwonderneming uitgevoerd onderzoek,
      waarin wordt aangegeven welke eisen als bedoeld in het eerste lid op de onderneming van toepassing zijn en in
      hoeverre aan die eisen wordt voldaan.

      4 De subsidie wordt betaald aan de bedrijfsadviesdienst.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel28
  - number: 2:9
    text: |-
      1 In afwijking van [artikel 1:4][ref1] rangschikt de Minister aanvragen tot subsidieverlening die in een zelfde
      aanvraagperiode zijn ingediend in de navolgende volgorde van categorieën:

      a. aanvragen, afkomstig van ondernemingen die in het jaar, voorafgaand aan de aanvraag, € 15.000 of meer aan
      rechtstreekse betalingen uit hoofde van [verordening (EG) nr. 1782/2003](32003R1782) hebben ontvangen;

      b. aanvragen, afkomstig van ondernemingen die in de drie jaren voorafgaand aan de aanvraag geen gebruik hebben
      gemaakt van de subsidie;

      c. overige aanvragen.

      2 Binnen de categorieën, bedoeld in het eerste lid, worden aanvragen gerangschikt in volgorde van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel14
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 1:4
        hoofdstuk: '1'
  - number: 2:9a
    text: |-
      De subsidieontvanger laat de activiteiten waarvoor subsidie is verleend binnen zes maanden uitvoeren na de datum
      van subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel29a
  - number: 2:9b
    text: |-
      In afwijking van [artikel 1:14, eerste lid][ref1], wordt de aanvraag tot subsidievaststelling binnen negen maanden
      na de datum van subsidieverlening ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel114
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel29b
