  - number: 3:21
    text: |-
      1 De Minister kan aan de Stichting subsidie verstrekken voor de uitvoering van projecten die een bijdrage leveren
      aan:

      a. de instandhouding van beschermde historische buitenplaatsen van particuliere eigenaren, op verzoek van die
      eigenaren aan de Stichting;

      b. het vergroten en verbeteren van de kennis en de deskundigheid ten behoeve van het behoud van beschermde
      historische buitenplaatsen van particuliere eigenaren.

      2 Voor subsidie komen in aanmerking projecten die beschermde historische buitenplaatsen betreffen waarvan:

      a. de aanleg dateert van voor 1850 en herkenbaar aanwezig is;

      b. de tuin- of parkaanleg tenminste 1 hectare omvat; en

      c. de particuliere eigenaar is aangesloten bij de Stichting.

      3 De projecten hebben betrekking op:

      a. regulier onderhoud van tuin- of parkaanleg;

      b. het opstellen of herzien van een beheerplan voor de tuin- of parkaanleg.
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel321
  - number: 3:21a
    text: |-
      1 Het regulier onderhoud, bedoeld in [artikel 3:21, derde lid, onderdeel a][ref1], komt uitsluitend voor subsidie
      in aanmerking indien:

      a. dit onderhoud gebaseerd is op een door de Stichting opgesteld meerjarenplan waarin de volgende onderdelen zijn
      opgenomen:

      1°. de kengegevens van de buitenplaats;

      2°. de redengevende omschrijving uit het Monumentenregister;

      3°. een planning voor drie jaar ten behoeve van regulier en periodiek onderhoud, uit te voeren door de Stichting;

      4°. de uit te voeren werkzaamheden per terreintype; en

      5°. een terreintypekaart met daarop aangegeven de terreingedeelten waarop de werkzaamheden plaatsvinden;

      b. daarvoor een jaarcontract tussen de Stichting en de particuliere eigenaar is afgesloten waarin de uit te voeren
      werkzaamheden per terreintype zijn opgenomen.

      2 Een beheerplan als bedoeld in [artikel 3:21, derde lid, onder b][ref2]:

      a. bevat tenminste:

      1°. een inventarisatie van cultuurhistorische, tuin- en landschapsarchitectonische en natuur- en recreatieve
      waarden;

      2°. een beheervisie die aangeeft welke elementen van belang zijn voor de beschermde historische buitenplaats en de
      wijze waarop deze in stand moeten worden gehouden;

      3°. een maatregelenplan ten behoeve van het beheer, en

      b. is naar het oordeel van de Minister en van de Minister van Onderwijs, Cultuur en Wetenschap passend voor de
      verzekering van het behoud van de historische buitenplaats en, in voorkomend geval, voor het eenmalig herstel van
      elementen van de buitenplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel321
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel321
