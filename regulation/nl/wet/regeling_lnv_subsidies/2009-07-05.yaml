      1 De subsidie bedraagt ten hoogste 50% van de subsidiabele kosten, ingeval de aanvraag tot subsidieverlening is
      ingediend door een provincie of een individuele gemeente.

      2 De subsidie bedraagt ten hoogste 75% van de subsidiabele kosten, ingeval de aanvraag tot verlening van een
      subsidie met betrekking tot één landschapsontwikkelingsplan is ingediend door twee of meer gemeenten gezamenlijk of
      door een provincie en meer gemeenten gezamenlijk.
