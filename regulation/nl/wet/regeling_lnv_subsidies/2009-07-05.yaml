  - number: 2:77
    text: |-
      In aanvulling op, onderscheidenlijk afwijking van [artikel 1:15][ref1] komen de volgende kosten in aanmerking voor
      de garantstelling:

      a. kosten voor de bouw, verwerving of verbetering van onroerende zaken;

      b. kosten voor de koop of huurkoop van machines en materieel, met inbegrip van computerprogrammatuur, tot ten
      hoogste de marktwaarde van de activa;

      c. algemene kosten in verband met uitgaven als bedoeld in onderdelen a of b, zoals kosten voor architecten,
      ingenieurs en adviseurs, haalbaarheidsstudies en het verkrijgen van octrooien en licenties;

      d. kosten voor de aankoop van tweedehands materieel, voor zover het gaat om landbouwondernemingen met een zeer
      beperkte technische startbasis en weinig kapitaal en zij dankzij de lagere kosten van dergelijk materieel met
      moderniseringswerkzaamheden kunnen beginnen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel115
    url: https://wetten.overheid.nl/BWBR0021281/2009-07-05#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: 1:15
        hoofdstuk: '1'
  - number: 2:78
    text: |-
      In aanvulling op de [artikelen 1:15][ref1] en [2:2][ref2] komen de volgende kosten niet in aanmerking voor de
      garantstelling:

      a. bedrijfskosten die de begunstigde normaal zou moeten dragen;

      b. kosten voor activiteiten die verband houden met de uitvoer als bedoeld in artikel 1 van verordening (EG)
      nr. 1857/2006;

      c. kosten voor investeringen waarvoor productiebeperkingen of beperkingen op communautaire steunverlening in het
      kader van de gemeenschappelijke marktordeningen zijn vastgesteld, zoals toeslagrechten en quota;

      d. kosten voor investeringen die tot doel hebben de financiële situatie van producenten te verbeteren, maar in geen
      enkel opzicht bijdragen aan de ontwikkeling van de sector;

      e. kosten voor landbouwproducten waarvoor geen normale afzetmogelijkheden kunnen worden gevonden;

      f. kosten voor activiteiten die de landbouwonderneming ook onder marktvoorwaarden alleen zou kunnen uitvoeren;

      g. kosten voor de aankoop van bouwgrond;

      h. andere dan de in [artikel 2:77, onderdeel b][ref3], genoemde kosten in verband met een huurkoopcontract,
      waaronder belastingen, marge voor de verhuurder, kosten voor de herfinanciering van rente, overheadkosten en
      verzekeringspremies;

      i. kosten voor investeringen in verband met de naleving van bestaande nationale maatregelen of EG-maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel22
