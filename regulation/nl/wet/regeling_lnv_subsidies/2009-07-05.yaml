    text: |-
      1 De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een vermelding van het aantal beschermde historische buitenplaatsen dat bij de Stichting is aangesloten,

      b. een lijst van beschermde historische buitenplaatsen waarvoor een jaarcontract als bedoeld in
      [artikel 3:21a, eerste lid, onderdeel b][ref1], is afgesloten en

      c. een lijst van beschermde historische buitenplaatsen waarvoor in de subsidieperiode een beheerplan is opgesteld.

      2 De aanvraag tot vaststelling van de subsidie gaat vergezeld van een accountantsverklaring.

      3 Voorafgaand aan de aanvraag tot subsidievaststelling wordt een afschrift van het beheerplan overgelegd aan
      de Rijksdienst voor Archeologie, Cultuurlandschap en Monumenten van het Ministerie van Onderwijs, Cultuur en
      Wetenschap.


