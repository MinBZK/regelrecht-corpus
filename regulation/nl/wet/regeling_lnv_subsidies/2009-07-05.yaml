  - number: 1:13
    text: |-
      1 Ingeval subsidie is verleend voor de uitvoering van een project, voert de subsidieontvanger dat project uit
      overeenkomstig het projectplan dat onderdeel vormt van de beschikking tot subsidieverlening.

      2 Ingeval een project langer dan een jaar duurt, informeert de subsidieontvanger de Minister telkens nadat een jaar
      is verstreken binnen drie maanden over de voortgang van het project door middel van een verslag, dat ten minste een
      beschrijving bevat van:

      a. de activiteiten die tot dan toe in het kader van het project zijn verricht;

      b. de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het projectplan.

      3 De Minister kan goedkeuring verlenen aan een tussentijdse wijziging van een projectplan, tenzij de wijziging:

      a. de doelstellingen, omschreven in het projectplan, betreft;

      b. verhoging van het bedrag van de subsidie of het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld, tot gevolg heeft.

      4 Bij een goedkeuring als bedoeld in het derde lid kan de Minister de beschikking tot subsidieverlening alsmede de
      aan de subsidieontvanger opgelegde verplichtingen wijzigen.

      5 Verslagen als bedoeld in het tweede lid en aanvragen tot een goedkeuring als bedoeld in het derde lid worden
      ingediend bij de Directeur van de Dienst Regelingen.

      6 Bij de openstelling, bedoeld in [artikel 1:3, eerste lid][ref1], kan de Minister besluiten dat een project moet
      zijn aangevangen of uitgevoerd binnen een andere termijn dan bepaald in deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel13
