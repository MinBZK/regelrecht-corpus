  - number: '3'
    text: |-
      1 In Nederland worden met betrekking tot de omzetbelasting anders dan bij invoer als andere douane-autoriteit in de
      zin van [artikel 3, eerste lid, van de rijkswet][ref1] mede aangemerkt: de eenheden van de Belastingdienst, bevoegd
      inzake de heffing, onderscheidenlijk invordering, van deze belasting.

      2 In Aruba worden met betrekking tot de belasting op bedrijfsomzetten, anders dan bij invoer, als andere
      douaneautoriteit in de zin van [artikel 3, eerste lid, van de rijkswet][ref2], mede aangemerkt:

      a. de Directeur van de Directie der Belastingen;

      b. het Hoofd van de Dienst der Belastingen;

      3 In Curaçao worden met betrekking tot soortgelijke indirecte belastingen, anders dan bij invoer, als andere
      douane-autoriteit in de zin van [artikel 3, eerste lid, van de rijkswet][ref3] mede aangemerkt:

      a. de sector Fiscale Zaken van het Ministerie van Financiën;

      b. de Inspectie der Belastingen Curaçao;

      c. de Landsontvanger;

      d. de Directeur van de Stichting belastingaccountantsbureau.

      4 In Sint Maarten worden met betrekking tot de belasting op bedrijfsomzetten en accijnzen, anders dan bij invoer,
      als andere douaneautoriteit in de zin van [artikel 3, eerste lid, van de rijkswet][ref4] mede aangemerkt:

      a. het Hoofd afdeling Fiscale Zaken;

      b. de Directeur van de Belastingdienst.


