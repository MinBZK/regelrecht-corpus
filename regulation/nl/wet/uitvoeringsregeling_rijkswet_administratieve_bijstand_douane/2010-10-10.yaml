articles:
  - number: '1'
    text: |-
      Deze regeling:

      a. neemt voorzover nodig de definities over van de [Rijkswet administratieve bijstand douane][ref1];

      b. verstaat hierna onder rijkswet: de [Rijkswet administratieve bijstand douane][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010576
      [ref2]: https://wetten.overheid.nl/BWBR0010576
    url: https://wetten.overheid.nl/BWBR0010885/2010-10-10#Artikel1
