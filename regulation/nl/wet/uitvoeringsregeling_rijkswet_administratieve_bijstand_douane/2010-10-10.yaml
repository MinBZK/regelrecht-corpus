  - number: '4'
    text: |-
      Met de invoering van de rijkswet zijn belast:

      a. in Nederland:

      1° de Belastingdienst/Douane;

      2° het Douane Informatie Centrum (DIC);

      3° de Belastingdienst/Fiscale inlichtingen- en opsporingsdienst – Economische controledienst (FIOD-ECD of FIOD);

      4° de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. in Aruba:

      1°. de Directeur van de Directie der Belastingen;

      2°. het Hoofd van de Dienst der Belastingen;

      c. in Curaçao:

      1° de Douane Curaçao;

      2° de sector Fiscale Zaken van het Ministerie van Financiën;

      3° de Landsontvanger;

      4° de Stichting belastingaccountantsbureau;

      d. in Sint Maarten:

      1°. de Afdeling Fiscale Zaken;

      2°. de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0010885/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 Verzoeken om bijstand door de Nederlandse douane-administratie hebben betrekking op in Nederland geldende
      algemeen verbindende voorschriften betreffende:

      a. de in-, uit- en doorvoer van goederen, in het bijzonder ter zake van:

      1º. douane- en antidumpingrechten, alsmede belastingen en restituties in het kader van het communautaire
      landbouwbeleid;

      2º. omzetbelasting bij invoer en accijnzen bij invoer;

      3º. verboden, beperkingen en toezicht inzake het grensoverschrijdende goederenverkeer ter bescherming van
      financiële, economische (landbouweconomische daaronder begrepen), culturele, veterinaire en fytosanitaire belangen
      en van de binnenlandse veiligheid, de openbare orde, de volksgezondheid en het milieu;

      b. omzetbelasting, onderscheidenlijk accijnzen, anders dan bij invoer.

      2 Verzoeken om bijstand door de Arubaanse douane-administratie hebben betrekking op in Aruba geldende algemeen
      verbindende voorschriften betreffende:

      a. invoerrechten, alsmede heffingen en restituties ter zake van de in-, uit- en doorvoer van goederen
      (zegelbelasting, kosten van dienstverlening);

      b. accijnzen bij invoer en anders dan bij invoer;

      c. verboden, beperkingen en toezicht inzake het grensoverschrijdende goederenverkeer in het belang van de
      volkshuishouding of van de inwendige of uitwendige veiligheid van Aruba of van de internationale rechtsorde dan wel
      van een daarop betrekking hebbende internationale afspraak.

      3 Verzoeken om bijstand door de Curaçaose douane-administratie hebben betrekking op de in Curaçao geldende algemeen
      verbindende voorschriften betreffende:

      a. douanerechten, alsmede heffingen en restituties ter zake van de in-, uit- en doorvoer van goederen;

      b. omzetbelasting bij invoer en accijnzen bij invoer;

      c. accijnzen, omzetbelasting, dan wel soortgelijke indirecte belastingen;

      d. verboden, beperkingen en toezicht inzake het grensoverschrijdende goederenverkeer in het belang van de
      volkshuishouding of van de inwendige of uitwendige veiligheid van Curaçao of van de internationale rechtsorde dan
      wel van een daarop betrekking hebbende internationale afspraak.

      4 Verzoeken om bijstand door de douane-administratie van Sint Maarten hebben betrekking op in Sint Maarten geldende
      algemeen verbindende voorschriften betreffende:

      a. accijnzen, belasting op bedrijfsomzetten, dan wel soortgelijke indirecte belastingen;

      b. verboden, beperkingen en toezicht inzake het grensoverschrijdende goederenverkeer in het belang van de
      volkshuishouding of van de inwendige of uitwendige veiligheid van Sint Maarten of van de internationale rechtsorde
      dan wel van een daarop betrekking hebbende internationale afspraak.
    url: https://wetten.overheid.nl/BWBR0010885/2010-10-10#Artikel5
  - number: '6'
    text: |-
      De in artikel 11 van de rijkswet bedoelde ambtenaren zijn tijdens hun verblijf op het grondgebied van een ander
      land van het Koninkrijk voorzien van een officiële machtiging waaruit blijkt dat zij optreden namens de verzoekende
      douane-administratie.
    url: https://wetten.overheid.nl/BWBR0010885/2010-10-10#Artikel6
