  - number: '2'
    text: |-
      1 In Aruba wordt met betrekking tot de invordering van douanevorderingen als douane-administratie in de zin van
      [artikel 1, onder f, van de rijkswet][ref1] aangemerkt: het Hoofd van de Dienst Belastingen.

      2 In Curaçao wordt met betrekking tot de invordering van douanevorderingen als douane-administratie in de zin van
      [artikel 1, onder f, van de rijkswet][ref2] aangemerkt: de Douane Curaçao en de Landsontvanger.

      3 In Sint Maarten wordt met betrekking tot de invordering van douanevorderingen als douane-administratie in de zin
      van [artikel 1, onder f, van de rijkswet][ref3] aangemerkt: de Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010576#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010576#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0010576#Artikel1
