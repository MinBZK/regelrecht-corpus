  - number: '5'
    text: |-
      1 De melding, bedoeld in [artikel 5, eerste lid, van het besluit][ref1], wordt gedaan bij de Minister, met
      gebruikmaking van een door hem ter beschikking gesteld middel.

      2 Bij de melding worden in elk geval de volgende gegevens en bescheiden verstrekt:

      a. persoonsgegevens omtrent de gebruiker;

      b. de aard van het voorgenomen frequentiegebruik;

      c. in geval van maritiem mobiele communicatie: de te gebruiken radioapparaten en de naam en indien aanwezig het
      identificatienummer of kenmerk van het schip waarop deze radioapparaten gebruikt worden.

      3 De melding kan, met uitzondering van de melding, bedoeld in [artikel 6, tweede lid, onderdeel c][ref2], langs
      elektronische weg worden gedaan met gebruikmaking van een daartoe strekkend elektronisch formulier en de in het
      vierde lid bedoelde persoonlijke code of DigiD-code.

      4 Degene die voor de eerste maal een melding langs elektronische weg doet en die niet eerder een melding voor het
      gebruik van frequentieruimte langs elektronische weg heeft gedaan, geeft daarbij een DigiD-code of persoonlijke
      code op. De persoonlijke code wordt na aanvraag door middel van een daartoe strekkend formulier verstrekt aan de
      aanvrager.

      5 Indien als gevolg van gewijzigde omstandigheden de gegevens die bij de melding zijn verstrekt niet langer
      overeenkomen met de feitelijke situatie, doet degene die de melding heeft gedaan bij de Minister een nieuwe melding
      van de actuele gegevens. Het derde en vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036375#Artikel6
