  - number: '2'
    text: |-
      De [artikelen 3 tot en met 10][ref1] zijn van toepassing op gebruik van frequentieruimte zonder vergunning als
      bedoeld in de [artikelen 3 tot en met 5 van het besluit][ref2], met uitzondering van maritiem mobiele communicatie
      vanaf het land.


      [ref1]: https://wetten.overheid.nl/BWBR0036375#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel3
    url: https://wetten.overheid.nl/BWBR0036375/2024-06-20#Artikel2
