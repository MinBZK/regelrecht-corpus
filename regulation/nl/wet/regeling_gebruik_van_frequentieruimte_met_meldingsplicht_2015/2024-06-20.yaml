  - number: '10'
    text: |-
      1 Bij gebruik van frequentieruimte met de bestemming ‘amateur´ of ‘amateursatelliet´ wordt, onverlet
      [artikel 8][ref1], voldaan aan de volgende voorschriften:

      a. de radiozendamateur bedient het radioapparaat zelf en, indien hij niet aanwezig is, draagt er zorg voor dat
      alleen hij zijn radioapparaat op afstand kan bedienen;

      b. het uitzenden van media-aanbod of reclameboodschappen als bedoeld in [artikel 1.1 van de Mediawet 2008][ref2] is
      niet toegestaan;

      c. de in [artikel 6, derde lid][ref3], bedoelde combinatie van letters of cijfers wordt ten minste bij het begin en
      bij het einde van elke uitzending en ten minste eenmaal per periode van vijf minuten uitgezonden, waarbij een reeks
      kortdurende uitzendingen wordt aangemerkt als één uitzending;

      d. de combinatie van letters of cijfers is bij data- en beeldoverdracht aan de ontvangstzijde na demodulatie in
      leesbaar schrift zichtbaar;

      e. bij automatische telegrafie en bij data- of beeldoverdracht waarbij toepassing van onderdeel d stuit op
      technische belemmeringen wordt de combinatie van letters of cijfers kenbaar gemaakt door middel van spraak of
      morsetelegrafie;

      f. informatie wordt niet versleuteld verzonden;

      g. radioverbindingen worden alleen tot stand gebracht met andere gebruikers van frequentieruimte met de bestemming
      ‘amateur´ of ‘amateursatelliet´;

      h. bij het spellen van de combinatie van letters of cijfers wordt gebruik gemaakt van het in bijlage 3 opgenomen
      spellingsalfabet.

      2 Voor gezamenlijk gebruik van frequentieruimte ten dienste van radiozendamateurs tijdens groepsevenementen gelden
      de volgende voorschriften:

      a. tijdens een radiowedstrijd die door meer dan een geregistreerde wordt georganiseerd met de vorming van een
      groepsradiostation, kunnen de deelnemers de in [artikel 6, derde lid][ref4], bedoelde combinatie van letters of
      cijfers van één van de geregistreerden gebruiken;

      b. bij radioamateurpeilevenementen die georganiseerd zijn door een geregistreerde vereniging of stichting van
      radiozendamateurs, is het eerste lid, onderdeel a, niet van toepassing;

      c. bij gebruik van een radiostation door leden van Scouting Nederland tijdens evenementen die georganiseerd worden
      door de werkgroep Radio Scouting Nederland wordt aan de in [artikel 6, derde lid][ref5], bedoelde combinatie van
      letters of cijfers toegevoegd: J.

      3 Voor een onderwijsinstelling geldt dat:

      a. het radiostation uitsluitend wordt gebruikt tijdens lesuren;

      b. het houden van en deelnemen aan radiowedstrijden niet is toegestaan;

      c. de onderwijsinstelling een radiozendamateur die voldoet aan het in [artikel 4, tweede lid][ref6], bedoelde
      vereiste, aanwijst die namens de geregistreerde onderwijsinstelling het radiostation beheert.

      4 Voor een vereniging of stichting van radiozendamateurs geldt dat de geregistreerde een radiozendamateur die
      voldoet aan het in [artikel 4, tweede lid][ref7], bedoelde vereiste, aanwijst die namens de geregistreerde
      vereniging of stichting het radiostation beheert.


