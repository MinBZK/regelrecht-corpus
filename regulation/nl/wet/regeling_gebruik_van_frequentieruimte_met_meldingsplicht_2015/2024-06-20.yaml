  - number: '6'
    text: |-
      1 De Minister registreert het voorgenomen frequentiegebruik overeenkomstig de melding tenzij niet wordt voldaan aan
      de [artikelen 2 tot en met 5][ref1] en [7][ref2], en bericht hierover degene die de melding heeft gedaan, onder
      verstrekking van een bewijs van registratie aan degene wiens melding is geregistreerd. Een registratie kan door de
      Minister worden geweigerd voor zover een eerdere registratie is doorgehaald wegens overtreding van bij of krachtens
      de wet gestelde regels.

      2 Onverminderd het eerste lid registreert de Minister het voorgenomen frequentiegebruik ten behoeve van maritiem
      mobiele communicatie aan boord van een schip uitsluitend voor gebruik aan boord van:

      a. een schip dat te boek staat in de registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3];

      of, indien aan het vereiste onder a. niet wordt voldaan,

      b. een schip ten aanzien waarvan naar waarheid is verklaard dat het eigendom is van:

      1°. een natuurlijke persoon die staat ingeschreven in de basisregistratie personen, bedoeld in
      [artikel 1.2 van de Wet basisregistratie personen][ref4];

      2°. een rechtspersoon die in Nederland een hoofd- of nevenvestiging heeft als bedoeld in
      [artikel 1 van de Handelsregisterwet 2007][ref5];

      of, indien aan de vereisten onder a. of b. niet wordt voldaan,

      c. een schip ten aanzien waarvan voldoende aannemelijk is gemaakt dat het eigendom is van een natuurlijke persoon
      of rechtspersoon die naar het oordeel van de Minister anderszins een voldoende band heeft met Nederland.

      3 Voor zover vereist op grond van het Radioreglement wordt bij de registratie een combinatie van letters of cijfers
      toegekend met het oog op de identificatie van het radiostation.

      4 Degene die op grond van de melding als frequentiegebruiker geregistreerd is, draagt er voor zorg dat indien
      het geregistreerde radioapparaat door een ander wordt bediend, daarbij de in deze regeling bepaalde voorschriften
      worden nageleefd.

      5 De Minister haalt de registratie door op verzoek van de betrokkene of indien is vastgesteld dat de betrokkene
      niet langer gebruik maakt van de frequentieruimte. De Minister kan de registratie doorhalen indien niet wordt
      voldaan aan de [artikelen 2 tot en met 10][ref6], of indien de betrokkene de verschuldigde vergoeding voor de
      registratie niet heeft voldaan. De Minister bericht de betrokkene over de doorhaling.


