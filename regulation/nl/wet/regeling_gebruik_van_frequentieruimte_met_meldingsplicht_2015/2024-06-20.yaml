        bwb_id: BWBR0032895
        artikel: '3'
  - number: '3'
    text: |-
      Een rechtspersoon kan slechts gebruik maken van frequentieruimte die ingevolge het frequentieplan de bestemming
      ‘amateur´ of ‘amateursatelliet´ heeft, indien het betreft:

      a. een rechtspersoonlijkheid bezittende vereniging van radiozendamateurs waarvan het ledental en de samenstelling
      voldoende representatief zijn voor de door de vereniging te behartigen belangen;

      b. een rechtspersoon waarvan een onderwijsinstelling uitgaat die van rijkswege wordt gefinancierd of een
      onderwijsinstelling die door de Minister van Onderwijs, Cultuur en Wetenschap is erkend, voor zover het doen van
      onderzoekingen met radioapparaten essentieel is voor het geven van onderwijs door deze instelling;

      c. een stichting die zich blijkens de statutaire doelstelling richt op het doen van onderzoekingen met
      radioapparaten en die de belangen van radiozendamateurs behartigt.
    url: https://wetten.overheid.nl/BWBR0036375/2024-06-20#Artikel3
  - number: '4'
    text: |-
      1 Degene die een radioapparaat bedient ten behoeve van maritiem mobiele communicatie beschikt over een certificaat
      van bediening als bedoeld in [artikel 12 van de Examenregeling frequentiegebruik 2008][ref1], dat geldig is voor
      het desbetreffende frequentiegebruik overeenkomstig het bepaalde in bijlage 2, en heeft een leeftijd van ten minste
      zestien jaren.

      2 De radiozendamateur die een radioapparaat bedient, heeft met goed gevolg een examen als bedoeld in
      [artikel 7 van de Examenregeling frequentiegebruik 2008][ref2] afgelegd, dat geldig is voor het desbetreffende
      frequentiegebruik overeenkomstig het bepaalde in bijlage 1.

      3 In afwijking van het eerste en het tweede lid kan een persoon die niet voldoet aan de desbetreffende voorwaarde
      een radioapparaat bedienen indien de bediening plaatsvindt in directe aanwezigheid en onder verantwoordelijkheid
      van een persoon die wel aan deze voorwaarde voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024285#Artikel7
