articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *AIS (Automatic Identification System):* automatisch identificatiesysteem gebaseerd op transponder technologie;

      b. *ATIS (Automatic Transmitter Identification System):* systeem dat automatisch de door Onze Minister toegewezen
      combinatie van letters of cijfers voor de identificatie van een schip of radioapparaat, als bedoeld in de Regionale
      Regeling, uitzendt;

      c. *besluit:* [Frequentiebesluit 2013][ref1];

      d. *binnenvaart:* scheepvaart op de binnenwateren;

      e. *combi-marifoon:* radioapparaat bestemd voor communicatie op de binnenwateren en op zee;

      f. *EPIRB (Emergency Position Indicating Radio Beacon):* radioapparaat bestemd voor noodalarmering in de 406 MHz
      frequentieband en voor het lokaliseren van het baken op de frequentie 121,5 MHz;

      h. *frequentiegebruik met een primaire status:* gebruik van frequentieruimte voor de uitoefening van een
      radiodienst die ingevolge het frequentieplan een primaire status heeft;

      i. *frequentiegebruik met een secundaire status:* gebruik van frequentieruimte voor de uitoefening van een
      radiodienst die ingevolge het frequentieplan een secundaire status heeft;

      j. *frequentieplan:* plan als bedoeld in [artikel 3.1 van de wet][ref2];

      k. *klasse van uitzending:* klasse van uitzending als bedoeld in bijlage 1 van deel 2 van het Radioreglement;

      l. *marifoon binnenvaart:* radioapparaat bestemd voor communicatie op de binnenwateren in de maritieme VHF
      frequentieband met automatische vermogensreductie op de specifieke VHF kanalen;

      m. *marifoon zeevaart:* radioapparaat bestemd voor communicatie op zee in de maritieme VHF frequentieband;

      n. *maritiem mobiele communicatie:* radiocommunicatie tussen radiostations op schepen onderling, tussen
      radiostations op een schip en op het vaste land en tussen een radiostation op een schip en een satelliet;

      o. *maritieme portofoon:* draagbaar radioapparaat bestemd voor gebruik in de maritieme VHF en UHF frequentieband;

      p. *MMSI (Maritime Mobile Service Identity):* unieke combinatie van negen cijfers dat een radiostation of een groep
      van radiostations identificeert, zoals omschreven in paragraaf 6 van artikel 19 van het Radioreglement;

      q. *pleziervaart:* scheepvaart voor sportbeoefening of vrijetijdsbesteding;

      r. *Radioreglement:* Radioreglement 1979 met bijlagen, behorende bij de op 22 december 1989 te Nice tot stand
      gekomen Internationale Constitutie en Conventie van de Internationale Telecommunicatie Unie (Trb. 2013, 1);

      s. *radiostation:* een of meer radioapparaten met de daartoe behorende antenne-inrichtingen, noodzakelijk voor het
      op een locatie uitvoeren van een radiocommunicatiedienst als bedoeld in artikel 1.19 van het Radioreglement;

      t. *radiozendamateur:* degene die vanuit een persoonlijke belangstelling en zonder financieel oogmerk gebruik maakt
      van frequentieruimte ten behoeve van het opdoen van vaardigheden, het communiceren via de radio en het doen van
      technische onderzoekingen;

      u. *Regionale Regeling:* Regionale Regeling betreffende de radiocommunicatiedienst op de binnenwateren, tot stand
      gekomen in Boekarest op 18 april 2012;

      v. *SAR (Search and Rescue) communicatie:* radiocommunicatie ten behoeve van opsporings- en reddingoperaties.


