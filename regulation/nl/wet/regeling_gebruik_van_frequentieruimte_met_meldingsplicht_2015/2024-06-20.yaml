  - number: '7'
    text: |-
      Bij het gebruik van frequentieruimte wordt voldaan aan de beperkingen en voorschriften ten aanzien van de
      beschikbare frequentieruimte, de toepassingen, het zendvermogen en de bekwaamheid die:

      a. ten aanzien van frequentieruimte met de bestemming ‘amateur´ of ‘amateursatelliet´ zijn opgenomen in bijlage 1;

      b. ten aanzien van frequentieruimte met de bestemming ‘maritiem mobiele communicatie´ zijn opgenomen in bijlage 2.
    url: https://wetten.overheid.nl/BWBR0036375/2024-06-20#Artikel7
  - number: '8'
    text: |-
      1 Bij gebruik van frequentieruimte als bedoeld in [artikel 7][ref1] wordt voorts voldaan aan de volgende
      voorschriften:

      a. het bewijs van registratie en, in geval van maritiem mobiele communicatie, het certificaat van bediening zijn
      aanwezig bij het radioapparaat;

      b. bij frequentiegebruik met een secundaire status wordt te allen tijde voorrang verleend aan frequentiegebruik met
      een primaire status;

      c. er worden geen ontoelaatbare storingen of belemmeringen veroorzaakt in andere uitrusting of radioapparaten en in
      het frequentiegebruik door anderen;

      d. er worden geen valse of bedrieglijke alarmeringen, noodseinen, noodoproepen of noodberichten uitgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0036375#Artikel7
    url: https://wetten.overheid.nl/BWBR0036375/2024-06-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036375
        artikel: '7'
  - number: '9'
    text: |-
      1 Bij gebruik van frequentieruimte met de bestemming ‘maritiem mobiele communicatie’ aan boord van een schip is
      het radioapparaat dat aan boord van het schip gebruikt wordt, geregistreerd voor gebruik aan boord van dat schip en
      wordt, onverlet [artikel 8][ref1], voldaan aan de volgende voorschriften:

      a. een maritiem mobiel radioapparaat gebruikt geen onjuiste of misleidende identificatie;

      b. het berichtenverkeer wordt kort en zakelijk gehouden en het zendgedeelte van het radioapparaat wordt niet
      onnodig ingeschakeld;

      c. bij een radioapparaat met een alarmeringsfunctie dat abusievelijk in werking is getreden, herroept de
      geregistreerde de melding voor zover daartoe communicatiemiddelen beschikbaar zijn;

      d. een EPIRB wordt uitsluitend gebruikt voor alarmering indien sprake is van onmiddellijk dreigend gevaar voor
      bemanning en het schip en indien alarmering met andere middelen niet of niet meer mogelijk is;

      e. radioapparaten die een alarmerings- of noodfunctie hebben, worden zodanig geprogrammeerd dat zij bij gebruik
      automatisch het MMSI-nummer of de toegewezen letters of cijfers ter identificatie van het radiostation gebruiken;

      f. versleutelde radiocommunicatie door middel van een MF- of MF/HF-radioapparaat vindt uitsluitend plaats op
      frequenties bestemd voor radiotelefonieverkeer tussen schepen;

      g. bij versleutelde radiocommunicatie als bedoeld in onderdeel f wordt tijdens de uitzending en ten minste eenmaal
      per periode van vijf minuten de in [artikel 6, derde lid][ref2], bedoelde combinatie van letters of cijfers
      onversleuteld uitgezonden;

      h. bij gebruik van een marifoon of portofoon is de antenne hiervan verticaal polariserend en rondstralend;

      i. in het werkingsgebied van de Regionale Regeling zijn de marifoon binnenvaart, de combi-marifoon, de AIS-
      transponder en de maritieme portofoon voorzien van een systeem voor automatische zenderidentificatie en wordt de
      door de Minister verstrekte zenderidentificatie gebruikt;

      j. een portofoon in de VHF-band wordt alleen gebruikt in combinatie met een marifoon, met dien verstande dat de
      pleziervaart in het werkingsgebied van de Regionale Regeling kan volstaan met het gebruik van alleen een portofoon.


      [ref1]: https://wetten.overheid.nl/BWBR0036375#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0036375#Artikel6
