  - number: 11a
    text: |-
      Tot en met 30 juni 2020 worden registraties van frequentiegebruik ten behoeve van maritiem mobiele communicatie
      niet doorgehaald op grond van [artikel 6, tweede en vijfde lid][ref1], indien de registratie heeft plaatsgevonden
      vóór 1 juli 2019.


