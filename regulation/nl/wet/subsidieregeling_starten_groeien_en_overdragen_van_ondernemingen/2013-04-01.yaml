        artikel: '27'
  - number: B2.1:2
    text: |-
      De Staat stelt zich borg ten behoeve van de Bank voor de terugbetaling van bedrijfsborgstellingskredieten die met
      inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en deze overeenkomst door de Bank worden verstrekt, met dien verstande dat
      deze borgstelling wordt aangegaan onder de navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.1:3.1
    text: |-
      De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan uitsluitend
      worden ingeroepen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.a
    text: indien het krediet is gemeld als bedoeld in artikel 6;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.b
    text: |-
      indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde provisie
      door de Bank aan de Staat is betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.1:3.1.c
    text: |-
      indien en voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of
      delen daarvan de door de minister op grond van [artikel 2.7, tweede lid][ref1], van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde meldingslimiet niet is
      overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.1:3.1.d
    text: |-
      indien de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, zich borg heeft gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bedrijfsborgstellingskrediet wordt verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bedrijfsborgstellingskrediet met een minimum van € 5.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.e
    text: |-
      indien het bedrijfsborgstellingskrediet niet is bestemd en niet wordt gebruikt voor buitenlandse investeringen in
      distributiekanalen in verband met werkzaamheden op het gebied van uitvoer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.f
    text: |-
      indien het bedrijfsborgstellingskrediet niet meer bedraagt dan het tekort aan zekerheden dat bij de Bank ten tijde
      van het sluiten van de kredietovereenkomst bestaat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.g
    text: indien de kredietovereenkomst in schriftelijke vorm is aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.h
    text: |-
      indien de bank in de kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet wordt verstrekt een
      verplichting voor de MKB-ondernemer is opgenomen om alle medewerking te verlenen aan het uitoefenen door de Staat
      van de in artikel 20, eerste lid, genoemde bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.i
    text: |-
      indien de Bank in de door haar gesloten borgstellingsovereenkomst met betrekking tot de nakoming door de MKB-
      ondernemer van de verplichtingen voortvloeiende uit de uit hoofde waarvan het bedrijfsborgstellingskrediet
      is verleend een beding ten behoeve van de Staat heeft opgenomen, ertoe strekkende dat de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de Staat en de Bank geen bedingen heeft
      opgenomen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.1:3.1.i.1°
    text: een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.i.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.1:3.1.j
    text: |-
      indien door de Bank gelijktijdig met het sluiten van de kredietovereenkomst, uit hoofde waarvan een
      bedrijfsborgstellingskrediet aan de MKB-ondernemer wordt verstrekt, met de MKB-ondernemer een kredietovereenkomst
      is gesloten uit hoofde waarvan de MKB-ondernemer over een bankfaciliteit beschikt, die niet bestemd is en niet
      gebruikt wordt voor de aflossing van bankfaciliteiten waarover de MKB-ondernemer beschikt bij de Bank of een Bank-
      gelieerde of aan een rechtspersoon waarmee de Bank in een groep verbonden is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.k
    text: |-
      indien de bankfaciliteit, bedoeld in het eerste lid, onderdeel j, ten minste 100 procent bedraagt van het
      bedrijfsborgstellingskrediet, of,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.k.1°
    text: |-
      ten minste 33,3 procent bedraagt van het bedrijfsborgstellingskrediet, indien het bedrijfsborgstellingskrediet
      wordt verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking starter was, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.k.2°
    text: |-
      ten minste 50 procent bedraagt van het bedrijfsborgstellingskrediet indien het bedrijfsborgstellingskrediet wordt
      verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking innovatieve MKB-ondernemer was;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.1.l
    text: |-
      indien de looptijd van de onder k bedoelde bankfaciliteit ten minste even lang is als de looptijd van het
      bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:3.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel k, worden mede in aanmerking genomen de bedragen die een Bank-
      gelieerde gelijktijdig met de gesloten kredietovereenkomst aan de MKB-ondernemer worden verstrekt, indien de
      zekerheden van de Bank-gelieerde ter zake van die bedragen mede strekken tot zekerheid van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.1:4.1
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.1.a
    text: 'de MKB-ondernemer:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.1.a.1°
    text: beschikt over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde wijze te drijven;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.1.a.2°
    text: is in Nederland gevestigd en voert daar een substantieel deel van de activiteiten van de onderneming uit;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.1.a.3°
    text: |-
      is geen aanbieder als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1], noch
      oefent hij het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder uit;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: B2.1:4.1.a.4°
    text: |-
      houdt geen onderneming in stand waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien de
      onderneming nog geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit: - de beoefening van de land- of de tuinbouw, de vee- of visteelt, de visserij  of de teelt van vee-
      of visvoer,
        - de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of
        - het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.1.a.5°
    text: |-
      beschikt naast het bedrijfsborgstellingskrediet niet over een lening waarvoor de Staat uit hoofde van de
      [Regeling LNV-subsidies][ref1] of door overname van de verplichtingen van de Stichting Borgstellingsfonds voor de
      landbouw borg of garant staat;


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: B2.1:4.1.a.6°
    text: |-
      beschikt niet over een door een andere bank of kredietverstrekker verstrekte kredietfaciliteit, waarvoor de Staat
      op grond van het [Kaderbesluit EZ-subsidies][ref1], het [Besluit borgstelling MKB-kredieten 1997][ref2] of het
      Besluit borgstelling MKB-kredieten borg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.1:4.1.b
    text: |-
      er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de Bank naar normaal bankgebruik het krediet niet
      geheel voor eigen rekening en risico kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.1.c
    text: de rentabiliteits- en continuïteitsperspectieven van de onderneming zijn bevredigend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:4.2
    text: |-
      Het eerste lid, onderdeel a, onder 4, eerste gedachtenstreepje, is niet van toepassing op een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.1:5.1
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet voorts aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.1:5.1.a
    text: |-
      de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan € 200.000 aan de-
      minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren. Indien de onderneming
      actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een bedrijfsborgstellingskrediet
      wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde deel van het krediet. Bij de bepaling
      of de verlening van de borgstelling niet leidt tot overschrijding van het desbetreffende maximum wordt rekening
      gehouden met de-minimissteun die is verleend aan ondernemingen die deel uitmaken van dezelfde groep;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.1:5.1.b
    text: |-
      De Bank heeft er voor zorg gedragen dat: - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het
      staatsgegarandeerde deel van het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming actief
      is in het wegvervoer, niet meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde in
      aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun dat
      in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.1:5.2
    text: |-
      Dit artikel is niet van toepassing op een kredietovereenkomst die wordt gesloten met een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint-Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.1:6.1
    text: |-
      De bank meldt het krediet of het deel van het krediet waarop deze bedrijfsborgstellingsovereenkomst van toepassing
      is binnen 35 dagen na het sluiten van de kredietovereenkomst aan de Staat onder de gelijktijdige verstrekking van
      de door de minister vastgestelde informatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.1:6.2
    text: De minister bevestigt de ontvangst van een melding binnen 35 dagen na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.1:6.3
    text: |-
      Voor de toepassing van artikel 3, eerste lid, aanhef en onder c, is de volgorde van ontvangst van de meldingen door
      de minister bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.1:7.1
    text: 'Het tarief van de provisie bedraagt eenmalig:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:7.1.a
    text: |-
      3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van niet
      langer dan twee jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:7.1.b
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan twee jaar, maar niet langer dan vier jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:7.1.c
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan vier jaar, maar niet langer dan zes jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:7.1.d
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan zes jaar, maar niet langer dan negen jaar en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:7.1.e
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan negen jaar, maar niet langer dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:7.2
    text: |-
      Indien overeenkomstig artikel 3, onderdeel b, een provisie is betaald met betrekking tot een kredietovereenkomst
      en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn toe te rekenen aan de
      kredietnemer of aan de Bank, wordt de provisie door de Staat terugbetaald aan de Bank mits de Bank binnen een jaar
      na het sluiten van de kredietovereenkomst daartoe een verzoek aan de Staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.1:8.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een bedrijfsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bedrijfsborgstellingskrediet het totaal van de
      bedrijfsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een
      groep, per groep een bedrag van € 1.000.000 niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.1:8.2
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een starters-borgstellingskrediet slechts in aanmerking
      genomen voor zover door de verstrekking van dit krediet het totaal van de starters-borgstellingskredieten, berekend
      per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een groep, per groep een bedrag van € 200.000
      niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.1:8.3
    text: |-
      Voor de toepassing van het eerste lid wordt een bedrijfsborgstellingskrediet dat is verstrekt aan een andere MKB-
      ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk is,
      geacht aan de MKB-ondernemer te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.1:8.4
    text: |-
      Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.1:8.5
    text: 'Voor de toepassing van het eerste lid worden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.1:8.5.a
    text: |-
      bedrijfsborgstellingskredieten die op een eerder tijdstip overeenkomstig artikel 6 zijn gemeld, slechts voor het
      met overeenkomstige toepassing van de artikelen 9 en 10 berekende gedeelte van die bedrijfsborgstellingskredieten
      in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.1:8.5.b
    text: |-
      kredieten, voor zover de Staat daarvoor op grond van het [Kaderbesluit EZ-subsidies][ref1], het Besluit
      borgstelling MKB-kredieten, of het [Besluit borgstelling MKB-kredieten 1997][ref2] nog borg staat, als
      bedrijfsborgstellingskredieten in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.1:9.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 8 in aanmerking te nemen
      bedrijfsborgstellingskrediet na verloop van ieder kalenderkwartaal verminderd met een zodanig vast bedrag, dat het
      bedrijfsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, maar uiterlijk na verloop van 6
      jaar, nihil bedraagt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.2
    text: |-
      Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van ten
      hoogste twaalf jaar indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.2.a
    text: |-
      het bedrijfsborgstellingskrediet uitsluitend is bestemd voor de betaling van de kosten van de stichting, van de
      aankoop of van de verbouwing van een onroerende zaak,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.2.b
    text: |-
      deze onroerende zaak voor ten minste de helft bestemd is te worden gebruikt voor de onderneming van de MKB-
      ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.2.c
    text: |-
      de Bank met betrekking tot de onder a bedoelde kosten bankfaciliteiten verstrekt die een bedrag van ten
      minste 100 procent van de in onderdeel a bedoelde kosten belopen, dan wel, indien sprake is van een starters-
      borgstellingskrediet, 33,3 procent van dit bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.3
    text: |-
      Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van ten
      hoogste twaalf jaar indien het bedrijfsborgstellingskrediet is verstrekt aan een innovatieve MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.4
    text: |-
      Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.5
    text: |-
      Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt aan een
      innovatieve MKB-ondernemer, het eerste kalenderkwartaal waarin vermindering plaatsvindt uiterlijk aanvangt op de
      eerste dag van het veertiende kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst
      is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.6
    text: |-
      Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt voor de
      betaling van de kosten van de stichting of verbouwing van een onroerende zaak, het eerste kalenderkwartaal waarin
      vermindering plaatsvindt uiterlijk aanvangt op de eerste dag van het zesde kalenderkwartaal dat volgt op het
      kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.7
    text: |-
      De Bank kan de vermindering, bedoeld in het eerste lid, gedurende een periode van ten minste een kalenderkwartaal
      opschorten indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.7.a
    text: |-
      de Bank voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing van het
      bedrijfsborgstellingskrediet,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.7.b
    text: |-
      de Bank uitstel verleent van de verplichting tot aflossing van alle bankfaciliteiten gedurende de duur van de
      opschorting, dan wel uitstel verleent van de verplichting tot aflossing van een gedeelte van de bankfaciliteiten,
      waarbij de som van de aflossingsbedragen ten minste even groot is als de som van de aflossingsbedragen waarvoor de
      Bank uitstel verleent als bedoeld onder a, of, indien het bedrijfsborgstellingskrediet is verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.7.b.1°
    text: |-
      een MKB-ondernemer die ten tijde van de verstrekking starter was, ten minste 33,3 procent bedraagt van de som van
      de aflossingsbedragen waarvoor de Bank uitstel verleent als bedoeld onder a, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.7.b.2°
    text: |-
      een MKB-ondernemer die ten tijde van de verstrekking innovatief MKB-ondernemer was, ten minste 50 procent bedraagt
      van de som van de aflossingsbedragen waarvoor de Bank uitstel verleent als bedoeld onder a, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.7.c
    text: |-
      de Bank de opschorting meldt binnen 35 dagen na aanvang van de opschorting onder gelijktijdige verstrekking van de
      door de minister vastgestelde informatie. De minister bevestigt de melding binnen 35 dagen na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.8
    text: |-
      De in het zevende lid bedoelde opschorting van de vermindering vindt ten hoogste voor een totaal van acht
      kalenderkwartalen plaats. De opschorting van de vermindering vindt ten hoogste voor een totaal van twaalf
      kalenderkwartalen plaats indien het bedrijfsborgstellingskrediet is verstrekt aan een starter.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.9
    text: |-
      Indien een bedrijfsborgstellingskrediet wordt aangewend voor herfinanciering van een bedrijfsborgstellingskrediet,
      dat eerder is gebruikt voor de in het tweede lid, onder a en b genoemde doelen, en tevens is voldaan aan het tweede
      lid, onder b en c, is de nieuwe periode ten hoogste gelijk aan de periode waarvoor het bedrijfsborgstellingskrediet
      nog zou hebben gelopen zonder herfinanciering, indien en voor zover deze restperiode meer bedraagt dan zes jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.1:9.10
    text: |-
      Voor de toepassing van het zesde lid wordt onder een onroerende zaak mede begrepen
      schepen en vliegtuigen, voor zover deze zijn ingeschreven in de registers als bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Kadasterwet][ref1], alsmede ieder goederenrechtelijk recht dat omvat
      het uitsluitend gebruik van een onroerende zaak, met inbegrip van bovenbedoelde schepen en vliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
  - number: B2.1:10.1
    text: |-
      De vermindering van de borgstelling, bedoeld in artikel 9, wordt geschorst met ingang van de dag waarop het
      bedrijfsborgstellingskrediet is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.1:10.2
    text: |-
      In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bedrijfsborgstellingskrediet door de Bank is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.1:10.3
    text: |-
      De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.1:11.1
    text: |-
      De Bank dient zo spoedig mogelijk na de voltooiing van de uitwinning of, indien dit eerder is, zo spoedig
      mogelijk nadat aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bedrijfsborgstellingskrediet, maar in ieder geval binnen negen maanden na de datum waartegen het
      bedrijfsborgstellingskrediet is opgeëist of, indien dit eerder is, na de datum van het faillissement, een verzoek
      in om betaling uit hoofde van de bedrijfsborgstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.1:11.2
    text: Het verzoek wordt ingediend onder gelijktijdige verstrekking van de door de minister vastgestelde informatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.1:11.3
    text: |-
      De minister bevestigt de ontvangst van het verzoek om betaling binnen 35 dagen na de ontvangst en reageert op het
      verzoek binnen negen maanden na de bevestiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.1:12.1
    text: |-
      De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van het overeenkomstig artikel 11 ingediende verzoek uit hoofde van het bedrijfsborgstellingskrediet of de
      bedrijfsborgstellingskredieten pro resto verschuldigd is, doch
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.1.a
    text: |-
      ten hoogste 90 procent van de met toepassing van de artikelen 8, 9 en 10 berekende omvang van het
      bedrijfsborgstellingskrediet of de bedrijfsborgstellingskredieten, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.1.b
    text: |-
      ten hoogste de som van de ten tijde van de opzegging van de kredietovereenkomst bestaande en verstrekte
      bankfaciliteiten van de Bank voor de MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.2
    text: 'In afwijking van het eerste lid, onder b, bedraagt de omvang van de borgstelling:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.2.a
    text: |-
      indien sprake is van een starters-borgstellingskrediet: ten hoogste drie maal de som van de ten tijde van de
      opzegging van de kredietovereenkomst bestaande en verstrekte bankfaciliteiten van de Bank voor de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.2.b
    text: |-
      indien het bedrijfsborgstellingskrediet is verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking
      een innovatieve MKB-ondernemer was: ten hoogste twee maal de som van de ten tijde van de opzegging van de
      kredietovereenkomst bestaande en verstrekte bankfaciliteiten van de Bank voor de MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.3
    text: |-
      Voor de toepassing van het eerste lid en het tweede lid, onderdeel a, worden als bankfaciliteiten mede in
      aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.3.a
    text: |-
      de bedragen die een Bank-gelieerde uit hoofde van een overeenkomst aan de MKB-ondernemer ter leen verstrekt of zal
      verstrekken, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:12.3.b
    text: |-
      de verplichtingen die een Bank-gelieerde tegenover een derde, niet zijnde een andere Bank-gelieerde of een
      rechtspersoon waarmee de Bank in een groep verbonden is, onherroepelijk is aangegaan om ten laste van de MKB-
      ondernemer aan de derde een of meer betalingen te doen als bedoeld in artikel 1, tweede lid, onderdeel g,
      3°, indien de zekerheden van de Bank-gelieerde ter zake van de hiervoor onder a en b bedoelde bedragen en
      verplichtingen mede strekken tot zekerheid van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.1:13.1
    text: |-
      De minister betaalt hetgeen de Staat uit hoofde van deze overeenkomst met het oog op de door de Bank in haar
      verzoek bedoelde bedrijfsborgstellingskrediet verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:13.2
    text: |-
      Voor zover de Bank bij haar verzoek om betaling aannemelijk maakt dat er bijzondere omstandigheden waren die het
      naar normaal bankgebruik noodzakelijk maakten de andere bankfaciliteiten sterker in omvang terug te brengen dan de
      bedrijfsborgstellingskredieten, blijft artikel 12, eerste lid, aanhef en onder b, en tweede lid, buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:13.3
    text: 'De Staat is niet verplicht tot betaling op het verzoek van de Bank:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:13.3.a
    text: indien niet voldaan is aan een verzoek als bedoeld in artikel 20, eerste lid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:13.3.b
    text: |-
      indien de Bank in het kader van het verzoek gegevens heeft verstrekt, waarvan zij wist of behoorde te weten dat
      deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste beslissing op het verzoek
      zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:13.4
    text: |-
      Betalingen door de Staat aan de Bank en door de Bank aan de Staat geschieden door debitering respectievelijk
      creditering door de Bank van een rekening die de Bank zal aanhouden ten name van het ministerie van Economische
      Zaken, Landbouw en Innovatie, met vermelding van 'verliesdeclaraties'.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:13.5
    text: Over het debet- of creditsaldo van de rekening zal een rente berekend worden gelijk aan de basisrente.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.1:14.1
    text: |-
      Gedurende vijf jaar nadat de Bank uit hoofde van het bedrijfsborgstellingskrediet door de Staat is betaald, is
      de Bank gehouden die pogingen in het werk te stellen om namens de Staat het door de Staat betaalde bedrag in te
      vorderen, die de Bank in het werk zou hebben gesteld indien het krediet voor eigen rekening en risico door de Bank
      zou zijn verstrekt. De Staat machtigt met het oog hierop de Bank tot invordering bij de kredietnemer van de door
      deze aan de Staat verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.1:14.2
    text: |-
      De Bank zendt binnen drie maanden na afloop van de in het eerste lid bedoelde periode de minister een overzicht van
      de door haar ondernomen activiteiten, waarin de door de minister vastgestelde informatie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.1:15.1
    text: |-
      Indien een verzoek om betaling als bedoeld in artikel 11 is ingediend op een moment, waarop de uitwinning nog niet
      is voltooid en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bedrijfsborgstellingskrediet, brengt de Bank de minister ten minste jaarlijks verslag uit over de voortgang
      van de uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.1:15.2
    text: |-
      De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nadere gegevens van de
      Bank verlangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.1:16.1
    text: |-
      De Bank betaalt de vanaf het moment van de indiening van een verzoek om betaling als bedoeld in artikel 11
      ontvangen opbrengsten die in mindering komen op het bedrijfsborgstellingskrediet binnen twee maanden na ontvangst
      aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.1:16.2
    text: |-
      Voor zover de opbrengsten na de aanvang van de periode, bedoeld in artikel 14, eerste lid, ontvangen zijn wordt
      de in het eerste lid bedoelde betalingsverplichting beperkt tot 80 procent van de ontvangen opbrengsten, tenzij
      opbrengsten ontvangen zijn uit hoofde van uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.1:16.3
    text: |-
      De Bank zal de rekening, bedoeld in artikel 13, vierde lid, per de datum van verzending van het verzoek, bedoeld
      in artikel 11, en binnen twee maanden na die datum, debiteren voor het bedrag waarvoor betaling wordt gevraagd,
      vermeerderd met een rente over de periode die verstreken is sinds de dag waarop de vermindering, bedoeld in artikel
      9, op grond van artikel 10 is geschorst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.1:16.4
    text: |-
      De Bank zal de rekening op de datum van de reactie van de minister, bedoeld in artikel 11, derde lid, en binnen
      twee maanden na die datum crediteren of debiteren voor respectievelijk het voor de Staat positieve of negatieve
      verschil tussen het bedrag waarvoor de rekening ingevolge het derde lid is gedebiteerd en het door de Staat
      blijkens de reactie, bedoeld in artikel 11, verschuldigde bedrag, vermeerderd met een over dat verschil te
      berekenen rente over de periode die is verstreken sinds de creditering of debitering, bedoeld in het derde lid, en
      de datum waarop de reactie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.1:16.5
    text: |-
      De rente, bedoeld in het derde en vierde lid, is gelijk aan de zes maands Euribor op het moment van de indiening
      van een aanvraag als bedoeld in artikel 11, vermeerderd met de door de bank gehanteerde liquiditeitsopslag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.1:17.1
    text: |-
      De Bank treft geen schuldregeling die inhoudt of mede inhoudt een gehele of gedeeltelijke kwijtschelding van
      verplichtingen voortvloeiende uit een kredietovereenkomst, uit hoofde waarvan een bedrijfsborgstellingskrediet
      is verstrekt, zonder voorafgaande toestemming van de minister. De minister kan aan zijn toestemming voorwaarden
      verbinden ten aanzien van de inhoud van een dergelijke regeling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.1:17.2
    text: De minister beslist zo spoedig mogelijk op een verzoek om toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.1:18.1
    text: |-
      De verplichtingen van de Staat uit hoofde van deze overeenkomst met betrekking tot een bedrijfsborgstellingskrediet
      vervallen door schuldvernieuwing, door schuldoverneming en – voor het gedeelte waarin subrogatie plaatsvindt – door
      subrogatie van derden in de rechten van de Bank met betrekking tot het bedrijfsborgstellingskrediet, al dan niet
      voorafgegaan door verpanding van het bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.1:18.2
    text: |-
      In afwijking van het eerste lid blijven de verplichtingen van de Staat met betrekking tot een
      bedrijfsborgstellingskrediet van kracht, indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.1:18.2.a
    text: |-
      de MKB-ondernemer aan wie het bedrijfsborgstellingskrediet is verstrekt de onderneming en alle voor het drijven van
      de onderneming bestemde activa en passiva inbrengt of overdraagt aan een door de MKB-ondernemer voor het drijven
      van die onderneming opgerichte rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.1:18.2.b
    text: |-
      de Bank met de onder a bedoelde rechtspersoon een overeenkomst sluit als gevolg waarvan die rechtspersoon bij de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verleend de plaats inneemt van de MKB-
      ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.1:18.2.c
    text: |-
      de MKB-ondernemer zich naast de onder a bedoelde rechtspersoon hoofdelijk aansprakelijk stelt voor de nakoming door
      die rechtspersoon van de verplichtingen die voortvloeien uit de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.1:18.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder rechtspersoon mede begrepen twee of meer rechtspersonen,
      indien die rechtspersonen gezamenlijk voldoen aan de in het tweede lid genoemde voorwaarden en ieder van die
      rechtspersonen zich hoofdelijk aansprakelijk stelt voor de nakoming van de verplichtingen die voortvloeien uit de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.1:19
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt
      dat de Bank zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om betaling een
      andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, of dat de Bank de
      betalingsverplichting, bedoeld in artikel 16, eerste lid, niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel19
  - number: B2.1:20.1
    text: |-
      De Bank, en indien toepassing is gegeven aan de artikelen 3, tweede lid, en 12, derde lid, de Bank-
      gelieerde, en de MKB-ondernemer voldoen aan hetgeen door de minister aangewezen bij zijn ministerie werkzame
      personen wordt verzocht, voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering van het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen en deze overeenkomst, en met het oog op de nakoming door de Staat van op de Staat rustende
      internationaalrechtelijke verplichtingen, en voor zover het betrekking heeft op de uit het besluit of deze
      overeenkomst voortvloeiende zelfstandige verplichtingen van de Bank of de Bank-gelieerde de MKB-ondernemer aan
      wie het bedrijfsborgstellingskrediet is verstrekt of de met deze MKB-ondernemer gesloten kredietovereenkomsten,
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.1:20.1.a
    text: het toegang verlenen tot door hen gebruikte plaatsen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.1.b
    text: het verlenen van inzage in zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.1.c
    text: het maken van kopieën van de onder b bedoelde gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.1.d
    text: het verlenen van medewerking aan het verstrekken van gegevens door anderen en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.1.e
    text: het verstrekken van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.2
    text: |-
      Alleen in daartoe aanleiding gevende gevallen zal aan de Bank, of indien toepassing is gegeven aan de artikelen 3,
      tweede lid, en 12, derde lid, aan de Bank-gelieerde, of aan de MKB-ondernemer, gevraagd worden de in het eerste lid
      bedoelde inlichtingen ook door haar interne accountant te doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.3
    text: |-
      Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de Bank, de Bank-gelieerde of de MKB-ondernemer onjuiste of onvolledige informatie
      heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.4
    text: |-
      De Bank stelt de minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten en verstrekt daarbij de
      door de minister vastgestelde informatie:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.4.a
    text: vervroegde volledige aflossing van het bedrijfsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.4.b
    text: het door de afdeling ....... van de Bank in beheer nemen van het bedrijfsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.4.c
    text: de verlening van surseance van betaling aan of de faillietverklaring van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.4.d
    text: opeising van het bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:20.5
    text: |-
      De Bank meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van betaling aan
      de Bank, dan wel een verzoek tot faillietverklaring van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.1:21.1
    text: |-
      Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet wordt verstrekt
      en tijdens de uitwinning zal de Bank waken over de belangen van de Staat als borg.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.1:21.2
    text: |-
      De Bank zal er voor zorg dragen dat het bedrijfsborgstellingskrediet niet wordt gebruikt voor de nakoming van
      verplichtingen van de MKB-ondernemer aan de Bank die het bedrijfsborgstellingskrediet verstrekt, aan een Bank-
      gelieerde of aan een rechtspersoon waarmee de Bank in een groep verbonden is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.1:21.3
    text: |-
      De Bank zal tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet is
      verleend in de door haar te sluiten overeenkomsten met allen, niet zijnde de Staat, die zich borg willen stellen
      voor de nakoming door de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde
      waarvan het bedrijfsborgstellingskrediet is verleend, een beding ten behoeve van de Staat opnemen, ertoe strekkende
      dat de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de Staat en
      de Bank zal geen bedingen opnemen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.1:21.3.a
    text: een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.1:21.3.b
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.1:21.4
    text: |-
      De Bank draagt er zorg voor dat de relaties tussen haar en de bij haar onderneming betrokkenen enerzijds, en de
      ondernemer aan wie een bedrijfsborgstellingskrediet is verstrekt anderzijds transparant zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.1:22
    text: |-
      Indien naar het oordeel van de minister de kans dat de toepasselijkheid van deze overeenkomst op een
      bedrijfsborgstellingskrediet of een deel van een bedrijfsborgstellingskrediet wordt ingeroepen in belangrijke
      mate wordt verkleind of indien naar het oordeel van de minister aannemelijk is dat daardoor het bedrag waarvoor de
      toepasselijkheid van deze overeenkomst wordt ingeroepen in belangrijke mate wordt verlaagd, kan de minister voor de
      toepassing van deze overeenkomst met betrekking tot dat krediet instemmen met een gemotiveerd verzoek van de Bank
      om afwijking van deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.1:23
    text: |-
      Waar in deze overeenkomst sprake is van een vorm van communicatie geschiedt deze langs elektronische weg. De
      aanlevering door de Bank kan in afwijking en bij wijze van alternatief en ter keuze van de Bank ook geschieden in
      schriftelijke vorm en door aanlevering van een fysieke gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel23
  - number: B2.1:24.1
    text: |-
      De inwerkingtreding van een wijziging van het [Kaderbesluit EZ-subsidies][ref1] of [hoofdstuk 2][ref2] van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen leidt te zelfder tijd tot een gelijke wijziging
      van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.1:24.2
    text: Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.1:24.3
    text: |-
      Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door de minister en de Bank schriftelijk worden opgezegd
      met inachtneming van een opzegtermijn van drie hele kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.1:24.4
    text: |-
      In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien de Bank in strijd heeft gehandeld met het gestelde in deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.1:24.5
    text: |-
      In afwijking van het derde lid kan de Bank deze overeenkomst met onmiddellijke ingang opzeggen binnen een termijn
      van een maand na publicatie in het Staatsblad van een wijziging van het [Kaderbesluit EZ-subsidies][ref1],
      publicatie in de Staatscourant van een wijziging van de Subsidieregeling starten, groeien en overdragen van
      ondernemingen of een schriftelijke mededeling van de minister, inhoudende een wijziging van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
  - number: B2.1:24.6
    text: |-
      Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit EZ-subsidies][ref1] of door
      intrekking van [artikel 2.3, eerste lid, onderdeel a][ref2], van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.1:24.7
    text: |-
      Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien van
      bedrijfsborgstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging, opzegging, ontbinding
      of beëindiging overeenkomstig artikel 3 zijn gemeld en ten aanzien van bedrijfsborgstellingskredieten die zijn of
      zullen worden verstrekt uit hoofde van een kredietovereenkomst die is aangegaan voor de inwerkingtreding van de
      wijziging, opzegging, ontbinding of beëindiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.1:24.8
    text: |-
      Het zevende lid is niet van toepassing ten aanzien van de wijziging van artikel 5 ingevolge de Regeling van
      de Minister van Economische Zaken van 3 september 2009, nr. WJZ/9155298, tot wijziging van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen ten aanzien van de opschortingsvoorwaarden voor borgstelling van
      MKB-kredieten (Stcrt. 2009, 13666).
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.1:24.9
    text: |-
      Als het [Kaderbesluit EZ-subsidies][ref1] en [artikel 2.3, eerste lid, onderdeel a][ref2], van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen gelijktijdig worden ingetrokken en vervangen door materieel
      identieke wettelijke voorschriften in een andere algemene maatregel van bestuur of ministeriële regeling dan is het
      zesde lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.1:25
    text: 'Bank-gelieerde in de zin van artikel 1, tweede lid, onder a, van deze overeenkomst is (zijn):'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.1:25.a
    text: (...) ....................
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.1:25.b
    text: (...enz.)
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.2:1.1
    text: |-
      De begrippen die in het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen zijn gedefinieerd hebben in deze overeenkomst de in deze regelingen gegeven
      betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.2:1.2
    text: |-
      Voorts wordt in deze overeenkomst verstaan onder: - *bankfaciliteit:* krediet of een deel van een krediet
      waarvoor de Staat niet borg of garant staat: 1°. op grond van het [Kaderbesluit EZ-subsidies][ref1],
      het [Besluit borgstelling MKB-kredieten 1997][ref2], het Besluit borgstelling MKB-kredieten, dan wel de
      [Regeling LNV-subsidies][ref3]; of 2°. vanwege de overname van de verplichtingen van Stichting Borgstellingsfonds
      voor de Landbouw;
        - *bank-gelieerde:* een rechtspersoon waaraan een van de Banken voor zich, dan wel twee of meer Banken gezamenlijk,
      direct of indirect meer dan de helft van het geplaatste kapitaal verschaft, respectievelijk verschaffen, of voor
      het handelen waarvan de Bank volledig aansprakelijk is of deze Banken volledig aansprakelijk zijn, en die als Bank-
      gelieerde is vermeld in artikel 25 van deze overeenkomst;
        - *bedrijfsborgstellingskrediet:* krediet of een deel van een krediet dat overeenkomstig artikel 6 is gemeld;
        - *de-minimissteun:* steun van de overheid die voldoet aan de voorwaarden, vastgesteld in verordening (EG) nr.
      1998/2006 van de Commissie van Europese Gemeenschappen van 15 december 2006 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379), verordening (EG) nr. 1535/2007 van de Commissie
      van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de artikelen 87 en 88 van het
      Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337) of verordening (EG) nr. 875/2007 van de
      Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de toepassing van de artikelen 87 en 88 van
      het Verdrag op de-minimissteun in de landbouwsector en de visserijsector (PbEU L 193);
        - *groep:* een economische eenheid, waarin organisatorisch zijn verbonden: 1°. een natuurlijke persoon of een
      privaatrechtelijke rechtspersoon, die direct of indirect: – meer dan de helft van het geplaatste kapitaal verschaft
      aan, – volledig aansprakelijk vennoot is van, of – overwegende zeggenschap heeft over een of meer rechtspersonen of
      vennootschappen, en 2°. laatstbedoelde rechtspersonen of vennootschappen;
        - *innovatieve MKB-ondernemer:* een MKB-ondernemer ten aanzien waarvan de Bank beschikt over
      een gewaarmerkte kopie van een verklaring als bedoeld in [artikel 23, eerste lid][ref4], of
      [artikel 27, eerste lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref5]
      en waarvan het origineel ten hoogste zestien maanden voor de datum waarop de kredietovereenkomst is gesloten is
      afgegeven, of een MKB-ondernemer ten aanzien waarvan de Bank beschikt over een advies van de minister waaruit
      blijkt dat de MKB-ondernemer is aan te merken als een innovatieve MKB-ondernemer;
        - *krediet:* bedrag dat de Bank uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;
        - *kredietovereenkomst:* overeenkomst uit hoofde waarvan: 1°. de Bank aan een MKB-ondernemer geld ter leen
      verstrekt of zal verstrekken, of 2°. de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de
      Bank, of 3°. de Bank tegenover een derde, niet zijnde een rechtspersoon waarmee de Bank in een groep verbonden is
      of een Bank-gelieerde, onherroepelijk een verplichting is aangegaan om ten laste van de MKB-ondernemer aan de derde
      een of meer betalingen te doen, welke verplichting niet afhankelijk is van voorwaarden op de vervulling waarvan het
      handelen van de Bank van invloed is;
        - *minister:* de Minister van Economische Zaken, Landbouw en Innovatie;
        - *starter:* 1°. een MKB-ondernemer, die een natuurlijk persoon is en die niet langer dan drie jaar een onderneming
      in stand houdt; 2°. een vennootschap met een in aandelen verdeeld kapitaal, tevens MKB-ondernemer, waarvan de
      bestuurder een natuurlijk persoon is die ten tijde van het sluiten van de kredietovereenkomst direct of indirect de
      meerderheid van het geplaatst en gestort kapitaal houdt en deze meerderheid niet langer dan drie jaar houdt;
        - *starters-borgstellingskrediet:* bedrijfsborgstellingskrediet dat uitsluitend wordt verstrekt aan een starter;
        - *uitwinning:* 1°. uitwinning door de Bank, naar normaal bankgebruik, van de door de MKB-ondernemer aan de
      Bank verstrekte zekerheden; 2°. onderhandse verkoop met toestemming van de Bank door de MKB-ondernemer van de
      vermogensbestanddelen van de MKB-ondernemer, inning van vorderingen daaronder begrepen; en 3°. executoriale
      verkoop van de vermogensbestanddelen van de MKB-ondernemer; 4°. indien het faillissement van de MKB-ondernemer
      is uitgesproken of aan hem surseance van betaling is verleend de onderhandse of executoriale verkoop van de
      vermogensbestanddelen van de MKB-ondernemer door of met medewerking van de curator of de bewindvoerder;
        - liquiditeitsopslag: een door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
      [ref3]: https://wetten.overheid.nl/BWBR0021281
      [ref4]: https://wetten.overheid.nl/BWBR0007746#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
      - id: ref3
        bwb_id: BWBR0021281
      - id: ref4
        bwb_id: BWBR0007746
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0007746
        artikel: '27'
  - number: B2.2:2
    text: |-
      De Staat stelt zich borg ten behoeve van de Banken voor de terugbetaling van bedrijfsborgstellingskredieten die
      met inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en deze overeenkomst door de Banken worden verstrekt, met dien verstande
      dat deze borgstelling wordt aangegaan onder de navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.2:3.1
    text: |-
      De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan uitsluitend
      worden ingeroepen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.a
    text: indien het krediet is gemeld als bedoeld in artikel 6;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.b
    text: |-
      indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde provisie
      door de centrale Bank aan de Staat is betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.2:3.1.c
    text: |-
      indien en voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of
      delen daarvan de door de minister op grond van [artikel 2.7, tweede lid][ref1], van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde meldingslimiet niet is
      overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.2:3.1.d
    text: |-
      indien de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, zich borg heeft gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bedrijfsborgstellingskrediet wordt verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bedrijfsborgstellingskrediet met een minimum van € 5.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.e
    text: |-
      indien het bedrijfsborgstellingskrediet niet is bestemd en niet wordt gebruikt voor buitenlandse investeringen in
      distributiekanalen in verband met werkzaamheden op het gebied van uitvoer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.f
    text: |-
      indien het bedrijfsborgstellingskrediet niet meer bedraagt dan het tekort aan zekerheden dat bij de Bank ten tijde
      van het sluiten van de kredietovereenkomst bestaat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.g
    text: indien de kredietovereenkomst in schriftelijke vorm is aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.h
    text: |-
      indien de bank in de kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet wordt verstrekt een
      verplichting voor de MKB-ondernemer is opgenomen om alle medewerking te verlenen aan het uitoefenen door de Staat
      van de in artikel 20, eerste lid, genoemde bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.i
    text: |-
      indien de Bank in de door haar gesloten borgstellingsovereenkomst met betrekking tot de nakoming door de MKB-
      ondernemer van de verplichtingen voortvloeiende uit de uit hoofde waarvan het bedrijfsborgstellingskrediet
      is verleend een beding ten behoeve van de Staat heeft opgenomen, ertoe strekkende dat de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de Staat en de Bank geen bedingen heeft
      opgenomen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.2:3.1.i.1°
    text: een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.i.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.2:3.1.j
    text: |-
      indien door de Bank gelijktijdig met het sluiten van de kredietovereenkomst, uit hoofde waarvan een
      bedrijfsborgstellingskrediet aan de MKB-ondernemer wordt verstrekt, met de MKB-ondernemer een kredietovereenkomst
      is gesloten uit hoofde waarvan de MKB-ondernemer over een bankfaciliteit beschikt, die niet bestemd is en niet
      gebruikt wordt voor de aflossing van bankfaciliteiten waarover de MKB-ondernemer beschikt bij de Bank of een Bank-
      gelieerde of aan een rechtspersoon waarmee de Bank in een groep verbonden is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.k
    text: |-
      indien de bankfaciliteit, bedoeld in het eerste lid, onderdeel j, ten minste 100 procent bedraagt van het
      bedrijfsborgstellingskrediet, of,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.k.1°
    text: |-
      ten minste 33,3 procent bedraagt van het bedrijfsborgstellingskrediet, indien het bedrijfsborgstellingskrediet
      wordt verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking starter was, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.k.2°
    text: |-
      ten minste 50 procent bedraagt van het bedrijfsborgstellingskrediet indien het bedrijfsborgstellingskrediet wordt
      verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking innovatieve MKB-ondernemer was;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.1.l
    text: |-
      indien de looptijd van de onder k bedoelde bankfaciliteit ten minste even lang is als de looptijd van het
      bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:3.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel k, worden mede in aanmerking genomen de bedragen die een Bank-
      gelieerde gelijktijdig met de gesloten kredietovereenkomst aan de MKB-ondernemer worden verstrekt, indien de
      zekerheden van de Bank-gelieerde ter zake van die bedragen mede strekken tot zekerheid van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.2:4.1
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan: a. de MKB-ondernemer: 1°. beschikt
      over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde wijze te drijven; 2°. is
      in Nederland gevestigd en voert daar een substantieel deel van de activiteiten van de onderneming uit; 3°. is
      geen aanbieder als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1], noch
      oefent hij het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder uit; 4°. houdt geen onderneming
      in stand waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien de onderneming nog
      geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden verkregen,
      uit: – de beoefening van de land- of de tuinbouw, de vee- of visteelt, de visserij  of de teelt van vee-
      of visvoer, – de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een
      of meer andere ondernemingen, of – het verwerven, vervreemden, beheren of exploiteren van onroerende zaken
      of het ontwikkelen van onroerende zaakprojecten; 5°. beschikt naast het bedrijfsborgstellingskrediet niet
      over een lening waarvoor de Staat uit hoofde van de [Regeling LNV-subsidies][ref2] of door overname van de
      verplichtingen van de Stichting Borgstellingsfonds voor de landbouw borg of garant staat; 6°. beschikt niet over
      een door een andere bank of kredietverstrekker verstrekte kredietfaciliteit, waarvoor de Staat op grond van het
      [Kaderbesluit EZ-subsidies][ref3], het [Besluit borgstelling MKB-kredieten 1997][ref4] of het Besluit borgstelling
      MKB-kredieten borg staat. b. er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de Bank naar normaal
      bankgebruik het krediet niet geheel voor eigen rekening en risico kan verstrekken; c. de rentabiliteits- en
      continuïteitsperspectieven van de onderneming zijn bevredigend. 2. Het eerste lid, onderdeel a, onder 4, eerste
      gedachtenstreepje, is niet van toepassing op een MKB-ondernemer die gevestigd is in het openbaar lichaam Bonaire,
      Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0021281
      [ref3]: https://wetten.overheid.nl/BWBR0024796
      [ref4]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0021281
      - id: ref3
        bwb_id: BWBR0024796
      - id: ref4
        bwb_id: BWBR0009052
  - number: B2.2:5.1
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet voorts aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.2:5.1.a
    text: |-
      de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan € 200.000 aan de-
      minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren. Indien de onderneming
      actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een bedrijfsborgstellingskrediet
      wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde deel van het krediet. Bij de bepaling
      of de verlening van de borgstelling niet leidt tot overschrijding van het desbetreffende maximum wordt rekening
      gehouden met de-minimissteun die is verleend aan ondernemingen die deel uitmaken van dezelfde groep;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.2:5.1.b
    text: |-
      De Bank heeft er voor zorg gedragen dat: - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het
      staatsgegarandeerde deel van het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming actief
      is in het wegvervoer, niet meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde in
      aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun dat
      in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.2:5.2
    text: |-
      Dit artikel is niet van toepassing op een kredietovereenkomst die wordt gesloten met een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint-Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.2:6.1
    text: |-
      De centrale bank meldt het krediet of het deel van het krediet waarop deze bedrijfsborgstellingsovereenkomst
      van toepassing is binnen 35 dagen na het sluiten van de kredietovereenkomst aan de Staat onder de gelijktijdige
      verstrekking van de door de minister vastgestelde informatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.2:6.2
    text: De minister bevestigt de ontvangst van een melding binnen 35 dagen na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.2:6.3
    text: |-
      Voor de toepassing van artikel 3, eerste lid, aanhef en onder c, is de volgorde van ontvangst van de meldingen door
      de minister bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.2:7.1
    text: 'Het tarief van de provisie bedraagt eenmalig:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:7.1.a
    text: |-
      3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van niet
      langer dan twee jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:7.1.b
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan twee jaar, maar niet langer dan vier jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:7.1.c
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan vier jaar, maar niet langer dan zes jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:7.1.d
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan zes jaar, maar niet langer dan negen jaar en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:7.1.e
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan negen jaar, maar niet langer dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:7.2
    text: |-
      Indien overeenkomstig artikel 3, onderdeel b, een provisie is betaald met betrekking tot een kredietovereenkomst
      en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn toe te rekenen aan de
      kredietnemer of aan de Bank, wordt de provisie door de Staat terugbetaald aan de Bank mits de Bank binnen een jaar
      na het sluiten van de kredietovereenkomst daartoe een verzoek aan de Staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.2:8.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een bedrijfsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bedrijfsborgstellingskrediet het totaal van de
      bedrijfsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een
      groep, per groep een bedrag van € 1.000.000 niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.2:8.2
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een starters-borgstellingskrediet slechts in aanmerking
      genomen voor zover door de verstrekking van dit krediet het totaal van de starters-borgstellingskredieten, berekend
      per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een groep, per groep een bedrag van € 200.000
      niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.2:8.3
    text: |-
      Voor de toepassing van het eerste lid wordt een bedrijfsborgstellingskrediet dat is verstrekt aan een andere MKB-
      ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk is,
      geacht aan de MKB-ondernemer te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.2:8.4
    text: |-
      Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.2:8.5
    text: 'Voor de toepassing van het eerste lid worden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.2:8.5.a
    text: |-
      bedrijfsborgstellingskredieten die op een eerder tijdstip overeenkomstig artikel 6 zijn gemeld, slechts voor het
      met overeenkomstige toepassing van de artikelen 9 en 10 berekende gedeelte van die bedrijfsborgstellingskredieten
      in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.2:8.5.b
    text: |-
      kredieten, voor zover de Staat daarvoor op grond van het [Kaderbesluit EZ-subsidies][ref1], het Besluit
      borgstelling MKB-kredieten, of het [Besluit borgstelling MKB-kredieten 1997][ref2] nog borg staat, als
      bedrijfsborgstellingskredieten in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.2:9.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 8 in aanmerking te nemen
      bedrijfsborgstellingskrediet na verloop van ieder kalenderkwartaal verminderd met een zodanig vast bedrag, dat het
      bedrijfsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, maar uiterlijk na verloop van 6
      jaar, nihil bedraagt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.2
    text: |-
      Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van ten
      hoogste twaalf jaar indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.2.a
    text: |-
      het bedrijfsborgstellingskrediet uitsluitend is bestemd voor de betaling van de kosten van de stichting, van de
      aankoop of van de verbouwing van een onroerende zaak,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.2.b
    text: |-
      deze onroerende zaak voor ten minste de helft bestemd is te worden gebruikt voor de onderneming van de MKB-
      ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.2.c
    text: |-
      de Bank met betrekking tot de onder a bedoelde kosten bankfaciliteiten verstrekt die een bedrag van ten
      minste 100 procent van de in onderdeel a bedoelde kosten belopen, dan wel, indien sprake is van een starters-
      borgstellingskrediet, 33,3 procent van dit bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.3
    text: |-
      Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van ten
      hoogste twaalf jaar indien het bedrijfsborgstellingskrediet is verstrekt aan een innovatieve MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.4
    text: |-
      Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.5
    text: |-
      Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt aan een
      innovatieve MKB-ondernemer, het eerste kalenderkwartaal waarin vermindering plaatsvindt uiterlijk aanvangt op de
      eerste dag van het veertiende kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst
      is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.6
    text: |-
      Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt voor de
      betaling van de kosten van de stichting of verbouwing van een onroerende zaak, het eerste kalenderkwartaal waarin
      vermindering plaatsvindt uiterlijk aanvangt op de eerste dag van het zesde kalenderkwartaal dat volgt op het
      kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.7
    text: |-
      De Bank kan de vermindering, bedoeld in het eerste lid, gedurende een periode van ten minste een kalenderkwartaal
      opschorten indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.7.a
    text: |-
      de Bank voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing van het
      bedrijfsborgstellingskrediet,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.7.b
    text: |-
      de Bank uitstel verleent van de verplichting tot aflossing van alle bankfaciliteiten gedurende de duur van de
      opschorting, dan wel uitstel verleent van de verplichting tot aflossing van een gedeelte van de bankfaciliteiten,
      waarbij de som van de aflossingsbedragen ten minste even groot is als de som van de aflossingsbedragen waarvoor de
      Bank uitstel verleent als bedoeld onder a, of, indien het bedrijfsborgstellingskrediet is verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.7.b.1°
    text: |-
      een MKB-ondernemer die ten tijde van de verstrekking starter was, ten minste 33,3 procent bedraagt van de som van
      de aflossingsbedragen waarvoor de Bank uitstel verleent als bedoeld onder a, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.7.b.2°
    text: |-
      een MKB-ondernemer die ten tijde van de verstrekking innovatief MKB-ondernemer was, ten minste 50 procent bedraagt
      van de som van de aflossingsbedragen waarvoor de Bank uitstel verleent als bedoeld onder a, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.7.c
    text: |-
      de centrale Bank de opschorting meldt binnen 35 dagen na aanvang van de opschorting onder gelijktijdige
      verstrekking van de door de minister vastgestelde informatie. De minister bevestigt de melding binnen 35 dagen
      na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.8
    text: |-
      De in het zevende lid bedoelde opschorting van de vermindering vindt ten hoogste voor een totaal van acht
      kalenderkwartalen plaats. De opschorting van de vermindering vindt ten hoogste voor een totaal van twaalf
      kalenderkwartalen plaats indien het bedrijfsborgstellingskrediet is verstrekt aan een starter.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.9
    text: |-
      Indien een bedrijfsborgstellingskrediet wordt aangewend voor herfinanciering van een bedrijfsborgstellingskrediet,
      dat eerder is gebruikt voor de in het tweede lid, onder a en b genoemde doelen, en tevens is voldaan aan het tweede
      lid, onder b en c, is de nieuwe periode ten hoogste gelijk aan de periode waarvoor het bedrijfsborgstellingskrediet
      nog zou hebben gelopen zonder herfinanciering, indien en voor zover deze restperiode meer bedraagt dan zes jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.2:9.10
    text: |-
      Voor de toepassing van het zesde lid wordt onder een onroerende zaak mede begrepen
      schepen en vliegtuigen, voor zover deze zijn ingeschreven in de registers als bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Kadasterwet][ref1], alsmede ieder goederenrechtelijk recht dat omvat
      het uitsluitend gebruik van een onroerende zaak, met inbegrip van bovenbedoelde schepen en vliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
  - number: B2.2:10.1
    text: |-
      De vermindering van de borgstelling, bedoeld in artikel 9, wordt geschorst met ingang van de dag waarophet
      bedrijfsborgstellingskrediet is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.2:10.2
    text: |-
      In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bedrijfsborgstellingskrediet door de Bank is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.2:10.3
    text: |-
      De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.2:11.1
    text: |-
      De centrale Bank dient zo spoedig mogelijk na de voltooiing van de uitwinning of, indien dit eerder is, zo
      spoedig mogelijk nadat aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering
      komen op het bedrijfsborgstellingskrediet, maar in ieder geval binnen negen maanden na de datum waartegen het
      bedrijfsborgstellingskrediet is opgeëist of, indien dit eerder is, na de datum van het faillissement, een verzoek
      in om betaling uit hoofde van de bedrijfsborgstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.2:11.2
    text: Het verzoek wordt ingediend onder gelijktijdige verstrekking van de door de minister vastgestelde informatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.2:11.3
    text: |-
      De minister bevestigt de ontvangst van het verzoek om betaling binnen 35 dagen na de ontvangst en reageert op het
      verzoek binnen negen maanden na de bevestiging van de ontvangst aan de centrale Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.2:12.1
    text: |-
      De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van het overeenkomstig artikel 11 ingediende verzoek uit hoofde van het bedrijfsborgstellingskrediet of de
      bedrijfsborgstellingskredieten pro resto verschuldigd is, doch
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.1.a
    text: |-
      ten hoogste 90 procent van de met toepassing van de artikelen 8, 9 en 10 berekende omvang van het
      bedrijfsborgstellingskrediet of de bedrijfsborgstellingskredieten, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.1.b
    text: |-
      ten hoogste de som van de ten tijde van de opzegging van de kredietovereenkomst bestaande en verstrekte
      bankfaciliteiten van de Bank voor de MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.2
    text: 'In afwijking van het eerste lid, onder b, bedraagt de omvang van de borgstelling:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.2.a
    text: |-
      indien sprake is van een starters-borgstellingskrediet: ten hoogste drie maal de som van de ten tijde van de
      opzegging van de kredietovereenkomst bestaande en verstrekte bankfaciliteiten van de Bank voor de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.2.b
    text: |-
      indien het bedrijfsborgstellingskrediet is verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking
      een innovatieve MKB-ondernemer was: ten hoogste twee maal de som van de ten tijde van de opzegging van de
      kredietovereenkomst bestaande en verstrekte bankfaciliteiten van de Bank voor de MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.3
    text: |-
      Voor de toepassing van het eerste lid en het tweede lid, onderdeel a, worden als bankfaciliteiten mede in
      aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.3.a
    text: |-
      de bedragen die een Bank-gelieerde uit hoofde van een overeenkomst aan de MKB-ondernemer ter leen verstrekt of zal
      verstrekken, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:12.3.b
    text: |-
      de verplichtingen die een Bank-gelieerde tegenover een derde, niet zijnde een andere Bank-gelieerde of een
      rechtspersoon waarmee de Bank in een groep verbonden is, onherroepelijk is aangegaan om ten laste van de MKB-
      ondernemer aan de derde een of meer betalingen te doen als bedoeld in artikel 1, tweede lid, onderdeel g,
      3°, indien de zekerheden van de Bank-gelieerde ter zake van de hiervoor onder a en b bedoelde bedragen en
      verplichtingen mede strekken tot zekerheid van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.2:13.1
    text: |-
      De minister betaalt hetgeen de Staat uit hoofde van deze overeenkomst met het oog op de door de Bank in haar
      verzoek bedoelde bedrijfsborgstellingskrediet verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:13.2
    text: |-
      Voor zover de centrale Bank bij haar verzoek om betaling aannemelijk maakt dat er bijzondere omstandigheden waren
      die het naar normaal bankgebruik noodzakelijk maakten de andere bankfaciliteiten sterker in omvang terug te brengen
      dan de bedrijfsborgstellingskredieten, blijft artikel 12, eerste lid, aanhef en onder b, en tweede lid, buiten
      toepassing.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:13.3
    text: 'De Staat is niet verplicht tot betaling op het verzoek van de Bank:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:13.3.a
    text: indien niet voldaan is aan een verzoek als bedoeld in artikel 20, eerste lid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:13.3.b
    text: |-
      indien de Bank of de centrale Bank in het kader van het verzoek gegevens heeft verstrekt, waarvan zij wist of
      behoorde te weten dat deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste
      beslissing op het verzoek zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:13.4
    text: |-
      Betalingen door de Staat aan de Bank en door de Bank aan de Staat geschieden door debitering respectievelijk
      creditering door de centrale Bank van een rekening die de centrale Bank zal aanhouden ten name van het ministerie
      van Economische Zaken, Landbouw en Innovatie, met vermelding van 'verliesdeclaraties'.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:13.5
    text: Over het debet- of creditsaldo van de rekening zal een rente berekend worden gelijk aan de basisrente.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.2:14.1
    text: |-
      Gedurende vijf jaar nadat de Bank uit hoofde van het bedrijfsborgstellingskrediet door de Staat is betaald, is
      de Bank gehouden die pogingen in het werk te stellen om namens de Staat het door de Staat betaalde bedrag in te
      vorderen, die de Bank in het werk zou hebben gesteld indien het krediet voor eigen rekening en risico door de Bank
      zou zijn verstrekt. De Staat machtigt met het oog hierop de Bank tot invordering bij de kredietnemer van de door
      deze aan de Staat verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.2:14.2
    text: |-
      De centrale Bank zendt binnen drie maanden na afloop van de in het eerste lid bedoelde periode de minister een
      overzicht van de door haar of door de Bank ondernomen activiteiten, waarin de door de minister vastgestelde
      informatie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.2:15.1
    text: |-
      Indien een verzoek om betaling als bedoeld in artikel 11 is ingediend op een moment, waarop de uitwinning nog niet
      is voltooid en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bedrijfsborgstellingskrediet, brengt de centrale Bank de minister ten minste jaarlijks verslag uit over de
      voortgang van de uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.2:15.2
    text: |-
      De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nadere gegevens van de
      Banken verlangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.2:16.1
    text: |-
      De centrale Bank betaalt de vanaf het moment van de indiening van een verzoek om betaling als bedoeld in artikel 11
      ontvangen opbrengsten die in mindering komen op het bedrijfsborgstellingskrediet binnen twee maanden na ontvangst
      aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.2:16.2
    text: |-
      Voor zover de opbrengsten na de aanvang van de periode, bedoeld in artikel 14, eerste lid, ontvangen zijn wordt
      de in het eerste lid bedoelde betalingsverplichting beperkt tot 80 procent van de ontvangen opbrengsten, tenzij
      opbrengsten ontvangen zijn uit hoofde van uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.2:16.3
    text: |-
      De centrale Bank zal de rekening, bedoeld in artikel 13, vierde lid, per de datum van verzending van het verzoek,
      bedoeld in artikel 11, en binnen twee maanden na die datum, debiteren voor het bedrag waarvoor betaling wordt
      gevraagd, vermeerderd met een rente over de periode die verstreken is sinds de dag waarop de vermindering, bedoeld
      in artikel 9, op grond van artikel 10 is geschorst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.2:16.4
    text: |-
      De centrale Bank zal de rekening per de datum van de reactie van de minister, bedoeld in artikel 11, derde lid,
      en binnen twee maanden na die datum crediteren of debiteren voor respectievelijk het voor de Staat positieve of
      negatieve verschil tussen het bedrag waarvoor de rekening ingevolge het derde lid is gedebiteerd en het door de
      Staat blijkens de reactie, bedoeld in artikel 11, verschuldigde bedrag, vermeerderd met een over dat verschil te
      berekenen rente over de periode die is verstreken sinds de creditering of debitering, bedoeld in het derde lid, en
      de datum waarop de reactie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.2:16.5
    text: |-
      De rente, bedoeld in het derde en vierde lid, is gelijk aan de zes maands Euribor op het moment van de indiening
      van een aanvraag als bedoeld in artikel 11, vermeerderd met de door de bank gehanteerde liquiditeitsopslag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.2:17.1
    text: |-
      De Bank treft geen schuldregeling die inhoudt of mede inhoudt een gehele of gedeeltelijke kwijtschelding van
      verplichtingen voortvloeiende uit een kredietovereenkomst, uit hoofde waarvan een bedrijfsborgstellingskrediet
      is verstrekt, zonder voorafgaande toestemming van de minister op een verzoek ingediend door de centrale Bank. De
      minister kan aan zijn toestemming voorwaarden verbinden ten aanzien van de inhoud van een dergelijke regeling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.2:17.2
    text: De minister beslist zo spoedig mogelijk op een verzoek om toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.2:18.1
    text: |-
      De verplichtingen van de Staat uit hoofde van deze overeenkomst met betrekking tot een bedrijfsborgstellingskrediet
      vervallen door schuldvernieuwing, door schuldoverneming en – voor het gedeelte waarin subrogatie plaatsvindt – door
      subrogatie van derden in de rechten van de Bank met betrekking tot het bedrijfsborgstellingskrediet, al dan niet
      voorafgegaan door verpanding van het bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.2:18.2
    text: |-
      In afwijking van het eerste lid blijven de verplichtingen van de Staat met betrekking tot een
      bedrijfsborgstellingskrediet van kracht, indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.2:18.2.a
    text: |-
      de MKB-ondernemer aan wie het bedrijfsborgstellingskrediet is verstrekt de onderneming en alle voor het drijven van
      de onderneming bestemde activa en passiva inbrengt of overdraagt aan een door de MKB-ondernemer voor het drijven
      van die onderneming opgerichte rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.2:18.2.b
    text: |-
      de Bank met de onder a bedoelde rechtspersoon een overeenkomst sluit als gevolg waarvan die rechtspersoon bij de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verleend de plaats inneemt van de MKB-
      ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.2:18.2.c
    text: |-
      de MKB-ondernemer zich naast de onder a bedoelde rechtspersoon hoofdelijk aansprakelijk stelt voor de nakoming door
      die rechtspersoon van de verplichtingen die voortvloeien uit de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.2:18.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder rechtspersoon mede begrepen twee of meer rechtspersonen,
      indien die rechtspersonen gezamenlijk voldoen aan de in het tweede lid genoemde voorwaarden en ieder van die
      rechtspersonen zich hoofdelijk aansprakelijk stelt voor de nakoming van de verplichtingen die voortvloeien uit de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.2:19
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt dat
      de Bank of de centrale Bank zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om
      betaling een andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, of dat
      de Bank de betalingsverplichting, bedoeld in artikel 16, eerste lid, niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel19
  - number: B2.2:20.1
    text: |-
      De Bank, en indien toepassing is gegeven aan de artikelen 3, tweede lid, en 12, derde lid, de Bank-
      gelieerde, en de MKB-ondernemer voldoen aan hetgeen door de minister aangewezen bij zijn ministerie werkzame
      personen wordt verzocht, voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering van het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen en deze overeenkomst, en met het oog op de nakoming door de Staat van op de Staat rustende
      internationaalrechtelijke verplichtingen, en voor zover het betrekking heeft op de uit het besluit of deze
      overeenkomst voortvloeiende zelfstandige verplichtingen van de Bank of de Bank-gelieerde de MKB-ondernemer aan
      wie het bedrijfsborgstellingskrediet is verstrekt of de met deze MKB-ondernemer gesloten kredietovereenkomsten,
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.2:20.1.a
    text: het toegang verlenen tot door hen gebruikte plaatsen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.1.b
    text: het verlenen van inzage in zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.1.c
    text: het maken van kopieën van de onder b bedoelde gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.1.d
    text: het verlenen van medewerking aan het verstrekken van gegevens door anderen en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.1.e
    text: het verstrekken van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.2
    text: |-
      Alleen in daartoe aanleiding gevende gevallen zal aan de Bank, of indien toepassing is gegeven aan de artikelen 3,
      tweede lid, en 12, derde lid, aan de Bank-gelieerde, of aan de MKB-ondernemer, gevraagd worden de in het eerste lid
      bedoelde inlichtingen ook door haar interne accountant te doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.3
    text: |-
      Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de Bank, de Bank-gelieerde of de MKB-ondernemer onjuiste of onvolledige informatie
      heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.4
    text: |-
      De centrale Bank stelt de minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten en verstrekt
      daarbij de door de minister vastgestelde informatie:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.4.a
    text: vervroegde volledige aflossing van het bedrijfsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.4.b
    text: het door de afdeling ....... van de Bank in beheer nemen van het bedrijfsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.4.c
    text: de verlening van surseance van betaling aan of de faillietverklaring van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.4.d
    text: opeising van het bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:20.5
    text: |-
      De Bank meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van betaling aan
      de Bank, dan wel een verzoek tot faillietverklaring van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.2:21.1
    text: |-
      Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet wordt verstrekt
      en tijdens de uitwinning zal de Bank waken over de belangen van de Staat als borg.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.2:21.2
    text: |-
      De Bank zal er voor zorg dragen dat het bedrijfsborgstellingskrediet niet wordt gebruikt voor de nakoming van
      verplichtingen van de MKB-ondernemer aan de Bank die het bedrijfsborgstellingskrediet verstrekt, aan een Bank-
      gelieerde of aan een rechtspersoon waarmee de Bank in een groep verbonden is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.2:21.3
    text: |-
      De Bank zal tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet is
      verleend in de door haar te sluiten overeenkomsten met allen, niet zijnde de Staat, die zich borg willen stellen
      voor de nakoming door de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde
      waarvan het bedrijfsborgstellingskrediet is verleend, een beding ten behoeve van de Staat opnemen, ertoe strekkende
      dat de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de Staat en
      de Bank zal geen bedingen opnemen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.2:21.3.a
    text: een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.2:21.3.b
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.2:21.4
    text: |-
      De Bank draagt er zorg voor dat de relaties tussen haar en de bij haar onderneming betrokkenen enerzijds, en de
      ondernemer aan wie een bedrijfsborgstellingskrediet is verstrekt anderzijds transparant zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.2:22
    text: |-
      Indien naar het oordeel van de minister de kans dat de toepasselijkheid van deze overeenkomst op een
      bedrijfsborgstellingskrediet of een deel van een bedrijfsborgstellingskrediet wordt ingeroepen in belangrijke
      mate wordt verkleind of indien naar het oordeel van de minister aannemelijk is dat daardoor het bedrag waarvoor de
      toepasselijkheid van deze overeenkomst wordt ingeroepen in belangrijke mate wordt verlaagd, kan de minister voor de
      toepassing van deze overeenkomst met betrekking tot dat krediet instemmen met een gemotiveerd verzoek van de Bank
      om afwijking van deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.2:23
    text: |-
      Waar in deze overeenkomst sprake is van een vorm van communicatie geschiedt deze langs elektronische weg. De
      aanlevering door de Bank kan in afwijking en bij wijze van alternatief en ter keuze van de Bank ook geschieden in
      schriftelijke vorm en door aanlevering van een fysieke gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel23
  - number: B2.2:24.1
    text: |-
      De inwerkingtreding van een wijziging van het [Kaderbesluit EZ-subsidies][ref1] of [hoofdstuk 2][ref2] van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen leidt te zelfder tijd tot een gelijke wijziging
      van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.2:24.2
    text: Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de centrale Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.2:24.3
    text: |-
      Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door de minister en de Bank schriftelijk worden opgezegd
      met inachtneming van een opzegtermijn van drie hele kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.2:24.4
    text: |-
      In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien een Bank of centrale Bank in strijd heeft gehandeld met het gestelde in deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.2:24.5
    text: |-
      In afwijking van het derde lid kunnen de Banken deze overeenkomst met onmiddellijke ingang opzeggen binnen een
      termijn van een maand na publicatie in het Staatsblad van een wijziging van het [Kaderbesluit EZ-subsidies][ref1],
      publicatie in de Staatscourant van een wijziging van de Subsidieregeling starten, groeien en overdragen van
      ondernemingen of een schriftelijke mededeling van de minister, inhoudende een wijziging van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
  - number: B2.2:24.6
    text: |-
      Opzegging door de Banken als bedoeld in het derde en vijfde lid is uitsluitend mogelijk indien dit geschiedt door
      alle Banken gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.2:24.7
    text: |-
      Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit EZ-subsidies][ref1] of door
      intrekking van [artikel 2.3, eerste lid, onderdeel a][ref2], van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.2:24.8
    text: |-
      Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien van
      bedrijfsborgstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging, opzegging, ontbinding
      of beëindiging overeenkomstig artikel 3 zijn gemeld en ten aanzien van bedrijfsborgstellingskredieten die zijn of
      zullen worden verstrekt uit hoofde van een kredietovereenkomst die is aangegaan voor de inwerkingtreding van de
      wijziging, opzegging, ontbinding of beëindiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.2:24.9
    text: |-
      Het achtste lid is niet van toepassing ten aanzien van de wijziging van artikel 5 ingevolge de Regeling van
      de Minister van Economische Zaken van 3 september 2009, nr. WJZ/9155298, tot wijziging van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen ten aanzien van de opschortingsvoorwaarden voor borgstelling van
      MKB-kredieten (Stcrt. 2009, 13666)
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.2:24.10
    text: |-
      Als het [Kaderbesluit EZ-subsidies][ref1] en [artikel 2.3, eerste lid, onderdeel a][ref2], van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen gelijktijdig worden ingetrokken en vervangen door materieel
      identieke wettelijke voorschriften in een andere algemene maatregel van bestuur of ministeriële regeling dan is het
      zevende lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.2:25
    text: 'Bank-gelieerde in de zin van artikel 1, tweede lid, onder a, van deze overeenkomst is (zijn):'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.2:25.a
    text: (...)...................................
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.2:25.b
    text: (...enz.)
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.3:1
    text: |-
      In deze overeenkomst wordt verstaan onder: - *groep:* een economische eenheid, waarin organisatorisch zijn
      verbonden: 1°. een natuurlijke persoon of een privaatrechtelijke rechtspersoon die direct of indirect – meer
      dan de helft van het geplaatste kapitaal verschaft aan, – volledig aansprakelijk vennoot is van of – overwegende
      zeggenschap heeft over een of meer rechtspersonen of vennootschappen en 2°. laatstbedoelde rechtspersonen of
      vennootschappen;
        - *kredietovereenkomst:* een overeenkomst uit hoofde waarvan: 1°. de Bank aan een MKB-ondernemer geld ter leen
      verstrekt of zal verstrekken, of 2°. de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de
      Bank, of 3°. de Bank tegenover een derde, niet zijnde een rechtspersoon waarmee de Bank in een groep verbonden is
      onherroepelijk een verplichting is aangegaan om ten laste van de MKB-ondernemer aan de derde een of meer betalingen
      te doen, welke verplichting niet afhankelijk is van voorwaarden op de vervulling waarvan het handelen van de Bank
      van invloed is;
        - *krediet:* een bedrag dat de Bank uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;
        - *bodemsaneringsborgstellingskrediet:* een krediet of een deel van een krediet dat overeenkomstig artikel 3 is
      gemeld;
        - *saneringsplan:* plan als bedoeld in [artikel 39 van de Wet bodembescherming][ref1];
        - *saneringsbestek:* bestek gebaseerd op een saneringsplan, dat een gedetailleerde beschrijving omvat van de
      aard en de omvang van de uit te voeren sanering van de bodem met een nauwkeurige beschrijving van het te bereiken
      resultaat en waaruit de omvang van de saneringskosten kan worden afgeleid;
        - *uitwinning:* 1°. uitwinning door de Bank, naar normaal bankgebruik, van de door de MKB-ondernemer aan de
      Bank verstrekte zekerheden, 2°. onderhandse verkoop met toestemming van de Bank door de MKB-ondernemer van
      de vermogensbestanddelen van de MKB-ondernemer, inning van vorderingen daaronder begrepen, 3°. executoriale
      verkoop van de vermogensbestanddelen van de MKB-ondernemer, en 4°. indien het faillissement van de ondernemer
      is uitgesproken of aan hem surséance van betaling is verleend: onderhandse of executoriale verkoop van de
      vermogensbestanddelen van de MKB-ondernemer door of met medewerking van de curator of de bewindvoerder;
        - *MKB-ondernemer:* een ondernemer die een kleine onderneming of een middelgrote onderneming in stand houdt;
        - *kleine onderneming:* kleine onderneming in de zin van verordening (EG) nr. 800/ 2008 van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
        - *middelgrote onderneming:* een middelgrote onderneming in de zin van [verordening (EG) nr. 800/2008](32008R0800)
      van de Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond
      van artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
        - *de-minimissteun:* steun van de overheid die voldoet aan de voorwaarden, vastgesteld in [verordening (EG) nr.
      1998/2006](32006R1998) van de Commissie van Europese Gemeenschappen van 15 december 2006 betreffende de toepassing
      van de artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379)), [verordening (EG) nr. 1535/2007]
      (32007R1535) van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337) en [verordening
      (EG) nr. 875/2007](32007R0875) van de Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwsector en de visserijsector
      (PbEU L 193);
        - *Bank:* binnen het grondgebied van de Europese Unie gevestigde bank, niet zijnde een bank die tevens
      beleggingsonderneming is, die is toegelaten het bedrijf van bank uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '39'
  - number: B2.3:2
    text: |-
      De staat stelt zich borg ten behoeve van de Bank voor de terugbetaling van bodemsaneringsborgstellingskredieten die
      met inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en deze overeenkomst door de Bank worden verstrekt. Deze borgstelling wordt
      aangegaan onder de navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.3:3.1
    text: |-
      De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan uitsluitend
      worden ingeroepen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.3:3.1.a
    text: |-
      indien het krediet of het deel ervan binnen 35 dagen na het sluiten van de kredietovereenkomst aan de minister is
      gemeld met gebruikmaking van een formulier, waarvan het model door de minister wordt vastgesteld,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.3:3.1.b
    text: |-
      indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde
      garantieprovisie door de Bank aan de staat betaald is,


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.3:3.1.c
    text: |-
      voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of delen daarvan
      de door de minister op grond van [artikel 2.7, tweede lid][ref1] van de Subsidieregeling starten, groeien en
      overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde meldingslimiet niet is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.3:3.2
    text: De minister bevestigt de ontvangst van een meldingsformulier schriftelijk binnen 35 dagen na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.3:3.3
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onder c, is de volgorde van ontvangst van de meldingsformulieren
      door de minister bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.3:3.4
    text: De meldingen, bedoeld in het eerste lid onder a, worden gedaan met gebruikmaking van een ondertekend formulier.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.3:4.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een bodemsaneringsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bodemsaneringsborgstellingskrediet het totaal van de
      bodemsaneringsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van
      een groep, per groep, een bedrag van € 1.500.000 niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.3:4.2
    text: |-
      Voor de toepassing van het eerste lid wordt een bodemsaneringsborgstellingskrediet dat is verstrekt aan een andere
      MKB-ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk
      is, geacht aan de MKB-ondernemer te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.3:4.3
    text: |-
      Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verstrekt bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.3:4.4
    text: |-
      Voor de toepassing van het eerste lid worden bodemsaneringsborgstellingskredieten die op een eerder tijdstip
      overeenkomstig artikel 3 zijn gemeld slechts voor het met overeenkomstige toepassing van de artikelen 5 en 6
      berekende gedeelte van die bodemsaneringsborgstellingskredieten in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.3:5.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 4 in aanmerking te nemen
      bodemsaneringsborgstellingskrediet na verloop van ieder kalenderkwartaal met een zodanig vast bedrag verminderd,
      dat het bodemsaneringsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, doch uiterlijk na
      verloop van 18 jaar, nihil bedraagt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:5.2
    text: |-
      De Bank kan de vermindering, bedoeld in het eerste lid, gedurende een aaneengesloten periode van maximaal vier
      kalenderkwartalen opschorten indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:5.2.a
    text: |-
      de Bank voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing van het
      bodemsaneringsborgstellingskrediet, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:5.2.b
    text: |-
      de Bank de opschorting meldt binnen 35 dagen na aanvang van de opschorting met gebruikmaking van een formulier,
      waarvan het model door de minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:5.3
    text: De opschorting van de vermindering vindt ten hoogste twee maal plaats.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:5.4
    text: |-
      Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:5.5
    text: |-
      De minister bevestigt de ontvangst van een formulier als bedoeld in het tweede lid, onder b, schriftelijk binnen 35
      dagen na de ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.3:6.1
    text: |-
      De vermindering van de borgstelling, bedoeld in artikel 5, wordt geschorst met ingang van de dag waartegen het
      bodemsaneringsborgstellingskrediet is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.3:6.2
    text: |-
      In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bodemsaneringsborgstellingskrediet door de Bank is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.3:6.3
    text: |-
      De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surséance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.3:7
    text: |-
      De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van een overeenkomstig artikel 14 ingediende aanvraag uit hoofde van het bodemsaneringsborgstellingskrediet
      of bodemsaneringsborgstellingskredieten pro resto verschuldigd is, doch ten hoogste 90 procent van de met
      toepassing van de artikelen 4, 5 en 6 berekende omvang van het bodemsaneringsborgstellingskrediet of de
      bodemsaneringsborgstellingskredieten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.3:8
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet aan
      een MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.a
    text: 'De Bank heeft de beschikking over de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.a.1°
    text: een schriftelijke verklaring van een ingenieur overeenkomstig het model dat door de minister wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.a.2°
    text: |-
      een afschrift van de beschikking van gedeputeerde staten als bedoeld in
      [artikel 29 van de Wet bodembescherming][ref1], waaruit blijkt dat het om een geval van ernstige verontreiniging
      gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '29'
  - number: B2.3:8.a.3°
    text: |-
      een afschrift van de beschikking van gedeputeerde staten als bedoeld in
      [artikel 39, tweede lid, eerste volzin, van de Wet bodembescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '39'
  - number: B2.3:8.b
    text: |-
      de MKB-ondernemer beschikt over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde
      wijze te drijven;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.c
    text: |-
      er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de Bank naar normaal bankgebruik het krediet niet
      geheel voor eigen rekening en risico kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.d
    text: |-
      het bodemsaneringsborgstellingskrediet bedraagt niet meer dan het tekort aan zekerheden dat bij de Bank ten tijde
      van het sluiten van de kredietovereenkomst bestaat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.e
    text: |-
      het bodemsaneringsborgstellingskrediet bedraagt niet meer dan de saneringskosten die in de schriftelijke verklaring
      als bedoeld in onderdeel a, ten 1°, zijn aangemerkt als kosten van de werkzaamheden die noodzakelijk zijn voor de
      sanering van de bodem;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.f
    text: de kredietovereenkomst is in schriftelijke vorm aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.g
    text: de rentabiliteits- en continuïteitsperspectieven van de onderneming zijn bevredigend;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.h
    text: |-
      het bodemsaneringsborgstellingskrediet is niet bestemd en wordt niet gebruikt voor de nakoming van verplichtingen
      van de MKB-ondernemer aan de Bank die het bodemsaneringsborgstellingskrediet verstrekt of aan een rechtspersoon
      waarmee de Bank in een groep verbonden is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.i
    text: |-
      de MKB-ondernemer beschikt niet over een door een andere bank verstrekte kredietfaciliteit waarvoor de staat op
      grond van het [Kaderbesluit EZ-subsidies][ref1], het [Besluit borgstelling MKB-kredieten 1997][ref2], het Besluit
      borgstelling MKB-kredieten, Regeling borgstelling MKB-kredieten 1988, de Kredietregeling midden- en kleinbedrijf
      1985 of de Kredietbeschikking midden- en kleinbedrijf 1976 borg staat anders dan een bijzondere hypothecaire
      geldlening als bedoeld in bijlage 4 van de Kredietbeschikking midden- en kleinbedrijf 1976 of in hoofdstuk VI van
      de Kredietregeling midden- en kleinbedrijf 1985;


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.3:8.j
    text: |-
      de MKB-ondernemer, indien deze een natuurlijke persoon is, zal naar verwachting na een gebruikelijke aanloopperiode
      uit de inkomsten van zijn onderneming kunnen voorzien in zijn levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.k
    text: |-
      de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, heeft zich borg gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bodemsaneringsborgstellingskrediet is verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bodemsaneringsborgstellingskrediet met een minimum van € 15.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.l
    text: |-
      de Bank heeft in de door haar gesloten borgstellingsovereenkomsten met betrekking tot de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bodemsaneringsborgstellingskrediet is verleend een beding ten behoeve van de staat opgenomen, ertoe strekkende dat
      de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de staat en de
      Bank heeft geen bedingen opgenomen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.3:8.l.1°
    text: een borg er zich op zou kunnen beroepen dat de staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.l.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.3:8.m
    text: |-
      de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan € 200.000
      aan de-minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren.
      Indien de onderneming actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een
      bodemsaneringsborgstellingskrediet wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde
      deel van het krediet. Bij de bepaling of de verlening van de borgstelling niet leidt tot overschrijding van
      het desbetreffende maximum wordt rekening gehouden met de-minimissteun die in de referteperiode is verleend aan
      ondernemingen die deel uitmaken van dezelfde groep;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:8.n
    text: |-
      De Bank heeft er voor zorg gedragen dat: - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het
      staatsgegarandeerde deel van het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming
      actief is in het wegvervoer, meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde
      in aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun
      dat in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.3:9
    text: |-
      De Bank voldoet slechts aan de voor haar uit het bodemsaneringsborgstellingskrediet jegens de MKB-ondernemer
      voortvloeiende betalingsverplichtingen voor zover de MKB-ondernemer door het overleggen van facturen de
      verschuldigdheid van de kosten, die in de schriftelijke verklaring als bedoeld in artikel 8, onderdeel a, ten 1°
      zijn aangemerkt als noodzakelijk voor de sanering van de bodem, heeft aangetoond.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.3:10.1
    text: |-
      De Bank voldoet aan hetgeen door door de minister aangewezen bij zijn ministerie werkzame personen wordt verzocht,
      voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering van het [Kaderbesluit EZ-subsidies][ref1],
      [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen van ondernemingen en deze overeenkomst,
      en voor zover het betrekking heeft op de uit het besluit en deze overeenkomst voortvloeiende zelfstandige
      verplichtingen van de Bank, op de MKB-ondernemer aan wie het bodemsaneringsborgstellingskrediet is verstrekt of op
      de met deze MKB-ondernemer gesloten kredietovereenkomsten omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.3:10.1.a
    text: het toegang verlenen tot door haar gebruikte plaatsen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.1.b
    text: het verlenen van inzage in zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.1.c
    text: het maken van kopieën van de onder b bedoelde gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.1.d
    text: het verlenen van medewerking aan het verstrekken van gegevens door anderen en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.1.e
    text: het verstrekken van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.2
    text: |-
      Alleen in daartoe aanleiding gevende gevallen zal aan de Bank gevraagd worden de in het eerste lid bedoelde
      inlichtingen ook door haar interne accountant te doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.3
    text: |-
      Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de Bank onjuiste of onvolledige informatie heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.4
    text: |-
      De Bank stelt, met gebruikmaking van een formulier, waarvan het model door de minister wordt vastgesteld, de
      minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.4.a
    text: vervroegde volledige aflossing van het bodemsaneringsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.4.b
    text: het door de afdeling ....... van de Bank in beheer nemen van het bodemsaneringsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.4.c
    text: de verlening van surséance van betaling aan of de faillietverklaring van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.4.d
    text: opeising van het bodemsaneringsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.5
    text: |-
      Na afsluiting van ieder boekjaar zendt de Bank voor 1 februari van het daaropvolgende jaar, met gebruikmaking van
      een formulier, waarvan het model door de minister wordt vastgesteld, aan de minister een opgave van de omvang van
      de borgstelling aan het einde van het boekjaar voor alle bodemsaneringsborgstellingskredieten te zamen, waarvoor de
      Bank nog geen verzoek om betaling als bedoeld in artikel 14 heeft ingediend. Deze omvang dient te worden berekend
      met toepassing van paragraaf 4.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.6
    text: |-
      Binnen zes maanden na afsluiting van ieder boekjaar zendt de Bank, met gebruikmaking van een formulier, waarvan
      het model door de minister wordt vastgesteld, aan de minister een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] waaruit blijkt van de juistheid en
      volledigheid van de in het vijfde lid bedoelde opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: B2.3:10.7
    text: |-
      Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet wordt
      verstrekt en tijdens de uitwinning zal de Bank waken over de belangen van de staat als borg.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.8
    text: |-
      De Bank zal tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet
      is verleend in de door haar te sluiten overeenkomsten met allen, niet zijnde de staat, die zich borg willen stellen
      voor de nakoming door de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde
      waarvan het bodemsaneringsborgstellingskrediet is verleend een beding ten behoeve van de staat opnemen, ertoe
      strekkende dat de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de
      staat en de Bank zal geen bedingen opnemen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.3:10.8.1°
    text: een borg er zich op zou kunnen beroepen dat de staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.8.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.3:10.9
    text: |-
      De Bank draagt er zorg voor dat de relaties tussen haar en de bij haar onderneming betrokkenen enerzijds, en de
      ondernemer aan wie een bodemsaneringsborgstellingskrediet is verstrekt anderzijds transparant zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:10.10
    text: |-
      De Bank meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van betaling aan
      de Bank, dan wel een verzoek tot faillietverklaring van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.3:11.1
    text: |-
      Indien een aanvraag om betaling als bedoeld in artikel 14 is ingediend op een moment, waarop de uitwinning nog niet
      is voltooid en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bodemsaneringsborgstellingskrediet, brengt de Bank de minister ten minste jaarlijks verslag uit over de
      voortgang van de uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.3:11.2
    text: |-
      De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nadere gegevens van de
      Bank verlangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.3:12.1
    text: |-
      Gedurende een periode van vijf jaar na de datum waarop een verzoek om betaling als bedoeld in artikel 14 is
      ingediend of, indien een verzoek om betaling is ingediend op een moment waarop de uitwinning nog niet is voltooid
      en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen op
      het bodemsaneringsborgstellingskrediet, na de datum waarop de Bank de minister heeft bericht dat de uitwinning
      is voltooid of dat aannemelijk is dat geen opbrengsten meer zijn te verwachten die in mindering komen op het
      bodemsaneringsborgstellingskrediet, is de Bank gehouden die pogingen in het werk te stellen om namens de staat
      het door de staat betaalde bedrag in te vorderen, die de Bank in het werk zou hebben gesteld indien het krediet
      voor eigen rekening en risico door de Bank zou zijn verstrekt. De staat machtigt met het oog hierop de Bank tot
      invordering bij de kredietnemer van de door deze aan de staat verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.3:12.2
    text: |-
      De Bank zendt binnen drie maanden na afloop van de in het eerste lid bedoelde periode de minister een overzicht
      van de door haar ondernomen activiteiten, met gebruikmaking van een formulier, waarvan het model door de minister
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.3:13.1
    text: |-
      De Bank treft geen schuldregeling die inhoudt of mede inhoudt een gehele of gedeeltelijke
      kwijtschelding van verplichtingen voortvloeiende uit een kredietovereenkomst, uit hoofde waarvan een
      bodemsaneringsborgstellingskrediet is verstrekt, zonder voorafgaande schriftelijke toestemming van de minister. De
      minister kan aan zijn toestemming voorwaarden verbinden ten aanzien van de inhoud van een dergelijke regeling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.3:13.2
    text: |-
      Een verzoek om toestemming als bedoeld in het eerste lid dient door de Bank schriftelijk bij de minister te worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.3:13.3
    text: De minister beslist zo spoedig mogelijk op een verzoek om toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.3:14.1
    text: |-
      De Bank dient zo spoedig mogelijk na de voltooiing van de uitwinning of, indien dit eerder is, zo spoedig
      mogelijk nadat aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bodemsaneringsborgstellingskrediet, doch in ieder geval binnen negen maanden na de datum waartegen het
      bodemsaneringsborgstellingskrediet is opgeëist of, indien dit eerder is, na de datum van het faillissement, een
      aanvraag in om betaling uit hoofde van de bodemsaneringsborgstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.3:14.2
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, waarvan het model door de minister wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.3:15.1
    text: De minister bevestigt de ontvangst van een aanvraag om betaling schriftelijk binnen 35 dagen na de ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.3:15.2
    text: |-
      De minister deelt zijn beslissing op de aanvraag binnen negen maanden na de bevestiging van de ontvangst
      schriftelijk aan de Bank mede.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.3:16.1
    text: |-
      De minister stelt het uit hoofde van deze overeenkomst door de staat verschuldigde bedrag vast overeenkomstig het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen van
      ondernemingen en deze overeenkomst, met uitzondering van het bepaalde in artikel 10, vierde, vijfde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.3:16.2
    text: 'De minister kan in ieder geval afwijzend beslissen op een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.3:16.2.a
    text: indien niet voldaan is aan een verzoek als bedoeld in artikel 10, eerste lid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.3:16.2.b
    text: |-
      indien de Bank in het kader van de aanvraag gegevens heeft verstrekt, waarvan zij wist of behoorde te weten dat
      deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste beslissing op de aanvraag
      zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.3:17.1
    text: |-
      Betalingen door de staat aan de Bank en door de Bank aan de staat geschieden door debitering respectievelijk
      creditering door de Bank van een rekening die de Bank zal aanhouden ten name van het Ministerie van Economische
      Zaken, met vermelding van 'bodemsaneringsverliesdeclaraties'.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.3:17.2
    text: |-
      Over het debet- of creditsaldo van de rekening zal een rente berekend worden gelijk aan de in Het Financieele
      Dagblad gepubliceerde basisrente.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.3:18.1
    text: |-
      De verplichtingen van de staat uit hoofde van deze overeenkomst met betrekking tot een
      bodemsaneringsborgstellingskrediet vervallen door schuldvernieuwing, door schuldoverneming en – voor
      het gedeelte waarin subrogatie plaatsvindt – door subrogatie van derden in de rechten van de Bank met
      betrekking tot het bodemsaneringsborgstellingskrediet, al dan niet voorafgegaan door verpanding van het
      bodemsaneringsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.3:18.2
    text: |-
      In afwijking van het eerste lid blijven de verplichtingen van de staat met betrekking tot een
      bodemsaneringsborgstellingskrediet van kracht, indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.3:18.2.a
    text: |-
      de MKB-ondernemer aan wie het bodemsaneringsborgstellingskrediet is verstrekt de onderneming en alle voor het
      drijven van de onderneming bestemde activa en passiva inbrengt of overdraagt aan een door de MKB-ondernemer voor
      het drijven van die onderneming opgerichte rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.3:18.2.b
    text: |-
      de Bank met de onder a bedoelde rechtspersoon een overeenkomst sluit als gevolg waarvan die rechtspersoon bij de
      kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verleend de plaats inneemt van de
      MKB-ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.3:18.2.c
    text: |-
      de MKB-ondernemer zich naast de onder a bedoelde rechtspersoon hoofdelijk aansprakelijk stelt voor de nakoming door
      die rechtspersoon van de verplichtingen die voortvloeien uit de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.3:18.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder rechtspersoon mede begrepen twee of meer rechtspersonen,
      indien die rechtspersonen gezamenlijk voldoen aan de in het tweede lid genoemde voorwaarden en ieder van die
      rechtspersonen zich hoofdelijk aansprakelijk stelt voor de nakoming van de verplichtingen die voortvloeien uit de
      kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.3:19
    text: |-
      Indien overeenkomstig artikel 3, eerste lid, onderdeel b, een garantieprovisie is betaald met betrekking tot een
      kredietovereenkomst en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn
      toe te rekenen aan de kredietnemer of aan de Bank, wordt de provisie door de staat terugbetaald aan de Bank mits de
      Bank binnen een jaar na het sluiten van de kredietovereenkomst daartoe een verzoek aan de staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel19
  - number: B2.3:20.1
    text: |-
      De Bank betaalt de vanaf het moment van de indiening van een aanvraag als bedoeld in artikel 14 ontvangen
      opbrengsten die in mindering komen op het bodemsaneringsborgstellingskrediet binnen twee maanden na ontvangst aan
      de staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.3:20.2
    text: |-
      Voor zover de opbrengsten na de aanvang van de periode, bedoeld in artikel 12, eerste lid, ontvangen zijn
      en niet ontvangen zijn uit hoofde van de uitwinning van zekerheden, wordt de in het eerste lid bedoelde
      betalingsverplichting beperkt tot 80 procent van de ontvangen opbrengsten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.3:20.3
    text: |-
      De Bank zal de rekening, bedoeld in artikel 17, eerste lid, per de datum van verzending van de aanvraag, bedoeld
      in artikel 14, en binnen twee maanden na die datum, debiteren voor het bedrag waarvoor betaling wordt gevraagd,
      vermeerderd met een rente als bedoeld in artikel 17, tweede lid, over de periode die verstreken is sinds de dag
      waarop de vermindering, bedoeld in artikel 5, op grond van artikel 6 is geschorst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.3:20.4
    text: |-
      De Bank zal de rekening per de datum van de beslissing van de minister, bedoeld in artikel 15, tweede lid, en
      binnen twee maanden na die datum crediteren of debiteren voor respectievelijk het voor de staat positieve of
      negatieve verschil tussen het bedrag waarvoor de rekening ingevolge het derde lid is gedebiteerd en het bedrag
      waarop de minister de betaling vaststelde, vermeerderd met een over dat verschil te berekenen rente als bedoeld in
      artikel 17, tweede lid, over de periode die is verstreken sinds de creditering of debitering, bedoeld in het derde
      lid, en de vaststelling van de betaling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.3:21
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt
      dat de Bank zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om betaling een
      andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, of dat de Bank de
      betalingsverplichting bedoeld in artikel 20, eerste lid, niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.3:22.1
    text: |-
      De inwerkingtreding van een wijziging van het [Kaderbesluit EZ-subsidies][ref1] of [hoofdstuk 2][ref2] van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen leidt te zelfder tijd tot een gelijke wijziging
      van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.3:22.2
    text: Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.3:22.3
    text: |-
      Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door de minister en de Bank schriftelijk worden opgezegd
      met inachtneming van een opzegtermijn van drie hele kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.3:22.4
    text: |-
      In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien de Bank in strijd heeft gehandeld met het gestelde in de paragrafen 5, 6, 7 of 8 van deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.3:22.5
    text: |-
      In afwijking van het derde lid kan de Bank de overeenkomst met onmiddellijke ingang opzeggen binnen een termijn
      van een maand na publicatie in het Staatsblad van een wijziging van het [Kaderbesluit EZ-subsidies][ref1],
      publicatie in de Staatscourant van een wijziging van [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien
      en overdragen van ondernemingen of schriftelijke mededeling van de minister, inhoudende een wijziging van deze
      overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.3:22.6
    text: |-
      Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit EZ-subsidies][ref1] of door
      intrekking van [artikel 2.3, eerste lid, onderdeel b][ref2], van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.3:22.7
    text: |-
      Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien
      van bodemsaneringsborgstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging,
      opzegging, ontbinding of beëindiging overeenkomstig artikel 3 zijn gemeld en ten aanzien van
      bodemsaneringsborgstellingskredieten die zijn of zullen worden verstrekt uit hoofde van een kredietovereenkomst die
      is aangegaan voor de inwerkingtreding van de wijziging, opzegging, ontbinding of beëindiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.4:1
    text: |-
      In deze overeenkomst wordt verstaan onder: - *groep:* een economische eenheid, waarin organisatorisch zijn
      verbonden: 1°. een natuurlijke persoon of een privaatrechtelijke rechtspersoon die direct of indirect – meer
      dan de helft van het geplaatste kapitaal verschaft aan, – volledig aansprakelijk vennoot is van of – overwegende
      zeggenschap heeft over een of meer rechtspersonen of vennootschappen en 2°. laatstbedoelde rechtspersonen of
      vennootschappen;
        - *kredietovereenkomst:* een overeenkomst uit hoofde waarvan: 1°. de Bank aan een MKB-ondernemer geld ter leen
      verstrekt of zal verstrekken, of 2°. de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de
      Bank, of 3°. de Bank tegenover een derde, niet zijnde een rechtspersoon waarmee de Bank in een groep verbonden is
      onherroepelijk een verplichting is aangegaan om ten laste van de MKB-ondernemer aan de derde een of meer betalingen
      te doen, welke verplichting niet afhankelijk is van voorwaarden op de vervulling waarvan het handelen van de Bank
      van invloed is;
        - *krediet:* een bedrag dat de Bank uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;
        - *bodemsaneringsborgstellingskrediet:* een krediet of een deel van een krediet dat overeenkomstig artikel 3 is
      gemeld;
        - *saneringsplan:* plan als bedoeld in [artikel 39 van de Wet bodembescherming][ref1];
        - *saneringsbestek:* bestek gebaseerd op een saneringsplan, dat een gedetailleerde beschrijving omvat van de
      aard en de omvang van de uit te voeren sanering van de bodem met een nauwkeurige beschrijving van het te bereiken
      resultaat en waaruit de omvang van de saneringskosten kan worden afgeleid;
        - *uitwinning:* 1°. uitwinning door de Bank, naar normaal bankgebruik, van de door de MKB-ondernemer aan de
      Bank verstrekte zekerheden, 2°. onderhandse verkoop met toestemming van de Bank door de MKB-ondernemer van de
      vermogensbestanddelen van de MKB-ondernemer, inning van vorderingen daaronder begrepen, 3°. executoriale verkoop
      van de vermogensbestanddelen van de MKB-ondernemer, en 4°. indien het faillissement van de MKB-ondernemer
      is uitgesproken of aan hem surséance van betaling is verleend: onderhandse of executoriale verkoop van de
      vermogensbestanddelen van de MKB-ondernemer door of met medewerking van de curator of de bewindvoerder;
        - *MKB-ondernemer:* een ondernemer die een kleine onderneming of een middelgrote onderneming in stand houdt;
        - *kleine onderneming:* kleine onderneming in de zin van verordening (EG) nr. 800/ 2008 van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
        - *middelgrote onderneming:* een middelgrote onderneming in de zin van verordening (EG) nr. 800/ 2008 van de
      Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
        - *de-minimissteun:* steun van de overheid die voldoet aan de voorwaarden, vastgesteld in [verordening (EG) nr.
      1998/2006](32006R1998) van de Commissie van Europese Gemeenschappen van 15 december 2006 betreffende de toepassing
      van de artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379), [verordening (EG) nr. 1535/2007]
      (32007R1535) van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337) en [verordening
      (EG) nr. 875/2007](32007R0875) van de Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwsector en de visserijsector
      (PbEU L 193);
        - *Bank:* binnen het grondgebied van de Europese Unie gevestigde bank, niet zijnde een bank die tevens
      beleggingsonderneming is, die is toegelaten het bedrijf van bank uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '39'
  - number: B2.4:2
    text: |-
      De staat stelt zich borg ten behoeve van de Banken voor de terugbetaling van bodemsaneringsborgstellingskredieten
      die met inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen en deze overeenkomst door de Banken worden verstrekt. Deze
      borgstelling wordt aangegaan onder de navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.4:3.1
    text: |-
      De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan uitsluitend
      worden ingeroepen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.4:3.1.a
    text: |-
      indien het krediet of het deel ervan binnen 35 dagen na het sluiten van de kredietovereenkomst door de centrale
      Bank aan de minister is gemeld met gebruikmaking van een formulier, waarvan het model door de minister wordt
      vastgesteld,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.4:3.1.b
    text: |-
      indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde
      garantieprovisie door de centrale Bank aan de staat betaald is,


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.4:3.1.c
    text: |-
      voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of delen daarvan
      de door de minister op grond van [artikel 2.7, tweede lid][ref1], van de Subsidieregeling starten, groeien en
      overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde meldingslimiet niet is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.4:3.2
    text: De minister bevestigt de ontvangst van een meldingsformulier schriftelijk binnen 35 dagen na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.4:3.3
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onder c, is de volgorde van ontvangst van de meldingsformulieren
      door de minister bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.4:3.4
    text: |-
      De meldingen, bedoeld in het eerste lid onder a, worden gedaan met gebruikmaking van het origineel van een
      ondertekend formulier.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.4:4.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een bodemsaneringsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bodemsaneringsborgstellingskrediet het totaal van de
      bodemsaneringsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van
      een groep, per groep, een bedrag van € 1.500.000 niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.4:4.2
    text: |-
      Voor de toepassing van het eerste lid wordt een bodemsaneringsborgstellingskrediet dat is verstrekt aan een andere
      MKB-ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk
      is, geacht aan de MKB-ondernemer te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.4:4.3
    text: |-
      Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de krediet-
      overeenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verstrekt bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.4:4.4
    text: |-
      Voor de toepassing van het eerste lid worden bodemsaneringsborgstellingskredieten die op een eerder tijdstip
      overeenkomstig artikel 3 zijn gemeld slechts voor het met overeenkomstige toepassing van de artikelen 5 en 6
      berekende gedeelte van die bodemsaneringsborgstellingskredieten in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.4:5.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 4 in aanmerking te nemen
      bodemsaneringsborgstellingskrediet na verloop van ieder kalenderkwartaal met een zodanig vast bedrag verminderd,
      dat het bodemsaneringsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, doch uiterlijk na
      verloop van 18 jaar, nihil bedraagt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:5.2
    text: |-
      De Bank kan de vermindering, bedoeld in het eerste lid, gedurende een aaneengesloten periode van maximaal vier
      kalenderkwartalen opschorten indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:5.2.a
    text: |-
      de Bank voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing van het
      bodemsaneringsborgstellingskrediet, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:5.2.b
    text: |-
      de centrale Bank de opschorting meldt binnen 35 dagen na aanvang van de opschorting met gebruikmaking van een
      formulier, waarvan het model door de minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:5.3
    text: De opschorting van de vermindering vindt ten hoogste twee maal plaats.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:5.4
    text: |-
      Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:5.5
    text: |-
      De minister bevestigt de ontvangst van een formulier als bedoeld in het tweede lid, onder b, schriftelijk binnen 35
      dagen na de ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.4:6.1
    text: |-
      De vermindering van de borgstelling, bedoeld in artikel 5, wordt geschorst met ingang van de dag waartegen het
      bodemsaneringsborgstellingskrediet is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.4:6.2
    text: |-
      In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bodemsaneringsborgstellingskrediet door de Bank is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.4:6.3
    text: |-
      De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surséance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.4:7
    text: |-
      De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van een overeenkomstig artikel 14 ingediende aanvraag uit hoofde van het bodemsaneringsborgstellingskrediet
      of bodemsaneringsborgstellingskredieten pro resto verschuldigd is, doch ten hoogste 90 procent van de met
      toepassing van de artikelen 4, 5 en 6 berekende omvang van het bodemsaneringsborgstellingskrediet of de
      bodemsaneringsborgstellingskredieten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.4:8
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet aan
      een MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.a
    text: 'De Bank heeft de beschikking over de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.a.1°
    text: een schriftelijke verklaring van een ingenieur overeenkomstig het model dat door de minister wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.a.2°
    text: |-
      een afschrift van de beschikking van gedeputeerde staten als bedoeld in
      [artikel 29 van de Wet bodembescherming][ref1], waaruit blijkt dat het om een geval van ernstige verontreiniging
      gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '29'
  - number: B2.4:8.a.3°
    text: |-
      een afschrift van de beschikking van gedeputeerde staten als bedoeld in
      [artikel 39, tweede lid, eerste volzin, van de Wet bodembescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '39'
  - number: B2.4:8.b
    text: |-
      de MKB-ondernemer beschikt over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde
      wijze te drijven;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.c
    text: |-
      er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de Bank naar normaal bankgebruik het krediet niet
      geheel voor eigen rekening en risico kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.d
    text: |-
      het bodemsaneringsborgstellingskrediet bedraagt niet meer dan het tekort aan zekerheden dat bij de Bank ten tijde
      van het sluiten van de kredietovereenkomst bestaat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.e
    text: |-
      het bodemsaneringsborgstellingskrediet bedraagt niet meer dan de saneringskosten die in de schriftelijke verklaring
      als bedoeld in onderdeel a, ten 1°, zijn aangemerkt als kosten van de werkzaamheden die noodzakelijk zijn voor de
      sanering van de bodem;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.f
    text: de kredietovereenkomst is in schriftelijke vorm aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.g
    text: de rentabiliteits- en continuïteitsperspectieven van de onderneming zijn bevredigend;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.h
    text: |-
      het bodemsaneringsborgstellingskrediet is niet bestemd en wordt niet gebruikt voor de nakoming van verplichtingen
      van de MKB-ondernemer aan de Bank die het verstrekt, aan een andere Bank, of aan een rechtspersoon waarmee de Bank
      in een groep verbonden is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.i
    text: |-
      de MKB-ondernemer beschikt niet over een door een andere bank verstrekte kredietfaciliteit waarvoor de staat op
      grond van het [Kaderbesluit EZ-subsidies][ref1], het [Besluit borgstelling MKB-kredieten 1997][ref2], het Besluit
      borgstelling MKB-kredieten, de Regeling borgstelling MKB-kredieten 1988, de Kredietregeling midden- en kleinbedrijf
      1985, of de Kredietbeschikking midden- en kleinbedrijf 1976 borg staat anders dan een bijzondere hypothecaire
      geldlening als bedoeld in bijlage 4 van de kredietbeschikking midden- en kleinbedrijf 1976 of in hoofdstuk VI van
      de Kredietregeling midden- en kleinbedrijf 1985;


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.4:8.j
    text: |-
      de MKB-ondernemer, indien deze een natuurlijke persoon is, zal naar verwachting na een gebruikelijke aanloopperiode
      uit de inkomsten van zijn onderneming kunnen voorzien in zijn levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.k
    text: |-
      de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, heeft zich borg gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bodemsaneringsborgstellingskrediet is verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bodemsaneringsborgstellingskrediet met een minimum van € 15.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.l
    text: |-
      de Bank heeft in de door haar gesloten borgstellingsovereenkomsten met betrekking tot de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bodemsaneringsborgstellingskrediet is verleend een beding ten behoeve van de staat opgenomen, ertoe strekkende dat
      de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de staat en de
      Bank heeft geen bedingen opgenomen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.4:8.l.1°
    text: een borg er zich op zou kunnen beroepen dat de staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.l.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.4:8.m
    text: |-
      de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan € 200.000
      aan de-minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren.
      Indien de onderneming actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een
      bodemsaneringsborgstellingskrediet wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde
      deel van het krediet. Bij de bepaling of de verlening van de borgstelling niet leidt tot overschrijding van
      het desbetreffende maximum wordt rekening gehouden met de-minimissteun die in de referteperiode is verleend aan
      ondernemingen die deel uitmaken van dezelfde groep;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:8.n
    text: |-
      De Bank heeft er voor zorg gedragen dat: - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het
      staatsgegarandeerde deel van het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het niet meer bedraagt dan € 200.000 of, indien de onderneming actief is in het wegvervoer, meer
      bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde
      in aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun
      dat in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.4:9
    text: |-
      De Bank voldoet slechts aan de voor haar uit het bodemsaneringsborgstellingskrediet jegens de MKB-ondernemer
      voortvloeiende betalingsverplichtingen voor zover de MKB-ondernemer door het overleggen van facturen de
      verschuldigdheid van de kosten, die in de schriftelijke verklaring als bedoeld in artikel 8, onderdeel a, ten 1°,
      zijn aangemerkt als noodzakelijk voor de sanering van de bodem, heeft aangetoond.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.4:10.1
    text: |-
      De Banken voldoen aan hetgeen door door de minister aangewezen bij zijn ministerie werkzame personen
      wordt verzocht, voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering van het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen en deze overeenkomst, en voor zover het betrekking heeft op de uit het besluit en deze
      overeenkomst voortvloeiende zelfstandige verplichtingen van de Bank, op de MKB-ondernemer aan wie het
      bodemsaneringsborgstellingskrediet is verstrekt of op de met deze MKB-ondernemer gesloten kredietovereenkomsten
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.4:10.1.a
    text: het toegang verlenen tot door hen gebruikte plaatsen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.1.b
    text: het verlenen van inzage in zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.1.c
    text: het maken van kopieën van de onder b bedoelde gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.1.d
    text: het verlenen van medewerking aan het verstrekken van gegevens door anderen en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.1.e
    text: het verstrekken van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.2
    text: |-
      Alleen in daartoe aanleiding gevende gevallen zal aan de Bank gevraagd worden de in het eerste lid bedoelde
      inlichtingen ook door haar interne accountant te doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.3
    text: |-
      Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de Bank onjuiste of onvolledige informatie heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.4
    text: |-
      De centrale Bank stelt, met gebruikmaking van een formulier, waarvan het model door de minister wordt vastgesteld,
      de minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.4.a
    text: vervroegde volledige aflossing van het bodemsaneringsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.4.b
    text: het door de afdeling ..... van de Bank in beheer nemen van het bodemsaneringsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.4.c
    text: de verlening van surséance van betaling aan of de faillietverklaring van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.4.d
    text: opeising van het bodemsaneringsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.5
    text: |-
      Na afsluiting van ieder boekjaar zendt de centrale Bank voor 1 februari van het daaropvolgende jaar, met
      gebruikmaking van een formulier, waarvan het model door de minister wordt vastgesteld, aan de minister een opgave
      van de omvang van de borgstelling aan het einde van het boekjaar voor alle bodemsaneringsborgstellingskredieten
      te zamen, waarvoor de centrale Bank nog geen verzoek om betaling als bedoeld in artikel 14 heeft ingediend. Deze
      omvang dient te worden berekend met toepassing van paragraaf 4.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.6
    text: |-
      Binnen zes maanden na afsluiting van ieder boekjaar zendt de centrale Bank, met gebruikmaking van een formulier,
      waarvan het model door de minister wordt vastgesteld aan de minister een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] waaruit blijkt van de juistheid en
      volledigheid van de in het vijfde lid bedoelde opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: B2.4:10.7
    text: |-
      Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet wordt
      verstrekt en tijdens de uitwinning zal de Bank waken over de belangen van de staat als borg.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.8
    text: |-
      De Bank zal tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet
      is verleend in de door haar te sluiten overeenkomsten met allen, niet zijnde de staat, die zich borg willen stellen
      voor de nakoming door de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde
      waarvan het bodemsaneringsborgstellingskrediet is verleend een beding ten behoeve van de staat opnemen, ertoe
      strekkende dat de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de
      staat en de Bank zal geen bedingen opnemen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.4:10.8.1°
    text: een borg er zich op zou kunnen beroepen dat de staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.8.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.4:10.9
    text: |-
      De Bank draagt er zorg voor dat de relaties tussen haar en de bij haar onderneming betrokkenen enerzijds, en de
      ondernemer aan wie een bodemsaneringsborgstellingskrediet is verstrekt anderzijds transparant zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:10.10
    text: |-
      De Bank meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van betaling aan
      de Bank, dan wel een verzoek tot faillietverklaring van de Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.4:11.1
    text: |-
      Indien een aanvraag om betaling als bedoeld in artikel 14 is ingediend op een moment, waarop de uitwinning nog niet
      is voltooid en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bodemsaneringsborgstellingskrediet, brengt de centrale Bank de minister ten minste jaarlijks verslag uit
      over de voortgang van de uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.4:11.2
    text: |-
      De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nadere gegevens van de
      Banken verlangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.4:12.1
    text: |-
      Gedurende een periode van vijf jaar na de datum waarop een verzoek om betaling als bedoeld in artikel 14 is
      ingediend of, indien een verzoek om betaling is ingediend op een moment waarop de uitwinning nog niet is voltooid
      en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen op het
      bodemsaneringsborgstellingskrediet, na de datum waarop de centrale Bank de minister heeft bericht dat de uitwinning
      is voltooid of dat aannemelijk is dat geen opbrengsten meer zijn te verwachten die in mindering komen op het
      bodsemsaneringsborgstellingskrediet, is de Bank gehouden die pogingen in het werk te stellen om namens de staat
      het door de staat betaalde bedrag in te vorderen, die de Bank in het werk zou hebben gesteld indien het krediet
      voor eigen rekening en risico door de Bank zou zijn verstrekt. De staat machtigt met het oog hierop de Bank tot
      invordering bij de kredietnemer van de door deze aan de staat verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.4:12.2
    text: |-
      De centrale Bank zendt binnen drie maanden na afloop van de in het eerste lid bedoelde periode de minister een
      overzicht van de door haar of door de Bank ondernomen activiteiten, met gebruikmaking van een formulier, waarvan
      het model door de minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.4:13.1
    text: |-
      De Bank treft geen schuldregeling die inhoudt of mede inhoudt een gehele of gedeeltelijke
      kwijtschelding van verplichtingen voortvloeiende uit een kredietovereenkomst, uit hoofde waarvan een
      bodemsaneringsborgstellingskrediet is verstrekt, zonder voorafgaande schriftelijke toestemming van de minister. De
      minister kan aan zijn toestemming voorwaarden verbinden ten aanzien van de inhoud van een dergelijke regeling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.4:13.2
    text: |-
      Een verzoek om toestemming als bedoeld in het eerste lid dient door de centrale Bank schriftelijk bij de minister
      te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.4:13.3
    text: De minister beslist zo spoedig mogelijk op een verzoek om toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.4:14.1
    text: |-
      De centrale Bank dient zo spoedig mogelijk na de voltooiing van de uitwinning of, indien dit eerder is, zo
      spoedig mogelijk nadat aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bodemsaneringsborgstellingskrediet, doch in ieder geval binnen negen maanden na de datum waartegen het
      bodemsaneringsborgstellingskrediet is opgeëist of, indien dit eerder is, na de datum van het faillissement, een
      aanvraag in om betaling uit hoofde van de bodemsaneringsborgstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.4:14.2
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, waarvan het model door de minister wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.4:15.1
    text: De minister bevestigt de ontvangst van een aanvraag om betaling schriftelijk binnen 35 dagen na de ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.4:15.2
    text: |-
      De minister deelt zijn beslissing op de aanvraag binnen negen maanden na de bevestiging van de ontvangst
      schriftelijk aan de centrale Bank mede.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.4:16.1
    text: |-
      De minister stelt het uit hoofde van deze overeenkomst door de staat verschuldigde bedrag vast overeenkomstig het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen van
      ondernemingen en deze overeenkomst, met uitzondering van het bepaalde in artikel 10, vierde, vijfde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.4:16.2
    text: 'De minister kan in ieder geval afwijzend beslissen op een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.4:16.2.a
    text: indien niet voldaan is aan een verzoek als bedoeld in artikel 10, eerste lid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.4:16.2.b
    text: |-
      indien de Bank of de centrale Bank in het kader van de aanvraag gegevens heeft verstrekt, waarvan zij wist of
      behoorde te weten dat deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste
      beslissing op de aanvraag zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.4:17.1
    text: |-
      Betalingen door de staat aan de Bank en door de Bank aan de staat geschieden door debitering respectievelijk
      creditering door de centrale Bank van een rekening die de centrale Bank zal aanhouden ten name van het Ministerie
      van Economische Zaken, met vermelding van 'bodemsaneringsverliesdeclaraties'.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.4:17.2
    text: |-
      Over het debet- of creditsaldo van de rekening zal een rente berekend worden gelijk aan de in Het Financieele
      Dagblad gepubliceerde basisrente.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.4:18.1
    text: |-
      De verplichtingen van de staat uit hoofde van deze overeenkomst met betrekking tot een
      bodemsaneringsborgstellingskrediet vervallen door schuldvernieuwing, door schuldoverneming en – voor
      het gedeelte waarin subrogatie plaatsvindt – door subrogatie van derden in de rechten van de Bank met
      betrekking tot het bodemsaneringsborgstellingskrediet, al dan niet voorafgegaan door verpanding van het
      bodemsaneringsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.4:18.2
    text: |-
      In afwijking van het eerste lid blijven de verplichtingen van de staat met betrekking tot een
      bodemsaneringsborgstellingskrediet van kracht, indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.4:18.2.a
    text: |-
      de MKB-ondernemer aan wie het bodemsaneringsborgstellingskrediet is verstrekt de onderneming en alle voor het
      drijven van de onderneming bestemde activa en passiva inbrengt of overdraagt aan een door de MKB-ondernemer voor
      het drijven van die onderneming opgerichte rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.4:18.2.b
    text: |-
      de Bank met de onder a bedoelde rechtspersoon een overeenkomst sluit als gevolg waarvan die rechtspersoon bij de
      kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verleend de plaats inneemt van de
      MKB-ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.4:18.2.c
    text: |-
      de MKB-ondernemer zich naast de onder a bedoelde rechtspersoon hoofdelijk aansprakelijk stelt voor de nakoming door
      die rechtspersoon van de verplichtingen die voortvloeien uit de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.4:18.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder rechtspersoon mede begrepen twee of meer rechtspersonen,
      indien die rechtspersonen gezamenlijk voldoen aan de in het tweede lid genoemde voorwaarden en ieder van die
      rechtspersonen zich hoofdelijk aansprakelijk stelt voor de nakoming van de verplichtingen die voortvloeien uit de
      kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.4:19
    text: |-
      Indien overeenkomstig artikel 3, eerste lid, onderdeel b, een garantieprovisie is betaald met betrekking tot een
      kredietovereenkomst en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn
      toe te rekenen aan de kredietnemer of aan de Bank, wordt de provisie door de staat terugbetaald aan de Bank mits de
      Bank binnen een jaar na het sluiten van de kredietovereenkomst daartoe een verzoek aan de staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel19
  - number: B2.4:20.1
    text: |-
      De centrale Bank betaalt de vanaf het moment van de indiening van een aanvraag als bedoeld in artikel 14 ontvangen
      opbrengsten die in mindering komen op het bodemsaneringsborgstellingskrediet binnen twee maanden na ontvangst aan
      de staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.4:20.2
    text: |-
      Voor zover de opbrengsten na de aanvang van de periode, bedoeld in artikel 12, eerste lid, ontvangen zijn
      en niet ontvangen zijn uit hoofde van de uitwinning van zekerheden, wordt de in het eerste lid bedoelde
      betalingsverplichting beperkt tot 80 procent van de ontvangen opbrengsten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.4:20.3
    text: |-
      De centrale Bank zal de rekening, bedoeld in artikel 17, eerste lid, per de datum van verzending van de aanvraag,
      bedoeld in artikel 14, en binnen twee maanden na die datum, debiteren voor het bedrag waarvoor betaling wordt
      gevraagd, vermeerderd met een rente als bedoeld in artikel 17, tweede lid, over de periode die verstreken is sinds
      de dag waarop de vermindering, bedoeld in artikel 5, op grond van artikel 6 is geschorst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.4:20.4
    text: |-
      De centrale Bank zal de rekening per de datum van de beslissing van de minister, bedoeld in artikel 15, tweede
      lid, en binnen twee maanden na die datum crediteren of debiteren voor respectievelijk het voor de staat positieve
      of negatieve verschil tussen het bedrag waarvoor de rekening ingevolge het derde lid is gedebiteerd en het bedrag
      waarop de minister de betaling vaststelde, vermeerderd met een over dat verschil te berekenen rente als bedoeld in
      artikel 17, tweede lid, over de periode die is verstreken sinds de creditering of debitering, bedoeld in het derde
      lid, en de vaststelling van de betaling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.4:21
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt dat
      de Bank of de centrale Bank zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om
      betaling een andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, of dat
      de centrale Bank de betalingsverplichting, bedoeld in artikel 20, eerste lid, niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.4:22.1
    text: |-
      De inwerkingtreding van een wijziging van het [Kaderbesluit EZ-subsidies][ref1] of [hoofdstuk 2][ref2] van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen leidt te zelfder tijd tot een gelijke wijziging
      van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.4:22.2
    text: Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de centrale Bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.4:22.3
    text: |-
      Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door de minister en de Banken schriftelijk worden
      opgezegd met inachtneming van een opzegtermijn van drie hele kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.4:22.4
    text: |-
      In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien de Bank of de centrale Bank in strijd heeft gehandeld met het gestelde in de paragrafen 5, 6, 7 of 8 van
      deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.4:22.5
    text: |-
      In afwijking van het derde lid kunnen de Banken de overeenkomst met onmiddellijke ingang opzeggen binnen een
      termijn van een maand na publicatie in het Staatsblad van een wijziging van het [Kaderbesluit EZ-subsidies][ref1],
      publicatie in de Staatscourant van een wijziging van de Subsidieregeling starten, groeien en overdragen van
      ondernemingen of schriftelijke mededeling van de minister, inhoudende een wijziging van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024796
  - number: B2.4:22.6
    text: |-
      Opzegging door de Banken als bedoeld in het derde en vijfde lid is uitsluitend mogelijk indien dit geschiedt door
      alle Banken gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.4:22.7
    text: |-
      Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit EZ-subsidies][ref1] of door
      intrekking van [artikel 2.3, eerste lid, onderdeel b][ref2], van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.4:22.8
    text: |-
      Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien
      van bodemsaneringsborgstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging,
      opzegging, ontbinding of beëindiging overeenkomstig artikel 3 zijn gemeld en ten aanzien van
      bodemsaneringsborgstellingskredieten die zijn of zullen worden verstrekt uit hoofde van een kredietovereenkomst die
      is aangegaan voor de inwerkingtreding van de wijziging, opzegging, ontbinding of beëindiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.5:1.1
    text: |-
      De begrippen die in het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen zijn gedefinieerd hebben in deze overeenkomst de in deze regelingen gegeven
      betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.5:1.2
    text: 'Voorts wordt in deze overeenkomst verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.a
    text: 'financieringsfaciliteit: krediet of een deel van een krediet waarvoor de Staat niet borg of garant staat:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.a.1°
    text: |-
      op grond van het [Kaderbesluit EZ-subsidies][ref1], het [Besluit borgstelling MKB-kredieten 1997][ref2], het
      Besluit borgstelling MKB-kredieten, dan wel de [Regeling LNV-subsidies][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
      [ref3]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
      - id: ref3
        bwb_id: BWBR0021281
  - number: B2.5:1.2.a.2°
    text: vanwege de overname van de verplichtingen van Stichting Borgstellingsfonds voor de Landbouw;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.b
    text: |-
      kredietverstrekker-gelieerde: een rechtspersoon waaraan de kredietverstrekker direct of indirect meer dan de helft
      van het geplaatste kapitaal verschaft of voor het handelen waarvan de kredietverstrekker volledig aansprakelijk is,
      en die als kredietverstrekker-gelieerde is vermeld in artikel 25 van deze overeenkomst;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.c
    text: |-
      bedrijfsborgstellingskrediet: krediet of een deel van een krediet dat overeenkomstig artikel 6 is getoetst en
      gemeld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.d
    text: |-
      de-minimissteun: steun van de overheid die voldoet aan de voorwaarden, vastgesteld in verordening (EG) nr.
      1998/2006 van de Commissie van Europese Gemeenschappen van 15 december 2006 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379), verordening (EG) nr. 1535/2007 van de Commissie
      van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de artikelen 87 en 88 van het
      Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337) of verordening (EG) nr. 875/2007 van de
      Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de toepassing van de artikelen 87 en 88 van
      het Verdrag op de-minimissteun in de landbouwsector en de visserijsector (PbEU L 193);
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.e
    text: 'groep: een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.e.1°
    text: |-
      een natuurlijke persoon of een privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van
      het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van, of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.e.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.f
    text: |-
      innovatieve MKB-ondernemer: een MKB-ondernemer ten aanzien waarvan de kredietverstrekker beschikt
      over een gewaarmerkte kopie van een verklaring als bedoeld in [artikel 23, eerste lid][ref1], of
      [artikel 27, eerste lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref2]
      en waarvan het origineel ten hoogste zestien maanden voor de datum waarop de kredietovereenkomst is gesloten is
      afgegeven, of een MKB-ondernemer ten aanzien waarvan de kredietverstrekker beschikt over een advies van de minister
      waaruit blijkt dat de MKB-ondernemer is aan te merken als een innovatieve MKB-ondernemer;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '27'
  - number: B2.5:1.2.g
    text: 'krediet: bedrag dat de kredietverstrekker uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.h
    text: 'kredietovereenkomst: overeenkomst uit hoofde waarvan:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.h.1°
    text: de kredietverstrekker aan een MKB-ondernemer geld ter leen verstrekt of zal verstrekken, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.h.2°
    text: de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de kredietverstrekker, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.h.3°
    text: |-
      de kredietverstrekker tegenover een derde, niet zijnde een rechtspersoon waarmee de kredietverstrekker in een groep
      verbonden is of een kredietverstrekker-gelieerde, onherroepelijk een verplichting is aangegaan om ten laste van de
      MKB-ondernemer aan de derde een of meer betalingen te doen, welke verplichting niet afhankelijk is van voorwaarden
      op de vervulling waarvan het handelen van de kredietverstrekker van invloed is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.i
    text: 'minister: de Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.j
    text: 'starter:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.j.1°
    text: een MKB-ondernemer, die een natuurlijk persoon is en die niet langer dan drie jaar een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.j.2°
    text: |-
      een vennootschap met een in aandelen verdeeld kapitaal, tevens MKB-ondernemer, waarvan de bestuurder een natuurlijk
      persoon is die ten tijde van het sluiten van de kredietovereenkomst direct of indirect de meerderheid van het
      geplaatst en gestort kapitaal houdt en deze meerderheid niet langer dan drie jaar houdt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.k
    text: 'starters-borgstellingskrediet: bedrijfsborgstellingskrediet dat uitsluitend wordt verstrekt aan een starter;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.l
    text: 'uitwinning:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.l.1°
    text: |-
      uitwinning door de kredietverstrekker van de door de MKB-ondernemer aan de kredietverstrekker verstrekte
      zekerheden, zoals een redelijk handelend en bekwaam financier in het kader van een actief en winstgericht beleid
      zou hebben gedaan zonder borgstelling;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.l.2°
    text: |-
      onderhandse verkoop met toestemming van de kredietverstrekker door de MKB-ondernemer van de vermogensbestanddelen
      van de MKB-ondernemer, inning van vorderingen daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.l.3°
    text: executoriale verkoop van de vermogensbestanddelen van de MKB-ondernemer; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:1.2.l.4°
    text: |-
      indien het faillissement van de MKB-ondernemer is uitgesproken of aan hem surseance van betaling is verleend de
      onderhandse of executoriale verkoop van de vermogensbestanddelen van de MKB-ondernemer door of met medewerking van
      de curator of de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B2.5:2
    text: |-
      De Staat stelt zich borg ten behoeve van de kredietverstrekker voor de terugbetaling van
      bedrijfsborgstellingskredieten die met inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en
      [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen van ondernemingen en deze overeenkomst
      door de kredietverstrekker worden verstrekt, met dien verstande dat deze borgstelling wordt aangegaan onder de
      navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.5:3.1
    text: |-
      De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan uitsluitend
      worden ingeroepen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.a
    text: indien het krediet is getoetst en gemeld overeenkomstig artikel 6;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.b
    text: |-
      indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde provisie
      door de kredietverstrekker aan de Staat is betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.5:3.1.c
    text: |-
      indien en voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of
      delen daarvan de door de minister op grond van [artikel 2.7, derde lid][ref1], van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde subsidieplafond niet is
      overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.5:3.1.d
    text: |-
      indien de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, zich borg heeft gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bedrijfsborgstellingskrediet wordt verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bedrijfsborgstellingskrediet met een minimum van € 5.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.e
    text: |-
      indien het bedrijfsborgstellingskrediet niet is bestemd en niet wordt gebruikt voor buitenlandse investeringen in
      distributiekanalen in verband met werkzaamheden op het gebied van uitvoer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.f
    text: |-
      indien het bedrijfsborgstellingskrediet niet meer bedraagt dan het tekort aan zekerheden dat bij de
      kredietverstrekker ten tijde van het sluiten van de kredietovereenkomst bestaat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.g
    text: indien de kredietovereenkomst in schriftelijke vorm is aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.h
    text: |-
      indien de kredietverstrekker in de kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet wordt
      verstrekt een verplichting voor de MKB-ondernemer is opgenomen om alle medewerking te verlenen aan het uitoefenen
      door de Staat van de in artikel 20, eerste lid, genoemde bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.i
    text: |-
      indien de kredietverstrekker in de door haar gesloten borgstellingsovereenkomst met betrekking tot de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de uit hoofde waarvan het bedrijfsborgstellingskrediet
      is verleend een beding ten behoeve van de Staat heeft opgenomen, ertoe strekkende dat de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet geldt ten opzichte van de Staat en de kredietverstrekker geen
      bedingen heeft opgenomen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.5:3.1.i.1°
    text: een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.i.2°
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.5:3.1.j
    text: |-
      indien door de kredietverstrekker gelijktijdig met het sluiten van de kredietovereenkomst, uit hoofde waarvan een
      bedrijfsborgstellingskrediet aan de MKB-ondernemer wordt verstrekt, met de MKB-ondernemer een kredietovereenkomst
      is gesloten uit hoofde waarvan de MKB-ondernemer over een financieringsfaciliteit beschikt, die niet bestemd is
      en niet gebruikt wordt voor de aflossing van financieringsfaciliteiten waarover de MKB-ondernemer beschikt bij de
      kredietverstrekker of een kredietverstrekker-gelieerde of aan een rechtspersoon waarmee de kredietverstrekker in
      een groep verbonden is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.k
    text: |-
      indien de financieringsfaciliteit, bedoeld in het eerste lid, onderdeel j, ten minste 100 procent bedraagt van het
      bedrijfsborgstellingskrediet, of,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.k.1°
    text: |-
      ten minste 33,3 procent bedraagt van het bedrijfsborgstellingskrediet, indien het bedrijfsborgstellingskrediet
      wordt verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking starter was, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.k.2°
    text: |-
      ten minste 50 procent bedraagt van het bedrijfsborgstellingskrediet indien het bedrijfsborgstellingskrediet wordt
      verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking innovatieve MKB-ondernemer was;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.1.l
    text: |-
      indien de looptijd van de onder k bedoelde financieringsfaciliteit ten minste even lang is als de looptijd van het
      bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:3.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel k, worden mede in aanmerking genomen de bedragen die een
      kredietverstrekker-gelieerde gelijktijdig met de gesloten kredietovereenkomst aan de MKB-ondernemer worden
      verstrekt, indien de zekerheden van de kredietverstrekker-gelieerde ter zake van die bedragen mede strekken tot
      zekerheid van de kredietverstrekker.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B2.5:4.1
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.1.a
    text: 'de MKB-ondernemer:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.1.a.1°
    text: beschikt over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde wijze te drijven;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.1.a.2°
    text: is in Nederland gevestigd en voert daar een substantieel deel van de activiteiten van de onderneming uit;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.1.a.3°
    text: |-
      is geen aanbieder als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1], noch
      oefent hij het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder uit;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: B2.5:4.1.a.4°
    text: |-
      houdt geen onderneming in stand waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien de
      onderneming nog geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit: - de beoefening van de land- of de tuinbouw, de vee- of visteelt, de visserij of de teelt van vee-
      of visvoer,
        - de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of
        - het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.1.a.5°
    text: |-
      beschikt naast het bedrijfsborgstellingskrediet niet over een lening waarvoor de Staat uit hoofde van de
      [Regeling LNV-subsidies][ref1] of door overname van de verplichtingen van de Stichting Borgstellingsfonds voor de
      landbouw borg of garant staat;


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: B2.5:4.1.a.6°
    text: |-
      beschikt niet over een door een andere kredietverstrekker of bank verstrekte kredietfaciliteit, waarvoor de Staat
      op grond van het [Kaderbesluit EZ-subsidies][ref1], het [Besluit borgstelling MKB-kredieten 1997][ref2] of het
      Besluit borgstelling MKB-kredieten borg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.5:4.1.b
    text: |-
      er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de kredietverstrekker, oordelend zoals een
      redelijk handelend en bekwaam financier in het kader van een actief en winstgericht beleid zou hebben gedaan zonder
      borgstelling, het krediet niet geheel voor eigen rekening en risico kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.1.c
    text: de rentabiliteits- en continuïteitsperspectieven van de onderneming zijn bevredigend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:4.2
    text: |-
      Het eerste lid, onderdeel a, onder 4, eerste gedachtenstreepje, is niet van toepassing op een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B2.5:5.1
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet voorts aan de volgende criteria zijn voldaan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.5:5.1.a
    text: |-
      de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan € 200.000 aan de-
      minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren. Indien de onderneming
      actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een bedrijfsborgstellingskrediet
      wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde deel van het krediet. Bij de bepaling
      of de verlening van de borgstelling niet leidt tot overschrijding van het desbetreffende maximum wordt rekening
      gehouden met de-minimissteun die is verleend aan ondernemingen die deel uitmaken van dezelfde groep;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.5:5.1.b
    text: |-
      De kredietverstrekker heeft er voor zorg gedragen dat: - zij de MKB-ondernemer in kennis heeft gesteld dat hij
      ingevolge de verstrekking van het bedrijfsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13%
      van het staatsgegarandeerde deel van het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming actief
      is in het wegvervoer, niet meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde in
      aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun dat
      in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.5:5.2
    text: |-
      Dit artikel is niet van toepassing op een kredietovereenkomst die wordt gesloten met een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint-Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B2.5:6.1
    text: |-
      De kredietverstrekker stelt de Staat in kennis van een voorgenomen verstrekking van een krediet onder gelijktijdige
      verstrekking van de door de minister vastgestelde informatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.5:6.2
    text: |-
      Indien de voorgenomen verstrekking van het krediet naar het oordeel van de Staat voldoet aan de in artikel
      3, eerste lid, onderdeel d tot en met n, en tweede lid, bedoelde voorwaarden, wordt de borgstelling voor dit
      krediet verleend op grond van deze overeenkomst. De Staat bericht de kredietverstrekker hierover binnen drie
      weken na ontvangst van de aanmelding, bedoeld in het eerste lid, onder vermelding van de omvang en looptijd van
      de borgstelling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.5:6.3
    text: |-
      De borgstelling wordt verleend onder de voorwaarde dat de kredietverstrekker een melding doet overeenkomstig
      het vijfde lid, de provisie bedoeld in artikel 3, eerste lid, onderdeel b, heeft betaald en de som van de
      in een kalenderjaar gemelde kredieten of delen daarvan niet hoger zijn dan de door de minister op grond van
      [artikel 2.7, derde lid][ref1], van de Subsidieregeling starten, groeien en overdragen van ondernemingen met
      betrekking tot dat kalenderjaar vastgestelde subsidieplafond.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.5:6.4
    text: |-
      Indien het naar het oordeel van de Staat niet noodzakelijk wordt geacht dat de kredietverstrekker de Staat in
      kennis stelt van voorgenomen kredietvertrekkingen overeenkomstig het eerste lid, geldt de procedure van het vijfde
      lid. De Staat bericht de kredietverstrekker hierover.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.5:6.5
    text: |-
      De kredietverstrekker meldt het krediet of het deel van het krediet waarop deze bedrijfsborgstellingsovereenkomst
      van toepassing is binnen 35 dagen na het sluiten van de kredietovereenkomst aan de Staat onder de gelijktijdige
      verstrekking van de door de minister vastgestelde informatie. De Staat bevestigt de ontvangst van een melding
      binnen 35 dagen na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.5:6.6
    text: |-
      Voor de toepassing van artikel 3, eerste lid, aanhef en onder c, is de volgorde van ontvangst door de Staat van de
      meldingen, bedoeld in het vijfde lid, bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B2.5:7.1
    text: 'Het tarief van de provisie bedraagt eenmalig:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:7.1.a
    text: |-
      3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van niet
      langer dan twee jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:7.1.b
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan twee jaar, maar niet langer dan vier jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:7.1.c
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan vier jaar, maar niet langer dan zes jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:7.1.d
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan zes jaar, maar niet langer dan negen jaar en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:7.1.e
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan negen jaar, maar niet langer dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:7.2
    text: |-
      Indien overeenkomstig artikel 3, onderdeel b, een provisie is betaald met betrekking tot een kredietovereenkomst
      en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn toe te rekenen aan de
      kredietnemer of aan de kredietverstrekker, wordt de provisie door de Staat terugbetaald aan de kredietverstrekker
      mits de kredietverstrekker binnen een jaar na het sluiten van de kredietovereenkomst daartoe een verzoek aan de
      Staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B2.5:8.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een bedrijfsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bedrijfsborgstellingskrediet het totaal van de
      bedrijfsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een
      groep, per groep een bedrag van € 1.000.000 niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.5:8.2
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt een starters-borgstellingskrediet slechts in aanmerking
      genomen voor zover door de verstrekking van dit krediet het totaal van de starters-borgstellingskredieten, berekend
      per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een groep, per groep een bedrag van € 200.000
      niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.5:8.3
    text: |-
      Voor de toepassing van het eerste lid wordt een bedrijfsborgstellingskrediet dat is verstrekt aan een andere MKB-
      ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk is,
      geacht aan de MKB-ondernemer te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.5:8.4
    text: |-
      Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.5:8.5
    text: 'Voor de toepassing van het eerste lid worden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.5:8.5.a
    text: |-
      bedrijfsborgstellingskredieten die op een eerder tijdstip overeenkomstig artikel 6 zijn gemeld, slechts voor het
      met overeenkomstige toepassing van de artikelen 9 en 10 berekende gedeelte van die bedrijfsborgstellingskredieten
      in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B2.5:8.5.b
    text: |-
      kredieten, voor zover de Staat daarvoor op grond van het [Kaderbesluit EZ-subsidies][ref1], het Besluit
      borgstelling MKB-kredieten, of het [Besluit borgstelling MKB-kredieten 1997][ref2] nog borg staat, als
      bedrijfsborgstellingskredieten in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.5:9.1
    text: |-
      Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 8 in aanmerking te nemen
      bedrijfsborgstellingskrediet na verloop van ieder kalenderkwartaal verminderd met een zodanig vast bedrag, dat het
      bedrijfsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, maar uiterlijk na verloop van 6
      jaar, nihil bedraagt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.2
    text: |-
      Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van ten
      hoogste twaalf jaar indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.2.a
    text: |-
      het bedrijfsborgstellingskrediet uitsluitend is bestemd voor de betaling van de kosten van de stichting, van de
      aankoop of van de verbouwing van een onroerende zaak,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.2.b
    text: |-
      deze onroerende zaak voor ten minste de helft bestemd is te worden gebruikt voor de onderneming van de MKB-
      ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.2.c
    text: |-
      de kredietverstrekker met betrekking tot de onder a bedoelde kosten financieringsfaciliteiten verstrekt die een
      bedrag van ten minste 100 procent van de in onderdeel a bedoelde kosten belopen, dan wel, indien sprake is van een
      starters-borgstellingskrediet, 33,3 procent van dit bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.3
    text: |-
      Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van ten
      hoogste twaalf jaar indien het bedrijfsborgstellingskrediet is verstrekt aan een innovatieve MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.4
    text: |-
      Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.5
    text: |-
      Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt aan een
      innovatieve MKB-ondernemer, het eerste kalenderkwartaal waarin vermindering plaatsvindt uiterlijk aanvangt op de
      eerste dag van het veertiende kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst
      is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.6
    text: |-
      Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt voor de
      betaling van de kosten van de stichting of verbouwing van een onroerende zaak, het eerste kalenderkwartaal waarin
      vermindering plaatsvindt uiterlijk aanvangt op de eerste dag van het zesde kalenderkwartaal dat volgt op het
      kalenderkwartaal waarin de kredietovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.7
    text: |-
      De kredietverstrekker kan de vermindering, bedoeld in het eerste lid, gedurende een periode van ten minste een
      kalenderkwartaal opschorten indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.7.a
    text: |-
      de kredietverstrekker voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing
      van het bedrijfsborgstellingskrediet,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.7.b
    text: |-
      de kredietverstrekker uitstel verleent van de verplichting tot aflossing van alle financieringsfaciliteiten
      gedurende de duur van de opschorting, dan wel uitstel verleent van de verplichting tot aflossing van een gedeelte
      van de financieringsfaciliteiten, waarbij de som van de aflossingsbedragen ten minste even groot is als de som
      van de aflossingsbedragen waarvoor de kredietverstrekker uitstel verleent als bedoeld onder a, of, indien het
      bedrijfsborgstellingskrediet is verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.7.b.1°
    text: |-
      een MKB-ondernemer die ten tijde van de verstrekking starter was, ten minste 33,3 procent bedraagt van de som van
      de aflossingsbedragen waarvoor de kredietverstrekker uitstel verleent als bedoeld onder a, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.7.b.2°
    text: |-
      een MKB-ondernemer die ten tijde van de verstrekking innovatief MKB-ondernemer was, ten minste 50 procent bedraagt
      van de som van de aflossingsbedragen waarvoor de kredietverstrekker uitstel verleent als bedoeld onder a, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.7.c
    text: |-
      de kredietverstrekker de opschorting meldt binnen 35 dagen na aanvang van de opschorting onder gelijktijdige
      verstrekking van de door de minister vastgestelde informatie. De minister bevestigt de melding binnen 35 dagen
      na ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.8
    text: |-
      De in het zevende lid bedoelde opschorting van de vermindering vindt ten hoogste voor een totaal van acht
      kalenderkwartalen plaats. De opschorting van de vermindering vindt ten hoogste voor een totaal van twaalf
      kalenderkwartalen plaats indien het bedrijfsborgstellingskrediet is verstrekt aan een starter.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.9
    text: |-
      Indien een bedrijfsborgstellingskrediet wordt aangewend voor herfinanciering van een bedrijfsborgstellingskrediet,
      dat eerder is gebruikt voor de in het tweede lid, onder a en b genoemde doelen, en tevens is voldaan aan het tweede
      lid, onder b en c, is de nieuwe periode ten hoogste gelijk aan de periode waarvoor het bedrijfsborgstellingskrediet
      nog zou hebben gelopen zonder herfinanciering, indien en voor zover deze restperiode meer bedraagt dan zes jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B2.5:9.10
    text: |-
      Voor de toepassing van het zesde lid wordt onder een onroerende zaak mede begrepen
      schepen en vliegtuigen, voor zover deze zijn ingeschreven in de registers als bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Kadasterwet][ref1], alsmede ieder goederenrechtelijk recht dat omvat
      het uitsluitend gebruik van een onroerende zaak, met inbegrip van bovenbedoelde schepen en vliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
  - number: B2.5:10.1
    text: |-
      De vermindering van de borgstelling, bedoeld in artikel 9, wordt geschorst met ingang van de dag waarop het
      bedrijfsborgstellingskrediet is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.5:10.2
    text: |-
      In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bedrijfsborgstellingskrediet door de kredietverstrekker is opgeëist.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.5:10.3
    text: |-
      De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B2.5:11.1
    text: |-
      De kredietverstrekker dient zo spoedig mogelijk na de voltooiing van de uitwinning of, indien dit eerder is,
      zo spoedig mogelijk nadat aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering
      komen op het bedrijfsborgstellingskrediet, maar in ieder geval binnen negen maanden na de datum waartegen het
      bedrijfsborgstellingskrediet is opgeëist of, indien dit eerder is, na de datum van het faillissement, een verzoek
      in om betaling uit hoofde van de bedrijfsborgstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.5:11.2
    text: Het verzoek wordt ingediend onder gelijktijdige verstrekking van de door de minister vastgestelde informatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.5:11.3
    text: |-
      De minister bevestigt de ontvangst van het verzoek om betaling binnen 35 dagen na de ontvangst en reageert op het
      verzoek binnen negen maanden na de bevestiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B2.5:12.1
    text: |-
      De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van het overeenkomstig artikel 11 ingediende verzoek uit hoofde van het bedrijfsborgstellingskrediet of de
      bedrijfsborgstellingskredieten pro resto verschuldigd is, doch
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.1.a
    text: |-
      ten hoogste 90 procent van de met toepassing van de artikelen 8, 9 en 10 berekende omvang van het
      bedrijfsborgstellingskrediet of de bedrijfsborgstellingskredieten, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.1.b
    text: |-
      ten hoogste de som van de ten tijde van de opzegging van de kredietovereenkomst bestaande en verstrekte
      financieringsfaciliteiten van de kredietverstrekker voor de MKB-ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.2
    text: 'In afwijking van het eerste lid, onder b, bedraagt de omvang van de borgstelling:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.2.a
    text: |-
      indien sprake is van een starters-borgstellingskrediet: ten hoogste drie maal de som van de ten tijde van de
      opzegging van de kredietovereenkomst bestaande en verstrekte financieringsfaciliteiten van de kredietverstrekker
      voor de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.2.b
    text: |-
      indien het bedrijfsborgstellingskrediet is verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking
      een innovatieve MKB-ondernemer was: ten hoogste twee maal de som van de ten tijde van de opzegging van de
      kredietovereenkomst bestaande en verstrekte financieringsfaciliteiten van de kredietverstrekker voor de MKB-
      ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.3
    text: |-
      Voor de toepassing van het eerste lid en het tweede lid, onderdeel a, worden als financieringsfaciliteiten mede in
      aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.3.a
    text: |-
      de bedragen die een kredietverstrekker-gelieerde uit hoofde van een overeenkomst aan de MKB-ondernemer ter leen
      verstrekt of zal verstrekken, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:12.3.b
    text: |-
      de verplichtingen die een kredietverstrekker-gelieerde tegenover een derde, niet zijnde een andere
      kredietverstrekker-gelieerde of een rechtspersoon waarmee de kredietverstrekker in een groep verbonden is,
      onherroepelijk is aangegaan om ten laste van de MKB-ondernemer aan de derde een of meer betalingen te doen als
      bedoeld in artikel 1, tweede lid, onderdeel g, 3°, indien de zekerheden van de kredietverstrekker-gelieerde
      ter zake van de hiervoor onder a en b bedoelde bedragen en verplichtingen mede strekken tot zekerheid van de
      kredietverstrekker.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B2.5:13.1
    text: |-
      De minister betaalt hetgeen de Staat uit hoofde van deze overeenkomst met het oog op de door de kredietverstrekker
      in haar verzoek bedoelde bedrijfsborgstellingskrediet verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:13.2
    text: |-
      Voor zover de kredietverstrekker bij haar verzoek om betaling aannemelijk maakt dat er bijzondere omstandigheden
      waren die het, oordelend zoals een redelijk handelend en bekwaam financier in het kader van een actief en
      winstgericht beleid zou hebben gedaan zonder borgstelling, noodzakelijk maakten de andere financieringsfaciliteiten
      sterker in omvang terug te brengen dan de bedrijfsborgstellingskredieten, blijft artikel 12, eerste lid, aanhef en
      onder b, en tweede lid, buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:13.3
    text: 'De Staat is niet verplicht tot betaling op het verzoek van de kredietverstrekker:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:13.3.a
    text: indien niet voldaan is aan een verzoek als bedoeld in artikel 20, eerste lid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:13.3.b
    text: |-
      indien de kredietverstrekker in het kader van het verzoek gegevens heeft verstrekt, waarvan zij wist of behoorde te
      weten dat deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste beslissing op het
      verzoek zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:13.3.c
    text: indien niet voldaan is aan artikel 21, eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:13.4
    text: |-
      Betalingen door de Staat aan de kredietverstrekker en door de kredietverstrekker aan de Staat geschieden door
      debitering respectievelijk creditering door de kredietverstrekker van een rekening die de kredietverstrekker
      zal aanhouden ten name van het ministerie van Economische Zaken, Landbouw en Innovatie, met vermelding van
      'verliesdeclaraties'.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B2.5:14.1
    text: |-
      Gedurende vijf jaar nadat de kredietverstrekker uit hoofde van het bedrijfsborgstellingskrediet door de Staat is
      betaald, is de kredietverstrekker gehouden die pogingen in het werk te stellen om namens de Staat het door de Staat
      betaalde bedrag in te vorderen, die de kredietverstrekker in het werk zou hebben gesteld indien het krediet voor
      eigen rekening en risico door de kredietverstrekker zou zijn verstrekt. De Staat machtigt met het oog hierop de
      kredietverstrekker tot invordering bij de kredietnemer van de door deze aan de Staat verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.5:14.2
    text: |-
      De kredietverstrekker zendt binnen drie maanden na afloop van de in het eerste lid bedoelde periode de minister
      een overzicht van de door haar ondernomen activiteiten, waarin de door de minister vastgestelde informatie is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B2.5:15.1
    text: |-
      Indien een verzoek om betaling als bedoeld in artikel 11 is ingediend op een moment, waarop de uitwinning nog niet
      is voltooid en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bedrijfsborgstellingskrediet, brengt de kredietverstrekker de minister ten minste jaarlijks verslag uit over
      de voortgang van de uitwinning.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.5:15.2
    text: |-
      De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nadere gegevens van de
      kredietverstrekker verlangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B2.5:16.1
    text: |-
      De kredietverstrekker betaalt de vanaf het moment van de indiening van een verzoek om betaling als bedoeld in
      artikel 11 ontvangen opbrengsten die in mindering komen op het bedrijfsborgstellingskrediet binnen twee maanden na
      ontvangst aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.5:16.2
    text: |-
      Voor zover de opbrengsten na de aanvang van de periode, bedoeld in artikel 14, eerste lid, ontvangen zijn, wordt
      de in het eerste lid bedoelde betalingsverplichting beperkt tot 80 procent van de ontvangen opbrengsten, tenzij
      opbrengsten ontvangen zijn uit hoofde van uitwinning van zekerheden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.5:16.3
    text: |-
      De kredietverstrekker zal de rekening, bedoeld in artikel 13, vierde lid, per de datum van verzending van het
      verzoek, bedoeld in artikel 11, en binnen twee maanden na die datum, debiteren voor het bedrag waarvoor betaling
      wordt gevraagd, vermeerderd met een rente over de periode die verstreken is sinds de dag waarop de vermindering,
      bedoeld in artikel 9, op grond van artikel 10 is geschorst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.5:16.4
    text: |-
      De kredietverstrekker zal de rekening op de datum van de reactie van de minister, bedoeld in artikel 11, derde
      lid, en binnen twee maanden na die datum crediteren of debiteren voor respectievelijk het voor de Staat positieve
      of negatieve verschil tussen het bedrag waarvoor de rekening ingevolge het derde lid is gedebiteerd en het door de
      Staat blijkens de reactie, bedoeld in artikel 11, verschuldigde bedrag, vermeerderd met een over dat verschil te
      berekenen rente over de periode die is verstreken sinds de creditering of debitering, bedoeld in het derde lid, en
      de datum waarop de reactie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.5:16.5
    text: |-
      De rente, bedoeld in het derde en vierde lid, is gelijk aan de zes maands Euribor op het moment van de indiening
      van een aanvraag als bedoeld in artikel 11.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel16
  - number: B2.5:17.1
    text: |-
      De kredietverstrekker treft geen schuldregeling die inhoudt of mede inhoudt een gehele of gedeeltelijke
      kwijtschelding van verplichtingen voortvloeiende uit een kredietovereenkomst, uit hoofde waarvan een
      bedrijfsborgstellingskrediet is verstrekt, zonder voorafgaande toestemming van de minister. De minister kan aan
      zijn toestemming voorwaarden verbinden ten aanzien van de inhoud van een dergelijke regeling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.5:17.2
    text: De minister beslist zo spoedig mogelijk op een verzoek om toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel17
  - number: B2.5:18.1
    text: |-
      De verplichtingen van de Staat uit hoofde van deze overeenkomst met betrekking tot een bedrijfsborgstellingskrediet
      vervallen door schuldvernieuwing, door schuldoverneming en – voor het gedeelte waarin subrogatie plaatsvindt – door
      subrogatie van derden in de rechten van de kredietverstrekker met betrekking tot het bedrijfsborgstellingskrediet,
      al dan niet voorafgegaan door verpanding van het bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.5:18.2
    text: |-
      In afwijking van het eerste lid blijven de verplichtingen van de Staat met betrekking tot een
      bedrijfsborgstellingskrediet van kracht, indien:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.5:18.2.a
    text: |-
      de MKB-ondernemer aan wie het bedrijfsborgstellingskrediet is verstrekt de onderneming en alle voor het drijven van
      de onderneming bestemde activa en passiva inbrengt of overdraagt aan een door de MKB-ondernemer voor het drijven
      van die onderneming opgerichte rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.5:18.2.b
    text: |-
      de kredietverstrekker met de onder a bedoelde rechtspersoon een overeenkomst sluit als gevolg waarvan die
      rechtspersoon bij de kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verleend de plaats
      inneemt van de MKB-ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.5:18.2.c
    text: |-
      de MKB-ondernemer zich naast de onder a bedoelde rechtspersoon hoofdelijk aansprakelijk stelt voor de nakoming door
      die rechtspersoon van de verplichtingen die voortvloeien uit de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.5:18.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder rechtspersoon mede begrepen twee of meer rechtspersonen,
      indien die rechtspersonen gezamenlijk voldoen aan de in het tweede lid genoemde voorwaarden en ieder van die
      rechtspersonen zich hoofdelijk aansprakelijk stelt voor de nakoming van de verplichtingen die voortvloeien uit de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel18
  - number: B2.5:19
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt
      dat de kredietverstrekker zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om
      betaling een andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, of dat
      de kredietverstrekker de betalingsverplichting, bedoeld in artikel 16, eerste lid, niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel19
  - number: B2.5:20.1
    text: |-
      De kredietverstrekker, en indien toepassing is gegeven aan de artikelen 3, tweede lid, en 12, derde lid, de
      kredietverstrekker-gelieerde, en de MKB-ondernemer voldoen aan hetgeen door door de minister aangewezen bij
      zijn ministerie werkzame personen wordt verzocht, voor zover dat redelijkerwijs noodzakelijk is voor een goede
      uitvoering van het [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien
      en overdragen van ondernemingen en deze overeenkomst, en met het oog op de nakoming door de Staat van op de Staat
      rustende internationaalrechtelijke verplichtingen, en voor zover het betrekking heeft op de uit het besluit of
      deze overeenkomst voortvloeiende zelfstandige verplichtingen van de kredietverstrekker of de kredietverstrekker-
      gelieerde, op de MKB-ondernemer aan wie het bedrijfsborgstellingskrediet is verstrekt of op de met deze MKB-
      ondernemer gesloten kredietovereenkomsten, omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.5:20.1.a
    text: het toegang verlenen tot door hen gebruikte plaatsen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.1.b
    text: het verlenen van inzage in zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.1.c
    text: het maken van kopieën van de onder b bedoelde gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.1.d
    text: het verlenen van medewerking aan het verstrekken van gegevens door anderen en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.1.e
    text: het verstrekken van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.2
    text: |-
      Alleen in daartoe aanleiding gevende gevallen zal aan de kredietverstrekker, of indien toepassing is gegeven aan de
      artikelen 3, tweede lid, en 12, derde lid, aan de kredietverstrekker-gelieerde, of aan de MKB-ondernemer, gevraagd
      worden de in het eerste lid bedoelde inlichtingen ook door haar accountant te doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.3
    text: |-
      Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de kredietverstrekker, de kredietverstrekker-gelieerde of de MKB-ondernemer onjuiste
      of onvolledige informatie heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.4
    text: |-
      De kredietverstrekker stelt de minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten en
      verstrekt daarbij de door de minister vastgestelde informatie:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.4.a
    text: vervroegde volledige aflossing van het bedrijfsborgstellingskrediet;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.4.b
    text: de verlening van surseance van betaling aan of de faillietverklaring van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.4.c
    text: opeising van het bedrijfsborgstellingskrediet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:20.5
    text: |-
      De kredietverstrekker meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van
      betaling aan de kredietverstrekker, dan wel een verzoek tot faillietverklaring van de kredietverstrekker.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel20
  - number: B2.5:21.1
    text: |-
      Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet wordt verstrekt
      en tijdens de uitwinning zal de kredietverstrekker waken over de belangen van de Staat als borg.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.5:21.2
    text: |-
      De kredietverstrekker zal er voor zorg dragen dat het bedrijfsborgstellingskrediet niet wordt gebruikt voor de
      nakoming van verplichtingen van de MKB-ondernemer aan de kredietverstrekker die het bedrijfsborgstellingskrediet
      verstrekt, aan een kredietverstrekker-gelieerde of aan een rechtspersoon waarmee de kredietverstrekker in een groep
      verbonden is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.5:21.3
    text: |-
      De kredietverstrekker zal tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een
      bedrijfsborgstellingskrediet is verleend in de door haar te sluiten overeenkomsten met allen, niet zijnde de Staat,
      die zich borg willen stellen voor de nakoming door de MKB-ondernemer van de verplichtingen voortvloeiende uit de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verleend, een beding ten behoeve van
      de Staat opnemen, ertoe strekkende dat de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref1] niet
      geldt ten opzichte van de Staat en de kredietverstrekker zal geen bedingen opnemen, ertoe leidende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.5:21.3.a
    text: een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.5:21.3.b
    text: |-
      een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel869
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '869'
  - number: B2.5:21.4
    text: |-
      De kredietverstrekker draagt er zorg voor dat de relaties tussen haar en de bij haar onderneming betrokkenen
      enerzijds, en de ondernemer aan wie een bedrijfsborgstellingskrediet is verstrekt anderzijds transparant zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.5:21.5
    text: |-
      De kredietverstrekker voldoet blijvend aan [artikel 24 van het Kaderbesluit EZ-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel24
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '24'
  - number: B2.5:21.6
    text: |-
      De kredietverstrekker informeert de Staat zo snel mogelijk, maar uiterlijk binnen twee weken voorafgaand aan de
      desbetreffende gebeurtenis schriftelijk over wezenlijke wijzigingen in het financieringsbeleid of de organisatie
      van de kredietverstrekker.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel21
  - number: B2.5:22
    text: |-
      Indien naar het oordeel van de minister de kans dat de toepasselijkheid van deze overeenkomst op een
      bedrijfsborgstellingskrediet of een deel van een bedrijfsborgstellingskrediet wordt ingeroepen in belangrijke
      mate wordt verkleind of indien naar het oordeel van de minister aannemelijk is dat daardoor het bedrag waarvoor de
      toepasselijkheid van deze overeenkomst wordt ingeroepen in belangrijke mate wordt verlaagd, kan de minister voor
      de toepassing van deze overeenkomst met betrekking tot dat krediet instemmen met een gemotiveerd verzoek van de
      kredietverstrekker om afwijking van deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel22
  - number: B2.5:23
    text: |-
      Waar in deze overeenkomst sprake is van een vorm van communicatie geschiedt deze langs elektronische weg.
      De aanlevering door de kredietverstrekker kan in afwijking en bij wijze van alternatief en ter keuze van de
      kredietverstrekker ook geschieden in schriftelijke vorm en door aanlevering van een fysieke gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel23
  - number: B2.5:24.1
    text: |-
      De inwerkingtreding van een wijziging van het [Kaderbesluit EZ-subsidies][ref1] of [hoofdstuk 2][ref2] van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen leidt te zelfder tijd tot een gelijke wijziging
      van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.5:24.2
    text: Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de kredietverstrekker.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.5:24.3
    text: |-
      Deze overeenkomst is aangegaan voor bepaalde tijd tot en met 31 december 2013 en kan door de minister en de
      kredietverstrekker tussentijds schriftelijk worden opgezegd met inachtneming van een opzegtermijn van drie hele
      kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.5:24.4
    text: |-
      In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien de kredietverstrekker in strijd heeft gehandeld met het gestelde in deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.5:24.5
    text: |-
      In afwijking van het derde lid kan de kredietverstrekker deze overeenkomst met onmiddellijke ingang
      opzeggen binnen een termijn van een maand na publicatie in het Staatsblad van een wijziging van het
      [Kaderbesluit EZ-subsidies][ref1], publicatie in de Staatscourant van een wijziging van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen of een schriftelijke mededeling van de minister, inhoudende een
      wijziging van deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
  - number: B2.5:24.6
    text: |-
      Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit EZ-subsidies][ref1] of door
      intrekking van [artikel 2.3, eerste lid, onderdeel a][ref2], van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.5:24.7
    text: |-
      Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien van
      bedrijfsborgstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging, opzegging, ontbinding
      of beëindiging overeenkomstig artikel 3 zijn gemeld en ten aanzien van bedrijfsborgstellingskredieten die zijn of
      zullen worden verstrekt uit hoofde van een kredietovereenkomst die is aangegaan voor de inwerkingtreding van de
      wijziging, opzegging, ontbinding of beëindiging.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
  - number: B2.5:24.8
    text: |-
      Als het [Kaderbesluit EZ-subsidies][ref1] en [artikel 2.3, eerste lid, onderdeel a][ref2], van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen gelijktijdig worden ingetrokken en vervangen door materieel
      identieke wettelijke voorschriften in een andere algemene maatregel van bestuur of ministeriële regeling dan is het
      zesde lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: B2.5:25
    text: 'Kredietverstrekker-gelieerde in de zin van artikel 1, tweede lid, onder a, van deze overeenkomst is (zijn):'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.5:25.a
    text: (...) ....................
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B2.5:25.b
    text: (...enz.)
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel25
  - number: B3.1:1
    text: 'In deze overeenkomst wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.a
    text: '*minister:* de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.b
    text: '*kapitaalvennootschap:*'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.b.1°
    text: |-
      een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG](31968L0151) van de Raad van
      9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken (PB
      EG L 65), of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.b.2°
    text: |-
      een kapitaalvennootschap die is ingericht naar het recht van één van de lidstaten van de Europese Unie, die
      rechtspersoonlijkheid bezit, een apart vermogen heeft dat bij uitsluiting voor de schulden van de vennootschap
      kan worden aangesproken en op grond van haar nationale wetgeving onderworpen is aan garantievoorwaarden zoals
      bedoeld in [Richtlijn 68/151/EEG](31968L0151) van de Raad om de belangen van zowel deelgerechtigden als derden
      te beschermen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.c
    text: |-
      *ondernemer:* een natuurlijk persoon, een rechtspersoon of een vennootschap, die een onderneming in stand houdt,
      niet zijnde een rechtspersoon die krachtens publiekrecht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.d
    text: |-
      *kleine onderneming:* kleine onderneming in de zin van verordening (EG) nr. 800/ 2008 van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.e
    text: |-
      *middelgrote onderneming:* een middelgrote onderneming in de zin van verordening (EG) nr. 800/ 2008 van de
      Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.f
    text: |-
      *participatiemaatschappij:* een vennootschap in de vorm van een kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de lidstaten van de Europese Unie, die blijkens haar
      statuten of blijkens de overeenkomst waarbij zij is aangegaan tot doel heeft of mede tot doel heeft het verstrekken
      van risicokapitaal aan ondernemers teneinde winst te behalen, met uitzondering van startersfondsen als bedoeld in
      [artikel 4.1][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '4'
        hoofdstuk: '4'
  - number: B3.1:1.g
    text: |-
      *bank:* binnen het grondgebied van de Europese Unie gevestigde bank die is toegelaten het bedrijf van bank uit
      te oefenen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.h
    text: '*financier:* een bank of een participatiemaatschappij of een andere, door de minister aangewezen instelling;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.i
    text: '*achtergestelde lening:*'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.i.1°
    text: |-
      een lening van geld door een financier aan een ondernemer met het oog op de financiering door deze onderneming
      van eigen activiteiten, - welke lening niet door enige vorm van zekerheid is gedekt, met uitzondering van een
      borgstelling die een aandeelhouder in de onderneming van de ondernemer op persoonlijke titel heeft gegeven,
        - waarop de ondernemer krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding,
      een akkoord na verlening van surseance van betaling, een akkoord in faillissement of een akkoord na het van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan
      de achtergestelde lening is verstrekt, eerst verplicht is de niet vervallen aflossingen te betalen nadat alle
      andere op dat moment bestaande schulden van de debiteur zijn voldaan, met uitzondering van schulden ingevolge
      vorderingen waaraan een bepaling van gelijke aard als voornoemde bepaling zijn verbonden en ingevolge geldleningen
      die zijn verstrekt door aandeelhouders in de onderneming van de ondernemer, en
        - ten aanzien waarvan de financier in de vorenbedoelde akte van geldlening afstand heeft gedaan van alle rechten
      tot verrekening van de niet vervallen aflossingen; of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.i.2°
    text: |-
      een lening van geld door een financier aan een ondernemer die een rechtspersoon is wiens activa
      slechts bestaan uit deelnemingen in of vorderingen op een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1], met het oog op financiering door deze ondernemer
      van activiteiten van deze dochtermaatschappij, - welke lening niet door enige vorm van zekerheid is gedekt, met
      uitzondering van een persoonlijke borgstelling van een aandeelhouder in de onderneming van de ondernemer en van een
      pandrecht gevestigd op aandelen in de dochtermaatschappij,
        - en ten aanzien waarvan de financier in de akte van geldlening afstand heeft gedaan van alle rechten tot
      verrekening van de niet vervallen aflossingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: B3.1:1.j
    text: '*waarde van een achtergestelde lening:* het nog niet afgeloste deel van de lening;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.k
    text: |-
      *aandelenkapitaal:* aandelen in het kapitaal van een onderneming van de ondernemer, die de financier rechtstreeks
      van de ondernemer heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van een
      achtergestelde lening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.l
    text: |-
      *waarde van aandelenkapitaal:* het bedrag in geld dat de financier bij de volstorting van de aandelen heeft betaald
      dan wel, in geval van omzetting van een achtergestelde lening, of een deel daarvan, in aandelenkapitaal, de waarde
      van de uitstaande lening voor zover die is omgezet in aandelen, vermeerderd onderscheidenlijk verminderd met het
      bedrag in geld dat wegens de omzetting is bijbetaald door, onderscheidenlijk terugbetaald aan de financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.m
    text: '*risicokapitaal:* kapitaal in de vorm van aandelenkapitaal of een achtergestelde lening;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.n
    text: |-
      *reserveringsquotum:* het bedrag dat de minister op aanvraag van een financier vaststelt als maximum voor de som
      van de garanties voor verstrekkingen van risicokapitaal die:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.n.1°
    text: |-
      gedurende drie jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien het een
      eerste toekenning van een reserveringsquotum betreft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.n.2°
    text: |-
      gedurende twee jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien reeds eerder
      een reserveringsquotum is toegekend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.o
    text: '*groep:* een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.o.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van, of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.o.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:1.p
    text: |-
      *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent, in Nederland is gevestigd en daar een substantieel deel van haar activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.1:2.1
    text: |-
      De Staat stelt zich tegenover de financier garant voor 50% van de waarde van door de financier verstrekt
      risicokapitaal, voor welke garantstelling de financier een provisie is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:2.2
    text: |-
      De garantie wordt verleend voor de duur van de desbetreffende kapitaalverstrekkingen met een maximum van twaalf
      jaar, met dien verstande dat op verzoek van de financier de garantie inzake een verstrekking van aandelenkapitaal
      wordt gebonden aan een termijn van ten minste zes jaar en ten hoogste twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:2.3
    text: De garantstelling heeft alleen betrekking op risicokapitaal
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:2.3.a
    text: |-
      dat wordt verstrekt nadat de minister desgevraagd een reserveringsquotum heeft toegekend en voor zover het quotum
      nog toereikend en geldig is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:2.3.b
    text: dat wordt verstrekt overeenkomstig de in artikel 3 genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:2.3.c
    text: dat onder de garantstelling is gebracht overeenkomstig de procedure van artikel 4.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:2.4
    text: |-
      Indien de financier bij de verstrekking van risicokapitaal een gedeelte daarvan niet onder de garantstelling van
      de Staat brengt, is deze overeenkomst slechts van toepassing op het gedeelte van het verstrekte risicokapitaal dat
      onder de garantstelling is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.1:3
    text: |-
      Een verstrekking van risicokapitaal aan een ondernemer kan onder de garantstelling van de Staat worden gebracht
      indien wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.a
    text: de rentabiliteits- en continuïteitsperspectieven van de onderneming van de ondernemer zijn bevredigend;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.b
    text: |-
      in de voorafgaande periode van twaalf maanden zijn niet meer middelen ten behoeve van derden aan de onderneming
      onttrokken dan noodzakelijk voor een redelijk te achten bedrijfsvoering en evenmin is een verplichting tot een
      zodanige onttrekking aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.c
    text: |-
      de verstrekking van het risicokapitaal dient niet ter vervanging van aan een ondernemer verschaft krediet of
      risicokapitaal door dezelfde financier of door een financier die deel uitmaakt van de groep van dezelfde financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.d
    text: |-
      de waarde van het risicokapitaal dat aan de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan
      de groep wordt verstrekt tezamen met de waarde van risicokapitaal dat door een andere financier met toepassing van
      [hoofdstuk 3][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen, en van risicokapitaal
      dat met toepassing van [hoofdstuk 4][ref2] van de Subsidieregeling starten, groeien en overdragen van ondernemingen
      aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig wordt verstrekt, bedraagt niet meer dan
      € 5.000.000;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: B3.1:3.e
    text: bij of in verband met het verstrekken van het risicokapitaal verstrekt de financier geen andere goederen dan geld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.f
    text: |-
      de verstrekking van het risicokapitaal draagt zelfstandig bij aan het realiseren van een actief en winstgericht
      beleid van de financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.g
    text: |-
      de ondernemer verplicht zich aan een door de minister als toezichthouder in de zin van de Algemene wet
      bestuursrecht aangewezen persoon of aan een door de minister aangewezen deskundige derde, voor zover deze dit
      redelijkerwijs noodzakelijk acht voor de vervulling van zijn taak:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.g.1°
    text: |-
      inlichtingen te verstrekken en inzage in zakelijke gegevens en bescheiden te verstrekken en de gelegenheid te
      bieden daarvan kopieën te maken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.g.2°
    text: toegang te verlenen tot plaatsen niet zijnde woningen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.g.3°
    text: anderszins binnen de door hem gestelde termijn alle door hem gewenste medewerking te verlenen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.h
    text: |-
      het risicokapitaal dient niet voor de overname van een aandelenkapitaal of een converteerbare achtergestelde
      lening, behalve indien dit een concrete verbetering in het ondernemingsbeleid ten doel heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.i
    text: |-
      het risicokapitaal dient niet ter vervanging van een bestaande lening, indien dit uitsluitend ten doel heeft betere
      financieringsvoorwaarden te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.j
    text: het risicokapitaal heeft niet als doel de afwenteling van bestaande risico’s op de Staat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.k
    text: |-
      voor participatiemaatschappijen bedraagt de waarde van het risicokapitaal dat aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de waarde van het risicokapitaal
      dat door een andere participatiemaatschappij met toepassing van hoofdstuk 3 van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en van risicokapitaal dat met toepassing van hoofdstuk 4 van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen aan de ondernemer onderscheidenlijk de groep is
      verstrekt of gelijktijdig wordt verstrekt niet meer dan € 25.000.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:3.l
    text: |-
      de minister, geadviseerd door een groep deskundige derden, heeft verklaard dat is voldaan aan de voorwaarden a tot
      en met g, indien de financiering waarvoor een garantie wordt aangevraagd meer bedraagt dan € 5 miljoen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.1:4.1
    text: |-
      De financier stelt de Staat in kennis van een voorgenomen verstrekking van risicokapitaal met gebruikmaking van
      een formulier, overeenkomstig een model dat als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een
      kopie van de ontwerp-overeenkomst tot verstrekking van het risicokapitaal en van andere bescheiden als genoemd in
      het model.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B3.1:4.2
    text: |-
      Indien de verstrekking van risicokapitaal naar het oordeel van de Staat voldoet aan de in artikel 3 bedoelde
      voorwaarden, geldt de garantstelling op grond van deze overeenkomst voor dit risicokapitaal. De Staat bericht
      hierover de financier binnen drie weken na ontvangst van de aanmelding onder vermelding van de omvang en duur
      van de garantie. De minister kan in plaats van de provisie, genoemd in artikel 6, tweede lid, een vergoeding
      vaststellen, indien naar het oordeel van de minister de provisie te laag is in relatie tot het risico dat de Staat
      loopt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B3.1:4.3
    text: |-
      De garantie wordt afgegeven onder de opschortende voorwaarde dat een dienovereenkomstige, door partijen gesloten
      overeenkomst aan de Staat wordt overgelegd en dat ook dan wordt voldaan aan de in artikel 3 bedoelde voorwaarden.
      De Staat bericht hierover de financier binnen 35 dagen na ontvangst van de gesloten overeenkomst onder vermelding
      van de omvang, duur en provisie of vergoeding van de garantie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B3.1:5.1
    text: |-
      De financier draagt er voor zorg dat een actief en winstgericht beleid wordt gevoerd voor het verstrekken, beheren
      en vervreemden van risicokapitaal, waarbij rekening wordt gehouden met het belang van de Staat als garantsteller.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.2
    text: |-
      De financier draagt er voor zorg dat degenen die met het verstrekken, beheren of vervreemden van risicokapitaal
      zijn belast beschikken over de nodige deskundigheid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.3
    text: |-
      De financier staat er voor in dat degenen die zijn belast met het verstrekken, beheren of vervreemden van
      risicokapitaal en met de bepaling van en het toezicht op het beleid ter zake betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.4
    text: |-
      De financier draagt zorg voor een integere bedrijfsvoering en neemt in dat verband de noodzakelijke maatregelen om
      onder meer strafbare handelingen, verstrengeling van tegenstrijdige belangen en afhankelijkheid van de financier
      van bepaalde vennoten, aandeelhouders of andere betrokkenen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.5
    text: |-
      De financier staat er voor in dat aandeelhouders, hoofdelijk aansprakelijke vennoten, bestuurders en beheerders
      van de financier en andere zijdens de financier betrokkenen alleen medewerking verlenen aan verstrekkingen van
      risicokapitaal en krediet door een ander dan de financier aan een onderneming waaraan de financier risicokapitaal
      heeft verstrekt met een garantie op grond van deze overeenkomst, indien een redelijk handelend en redelijk bekwaam
      beheerder deze verstrekkingen zou hebben gedaan in het kader van een actief en winstgericht beleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.6
    text: |-
      De financier komt met een ondernemer aan wie een achtergestelde lening is verstrekt slechts een wijziging van
      het aflossingsschema overeen na voorafgaande toestemming van de Staat, tenzij deze betrekking heeft op een
      versnelde aflossing of op een gehele of gedeeltelijke opschorting van de aflossingen gedurende ten hoogste vier
      aaneengesloten kwartalen die niet is voorafgegaan door een eerdere opschorting van de aflossingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.7
    text: 'De Staat verleent de in het zesde lid bedoelde toestemming indien aannemelijk is dat:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.7.a
    text: de ondernemer niet in staat is te voldoen aan het bestaande aflossingsschema;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.7.b
    text: |-
      adequate maatregelen worden genomen ter verbetering van de liquiditeit van de onderneming en rekening houdend met
      het belang van rentabiliteit en continuïteit van de onderneming;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.7.c
    text: |-
      rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.8
    text: |-
      De Staat kan op verzoek van de financier besluiten om de afdracht van de provisie, bedoeld in artikel 6.2, op te
      schorten in het geval dat:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.8.a
    text: er voor de financier geen mogelijkheden meer zijn om de renteverplichtingen te incasseren bij de ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.8.b
    text: |-
      aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer
      door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de verplichtingen van bestaande
      leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.9
    text: De financier vervreemdt de lening slechts na voorafgaande toestemming van de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.10
    text: |-
      De financier verleent slechts gehele of gedeeltelijke kwijtschelding van verplichtingen voortvloeiende uit
      de leningovereenkomst, uit hoofde waarvan de gegarandeerde lening is verstrekt, na voorafgaande toestemming
      van de Staat. De Staat geeft toestemming indien de kwijtschelding noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:5.11
    text: |-
      De financier brengt slechts wijzigingen aan in de leningovereenkomst van de lening na voorafgaande toestemming
      van de Staat. De Staat kan toestemming geven indien de wijziging noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.1:6.1
    text: |-
      De financier aan wie de minister een reserveringsquotum heeft toegekend, is hiervoor aan de Staat een eenmalige
      provisie van 1% van dit quotum verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.2
    text: |-
      De financier is een provisie verschuldigd voor de garantie op het verstrekte risicokapitaal dat overeenkomstig de
      procedure van artikel 4 onder de garantstelling is gebracht. De provisie bedraagt jaarlijks
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.2.a
    text: |-
      2,5% van de gegarandeerde waarde van dit risicokapitaal indien de kapitaalverstrekking bestaat uit een niet
      converteerbare achtergestelde lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan dezelfde
      ondernemer door de financier of een andere financier die deel uitmaakt van dezelfde groep in de vorm van een
      converteerbare achtergestelde lening of aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.2.b
    text: 3% van de gegarandeerde waarde van dit risicokapitaal in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.3
    text: |-
      Per kwartaal wordt een vierde deel van de in het tweede lid bedoelde provisie in rekening gebracht, uitgaand van de
      waarde van het risicokapitaal op de eerste dag van het kwartaal.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.4
    text: |-
      De in het tweede lid bedoelde provisie is verschuldigd voor de duur van de garantie of zoveel korter als zich één
      van de in artikel 8, eerste lid, genoemde omstandigheden voordoet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.5
    text: |-
      Indien het risicokapitaal aandelenkapitaal betreft dat wordt vervreemd binnen zes jaren vanaf de verstrekking van
      het risicokapitaal, is de financier op dat tijdstip een aanvullende provisie verschuldigd voor de periode vanaf het
      tijdstip van de vervreemding tot na het verstrijken van de periode van zes jaren, welke aanvullende provisie wordt
      berekend met overeenkomstige toepassing van het tweede lid en uitgaand van de waarde van het aandelenkapitaal op de
      eerste dag van het kwartaal voorafgaand aan de vervreemding.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.6
    text: |-
      Indien het risicokapitaal een achtergestelde lening betreft, is de financier op het tijdstip van de volledige
      aflossing van de lening een aanvullende provisie verschuldigd indien de op grond van het tweede lid voor de totale
      looptijd van de lening verschuldigde provisie minder bedraagt dan het zesvoud van de provisie die met toepassing
      van het tweede lid voor de helft van het geleende bedrag kan worden berekend, welke aanvullende provisie gelijk is
      aan het hiervoor bedoelde verschil.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:6.7
    text: |-
      Indien risicokapitaal binnen een termijn van zes jaar wordt afgestoten om verlies op dat risicokapitaal in de
      zin van artikel 8, eerste lid, te beperken, kan de minister op verzoek van de financier de over de resterende
      termijn verschuldigde provisie kwijtschelden indien sprake is van klemmende redenen, gelegen in het belang van de
      onderneming van de ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.1:7.1
    text: |-
      De financier draagt er voor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te allen
      tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verstrekkingen, het beheer en de
      vervreemdingen van gegarandeerd risicokapitaal en van ander risicokapitaal dat hij aan dezelfde ondernemer heeft
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:7.2
    text: |-
      De financier informeert de Staat binnen acht weken nadat de desbetreffende gebeurtenis heeft plaatsgevonden
      schriftelijk over wezenlijke wijzigingen in het financieringsbeleid of de organisatie van de financier en over
      wijzigingen ten aanzien van gegarandeerd risicokapitaal, waaronder
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:7.2.a
    text: een omzetting van een achtergestelde lening in aandelenkapitaal,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:7.2.b
    text: |-
      een aflossing van een achtergestelde lening, tenzij deze aflossing overeenkomt met een aflossingsschema waarover de
      Staat eerder is geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:7.2.c
    text: een wijziging van de looptijd van een achtergestelde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:7.3
    text: De financier verstrekt de Staat jaarlijks zijn jaarverslag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:7.4
    text: |-
      Desgevraagd verstrekt de financier de Staat gegevens en bescheiden over de verstrekkingen, het
      beheer en de vervreemdingen van gegarandeerd risicokapitaal en van ander risicokapitaal dat
      hij aan dezelfde ondernemer heeft verstrekt, en de jaarrekeningen van de ondernemingen waaraan
      risicokapitaal is verstrekt, vergezeld van desbetreffende accountantsverklaringen als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] of een mededeling waarom deze ontbreekt, en
      van de bijbehorende toelichtingen voor het bestuur van de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: B3.1:7.5
    text: |-
      De financier doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surséance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.1:8.1
    text: 'De financier kan een beroep doen op de garantie indien hij op gegarandeerd risicokapitaal verlies lijdt:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.1.a
    text: bij gehele of gedeeltelijke vervreemding van dat risicokapitaal;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.1.b
    text: |-
      indien het risicokapitaal een achtergestelde lening betreft, door gehele of gedeeltelijke kwijtschelding van de
      lening door de financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.1.c
    text: |-
      indien het risicokapitaal een achtergestelde lening betreft, door onvermogen van de ondernemer om de lening af
      te lossen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.1.d
    text: |-
      als gevolg van een faillietverklaring, een verlening van surséance van betaling of een van toepassing verklaren van
      de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.1.e
    text: |-
      bij een in kracht van gewijsde gegane homologatie van een akkoord na de faillietverklaring, na de verlening van
      surséance van betaling of na het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen met
      betrekking tot de ondernemer waaraan de lening is verstrekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.1.f
    text: indien de ondernemer een rechtspersoon is, bij ontbinding van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.2
    text: |-
      De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien in de voorafgaande
      periode van twaalf maanden meer middelen aan de MKB-onderneming zijn onttrokken ten behoeve van derden dan
      noodzakelijk voor een redelijk te achten bedrijfsvoering, dan wel een verplichting tot een zodanige onttrekking is
      aangegaan, mits de financier hieraan op enigerlei wijze medewerking heeft verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.3
    text: 'Bij verlies ingevolge vervreemding van risicokapitaal geldt de garantie alleen indien de vervreemding:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.3.a
    text: |-
      niet eerder dan twee jaar na de verstrekking ervan heeft plaatsgevonden, tenzij de Staat desgevraagd met
      vervreemding binnen deze termijn heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.3.b
    text: gebeurt tegen een prijs die past in het voeren van een actief en winstgericht beleid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.3.c
    text: |-
      voor zover de financier daarbij risicokapitaal geheel of voor een deel overdraagt aan één van zijn aandeelhouders,
      hoofdelijk aansprakelijke vennoten, bestuurders, beheerders of andere betrokkenen, gebeurt tegen een prijs die is
      gebaseerd op een taxatie van twee onafhankelijke deskundigen, dan wel gepaard gaat met vervreemding van ten minste
      een derde deel van het risicokapitaal aan onafhankelijke derden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.4
    text: |-
      Bij verlies ingevolge gehele of gedeeltelijke kwijtschelding van een achtergestelde lening geldt de garantie alleen
      indien de kwijtschelding noodzakelijk is voor de continuïteit van de onderneming waarvoor de lening is verstrekt
      en indien rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.5
    text: |-
      Als onvermogen van de ondernemer om de lening af te lossen, bedoeld in het eerste lid, onder c, wordt aangemerkt de
      situatie waarin
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.5.a
    text: de ondernemer niet in staat is te voldoen aan zijn betalingsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.5.b
    text: |-
      aannemelijk is dat de ondernemer in de eerstvolgende jaren niet in staat zal zijn te voldoen aan zijn
      betalingsverplichtingen; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.5.c
    text: |-
      aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder
      meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande
      leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.6
    text: |-
      Verlies als gevolg van faillietverklaring, een verlening van surséance van betaling of een van toepassing verklaren
      van de schuldsaneringsregeling natuurlijke personen, bedoeld in het eerste lid, aanhef en onder d, wordt aanwezig
      geacht
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.6.a
    text: |-
      voor zover aannemelijk is dat de financier bij het einde van het faillissement, van de surséance onderscheidenlijk
      van de toepassing van de schuldsaneringsregeling een verlies als bedoeld in het achtste lid zal leiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.6.b
    text: mits aannemelijk is dat rekening is gehouden met het belang van de Staat als garantsteller.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.7
    text: |-
      De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien de financier tekort
      is geschoten bij de naleving van verplichtingen op grond van deze overeenkomst of indien de financier niet kan
      aantonen die maatregelen te hebben genomen die een redelijk handelend en redelijk bekwaam beheerder zou hebben
      genomen in het kader van een actief en winstgericht beleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.8
    text: |-
      Het verlies wordt berekend op basis van de waarde van het risicokapitaal of, indien het verlies slechts op een deel
      van het verstrekte risicokapitaal is geleden, het hiermee overeenkomende deel van die waarde, in een voorkomend
      geval verminderd met:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.8.a
    text: 'in geval van vervreemding: de prijs waarvoor die vervreemding heeft plaatsgevonden;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.8.b
    text: 'in geval van ontbinding: de liquidatie-uitkering; of'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.8.c
    text: |-
      in geval van homologatie van een akkoord als bedoeld in het eerste lid, onder e, de in het kader van het akkoord
      voor de achtergestelde lening verrichte uitkering; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.8.d
    text: |-
      in geval van verlies op aandelenkapitaal, het totaal van de uitgekeerde dividenden en het totaal van de aan de
      financier betaalde vergoedingen voor zover deze vergoedingen hoger zijn dan een marktconforme vergoeding.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.9
    text: |-
      Indien de financier meermalen gegarandeerd risicokapitaal aan een ondernemer heeft verstrekt en slechts op een deel
      daarvan verlies lijdt, wordt het verlies geacht te zijn geleden op het risicokapitaal dat de financier het eerst
      heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:8.10
    text: |-
      Indien de financier aan een ondernemer risicokapitaal heeft verstrekt dat slechts ten dele onder de garantstelling
      is gebracht en slechts op een deel van het verstrekte risicokapitaal verlies lijdt, wordt het verlies, onverminderd
      het negende lid, naar rato toegerekend aan het risicokapitaal dat onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.1:9.1
    text: |-
      De financier verzoekt de Staat binnen zes maanden nadat zich de in artikel 8, eerste lid, bedoelde situatie heeft
      voorgedaan om betaling op grond van de garantie met gebruikmaking van een formulier, overeenkomstig een model dat
      als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een kopie van de vervreemdingsovereenkomst, de
      inschrijving in het register van de ontbinding van de rechtspersoon of van de in artikel 8, eerste lid, onder c,
      bedoelde akkoorden en van andere bescheiden als genoemd in het model.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B3.1:9.2
    text: |-
      Indien naar het oordeel van de Staat sprake is van een verlies als bedoeld in artikel 8, maakt de financier
      aanspraak op betaling van 50% van het geleden verlies, tenzij de financier in gebreke is gebleven bij de
      naleving van deze overeenkomst. De Staat bericht hierover de financier binnen dertien weken na ontvangst van het
      betalingsverzoek onder vermelding van het te betalen bedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B3.1:10
    text: |-
      Alle betalingen in verband met deze overeenkomst door de financier geschieden door overmaking van de betreffende
      bedragen naar rekeningnummer ... bij de ... bank, ten name van SenterNovem, onder vermelding van het ... nummer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B3.1:11.1
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra blijkt dat de financier
      zodanig onjuiste of onvolledige informatie heeft verschaft dat de Staat op een verzoek om betaling een andere
      beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B3.1:11.2
    text: |-
      Indien vanwege een verlies als bedoeld in artikel 8, eerste lid, onderdeel c of d, een uitkering op grond van
      de garantie heeft plaatsgevonden, is de financier verplicht 50% van de aflossingen die na de uitkering worden
      verricht, onderscheidenlijk van hetgeen na de uitkering is ontvangen, uit te betalen aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B3.1:12.1
    text: De Staat is gerechtigd deze overeenkomst schriftelijk op te zeggen indien
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.1:12.1.a
    text: de financier tekort schiet bij de nakoming van één van zijn verplichtingen uit hoofde van deze overeenkomst;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.1:12.1.b
    text: |-
      ten aanzien van de financier een verzoek bij de rechtbank is ingediend tot verlening van surseance van betaling,
      een verzoek tot faillietverklaring of een verzoek tot van toepassing verklaring van de schuldsaneringsregeling
      natuurlijke personen of een buitengerechtelijk akkoord aan crediteuren wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.1:12.1.c
    text: de financier, in geval deze rechtspersoonlijkheid heeft, is ontbonden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.1:12.1.d
    text: |-
      de bepalingen in [hoofdstuk 3][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen niet
      langer verenigbaar zijn met de regels van de Europese Gemeenschappen ten aanzien van staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '3'
  - number: B3.1:12.2
    text: |-
      Een opzegging op grond van het eerste lid, onder a, geschiedt uitsluitend nadat de Staat de financier op de hoogte
      heeft gesteld van het voornemen tot opzegging en nadat deze in de gelegenheid is gesteld om een tekortschieten dat
      hersteld kan worden te herstellen binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.1:12.3
    text: |-
      Een opzegging in verband met de in het eerste lid, onder d, bedoelde omstandigheid heeft geen gevolgen voor de
      verplichtingen ten aanzien van verstrekkingen van risicokapitaal die voor het tijdstip van de opzegging onder de
      garantstelling zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.1:13.1
    text: |-
      Ieder geschil ten aanzien van deze overeenkomst zal bij uitsluiting worden voorgelegd aan de daartoe bevoegde
      rechter in het arrondissement Den Haag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B3.1:13.2
    text: Op deze overeenkomst is Nederlands recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B3.1:14
    text: |-
      Schriftelijke stukken ter uitvoering van deze overeenkomst bestemd voor de onder 1 gemelde partij worden gericht
      aan Ministerie van Economische Zaken, SenterNovem, Juliana van Stolberglaan 3, Den Haag. Schriftelijke stukken ter
      uitvoering van deze overeenkomst bestemd voor de onder 2 gemelde partij worden gericht aan .....
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B3.1:15
    text: Deze overeenkomst treedt in werking door de ondertekening daarvan door de partijen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B3.2:1
    text: 'In deze overeenkomst wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.a
    text: '*minister:* de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.b
    text: '*kapitaalvennootschap:*'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.b.1°
    text: |-
      een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG](31968L0151) van de Raad van
      9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken (PB
      EG L 65), of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.b.2°
    text: |-
      een kapitaalvennootschap die is ingericht naar het recht van één van de lidstaten van de Europese Unie, die
      rechtspersoonlijkheid bezit, een apart vermogen heeft dat bij uitsluiting voor de schulden van de vennootschap
      kan worden aangesproken en op grond van haar nationale wetgeving onderworpen is aan garantievoorwaarden zoals
      bedoeld in [Richtlijn 68/151/EEG](31968L0151) van de Raad om de belangen van zowel deelgerechtigden als derden
      te beschermen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.c
    text: |-
      *ondernemer:* een natuurlijk persoon, een rechtspersoon of een vennootschap, die een onderneming in stand houdt,
      niet zijnde een rechtspersoon die krachtens publiekrecht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.d
    text: |-
      *kleine onderneming:* kleine onderneming in de zin van verordening (EG) nr. 800/ 2008 van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.e
    text: |-
      *middelgrote onderneming:* een middelgrote onderneming in de zin van verordening (EG) nr. 800/ 2008 van de
      Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.f
    text: |-
      *participatiemaatschappij:* een vennootschap in de vorm van een kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de lidstaten van de Europese Unie, die blijkens haar
      statuten of blijkens de overeenkomst waarbij zij is aangegaan tot doel heeft of mede tot doel heeft het verstrekken
      van risicokapitaal aan ondernemers teneinde winst te behalen, met uitzondering van startersfondsen als bedoeld in
      [artikel 4.1][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '4'
        hoofdstuk: '4'
  - number: B3.2:1.g
    text: |-
      *bank:* binnen het grondgebied van de Europese Unie gevestigde bank die is toegelaten het bedrijf van bank uit
      te oefenen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.h
    text: '*financier:* een bank of een participatiemaatschappij of een andere, door de minister aangewezen instelling;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.i
    text: '*achtergestelde lening:*'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.i.1°
    text: |-
      een lening van geld door een financier aan een ondernemer met het oog op de financiering door deze onderneming
      van eigen activiteiten, - welke lening niet door enige vorm van zekerheid is gedekt, met uitzondering van een
      borgstelling die een aandeelhouder in de onderneming van de ondernemer op persoonlijke titel heeft gegeven,
        - waarop de ondernemer krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding,
      een akkoord na verlening van surseance van betaling, een akkoord in faillissement of een akkoord na het van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan
      de achtergestelde lening is verstrekt, eerst verplicht is de niet vervallen aflossingen te betalen nadat alle
      andere op dat moment bestaande schulden van de debiteur zijn voldaan, met uitzondering van schulden ingevolge
      vorderingen waaraan een bepaling van gelijke aard als voornoemde bepaling zijn verbonden en ingevolge geldleningen
      die zijn verstrekt door aandeelhouders in de onderneming van de ondernemer, en
        - ten aanzien waarvan de financier in de vorenbedoelde akte van geldlening afstand heeft gedaan van alle rechten
      tot verrekening van de niet vervallen aflossingen; of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.i.2°
    text: |-
      een lening van geld door een financier aan een ondernemer die een rechtspersoon is wiens activa
      slechts bestaan uit deelnemingen in of vorderingen op een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1], met het oog op financiering door deze ondernemer
      van activiteiten van deze dochtermaatschappij, - welke lening niet door enige vorm van zekerheid is gedekt, met
      uitzondering van een persoonlijke borgstelling van een aandeelhouder in de onderneming van de ondernemer en van een
      pandrecht gevestigd op aandelen in de dochtermaatschappij,
        - en ten aanzien waarvan de financier in de akte van geldlening afstand heeft gedaan van alle rechten tot
      verrekening van de niet vervallen aflossingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: B3.2:1.j
    text: '*waarde van een achtergestelde lening:* het nog niet afgeloste deel van de lening;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.k
    text: |-
      *aandelenkapitaal:* aandelen in het kapitaal van een onderneming van de ondernemer, die de financier rechtstreeks
      van de ondernemer heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van een
      achtergestelde lening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.l
    text: |-
      *waarde van aandelenkapitaal:* het bedrag in geld dat de financier bij de volstorting van de aandelen heeft betaald
      dan wel, in geval van omzetting van een achtergestelde lening, of een deel daarvan, in aandelenkapitaal, de waarde
      van de uitstaande lening voor zover die is omgezet in aandelen, vermeerderd onderscheidenlijk verminderd met het
      bedrag in geld dat wegens de omzetting is bijbetaald door, onderscheidenlijk terugbetaald aan de financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.m
    text: '*risicokapitaal:* kapitaal in de vorm van aandelenkapitaal of een achtergestelde lening;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.n
    text: |-
      *reserveringsquotum:* het bedrag dat de minister op aanvraag van een financier vaststelt als maximum voor de som
      van de garanties voor verstrekkingen van risicokapitaal die:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.n.1°
    text: |-
      gedurende drie jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien het een
      eerste toekenning van een reserveringsquotum betreft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.n.2°
    text: |-
      gedurende twee jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien reeds eerder
      een reserveringsquotum is toegekend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.o
    text: '*groep:* een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.o.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van, of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.o.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:1.p
    text: |-
      *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent, in Nederland is gevestigd en daar een substantieel deel van haar activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B3.2:2.1
    text: |-
      De Staat stelt zich tegenover de financier garant voor 50% van de waarde van door de financier verstrekte niet
      converteerbare achtergestelde leningen, voor welke garantstelling de financier een provisie is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:2.2
    text: De garantie wordt verleend voor de duur van deze leningen met een maximum van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:2.3
    text: De garantstelling heeft alleen betrekking op leningen
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:2.3.a
    text: |-
      die worden verstrekt nadat de minister desgevraagd een reserveringsquotum heeft toegekend en voor zover het quotum
      nog toereikend en geldig is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:2.3.b
    text: die worden verstrekt overeenkomstig de in artikel 3 genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:2.3.c
    text: die onder de garantstelling zijn gebracht overeenkomstig de procedure van artikel 4.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:2.4
    text: |-
      Indien de financier bij de verstrekking van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, is deze overeenkomst slechts van toepassing op het gedeelte van de lening dat onder de garantstelling
      is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B3.2:3
    text: |-
      Een niet converteerbare achtergestelde lening aan een ondernemer kan onder de garantstelling van de Staat worden
      gebracht indien wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.a
    text: de rentabiliteits- en continuïteitsperspectieven van de onderneming van de ondernemer zijn bevredigend;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.b
    text: |-
      in de voorafgaande periode van twaalf maanden zijn niet meer middelen ten behoeve van derden aan de onderneming
      onttrokken dan noodzakelijk voor een redelijk te achten bedrijfsvoering en evenmin is een verplichting tot een
      zodanige onttrekking aangegaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.c
    text: |-
      de verstrekking van het risicokapitaal dient niet ter vervanging van aan een ondernemer verschaft krediet of
      risicokapitaal door dezelfde financier of door een financier die deel uitmaakt van de groep van dezelfde financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.d
    text: |-
      de waarde van de lening die aan de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan de
      groep wordt verstrekt tezamen met de waarde van risicokapitaal dat door een andere financier met toepassing van
      [hoofdstuk 3][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen, en van risicokapitaal
      dat met toepassing van [hoofdstuk 4][ref2] van de Subsidieregeling starten, groeien en overdragen van ondernemingen
      aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig wordt verstrekt, bedraagt niet meer dan
      € 5.000.000;


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: B3.2:3.e
    text: bij of in verband met het verstrekken van de lening verstrekt de financier geen andere goederen dan geld;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.f
    text: de lening draagt zelfstandig bij aan het realiseren van een actief en winstgericht beleid van de financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.g
    text: |-
      de ondernemer verplicht zich aan een door de minister als toezichthouder in de zin van de Algemene wet
      bestuursrecht aangewezen persoon of aan een door de minister aangewezen deskundige derde, voor zover deze dit
      redelijkerwijs noodzakelijk acht voor de vervulling van zijn taak:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.g.1°
    text: |-
      inlichtingen te verstrekken en inzage in zakelijke gegevens en bescheiden te verstrekken en de gelegenheid te
      bieden daarvan kopieën te maken;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.g.2°
    text: toegang te verlenen tot plaatsen niet zijnde woningen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.g.3°
    text: anderszins binnen de door hem gestelde termijn alle door hem gewenste medewerking te verlenen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.h
    text: |-
      het risicokapitaal dient niet voor de overname van een aandelenkapitaal of een converteerbare achtergestelde
      lening, behalve indien dit een concrete verbetering in het ondernemingsbeleid ten doel heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.i
    text: |-
      het risicokapitaal dient niet ter vervanging van een bestaande lening, indien dit uitsluitend ten doel heeft betere
      financieringsvoorwaarden te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.j
    text: het risicokapitaal heeft niet als doel de afwenteling van bestaande risico’s op de Staat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.k
    text: |-
      voor participatiemaatschappijen bedraagt de waarde van het risicokapitaal dat aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de waarde van het risicokapitaal
      dat door een andere participatiemaatschappij met toepassing van hoofdstuk 3 van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en van risicokapitaal dat met toepassing van hoofdstuk 4 van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen aan de ondernemer onderscheidenlijk de groep is
      verstrekt of gelijktijdig wordt verstrekt niet meer dan € 25.000.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:3.l
    text: |-
      de minister, geadviseerd door een groep deskundige derden, heeft verklaard dat is voldaan aan de voorwaarden a tot
      en met g, indien de financiering waarvoor een garantie wordt aangevraagd meer bedraagt dan € 5 miljoen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B3.2:4.1
    text: |-
      De financier stelt de Staat in kennis van een voorgenomen verstrekking van een lening met gebruikmaking van een
      formulier, overeenkomstig een model dat als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een
      kopie van de ontwerp-leningsovereenkomst en van andere bescheiden als genoemd in het model.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B3.2:4.2
    text: |-
      Indien de verstrekking van de lening naar het oordeel van de Staat voldoet aan de in artikel 3 bedoelde
      voorwaarden, geldt de garantstelling op grond van deze overeenkomst voor deze lening. De Staat bericht hierover de
      financier binnen drie weken na ontvangst van de aanmelding onder vermelding van de omvang en duur van de garantie.
      De minister kan in plaats van de provisie, genoemd in artikel 6, tweede lid, een vergoeding vaststellen, indien
      naar het oordeel van de minister de provisie te laag is in relatie tot het risico dat de Staat loopt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B3.2:4.3
    text: |-
      De garantie wordt afgegeven onder de opschortende voorwaarde dat een dienovereenkomstige, door partijen gesloten
      overeenkomst aan de Staat wordt overgelegd en dat ook dan wordt voldaan aan de in artikel 3 bedoelde voorwaarden.
      De Staat bericht hierover de financier binnen 35 dagen na ontvangst van de gesloten overeenkomst onder vermelding
      van de omvang, duur en provisie of vergoeding van de garantie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B3.2:5.1
    text: |-
      De financier draagt er voor zorg dat een actief en winstgericht beleid wordt gevoerd voor het verstrekken, beheren
      en vervreemden van leningen, waarbij rekening wordt gehouden met het belang van de Staat als garantsteller.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.2
    text: |-
      De financier draagt er voor zorg dat degenen die met het verstrekken, beheren of vervreemden van leningen zijn
      belast beschikken over de nodige deskundigheid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.3
    text: |-
      De financier staat er voor in dat degenen die zijn belast met het verstrekken, beheren of vervreemden van leningen
      en met de bepaling van en het toezicht op het beleid ter zake betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.4
    text: |-
      De financier draagt zorg voor een integere bedrijfsvoering en neemt in dat verband de noodzakelijke maatregelen om
      onder meer strafbare handelingen, verstrengeling van tegenstrijdige belangen en afhankelijkheid van de financier
      van bepaalde vennoten, aandeelhouders of andere betrokkenen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.5
    text: |-
      De financier staat er voor in dat aandeelhouders, hoofdelijk aansprakelijke vennoten, bestuurders en beheerders
      van de financier en andere zijdens de financier betrokkenen alleen medewerking verlenen aan verstrekkingen
      van risicokapitaal en krediet door een ander dan de financier aan een onderneming waaraan de financier
      een gegarandeerde lening heeft verstrekt, indien een redelijk handelend en redelijk bekwaam beheerder deze
      verstrekkingen zou hebben gedaan in het kader van een actief en winstgericht beleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.6
    text: |-
      De financier komt met een ondernemer aan wie een gegarandeerde lening is verstrekt slechts een wijziging van
      het aflossingsschema overeen na voorafgaande toestemming van de Staat, tenzij deze betrekking heeft op een
      versnelde aflossing of op een gehele of gedeeltelijke opschorting van de aflossingen gedurende ten hoogste vier
      aaneengesloten kwartalen die niet is voorafgegaan door een eerdere opschorting van de aflossingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.7
    text: 'De Staat verleent de in het zesde lid bedoelde toestemming indien aannemelijk is dat:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.7.a
    text: de ondernemer niet in staat is te voldoen aan het bestaande aflossingsschema;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.7.b
    text: |-
      adequate maatregelen worden genomen ter verbetering van de liquiditeit van de onderneming en rekening houdend met
      het belang van rentabiliteit en continuïteit van de onderneming;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.7.c
    text: |-
      rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.8
    text: |-
      De Staat kan op verzoek van de financier besluiten om de afdracht van de provisie, bedoeld in artikel 6.2, op te
      schorten in het geval dat:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.8.a
    text: er voor de financier geen mogelijkheden meer zijn om de renteverplichtingen te incasseren bij de ondernemer, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.8.b
    text: |-
      aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer
      door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de verplichtingen van bestaande
      leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.9
    text: De financier vervreemdt de lening slechts na voorafgaande toestemming van de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.10
    text: |-
      De financier verleent slechts gehele of gedeeltelijke kwijtschelding van verplichtingen voortvloeiende uit
      de leningovereenkomst, uit hoofde waarvan de gegarandeerde lening is verstrekt, na voorafgaande toestemming
      van de Staat. De Staat geeft toestemming indien de kwijtschelding noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:5.11
    text: |-
      De financier brengt slechts wijzigingen aan in de leningovereenkomst van de lening na voorafgaande toestemming
      van de Staat. De Staat kan toestemming geven indien de wijziging noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B3.2:6.1
    text: |-
      De financier aan wie de minister een reserveringsquotum heeft toegekend, is hiervoor aan de Staat een eenmalige
      provisie van 1% van dit quotum verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.2
    text: |-
      De financier is een provisie verschuldigd voor de garantie op leningen die overeenkomstig de procedure van artikel
      4 onder de garantstelling zijn gebracht. De provisie bedraagt jaarlijks
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.2.a
    text: |-
      2,5% van de gegarandeerde waarde van de lening indien deze bestaat uit een niet converteerbare achtergestelde
      lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan dezelfde ondernemer door de financier of een
      andere financier die deel uitmaakt van dezelfde groep in de vorm van een converteerbare achtergestelde lening of
      aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.2.b
    text: 3% van de gegarandeerde waarde van de lening in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.3
    text: |-
      Per kwartaal wordt een vierde deel van de in het tweede lid bedoelde provisie in rekening gebracht, uitgaand van de
      waarde van de leningen op de eerste dag van het kwartaal.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.4
    text: |-
      De in het tweede lid bedoelde provisie is verschuldigd voor de duur van de garantie of zoveel korter als zich één
      van de in artikel 8, eerste lid, genoemde omstandigheden voordoet.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.5
    text: |-
      De financier is op het tijdstip van de volledige aflossing van de lening een aanvullende provisie verschuldigd
      indien de op grond van het tweede lid voor de totale looptijd van de lening verschuldigde provisie minder bedraagt
      dan het zesvoud van de provisie die met toepassing van het tweede lid voor de helft van het geleende bedrag kan
      worden berekend, welke aanvullende provisie gelijk is aan het hiervoor bedoelde verschil.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:6.6
    text: |-
      Indien de lening binnen een termijn van zes jaar wordt afgestoten om verlies op die lening in de zin van artikel
      8, eerste lid, te beperken, kan de minister op verzoek van de financier de over de resterende termijn verschuldigde
      provisie kwijtschelden indien sprake is van klemmende redenen, gelegen in het belang van de onderneming van de
      ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B3.2:7.1
    text: |-
      De financier draagt er voor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verstrekkingen, het beheer
      en de vervreemdingen van gegarandeerde leningen en van ander risicokapitaal dat hij aan dezelfde ondernemer heeft
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.2:7.2
    text: |-
      De financier informeert de Staat binnen acht weken nadat de desbetreffende gebeurtenis heeft plaatsgevonden
      schriftelijk over wezenlijke wijzigingen in het financieringsbeleid of de organisatie van de financier en over
      wijzigingen ten aanzien van gegarandeerde leningen, waaronder
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.2:7.2.a
    text: |-
      een aflossing van een achtergestelde lening, tenzij deze aflossing overeenkomt met een aflossingsschema waarover de
      Staat eerder is geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.2:7.2.b
    text: een wijziging van de looptijd van een achtergestelde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.2:7.3
    text: De financier verstrekt de Staat jaarlijks zijn jaarverslag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.2:7.4
    text: |-
      Desgevraagd verstrekt de financier de Staat gegevens en bescheiden over de verstrekkingen,
      het beheer en de vervreemdingen van gegarandeerde leningen en van ander risicokapitaal dat
      hij aan dezelfde ondernemer heeft verstrekt, en de jaarrekeningen van de ondernemingen waaraan
      risicokapitaal is verstrekt, vergezeld van desbetreffende accountantsverklaringen als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] of een mededeling waarom deze ontbreekt, en
      van de bijbehorende toelichtingen voor het bestuur van de onderneming. .


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: B3.2:7.5
    text: |-
      De financier doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surséance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B3.2:8.1
    text: 'De financier kan een beroep doen op de garantie indien hij op een gegarandeerde lening verlies lijdt:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.1.a
    text: bij gehele of gedeeltelijke vervreemding van de lening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.1.b
    text: door gehele of gedeeltelijke kwijtschelding van de lening door de financier;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.1.c
    text: door het onvermogen van de ondernemer om de lening af te lossen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.1.d
    text: |-
      als gevolg van een faillietverklaring, een surséance van betaling of een van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan de lening is verstrekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.1.e
    text: |-
      indien het risicokapitaal een achtergestelde lening betreft, bij een in kracht van gewijsde gegane homologatie
      van een akkoord na de faillietverklaring, na de verlening van surséance van betaling of na het van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan de lening
      is verstrekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.1.f
    text: indien de ondernemer een rechtspersoon is, bij ontbinding van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.2
    text: |-
      De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien in de voorafgaande
      periode van twaalf maanden meer middelen aan de MKB-onderneming zijn onttrokken ten behoeve van derden dan
      noodzakelijk voor een redelijk te achten bedrijfsvoering, dan wel een verplichting tot een zodanige onttrekking is
      aangegaan, mits de financier hieraan op enigerlei wijze medewerking heeft verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.3
    text: 'Bij verlies ingevolge vervreemding van een lening geldt de garantie alleen indien de vervreemding:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.3.a
    text: |-
      niet eerder dan twee jaar na de verstrekking ervan heeft plaatsgevonden, tenzij de Staat desgevraagd met
      vervreemding binnen deze termijn heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.3.b
    text: gebeurt tegen een prijs die past in het voeren van een actief en winstgericht beleid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.3.c
    text: |-
      voor zover de financier daarbij de lening geheel of voor een deel overdraagt aan één van zijn aandeelhouders,
      hoofdelijk aansprakelijke vennoten, bestuurders, beheerders of andere betrokkenen, gebeurt tegen een prijs die is
      gebaseerd op een taxatie van twee onafhankelijke deskundigen, dan wel gepaard gaat met vervreemding van ten minste
      een derde deel van de lening aan onafhankelijke derden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.4
    text: |-
      Bij verlies ingevolge gehele of gedeeltelijke kwijtschelding van een lening geldt de garantie alleen indien
      de kwijtschelding noodzakelijk is voor de continuïteit van de onderneming waarvoor de lening is verstrekt en
      indien rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.5
    text: |-
      Als onvermogen van de ondernemer om de lening af te lossen, bedoeld in het eerste lid, onder c, wordt aangemerkt de
      situatie waarin
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.5.a
    text: de ondernemer niet in staat is te voldoen aan zijn betalingsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.5.b
    text: |-
      aannemelijk is dat de ondernemer in de eerstvolgende jaren niet in staat zal zijn te voldoen aan zijn
      betalingsverplichtingen; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.5.c
    text: |-
      aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder
      meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande
      leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.6
    text: |-
      Verlies als gevolg van faillietverklaring, een verlening van surséance van betaling of een van toepassing verklaren
      van de schuldsaneringsregeling natuurlijke personen, bedoeld in het eerste lid, aanhef en onder d, wordt aanwezig
      geacht
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.6.a
    text: |-
      voor zover aannemelijk is dat de financier bij het einde van het faillissement, van de surséance onderscheidenlijk
      van de toepassing van de schuldsaneringsregeling een verlies als bedoeld in het achtste lid zal leiden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.6.b
    text: mits aannemelijk is dat rekening is gehouden met het belang van de Staat als garantsteller.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.7
    text: |-
      De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien de financier tekort
      is geschoten bij de naleving van verplichtingen op grond van deze overeenkomst of indien de financier niet kan
      aantonen die maatregelen te hebben genomen die een redelijk handelend en redelijk bekwaam beheerder zou hebben
      genomen in het kader van een actief en winstgericht beleid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.8
    text: |-
      Het verlies wordt berekend op basis van de waarde van de lening of, indien het verlies slechts op een deel van de
      lening is geleden, het hiermee overeenkomende deel van die waarde, in een voorkomend geval verminderd met:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.8.a
    text: 'in geval van vervreemding: de prijs waarvoor die vervreemding heeft plaatsgevonden;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.8.b
    text: 'in geval van ontbinding: de liquidatie-uitkering; of'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.8.c
    text: |-
      in geval van homologatie van een akkoord als bedoeld in het eerste lid, onder e, de in het kader van het akkoord
      voor de lening verrichte uitkering.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.9
    text: |-
      Indien de financier meermalen gegarandeerde leningen aan een ondernemer heeft verstrekt en slechts op een deel
      daarvan verlies lijdt, wordt het verlies geacht te zijn geleden op de lening dat de financier het eerst heeft
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:8.10
    text: |-
      Indien de financier aan een ondernemer leningen heeft verstrekt die slechts ten dele onder de garantstelling zijn
      gebracht en slechts op een deel daarvan verlies lijdt, wordt het verlies, onverminderd het zesde lid, naar rato
      toegerekend aan de leningen die onder de garantstelling zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B3.2:9.1
    text: |-
      De financier verzoekt de Staat binnen zes maanden nadat zich de in artikel 8, eerste lid, bedoelde situatie heeft
      voorgedaan om betaling op grond van de garantie met gebruikmaking van een formulier, overeenkomstig een model dat
      als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een kopie van de vervreemdingsovereenkomst, de
      inschrijving in het register van de ontbinding van de rechtspersoon of van de in artikel 8, eerste lid, onder c,
      bedoelde akkoorden en van andere bescheiden als genoemd in het model.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B3.2:9.2
    text: |-
      Indien naar het oordeel van de Staat sprake is van een verlies als bedoeld in artikel 8, maakt de financier
      aanspraak op betaling van 50% van het geleden verlies, tenzij de financier in gebreke is gebleven bij de
      naleving van deze overeenkomst.. De Staat bericht hierover de financier binnen dertien weken na ontvangst van het
      betalingsverzoek onder vermelding van het te betalen bedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B3.2:10
    text: |-
      Alle betalingen in verband met deze overeenkomst door de financier geschieden door overmaking van de betreffende
      bedragen naar rekeningnummer PM PMxxxxx bij de ---financier, ten name van SenterNovem, onder vermelding van het
      PM PM---nummer
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B3.2:11.1
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra blijkt dat de financier
      zodanig onjuiste of onvolledige informatie heeft verschaft dat de Staat op een verzoek om betaling een andere
      beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B3.2:11.2
    text: |-
      Indien vanwege een verlies als bedoeld in artikel 8, eerste lid, onderdeel c of d, een uitkering op grond van
      de garantie heeft plaatsgevonden, is de financier verplicht 50% van de aflossingen die na de uitkering worden
      verricht, uit te betalen aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B3.2:12.1
    text: De Staat is gerechtigd deze overeenkomst schriftelijk op te zeggen indien
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.2:12.1.a
    text: de financier tekort schiet bij de nakoming van één van zijn verplichtingen uit hoofde van deze overeenkomst;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.2:12.1.b
    text: |-
      ten aanzien van de financier een verzoek bij de rechtbank is ingediend tot verlening van surseance van betaling,
      een verzoek tot faillietverklaring of een verzoek tot van toepassing verklaring van de schuldsaneringsregeling
      natuurlijke personen of een buitengerechtelijk akkoord aan crediteuren wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.2:12.1.c
    text: de financier, in geval deze rechtspersoonlijkheid heeft, is ontbonden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.2:12.1.d
    text: |-
      de bepalingen in [hoofdstuk 3][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen niet
      langer verenigbaar zijn met de regels van de Europese Gemeenschappen ten aanzien van staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '3'
  - number: B3.2:12.2
    text: |-
      Een opzegging op grond van het eerste lid, onder a, geschiedt uitsluitend nadat de Staat de financier op de hoogte
      heeft gesteld van het voornemen tot opzegging en nadat deze in de gelegenheid is gesteld om een tekortschieten dat
      hersteld kan worden te herstellen binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.2:12.3
    text: |-
      Een opzegging in verband met de in het eerste lid, onder d, bedoelde omstandigheid heeft geen gevolgen voor de
      verplichtingen ten aanzien van verstrekkingen van risicokapitaal die voor het tijdstip van de opzegging onder de
      garantstelling zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B3.2:13.1
    text: |-
      Ieder geschil ten aanzien van deze overeenkomst zal bij uitsluiting worden voorgelegd aan de daartoe bevoegde
      rechter in het arrondissement Den Haag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B3.2:13.2
    text: Op deze overeenkomst is Nederlands recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B3.2:14
    text: |-
      Schriftelijke stukken ter uitvoering van deze overeenkomst bestemd voor de onder 1 gemelde partij worden gericht
      aan Ministerie van Economische Zaken, SenterNovem, Juliana van Stolberglaan 3, Den Haag. Schriftelijke stukken ter
      uitvoering van deze overeenkomst bestemd voor de onder 2 gemelde partij worden gericht aan .....
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
  - number: B3.2:15
    text: Deze overeenkomst treedt in werking door de ondertekening daarvan door de partijen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel15
  - number: B4.2:1
    text: 'In deze overeenkomst wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.a
    text: '*minister:* de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.b
    text: '*kapitaalvennootschap:*'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.b.1°
    text: |-
      een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG](31968L0151) van de Raad van
      9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken (PB
      EG L 65), of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.b.2°
    text: |-
      een kapitaalvennootschap die ten tijde van de eerste verstrekking van risicodragend kapitaal op grond van deze
      regeling is ingericht naar het recht van één van de lidstaten van de Europese Unie, die rechtspersoonlijkheid
      bezit, een apart vermogen heeft dat bij uitsluiting voor de schulden van de vennootschap kan worden aangesproken
      en op grond van haar nationale wetgeving onderworpen is aan garantievoorwaarden zoals bedoeld in [Richtlijn 68/151/
      EEG](31968L0151) van de Raad om de belangen van zowel deelgerechtigden als derden te beschermen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.c
    text: '*technostarter*: een rechtspersoon die een onderneming drijft:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.c.1°
    text: |-
      die voor eigen rekening en risico producten, processen of diensten – niet zijnde adviezen – verkoopt en levert, die
      zijn gebaseerd op een nieuwe technische vinding of een nieuwe toepassing van bestaande technologie, of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.c.2°
    text: |-
      die deel uitmaakt van één van de creatieve sectoren en die voor eigen rekening en risico producten, processen of
      diensten – niet zijnde adviezen – verkoopt en levert, die zijn gebaseerd op een nieuwe creatieve vinding of een
      nieuwe toepassing van een bestaande creatieve vinding; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.c.3°
    text: die ten hoogste vijf jaar geleden is ingeschreven in het handelsregister; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.c.4°
    text: |-
      die ten tijde van de eerste verstrekking van risicodragend kapitaal op grond van dit hoofdstuk voldoet aan de
      definitie van middelgrote, kleine of micro-ondernemingen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.d
    text: '*technostartervennootschap:* een technostarter die'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.d.1°
    text: een onderneming drijft in de vorm van een kapitaalvennootschap, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.d.2°
    text: zijn primaire bedrijfsactiviteiten in Nederland uitvoert,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.e
    text: '*achtergestelde vordering:* een vordering van het startersfonds ten laste van een technostartervennootschap'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.e.1°
    text: die het startersfonds heeft verkregen door aan de technostartervennootschap geld ter leen te verstrekken,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.e.2°
    text: die niet door enige vorm van zekerheid is gedekt, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.e.3°
    text: |-
      waarop de debiteur krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding, een
      akkoord na verlening van surséance van betaling of een akkoord in faillissement van de debiteur, eerst verplicht
      is rente en aflossing te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn voldaan,
      met uitzondering van de schulden die voortvloeien uit leningen waaraan een bepaling van gelijke aard als voornoemde
      bepaling is verbonden,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.e.4°
    text: |-
      terwijl ingevolge de vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan van alle rechten tot
      verrekening van de rente en aflossing;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.f
    text: '*groep:* een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.f.1°
    text: |-
      een natuurlijke persoon of rechtspersoon, die direct of indirect: - meer dan de helft van het geplaatste kapitaal
      verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.f.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.g
    text: '*participatie:* risicodragend kapitaal in de vorm van'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.g.1°
    text: |-
      aandelen in het kapitaal van een technostartervennootschap die het startersfonds rechtstreeks van de
      technostartervennootschap heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van een
      achtergestelde vordering; of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.g.2°
    text: |-
      aandelen in het kapitaal van een technostartervennootschap als bedoeld onder 1° in combinatie met een
      achtergestelde vordering;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.h
    text: |-
      *verkrijgingsprijs van een participatie:* het bedrag in geld waarvoor het startersfonds de participatie heeft
      verkregen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.i
    text: |-
      *fondsplan:* een plan van het startersfonds tot uitvoering van een met elkaar samenhangend geheel van activiteiten
      die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de desbetreffende
      technostartervennootschappen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.j
    text: |-
      *investeringsperiode:* de periode gedurende welke het startersfonds activiteiten verricht ter verkrijging van
      participaties;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.k
    text: |-
      *investeringsbudget:* de financiële middelen die het startersfonds beschikbaar heeft of zal hebben en die bestemd
      zijn om de verkrijgingsprijs van participaties te voldoen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.l
    text: |-
      *inkomsten:* alle op geld waardeerbare voordelen die het startersfonds heeft uit de participatie, waaronder
      dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen de
      participatie door de desbetreffende technostartervennootschap is ingekocht of terugbetaald en de liquidatie-
      uitkering;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.m
    text: |-
      *beheerskosten:* alle kosten die het startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartervennootschappen, uitgezonderd de
      verkrijgingsprijs van de participaties;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.n
    text: '*fondspartij:* een aandeelhouder of hoofdelijk aansprakelijk vennoot van het startersfonds;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.o
    text: |-
      *eigen bijdrage:* de geldelijke middelen die door de fondspartijen in het investeringsfonds zijn ingebracht en die
      daadwerkelijk zijn gebruikt voor het verkrijgen van participaties;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:1.p
    text: |-
      *referentierente:* de referentierentevoet, bedoeld in de Mededeling van de Commissie over de methode waarmee de
      referentie- en disconteringspercentages worden vastgesteld(PbEG 1997, C 273), zoals laatstelijk vastgesteld voor
      Nederland, en vermeerderd met 4%.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1
  - number: B4.2:2.1
    text: |-
      De Staat verstrekt het startersfonds voor het verkrijgen van participaties een renteloze geldlening tot een bedrag
      van €..........., ...., met een looptijd van .... jaar, gegeven een investeringsbudget van €..........., .....
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B4.2:2.2
    text: |-
      De Staat kan de in het eerste lid genoemde termijn op verzoek van het startersfonds verlengen indien daarvoor
      zwaarwegende economische redenen zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B4.2:2.3
    text: |-
      Het startersfonds kan bedragen in contanten opnemen, telkens indien het startersfonds een betaling verricht ter
      verkrijging van een participatie, voor zover het totaal van de opgenomen bedragen niet hoger is dan het maximale
      bedrag van de geldlening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B4.2:2.4
    text: |-
      Telkens indien het startersfonds inkomsten heeft verkregen uit een participatie boekt het een deel van deze
      inkomsten over aan de Staat, overeenkomstig het bepaalde in artikel 5.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B4.2:2.5
    text: |-
      Het startersfonds is niet gehouden de uitstaande hoofdsom af te lossen, anders dan door de overboekingen bedoeld in
      het vierde lid.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2
  - number: B4.2:3.1
    text: |-
      Indien het startersfonds een participatie heeft verkregen na de indiening van de aanvraag om subsidie op grond van
      [hoofdstuk 4][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen en over gaat of over
      is gegaan tot betaling aan de technostartervennootschap van de verkrijgingsprijs of van een deel daarvan, verricht
      de Staat op verzoek van het fonds een betaling aan het fonds ter hoogte van dat bedrag vermenigvuldigd met het
      percentage dat het maximale bedrag van de geldlening vormt van het investeringsbudget, met dien verstande dat de
      middelen die door een startersfonds per half jaar aan een technostartervennootschap worden verstrekt ten hoogste €
      500.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: B4.2:3.2
    text: |-
      Het startersfonds doet het verzoek om betaling met gebruikmaking van een formulier, overeenkomstig een model
      dat als bijlage 1 bij deze overeenkomst is gevoegd, onder bijvoeging van de overeenkomst tot verkrijging van de
      participatie en van andere bescheiden als genoemd in het model.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B4.2:3.3
    text: |-
      De Staat verricht de betaling binnen twee weken na ontvangst van het verzoek om betaling, tenzij hij van oordeel
      is dat het startersfonds niet heeft voldaan aan de ingevolge deze overeenkomst voor hem geldende verplichtingen,
      dan wel indien het startersfonds failliet is verklaard of aan het fonds surséance van betaling is verleend of ten
      aanzien van fonds de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een verzoek
      daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B4.2:3.4
    text: |-
      De Staat bericht het startersfonds na afloop van de investeringsperiode wat het totale bedrag is dat op grond van
      deze overeenkomst is opgenomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3
  - number: B4.2:4.1
    text: |-
      Indien het startersfonds inkomsten heeft uit een participatie, wordt daarvan een deel binnen een maand overgeboekt
      aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.2
    text: |-
      Het deel van de inkomsten dat aan de Staat wordt overgeboekt verschilt al naar gelang de inkomsten worden ontvangen
      in één van de volgende perioden:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.2.a
    text: |-
      periode A: vanaf het totstandkomen van deze overeenkomst tot het tijdstip waarop het totaal van de door het
      startersfonds uit de participaties verkregen inkomsten na aftrek van het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan de eigen bijdrage voor de verkregen participaties;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.2.b
    text: |-
      periode B: vanaf het onder a bedoelde tijdstip tot het tijdstip dat het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan het totaal op grond van de leningsovereenkomst opgenomen bedrag;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.2.c
    text: |-
      periode C: vanaf het tijdstip dat het totaal van de aan de Staat overgeboekte bedragen gelijk is aan het totaal op
      grond van de leningsovereenkomst opgenomen bedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.3
    text: Het deel van de inkomsten dat aan de Staat wordt overgeboekt is
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.3.a
    text: |-
      in periode A: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het maximale
      bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van de Staat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.3.b
    text: |-
      in periode B: 50 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het maximale
      bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van de Staat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.3.c
    text: |-
      in periode C: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het maximale
      bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.4
    text: |-
      Telkens indien het startersfonds een bedrag overboekt aan de Staat, informeert het de Staat over de aard van de
      inkomsten met gebruikmaking van een formulier, overeenkomstig een model, dat als bijlage 2 bij deze overeenkomst
      is gevoegd, onder bijvoeging van bescheiden als genoemd in het model, waaronder in geval van inkomsten uit
      vervreemding van de participatie de overeenkomst tot vervreemding van de participatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.5
    text: |-
      Indien het startersfonds inkomsten heeft uit een participatie die niet bestaan uit een geldsom, maakt het deze
      inkomsten te gelde voor het verloop van de in artikel 2, eerste lid, genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.6
    text: |-
      Zodra de in het vijfde lid bedoelde inkomsten te gelde zijn gemaakt, boekt het startersfonds het in overeenstemming
      met het derde lid bepaalde deel van deze gelden over aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:4.7
    text: |-
      Op verzoek van de Staat verstrekt het startersfonds een accountantsverklaring dat het startersfonds bij de
      verkrijging, het bezit of de vervreemding van de participatie waaruit inkomsten aan de Staat zijn overgeboekt, in
      overeenstemming met deze overeenkomst heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4
  - number: B4.2:5.1
    text: |-
      Het startersfonds hanteert bij het verkrijgen van participaties in technostartervennootschappen de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.a
    text: |-
      de participaties worden verkregen gedurende een investeringsperiode van ten hoogste zes jaar, en deze worden
      uiterlijk zes jaar na afloop van de investeringsperiode vervreemd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.b
    text: |-
      de totale verkrijgingsprijs van de participaties die gedurende de investeringsperiode in één
      technostartervennootschap worden verkregen, bedraagt ten minste € 100.000 en ten hoogste € 2.500.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.c
    text: |-
      de gemiddelde totale verkrijgingsprijs van de participaties die een startersfonds gedurende de investeringsperiode
      per technostartervennootschap verkrijgt, bedraagt over alle technostartervennootschappen genomen ten hoogste
      € 800.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.d
    text: |-
      de relatieve omvang van achtergestelde vorderingen wordt zodanig beperkt dat ten hoogste 35% van het totaal van de
      verkrijgingsprijzen van de participaties betrekking heeft op achtergestelde vorderingen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.e
    text: voor achtergestelde vorderingen wordt een rente bedongen die ten minste gelijk is aan de referentierente;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.f
    text: |-
      de participaties worden verkregen in technostartervennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.1.g
    text: |-
      bij de beslissing van het startersfonds inzake de verkrijging van een participatie wordt rekening gehouden met het
      ondernemingsplan van de desbetreffende technostartervennootschap.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.2
    text: |-
      Bij of in verband met het verkrijgen van een participatie verstrekt het startersfonds geen andere goederen dan
      geld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.3
    text: |-
      Het startersfonds verkrijgt geen participatie in een technostartervennootschap indien in de voorafgaande periode
      van twaalf maanden meer middelen aan de technostartervennootschap zijn onttrokken ten behoeve van derden dan
      noodzakelijk voor een redelijk te achten bedrijfsvoering, dan wel een verplichting tot een zodanige onttrekking
      is aangegaan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.4
    text: |-
      Het startersfonds verkrijgt geen participatie in een technostartervennootschap indien een ander investeringsfonds
      in deze vennootschap reeds een participatie heeft, behoudens
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.4.a
    text: |-
      indien dit investeringsfonds een ander startersfonds is en voor zover als gevolg van de nieuwe participatie het in
      het eerste lid, onder b, bedoelde maximum niet wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.4.b
    text: indien dit investeringsfonds
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.4.b.1°
    text: |-
      de vorm heeft van een kapitaalvennootschap of een vennootschap met een afgescheiden vermogen, ingericht naar het
      recht van één van de andere lidstaten van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.4.b.2°
    text: |-
      blijkens de akte waarbij de statuten van de vennootschap zijn vastgesteld of blijkens de overeenkomst waarbij
      de vennootschap is aangegaan uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan
      technostartervennootschappen teneinde winst te behalen; en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.4.b.3°
    text: |-
      naar het oordeel van de minister niet in staat is nieuwe participaties in de technostartervennootschap te
      verkrijgen,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.5
    text: |-
      Het startersfonds verkrijgt of behoudt geen participatie in de vennootschap van een technostarter indien een
      fondspartij, bestuurder of een beheerder of andere betrokkene bij het startersfonds een bedrijf uitoefent dat
      gelijk of verwant is aan het bedrijf van de technostarter terwijl tussen beide bedrijven een vaste afnemersrelatie
      bestaat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.6
    text: |-
      Het startersfonds brengt voor het verkrijgen van participaties eigen geldelijke middelen in het investeringsbudget
      in tot ten hoogste €...........euro.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:5.7
    text: Het startersfonds verricht geen andere activiteiten dan de uitvoering van het fondsplan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5
  - number: B4.2:6.1
    text: |-
      Het startersfonds vervreemdt een participatie niet eerder dan twee jaar na de verkrijging ervan, tenzij de Staat
      desgevraagd met vervreemding binnen deze termijn heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B4.2:6.2
    text: Het startersfonds draagt ervoor zorg dat vervreemding van een participatie gebeurt tegen een marktconforme prijs.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B4.2:6.3
    text: |-
      Indien het startersfonds een participatie geheel of voor een deel vervreemdt aan één van zijn fondspartijen,
      bestuurders, beheerders of andere betrokkenen, draagt het er voor zorg dat ten minste een derde deel van de
      participatie wordt vervreemd aan onafhankelijke derden dan wel dat de prijs waartegen de vervreemding plaats vindt,
      is gebaseerd op een taxatie van twee onafhankelijke deskundigen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6
  - number: B4.2:7.1
    text: |-
      Het startersfonds voert het fondsplan uit, voert daarbij een actief en winstgericht beleid voor het verkrijgen,
      behouden en beëindigen van participaties en begeleidt in dat kader technostartervennootschappen waarin een
      participaties is verkregen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:7.2
    text: |-
      Het startersfonds hanteert een expliciete gedragslijn om het ontstaan van belangenverstrengeling te voorkomen en
      neemt ook overigens de in dit verband noodzakelijke maatregelen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:7.3
    text: |-
      Desgewenst kan een door de minister daartoe gemachtigde persoon als toehoorder deelnemen aan overleg van een orgaan
      van het startersfonds over de uitvoering van het fondsplan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:7.4
    text: |-
      Het startersfonds staat er voor in dat fondspartijen, bestuurders, beheerders of andere betrokkenen bij
      een startersfonds geen medewerking verlenen aan investeringen door een ander dan het startersfonds in een
      technostartervennootschap waarin het startersfonds een participatie heeft verkregen, indien deze investeringen niet
      tegen marktconforme voorwaarden plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:7.5
    text: |-
      Het startersfonds bedingt van technostarters die in verband met participaties worden geadviseerd of begeleid geen
      vergoeding voor deze advisering respectievelijk begeleiding die hoger is dan hetgeen in de markt gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:7.6
    text: |-
      Het startersfonds richt het beheer zodanig in dat de jaarlijkse beheerskosten ten hoogste 5% van het
      investeringsbudget bedragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:7.7
    text: De fondsbeheerder verkrijgt voor zijn werkzaamheden een beloning die afhankelijk is van zijn individuele prestatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7
  - number: B4.2:8.1
    text: |-
      Het startersfonds draagt ervoor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verkrijging, het beheer en
      de vervreemding van participaties, over de inkomsten uit deze participaties, over de ondernemingsresultaten van de
      desbetreffende technostarters en over de kosten van het fondsbeheer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B4.2:8.2
    text: |-
      Het startersfonds informeert steeds na afloop van een periode van zes maanden de Staat schriftelijk
      over de voorstellen voor participaties die in de voorafgaande periode van zes maanden zijn ontvangen van
      technostartervennootschappen en over de besluitvorming die hierover bij het startersfonds heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B4.2:8.3
    text: |-
      Het startersfonds brengt steeds binnen zes maanden na afloop van een periode van twaalf maanden aan de Staat
      schriftelijk verslag uit over de uitvoering van het fondsplan, met in het bijzonder een overzicht over de verkregen
      en de vervreemde participaties, de gerealiseerde verkrijgingsprijzen, de beheerskosten en de inkomsten, welk
      verslag vergezeld gaat van een accountantsverklaring die is opgesteld overeenkomstig een model dat als bijlage
      3 bij deze overeenkomst is gevoegd, en met gebruikmaking van een controleprotocol dat als bijlage 4 bij deze
      overeenkomst is gevoegd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B4.2:8.4
    text: |-
      Desgevraagd verstrekt het startersfonds de Staat gegevens en bescheiden over het beheer van het fonds en de
      verkregen participaties.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B4.2:8.5
    text: |-
      Na afloop van de looptijd van deze overeenkomst brengt het startersfonds een eindverslag uit omtrent de uitvoering
      en de resultaten van het fondsplan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B4.2:8.6
    text: |-
      De Staat bericht het startersfonds na afloop van de looptijd van deze overeenkomst of het startersfonds naar
      zijn oordeel bij het verkrijgen en vervreemden van participaties in overeenstemming met deze overeenkomst heeft
      gehandeld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8
  - number: B4.2:9.1
    text: |-
      Het startersfonds zal tijdens de looptijd van deze overeenkomst haar statuten of de overeenkomst waarbij zij is
      aangegaan niet wijzigen dan wel meewerken aan vermindering van haar kapitaal of aan een vermindering van het aantal
      aandeelhouders of hoofdelijk aansprakelijke vennoten die niet behoren tot dezelfde groep tot minder dan drie,
      tenzij de Staat desgevraagd hiermee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B4.2:9.2
    text: |-
      Het startersfonds doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surseance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9
  - number: B4.2:10.1
    text: De Staat is gerechtigd deze overeenkomst schriftelijk op te zeggen indien
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:10.1.a
    text: het startersfonds tekort schiet bij de nakoming van één van zijn verplichtingen uit hoofde van deze overeenkomst;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:10.1.b
    text: |-
      het aantal aandeelhouders of hoofdelijk aansprakelijke vennoten die niet behoren tot dezelfde groep kleiner is
      geworden dan drie, behoudens voor zover de Staat desgevraagd hiermee heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:10.1.c
    text: |-
      ten aanzien van het startersfonds een verzoek bij de rechtbank is ingediend tot verlening van surseance
      van betaling, een verzoek tot faillietverklaring of een verzoek tot van toepassing verklaring van de
      schuldsaneringsregeling natuurlijke personen of een buitengerechtelijk akkoord aan crediteuren wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:10.1.d
    text: het startersfonds is ontbonden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:10.1.e
    text: |-
      [hoofdstuk 4][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen niet langer
      verenigbaar is met de regels van de Europese Gemeenschappen ten aanzien van staatssteun.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: B4.2:10.2
    text: |-
      Een opzegging op grond van het eerste lid, onder a en b, geschiedt uitsluitend nadat de Staat het startersfonds
      op de hoogte heeft gesteld van het voornemen tot opzegging en nadat deze in de gelegenheid is gesteld om een
      tekortschieten dat hersteld kan worden te herstellen binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:10.3
    text: |-
      Bij een opzegging als bedoeld in het eerste lid, onder a, b en c, kan de Staat van het startersfonds het totale
      bedrag dat hij overeenkomstig artikel 3 aan het startersfonds heeft betaald, verminderd met het bedrag dat het
      startersfonds overeenkomstig artikel 5 aan hem heeft overgeboekt, direct opeisen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel10
  - number: B4.2:11.1
    text: |-
      Ieder geschil ten aanzien van deze overeenkomst zal bij uitsluiting worden voorgelegd aan de daartoe bevoegde
      rechter in het arrondissement Den Haag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B4.2:11.2
    text: Op deze overeenkomst is Nederlands recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel11
  - number: B4.2:12
    text: |-
      Schriftelijke stukken ter uitvoering van deze overeenkomst bestemd voor de onder 1 gemelde partij worden
      gericht aan Ministerie van Economische Zaken, TechnoPartner, SenterNovem, Juliana van Stolberglaan 3, Den Haag.
      Schriftelijke stukken ter uitvoering van deze overeenkomst bestemd voor de onder 2 gemelde partij worden gericht
      aan .....
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel12
  - number: B4.2:13
    text: |-
      Alle betalingen in verband met deze overeenkomst door het startersfonds geschieden door overmaking van de
      betreffende bedragen naar rekeningnummer 19.23.24.217 bij de Rabobank, ten name van TechnoPartner/SenterNovem,
      onder vermelding van het projectnummer
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel13
  - number: B4.2:14
    text: Deze overeenkomst treedt in werking door de ondertekening daarvan door de partijen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel14
