    text: de aanvraag om subsidie niet is ontvangen binnen zes maanden na de datum van de beschikking tot subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.1.c
    text: |-
      aan de MKB-ondernemer reeds subsidie is verstrekt voor het treffen van één of meer veiligheidsmaatregelen die in
      dezelfde veiligheidsscan zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3
    text: |-
      In afwijking van het eerste lid, onder a, wordt de aanvraag niet afgewezen, indien voor de uitgevoerde
      veiligheidsscan subsidie is verstrekt door de Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3
    text: 'De minister beslist afwijzend op een aanvraag voor zover:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3.a
    text: een veiligheidsmaatregel wettelijk niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3.b
    text: |-
      de veiligheidsmaatregelen niet zijn getroffen ten behoeve van de bedrijfsuitoefening van de MKB-ondernemer in
      Nederland;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3.c
    text: de veiligheidsmaatregelen geen betrekking hebben op de bedrijfsuitoefening van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3.d
    text: |-
      de veiligheidsadviseur betrokken is bij de verwezenlijking van de in zijn veiligheidsscan opgenomen
      veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3.e
    text: |-
      een veiligheidsmaatregel bestaat uit het plaatsen van een camerabewakingsysteem zonder bijbehorend door de
      leverancier of installateur voor de vestiging opgesteld organisatorisch plan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3.f
    text: |-
      de MKB-ondernemer voorafgaand aan de veiligheidsscan een verplichting is aangegaan met betrekking tot een
      veiligheidsmaatregel waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.11
  - number: 9.11.3
    text: |-
      De afwijzingsgronden, genoemd in [artikel 23, onderdelen b, c, d, e, f en h, van het Kaderbesluit EZ-subsidies][ref1]
      zijn niet van toepassing.


