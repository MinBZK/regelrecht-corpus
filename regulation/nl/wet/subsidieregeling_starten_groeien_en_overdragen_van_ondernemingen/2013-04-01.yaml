      kredietinstelling in de zin van de [Wet financiële markten BES][ref1] is opgenomen in [bijlage 2.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0024902
