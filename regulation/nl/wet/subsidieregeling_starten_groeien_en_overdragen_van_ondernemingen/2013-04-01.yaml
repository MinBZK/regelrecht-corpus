        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0024902
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *aandelenkapitaal:* de aandelen in het kapitaal van een onderneming van
      een ondernemer, die de financier rechtstreeks van de ondernemer heeft verkregen tegen volstorting van die aandelen
      in geld, of door omzetting van een achtergestelde lening;
        - a. een lening van geld door een financier aan een ondernemer met het oog op de financiering door deze onderneming
      van eigen activiteiten, 1°. welke lening niet door enige vorm van zekerheid is gedekt, met uitzondering van een
      borgstelling die een aandeelhouder in de onderneming van de ondernemer op persoonlijke titel heeft gegeven, 2°.
      waarop de ondernemer krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding,
      een akkoord na verlening van surseance van betaling, een akkoord in faillissement of een akkoord na het van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan
      de achtergestelde lening is verstrekt, eerst verplicht is de niet vervallen aflossingen te betalen nadat alle
      andere op dat moment bestaande schulden van de debiteur zijn voldaan, met uitzondering van schulden ingevolge
      vorderingen waaraan een bepaling van gelijke aard als voornoemde bepaling zijn verbonden en ingevolge geldleningen
      die zijn verstrekt door aandeelhouders in de onderneming van de ondernemer en 3°. ten aanzien waarvan de
      financier in de vorenbedoelde akte van geldlening afstand heeft gedaan van alle rechten tot verrekening van de
      niet vervallen aflossingen of b. een lening van geld door een financier aan een ondernemer die een rechtspersoon
      is wiens activa slechts bestaan uit deelnemingen in of vorderingen op een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1], met het oog op financiering door deze ondernemer van
      activiteiten van deze dochtermaatschappij, 1°. welke lening niet door enige vorm van zekerheid is gedekt, met
      uitzondering van een persoonlijke borgstelling van een aandeelhouder in de onderneming van de ondernemer en van een
      pandrecht gevestigd op aandelen in de dochtermaatschappij en 2°. ten aanzien waarvan de financier in de akte van
      geldlening afstand heeft gedaan van alle rechten tot verrekening van de niet vervallen aflossingen;
        - *reserveringsquotum:* het bedrag dat de minister op aanvraag van een financier vaststelt als maximum voor de
      som van de garanties voor verstrekkingen van risicokapitaal die: 1°. gedurende drie jaar vanaf de datum van de
      beschikking aan de financier kunnen worden verschaft indien het een eerste toekenning van een reserveringsquotum
      betreft; 2°. gedurende twee jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien
      reeds eerder een reservingsquotum is toegekend;
        - *risicokapitaal:* kapitaal in de vorm van aandelenkapitaal of een achtergestelde lening;
        - *waarde van aandelenkapitaal:* het bedrag in geld dat de financier bij de volstorting van de aandelen heeft
      betaald dan wel, in geval van omzetting van een achtergestelde lening, of een deel daarvan, in aandelenkapitaal, de
      waarde van de uitstaande lening voor zover die is omgezet in aandelen, vermeerderd onderscheidenlijk verminderd met
      het bedrag in geld dat wegens de omzetting is bijbetaald door, onderscheidenlijk terugbetaald aan de financier;
        - *waarde van een achtergestelde lening:* het nog niet afgeloste deel van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 3.2.1
    text: |-
      De minister verstrekt op aanvraag subsidie aan een financier, niet zijnde een startersfonds als bedoeld in
      [artikel 4.1][ref1], voor het verstrekken van risicokapitaal aan een ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.2.2
    text: |-
      De subsidie wordt verstrekt in de vorm van een garantstelling voor de terugbetaling van risicokapitaal dat de
      financier op grond van een overeenkomst aan een ondernemer heeft verstrekt voor de duur de overeenkomst met een
      maximum van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.2
  - number: 3.2.3
    text: |-
      De garantstelling heeft slechts betrekking op risicokapitaal dat wordt verstrekt nadat de minister desgevraagd een
      reserveringsquotum heeft toegekend en voor zover het quotum toereikend en geldig is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.2
  - number: 3.2.4
    text: |-
      In aanvulling op het eerste lid kan de minister ook subsidie verstrekken aan een financier voor het verstrekken van
      risicokapitaal aan een ondernemer die gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.2
  - number: 3.2.5
    text: |-
      Voor de toepassing van het vierde lid wordt als financier aangewezen een kredietinstelling in de zin van de
      [Wet financiële markten BES][ref1] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius of Saba het
      bedrijf van kredietinstelling uit te oefenen, of een in Bonaire, Sint Eustatius of Saba gevestigde vennootschap in
      de vorm van een kapitaalvennootschap of een vennootschap met een afgescheiden vermogen die blijkens haar statuten
      of blijkens de overeenkomst waarbij zij is aangegaan tot doel heeft of mede tot doel heeft het verstrekken van
      risicokapitaal aan ondernemers teneinde winst te behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 3.3.1
    text: |-
      De financier verstrekt geen risicokapitaal aan een ondernemer wier activiteiten in overwegende mate betrekking
      hebben op:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.3
  - number: 3.3.1.a
    text: landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging door eigen productieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.3
  - number: 3.3.1.c
    text: |-
      de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.3
  - number: 3.3.1.d
    text: |-
      de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 3.3.2
    text: |-
      De financier verstrekt geen risicokapitaal aan een instelling als bedoeld in [artikel 70 van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 3.4.1
    text: Er wordt garant gestaan voor 50 procent van de waarde van het risicokapitaal.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.4
  - number: 3.4.2
    text: |-
      Indien de financier bij het verkrijgen van risicokapitaal een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, zijn de bepalingen in hoofdstuk 3 van deze regeling slechts van toepassing op het gedeelte van het
      verkregen risicokapitaal dat onder de garantstelling is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De garantstelling heeft uitsluitend betrekking op risicokapitaal waarbij de waarde van het risicokapitaal dat aan
      de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de
      waarde van risicokapitaal dat door een andere financier met toepassing van dit hoofdstuk en van risicokapitaal dat
      met toepassing van [hoofdstuk 4][ref1] van deze regeling aan de ondernemer onderscheidenlijk de groep is verstrekt
      of gelijktijdig wordt verstrekt, niet meer bedraagt dan € 5.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: 3.5.2
    text: |-
      In afwijking van het eerste lid heeft de garantstelling voor participatiemaatschappijen uitsluitend betrekking
      op risicokapitaal waarbij de waarde van het risicokapitaal dat aan de ondernemer of, indien de ondernemer deel
      uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de waarde van het risicokapitaal dat door een
      andere participatiemaatschappij met toepassing van dit hoofdstuk en van risicokapitaal dat met toepassing van
      [hoofdstuk 4][ref1] van deze regeling aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig
      wordt verstrekt, niet meer bedraagt dan € 25.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: 3.6.1
    text: |-
      Er is een Adviescommissie Groeifaciliteit die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om garantstelling, bedoeld in de [artikelen 22][ref1] en
      [24 van het Kaderbesluit EZ-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '24'
  - number: 3.6.2
    text: De commissie bestaat uit ten minste vier en ten hoogste zes leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.6
  - number: 3.6.3
    text: De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.6
  - number: 3.7.1
    text: |-
      In [bijlage 3.1][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van achtergestelde
      leningen en aandelenkapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.7.2
    text: |-
      In [bijlage 3.2][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van niet
      converteerbare achtergestelde leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '3.8'
    text: |-
      De minister verdeelt het subsidieplafond voor het toekennen van reserveringsquota op volgorde van binnenkomst van
      de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.8
  - number: '3.9'
    text: 'De minister beslist afwijzend op een aanvraag om een reserveringsquotum indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.9
  - number: 3.9.a
    text: |-
      de financier geen garantstellingsovereenkomst met de Staat heeft gesloten of geen aanvraag voor het sluiten van een
      garantstellingsovereenkomst heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.9
  - number: 3.9.b
    text: de aanvraag om een reserveringsquotum minder bedraagt dan € 500.000;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.9
  - number: 3.9.c
    text: |-
      de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.9
  - number: 3.10.1
    text: |-
      De financier is voor het verkrijgen van een reserveringsquotum een eenmalige provisie van 1 procent van dit quotum
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt voor
      de garantie op het verstrekte risicokapitaal vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.10.2.a
    text: |-
      2,5 procent per jaar van de gegarandeerde waarde van dit risicokapitaal indien de kapitaalverstrekking bestaat
      uit een niet converteerbare achtergestelde lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan
      dezelfde ondernemer door de financier of door een andere financier die deel uitmaakt van dezelfde groep in de vorm
      van een converteerbare achtergestelde lening of aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.10
  - number: 3.10.2.b
    text: 3 procent van de gegarandeerde waarde van dit risicokapitaal, die per kwartaal wordt berekend, in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.10
  - number: 3.10.3
    text: |-
      De minister kan in plaats van het tarief van de provisie, genoemd in het tweede lid, een vergoeding vaststellen,
      indien het tarief van de provisie te laag is in relatie tot het risico dat de Staat loopt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.10
  - number: '3.11'
    text: |-
      Op gemeenschappelijk verzoek van een financier die beschikt over een reserveringsquotum en van een andere financier
      die een garantstellingsovereenkomst met de staat heeft, kan dit quotum geheel of gedeeltelijk voor de resterende
      periode worden overdragen aan de laatstgenoemde financier.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.11
  - number: '3.12'
    text: |-
      Jaarlijks vindt een evaluatie van de toepassing van deze regeling plaats, onder meer ter beoordeling of de
      inkomsten en de uitgaven ingevolge garantstellingen op grond van deze regeling met elkaar in evenwicht zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12
  - number: 3.12a.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *lening:* een al dan niet achtergestelde lening van geld door een
      financier aan een ondernemer, welke lening: a. al dan niet door enige vorm van zekerheid is gedekt, b. niet
      converteerbaar is en c. is afgesloten met de afspraak dat een gedeelte van de rente vast is en een gedeelte van
      de rente flexibel is en gekoppeld is aan Euribor, met het oog op de financiering door deze onderneming van eigen
      activiteiten;
        - *liquiditeitsopslag:* een door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12a
  - number: 3.12a.2
    text: Voor de toepassing van deze paragraaf wordt als financier aangewezen een bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12a
  - number: 3.12a.3
    text: |-
      Voor de toepassing van [artikel 3.12b, tweede lid][ref1], wordt als financier aangewezen een kredietinstelling in
      de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius of
      Saba het bedrijf van kredietinstelling uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12a
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030883
  - number: 3.12b.1
    text: |-
      De minister verstrekt op aanvraag subsidie in de vorm van een garantstelling aan een financier voor de
      terugbetaling van een lening die de financier op grond van een overeenkomst aan een ondernemer heeft verstrekt voor
      de duur van de overeenkomst met een maximum van acht jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12b
  - number: 3.12b.2
    text: |-
      De minister kan ook subsidie in de vorm van een garantstelling verstrekken aan een financier voor de terugbetaling
      van een lening die de financier op grond van een overeenkomst aan een ondernemer die gevestigd is in het openbaar
      lichaam Bonaire, Sint Eustatius of Saba heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12b
  - number: 3.12c.1
    text: 'De financier verstrekt geen lening aan een ondernemer wiens activiteiten in overwegende mate betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12c
  - number: 3.12c.1.a
    text: landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12c
  - number: 3.12c.1.b
    text: |-
      onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging door eigen productieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12c
  - number: 3.12c.1.c
    text: |-
      de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12c
  - number: 3.12c.1.d
    text: |-
      de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 3.12c.2
    text: |-
      De financier verstrekt geen lening aan een instelling als bedoeld in [artikel 70 van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 3.12d.1
    text: Er wordt garant gestaan voor 50 procent van het nog niet afgeloste deel van de lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12d
  - number: 3.12d.2
    text: |-
      Indien de financier bij het verkrijgen van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, zijn de bepalingen van deze paragraaf slechts van toepassing op het gedeelte van de verkregen lening
      dat onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12d
  - number: 3.12e.1
    text: |-
      De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer verstrekte lening niet
      minder bedraagt dan € 1.500.000.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12e
  - number: 3.12e.2
    text: |-
      De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer of, indien de ondernemer
      deel uitmaakt van een groep, aan de groep verstrekte lening tezamen met
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12e
  - number: 3.12e.2.a
    text: het nog niet afgeloste deel van een of meer leningen of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12e
  - number: 3.12e.2.b
    text: |-
      een of meer bankgarantiefaciliteiten als bedoeld in [3.12v][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12e
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3b
  - number: 3.12f.1
    text: |-
      De in [artikel 3.6][ref1] bedoelde adviescommissie heeft tevens tot taak de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om het sluiten van een garantstellingsovereenkomst, bedoeld in de
      [artikelen 22 en 24 van het Kaderbesluit EZ-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel22
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12f
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '22'
  - number: 3.12f.2
    text: |-
      Er is een Adviescommissie Kredietcommissie die tot taak heeft de minister op zijn verzoek te adviseren omtrent de
      afwijzingsgronden voor aanvragen om garantstelling, bedoeld in [artikel 3.12i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12f
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12f.3
    text: De commissie, genoemd in het tweede lid, bestaat uit ten minste drie en ten hoogste vier leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12f
  - number: 3.12f.4
    text: |-
      De voorzitter en de andere leden van de commissie, genoemd in het tweede lid, worden benoemd voor een termijn van
      ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12f
  - number: 3.12g
    text: |-
      In [bijlage 3.6][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12g
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12h
    text: De minister verdeelt het subsidieplafond voor garantstellingen op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12h
  - number: 3.12i
    text: 'De minister beslist afwijzend op een aanvraag voor een garantstelling indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12i
  - number: 3.12i.a
    text: de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12i
  - number: 3.12i.b
    text: |-
      er niet wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 3 van het model garantstellingsovereenkomst zoals opgenomen in bijlage 3.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12i
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12i.c
    text: |-
      de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12i
  - number: 3.12j.1
    text: |-
      Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt voor
      de garantie op de verstrekte lening, berekend door alle door de financier over het gegarandeerde deel van de lening
      ontvangen inkomsten te verminderen met:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.12j.1.a
    text: een kwart procent per jaar voor beheerskosten,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
  - number: 3.12j.1.b
    text: |-
      Euribor zoals opgenomen in de kredietofferte aan het te financieren bedrijf vermeerderd met een liquiditeitsopslag
      en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
  - number: 3.12j.1.c
    text: de afsluitprovisie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
  - number: 3.12j.2
    text: |-
      Indien de financier een hogere rating heeft dan A, wordt de liquiditeitsopslag vermeerderd met het verschil tussen
      het percentage uit de regeling voor staatsgaranties voor de uitgifte van schuldpapier van banken voor banken met
      een rating A en de werkelijke rating van de financier.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
  - number: 3.12j.3
    text: |-
      Indien de afsluitprovisie meer bedraagt dan 0,5 procent van de lening, wordt het meerdere toegevoegd aan de in het
      eerste lid, aanhef, genoemde inkomsten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
  - number: 3.12j.4
    text: |-
      De minister kan een hoger tarief voor de provisie vaststellen, indien de provisie te laag is in relatie tot het
      risico dat de Staat loopt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12j
  - number: 3.12k
    text: |-
      In deze paragraaf wordt verstaan onder: - *curatieve zorg:* zorg door een instelling die een toelating heeft op
      grond van de [Wet toelating zorginstellingen][ref1] voor het verlenen van medisch-specialistische zorg of een
      zorgcontract heeft met het Zorgverzekeringskantoor BES en die gevestigd is in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba;
        - *lening:* een niet achtergestelde lening van geld door een financier aan een ondernemer, welke lening: a. al dan
      niet door enige vorm van zekerheid is gedekt, b. niet converteerbaar is en c. is afgesloten met de afspraak dat een
      gedeelte van de rente vast is, een gedeelte van de rente flexibel is en gekoppeld is aan Euribor, met het oog op de
      financiering door deze onderneming van eigen activiteiten;
        - *liquiditeitsopslag:* een door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12k
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: 3.12l.1
    text: Voor de toepassing van deze paragraaf wordt als financier aangewezen
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12l
  - number: 3.12l.1.a
    text: een bank;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12l
  - number: 3.12l.1.b
    text: |-
      een kredietinstelling in de zin van de [Wet financiële markten BES][ref1] die op grond van die wet bevoegd is in
      Bonaire, Sint Eustatius of Saba het bedrijf van kredietinstelling uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12l
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 3.12l.2
    text: Voor de toepassing van deze paragraaf wordt een academisch ziekenhuis aangemerkt als een ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12l
  - number: 3.12m
    text: |-
      De minister verstrekt op aanvraag subsidie in de vorm van een garantstelling aan een financier voor de
      terugbetaling van een lening die de financier op grond van een overeenkomst aan een ondernemer heeft verstrekt voor
      de duur van de overeenkomst met een maximum van acht jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12m
  - number: 3.12n.1
    text: Er wordt garant gestaan voor 50 procent van het nog niet afgeloste deel van de lening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12n
  - number: 3.12n.2
    text: |-
      Indien de financier bij het verschaffen van een lening een gedeelte daarvan niet onder de garantstelling ingevolge
      deze paragraaf brengt, zijn de bepalingen van deze paragraaf slechts van toepassing op het gedeelte van de
      verkregen lening dat onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12n
  - number: 3.12o.1
    text: |-
      De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer verstrekte lening niet
      minder bedraagt dan € 1.500.000.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12o
  - number: 3.12o.2
    text: |-
      De garantstelling heeft uitsluitend betrekking op een lening waarbij de aan de ondernemer of, indien de ondernemer
      deel uitmaakt van een groep, aan de groep verstrekte lening tezamen met het nog niet afgeloste deel van de lening
      of leningen die door de financier met toepassing van deze paragraaf aan de ondernemer onderscheidenlijk de groep is
      verstrekt of gelijktijdig wordt verstrekt niet meer bedraagt dan € 50.000.000.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12o
  - number: 3.12p.1
    text: |-
      De in [artikel 3.6][ref1] bedoelde adviescommissie heeft tevens tot taak de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om het sluiten van een garantstellingsovereenkomst, bedoeld in de
      [artikelen 22][ref2] en [24 van het Kaderbesluit EZ-subsidies][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel24
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12p
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '24'
  - number: 3.12p.2
    text: |-
      De in [artikel 3.12f, tweede lid][ref1], bedoelde adviescommissie heeft tevens tot taak de minister op zijn verzoek
      te adviseren omtrent de afwijzingsgronden voor aanvragen om garantstelling, bedoeld in [artikel 3.12s][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12p
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3a
  - number: 3.12q
    text: |-
      In [bijlage 3.9][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12q
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12r
    text: De minister verdeelt het subsidieplafond voor garantstellingen op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12r
  - number: 3.12s
    text: 'De minister beslist afwijzend op een aanvraag om een garantstelling:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
  - number: 3.12s.a
    text: indien de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
  - number: 3.12s.b
    text: |-
      indien er niet wordt voldaan aan de voorwaarden, bedoeld in artikel 3 van het model garantstellingsovereenkomst
      zoals opgenomen in [bijlage 3.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12s.c
    text: |-
      indien de financier eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
  - number: 3.12s.d
    text: |-
      voor zover voor een lening of deel daarvan reeds door de stichting Waarborgfonds voor de Zorgsector, gevestigd te
      Utrecht, een garantstelling is verstrekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
  - number: 3.12s.e
    text: indien de activiteiten van de ondernemer niet in overwegende mate betrekking hebben op de curatieve zorg;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
  - number: 3.12s.f
    text: |-
      indien de lening die de financier op grond van een overeenkomst aan een ondernemer heeft verstrekt geen betrekking
      heeft op de bouw of verbouw van een onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12s
  - number: 3.12t.1
    text: |-
      Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt voor
      de garantie op de verstrekte lening, berekend door alle door de financier over het gegarandeerde deel van de lening
      ontvangen inkomsten te verminderen met:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.12t.1.a
    text: een kwart procent per jaar voor beheerskosten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
  - number: 3.12t.1.b
    text: |-
      Euribor zoals opgenomen in de kredietofferte aan het te financieren bedrijf vermeerderd met een liquiditeitsopslag
      en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
  - number: 3.12t.1.c
    text: de afsluitprovisie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
  - number: 3.12t.2
    text: |-
      Indien de financier een hogere rating heeft dan A, wordt de liquiditeitsopslag vermeerderd met het verschil tussen
      het percentage uit de regeling voor staatsgaranties voor de uitgifte van schuldpapier van banken voor banken met
      een rating A en de werkelijke rating van de financier.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
  - number: 3.12t.3
    text: |-
      Indien de afsluitprovisie meer bedraagt dan 0,5 procent van de lening, wordt het meerdere toegevoegd aan de in het
      eerste lid, aanhef, genoemde inkomsten
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
  - number: 3.12t.4
    text: |-
      De minister kan een hoger tarief voor de provisie vaststellen, indien de provisie te laag is in relatie tot het
      risico dat de Staat loopt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12t
  - number: 3.12u.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *bankgarantie:* de verplichting van een financier om aan een begunstigde,
      ten laste van een ondernemer, ten behoeve van eigen activiteiten van die ondernemer, een bedrag te betalen, indien
      de begunstigde daarop aanspraak maakt, uitgezonderd kredietgaranties;
        - *bankgarantiefaciliteit:* het bedrag waarvoor een financier aan een begunstigde ten laste van een ondernemer
      bankgaranties kan afgeven die onder de garantstelling van de staat kunnen vallen;
        - *waarde van een bankgarantie:* de hoogte van het bedrag waarop maximaal aanspraak kan worden gemaakt onder een
      afgegeven bankgarantie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12u
  - number: 3.12u.2
    text: Voor de toepassing van deze paragraaf wordt als financier aangewezen een bank.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12u
  - number: 3.12v.1
    text: De minister verstrekt op aanvraag subsidie aan een financier voor het afgeven van een bankgarantie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12v
  - number: 3.12v.2
    text: |-
      De subsidie wordt verstrekt in de vorm van een garantstelling aan een financier voor de terugbetaling van een
      vordering die een financier op een ondernemer krijgt uit hoofde van een betaling onder een bankgarantie die een
      financier op grond van een overeenkomst ten laste van een ondernemer heeft afgegeven voor de duur van minimaal zes
      maanden en maximaal 8 jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12v
  - number: 3.12v.3
    text: |-
      In afwijking van het tweede lid kan, indien een bankgarantie geen vaste looptijd heeft en het inroepen daarvan
      afhankelijk is van het zich voordoen van een bepaalde gebeurtenis, een financier een bankgarantie onder de
      garantstelling brengen onder de voorwaarde dat de gebeurtenis bij het aangaan van de bankgarantie zich naar
      verwachting niet meer dan 7 jaar na het afsluiten van de bankgarantiefaciliteit voordoet en dat de begunstigde een
      provincie, gemeente, openbaar lichaam als bedoeld in de Wet gemeenschappelijke regelingen of een dienst, instelling
      of bedrijf van de rijksoverheid is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12v
  - number: 3.12v.4
    text: |-
      De garantstelling heeft slechts betrekking op bankgaranties die worden afgegeven nadat de minister desgevraagd een
      bankgarantiefaciliteit heeft goedgekeurd en voor zover deze faciliteit toereikend en geldig is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12v
  - number: 3.12v.5
    text: |-
      Een bankgarantie als bedoeld in het vierde lid kan tot en met 31 december 2014 onder een goedgekeurde
      bankgarantiefaciliteit worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12v
  - number: 3.12w.1
    text: |-
      De financier verstrekt geen bankgarantiefaciliteit aan een ondernemer wiens activiteiten in overwegende mate
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12w
  - number: 3.12w.1.a
    text: landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12w
  - number: 3.12w.1.b
    text: |-
      onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging  door eigen productieve activiteiten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12w
  - number: 3.12w.1.c
    text: |-
      de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12w
  - number: 3.12w.1.d
    text: |-
      de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12w
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 3.12w.2
    text: |-
      De financier verstrekt geen bankgarantiefaciliteit aan een instelling als bedoeld in
      [artikel 70 van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12w
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 3.12x.1
    text: Er wordt garant gestaan voor 50 procent van de waarde van een bankgarantie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12x
  - number: 3.12x.2
    text: |-
      Indien de financier bij het afgeven van een bankgarantie een gedeelte daarvan niet onder de garantstelling van
      de Staat brengt, zijn de bepalingen van deze paragraaf slechts van toepassing op het gedeelte van de afgegeven
      bankgarantie dat onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12x
  - number: 3.12y.1
    text: |-
      De garantstelling heeft uitsluitend betrekking op een bankgarantie waarbij de door een financier ten laste van een
      ondernemer afgegeven bankgarantie niet minder bedraagt dan € 250.000.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12y
  - number: 3.12y.2
    text: |-
      De garantstelling heeft uitsluitend betrekking op een bankgarantie waarbij de aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep verstrekte bankgarantiefaciliteit tezamen met
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12y
  - number: 3.12y.2.a
    text: een of meer bankgarantiefaciliteiten of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12y
  - number: 3.12y.2.b
    text: |-
      het nog niet afgeloste deel van een of meer leningen als bedoeld in [3.12b][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12y
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12z
    text: |-
      De in [artikel 3.12f, tweede lid][ref1], bedoelde adviescommissie heeft tevens tot taak de minister op zijn
      verzoek te adviseren omtrent de afwijzingsgronden voor aanvragen om een bankgarantiefaciliteit, bedoeld in
      [artikel 3.12ac][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel3
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12z
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3b
  - number: 3.12aa
    text: |-
      In [bijlage 3.13][ref1] is een model opgenomen voor een garantstellingsovereenkomst ten aanzien van bankgaranties.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12aa
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12ab
    text: |-
      De minister verdeelt het subsidieplafond voor bankgarantiefaciliteiten op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ab
  - number: 3.12ac
    text: 'De minister beslist afwijzend op een aanvraag om een bankgarantiefaciliteit indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ac
  - number: 3.12ac.a
    text: de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ac
  - number: 3.12ac.b
    text: |-
      er niet wordt voldaan aan de voorwaarden, genoemd in artikel 3 van het model garantstellingsovereenkomst, met
      uitzondering van onderdelen f, h en i, zoals opgenomen in [bijlage 3.13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ac
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12ac.c
    text: |-
      de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ac
  - number: 3.12ac.d
    text: het bedrag van een bankgarantiefaciliteit minder bedraagt dan € 1.500.000.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ac
  - number: 3.12ad.1
    text: |-
      De financier is voor het verstrekken van een bankgarantiefaciliteit een eenmalige provisie van 0,25 procent van 50
      procent van de bankgarantiefaciliteit verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ad
  - number: 3.12ad.2
    text: |-
      Voor zover de opbrengsten uit de provisie, bedoeld in het eerste lid, die de financier bij de onderneming
      in rekening brengt voor het verstrekken van de bankgarantiefaciliteit hoger zijn dan 0,5 procent van de
      bankgarantiefaciliteit, is de financier het meerdere voor 50 procent aan de Staat verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ad
  - number: 3.12ad.3
    text: |-
      Voor zover de opbrengsten uit een eventuele bereidstellingsprovisie die een financier bij een onderneming in
      rekening brengt over het onbenutte deel van een bankgarantiefaciliteit hoger zijn dan 25 procent van een door een
      financier aan een onderneming in rekening gebrachte provisie op bankgaranties, is de financier het meerdere voor 50
      procent aan de Staat verschuldigd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ad
  - number: 3.12ad.4
    text: |-
      Het tarief van de periodieke provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1],
      wordt voor de garantstelling op een afgegeven bankgarantie berekend over de waarde van de afgegeven bankgaranties
      op de eerste dag van het kwartaal en is gelijk aan de door een financier aan een onderneming in rekening gebrachte
      provisie over het door de staat gegarandeerde deel van de afgegeven bankgaranties met aftrek van 0,15 procent op
      jaarbasis als vergoeding voor de financier voor het beheer van de bankgarantiefaciliteit en met een minimum van 0,5
      procent op jaarbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ad
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.12ad.5
    text: |-
      In afwijking van het vierde lid kan een financier eenmalig en vooraf aangeven de provisie per kwartaal te willen
      verrekenen op basis van een controleerbare opgave van de provisieberekening op dagbasis.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ad
  - number: 3.12ad.6
    text: |-
      De minister kan een hoger tarief voor de provisie, bedoeld in het eerste tot en met het vierde lid, vaststellen,
      indien de provisie te laag is in relatie tot het risico dat de Staat loopt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel3.12ad
