preamble:
  text: |-
    Gelet op de artikelen 4, 5, eerste, derde en vierde lid, 7, 9, 12, vierde lid, 13, eerste lid, onderdeel a, en
    tweede lid, 14, 15, 17, 18, eerste en vijfde lid, 19, 23, onderdeel c, 25, 30, derde tot en met vijfde lid, 32,
    derde lid, 33, tweede lid, 34, eerste lid, 42, eerste lid, 44, eerste en tweede lid, en 48, eerste lid, van het
    Kaderbesluit EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: In deze regeling wordt verstaan onder - *minister:* de Minister van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.1
  - number: 1.2.1
    text: |-
      Het rapport van feitelijke bevindingen, bedoeld in [artikel 12, derde lid, van het Kaderbesluit EZ-subsidies][ref1],
      wordt opgesteld overeenkomstig het protocol dat is opgenomen in [bijlage 1.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0024902
  - number: 1.2.2
    text: |-
      Als rapport als bedoeld in [artikel 12, vierde lid][ref1], wordt aangewezen een afschrift van het rapport van
      feitelijke bevindingen van een externe accountant inzake de actueel gebruikte methode voor berekening van de
      personeelskosten en indirecte kosten dat is opgesteld in het kader van [verordening (EG) nr. 1906/2006](32006R1906)
      van het Europees Parlement en de Raad van de Europese Unie van 18 december 2006 tot vaststelling van de regels
      voor de deelname van ondernemingen, onderzoekscentra en universiteiten aan acties op grond van het zevende
      kaderprogramma, en voor verspreiding van onderzoeksresultaten (2007–2013) (PbEU L 391) en, indien de subsidie-
      ontvanger daarover beschikt, een afschrift van de goedkeuring door de Europese Commissie van dat rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
  - number: '1.3'
    text: |-
      De vaste opslag voor indirecte kosten, bedoeld in
      [artikel 13, eerste lid, onderdeel a, van het Kaderbesluit EZ-subsidies][ref1], bedraagt 50 procent van de
      loonkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '13'
  - number: 1.4.1
    text: |-
      Het uurtarief, bedoeld in [artikel 13, tweede lid, van het Kaderbesluit EZ-subsidies][ref1], bedraagt € 35.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '13'
  - number: 1.4.2
    text: |-
      Het uurtarief, bedoeld in [artikel 14 van het Kaderbesluit EZ-subsidies][ref1] bedraagt € 35.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel14
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '14'
  - number: '1.5'
    text: |-
      Deze regeling valt onder de [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’)
      (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.5
  - number: '1.6'
    text: |-
      Indien door de minister op grond van deze regeling een subsidie wordt verleend van minder dan € 25.000, wordt de
      subsidie ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel1.6
  - number: 2.2.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een bank en een door de minister aangewezen
      kredietverstrekker.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Voor de toepassing van [artikel 2.3, derde lid][ref1], wordt als financier aangewezen een kredietinstelling in
      de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius
      of Saba het bedrijf van kredietinstelling uit te oefenen en een door de minister aangewezen, op Bonaire, Sint
      Eustatius of Saba gevestigde, kredietverstrekker.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0030883
  - number: 2.3.1
    text: 'De minister verstrekt op aanvraag subsidie aan:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.1.a
    text: 'een bank voor het sluiten van kredietovereenkomsten met MKB-ondernemers die betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.1.a.1°
    text: bedrijfsborgstellingskredieten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.1.a.2°
    text: bodemsaneringsborgstellingskredieten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.1.b
    text: |-
      een door de minister aangewezen kredietverstrekker, als bedoeld in [artikel 2.2, eerste lid][ref1], voor het
      sluiten van kredietovereenkomsten met MKB-ondernemers die betrekking hebben op bedrijfsborgstellingskredieten.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.2
    text: |-
      De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat de
      financier op grond van een kredietovereenkomst aan een MKB-ondernemer heeft verstrekt voor de duur van de
      kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.3
    text: 'In aanvulling op het eerste lid kan de minister ook subsidie verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.3.a
    text: |-
      een kredietinstelling als bedoeld in [artikel 2.2, tweede lid][ref1], voor het sluiten van kredietovereenkomsten
      met MKB-ondernemers die gevestigd zijn in het openbaar lichaam Bonaire, Sint Eustatius of Saba, die betrekking
      hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.3.a.1°
    text: bedrijfsborgstellingskredieten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.3.a.2°
    text: bodemsaneringsborgstellingskredieten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
  - number: 2.3.3.b
    text: |-
      een door de minister aangewezen kredietverstrekker als bedoeld in [artikel 2.2, tweede lid][ref1],
      voor het sluiten van kredietovereenkomsten met MKB-ondernemers die gevestigd zijn in het openbaar
      lichaam Bonaire, Sint Eustatius of Saba, die betrekking hebben op bedrijfsborgstellingskredieten.
      [Artikel 2.5, eerste lid, onderdeel a, onder 1][ref2], is niet van toepassing op de in dit lid bedoelde MKB-
      ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.4'
    text: |-
      De subsidie, bedoeld in [artikel 2.3, eerste lid][ref1], valt onder de de-minimis verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.1
    text: 'Voor subsidie komt niet in aanmerking een financier die een kredietovereenkomst sluit met een MKB-ondernemer die:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.5
  - number: 2.5.1.a
    text: |-
      een onderneming in stand houdt waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien de
      onderneming nog geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.5
  - number: 2.5.1.a.1°
    text: de beoefening van de land- of de tuinbouw, de vee- of visteelt, de visserij of de teelt van vee- of visvoer,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.5
  - number: 2.5.1.a.2°
    text: |-
      de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.5
  - number: 2.5.1.a.3°
    text: |-
      het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.5
  - number: 2.5.1.b
    text: |-
      een aanbieder is als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1] dan wel
      het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 2.6.1
    text: |-
      Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1] bedraagt
      eenmalig:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 2.6.1.a
    text: |-
      3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van niet
      langer dan twee jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
  - number: 2.6.1.b
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan twee jaar, maar niet langer dan vier jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
  - number: 2.6.1.c
    text: |-
      3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan vier jaar, maar niet langer dan zes jaar,
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
  - number: 2.6.1.d
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan zes jaar, maar niet langer dan negen jaar en
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
  - number: 2.6.1.e
    text: |-
      4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van meer
      dan negen jaar, maar niet langer dan twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1] bedraagt 3
      procent indien de overeenkomst van borgtocht een bodemsaneringsborgstellingskrediet betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 2.6a.1
    text: |-
      Er is een Adviescommissie Borgstelling MKB-kredieten die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om het sluiten van een bedrijfsborgstellingsovereenkomst, bedoeld in de
      [artikelen 22][ref1] en [24 van het Kaderbesluit EZ-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '24'
  - number: 2.6a.2
    text: De commissie bestaat uit ten minste vier en ten hoogste zeven leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6a
  - number: 2.6a.3
    text: De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.6a
  - number: 2.7.1
    text: |-
      De minister verdeelt het subsidieplafond voor banken en kredietinstellingen in de zin van de
      [Wet financiële markten BES][ref1] door vaststelling van een maximumbedrag per bank respectievelijk
      kredietinstelling die zich bij de minister hebben aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 2.7.2
    text: |-
      De minister stelt het maximumbedrag per financier, als bedoeld in het eerste lid, uiterlijk 1 februari van elk
      kalenderjaar ambtshalve vast voor het voorgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.7
  - number: 2.7.3
    text: |-
      De minister verdeelt het subsidieplafond voor door de minister aangewezen kredietverstrekkers, als bedoeld in
      [artikel 2.2, eerste en tweede lid][ref1], op volgorde van binnenkomst van de meldingen, bedoeld in artikel 6,
      vijfde lid, van het model bedrijfsborgstellingsovereenkomst, zoals opgenomen in [bijlage 2.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024902
  - number: '2.8'
    text: Er wordt borg gestaan voor 90 procent van het kredietbedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Het model voor de bedrijfsborgstellingsovereenkomst (één bank) voor een bank of voor een kredietinstelling in de
      zin van de [Wet financiële markten BES][ref1] is opgenomen in [bijlage 2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0024902
