  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *achtergestelde vordering:* een vordering van een startersfonds ten laste
      van een technostartersvennootschap, a. die het startersfonds heeft verkregen door aan de technostartersvennootschap
      geld ter leen te verstrekken, b. die niet door enige vorm van zekerheid is gedekt en c. waarop de debiteur
      krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding, een akkoord na
      verlening van surseance van betaling of een akkoord in faillissement van de debiteur, eerst verplicht is rente
      en aflossing te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn voldaan, met
      uitzondering van de schulden die voortvloeien uit leningen waaraan een bepaling van gelijke aard als voornoemde
      bepaling is verbonden, d. terwijl ingevolge de vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan
      van alle rechten tot verrekening van de rente en aflossing;
        - *beheerskosten:* alle kosten die een startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartersvennootschappen, uitgezonderd de
      verkrijgingprijs van de participaties;
        - *creatieve technostarter:* een technostarter die actief is in de creatieve zakelijke dienstverlening, media,
      entertainment, of kunsten;
        - *fondsplan:* een plan van een startersfonds tot uitvoering van een met elkaar samenhangend geheel van
      activiteiten die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de
      desbetreffende technostartersvennootschappen;
        - *inkomsten:* alle op geld waardeerbare voordelen die een startersfonds heeft uit een participatie, waaronder
      dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen de
      participatie door de technostartersvennootschap is ingekocht of terugbetaald en de liquidatie-uitkering;
        - *investeringsbudget:* de financiële middelen die een startersfonds beschikbaar heeft of zal hebben en die bestemd
      zijn om de verkrijgingprijs van participaties te voldoen;
        - *investeringsperiode:* de periode gedurende welke een startersfonds activiteiten verricht ter verkrijging van
      participaties;
        - *participatie:* risicodragend kapitaal in de vorm van: a. aandelen in het kapitaal van een
      technostartersvennootschap die het startersfonds rechtstreeks van de technostartersvennootschap heeft verkregen
      tegen volstorting van die aandelen in geld, of door omzetting van een achtergestelde vordering of b. aandelen
      in het kapitaal van een technostartersvennootschap als bedoeld onder 1° in combinatie met een achtergestelde
      vordering;
        - *referentierente:* de referentierentevoet, bedoeld in de Mededeling van de Commissie over de methode waarmee de
      referentie- en disconteringspercentages worden vastgesteld (PbEG 1997, C 273), zoals laatstelijk vastgesteld voor
      Nederland, en vermeerderd met 4 procent;
        - *startersfonds:* een vennootschap: a. in de vorm van kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de andere lidstaten van de Europese Unie; b. die
      blijkens de akte waarbij haar statuten zijn vastgesteld of blijkens de overeenkomst waarbij zij is aangegaan
      uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan technostartersvennootschappen teneinde
      winst te behalen; en c. waarin ten minste drie aandeelhouders of hoofdelijk aansprakelijke vennoten deelnemen
      respectievelijk samenwerken zonder dat twee of drie van hen tot dezelfde groep behoren en zonder dat één van hen
      een meerderheidsbelang in het fonds heeft;
        - *technostarter*: een rechtspersoon die een onderneming drijft die: a. ten hoogste vijf jaar geleden is
      ingeschreven in het handelsregister; en b. ten tijde van de eerste verstrekking van risicodragend kapitaal op grond
      van dit hoofdstuk voldoet aan de definitie van middelgrote, kleine of micro-ondernemingen; en c. hetzij voor eigen
      rekening en risico producten, processen of diensten – niet zijnde adviezen – verkoopt en levert, die zijn gebaseerd
      op een nieuwe technische vinding of een nieuwe toepassing van bestaande technologie, d. hetzij deel uitmaakt van
      één van de creatieve sectoren en voor eigen rekening en risico producten, processen of diensten – niet zijnde
      adviezen – verkoopt en levert, die zijn gebaseerd op een nieuwe creatieve vinding of op een nieuwe toepassing van
      een bestaande creatieve vinding;
        - *technostartersvennootschap:* een technostarter die a. een onderneming drijft in de vorm van een
      kapitaalvennootschap, en b. zijn primaire bedrijfsactiviteiten in Nederland uitvoert, behoudens voor zover de
      onderneming behoort tot de economische sectoren van landbouw, visserij, aquacultuur of scheepsbouw of tot de EGKS-
      sectoren;
        - *verkrijgingprijs van een participatie:* het bedrag in geld waarvoor het startersfonds de participatie heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.1
  - number: '4.2'
    text: Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een startersfonds.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.2
  - number: 4.3.1
    text: De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.3
  - number: 4.3.2
    text: |-
      De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan voor een
      creatieve technostarter.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.3
  - number: 4.3.3
    text: De subsidie wordt verleend in de vorm van een geldlening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.3
  - number: 4.5.1
    text: 'In de overeenkomst van geldlening wordt bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.5
  - number: 4.5.1.a
    text: de financier een deel van de inkomsten uit participaties overboekt aan de minister;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.5
  - number: 4.5.1.b
    text: de financier geen andere activiteiten verricht dan de uitvoering van het fondsplan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.5
  - number: 4.5.2
    text: |-
      In de overeenkomst van geldlening kunnen bepalingen worden opgenomen die strekken tot verwezenlijking van het doel
      van de subsidie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.5
  - number: '4.6'
    text: |-
      De geldlening die op grond van de overeenkomst van geldlening ten hoogste kan worden geleend, bedraagt 50 procent
      van het investeringsbudget.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.6
  - number: 4.7.1
    text: Er wordt borg gestaan voor 100 procent van het bedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.7
  - number: 4.7.2
    text: Het maximum subsidiebedrag bedraagt € 4.000.000 per subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Indien een ander bestuursorgaan of de Commissie van de Europese Gemeenschappen een financiële bijdrage aan
      het investeringsbudget van de financier heeft verstrekt, wordt op grond van deze regeling slechts een zodanige
      geldlening verstrekt, dat het totaal van de geldlening en de andere financiële bijdragen niet meer bedraagt dan het
      in het eerste lid bedoelde percentage.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Er is een Adviescommissie seed capital technostarters die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [24 van het Kaderbesluit EZ-subsidies][ref2] en
      in [artikel 4.9][ref3], en de rangschikkingscriteria, bedoeld in [artikel 4.10][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0024902#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0024902#Artikel4
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0024902
        artikel: '4'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0024902
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.8.2
    text: De commissie bestaat uit ten minste vier en ten hoogste negen leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.8
  - number: 4.8.3
    text: De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.8
  - number: 4.9.1
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.a
    text: |-
      onvoldoende aannemelijk is dat de financier gedurende de investeringsperiode daadwerkelijk zal beschikken over de
      middelen die de financier aan het investeringsbudget bijdraagt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.b
    text: |-
      onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben voor het verkrijgen van participaties en
      voor het beheer van de financier op een wijze zoals bij participatiefondsen gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c
    text: 'een fondsplan niet is gebaseerd op de uitgangspunten dat:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.1°
    text: |-
      een financier participaties verkrijgt gedurende een investeringsperiode van ten hoogste zes jaar, en deze uiterlijk
      zes jaar na afloop van de investeringsperiode vervreemdt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.2°
    text: |-
      de totale verkrijgingprijs van de participaties die gedurende de investeringsperiode in één
      technostartersvennootschap worden verkregen, ten minste € 100.000 en ten hoogste € 2.500.000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.3°
    text: |-
      de gemiddelde totale verkrijgingprijs van de participaties die een financier gedurende de investeringsperiode
      per technostartersvennootschap verkrijgt, over alle technostartersvennootschappen genomen ten hoogste € 800.000
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.4°
    text: |-
      de middelen die door een financier per half jaar aan een technostartersvennootschap worden verstrekt ten hoogste
      € 500.000 bedragen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.5°
    text: de beheerskosten jaarlijks ten hoogste 5 procent bedragen van het investeringsbudget;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.6°
    text: de fondsbeheerder voor zijn werkzaamheden een beloning verkrijgt die afhankelijk is van zijn individuele prestatie;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.7°
    text: |-
      de relatieve omvang van achtergestelde vorderingen zodanig wordt beperkt dat ten hoogste 35 procent van het totaal
      van de verkrijgingsprijzen van de participaties betrekking heeft op achtergestelde vorderingen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.8°
    text: voor achtergestelde vorderingen een rente wordt bedongen die ten minste gelijk is aan de referentierente;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.9°
    text: |-
      de participaties verkregen worden in technostartersvennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.10°
    text: |-
      bij de beslissing van de financier inzake de verkrijging van een participatie rekening wordt gehouden met het
      ondernemingsplan van de desbetreffende technostartersvennootschap;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.c.11°
    text: |-
      de participaties verkregen worden in technostartersvennootschappen waarin niet eerder een participatie is verkregen
      door een investeringsfonds, niet zijnde een financier, behoudens indien de eerdere participatie is verkregen door
      een investeringsfonds dat uitsluitend het verstrekken van risicodragend kapitaal aan technostartersvennootschappen
      tot doel heeft en dat naar het oordeel van de minister niet in staat is nieuwe participaties in de
      technostartersvennootschap te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.d
    text: het fondsplan onvoldoende is onderbouwd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.1.e
    text: onvoldoende vertrouwen bestaat dat het fondsplan naar behoren wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
  - number: 4.9.2
    text: |-
      [Artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 4.10.1
    text: 'De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.10
  - number: 4.10.1.a
    text: de aanvrager meer kan steunen op relevante ervaring en deskundigheid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.10
  - number: 4.10.1.b
    text: het fondsplan meer bijdraagt aan de opbouw van succesvolle ondernemingen door technostartersvennootschappen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.10
  - number: 4.10.1.c
    text: het fondsplan doelmatiger is ingericht.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.10
  - number: 4.10.2
    text: Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.10
  - number: '4.11'
    text: |-
      In afwijking van [artikel 30, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] bedraagt de termijn waarbinnen
      een overeenkomst tot stand moet zijn gekomen twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel30
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '30'
  - number: 4.12.1
    text: |-
      De vergoeding, bedoeld in [artikel 33, tweede lid, van het Kaderbesluit EZ-subsidies][ref1], verschilt al naar
      gelang de inkomsten door de financier worden ontvangen in één van de volgende perioden:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel33
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '33'
  - number: 4.12.1.a
    text: |-
      periode A: vanaf het tot stand komen van deze overeenkomst van geldlening tot het tijdstip waarop het totaal
      van de door de financier uit de participaties verkregen inkomsten na aftrek van het totaal van de aan de Staat
      overgeboekte bedragen gelijk is aan de eigen bijdrage voor de verkregen participaties;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
  - number: 4.12.1.b
    text: |-
      periode B: vanaf het onder a bedoelde tijdstip tot het tijdstip dat het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan het totaal op grond van de overeenkomst van lening opgenomen bedrag;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
  - number: 4.12.1.c
    text: |-
      periode C: vanaf het tijdstip dat het totaal van de aan de Staat overgeboekte bedragen gelijk is aan het totaal op
      grond van de overeenkomst van lening opgenomen bedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
  - number: 4.12.2
    text: |-
      De vergoeding, bedoeld in [artikel 33, tweede lid, van het Kaderbesluit EZ-subsidies][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel33
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '33'
  - number: 4.12.2.a
    text: |-
      in periode A: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het maximale
      bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van de Staat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
  - number: 4.12.2.b
    text: |-
      in periode B: 50 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het maximale
      bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van de Staat;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
  - number: 4.12.2.c
    text: |-
      in periode C: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het maximale
      bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van het krediet van de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Het formulier voor het indienen van een aanvraag om geldlening is opgenomen in [bijlage 4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 4.13.2
    text: |-
      Het model voor een overeenkomst is opgenomen in [bijlage 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '5.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *financiële bijdrage:* een verstrekking van geld met of zonder
      terugbetalingsverplichting;
        - *innovatieve starter:* een innovatieve starter als bedoeld in paragraaf 5.4 van de Communautaire kaderregeling
      inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *kennisinstelling:* een onderwijsinstelling of een academisch ziekenhuis als bedoeld in
      [artikel 1.13, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];
        - *lening:* een lening aan een rechtspersoon die is verstrekt onder de voorwaarde dat een bij de rechtspersoon
      betrokken natuurlijke persoon garant staat voor de betaling van de rente en de terugbetaling van de hoofdsom, of
      een lening aan een natuurlijke persoon;
        - *maatschappelijke organisatie:* een rechtspersoon zonder winstoogmerk, uitgezonderd ondernemers die geen MKB-
      ondernemer zijn;
        - *onderwijsinstelling:* een bekostigde instelling voor hoger onderwijs als bedoeld in
      [artikel 1.8, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];
        - *starter:* a. een MKB-ondernemer: 1°. die voor eigen rekening en risico producten, processen of diensten verkoopt
      en levert die zijn gebaseerd op een nieuwe vinding of een nieuwe toepassing en 2°. die ten hoogste vijf jaar
      geleden is ingeschreven in het handelsregister of b. een natuurlijke persoon die voorbereidingen treft voor de
      oprichting van een onderneming als bedoeld onder a;
        - *technische haalbaarheidsstudie:* een technische haalbaarheidsstudie in de zin van paragraaf 5.2 van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *valorisatieplan:* een planmatig en met elkaar samenhangend geheel van activiteiten dat: a. strekt tot
      versterking van het valorisatieproces in Nederland door middel van faciliteiten zoals onder meer beschreven in
      [bijlage 5.1.][ref3]; b. wordt uitgevoerd door ten minste één onderwijsinstelling en één in Nederland gevestigde
      onderneming die niet tot dezelfde groep behoren; c. is gebaseerd op een integrale visie ten aanzien van de ambitie
      om het valorisatieproces duurzaam te versterken; d. een looptijd heeft van zes jaar;
        - *valorisatieproces:* het proces waarbij toegevoegde waarde wordt gecreëerd door kennis geschikt of beschikbaar te
      maken voor economische of maatschappelijke benutting en door deze kennis daadwerkelijk aan te wenden in producten,
      diensten en processen of anderszins met deze kennis nieuwe bedrijvigheid te creëren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0024902
  - number: 5.2.1
    text: 'De minister verstrekt op aanvraag subsidie voor de uitvoering van een valorisatieplan aan:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.1.a
    text: |-
      een organisatie met rechtspersoonlijkheid waarin ten minste één onderwijsinstelling en één in Nederland gevestigde
      onderneming die niet tot dezelfde groep behoren, zijn verbonden of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.1.b
    text: |-
      een deelnemer in een samenwerkingsverband bestaande uit ten minste één onderwijsinstelling en één in Nederland
      gevestigde onderneming die niet tot dezelfde groep behoren.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2
    text: |-
      De subsidie wordt verstrekt voor activiteiten gedurende de eerste vier jaar van de looptijd van het valorisatieplan
      die bestaan uit:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.a
    text: |-
      onderwijsactiviteiten in het kader van door de overheid bekostigd onderwijs ter stimulering van een ondernemende
      houding en voor de ontwikkeling van ondernemerschapscompetenties, verricht door een onderwijsinstelling die
      deelneemt aan de uitvoering van het valorisatieplan, ten behoeve van studenten, docenten of andere betrokkenen in
      alle kennisdomeinen binnen de onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.b
    text: |-
      activiteiten van een kennisinstelling die aan de uitvoering van het valorisatieplan deelneemt ter bevordering van
      de aanwending van kennis waarover zij beschikt met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.b.1°
    text: de beoordeling in hoeverre deze kennis geschikt is voor economische of maatschappelijke benutting;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.b.2°
    text: |-
      het zoeken naar en stimuleren van starters, maatschappelijke organisaties en ondernemingen om deze kennis toe te
      passen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.c
    text: |-
      de indiening van aanvragen door een kennisinstelling die aan de uitvoering van het valorisatieplan deelneemt, voor
      de verwerving van rechten van intellectuele eigendom voor zover:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.c.1°
    text: de aanvragen passen in een door de kennisinstelling ontwikkelde visie over optimale bescherming van kennis;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.c.2°
    text: |-
      de verkregen rechten van intellectuele eigendom binnen 30 maanden tegen marktconforme voorwaarden worden
      overgedragen met het oog op de toepassing daarvan;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.c.3°
    text: de uit de overdracht verkregen opbrengsten worden geïnvesteerd in de primaire activiteiten van de kennisinstelling;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.d
    text: |-
      de bekostiging van aan starters te verstrekken leningen ten behoeve van de oprichting of de opbouw van hun
      onderneming;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.e
    text: |-
      de bekostiging van financiële bijdragen aan starters, MKB-ondernemers en maatschappelijke organisaties,
      uitgezonderd kennisinstellingen, voor het verrichten van een technische haalbaarheidsstudie;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.f
    text: |-
      het vormen en in stand houden van een netwerk met behulp waarvan de uitvoerder van het valorisatieplan contacten
      onderhoudt met relevante derden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.2.2.g
    text: andere activiteiten ter versterking van het valorisatieproces.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.2
  - number: 5.3.1
    text: |-
      De subsidie voor de in [artikel 5.2, tweede lid, onderdelen a en b][ref1], bedoelde activiteiten bedraagt 50
      procent van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.2
    text: |-
      De subsidie voor de in [artikel 5.2, tweede lid, onderdeel c][ref1], bedoelde activiteiten bedraagt 50 procent van
      de subsidiabele kosten en ten hoogste € 12.500 per aanvraag betreffende een intellectueel eigendomsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.3
    text: |-
      De subsidie voor de in [artikel 5.2, tweede lid, onderdeel d][ref1], bedoelde activiteiten bedraagt 50 procent van
      de subsidiabele kosten en ten hoogste € 50.000 per starter.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.4
    text: |-
      De subsidie voor de in [artikel 5.2, tweede lid, onderdeel e][ref1], bedoelde activiteiten bedraagt 50 procent van
      de subsidiabele kosten en ten hoogste € 125.000 per haalbaarheidsonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.5
    text: |-
      De subsidie voor de in [artikel 5.2, tweede lid, onderdeel f][ref1], bedoelde activiteiten bedraagt 50 procent van
      de subsidiabele kosten en ten hoogste 5% van de totaal verstrekte subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.6
    text: |-
      De subsidie voor de in [artikel 5.2, tweede lid, onderdeel g][ref1], bedoelde activiteiten bedraagt 50 procent van
      de subsidiabele kosten en ten hoogste 5% van de totaal verstrekte subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.4'
    text: |-
      Voor zover de subsidie voor de in [artikel 5.2, tweede lid, onderdeel d][ref1], bedoelde activiteiten wordt
      verstrekt aan starters die geen innovatieve starter zijn, is de de-minimis verordening van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.1
    text: |-
      Het maximum bedrag voor het totaal van de op grond van een valorisatieplan te verstrekken subsidie bedraagt
      € 5.000.000 per subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde valorisatieplan en die tezamen een
      subsidiebedrag van meer dan € 5.000.000 betreffen, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.5
  - number: '5.6'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Er is een Adviescommissie valorisatieprogramma die tot taak heeft de minister op zijn verzoek te adviseren omtrent
      de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [23 van het Kaderbesluit EZ-subsidies][ref2] en in
      [artikel 5.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.2
    text: De commissie bestaat uit ten minste vijf en ten hoogste elf leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.7
  - number: 5.7.3
    text: De voorzitter en de leden worden benoemd voor een termijn van ten hoogste zes jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.7
  - number: '5.8'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is zes jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '5.9'
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.9
  - number: 5.9.a
    text: |-
      niet aannemelijk is dat uitvoering van het valorisatieplan leidt tot een aanzienlijke en duurzame versterking van
      het valorisatieproces in Nederland;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.9
  - number: 5.9.b
    text: |-
      onvoldoende vertrouwen bestaat dat de gerealiseerde versterking van het valorisatieproces aan het einde van de
      looptijd van het valorisatieplan structureel zal zijn verankerd bij de organisaties die deelnemen in de uitvoering
      van het valorisatieplan, en in de uitvoeringspraktijk.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.9
  - number: 5.10.1
    text: |-
      De subsidie-ontvanger stelt voor elk jaar van de looptijd van het valorisatieplan een jaarplan op dat een nadere
      beschrijving bevat van de subsidiabele activiteiten die gedurende het desbetreffende jaar worden verricht ter
      uitvoering van het valorisatieplan, onder vermelding van de desbetreffende kosten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Het jaarplan wordt uiterlijk twee maanden voor de aanvang van het desbetreffende jaar ingediend. Het jaarplan voor
      het eerste jaar wordt uiterlijk dertien weken na de datum van de beschikking tot subsidieverlening ingediend.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.10
  - number: 5.11.1
    text: |-
      Ten aanzien van de projectresultaten en de kennis die door het project is verkregen, verleent de subsidie-ontvanger
      medewerking aan de verdere verspreiding door de minister of door een door de minister aangewezen derde.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.11
  - number: 5.11.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.11
  - number: '5.12'
    text: |-
      De subsidie-ontvanger draagt er voor zorg dat de met de gesubsidieerde activiteiten gerealiseerde versterking
      van het valorisatieproces structureel wordt verankerd bij de uitvoerders van het valorisatieplan en in de
      uitvoeringspraktijk.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.12
  - number: 5.13.1
    text: |-
      De subsidie-ontvanger draagt er voor zorg dat aflossingen en afbetalingen die worden ontvangen over leningen die
      zijn verstrekt voor de in [artikel 5.2, tweede lid, onderdelen d en e][ref1], bedoelde activiteiten, worden besteed
      voor het verstrekken van nieuwe, soortgelijke leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.13.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt tot vier jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.13
  - number: 5.13.3
    text: |-
      Op verzoek van de subsidie-ontvanger kan de minister ontheffing verlenen van de in het eerste lid bedoelde
      verplichting.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.13
  - number: 5.13.4
    text: |-
      Aan de ontheffing, bedoeld in het derde lid, wordt het voorschrift verbonden dat de subsidie-ontvanger 50% van het
      totaal van de aflossingen op onderscheidenlijk afbetalingen van de leningen aan de minister betaalt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.13
  - number: 5.13.5
    text: |-
      Aan de ontheffing, bedoeld in het derde lid, kunnen andere voorschriften dan bedoeld in het vierde lid, worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.13
  - number: 5.13.6
    text: |-
      De subsidie-ontvanger is verplicht om na verloop van vier jaar na de datum van de beschikking tot
      subsidievaststelling 50% van het totaal van de aflossingen en afbetalingen die over verstrekte leningen zijn of
      zullen worden ontvangen, aan de minister te betalen volgens een in de beschikking tot subsidieverlening vastgelegd
      schema. [Artikel 42 van het Kaderbesluit EZ-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '42'
  - number: 5.14.1
    text: 'De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van de minister, niet:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.14
  - number: 5.14.1.a
    text: |-
      indien hij een organisatie met rechtspersoonlijkheid is, de rechtspersoon ontbinden of geheel of gedeeltelijk
      vervreemden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.14
  - number: 5.14.1.b
    text: |-
      indien hij deelnemer is in een samenwerkingsverband, meewerken aan de ontbinding ervan of aan het uittreden van een
      of meer deelnemers ervan.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.14
  - number: 5.14.2
    text: Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.14
  - number: '5.15'
    text: 'Het formulier voor het indienen van een aanvraag voor:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.15
  - number: 5.15.a
    text: |-
      een subsidie is opgenomen in [bijlage 5.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 5.15.b
    text: |-
      een subsidievaststelling is opgenomen in [bijlage 5.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 6.1.1
    text: 'In dit hoofdstuk wordt verstaan onder een onderwijsinstelling:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
  - number: 6.1.1.a
    text: |-
      een basisschool als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1], bekostigd uit de openbare
      kas;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
  - number: 6.1.1.b
    text: |-
      een speciale school voor basisonderwijs als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      bekostigd uit de openbare kas;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
  - number: 6.1.1.c
    text: |-
      een school of instelling voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref1], bekostigd uit de openbare
      kas;


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '1'
  - number: 6.1.1.d
    text: |-
      een school voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref1] en
      een agrarisch opleidingscentrum als bedoeld in [artikel 1.3.3. van de Wet educatie en beroepsonderwijs][ref2] voor
      zover het daarin verzorgde voorbereidend beroepsonderwijs, bekostigd uit de openbare kas;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 6.1.1.e
    text: |-
      een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] met
      uitzondering van een agrarisch opleidingscentrum voor zover het daarin verzorgde voorbereidend beroepsonderwijs, de
      instituten, genoemd in [artikel 12.3.8 van de Wet educatie en beroepsonderwijs][ref2] of de hogescholen, genoemd in
      [artikel 12.3.9 van de Wet educatie en beroepsonderwijsinstelling][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
  - number: 6.1.1.f
    text: |-
      een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onderdeel a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 6.1.2
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *CE-project:* een samenhangend geheel van activiteiten gericht op het
      opzetten en totstandkomen van een Centre of Entrepreneurship;
        - *CE-samenwerkingsverband:* een samenwerkingsverband, ten minste bestaande uit twee hoger onderwijsinstellingen
      die blijkens schriftelijke stukken samenwerken in het kader van een CE-project;
        - *Centre of Entrepreneurship:* de coördinatie, organisatie of ondersteuning van multidisciplinair en
      instellingsbreed ondernemerschapsonderwijs met als doel binnen een of meerdere hoger onderwijsinstellingen
      ondernemerschap te stimuleren;
        - *hoger onderwijsinstelling:* een onderwijsinstelling bedoeld in het eerste lid, onderdeel f;
        - *ondernemerschapsonderwijsproject:* een samenhangend geheel van activiteiten gericht op de totstandkoming,
      verbetering of verspreiding van ondernemerschap in het onderwijs;
        - *onderwijssamenwerkingsverband:* een samenwerkingsverband, bestaande uit ten minste twee onderwijsinstellingen en
      of instellingsonderdelen die blijkens schriftelijke stukken in het kader van ondernemerschapsonderwijs samenwerken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.1
  - number: '6.2'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een onderwijsinstelling of de deelnemers in een
      onderwijssamenwerkingsverband dat een ondernemerschapsonderwijsproject uitvoert.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.2
  - number: '6.3'
    text: |-
      In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een
      ondernemerschapsonderwijsproject 50% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: '6.4'
    text: |-
      Indien voor de subsidiabele kosten of een deel daarvan reeds door de Commissie van de Europese Gemeenschappen
      dan wel een bestuursorgaan van een provincie of gemeente subsidie is verstrekt, wordt slechts een zodanig bedrag
      aan subsidie verstrekt, dat het totale bedrag aan subsidie niet meer bedraagt dan 75 procent van de subsidiabele
      kosten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.4
  - number: '6.5'
    text: |-
      Voor subsidie komen de volgende rechtstreeks aan het ondernemerschapsonderwijsproject toe te rekenen, na de
      indiening van de aanvraag gemaakte en betaalde kosten in aanmerking:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.5
  - number: 6.5.a
    text: |-
      loonkosten van het personeel van de bij het ondernemerschapsonderwijsproject betrokken onderwijsinstellingen, met
      dien verstande dat deze loonkosten worden bepaald op basis van een door de onderwijsinstelling voor dat personeel
      gehanteerd integraal uurtarief;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.5
  - number: 6.5.b
    text: aan derden verschuldigde kosten voor verrichte arbeid;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.5
  - number: 6.5.c
    text: |-
      materiaalkosten voor de aanschaf van middelen of materialen die een functionele relatie tot het
      ondernemerschapsonderwijsproject hebben met dien verstande dat deze kosten niet meer dan 25 procent van de totale
      subsidiabele kosten bedragen, voor zover deze niet zijn opgenomen in het integrale uurtarief;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.5
  - number: 6.5.d
    text: |-
      kosten voor overhead, met dien verstande dat deze kosten niet meer dan 50 procent van de loonkosten, bedoeld onder
      a, bedragen, voor zover deze niet zijn opgenomen in het integrale uurtarief;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.5
  - number: 6.5.e
    text: |-
      de kosten voor projectmanagement, met dien verstande dat deze kosten niet meer dan 5 procent van de loonkosten,
      bedoeld onder a, bedragen, voor zover deze niet zijn opgenomen in het integrale uurtarief.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.5
  - number: '6.6'
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.6
  - number: 6.7.1
    text: |-
      Er is een Adviescommissie ondernemerschap en onderwijs die tot taak heeft de minister op zijn
      verzoek te adviseren omtrent aanvragen om subsidie en in dat kader omtrent de afwijzingsgronden
      voor een ondernemerschapsonderwijsproject, met uitzondering van de afwijzingsgrond, bedoeld in
      [artikel 22 van het Kaderbesluit EZ-subsidies][ref1], en de rangschikkingscriteria, bedoeld in
      [artikel 6.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel6
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7.2
    text: De commissie bestaat uit ten minste vier en ten hoogste acht leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.7
  - number: 6.7.3
    text: De voorzitter en de andere leden worden voor een termijn van ten hoogste vier jaar benoemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.7
  - number: '6.8'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 6.9.1
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.9
  - number: 6.9.1.a
    text: voor het ondernemerschapsonderwijsproject reeds door de rijksoverheid subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.9
  - number: 6.9.1.b
    text: het bedrijfsleven niet op enigerlei wijze betrokken is bij het ondernemerschapsonderwijsproject.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.9
  - number: 6.9.1.c
    text: |-
      onvoldoende vertrouwen bestaat in de structurele voortzetting van de activiteiten waarvoor subsidie wordt
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.9
  - number: 6.9.1.d
    text: |-
      aannemelijk is dat de activiteiten geen verbetering, uitbreiding, wijziging of aanvulling inhouden van reeds
      bestaande activiteiten op het gebied van ondernemerschapsonderwijs van de betrokken onderwijsinstellingen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.9
  - number: 6.9.2
    text: |-
      De afwijzingsgronden, genoemd in [artikel 23, onderdelen a, e en f, van het Kaderbesluit EZ-subsidies][ref1] zijn
      niet van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 6.10.1
    text: 'De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.10.1.a
    text: |-
      het meer bijdraagt aan ondernemerschap als onderdeel van de leeromgeving of het curriculum van leerlingen en
      studenten;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.10.1.b
    text: de kwaliteit van het projectplan hoger is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.10.1.c
    text: het ondernemerschapsonderwijs een groter aantal onderwijsinstellingen bereikt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.10.1.d
    text: |-
      het ondernemerschapsonderwijs een groter aantal leerlingen of studenten van de bij het
      ondernemerschapsonderwijsproject betrokken onderwijsinstellingen bereikt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.10.1.e
    text: het meer bijdraagt aan de creativiteit en innovativiteit van het ondernemerschapsonderwijs.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.10.2
    text: Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.10
  - number: 6.11.1
    text: |-
      Een onderwijsinstelling wordt aangewezen als een instelling als bedoeld in
      [artikel 48, tweede lid, van het Kaderbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel48
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '48'
  - number: 6.11.2
    text: |-
      In afwijking van de [artikelen 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref1] kunnen voorschotten
      slechts op aanvraag van de subsidie-ontvanger worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
  - number: 6.11.3
    text: Een aanvraag om een voorschot wordt ingediend gelijktijdig met het uitbrengen van een tussenrapportage.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.11
  - number: 6.11.4
    text: De aanvraag wordt ingediend met gebruikmaking van een formulier.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.11
  - number: 6.11.5
    text: |-
      Een voorschot wordt berekend naar rato van de gemaakte en betaalde subsidiabele kosten, voor zover deze nog
      niet eerder bij de verstrekking van een voorschot in aanmerking zijn genomen. In het totaal is het bedrag aan
      voorschotten niet groter dan 80 procent van het bij de beschikking tot subsidieverlening vermelde maximale
      subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel6.11
  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - a. een school voor voortgezet onderwijs als bedoeld
      in [artikel 1 van de Wet op het voortgezet onderwijs][ref1] voor zover het daarin verzorgde
      voorbereidend beroepsonderwijs wordt bekostigd uit de openbare kas; b. een instelling als bedoeld in
      [artikel 1.1.1. onderdeel b, van de Wet educatie en beroepsonderwijs][ref2];
        - *praktijkleren:* alle vormen van leren in de beroepspraktijk of met behulp van de beroepspraktijk die in
      combinatie met theorieonderwijs strekken tot het behalen van een diploma in het voorbereidend middelbaar
      beroepsonderwijs of middelbaar beroepsonderwijs;
        - *samenwerkingsverband beroepsonderwijs:* een geen rechtspersoonlijkheid bezittend verband van ten minste één
      MKB-ondernemer en een beroepsonderwijsinstelling dat blijkens schriftelijke stukken samenwerkt in het kader van
      praktijkleren;
        - *vernieuwingstraject:* een traject gericht op het gezamenlijk door ondernemers en beroepsonderwijsinstellingen
      vernieuwen van de vorm, de inhoud en het proces van of de taakverdeling rondom het praktijkleren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '7.2'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan de deelnemers in een samenwerkingsverband beroepsonderwijs dat
      een project uitvoert dat bestaat uit een samenhangend geheel van activiteiten die zijn gericht op:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.2
  - number: 7.2.a
    text: |-
      het door ondernemers en beroepsonderwijsinstellingen gezamenlijk ontwerpen en uitvoeren van een vernieuwingstraject
      of
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.2
  - number: 7.2.b
    text: |-
      het duurzaam verankeren van het door ondernemers en beroepsonderwijsinstellingen gezamenlijk ontwikkelde
      vernieuwingstraject op basis van schriftelijke afspraken.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.2
  - number: '7.3'
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.3
  - number: 7.4.1
    text: Het maximum subsidiebedrag bedraagt € 500.000 per subsidie-ontvanger.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde project en die samen een
      subsidiebedrag van meer dan € 500.000 betreffen, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.4
  - number: '7.5'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.5
  - number: '7.6'
    text: |-
      Bij de toepassing van [artikel 6 van het Kaderbesluit EZ-subsidies][ref1] blijven de aanvullende
      vergoedingen op grond van de [Regeling innovatiebox beroepsonderwijs 2006-2009][ref2] en de
      [Regeling stagebox beroepsonderwijs 2006 tot en met 2010][ref3] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019905
      [ref3]: https://wetten.overheid.nl/BWBR0020403
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0019905
      - id: ref3
        bwb_id: BWBR0020403
  - number: '7.7'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is drie jaar voor de in
      [artikel 7.2][ref2] genoemde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel7
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.8.1
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
  - number: 7.8.1.a
    text: |-
      de voor rekening van de deelnemers blijvende subsidiabele kosten voor meer dan 60 procent voor rekening komen van
      de deelnemende ondernemers tezamen, dan wel van de deelnemende beroepsonderwijsinstellingen tezamen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
  - number: 7.8.1.b
    text: |-
      de personele inbreng in de uitvoering van het project niet evenredig is verdeeld over de deelnemende
      beroepsonderwijsinstellingen en de deelnemende ondernemers;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
  - number: 7.8.1.c
    text: onvoldoende vertrouwen bestaat in de financiële haalbaarheid van het project;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
  - number: 7.8.1.d
    text: onvoldoende aannemelijk is dat de samenwerking leidt tot verbetering van het praktijkleren;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
  - number: 7.8.1.e
    text: |-
      de kosten van het project niet in verhouding zijn met de activiteiten en de te verwachten resultaten, met name voor
      de MKB-ondernemers;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
  - number: 7.8.1.f
    text: |-
      onvoldoende vertrouwen bestaat in de structurele voortzetting van de activiteiten, bedoeld in
      [artikel 7.2, onderdeel b][ref1], indien het project mede is gericht op duurzame verankering als daar bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel7
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.8.2
    text: |-
      De afwijzingsgronden, genoemd in [artikel 23, onderdelen a, b, d, e en f, van het Kaderbesluit EZ-subsidies][ref1]
      zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '7.9'
    text: |-
      In afwijking van [artikel 46, vierde lid][ref1], en [47, tweede lid, van het Kaderbesluit EZ-subsidies][ref2]
      bedraagt het voorschot 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel47
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '47'
  - number: '7.10'
    text: |-
      De subsidieontvanger neemt deel aan de jaarlijkse bijeenkomst van projectleiders voor projecten die wordt
      georganiseerd door het Ministerie van Economische Zaken in het kader van deze regeling en brengt op deze
      bijeenkomst verslag uit omtrent de uitvoering van het project.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.10
  - number: 7.11.1
    text: |-
      De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van het door hem uitgevoerde project,
      voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.11
  - number: 7.11.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.11
  - number: '7.12'
    text: |-
      De subsidie-ontvanger is verplicht binnen drie maanden na de datum van de beschikking tot subsidieverlening te
      starten met de activiteiten, bedoeld in [artikel 7.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel7
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.13'
    text: 'Het formulier voor het indienen van een aanvraag voor:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.13
  - number: 7.13.a
    text: |-
      een subsidie is opgenomen in [bijlage 7.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 7.13.b
    text: |-
      een subsidievaststelling is opgenomen in [bijlage 5.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '8.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: 8.1.−
    text: |-
      *contractprijs:* de tussen opdrachtgever en scheepswerf overeengekomen prijs voor de bouw van een schip, met
      inbegrip van stelposten voor zover daarvoor in het contract vaste of geschatte bedragen zijn opgenomen en met
      uitzondering van de eventueel verschuldigde omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: 8.1.−
    text: |-
      *kredietbedrag:* het bedrag dat op grond van de kredietovereenkomst als krediet wordt verstrekt ten behoeve van de
      bouw in Nederland van een nieuw schip;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: 8.1.−
    text: |-
      *kredietovereenkomst:* schriftelijke overeenkomst tussen een scheepswerf en een financier waarbij de financier op
      verzoek van de scheepswerf krediet verstrekt aan de scheepswerf voor de bouw in Nederland van een nieuw schip;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: 8.1.−
    text: '*opdrachtgever:* natuurlijke of rechtspersoon die opdracht heeft gegeven tot de bouw van een schip;'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: 8.1.−
    text: |-
      *scheepswerf:* een ondernemer die schepen ontwerpt, ontwikkelt, bouwt en uitrust, hetzij zelfstandig, hetzij deel
      uitmakend van een groep;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: 8.1.−
    text: |-
      *schip:* een zichzelf voortstuwend schip, met een minimaal vermogen van 365 kW of een minimaal tonnage van 500
      bruto ton, niet zijnde een schip dat overeenkomstig zijn fundamentele en technisch vermogen is bedoeld om voor
      militaire doeleinden te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.1
  - number: '8.2'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een bank, niet zijnde een bank die uitsluitend
      beleggingsonderneming is.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.2
  - number: 8.3.1
    text: |-
      De minister verstrekt op aanvraag subsidie aan een financier voor het verstrekken van een krediet aan een
      scheepswerf ten behoeve van de bouw in Nederland van een nieuw schip.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.3
  - number: 8.3.2
    text: De subsidie wordt verstrekt in de vorm van een garantstelling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Er wordt garant gestaan voor maximaal 80 procent van de financiële verplichtingen die ingevolge artikel 2 van de
      overeenkomst tot garantstelling die is opgemaakt conform het model dat is opgenomen in [bijlage 8.1][ref1], onder
      de garantstelling vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 8.4.2
    text: |-
      Er wordt niet garant gestaan voor de kosten die de financier in rekening brengt aan de scheepswerf, met
      uitzondering van de kosten ten behoeve van de financiering van de bouw van het schip.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.4
  - number: 8.5.1
    text: |-
      Er is een Adviescommissie Garantieregeling scheepsnieuwbouwfinanciering die tot taak heeft de minister op zijn
      verzoek te adviseren omtrent:
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.5
  - number: 8.5.1.a
    text: |-
      de afwijzingsgronden voor aanvragen om garantstelling, bedoeld in [artikelen 22][ref1] en
      [24 van het Kaderbesluit EZ-subsidies][ref2] en bedoeld in [artikel 8.7][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0024902#Artikel8
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0024902
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.5.1.b
    text: |-
      de bepaling van het tarief van de provisie bedoeld in [artikel 8.10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel8
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.5.2
    text: De commissie bestaat uit ten minste drie en ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.5
  - number: 8.5.3
    text: De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.5
  - number: 8.6.1
    text: |-
      De financier dient de aanvraag om een garantstelling in binnen zeven werkdagen na het sluiten van de
      kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.6
  - number: 8.6.2
    text: De minister stuurt de financier binnen vijf werkdagen een bevestiging van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.6
  - number: '8.7'
    text: 'De minister beslist afwijzend op een aanvraag om subsidie indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.a
    text: |-
      ten laste van de Staat een garantstelling, borgstelling, verzekering of herverzekering voor een kredietovereenkomst
      voor de bouw van hetzelfde schip is afgegeven;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.b
    text: de contractprijs minder dan € 3.000.000 of meer dan € 100.000.000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.c
    text: onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van de bouw van het schip;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.d
    text: het kredietbedrag meer dan 80 procent van de contractprijs betreft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.e
    text: |-
      de kredietovereenkomst ten aanzien van het kredietbedrag een looptijd heeft van meer dan 36 maanden of de looptijd
      van de kredietovereenkomst langer is dan de termijn voor de bouw en technische-/financiële oplevering van het
      schip;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.f
    text: |-
      de financier op het moment van het verstrekken van het kredietbedrag waarvoor de Staat garant staat een lopende
      financieringsfaciliteit verlaagt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.g
    text: |-
      de financier onvoldoende naar normaal bankgebruik te vestigen zekerheden heeft gevestigd of zal vestigen bij de
      verstrekking van het kredietbedrag aan de scheepswerf;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.h
    text: |-
      door de verlening van de garantstelling het totaal van de op grond van dit hoofdstuk verleende garantstellingen ten
      behoeve van de scheepswerf of van de groep, waartoe deze scheepswerf behoort, meer zou bedragen dan 30 procent van
      het subsidieplafond;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.i
    text: gegronde vrees bestaat dat de scheepswerf zich in financiële moeilijkheden bevindt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.j
    text: de rentabiliteits- en continuïteitsperpectieven van de scheepswerf onvoldoende bevredigend zijn;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.k
    text: |-
      onvoldoende vertrouwen bestaat dat de scheepswerf de capaciteiten heeft om de bouw van het schip naar behoren uit
      te voeren;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.l
    text: |-
      uit het contract tussen de opdrachtgever en de scheepswerf die de opdracht zal uitvoeren niet blijkt dat de
      opdrachtgever, ter zake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft afgesloten,
      voorafgaand aan een uitbetaling van het krediet op grond van de kredietovereenkomst, een of meer aanbetalingen doet
      ter hoogte van ten minste 5 procent van de contractprijs;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.m
    text: |-
      uit het contract tussen de opdrachtgever en de scheepswerf die de opdracht zal uitvoeren niet blijkt dat de
      aanbetaling door de opdrachtgever, ter zake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft
      afgesloten, oploopt tot ten minste 20 procent van de contractprijs tot aflevering van het schip;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: 8.7.n
    text: van de bouw van het schip onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.7
  - number: '8.8'
    text: |-
      De minister verdeelt het subsidieplafond voor het stellen van garanties op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.8
  - number: '8.9'
    text: |-
      Het model voor de overeenkomst tot garantstelling is opgenomen in [bijlage 8.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 8.10.1
    text: |-
      Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], bedraagt
      jaarlijks tussen 0,39 procent en 4,19 procent van het bedrag dat op enig moment gedurende de bouw van een schip op
      basis van een kredietovereenkomst daadwerkelijk door een scheepswerf als krediet is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 8.10.2
    text: |-
      De minister bepaalt in de beschikking tot verlening van subsidie in de vorm van een garantstelling het tarief per
      individuele garantstelling.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.10
  - number: 8.10.3
    text: 'Het tarief, bedoeld in het tweede lid, wordt zodanig vastgesteld dat:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.10
  - number: 8.10.3.a
    text: het marktconform is;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.10
  - number: 8.10.3.b
    text: de provisie zowel de met de garantstelling verbonden risico´s als de beheerskosten dekt;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.10
  - number: 8.10.3.c
    text: rekening wordt gehouden met een realistische risicoanalyse.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.10
  - number: '8.11'
    text: De minister beziet eenmaal per jaar of de in dit hoofdstuk gestelde vereisten moeten worden herzien.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.11
  - number: '8.12'
    text: |-
      Het formulier voor het indienen van een aanvraag om garantstelling is opgenomen in [bijlage 8.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '9.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *veiligheidsadviseur:* een onafhankelijke veiligheidsdeskundige: 1°. die
      een diploma, certificaat of andere titel heeft behaald in ten minste één van de in [bijlage 9.1][ref1] opgenomen
      opleidingen of in een gelijkwaardige opleiding; 2°. die de cursus Adviseur Veiligheid Kleine Bedrijven van
      het Ministerie van Economische Zaken heeft gevolgd; 3°. die een recente verklaring omtrent gedrag, een recente
      verklaring van betrouwbaarheid of een door een bestuursorgaan afgegeven vergelijkbaar document met ten minste een
      gelijkwaardige betrouwbaarheid kan overleggen; 4°. die voldoet aan de in [bijlage 9.2][ref2] opgenomen gedragscode;
      5°. waarvan gebleken is dat de door hem gemaakte veiligheidsscans van voldoende kwaliteit zijn; 6°. die tenminste
      vijf jaren relevante ervaring als veiligheidsadviseur heeft.
        - *veiligheidsmaatregelen:* de in een veiligheidsscan genoemde maatregelen ten behoeve van de preventie van
      criminaliteit;
        - *veiligheidsscan:* een door een veiligheidsadviseur uitgevoerd onderzoek naar te nemen maatregelen ten
      behoeve van de preventie van criminaliteit in één of meer vestigingen van een MKB-ondernemer of in de voor de
      bedrijfsvoering van een MKB-ondernemer relevante bedrijfsmiddelen en waarin in ieder geval wordt ingegaan op de te
      nemen organisatorische, bouwkundige, elektronische en digitale maatregelen en hun onderlinge samenhang.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
      [ref2]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024902
      - id: ref2
        bwb_id: BWBR0024902
  - number: '9.2'
    text: Een subsidie die op grond van dit hoofdstuk wordt verstrekt valt onder de de-minimis verordening.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.2
  - number: '9.3'
    text: De minister verstrekt op aanvraag subsidie aan een MKB-ondernemer die een veiligheidsscan heeft laten uitvoeren.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.3
  - number: '9.4'
    text: De subsidie voor de veiligheidsscan bedraagt € 300.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.4
  - number: '9.5'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.5
  - number: 9.6.1
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.a
    text: |-
      aan de MKB-ondernemer voor dezelfde vestiging of hetzelfde bedrijfsmiddel reeds eerder subsidie is verstrekt op
      grond van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.b
    text: de MKB-ondernemer geen Kamer van Koophandel-nummer heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.c
    text: |-
      de aanvrager een MKB-ondernemer zonder vestigingen is, die meer dan tien fulltime-equivalents werknemers in dienst
      heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.d
    text: |-
      de aanvrager een MKB-ondernemer met minder dan zes vestigingen is en bij één of meer van die vestigingen meer dan
      tien fulltime-equivalents werknemers in dienst zijn;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.e
    text: de MKB-ondernemer meer dan vijf vestigingen heeft;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.f
    text: de veiligheidsscan niet wordt uitgevoerd ten behoeve van de bedrijfsuitoefening van de MKB-ondernemer in Nederland;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.g
    text: de veiligheidsscan geen betrekking heeft op de bedrijfsuitoefening van de MKB-ondernemer;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.h
    text: de aanvrager geen KvK-nummer heeft voor de vestiging waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.i
    text: |-
      reeds eerder subsidie is verstrekt op grond van dit hoofdstuk voor een vestiging op hetzelfde adres van een tot de
      groep van de MKB-ondernemer behorende onderneming;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.j
    text: |-
      de adresgegevens van de vestiging in het handelsregister niet overeenkomen met de adresgegevens van de vestiging in
      de aanvraag;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.k
    text: de veiligheidsscan op het moment van de ontvangst van de aanvraag ouder is dan negen maanden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.1.l
    text: reeds subsidie is verstrekt door de Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
  - number: 9.6.2
    text: |-
      De afwijzingsgronden, genoemd in [artikel 23, onderdelen b, c, d, e, f en h, van het Kaderbesluit EZ-subsidies][ref1]
      zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '9.7'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een MKB-ondernemer voor het treffen van één of meer in een
      veiligheidsscan opgenomen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.7
  - number: '9.8'
    text: |-
      De subsidie voor de veiligheidsmaatregelen bedraagt 50 procent van de subsidiabele kosten, maar niet meer dan
      € 700.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.8
  - number: 9.9.1
    text: |-
      In afwijking van [artikel 10 van het Kaderbesluit EZ-subsidies][ref1] komen voor subsidie in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 9.9.1.a
    text: de rechtstreeks aan de veiligheidsmaatregelen toe te rekenen gemaakte kosten van derden;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.9
  - number: 9.9.1.b
    text: de periodiek terugkerende kosten van de koop van zaken ter uitvoering van de veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.9
  - number: 9.9.1.c
    text: de overige periodiek terugkerende kosten met betrekking tot de veiligheidsmaatregelen voor het eerste jaar.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.9
  - number: 9.9.2
    text: Onderhoudskosten komen niet voor subsidie in aanmerking.
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.9
  - number: 9.9.3
    text: |-
      In afwijking van [artikel 10, tweede lid, van het Kaderbesluit EZ-subsidies][ref1] komen voor de aanvraag gemaakte
      kosten voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0024902/2013-04-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 9.9.4
    text: |-
      [Artikel 10, derde en vijfde lid, van het Kaderbesluit EZ-subsidies][ref1] is niet van toepassing.


