    text: |-
      1 Voor een startersfonds waaraan op grond van [artikel 4.3][ref1] een subsidie is verstrekt voor het tijdstip
      van de inwerkingtreding van de regeling van de Minister van Economische Zaken van 9 juli 2014, tot wijziging
      van de Subsidie-regeling starten, groeien en overdragen van ondernemingen in verband met actualisatie van de
      subsidiemodule Seed capital technostarters (Stcrt. 2014, 19382) en waarvoor de overeenkomst van geldlening, bedoeld
      in [artikel 4.5][ref2], nog geldig is, blijft deze regeling van toepassing, zoals deze gold voor dat tijdstip.

      2 Op verzoek van een startersfonds als bedoeld in het eerste lid kan de overeenkomst van geldlening worden
      aangepast overeenkomstig het model opgenomen in [bijlage 4.2][ref3], indien de aanpassing heeft plaatsgevonden
      binnen vier maanden na het in het eerste lid bedoelde tijdstip.

      3 Het tweede lid is niet van toepassing met betrekking tot het bepaalde in
      [bijlage 4.2, artikel 5, eerste lid, onderdeel c][ref4].


