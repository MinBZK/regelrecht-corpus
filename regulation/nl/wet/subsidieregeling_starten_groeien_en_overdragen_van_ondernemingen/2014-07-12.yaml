  - number: '3.4'
    text: |-
      1 Er wordt garant gestaan voor 50 procent van de waarde van het risicokapitaal.

      2 Indien de financier bij het verkrijgen van risicokapitaal een gedeelte daarvan niet onder de garantstelling van
      de Staat brengt, zijn de bepalingen in hoofdstuk 3 van deze regeling slechts van toepassing op het gedeelte van het
      verkregen risicokapitaal dat onder de garantstelling is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.4
  - number: '3.5'
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op risicokapitaal waarbij de waarde van het risicokapitaal dat
      aan de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de
      waarde van risicokapitaal dat door een andere financier met toepassing van dit hoofdstuk en van risicokapitaal dat
      met toepassing van [hoofdstuk 4][ref1] van deze regeling aan de ondernemer onderscheidenlijk de groep is verstrekt
      of gelijktijdig wordt verstrekt, niet meer bedraagt dan € 5.000.000.

      2 In afwijking van het eerste lid heeft de garantstelling voor participatiemaatschappijen uitsluitend betrekking
      op risicokapitaal waarbij de waarde van het risicokapitaal dat aan de ondernemer of, indien de ondernemer deel
      uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de waarde van het risicokapitaal dat door een
      andere participatiemaatschappij met toepassing van dit hoofdstuk en van risicokapitaal dat met toepassing van
      [hoofdstuk 4][ref2] van deze regeling aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig
      wordt verstrekt, niet meer bedraagt dan € 25.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
