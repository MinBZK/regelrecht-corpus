  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *achtergestelde vordering:* een vordering van een startersfonds ten laste van een technostartersvennootschap,
      a. die het startersfonds heeft verkregen door aan de technostartersvennootschap geld ter leen te verstrekken, b.
      waarop de debiteur krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding, een
      akkoord na verlening van surseance van betaling of een akkoord in faillissement van de debiteur, eerst verplicht
      is rente en aflossing te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn voldaan,
      met uitzondering van de schulden die voortvloeien uit leningen waaraan een bepaling van gelijke aard als voornoemde
      bepaling is verbonden, c. terwijl ingevolge de vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan
      van alle rechten tot verrekening van de rente en aflossing;
        - *beheerskosten:* alle kosten die een startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartersvennootschappen, uitgezonderd de
      verkrijgingprijs van de participaties;
        - *creatieve technostarter:* een technostarter die actief is in de creatieve zakelijke dienstverlening, media,
      entertainment, of kunsten;
        - *eerste commerciële verkoop:* eerste verkoop door een onderneming op een product- of dienstenmarkt;
        - *fondsplan:* een plan van een startersfonds tot uitvoering van een met elkaar samenhangend geheel van
      activiteiten die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de
      desbetreffende technostartersvennootschappen;
        - *informal investor:* een particulier die voor eigen rekening en risico participeert en investeert in
      ondernemingen;
        - *inkomsten:* alle op geld waardeerbare voordelen die een startersfonds heeft verkregen uit een participatie,
      waaronder dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen
      de participatie door de technostartersvennootschap is ingekocht of terugbetaald en de liquidatie-uitkering;
        - *investeringsbudget:* de financiële middelen die een startersfonds beschikbaar heeft of zal hebben en die bestemd
      zijn om de verkrijgingprijs van participaties te voldoen;
        - *investeringsperiode:* de periode gedurende welke een startersfonds activiteiten verricht ter verkrijging van
      participaties;
        - *participatie:* risicodragend kapitaal in de vorm van: a. aandelen in het kapitaal van een
      technostartersvennootschap die het startersfonds rechtstreeks van de technostartersvennootschap heeft verkregen
      tegen volstorting van die aandelen in geld, of door omzetting van een achtergestelde vordering of b. aandelen
      in het kapitaal van een technostartersvennootschap als bedoeld onder 1° in combinatie met een achtergestelde
      vordering;
        - *referentierente:* de referentierentevoet, bedoeld in de Mededeling van de Commissie over de methode waarmee de
      referentie- en disconteringspercentages worden vastgesteld (PbEG 1997, C 273), zoals laatstelijk vastgesteld voor
      Nederland, en vermeerderd met 4 procent;
        - *startersfonds:* een vennootschap: a. in de vorm van kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de andere lidstaten van de Europese Unie; b. die
      blijkens de akte waarbij haar statuten zijn vastgesteld of blijkens de overeenkomst waarbij zij is aangegaan
      uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan technostartersvennootschappen teneinde
      winst te behalen; en c. waarin ten minste drie aandeelhouders of hoofdelijk aansprakelijke vennoten deelnemen
      respectievelijk samenwerken zonder dat twee of drie van hen tot dezelfde groep behoren en zonder dat één van hen
      een meerderheidsbelang in het fonds heeft;
        - *technostarter*: een rechtspersoon die een onderneming drijft die: a. minder dan zeven jaar na haar eerste
      commerciële verkoop actief is op een markt; b. ten tijde van de eerste verstrekking van risicodragend kapitaal
      op grond van dit hoofdstuk voldoet aan de definitie van middelgrote, kleine of micro-ondernemingen; en c. hetzij
      voor eigen rekening en risico producten, processen of diensten – niet zijnde adviezen – verkoopt en levert, die
      zijn gebaseerd op een nieuwe technische vinding of een nieuwe toepassing van bestaande technologie, d. hetzij
      deel uitmaakt van één van de creatieve sectoren en voor eigen rekening en risico producten, processen of diensten
      – niet zijnde adviezen – verkoopt en levert, die zijn gebaseerd op een nieuwe creatieve vinding of op een nieuwe
      toepassing van een bestaande creatieve vinding;
        - *technostartersvennootschap:* een technostarter die a. een onderneming drijft in de vorm van een
      kapitaalvennootschap, en b. zijn primaire bedrijfsactiviteiten in Nederland uitvoert, behoudens voor zover de
      onderneming behoort tot de economische sectoren van landbouw, visserij, aquacultuur of scheepsbouw of tot de EGKS-
      sectoren;
        - *verkrijgingprijs van een participatie:* het bedrag in geld waarvoor het startersfonds de participatie heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.1
  - number: '4.2'
    text: Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een startersfonds.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.2
  - number: '4.3'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan.

      2 De minister verstrekt op aanvraag subsidie aan een startersfonds voor het uitvoeren van een fondsplan voor een
      creatieve technostarter.

      3 De subsidie wordt verleend in de vorm van een geldlening.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.3
  - number: 4.3a
    text: |-
      De beschikking tot verlening van een subsidie kan worden verleend onder voorwaarden gericht op het wegnemen of
      beperken van risico’s die aan de subsidieverstrekking, bedoeld in [artikel 4.3][ref1], verbonden kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.3a
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '4.5'
    text: |-
      1 In de overeenkomst van geldlening wordt bepaald dat:

      a. de financier een deel van de inkomsten uit participaties overboekt aan de minister;

      b. de financier geen andere activiteiten verricht dan de uitvoering van het fondsplan.

      2 In de overeenkomst van geldlening kunnen bepalingen worden opgenomen die strekken tot verwezenlijking van het
      doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.5
  - number: '4.6'
    text: |-
      De geldlening die op grond van de overeenkomst van geldlening ten hoogste kan worden geleend, bedraagt 50 procent
      van het investeringsbudget.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.6
  - number: '4.7'
    text: |-
      1 Er wordt borg gestaan voor 100 procent van het bedrag.

      2 Het maximum subsidiebedrag bedraagt € 6.000.000 per subsidie-ontvanger.

      3 Indien een ander bestuursorgaan of de Commissie van de Europese Gemeenschappen een financiële bijdrage aan
      het investeringsbudget van de financier heeft verstrekt, wordt op grond van deze regeling slechts een zodanige
      geldlening verstrekt, dat het totaal van de geldlening en de andere financiële bijdragen niet meer bedraagt dan het
      in het eerste lid bedoelde percentage.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4.7
  - number: '4.8'
    text: |-
      1 Er is een Adviescommissie seed capital technostarters die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [24 van het Kaderbesluit EZ-subsidies][ref2] en
      in [artikel 4.9][ref3], en de rangschikkingscriteria, bedoeld in [artikel 4.10][ref4].

      2 De commissie bestaat uit ten minste vier en ten hoogste negen leden.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
