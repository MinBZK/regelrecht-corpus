  - number: B2.3:9
    text: |-
      De Bank voldoet slechts aan de voor haar uit het bodemsaneringsborgstellingskrediet jegens de MKB-ondernemer
      voortvloeiende betalingsverplichtingen voor zover de MKB-ondernemer door het overleggen van facturen de
      verschuldigdheid van de kosten, die in de schriftelijke verklaring als bedoeld in artikel 8, onderdeel a, ten 1°
      zijn aangemerkt als noodzakelijk voor de sanering van de bodem, heeft aangetoond.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9
  - number: B2.3:10
    text: |-
      1 De Bank voldoet aan hetgeen door door de minister aangewezen bij zijn ministerie werkzame personen
      wordt verzocht, voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering van het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen en deze overeenkomst, en voor zover het betrekking heeft op de uit het besluit en deze
      overeenkomst voortvloeiende zelfstandige verplichtingen van de Bank, op de MKB-ondernemer aan wie het
      bodemsaneringsborgstellingskrediet is verstrekt of op de met deze MKB-ondernemer gesloten kredietovereenkomsten
      omtrent:

      a. het toegang verlenen tot door haar gebruikte plaatsen;

      b. het verlenen van inzage in zakelijke gegevens en bescheiden;

      c. het maken van kopieën van de onder b bedoelde gegevens en bescheiden;

      d. het verlenen van medewerking aan het verstrekken van gegevens door anderen en

      e. het verstrekken van inlichtingen.

      2 Alleen in daartoe aanleiding gevende gevallen zal aan de Bank gevraagd worden de in het eerste lid bedoelde
      inlichtingen ook door haar interne accountant te doen verstrekken.

      3 Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de Bank onjuiste of onvolledige informatie heeft verstrekt.

      4 De Bank stelt, met gebruikmaking van een formulier, waarvan het model door de minister wordt vastgesteld, de
      minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten:

      a. vervroegde volledige aflossing van het bodemsaneringsborgstellingskrediet;

      b. het door de afdeling ....... van de Bank in beheer nemen van het bodemsaneringsborgstellingskrediet;

      c. de verlening van surséance van betaling aan of de faillietverklaring van de MKB-ondernemer;

      d. opeising van het bodemsaneringsborgstellingskrediet.

      5 Na afsluiting van ieder boekjaar zendt de Bank voor 1 februari van het daaropvolgende jaar, met gebruikmaking van
      een formulier, waarvan het model door de minister wordt vastgesteld, aan de minister een opgave van de omvang van
      de borgstelling aan het einde van het boekjaar voor alle bodemsaneringsborgstellingskredieten te zamen, waarvoor de
      Bank nog geen verzoek om betaling als bedoeld in artikel 14 heeft ingediend. Deze omvang dient te worden berekend
      met toepassing van paragraaf 4.

      6 Binnen zes maanden na afsluiting van ieder boekjaar zendt de Bank, met gebruikmaking van een formulier, waarvan
      het model door de minister wordt vastgesteld, aan de minister een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] waaruit blijkt van de juistheid en
      volledigheid van de in het vijfde lid bedoelde opgave.

      7 Tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet wordt
      verstrekt en tijdens de uitwinning zal de Bank waken over de belangen van de staat als borg.

      8 De Bank zal tijdens de looptijd van de kredietovereenkomst uit hoofde waarvan een
      bodemsaneringsborgstellingskrediet is verleend in de door haar te sluiten overeenkomsten met allen, niet
      zijnde de staat, die zich borg willen stellen voor de nakoming door de MKB-ondernemer van de verplichtingen
      voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet
      is verleend een beding ten behoeve van de staat opnemen, ertoe strekkende dat de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref4] niet geldt ten opzichte van de staat en de Bank zal geen bedingen
      opnemen, ertoe leidende dat:

      1°. een borg er zich op zou kunnen beroepen dat de staat eerst zou moeten worden aangesproken,

      2°. een borg zich zou kunnen onttrekken aan toepassing door de staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref5].

      9 De Bank draagt er zorg voor dat de relaties tussen haar en de bij haar onderneming betrokkenen enerzijds, en de
      ondernemer aan wie een bodemsaneringsborgstellingskrediet is verstrekt anderzijds transparant zijn.

      10 De Bank meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van betaling
      aan de Bank, dan wel een verzoek tot faillietverklaring van de Bank.


