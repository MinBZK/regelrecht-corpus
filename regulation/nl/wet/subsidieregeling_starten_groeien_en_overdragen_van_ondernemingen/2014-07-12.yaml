  - number: B3.2:1
    text: |-
      In deze overeenkomst wordt verstaan onder:

      a. *minister:* de Minister van Economische Zaken;

      b. *kapitaalvennootschap:*

      1°. een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG](31968L0151) van de Raad van
      9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken (PB
      EG L 65), of

      2°. een kapitaalvennootschap die is ingericht naar het recht van één van de lidstaten van de Europese Unie, die
      rechtspersoonlijkheid bezit, een apart vermogen heeft dat bij uitsluiting voor de schulden van de vennootschap
      kan worden aangesproken en op grond van haar nationale wetgeving onderworpen is aan garantievoorwaarden zoals
      bedoeld in [Richtlijn 68/151/EEG](31968L0151) van de Raad om de belangen van zowel deelgerechtigden als derden
      te beschermen;

      c. *ondernemer:* een natuurlijk persoon, een rechtspersoon of een vennootschap, die een onderneming in stand houdt,
      niet zijnde een rechtspersoon die krachtens publiekrecht is ingesteld;

      d. *kleine onderneming:* kleine onderneming in de zin van verordening (EG) nr. 800/ 2008 van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);

      e. *middelgrote onderneming:* een middelgrote onderneming in de zin van verordening (EG) nr. 800/ 2008 van de
      Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);

      f. *participatiemaatschappij:* een vennootschap in de vorm van een kapitaalvennootschap of een vennootschap met een
      afgescheiden vermogen, ingericht naar het recht van één van de lidstaten van de Europese Unie, die blijkens haar
      statuten of blijkens de overeenkomst waarbij zij is aangegaan tot doel heeft of mede tot doel heeft het verstrekken
      van risicokapitaal aan ondernemers teneinde winst te behalen, met uitzondering van startersfondsen als bedoeld in
      [artikel 4.1][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen;

      g. *bank:* binnen het grondgebied van de Europese Unie gevestigde bank die is toegelaten het bedrijf van bank uit
      te oefenen;

      h. *financier:* een bank of een participatiemaatschappij of een andere, door de minister aangewezen instelling;

      i. *achtergestelde lening:*

      1°. een lening van geld door een financier aan een ondernemer met het oog op de financiering door deze onderneming
      van eigen activiteiten,

        - welke lening niet door enige vorm van zekerheid is gedekt, met uitzondering van een borgstelling die een
      aandeelhouder in de onderneming van de ondernemer op persoonlijke titel heeft gegeven,
        - waarop de ondernemer krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding,
      een akkoord na verlening van surseance van betaling, een akkoord in faillissement of een akkoord na het van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan
      de achtergestelde lening is verstrekt, eerst verplicht is de niet vervallen aflossingen te betalen nadat alle
      andere op dat moment bestaande schulden van de debiteur zijn voldaan, met uitzondering van schulden ingevolge
      vorderingen waaraan een bepaling van gelijke aard als voornoemde bepaling zijn verbonden en ingevolge geldleningen
      die zijn verstrekt door aandeelhouders in de onderneming van de ondernemer, en
        - ten aanzien waarvan de financier in de vorenbedoelde akte van geldlening afstand heeft gedaan van alle rechten
      tot verrekening van de niet vervallen aflossingen; of

      2°. een lening van geld door een financier aan een ondernemer die een rechtspersoon is wiens
      activa slechts bestaan uit deelnemingen in of vorderingen op een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref2], met het oog op financiering door deze ondernemer van
      activiteiten van deze dochtermaatschappij,

        - welke lening niet door enige vorm van zekerheid is gedekt, met uitzondering van een persoonlijke borgstelling
      van een aandeelhouder in de onderneming van de ondernemer en van een pandrecht gevestigd op aandelen in de
      dochtermaatschappij,
        - en ten aanzien waarvan de financier in de akte van geldlening afstand heeft gedaan van alle rechten tot
      verrekening van de niet vervallen aflossingen;

      j. *waarde van een achtergestelde lening:* het nog niet afgeloste deel van de lening;

      k. *aandelenkapitaal:* aandelen in het kapitaal van een onderneming van de ondernemer, die de financier
      rechtstreeks van de ondernemer heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van
      een achtergestelde lening;

      l. *waarde van aandelenkapitaal:* het bedrag in geld dat de financier bij de volstorting van de aandelen heeft
      betaald dan wel, in geval van omzetting van een achtergestelde lening, of een deel daarvan, in aandelenkapitaal, de
      waarde van de uitstaande lening voor zover die is omgezet in aandelen, vermeerderd onderscheidenlijk verminderd met
      het bedrag in geld dat wegens de omzetting is bijbetaald door, onderscheidenlijk terugbetaald aan de financier;

      m. *risicokapitaal:* kapitaal in de vorm van aandelenkapitaal of een achtergestelde lening;

      n. *reserveringsquotum:* het bedrag dat de minister op aanvraag van een financier vaststelt als maximum voor de som
      van de garanties voor verstrekkingen van risicokapitaal die:

      1°. gedurende drie jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien het een
      eerste toekenning van een reserveringsquotum betreft;

      2°. gedurende twee jaar vanaf de datum van de beschikking aan de financier kunnen worden verschaft indien reeds
      eerder een reserveringsquotum is toegekend.

      o. *groep:* een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van, of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en

      2°. laatstbedoelde rechtspersonen of vennootschappen;

      p. *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische
      activiteit uitoefent, in Nederland is gevestigd en daar een substantieel deel van haar activiteiten uitvoert.


