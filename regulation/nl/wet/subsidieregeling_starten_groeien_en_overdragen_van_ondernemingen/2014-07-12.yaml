  - number: 3.12i
    text: |-
      De minister beslist afwijzend op een aanvraag voor een garantstelling indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;

      b. er niet wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 3 van het model garantstellingsovereenkomst zoals opgenomen in bijlage 3.6][ref1].

      c. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12i
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12j
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt
      voor de garantie op de verstrekte lening, berekend door alle door de financier over het gegarandeerde deel van de
      lening ontvangen inkomsten te verminderen met:

      a. een kwart procent per jaar voor beheerskosten,

      b. Euribor zoals opgenomen in de kredietofferte aan het te financieren bedrijf vermeerderd met een
      liquiditeitsopslag en

      c. de afsluitprovisie.

      2 Indien de financier een hogere rating heeft dan A, wordt de liquiditeitsopslag vermeerderd met het verschil
      tussen het percentage uit de regeling voor staatsgaranties voor de uitgifte van schuldpapier van banken voor banken
      met een rating A en de werkelijke rating van de financier.

      3 Indien de afsluitprovisie meer bedraagt dan 0,5 procent van de lening, wordt het meerdere toegevoegd aan de in
      het eerste lid, aanhef, genoemde inkomsten.

      4 De minister kan een hoger tarief voor de provisie vaststellen, indien de provisie te laag is in relatie tot het
      risico dat de Staat loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12j
