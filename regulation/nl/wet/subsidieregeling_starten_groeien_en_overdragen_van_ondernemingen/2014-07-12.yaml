  - number: B4.2:16
    text: |-
      Door ondertekening van deze overeenkomst verklaren de aandeelhouders of de hoofdelijk aansprakelijke vennoten
      dat zij alle relevante documenten met betrekking tot de investeringswijze en financiële uitvoering van het
      startersfonds hebben overlegd aan de Staat en eventuele toekomstige relevante documenten ter goedkeuring zullen
      voorleggen aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel16
  - number: B4.2:17
    text: |-
      Het startersfonds scheidt de begroting, alsook de financiën en de administratie, van andere fondsen (zogenaamde
      ‘ring-fencing’).
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel17
  - number: B4.2:18
    text: Deze overeenkomst gaat boven enige andere overeenkomst tussen en met de partijen in het startersfonds.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel18
  - number: B4.2:19
    text: |-
      Indien het startersfonds op «DATUM» aan alle verplichtingen uit hoofde van deze overeenkomst heeft voldaan, hoeft
      het startersfonds, overeenkomstig artikel 2, vijfde lid, de dan uitstaande hoofdsom niet af te lossen. Indien op
      deze datum sprake is van een uitstaande hoofdsom, dient het startersfonds een schriftelijk verzoek in bij de Staat
      tot kwijtschelding van het resterende bedrag van de lening.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel19
