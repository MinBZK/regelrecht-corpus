  - number: '2.5'
    text: |-
      1 Voor subsidie komt niet in aanmerking een financier die een kredietovereenkomst sluit met een MKB-ondernemer die:

      a. een onderneming in stand houdt waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien de
      onderneming nog geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit:

      1°. de beoefening van de land- of de tuinbouw, de vee- of visteelt, de visserij of de teelt van vee- of visvoer,

      2°. de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen of

      3°. het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten;

      b. een aanbieder is als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1] dan wel
      het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder.

      2


