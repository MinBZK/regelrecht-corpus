  - number: B2.2:5
    text: |-
      1. Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan
      een MKB-ondernemer wordt verstrekt, moet voorts aan de volgende criteria zijn voldaan:

      a. de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan
      € 200.000 aan de-minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren.
      Indien de onderneming actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een
      bedrijfsborgstellingskrediet wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde deel van het
      krediet. Bij de bepaling of de verlening van de borgstelling niet leidt tot overschrijding van het desbetreffende
      maximum wordt rekening gehouden met de-minimissteun die is verleend aan ondernemingen die deel uitmaken van
      dezelfde groep;

      b. De Bank heeft er voor zorg gedragen dat:

        - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de verstrekking van het
      bedrijfsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het staatsgegarandeerde deel van
      het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming actief
      is in het wegvervoer, niet meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde in
      aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun dat
      in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.

      2. Dit artikel is niet van toepassing op een kredietovereenkomst die wordt gesloten met een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint-Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5
  - number: B2.2:6
    text: |-
      1. De centrale bank meldt het krediet of het deel van het krediet waarop deze bedrijfsborgstellingsovereenkomst
      van toepassing is binnen 35 dagen na het sluiten van de kredietovereenkomst aan de Staat onder de gelijktijdige
      verstrekking van de door de minister vastgestelde informatie.

      2. De minister bevestigt de ontvangst van een melding binnen 35 dagen na ontvangst.

      3. Voor de toepassing van artikel 3, eerste lid, aanhef en onder c, is de volgorde van ontvangst van de meldingen
      door de minister bepalend.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6
  - number: B2.2:7
    text: |-
      1. Het tarief van de provisie bedraagt eenmalig:

      a. 3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      niet langer dan twee jaar,

      b. 3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan twee jaar, maar niet langer dan vier jaar,

      c. 3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan vier jaar, maar niet langer dan zes jaar,

      d. 4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan zes jaar, maar niet langer dan negen jaar en

      e. 4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan negen jaar, maar niet langer dan twaalf jaar.

      2. Indien overeenkomstig artikel 3, onderdeel b, een provisie is betaald met betrekking tot een kredietovereenkomst
      en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn toe te rekenen aan de
      kredietnemer of aan de Bank, wordt de provisie door de Staat terugbetaald aan de Bank mits de Bank binnen een jaar
      na het sluiten van de kredietovereenkomst daartoe een verzoek aan de Staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7
  - number: B2.2:8
    text: |-
      1. Voor de berekening van de omvang van de borgstelling wordt een bedrijfsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bedrijfsborgstellingskrediet het totaal van de
      bedrijfsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een
      groep, per groep een bedrag van € 1.500.000 niet overschrijdt.

      2. Voor de berekening van de omvang van de borgstelling wordt een starters-borgstellingskrediet slechts
      in aanmerking genomen voor zover door de verstrekking van dit krediet het totaal van de starters-
      borgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een groep, per
      groep een bedrag van € 200.000 niet overschrijdt.

      3. Voor de toepassing van het eerste lid wordt een bedrijfsborgstellingskrediet dat is verstrekt aan een andere
      MKB-ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk
      is, geacht aan de MKB-ondernemer te zijn verstrekt.

      4. Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt bepalend.

      5. Voor de toepassing van het eerste lid worden:

      a. bedrijfsborgstellingskredieten die op een eerder tijdstip overeenkomstig artikel 6 zijn gemeld, slechts voor het
      met overeenkomstige toepassing van de artikelen 9 en 10 berekende gedeelte van die bedrijfsborgstellingskredieten
      in aanmerking genomen;

      b. kredieten, voor zover de Staat daarvoor op grond van het [Kaderbesluit EZ-subsidies][ref1], het Besluit
      borgstelling MKB-kredieten, of het [Besluit borgstelling MKB-kredieten 1997][ref2] nog borg staat, als
      bedrijfsborgstellingskredieten in aanmerking genomen.

      6. In afwijking van het eerste lid, overschrijdt het totaal van de bedrijfsborgstellingskredieten per kalenderjaar
      een bedrag van € 200.000 niet, indien de Bank heeft aangegeven van de mogelijkheid, bedoeld in artikel 3, eerste
      lid, onderdeel k, subonderdeel 3°, gebruik te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8
    references:
