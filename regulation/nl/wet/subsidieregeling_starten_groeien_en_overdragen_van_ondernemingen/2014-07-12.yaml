  - number: 3.12r
    text: De minister verdeelt het subsidieplafond voor garantstellingen op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12r
  - number: 3.12s
    text: |-
      De minister beslist afwijzend op een aanvraag om een garantstelling:

      a. indien de financier geen garantstellingsovereenkomst met de Staat heeft gesloten;

      b. indien er niet wordt voldaan aan de voorwaarden, bedoeld in artikel 3 van het model garantstellingsovereenkomst
      zoals opgenomen in [bijlage 3.9][ref1];

      c. indien de financier eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst;

      d. voor zover voor een lening of deel daarvan reeds door de stichting Waarborgfonds voor de Zorgsector, gevestigd
      te Utrecht, een garantstelling is verstrekt;

      e. indien de activiteiten van de ondernemer niet in overwegende mate betrekking hebben op de curatieve zorg;

      f. indien de lening die de financier op grond van een overeenkomst aan een ondernemer heeft verstrekt geen
      betrekking heeft op de bouw of verbouw van een onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12s
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: 3.12t
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt
      voor de garantie op de verstrekte lening, berekend door alle door de financier over het gegarandeerde deel van de
      lening ontvangen inkomsten te verminderen met:

      a. een kwart procent per jaar voor beheerskosten;

      b. Euribor zoals opgenomen in de kredietofferte aan het te financieren bedrijf vermeerderd met een
      liquiditeitsopslag en

      c. de afsluitprovisie.

      2 Indien de financier een hogere rating heeft dan A, wordt de liquiditeitsopslag vermeerderd met het verschil
      tussen het percentage uit de regeling voor staatsgaranties voor de uitgifte van schuldpapier van banken voor banken
      met een rating A en de werkelijke rating van de financier.

      3 Indien de afsluitprovisie meer bedraagt dan 0,5 procent van de lening, wordt het meerdere toegevoegd aan de in
      het eerste lid, aanhef, genoemde inkomsten

      4 De minister kan een hoger tarief voor de provisie vaststellen, indien de provisie te laag is in relatie tot het
      risico dat de Staat loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12t
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: 3.12u
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *bankgarantie:* de verplichting van een financier om aan een begunstigde, ten laste van een ondernemer, ten
      behoeve van eigen activiteiten van die ondernemer, een bedrag te betalen, indien de begunstigde daarop aanspraak
      maakt, uitgezonderd kredietgaranties;
        - *bankgarantiefaciliteit:* het bedrag waarvoor een financier aan een begunstigde ten laste van een ondernemer
      bankgaranties kan afgeven die onder de garantstelling van de staat kunnen vallen;
        - *waarde van een bankgarantie:* de hoogte van het bedrag waarop maximaal aanspraak kan worden gemaakt onder een
      afgegeven bankgarantie.

      2 Voor de toepassing van deze paragraaf wordt als financier aangewezen:

      a. een bank;

      b. een schadeverzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12u
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
  - number: 3.12v
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het afgeven van een bankgarantie.

      2 De subsidie wordt verstrekt in de vorm van een garantstelling aan een financier voor de terugbetaling van een
      vordering die een financier op een ondernemer krijgt uit hoofde van een betaling onder een bankgarantie die een
      financier op grond van een overeenkomst ten laste van een ondernemer heeft afgegeven voor de duur van minimaal zes
      maanden en maximaal 8 jaar.

      3 In afwijking van het tweede lid kan, indien een bankgarantie geen vaste looptijd heeft en het inroepen daarvan
      afhankelijk is van het zich voordoen van een bepaalde gebeurtenis, een financier een bankgarantie onder de
      garantstelling brengen onder de voorwaarde dat de gebeurtenis bij het aangaan van de bankgarantie zich naar
      verwachting niet meer dan 7 jaar na het afsluiten van de bankgarantiefaciliteit voordoet en dat de begunstigde een
      provincie, gemeente, openbaar lichaam als bedoeld in de Wet gemeenschappelijke regelingen of een dienst, instelling
      of bedrijf van de rijksoverheid is.

      4 De garantstelling heeft slechts betrekking op bankgaranties die worden afgegeven nadat de minister desgevraagd
      een bankgarantiefaciliteit heeft goedgekeurd en voor zover deze faciliteit toereikend en geldig is.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12v
  - number: 3.12w
    text: |-
      1 De financier verstrekt geen bankgarantiefaciliteit aan een ondernemer wiens activiteiten in overwegende mate
      betrekking hebben op:

      a. landbouw, visserij en aquacultuur, met uitzondering van toelevering en dienstverlening;

      b. onroerend goed voor zover de activiteiten gericht zijn op het behalen van resultaten door waardestijging van
      onroerend goed zonder dat er sprake is van significante waardetoevoeging  door eigen productieve activiteiten;

      c. de financiële sector voor zover de ondernemer het bank-, verzekerings- of beleggingsbedrijf uitoefent, of een
      participatiemaatschappij heeft;

      d. de gezondheidszorg, voor zover de onderneming een aanbieder is als bedoeld in
      [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1].

      2 De financier verstrekt geen bankgarantiefaciliteit aan een instelling als bedoeld in
      [artikel 70 van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12w
