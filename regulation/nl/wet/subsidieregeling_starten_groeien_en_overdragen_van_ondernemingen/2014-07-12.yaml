      1 De minister verdeelt het subsidieplafond voor banken en kredietinstellingen in de zin van de
      [Wet financiële markten BES][ref1] door vaststelling van een maximumbedrag per bank respectievelijk
      kredietinstelling die zich bij de minister hebben aangemeld.

      2 De minister stelt het maximumbedrag per financier, als bedoeld in het eerste lid, uiterlijk 1 februari van elk
      kalenderjaar ambtshalve vast voor het voorgaande kalenderjaar.

      3 De minister verdeelt het subsidieplafond voor door de minister aangewezen kredietverstrekkers, als bedoeld in
      [artikel 2.2, eerste en tweede lid][ref2], op volgorde van binnenkomst van de meldingen, bedoeld in artikel 6,
