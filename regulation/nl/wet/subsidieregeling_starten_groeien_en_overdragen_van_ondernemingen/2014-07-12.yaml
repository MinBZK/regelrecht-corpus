  - number: B3.2:9
    text: |-
      1 De financier verzoekt de Staat binnen zes maanden nadat zich de in artikel 8, eerste lid, bedoelde situatie heeft
      voorgedaan om betaling op grond van de garantie met gebruikmaking van een formulier, overeenkomstig een model dat
      als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een kopie van de vervreemdingsovereenkomst, de
      inschrijving in het register van de ontbinding van de rechtspersoon of van de in artikel 8, eerste lid, onder c,
      bedoelde akkoorden en van andere bescheiden als genoemd in het model.

      2 Indien naar het oordeel van de Staat sprake is van een verlies als bedoeld in artikel 8, maakt de financier
      aanspraak op betaling van 50% van het geleden verlies, tenzij de financier in gebreke is gebleven bij de
      naleving van deze overeenkomst.. De Staat bericht hierover de financier binnen dertien weken na ontvangst van het
      betalingsverzoek onder vermelding van het te betalen bedrag.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9
  - number: B3.2:10
    text: |-
      Alle betalingen in verband met deze overeenkomst door de financier geschieden door overmaking van de betreffende
      bedragen naar rekeningnummer PM PMxxxxx bij de ---financier, ten name van SenterNovem, onder vermelding van het
      PM PM---nummer
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel10
  - number: B3.2:11
    text: |-
      1 Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra blijkt dat de
      financier zodanig onjuiste of onvolledige informatie heeft verschaft dat de Staat op een verzoek om betaling een
      andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft.

      2 Indien vanwege een verlies als bedoeld in artikel 8, eerste lid, onderdeel c of d, een uitkering op grond van
      de garantie heeft plaatsgevonden, is de financier verplicht 50% van de aflossingen die na de uitkering worden
      verricht, uit te betalen aan de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel11
  - number: B3.2:12
    text: |-
      1 De Staat is gerechtigd deze overeenkomst schriftelijk op te zeggen indien

      a. de financier tekort schiet bij de nakoming van één van zijn verplichtingen uit hoofde van deze overeenkomst;

      b. ten aanzien van de financier een verzoek bij de rechtbank is ingediend tot verlening van surseance van betaling,
      een verzoek tot faillietverklaring of een verzoek tot van toepassing verklaring van de schuldsaneringsregeling
      natuurlijke personen of een buitengerechtelijk akkoord aan crediteuren wordt aangeboden;

      c. de financier, in geval deze rechtspersoonlijkheid heeft, is ontbonden;

      d. de bepalingen in [hoofdstuk 3][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen
      niet langer verenigbaar zijn met de regels van de Europese Gemeenschappen ten aanzien van staatssteun.

      2 Een opzegging op grond van het eerste lid, onder a, geschiedt uitsluitend nadat de Staat de financier op
      de hoogte heeft gesteld van het voornemen tot opzegging en nadat deze in de gelegenheid is gesteld om een
      tekortschieten dat hersteld kan worden te herstellen binnen een redelijke termijn.

      3 Een opzegging in verband met de in het eerste lid, onder d, bedoelde omstandigheid heeft geen gevolgen voor de
      verplichtingen ten aanzien van verstrekkingen van risicokapitaal die voor het tijdstip van de opzegging onder de
      garantstelling zijn gebracht.


