  - number: '6.2'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een onderwijsinstelling of de deelnemers in een
      onderwijssamenwerkingsverband dat een ondernemerschapsonderwijsproject uitvoert.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.2
  - number: '6.3'
    text: |-
      In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een
      ondernemerschapsonderwijsproject 50% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0026689
  - number: '6.4'
    text: |-
      Indien voor de subsidiabele kosten of een deel daarvan reeds door de Commissie van de Europese Gemeenschappen
      dan wel een bestuursorgaan van een provincie of gemeente subsidie is verstrekt, wordt slechts een zodanig bedrag
      aan subsidie verstrekt, dat het totale bedrag aan subsidie niet meer bedraagt dan 75 procent van de subsidiabele
      kosten.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.4
  - number: '6.5'
    text: |-
      Voor subsidie komen de volgende rechtstreeks aan het ondernemerschapsonderwijsproject toe te rekenen, na de
      indiening van de aanvraag gemaakte en betaalde kosten in aanmerking:

      a. loonkosten van het personeel van de bij het ondernemerschapsonderwijsproject betrokken onderwijsinstellingen,
      met dien verstande dat deze loonkosten worden bepaald op basis van een door de onderwijsinstelling voor dat
      personeel gehanteerd integraal uurtarief;

      b. aan derden verschuldigde kosten voor verrichte arbeid;

      c. materiaalkosten voor de aanschaf van middelen of materialen die een functionele relatie tot het
      ondernemerschapsonderwijsproject hebben met dien verstande dat deze kosten niet meer dan 25 procent van de totale
      subsidiabele kosten bedragen, voor zover deze niet zijn opgenomen in het integrale uurtarief;

      d. kosten voor overhead, met dien verstande dat deze kosten niet meer dan 50 procent van de loonkosten, bedoeld
      onder a, bedragen, voor zover deze niet zijn opgenomen in het integrale uurtarief;

      e. de kosten voor projectmanagement, met dien verstande dat deze kosten niet meer dan 5 procent van de loonkosten,
      bedoeld onder a, bedragen, voor zover deze niet zijn opgenomen in het integrale uurtarief.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.5
  - number: '6.6'
    text: De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.6
  - number: '6.7'
    text: |-
      1 Er is een Adviescommissie ondernemerschap en onderwijs die tot taak heeft de minister op zijn
      verzoek te adviseren omtrent aanvragen om subsidie en in dat kader omtrent de afwijzingsgronden
      voor een ondernemerschapsonderwijsproject, met uitzondering van de afwijzingsgrond, bedoeld in
      [artikel 22 van het Kaderbesluit EZ-subsidies][ref1], en de rangschikkingscriteria, bedoeld in
      [artikel 6.10][ref2].

      2 De commissie bestaat uit ten minste vier en ten hoogste acht leden.

      3 De voorzitter en de andere leden worden voor een termijn van ten hoogste vier jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '6.10'
        hoofdstuk: '6'
  - number: '6.8'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '6.9'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. voor het ondernemerschapsonderwijsproject reeds door de rijksoverheid subsidie is verstrekt;

      b. het bedrijfsleven niet op enigerlei wijze betrokken is bij het ondernemerschapsonderwijsproject.

      c. onvoldoende vertrouwen bestaat in de structurele voortzetting van de activiteiten waarvoor subsidie wordt
      verstrekt;

      d. aannemelijk is dat de activiteiten geen verbetering, uitbreiding, wijziging of aanvulling inhouden van reeds
      bestaande activiteiten op het gebied van ondernemerschapsonderwijs van de betrokken onderwijsinstellingen.

      2 De afwijzingsgronden, genoemd in [artikel 23, onderdelen a, e en f, van het Kaderbesluit EZ-subsidies][ref1] zijn
      niet van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '6.10'
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. het meer bijdraagt aan ondernemerschap als onderdeel van de leeromgeving of het curriculum van leerlingen en
      studenten;

      b. de kwaliteit van het projectplan hoger is;

      c. het ondernemerschapsonderwijs een groter aantal onderwijsinstellingen bereikt;

      d. het ondernemerschapsonderwijs een groter aantal leerlingen of studenten van de bij het
      ondernemerschapsonderwijsproject betrokken onderwijsinstellingen bereikt;

      e. het meer bijdraagt aan de creativiteit en innovativiteit van het ondernemerschapsonderwijs.

      2 Voor de rangschikking wegen de in het eerste lid vermelde criteria even zwaar.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.10
  - number: '6.11'
    text: |-
      1 Een onderwijsinstelling wordt aangewezen als een instelling als bedoeld in
      [artikel 48, tweede lid, van het Kaderbesluit][ref1].

      2 In afwijking van de [artikelen 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref2] kunnen voorschotten
      slechts op aanvraag van de subsidie-ontvanger worden verstrekt.

      3 Een aanvraag om een voorschot wordt ingediend gelijktijdig met het uitbrengen van een tussenrapportage.

      4 De aanvraag wordt ingediend met gebruikmaking van een formulier.

      5 Een voorschot wordt berekend naar rato van de gemaakte en betaalde subsidiabele kosten, voor zover deze nog
      niet eerder bij de verstrekking van een voorschot in aanmerking zijn genomen. In het totaal is het bedrag aan
      voorschotten niet groter dan 80 procent van het bij de beschikking tot subsidieverlening vermelde maximale
      subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel45
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '45'
  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - a. een school voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref1]
      voor zover het daarin verzorgde voorbereidend beroepsonderwijs wordt bekostigd uit de openbare kas; b. een
      instelling als bedoeld in [artikel 1.1.1. onderdeel b, van de Wet educatie en beroepsonderwijs][ref2];
        - *praktijkleren:* alle vormen van leren in de beroepspraktijk of met behulp van de beroepspraktijk die in
      combinatie met theorieonderwijs strekken tot het behalen van een diploma in het voorbereidend middelbaar
      beroepsonderwijs of middelbaar beroepsonderwijs;
        - *samenwerkingsverband beroepsonderwijs:* een geen rechtspersoonlijkheid bezittend verband van ten minste één
      MKB-ondernemer en een beroepsonderwijsinstelling dat blijkens schriftelijke stukken samenwerkt in het kader van
      praktijkleren;
        - *vernieuwingstraject:* een traject gericht op het gezamenlijk door ondernemers en beroepsonderwijsinstellingen
      vernieuwen van de vorm, de inhoud en het proces van of de taakverdeling rondom het praktijkleren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 1.1.1
  - number: '7.2'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan de deelnemers in een samenwerkingsverband beroepsonderwijs dat
      een project uitvoert dat bestaat uit een samenhangend geheel van activiteiten die zijn gericht op:

      a. het door ondernemers en beroepsonderwijsinstellingen gezamenlijk ontwerpen en uitvoeren van een
      vernieuwingstraject of

      b. het duurzaam verankeren van het door ondernemers en beroepsonderwijsinstellingen gezamenlijk ontwikkelde
      vernieuwingstraject op basis van schriftelijke afspraken.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.2
  - number: '7.3'
    text: De subsidie bedraagt 50 procent van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.3
  - number: '7.4'
    text: |-
      1 Het maximum subsidiebedrag bedraagt € 500.000 per subsidie-ontvanger.

      2 Indien verscheidene aanvragen worden gedaan die betrekking hebben op hetzelfde project en die samen een
      subsidiebedrag van meer dan € 500.000 betreffen, wordt het meerdere naar rato in mindering gebracht op de aan de
      betrokken aanvragers te verstrekken subsidie.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.4
  - number: '7.5'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.5
  - number: '7.6'
    text: |-
      Bij de toepassing van [artikel 6 van het Kaderbesluit EZ-subsidies][ref1] blijven de aanvullende
      vergoedingen op grond van de [Regeling innovatiebox beroepsonderwijs 2006-2009][ref2] en de
      [Regeling stagebox beroepsonderwijs 2006 tot en met 2010][ref3] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019905
      [ref3]: https://wetten.overheid.nl/BWBR0020403
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0019905
      - id: ref3
        bwb_id: BWBR0020403
  - number: '7.7'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is drie jaar voor de in
      [artikel 7.2][ref2] genoemde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.7
