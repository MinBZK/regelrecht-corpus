  - number: B2.2:4
    text: |-
      1. Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan
      een MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:

      a. de MKB-ondernemer:

      1°. beschikt over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde wijze te drijven;

      2°. is in Nederland gevestigd en voert daar een substantieel deel van de activiteiten van de onderneming uit;

      3°. is geen aanbieder als bedoeld in [artikel 1, onderdeel c, van de Wet marktordening gezondheidszorg][ref1], noch
      oefent hij het beroep van dierenarts, notaris, advocaat of gerechtsdeurwaarder uit;

      4°. houdt geen onderneming in stand waarvan de laatste jaaromzet voor 50 procent of meer is verkregen, of, indien
      de onderneming nog geen heel jaar is gedreven, waarvan de omzet naar verwachting voor 50 procent of meer zal worden
      verkregen, uit:

        - de beoefening van de land- of de tuinbouw, de vee- of visteelt, de visserij  of de teelt van vee- of visvoer,
        - de uitoefening van het bank-, verzekerings- of beleggingsbedrijf, of het financieren van een of meer andere
      ondernemingen, of
        - het verwerven, vervreemden, beheren of exploiteren van onroerende zaken of het ontwikkelen van onroerende
      zaakprojecten;

      5°. beschikt naast het bedrijfsborgstellingskrediet niet over een lening waarvoor de Staat uit hoofde van de
      [Regeling LNV-subsidies][ref2] of door overname van de verplichtingen van de Stichting Borgstellingsfonds voor de
      landbouw borg of garant staat;

      6°. beschikt niet over een door een andere bank of kredietverstrekker verstrekte kredietfaciliteit, waarvoor de
      Staat op grond van het [Kaderbesluit EZ-subsidies][ref3], het [Besluit borgstelling MKB-kredieten 1997][ref4] of
      het Besluit borgstelling MKB-kredieten borg staat.

      b. er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de Bank naar normaal bankgebruik het krediet
      niet geheel voor eigen rekening en risico kan verstrekken;

      c. de rentabiliteits- en continuïteitsperspectieven van de onderneming zijn bevredigend.

      2. Het eerste lid, onderdeel a, onder 4, eerste gedachtenstreepje, is niet van toepassing op een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint Eustatius of Saba.


