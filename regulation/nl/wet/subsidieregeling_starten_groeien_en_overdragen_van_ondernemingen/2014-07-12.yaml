  - number: B2.5:1
    text: |-
      1 De begrippen die in het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen zijn gedefinieerd hebben in deze overeenkomst de in deze regelingen gegeven
      betekenis.

      2 Voorts wordt in deze overeenkomst verstaan onder:

      a. financieringsfaciliteit: krediet of een deel van een krediet waarvoor de Staat niet borg of garant staat:

      1°. op grond van het [Kaderbesluit EZ-subsidies][ref3], het [Besluit borgstelling MKB-kredieten 1997][ref4], het
      Besluit borgstelling MKB-kredieten, dan wel de [Regeling LNV-subsidies][ref5]; of

      2°. vanwege de overname van de verplichtingen van Stichting Borgstellingsfonds voor de Landbouw;

      b. kredietverstrekker-gelieerde: een rechtspersoon waaraan de kredietverstrekker direct of indirect meer dan
      de helft van het geplaatste kapitaal verschaft of voor het handelen waarvan de kredietverstrekker volledig
      aansprakelijk is, en die als kredietverstrekker-gelieerde is vermeld in artikel 25 van deze overeenkomst;

      c. bedrijfsborgstellingskrediet: krediet of een deel van een krediet dat overeenkomstig artikel 6 is getoetst en
      gemeld;

      d. de-minimissteun: steun van de overheid die voldoet aan de voorwaarden, vastgesteld in verordening (EG) nr.
      1998/2006 van de Commissie van Europese Gemeenschappen van 15 december 2006 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379), verordening (EG) nr. 1535/2007 van de Commissie
      van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de artikelen 87 en 88 van het
      Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337) of verordening (EG) nr. 875/2007 van de
      Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de toepassing van de artikelen 87 en 88 van
      het Verdrag op de-minimissteun in de landbouwsector en de visserijsector (PbEU L 193);

      e. groep: een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of een privaatrechtelijke rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van, of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en

      2°. laatstbedoelde rechtspersonen of vennootschappen;

      f. innovatieve MKB-ondernemer: een MKB-ondernemer ten aanzien waarvan de kredietverstrekker beschikt
      over een gewaarmerkte kopie van een verklaring als bedoeld in [artikel 23, eerste lid][ref6], of
      [artikel 27, eerste lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref7]
      en waarvan het origineel ten hoogste zestien maanden voor de datum waarop de kredietovereenkomst is gesloten is
      afgegeven, of een MKB-ondernemer ten aanzien waarvan de kredietverstrekker beschikt over een advies van de minister
      waaruit blijkt dat de MKB-ondernemer is aan te merken als een innovatieve MKB-ondernemer;

      g. krediet: bedrag dat de kredietverstrekker uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;

      h. kredietovereenkomst: overeenkomst uit hoofde waarvan:

      1°. de kredietverstrekker aan een MKB-ondernemer geld ter leen verstrekt of zal verstrekken, of

      2°. de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de kredietverstrekker, of

      3°. de kredietverstrekker tegenover een derde, niet zijnde een rechtspersoon waarmee de kredietverstrekker in een
      groep verbonden is of een kredietverstrekker-gelieerde, onherroepelijk een verplichting is aangegaan om ten laste
      van de MKB-ondernemer aan de derde een of meer betalingen te doen, welke verplichting niet afhankelijk is van
      voorwaarden op de vervulling waarvan het handelen van de kredietverstrekker van invloed is;

      i. minister: de Minister van Economische Zaken, Landbouw en Innovatie;

      j. starter:

      1°. een MKB-ondernemer, die een natuurlijk persoon is en die niet langer dan drie jaar een onderneming in stand
      houdt;

      2°. een vennootschap met een in aandelen verdeeld kapitaal, tevens MKB-ondernemer, waarvan de bestuurder een
      natuurlijk persoon is die ten tijde van het sluiten van de kredietovereenkomst direct of indirect de meerderheid
      van het geplaatst en gestort kapitaal houdt en deze meerderheid niet langer dan drie jaar houdt;

      k. starters-borgstellingskrediet: bedrijfsborgstellingskrediet dat uitsluitend wordt verstrekt aan een starter;

      l. uitwinning:

      1°. uitwinning door de kredietverstrekker van de door de MKB-ondernemer aan de kredietverstrekker verstrekte
      zekerheden, zoals een redelijk handelend en bekwaam financier in het kader van een actief en winstgericht beleid
      zou hebben gedaan zonder borgstelling;

      2°. onderhandse verkoop met toestemming van de kredietverstrekker door de MKB-ondernemer van de
      vermogensbestanddelen van de MKB-ondernemer, inning van vorderingen daaronder begrepen;

      3°. executoriale verkoop van de vermogensbestanddelen van de MKB-ondernemer; en

      4°. indien het faillissement van de MKB-ondernemer is uitgesproken of aan hem surseance van betaling is verleend de
      onderhandse of executoriale verkoop van de vermogensbestanddelen van de MKB-ondernemer door of met medewerking van
      de curator of de bewindvoerder.


