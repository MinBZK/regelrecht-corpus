        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.2:9
    text: |-
      1. Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 8 in aanmerking te
      nemen bedrijfsborgstellingskrediet na verloop van ieder kalenderkwartaal verminderd met een zodanig vast bedrag,
      dat het bedrijfsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, maar uiterlijk na verloop
      van 6 jaar, nihil bedraagt.

      2. Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van
      ten hoogste twaalf jaar indien:

      a. het bedrijfsborgstellingskrediet uitsluitend is bestemd voor de betaling van de kosten van de stichting, van de
      aankoop of van de verbouwing van een onroerende zaak,

      b. deze onroerende zaak voor ten minste de helft bestemd is te worden gebruikt voor de onderneming van de MKB-
      ondernemer, en

      c. de Bank met betrekking tot de onder a bedoelde kosten bankfaciliteiten verstrekt die een bedrag van ten
      minste 100 procent van de in onderdeel a bedoelde kosten belopen, dan wel, indien sprake is van een starters-
      borgstellingskrediet of een bedrijfsborgstellingskrediet dat per kalenderjaar het bedrag van € 200.000 niet
      overschrijdt, indien de Bank bij de melding, bedoeld in artikel 6, heeft aangegeven hiervan gebruik te maken, 33,3
      procent van dit bedrijfsborgstellingskrediet.

      3. Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van
      ten hoogste twaalf jaar indien het bedrijfsborgstellingskrediet is verstrekt aan een innovatieve MKB-ondernemer.

      4. Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.

      5. Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt aan een
      innovatieve MKB-ondernemer, het eerste kalenderkwartaal waarin vermindering plaatsvindt uiterlijk aanvangt op de
      eerste dag van het veertiende kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst
      is gesloten.

      6. Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt voor de
      betaling van de kosten van de stichting of verbouwing van een onroerende zaak, het eerste kalenderkwartaal waarin
      vermindering plaatsvindt uiterlijk aanvangt op de eerste dag van het zesde kalenderkwartaal dat volgt op het
      kalenderkwartaal waarin de kredietovereenkomst is gesloten.

      7. De Bank kan de vermindering, bedoeld in het eerste lid, gedurende een periode van ten minste een
      kalenderkwartaal opschorten indien:

      a. de Bank voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing van het
      bedrijfsborgstellingskrediet,

      b. de Bank uitstel verleent van de verplichting tot aflossing van alle bankfaciliteiten gedurende de duur van de
      opschorting, dan wel uitstel verleent van de verplichting tot aflossing van een gedeelte van de bankfaciliteiten,
      waarbij de som van de aflossingsbedragen ten minste even groot is als de som van de aflossingsbedragen waarvoor de
      Bank uitstel verleent als bedoeld onder a, of, indien het bedrijfsborgstellingskrediet is verstrekt aan:

      1°. een MKB-ondernemer die ten tijde van de verstrekking starter was, ten minste 33,3 procent bedraagt van de som
      van de aflossingsbedragen waarvoor de Bank uitstel verleent als bedoeld onder a, of

      2°. een MKB-ondernemer die ten tijde van de verstrekking innovatief MKB-ondernemer was, ten minste 50 procent
      bedraagt van de som van de aflossingsbedragen waarvoor de Bank uitstel verleent als bedoeld onder a, en

      c. de centrale Bank de opschorting meldt binnen 35 dagen na aanvang van de opschorting onder gelijktijdige
      verstrekking van de door de minister vastgestelde informatie. De minister bevestigt de melding binnen 35 dagen
      na ontvangst.

      8. De in het zevende lid bedoelde opschorting van de vermindering vindt ten hoogste voor een totaal van acht
      kalenderkwartalen plaats. De opschorting van de vermindering vindt ten hoogste voor een totaal van twaalf
      kalenderkwartalen plaats indien het bedrijfsborgstellingskrediet is verstrekt aan een starter.

      9. Indien een bedrijfsborgstellingskrediet wordt aangewend voor herfinanciering van een
      bedrijfsborgstellingskrediet, dat eerder is gebruikt voor de in het tweede lid, onder a en b genoemde doelen,
      en tevens is voldaan aan het tweede lid, onder b en c, is de nieuwe periode ten hoogste gelijk aan de periode
      waarvoor het bedrijfsborgstellingskrediet nog zou hebben gelopen zonder herfinanciering, indien en voor zover deze
      restperiode meer bedraagt dan zes jaar.

      10. Voor de toepassing van het zesde lid wordt onder een onroerende zaak mede begrepen
      schepen en vliegtuigen, voor zover deze zijn ingeschreven in de registers als bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Kadasterwet][ref1], alsmede ieder goederenrechtelijk recht dat omvat
      het uitsluitend gebruik van een onroerende zaak, met inbegrip van bovenbedoelde schepen en vliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9
