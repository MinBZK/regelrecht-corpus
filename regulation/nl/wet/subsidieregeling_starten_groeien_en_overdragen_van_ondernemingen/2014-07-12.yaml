  - number: B3.2:5
    text: |-
      1 De financier draagt er voor zorg dat een actief en winstgericht beleid wordt gevoerd voor het verstrekken,
      beheren en vervreemden van leningen, waarbij rekening wordt gehouden met het belang van de Staat als garantsteller.

      2 De financier draagt er voor zorg dat degenen die met het verstrekken, beheren of vervreemden van leningen zijn
      belast beschikken over de nodige deskundigheid.

      3 De financier staat er voor in dat degenen die zijn belast met het verstrekken, beheren of vervreemden van
      leningen en met de bepaling van en het toezicht op het beleid ter zake betrouwbaar zijn.

      4 De financier draagt zorg voor een integere bedrijfsvoering en neemt in dat verband de noodzakelijke maatregelen
      om onder meer strafbare handelingen, verstrengeling van tegenstrijdige belangen en afhankelijkheid van de financier
      van bepaalde vennoten, aandeelhouders of andere betrokkenen te voorkomen.

      5 De financier staat er voor in dat aandeelhouders, hoofdelijk aansprakelijke vennoten, bestuurders en beheerders
      van de financier en andere zijdens de financier betrokkenen alleen medewerking verlenen aan verstrekkingen
      van risicokapitaal en krediet door een ander dan de financier aan een onderneming waaraan de financier
      een gegarandeerde lening heeft verstrekt, indien een redelijk handelend en redelijk bekwaam beheerder deze
      verstrekkingen zou hebben gedaan in het kader van een actief en winstgericht beleid.

      6 De financier komt met een ondernemer aan wie een gegarandeerde lening is verstrekt slechts een wijziging
      van het aflossingsschema overeen na voorafgaande toestemming van de Staat, tenzij deze betrekking heeft op een
      versnelde aflossing of op een gehele of gedeeltelijke opschorting van de aflossingen gedurende ten hoogste vier
      aaneengesloten kwartalen die niet is voorafgegaan door een eerdere opschorting van de aflossingen.

      7 De Staat verleent de in het zesde lid bedoelde toestemming indien aannemelijk is dat:

      a. de ondernemer niet in staat is te voldoen aan het bestaande aflossingsschema;

      b. adequate maatregelen worden genomen ter verbetering van de liquiditeit van de onderneming en rekening houdend
      met het belang van rentabiliteit en continuïteit van de onderneming;

      c. rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.

      8 De Staat kan op verzoek van de financier besluiten om de afdracht van de provisie, bedoeld in artikel 6.2, op te
      schorten in het geval dat:

      a. er voor de financier geen mogelijkheden meer zijn om de renteverplichtingen te incasseren bij de ondernemer, en

      b. aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder
      meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de verplichtingen van
      bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.

      9 De financier vervreemdt de lening slechts na voorafgaande toestemming van de Staat.

      10 De financier verleent slechts gehele of gedeeltelijke kwijtschelding van verplichtingen voortvloeiende uit
      de leningovereenkomst, uit hoofde waarvan de gegarandeerde lening is verstrekt, na voorafgaande toestemming
      van de Staat. De Staat geeft toestemming indien de kwijtschelding noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.

      11 De financier brengt slechts wijzigingen aan in de leningovereenkomst van de lening na voorafgaande toestemming
      van de Staat. De Staat kan toestemming geven indien de wijziging noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
