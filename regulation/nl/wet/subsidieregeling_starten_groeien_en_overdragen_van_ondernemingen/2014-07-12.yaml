        artikel: '23'
  - number: '7.9'
    text: |-
      In afwijking van [artikel 46, vierde lid][ref1], en [47, tweede lid, van het Kaderbesluit EZ-subsidies][ref2]
      bedraagt het voorschot 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel47
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.9
    references:
