  - number: B2.5:2
    text: |-
      De Staat stelt zich borg ten behoeve van de kredietverstrekker voor de terugbetaling van
      bedrijfsborgstellingskredieten die met inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en
      [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen van ondernemingen en deze overeenkomst
      door de kredietverstrekker worden verstrekt, met dien verstande dat deze borgstelling wordt aangegaan onder de
      navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel2
