  - number: B2.4:1
    text: |-
      In deze overeenkomst wordt verstaan onder:

        - *groep:* een economische eenheid, waarin organisatorisch zijn verbonden: 1°. een natuurlijke persoon of een
      privaatrechtelijke rechtspersoon die direct of indirect – meer dan de helft van het geplaatste kapitaal verschaft
      aan, – volledig aansprakelijk vennoot is van of – overwegende zeggenschap heeft over een of meer rechtspersonen of
      vennootschappen en 2°. laatstbedoelde rechtspersonen of vennootschappen;
        - *kredietovereenkomst:* een overeenkomst uit hoofde waarvan: 1°. de Bank aan een MKB-ondernemer geld ter leen
      verstrekt of zal verstrekken, of 2°. de MKB-ondernemer tot een bepaald bedrag trekt of zal kunnen trekken op de
      Bank, of 3°. de Bank tegenover een derde, niet zijnde een rechtspersoon waarmee de Bank in een groep verbonden is
      onherroepelijk een verplichting is aangegaan om ten laste van de MKB-ondernemer aan de derde een of meer betalingen
      te doen, welke verplichting niet afhankelijk is van voorwaarden op de vervulling waarvan het handelen van de Bank
      van invloed is;
        - *krediet:* een bedrag dat de Bank uit hoofde van een kredietovereenkomst verstrekt of zal verstrekken;
        - *bodemsaneringsborgstellingskrediet:* een krediet of een deel van een krediet dat overeenkomstig artikel 3 is
      gemeld;
        - *saneringsplan:* plan als bedoeld in [artikel 39 van de Wet bodembescherming][ref1];
        - *saneringsbestek:* bestek gebaseerd op een saneringsplan, dat een gedetailleerde beschrijving omvat van de
      aard en de omvang van de uit te voeren sanering van de bodem met een nauwkeurige beschrijving van het te bereiken
      resultaat en waaruit de omvang van de saneringskosten kan worden afgeleid;
        - *uitwinning:* 1°. uitwinning door de Bank, naar normaal bankgebruik, van de door de MKB-ondernemer aan de
      Bank verstrekte zekerheden, 2°. onderhandse verkoop met toestemming van de Bank door de MKB-ondernemer van de
      vermogensbestanddelen van de MKB-ondernemer, inning van vorderingen daaronder begrepen, 3°. executoriale verkoop
      van de vermogensbestanddelen van de MKB-ondernemer, en 4°. indien het faillissement van de MKB-ondernemer
      is uitgesproken of aan hem surséance van betaling is verleend: onderhandse of executoriale verkoop van de
      vermogensbestanddelen van de MKB-ondernemer door of met medewerking van de curator of de bewindvoerder;
        - *MKB-ondernemer:* een ondernemer die een kleine onderneming of een middelgrote onderneming in stand houdt;
        - *kleine onderneming:* kleine onderneming in de zin van verordening (EG) nr. 800/ 2008 van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
        - *middelgrote onderneming:* een middelgrote onderneming in de zin van verordening (EG) nr. 800/ 2008 van de
      Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van
      artikel 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (de algemene
      groepsvrijstellingsverordening) (PbEU L 214);
        - *de-minimissteun:* steun van de overheid die voldoet aan de voorwaarden, vastgesteld in [verordening (EG) nr.
      1998/2006](32006R1998) van de Commissie van Europese Gemeenschappen van 15 december 2006 betreffende de toepassing
      van de artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379), [verordening (EG) nr. 1535/2007]
      (32007R1535) van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwproductiesector (PbEU L 337) en [verordening
      (EG) nr. 875/2007](32007R0875) van de Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het Verdrag op de-minimissteun in de landbouwsector en de visserijsector
      (PbEU L 193);
        - *Bank:* binnen het grondgebied van de Europese Unie gevestigde bank, niet zijnde een bank die tevens
      beleggingsonderneming is, die is toegelaten het bedrijf van bank uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
