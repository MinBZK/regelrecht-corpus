  - number: '5.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *financiële bijdrage:* een verstrekking van geld met of zonder terugbetalingsverplichting;
        - *innovatieve starter:* een innovatieve starter als bedoeld in paragraaf 5.4 van de Communautaire kaderregeling
      inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *kennisinstelling:* een onderwijsinstelling of een academisch ziekenhuis als bedoeld in
      [artikel 1.13, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];
        - *lening:* een lening aan een rechtspersoon die is verstrekt onder de voorwaarde dat een bij de rechtspersoon
      betrokken natuurlijke persoon garant staat voor de betaling van de rente en de terugbetaling van de hoofdsom, of
      een lening aan een natuurlijke persoon;
        - *maatschappelijke organisatie:* een rechtspersoon zonder winstoogmerk, uitgezonderd ondernemers die geen MKB-
      ondernemer zijn;
        - *onderwijsinstelling:* een bekostigde instelling voor hoger onderwijs als bedoeld in
      [artikel 1.8, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];
        - *starter:* a. een MKB-ondernemer: 1°. die voor eigen rekening en risico producten, processen of diensten verkoopt
      en levert die zijn gebaseerd op een nieuwe vinding of een nieuwe toepassing en 2°. die ten hoogste vijf jaar
      geleden is ingeschreven in het handelsregister of b. een natuurlijke persoon die voorbereidingen treft voor de
      oprichting van een onderneming als bedoeld onder a;
        - *technische haalbaarheidsstudie:* een technische haalbaarheidsstudie in de zin van paragraaf 5.2 van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *valorisatieplan:* een planmatig en met elkaar samenhangend geheel van activiteiten dat: a. strekt tot
      versterking van het valorisatieproces in Nederland door middel van faciliteiten zoals onder meer beschreven in
      [bijlage 5.1.][ref3]; b. wordt uitgevoerd door ten minste één onderwijsinstelling en één in Nederland gevestigde
      onderneming die niet tot dezelfde groep behoren; c. is gebaseerd op een integrale visie ten aanzien van de ambitie
      om het valorisatieproces duurzaam te versterken; d. een looptijd heeft van zes jaar;
        - *valorisatieproces:* het proces waarbij toegevoegde waarde wordt gecreëerd door kennis geschikt of beschikbaar te
      maken voor economische of maatschappelijke benutting en door deze kennis daadwerkelijk aan te wenden in producten,
      diensten en processen of anderszins met deze kennis nieuwe bedrijvigheid te creëren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.13
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.8
      [ref3]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.1
