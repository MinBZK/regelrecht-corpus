        artikel: '32'
  - number: '3.13'
    text: |-
      Het formulier voor:

      a. het indienen van een aanvraag om een garantstellingsovereenkomst op grond van [paragraaf 2][ref1], is opgenomen
      in [bijlage 3.3][ref2];

      b. het indienen van een aanvraag voor een reserveringsquotum is opgenomen in [bijlage 3.4][ref3];

      c. het indienen van een aanvraag om een garantstellingsovereenkomst op grond van [paragraaf 3][ref4] is opgenomen
      in [bijlage 3.5][ref5];

      d. het indienen van een aanvraag om een garantstelling op grond van [paragraaf 3][ref6] is opgenomen in
      [bijlage 3.7][ref7];

      e. het indienen van een aanvraag om een garantstellingsovereenkomst op grond van [paragraaf 3A][ref8] is opgenomen
      in [bijlage 3.8][ref9];

      f. het indienen van een aanvraag om een garantstelling op grond van [paragraaf 3A][ref10] is opgenomen in
      [bijlage 3.10][ref11];

      g. het indienen van een aanvraag om een garantstellingsovereenkomst op grond van [paragraaf 3B][ref12] is opgenomen
      in [bijlage 3.12][ref13];

      h. het indienen van een aanvraag voor een bankgarantiefaciliteit is opgenomen in [bijlage 3.14][ref14].


