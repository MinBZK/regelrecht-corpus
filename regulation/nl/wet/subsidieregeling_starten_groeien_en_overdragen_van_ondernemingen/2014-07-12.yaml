        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: B3.1:4
    text: |-
      1 De financier stelt de Staat in kennis van een voorgenomen verstrekking van risicokapitaal met gebruikmaking van
      een formulier, overeenkomstig een model dat als bijlage bij deze overeenkomst is gevoegd, onder bijvoeging van een
      kopie van de ontwerp-overeenkomst tot verstrekking van het risicokapitaal en van andere bescheiden als genoemd in
      het model.

      2 Indien de verstrekking van risicokapitaal naar het oordeel van de Staat voldoet aan de in artikel 3 bedoelde
      voorwaarden, geldt de garantstelling op grond van deze overeenkomst voor dit risicokapitaal. De Staat bericht
      hierover de financier binnen drie weken na ontvangst van de aanmelding onder vermelding van de omvang en duur
      van de garantie. De minister kan in plaats van de provisie, genoemd in artikel 6, tweede lid, een vergoeding
      vaststellen, indien naar het oordeel van de minister de provisie te laag is in relatie tot het risico dat de Staat
      loopt.

      3 De garantie wordt afgegeven onder de opschortende voorwaarde dat een dienovereenkomstige, door partijen gesloten
      overeenkomst aan de Staat wordt overgelegd en dat ook dan wordt voldaan aan de in artikel 3 bedoelde voorwaarden.
      De Staat bericht hierover de financier binnen 35 dagen na ontvangst van de gesloten overeenkomst onder vermelding
      van de omvang, duur en provisie of vergoeding van de garantie.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4
  - number: B3.1:5
    text: |-
      1 De financier draagt er voor zorg dat een actief en winstgericht beleid wordt gevoerd voor het verstrekken,
      beheren en vervreemden van risicokapitaal, waarbij rekening wordt gehouden met het belang van de Staat als
      garantsteller.

      2 De financier draagt er voor zorg dat degenen die met het verstrekken, beheren of vervreemden van risicokapitaal
      zijn belast beschikken over de nodige deskundigheid.

      3 De financier staat er voor in dat degenen die zijn belast met het verstrekken, beheren of vervreemden van
      risicokapitaal en met de bepaling van en het toezicht op het beleid ter zake betrouwbaar zijn.

      4 De financier draagt zorg voor een integere bedrijfsvoering en neemt in dat verband de noodzakelijke maatregelen
      om onder meer strafbare handelingen, verstrengeling van tegenstrijdige belangen en afhankelijkheid van de financier
      van bepaalde vennoten, aandeelhouders of andere betrokkenen te voorkomen.

      5 De financier staat er voor in dat aandeelhouders, hoofdelijk aansprakelijke vennoten, bestuurders en beheerders
      van de financier en andere zijdens de financier betrokkenen alleen medewerking verlenen aan verstrekkingen van
      risicokapitaal en krediet door een ander dan de financier aan een onderneming waaraan de financier risicokapitaal
      heeft verstrekt met een garantie op grond van deze overeenkomst, indien een redelijk handelend en redelijk bekwaam
      beheerder deze verstrekkingen zou hebben gedaan in het kader van een actief en winstgericht beleid.

      6 De financier komt met een ondernemer aan wie een achtergestelde lening is verstrekt slechts een wijziging
      van het aflossingsschema overeen na voorafgaande toestemming van de Staat, tenzij deze betrekking heeft op een
      versnelde aflossing of op een gehele of gedeeltelijke opschorting van de aflossingen gedurende ten hoogste vier
      aaneengesloten kwartalen die niet is voorafgegaan door een eerdere opschorting van de aflossingen.

      7 De Staat verleent de in het zesde lid bedoelde toestemming indien aannemelijk is dat:

      a. de ondernemer niet in staat is te voldoen aan het bestaande aflossingsschema;

      b. adequate maatregelen worden genomen ter verbetering van de liquiditeit van de onderneming en rekening houdend
      met het belang van rentabiliteit en continuïteit van de onderneming;

      c. rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.

      8 De Staat kan op verzoek van de financier besluiten om de afdracht van de provisie, bedoeld in artikel 6.2, op te
      schorten in het geval dat:

      a. er voor de financier geen mogelijkheden meer zijn om de renteverplichtingen te incasseren bij de ondernemer, en

      b. aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder
      meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de verplichtingen van
      bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.

      9 De financier vervreemdt de lening slechts na voorafgaande toestemming van de Staat.

      10 De financier verleent slechts gehele of gedeeltelijke kwijtschelding van verplichtingen voortvloeiende uit
      de leningovereenkomst, uit hoofde waarvan de gegarandeerde lening is verstrekt, na voorafgaande toestemming
      van de Staat. De Staat geeft toestemming indien de kwijtschelding noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.

      11 De financier brengt slechts wijzigingen aan in de leningovereenkomst van de lening na voorafgaande toestemming
      van de Staat. De Staat kan toestemming geven indien de wijziging noodzakelijk is voor de continuïteit van de
      onderneming waarvoor de lening is verstrekt en indien rekening is en wordt gehouden met het belang van de Staat als
      garantsteller, onder meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de
      aflossing van bestaande leningen, met inachtneming van de achterstelling van de gegarandeerde lening.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5
  - number: B3.1:6
    text: |-
      1 De financier aan wie de minister een reserveringsquotum heeft toegekend, is hiervoor aan de Staat een eenmalige
      provisie van 1% van dit quotum verschuldigd.

      2 De financier is een provisie verschuldigd voor de garantie op het verstrekte risicokapitaal dat overeenkomstig de
      procedure van artikel 4 onder de garantstelling is gebracht. De provisie bedraagt jaarlijks

      a. 2,5% van de gegarandeerde waarde van dit risicokapitaal indien de kapitaalverstrekking bestaat uit een niet
      converteerbare achtergestelde lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan dezelfde
      ondernemer door de financier of een andere financier die deel uitmaakt van dezelfde groep in de vorm van een
      converteerbare achtergestelde lening of aandelenkapitaal;

      b. 3% van de gegarandeerde waarde van dit risicokapitaal in andere gevallen.

      3 Per kwartaal wordt een vierde deel van de in het tweede lid bedoelde provisie in rekening gebracht, uitgaand van
      de waarde van het risicokapitaal op de eerste dag van het kwartaal.

      4 De in het tweede lid bedoelde provisie is verschuldigd voor de duur van de garantie of zoveel korter als zich één
      van de in artikel 8, eerste lid, genoemde omstandigheden voordoet.

      5 Indien het risicokapitaal aandelenkapitaal betreft dat wordt vervreemd binnen zes jaren vanaf de verstrekking van
      het risicokapitaal, is de financier op dat tijdstip een aanvullende provisie verschuldigd voor de periode vanaf het
      tijdstip van de vervreemding tot na het verstrijken van de periode van zes jaren, welke aanvullende provisie wordt
      berekend met overeenkomstige toepassing van het tweede lid en uitgaand van de waarde van het aandelenkapitaal op de
      eerste dag van het kwartaal voorafgaand aan de vervreemding.

      6 Indien het risicokapitaal een achtergestelde lening betreft, is de financier een minimale provisie verschuldigd
      gelijk aan de provisie die met toepassing van het tweede lid op basis van de initiële hoofdsom van de lening voor
      een periode van drie jaar verschuldigd is. Indien op het tijdstip van de volledige aflossing van de lening de
      reeds op grond van het tweede lid voor de verstreken looptijd van de lening verschuldigde provisie lager is dan de
      minimale provisie, is de financier een aanvullende provisie verschuldigd gelijk aan het verschil tussen de reeds
      verschuldigde provisie en de minimale provisie.

      7 Indien risicokapitaal binnen een termijn van zes jaar wordt afgestoten om verlies op dat risicokapitaal in de
      zin van artikel 8, eerste lid, te beperken, kan de minister op verzoek van de financier de over de resterende
      termijn verschuldigde provisie kwijtschelden indien sprake is van klemmende redenen, gelegen in het belang van de
      onderneming van de ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6
  - number: B3.1:7
    text: |-
      1 De financier draagt er voor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verstrekkingen, het beheer
      en de vervreemdingen van gegarandeerd risicokapitaal en van ander risicokapitaal dat hij aan dezelfde ondernemer
      heeft verstrekt.

      2 De financier informeert de Staat binnen acht weken nadat de desbetreffende gebeurtenis heeft plaatsgevonden
      schriftelijk over wezenlijke wijzigingen in het financieringsbeleid of de organisatie van de financier en over
      wijzigingen ten aanzien van gegarandeerd risicokapitaal, waaronder

      a. een omzetting van een achtergestelde lening in aandelenkapitaal,

      b. een aflossing van een achtergestelde lening, tenzij deze aflossing overeenkomt met een aflossingsschema waarover
      de Staat eerder is geïnformeerd;

      c. een wijziging van de looptijd van een achtergestelde lening.

      3 De financier verstrekt de Staat jaarlijks zijn jaarverslag.

      4 Desgevraagd verstrekt de financier de Staat gegevens en bescheiden over de verstrekkingen,
      het beheer en de vervreemdingen van gegarandeerd risicokapitaal en van ander risicokapitaal dat
      hij aan dezelfde ondernemer heeft verstrekt, en de jaarrekeningen van de ondernemingen waaraan
      risicokapitaal is verstrekt, vergezeld van desbetreffende accountantsverklaringen als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] of een mededeling waarom deze ontbreekt, en
      van de bijbehorende toelichtingen voor het bestuur van de onderneming.

      5 De financier doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surséance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
