  - number: B3.2:15
    text: Deze overeenkomst treedt in werking door de ondertekening daarvan door de partijen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel15
  - number: B4.2:1
    text: |-
      In deze overeenkomst wordt verstaan onder:

      a. *minister:* de Minister van Economische Zaken;

      b. *kapitaalvennootschap:*

      1°. een vennootschap als bedoeld in artikel 1 van de Eerste [Richtlijn 68/151/EEG](31968L0151) van de Raad van
      9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken (PB
      EG L 65), of

      2°. een kapitaalvennootschap die ten tijde van de eerste verstrekking van risicodragend kapitaal op grond van
      deze regeling is ingericht naar het recht van één van de lidstaten van de Europese Unie, die rechtspersoonlijkheid
      bezit, een apart vermogen heeft dat bij uitsluiting voor de schulden van de vennootschap kan worden aangesproken
      en op grond van haar nationale wetgeving onderworpen is aan garantievoorwaarden zoals bedoeld in [Richtlijn 68/151/
      EEG](31968L0151) van de Raad om de belangen van zowel deelgerechtigden als derden te beschermen;

      c. *technostarter*: een rechtspersoon die een onderneming drijft:

      1°. die voor eigen rekening en risico producten, processen of diensten – niet zijnde adviezen – verkoopt en levert,
      die zijn gebaseerd op een nieuwe technische vinding of een nieuwe toepassing van bestaande technologie, of

      2°. die deel uitmaakt van één van de creatieve sectoren en die voor eigen rekening en risico producten, processen
      of diensten – niet zijnde adviezen – verkoopt en levert, die zijn gebaseerd op een nieuwe creatieve vinding of een
      nieuwe toepassing van een bestaande creatieve vinding; en

      3°. minder dan zeven jaar na haar eerste commerciële verkoop actief is op een markt; en

      4°. die ten tijde van de eerste verstrekking van risicodragend kapitaal op grond van dit hoofdstuk voldoet aan de
      definitie van middelgrote, kleine of micro-ondernemingen;

      d. *technostartervennootschap:* een technostarter die

      1°. een onderneming drijft in de vorm van een kapitaalvennootschap, en

      2°. zijn primaire bedrijfsactiviteiten in Nederland uitvoert,

      behoudens voor zover de onderneming behoort tot de economische sectoren van landbouw, visserij, aquacultuur of
      scheepsbouw of tot de EGKS-sectoren;

      e. *achtergestelde vordering:* een vordering van het startersfonds ten laste van een technostartervennootschap

      1°. die het startersfonds heeft verkregen door aan de technostartervennootschap geld ter leen te verstrekken,

      2°. waarop de debiteur krachtens een daartoe strekkende bepaling in de akte van geldlening in geval van ontbinding,
      een akkoord na verlening van surséance van betaling of een akkoord in faillissement van de debiteur, eerst
      verplicht is rente en aflossing te betalen nadat alle andere op dat moment bestaande schulden van de debiteur zijn
      voldaan, met uitzondering van de schulden die voortvloeien uit leningen waaraan een bepaling van gelijke aard als
      voornoemde bepaling is verbonden,

      3°. terwijl ingevolge de vorenbedoelde akte van geldlening de crediteur afstand heeft gedaan van alle rechten tot
      verrekening van de rente en aflossing;

      f. *groep:* een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over een of meer rechtspersonen of vennootschappen, en

      2°. laatstbedoelde rechtspersonen of vennootschappen;

      g. *participatie:* risicodragend kapitaal in de vorm van

      1°. aandelen in het kapitaal van een technostartervennootschap die het startersfonds rechtstreeks van de
      technostartervennootschap heeft verkregen tegen volstorting van die aandelen in geld, of door omzetting van een
      achtergestelde vordering; of

      2°. aandelen in het kapitaal van een technostartervennootschap als bedoeld onder 1° in combinatie met een
      achtergestelde vordering;

      h. *verkrijgingsprijs van een participatie:* het bedrag in geld waarvoor het startersfonds de participatie heeft
      verkregen;

      i. *fondsplan:* een plan van het startersfonds tot uitvoering van een met elkaar samenhangend geheel van
      activiteiten die bestaan uit het verkrijgen, beheren en beëindigen van participaties en het begeleiden van de
      desbetreffende technostartervennootschappen;

      j. *investeringsperiode:* de periode gedurende welke het startersfonds activiteiten verricht ter verkrijging van
      participaties;

      k. *investeringsbudget:* de financiële middelen die het startersfonds beschikbaar heeft of zal hebben en die
      bestemd zijn om de verkrijgingsprijs van participaties te voldoen;

      l. *inkomsten:* alle op geld waardeerbare voordelen die het startersfonds heeft verkregen uit de participatie,
      waaronder dividend, rente, aflossingen, opties, de prijs waartegen de participatie is vervreemd, de prijs waartegen
      de participatie door de desbetreffende technostartervennootschap is ingekocht of terugbetaald en de liquidatie-
      uitkering;

      m. *beheerskosten:* alle kosten die het startersfonds maakt voor het verkrijgen, behouden en beëindigen van
      participaties, met inbegrip van de kosten van begeleiding van technostartervennootschappen, uitgezonderd de
      verkrijgingsprijs van de participaties;

      n. *fondspartij:* een aandeelhouder of hoofdelijk aansprakelijk vennoot van het startersfonds;

      o. *eigen bijdrage:* de geldelijke middelen die door de fondspartijen in het investeringsfonds zijn ingebracht en
      die daadwerkelijk zijn gebruikt voor het verkrijgen van participaties;

      p. *referentierente:* de referentierentevoet, bedoeld in de Mededeling van de Commissie over de methode waarmee de
      referentie- en disconteringspercentages worden vastgesteld(PbEG 1997, C 273), zoals laatstelijk vastgesteld voor
      Nederland, en vermeerderd met 4%;

      q. eerste commerciële verkoop: eerste verkoop door een onderneming op een product- of dienstenmarkt;

      r. startersfonds: een vennootschap:

      1°. in de vorm van een kapitaalvennootschap of een vennootschap met een afgescheiden vermogen, ingericht naar het
      recht van één van de andere lidstaten van de Europese Unie;

      2°. die blijkens de akte waarbij haar statuten zijn vastgesteld of blijkens de overeenkomst waarbij zij is
      aangegaan uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan technostartersvennootschappen
      teneinde winst te behalen, en

      3°. waarin ten minste drie aandeelhouders of hoofdelijk aansprakelijke vennoten deelnemen respectievelijk
      samenwerken zonder dat twee of drie van hen tot dezelfde groep behoren en zonder dat één van hen een
      meerderheidsbelang in het fonds heeft.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel1
  - number: B4.2:2
    text: |-
      1 De Staat verstrekt het startersfonds voor het verkrijgen van participaties een renteloze geldlening tot een
      bedrag van € «DOSSIER_GECOMMITTEERD» met een looptijd van .... jaar, van «DOSSIER_AANVANG_DAT» tot <<einddatum
      fonds>>, gegeven een investeringsbudget van € «BEGROTE_KOSTEN».

      2 De Staat kan de in het eerste lid genoemde termijn op verzoek van het startersfonds verlengen indien daarvoor
      zwaarwegende economische redenen zijn.

      3 Het startersfonds kan bedragen in contanten opnemen, telkens indien het startersfonds een betaling verricht ter
      verkrijging van een participatie, voor zover het totaal van de opgenomen bedragen niet hoger is dan het maximale
      bedrag van de geldlening.

      4 Telkens indien het startersfonds inkomsten heeft verkregen uit een participatie boekt het een deel van deze
      inkomsten over aan de Staat, overeenkomstig het bepaalde in artikel 5.

      5 Het startersfonds is niet gehouden de uitstaande hoofdsom af te lossen, anders dan door de overboekingen bedoeld
      in het vierde lid.

      6 Het geld dat het startersfonds aan de technostarter verstrekt, wordt uitsluitend aangewend voor financiering
      van de verdere groei van de technostarter, en wordt niet gebruikt om bestaande financiële verplichtingen te
      herfinancieren.

      7 Het startersfonds kan, bij zwaarwegende economische redenen en na schriftelijke toestemming van de Staat, de
      totale fondsomvang vergroten door de private inbreng te verhogen. Dit kan alleen indien alle fondspartijen pro rata
      meedoen met de verhoging.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel2
  - number: B4.2:3
    text: |-
      1 Indien het startersfonds een participatie heeft verkregen na de indiening van de aanvraag om subsidie op grond
      van [hoofdstuk 4][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen en over gaat of
      over is gegaan tot betaling aan de technostartervennootschap van de verkrijgingsprijs of van een deel daarvan,
      verricht de Staat op verzoek van het fonds een betaling aan het fonds ter hoogte van dat bedrag vermenigvuldigd
      met het percentage dat het maximale bedrag van de geldlening vormt van het investeringsbudget, met dien verstande
      dat de middelen die door een startersfonds over een periode van twaalf maanden aan een technostartersvennootschap
      worden verstrekt ten hoogste € 2.000.000 bedragen.

      2 Het startersfonds doet het verzoek om betaling met gebruikmaking van een formulier, overeenkomstig een model
      dat als bijlage 1 bij deze overeenkomst is gevoegd, onder bijvoeging van de overeenkomst tot verkrijging van de
      participatie en van andere bescheiden als genoemd in het model.

      3 De Staat verricht de betaling binnen twee weken na ontvangst van het verzoek om betaling, tenzij hij van oordeel
      is dat het startersfonds niet heeft voldaan aan de ingevolge deze overeenkomst voor hem geldende verplichtingen,
      dan wel indien het startersfonds failliet is verklaard of aan het fonds surséance van betaling is verleend of ten
      aanzien van fonds de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een verzoek
      daartoe bij de rechtbank is ingediend.

      4 De Staat bericht het startersfonds na afloop van de investeringsperiode wat het totale bedrag is dat op
      grond van deze overeenkomst is opgenomen. De investeringsperiode loopt van «DOSSIER_AANVANG_DAT» tot en met
      «DOSSIER_OORSPR_EINDDAT».


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        hoofdstuk: '4'
  - number: B4.2:4
    text: |-
      1 Indien het startersfonds inkomsten heeft, wordt daarvan het rechtmatige deel overgeboekt aan de Staat:

      a. indien dit rechtmatige deel gelijk of meer is dan € 20.000, binnen één maand;

      b. indien dit rechtmatige deel minder is dan € 20.000, binnen één maand nadat € 20.000 is overschreden;

      c. in alle andere gevallen éénmaal per half kalenderjaar.

      2 Het deel van de inkomsten dat aan de Staat wordt overgeboekt verschilt al naar gelang de inkomsten worden
      ontvangen in één van de volgende perioden:

      a. periode A: vanaf het totstandkomen van deze overeenkomst tot het tijdstip waarop het totaal van de door het
      startersfonds uit de participaties verkregen inkomsten na aftrek van het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan de eigen bijdrage voor de verkregen participaties;

      b. periode B: vanaf het onder a bedoelde tijdstip tot het tijdstip dat het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan het totaal op grond van de leningsovereenkomst opgenomen bedrag;

      c. periode C: vanaf het tijdstip dat het totaal van de aan de Staat overgeboekte bedragen gelijk is aan het totaal
      op grond van de leningsovereenkomst opgenomen bedrag.

      3 Het deel van de inkomsten dat aan de Staat wordt overgeboekt is

      a. in periode A: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het
      maximale bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van
      de Staat;

      b. in periode B: 50 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het
      maximale bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van
      de Staat;

      c. in periode C: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het
      maximale bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van
      de Staat.

      4 De Staat kan de hoogte van het deel van de inkomsten, bedoeld in het derde lid, per periode A, B en C afwijkend
      vaststellen, indien het startersfonds in strijd heeft gehandeld met hetgeen in deze overeenkomst of in de
      Subsidieregeling starten, groeien en overdragen van ondernemingen is bepaald.

      5 Telkens indien het startersfonds een bedrag overboekt aan de Staat, informeert het de Staat over de aard van de
      inkomsten met gebruikmaking van een formulier, overeenkomstig een model, dat als bijlage 2 bij deze overeenkomst
      is gevoegd, onder bijvoeging van bescheiden als genoemd in het model, waaronder in geval van inkomsten uit
      vervreemding van de participatie de overeenkomst tot vervreemding van de participatie.

      6 Indien het startersfonds inkomsten heeft uit een participatie die niet bestaan uit een geldsom, maakt het deze
      inkomsten te gelde voor het verloop van de in artikel 2, eerste lid, genoemde termijn.

      7 Zodra de in het vijfde lid bedoelde inkomsten te gelde zijn gemaakt, boekt het startersfonds het in
      overeenstemming met het derde lid bepaalde deel van deze gelden over aan de Staat.

      8 Op verzoek van de Staat verstrekt het startersfonds een accountantsverklaring dat het startersfonds bij de
      verkrijging, het bezit of de vervreemding van de participatie waaruit inkomsten aan de Staat zijn overgeboekt, in
      overeenstemming met deze overeenkomst heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4
  - number: B4.2:5
    text: |-
      1 Het startersfonds hanteert bij het verkrijgen van participaties in technostartervennootschappen de volgende
      voorwaarden:

      a. de participaties worden verkregen gedurende een investeringsperiode van ten hoogste zes jaar, en deze worden
      uiterlijk zes jaar na afloop van de investeringsperiode vervreemd;

      b. de totale verkrijgingsprijs van de participaties die gedurende de investeringsperiode in één
      technostartervennootschap worden verkregen, bedraagt ten minste € 100.000 en ten hoogste € 3.500.000;

      c. de gemiddelde totale verkrijgingsprijs van de participaties die een startersfonds gedurende de
      investeringsperiode per technostartervennootschap verkrijgt, bedraagt over alle technostartervennootschappen
      genomen ten hoogste € 1.200.000;

      d. de relatieve omvang van achtergestelde vorderingen wordt zodanig beperkt dat ten hoogste 50 procent van het
      totaal van de verkrijgingsprijzen van de participaties betrekking heeft op achtergestelde vorderingen;

      e. voor achtergestelde vorderingen wordt een rente bedongen die ten minste gelijk is aan de referentierente;

      f. de participaties worden verkregen in technostartervennootschappen waarvan de rentabiliteits- en
      continuïteitsperspectieven ten minste redelijk zijn;

      g. bij de beslissing van het startersfonds inzake de verkrijging van een participatie wordt rekening gehouden met
      het ondernemingsplan van de desbetreffende technostartervennootschap.

      2 Bij of in verband met het verkrijgen van een participatie verstrekt het startersfonds geen andere goederen dan
      geld.

      3 Het startersfonds verkrijgt geen participatie in een technostartervennootschap indien in de voorafgaande periode
      van twaalf maanden meer middelen aan de technostartervennootschap zijn onttrokken ten behoeve van derden dan
      noodzakelijk voor een redelijk te achten bedrijfsvoering, dan wel een verplichting tot een zodanige onttrekking
      is aangegaan.

      4 Het startersfonds verkrijgt geen participatie in een technostartervennootschap indien een ander investeringsfonds
      in deze vennootschap reeds een participatie heeft, behoudens

      a. indien dit investeringsfonds een ander startersfonds is en voor zover als gevolg van de nieuwe participatie het
      in het eerste lid, onder b, bedoelde maximum niet wordt overschreden;

      b. indien dit investeringsfonds

      1°. de vorm heeft van een kapitaalvennootschap of een vennootschap met een afgescheiden vermogen, ingericht naar
      het recht van één van de andere lidstaten van de Europese Unie;

      2°. blijkens de akte waarbij de statuten van de vennootschap zijn vastgesteld of blijkens de overeenkomst
      waarbij de vennootschap is aangegaan uitsluitend tot doel heeft het verstrekken van risicodragend kapitaal aan
      technostartervennootschappen teneinde winst te behalen; en

      3°. naar het oordeel van de minister niet in staat is nieuwe participaties in de technostartervennootschap te
      verkrijgen;

      voor zover als gevolg van de nieuwe participatie het in het eerste lid, onder b, bedoelde maximum niet wordt
      overschreden;

      c. indien dit investeringsfonds een informal investor is.

      5 Het startersfonds verkrijgt of behoudt geen participatie in de vennootschap van een technostarter indien een
      fondspartij, bestuurder of een beheerder of andere betrokkene bij het startersfonds een bedrijf uitoefent dat
      gelijk of verwant is aan het bedrijf van de technostarter terwijl tussen beide bedrijven een afnemers- of een
      aandeelhoudersrelatie bestaat.

      6 Het startersfonds brengt voor het verkrijgen van participaties eigen geldelijke middelen in het
      investeringsbudget in tot ten hoogste €...........euro.

      7 Het startersfonds verricht geen andere activiteiten dan de uitvoering van het fondsplan.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5
  - number: B4.2:6
    text: |-
      1 Het startersfonds vervreemdt een participatie niet eerder dan twee jaar na de verkrijging ervan, tenzij de Staat
      desgevraagd met vervreemding binnen deze termijn heeft ingestemd.

      2 Het startersfonds draagt ervoor zorg dat vervreemding van een participatie gebeurt tegen een marktconforme prijs.

      3 Indien het startersfonds een participatie, waaronder activa, geheel of voor een deel vervreemdt aan één van zijn
      fondspartijen, bestuurders, beheerders of andere betrokkenen, draagt het er voor zorg dat ten minste een derde deel
      van de participatie wordt vervreemd aan onafhankelijke derden dan wel dat de prijs waartegen de vervreemding plaats
      vindt, is gebaseerd op een taxatie van twee onafhankelijke deskundigen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6
  - number: B4.2:7
    text: |-
      1 Het startersfonds voert het fondsplan uit, voert daarbij een actief en winstgericht beleid voor het verkrijgen,
      behouden en beëindigen van participaties en begeleidt in dat kader technostartervennootschappen waarin een
      participaties is verkregen. Het startersfonds houdt hierbij rekening met het belang van de Staat als verstrekker
      van de geldlening.

      2 Het startersfonds hanteert een expliciete gedragslijn om het ontstaan van belangenverstrengeling te voorkomen en
      neemt ook overigens de in dit verband noodzakelijke maatregelen.

      3 Desgewenst kan een door de minister daartoe gemachtigde persoon als toehoorder deelnemen aan overleg van een
      orgaan van het startersfonds over de uitvoering van het fondsplan.

      4 Het startersfonds staat er voor in dat fondspartijen, bestuurders, beheerders of andere betrokkenen bij
      een startersfonds geen medewerking verlenen aan investeringen door een ander dan het startersfonds in een
      technostartervennootschap waarin het startersfonds een participatie heeft verkregen, indien deze investeringen niet
      tegen marktconforme voorwaarden plaatsvinden.

      5 Het startersfonds bedingt van technostarters die in verband met participaties worden geadviseerd of begeleid geen
      vergoeding voor deze advisering respectievelijk begeleiding die hoger is dan hetgeen in de markt gebruikelijk is.

      6 Het startersfonds richt het beheer zodanig in dat de jaarlijkse beheerskosten, dat wil zeggen alle kosten die ten
      laste komen van het startersfonds, ten hoogste 5% van het investeringsbudget bedragen.

      7 De fondsbeheerder verkrijgt voor zijn werkzaamheden een beloning die afhankelijk is van zijn individuele
      prestatie. Hiertoe wordt tussen het professionele fondsmanagement en de deelnemende partijen een overeenkomst
      gesloten.

      8 De Adviescommissie Seed capital technostarters dan wel de Staat zal tweejaarlijks gedurende de
      investeringsperiode het startersfonds visiteren met de mogelijkheid daar aanbevelingen en consequenties aan te
      verbinden. Gedurende de desinvesteringsperiode worden ten minste eenmaal in twee jaar de visitaties uitgevoerd door
      de ambtenaren van de Rijksdienst voor Ondernemend Nederland dan wel door de door de Rijksdienst voor Ondernemend
      Nederland aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7
  - number: B4.2:8
    text: |-
      1 Het startersfonds draagt ervoor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verkrijging, het beheer en
      de vervreemding van participaties, over de inkomsten uit deze participaties, over de ondernemingsresultaten van de
      desbetreffende technostarters en over de kosten van het fondsbeheer.

      2 Het startersfonds informeert steeds na afloop van een periode van zes maanden de Staat schriftelijk:

      a. over de voorstellen voor participaties die in de voorafgaande periode van zes maanden zijn ontvangen van
      technostartervennootschappen en over de besluitvorming die hierover bij het startersfonds heeft plaatsgevonden;

      b. over de voortgang, inkomsten en exits met betrekking tot de participaties onder beheer.

      3 Het startersfonds brengt steeds binnen zes maanden na afloop van een periode van twaalf maanden aan de Staat
      schriftelijk verslag uit over de uitvoering van het fondsplan, met in het bijzonder een overzicht over de verkregen
      en de vervreemde participaties, de gerealiseerde verkrijgingsprijzen, de beheerskosten en de inkomsten, welk
      verslag vergezeld gaat van een controleverklaring, inclusief de eventuele managementletters, die is opgesteld
      overeenkomstig een model dat als bijlage 3 bij deze overeenkomst is gevoegd, en met gebruikmaking van een
      controleprotocol dat als bijlage 4 bij deze overeenkomst is gevoegd.

      4 Desgevraagd verstrekt het startersfonds de Staat gegevens en bescheiden over het beheer van het fonds en de
      verkregen participaties.

      5 Na afloop van de looptijd van deze overeenkomst brengt het startersfonds een eindverslag uit omtrent de
      uitvoering en de resultaten van het fondsplan.

      6 De Staat bericht het startersfonds na afloop van de looptijd van deze overeenkomst of het startersfonds naar
      zijn oordeel bij het verkrijgen en vervreemden van participaties in overeenstemming met deze overeenkomst heeft
      gehandeld.

      7 De Staat heeft het recht op elk moment een audit te laten uitvoeren om te zien of alle afspraken en contracten
      door het startersfonds worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8
  - number: B4.2:9
    text: |-
      1 Het startersfonds voert tijdens de looptijd van deze overeenkomst geen wijziging in de organisatiestructuur, de
      samenstelling van het team, de aandeelhouders of de uitvoering van het fondsplan door, tenzij de Staat desgevraagd
      hiermee heeft ingestemd.

      2 Het startersfonds doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surseance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9
  - number: B4.2:10
    text: |-
      1 De Staat is gerechtigd deze overeenkomst schriftelijk op te zeggen indien

      a. het startersfonds tekort schiet bij de nakoming van één van zijn verplichtingen uit hoofde van deze
      overeenkomst;

      b. het aantal aandeelhouders of hoofdelijk aansprakelijke vennoten die niet behoren tot dezelfde groep of enige
      andere onderlinge zakelijke of familiale betrokkenheid kennen, kleiner is geworden dan drie, behoudens voor zover
      de Staat desgevraagd hiermee heeft ingestemd;

      c. ten aanzien van het startersfonds een verzoek bij de rechtbank is ingediend tot verlening van surseance
      van betaling, een verzoek tot faillietverklaring of een verzoek tot van toepassing verklaring van de
      schuldsaneringsregeling natuurlijke personen of een buitengerechtelijk akkoord aan crediteuren wordt aangeboden;

      d. het startersfonds is ontbonden;

      e. [hoofdstuk 4][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen niet langer
      verenigbaar is met de regels van de Europese Gemeenschappen ten aanzien van staatssteun.

      2 Een opzegging op grond van het eerste lid, onder a en b, geschiedt uitsluitend nadat de Staat het startersfonds
      op de hoogte heeft gesteld van het voornemen tot opzegging en nadat deze in de gelegenheid is gesteld om een
      tekortschieten dat hersteld kan worden te herstellen binnen een redelijke termijn.

      3 Bij een opzegging als bedoeld in het eerste lid, onder a, b en c, kan de Staat van het startersfonds het totale
      bedrag dat hij overeenkomstig artikel 3 aan het startersfonds heeft betaald, verminderd met het bedrag dat het
      startersfonds overeenkomstig artikel 5 aan hem heeft overgeboekt, direct opeisen.

      4 Bij een opzegging als bedoeld in het eerste lid, onder a, kan de Staat bovenop het onder het derde lid bedoelde
      bedrag een boete van ten hoogste 50 procent van dat bedrag in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel10
