  - number: '3.8'
    text: |-
      De minister verdeelt het subsidieplafond voor het toekennen van reserveringsquota op volgorde van binnenkomst van
      de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.8
  - number: '3.9'
    text: |-
      De minister beslist afwijzend op een aanvraag om een reserveringsquotum indien:

      a. de financier geen garantstellingsovereenkomst met de Staat heeft gesloten of geen aanvraag voor het sluiten van
      een garantstellingsovereenkomst heeft ingediend;

      b. de aanvrager eerder tekort is geschoten bij de naleving van verplichtingen op grond van de
      garantstellingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.9
  - number: '3.10'
    text: |-
      1 De financier is voor het verkrijgen van een reserveringsquotum een eenmalige provisie van 1 procent van dit
      quotum verschuldigd.

      2 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt
      voor de garantie op het verstrekte risicokapitaal vastgesteld op:

      a. 2,5 procent per jaar van de gegarandeerde waarde van dit risicokapitaal indien de kapitaalverstrekking bestaat
      uit een niet converteerbare achtergestelde lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan
      dezelfde ondernemer door de financier of door een andere financier die deel uitmaakt van dezelfde groep in de vorm
      van een converteerbare achtergestelde lening of aandelenkapitaal;

      b. 3 procent van de gegarandeerde waarde van dit risicokapitaal, die per kwartaal wordt berekend, in andere
      gevallen.

      3 De minister kan in plaats van het tarief van de provisie, genoemd in het tweede lid, een vergoeding vaststellen,
      indien het tarief van de provisie te laag is in relatie tot het risico dat de Staat loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: '3.11'
    text: |-
      Op gemeenschappelijk verzoek van een financier die beschikt over een reserveringsquotum en van een andere financier
      die een garantstellingsovereenkomst met de staat heeft, kan dit quotum geheel of gedeeltelijk voor de resterende
      periode worden overdragen aan de laatstgenoemde financier.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.11
  - number: '3.12'
    text: |-
      Jaarlijks vindt een evaluatie van de toepassing van deze regeling plaats, onder meer ter beoordeling of de
      inkomsten en de uitgaven ingevolge garantstellingen op grond van deze regeling met elkaar in evenwicht zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12
  - number: 3.12a
    text: |-
      1 In deze paragraaf wordt verstaan onder:

        - *lening:* een al dan niet achtergestelde lening van geld door een financier aan een ondernemer, welke lening: a.
      al dan niet door enige vorm van zekerheid is gedekt, b. niet converteerbaar is en c. is afgesloten met de afspraak
      dat een gedeelte van de rente vast is en een gedeelte van de rente flexibel is en gekoppeld is aan Euribor, met het
      oog op de financiering door deze onderneming van eigen activiteiten;
        - *liquiditeitsopslag:* een door een financier aan een ondernemer in rekening gebracht percentage van de lening,
      waarvan de hoogte gelijk is voor alle door de desbetreffende financier op dezelfde dag afgesloten of af te
      sluiten leningen met dezelfde looptijd. Indien een dergelijk percentage niet beschikbaar is, zal in overleg met de
      financier een ander redelijk, transparant en verifieerbaar percentage worden vastgesteld.

      2 Voor de toepassing van deze paragraaf wordt als financier aangewezen een bank.

      3 Voor de toepassing van [artikel 3.12b, tweede lid][ref1], wordt als financier aangewezen een kredietinstelling in
      de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius of
      Saba het bedrijf van kredietinstelling uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3.12b
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12a
