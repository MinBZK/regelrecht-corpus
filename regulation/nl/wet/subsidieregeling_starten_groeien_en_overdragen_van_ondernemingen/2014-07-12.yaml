  - number: B2.2:22
    text: |-
      Indien naar het oordeel van de minister de kans dat de toepasselijkheid van deze overeenkomst op een
      bedrijfsborgstellingskrediet of een deel van een bedrijfsborgstellingskrediet wordt ingeroepen in belangrijke
      mate wordt verkleind of indien naar het oordeel van de minister aannemelijk is dat daardoor het bedrag waarvoor de
      toepasselijkheid van deze overeenkomst wordt ingeroepen in belangrijke mate wordt verlaagd, kan de minister voor de
      toepassing van deze overeenkomst met betrekking tot dat krediet instemmen met een gemotiveerd verzoek van de Bank
      om afwijking van deze overeenkomst.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel22
  - number: B2.2:23
    text: |-
      Waar in deze overeenkomst sprake is van een vorm van communicatie geschiedt deze langs elektronische weg. De
      aanlevering door de Bank kan in afwijking en bij wijze van alternatief en ter keuze van de Bank ook geschieden in
      schriftelijke vorm en door aanlevering van een fysieke gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel23
  - number: B2.2:24
    text: |-
      1. De inwerkingtreding van een wijziging van het [Kaderbesluit EZ-subsidies][ref1] of [hoofdstuk 2][ref2] van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen leidt te zelfder tijd tot een gelijke wijziging
      van deze overeenkomst.

      2. Deze overeenkomst kan worden gewijzigd door een schriftelijke mededeling van de minister aan de centrale Bank.

      3. Deze overeenkomst is aangegaan voor onbepaalde tijd en kan door de minister en de Bank schriftelijk worden
      opgezegd met inachtneming van een opzegtermijn van drie hele kalendermaanden.

      4. In afwijking van het derde lid kan deze overeenkomst door de minister met onmiddellijke ingang worden ontbonden,
      indien een Bank of centrale Bank in strijd heeft gehandeld met het gestelde in deze overeenkomst.

      5. In afwijking van het derde lid kunnen de Banken deze overeenkomst met onmiddellijke ingang opzeggen binnen een
      termijn van een maand na publicatie in het Staatsblad van een wijziging van het [Kaderbesluit EZ-subsidies][ref3],
      publicatie in de Staatscourant van een wijziging van de Subsidieregeling starten, groeien en overdragen van
      ondernemingen of een schriftelijke mededeling van de minister, inhoudende een wijziging van deze overeenkomst.

      6. Opzegging door de Banken als bedoeld in het derde en vijfde lid is uitsluitend mogelijk indien dit geschiedt
      door alle Banken gezamenlijk.

      7. Deze overeenkomst eindigt van rechtswege door de intrekking van het [Kaderbesluit EZ-subsidies][ref4] of door
      intrekking van [artikel 2.3, eerste lid, onderdeel a][ref5], van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen.

      8. Wijziging, opzegging, ontbinding of beëindiging van deze overeenkomst heeft geen gevolg ten aanzien van
      bedrijfsborgstellingskredieten, welke ten tijde van de inwerkingtreding van de wijziging, opzegging, ontbinding
      of beëindiging overeenkomstig artikel 3 zijn gemeld en ten aanzien van bedrijfsborgstellingskredieten die zijn of
      zullen worden verstrekt uit hoofde van een kredietovereenkomst die is aangegaan voor de inwerkingtreding van de
      wijziging, opzegging, ontbinding of beëindiging.

      9. Het achtste lid is niet van toepassing ten aanzien van de wijziging van artikel 5 ingevolge de Regeling van
      de Minister van Economische Zaken van 3 september 2009, nr. WJZ/9155298, tot wijziging van de Subsidieregeling
      starten, groeien en overdragen van ondernemingen ten aanzien van de opschortingsvoorwaarden voor borgstelling van
      MKB-kredieten (Stcrt. 2009, 13666)

      10. Als het [Kaderbesluit EZ-subsidies][ref6] en [artikel 2.3, eerste lid, onderdeel a][ref7], van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen gelijktijdig worden ingetrokken en vervangen door
      materieel identieke wettelijke voorschriften in een andere algemene maatregel van bestuur of ministeriële regeling
      dan is het zevende lid niet van toepassing.


