  - number: B4.2:14
    text: |-
      Het startersfonds garandeert dat gedurende de looptijd van het fonds de kwaliteit en de tijdsbesteding van
      het fondsmanagement in overeenstemming zijn met hetgeen is aangegeven in het fondsplan. Het startersfonds kan
      overeenkomstig artikel 9 een verzoek indienen tot wijziging van het fondsmanagement. Een wijziging van het
      fondsmanagement is alleen toegestaan met instemming van de Staat.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel14
  - number: B4.2:15
    text: |-
      De aandeelhouders verklaren dat het startersfonds een ‘right of first refusal’ heeft ten aanzien van
      investeringsproposities met betrekking tot starters vallende onder de definitie van [hoofdstuk 4][ref1] van de
      Regeling starten, groeien en overdragen ondernemingen.


