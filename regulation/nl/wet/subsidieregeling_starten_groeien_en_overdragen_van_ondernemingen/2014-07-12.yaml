  - number: B2.1:3
    text: |-
      1. De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan
      uitsluitend worden ingeroepen:

      a. indien het krediet is gemeld als bedoeld in artikel 6;

      b. indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde provisie
      door de Bank aan de Staat is betaald;

      c. indien en voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of
      delen daarvan de door de minister op grond van [artikel 2.7, tweede lid][ref2], van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde meldingslimiet niet is
      overschreden;

      d. indien de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, zich borg heeft gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bedrijfsborgstellingskrediet wordt verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bedrijfsborgstellingskrediet met een minimum van € 5.000;

      e. indien het bedrijfsborgstellingskrediet niet is bestemd en niet wordt gebruikt voor buitenlandse investeringen
      in distributiekanalen in verband met werkzaamheden op het gebied van uitvoer;

      f. indien het bedrijfsborgstellingskrediet niet meer bedraagt dan het tekort aan zekerheden dat bij de Bank ten
      tijde van het sluiten van de kredietovereenkomst bestaat;

      g. indien de kredietovereenkomst in schriftelijke vorm is aangegaan;

      h. indien de bank in de kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet wordt verstrekt een
      verplichting voor de MKB-ondernemer is opgenomen om alle medewerking te verlenen aan het uitoefenen door de Staat
      van de in artikel 20, eerste lid, genoemde bevoegdheden;

      i. indien de Bank in de door haar gesloten borgstellingsovereenkomst met betrekking tot de nakoming door de
      MKB-ondernemer van de verplichtingen voortvloeiende uit de uit hoofde waarvan het bedrijfsborgstellingskrediet
      is verleend een beding ten behoeve van de Staat heeft opgenomen, ertoe strekkende dat de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref3] niet geldt ten opzichte van de Staat en de Bank geen bedingen heeft
      opgenomen, ertoe leidende dat:

      1°. een borg er zich op zou kunnen beroepen dat de Staat eerst zou moeten worden aangesproken,

      2°. een borg zich zou kunnen onttrekken aan toepassing door de Staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref4];

      j. indien door de Bank gelijktijdig met het sluiten van de kredietovereenkomst, uit hoofde waarvan een
      bedrijfsborgstellingskrediet aan de MKB-ondernemer wordt verstrekt, met de MKB-ondernemer een kredietovereenkomst
      is gesloten uit hoofde waarvan de MKB-ondernemer over een bankfaciliteit beschikt, die niet bestemd is en niet
      gebruikt wordt voor de aflossing van bankfaciliteiten waarover de MKB-ondernemer beschikt bij de Bank of een Bank-
      gelieerde of aan een rechtspersoon waarmee de Bank in een groep verbonden is;

      k. indien de bankfaciliteit, bedoeld in het eerste lid, onderdeel j, ten minste 100 procent bedraagt van het
      bedrijfsborgstellingskrediet, of,

      1°. ten minste 33,3 procent bedraagt van het bedrijfsborgstellingskrediet, indien het bedrijfsborgstellingskrediet
      wordt verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking starter was;

      2°. ten minste 50 procent bedraagt van het bedrijfsborgstellingskrediet indien het bedrijfsborgstellingskrediet
      wordt verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking innovatieve MKB-ondernemer was, of

      3°. ten minste 33,3 procent bedraagt van het bedrijfsborgstellingskrediet, indien sprake is van een
      bedrijfsborgstellingskrediet, dat per kalenderjaar het bedrag van € 200.000 niet overschrijdt, indien de Bank bij
      de melding, bedoeld in artikel 6, heeft aangegeven hiervan gebruik te willen maken;

      l. indien de looptijd van de onder k bedoelde bankfaciliteit ten minste even lang is als de looptijd van het
      bedrijfsborgstellingskrediet.

      2. Voor de toepassing van het eerste lid, onderdeel k, worden mede in aanmerking genomen de bedragen die een Bank-
      gelieerde gelijktijdig met de gesloten kredietovereenkomst aan de MKB-ondernemer worden verstrekt, indien de
      zekerheden van de Bank-gelieerde ter zake van die bedragen mede strekken tot zekerheid van de Bank.


