  - number: '6.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder een onderwijsinstelling:

      a. een basisschool als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1], bekostigd uit de openbare
      kas;

      b. een speciale school voor basisonderwijs als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2],
      bekostigd uit de openbare kas;

      c. een school of instelling voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en
      voortgezet speciaal onderwijs als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref3], bekostigd uit de
      openbare kas;

      d. een school voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref4] en
      een agrarisch opleidingscentrum als bedoeld in [artikel 1.3.3. van de Wet educatie en beroepsonderwijs][ref5] voor
      zover het daarin verzorgde voorbereidend beroepsonderwijs, bekostigd uit de openbare kas;

      e. een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref6] met
      uitzondering van een agrarisch opleidingscentrum voor zover het daarin verzorgde voorbereidend beroepsonderwijs, de
      instituten, genoemd in [artikel 12.3.8 van de Wet educatie en beroepsonderwijs][ref7] of de hogescholen, genoemd in
      [artikel 12.3.9 van de Wet educatie en beroepsonderwijsinstelling][ref8];

      f. een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onderdeel a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9].

      2 In dit hoofdstuk wordt verstaan onder:

        - *CE-project:* een samenhangend geheel van activiteiten gericht op het opzetten en totstandkomen van een Centre
      of Entrepreneurship;
        - *CE-samenwerkingsverband:* een samenwerkingsverband, ten minste bestaande uit twee hoger onderwijsinstellingen
      die blijkens schriftelijke stukken samenwerken in het kader van een CE-project;
        - *Centre of Entrepreneurship:* de coördinatie, organisatie of ondersteuning van multidisciplinair en
      instellingsbreed ondernemerschapsonderwijs met als doel binnen een of meerdere hoger onderwijsinstellingen
      ondernemerschap te stimuleren;
        - *hoger onderwijsinstelling:* een onderwijsinstelling bedoeld in het eerste lid, onderdeel f;
        - *ondernemerschapsonderwijsproject:* een samenhangend geheel van activiteiten gericht op de totstandkoming,
      verbetering of verspreiding van ondernemerschap in het onderwijs;
        - *onderwijssamenwerkingsverband:* een samenwerkingsverband, bestaande uit ten minste twee onderwijsinstellingen en
      of instellingsonderdelen die blijkens schriftelijke stukken in het kader van ondernemerschapsonderwijs samenwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.3
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
      [ref7]: https://wetten.overheid.nl/BWBR0007625#Artikel12.3.8
      [ref8]: https://wetten.overheid.nl/BWBR0007625#Artikel12.3.9
      [ref9]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
