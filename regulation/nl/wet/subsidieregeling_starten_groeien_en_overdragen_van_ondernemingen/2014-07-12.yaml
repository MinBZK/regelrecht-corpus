  - number: 9a.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *academische innovatieve starter:* innovatieve starter van wie de economische activiteiten rechtstreeks en
      onmiddellijk voortkomen uit onderzoek van een universiteit, een academisch ziekenhuis als bedoeld in onderdeel
      j van de [Bijlage behorende bij de Wet op het hoger onderwijs en wetenschappelijk onderzoek](77499), een
      onderzoeksorganisatie als bedoeld in [artikel 4.1 van het Reglement NWO 2002][ref1], een onderzoeksinstituut van de
      Koninklijke Nederlandse Akademie van Wetenschappen, het Nederlands Kanker Instituut, het Max Planck Instituut voor
      Psycholinguïstiek te Nijmegen, onderzoekers van de Dubble-bundellijn bij de European Synchrotron Radiation Facility
      te Grenoble, Frankrijk, het Naturalis Biodiverity Center, of het Advanced Research Centre for NanoLithography,
      hetgeen blijkt uit een overeenkomst gesloten tussen de innovatieve starter en de desbetreffende universiteit,
      het desbetreffende academisch ziekenhuis, de desbetreffende onderzoeksorganisatie of het desbetreffende
      onderzoeksinstituut;
        - *experimentele ontwikkeling:* experimentele ontwikkeling als bedoeld in paragraaf 2.2, onder g, van het O&O&I-
      steunkader;
        - *innovatieve starter:* ondernemer als bedoeld in paragraaf 5.4 van het O&O&I-steunkader;
        - *O&O&I-steunkader:* Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr.
      2006/C 323/01 (PbEU 2006, C 323);
        - *toekomstige investeerder:* persoon die in het kader van een vernieuwingsfasetraject of een vroegefasetraject
      van plan is na uitvoering van het vernieuwingsfaseplan of het vroegefaseplan aan de aanvrager van de subsidie
      financiering te verstrekken voor een bedrag dat ten minste gelijk is aan het bedrag van de maximale hoofdsom,
      bedoeld in de [artikelen 9a.5][ref2], [9a.10][ref3] en [9a.15][ref4], voor de fase na de vernieuwingsfase of de
      vroegefase;
        - *vroegefaseplan:* document waarin: a. de aanvrager van de subsidie uiteenzet op welke wijze en op welke
      termijn een uitvinding, een resultaat van een onderzoek, een idee of een concept zo kan worden ontwikkeld dat de
      toekomstige investeerder in staat is te besluiten tot de voorgenomen financiering, of; b. indien het gaat om een
      uiteenzetting van een academische innovatieve starter, de vragen van toekomstige financiers omtrent de ontwikkeling
      worden beantwoord zodat de toekomstige financiers over financiering kunnen besluiten;
        - *vroegefasetraject:* samenhangend geheel van activiteiten beschreven in het vroegefaseplan;
        - *vernieuwingsfaseplan:* document waarin wordt uiteengezet op welke wijze en op welke termijn de MKB-ondernemer
      door experimentele ontwikkeling komt tot de ontwikkeling of de verdere ontwikkeling van een product, proces
      of dienst op basis waarvan de toekomstige investeerder definitief kan besluiten tot financiering van het
      vervolgtraject;
        - *vernieuwingsfasetraject:* samenhangend geheel van activiteiten beschreven in het vernieuwingsfaseplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014548#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel9a.5
      [ref3]: https://wetten.overheid.nl/BWBR0024902#Artikel9a.10
      [ref4]: https://wetten.overheid.nl/BWBR0024902#Artikel9a.15
