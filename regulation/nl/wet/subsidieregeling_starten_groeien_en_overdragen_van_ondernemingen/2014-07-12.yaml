        artikel: '30'
  - number: '4.12'
    text: |-
      1 De vergoeding, bedoeld in [artikel 33, tweede lid, van het Kaderbesluit EZ-subsidies][ref1], verschilt al naar
      gelang de inkomsten door de financier worden ontvangen in één van de volgende perioden:

      a. periode A: vanaf het tot stand komen van deze overeenkomst van geldlening tot het tijdstip waarop het totaal
      van de door de financier uit de participaties verkregen inkomsten na aftrek van het totaal van de aan de Staat
      overgeboekte bedragen gelijk is aan de eigen bijdrage voor de verkregen participaties;

      b. periode B: vanaf het onder a bedoelde tijdstip tot het tijdstip dat het totaal van de aan de Staat overgeboekte
      bedragen gelijk is aan het totaal op grond van de overeenkomst van lening opgenomen bedrag;

      c. periode C: vanaf het tijdstip dat het totaal van de aan de Staat overgeboekte bedragen gelijk is aan het totaal
      op grond van de overeenkomst van lening opgenomen bedrag.

      2 De vergoeding, bedoeld in [artikel 33, tweede lid, van het Kaderbesluit EZ-subsidies][ref2], bedraagt:

      a. in periode A: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het
      maximale bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van
      de Staat;

      b. in periode B: 50 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het
      maximale bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van de geldlening van
      de Staat;

      c. in periode C: 20 procent van de inkomsten, vermenigvuldigd met een breuk waarvan de teller bestaat uit het
      maximale bedrag van de geldlening en de noemer uit het investeringsbudget met uitzondering van het krediet van
      de Staat.

      3 De minister kan de hoogte van de vergoeding, bedoeld in het tweede lid, per periode A, B en C afwijkend
      vaststellen, indien de financier in strijd heeft gehandeld met hetgeen in deze regeling of in de overeenkomst tot
      geldlening is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel33
