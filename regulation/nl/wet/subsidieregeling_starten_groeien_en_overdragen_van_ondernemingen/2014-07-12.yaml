  - number: B2.5:5
    text: |-
      1 Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bedrijfsborgstellingskrediet aan een
      MKB-ondernemer wordt verstrekt, moet voorts aan de volgende criteria zijn voldaan:

      a. de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan
      € 200.000 aan de-minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren.
      Indien de onderneming actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000. Een
      bedrijfsborgstellingskrediet wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde deel van het
      krediet. Bij de bepaling of de verlening van de borgstelling niet leidt tot overschrijding van het desbetreffende
      maximum wordt rekening gehouden met de-minimissteun die is verleend aan ondernemingen die deel uitmaken van
      dezelfde groep;

      b. De kredietverstrekker heeft er voor zorg gedragen dat:

        - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de verstrekking van het
      bedrijfsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het staatsgegarandeerde deel van
      het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming actief
      is in het wegvervoer, niet meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bedrijfsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde in
      aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun dat
      in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.

      2 Dit artikel is niet van toepassing op een kredietovereenkomst die wordt gesloten met een MKB-ondernemer die
      gevestigd is in het openbaar lichaam Bonaire, Sint-Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5
  - number: B2.5:6
    text: |-
      1 De kredietverstrekker stelt de Staat in kennis van een voorgenomen verstrekking van een krediet onder
      gelijktijdige verstrekking van de door de minister vastgestelde informatie.

      2 Indien de voorgenomen verstrekking van het krediet naar het oordeel van de Staat voldoet aan de in artikel
      3, eerste lid, onderdeel d tot en met n, en tweede lid, bedoelde voorwaarden, wordt de borgstelling voor dit
      krediet verleend op grond van deze overeenkomst. De Staat bericht de kredietverstrekker hierover binnen drie
      weken na ontvangst van de aanmelding, bedoeld in het eerste lid, onder vermelding van de omvang en looptijd van
      de borgstelling.

      3 De borgstelling wordt verleend onder de voorwaarde dat de kredietverstrekker een melding doet overeenkomstig
      het vijfde lid, de provisie bedoeld in artikel 3, eerste lid, onderdeel b, heeft betaald en de som van de
      in een kalenderjaar gemelde kredieten of delen daarvan niet hoger zijn dan de door de minister op grond van
      [artikel 2.7, derde lid][ref1], van de Subsidieregeling starten, groeien en overdragen van ondernemingen met
      betrekking tot dat kalenderjaar vastgestelde subsidieplafond.

      4 Indien het naar het oordeel van de Staat niet noodzakelijk wordt geacht dat de kredietverstrekker de Staat in
      kennis stelt van voorgenomen kredietvertrekkingen overeenkomstig het eerste lid, geldt de procedure van het vijfde
      lid. De Staat bericht de kredietverstrekker hierover.

      5 De kredietverstrekker meldt het krediet of het deel van het krediet waarop deze bedrijfsborgstellingsovereenkomst
      van toepassing is binnen 35 dagen na het sluiten van de kredietovereenkomst aan de Staat onder de gelijktijdige
      verstrekking van de door de minister vastgestelde informatie. De Staat bevestigt de ontvangst van een melding
      binnen 35 dagen na ontvangst.

      6 Voor de toepassing van artikel 3, eerste lid, aanhef en onder c, is de volgorde van ontvangst door de Staat van
      de meldingen, bedoeld in het vijfde lid, bepalend.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2.7'
        hoofdstuk: '2'
  - number: B2.5:7
    text: |-
      1 Het tarief van de provisie bedraagt eenmalig:

      a. 3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      niet langer dan twee jaar,

      b. 3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan twee jaar, maar niet langer dan vier jaar,

      c. 3,3 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan vier jaar, maar niet langer dan zes jaar,

      d. 4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan zes jaar, maar niet langer dan negen jaar en

      e. 4,5 procent indien de overeenkomst van borgtocht een bedrijfsborgstellingskrediet betreft met een looptijd van
      meer dan negen jaar, maar niet langer dan twaalf jaar.

      2 Indien overeenkomstig artikel 3, onderdeel b, een provisie is betaald met betrekking tot een kredietovereenkomst
      en indien het desbetreffende krediet niet is opgenomen vanwege omstandigheden die niet zijn toe te rekenen aan de
      kredietnemer of aan de kredietverstrekker, wordt de provisie door de Staat terugbetaald aan de kredietverstrekker
      mits de kredietverstrekker binnen een jaar na het sluiten van de kredietovereenkomst daartoe een verzoek aan de
      Staat heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7
  - number: B2.5:8
    text: |-
      1 Voor de berekening van de omvang van de borgstelling wordt een bedrijfsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bedrijfsborgstellingskrediet het totaal van de
      bedrijfsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een
      groep, per groep een bedrag van € 1.500.000 niet overschrijdt.

      2 Voor de berekening van de omvang van de borgstelling wordt een starters-borgstellingskrediet slechts
      in aanmerking genomen voor zover door de verstrekking van dit krediet het totaal van de starters-
      borgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van een groep, per
      groep een bedrag van € 200.000 niet overschrijdt.

      3 Voor de toepassing van het eerste lid wordt een bedrijfsborgstellingskrediet dat is verstrekt aan een andere MKB-
      ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig aansprakelijk is,
      geacht aan de MKB-ondernemer te zijn verstrekt.

      4 Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt bepalend.

      5 Voor de toepassing van het eerste lid worden:

      a. bedrijfsborgstellingskredieten die op een eerder tijdstip overeenkomstig artikel 6 zijn gemeld, slechts voor het
      met overeenkomstige toepassing van de artikelen 9 en 10 berekende gedeelte van die bedrijfsborgstellingskredieten
      in aanmerking genomen;

      b. kredieten, voor zover de Staat daarvoor op grond van het [Kaderbesluit EZ-subsidies][ref1], het Besluit
      borgstelling MKB-kredieten, of het [Besluit borgstelling MKB-kredieten 1997][ref2] nog borg staat, als
      bedrijfsborgstellingskredieten in aanmerking genomen.

      6 In afwijking van het eerste lid, overschrijdt het totaal van de bedrijfsborgstellingskredieten per kalenderjaar
      een bedrag van € 200.000 niet, indien de kredietverstrekker heeft aangegeven van de mogelijkheid, bedoeld in
      artikel 3, eerste lid, onderdeel k, subonderdeel 3°, gebruik te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0009052
  - number: B2.5:9
    text: |-
      1 Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 8 in aanmerking te nemen
      bedrijfsborgstellingskrediet na verloop van ieder kalenderkwartaal verminderd met een zodanig vast bedrag, dat het
      bedrijfsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, maar uiterlijk na verloop van 6
      jaar, nihil bedraagt.

      2 Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van
      ten hoogste twaalf jaar indien:

      a. het bedrijfsborgstellingskrediet uitsluitend is bestemd voor de betaling van de kosten van de stichting, van de
      aankoop of van de verbouwing van een onroerende zaak,

      b. deze onroerende zaak voor ten minste de helft bestemd is te worden gebruikt voor de onderneming van de MKB-
      ondernemer, en

      c. de kredietverstrekker met betrekking tot de onder a bedoelde kosten financieringsfaciliteiten verstrekt die een
      bedrag van ten minste 100 procent van de in onderdeel a bedoelde kosten belopen, dan wel, indien sprake is van een
      starters-borgstellingskrediet of een bedrijfsborgstellingskrediet, dat per kalenderjaar het bedrag van € 200.000
      niet overschrijdt, indien de kredietverstrekker bij de melding, bedoeld in artikel 6, heeft aangegeven hiervan
      gebruik te maken, 33,3 procent van dit bedrijfsborgstellingskrediet.

      3 Voor de toepassing van het eerste lid geldt in plaats van een periode van ten hoogste zes jaar een periode van
      ten hoogste twaalf jaar indien het bedrijfsborgstellingskrediet is verstrekt aan een innovatieve MKB-ondernemer.

      4 Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.

      5 Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt aan een
      innovatieve MKB-ondernemer, het eerste kalenderkwartaal waarin vermindering plaatsvindt uiterlijk aanvangt op de
      eerste dag van het veertiende kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst
      is gesloten.

      6 Voor de toepassing van het eerste lid geldt dat, indien het bedrijfsborgstellingskrediet is verstrekt voor de
      betaling van de kosten van de stichting of verbouwing van een onroerende zaak, het eerste kalenderkwartaal waarin
      vermindering plaatsvindt uiterlijk aanvangt op de eerste dag van het zesde kalenderkwartaal dat volgt op het
      kalenderkwartaal waarin de kredietovereenkomst is gesloten.

      7 De kredietverstrekker kan de vermindering, bedoeld in het eerste lid, gedurende een periode van ten minste een
      kalenderkwartaal opschorten indien:

      a. de kredietverstrekker voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot
      aflossing van het bedrijfsborgstellingskrediet,

      b. de kredietverstrekker uitstel verleent van de verplichting tot aflossing van alle financieringsfaciliteiten
      gedurende de duur van de opschorting, dan wel uitstel verleent van de verplichting tot aflossing van een gedeelte
      van de financieringsfaciliteiten, waarbij de som van de aflossingsbedragen ten minste even groot is als de som
      van de aflossingsbedragen waarvoor de kredietverstrekker uitstel verleent als bedoeld onder a, of, indien het
      bedrijfsborgstellingskrediet is verstrekt aan:

      1°. een MKB-ondernemer die ten tijde van de verstrekking starter was, ten minste 33,3 procent bedraagt van de som
      van de aflossingsbedragen waarvoor de kredietverstrekker uitstel verleent als bedoeld onder a, of

      2°. een MKB-ondernemer die ten tijde van de verstrekking innovatief MKB-ondernemer was, ten minste 50 procent
      bedraagt van de som van de aflossingsbedragen waarvoor de kredietverstrekker uitstel verleent als bedoeld onder
      a, en

      c. de kredietverstrekker de opschorting meldt binnen 35 dagen na aanvang van de opschorting onder gelijktijdige
      verstrekking van de door de minister vastgestelde informatie. De minister bevestigt de melding binnen 35 dagen
      na ontvangst.

      8 De in het zevende lid bedoelde opschorting van de vermindering vindt ten hoogste voor een totaal van acht
      kalenderkwartalen plaats. De opschorting van de vermindering vindt ten hoogste voor een totaal van twaalf
      kalenderkwartalen plaats indien het bedrijfsborgstellingskrediet is verstrekt aan een starter.

      9 Indien een bedrijfsborgstellingskrediet wordt aangewend voor herfinanciering van een
      bedrijfsborgstellingskrediet, dat eerder is gebruikt voor de in het tweede lid, onder a en b genoemde doelen,
      en tevens is voldaan aan het tweede lid, onder b en c, is de nieuwe periode ten hoogste gelijk aan de periode
      waarvoor het bedrijfsborgstellingskrediet nog zou hebben gelopen zonder herfinanciering, indien en voor zover deze
      restperiode meer bedraagt dan zes jaar.

      10 Voor de toepassing van het zesde lid wordt onder een onroerende zaak mede begrepen
      schepen en vliegtuigen, voor zover deze zijn ingeschreven in de registers als bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Kadasterwet][ref1], alsmede ieder goederenrechtelijk recht dat omvat
      het uitsluitend gebruik van een onroerende zaak, met inbegrip van bovenbedoelde schepen en vliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
