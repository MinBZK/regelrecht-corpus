      1 De in [artikel 3.6][ref1] bedoelde adviescommissie heeft tevens tot taak de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden voor aanvragen om het sluiten van een garantstellingsovereenkomst, bedoeld in de
      [artikelen 22][ref2] en [24 van het Kaderbesluit EZ-subsidies][ref3].

      2 De in [artikel 3.12f, tweede lid][ref4], bedoelde adviescommissie heeft tevens tot taak de minister
      op zijn verzoek te adviseren omtrent de afwijzingsgronden voor aanvragen om garantstelling, bedoeld in
      [artikel 3.12s][ref5].


