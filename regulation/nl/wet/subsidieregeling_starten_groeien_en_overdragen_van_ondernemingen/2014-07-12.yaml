  - number: B3.2:6
    text: |-
      1 De financier aan wie de minister een reserveringsquotum heeft toegekend, is hiervoor aan de Staat een eenmalige
      provisie van 1% van dit quotum verschuldigd.

      2 De financier is een provisie verschuldigd voor de garantie op leningen die overeenkomstig de procedure van
      artikel 4 onder de garantstelling zijn gebracht. De provisie bedraagt jaarlijks

      a. 2,5% van de gegarandeerde waarde van de lening indien deze bestaat uit een niet converteerbare achtergestelde
      lening zonder dat deze gepaard gaat met een kapitaalverstrekking aan dezelfde ondernemer door de financier of een
      andere financier die deel uitmaakt van dezelfde groep in de vorm van een converteerbare achtergestelde lening of
      aandelenkapitaal;

      b. 3% van de gegarandeerde waarde van de lening in andere gevallen.

      3 Per kwartaal wordt een vierde deel van de in het tweede lid bedoelde provisie in rekening gebracht, uitgaand van
      de waarde van de leningen op de eerste dag van het kwartaal.

      4 De in het tweede lid bedoelde provisie is verschuldigd voor de duur van de garantie of zoveel korter als zich één
      van de in artikel 8, eerste lid, genoemde omstandigheden voordoet.

      5 De financier is op het tijdstip van de volledige aflossing van de lening een aanvullende provisie verschuldigd
      indien de op grond van het tweede lid voor de totale looptijd van de lening verschuldigde provisie minder bedraagt
      dan het zesvoud van de provisie die met toepassing van het tweede lid voor de helft van het geleende bedrag kan
      worden berekend, welke aanvullende provisie gelijk is aan het hiervoor bedoelde verschil.

      6 Indien de lening binnen een termijn van zes jaar wordt afgestoten om verlies op die lening in de zin van artikel
      8, eerste lid, te beperken, kan de minister op verzoek van de financier de over de resterende termijn verschuldigde
      provisie kwijtschelden indien sprake is van klemmende redenen, gelegen in het belang van de onderneming van de
      ondernemer.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6
  - number: B3.2:7
    text: |-
      1 De financier draagt er voor zorg dat een administratie wordt gevoerd die zodanig is ingericht, dat daaruit te
      allen tijde op eenvoudige en duidelijke wijze gegevens kunnen worden afgelezen over de verstrekkingen, het beheer
      en de vervreemdingen van gegarandeerde leningen en van ander risicokapitaal dat hij aan dezelfde ondernemer heeft
      verstrekt.

      2 De financier informeert de Staat binnen acht weken nadat de desbetreffende gebeurtenis heeft plaatsgevonden
      schriftelijk over wezenlijke wijzigingen in het financieringsbeleid of de organisatie van de financier en over
      wijzigingen ten aanzien van gegarandeerde leningen, waaronder

      a. een aflossing van een achtergestelde lening, tenzij deze aflossing overeenkomt met een aflossingsschema waarover
      de Staat eerder is geïnformeerd;

      b. een wijziging van de looptijd van een achtergestelde lening.

      3 De financier verstrekt de Staat jaarlijks zijn jaarverslag.

      4 Desgevraagd verstrekt de financier de Staat gegevens en bescheiden over de verstrekkingen,
      het beheer en de vervreemdingen van gegarandeerde leningen en van ander risicokapitaal dat
      hij aan dezelfde ondernemer heeft verstrekt, en de jaarrekeningen van de ondernemingen waaraan
      risicokapitaal is verstrekt, vergezeld van desbetreffende accountantsverklaringen als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] of een mededeling waarom deze ontbreekt, en
      van de bijbehorende toelichtingen voor het bestuur van de onderneming. .

      5 De financier doet onverwijld mededeling aan de Staat van de indiening bij de rechtbank van een verzoek tot
      verlening van surséance van betaling aan hem, een verzoek tot faillietverklaring van hem of een verzoek om ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing te verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
