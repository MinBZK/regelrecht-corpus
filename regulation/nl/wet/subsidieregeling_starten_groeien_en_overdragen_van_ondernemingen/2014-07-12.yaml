        artikel: '46'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '47'
  - number: '7.10'
    text: |-
      De subsidieontvanger neemt deel aan de jaarlijkse bijeenkomst van projectleiders voor projecten die wordt
      georganiseerd door het Ministerie van Economische Zaken in het kader van deze regeling en brengt op deze
      bijeenkomst verslag uit omtrent de uitvoering van het project.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.10
  - number: '7.11'
    text: |-
      1 De subsidieontvanger verleent medewerking aan een evaluatie van de effecten van het door hem uitgevoerde project,
      voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.11
  - number: '7.12'
    text: |-
      De subsidie-ontvanger is verplicht binnen drie maanden na de datum van de beschikking tot subsidieverlening te
      starten met de activiteiten, bedoeld in [artikel 7.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '7.2'
        hoofdstuk: '7'
  - number: '7.13'
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 7.1][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 5.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
      [ref2]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
      - id: ref2
        bwb_id: BWBR0024902
  - number: '8.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      − *contractprijs:* de tussen opdrachtgever en scheepswerf overeengekomen prijs voor de bouw van een schip, met
      inbegrip van stelposten voor zover daarvoor in het contract vaste of geschatte bedragen zijn opgenomen en met
      uitzondering van de eventueel verschuldigde omzetbelasting;

      − *kredietbedrag:* het bedrag dat op grond van de kredietovereenkomst als krediet wordt verstrekt ten behoeve van
      de bouw in Nederland van een nieuw schip;

      − *kredietovereenkomst:* schriftelijke overeenkomst tussen een scheepswerf en een financier waarbij de financier op
      verzoek van de scheepswerf krediet verstrekt aan de scheepswerf voor de bouw in Nederland van een nieuw schip;

      − *opdrachtgever:* natuurlijke of rechtspersoon die opdracht heeft gegeven tot de bouw van een schip;

      − *scheepswerf:* een ondernemer die schepen ontwerpt, ontwikkelt, bouwt en uitrust, hetzij zelfstandig, hetzij deel
      uitmakend van een groep;

      − *schip:* een zichzelf voortstuwend schip, met een minimaal vermogen van 365 kW of een minimaal tonnage van 500
      bruto ton, niet zijnde een schip dat overeenkomstig zijn fundamentele en technisch vermogen is bedoeld om voor
      militaire doeleinden te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.1
  - number: '8.2'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een bank, niet zijnde een bank die uitsluitend
      beleggingsonderneming is.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.2
  - number: '8.3'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een financier voor het verstrekken van een krediet aan een
      scheepswerf ten behoeve van de bouw in Nederland van een nieuw schip.

      2 De subsidie wordt verstrekt in de vorm van een garantstelling.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.3
  - number: '8.4'
    text: |-
      1 Er wordt garant gestaan voor maximaal 80 procent van de financiële verplichtingen die ingevolge artikel 2 van de
      overeenkomst tot garantstelling die is opgemaakt conform het model dat is opgenomen in [bijlage 8.1][ref1], onder
      de garantstelling vallen.

      2 Er wordt niet garant gestaan voor de kosten die de financier in rekening brengt aan de scheepswerf, met
      uitzondering van de kosten ten behoeve van de financiering van de bouw van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '8.5'
    text: |-
      1 Er is een Adviescommissie Garantieregeling scheepsnieuwbouwfinanciering die tot taak heeft de minister op zijn
      verzoek te adviseren omtrent:

      a. de afwijzingsgronden voor aanvragen om garantstelling, bedoeld in [artikelen 22][ref1] en
      [24 van het Kaderbesluit EZ-subsidies][ref2] en bedoeld in [artikel 8.7][ref3];

      b. de bepaling van het tarief van de provisie bedoeld in [artikel 8.10, tweede lid][ref4].

      2 De commissie bestaat uit ten minste drie en ten hoogste vijf leden.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste drie jaar benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0024902#Artikel8.7
      [ref4]: https://wetten.overheid.nl/BWBR0024902#Artikel8.10
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0024902
        artikel: '8.7'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0024902
        artikel: '8.10'
        hoofdstuk: '8'
  - number: '8.6'
    text: |-
      1 De financier dient de aanvraag om een garantstelling in binnen zeven werkdagen na het sluiten van de
      kredietovereenkomst.

      2 De minister stuurt de financier binnen vijf werkdagen een bevestiging van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.6
  - number: '8.7'
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. ten laste van de Staat een garantstelling, borgstelling, verzekering of herverzekering voor een
      kredietovereenkomst voor de bouw van hetzelfde schip is afgegeven;

      b. de contractprijs minder dan € 3.000.000 of meer dan € 100.000.000 bedraagt;

      c. onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van de bouw van het schip;

      d. het kredietbedrag meer dan 80 procent van de contractprijs betreft;

      e. de kredietovereenkomst ten aanzien van het kredietbedrag een looptijd heeft van meer dan 36 maanden of de
      looptijd van de kredietovereenkomst langer is dan de termijn voor de bouw en technische-/financiële oplevering van
      het schip;

      f. de financier op het moment van het verstrekken van het kredietbedrag waarvoor de Staat garant staat een lopende
      financieringsfaciliteit verlaagt;

      g. de financier onvoldoende naar normaal bankgebruik te vestigen zekerheden heeft gevestigd of zal vestigen bij de
      verstrekking van het kredietbedrag aan de scheepswerf;

      h. door de verlening van de garantstelling het totaal van de op grond van dit hoofdstuk verleende garantstellingen
      ten behoeve van de scheepswerf of van de groep, waartoe deze scheepswerf behoort, meer zou bedragen dan 30 procent
      van het subsidieplafond;

      i. gegronde vrees bestaat dat de scheepswerf zich in financiële moeilijkheden bevindt;

      j. de rentabiliteits- en continuïteitsperpectieven van de scheepswerf onvoldoende bevredigend zijn;

      k. onvoldoende vertrouwen bestaat dat de scheepswerf de capaciteiten heeft om de bouw van het schip naar behoren
      uit te voeren;

      l. uit het contract tussen de opdrachtgever en de scheepswerf die de opdracht zal uitvoeren niet blijkt dat
      de opdrachtgever, ter zake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft afgesloten,
      voorafgaand aan een uitbetaling van het krediet op grond van de kredietovereenkomst, een of meer aanbetalingen doet
      ter hoogte van ten minste 5 procent van de contractprijs;

      m. uit het contract tussen de opdrachtgever en de scheepswerf die de opdracht zal uitvoeren niet blijkt dat de
      aanbetaling door de opdrachtgever, ter zake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft
      afgesloten, oploopt tot ten minste 20 procent van de contractprijs tot aflevering van het schip;

      n. van de bouw van het schip onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.7
  - number: '8.8'
    text: |-
      De minister verdeelt het subsidieplafond voor het stellen van garanties op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.8
  - number: '8.9'
    text: |-
      Het model voor de overeenkomst tot garantstelling is opgenomen in [bijlage 8.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '8.10'
    text: |-
      1 Het tarief van de provisie, bedoeld in [artikel 32, derde lid, van het Kaderbesluit EZ-subsidies][ref1], bedraagt
      jaarlijks tussen 0,39 procent en 4,19 procent van het bedrag dat op enig moment gedurende de bouw van een schip op
      basis van een kredietovereenkomst daadwerkelijk door een scheepswerf als krediet is opgenomen.

      2 De minister bepaalt in de beschikking tot verlening van subsidie in de vorm van een garantstelling het tarief per
      individuele garantstelling.

      3 Het tarief, bedoeld in het tweede lid, wordt zodanig vastgesteld dat:

      a. het marktconform is;

      b. de provisie zowel de met de garantstelling verbonden risico´s als de beheerskosten dekt;

      c. rekening wordt gehouden met een realistische risicoanalyse.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel32
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '32'
  - number: '8.11'
    text: De minister beziet eenmaal per jaar of de in dit hoofdstuk gestelde vereisten moeten worden herzien.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.11
  - number: '8.12'
    text: |-
      Het formulier voor het indienen van een aanvraag om garantstelling is opgenomen in [bijlage 8.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0024902
  - number: '9.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *veiligheidsadviseur:* een onafhankelijke veiligheidsdeskundige: 1°. die een diploma, certificaat of andere
      titel heeft behaald in ten minste één van de in [bijlage 9.1][ref1] opgenomen opleidingen of in een gelijkwaardige
      opleiding; 2°. die de cursus Adviseur Veiligheid Kleine Bedrijven van het Ministerie van Economische Zaken heeft
      gevolgd; 3°. die een recente verklaring omtrent gedrag, een recente verklaring van betrouwbaarheid of een door een
      bestuursorgaan afgegeven vergelijkbaar document met ten minste een gelijkwaardige betrouwbaarheid kan overleggen;
      4°. die voldoet aan de in [bijlage 9.2][ref2] opgenomen gedragscode; 5°. waarvan gebleken is dat de door hem
      gemaakte veiligheidsscans van voldoende kwaliteit zijn; 6°. die tenminste vijf jaren relevante ervaring als
      veiligheidsadviseur heeft.
        - *veiligheidsmaatregelen:* de in een veiligheidsscan genoemde maatregelen ten behoeve van de preventie van
      criminaliteit;
        - *veiligheidsscan:* een door een veiligheidsadviseur uitgevoerd onderzoek naar te nemen maatregelen ten
      behoeve van de preventie van criminaliteit in één of meer vestigingen van een MKB-ondernemer of in de voor de
      bedrijfsvoering van een MKB-ondernemer relevante bedrijfsmiddelen en waarin in ieder geval wordt ingegaan op de te
      nemen organisatorische, bouwkundige, elektronische en digitale maatregelen en hun onderlinge samenhang.


      [ref1]: https://wetten.overheid.nl/BWBR0024902
      [ref2]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024902
      - id: ref2
        bwb_id: BWBR0024902
  - number: '9.2'
    text: Een subsidie die op grond van dit hoofdstuk wordt verstrekt valt onder de de-minimis verordening.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.2
  - number: '9.3'
    text: De minister verstrekt op aanvraag subsidie aan een MKB-ondernemer die een veiligheidsscan heeft laten uitvoeren.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.3
  - number: '9.4'
    text: De subsidie voor de veiligheidsscan bedraagt € 300.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.4
  - number: '9.5'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.5
  - number: '9.6'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. aan de MKB-ondernemer voor dezelfde vestiging of hetzelfde bedrijfsmiddel reeds eerder subsidie is verstrekt op
      grond van dit hoofdstuk;

      b. de MKB-ondernemer geen Kamer van Koophandel-nummer heeft;

      c. de aanvrager een MKB-ondernemer zonder vestigingen is, die meer dan tien fulltime-equivalents werknemers in
      dienst heeft;

      d. de aanvrager een MKB-ondernemer met minder dan zes vestigingen is en bij één of meer van die vestigingen meer
      dan tien fulltime-equivalents werknemers in dienst zijn;

      e. de MKB-ondernemer meer dan vijf vestigingen heeft;

      f. de veiligheidsscan niet wordt uitgevoerd ten behoeve van de bedrijfsuitoefening van de MKB-ondernemer in
      Nederland;

      g. de veiligheidsscan geen betrekking heeft op de bedrijfsuitoefening van de MKB-ondernemer;

      h. de aanvrager geen KvK-nummer heeft voor de vestiging waarvoor subsidie wordt aangevraagd;

      i. reeds eerder subsidie is verstrekt op grond van dit hoofdstuk voor een vestiging op hetzelfde adres van een tot
      de groep van de MKB-ondernemer behorende onderneming;

      j. de adresgegevens van de vestiging in het handelsregister niet overeenkomen met de adresgegevens van de vestiging
      in de aanvraag;

      k. de veiligheidsscan op het moment van de ontvangst van de aanvraag ouder is dan negen maanden;

      l. reeds subsidie is verstrekt door de Minister van Veiligheid en Justitie.

      2 De afwijzingsgronden, genoemd in
      [artikel 23, onderdelen b, c, d, e, f en h, van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '9.7'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een MKB-ondernemer voor het treffen van één of meer in een
      veiligheidsscan opgenomen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.7
  - number: '9.8'
    text: |-
      De subsidie voor de veiligheidsmaatregelen bedraagt 50 procent van de subsidiabele kosten, maar niet meer dan
      € 700.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.8
  - number: '9.9'
    text: |-
      1 In afwijking van [artikel 10 van het Kaderbesluit EZ-subsidies][ref1] komen voor subsidie in aanmerking:

      a. de rechtstreeks aan de veiligheidsmaatregelen toe te rekenen gemaakte kosten van derden;

      b. de periodiek terugkerende kosten van de koop van zaken ter uitvoering van de veiligheidsmaatregelen;

      c. de overige periodiek terugkerende kosten met betrekking tot de veiligheidsmaatregelen voor het eerste jaar.

      2 Onderhoudskosten komen niet voor subsidie in aanmerking.

      3 In afwijking van [artikel 10, tweede lid, van het Kaderbesluit EZ-subsidies][ref2] komen voor de aanvraag
      gemaakte kosten voor subsidie in aanmerking.

      4 [Artikel 10, derde en vijfde lid, van het Kaderbesluit EZ-subsidies][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '10'
  - number: '9.10'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel9.10
  - number: '9.11'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. geen subsidie aan de MKB-ondernemer is verstrekt op grond van [artikel 9.3][ref1];

      b. de aanvraag om subsidie niet is ontvangen binnen zes maanden na de datum van de beschikking tot
      subsidieverlening;

      c. aan de MKB-ondernemer reeds subsidie is verstrekt voor het treffen van één of meer veiligheidsmaatregelen die in
      dezelfde veiligheidsscan zijn opgenomen.

      3 In afwijking van het eerste lid, onder a, wordt de aanvraag niet afgewezen, indien voor de uitgevoerde
      veiligheidsscan subsidie is verstrekt door de Minister van Veiligheid en Justitie.

      3 De minister beslist afwijzend op een aanvraag voor zover:

      a. een veiligheidsmaatregel wettelijk niet is toegestaan;

      b. de veiligheidsmaatregelen niet zijn getroffen ten behoeve van de bedrijfsuitoefening van de MKB-ondernemer in
      Nederland;

      c. de veiligheidsmaatregelen geen betrekking hebben op de bedrijfsuitoefening van de MKB-ondernemer;

      d. de veiligheidsadviseur betrokken is bij de verwezenlijking van de in zijn veiligheidsscan opgenomen
      veiligheidsmaatregelen;

      e. een veiligheidsmaatregel bestaat uit het plaatsen van een camerabewakingsysteem zonder bijbehorend door de
      leverancier of installateur voor de vestiging opgesteld organisatorisch plan;

      f. de MKB-ondernemer voorafgaand aan de veiligheidsscan een verplichting is aangegaan met betrekking tot een
      veiligheidsmaatregel waarvoor subsidie wordt aangevraagd.

      3 De afwijzingsgronden, genoemd in
      [artikel 23, onderdelen b, c, d, e, f en h, van het Kaderbesluit EZ-subsidies][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel9.3
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
