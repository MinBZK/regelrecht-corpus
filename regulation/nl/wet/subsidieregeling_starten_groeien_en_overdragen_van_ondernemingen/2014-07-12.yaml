  - number: '1.5'
    text: |-
      Deze regeling valt onder de [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’)
      (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel1.5
  - number: '1.6'
    text: |-
      Indien door de minister op grond van deze regeling een subsidie wordt verleend van minder dan € 25.000, wordt de
      subsidie ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel1.6
  - number: '2.2'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt als financier aangewezen een bank en een door de minister aangewezen
      kredietverstrekker.

      2 Voor de toepassing van [artikel 2.3, derde lid][ref1], wordt als financier aangewezen een kredietinstelling in
      de zin van de [Wet financiële markten BES][ref2] die op grond van die wet bevoegd is in Bonaire, Sint Eustatius
      of Saba het bedrijf van kredietinstelling uit te oefenen en een door de minister aangewezen, op Bonaire, Sint
      Eustatius of Saba gevestigde, kredietverstrekker.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2.3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0030883
  - number: '2.3'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan:

      a. een bank voor het sluiten van kredietovereenkomsten met MKB-ondernemers die betrekking hebben op:

      1°. bedrijfsborgstellingskredieten;

      2°. bodemsaneringsborgstellingskredieten;

      b. een door de minister aangewezen kredietverstrekker, als bedoeld in [artikel 2.2, eerste lid][ref1], voor het
      sluiten van kredietovereenkomsten met MKB-ondernemers die betrekking hebben op bedrijfsborgstellingskredieten.

      2 De subsidie wordt verstrekt in de vorm van een borgstelling voor de terugbetaling van een krediet dat de
      financier op grond van een kredietovereenkomst aan een MKB-ondernemer heeft verstrekt voor de duur van de
      kredietovereenkomst.

      3 In aanvulling op het eerste lid kan de minister ook subsidie verstrekken aan:

      a. een kredietinstelling als bedoeld in [artikel 2.2, tweede lid][ref2], voor het sluiten van kredietovereenkomsten
      met MKB-ondernemers die gevestigd zijn in het openbaar lichaam Bonaire, Sint Eustatius of Saba, die betrekking
      hebben op:

      1°. bedrijfsborgstellingskredieten;

      2°. bodemsaneringsborgstellingskredieten;

      b. een door de minister aangewezen kredietverstrekker als bedoeld in [artikel 2.2, tweede lid][ref3], voor het
      sluiten van kredietovereenkomsten met MKB-ondernemers die gevestigd zijn in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba, die betrekking hebben op bedrijfsborgstellingskredieten.

      [Artikel 2.5, eerste lid, onderdeel a, onder 1][ref4], is niet van toepassing op de in dit lid bedoelde MKB-
      ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2.2
