  - number: '7.8'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien:

      a. de voor rekening van de deelnemers blijvende subsidiabele kosten voor meer dan 60 procent voor rekening komen
      van de deelnemende ondernemers tezamen, dan wel van de deelnemende beroepsonderwijsinstellingen tezamen;

      b. de personele inbreng in de uitvoering van het project niet evenredig is verdeeld over de deelnemende
      beroepsonderwijsinstellingen en de deelnemende ondernemers;

      c. onvoldoende vertrouwen bestaat in de financiële haalbaarheid van het project;

      d. onvoldoende aannemelijk is dat de samenwerking leidt tot verbetering van het praktijkleren;

      e. de kosten van het project niet in verhouding zijn met de activiteiten en de te verwachten resultaten, met name
      voor de MKB-ondernemers;

      f. onvoldoende vertrouwen bestaat in de structurele voortzetting van de activiteiten, bedoeld in
      [artikel 7.2, onderdeel b][ref1], indien het project mede is gericht op duurzame verankering als daar bedoeld.

      2 De afwijzingsgronden, genoemd in [artikel 23, onderdelen a, b, d, e en f, van het Kaderbesluit EZ-subsidies][ref2]
      zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7.8
    references:
      - id: ref1
