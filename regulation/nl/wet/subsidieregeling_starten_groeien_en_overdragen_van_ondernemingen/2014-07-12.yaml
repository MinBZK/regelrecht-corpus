  - number: '5.2'
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de uitvoering van een valorisatieplan aan:

      a. een organisatie met rechtspersoonlijkheid waarin ten minste één onderwijsinstelling en één in Nederland
      gevestigde onderneming die niet tot dezelfde groep behoren, zijn verbonden of

      b. een deelnemer in een samenwerkingsverband bestaande uit ten minste één onderwijsinstelling en één in Nederland
      gevestigde onderneming die niet tot dezelfde groep behoren.

      2 De subsidie wordt verstrekt voor activiteiten gedurende de eerste vier jaar van de looptijd van het
      valorisatieplan die bestaan uit:

      a. onderwijsactiviteiten in het kader van door de overheid bekostigd onderwijs ter stimulering van een ondernemende
      houding en voor de ontwikkeling van ondernemerschapscompetenties, verricht door een onderwijsinstelling die
      deelneemt aan de uitvoering van het valorisatieplan, ten behoeve van studenten, docenten of andere betrokkenen in
      alle kennisdomeinen binnen de onderwijsinstelling;

      b. activiteiten van een kennisinstelling die aan de uitvoering van het valorisatieplan deelneemt ter bevordering
      van de aanwending van kennis waarover zij beschikt met betrekking tot:

      1°. de beoordeling in hoeverre deze kennis geschikt is voor economische of maatschappelijke benutting;

      2°. het zoeken naar en stimuleren van starters, maatschappelijke organisaties en ondernemingen om deze kennis toe
      te passen;

      voor zover die activiteiten niet bestaan uit advisering op individuele basis;

      c. de indiening van aanvragen door een kennisinstelling die aan de uitvoering van het valorisatieplan deelneemt,
      voor de verwerving van rechten van intellectuele eigendom voor zover:

      1°. de aanvragen passen in een door de kennisinstelling ontwikkelde visie over optimale bescherming van kennis;

      2°. de verkregen rechten van intellectuele eigendom binnen 30 maanden tegen marktconforme voorwaarden worden
      overgedragen met het oog op de toepassing daarvan;

      3°. de uit de overdracht verkregen opbrengsten worden geïnvesteerd in de primaire activiteiten van de
      kennisinstelling;

      d. de bekostiging van aan starters te verstrekken leningen ten behoeve van de oprichting of de opbouw van hun
      onderneming;

      e. de bekostiging van financiële bijdragen aan starters, MKB-ondernemers en maatschappelijke organisaties,
      uitgezonderd kennisinstellingen, voor het verrichten van een technische haalbaarheidsstudie;

      f. het vormen en in stand houden van een netwerk met behulp waarvan de uitvoerder van het valorisatieplan contacten
      onderhoudt met relevante derden;

      g. andere activiteiten ter versterking van het valorisatieproces.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.2
  - number: '5.3'
    text: |-
      1 De subsidie voor de in [artikel 5.2, tweede lid, onderdelen a en b][ref1], bedoelde activiteiten bedraagt 50
      procent van de subsidiabele kosten.

      2 De subsidie voor de in [artikel 5.2, tweede lid, onderdeel c][ref2], bedoelde activiteiten bedraagt 50 procent
      van de subsidiabele kosten en ten hoogste € 12.500 per aanvraag betreffende een intellectueel eigendomsrecht.

      3 De subsidie voor de in [artikel 5.2, tweede lid, onderdeel d][ref3], bedoelde activiteiten bedraagt 50 procent
      van de subsidiabele kosten en ten hoogste € 50.000 per starter.

      4 De subsidie voor de in [artikel 5.2, tweede lid, onderdeel e][ref4], bedoelde activiteiten bedraagt 50 procent
      van de subsidiabele kosten en ten hoogste € 125.000 per haalbaarheidsonderzoek.

      5 De subsidie voor de in [artikel 5.2, tweede lid, onderdeel f][ref5], bedoelde activiteiten bedraagt 50 procent
      van de subsidiabele kosten en ten hoogste 5% van de totaal verstrekte subsidie.

      6 De subsidie voor de in [artikel 5.2, tweede lid, onderdeel g][ref6], bedoelde activiteiten bedraagt 50 procent
      van de subsidiabele kosten en ten hoogste 5% van de totaal verstrekte subsidie.


