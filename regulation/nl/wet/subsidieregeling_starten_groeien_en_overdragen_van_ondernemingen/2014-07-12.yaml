  - number: B3.2:8
    text: |-
      1 De financier kan een beroep doen op de garantie indien hij op een gegarandeerde lening verlies lijdt:

      a. bij gehele of gedeeltelijke vervreemding van de lening;

      b. door gehele of gedeeltelijke kwijtschelding van de lening door de financier;

      c. door het onvermogen van de ondernemer om de lening af te lossen;

      d. als gevolg van een faillietverklaring, een surséance van betaling of een van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan de lening is verstrekt;

      e. indien het risicokapitaal een achtergestelde lening betreft, bij een in kracht van gewijsde gegane homologatie
      van een akkoord na de faillietverklaring, na de verlening van surséance van betaling of na het van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen met betrekking tot de ondernemer waaraan de lening
      is verstrekt;

      f. indien de ondernemer een rechtspersoon is, bij ontbinding van de rechtspersoon.

      2 De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien in de voorafgaande
      periode van twaalf maanden meer middelen aan de MKB-onderneming zijn onttrokken ten behoeve van derden dan
      noodzakelijk voor een redelijk te achten bedrijfsvoering, dan wel een verplichting tot een zodanige onttrekking is
      aangegaan, mits de financier hieraan op enigerlei wijze medewerking heeft verleend.

      3 Bij verlies ingevolge vervreemding van een lening geldt de garantie alleen indien de vervreemding:

      a. niet eerder dan twee jaar na de verstrekking ervan heeft plaatsgevonden, tenzij de Staat desgevraagd met
      vervreemding binnen deze termijn heeft ingestemd;

      b. gebeurt tegen een prijs die past in het voeren van een actief en winstgericht beleid;

      c. voor zover de financier daarbij de lening geheel of voor een deel overdraagt aan één van zijn aandeelhouders,
      hoofdelijk aansprakelijke vennoten, bestuurders, beheerders of andere betrokkenen, gebeurt tegen een prijs die is
      gebaseerd op een taxatie van twee onafhankelijke deskundigen, dan wel gepaard gaat met vervreemding van ten minste
      een derde deel van de lening aan onafhankelijke derden.

      4 Bij verlies ingevolge gehele of gedeeltelijke kwijtschelding van een lening geldt de garantie alleen indien
      de kwijtschelding noodzakelijk is voor de continuïteit van de onderneming waarvoor de lening is verstrekt en
      indien rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder meer door een
      evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande leningen, met
      inachtneming van de achterstelling van de gegarandeerde lening.

      5 Als onvermogen van de ondernemer om de lening af te lossen, bedoeld in het eerste lid, onder c, wordt aangemerkt
      de situatie waarin

      a. de ondernemer niet in staat is te voldoen aan zijn betalingsverplichtingen;

      b. aannemelijk is dat de ondernemer in de eerstvolgende jaren niet in staat zal zijn te voldoen aan zijn
      betalingsverplichtingen; en

      c. aannemelijk is dat rekening is gehouden en wordt gehouden met het belang van de Staat als garantsteller, onder
      meer door een evenwichtige aanwending van de beschikbare middelen van de ondernemer voor de aflossing van bestaande
      leningen, met inachtneming van de achterstelling van de gegarandeerde lening.

      6 Verlies als gevolg van faillietverklaring, een verlening van surséance van betaling of een van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen, bedoeld in het eerste lid, aanhef en onder d, wordt
      aanwezig geacht

      a. voor zover aannemelijk is dat de financier bij het einde van het faillissement, van de surséance
      onderscheidenlijk van de toepassing van de schuldsaneringsregeling een verlies als bedoeld in het achtste lid zal
      leiden;

      b. mits aannemelijk is dat rekening is gehouden met het belang van de Staat als garantsteller.

      7 De minister kan het beroep afwijzen of een korting toepassen op het gevraagde bedrag indien de financier tekort
      is geschoten bij de naleving van verplichtingen op grond van deze overeenkomst of indien de financier niet kan
      aantonen die maatregelen te hebben genomen die een redelijk handelend en redelijk bekwaam beheerder zou hebben
      genomen in het kader van een actief en winstgericht beleid.

      8 Het verlies wordt berekend op basis van de waarde van de lening of, indien het verlies slechts op een deel van de
      lening is geleden, het hiermee overeenkomende deel van die waarde, in een voorkomend geval verminderd met:

      a. in geval van vervreemding: de prijs waarvoor die vervreemding heeft plaatsgevonden;

      b. in geval van ontbinding: de liquidatie-uitkering; of

      c. in geval van homologatie van een akkoord als bedoeld in het eerste lid, onder e, de in het kader van het akkoord
      voor de lening verrichte uitkering.

      9 Indien de financier meermalen gegarandeerde leningen aan een ondernemer heeft verstrekt en slechts op een deel
      daarvan verlies lijdt, wordt het verlies geacht te zijn geleden op de lening dat de financier het eerst heeft
      verstrekt.

      10 Indien de financier aan een ondernemer leningen heeft verstrekt die slechts ten dele onder de garantstelling
      zijn gebracht en slechts op een deel daarvan verlies lijdt, wordt het verlies, onverminderd het zesde lid, naar
      rato toegerekend aan de leningen die onder de garantstelling zijn gebracht.
