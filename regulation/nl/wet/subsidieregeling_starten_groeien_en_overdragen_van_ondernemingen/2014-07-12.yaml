        artikel: '70'
  - number: 3.12x
    text: |-
      1 Er wordt garant gestaan voor 50 procent van de waarde van een bankgarantie.

      2 Indien de financier bij het afgeven van een bankgarantie een gedeelte daarvan niet onder de garantstelling van
      de Staat brengt, zijn de bepalingen van deze paragraaf slechts van toepassing op het gedeelte van de afgegeven
      bankgarantie dat onder de garantstelling is gebracht.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3.12x
  - number: 3.12y
    text: |-
      1 De garantstelling heeft uitsluitend betrekking op een bankgarantie waarbij de door een financier ten laste van
      een ondernemer afgegeven bankgarantie niet minder bedraagt dan € 250.000.

      2 De garantstelling heeft uitsluitend betrekking op een bankgarantie waarbij de aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep verstrekte bankgarantiefaciliteit tezamen met

      a. een of meer bankgarantiefaciliteiten of

      b. het nog niet afgeloste deel van een of meer leningen als bedoeld in [3.12b][ref1]

      die door een financier met toepassing van dit hoofdstuk aan de ondernemer onderscheidenlijk de groep is of zijn
      verstrekt of gelijktijdig wordt of worden verstrekt niet meer bedraagt dan € 150.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel3.12b
