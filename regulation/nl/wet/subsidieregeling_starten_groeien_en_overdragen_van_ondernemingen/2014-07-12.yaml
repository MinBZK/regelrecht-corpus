  - number: '5.6'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.6
  - number: '5.7'
    text: |-
      1 Er is een Adviescommissie valorisatieprogramma die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden, bedoeld in de [artikelen 22][ref1] en [23 van het Kaderbesluit EZ-subsidies][ref2] en
      in [artikel 5.9][ref3].

      2 De commissie bestaat uit ten minste vijf en ten hoogste elf leden.

      3 De voorzitter en de leden worden benoemd voor een termijn van ten hoogste zes jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024902#Artikel5.9
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0024902
        artikel: '5.9'
        hoofdstuk: '5'
  - number: '5.8'
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is zes jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '5.9'
    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a. niet aannemelijk is dat uitvoering van het valorisatieplan leidt tot een aanzienlijke en duurzame versterking
      van het valorisatieproces in Nederland;

      b. onvoldoende vertrouwen bestaat dat de gerealiseerde versterking van het valorisatieproces aan het einde van de
      looptijd van het valorisatieplan structureel zal zijn verankerd bij de organisaties die deelnemen in de uitvoering
      van het valorisatieplan, en in de uitvoeringspraktijk.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.9
  - number: '5.10'
    text: |-
      1 De subsidie-ontvanger stelt voor elk jaar van de looptijd van het valorisatieplan een jaarplan op dat een nadere
      beschrijving bevat van de subsidiabele activiteiten die gedurende het desbetreffende jaar worden verricht ter
      uitvoering van het valorisatieplan, onder vermelding van de desbetreffende kosten.

      2 Het jaarplan wordt uiterlijk twee maanden voor de aanvang van het desbetreffende jaar ingediend. Het jaarplan
      voor het eerste jaar wordt uiterlijk dertien weken na de datum van de beschikking tot subsidieverlening ingediend.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.10
  - number: '5.11'
    text: |-
      1 Ten aanzien van de projectresultaten en de kennis die door het project is verkregen, verleent de subsidie-
      ontvanger medewerking aan de verdere verspreiding door de minister of door een door de minister aangewezen derde.

      2 De verplichting, bedoeld in het eerste lid, geldt tot vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.11
  - number: '5.12'
    text: |-
      De subsidie-ontvanger draagt er voor zorg dat de met de gesubsidieerde activiteiten gerealiseerde versterking
      van het valorisatieproces structureel wordt verankerd bij de uitvoerders van het valorisatieplan en in de
      uitvoeringspraktijk.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.12
  - number: '5.13'
    text: |-
      1 De subsidie-ontvanger draagt er voor zorg dat aflossingen en afbetalingen die worden ontvangen over leningen die
      zijn verstrekt voor de in [artikel 5.2, tweede lid, onderdelen d en e][ref1], bedoelde activiteiten, worden besteed
      voor het verstrekken van nieuwe, soortgelijke leningen.

      2 De verplichting, bedoeld in het eerste lid, geldt tot vier jaar na de datum van de beschikking tot
      subsidievaststelling.

      3 Op verzoek van de subsidie-ontvanger kan de minister ontheffing verlenen van de in het eerste lid bedoelde
      verplichting.

      4 Aan de ontheffing, bedoeld in het derde lid, wordt het voorschrift verbonden dat de subsidie-ontvanger 50% van
      het totaal van de aflossingen op onderscheidenlijk afbetalingen van de leningen aan de minister betaalt.

      5 Aan de ontheffing, bedoeld in het derde lid, kunnen andere voorschriften dan bedoeld in het vierde lid, worden
      verbonden.

      6 De subsidie-ontvanger is verplicht om na verloop van vier jaar na de datum van de beschikking tot
      subsidievaststelling 50% van het totaal van de aflossingen en afbetalingen die over verstrekte leningen zijn of
      zullen worden ontvangen, aan de minister te betalen volgens een in de beschikking tot subsidieverlening vastgelegd
      schema. [Artikel 42 van het Kaderbesluit EZ-subsidies][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel42
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '5.2'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '42'
  - number: '5.14'
    text: |-
      1 De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van de minister, niet:

      a. indien hij een organisatie met rechtspersoonlijkheid is, de rechtspersoon ontbinden of geheel of gedeeltelijk
      vervreemden;

      b. indien hij deelnemer is in een samenwerkingsverband, meewerken aan de ontbinding ervan of aan het uittreden van
      een of meer deelnemers ervan.

      2 Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.14
  - number: '5.15'
    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 5.2][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 5.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024902
      [ref2]: https://wetten.overheid.nl/BWBR0024902
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5.15
