        artikel: '8'
  - number: B2.1:10
    text: |-
      1. De vermindering van de borgstelling, bedoeld in artikel 9, wordt geschorst met ingang van de dag waarop het
      bedrijfsborgstellingskrediet is opgeëist.

      2. In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bedrijfsborgstellingskrediet door de Bank is opgeëist.

      3. De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel10
  - number: B2.1:11
    text: |-
      1. De Bank dient zo spoedig mogelijk na de voltooiing van de uitwinning of, indien dit eerder is, zo spoedig
      mogelijk nadat aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering komen
      op het bedrijfsborgstellingskrediet, maar in ieder geval binnen negen maanden na de datum waartegen het
      bedrijfsborgstellingskrediet is opgeëist of, indien dit eerder is, na de datum van het faillissement, een verzoek
      in om betaling uit hoofde van de bedrijfsborgstellingsovereenkomst.

      2. Het verzoek wordt ingediend onder gelijktijdige verstrekking van de door de minister vastgestelde informatie.

      3. De minister bevestigt de ontvangst van het verzoek om betaling binnen 35 dagen na de ontvangst en reageert op
      het verzoek binnen negen maanden na de bevestiging.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel11
  - number: B2.1:12
    text: |-
      1. De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van het overeenkomstig artikel 11 ingediende verzoek uit hoofde van het bedrijfsborgstellingskrediet of de
      bedrijfsborgstellingskredieten pro resto verschuldigd is, doch

      a. ten hoogste 90 procent van de met toepassing van de artikelen 8, 9 en 10 berekende omvang van het
      bedrijfsborgstellingskrediet of de bedrijfsborgstellingskredieten, en

      b. ten hoogste de som van de ten tijde van de opzegging van de kredietovereenkomst bestaande en verstrekte
      bankfaciliteiten van de Bank voor de MKB-ondernemer.

      2. In afwijking van het eerste lid, onder b, bedraagt de omvang van de borgstelling:

      a. indien sprake is van een starters-borgstellingskrediet: ten hoogste drie maal de som van de ten tijde van de
      opzegging van de kredietovereenkomst bestaande en verstrekte bankfaciliteiten van de Bank voor de MKB-ondernemer;

      b. indien het bedrijfsborgstellingskrediet is verstrekt aan een MKB-ondernemer die ten tijde van de verstrekking
      een innovatieve MKB-ondernemer was: ten hoogste twee maal de som van de ten tijde van de opzegging van de
      kredietovereenkomst bestaande en verstrekte bankfaciliteiten van de Bank voor de MKB-ondernemer.

      3. Voor de toepassing van het eerste lid en het tweede lid, onderdeel a, worden als bankfaciliteiten mede in
      aanmerking genomen:

      a. de bedragen die een Bank-gelieerde uit hoofde van een overeenkomst aan de MKB-ondernemer ter leen verstrekt of
      zal verstrekken, en

      b. de verplichtingen die een Bank-gelieerde tegenover een derde, niet zijnde een andere Bank-gelieerde of een
      rechtspersoon waarmee de Bank in een groep verbonden is, onherroepelijk is aangegaan om ten laste van de MKB-
      ondernemer aan de derde een of meer betalingen te doen als bedoeld in artikel 1, tweede lid, onderdeel g,
      3°, indien de zekerheden van de Bank-gelieerde ter zake van de hiervoor onder a en b bedoelde bedragen en
      verplichtingen mede strekken tot zekerheid van de Bank.

      4. In afwijking van het eerste lid, aanhef en onderdeel b, bedraagt de omvang van de borgstelling ten hoogste drie
      maal de som van de ten tijde van de opzegging van de kredietovereenkomst bestaande en verstrekte bankfaciliteiten
      van de Bank voor de MKB-ondernemer indien sprake is van een bedrijfsborgstellingskrediet, als bedoeld in artikel 3,
      eerste lid, onderdeel k, subonderdeel 3°.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel12
  - number: B2.1:13
    text: |-
      1. De minister betaalt hetgeen de Staat uit hoofde van deze overeenkomst met het oog op de door de Bank in haar
      verzoek bedoelde bedrijfsborgstellingskrediet verschuldigd is.

      2. Voor zover de Bank bij haar verzoek om betaling aannemelijk maakt dat er bijzondere omstandigheden waren die het
      naar normaal bankgebruik noodzakelijk maakten de andere bankfaciliteiten sterker in omvang terug te brengen dan de
      bedrijfsborgstellingskredieten, blijft artikel 12, eerste lid, aanhef en onder b, en tweede lid, buiten toepassing.

      3. De Staat is niet verplicht tot betaling op het verzoek van de Bank:

      a. indien niet voldaan is aan een verzoek als bedoeld in artikel 20, eerste lid;

      b. indien de Bank in het kader van het verzoek gegevens heeft verstrekt, waarvan zij wist of behoorde te weten dat
      deze onjuist of onvolledig waren en de verstrekking van deze gegevens tot een onjuiste beslissing op het verzoek
      zou hebben geleid.

      4. Betalingen door de Staat aan de Bank en door de Bank aan de Staat geschieden door debitering respectievelijk
      creditering door de Bank van een rekening die de Bank zal aanhouden ten name van het ministerie van Economische
      Zaken, Landbouw en Innovatie, met vermelding van 'verliesdeclaraties'.

      5. Over het debet- of creditsaldo van de rekening zal een rente berekend worden gelijk aan de basisrente.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel13
  - number: B2.1:14
    text: |-
      1. Gedurende vijf jaar nadat de Bank uit hoofde van het bedrijfsborgstellingskrediet door de Staat is betaald, is
      de Bank gehouden die pogingen in het werk te stellen om namens de Staat het door de Staat betaalde bedrag in te
      vorderen, die de Bank in het werk zou hebben gesteld indien het krediet voor eigen rekening en risico door de Bank
      zou zijn verstrekt. De Staat machtigt met het oog hierop de Bank tot invordering bij de kredietnemer van de door
      deze aan de Staat verschuldigde bedragen.

      2. De Bank zendt binnen drie maanden na afloop van de in het eerste lid bedoelde periode de minister een overzicht
      van de door haar ondernomen activiteiten, waarin de door de minister vastgestelde informatie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel14
  - number: B2.1:15
    text: |-
      1. Indien een verzoek om betaling als bedoeld in artikel 11 is ingediend op een moment, waarop de uitwinning nog
      niet is voltooid en ook niet aannemelijk is geworden dat geen opbrengsten meer zijn te verwachten die in mindering
      komen op het bedrijfsborgstellingskrediet, brengt de Bank de minister ten minste jaarlijks verslag uit over de
      voortgang van de uitwinning.

      2. De minister kan over het verloop van de uitwinning binnen een door hem te stellen termijn nadere gegevens van de
      Bank verlangen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel15
  - number: B2.1:16
    text: |-
      1. De Bank betaalt de vanaf het moment van de indiening van een verzoek om betaling als bedoeld in artikel 11
      ontvangen opbrengsten die in mindering komen op het bedrijfsborgstellingskrediet binnen twee maanden na ontvangst
      aan de Staat.

      2. Voor zover de opbrengsten na de aanvang van de periode, bedoeld in artikel 14, eerste lid, ontvangen zijn wordt
      de in het eerste lid bedoelde betalingsverplichting beperkt tot 80 procent van de ontvangen opbrengsten, tenzij
      opbrengsten ontvangen zijn uit hoofde van uitwinning.

      3. De Bank zal de rekening, bedoeld in artikel 13, vierde lid, per de datum van verzending van het verzoek, bedoeld
      in artikel 11, en binnen twee maanden na die datum, debiteren voor het bedrag waarvoor betaling wordt gevraagd,
      vermeerderd met een rente over de periode die verstreken is sinds de dag waarop de vermindering, bedoeld in artikel
      9, op grond van artikel 10 is geschorst.

      4. De Bank zal de rekening op de datum van de reactie van de minister, bedoeld in artikel 11, derde lid, en
      binnen twee maanden na die datum crediteren of debiteren voor respectievelijk het voor de Staat positieve of
      negatieve verschil tussen het bedrag waarvoor de rekening ingevolge het derde lid is gedebiteerd en het door de
      Staat blijkens de reactie, bedoeld in artikel 11, verschuldigde bedrag, vermeerderd met een over dat verschil te
      berekenen rente over de periode die is verstreken sinds de creditering of debitering, bedoeld in het derde lid, en
      de datum waarop de reactie is ontvangen.

      5. De rente, bedoeld in het derde en vierde lid, is gelijk aan de zes maands Euribor op het moment van de indiening
      van een aanvraag als bedoeld in artikel 11, vermeerderd met de door de bank gehanteerde liquiditeitsopslag.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel16
  - number: B2.1:17
    text: |-
      1. De Bank treft geen schuldregeling die inhoudt of mede inhoudt een gehele of gedeeltelijke kwijtschelding van
      verplichtingen voortvloeiende uit een kredietovereenkomst, uit hoofde waarvan een bedrijfsborgstellingskrediet
      is verstrekt, zonder voorafgaande toestemming van de minister. De minister kan aan zijn toestemming voorwaarden
      verbinden ten aanzien van de inhoud van een dergelijke regeling.

      2. De minister beslist zo spoedig mogelijk op een verzoek om toestemming als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel17
  - number: B2.1:18
    text: |-
      1. De verplichtingen van de Staat uit hoofde van deze overeenkomst met betrekking tot een
      bedrijfsborgstellingskrediet vervallen door schuldvernieuwing, door schuldoverneming en – voor het gedeelte
      waarin subrogatie plaatsvindt – door subrogatie van derden in de rechten van de Bank met betrekking tot het
      bedrijfsborgstellingskrediet, al dan niet voorafgegaan door verpanding van het bedrijfsborgstellingskrediet.

      2. In afwijking van het eerste lid blijven de verplichtingen van de Staat met betrekking tot een
      bedrijfsborgstellingskrediet van kracht, indien:

      a. de MKB-ondernemer aan wie het bedrijfsborgstellingskrediet is verstrekt de onderneming en alle voor het drijven
      van de onderneming bestemde activa en passiva inbrengt of overdraagt aan een door de MKB-ondernemer voor het
      drijven van die onderneming opgerichte rechtspersoon,

      b. de Bank met de onder a bedoelde rechtspersoon een overeenkomst sluit als gevolg waarvan die rechtspersoon bij de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verleend de plaats inneemt van de MKB-
      ondernemer, en

      c. de MKB-ondernemer zich naast de onder a bedoelde rechtspersoon hoofdelijk aansprakelijk stelt voor de nakoming
      door die rechtspersoon van de verplichtingen die voortvloeien uit de kredietovereenkomst.

      3. Voor de toepassing van het tweede lid wordt onder rechtspersoon mede begrepen twee of meer rechtspersonen,
      indien die rechtspersonen gezamenlijk voldoen aan de in het tweede lid genoemde voorwaarden en ieder van die
      rechtspersonen zich hoofdelijk aansprakelijk stelt voor de nakoming van de verplichtingen die voortvloeien uit de
      kredietovereenkomst uit hoofde waarvan het bedrijfsborgstellingskrediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel18
  - number: B2.1:19
    text: |-
      Reeds uitgekeerde bedragen zijn terstond en zonder enige ingebrekestelling opeisbaar zodra de minister blijkt
      dat de Bank zodanig onjuiste of onvolledige informatie heeft verschaft dat hij op een verzoek om betaling een
      andere beslissing zou hebben genomen, indien hem de juiste gegevens volledig waren verschaft, of dat de Bank de
      betalingsverplichting, bedoeld in artikel 16, eerste lid, niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel19
  - number: B2.1:20
    text: |-
      1. De Bank, en indien toepassing is gegeven aan de artikelen 3, tweede lid, en 12, derde lid, de Bank-
      gelieerde, en de MKB-ondernemer voldoen aan hetgeen door de minister aangewezen bij zijn ministerie werkzame
      personen wordt verzocht, voor zover dat redelijkerwijs noodzakelijk is voor een goede uitvoering van het
      [Kaderbesluit EZ-subsidies][ref1], [hoofdstuk 2][ref2] van de Subsidieregeling starten, groeien en overdragen
      van ondernemingen en deze overeenkomst, en met het oog op de nakoming door de Staat van op de Staat rustende
      internationaalrechtelijke verplichtingen, en voor zover het betrekking heeft op de uit het besluit of deze
      overeenkomst voortvloeiende zelfstandige verplichtingen van de Bank of de Bank-gelieerde de MKB-ondernemer aan
      wie het bedrijfsborgstellingskrediet is verstrekt of de met deze MKB-ondernemer gesloten kredietovereenkomsten,
      omtrent:

      a. het toegang verlenen tot door hen gebruikte plaatsen;

      b. het verlenen van inzage in zakelijke gegevens en bescheiden;

      c. het maken van kopieën van de onder b bedoelde gegevens en bescheiden;

      d. het verlenen van medewerking aan het verstrekken van gegevens door anderen en

      e. het verstrekken van inlichtingen.

      2. Alleen in daartoe aanleiding gevende gevallen zal aan de Bank, of indien toepassing is gegeven aan de artikelen
      3, tweede lid, en 12, derde lid, aan de Bank-gelieerde, of aan de MKB-ondernemer, gevraagd worden de in het eerste
      lid bedoelde inlichtingen ook door haar interne accountant te doen verstrekken.

      3. Van de mogelijkheid, genoemd in het eerste lid, aanhef en onder a, zal alleen gebruik worden gemaakt indien een
      ernstig vermoeden bestaat dat de Bank, de Bank-gelieerde of de MKB-ondernemer onjuiste of onvolledige informatie
      heeft verstrekt.

      4. De Bank stelt de minister binnen 35 dagen na kennisname op de hoogte van de volgende feiten en verstrekt daarbij
      de door de minister vastgestelde informatie:

      a. vervroegde volledige aflossing van het bedrijfsborgstellingskrediet;

      b. het door de afdeling ....... van de Bank in beheer nemen van het bedrijfsborgstellingskrediet;

      c. de verlening van surseance van betaling aan of de faillietverklaring van de MKB-ondernemer;

      d. opeising van het bedrijfsborgstellingskrediet.

      5. De Bank meldt de Staat de indiening bij de rechtbank van een verzoek tot verlening van surseance van betaling
      aan de Bank, dan wel een verzoek tot faillietverklaring van de Bank.


