  - number: B2.3:2
    text: |-
      De staat stelt zich borg ten behoeve van de Bank voor de terugbetaling van bodemsaneringsborgstellingskredieten die
      met inachtneming van het [Kaderbesluit EZ-subsidies][ref1] en [hoofdstuk 2][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en deze overeenkomst door de Bank worden verstrekt.

      Deze borgstelling wordt aangegaan onder de navolgende bedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024902
        hoofdstuk: '2'
  - number: B2.3:3
    text: |-
      1 De toepasselijkheid van deze borgstellingsovereenkomst op een krediet of een deel van een krediet kan uitsluitend
      worden ingeroepen:

      a. indien het krediet of het deel ervan binnen 35 dagen na het sluiten van de kredietovereenkomst aan de minister
      is gemeld met gebruikmaking van een formulier, waarvan het model door de minister wordt vastgesteld,

      b. indien binnen 35 dagen na het sluiten van de kredietovereenkomst de door de minister op grond van
      [artikel 2.6][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen vastgestelde
      garantieprovisie door de Bank aan de staat betaald is,

      c. voor zover door de melding, bedoeld onder a, de som van de in een kalenderjaar gemelde kredieten of delen
      daarvan de door de minister op grond van [artikel 2.7, tweede lid][ref2] van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen met betrekking tot dat kalenderjaar vastgestelde meldingslimiet niet is
      overschreden.

      2 De minister bevestigt de ontvangst van een meldingsformulier schriftelijk binnen 35 dagen na ontvangst.

      3 Voor de toepassing van het eerste lid, aanhef en onder c, is de volgorde van ontvangst van de meldingsformulieren
      door de minister bepalend.

      4 De meldingen, bedoeld in het eerste lid onder a, worden gedaan met gebruikmaking van een ondertekend formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024902
        artikel: '2.6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024902
        artikel: '2.7'
        hoofdstuk: '2'
  - number: B2.3:4
    text: |-
      1 Voor de berekening van de omvang van de borgstelling wordt een bodemsaneringsborgstellingskrediet slechts in
      aanmerking genomen voor zover door de verstrekking van het bodemsaneringsborgstellingskrediet het totaal van de
      bodemsaneringsborgstellingskredieten, berekend per MKB-ondernemer of, indien de MKB-ondernemer deel uitmaakt van
      een groep, per groep, een bedrag van € 1.500.000 niet overschrijdt.

      2 Voor de toepassing van het eerste lid wordt een bodemsaneringsborgstellingskrediet dat is verstrekt aan
      een andere MKB-ondernemer ten behoeve van een onderneming voor het drijven waarvan de MKB-ondernemer volledig
      aansprakelijk is, geacht aan de MKB-ondernemer te zijn verstrekt.

      3 Voor de toepassing van het eerste lid is de toestand op het tijdstip onmiddellijk na het sluiten van de
      kredietovereenkomst uit hoofde waarvan het bodemsaneringsborgstellingskrediet is verstrekt bepalend.

      4 Voor de toepassing van het eerste lid worden bodemsaneringsborgstellingskredieten die op een eerder tijdstip
      overeenkomstig artikel 3 zijn gemeld slechts voor het met overeenkomstige toepassing van de artikelen 5 en 6
      berekende gedeelte van die bodemsaneringsborgstellingskredieten in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel4
  - number: B2.3:5
    text: |-
      1 Voor de berekening van de omvang van de borgstelling wordt het na toepassing van artikel 4 in aanmerking te nemen
      bodemsaneringsborgstellingskrediet na verloop van ieder kalenderkwartaal met een zodanig vast bedrag verminderd,
      dat het bodemsaneringsborgstellingskrediet op de laatste datum waarop het moet zijn afgelost, doch uiterlijk na
      verloop van 18 jaar, nihil bedraagt.

      2 De Bank kan de vermindering, bedoeld in het eerste lid, gedurende een aaneengesloten periode van maximaal vier
      kalenderkwartalen opschorten indien:

      a. de Bank voor ten minste de duur van de opschorting uitstel verleent van de verplichting tot aflossing van het
      bodemsaneringsborgstellingskrediet, en

      b. de Bank de opschorting meldt binnen 35 dagen na aanvang van de opschorting met gebruikmaking van een formulier,
      waarvan het model door de minister wordt vastgesteld.

      3 De opschorting van de vermindering vindt ten hoogste twee maal plaats.

      4 Voor de toepassing van het eerste lid vangt het eerste kalenderkwartaal uiterlijk aan op de eerste dag van het
      tweede kalenderkwartaal dat volgt op het kalenderkwartaal waarin de kredietovereenkomst is gesloten.

      5 De minister bevestigt de ontvangst van een formulier als bedoeld in het tweede lid, onder b, schriftelijk binnen
      35 dagen na de ontvangst.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel5
  - number: B2.3:6
    text: |-
      1 De vermindering van de borgstelling, bedoeld in artikel 5, wordt geschorst met ingang van de dag waartegen het
      bodemsaneringsborgstellingskrediet is opgeëist.

      2 In afwijking van het eerste lid wordt de vermindering van de borgstelling pas geschorst door de aanvang van
      de uitwinning, indien met die uitwinning geen aanvang is gemaakt binnen twee maanden na de dag waartegen het
      bodemsaneringsborgstellingskrediet door de Bank is opgeëist.

      3 De vermindering van de borgstelling wordt tevens geschorst zolang de MKB-ondernemer in staat van faillissement
      verkeert of aan hem surséance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel6
  - number: B2.3:7
    text: |-
      De omvang van de borgstelling bedraagt per MKB-ondernemer 90 procent van hetgeen de MKB-ondernemer ten tijde
      van een overeenkomstig artikel 14 ingediende aanvraag uit hoofde van het bodemsaneringsborgstellingskrediet
      of bodemsaneringsborgstellingskredieten pro resto verschuldigd is, doch ten hoogste 90 procent van de met
      toepassing van de artikelen 4, 5 en 6 berekende omvang van het bodemsaneringsborgstellingskrediet of de
      bodemsaneringsborgstellingskredieten.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel7
  - number: B2.3:8
    text: |-
      Ten tijde van het sluiten van een kredietovereenkomst uit hoofde waarvan een bodemsaneringsborgstellingskrediet aan
      een MKB-ondernemer wordt verstrekt, moet aan de volgende criteria zijn voldaan:

      a. De Bank heeft de beschikking over de volgende bescheiden:

      1°. een schriftelijke verklaring van een ingenieur overeenkomstig het model dat door de minister wordt vastgesteld;

      2°. een afschrift van de beschikking van gedeputeerde staten als bedoeld in
      [artikel 29 van de Wet bodembescherming][ref1], waaruit blijkt dat het om een geval van ernstige verontreiniging
      gaat;

      3°. een afschrift van de beschikking van gedeputeerde staten als bedoeld in
      [artikel 39, tweede lid, eerste volzin, van de Wet bodembescherming][ref2];

      b. de MKB-ondernemer beschikt over onvoldoende financiële middelen om zijn onderneming op economisch verantwoorde
      wijze te drijven;

      c. er is een tekort aan zekerheden bij de MKB-ondernemer, waardoor de Bank naar normaal bankgebruik het krediet
      niet geheel voor eigen rekening en risico kan verstrekken;

      d. het bodemsaneringsborgstellingskrediet bedraagt niet meer dan het tekort aan zekerheden dat bij de Bank ten
      tijde van het sluiten van de kredietovereenkomst bestaat;

      e. het bodemsaneringsborgstellingskrediet bedraagt niet meer dan de saneringskosten die in de schriftelijke
      verklaring als bedoeld in onderdeel a, ten 1°, zijn aangemerkt als kosten van de werkzaamheden die noodzakelijk
      zijn voor de sanering van de bodem;

      f. de kredietovereenkomst is in schriftelijke vorm aangegaan;

      g. de rentabiliteits- en continuïteitsperspectieven van de onderneming zijn bevredigend;

      h. het bodemsaneringsborgstellingskrediet is niet bestemd en wordt niet gebruikt voor de nakoming van
      verplichtingen van de MKB-ondernemer aan de Bank die het bodemsaneringsborgstellingskrediet verstrekt of aan een
      rechtspersoon waarmee de Bank in een groep verbonden is;

      i. de MKB-ondernemer beschikt niet over een door een andere bank verstrekte kredietfaciliteit waarvoor de staat op
      grond van het [Kaderbesluit EZ-subsidies][ref3], het [Besluit borgstelling MKB-kredieten 1997][ref4], het Besluit
      borgstelling MKB-kredieten, Regeling borgstelling MKB-kredieten 1988, de Kredietregeling midden- en kleinbedrijf
      1985 of de Kredietbeschikking midden- en kleinbedrijf 1976 borg staat anders dan een bijzondere hypothecaire
      geldlening als bedoeld in bijlage 4 van de Kredietbeschikking midden- en kleinbedrijf 1976 of in hoofdstuk VI van
      de Kredietregeling midden- en kleinbedrijf 1985;

      j. de MKB-ondernemer, indien deze een natuurlijke persoon is, zal naar verwachting na een gebruikelijke
      aanloopperiode uit de inkomsten van zijn onderneming kunnen voorzien in zijn levensonderhoud;

      k. de natuurlijke persoon die direct of indirect meer dan de helft van het geplaatste kapitaal verschaft
      aan de MKB-ondernemer, niet zijnde een natuurlijke persoon, heeft zich borg gesteld voor de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bodemsaneringsborgstellingskrediet is verstrekt, tot aan een bedrag ter grootte van ten minste 25 procent van het
      bodemsaneringsborgstellingskrediet met een minimum van € 15.000;

      l. de Bank heeft in de door haar gesloten borgstellingsovereenkomsten met betrekking tot de nakoming door
      de MKB-ondernemer van de verplichtingen voortvloeiende uit de kredietovereenkomst uit hoofde waarvan het
      bodemsaneringsborgstellingskrediet is verleend een beding ten behoeve van de staat opgenomen, ertoe strekkende dat
      de omslagregeling van [artikel 869, boek 7, Burgerlijk Wetboek][ref5] niet geldt ten opzichte van de staat en de
      Bank heeft geen bedingen opgenomen, ertoe leidende dat:

      1°. een borg er zich op zou kunnen beroepen dat de staat eerst zou moeten worden aangesproken,

      2°. een borg zich zou kunnen onttrekken aan toepassing door de staat van de omslagregeling van
      [artikel 869, boek 7, Burgerlijk Wetboek][ref6].

      m. de verlening van de borgstelling leidt er niet toe dat de MKB-ondernemer een bedrag van meer dan € 200.000
      aan de-minimissteun ontvangt over de periode van het lopende en de twee voorafgaande fiscale jaren. Indien de
      onderneming actief is in het wegvervoer, geldt een maximum voor dit totaal van € 100.000.

      Een bodemsaneringsborgstellingskrediet wordt aangemerkt als de-minimissteun voor 13% van het staatsgegarandeerde
      deel van het krediet. Bij de bepaling of de verlening van de borgstelling niet leidt tot overschrijding van
      het desbetreffende maximum wordt rekening gehouden met de-minimissteun die in de referteperiode is verleend aan
      ondernemingen die deel uitmaken van dezelfde groep;

      n. De Bank heeft er voor zorg gedragen dat:

        - zij de MKB-ondernemer in kennis heeft gesteld dat hij ingevolge de verstrekking van het
      bodemsaneringsborgstellingskrediet steun van de overheid ontvangt ter waarde van 13% van het staatsgegarandeerde
      deel van het krediet, en dat deze steun wordt aangemerkt als de-minimissteun;
        - de MKB-ondernemer een schriftelijke verklaring heeft afgelegd over de de-minimissteun die hij of, indien hij
      deel uitmaakt van een groep, deze groep heeft ontvangen in het lopende en de twee voorafgaande fiscale jaren
      en schriftelijk heeft verklaard dat het totaal van deze de-minimissteun en de de-minimissteun ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet niet meer bedraagt dan € 200.000 of, indien de onderneming
      actief is in het wegvervoer, meer bedraagt dan € 100.000;
        - de MKB-ondernemer schriftelijk heeft verklaard dat, voor zover het ontvangen van de-minimissteun ingevolge de
      verstrekking van het bodemsaneringsborgstellingskrediet samen gaat met het ontvangen van staatssteun voor dezelfde
      in aanmerking komende kosten, dit niet leidt tot een overschrijding van het maximale percentage van staatssteun
      dat in dit geval geldt ingevolge de desbetreffende groepsvrijstellingsverordening of het desbetreffende besluit van
      de Commissie.


