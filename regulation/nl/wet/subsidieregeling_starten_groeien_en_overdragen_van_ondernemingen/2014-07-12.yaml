  - number: B3.2:2
    text: |-
      1 De Staat stelt zich tegenover de financier garant voor 50% van de waarde van door de financier verstrekte niet
      converteerbare achtergestelde leningen, voor welke garantstelling de financier een provisie is verschuldigd.

      2 De garantie wordt verleend voor de duur van deze leningen met een maximum van twaalf jaar.

      3 De garantstelling heeft alleen betrekking op leningen

      a. die worden verstrekt nadat de minister desgevraagd een reserveringsquotum heeft toegekend en voor zover het
      quotum nog toereikend en geldig is;

      b. die worden verstrekt overeenkomstig de in artikel 3 genoemde voorwaarden;

      c. die onder de garantstelling zijn gebracht overeenkomstig de procedure van artikel 4.

      4 Indien de financier bij de verstrekking van een lening een gedeelte daarvan niet onder de garantstelling van de
      Staat brengt, is deze overeenkomst slechts van toepassing op het gedeelte van de lening dat onder de garantstelling
      is gebracht, tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0024902/2014-07-12#Artikel2
  - number: B3.2:3
    text: |-
      Een niet converteerbare achtergestelde lening aan een ondernemer kan onder de garantstelling van de Staat worden
      gebracht indien wordt voldaan aan de volgende voorwaarden:

      a. de rentabiliteits- en continuïteitsperspectieven van de onderneming van de ondernemer zijn bevredigend;

      b. in de voorafgaande periode van twaalf maanden zijn niet meer middelen ten behoeve van derden aan de onderneming
      onttrokken dan noodzakelijk voor een redelijk te achten bedrijfsvoering en evenmin is een verplichting tot een
      zodanige onttrekking aangegaan;

      c. de verstrekking van het risicokapitaal dient niet ter vervanging van aan een ondernemer verschaft krediet of
      risicokapitaal door dezelfde financier of door een financier die deel uitmaakt van de groep van dezelfde financier;

      d. de waarde van de lening die aan de ondernemer of, indien de ondernemer deel uitmaakt van een groep, aan de
      groep wordt verstrekt tezamen met de waarde van risicokapitaal dat door een andere financier met toepassing van
      [hoofdstuk 3][ref1] van de Subsidieregeling starten, groeien en overdragen van ondernemingen, en van risicokapitaal
      dat met toepassing van [hoofdstuk 4][ref2] van de Subsidieregeling starten, groeien en overdragen van ondernemingen
      aan de ondernemer onderscheidenlijk de groep is verstrekt of gelijktijdig wordt verstrekt, bedraagt niet meer dan
      € 5.000.000;

      e. bij of in verband met het verstrekken van de lening verstrekt de financier geen andere goederen dan geld;

      f. de lening draagt zelfstandig bij aan het realiseren van een actief en winstgericht beleid van de financier;

      g. de ondernemer verplicht zich aan een door de minister als toezichthouder in de zin van de Algemene wet
      bestuursrecht aangewezen persoon of aan een door de minister aangewezen deskundige derde, voor zover deze dit
      redelijkerwijs noodzakelijk acht voor de vervulling van zijn taak:

      1°. inlichtingen te verstrekken en inzage in zakelijke gegevens en bescheiden te verstrekken en de gelegenheid te
      bieden daarvan kopieën te maken;

      2°. toegang te verlenen tot plaatsen niet zijnde woningen;

      3°. anderszins binnen de door hem gestelde termijn alle door hem gewenste medewerking te verlenen;

      h. het risicokapitaal dient niet voor de overname van een aandelenkapitaal of een converteerbare achtergestelde
      lening, behalve indien dit een concrete verbetering in het ondernemingsbeleid ten doel heeft;

      i. het risicokapitaal dient niet ter vervanging van een bestaande lening, indien dit uitsluitend ten doel heeft
      betere financieringsvoorwaarden te verkrijgen.

      j. het risicokapitaal heeft niet als doel de afwenteling van bestaande risico’s op de Staat;

      k. voor participatiemaatschappijen bedraagt de waarde van het risicokapitaal dat aan de ondernemer of, indien de
      ondernemer deel uitmaakt van een groep, aan de groep wordt verstrekt tezamen met de waarde van het risicokapitaal
      dat door een andere participatiemaatschappij met toepassing van hoofdstuk 3 van de Subsidieregeling starten,
      groeien en overdragen van ondernemingen en van risicokapitaal dat met toepassing van hoofdstuk 4 van de
      Subsidieregeling starten, groeien en overdragen van ondernemingen aan de ondernemer onderscheidenlijk de groep is
      verstrekt of gelijktijdig wordt verstrekt niet meer dan € 25.000.000;

      l. de minister, geadviseerd door een groep deskundige derden, heeft verklaard dat is voldaan aan de voorwaarden a
      tot en met g, indien de financiering waarvoor een garantie wordt aangevraagd meer bedraagt dan € 5 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0024902#Hoofdstuk4
