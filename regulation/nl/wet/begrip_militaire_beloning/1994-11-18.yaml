preamble:
  text: |-
    Gelet op de artikelen 18, vijfde lid van het Algemeen Rijksambtenarenreglement, 26, vijfde lid van het
    Ambtenarenreglement Staten-Generaal en 16, vijfde lid van het Arbeidsovereenkomstenbesluit;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0005066/1994-11-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van de [artikelen 18 van het Algemeen Rijksambtenarenreglement][ref1], 26 van het
      [Ambtenarenreglement Staten-Generaal][ref2] en 16 van het Arbeidsovereenkomstenbesluit wordt verstaan onder
      militaire beloning:

      A. Wat het personeel van de Koninklijke Marine betreft:

      de bezoldiging volgens de schaal of de tabel, behorende bij het Besluit herziening bezoldiging militairen zeemacht
      1954, in voorkomende gevallen vermeerderd met:

      1. de vakantie-uitkering;

      2. de brevettoelagen bedoeld in artikel 56 van de Bezoldigingsregeling militairen zeemacht 1947;

      3. het bedrag bedoeld in artikel 3, derde lid, van het Besluit herziening bezoldiging militairen zeemacht 1954;

      4. de vliegtoelage of garantievliegtoelage, bedoeld in de Regeling vliegtoelagen zeemacht 1986.

      B. Wat het personeel van de Koninklijke Landmacht en de Koninklijke Luchtmacht betreft:

      de wedde, dan wel de wedde eerste oefening bedoeld in artikel 2 van de Regeling inkomsten militairen land- en
      luchtmacht 1969, in voorkomende gevallen vermeerderd met:

      1. de vakantie-uitkering;

      2. de toelage voor bewakingsdiensten, bedoeld in artikel 63, onder c van de Regeling inkomsten militairen land- en
      luchtmacht 1969;

      3. de vliegtoelage of garantievliegtoelage, bedoeld in de artikelen 47, 48 of 80 van de Regeling inkomsten
      militairen land- en luchtmacht 1969.


