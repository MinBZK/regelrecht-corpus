---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_bank_en_kredietwezen_1994_bes
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2010-10-10'
bwb_id: BWBR0028547
url: https://wetten.overheid.nl/BWBR0028547/2010-10-10
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.a
    text: '*Bank:* De Nederlandsche Bank N.V;'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.b
    text: '*Onze Minister:* Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.c
    text: |-
      *kredietinstelling:* een onderneming of instelling, die in belangrijke mate haar bedrijf maakt van het ter
      beschikking krijgen van gelden, direct of op termijn opvorderbaar, al dan niet in de vorm van spaargelden of tegen
      uitgifte van een of meer soorten schuldbewijzen, en van het voor eigen rekening verrichten van kredietuitzettingen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.d
    text: |-
      *internationale kredietinstelling:* een kredietinstelling die middelen verkrijgt uit onderscheidenlijk uitzet in
      het buitenland;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.e
    text: |-
      *deelneming:* een rechtstreeks of middellijk belang van meer dan 5% van het geplaatste aandelenkapitaal van een
      onderneming of instelling of het rechtstreeks of middellijk kunnen uitoefenen van meer dan 5% van de stemrechten
      in een onderneming of instelling of het rechtstreeks of middellijk kunnen uitoefenen van een daarmee vergelijkbare
      zeggenschap in een onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.f
    text: '*gerecht:* Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;.'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.g
    text: '*openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.h
    text: '*buitenland:* een deel van het Koninkrijk, niet zijnde een openbaar lichaam, dan wel een andere Staat;'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.i
    text: '*geldtransactie:*'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.i.1°
    text: het wisselen van munten of bankbiljetten;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.i.2°
    text: |-
      het uitbetalen van munten of bankbiljetten op vertoon van een creditcard, tegen inlevering van een of meer cheques
      of tegen inlevering van een of meer onderdelen van het couponblad van een waardepapier aan toonder tegen inlevering
      waarvan de rente op dit waardepapier kan worden geïnd;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.i.3°
    text: |-
      het in het kader van een geldelijke overmaking ter beschikking krijgen van gelden of geldswaarden, ten einde deze
      gelden of geldswaarden al dan niet in dezelfde vorm aan een derde elders betaalbaar te stellen of te doen stellen,
      dan wel het betalen of betaalbaar stellen van gelden of geldswaarden nadat deze gelden of geldswaarden elders al
      dan niet in dezelfde vorm ter beschikking zijn gesteld, waarbij deze geldelijke overmaking een op zichzelf staande
      dienst is.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.i.4°
    text: bij ministeriële regeling aan te wijzen andere verwante activiteit;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1.1.j
    text: |-
      *geldtransactiekantoor:* een onderneming of instelling die beroeps- of bedrijfsmatig ten behoeve van of op verzoek
      van een derde geldtransacties uitvoert, dan wel beroeps- of bedrijfsmatig werkzaam is bij de totstandkoming daarvan
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: '1.2'
    text: De Bank wordt niet als kredietinstelling in de zin van deze wet beschouwd.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: '1.3'
    text: |-
      Bij ministeriële regeling, kan worden bepaald dat een onderneming of instelling waarop de in het eerste lid,
      onderdeel c of j, genoemde definitie van toepassing is, niet als kredietinstelling of geldtransactiekantoor in de
      zin van deze wet wordt aangemerkt indien de belangen die deze wet beoogt te beschermen, naar het oordeel van Onze
      Minister reeds op andere wijze afdoende worden beschermd of niet in het gedrang komen of zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1
  - number: 1a
    text: |-
      Deze wet is niet van toepassing op verzekeraars, voor zover zij het verzekeringsbedrijf als bedoeld in de
      [Wet toezicht verzekeringsbedrijf BES][ref1] uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028495
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028495
  - number: 1b.1
    text: |-
      Onze Minister kan kredietinstellingen en geldtransactiekantoren met zetel in het buitenland vrijstelling verlenen
      van de bij of krachtens deze wet gestelde regels, indien het toezicht dat in het buitenland op kredietinstellingen,
      onderscheidenlijk geldtransactiekantoren, wordt uitgeoefend, voldoende waarborgen biedt ten aanzien van de belangen
      die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1b
  - number: 1b.2
    text: Aan een vrijstelling kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel1b
  - number: '2.1'
    text: |-
      Het is een ieder verboden in een openbaar lichaam het bedrijf van kredietinstelling of geldtransactiekantoor uit te
      oefenen zonder voorafgaande vergunning van de Bank.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Aan een vergunning als bedoeld in het eerste lid, kunnen door de Bank te allen tijde beperkingen worden gesteld
      en voorschriften worden verbonden in het belang van de ontwikkeling en instandhouding van een gezond bank- en
      kredietwezen, in het belang van een integere uitoefening van het bedrijf alsmede ter bescherming van de belangen
      van de crediteuren of toekomstige crediteuren van de kredietinstelling of het geldtransactiekantoor.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      Een onderneming of instelling die voornemens is het bedrijf van kredietinstelling uit te oefenen, verzoekt per
      aangetekende brief aan de Bank haar een vergunning te verlenen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      De aanvraag wordt niet als zodanig beschouwd en door de Bank niet in behandeling genomen indien zij niet bevat, dan
      wel de Bank na toepassing van haar bevoegdheden krachtens [artikel 4, vijfde lid][ref1], dan wel [artikel 5][ref2],
      beschikt over, voldoende gegevens ten behoeve van de beslissing omtrent het verlenen van de vergunning inzake:


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028547#Artikel5
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028547
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 3.2.a
    text: het aanvangskapitaal van de onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.b
    text: |-
      het aantal, de identiteit en de antecedenten van de personen die, naar het oordeel van de Bank, het dagelijks
      beleid van de onderneming of instelling bepalen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.c
    text: |-
      indien toepasselijk, het aantal, de identiteit en de antecedenten van de leden van de raad van commissarissen dan
      wel van het orgaan dat een aan die van de raad van commissarissen gelijksoortige taak heeft;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.d
    text: |-
      de identiteit, financiële positie en antecedenten van degenen die zeggenschap in de onderneming of instelling
      uitoefenen, door middel van met aandelen verbonden stemrechten in de algemene vergadering van aandeelhouders of op
      vergelijkbare wijze;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.e
    text: |-
      de omvang van de deelnemingen of vergelijkbare zeggenschap van de in onderdeel d bedoelde personen of ondernemingen
      of instellingen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.f
    text: |-
      de laatste drie jaarrekeningen van het moederbedrijf, die moeten zijn voorzien van een
      verklaring omtrent de getrouwheid ondertekend door een externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1], waarbij deze verklaring geen andere inhoud zal
      hebben dan dat de jaarrekening een getrouw beeld geeft van de omvang en samenstelling van het vermogen van de
      onderneming of instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 3.2.g
    text: |-
      een programma van werkzaamheden welke de onderneming of instelling voornemens is te verrichten alsmede
      balansprognoses en ramingen van baten en lasten voor de eerste drie boekjaren;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.h
    text: de voorziene administratieve organisatie met inbegrip van de financiële administratie en interne controle;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.i
    text: de statuten van de onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3.2.j
    text: indien van toepassing, de vennootschappelijke structuur van de groep waartoe de onderneming of instelling behoort.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      De Bank beslist binnen 13 weken na ontvangst van een volledige aanvraag. Zij maakt haar beslissing onmiddellijk
      bij aangetekende brief kenbaar aan de aanvrager. Een afwijzende beslissing wordt met redenen omkleed. Tegen
      een afwijzende beslissing kan binnen 30 dagen beroep worden aangetekend overeenkomstig de procedure in
      [hoofdstuk XI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028547
        hoofdstuk: XI
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen in het belang van een integere uitoefening van het bedrijf nadere regels worden
      gesteld met betrekking tot de aanvraag en de daarbij te overleggen gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3
  - number: 3a
    text: |-
      Een onderneming of instelling die voornemens is het bedrijf van geldtransactiekantoor uit
      te oefenen, verzoekt per aangetekende brief aan de Bank haar een vergunning te verlenen.
      [Artikel 3, tweede lid, onderdelen b tot en met e en h tot en met j, derde en vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel3
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.1'
    text: 'De Bank verleent de vergunning, tenzij:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.a
    text: het dagelijks beleid van de onderneming of instelling door minder dan twee personen wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.b
    text: |-
      de onderneming of instelling zijnde een rechtspersoon, niet een raad van commissarissen of een orgaan die een aan
      de raad van commissarissen gelijksoortige taak heeft, bestaande uit ten minste drie leden heeft;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.c
    text: |-
      de onderneming of instelling niet beschikt over een per registerafdeling bij ministeriële regeling vast te stellen
      minimumbedrag aan eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.d
    text: |-
      de Bank van oordeel is dat de deskundigheid van een of meer personen die het dagelijks beleid van de onderneming
      of instelling bepalen, onvoldoende is, in verband met de uitoefening van het bedrijf van de onderhavige onderneming
      of instelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.e
    text: |-
      de Bank op grond van de voornemens of de antecedenten van een of meer personen die het dagelijks beleid van de
      onderneming of instelling bepalen, van oordeel is dat de belangen van de crediteuren of toekomstige crediteuren van
      de onderneming of instelling in ernstig gevaar zouden kunnen komen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.f
    text: |-
      de Bank, gelet op de voornemens of antecedenten van een of meer personen die in belangrijke mate zeggenschap
      uitoefenen in de onderneming of instelling door middel van aan aandelen gebonden stemrechten in de algemene
      vergadering van aandeelhouders of op vergelijkbare wijze, van oordeel is dat er sprake is of zou kunnen zijn van
      een ongewenste beïnvloeding van de onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.g
    text: |-
      de verklaring, bedoeld in [artikel 3, tweede lid, onderdeel f][ref1], een andere inhoud heeft dan dat de
      jaarrekening een getrouw beeld geeft van de grootte en samenstelling van het vermogen van de instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel3
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4.1.h
    text: |-
      de Bank op grond van de gegevens als bedoeld in [artikel 3, tweede lid, onderdelen f, g of h][ref1], van oordeel is
      dat de onderneming of instelling niet in staat zal zijn om haar voornemens ten uitvoer te leggen dan wel om aan de
      haar uit hoofde van het toezicht te stellen eisen te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel3
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4.1.i
    text: |-
      de Bank op grond van de statutaire doelomschrijving reden heeft om aan te nemen dat de onderneming of instelling
      activiteiten kan ontplooien op terreinen die buiten de eigen terreinen liggen en aldus een gevaar voor gezond
      bankbeleid kunnen inhouden;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.j
    text: |-
      de onderneming of instelling niet een naamloze vennootschap, een besloten vennootschap of een vereniging met
      volledige rechtsbevoegdheid is dan wel indien het een buitenlandse onderneming of instelling betreft, deze niet een
      met deze rechtspersonen vergelijkbare rechtsvorm heeft; of
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.k
    text: |-
      de statuten niet voldoen aan de bepalingen omtrent aandelen en doelomschrijving opgenomen in de algemene
      vergunningsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: 4.1.l
    text: |-
      de onderneming of instelling niet voldoet aan de in het belang van een integere uitoefening van het bedrijf bij
      ministeriële regeling te stellen eisen, daaronder begrepen eisen met betrekking tot de betrouwbaarheid van personen
      die het beleid van de onderneming of instelling bepalen of medebepalen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Een aanvragende onderneming of instelling die voornemens is het bedrijf van geldtransactiekantoor uit te oefenen,
      behoeft niet te voldoen aan de onderdelen a tot en met d, g, i en j van het eerste lid. De Bank kan besluiten dat
      een aanvragende kredietinstelling niet behoeft te voldoen aan een of meer van de onderdelen a tot en met k van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      De Bank kan besluiten een vergunning voor het uitoefenen van het bedrijf van kredietinstelling niet te verlenen
      indien zij gronden heeft om aan te nemen dat de onderneming of instelling de vergunning heeft aangevraagd om zich
      te onttrekken aan de regelgeving inzake het toezicht op het bank- en kredietwezen in een andere staat dan wel
      indien de structuur van de groep waarvan de kredietinstelling deel uitmaakt zodanig is dat de Bank onvoldoende
      adequaat en effectief toezicht kan uitoefenen op de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      De Bank kan besluiten een vergunning voor het uitoefenen van het bedrijf van kredietinstelling niet te verlenen
      indien zij van oordeel is dat het verlenen van de gevraagde vergunning in strijd is of zou kunnen zijn met de
      ontwikkeling of instandhouding van een gezond bank- en kredietwezen onderscheidenlijk ten detrimente van de
      crediteuren of toekomstige crediteuren van de kredietinstellingen zou kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      De Bank kan besluiten een vergunning voor het uitoefenen van het bedrijf van kredietinstelling niet te verlenen
      indien naar het oordeel van de Bank, de Bank of de instantie van het land van herkomst van de betrokken onderneming
      of instelling die met het toezicht op kredietinstellingen is belast, onvoldoende adequaat en effectief toezicht op
      geconsolideerde basis kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
  - number: '4.6'
    text: |-
      De Bank is bevoegd bij iedere onderneming of instelling die een verzoek heeft ingediend tot verlening van een
      vergunning als bedoeld in het eerste lid, alle inlichtingen in te winnen of te doen inwinnen, als zij meent nodig
      te hebben ter verificatie van de juistheid en volledigheid van de bij de aanvraag gevoegde informatie, bedoeld in
      [artikel 3, tweede lid, onderdelen a tot en met j en l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel3
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5'
    text: |-
      De aanvragende onderneming of instelling is verplicht de Bank of degene die in haar opdracht de inlichtingen
      inwint, zoveel mogelijk behulpzaam te zijn en desgevraagd inzage in en alsmede afschriften van alle boeken,
      bescheiden en andere informatie dragers te verschaffen als door de Bank noodzakelijk wordt geacht in het kader van
      de vergunningsprocedure.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Een onderneming of instelling waaraan een vergunning als bedoeld in [artikel 2][ref1], is verleend, is gehouden aan
      het gestelde in [artikel 4, eerste lid][ref2], alsmede aan voorschriften gebonden aan en beperkingen gesteld bij de
      vergunning te blijven voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Indien de beslissing van de Bank meer dan 60 dagen uitblijft na ontvangst van de aanvraag, bedoeld in
      [artikel 3, eerste lid][ref1], dan wel nadat de Bank gebruik heeft gemaakt van haar bevoegdheden onder
      [artikel 4, zesde lid][ref2], of [artikel 5][ref3], kan de onderneming of instelling bij de Bank tegen het
      uitblijven van de beslissing bij aangetekende brief een bezwaarschrift indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028547#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028547#Artikel5
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028547
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Indien de Bank binnen 30 dagen na ontvangst van het bezwaarschrift geen beslissing heeft genomen, wordt zij geacht
      een afwijzende beslissing te hebben genomen, waartegen de onderneming of instelling binnen 30 dagen beroep kan
      instellen overeenkomstig het bepaalde in hoofdstuk XI.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Een besluit tot verlening van de vergunning wordt zo spoedig mogelijk na de dagtekening van de vergunning
      gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      De Bank is bevoegd bij een ieder waarvan zij op grond van feiten en omstandigheden vermoedt dat zij een
      kredietinstelling of geldtransactiekantoor is dan wel het bedrijf van kredietinstelling of geldtransactiekantoor
      uitoefent, alle inlichtingen in te winnen of te doen inwinnen, die redelijkerwijs geacht kunnen worden nodig
      te zijn om zulks te beoordelen. De Bank verzoekt bij aangetekende brief om de gewenste inlichtingen. De door de
      Bank of door degene die in haar opdracht handelt, gevraagde inlichtingen, dienen door degene die de Bank heeft
      aangeschreven, schriftelijk binnen 30 dagen na ontvangst van de aangetekende brief waarbij de inlichtingen worden
      gevraagd, aan de Bank of diegene die in haar opdracht handelt, te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De Bank is bevoegd, indien daartoe naar het oordeel van de Bank dringende redenen bestaan, gelet op de effectieve
      behartiging van de belangen die deze wet beoogt te beschermen, zonder voorafgaand schriftelijk verzoek als bedoeld
      in het eerste lid, dan wel zonder schriftelijke aankondiging, bij de persoon, onderneming of instelling de nodige
      inlichtingen in te winnen of te doen inwinnen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      De in het eerste respectievelijk tweede lid bedoelde persoon, onderneming of instelling stelt de Bank of
      degene die in haar opdracht handelt, in de gelegenheid zich aan de hand van haar boeken, bescheiden en andere
      informatiedragers, te overtuigen van de juistheid en volledigheid van de door de persoon, onderneming of instelling
      verstrekte inlichtingen en verleent daarbij alle medewerking; hij verschaft de Bank inzage in alle boeken
      bescheiden en andere informatiedragers en geeft de Bank desgevraagd afschriften van dezen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      Indien blijkt dat een persoon, onderneming of instelling het bedrijf van kredietinstelling of geldtransactiekantoor
      uitoefent zonder vergunning van de Bank, is die persoon, onderneming of instelling op aanwijzing van de Bank
      gehouden, onverminderd het bepaalde in [artikel 50][ref1], de uitoefening van haar bedrijf onmiddellijk te staken
      en onder toezicht van de Bank de verrichte handeling of handelingen, voor zover de Bank zulks mogelijk acht, binnen
      een door de Bank te stellen termijn, ongedaan te maken. De Bank kan evenwel, indien daartoe door de betrokken
      onderneming of instelling wordt verzocht, alsnog vergunning verlenen om het bedrijf van kredietinstelling of
      geldtransactiekantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel50
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '50'
        hoofdstuk: XII
  - number: '8.5'
    text: |-
      Indien de in het vierde lid bedoelde onderneming of instelling een vennootschap opgericht naar het recht van
      de openbare lichamen is, is de Bank bevoegd, onverminderd het bepaalde in [artikel 41][ref1], aan de betrokken
      rechter in eerste aanleg ontbinding van de vennootschap te vorderen wanneer deze na de in het vierde lid bedoelde
      aanwijzing van de Bank door gaat het bedrijf van kredietinstelling of geldtransactiekantoor uit te oefenen. Op een
      ontbondenverklaring zijn de bepalingen in [titel 1, van Boek 2 van het Burgerlijk Wetboek BES][ref2] die betrekking
      hebben op de ontbinding van een rechtspersoon van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028744
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '41'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028744
  - number: '9.1'
    text: 'Een vergunning kan door de Bank worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: 9.1.a
    text: |-
      met betrekking tot de kredietinstelling een omstandigheid als bedoeld in
      [artikel 4, eerste lid, onderdelen a tot en met l][ref1], zich voordoet, dan wel, met betrekking tot een
      geldtransactiekantoor, een omstandigheid als bedoeld in artikel 4, eerste lid, onderdelen e, f, h, k en l, zich
      voordoet,


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 9.1.b
    text: |-
      de onderneming of instelling waaraan de vergunning is verleend, niet binnen een door de Bank vast te stellen
      termijn met haar bedrijf daadwerkelijk een aanvang heeft gemaakt,
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: 9.1.c
    text: de onderneming of instelling waaraan de vergunning is verleend, kennelijk haar bedrijf niet meer uitoefent,
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: 9.1.d
    text: |-
      de onderneming of instelling aan een waarschuwing of aanwijzing als bedoeld in [artikel 10][ref1], binnen een door
      de Bank te bepalen termijn geen gevolg heeft gegeven,


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel10
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: 9.1.e
    text: |-
      een of meer van de beperkingen gesteld bij onderscheidenlijk de voorschriften verbonden aan de vergunning worden
      overtreden,
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: 9.1.f
    text: |-
      de onderneming of instelling niet voldoet aan de voorschriften gegeven krachtens de artikelen 19 en [21][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel21
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '21'
        hoofdstuk: V
        paragraaf: '3'
  - number: 9.1.g
    text: één der overige bepalingen van deze wet wordt overtreden,
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: 9.1.h
    text: |-
      de kredietinstelling niet beschikt over een verklaring omtrent de getrouwheid dan wel die verklaring een andere
      inhoud heeft dan dat de jaarrekening van de instelling een getrouw beeld geeft van de grootte en de samenstelling
      van het vermogen van de kredietinstelling en van het resultaat over het desbetreffende boekjaar,
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: 9.1.i
    text: |-
      de onderneming of instelling aan welke een vergunning is verleend, opgehouden heeft kredietinstelling,
      onderscheidenlijk geldtransactiekantoor, te zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Een onderneming of instelling kan bij aangetekende brief aan de Bank verzoeken de aan haar verleende vergunning in
      te trekken. Binnen zestig dagen na ontvangst van een zodanig verzoek wordt daarop door de Bank beslist.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      Een besluit tot intrekking van een vergunning als bedoeld in het eerste lid, of de weigering tot intrekking van een
      vergunning als bedoeld in het tweede lid, is met redenen omkleed en wordt door de Bank bij deurwaardersexploit aan
      de betrokken onderneming of instelling betekend.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      Tegen een besluit tot intrekking of weigering tot intrekking als bedoeld in het derde lid, kan de betrokken
      onderneming of instelling, binnen dertig dagen na betekening van het deurwaardersexploit, waarmee het besluit tot
      intrekking of tot weigering werd medegedeeld, beroep instellen overeenkomstig het bepaalde in [hoofdstuk XI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028547
        hoofdstuk: XI
  - number: '9.5'
    text: |-
      Een besluit tot intrekking van een vergunning wordt onherroepelijk, zodra de in het vierde lid genoemde
      beroepstermijn is verstreken of de uitspraak van het Gerecht, bedoeld in [artikel 49, eerste lid][ref1], in
      kracht van gewijsde is gegaan. Het besluit tot intrekking van de vergunning wordt zo spoedig mogelijk nadat het
      onherroepelijk is geworden, gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel49
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '49'
        hoofdstuk: XI
  - number: '9.6'
    text: |-
      De onderneming of instelling waarvan de vergunning is ingetrokken dan wel die beroep heeft aangetekend tegen het
      besluit tot intrekking, bedoeld onder het vierde lid, is gehouden met inachtneming van de bij of krachtens deze wet
      vastgestelde bepalingen haar werkzaamheden als onderneming of instelling af te wikkelen conform de door de Bank te
      stellen voorwaarden volgens een door de Bank vast te stellen procedure en binnen een door de Bank vast te stellen
      termijn. De Bank kan daarbij de uitoefening van de bevoegdheid van een kredietinstelling om over haar waarden te
      beschikken, beperken of haar verbieden om anders dan met schriftelijke machtiging van de Bank over deze waarden te
      beschikken. De kredietinstelling die beroep heeft aangetekend tegen de weigering van de Bank haar vergunning in te
      trekken, dient, hangende de behandeling van het beroep haar bedrijf voort te zetten met inachtneming van de bij of
      krachtens deze wet vastgestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      De Bank kan onverminderd het bepaalde in [artikel 9, eerste lid][ref1], aan een onderneming of instelling,
      waaraan een vergunning als bedoeld in [artikel 2, eerste lid][ref2], is verleend een schriftelijke waarschuwing of
      aanwijzing geven, indien;


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028547#Artikel2
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028547
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 10.1.a
    text: |-
      de onderneming of instelling naderhand niet meer voldoet aan het bepaalde in [artikel 4, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 10.1.b
    text: |-
      de onderneming of instelling zich niet houdt aan de ingevolge [artikel 2, tweede lid][ref1], aan de vergunning
      gestelde beperkingen of verbonden voorschriften, of


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel2
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 10.1.c
    text: |-
      de onderneming of instelling niet voldoet aan de verplichtingen opgelegd bij of krachtens de
      [artikelen 12 tot en met 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel12
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '12'
        hoofdstuk: IV
  - number: '10.2'
    text: |-
      Een waarschuwing of aanwijzing als bedoeld in het eerste lid, is met redenen omkleed en wordt door de Bank per
      aangetekende brief aan de betrokken onderneming of instelling medegedeeld en is van kracht zodra zij door de
      betrokken onderneming of instelling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      De betrokken onderneming of instelling is gehouden binnen een periode van 30 dagen na ontvangst van de aangetekende
      brief, bedoeld in het tweede lid, aan de waarschuwing of respectievelijk aanwijzing gevolg te geven op een voor de
      Bank aanvaardbare wijze.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
  - number: '10.4'
    text: De Bank kan de in het derde lid genoemde termijn van 30 dagen verlengen met ten hoogste 60 dagen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
  - number: '10.5'
    text: |-
      Tegen een waarschuwing of aanwijzing kan de betrokken onderneming of instelling binnen 30 dagen na ontvangst beroep
      instellen overeenkomstig het bepaalde in [hoofdstuk XI][ref1]. Dit beroep heeft geen schorsende werking.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028547
        hoofdstuk: XI
  - number: '11.1'
    text: |-
      Er is een register van kredietinstellingen, waarvan de inrichting in twee afdelingen als volgt is vastgesteld: -
      Afdeling I - Kredietinstellingen
        - Afdeling II - Internationale kredietinstellingen. De Bank kan de afdelingen onderverdelen in onderafdelingen voor
      door de Bank te onderscheiden categorieën kredietinstellingen en internationale kredietinstellingen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11
  - number: '11.2'
    text: Het register wordt gehouden door de Bank.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Een onderneming of instelling waaraan krachtens [artikel 4, eerste lid][ref1], een vergunning voor het uitoefenen
      van het bedrijf van kredietinstelling is verleend, wordt per gelijke datum als waarop de vergunning is verleend,
      door de Bank ingeschreven in het register. Inschrijving in meer dan één afdeling onderscheidenlijk onderafdeling
      vindt niet plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11.4'
    text: De inschrijving van een kredietinstelling waarvan de vergunning is ingetrokken, wordt door de Bank doorgehaald.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11
  - number: '11.5'
    text: Een afschrift van het register ligt voor een ieder kosteloos ter inzage op de kantoren van de Bank.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11
  - number: '11.6'
    text: |-
      In de maand januari van elk jaar publiceert de Bank in de Staatscourant een afschrift van het register naar de
      stand van 31 december van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11
  - number: 11a.1
    text: Er is een register van geldtransactiekantoren. Het register wordt gehouden door de Bank.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11a
  - number: 11a.2
    text: |-
      Een onderneming of instelling waaraan vergunning voor het uitoefenen van het bedrijf van geldtransactiekantoor is
      verleend, wordt per gelijke datum als waarop die vergunning is verleend, door de Bank in het register ingeschreven.
      [Artikel 11, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel11
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '11'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      Iedere kredietinstelling is verplicht de Bank desgevraagd alle inlichtingen te verschaffen, die zij meent nodig te
      hebben voor de juiste uitoefening van het in [artikel 18][ref1] bedoelde toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel18
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '18'
        hoofdstuk: V
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Iedere persoon als bedoeld in [artikel 3 tweede lid sub b][ref1] van een kredietinstelling, van wie in redelijkheid
      kan worden aangenomen, dat hij over inlichtingen als bedoeld in het eerste lid, beschikt, is ook na beëindiging van
      zijn dienstverband bij die kredietinstelling, verplicht deze inlichtingen na daartoe per aangetekende brief door de
      Bank te zijn gevraagd, aan de Bank te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel3
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.3'
    text: |-
      De inlichtingen en opgaven bij of krachtens deze wet aan de Bank te verschaffen, moeten tijdig, volledig, naar
      waarheid en op niet misleidende wijze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Iedere kredietinstelling is verplicht de op haar boekhouding betrekking hebbende boeken, bescheiden en andere
      informatiedragers in de openbare lichamen aan te houden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel13
  - number: '13.2'
    text: |-
      Een kredietinstelling die een bijkantoor is van een in het buitenland gevestigde kredietinstelling, is verplicht
      voor haar bedrijf in de openbare lichamen een afzonderlijke boekhouding te voeren en de daarop betrekking hebbende
      boeken, bescheiden en andere informatiedragers hier te lande aan te houden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel13
  - number: '13.3'
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op geldtransactiekantoren.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Iedere kredietinstelling is verplicht bij de Bank periodiek binnen de daartoe vastgestelde termijnen staten nopens
      haar bedrijf in te dienen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      De vorm waarin de in het eerste lid bedoelde staten worden opgemaakt, de achtereenvolgende tijdstippen waarop zij
      betrekking hebben, en de termijnen waarbinnen zij worden ingediend, worden bij ministeriële regeling bepaald. De
      staten kunnen voor elke afdeling of onderafdeling van het register verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel14
  - number: '14.3'
    text: 'Indien de Bank zulks in het belang van een doelmatig toezicht nodig acht, kan zij een kredietinstelling opdragen:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel14
  - number: 14.3.a
    text: |-
      staten als bedoeld in het eerste lid, bij haar in te dienen die betrekking hebben op tijdstippen met kortere
      tussenpoos of op kortere termijnen dan ingevolge het tweede lid is bepaald;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel14
  - number: 14.3.b
    text: |-
      een verklaring van een externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] over te leggen nopens de in het eerste lid bedoelde
      staten.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '14.4'
    text: |-
      De Bank kan de kredietinstellingen, ingeschreven in een bepaalde afdeling onderscheidenlijk onderafdeling van het
      register, geheel of gedeeltelijk ontheffing verlenen van het bepaalde in het eerste en tweede lid. De Bank kan aan
      de ontheffing voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Iedere kredietinstelling is verplicht jaarlijks binnen een bij ministeriële regeling vast te stellen termijn een
      jaarrekening over het afgelopen boekjaar, ten minste bevattend een balans en een winst- en verliesrekening met
      bijbehorende toelichting, bij de Bank in te dienen. Bij ministeriële regeling kunnen regels worden gesteld met
      betrekking tot de vorm van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Bij de in het eerste lid bedoelde jaarrekening dient een verklaring van een externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] te zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '15.3'
    text: |-
      Iedere kredietinstelling is verplicht bij de opdracht tot het controleren van de jaarrekening
      respectievelijk van de periodiek bij de Bank in te dienen staten de externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] tevens te machtigen om:


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 15.3.a
    text: |-
      na overleg met de opdrachtgevende kredietinstelling onverwijld aan de Bank een afschrift te zenden
      van het accountantsrapport, van de directiebrieven en van de correspondentie die rechtstreeks
      betrekking heeft op de accountantsverklaring bij de jaarrekening respectievelijk van de overeenkomstig
      [artikel 14, eerste dan wel derde lid, onderdeel a][ref1], periodiek bij de Bank in te dienen staten, indien en
      voor zover de Bank bij deze staten een accountantsverklaring nodig acht,


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel14
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '14'
        hoofdstuk: IV
  - number: 15.3.b
    text: |-
      na overleg met de opdrachtgevende kredietinstelling onverwijld de Bank schriftelijk op de hoogte te stellen
      van omstandigheden die de afgifte van een goedkeurende verklaring bij de jaarrekening respectievelijk
      bij de Bank in te dienen staten in gevaar zouden kunnen brengen; de externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] doet aan de opdrachtgevende kredietinstelling een
      afschrift toekomen van alle door hem aan de Bank verzonden stukken,


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 15.3.c
    text: indien de Bank zulks noodzakelijk acht op de onder a en b genoemde documenten een mondelinge toelichting te geven.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
  - number: '15.4'
    text: |-
      Indien de externe accountant ingevolge het bepaalde onder het derde lid, onderdeel c, mondeling nadere toelichting
      geeft op de in dat lid, onderdelen a of b, bedoelde stukken, stelt de Bank de opdrachtgevende kredietinstelling in
      de gelegenheid om bij dit onderhoud met de externe accountant aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
  - number: '15.5'
    text: |-
      De Bank kan de kredietinstellingen van bepaalde afdelingen onderscheidenlijk onderafdelingen van het register
      geheel of gedeeltelijk ontheffing verlenen van het bepaalde in het eerste lid. De Bank kan aan de ontheffing
      voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      De Bank kan een bijzonder onderzoek instellen of doen instellen naar feiten of ontwikkelingen aangaande het
      administratieve beheer of de financiële positie van een kredietinstelling, waarvan kennisneming door de Bank nodig
      wordt geacht voor de juiste uitoefening van het in [artikel 18][ref1] bedoelde toezicht. De kredietinstelling of
      enige derde, waarbij een zodanig onderzoek, door of in opdracht van de Bank wordt ingesteld, is verplicht daarbij
      behulpzaam te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel18
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '18'
        hoofdstuk: V
        paragraaf: '1'
  - number: '16.2'
    text: |-
      Een ieder is verplicht de Bank of degenen die in haar opdracht handelen, op haar verzoek in de gelegenheid te
      stellen zich, aan de hand van de boeken, bescheiden en andere informatiedragers te overtuigen van de volledigheid
      en juistheid van bij of krachtens deze wet aan de Bank te verschaffen inlichtingen en opgaven. Een ieder bij wie
      de Bank zich wil overtuigen van de volledigheid en juistheid van bij of krachtens deze wet aan haar verschafte
      inlichtingen, is verplicht bij een zodanig, door of in opdracht van de Bank in te stellen onderzoek, behulpzaam
      te zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel16
  - number: '16.3'
    text: |-
      De Bank kan zich bij een onderzoek als bedoeld in het eerste of tweede lid, doen bijstaan dan wel een
      zodanig onderzoek geheel doen uitvoeren door een door de Bank aan te wijzen externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1]. De Bank kan de kosten die hiermee verband houden
      geheel of gedeeltelijk doorberekenen aan de betrokken kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '16.4'
    text: |-
      Indien een onderzoek als bedoeld in het tweede of derde lid, dan wel bepaalde werkzaamheden
      in het kader van een zodanig onderzoek door de Bank aan een externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] worden opgedragen, rapporteert deze zijn bevindingen
      rechtstreeks en schriftelijk aan de Bank en zendt na verkregen goedkeuring van de Bank een afschrift daarvan aan de
      betrokken kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '16.5'
    text: |-
      Een kredietinstelling is op verzoek van de Bank verplicht een erkende deskundige aan te wijzen die rechtstreeks aan
      de Bank rapporteert over de interne organisatie van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel16
  - number: '17'
    text: |-
      De Bank is bevoegd bij iedere onderneming of instelling waarin een kredietinstelling een deelneming heeft danwel
      bij iedere onderneming of instelling die een deelneming heeft in een kredietinstelling, alle inlichtingen in te
      winnen of te doen inwinnen die zij nodig acht ter uitoefening van het toezicht op geconsolideerde basis.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De Bank houdt toezicht op de kredietinstellingen in het belang van de liquiditeit en solvabiliteit van de
      kredietinstellingen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel18
  - number: '21.1'
    text: |-
      Bij ministeriële regeling kunnen, al dan niet tevens op geconsolideerde basis, aan kredietinstellingen
      voorschriften worden gegeven voor hun bedrijfsvoering in het belang van de solvabiliteit en liquiditeit van deze
      instellingen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: '21.2'
    text: 'De voorschriften kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: 21.2.a
    text: de minimale omvang van het eigen vermogen in verhouding tot de kredietrisico's of marktrisico's;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: 21.2.b
    text: de minimale omvang van de liquide middelen in verhouding tot de opvragingsrisico's;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: 21.2.c
    text: |-
      het verbod, de beperking of het aan voorwaarden binden van risicovolle aktiviteiten of risicovolle verplichtingen
      binnen of buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: 21.2.d
    text: de reikwijdte van de consolidatie;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: 21.2.e
    text: |-
      de bedrijfsvoering met betrekking tot de administratieve organisatie met inbegrip van de financiële administratie
      en de interne controle.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: '21.3'
    text: |-
      De voorschriften, bedoeld in het tweede lid, aanhef en onderdelen a, b en c, kunnen voor de onderscheiden
      categorieën van kredietinstellingen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: '21.4'
    text: |-
      De Bank kan een kredietinstelling geheel of gedeeltelijk ontheffing van de in het tweede lid bedoelde voorschriften
      verlenen, mits de solvabiliteit of liquiditeit alsmede de administratieve organisatie van de kredietinstelling naar
      het oordeel van de Bank anderszins voldoende zijn gewaarborgd. De Bank kan aan de ontheffing beperkingen stellen of
      voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: '21.5'
    text: In de voorschriften wordt bepaald, wat wordt verstaan onder de begrippen waaromtrent voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      Indien de Bank constateert dat een kredietinstelling de krachtens [artikel 21][ref1] gegeven richtlijnen
      niet naleeft, of andere tekenen ontwaart van een ontwikkeling, die naar haar oordeel voor de liquiditeit of
      solvabiliteit van de instelling gevaarlijk is of gevaarlijk zou kunnen worden, verzoekt de Bank per aangetekende
      brief de betrokken kredietinstelling de nodige maatregelen te nemen dan wel om ten aanzien van met name gegeven
      punten een bepaalde gedragslijn te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel21
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '21'
        hoofdstuk: V
        paragraaf: '3'
  - number: '22.2'
    text: |-
      Indien naar het oordeel van de Bank niet, niet binnen de door de Bank vastgestelde termijn of onvoldoende aan
      haar verzoek als bedoeld in het eerste lid, gevolg is gegeven, kan de Bank de kredietinstelling per aangetekende
      brief aanzeggen, dat vanaf een door de Bank te bepalen tijdstip alle of bepaalde organen van de kredietinstelling
      hun bevoegdheden slechts mogen uitoefenen na goedkeuring door een of meer door de Bank aangewezen personen en met
      inachtneming van de opdrachten van deze personen. De aanzegging wordt terstond van kracht en daaraan dient gevolg
      te worden gegeven niettegenstaande enige daartegen gerichte voorziening.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: '22.3'
    text: |-
      Indien de Bank bij een kredietinstelling tekenen ontwaart van een ontwikkeling, die naar haar oordeel voor de
      liquiditeit of solvabiliteit van de betreffende instelling gevaarlijk is en onverwijld ingrijpen noodzakelijk
      maakt, kan zij in afwijking van het bepaalde in het eerste lid onmiddellijk aan de kredietinstelling een met
      redenen omklede aanzegging doen zoals omschreven in het tweede lid; deze aanzegging wordt terstond van kracht
      nadat de Bank de kredietinstelling in de gelegenheid heeft gesteld binnen een door de Bank te stellen termijn, haar
      mening over de onmiddellijke uitvoering te geven.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: '22.4'
    text: 'Met betrekking tot een aanzegging als bedoeld in het tweede en het derde lid, is het volgende van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: 22.4.a
    text: |-
      de organen van de kredietinstelling zijn verplicht de door de Bank aangewezen personen alle medewerking te
      verlenen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: 22.4.b
    text: |-
      de Bank kan de betrokken organen van de kredietinstelling toestaan bepaalde handelingen zonder goedkeuring als
      bedoeld in het tweede lid, te verrichten;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: 22.4.c
    text: |-
      de door de Bank aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren na verzending
      van de aanzegging, bedoeld in het tweede lid dan wel derde lid. De Bank is bevoegd deze termijn te verlengen
      telkens voor ten hoogste een jaar. Van zodanige verlenging doet de Bank aan de kredietinstelling mededeling
      per aangetekende brief. De verlenging wordt terstond van kracht en daaraan behoort gevolg te worden gegeven
      niettegenstaande enige daartegen gerichte voorziening;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: 22.4.d
    text: de Bank kan te allen tijde de door haar aangewezen personen door anderen vervangen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: 22.4.e
    text: |-
      voor schade ten gevolge van handelingen, verricht in strijd met een aanzegging als bedoeld in het tweede en
      het derde lid, zijn degenen die deze handelingen als orgaan van de kredietinstelling verrichten, persoonlijk
      aansprakelijk tegenover de kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: 22.4.f
    text: |-
      de Bank deelt de kredietinstelling per aangetekende brief mede, dat de betrokken organen van de kredietinstelling
      hun bevoegdheid wederom onbeperkt kunnen uitoefenen, zodra zij van oordeel is, dat de solvabiliteit en de
      liquiditeit van de kredietinstelling niet langer gevaar lopen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
  - number: '22.5'
    text: |-
      De kredietinstelling kan binnen dertig dagen na de dagtekening van de aanzegging als bedoeld in het tweede en derde
      lid, of van een besluit tot verlenging van de termijn als bedoeld in het vierde lid, onderdeel c, beroep instellen
      tegen de aanzegging of het besluit overeenkomstig het bepaalde in [hoofdstuk XI][ref1]. Het beroep heeft geen
      schorsende werking.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028547
        hoofdstuk: XI
  - number: '23.1'
    text: 'Het is een kredietinstelling verboden, anders dan na verkregen toestemming van de Bank:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.a
    text: haar eigen vermogen door terugbetaling van kapitaal of uitkering van reserves te verminderen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.b
    text: een deelneming in een andere onderneming of instelling te houden, te verwerven dan wel te vergroten;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.c
    text: de activa en passiva van een andere onderneming of instelling geheel of voor een belangrijk deel over te nemen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.d
    text: een fusie aan te gaan met een andere onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.e
    text: over te gaan tot financiële of vennootschappelijke reorganisatie;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.f
    text: filialen, bijkantoren en kassen onder welke naam dan ook te vestigen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.1.g
    text: haar statuten te wijzigen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: '23.2'
    text: 'Het is een ieder verboden zonder voorafgaande toestemming van de Bank:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.2.a
    text: personen te benoemen die het beleid van een kredietinstelling of geldtransactiekantoor bepalen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: 23.2.b
    text: |-
      ingrijpende wijzigingen aan te brengen in aspecten van de bedrijfsvoering met betrekking tot welke ingevolge
      [artikel 4, eerste lid, onderdeel l][ref1], eisen zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 23.2.c
    text: aandelen direct of indirect van een kredietinstelling over te dragen of te vervreemden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: '23.3'
    text: De Bank kan aan toestemming als bedoeld in het eerste of tweede lid, voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
  - number: '23.4'
    text: |-
      Indien blijkt dat een kredietinstelling een handeling als omschreven in het eerste lid, heeft verricht zonder
      toestemming van de Bank, is die instelling onverminderd het bepaalde in de [artikelen 47][ref1] en [50][ref2]
      gehouden op aanwijzing van de Bank de handeling voor zover mogelijk ongedaan te maken, tenzij de Bank, daartoe
      verzocht door de betrokken kredietinstelling, alsnog toestemming verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0028547#Artikel50
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '47'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0028547
        artikel: '50'
        hoofdstuk: XII
  - number: '23.5'
    text: |-
      Indien blijkt dat een handeling als omschreven in het tweede lid, is verricht zonder toestemming van de Bank, is
      diegene die de handeling heeft verricht, onverminderd het bepaalde in [artikel 50][ref1] de handeling voor zover
      mogelijk ongedaan te maken, tenzij de Bank daartoe verzocht alsnog toestemming verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel50
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '50'
        hoofdstuk: XII
  - number: '24'
    text: |-
      Een kredietinstelling is verplicht de Bank mededeling te doen van iedere voorgenomen wisseling van haar externe
      accountant. De aanstelling van de externe accountant vindt plaats nadat de Bank heeft medegedeeld daartegen geen
      bezwaar te hebben.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel24
  - number: '25'
    text: |-
      De Bank is bevoegd, in het kader van het bedrijfseconomisch toezicht onderzoeken van buitenlandse instanties
      die met het toezicht op kredietinstellingen zijn belast, toe te laten bij in de openbare lichamen gevestigde
      kredietinstellingen die onder geconsolideerd toezicht staan van genoemde toezichthouders. De Bank zal in
      voorkomend geval tevoren voorwaarden stellen aan onderscheidenlijk aanwijzingen geven voor de uitvoering
      van deze toezichtswerkzaamheden. De functionarissen van de buitenlandse instanties die met het toezicht op
      kredietinstellingen zijn belast, zijn gehouden de aanwijzigingen van de Bank stipt te volgen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel25
  - number: '26'
    text: |-
      Een kredietinstelling is verplicht onverwijld een besluit tot algehele of gedeeltelijke liquidatie dan wel tot
      ontbinding of verkoop, direct of indirect, van haar bedrijf in de openbare lichamen schriftelijk aan de Bank mede
      te delen en een zodanig besluit onder toezicht en volgens de aanwijzingen van de Bank uit te voeren.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel26
  - number: 26a.1
    text: |-
      Een kredietinstelling draagt er zorg voor dat de door haar in een openbaar lichaam aangeboden betaal- of
      spaarrekeningen met de daaraan verbonden betaal- of spaarfaciliteiten geschikt zijn voor deelname aan het
      betalingsverkeer in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel26a
  - number: 26a.2
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet voor rekeningen die zijn bestemd voor deelname aan het
      betalingsverkeer met het buitenland.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel26a
  - number: '27.1'
    text: |-
      Een vordering of verzoek tot faillietverklaring van een kredietinstelling – eigen aangifte daaronder begrepen –
      wordt niet in behandeling genomen zolang de kredietinstelling in het bezit is van een vergunning als bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel2
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '27.2'
    text: |-
      Indien de vergunning van een kredietinstelling is ingetrokken, wordt op het verzoek of de vordering tot
      faillietverklaring niet beslist dan nadat de rechter de Bank in de gelegenheid heeft gesteld haar gevoelen
      daaromtrent kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel27
  - number: '27.3'
    text: De wettelijke bepalingen inzake surséance van betaling zijn op kredietinstellingen niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel27
  - number: '28.1'
    text: |-
      Wanneer het belang der gezamenlijke schuldeisers bij de afwikkeling van het bedrijf van een kredietinstelling,
      wiens vergunning is ingetrokken, een bijzondere voorziening vordert, kan het gerecht op verzoek van de Bank de
      noodregeling uitspreken.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '28.2'
    text: |-
      Bij het uitspreken van de noodregeling machtigt het gerecht de Bank zowel tot overdracht van de verbintenissen van
      de kredietinstelling welke zij in de uitoefening van haar bedrijf als kredietinstelling tot het ter beschikking
      verkrijgen van gelden heeft aangegaan of van een deel daarvan dan wel tot gehele of gedeeltelijke liquidatie van
      het bedrijf van de kredietinstelling. Zolang de Bank nog niet is gebleken dat de kredietinstelling een negatief
      vermogen heeft strekt de machtiging mede tot vereffening van het vermogen van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '28.3'
    text: |-
      Het gerecht behandelt het verzoek van de Bank tot het uitspreken van de noodregeling met de meeste spoed op een
      openbare terechtzitting op de voet van de rechtspleging in burgerlijke zaken, voor zover daarvan bij deze wet niet
      is afgeweken.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '28.4'
    text: |-
      Het gerecht is bevoegd inzage te nemen of te doen nemen van de boeken, bescheiden en andere informatiedragers van
      de kredietinstelling. [Artikel 16, tweede lid][ref1], is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel16
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '16'
        hoofdstuk: IV
  - number: '28.5'
    text: |-
      Het gerecht geeft geen beschikking dan na de kredietinstelling en de Bank in de gelegenheid te hebben gesteld te
      worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '28.6'
    text: |-
      Een door de kredietinstelling tegen de intrekking van een vergunning ingesteld beroep schorst de behandeling van
      het verzoek van de Bank tot het uitspreken van de noodregeling niet.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '28.7'
    text: |-
      De beschikking van het gerecht wordt met redenen omkleed en wordt, zo het verzoek van de Bank wordt toegewezen,
      op een openbare terechtzitting uitgesproken. De griffier maakt de zakelijke inhoud van de beschikking bekend in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '28.8'
    text: Tegen de beschikking staat generlei voorziening open behoudens cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Wanneer een verzoek van de Bank tot het uitspreken van de noodregeling aanhangig is tegelijk met een verzoek of
      vordering tot faillietverklaring, wordt de behandeling van het verzoek of de vordering tot faillietverklaring
      geschorst totdat op het verzoek van de Bank is beschikt. Indien het gerecht de noodregeling uitspreekt, vervalt het
      verzoek of de vordering tot faillietverklaring van rechtswege.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      Het uitspreken van de noodregeling heeft mede tot gevolg dat de kredietinstelling slechts in staat van
      faillissement kan worden verklaard overeenkomstig [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel37
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '37'
        hoofdstuk: VI
  - number: '29.3'
    text: |-
      Het gerecht kan op verzoek van de Bank de noodregeling intrekken. De griffier maakt de intrekking bekend in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel29
  - number: '30.1'
    text: |-
      Indien het gerecht de noodregeling uitspreekt, oefent de Bank bij uitsluiting alle bevoegdheden van de bestuurders
      en de commissarissen van de kredietinstelling uit.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.2'
    text: De Bank waakt voor de belangen van de gezamenlijke schuldeisers.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.3'
    text: |-
      De bestuurders en de commissarissen van de kredietinstelling zijn verplicht bij de uitoefening door de Bank van de
      in het eerste lid bedoelde bevoegdheden alle door de Bank gevraagde medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.4'
    text: De Bank is bevoegd de bestuurders van de kredietinstelling te machtigen bepaalde handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.5'
    text: |-
      De Bank is bevoegd bestuurders en commissarissen namens de kredietinstelling te ontslaan. Bij dit ontslag worden
      de overeengekomen of wettelijke termijnen in acht genomen, met dien verstande dat een termijn van zes weken in elk
      geval voldoende is.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.6'
    text: |-
      Indien de kredietinstelling statutair gevestigd is in een openbaar lichaam behoeft een besluit van zijn
      aandeelhouders of leden om van kracht te zijn de goedkeuring van de Bank.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.7'
    text: |-
      Wordt een besluit van aandeelhouders of leden, dat ingevolge de statuten van de in het zesde lid bedoelde
      kredietinstelling voor een handeling is vereist, niet genomen of verkrijgt dit besluit niet de volgens de statuten
      vereiste goedkeuring, dan kan de Bank dit besluit nemen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.8'
    text: |-
      De Bank kan personen machtigen alle of een deel van de bevoegdheden uit te oefenen, die zij ingevolge het
      eerste lid heeft. De Bank kan het gerecht verzoeken een beloning voor de gemachtigden vast te stellen. De Bank
      maakt de naam en woonplaats van een door haar gemachtigde alsook de intrekking van een machtiging bekend in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '30.9'
    text: |-
      Ingevolge de haar verleende machtiging is de Bank, ongeacht hetgeen daaromtrent bij de statuten van de
      kredietinstelling is bepaald, bevoegd alle nog niet gedane stortingen op de aandelen in het geplaatste kapitaal van
      de krediet instelling uit te schrijven en te innen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      Het uitspreken van de noodregeling heeft tot gevolg dat de kredietinstelling niet kan worden genoodzaakt tot
      nakoming van zijn schulden die vóór de uitspraak zijn ontstaan, zomin als tot nakoming van zijn schulden, na
      de uitspraak ontstaan. Aangevangen executiën worden geschorst en gelegde beslagen vervallen. [Artikel 32 van de
      Faillissementswet BES](onbekend) is van overeenkomstige toepassing op de in de eerste volzin bedoelde schulden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan de Bank uitkeringen doen op de vorderingen waarop het eerste
      lid van toepassing is, voor zover dit gelet op de liquiditeitspositie van de kredietinstelling verantwoord is.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: '31.3'
    text: 'Het in het eerste lid bepaalde geldt ook niet voor:'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: 31.3.a
    text: vorderingen die door pand of hypotheek op goederen van de verzekeraar zijn gedekt;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: 31.3.b
    text: termijnen van huurkoop.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: '31.4'
    text: |-
      Voor zover vorderingen die door pand of hypotheek zijn gedekt, niet op de verbonden zaak kunnen worden verhaald,
      werkt de uitspraak wel ten aanzien van deze vorderingen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: '31.5'
    text: |-
      Het uitspreken van de noodregeling werkt niet ten voordele van de medeschuldenaren en borgen van de
      kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: '31.6'
    text: '[Artikel 231a van de Faillissementswet BES](onbekend) is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel31
  - number: '32.1'
    text: |-
      Met betrekking tot schuldvergelijking en schuldoverneming vinden de [artikelen 224](onbekend) en [225 van
      de Faillissementswet BES](onbekend) overeenkomstige toepassing, met dien verstande dat de schuldenaar van de
      kredietinstelling die zijn schuld wil vergelijken met een schuldvordering aan order of toonder, gehouden is te
      bewijzen dat hij reeds op het ogenblik der uitspraak waarbij het verzoek tot machtiging werd toegewezen, te goeder
      trouw eigenaar was van het order- of toonderpapier.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel32
  - number: '32.2'
    text: |-
      Met betrekking tot wederkerige overeenkomsten in het algemeen en tot termijnzaken, overeenkomsten van huurkoop,
      huurovereenkomsten en arbeidsovereenkomsten in het bijzonder, waarbij de kredietinstelling ten aanzien waarvan de
      machtiging is verleend, partij is, vinden de [artikelen 226](onbekend), [226a](onbekend), [227](onbekend), [227a]
      (onbekend), [228](onbekend) en [229 van de Faillissementswet BES](onbekend) overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel32
  - number: '32.3'
    text: |-
      Met betrekking tot de voldoening van een schuld aan de kredietinstelling nadat de noodregeling is uitgesproken,
      vindt [artikel 230 van de Faillissementswet BES](onbekend) overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel32
  - number: '33.1'
    text: |-
      Het gerecht kan tegelijk met de in [artikel 28, tweede lid][ref1], bedoelde machtiging of daarna de Bank op haar
      verzoek een bijzondere machtiging verlenen die strekt tot een of meer van de volgende handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel28
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '28'
        hoofdstuk: VI
  - number: 33.1.a
    text: |-
      wijziging, bij de overdracht van rechten en verplichtingen uit of krachtens overeenkomsten tot het ter beschikking
      verkrijgen van gelden, van die overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel33
  - number: 33.1.b
    text: verkorting van de duur van overeenkomsten tot het ter beschikking verkrijgen van gelden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Ten aanzien van de bijzondere machtiging is
      [artikel 28, derde tot en met zesde lid, zevende lid, eerste volzin, en achtste lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel28
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '28'
        hoofdstuk: VI
  - number: '33.3'
    text: |-
      Zodra overdracht van rechten en verplichtingen krachtens de in [artikel 28, tweede lid][ref1], bedoelde machtiging
      heeft plaatsgevonden, maakt de Bank deze overdracht en, zo handelingen door haar zijn verricht krachtens de in
      het eerste lid bedoelde bijzondere machtiging, die handelingen bekend in de Staatscourant en in ten minste twee
      door het gerecht aan te wijzen dagbladen. De Bank kan, indien zij dit in het belang van de crediteuren van de
      kredietinstelling nodig acht, de bedoelde overdracht en handelingen tevens op andere wijze bekendmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel28
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '28'
        hoofdstuk: VI
  - number: '33.4'
    text: |-
      De overdracht alsmede de wijziging, bedoeld in het eerste lid, onderdeel a, worden ten aanzien van alle andere
      belanghebbenden van de betrokken kredietinstelling van kracht met ingang van de dag, volgende op die waarop de
      bekendmaking in de Staatscourant, is geschied.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel33
  - number: '34'
    text: |-
      Een overdracht van rechten en verplichtingen ingevolge dit hoofdstuk mag geen nadeel toebrengen aan de rechten van
      de overblijvende schuldeisers.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      Het gerecht stelt het bedrag vast van de kosten van de noodregeling. Deze kosten komen ten laste van de
      kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel35
  - number: '35.2'
    text: |-
      De kosten van de noodregeling omvatten de door of namens de Bank ter zake gedane uitgaven en de vergoeding van de
      door of namens haar ter zake verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel35
  - number: '36'
    text: |-
      Voor de toepassing van de [artikelen 200][ref1], [355][ref2], [356][ref3] en
      [360 van het Wetboek van Strafrecht BES][ref4] wordt met faillissement gelijkgesteld de rechtstoestand waarin een
      kredietinstelling verkeert zolang te zijnen aanzien de noodregeling van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel200
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel355
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel356
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel360
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '200'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '355'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '356'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '360'
  - number: '37.1'
    text: |-
      De Bank dient een verzoek tot faillietverklaring van de kredietinstelling in, indien haar blijkt dat de
      kredietinstelling een negatief eigen vermogen heeft en hetzij het met de noodregeling te bereiken doel is of niet
      meer kan worden verwezenlijkt, hetzij – indien niet tevoren de noodregeling werd uitgesproken – geen redelijk
      vooruitzicht meer bestaat dat het met de noodregeling te bereiken doel alsnog kan worden verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
  - number: '37.2'
    text: |-
      De faillietverklaring wordt uitgesproken ongeacht of de kredietinstelling verkeert in een toestand van te hebben
      opgehouden te betalen. Het bepaalde in de [eerste titel van de Faillissementswet BES][ref1] is overigens van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028917
  - number: '37.3'
    text: |-
      De noodregeling houdt van rechtswege op van kracht te zijn in geval de kredietinstelling in staat van faillissement
      wordt verklaard. Alsdan, zomede indien de faillietverklaring wordt uitgesproken binnen een maand na het intrekken
      van de noodregeling gelden de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
  - number: 37.3.a
    text: |-
      het tijdstip waarop de termijnen, in de [artikelen 39][ref1] en [41 van de Faillissementswet BES][ref2] vermeld,
      aanvangen, wordt berekend vanaf het tijdstip waarop de beschikking, houdende het uitspreken van de noodregeling,
      uitvoerbaar is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel41
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '41'
  - number: 37.3.b
    text: |-
      een beroep op schuldvergelijking kan in afwijking van [artikel 49 van de Faillissementswet BES][ref1] slechts
      worden gedaan indien de schuldvordering en de schuldplichtigheid beide zijn ontstaan vóór het tijdstip waarop
      de beschikking, houdende het uitspreken van de noodregeling uitvoerbaar is geworden dan wel voortvloeien uit een
      handeling vóór dat tijdstip met de gefailleerde verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel49
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '49'
  - number: 37.3.c
    text: |-
      handelingen, ingevolge [artikel 30][ref1] door of namens de Bank verricht gedurende de tijd dat de noodregeling van
      kracht was, worden beschouwd als handelingen van de curator, terwijl boedelschulden, gedurende die tijd ontstaan,
      ook in het faillissement als boedelschulden zullen gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel30
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '30'
        hoofdstuk: VI
  - number: 37.3.d
    text: |-
      de boedel is niet aansprakelijk voor verbintenissen van de kredietinstelling die in strijd met
      [artikel 30, eerste en vierde lid][ref1], zijn aangegaan gedurende de tijd dat de noodregeling van kracht was, dan
      voor zover deze daardoor is gebaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel30
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '30'
        hoofdstuk: VI
  - number: '38'
    text: |-
      De Bank brengt na beëindiging van en desgevraagd tijdens de noodregeling daaromtrent zo spoedig mogelijk verslag
      uit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden vastgesteld omtrent een garantie voor
      schuldvorderingen van rekeninghouders tot een bepaald maximumbedrag op een kredietinstelling waaraan krachtens
      [artikel 4][ref1] vergunning is verleend, tegen het risico dat zodanige kredietinstelling haar verplichtingen met
      betrekking tot die schuldvorderingen niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '39.2'
    text: |-
      De aard van de te garanderen schuldvorderingen, de soorten rekeninghouders alsmede het maximum te garanderen bedrag
      worden bij algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel39
  - number: '40.1'
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke ondernemingen
      of instellingen zijn verstrekt of zijn verkregen, zijn geheim, niettegenstaande enige andere wettelijke regeling
      hieromtrent.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel40
  - number: '40.2'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie als
      bedoeld in [artikel 41][ref1], ontvangen, of van gegevens of inlichtingen, bij het onderzoek van boeken, bescheiden
      of andere informatiedragers verkregen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te
      geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel41
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '41'
        hoofdstuk: VIII
  - number: '40.3'
    text: |-
      In afwijking van het bepaalde in het eerste en tweede lid is de Bank bevoegd ter handhaving van gezonde en integere
      financiële markten aangifte te doen van een vermoeden van een strafbaar feit. In de gevallen waarin door de Bank
      aangifte is gedaan, dan wel in de gevallen waarin de Bank wordt opgeroepen om als getuige of deskundige op te
      treden, is de Bank bevoegd in het kader van de opsporing, het gerechtelijk vooronderzoek of de behandeling ter
      terechtzitting, inlichtingen te verschaffen met dien verstande dat het een strafzaak betreft.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel40
  - number: '40.4'
    text: |-
      In afwijking van het eerste en tweede lid is de Bank bevoegd met gebruikmaking van gegevens of inlichtingen,
      verkregen bij de vervulling van haar ingevolge deze wet opgedragen taak, mededelingen te doen mits deze niet kunnen
      worden herleid tot afzonderlijke ondernemingen of instellingen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel40
  - number: '40.5'
    text: |-
      De Bank is bevoegd, indien zij dit in het belang van een doelmatig toezicht en de ontwikkeling van een gezond
      bank- en kredietwezen noodzakelijk acht, de aandacht van alle kredietinstellingen uit een of meer afdelingen van
      het register te vestigen op een getotaliseerde, zeer omvangrijke kredietverlening aan één bepaalde kredietnemer
      door een aantal niet nader gespecificeerde kredietinstellingen. De kredietinstellingen zijn verplicht een zodanige
      mededeling geheim te houden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel40
  - number: '41'
    text: |-
      De Bank is bevoegd inlichtingen en gegevens, verkregen bij de vervulling van haar ingevolge deze wet opgedragen
      taak, te verstrekken aan de Stichting Autoriteit Financiële Markten of aan buitenlandse instanties die belast zijn
      met het toezicht op instellingen en ondernemingen die op de financiële markten opereren, mits:
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel41
  - number: 41.a
    text: |-
      de geheimhouding van deze inlichtingen en gegevens bij de wet aldaar is verplicht en naar het oordeel van de Bank
      feitelijk en in voldoende mate is verzekerd;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel41
  - number: 41.b
    text: dat redelijkerwijs niet in strijd is of zou kunnen komen met de belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel41
  - number: 41.c
    text: de Bank zich vergewist van het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt en;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel41
  - number: 41.d
    text: |-
      in voldoende mate is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel
      dan waarvoor deze zijn verstrekt, tenzij daarvoor toestemming van de Bank is verkregen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel41
  - number: '42.1'
    text: |-
      Een kredietinstelling is verplicht alle brieven, bescheiden en informatiedragers haar bedrijf aangaande alsmede
      de boeken inzake het mutatieverloop op alle door de kredietinstelling aan te houden rekeningen ten name van zowel
      haarzelf als van derden met de daarbij behorende brieven, bescheiden en andere informatiedragers gedurende ten
      minste tien jaren op toegankelijke wijze te bewaren.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel42
  - number: '42.2'
    text: Het eerste lid is van overeenkomstige toepassing op geldtransactiekantoren.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel42
  - number: 42a
    text: |-
      Het is een kredietinstelling verboden om een vaste relatie voor de afwikkeling van transacties of de uitvoering van
      opdrachten aan te gaan of voort te zetten met:
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel42a
  - number: 42a.a
    text: |-
      een buitenlandse kredietinstelling of daarmee vergelijkbare onderneming, die geen fysieke aanwezigheid heeft in de
      Staat waarin zij is opgericht;
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel42a
  - number: 42a.b
    text: |-
      een buitenlandse kredietinstelling waarvan bekend is dat zij kredietinstellingen of ondernemingen als bedoeld in
      onderdeel a toestaat om gebruik te maken van haar rekeningen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel42a
  - number: 42b
    text: |-
      Kredietinstellingen en geldtransactiekantoren zijn gehouden bij geldovermakingen informatie over de betaler bij
      te voegen. Bij ministeriële regeling kunnen nadere regels worden gesteld, alsmede regels met betrekking tot het
      bewaren en beschikbaar houden van de bij te voegen informatie, de behandeling van ontvangen geldovermakingen
      waarbij niet alle vereiste informatie is gevoegd, en het optreden als intermediaire betalingsdienstaanbieder.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel42b
  - number: '43'
    text: |-
      De Bank kan voor de uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen, dan
      wel voor de uitvoering van met toezichthoudende instanties gesloten overeenkomsten tot uitwisseling
      van gegevens of inlichtingen, van een ieder inlichtingen vorderen. De [artikelen 5:13][ref1] en
      [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '44.1'
    text: |-
      Behoudens de kredietinstellingen die zijn ingeschreven in de afdelingen van het register, bedoeld in
      [artikel 8][ref1], is het een ondernemer, onderneming of instelling verboden om het woord «bank», «krediet» of
      «spaar» en vertalingen of vormen daarvan te gebruiken in hun naam of bij de uitoefening van hun bedrijf, tenzij
      zulks in zodanige samenhang geschiedt, dat daaruit duidelijk blijkt, dat de onderneming of instelling geen
      kredietinstelling is.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel8
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '44.2'
    text: |-
      De Bank kan van het verbod, vervat in het eerste lid, ontheffing verlenen. Aan deze ontheffing kan voorwaarden
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel44
  - number: '44.3'
    text: |-
      Het verbod, vervat in het eerste lid, is niet van toepassing op de Bank en andere bij wet opgerichte
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel44
  - number: '45.1'
    text: |-
      Het is een ieder verboden zich direkt of indirekt tot het publiek te wenden ter zake van het aantrekken van gelden
      of het verlenen van kredieten door anderen dan de kredietinstellingen die zijn ingeschreven in het register,
      bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel8
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '45.2'
    text: |-
      De Bank kan van het verbod in het eerste lid al dan niet op verzoek ontheffing verlenen. Aan deze ontheffing kunnen
      voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel45
  - number: '45.3'
    text: |-
      Het verbod tot het aantrekken van gelden zoals neergelegd in het eerste lid geldt niet voor beleggingsinstellingen
      die gelden ter collectieve belegging vragen teneinde de deelnemers in de opbrengst van de beleggingen te doen
      delen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Het is verboden, anders dan na verkregen verklaring van geen bezwaar van de Bank, een deelneming in een onderneming
      of instelling waaraan een vergunning als bedoeld in [artikel 2, eerste lid][ref1], is verleend, te houden, te
      verwerven of te vergroten dan wel enige zeggenschap, verbonden aan een dergelijke deelneming, uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel2
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '46.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de voorwaarden waaraan moet worden voldaan ter
      verkrijging van de verklaring van geen bezwaar.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel46
  - number: '46.3'
    text: |-
      De Bank kan een verklaring van geen bezwaar geheel of gedeeltelijk intrekken, indien niet langer wordt voldaan aan
      de in het tweede lid bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel46
  - number: '47.1'
    text: |-
      Onverminderd [artikel 50][ref1] kan de Bank een onderneming of instelling die niet of niet tijdig voldoet aan een
      uit deze wet voortvloeiende verplichting, een geldboete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel50
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '50'
        hoofdstuk: XII
  - number: '47.2'
    text: |-
      De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 250.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel47
  - number: '47.3'
    text: |-
      Alvorens over te gaan tot oplegging van een boete stelt de Bank de betrokken onderneming of instelling schriftelijk
      op de hoogte van het voornemen een boete op te leggen, onder vermelding van de gronden waarop dat voornemen berust.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel47
  - number: '48'
    text: |-
      Voor zover de bepalingen in de reglementen of andere interne regelingen van een aan toezicht onderworpen
      onderneming of instelling of in overeenkomsten met derden gesloten in strijd zijn met de bepalingen van deze wet
      getroffen voorzieningen, zijn zij nietig.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel48
  - number: '49.1'
    text: |-
      In de gevallen waarin krachtens deze wet beroep open staat, kan het beroep binnen de daartoe gestelde termijn
      worden ingesteld bij het gerecht.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel49
  - number: '49.2'
    text: De zittingen van het gerecht vinden plaats met gesloten deuren.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel49
  - number: 49a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      de Bank aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel49a
  - number: 49a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel49a
  - number: 49a.3
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5:18][ref2] en [5:19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '50.1'
    text: |-
      Overtreding van voorschriften gesteld bij of krachtens deze wet, onverminderd het bepaalde in de
      [artikelen 8, vierde en vijfde lid][ref1], [9][ref2] en [47][ref3], wordt voor zover opzettelijk begaan, beschouwd
      als misdrijf en wordt gestraft met een gevangenisstraf van ten hoogste vier jaar en een geldboete van de vijfde
      categorie, dan wel met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028547#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0028547#Artikel47
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028547
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028547
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028547
        artikel: '47'
        hoofdstuk: X
  - number: '50.2'
    text: |-
      Overtreding van de voorschriften als bedoeld in het eerste lid, wordt, voor zover niet opzettelijk begaan,
      beschouwd als overtreding en gestraft met een hechtenis van ten hoogste een jaar en een geldboete van de vijfde
      categorie, dan wel met één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel50
  - number: '51.1'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '51.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel51
  - number: '52'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel52
  - number: '53.1'
    text: |-
      De aanvrager van een besluit op grond van deze wet is voor het in behandeling nemen van de aanvraag een vergoeding
      verschuldigd van de met de behandeling van de aanvraag verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel53
  - number: '53.2'
    text: Bij ministeriële regeling worden de tarieven vastgesteld ter vergoeding van de in het eerste lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel53
  - number: '53.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de doorberekening van
      kosten, verband houdend met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel53
  - number: '54.1'
    text: |-
      De Bank stelt jaarlijks een begroting, een verantwoording en een jaarverslag op terzake van de haar op grond van
      deze wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De [artikelen 1:30 tot en met 1:32][ref1] en
      [1:34 tot en met 1:36 van de Wet op het financieel toezicht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '54.2'
    text: Tegen besluiten van Onze Minister inzake instemming met de begroting of de verantwoording staat geen beroep open.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel54
  - number: '55'
    text: |-
      De Bank verstrekt Onze Minister desgevraagd de gegevens of inlichtingen die deze behoeft om zich over de
      uitvoering van deze wet in de praktijk of over de uitvoerbaarheid van beleidsvoornemens of voorgenomen wettelijke
      voorschriften een oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel55
  - number: '56'
    text: 'Deze wet wordt aangehaald als: Wet toezicht bank- en kredietwezen 1994 BES.'
    url: https://wetten.overheid.nl/BWBR0028547/2010-10-10#Artikel56
