      1 De aanvragen voor:

      a. monumenten met uitsluitend een orgelrestauratie, als bedoeld in [artikel 3, onder a][ref1];

      b. molens als bedoeld in [artikel 3, onder b][ref2]; en

      c. boerderijen met een agrarische functie als bedoeld in [artikel 3, onder c][ref3], worden ingediend voor
