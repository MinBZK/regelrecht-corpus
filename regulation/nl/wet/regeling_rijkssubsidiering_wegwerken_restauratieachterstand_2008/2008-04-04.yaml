articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: Minister van Onderwijs, Cultuur en Wetenschap;

      b. besluit: [Besluit rijkssubsidiëring instandhouding monumenten][ref1];

      c. subsidie: subsidie als bedoeld in [artikel 43 van het besluit][ref2];

      d. restauratieplan: plan als bedoeld in [artikel 4, derde lid][ref3];

      e. subsidiabele kosten: kosten als bedoeld in [artikel 8][ref4], voorzover die naar het oordeel van de Minister
      noodzakelijk zijn om een beschermd monument te restaureren; en

      f. monument met uitsluitend een orgelrestauratie: monument met een orgel dat naar het oordeel van de Minister van
      monumentale waarde is, welk monument met uitzondering van het orgel in een goede staat verkeert.


