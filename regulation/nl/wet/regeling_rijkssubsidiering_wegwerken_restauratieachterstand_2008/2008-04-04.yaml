        bwb_id: BWBR0004471
        artikel: '11'
  - number: '11'
    text: |-
      1 Onverminderd [artikel 10][ref1] wordt subsidie voor een monument met uitsluitend een orgelrestauratie niet
      verstrekt, indien:

      a. het monument behalve wat het orgel betreft ook voor het overige niet in een goede staat verkeert; of

      b. het binnenklimaat van het monument, waarvan het orgel een bestanddeel is, uit een oogpunt van instandhouding
      ongunstig is.

      2 Onverminderd [artikel 10][ref2] wordt subsidie voor molens niet verstrekt indien de functie als bedrijfsvaardige
      molen na restauratie naar het oordeel van de Minister onvoldoende is gewaarborgd.

      3 Onverminderd [artikel 10][ref3] wordt subsidie voor monumenten als bedoeld in [artikel 3, onder d][ref4], niet
      verstrekt, indien voor de desbetreffende monumenten in het verleden voor meer dan € 100.000 subsidie is verleend op
      grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref5], dan wel indien voor de desbetreffende
      monumenten subsidie is verleend op grond van het [Besluit rijkssubsidiëring grootschalige restauraties][ref6],
      het [Besluit rijkssubsidiëring grootschalige restauraties 2002][ref7], het
      [Besluit rijkssubsidiëring grootschalige restauraties 2005][ref8] of de
      [Regeling rijkssubsidiëring wegwerken restauratieachterstand 2007][ref9].

      4 Onverminderd [artikel 10][ref10] wordt subsidie voor monumenten als bedoeld in
      [artikel 3, onderdelen e en f][ref11], niet verstrekt, indien voor de desbetreffende monumenten in het
      verleden subsidie is verleend op grond van het [Besluit rijkssubsidiëring grootschalige restauraties][ref12],
      het [Besluit rijkssubsidiëring grootschalige restauraties 2002][ref13] of het
      [Besluit rijkssubsidiëring grootschalige restauraties 2005][ref14].


