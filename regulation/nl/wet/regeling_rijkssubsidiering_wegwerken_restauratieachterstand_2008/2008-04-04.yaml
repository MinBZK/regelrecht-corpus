  - number: '3'
    text: |-
      De Minister verleent uitsluitend voor de volgende groepen monumenten subsidie:

      a. monumenten met uitsluitend een orgelrestauratie waarvan de subsidiabele kosten gelijk aan of hoger zijn dan
      € 100.000, maar lager zijn dan € 150.000;

      b. molens waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 100.000, maar lager zijn dan € 250.000;

      c. boerderijen met een agrarische functie waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 500.000,
      maar lager zijn dan € 1.000.000;

      d. andere monumenten dan monumenten met uitsluitend een orgelrestauratie, molens, of boerderijen met een agrarische
      functie, waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 500.000, maar lager zijn dan € 1.000.000;

      e. andere monumenten dan monumenten met uitsluitend een orgelrestauratie, molens, of boerderijen met een agrarische
      functie, waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 200.000, maar lager zijn dan € 500.000, en
      waarvoor in het verleden op grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1] subsidie
      is verleend uitsluitend voor kosten die verband houden met het opstellen van een restauratieplan en het daarvoor
      benodigde onderzoek; en

      f. andere monumenten dan monumenten met uitsluitend een orgelrestauratie, molens, of boerderijen met een agrarische
      functie, waarvan de subsidiabele kosten gelijk aan of hoger zijn dan € 1.000.000, maar lager zijn dan € 3.000.000,
      en waarvoor in het verleden op grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref2]
      subsidie is verleend uitsluitend voor kosten die verband houden met het opstellen van een restauratieplan en het
      daarvoor benodigde onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0008615
      [ref2]: https://wetten.overheid.nl/BWBR0008615
    url: https://wetten.overheid.nl/BWBR0023722/2008-04-04#Artikel3
