      Indien één of meer van de subsidieplafonds, bedoeld in [artikel 7, eerste lid][ref1], na toepassing van de
      [artikelen 9][ref2], [10][ref3] en [11][ref4] niet worden bereikt, wendt de Minister het resterende bedrag aan voor
      de toepassing van [artikel 7, tweede lid][ref5].


