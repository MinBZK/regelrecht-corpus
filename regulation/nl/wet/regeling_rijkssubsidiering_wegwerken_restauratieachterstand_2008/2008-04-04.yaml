  - number: '10'
    text: |-
      Subsidie wordt niet verstrekt, indien:

      a. voor de voorgenomen restauratie geen vergunning als bedoeld in [artikel 11 van de wet][ref1] is verleend;

      b. naar het oordeel van de Minister niet is gewaarborgd, dat het beschermde monument na uitvoering van het
      restauratieplan zonder aanvullende restauratiewerkzaamheden in een goede staat kan worden gehouden; of

      c. de toekomstige bestemming van het te restaureren monument naar het oordeel van de Minister een belemmering vormt
      voor de instandhouding van het monument.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0023722/2008-04-04#Artikel10
    references:
