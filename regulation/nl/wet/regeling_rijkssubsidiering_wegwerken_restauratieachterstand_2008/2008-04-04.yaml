  - number: '12'
    text: |-
      1 Indien één of meer van de subsidieplafonds, bedoeld in [artikel 7][ref1], na toepassing van de
      [artikelen 9][ref2], [10][ref3] en [11][ref4] te laag zijn om alle ingediende aanvragen te kunnen honoreren,
      brengt de Minister een rangorde aan, in die zin dat restauratieplannen met een lager bedrag aan subsidiabele kosten
      voorrang hebben op restauratieplannen met een hoger bedrag aan subsidiabele kosten.

      2 Indien één of meer van de subsidieplafonds, bedoeld in [artikel 7][ref5], na toepassing van het eerste lid, en in
      voorkomend geval [artikel 13][ref6], te laag zijn om de alsdan in aanmerking komende aanvragen te kunnen honoreren,
      brengt de Minister ten aanzien van deze aanvragen een rangorde aan, in die zin dat aanvragen met een hoger bedrag
      aan niet voor subsidie in aanmerking komende kosten voorrang hebben op aanvragen met een lager bedrag aan niet voor
      subsidie in aanmerking komende kosten.


