  - number: 20e
    text: |-
      1 Een besluit omtrent een kleine wijziging van de tweede categorie wordt genomen binnen 30 dagen nadat door het
      Bureau de ontvangst van de aanvraag is bevestigd.

      2 Op de aanvraag is [artikel 7][ref1] van toepassing.

      3 In afwijking van [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref2] kan een aanvrager gedurende
      30 dagen in de gelegenheid worden gesteld om:

      a. de ingevolge [artikelen 22][ref3], [23][ref4] en[ 23a][ref5] verschuldigde bedragen te voldoen, ingeval deze
      bedragen niet bij de indiening van een aanvraag zijn voldaan;

      b. een aanvraag aan te vullen, ingeval niet is voldaan aan de eisen, gesteld in de [artikelen 20a][ref6] en
      [20b][ref7], of de bij de aanvraag verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de
      aanvraag of voor de voorbereiding van het besluit.

      4 Indien een aanvrager in een gelegenheid als bedoeld in het derde lid wordt gesteld, wordt een besluit in
      afwijking van het eerste lid genomen binnen 30 dagen nadat door het Bureau de voldoening van verschuldigde bedragen
      of ontvangst van aanvullingen op de aanvraag is bevestigd.


