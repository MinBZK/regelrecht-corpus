preamble:
  text: |-
    in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op richtlijn nr. 93/40/EEG van de Raad van 14 juni 1993 tot wijziging van de richtlijnen 81/851/EEG en
    81/852/EEG betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake geneesmiddelen voor
    diergeneeskundige gebruik (PbEG L 214), op richtlijn nr. 93/41/EEG van de Raad van 14 juni 1993 tot intrekking
    van richtlijn 87/22/EEG tot onderlinge aanpassing van de nationale maatregelen inzake het in de handel brengen van
    met behulp van hoogwaardige technieken, met name biotechnieken, vervaardigde geneesmiddelen (PbEG L214) en op de
    artikelen 3, 4 en 9 van de Diergeneesmiddelenwet;

    Gezien het advies van de Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), het
    Productschap voor Veevoeder (VVR) en het Landbouwschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze regeling wordt verstaan onder:



              a

                *wet:*


                [Diergeneesmiddelenwet][ref1];



              b

                *richtlijn nr. 2001/82/EG:*


                [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van de Europese Unie van
      6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig
      gebruik (PbEG L 311);



              c

                *homeopathisch diergeneesmiddel:*


                diergeneesmiddel dat is vermeld op de Lijst van homeopathische diergeneesmiddelen 1993, of
      diergeneesmiddel dat overeenkomstig een homeopathisch fabricageprocédé als beschreven in de Europese Farmacopee
      dan wel in een andere op 22 september 1992 in de lidstaten van de Europese Gemeenschappen officieel gebruikte
      farmacopee, is verkregen uit producten, substanties of mengsels die homeopathische grondstoffen worden genoemd.



              d






              e

                *Comité:*


                Comité voor geneesmiddelen voor diergeneeskundig gebruik (CVMP), bedoeld in artikel 31, eerste lid, van
      [richtlijn nr. 2001/82/EG](32001L0082);



              f

                *Bureau:*


                Bureau Registratie Diergeneesmiddelen, Postbus 289, 6700 AG Wageningen;



              g

                *dossier:*


                door de aanvrager als onderdeel van de registratieaanvraag te verstrekken gegevens, niet zijnde het
      aanvraagformulier en de daarin genoemde bijlagen, met dien verstande dat voor de toepassing van paragraaf 3.2 het
      aanvraagformulier en de daarin genoemde bijlagen wèl hieronder zijn begrepen;



              h

                *lidstaat:*


                lidstaat van de Europese Unie;



              i
              EER-staat:

                staat, niet zijnde een lidstaat, Nederland of IJsland, die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte (Trb. 1992, 132);



              j

                [verordening (EEG) nr. 2377/90](31990R2377):

                [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van de Europese Gemeenschappen van 26 juni 1990
      houdende een communautaire procedure tot vaststelling van maximumvoorwaarden voor residuen van geneesmiddelen voor
      diergeneeskundig gebruik in levensmiddelen van dierlijke oorsprong (PbEG L 224);



              k

                [verordening (EG) nr. 1084/2003](32003R1084):

                [verordening (EG) nr. 1084/2003](32003R1084) van de Commissie van de Europese Gemeenschappen van 3
      juni 2003 betreffende het onderzoek van wijzigingen in de voorwaarden van een door een bevoegde instantie van
      een lidstaat verleende vergunning voor het in de handel brengen van geneesmiddelen voor menselijk gebruik en
      geneesmiddelen voor diergeneeskundig gebruik (PbEU L 159);



              l
              kleine wijziging van de eerste categorie:

                wijziging van een registratie die in bijlage I bij verordening (EG) nr. 1084/2003 als type IA wordt
      aangeduid;



              m
              kleine wijziging van de tweede categorie:

                wijziging van een registratie die in bijlage I bij verordening (EG) nr. 1084/2003 als type IB wordt
      aangeduid;



              n
              ingrijpende wijziging:

                wijziging van een registratie die niet kan worden beschouwd als een kleine wijziging van de eerste of
      tweede categorie of als een wijziging of uitbreiding als bedoeld in bijlage II bij verordening (EG) nr. 1084/2003.




      2 Deze regeling berust op de [artikelen 3][ref2], [4][ref3], [5][ref4], en [9 van de Diergeneesmiddelenwet][ref5]
      alsmede op [artikel 5 van het Besluit registratie en bijwerkingen 1999][ref6].


