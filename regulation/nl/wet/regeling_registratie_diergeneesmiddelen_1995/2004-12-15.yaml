      1 Aanvragen tot verlenging van een registratie moeten ten minste 3 maanden voor het verstrijken van de termijn
      waarvoor de registratie geldt, worden ingediend bij het Bureau.

      2 Op aanvragen tot verlenging van een registratie is paragraaf 3.1.1 van overeenkomstige toepassing.
