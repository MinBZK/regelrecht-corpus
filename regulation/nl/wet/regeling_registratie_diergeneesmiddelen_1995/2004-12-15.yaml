  - number: '8'
    text: |-
      1 Een besluit omtrent registratie wordt genomen binnen 210 dagen na ontvangst van de aanvraag.

      2 Indien registratie wordt verleend, deelt het Bureau aan de aanvrager de samenvatting van de productkenmerken mede
      zoals deze bij het besluit tot registratie is goedgekeurd.

      3 Het Bureau doet aan het Europees Bureau voor de Geneesmiddelenbeoordeling een afschrift van de
      registratiebeschikking en van de goedgekeurde samenvatting van de productkenmerken toekomen.

      4 De Commissie stelt een beoordelingsrapport op met een beoordeling van en opmerkingen over het dossier betreffende
      de resultaten van het analytisch, farmacologisch, toxicologisch en klinisch onderzoek van het diergeneesmiddel,
      waarvoor registratie is aangevraagd.

      5 Het beoordelingsrapport wordt bijgewerkt zodra nieuwe gegevens beschikbaar komen die voor de beoordeling van de
      kwaliteit, de veiligheid of de werkzaamheid van het betreffende diergeneesmiddel van belang zijn.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel8
  - number: '9'
    text: |-
      1 Indien een na 1 januari 1995 ingediende aanvraag tot registratie reeds in een andere lidstaat of in een EER-
      staat daadwerkelijk in behandeling is, kan de Commissie besluiten het gedetailleerde onderzoek van de aanvraag
      voor dat diergeneesmiddel stop te zetten en het beoordelingsrapport af te wachten dat door die andere lidstaat
      overeenkomstig artikel 25 van [richtlijn nr. 2001/82/EG](32001L0082) wordt opgesteld. Het Bureau stelt de aanvrager
      en de andere lidstaten hiervan op de hoogte.

      2 Indien het gedetailleerde onderzoek, bedoeld in het eerste lid, tijdelijk is stopgezet, wordt binnen 90 dagen
      na ontvangst van het in het eerste lid bedoelde beoordelingsrapport een beslissing tot registratie genomen of de
      procedure beschreven in de artikelen 33 tot en met 38 van [richtlijn nr. 2001/82/EG](32001L0082) gevolgd, indien
      er redenen zijn om aan te nemen dat registratie van het betreffende diergeneesmiddel een risico voor de gezondheid
      van mens, dier of milieu, wat betrekking heeft op de kwaliteit, de veiligheid en de werkzaamheid van het betrokken
      diergeneesmiddel, kan opleveren.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel9
  - number: '10'
    text: |-
      1 Ingeval een aanvraag tot registratie na 1 januari 1998 wordt ingediend en het Bureau ervan in kennis wordt
      gesteld dat een andere lidstaat of een EER-staat een vergunning als bedoeld in artikel 5 van [richtlijn nr.
      2001/82/EG](32001L0082) heeft afgegeven voor het betreffende diergeneesmiddel, verzoekt het Bureau onverwijld aan
      die lidstaat of die EER-staat om het bijbehorende beoordelingsrapport op te sturen.

      2 Indien het in het eerste lid bedoelde beoordelingsrapport is opgevraagd, is [artikel 9, tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006988#Artikel9
