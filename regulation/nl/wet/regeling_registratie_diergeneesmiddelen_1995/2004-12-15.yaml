  - number: '13'
    text: |-
      De aanvrager houdt één of meer monsters van het betrokken diergeneesmiddel, van de werkzame stof of stoffen, dan
      wel, in voorkomend geval, van de tussenproducten of van andere bestanddelen ten behoeve van de beoordeling van het
      diergeneesmiddel beschikbaar, welke monsters binnen vijf weken op eerste oproep van het Bureau per aangetekende
      brief aan de door het Bureau aangewezen instituten worden gezonden.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel13
  - number: '15'
    text: |-
      1 Op een aanvraag tot registratie van een homeopathisch diergeneesmiddel is [paragraaf 3.1.1][ref1] van toepassing.

      2 In afwijking van het eerste lid hoeft de aanvrager geen resultaten van toxicologische, farmacologische en
      klinische proeven over te leggen indien hij kan aantonen:

      a. dat de aanvraag een homeopathisch diergeneesmiddel betreft, dat is bestemd voor gezelschapsdieren of exotische
      diersoorten waarvan het vlees of de producten niet voor menselijke consumptie worden gebruikt, en

      b. door middel van een gedetailleerde wetenschappelijke documentatie afgestemd op de homeopathische veterinaire
      geneeskunde, dat de doeltreffendheid ervan vaststaat en het veiligheidsniveau aanvaardbaar is.

      3 In afwijking van het eerste lid hoeft een aanvraag tot registratie van een homeopathisch diergeneesmiddel als
      bedoeld in het vierde lid slechts vergezeld te gaan van:

      a. de wetenschappelijke benaming of een andere in een farmacopee voorkomende benaming van de homeopathische
      grondstof of grondstoffen, onder vermelding van de verschillende te registreren toedieningswijzen, farmaceutische
      vormen en verdunningsgraden;

      b. een dossier waarin wordt beschreven hoe de homeopathische grondstof of grondstoffen wordt dan wel worden
      verkregen en gecontroleerd en waarin het homeopathisch karakter met behulp van een gedegen homeopathische
      bibliografie wordt onderbouwd, met dien verstande dat in het geval van homeopathische diergeneesmiddelen die
      biologische stoffen bevatten, een beschrijving wordt overgelegd van de maatregelen die zijn genomen om te
      garanderen dat er geen ziekteverwekkers aanwezig zijn;

      c. het fabricage- en controledossier voor elke farmaceutische vorm en een beschrijving van de verdunnings- en
      potentiëringsmethoden;

      d. een afschrift van de vergunning voor het bereiden, verpakken of etiketteren, en afleveren van
      diergeneesmiddelen;

      e. een afschrift van de eventuele registratiebewijzen of vergunningen die in andere lidstaten voor hetzelfde
      diergeneesmiddel zijn afgegeven;

      f. één of meer monsters of modellen van de verpakking, en

      g. gegevens betreffende de houdbaarheid van het diergeneesmiddel.

      4 Een aanvraag voor een registratie van een homeopathisch diergeneesmiddel als bedoeld in het derde lid betreft een
      homeopathisch diergeneesmiddel:

      a. dat is bestemd om te worden toegediend aan gezelschapsdieren of aan exotische soorten waarvan het vlees of de
      producten niet voor menselijke consumptie bestemd zijn;

      b. waarvan de wijze van toediening is beschreven in de Europese Farmacopee of in de op dit moment door de lidstaten
      officieel gebruikte farmacopeeën;

      c. waarbij geen specifieke therapeutische indicatie wordt vermeld op het etiket of in de informatie inzake het
      diergeneesmiddel, en

      d. waarvan de verdunningsgraad zodanig is dat het diergeneesmiddel gegarandeerd onschadelijk is, met dien
      verstande dat het diergeneesmiddel niet meer dan één deel per 10.000 van de oertinctuur bevat, en niet meer dan
      één honderdste van de kleinste eventueel in de allopathische diergeneeskunde gebruikte dosis voor de werkzame
      bestanddelen waarvan de aanwezigheid in een allopathisch geneesmiddel met zich brengt dat een medisch voorschrift
      moet worden overgelegd.

      5 Een aanvraag als bedoeld in het derde lid mag betrekking hebben op een reeks diergeneesmiddelen die van dezelfde
      homeopathische grondstof of grondstoffen zijn afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006988#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006988
        paragraaf: '3'
  - number: '16'
    text: |-
      Aanvragen met betrekking tot een diergeneesmiddel vervaardigd met behulp van hoogwaardige technieken als bedoeld
      in [richtlijn nr. 87/22/EEG](31987L0022) van de Raad van de Europese Gemeenschappen van 22 december 1986 tot
      onderlinge aanpassing van de nationale maatregelen inzake het in de handel brengen van met behulp van hoogwaardige
      technieken, met name biotechnieken, vervaardigde geneesmiddelen (PbEG L 15) die vóór 1 januari 1995 overeenkomstig
      artikel 2 van die richtlijn aan het Comité zijn voorgelegd en ten aanzien waarvan het Comité op 1 januari 1995
      nog geen advies heeft uitgebracht, worden geacht met [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van
      de Europese Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van
      vergunningen voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting
      van een Europees Bureau voor de geneesmiddelenbeoordeling (PbEG L 214) in overeenstemming te zijn.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel16
  - number: '17'
    text: |-
      1 Alvorens een aanvraag overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082) in een volgende
      lidstaat of EER-staat in te dienen waarbij verzocht wordt om erkenning van een in Nederland verleende registratie,
      deelt de registratiehouder het Bureau schriftelijk mee dat een dergelijke aanvraag zal worden ingediend en stelt
      hij het Bureau in kennis van eventuele toevoegingen aan het oorspronkelijke dossier.

      2 Het eerste lid is niet van toepassing op homeopathische diergeneesmiddelen als bedoeld in
      [artikel 15, tweede lid][ref1].

      3 Naar aanleiding van de in het eerste lid bedoelde mededeling kan het Bureau van de registratiehouder alle
      gegevens en bescheiden verlangen die nodig zijn om te kunnen nagaan of de ingediende dossiers volledig gelijk zijn.

      4 Op schriftelijk verzoek van de in het eerste lid bedoelde registratiehouder stelt de Commissie een
      beoordelingsrapport op of, indien nodig, werkt het bestaande rapport bij binnen 90 dagen na ontvangst van dat
      verzoek.

      5 Op het ogenblik dat een aanvraag als bedoeld in het eerste lid wordt ingediend, zendt het Bureau het betreffende
      beoordelingsrapport toe aan de lidstaat of lidstaten of EER-staat of EER-staten waaraan de aanvraag is gericht.

      6 De registratiehouder voldoet bij het schriftelijke verzoek, bedoeld in het vierde lid, het ingevolge de
      [artikelen 23][ref2] of [23a][ref3] verschuldigde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006988#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006988#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006988#Artikel23a
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel17
