  - number: '2'
    text: |-
      1 Er is een Commissie registratie diergeneesmiddelen.

      2 De Commissie registratie diergeneesmiddelen bestaat uit zeven leden.

      3 De Minister van Landbouw, Natuur en Voedselkwaliteit benoemt de leden van de Commissie registratie
      diergeneesmiddelen.

      4 De Commissie adviseert de Minister van Landbouw, Natuur en Voedselkwaliteit omtrent de registratie van
      diergeneesmiddelen, alsmede omtrent de verlenging, wijziging, de schorsing, opheffing van de schorsing of
      doorhaling van een registratie.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel2
  - number: '4'
    text: |-
      Het onderzoek dat nodig is met het oog op de voorbereiding van de adviezen van de Commissie wordt op haar verzoek
      verricht door:

      a. het Rijkskwaliteitsinstituut voor landen tuinbouwproducten voor wat betreft de toxiciteit en de analysemethoden
      van de residuen van niet-immunobiologische diergeneesmiddelen en omzettingsproducten daarvan alsmede voor wat
      betreft aspecten verband houdende met de verwerking van niet-immunobiologische diergeneesmiddelen in diervoeder;

      b. Het Rijksinstituut voor Volksgezondheid en Milieuhygiëne voor wat betreft de ecotoxiciteit, de toxiciteit en de
      analysemethode van residuen van diergeneesmiddelen en omzettingsproducten daarvan, de effecten voor de gebruiker
      en de resistentie-inductie alsmede voor wat betreft de fabricage, de samenstelling en de analysemethoden van niet-
      immunobiologische diergeneesmiddelen;

      c. het Instituut voor Veehouderij en Diergezondheid voor wat betreft de effectiviteit en toxiciteit voor de
      doeldieren van diergeneesmiddelen alsmede de aspecten genoemd onder a en b voor wat betreft immunobiologische
      diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel4
  - number: 4a
    text: |-
      Als substanties als bedoeld in [artikel 4, onderdeel d, van de wet](onbekend) worden aangewezen smetstoffen die
      brucellosis melitensis, brucellosis suis, brucellosis bang of rundertuberculose kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel4a
  - number: 4b
    text: |-
      Als substanties als bedoeld in [artikel 5 van de wet](onbekend) worden aangewezen:

      a. substanties die niet zijn opgenomen in bijlage I, II of III bij [verordening (EEG) nr. 2377/90](31990R2377),
      voor zover het desbetreffende diergeneesmiddel is bestemd of mede is bestemd om bij voedselproducerende dieren te
      worden toegepast;

      b. somatropines;

      c. entstoffen voor handen en katten die een niet-geïnactiveerd hondsdolheidvirus bevatten.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel4b
  - number: 4c
    text: |-
      Een diergeneesmiddel dat een substantie bevat ten aanzien waarvan een monografie is opgenomen in de Europese
      farmacopee, bedoeld in artikel 1 van het Verdrag inzake de samenstelling van een Europees farmacopee, wordt alleen
      geregistreerd indien de substantie voldoet aan de in de desbetreffende monografie gegeven specificaties ten aanzien
      van de kwaliteit.
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel4c
  - number: '5'
    text: |-
      1 Een aanvraag tot registratie van een diergeneesmiddel wordt door een in een lidstaat of in een EER-staat
      gevestigde persoon ingediend bij het Bureau door indiening van het daartoe bestemde aanvraagformulier en het
      dossier.

      2 Aanvraagformulieren, overeenkomstig de bij deze regeling behorende modellen, zijn evenals de bijbehorende
      instructies op aanvraag verkrijgbaar bij het Bureau. De aanvraagformulieren en de bijbehorende instructies liggen
      ter inzage in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer en Visserij.

      3 Het in het eerste lid bedoelde aanvraagformulier wordt volledig, overeenkomstig de daarbij behorende instructies,
      ingevuld, zodat daaruit ten minste de gegevens blijken die in de inleiding en in titel I, deel 1, onderdelen A en
      B, dan wel in voorkomend geval, in titel II, deel 5, onderdelen A en B, van bijlage I bij [richtlijn nr. 2001/82/
      EG](32001L0082) worden verlangd, overeenkomstig de in die bijlage aangegeven eisen. Het aanvraagformulier wordt
      ingediend in het aantal zoals in de instructies bij het aanvraagformulier is vermeld.

      4 Het dossier wordt volledig ingediend, in het aantal zoals in de instructies bij het aanvraagformulier is vermeld.

      5 Het dossier en het ingevulde aanvraagformulier bevatten te samen tenminste de gegevens, bedoeld in
      [artikel 12, derde lid, onderdelen a tot en met n][ref1], en voorzover van toepassing, artikel 13, eerste lid van
      [richtlijn nr. 2001/82/EG](32001L0082) en, in voorkomend geval, bedoeld in [richtlijn nr. 90/167/EEG](31990L0167)
      van de Raad van 26 maart 1990 tot vaststelling van de voorwaarden voor de bereiding, het in de handel brengen en
      het gebruik van diervoeders met medicinale werking (PbEG L 92).


