  - number: '18'
    text: |-
      1 Op een aanvraag tot registratie van een diergeneesmiddel waarvoor in een lidstaat of een EER-staat een vergunning
      voor het in handel brengen als bedoeld in artikel 5 van [richtlijn nr. 2001/82/EG](32001L0082) is verleend en
      ten aanzien waarvan in één of meer andere lidstaten of in een EER-staat, waaronder Nederland, een aanvraag tot
      vergunningverlening is ingediend, is [paragraaf 3.1.1][ref1] van toepassing.

      2 De aanvrager verklaart schriftelijk bij de in het eerste lid bedoelde aanvraag dat het daar bedoelde dossier
      geheel gelijk is aan het door de betreffende lidstaat of EER-staat ten behoeve van dat diergeneesmiddel aanvaarde
      dossier of geeft aan welke eventuele toevoegingen of wijzigingen hierin zijn aangebracht. In dit laatste geval
      bevestigt de aanvrager dat:

        - de samenvatting van de productkenmerken volledig gelijk is aan die welke door de eerste lidstaat of EER-staat is
      aanvaard en
        - alle in het kader van deze procedure voorgelegde dossiers volledig gelijk zijn.

      3 De aanvrager stelt het Comité van de aanvraag in kennis, deelt aan het Comité mee welke de betrokken lidstaten
      of EER-staten zijn alsmede de datum waarop de aanvraag is ingediend en zendt het Comité een afschrift van de
      door de eerste lidstaat verleende vergunning, bedoeld in artikel 5 van [richtlijn nr. 2001/82/EG](32001L0082).
      Tevens zendt hij het Comité afschriften van eventuele vergunningen die door de andere lidstaten voor het betrokken
      diergeneesmiddel zijn verleend, en vermeldt hij of een vergunningsaanvraag eventueel reeds in behandeling is in een
      lidstaat of in een EER-staat.

      4 In afwijking van [artikel 8, eerste lid][ref2], wordt een besluit omtrent registratie van een diergeneesmiddel
      als bedoeld in het eerste lid binnen 90 dagen na ontvangst van de aanvraag en het beoordelingsrapport betreffende
      de door de eerste lidstaat of EER-staat verleende vergunning genomen.

      5 Indien er in de in het vierde lid genoemde periode van 90 dagen redenen zijn om aan te nemen dat de gevraagde
      vergunning een risico voor de gezondheid van mens of dier of voor het milieu, wat betrekking heeft op de kwaliteit,
      de veiligheid en de werkzaamheid van het betrokken diergeneesmiddel, kan opleveren, stelt het Bureau onverwijld
      de aanvrager, alle andere bij de vergunning betrokken lidstaten en het Comité hiervan in kennis, waarbij uitvoerig
      de redenen hiervan worden vermeld en wordt aangegeven welke maatregelen zouden kunnen worden genomen om eventuele
      tekortkomingen in de aanvraag recht te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0006988#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0006988#Artikel8
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel18
