  - number: '11'
    text: |-
      Het in [artikel 5][ref1] bedoelde dossier wordt overeenkomstig titel I, deel 1, onderdeel C, deel 2, 3, 4, dan wel,
      in voorkomend geval, titel II, deel 5, onderdeel C, deel 6, 7, 8 en 9 van bijlage I bij [richtlijn nr. 2001/82/EG]
      (32001L0082) opgesteld, met dien verstande dat:

      a. een verklaring wordt overgelegd waaruit blijkt dat het onderzoek, bedoeld in titel I, deel 3, dan wel,
      in voorkomend geval, titel II, deel 7, is uitgevoerd in overeenstemming met de bepalingen ten aanzien van
      goede laboratoriumpraktijken, zoals die zijn vastgelegd in [richtlijn nr. 2004/10/EG](32004L0010) van het
      Europees Parlement en de Raad van de Europese Unie van 11 februari 2004 betreffende de onderlinge aanpassing
      van de wettelijke en bestuursrechtelijke bepalingen inzake de toepassing van de beginselen van goede
      laboratoriumpraktijken en het toezicht op de toepassing ervan voor tests op chemische stoffen (gecodificeerde
      versie) (PbEU L 50) en [richtlijn nr. 2004/9/EG](32004L0009) van het Europees Parlement en de Raad van de
      Europese unie van 11 februari 2004 inzake de inspectie en de verificatie van de goede laboratoriumpraktijken (GLP)
      (Gecodificeerde versie) (PbEU L 50);

      b. de aanvrager geen resultaten van toxicologische, farmacologische en klinische proeven hoeft voor te leggen
      indien hij kan aantonen:

      1) dat het diergeneesmiddel in wezen gelijk is aan een diergeneesmiddel dat reeds is geregistreerd en dat degene
      die voor het in de handel brengen van het oorspronkelijk diergeneesmiddel verantwoordelijk is, ermee heeft
      ingestemd dat de toxicologische, farmacologische of klinische referenties uit het dossier over dit oorspronkelijke
      diergeneesmiddel worden benut om de betrokken aanvraag te onderzoeken, of

      2) door middel van een gedetailleerde bibliografische wetenschappelijke documentatie dat het bestanddeel of de
      bestanddelen van het diergeneesmiddel reeds vaak in de geneeskunde zijn toegepast, dat de doeltreffendheid ervan
      vaststaat en het veiligheidsniveau aanvaardbaar is, of

      3) dat het diergeneesmiddel in wezen gelijk is aan een diergeneesmiddel dat, afhankelijk van de regelgeving van
      de betreffende lidstaat of EER-staat, ten minste 6 of 10 jaar, voor zover het betreft de gevallen, bedoeld in
      artikel 13, eerste lid, onderdeel a, onder iii, van [richtlijn nr. 2001/82/EG](32001L0082), volgens de geldende
      communautaire bepalingen in die lidstaat is toegelaten of in Nederland ten minste 10 jaar is geregistreerd en dat
      in Nederland in de handel is gebracht;

      c. wanneer het gaat om nieuwe diergeneesmiddelen met bekende bestanddelen die nog niet eerder met een therapeutisch
      oogmerk zijn samengevoegd, resultaten van toxicologische, farmacologische en klinische proeven inzake die
      combinatie worden voorgelegd, waarbij referenties voor elk afzonderlijk bestanddeel echter niet noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006988#Artikel5
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel11
