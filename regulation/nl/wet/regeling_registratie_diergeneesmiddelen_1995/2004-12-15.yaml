        artikel: '9'
  - number: '25'
    text: |-
      1 Een wijziging van een of meer onderdelen van de richtlijnen, genoemd in de [artikelen 1][ref1], [5][ref2]
      en [11][ref3], treedt voor de toepassing van de artikelen uit deze regeling, waarin naar die onderdelen wordt
      verwezen, in werking met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.

      2 Onze Minister doet mededeling in de Staatscourant van een wijziging als bedoeld in het eerste lid.


