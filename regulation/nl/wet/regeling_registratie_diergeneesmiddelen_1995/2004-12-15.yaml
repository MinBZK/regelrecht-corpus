  - number: '23'
    text: |-
      De kosten van het onderzoek, bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref1], bedragen ingeval
      het diergeneesmiddel is bedoeld om mede of uitsluitend te worden toegepast bij voedselproducerende dieren:

      a. € 14.500 voor een aanvraag als bedoeld in [paragraaf 3.1.1][ref2], indien aan elk van de volgende voorwaarden
      is voldaan:

      1°. [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref3], is niet van toepassing;

      2°. de registratie is niet bestemd om te worden erkend in een volgende lidstaat of EER-staat als bedoeld in
      [artikel 17, eerste lid][ref4];

      b. € 23.200 voor een aanvraag als bedoeld in [paragraaf 3.1.1][ref5], indien aan elk van de volgende voorwaarden
      is voldaan:

      1°. [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref6], is niet van toepassing;

      2°. de registratie is mede bestemd om te worden erkend in een volgende lidstaat of EER-staat als bedoeld in
      [artikel 17, eerste lid][ref7];

      c. € 3.625 voor een aanvraag als bedoeld in [paragraaf 3.1.1][ref8], indien aan elk van de volgende voorwaarden
      is voldaan:

      1°. [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref9], is van toepassing;

      2°. de registratie is niet bestemd om te worden erkend in een volgende lidstaat of EER-staat als bedoeld in
      [artikel 17, eerste lid][ref10];

      d. € 5.800 voor een aanvraag als bedoeld in [paragraaf 3.1.1][ref11], indien aan elk van de volgende voorwaarden
      is voldaan:

      1°. [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref12], is van toepassing;

      2°. de registratie is mede bestemd om te worden erkend in een volgende lidstaat of EER-staat als bedoeld in
      [artikel 17, eerste lid][ref13];

      e. € 14.500 voor een aanvraag als bedoeld in [artikel 15, eerste lid][ref14], voorzover de registratie niet is
      bestemd om te worden erkend in een volgende lidstaat of EER-staat als bedoeld in [artikel 17, eerste lid][ref15];

      f. € 23.200 voor een aanvraag als bedoeld in [artikel 15, eerste lid][ref16], voorzover de registratie mede is
      bestemd om te worden erkend in een volgende lidstaat of EER-staat als bedoeld in [artikel 17, eerste lid][ref17];

      g. € 9.425 voor een aanvraag als bedoeld in [artikel 17, eerste lid][ref18], indien de aanvraag die aan de in
      Nederland verleende registratie, bedoeld in [artikel 17, eerste lid][ref19], is voorafgegaan aan elk van de
      volgende voorwaarden voldoet:

      1°. [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref20], was niet van toepassing;

      2°. uit de aanvraag blijkt niet dat de registratie mede was bestemd om te worden erkend in een volgende lidstaat of
      EER-staat als bedoeld in [artikel 17, eerste lid][ref21];

      h. € 2.500 voor een aanvraag als bedoeld in [artikel 17, eerste lid][ref22], indien de aanvraag die aan de in
      Nederland verleende registratie, bedoeld in artikel 17, eerste lid, is voorafgegaan aan elk van de volgende
      voorwaarden voldoet:

      1°. [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref23], was van toepassing;

      2°. uit de aanvraag blijkt niet dat de registratie mede was bestemd om te worden erkend in een volgende lidstaat of
      EER-staat als bedoeld in [artikel 17, eerste lid][ref24];

      i. € 11.600 voor een aanvraag als bedoeld in [artikel 18, eerste lid][ref25], indien
      [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref26], niet van toepassing is;

      j. € 2.900 voor een aanvraag als bedoeld in [artikel 18, eerste lid][ref27], indien
      [artikel 11, aanhef in samenhang met onderdeel b, onder 1 of 3][ref28], van toepassing is;

      k. € 1.450 voor een aanvraag tot een kleine wijziging van de tweede categorie;

      l. € 7.250 voor een aanvraag tot een ingrijpende wijziging.


