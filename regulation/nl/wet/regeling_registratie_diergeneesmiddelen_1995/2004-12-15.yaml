  - number: '19'
    text: |-
      1 De in [artikel 18, vijfde lid][ref1], bedoelde beslissing betreft het verlenen van een registratie of het
      aanspannen van een arbitrageprocedure als bedoeld in artikel 34 van [richtlijn nr. 2001/82/EG](32001L0082).

      2 Van de in het eerste lid bedoelde beslissing worden de lidstaat of de EER-staat die de oorspronkelijke vergunning
      heeft verleend, de overige bij de aanvraag betrokken lidstaten of EER-staten, het Comité en de aanvrager in kennis
      gesteld.

      3 Indien geen overeenstemming wordt bereikt over het verlenen van de gevraagde vergunning, verstrekt het Bureau het
      Comité een gedetailleerde opsomming van de punten waarover met de andere betrokken lidstaten geen overeenstemming
      is bereikt en de redenen voor dit verschil en stuurt de aanvrager daarvan een afschrift.

      4 Zodra de aanvrager door het Bureau ervan in kennis is gesteld dat de zaak aan het Comité is voorgelegd, zendt hij
      het Comité onverwijld een afschrift van de in artikel 32, tweede lid, van [richtlijn nr. 2001/82/EG](32001L0082)
      genoemde gegevens en bescheiden.

      5 Naar aanleiding van een beschikking van de Commissie van de Europese Gemeenschappen overeenkomstig artikel 38 van
      [richtlijn nr. 2001/82/EG](32001L0082) wordt een aan die beschikking beantwoordende registratie verleend, waarvan
      de aanvrager, de Commissie van de Europese Gemeenschappen en het Comité in kennis worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006988#Artikel18
