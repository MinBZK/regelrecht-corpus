  - number: '24'
    text: |-
      1 Het in [artikel 9 van de wet][ref1] bedoelde register berust bij en wordt bijgehouden door het Bureau.

      2 Het register bestaat uit registerbladen overeenkomstig het bij deze regeling behorende model.

      3 In het vak aantekeningen van het registerblad worden in voorkomend geval ter zake het betrokken diergeneesmiddel
      onder vermelding van de datum aangetekend:

      a. de schorsing van een inschrijving;

      b. de opheffing van een schorsing;

      c. de doorhaling van een inschrijving;

      d. de wijziging van een inschrijving;

      e. de verlenging van een inschrijving.

      4 De beschikking waarbij een registratie is verleend, verlengd, gewijzigd, geschorst of doorgehaald, dan wel
      waarbij de schorsing is opgeheven, wordt bij het registerblad van het betrokken diergeneesmiddel gevoegd.

      5 Vanaf de datum waarop een inschrijving van een diergeneesmiddel in het register is doorgehaald of vervallen
      worden de op dat diergeneesmiddel betrekking hebbende registerbladen nog ten minste 10 jaar bewaard.

      6 Het dubbel van het register ligt ter inzage op werkdagen van 9.00 tot 16.00 uur in de bibliotheek van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit, Bezuidenhoutseweg 73, te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel9
    url: https://wetten.overheid.nl/BWBR0006988/2004-12-15#Artikel24
