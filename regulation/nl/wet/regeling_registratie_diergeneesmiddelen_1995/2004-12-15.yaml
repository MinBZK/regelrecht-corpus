  - number: 20g
    text: |-
      1 Op een aanvraag tot een ingrijpende wijziging is [paragraaf 3.1.1.][ref1] van overeenkomstige toepassing, met
      dien verstande dat een besluit omtrent de wijziging binnen de volgende termijn wordt genomen:

      a. 120 dagen nadat door het Bureau de ontvangst van de aanvraag is bevestigd aan de aanvrager, ingeval de wijziging
      betrekking heeft op de diersoorten waarbij het diergeneesmiddel kan worden toegepast;

      b. 90 dagen nadat door het Bureau de ontvangst van een aanvraag daartoe is bevestigd aan de aanvrager in andere
      gevallen.

      2 De termijn, bedoeld in het eerste lid, onderdeel b, kan met 30 dagen worden verlengd indien de wijziging
      betrekking heeft op de therapeutische indicaties van het diergeneesmiddel.

      3 De aanvraag heeft betrekking op één wijziging.

      4 Indien uit een wijziging andere wijzigingen voortvloeien kan de aanvraag in afwijking van het derde lid tevens op
      die andere wijzigingen betrekking hebben.


