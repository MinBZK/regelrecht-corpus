      1 De netbeheerder van het landelijk gastransportnet verzoekt binnen twee maanden na inwerkingtreding van
      [artikel II, onderdeel C][ref1], aan de Autoriteit Consument en Markt te besluiten of is voldaan aan het bepaalde
      bij of krachtens de [artikelen 2c][ref2] en [3b van de Gaswet][ref3].

      2 Gedurende de procedure, bedoeld in [artikel 2, tweede tot en met zevende lid, van de Gaswet][ref4] behoeft de
      netbeheerder van het landelijk gastransportnet niet te beschikken over een besluit als bedoeld in artikel 2, tweede
      lid, van de Gaswet.

      3 Na het besluit, bedoeld in het eerste lid, neemt Onze Minister een besluit over de aanwijzing van de netbeheerder
      van het landelijk gastransportnet.

      4 Indien uit het besluit, bedoeld in het eerste lid, blijkt dat de netbeheerder van het landelijk gastransportnet
      niet voldoet aan het bepaalde bij of krachtens [artikel 2 van de Gaswet][ref5], vervalt de aanwijzing van de
      netbeheerder van het landelijk gastransportnet één jaar na de datum van dat besluit.

      5 Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing op een interconnector-
      beheerder, met dien verstande dat de Autoriteit Consument en Markt voor ontheffingen, verleend op basis van
      [artikel 18h van de Gaswet][ref6] voor het tijdstip van inwerkingtreding van [artikel II, onderdeel AB][ref7],
      besluit of is voldaan aan de in de ontheffing opgenomen voorwaarden in plaats van of is voldaan aan het
      bepaalde bij of krachtens [artikel 2c][ref8] en [3b van de Gaswet][ref9] en met dien verstande dat de
      termijn van twee maanden, genoemd in het eerste lid, indien een verzoek wordt ingediend als bedoeld in
      [artikel XX, tweede lid][ref10], aanvangt op het moment dat Onze Minister een besluit heeft genomen als bedoeld in
      artikel XX, eerste lid.


