  - number: XX
    text: |-
      1 Onze Minister kan ten aanzien van een onderneming die deelneemt in een interconnector-beheerder die voor de
      inwerkingtreding van dit artikel als zodanig is aangewezen, een besluit nemen over door deze onderneming te treffen
      maatregelen die er voor zorgen of er aan bijdragen dat de interconnector-beheerder voldoet aan het bepaalde bij
      algemene maatregel van bestuur, bedoeld in [artikel 2b, zesde lid, van de Gaswet][ref1].

      2 Aan een besluit als bedoeld in het eerste lid, ligt een verzoek ten grondslag van een interconnector-
      beheerder, waarin die motiveert dat aan het bepaalde bij algemene maatregel van bestuur, bedoeld in
      [artikel 2b, zesde lid, van de Gaswet][ref2] niet wordt voldaan als gevolg van een gebrek aan medewerking van een
      onderneming die in hem deelneemt.

      3 Bij het doen van een verzoek als bedoeld in het tweede lid, verstrekt een interconnector-beheerder informatie
      waaruit blijkt welke inspanningen hij heeft verricht tot het verkrijgen van de noodzakelijke medewerking van een
      onderneming, die in hem deelneemt.

      4 Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op een onderneming die is verbonden met
      een onderneming als in die leden bedoeld.

      5 Onze Minister kan ten aanzien van een voor de inwerkingtreding van dit artikel aangewezen interconnector-
      beheerder een besluit nemen over de voorwaarden waaronder en de wijze waarop deze interconnector-beheerder
      medewerking mag eisen van een onderneming die in haar deelneemt om te voldoen aan het bepaalde bij algemene
      maatregel van bestuur, bedoeld in [artikel 2b, zesde lid, van de Gaswet][ref3].

      6 Aan een besluit als bedoeld in het vijfde lid, ligt een verzoek ten grondslag van een onderneming die in een
      interconnector-beheerder deelneemt, waarin zij motiveert dat de verlangde medewerking om de interconnector-
      beheerder in staat te stellen te voldoen aan het bepaalde bij algemene maatregel van bestuur, bedoeld in
      [artikel 2b, zesde lid, van de Gaswet][ref4] voor haar of een met haar verbonden onderneming onevenredig zware
      gevolgen heeft.

      7 Bij het doen van een verzoek als bedoeld in het zesde lid, verstrekt een onderneming als bedoeld in het vijfde
      lid, informatie waaruit naar haar oordeel blijkt dat zij onevenredig zwaar wordt getroffen indien de geëiste
      medewerking wordt verleend en vermeldt zij alternatieven voor die medewerking.

      8 De Autoriteit Consument en Markt kan in geval een besluit als bedoeld in het eerste of vijfde lid niet of niet
      juist wordt uitgevoerd binnen de in dat besluit genoemde termijn een last onder dwangsom opleggen aan degene tot
      wie dat besluit zich richt.

      9 De Autoriteit Consument en Markt kan in geval van een besluit als bedoeld in het eerste of vijfde lid niet of
      niet juist wordt uitgevoerd binnen de in dat besluit genoemde termijn, degene tot wie dat besluit zich richt per
      overtreding van dat besluit een bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 1%
      van de omzet van de overtreder.

      10 De bestuurlijke boete die ingevolge het negende lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref5], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


