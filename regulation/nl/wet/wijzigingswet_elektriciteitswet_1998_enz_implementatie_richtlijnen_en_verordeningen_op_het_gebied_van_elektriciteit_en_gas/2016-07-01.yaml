  - number: VI
    text: |-
      1 Degene aan wie een ontheffing als bedoeld in
      [artikel 2a, eerste lid, met uitzondering van het eerste lid, onderdeel b van de Gaswet][ref1] zoals dit luidde
      voor het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref2], is verleend, kan de Autoriteit
      Consument en Markt verzoeken om een ontheffing op basis van artikel 2a van de Gaswet. Dit verzoek wordt ingediend
      binnen vier maanden na de datum van inwerkingtreding van artikel II, onderdeel D.

      2 Indien niet binnen vier maanden na inwerkingtreding van [artikel II, onderdeel D][ref3], door degene aan wie een
      ontheffing als bedoeld in het eerste lid is verleend, een verzoek is ingediend, vervalt de ontheffing één jaar na
      het tijdstip van inwerkingtreding van artikel II, onderdeel D.

      3 De Autoriteit Consument en Markt beslist uiterlijk tien maanden na ontvangst van een verzoek als bedoeld in het
      eerste lid op dit verzoek.

      4 Indien ingevolge een besluit van de Autoriteit Consument en Markt ontheffing wordt verleend op basis van
      [artikel 2a van de Gaswet][ref4], vervalt de ontheffing als bedoeld in het eerste lid op het tijdstip waarop het
      besluit van de Autoriteit Consument en Markt onherroepelijk wordt.

      5 Indien ingevolge een besluit van de Autoriteit Consument en Markt geen ontheffing wordt verleend op basis van
      [artikel 2a van de Gaswet][ref5], vervalt de ontheffing als bedoeld in het eerste lid vier maanden na het tijdstip
      waarop het besluit van de Autoriteit Consument en Markt onherroepelijk is geworden.

      6 Een ontheffing als bedoeld in het eerste lid kan Onze Minister intrekken op grond van
      [artikel 2a, vierde lid, van de Gaswet][ref6] zoals dit luidde voor het tijdstip van inwerkingtreding van
      [artikel II, onderdeel D][ref7], uiterlijk tot het tijdstip waarop een besluit van de Autoriteit Consument en Markt
      onherroepelijk is geworden.

      7 Een ontheffing als bedoeld in [artikel 2a, eerste lid, onderdeel b, van de Gaswet][ref8] zoals dit luidde voor
      het tijdstip van inwerkingtreding van [artikel II, onderdeel D][ref9], en die is verleend of is aangevraagd voor
      15 februari 2012 vervalt op een bij koninklijk besluit te bepalen tijdstip. Voor deze ontheffing blijven de regels
      gelden zoals die golden voor het tijdstip van inwerkingtreding van artikel II, onderdeel D.


