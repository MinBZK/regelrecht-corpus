preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Elektriciteitswet 1998 en de Gaswet aan te passen
    aan de nieuwe richtlijnen en verordeningen op het gebied van elektriciteit en gas;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031815/2016-07-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 Degene aan wie een vrijstelling of ontheffing als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____ zoals dit luidde voor het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref2], is verleend, kan
      de Autoriteit Consument en Markt verzoeken om een ontheffing op basis van artikel 15 van de Elektriciteitswet 1998.
      Dit verzoek wordt ingediend binnen vier maanden na de datum van inwerkingtreding van artikel I, onderdeel M.

      2 Indien niet binnen vier maanden na de inwerkingtreding van [artikel I, onderdeel M][ref3], door degene aan wie
      een vrijstelling of ontheffing als bedoeld in het eerste lid is verleend, een verzoek is ingediend, vervalt de
      vrijstelling of ontheffing één jaar na het tijdstip van inwerkingtreding van artikel I, onderdeel M.

      3 De Autoriteit Consument en Markt beslist uiterlijk tien maanden na ontvangst van een verzoek als bedoeld in het
      eerste lid op dit verzoek.

      4 Indien ingevolge een besluit van de Autoriteit Consument en Markt ontheffing wordt verleend op basis van
      [artikel 15 van de Elektriciteitswet 1998][ref4], vervalt de vrijstelling of ontheffing als bedoeld in het eerste
      lid op het tijdstip waarop het besluit van de Autoriteit Consument en Markt onherroepelijk wordt.

      5 Indien ingevolge een besluit van de Autoriteit Consument en Markt geen ontheffing wordt verleend op basis
      van [artikel 15 van de Elektriciteitswet 1998][ref5], vervalt de vrijstelling of ontheffing als bedoeld in het
      eerste lid vier maanden na het tijdstip waarop het besluit van de Autoriteit Consument en Markt onherroepelijk
      is geworden.

      6 Een ontheffing als bedoeld in het eerste lid kan Onze Minister intrekken op grond van
      [artikel 15, vijfde lid][ref6], zoals dit luidde voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel M][ref7], uiterlijk tot het tijdstip waarop een besluit van de Autoriteit Consument en Markt
      onherroepelijk is geworden.

      7 Een ontheffing als bedoeld in [artikel 15, tweede lid, onderdeel b, van de Elektriciteitswet 1998][ref8] zoals
      dit luidde voor het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref9] en die is verleend of is
      aangevraagd voor 15 februari 2012, vervalt op een bij koninklijk besluit te bepalen tijdstip. Voor deze ontheffing
      blijven de regels gelden zoals die golden voor het tijdstip van inwerkingtreding van artikel I, onderdeel M.


