  - number: VIII
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet verzoekt binnen twee maanden na inwerkingtreding van
      [artikel I, onderdeel F][ref1], aan de Autoriteit Consument en Markt te besluiten of is voldaan aan het bepaalde
      bij of krachtens de [artikelen 10a][ref2] en [10b van de Elektriciteitswet 1998][ref3].

      2 Gedurende de procedure, bedoeld in [artikel 10, derde tot en met achtste lid, van de Elektriciteitswet 1998][ref4]
      behoeft de netbeheerder van het landelijk hoogspanningsnet niet te beschikken over een besluit als bedoeld in
      artikel 10, derde lid, van de Elektriciteitswet 1998.

      3 Na het besluit, bedoeld in het eerste lid, neemt Onze Minister een besluit over de aanwijzing van de netbeheerder
      van het landelijk hoogspanningsnet.

      4 Indien uit het besluit, bedoeld in het eerste lid blijkt dat de netbeheerder van het landelijk hoogspanningsnet
      niet voldoet aan het bepaalde bij of krachtens [artikel 10a][ref5] en [10b van de Elektriciteitswet 1998][ref6],
      vervalt de aanwijzing van de netbeheerder van het landelijk hoogspanningsnet één jaar na de datum van dat besluit.

      5 Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing op een interconnector-
      beheerder met dien verstande dat de Autoriteit Consument en Markt voor ontheffingen, verleend op
      basis van [artikel 86c van de Elektriciteitswet 1998][ref7] voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel AG][ref8], besluit of is voldaan aan de in de ontheffing opgenomen voorwaarden in plaats van
      of is voldaan aan het bepaalde bij of krachtens [artikel 10a][ref9] en [10b van de Elektriciteitswet 1998][ref10].


