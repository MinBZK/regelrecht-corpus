  - number: XXI
    text: |-
      Op ontheffingen die zijn verleend op basis van artikel 17 van [verordening (EG) nr. 714/2009](32009R0714) van
      het Europees Parlement en de Raad van 13 juli 2009 betreffende de voorwaarden voor toegang tot het net voor
      grensoverschrijdende handel in elektriciteit en tot intrekking van [Verordening (EG) nr. 1228/2003](32003R1228)
      (Pb EU 2009, L 211) en op basis van [artikel 18h van de Gaswet][ref1] zoals dit luidde voor het tijdstip van
      inwerkingtreding van [artikel II, onderdeel AB][ref2], blijven de bepalingen van toepassing zoals die golden
      ingevolge [verordening (EG) nr. 1228/2003](32003R1228) van 26 juni 2003 betreffende de voorwaarden voor toegang tot
      het net voor grensoverschrijdende handel in elektriciteit (PbEU L 176) en de [Gaswet][ref3] zoals dat luidde op de
      dag voor het tijdstip van inwerkingtreding van artikel II, onderdeel AB.


