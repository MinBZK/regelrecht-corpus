$id: wet_gewetensbezwaren_militaire_dienst
regulatory_layer: WET
publication_date: '2019-04-25'
valid_from: '2002-01-01'
bwb_id: BWBR0002386
url: https://wetten.overheid.nl/BWBR0002386/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een nieuwe regeling ter uitvoering van artikel 196
    van de Grondwet te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Deze wet verstaat onder: "militair": hij, die behoort tot de krijgsmacht, ook gedurende de tijd, dat hij niet in
      werkelijke dienst is; "vervangende dienst": de dienst, waartoe hij, die ingevolge deze wet van de krijgsdienst is
      vrijgesteld, verplicht is ter vervanging van de krijgsdienst; "gewone vervangende dienst": de vervangende dienst,
      welke vervuld wordt in de plaats van de militaire dienst, welke hij, die ingevolge deze wet van de krijgsdienst
      is vrijgesteld, als militair in gewone omstandigheden zou moeten volbrengen; "buitengewone vervangende dienst": de
      vervangende dienst, welke vervuld wordt in geval van buitengewone omstandigheden, voor zover deze niet is gewone
      vervangende dienst; "tewerkgestelde": hij, die voor vervangende dienst is opgeroepen van het ogenblik af, dat hij
      op de plaats van zijn eerste bestemming is aangekomen tot het tijdstip, waarop hij met groot verlof wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel1
  - number: '1.2'
    text: |-
      Waar in deze wet wordt gesproken over personen, die ongeschikt blijken te zijn, vrijgesteld zijn van de vervangende
      dienst of van de gewone vervangende dienst, disciplinair gestraft of veroordeeld zijn, worden hieronder - voor
      zover het tegendeel niet blijkt - uitsluitend verstaan diegenen, omtrent wie de desbetreffende beslissing of
      uitspraak onherroepelijk is geworden, dan wel voor wie de beroepstermijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      Waar in deze wet wordt gesproken van het oproepen voor de vervangende dienst of het aan deze oproeping gevolg
      geven, wordt daaronder ten aanzien van hen, die reeds tewerkgesteld zijn, verstaan het doen voortduren dan wel het
      blijven vervullen van de vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel1
  - number: '1.4'
    text: |-
      Waar in deze wet wordt gesproken van broeder wordt daaronder verstaan de broeder onderscheidenlijk halfbroeder en
      wordt daaronder mede begrepen de zuster onderscheidenlijk halfzuster.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Ernstige gewetensbezwaren in de zin van deze wet zijn de onoverkomelijke gewetensbezwaren tegen de persoonlijke
      vervulling van militaire dienst in verband met het gebruik van middelen van geweld waarbij men door
      dienstvervulling in de Nederlandse krijgsmacht kan worden betrokken.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Hij, die in kennis is gesteld van zijn geschiktheid voor de militaire dienst, zomede de militair, kan Onze Minister
      van Defensie verzoeken zijn bezwaren als ernstige gewetensbezwaren te erkennen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister van Defensie doet een onderzoek instellen naar de vraag of de bezwaren zijn aan te merken als
      ernstige gewetensbezwaren. Onze Minister van Defensie kan het inwinnen van een advies achterwege laten, indien het
      een hernieuwd verzoek betreft.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Hij, die een verzoek als bedoeld in [artikel 3][ref1] heeft gedaan, kan door Onze Minister van Defensie, in
      afwachting van een beslissing daarop, geheel of gedeeltelijk van dienstverrichtingen worden vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Ingeval tegen een persoon, die een verzoek heeft gedaan als bedoeld in [artikel 3][ref1], een strafvervolging
      aanhangig is wegens overtreding van [artikel 139 van het Wetboek van Militair Strafrecht][ref2], wegens
      ongehoorzaamheid aan enig dienstbevel of dienstvoorschrift, dan wel wegens overtreding van artikel 45 der
      Dienstplichtwet, kan deze strafvervolging in afwachting van een beslissing op dat verzoek, worden geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel139
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '139'
  - number: '4.3'
    text: |-
      De schorsing van de strafvervolging, bedoeld in het tweede lid, vindt in ieder geval plaats, zodra het onderzoek
      als bedoeld in [artikel 3, tweede lid][ref1], wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Het in [artikel 3, tweede lid][ref1], bedoelde onderzoek wordt verricht door een of meer leden van een commissie
      van advies. De leden van de commissie worden bij koninklijk besluit benoemd en ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: '5.2'
    text: De commissie brengt advies uit, nadat de verzoeker in de gelegenheid is gesteld ter zitting te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel5
  - number: '7.1'
    text: |-
      Indien Onze Minister van Defensie van oordeel is, dat de bezwaren zijn aan te merken als ernstige gewetensbezwaren,
      zal hij die bezwaren als zodanig erkennen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien verzoeker zonder gegronde redenen niet voor het onderzoek ter zitting voor de commissie, bedoeld in
      [artikel 5][ref1], is verschenen, wordt het verzoek in ieder geval afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel5
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '5'
        hoofdstuk: II
  - number: 7a.1
    text: |-
      Indien de verzoeker bezwaar maakt tegen een besluit tot afwijzing van het verzoek om erkenning, beslist Onze
      Minister van Defensie op dat bezwaar na advies van de commissie, bedoeld in [artikel 5, eerste lid][ref1]. De
      commissie adviseert nadat zij met ten minste drie leden een onderzoek heeft ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel5
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '5'
        hoofdstuk: II
  - number: 7a.2
    text: |-
      In de gevallen genoemd in [artikel 7:3, onder ][ref1] wint Onze Minister van Defensie geen advies als bedoeld in
      het eerste lid in.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7b
    text: |-
      Tegen een beschikking op grond van [hoofdstuk II][ref1] kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002386
        hoofdstuk: II
  - number: 7c
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel7c
  - number: '8.1'
    text: |-
      Een beschikking op grond van [artikel 4][ref1] blijft van kracht totdat de afwijzing van een verzoek omtrent
      erkenning als gewetensbezwaarde onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel4
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '4'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Zolang de beroepstermijn niet is verstreken, dan wel op een tegen een beschikking omtrent erkenning als
      gewetensbezwaarde ingesteld beroep als bedoeld in [artikel 7][ref1] niet is beslist, kan Onze Minister van Defensie
      alsnog toepassing geven aan het bepaalde in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel4
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: 7b
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002386
        artikel: '4'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      Hij, wiens bezwaren tegen de vervulling van de militaire dienst als ernstige gewetensbezwaren zijn erkend, is onder
      alle omstandigheden vrijgesteld van de krijgsdienst. Evenmin mogen hem werkzaamheden worden opgedragen, welke naar
      hun aard er slechts op gericht kunnen zijn de krijgsmacht hulp te verlenen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel9
  - number: '9.2'
    text: Hij is verplicht tot het vervullen van vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      De militair, die ingevolge deze wet van de krijgsdienst is vrijgesteld, wordt zo spoedig mogelijk uit de militaire
      dienst ontslagen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Het recht tot strafvordering terzake van een delict, als bedoeld in [artikel 4, tweede lid][ref1], vervalt, zodra
      de gewetensbezwaren van de verdachte zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel4
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '4'
        hoofdstuk: II
  - number: '11'
    text: |-
      Hij, die ingevolge deze wet van de krijgsdienst is vrijgesteld, wordt op of zo spoedig mogelijk na de datum, waarop
      hij zijn militaire dienst zou moeten aanvangen of voortzetten, door of vanwege Onze Minister van Sociale Zaken en
      Werkgelegenheid voor de vervangende dienst opgeroepen. Hij is verplicht aan deze oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      De duur van de gewone vervangende dienst is een derde langer dan die van het verplichte verblijf onder de wapenen
      voor eerste oefening van het merendeel der dienstplichtigen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      De duur van de gewone vervangende dienst wordt voor de dienstplichtige, die ingevolge deze wet van de krijgsdienst
      is vrijgesteld, verminderd met de duur van de militaire dienst, die hij reeds als dienstplichtige heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan de duur van de gewone vervangende dienst verkorten
      ten aanzien van hem, die vóór zijn ontslag uit de militaire dienst ingevolge deze wet, bij de krijgsmacht als
      vrijwilliger verbonden was en ten aanzien van de dienstplichtige, die vóór zijn ontslag uit de militaire dienst
      ingevolge deze wet, de eerste oefening reeds heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      De duur van de buitengewone vervangende dienst is gelijk aan de tijd gedurende welke degene, die ingevolge deze wet
      van de krijgsdienst is vrijgesteld, als militair ingeval van buitengewone omstandigheden verplicht onder de wapenen
      zou zijn geweest. Indien de gewone vervangende dienst niet is vervuld, duurt de buitengewone vervangende dienst zes
      maanden langer.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      De vervangende dienst wordt vervuld bij overheidsdiensten, dan wel bij, door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen, voor tewerkstelling van gewetensbezwaarden geschikte instellingen, die in het algemeen
      belang werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan aan de tewerkstelling, anders dan bij overheidsdiensten,
      voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid bepaalt bij welke instantie of in wiens dienst de tewerkstelling
      plaats vindt.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel13
  - number: '14'
    text: |-
      De tewerkgestelde is verplicht de opdrachten en voorschriften naar behoren na te leven, die hem worden gegeven
      of voor hem zijn vastgesteld door of vanwege Onze Minister van Sociale Zaken en Werkgelegenheid of degene aan wie
      bij de instelling of dienst van tewerkstelling de bevoegdheid tot het geven van opdrachten of het vaststellen van
      voorschriften krachtens bijzondere aanwijzing of ten aanzien van aldaar werkzame werknemers uit hoofde van zijn
      functie toekomt. De tewerkgestelde is voorts in het algemeen verplicht zich tijdens de vervangende dienst naar
      behoren te gedragen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel14
  - number: '15.1'
    text: 'Vrijstelling van de gewone vervangende dienst wordt verleend wegens:'
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: 15.1.a
    text: kostwinnerschap;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: 15.1.b
    text: persoonlijke onmisbaarheid;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: 15.1.c
    text: broederdienst;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: 15.1.d
    text: aanwezigheid van een bijzonder geval.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Vrijstelling van de vervangende dienst wordt verleend wegens het bekleden van een geestelijk ambt of opleiding tot
      zodanig ambt.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: '15.3'
    text: Omtrent het verlenen van vrijstelling beslist Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: '15.4'
    text: |-
      De vrijstelling wegens een der redenen, genoemd in het eerste lid, onder *a* en *b*, en in het tweede lid, wordt
      aanvankelijk voor een jaar verleend; blijkt ook bij de daarna te nemen beslissing nog grond voor vrijstelling
      aanwezig, dan wordt de vrijstelling voorgoed verleend, behoudens het geval, voorzien in de tweede volzin van het
      vijfde lid. De vrijstelling wegens de reden genoemd in het eerste lid, onder *d*, wordt hetzij voorgoed, hetzij
      voor een bepaalde duur verleend. De vrijstelling wegens de reden, genoemd in het eerste lid, onder *c*, wordt
      uitsluitend voorgoed verleend.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: '15.5'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan de tijdelijke vrijstelling wegens een der redenen, genoemd
      in het eerste lid, onder *a* en *b*, intrekken, indien blijkt, dat de grond voor de vrijstelling niet meer bestaat.
      De vrijstelling wegens de reden, genoemd in het tweede lid, houdt op te gelden, zodra de vrijgestelde ophoudt te
      verkeren in een geval als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      Vrijstelling wegens kostwinnerschap wordt verleend aan hem, door wiens vervulling van de gewone vervangende dienst
      voldoende middelen tot levensonderhoud aan andere personen ontbreken of zouden komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
  - number: '16.2'
    text: 'Onder personen, in het vorig lid bedoeld, worden uitsluitend begrepen:'
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
  - number: 16.2.a
    text: |-
      de echtgenote of geregistreerde partner van een persoon als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
        hoofdstuk: III
  - number: 16.2.b
    text: zijn bloed- en aanverwanten in de rechte linie;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
  - number: 16.2.c
    text: zijn andere bloed- en aanverwanten in de tweede graad;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
  - number: 16.2.d
    text: zijn pleegouders;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
  - number: 16.2.e
    text: degenen, in wier onderhoud hij ingevolge rechterlijk vonnis moet voorzien.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
  - number: '16.3'
    text: |-
      De vrijstelling blijft achterwege, indien Onze Minister van Sociale Zaken en Werkgelegenheid bepaalt, dat
      vergoeding zal worden toegekend als in [artikel 26][ref1] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel26
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '26'
        hoofdstuk: IV
  - number: '17'
    text: |-
      Vrijstelling wegens persoonlijke onmisbaarheid wordt verleend aan hem, door wiens vervulling van de gewone
      vervangende dienst onoverkomelijke bezwaren zouden ontstaan voor de instandhouding der middelen van bestaan van
      personen als in [artikel 16, tweede lid][ref1], bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel16
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '16'
        hoofdstuk: IV
  - number: '18.1'
    text: |-
      Vrijstelling wegens broederdienst wordt verleend aan hem, die tenminste twee broeders heeft of gehad heeft, die
      dienen of gediend hebben bij de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      In een van deze gevallen wordt geacht te verkeren de broeder, die vóór het door Ons te bepalen tijdstip gedurende
      zijn verblijf in werkelijke dienst is overleden, alsmede de broeder, die op evenbedoeld tijdstip:
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: 18.2.a
    text: ten minste 30 dagen in werkelijke dienst is geweest of
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: 18.2.b
    text: |-
      ten gevolge van verleend uitstel van eerste oefening nog niet of nog geen 30 dagen in werkelijke dienst is geweest
      of
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: 18.2.c
    text: in het genot is of is geweest van militair pensioen of van pensioen, verleend ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Wij bepalen welke dienst, in verband met zijn bijzondere aard, voor de toepassing van het bepaalde in het tweede
      lid, aanhef en onder *a*, als broederdienst buiten aanmerking blijft.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: '18.4'
    text: |-
      Voor de toepassing van het bepaalde in het tweede lid aanhef en onder *a* en *b*, wordt als werkelijke dienst ook
      beschouwd het vervullen van vervangende dienst en onder uitstel van eerste oefening ook uitstel van het vervullen
      van gewone vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: '18.5'
    text: |-
      Het bepaalde in het tweede lid, onder *b*, is slechts van toepassing, als het uitstel van eerste oefening is
      verleend na 1945.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel18
  - number: '19'
    text: |-
      Vrijstelling om reden genoemd in [artikel 15, tweede lid][ref1], wordt met inachtneming van regelen bij algemene
      maatregel van bestuur te stellen, verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel15
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '15'
        hoofdstuk: IV
  - number: '21'
    text: |-
      Blijkt, dat iemand ten onrechte van de gewone vervangende dienst dan wel van de vervangende dienst is vrijgesteld
      doordat het bewijsstuk of een der bewijsstukken, waarop de vrijstelling is verleend, vals of vervalst is, een
      onvolledige of met de waarheid strijdige verklaring, getuigenis of opgaaf bevat, of een ander geldt dan hem, op wie
      het beschouwd werd betrekking te hebben, dan wordt de desbetreffende uitspraak door Onze Minister van Sociale Zaken
      en Werkgelegenheid vervallen verklaard en komen op de persoon, wie het geldt, de verplichtingen te rusten, als ware
      hij niet vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel21
  - number: 21a
    text: |-
      Tegen een beschikking op grond van [Hoofdstuk IV][ref1] omtrent vrijstelling kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        hoofdstuk: IV
  - number: '22.1'
    text: |-
      Onverminderd het bepaalde in het tweede lid is hij, die ingevolge deze wet van de krijgsdienst is vrijgesteld -
      behalve in andere bij deze wet voorziene gevallen - verplicht tot het vervullen van:
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel22
  - number: 22.1.a
    text: gewone vervangende dienst;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel22
  - number: 22.1.b
    text: buitengewone vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien hij als militair uitsluitend als buitengewoon dienstplichtige tot het verrichten van werkelijke dienst zou
      kunnen worden verplicht, is hij - behalve in andere bij deze wet voorziene gevallen - alleen verplicht tot het
      vervullen van buitengewone vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan hem, die ingevolge deze wet van de krijgsdienst is
      vrijgesteld, verplichten de gewone vervangende dienst bij gedeelten in twee of meer niet aansluitende tijdvakken
      te vervullen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien de in het eerste lid bedoelde verplichting wordt opgelegd als gevolg van omstandigheden onafhankelijk van de
      wil van de tewerkgestelde komt het tijdvak gelegen tussen de gedeelten van de vervangende dienst in mindering op de
      duur van de gewone vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel23
  - number: '24.1'
    text: |-
      Hij, die ingevolge deze wet van de krijgsdienst is vrijgesteld, wordt opgeroepen voor buitengewone vervangende
      dienst, indien hij zonder deze vrijstelling als militair buitengewoon in werkelijke dienst zou zijn geroepen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      Wij kunnen groepen van personen aanwijzen, die niet of voorlopig niet tot het vervullen van buitengewone
      vervangende dienst worden opgeroepen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel24
  - number: '25'
    text: |-
      De vervangende dienst kan voor de tewerkgestelde, indien deze voor groot verlof in aanmerking komt, worden
      verlengd:
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel25
  - number: 25.a
    text: gedurende evenveel dagen als hij door ongeoorloofde afwezigheid niet aan de dagelijkse dienst heeft deelgenomen;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel25
  - number: 25.b
    text: voor zover hij dit zelf verlangt, zolang hij ziek is en zijn toestand dit wenselijk maakt;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel25
  - number: 25.c
    text: |-
      zolang het vertrek met groot verlof gevaar zou opleveren voor de verspreiding van een heersende of geheerst
      hebbende besmettelijke ziekte.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      Heeft het vervullen van vervangende dienst ten gevolge, dat voldoende middelen tot levensonderhoud ontbreken of
      zouden komen te ontbreken aan personen, als in [artikel 16, tweede lid][ref1], bedoeld en wordt geen vrijstelling
      van de vervangende dienst verleend, dan wordt naar regelen bij algemene maatregel van bestuur te stellen aan
      bedoelde personen op hun verzoek een vergoeding uit ’s rijks kas toegekend. Ook in andere gevallen kan ter zake van
      het vervullen van vervangende dienst zodanige vergoeding worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel16
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '16'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      De gelden, benodigd voor de uitbetaling van de in dit artikel bedoelde vergoeding, worden voorgeschoten uit de
      gemeentekas, tenzij Onze Minister van Sociale Zaken en Werkgelegenheid dit niet nodig acht. Bij de regelen, omtrent
      het verlenen van het voorschot te stellen, kan van de bepalingen der [Gemeentewet][ref1] (*Stb.* 1992, 96) inzake
      het doen van betalingen uit de gemeentekas worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: '27.1'
    text: |-
      Hij, die ingevolge deze wet van de krijgsdienst is vrijgesteld, treedt in het genot van groot verlof zodra voor hem
      een tijdvak aanbreekt, waarin hij geen vervangende dienst verricht noch behoeft te verrichten.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Hij verricht in dat tijdvak, voor zover Onze Minister van Sociale Zaken en Werkgelegenheid dat nodig acht en op de
      wijze door Onze Minister van Sociale Zaken en Werkgelegenheid te bepalen, de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
  - number: 27.2.a
    text: opgeven van zijn adres;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
  - number: 27.2.b
    text: opgeven van vertrek naar en terugkeer uit het buitenland;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
  - number: 27.2.c
    text: verlenen van inzage van de hem in verband met deze wet uitgereikte bescheiden;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
  - number: 27.2.d
    text: |-
      in ontvangst nemen en beantwoorden van in verband met deze wet aan hem gerichte brieven, briefkaarten en
      telegrammen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
  - number: '27.3'
    text: |-
      Indien hij niet voldoet aan een ingevolge het tweede lid op hem rustende verplichting, kan hij deswege, boven
      de tijd, bepaald ingevolge [artikel 12][ref1], voor de tijd van ten hoogste twee maanden voor vervangende dienst
      worden opgeroepen. Onze Minister van Sociale Zaken en Werkgelegenheid bepaalt de duur van deze vervangende dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel12
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '12'
        hoofdstuk: IV
  - number: '28.1'
    text: |-
      Hij, die ingevolge deze wet van de krijgsdienst is vrijgesteld, wordt van de voor hem uit deze wet voortvloeiende
      verplichtingen ontslagen:
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: 28.1.a
    text: |-
      met ingang van 1 oktober van het jaar, waarin hij 35 jaar oud wordt, zo hij op het tijdstip van erkenning van zijn
      bezwaren de rang van onderofficier of officier niet bekleedde;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: 28.1.b
    text: |-
      met ingang van 1 oktober van het jaar, waarin hij 40 jaar oud wordt, zo hij op het tijdstip van erkenning van zijn
      bezwaren de rang van onderofficier bekleedde;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: 28.1.c
    text: |-
      met ingang van 1 oktober van het jaar, waarin hij 45 jaar oud wordt, zo hij op het tijdstip van erkenning van zijn
      bezwaren de rang van officier bekleedde;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: '28.2'
    text: |-
      Het ontslag, bedoeld in het eerste lid, kan worden opgeschort voor zolang hij op het in dat lid bedoelde tijdstip
      nog vervangende dienst heeft te verrichten.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: '28.3'
    text: 'In afwijking van het bepaalde in de twee voorgaande leden wordt hem zo spoedig mogelijk ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: 28.3.a
    text: |-
      indien blijkt, dat hij, zonder vrijstelling van de krijgsdienst, daarvoor wegens ziekte of gebreken voorgoed
      ongeschikt zou zijn;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: 28.3.b
    text: |-
      indien blijkt, dat hij, zonder vrijstelling van de krijgsdienst, daartoe ingevolge een verdrag met een vreemde
      staat niet verplicht zou zijn.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      Vervreemding, verpanding of belening van het aan de tewerkgestelde toekomende zakgeld is slechts geldig voor zover
      beslag op zijn zakgeld geldig zou zijn bij ontbreken van andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel29
  - number: '29.2'
    text: |-
      Een volmacht tot invordering van het zakgeld is slechts geldig, indien zij schriftelijk is verleend. Zij is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de vergoeding, bedoeld in
      [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel26
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '26'
        hoofdstuk: IV
  - number: '29.4'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel29
  - number: '30'
    text: |-
      De tewerkgestelde die zich gedraagt in strijd met [artikel 14][ref1] kan deswege disciplinair worden gestraft door
      een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel14
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '14'
        hoofdstuk: IV
  - number: '31.1'
    text: 'De disciplinaire straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: 31.1.a
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: 31.1.b
    text: geldboete, van ten minste € 2 en ten hoogste het bedrag van het zakgeld over een halve maand;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: 31.1.c
    text: verlenging van de duur van de gewone vervangende dienst met ten hoogste veertien dagen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: '31.2'
    text: |-
      Bij het opleggen van een straf kan worden bepaald dat deze geheel of ten dele niet ten uitvoer zal worden
      gelegd, indien de tewerkgestelde zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk
      plichtsverzuim, als waarvoor de bestraffing plaatsvindt, noch aan enig ander ernstig plichtsverzuim.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: '31.3'
    text: |-
      Een opgelegde geldboete kan worden geïnd door inhouding van het bedrag op het aan de tewerkgestelde toekomende
      zakgeld. Een geldboete kan niet worden geïnd, indien en voor zover daardoor de som van de in één kalendermaand te
      innen geldboeten, ingevolge deze wet aan de tewerkgestelde opgelegd, het bedrag gelijk aan één derde gedeelte van
      het zakgeld over één maand te boven zou gaan.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: '31.4'
    text: |-
      Bij beëindiging van de gewone vervangende dienst worden geldboeten, voor zover zij nog niet zijn geïnd, op het nog
      aan de tewerkgestelde toekomende zakgeld ingehouden.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
  - number: '31.5'
    text: |-
      Geen straf van verlenging kan worden opgelegd indien en voor zover als gevolg daarvan de krachtens
      [artikel 12][ref1] vastgestelde duur van de gewone vervangende dienst van de tewerkgestelde met meer dan dertig
      dagen zou worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel12
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '12'
        hoofdstuk: IV
  - number: '32.1'
    text: |-
      Geen straf wordt opgelegd of het voorwaardelijke karakter van een opgelegde straf herroepen dan nadat de
      tewerkgestelde in de gelegenheid is gesteld zich schriftelijk binnen zes maal vierentwintig uur te verantwoorden.
      Bij de uitnodiging zich te verantwoorden worden afschriften van de op de zaak betrekking hebbende stukken
      meegezonden, tenzij het belang van geheimhouding van gegevens of het belang van derden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel32
  - number: '32.2'
    text: |-
      De tewerkgestelde die zich overeenkomstig het eerste lid heeft verantwoord wordt op zijn verzoek in de gelegenheid
      gesteld ten overstaan van de strafoplegger dan wel een door deze aangewezen andere persoon een nadere mondelinge
      toelichting op zijn verantwoording te geven.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel32
  - number: '32.3'
    text: De strafoplegging of herroeping geschiedt schriftelijk en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel32
  - number: '32.4'
    text: |-
      De gestrafte ontvangt van de strafoplegging of herroeping onverwijld bericht door toezending of uitreiking van het
      daartoe strekkende besluit. Daarbij wordt hem medegedeeld binnen welke termijn en bij welke instantie hij beroep
      kan instellen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      De gestrafte kan binnen vijf dagen na de ontvangst van het in [artikel 32, vierde lid][ref1], bedoelde bericht
      beroep instellen bij de rechtbank te 's-Gravenhage. De straf, behalve die van berisping, wordt niet ten uitvoer
      gelegd zolang zij niet onherroepelijk is geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging
      is bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel32
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '32'
        hoofdstuk: V
  - number: '33.2'
    text: |-
      De behandeling van het beroep geschiedt door een meervoudige kamer van de rechtbank, welke zitting houdt
      en beslist met drie leden, van wie twee, onder wie de voorzitter, lid of plaatsvervangend lid zijn van de
      arrondissementsrechtbank en één niet tot de rechterlijke macht behoort. Laatstgenoemde en zoveel plaatsvervangers
      voor deze als Wij dienstig oordelen worden door Ons benoemd op voordracht van Onze Ministers van Justitie en van
      Sociale Zaken en Werkgelegenheid voor de tijd van vier jaren.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel33
  - number: '33.3'
    text: |-
      Aan de deskundige leden en hun plaatsvervangers wordt een vergoeding toegekend met overeenkomstige toepassing van
      de regels die gelden voor de rechters-plaatsvervangers. Op hen zijn [artikel 1c][ref1] en de [artikelen 46c][ref2],
      [46d][ref3], [46e][ref4], [46i met uitzondering van het eerste lid, onderdeel c][ref5], [46j][ref6], [46l][ref7] en
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46e
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
  - number: '33.4'
    text: |-
      Op de zittende leden van de in het tweede lid bedoelde kamer zijn de
      [artikelen 512-523 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: '34.1'
    text: |-
      Het beroep wordt ingesteld door indiening van een beroepschrift bij de griffie van de in
      [artikel 33, eerste lid][ref1], genoemde rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel33
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '33'
        hoofdstuk: V
  - number: '34.2'
    text: |-
      De rechtbank kan bij gemotiveerde beslissing verklaren, dat een na de beroepstermijn ingediend beroepschrift
      geacht wordt tijdig te zijn ingekomen indien de gestrafte redelijkerwijs niet geacht kan worden in verzuim te zijn
      geweest.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het beroep wordt zo spoedig mogelijk behandeld. De voorzitter van de in [artikel 33, tweede lid][ref1], bedoelde
      kamer bepaalt de dag van behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel33
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '33'
        hoofdstuk: V
  - number: '35.2'
    text: |-
      De gestrafte wordt ten minste zes dagen voor de behandeling van het beroep door de griffier opgeroepen. Daarbij
      wordt de gestrafte opmerkzaam gemaakt op de bevoegdheid zich door een raadsman te doen bijstaan, alsmede op het
      recht op kennisneming van de processtukken. Indien de gestrafte niet verschijnt en de rechtbank zijn aanwezigheid
      noodzakelijk acht, kan zij de behandeling van het beroep voor bepaalde tijd uitstellen en de oproeping van de
      gestrafte gelasten. Verschijnt deze ten dienende dage wederom niet, dan kan de rechtbank het beroep vervallen
      verklaren.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel35
  - number: '36.1'
    text: |-
      De behandeling van het beroep geschiedt ter openbare terechtzitting. De voorzitter heeft de leiding van de
      behandeling. Hij kan op verzoek van de gestrafte of om redenen aan de openbare orde ontleend gelasten dat de
      behandeling achter gesloten deuren plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel36
  - number: '36.2'
    text: |-
      De gestrafte kan zich door een raadsman doen bijstaan. De rechtbank kan weigeren personen, die geen advocaat zijn,
      als raadsman toe te laten.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel36
  - number: '36.3'
    text: |-
      De rechtbank is bevoegd getuigen en deskundigen schriftelijk te bevragen of op te roepen. Vergoeding
      van door getuigen en deskundigen gemaakte kosten geschiedt overeenkomstig het bepaalde krachtens de
      [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '37.1'
    text: |-
      De rechtbank beslist uiterlijk op de veertiende dag na afloop van de behandeling van het beroep in een
      schriftelijke, met redenen omklede, uitspraak.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel37
  - number: '37.2'
    text: |-
      De voorlezing van de uitspraak in beroep geschiedt in het openbaar en de uitspraak wordt de gestrafte uitgereikt
      of toegezonden. Een afschrift van de uitspraak wordt toegezonden aan degene die de straf in eerste aanleg heeft
      opgelegd en aan Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel37
  - number: '37.3'
    text: |-
      De rechtbank bevestigt in beroep de beslissing in eerste aanleg tot oplegging of uitvoerbaarverklaring van straf of
      vernietigt deze geheel of gedeeltelijk en doet de zaak zelf af.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel37
  - number: '37.4'
    text: |-
      Indien bij de beslissing in beroep een reeds geheel of gedeeltelijk ten uitvoer gelegde straf van verlenging van de
      duur van de gewone vervangende dienst wordt tenietgedaan of verminderd, bepaalt de rechtbank, volgens bij algemene
      maatregel van bestuur te stellen regelen, op welke wijze het door de gestrafte geleden nadeel zal worden hersteld.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel37
  - number: '37.5'
    text: Tegen de beslissing van de rechtbank staat geen verdere voorziening open.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel37
  - number: '38.1'
    text: Het recht van strafvordering vervalt door de toepassing van disciplinaire straf.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel38
  - number: '38.2'
    text: Boven de door de strafrechter uitgesproken straf zal geen disciplinaire straf worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel38
  - number: '52.1'
    text: |-
      Hij, die opzettelijk niet voldoet aan een wettige oproeping tot het vervullen van vervangende dienst, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel52
  - number: '52.2'
    text: |-
      Blijkt niet, dat het feit opzettelijk is gepleegd, dan wordt hij gestraft met gevangenisstraf van ten hoogste negen
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel52
  - number: '53.1'
    text: 'De tewerkgestelde, die opzettelijk ongeoorloofd afwezig is, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel53
  - number: 53.1.a
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie, indien die afwezigheid langer dan
      vier dagen duurt;
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel53
  - number: 53.1.b
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien die afwezigheid
      langer dan dertig dagen duurt dan wel de schuldige zich heeft verwijderd met het oogmerk zich voorgoed aan zijn
      dienstverplichtingen te onttrekken.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel53
  - number: '53.2'
    text: |-
      Onder afwezig zijn wordt verstaan het afwezig zijn van die plaats of plaatsen waar de tewerkgestelde zich ter
      vervulling van de op hem rustende dienstverplichtingen behoort te bevinden; onder zich verwijderen wordt mede
      begrepen het zich schuil houden, afwezig blijven of achterblijven van die plaats of plaatsen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel53
  - number: '54'
    text: |-
      De tewerkgestelde die zijn dienstverplichtingen stelselmatig niet nakomt wordt gestraft met gevangenisstraf van ten
      hoogste één jaar en negen maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel54
  - number: '55.1'
    text: |-
      De duur van een vrijheidsberoving ondergaan wegens overtreding van een der [artikelen 52][ref1],
      [53, eerste lid][ref2], en [54][ref3] komt in mindering op de duur van de gewone vervangende dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0002386#Artikel54
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '52'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002386
        artikel: '53'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002386
        artikel: '54'
        hoofdstuk: VI
  - number: '55.2'
    text: |-
      In gevallen waarin na toepassing van het eerste lid de tewerkgestelde nog verplicht is tot het vervullen van gewone
      vervangende dienst gedurende één maand of minder, kan Onze Minister van Sociale Zaken en Werkgelegenheid hem van
      deze verplichting ontslaan.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel55
  - number: 55a
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan degene, die op grond van [artikel 52, eerste lid][ref1], of
      wegens een misdrijf begaan tijdens de vervangende dienst onherroepelijk is veroordeeld tot een onvoorwaardelijke
      vrijheidsstraf, ontslaan van de voor hem uit deze wet voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel52
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '52'
        hoofdstuk: VI
  - number: '56.1'
    text: De strafbare feiten, omschreven in deze wet, worden aangemerkt als misdrijven.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel56
  - number: '56.2'
    text: |-
      Met betrekking tot de voorlopige hechtenis worden zij gelijkgesteld met misdrijven, waarop als maximum een
      gevangenisstraf van vier jaren of meer is gesteld.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel56
  - number: '56.3'
    text: |-
      Met het opsporen van deze feiten zijn, behalve de ambtenaren, aangewezen bij
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '56.4'
    text: |-
      Degenen, die ingevolge het voorgaande lid met de opsporing zijn belast, kunnen hem, die zich schuldig maakt aan een
      feit, strafbaar gesteld bij deze wet, na aanhouding overbrengen naar de plaats waar hij zich voor het vervullen van
      zijn dienstverplichtingen behoort te bevinden.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel56
  - number: '57.1'
    text: |-
      De voor de uitvoering van deze wet nodige regelen worden bij of krachtens algemene maatregel van bestuur
      vastgesteld, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel57
  - number: '57.2'
    text: |-
      Hierbij zal de rechtspositie van hen, die ingevolge deze wet van de krijgsdienst zijn vrijgesteld, zoveel mogelijk
      op gelijke wijze worden geregeld als die van de dienstplichtige militairen.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel57
  - number: '58'
    text: |-
      Alle stukken, die in verband met de bepalingen van deze wet of van de te harer uitvoering gegeven voorschriften
      worden gevorderd, ingediend, overgelegd of uitgereikt, zijn vrij van legesheffing, van kosten van legalisatie en
      van griffiekosten.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel58
  - number: '60.1'
    text: De Wet van 13 juli 1923, *Stb.* 357, betreffende dienstweigering wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel60
  - number: '60.2'
    text: |-
      De erkenning van gewetensbezwaren tegen de vervulling van militaire dienst ingevolge die wet en de toepassing van
      [artikel 3][ref1] daarvan worden geacht te zijn geschied ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: '60.3'
    text: |-
      De ten tijde van het in werking treden van deze wet ingediende, doch nog niet afgedane verzoekschriften, als
      bedoeld in artikel 1 van de wet van 13 juli 1923, *Stb.* 357, worden verder behandeld en afgedaan overeenkomstig de
      bepalingen van deze wet, met betrekking tot de verzoeken als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: 60a.1
    text: |-
      Ten aanzien van hen die ingevolge deze wet van de krijgsdienst zijn vrijgesteld, worden de
      [artikelen 11 tot en met 13][ref1] alsmede de [artikelen 22 tot en met 26][ref2] bij inwerkingtreding van de
      [Kaderwet dienstplicht][ref3] opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002386
        artikel: '22'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0008589
  - number: 60a.2
    text: |-
      Op hen die reeds de gewone vervangende dienst vervullen, blijven de in het eerste lid genoemde artikelen van
      kracht.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel60a
  - number: 60a.3
    text: |-
      [Hoofdstuk 4 van de Kaderwet dienstplicht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0008589
        hoofdstuk: '4'
  - number: '61'
    text: Deze wet kan worden aangehaald als "Wet gewetensbezwaren militaire dienst".
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel61
  - number: '62'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002386/2002-01-01#Artikel62
