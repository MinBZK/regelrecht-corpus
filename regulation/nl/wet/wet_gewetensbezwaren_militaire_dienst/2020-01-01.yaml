$id: wet_gewetensbezwaren_militaire_dienst
regulatory_layer: WET
publication_date: '2019-04-25'
valid_from: '2020-01-01'
bwb_id: BWBR0002386
url: https://wetten.overheid.nl/BWBR0002386/2020-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een nieuwe regeling ter uitvoering van artikel 196
    van de Grondwet te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: *«militair»:* degene die behoort tot de
      krijgsmacht, ook gedurende de tijd, dat deze niet in werkelijke dienst is; *«vervangende dienst»:* de dienst
      die verplicht wordt vervuld ter vervanging van de militaire dienst; *«erkende gewetensbezwaarde»* degene van
      wie bezwaren tegen de persoonlijke vervulling van de militaire dienst als ernstige gewetensbezwaren zijn erkend;
      *«groot verlof»:* de tijd gedurende welke de erkende gewetensbezwaarde geen vervangende dienst vervult of behoeft
      te vervullen; *«tewerkgestelde»:* degene die voor vervangende dienst is opgeroepen van het ogenblik af dat deze
      op de plaats van de eerste bestemming is aangekomen tot het tijdstip, waarop deze met groot verlof wordt gezonden;
      *«dienstplichtige»:* degene die ingevolge de [Kaderwet dienstplicht][ref1] geschikt is verklaard voor het vervullen
      van werkelijke dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: '1.2'
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt gesproken van personen die ongeschikt zijn verklaard,
      zijn erkend als gewetensbezwaarde, ontheven zijn van de verplichting tot het vervullen van de vervangende dienst
      in gewone omstandigheden, disciplinair gestraft of veroordeeld zijn, worden hieronder, voor zover het tegendeel
      niet blijkt, verstaan degenen omtrent wie het desbetreffende besluit of de desbetreffende uitspraak onherroepelijk
      is geworden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel1
  - number: '1.3'
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt gesproken van het oproepen voor de vervangende dienst
      wordt daaronder ten aanzien van hen die reeds de vervangende dienst vervullen verstaan het blijven vervullen van de
      vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Ernstige gewetensbezwaren in de zin van deze wet zijn de onoverkomelijke gewetensbezwaren tegen de persoonlijke
      vervulling van militaire dienst in verband met het gebruik van middelen van geweld waarbij men door
      dienstvervulling in de Nederlandse krijgsmacht kan worden betrokken.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Op aanvraag kan Onze Minister van Defensie de bezwaren van een dienstplichtige of een militair als ernstige
      gewetensbezwaren erkennen. De aanvraag vermeldt mede het registratienummer en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister van Defensie doet een onderzoek instellen naar de vraag of de bezwaren zijn aan te merken als
      ernstige gewetensbezwaren. Onze Minister van Defensie kan het inwinnen van een advies achterwege laten, indien het
      een hernieuwde aanvraag betreft.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel3
  - number: '4.1'
    text: |-
      Degene die een aanvraag heeft gedaan als bedoeld in [artikel 3, eerste lid][ref1], kan door Onze Minister, in
      afwachting van een beslissing daarop, geheel of gedeeltelijk van dienstverrichtingen worden vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Ingeval tegen degene die een aanvraag heeft gedaan als bedoeld in [artikel 3, eerste lid][ref1], een
      strafvervolging is ingesteld wegens overtreding van [artikel 139 van het Wetboek van Militair Strafrecht][ref2],
      wegens ongehoorzaamheid aan enig dienstbevel of dienstvoorschrift, dan wel wegens overtreding van
      [artikel 36 van de Kaderwet dienstplicht][ref3] kan het openbaar ministerie besluiten deze strafvervolging,
      in afwachting van een beslissing op die aanvraag, te schorsen. Ingeval van een hernieuwde aanvraag wordt geen
      schorsing verleend, tenzij bijzondere omstandigheden daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel139
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Artikel36
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '139'
      - id: ref3
        bwb_id: BWBR0008589
        artikel: '36'
  - number: '5.1'
    text: |-
      Het in [artikel 3, tweede lid][ref1], bedoelde onderzoek wordt verricht door een of meer leden van een commissie
      van advies. De leden van de commissie worden bij koninklijk besluit benoemd en ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel3
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '3'
        hoofdstuk: II
  - number: '5.2'
    text: De commissie brengt advies uit, nadat de aanvrager in de gelegenheid is gesteld ter zitting te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel5
  - number: '7.1'
    text: |-
      Indien Onze Minister van Defensie van oordeel is, dat de bezwaren zijn aan te merken als ernstige gewetensbezwaren,
      zal hij die bezwaren als zodanig erkennen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien aanvrager zonder gegronde redenen niet voor het onderzoek ter zitting voor de commissie, bedoeld in
      [artikel 5][ref1], is verschenen, wordt de aanvraag in ieder geval afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel5
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '5'
        hoofdstuk: II
  - number: 7a.1
    text: |-
      Indien de aanvrager bezwaar maakt tegen een besluit tot afwijzing van de aanvraag om erkenning, beslist Onze
      Minister van Defensie op dat bezwaar na advies van de commissie, bedoeld in [artikel 5, eerste lid][ref1]. De
      commissie adviseert nadat zij met ten minste drie leden een onderzoek heeft ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel5
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '5'
        hoofdstuk: II
  - number: 7a.2
    text: |-
      In de gevallen genoemd in [artikel 7:3, onder a tot en met e, van de Algemene wet bestuursrecht][ref1] wint Onze
      Minister van Defensie geen advies als bedoeld in het eerste lid in.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7c
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel7c
  - number: '8.1'
    text: |-
      Een beschikking op grond van [artikel 4][ref1] blijft van kracht totdat de afwijzing van een aanvraag omtrent
      erkenning als gewetensbezwaarde onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel4
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '4'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Zolang de beroepstermijn niet is verstreken, dan wel op een tegen een beschikking omtrent erkenning als
      gewetensbezwaarde ingesteld beroep als bedoeld in [artikel 7b][ref1] niet is beslist, kan Onze Minister van
      Defensie alsnog toepassing geven aan [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel4
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: 7b
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002386
        artikel: '4'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      De erkende gewetensbezwaarde is onder alle omstandigheden vrijgesteld van de militaire dienst. Evenmin mogen
      degene werkzaamheden worden opgedragen, welke naar hun aard er slechts op gericht kunnen zijn de krijgsmacht hulp
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      Onverminderd het vierde lid is de dienstplichtige die als gewetensbezwaarde is erkend, verplicht tot vervangende
      dienst in gewone omstandigheden en vervangende dienst in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel9
  - number: '9.3'
    text: De militair, die als gewetensbezwaarde is erkend, wordt zo spoedig mogelijk uit de militaire dienst ontslagen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel9
  - number: '9.4'
    text: |-
      De erkende gewetensbezwaarde die als dienstplichtige uitsluitend in buitengewone omstandigheden tot het vervullen
      van werkelijke dienst zou kunnen worden verplicht is alleen verplicht tot het vervullen van vervangende dienst in
      buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel9
  - number: '10'
    text: |-
      Het recht tot strafvordering terzake van een delict, als bedoeld in [artikel 4, tweede lid][ref1], vervalt, zodra
      de gewetensbezwaren van de verdachte zijn erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel4
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '4'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      De erkende gewetensbezwaarde wordt op of zo spoedig mogelijk na de datum, waarop deze zijn militaire dienst zou
      moeten aanvangen of voortzetten, door Onze Minister van Sociale Zaken en Werkgelegenheid voor de vervangende dienst
      opgeroepen. De erkende gewetensbezwaarde is verplicht aan deze oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      Voor vervangende dienst in gewone omstandigheden worden erkende gewetensbezwaarden ouder dan 35 jaar niet
      opgeroepen. In geval van buitengewone omstandigheden vindt geen oproeping van erkende gewetensbezwaarden ouder dan
      45 jaar plaats.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel11
  - number: '12.1'
    text: |-
      De duur van de vervangende dienst in gewone omstandigheden is een derde langer dan die van het verplichte verblijf
      onder de wapenen voor opleiding en oefening van het merendeel van de dienstplichtigen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel12
  - number: '12.2'
    text: |-
      De duur van de vervangende dienst in gewone omstandigheden wordt voor de dienstplichtige die als gewetensbezwaarde
      is erkend, verminderd met de duur van de werkelijke dienst die de betrokkene reeds als dienstplichtige in gewone
      omstandigheden heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan de duur van de vervangende dienst in gewone omstandigheden
      verkorten ten aanzien van de dienstplichtige, die voor het ontslag uit militaire dienst, de opleiding en oefening
      reeds heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel12
  - number: '12.4'
    text: |-
      De duur van de vervangende dienst in buitengewone omstandigheden is voor de erkende gewetensbezwaarde gelijk aan de
      periode gedurende welke de betrokkene als dienstplichtige in buitengewone omstandigheden in werkelijke dienst zou
      zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel12
  - number: '12.5'
    text: |-
      Voor zover de erkende gewetensbezwaarde bij aanvang van de vervulling van de vervangende dienst in buitengewone
      omstandigheden de vervangende dienst in gewone omstandigheden nog niet heeft volbracht, wordt voor de betrokkene
      de periode gedurende welke deze verplicht is tot vervulling van vervangende dienst in buitengewone omstandigheden
      verlengd. Voor zover als gevolg van beëindiging van de buitengewone omstandigheden geen of geen verdere toepassing
      kan worden gegeven aan de eerste volzin is de betrokkene nog verplicht tot vervulling van vervangende dienst in
      gewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel12
  - number: '12.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen groepen van personen worden aangewezen die niet of voorlopig niet tot het
      vervullen van vervangende dienst in buitengewone omstandigheden worden opgeroepen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel12
  - number: '13.1'
    text: |-
      De vervangende dienst wordt vervuld bij overheidsdiensten, dan wel bij, door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen, voor tewerkstelling van gewetensbezwaarden geschikte instellingen, die in het algemeen
      belang werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan aan de tewerkstelling, anders dan bij overheidsdiensten,
      voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid bepaalt bij welke instantie of in wiens dienst de tewerkstelling
      plaats vindt.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel13
  - number: '14'
    text: |-
      De tewerkgestelde is verplicht de opdrachten en voorschriften naar behoren na te leven, die de betrokkene worden
      gegeven of voor de betrokkene zijn vastgesteld door of vanwege Onze Minister van Sociale Zaken en Werkgelegenheid
      of degene aan wie bij de instelling of dienst van tewerkstelling de bevoegdheid tot het geven van opdrachten of
      het vaststellen van voorschriften krachtens bijzondere aanwijzing of ten aanzien van aldaar werkzame werknemers uit
      hoofde van zijn functie toekomt. De tewerkgestelde is voorts in het algemeen verplicht zich tijdens de vervangende
      dienst naar behoren te gedragen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel14
  - number: '15'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid verleent in bij algemene maatregel van bestuur nader aangewezen
      categorieën van gevallen ontheffing van de vervangende dienst in gewone omstandigheden wegens:
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel15
  - number: 15.a
    text: persoonlijke onmisbaarheid;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel15
  - number: 15.b
    text: de aanwezigheid van bijzondere omstandigheden;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel15
  - number: 15.c
    text: kostwinnerschap;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel15
  - number: 15.d
    text: het bekleden van een geestelijk ambt of het volgen van een opleiding tot een zodanig ambt; of
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel15
  - number: 15.e
    text: broeder- of zusterdienst.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel15
  - number: '16.1'
    text: Een ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel16
  - number: '16.2'
    text: Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel16
  - number: '16.3'
    text: 'Een ontheffing kan door Onze Minister van Sociale Zaken en Werkgelegenheid worden ingetrokken, wanneer:'
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel16
  - number: 16.3.a
    text: een of meer redenen waarom de ontheffing is verleend, zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel16
  - number: 16.3.b
    text: een of meer van de daaraan verbonden voorschriften niet worden nageleefd; of
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel16
  - number: 16.3.c
    text: |-
      na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de verlening
      bekend waren geweest, de ontheffing niet of niet in die vorm zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel16
  - number: '17'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de ontheffing.
      Een krachtens [artikel 15][ref1] of krachtens de eerste volzin vastgestelde algemene maatregel van bestuur treedt
      niet eerder in werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de
      plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel15
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '15'
        hoofdstuk: IV
  - number: '23.1'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan de dienstplichtige die als gewetensbezwaarde is erkend,
      verplichten de vervangende dienst in gewone omstandigheden bij gedeelten in twee of meer niet aansluitende
      tijdvakken te vervullen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien de in het eerste lid bedoelde verplichting wordt opgelegd als gevolg van omstandigheden onafhankelijk van de
      wil van de tewerkgestelde komt het tijdvak gelegen tussen de gedeelten van de vervangende dienst in mindering op de
      duur van de vervangende dienst in gewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel23
  - number: '25'
    text: |-
      De vervangende dienst kan voor de tewerkgestelde, indien deze voor groot verlof in aanmerking komt, worden
      verlengd:
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel25
  - number: 25.a
    text: gedurende evenveel dagen als deze door ongeoorloofde afwezigheid niet aan de dagelijkse dienst heeft deelgenomen;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel25
  - number: 25.b
    text: |-
      zolang het vertrek met groot verlof gevaar zou opleveren voor de verspreiding van een heersende of geheerst
      hebbende besmettelijke ziekte.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel25
  - number: '27.1'
    text: Het verlenen van groot verlof geschiedt door Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel27
  - number: '27.2'
    text: |-
      De erkende gewetensbezwaarde met groot verlof is verplicht om aan Onze Minister van Sociale Zaken en
      Werkgelegenheid aan te wijzen functionarissen inzage te verlenen van de aan de gewetensbezwaarde ter zake van de
      erkenning uitgereikte bescheiden alsmede om aan Onze Minister van Sociale Zaken en Werkgelegenheid desgevraagd alle
      gewenste inlichtingen te verschaffen in verband met de betreffende vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel27
  - number: '28'
    text: |-
      De uit deze wet voortvloeiende verplichtingen met betrekking tot het vervullen van vervangende dienst zijn niet
      langer van toepassing indien de betrokkene:
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel28
  - number: 28.a
    text: blijkt daarvoor wegens ziekte of gebreken voorgoed ongeschikt te zijn;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel28
  - number: 28.b
    text: blijkens een verdrag daartoe niet is verplicht; of
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel28
  - number: 28.c
    text: het Nederlanderschap verliest.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel28
  - number: '29.1'
    text: |-
      Vervreemding, verpanding of belening van het aan de tewerkgestelde toekomende zakgeld is slechts geldig voor zover
      beslag op zijn zakgeld geldig zou zijn bij ontbreken van andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel29
  - number: '29.2'
    text: |-
      Een volmacht tot invordering van het zakgeld is slechts geldig, indien zij schriftelijk is verleend. Zij is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel29
  - number: '29.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel29
  - number: '30'
    text: |-
      De tewerkgestelde die zich gedraagt in strijd met [artikel 14][ref1] kan deswege disciplinair worden gestraft door
      een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel14
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '14'
        hoofdstuk: IV
  - number: '31.1'
    text: 'De disciplinaire straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: 31.1.a
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: 31.1.b
    text: geldboete, van ten minste € 2 en ten hoogste het bedrag van het zakgeld over een halve maand;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: 31.1.c
    text: verlenging van de duur van de vervangende dienst in gewone omstandigheden met ten hoogste veertien dagen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: '31.2'
    text: |-
      Bij het opleggen van een straf kan worden bepaald dat deze geheel of ten dele niet ten uitvoer zal worden
      gelegd, indien de tewerkgestelde zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk
      plichtsverzuim, als waarvoor de bestraffing plaatsvindt, noch aan enig ander ernstig plichtsverzuim.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: '31.3'
    text: |-
      Een opgelegde geldboete kan worden geïnd door inhouding van het bedrag op het aan de tewerkgestelde toekomende
      zakgeld. Een geldboete kan niet worden geïnd, indien en voor zover daardoor de som van de in één kalendermaand te
      innen geldboeten, ingevolge deze wet aan de tewerkgestelde opgelegd, het bedrag gelijk aan één derde gedeelte van
      het zakgeld over één maand te boven zou gaan.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: '31.4'
    text: |-
      Bij beëindiging van de vervangende dienst in gewone omstandigheden worden geldboeten, voor zover zij nog niet zijn
      geïnd, op het nog aan de tewerkgestelde toekomende zakgeld ingehouden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
  - number: '31.5'
    text: |-
      Geen straf van verlenging kan worden opgelegd indien en voor zover als gevolg daarvan de krachtens
      [artikel 12][ref1] vastgestelde duur van de vervangende dienst in gewone omstandigheden van de tewerkgestelde met
      meer dan dertig dagen zou worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel12
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '12'
        hoofdstuk: IV
  - number: '32.1'
    text: |-
      Geen straf wordt opgelegd of het voorwaardelijke karakter van een opgelegde straf herroepen dan nadat de
      tewerkgestelde in de gelegenheid is gesteld zich schriftelijk binnen zes maal vierentwintig uur te verantwoorden.
      Bij de uitnodiging zich te verantwoorden worden afschriften van de op de zaak betrekking hebbende stukken
      meegezonden, tenzij het belang van geheimhouding van gegevens of het belang van derden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel32
  - number: '32.2'
    text: |-
      De tewerkgestelde die zich overeenkomstig het eerste lid heeft verantwoord wordt op verzoek in de gelegenheid
      gesteld ten overstaan van de strafoplegger dan wel een door deze aangewezen andere persoon een nadere mondelinge
      toelichting op de verantwoording te geven.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel32
  - number: '32.3'
    text: De strafoplegging of herroeping geschiedt schriftelijk en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel32
  - number: '32.4'
    text: |-
      De gestrafte ontvangt van de strafoplegging of herroeping onverwijld bericht door toezending of uitreiking van het
      daartoe strekkende besluit. Daarbij wordt degene medegedeeld binnen welke termijn en bij welke instantie degene
      beroep kan instellen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel32
  - number: '33.1'
    text: |-
      De gestrafte kan binnen vijf dagen na de ontvangst van het in [artikel 32, vierde lid][ref1], bedoelde bericht
      beroep instellen bij de rechtbank Den Haag. De straf, behalve die van berisping, wordt niet ten uitvoer gelegd
      zolang zij niet onherroepelijk is geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is
      bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel32
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '32'
        hoofdstuk: V
  - number: '33.2'
    text: |-
      De behandeling van het beroep geschiedt door een meervoudige kamer van de rechtbank, welke zitting houdt en beslist
      met drie leden, van wie twee, onder wie de voorzitter, lid of plaatsvervangend lid zijn van de rechtbank en één
      niet tot de rechterlijke macht behoort. Laatstgenoemde en zoveel plaatsvervangers voor deze als Wij dienstig
      oordelen worden door Ons benoemd op voordracht van Onze Ministers van Veiligheid en Justitie en van Sociale Zaken
      en Werkgelegenheid voor de tijd van vier jaren.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel33
  - number: '33.3'
    text: |-
      Aan de deskundige leden en hun plaatsvervangers wordt een vergoeding toegekend met overeenkomstige toepassing van
      de regels die gelden voor de rechters-plaatsvervangers. Op hen zijn [artikel 4][ref1] en de [artikelen 46c][ref2],
      [46ca][ref3], [46d][ref4], [46e][ref5], [46i met uitzondering van het eerste lid, onderdeel c][ref6], [46j][ref7],
      [46l][ref8] en [46m van de Wet rechtspositie rechterlijke ambtenaren][ref9] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46ca
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46e
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46m
  - number: '33.4'
    text: |-
      Op de zittende leden van de in het tweede lid bedoelde kamer zijn de [artikelen 512 tot en met 515][ref1] en de
      [artikelen 517][ref2] en [518 van het Wetboek van Strafvordering][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel517
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel518
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '517'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '518'
  - number: '34.1'
    text: |-
      Het beroep wordt ingesteld door indiening van een beroepschrift bij de griffie van de in
      [artikel 33, eerste lid][ref1], genoemde rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel33
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '33'
        hoofdstuk: V
  - number: '34.2'
    text: |-
      De rechtbank kan bij gemotiveerde beslissing verklaren, dat een na de beroepstermijn ingediend beroepschrift
      geacht wordt tijdig te zijn ingekomen indien de gestrafte redelijkerwijs niet geacht kan worden in verzuim te zijn
      geweest.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het beroep wordt zo spoedig mogelijk behandeld. De voorzitter van de in [artikel 33, tweede lid][ref1], bedoelde
      kamer bepaalt de dag van behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel33
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '33'
        hoofdstuk: V
  - number: '35.2'
    text: |-
      De gestrafte wordt ten minste zes dagen voor de behandeling van het beroep door de griffier opgeroepen. Daarbij
      wordt de gestrafte opmerkzaam gemaakt op de bevoegdheid zich door een raadsman te doen bijstaan, alsmede op het
      recht op kennisneming van de processtukken. Indien de gestrafte niet verschijnt en de rechtbank de aanwezigheid van
      de gestrafte noodzakelijk acht, kan zij de behandeling van het beroep voor bepaalde tijd uitstellen en de oproeping
      van de gestrafte gelasten. Verschijnt deze ten dienende dage wederom niet, dan kan de rechtbank het beroep
      vervallen verklaren.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel35
  - number: '36.1'
    text: |-
      De behandeling van het beroep geschiedt ter openbare terechtzitting. De voorzitter heeft de leiding van de
      behandeling. Hij kan op verzoek van de gestrafte of om redenen aan de openbare orde ontleend gelasten dat de
      behandeling achter gesloten deuren plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel36
  - number: '36.2'
    text: |-
      De gestrafte kan zich door een raadsman doen bijstaan. De rechtbank kan weigeren personen, die geen advocaat zijn,
      als raadsman toe te laten.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel36
  - number: '36.3'
    text: |-
      De rechtbank is bevoegd getuigen en deskundigen schriftelijk te bevragen of op te roepen. Vergoeding
      van door getuigen en deskundigen gemaakte kosten geschiedt overeenkomstig het bepaalde krachtens de
      [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '37.1'
    text: |-
      De rechtbank beslist uiterlijk op de veertiende dag na afloop van de behandeling van het beroep in een
      schriftelijke, met redenen omklede, uitspraak.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel37
  - number: '37.2'
    text: |-
      De voorlezing van de uitspraak in beroep geschiedt in het openbaar en de uitspraak wordt de gestrafte uitgereikt
      of toegezonden. Een afschrift van de uitspraak wordt toegezonden aan degene die de straf in eerste aanleg heeft
      opgelegd en aan Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel37
  - number: '37.3'
    text: |-
      De rechtbank bevestigt in beroep de beslissing in eerste aanleg tot oplegging of uitvoerbaarverklaring van straf of
      vernietigt deze geheel of gedeeltelijk en doet de zaak zelf af.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel37
  - number: '37.4'
    text: |-
      Indien bij de beslissing in beroep een reeds geheel of gedeeltelijk ten uitvoer gelegde straf van verlenging van
      de duur van de vervangende dienst in gewone omstandigheden wordt tenietgedaan of verminderd, bepaalt de rechtbank,
      volgens bij algemene maatregel van bestuur te stellen regelen, op welke wijze het door de gestrafte geleden nadeel
      zal worden hersteld.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel37
  - number: '37.5'
    text: Tegen de beslissing van de rechtbank staat geen verdere voorziening open.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel37
  - number: '38.1'
    text: Het recht van strafvordering vervalt door de toepassing van disciplinaire straf.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel38
  - number: '38.2'
    text: Boven de door de strafrechter uitgesproken straf zal geen disciplinaire straf worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel38
  - number: '52.1'
    text: |-
      Degene die opzettelijk niet voldoet aan een wettige oproeping tot het vervullen van vervangende dienst, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel52
  - number: '52.2'
    text: |-
      Blijkt niet, dat het feit opzettelijk is gepleegd, dan wordt degene gestraft met gevangenisstraf van ten hoogste
      negen maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel52
  - number: 52a.1
    text: |-
      Met hechtenis van ten hoogste veertien dagen of geldboete van de tweede categorie wordt gestraft degene die niet
      voldoet aan de ingevolge [artikel 27, tweede lid][ref1], op hem rustende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel27
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '27'
        hoofdstuk: IV
  - number: 52a.2
    text: |-
      Met gevangenisstraf van ten hoogste twee maanden of een geldboete van de tweede categorie wordt gestraft degene die
      opzettelijk niet voldoet aan de ingevolge [artikel 27, tweede lid][ref1], op hem rustende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel27
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '27'
        hoofdstuk: IV
  - number: '53.1'
    text: 'De tewerkgestelde, die opzettelijk ongeoorloofd afwezig is, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel53
  - number: 53.1.a
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie, indien die afwezigheid langer dan
      vier dagen duurt;
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel53
  - number: 53.1.b
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien die afwezigheid
      langer dan dertig dagen duurt dan wel de schuldige zich heeft verwijderd met het oogmerk zich voorgoed aan de
      dienstverplichtingen te onttrekken.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel53
  - number: '53.2'
    text: |-
      Onder afwezig zijn wordt verstaan het afwezig zijn van die plaats of plaatsen waar de tewerkgestelde zich ter
      vervulling van de op betrokkene rustende dienstverplichtingen behoort te bevinden; onder zich verwijderen wordt
      mede begrepen het zich schuil houden, afwezig blijven of achterblijven van die plaats of plaatsen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel53
  - number: '54'
    text: |-
      De tewerkgestelde die de dienstverplichtingen stelselmatig niet nakomt wordt gestraft met gevangenisstraf van ten
      hoogste één jaar en negen maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel54
  - number: '55.1'
    text: |-
      De duur van een vrijheidsberoving ondergaan wegens overtreding van een van de [artikelen 52][ref1], [52a][ref2],
      [53, eerste lid][ref3], en [54][ref4] komt in mindering op de duur van de vervangende dienst in gewone of
      buitengewone omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0002386#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002386#Artikel54
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '52'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002386
        artikel: 52a
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002386
        artikel: '53'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002386
        artikel: '54'
        hoofdstuk: VI
  - number: '55.2'
    text: |-
      In gevallen waarin na toepassing van het eerste lid de tewerkgestelde nog verplicht is tot het vervullen van
      vervangende dienst gedurende één maand of minder, kan Onze Minister van Sociale Zaken en Werkgelegenheid de
      tewerkgestelde van deze verplichting ontslaan.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel55
  - number: 55a
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan degene, die op grond van [artikel 52, eerste lid][ref1], of
      wegens een misdrijf begaan tijdens de vervangende dienst onherroepelijk is veroordeeld tot een onvoorwaardelijke
      vrijheidsstraf, ontslaan van de voor die persoon uit deze wet voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel52
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '52'
        hoofdstuk: VI
  - number: 55b.1
    text: |-
      De in de [artikelen 52, eerste lid][ref1], [52a, tweede lid][ref2], [53][ref3] en [54][ref4], strafbaar gestelde
      feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0002386#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002386#Artikel54
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '52'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002386
        artikel: 52a
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002386
        artikel: '53'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002386
        artikel: '54'
        hoofdstuk: VI
  - number: 55b.2
    text: |-
      De in de [artikelen 52, tweede lid][ref1], en [52a, eerste lid][ref2], strafbaar gestelde feiten zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '52'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002386
        artikel: 52a
        hoofdstuk: VI
  - number: '56.1'
    text: |-
      Met betrekking tot de voorlopige hechtenis worden misdrijven, omschreven in deze wet, gelijkgesteld met misdrijven,
      waarop als maximum een gevangenisstraf van vier jaren of meer is gesteld.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel56
  - number: '56.2'
    text: |-
      Met het opsporen van deze feiten zijn, behalve de ambtenaren, aangewezen bij
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '56.3'
    text: |-
      Zij die ingevolge het voorgaande lid met de opsporing zijn belast, kunnen degene die zich schuldig maakt aan een
      feit, strafbaar gesteld bij deze wet, na aanhouding overbrengen naar de plaats waar degene zich voor het vervullen
      van de dienstverplichtingen behoort te bevinden.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel56
  - number: '57.1'
    text: |-
      De voor de uitvoering van deze wet nodige regelen worden bij of krachtens algemene maatregel van bestuur
      vastgesteld, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel57
  - number: '57.2'
    text: |-
      Hierbij zal de rechtspositie van de dienstplichtigen die als gewetensbezwaarden zijn erkend zoveel mogelijk op
      gelijke wijze worden geregeld als die van de dienstplichtige militairen.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel57
  - number: '58'
    text: |-
      Alle stukken, die in verband met de bepalingen van deze wet of van de te harer uitvoering gegeven voorschriften
      worden gevorderd, ingediend, overgelegd of uitgereikt, zijn vrij van legesheffing, van kosten van legalisatie en
      van griffiekosten.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel58
  - number: 60a.1
    text: |-
      Ten aanzien van erkende gewetensbezwaarden worden de [artikelen 11 tot en met 13][ref1] alsmede de
      [artikelen 23][ref2] en [25][ref3] bij inwerkingtreding van de [Kaderwet dienstplicht][ref4] opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002386#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002386
        artikel: '23'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002386
        artikel: '25'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0008589
  - number: 60a.2
    text: |-
      [Hoofdstuk 4 van de Kaderwet dienstplicht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0008589
        hoofdstuk: '4'
  - number: 60a.3
    text: |-
      De in het eerste lid bedoelde opschorting is niet van toepassing bij de oproeping van dienstplichtigen als bedoeld
      in [artikel 64 van de Kaderwet dienstplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel64
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '64'
  - number: '61'
    text: Deze wet kan worden aangehaald als "Wet gewetensbezwaren militaire dienst".
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel61
  - number: '62'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002386/2020-01-01#Artikel62
