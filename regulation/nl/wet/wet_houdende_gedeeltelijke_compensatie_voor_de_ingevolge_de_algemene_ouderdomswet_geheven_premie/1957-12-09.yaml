preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen tot toekenning van een vergoeding
    aan die personen, van wie terzake van pensioen ingevolge de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers
    (Stb. 1947, H 420) premie ingevolge de Algemene Ouderdomswet wordt geheven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002256/1957-12-09#ArtikelAanhef
articles:
  - number: Enig
    text: |-
      Aan degene, van wie premie ingevolge de [Algemene Ouderdomswet][ref1] wordt geheven terzake van pensioen ingevolge
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2] (*Stb.* 1947, H 420) wordt ten laste van het
      Rijk, overeenkomstig de verhouding, waarin de premie, bedoeld in [artikel 23 van de Algemene Ouderdomswet][ref3],
      voor ambtenaren, in dienst van het Rijk, door weddeverhoging wordt gecompenseerd, een vergoeding voor de over dat
      pensioen verschuldigde premie verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002035
