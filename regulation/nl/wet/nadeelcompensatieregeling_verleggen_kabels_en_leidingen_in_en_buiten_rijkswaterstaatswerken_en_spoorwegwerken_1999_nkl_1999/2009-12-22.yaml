  - number: '5'
    text: |-
      Geen vergoeding vindt plaats als in het besluit tot verlening van de vergunning een bepaling is opgenomen dat
      binnen een periode van vijf jaren, te rekenen vanaf de datum van inwerkingtreding van de betrokken vergunning,
      een wijziging of intrekking van die vergunning te voorzien is in verband met binnen die periode uit te voeren
      werkzaamheden aan en ten behoeve van het desbetreffende rijkswaterstaatswerk of spoorwegwerk en binnen de genoemde
      periode van vijf jaar daadwerkelijk een besluit tot wijziging of intrekking van de vergunning wordt toegezonden dan
      wel uitgereikt.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Indien in bijzondere omstandigheden gronden aanwezig zijn om te concluderen dat redelijkerwijs een groter of
      kleiner gedeelte van de schade ten laste van de verzoeker dient te blijven dan uit de toepassing van het gestelde
      in de [artikelen 3 t/m 5][ref1] voortvloeit, kan van het gestelde in die artikelen worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel3
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '3'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: '7'
    text: |-
      De minister kent de verzoeker die schade lijdt of zal lijden als gevolg van de rechtmatige uitoefening door of
      namens de minister van een aan het publiekrecht ontleende bevoegdheid of taak leidende tot een verlegging van een
      buitenleiding, op verzoek een vergoeding toe, voor zover de schade redelijkerwijze niet of niet geheel te zijnen
      laste behoort te blijven en voor zover de vergoeding niet of niet voldoende anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel7
  - number: '8'
    text: |-
      De omvang van de schade wordt overeenkomstig de voorschriften vervat in de [bijlage 1][ref1] bij deze regeling
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010461
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010461
  - number: '9'
    text: |-
      Onverminderd het bepaalde in [artikel 10][ref1], bestaat de vergoeding bij een buitenleiding uit de componenten
      kosten van ontwerp en begeleiding alsmede uitvoeringskosten van de werkelijke verleggingskosten zoals is
      weergegeven in de van deze beleidsregeling deel uitmakende [bijlage 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010461
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel9
    references:
