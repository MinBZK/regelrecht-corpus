  - number: '2'
    text: |-
      Voorzover blijkt dat een verzoeker ten gevolge van een besluit van de minister, inhoudende de wijziging of
      intrekking van een vergunning, schade lijdt of zal lijden, waarvan de vergoeding niet of niet voldoende op andere
      wijze is verzekerd, kent de minister, met inachtneming van de hierna volgende bepalingen, op verzoek aan hem een
      vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel2
  - number: '3'
    text: |-
      De omvang van de schade wordt overeenkomstig de voorschriften vervat in de [bijlage 1][ref1] bij deze regeling
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010461
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010461
  - number: '4'
    text: |-
      a) Onverminderd het bepaalde in de [artikelen 5 t/m 6][ref1], bestaat de vergoeding bij een langsleiding uit een
      percentage van de berekende schade, welk percentage lineair gerelateerd is aan de tijdsduur die is verstreken vanaf
      de datum van inwerkingtreding van het besluit tot verlening van de vergunning tot en met de dag van de toezending
      of uitreiking van het besluit tot wijziging of intrekking van de vergunning, zulks overeenkomstig hetgeen terzake
      is weergegeven ten behoeve van respectievelijk de droge en natte infrastructuur in de van deze beleidsregeling deel
      uitmakende schema’s zoals opgenomen in [bijlage 2][ref2].

      b) Onverminderd het bepaalde in de [artikelen 5 t/m 6][ref3], bestaat de vergoeding bij een kruisende leiding uit
      de componenten kosten van ontwerp en begeleiding alsmede uitvoeringskosten van de werkelijke verleggingskosten
      zoals is weergegeven in de van deze beleidsregeling deel uitmakende [bijlage 3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010461
      [ref3]: https://wetten.overheid.nl/BWBR0010461#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010461
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel4
