preamble:
  text: |-
    Overwegende dat op 19 december 1991 is vastgesteld de Nadeelcompensatieregeling inzake het verleggen van kabels en
    leidingen in Rijkswaterstaatswerken 1991 (NKL 1991);

    dat er aanleiding bestaat de reikwijdte van genoemde regeling uit te breiden tot spoorwegwerken;

    dat er tevens redenen zijn om de desbetreffende regeling te actualiseren, in het bijzonder in die zin,
    dat een aanpassing plaats vindt aan de Algemene wet bestuursrecht en aan de uitkomsten van het overleg met
    brancheorganisaties van kabel- en leidingbeheerders dat heeft geleid tot de ’Overeenkomst inzake verleggingen van
    kabels en leidingen buiten beheersgebied’ van 10 februari 1999, Staatscourant 1999, nr. 97 (de overeenkomst);

    dat het bovendien wenselijk is, in verband met de overeenkomst en het gelijkheidsbeginsel, om het werkingsgebied
    van de NKL 1991 uit te breiden tot kabels en leidingen die buiten het beheersgebied van de Minister van Verkeer en
    Waterstaat gelegen zijn;

    dat, als gevolg van een en ander, de NKL 1991 wordt vervangen door de hieronder vast te stellen regeling;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            de minister:

              de Minister van Verkeer en Waterstaat;



            b
             verzoeker:

              de indiener van een verzoek als bedoeld in [artikel 2][ref1] of [7][ref2];



            c
             kabel:

              een sterke, buigzame, verbinding, bestaande uit een of meer geleiders welke zijn samengesteld uit draden
      van metaal of glasvezel en geschikt voor het transport van elektrische energie en/of elektrische signalen en/of
      optische signalen;



            d
            leiding:

              een buis, vervaardigd van een duurzaam materiaal zoals staal, beton of kunststof en geschikt voor het
      transport van vloeistoffen en gassen;



            e
             rijkswaterstaatswerken:

              werken als bedoeld in de [Wet beheer rijkswaterstaatswerken][ref3] of waterstaatswerken als bedoeld in
      [artikel 1.1 van de Waterwet][ref4] in beheer bij het Rijk;



            f
             spoorwegwerken:

              infrastructuur bestemd voor verkeer over spoorstaven of geleiderails, met inbegrip van bovenbouw,
      kunstwerken, sloten en onderhoudswerken en vaste installaties, alsmede de daarbij behorende perrons, laad- en
      loswegen, trappen, tunnels en liften;



            g
             vergunning:

              een vergunning als bedoeld in [hoofdstuk 6, paragraaf 6, van het Waterbesluit][ref5], de
      [Wet beheer rijkswaterstaatswerken][ref6] en het [Reglement dienst hoofd- en lokaalspoorwegen][ref7],
      voorzover betrekking hebbend op het aanbrengen en hebben van kabels en leidingen in, op, onder of boven
      rijkswaterstaatswerken of spoorwegwerken;



            h
            droge infrastructuur:

              rijkswaterstaatswerken en spoorwegwerken, met uitzondering van waterwegen en die dijken als hierna onder
      i genoemd;



            i
             natte infrastructuur:

              waterwegen en dijken, voor wat betreft de laatste slechts voor zover het gaat om (de aanleg van of
      wijziging aan) de dijk als waterkeringswerk;



            j
             langsleiding:

              een leiding of kabel die, krachtens vergunning, parallel is gelegd aan, boven, onder op of in een
      rijkswaterstaatswerk of spoorwegwerk;



            k
             kruisende leiding:

              een leiding of kabel die, krachtens vergunning, kruisend door, op, boven, onder of in een
      rijkswaterstaatswerk of spoorwegwerk is gelegd.



            l
            buitenleiding:

              een leiding of kabel die buiten een rijkswaterstaatswerk of spoorwegwerk is gelegd en valt onder één van de
      categorieën openbare werken als bedoeld in [artikel 1 van de Belemmeringenwet privaatrecht][ref8] (wet van 13 mei
      1927, Stb.159).


