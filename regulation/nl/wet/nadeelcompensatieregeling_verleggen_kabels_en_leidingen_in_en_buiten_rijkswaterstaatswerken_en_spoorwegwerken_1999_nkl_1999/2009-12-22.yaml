      - id: ref4
        bwb_id: BWBR0010461
        artikel: '10'
        hoofdstuk: '1'
        afdeling: '1.3'
  - number: '20'
    text: |-
      De minister stelt aan de adviseur de (nadere) gegevens ter beschikking die nodig zijn voor een goede vervulling van
      diens adviestaak. [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '21'
    text: |-
      De verzoeker verschaft de adviseur, naast de van verzoeker afkomstige informatie waarover de adviseur – op grond
      van [artikel 20][ref1] – reeds beschikt, desgevraagd nadere gegevens en bescheiden die voor de advisering nodig
      zijn en waarover hij redelijkerwijs de beschikking kan krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel20
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '20'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '22'
    text: |-
      De adviseur kan inlichtingen en adviezen inwinnen bij derden, daaronder begrepen ambtenaren, in dienst bij een
      dienst, bedrijf of instelling, werkzaam onder verant-woordelijkheid van de minister.

      Indien met het verstrekken van inlichtingen of adviezen door derden kosten gemoeid zijn, oefent de adviseur deze
      bevoegdheid eerst uit na goedkeuring van de minister.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel22
  - number: '23'
    text: De adviseur kan desgewenst een plaatsopneming houden.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel23
  - number: '24'
    text: |-
      Ter voorbereiding van zijn advies stelt de adviseur de verzoeker en de minister in de gelegenheid tot het geven van
      een mondelinge toelichting. Beiden kunnen zich laten bijstaan of laten vertegenwoordigen door een gemachtigde.

      Meegebrachte deskundigen kunnen in de gelegenheid gesteld worden een nadere toelichting te geven.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel24
  - number: '25'
    text: |-
      De adviseur stelt van zijn werkzaamheden een verslag op. Dit verslag bevat mede een weergave van hetgeen, op grond
      van [artikel 24][ref1], ten overstaan van de adviseur naar voren is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel24
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '24'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '26'
    text: |-
      De minister kan aangeven binnen welke termijn een advies wordt verwacht. Deze termijn mag niet zodanig kort zijn
      dat de adviseur – gelet op de in de [artikelen 27][ref1] en [28][ref2] genoemde termijnen – binnen een dermate
      beperkt tijdsbestek een conceptadvies dient op te stellen dat hij zijn taak niet naar behoren kan vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel28
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '27'
        hoofdstuk: '2'
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0010461
        artikel: '28'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '27'
    text: |-
      Alvorens de adviseur zijn definitieve advies opstelt, maakt hij een concept-advies op. Dit concept-advies wordt aan
      de verzoeker en de minister toegezonden, met het verzoek om binnen een termijn van uiterlijk vier weken, te rekenen
      vanaf de datum van verzending van het concept-advies, schriftelijk eventuele bedenkingen tegen het concept-advies
      naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel27
  - number: '28'
    text: |-
      De adviseur stelt zijn definitieve advies vast binnen vier weken na ontvangst van de eventuele bedenkingen van de
      verzoeker en/of de minister, danwel na afloop van de in [artikel 27][ref1] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel27
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '27'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '29'
    text: |-
      Zodra het definitieve advies is vastgesteld, zendt de adviseur dit, vergezeld van het in [artikel 25][ref1]
      bedoelde verslag, aan de minister en aan de aanvrager toe.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel25
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '25'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '30'
    text: |-
      In bijzondere gevallen kan de minister, bij toepassing van het bepaalde in [artikel 14][ref1], aanhef en onder e,
      voor de benodigde advisering over de aanvraag om schadevergoeding een commissie instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel14
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '31'
    text: |-
      Een commissie, bedoeld in [artikel 30][ref1], bestaat uit een drietal door de minister benoemde deskundigen. De
      minister wijst uit hun midden de voorzitter aan.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel30
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '32'
    text: |-
      De [artikelen 17][ref1] tot en met [29][ref2] zijn ten aanzien van de commissie van over-eenkomstige toepassing,
      met dien verstande dat de in [artikel 17][ref3] genoemde termijn van vier weken in dat geval acht weken bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0010461#Artikel17
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '17'
        hoofdstuk: '2'
        afdeling: '2.2'
      - id: ref2
        bwb_id: BWBR0010461
        artikel: '29'
        hoofdstuk: '2'
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0010461
        artikel: '17'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '33'
    text: |-
      Indien toepassing is gegeven aan het bepaalde in [artikel 14, aanhef en onder e][ref1], besluit de minister binnen
      vier weken na de dag van ontvangst van het advies in hoeverre toekenning van de gevraagde vergoeding jegens een
      verzoeker zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel14
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '34'
    text: |-
      Indien het in [artikel 33][ref1] bedoelde besluit afwijkt van het terzake uitgebrachte advies, bevat de motivering
      van dat besluit de redenen van deze afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel33
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '33'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '35'
    text: |-
      In een besluit, bedoeld in [artikel 15][ref1] of [artikel 33][ref2], kan het bedrag van de toegekende vergoeding
      worden verhoogd met de wettelijke rente als bedoeld in artikel 6:119 van het Burgerlijk Wetboek, berekend vanaf
      de dag dat het verzoek om vergoeding is ontvangen dan wel vanaf de dag dat de schade daadwerkelijk is veroorzaakt
      indien laatstbedoeld tijdstip later is dan de dag van ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel33
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0010461
        artikel: '33'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '36'
    text: |-
      Indien de verzoeker naar redelijke verwachting in aanmerking komt voor een schadevergoeding, kan de minister, in
      afwachting van de beslissing terzake die vergoeding, op verzoek dan wel ambtshalve aan de verzoeker een voorschot
      verlenen.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel36
  - number: '37'
    text: |-
      Indien de minister besluit tot het verlenen van één of meer voorschot(ten) wordt daarmee geen aanspraak op
      schadevergoeding, als bedoeld in [artikel 2][ref1] of [artikel 7][ref2], erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel7
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '2'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref2
        bwb_id: BWBR0010461
        artikel: '7'
        hoofdstuk: '1'
        afdeling: '1.3'
  - number: '38'
    text: |-
      Een voorschot wordt eerst verleend nadat de verzoeker schriftelijk de verplichting heeft aanvaard tot gehele en
      onvoorwaardelijke terugbetaling van hetgeen ten onrechte als voorschot is uitbetaald. De minister kan daarvoor
      zekerheidstelling verlangen.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel38
  - number: '39'
    text: Aanvragen om vergoeding, ingediend voor 1 juli 1998, worden behandeld met inachtneming van de NKL 1991.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel39
  - number: '40'
    text: |-
      De NKL 1991 wordt op het tijdstip genoemd in [artikel 41][ref1] ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel41
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '41'
        hoofdstuk: '4'
  - number: '41'
    text: |-
      Deze beleidsregeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin
      zij, tezamen met de toelichting en bijlagen, wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel41
  - number: '42'
    text: |-
      Deze beleidsregeling wordt tezamen met de overeenkomst in het vijfde jaar na het tijdstip genoemd in
      [artikel 39][ref1] geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel39
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '39'
        hoofdstuk: '4'
  - number: '43'
    text: |-
      Deze beleidsregeling kan worden aangehaald als ’Nadeelcompensatieregeling verleggen kabels en leidingen in en
      buiten rijkswaterstaatswerken en spoorweg-werken 1999 (NKL 1999)’.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel43
  - number: B1:1
    text: |-
      1 De hoogte van de kosten voor het verleggen van een kabel of leiding wordt vastgesteld volgens de hierna volgende
      berekeningsmethodiek.

      2 Bij deze berekeningsmethodiek wor-den de componenten vermogensscha-de en inkomensschade niet als uit-gangspunt
      genomen.

      3 3. Bij deze berekeningsmethodiek wor-den de kosten vastgesteld aan de hand van de werkelijke verleggingskosten.

      4 De werkelijke verleggingskosten bestaan uit:

        - materiaalkosten
        - kosten van het uit en in bedrijfstellen
        - kosten van ontwerp en begeleiding
        - uitvoeringskosten.

      5 De hoogte van de kosten worden gecorrigeerd indien zich door de verlegging of aanpassing van de kabel of leiding
      een kwantificeerbare voordeeltoerekening voordoet (zoals bijvoorbeeld een capaciteitstoename van een leiding of het
      voordeel dat ontstaat indien er een nieuwe leiding in de plaats komt van een technisch versleten leiding).
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel1
  - number: B1:2
    text: |-
      Onder materiaalkosten worden verstaan:

        - kosten van bedrijfseigen materialen die noodzakelijk zijn voor de instandhouding van de functie van de te
      verleggen kabel of leiding en daarvoor noodzakelijke beschermingsconstruc-ties. Hieronder worden in elk geval
      verstaan kosten van kabel- en of leidingcomponenten, kosten van elektrotechnische, werktuigbouwkundige en
      civieltechnische materialen, alsmede kosten van bouwmaterialen, alsmede kosten van bouwmaterialen bestemd voor
      gebouwen waarin delen van kabel- en leidingsystemen worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel2
  - number: B1:3
    text: |-
      Onder de kosten van het uit en in bedrijf stellen worden verstaan:

        - kosten van het spannings- of produktloos maken van de kabel en leiding alsmede de kosten van het weer in bedrijf
      stellen van de kabel of leiding,
        - kosten samenhangend met tijdelijke voorzieningen van operationele aard. Tijdelijke voorzieningen van operationele
      aard zijn voorzieningen die benodigd zijn om de levering tijdens de uitvoering van een verlegging te waarborgen.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel3
  - number: B1:4
    text: |-
      Onder uitvoeringskosten worden verstaan:

        - kosten van civieltechnische, bouwkundige en installatietechnische werkzaamheden (zoals werkputten en
      ondersteuningen),
        - kosten samenhangend met de uitvoering van het verwijderen van verlaten kabels of leidingen. De ter plaatse
      vrijgekomen materialen zijn c.q. worden het eigendom van de leidingbeheerder,
        - kosten van constructieve en bijzondere voorzieningen die nodig zijn in verband met de aanraking van het
      infrastructuurwerk (zoals overkluizingen en mantelbuizen),
        - kosten van tijdelijke voorzieningen van fysieke aard, zoals extra kabel- en leidingvoorzieningen die
      worden opgeheven zodra de definitieve verlegging is gerealiseerd in samenhang met de voortgang van het
      infrastructuurproject.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel4
  - number: B1:5
    text: |-
      1 Een aftrek nieuw voor oud wordt alleen toegepast indien sprake is van kenbaar technisch versleten kabels of
      leidingen. Onder technisch versleten wordt verstaan kabels of leidingen waarvan de technische levensduur binnen een
      periode van 5 jaar verstreken zal zijn.

      2 Een aftrek nieuw voor oud vindt plaats op basis van een contante waardeberekening waarbij wordt uitgegaan van
      de technische levensduur van de betreffende kabel of leiding. Indien delen van een zelfstandige eenheid vervangen
      moeten worden, wordt voor de berekening uitgegaan van de integrale kosten van de vervanging van de gehele
      zelfstandige eenheid onder toerekening van een evenredig deel van de kosten aan het te vervangen onderdeel.

      De technische levensduur van een aantal soorten kabels of leidingen wordt bepaald aan de hand van het overzicht dat
      in onderstaande toelichting is opgenomen. De technische levensduur van soorten kabels of leidingen die niet in dit
      overzicht zijn opgenomen wordt naar redelijkheid bepaald.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel5
  - number: B1:1
    text: |-
      Voor de bepaling van de kosten van ontwerp en begeleiding als bedoeld in lid 4 wordt aansluiting gezocht bij
      artikel 26 van de Regeling van de verhou-ding tussen opdrachtgever en adviserend ingenieursbureau (RVOI 1998).
      Ingevolge artikel 26 van die regeling kunnen de volgende werkzaamheden worden onderscheiden:

        - onderzoek
        - voorontwerp
        - definitief ontwerp
        - bestek
        - aanbesteding en gunning
        - detaillering ten behoeve van de uitvoering
        - directievoering
        - oplevering

      onderhoud- en garantietermijn. Voor de hoogte van de hier opgesomde kosten zijn de werkelijke kosten het
      uitgangspunt. Indien deze afwijken

      van het in de RVOI 1998 aangegeven niveau, dan dient onderbouwing van de afwijking te worden gegeven. Zonodig kan
      een beroep op de hardheidsclausule gedaan worden.

      Lid 5 impliceert dat, wanneer sprake is van een capaciteitstoename van een leiding of een vervanging van een
      technisch versleten leiding of kabel, het hierdoor ontstane voordeel wordt afgetrokken van het schadebedrag
      dat wordt vastgesteld. Mutatis mutandis geldt hetzelfde voor opstallen indien er sprake is van kwantificeerbare
      voordelen.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel1
  - number: B1:2
    text: |-
      Ook de kosten van het transport van materialen naar de bouwplaats vallen onder het begrip ’materiaalkosten’. Een
      sluitende opsomming van wat onder het begrip materiaalkosten dient te vallen is niet goed mogelijk zodat in de
      praktijk van geval tot geval beoordeeld dient te worden welke kosten als materiaalkosten aangemerkt dienen te
      worden. Als richtsnoer kan daarbij wellicht de interpretatie die in de praktijk gegeven wordt aan [artikel 4][ref1]
      van de overeenkomst dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel4
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '4'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: B1:3
    text: |-
      Onder kosten van uit- en in bedrijf stellen vallen kosten van tijdelijke voorzie-ningen van operationele aard,
      zoals extra kosten van personele aard ten behoeve van bedrijfsvoering en hulpmiddelen voor die bedrijfsvoering
      zoals watertanks, gasflessen en noodaggregaten.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel3
  - number: B1:4
    text: |-
      Onder de kosten van tijdelijke voorzieningen van fysieke aard worden alle tijdelijke fysieke kabel- en
      leidingverbindingen verstaan, die de leidingbe-heerder moet aanleggen en later buiten bedrijf stellen in het kader
      van de door de minister gevraagde verlegging. Deze kosten houden nauw verband met de noodzakelijke continuïteit van
      het bedrijfsproces van de betrokken kabel- of leidingbeheerder.

      De kosten van een CAR-verzekering vallen ook onder het begrip uitvoeringskosten.

      Onder uitvoeringskosten worden tevens de eenmalige kosten verbonden aan het vestigen van zakelijke rechten
      begrepen. Uitgangspunt hierbij is echter wel dat deze kosten redelijk zijn. Bij de beantwoording van de vraag wat
      redelijk is kan bijvoorbeeld gekeken worden naar de regeling terzake zoals die door de Gasunie en LTO Nederland
      is overeengekomen.

      Voor uitvoeringskosten geldt hetzelfde als wat in de laatste zin van de toelichting bij [artikel 2][ref1] is
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel2
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '2'
        hoofdstuk: '1'
        afdeling: '1.2'
  - number: B1:5
    text: |-
      Leidingen met een technische levensduur van 100 jaar en ouder worden niet geacht aan veroudering onderhevig te
      zijn. Dit leidt ertoe dat een korting ’nieuw voor oud’ niet toegepast kan worden bij het bepalen van de kosten voor
      het verleggen van een dergelijke leiding. De hoogte van de kosten van een verlegging kan echter wel gecorrigeerd
      worden indien zich door de verlegging een kwantificeerbare voordeeltoerekening voordoet. Dit is o.a. het geval als:
      de capaciteit van de leiding toeneemt, de leiding meer druk kan verdragen (verhoging van de drukklasse), opheffen
      van een evident verkeerde ligging, opheffen van constructiefouten of een foutieve keuze van leidingmaterialen
      voorzover deze de technische levensduur significant zouden kunnen beïnvloeden, achterstallig onderhoud eveneens
      gepaard gaande met een significante verkorting van de technische levensduur en een noodzakelijke reconstructie van
      oudere opstallen.

      Bij een reconstructie van oudere opstallen kan afhankelijk van de situatie een correctie nieuw voor oud worden
      toegepast conform de regels van het onteigeningsrecht waarbij dan een eventuele vergroting van de functionaliteit
      eveneens in mindering gebracht kan worden op de vergoeding.

      Een aftrek nieuw voor oud bij leidingen is gecompliceerd, omdat in bijna alle aanpassings- en verleggingssituaties
      een zelfstandige eenheid (een onderdeel van de technische werken in het leidingencomplex, dat bij vervanging
      van een (deel van) dit leidingen-complex, zowel uit technisch als uit bedrijfseconomisch oogpunt naar redelijke
      verwachting in stand zal blijven) ontbreekt. Bij een verlegging van een deel van een zelfstandige eenheid is het
      pas zinvol om een correctie nieuw voor oud toe te passen, indien die partiële verlegging dicht tegen het moment
      aan zit, waarop de technische levensduur van de gehele leiding verstreken is. Van dat laatste is sprake indien de
      periode tussen partiële verlegging en een verstrijken van de technische levensduur 5 jaar of korter is.

      Een voorbeeld:

      leiding aangelegd in 1959 technische levensduur: 45 jaar totale leiding met een lengte van 800 m zou naar
      objectieve maatstaven aldus in 2004 moeten worden vernieuwd infrastructureel project maakt verlegging van 100
      m leiding noodzakelijk in 2001 kosten "partiële verlegging": ƒ 300.000 - geschatte kosten gehele verlegging in
      2004: ƒ 1.500.000 evenredig deel van het in 2001 te verleggen deel ten opzichte van de in 2004 geplande totale
      verlegging is:(100) / (800) x f. 1.500.000= ƒ 187.500 bij een rekenrente van 4% (dit is tweederde van het
      gemiddelde percentage dat de grootste banken van Nederland als rente hanteren voor standaard-hypotheken zonder
      gemeentegarantie op basis van een tienjarige annuïteit) is dit bedrag naar het jaar 2001 contant te maken met de
      rekensom ƒ 187.500: (1,04)3= ƒ 166.687 de schadeloosstelling is nu gelijk aan ƒ 300.000 (kosten partiële verlegging
      in 2001) minus ƒ 166.687 (de contant gemaakte evenredige besparing in 2004) = ƒ 133.313

      Het onderstaande overzicht is samengesteld op grond van [artikel 9 lid 2][ref1] van de overeenkomst. Dit overzicht
      is niet uitputtend zodat de technische levensduur van een kabel of leiding die niet in dit overzicht is opgenomen
      naar redelijkheid en billijkheid bepaald dient te worden.









