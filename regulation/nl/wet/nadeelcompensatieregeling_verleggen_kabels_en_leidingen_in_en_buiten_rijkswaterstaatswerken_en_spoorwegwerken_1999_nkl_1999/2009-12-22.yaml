      - id: ref2
        bwb_id: BWBR0010461
  - number: '10'
    text: |-
      Indien in bijzondere omstandigheden gronden aanwezig zijn om te concluderen dat redelijkerwijs een groter of
      kleiner gedeelte van de schade ten laste van de verzoeker dient te blijven dan uit de toepassing van het gestelde
      in de [artikelen 8][ref1] en [9][ref2] voortvloeit, kan van het gestelde in die artikelen worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel9
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel10
