  - number: '11'
    text: |-
      Een verzoek tot vergoeding wordt zo spoedig mogelijk bij de minister ingediend, doch in ieder geval binnen
      een termijn van vijf jaar na het van kracht worden van het besluit waarbij de vergunning wordt gewijzigd of
      ingetrokken, of de dag na het rechtmatig uitoefenen door of namens de minister van een aan het publiekrecht
      ontleende bevoegdheid of taak waardoor een buitenleiding verlegd diende te worden.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel11
  - number: '12'
    text: |-
      Het verzoek bevat – onverminderd het bepaalde in [artikel 4:2 van de Algemene wet bestuursrecht][ref1] – ten
      minste:

      a. een aanduiding van het besluit tot intrekking of wijziging van de vergunning of van het rechtmatig uitoefenen
      door of namens de minister van een aan het publiekrecht ontleende taak of bevoegdheid leidende tot een verlegging
      van een buitenleiding;

      b. een aanduiding van de aard en omvang van de schade, alsmede een specificatie van het bedrag van de schade
      berekend conform de [artikelen 3 t/m 5][ref2] en/of de [artikelen 8][ref3] en [9][ref4];

      c. een opgave van het schadebedrag dat naar het oordeel van de verzoeker vergoed dient te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010461#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0010461#Artikel9
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
      - id: ref2
        bwb_id: BWBR0010461
        artikel: '3'
        hoofdstuk: '1'
        afdeling: '1.2'
      - id: ref3
        bwb_id: BWBR0010461
        artikel: '8'
        hoofdstuk: '1'
        afdeling: '1.3'
      - id: ref4
        bwb_id: BWBR0010461
        artikel: '9'
        hoofdstuk: '1'
        afdeling: '1.3'
  - number: '13'
    text: |-
      De minister bevestigt de ontvangst van het verzoek om vergoeding zo spoedig mogelijk, doch uiterlijk binnen twee
      weken na ontvangst ervan, en stelt de verzoeker op de hoogte van de te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel13
  - number: '14'
    text: |-
      Binnen acht weken na ontvangst van het verzoek om vergoeding besluit de minister:

      a. het verzoek buiten behandeling te laten indien deze na afloop van de in [artikel 11][ref1] genoemde termijn
      is ingediend

      of

      b. het verzoek af te wijzen indien deze naar het oordeel van de minister niet dan wel onvoldoende onderbouwd is
      nadat de minister de verzoeker in de gelegenheid heeft gesteld het verzuim te herstellen binnen vier weken na
      verzending van de brief waarin de verzoeker op het verzuim is gewezen

      of

      c. het verzoek geheel of gedeeltelijk in te willigen

      of

      d. toepassing te geven aan [hoofdstuk 3][ref2] van deze regeling indien daartoe naar het oordeel van de minister
      termen aanwezig zijn

      of

      e. het verzoek in handen te stellen van een adviseur dan wel adviescommissie, bedoeld in [Afdeling 2.2][ref3].

      of

      f. het verzoek kennelijk ongegrond te verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0010461#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0010461
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0010461
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: '15'
    text: |-
      In het besluit, bedoeld in [artikel 14][ref1], aanhef en onder c, wordt tevens aangegeven tot welk gedeelte van de
      schade de vergoeding zich zal uitstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel14
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '16'
    text: |-
      De minister kan de termijn, genoemd in [artikel 14][ref1], eenmaal met vier weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel14
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '17'
    text: |-
      Binnen vier weken nadat toepassing is gegeven aan het bepaalde in [artikel 14][ref1], aanhef en onder e, wijst de
      minister een adviseur aan, welke niet werkzaam is onder de verantwoordelijkheid van de minister. De adviseur heeft
      tot taak de minister van advies te dienen over het op het verzoek om vergoeding te nemen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel14
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010461
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '18'
    text: |-
      Alvorens een adviseur aan te wijzen, geeft de minister van zijn voornemen daartoe kennis aan de verzoeker. De
      kennisgeving bevat, naast de redengeving voor het inschakelen van een adviseur, ten minste de naam van de adviseur,
      zijn beroep en de plaats waar hij zijn werkzaamheden pleegt te verrichten.

      De verzoeker kan binnen twee weken na de verzending van de kennisgeving bedenkingen uiten tegen de voorgenomen
      aanwijzing in welk geval de minister eenmalig tot een andere aanwijzing kan overgaan.
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel18
  - number: '19'
    text: |-
      Het door de adviseur uit te brengen advies bevat ten minste een antwoord op de vraag of de schade een gevolg is
      van de activiteiten van de minister zoals omschreven in de [artikelen 2][ref1] en [7][ref2]. Bij bevestigende
      beantwoording van die vraag bevat het advies tevens antwoorden op de volgende vragen:

      a. Is vergoeding van de schade niet of niet voldoende op ander wijze verzekerd?

      b. wat is de omvang van de schade?

      c. welk gedeelte van de schade behoort voor vergoeding op basis van deze regeling in aanmerking te komen?

      d. zijn er gronden om toepassing te geven aan [artikel 6][ref3] of [10][ref4] van deze regeling en zo ja, welk
      bedrag komt dan voor vergoeding in aanmerking?

      e. bestaat er aanleiding om op verzoek een bijdrage in de door de verzoeker gemaakte deskundigenkosten toe te
      kennen voorzoverre het inroepen van deskundigenbijstand door de verzoeker en de kosten daarvan redelijk zijn te
      achten?


      [ref1]: https://wetten.overheid.nl/BWBR0010461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010461#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0010461#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0010461#Artikel10
    url: https://wetten.overheid.nl/BWBR0010461/2009-12-22#Artikel19
    references:
      - id: ref1
