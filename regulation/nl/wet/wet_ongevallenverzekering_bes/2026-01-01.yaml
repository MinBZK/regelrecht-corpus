  - number: '15'
    text: |-
      1 Overtreding van [artikel 11, vierde lid][ref1], en het niet of niet tijdig nakomen van een van de verplichtingen
      gesteld bij de [artikelen 5, twaalfde lid, eerste zin][ref2], [6, eerste lid, tweede zin][ref3], [8h][ref4],
      [12, tweede lid][ref5] en krachtens [artikel 13][ref6] wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van de derde categorie.

      2 Het opzettelijk, mondeling of schriftelijk verstrekken of doen verstrekken van inlichtingen als bedoeld in
      [artikel 12, tweede lid][ref7], die onjuist zijn alsmede het afleggen van een valse verklaring aan Onze Minister,
      wordt gestraft met gevangenisstraf van ten hoogste één jaar of een geldboete van de derde categorie.

      3 Het opzettelijk door giften, beloften, misbruik van gezag, geweld, bedreiging of misleiding bewegen van
      een werknemer om geen gebruik te maken van een hem op grond van deze wet toekomend recht wordt gestraft met
      gevangenisstraf van ten hoogste één jaar of geldboete van de derde categorie.

      4 De in het eerste lid strafbaar gestelde feiten zijn overtredingen en de in het tweede en derde lid strafbaar
      gestelde feiten zijn misdrijven.


