  - number: '11'
    text: |-
      1 Een aanspraak op grond van deze wet vervalt, indien het ongeval niet binnen een jaar na de dag, waarop het de
      werknemer is overkomen, bij Onze Minister is gemeld.

      2 De termijnen van de uitkeringen, welke niet zijn ingevorderd binnen twee jaar na de eerste dag waarop zij konden
      worden ingevorderd, worden niet meer uitbetaald.

      3 Ieder beding, dat de aansprakelijkheid van de werkgever ingevolge de bepalingen van deze wet uitsluit of
      vermindert, is nietig

      4 Het is de werkgever verboden de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of
      gedeeltelijk te verhalen op het loon van de werknemer.

      5 De werknemer, aan wie een ongeval is overkomen, doch die deswege niet arbeidsongeschikt is geworden, behoudt,
      indien hij ten behoeve van geneeskundige onderzoek of behandeling, noodzakelijk het verrichten van zijn arbeid
      onderbreekt, gedurende die tijd tegenover zijn werkgever recht op loon.

      6 De werknemer, die de uitkering in ontvangst neemt, wordt daardoor niet geacht van het recht op het hem eventueel
      meer toekomende afstand te hebben gedaan.

      7 Indien de werknemer of diens nagelaten betrekkingen in verband met het ongeval, op grond waarvan een uitkering
      als bedoeld in deze wet is toegekend, tegen de werkgever een rechtsvordering tot schadevergoeding heeft
      naar burgerlijk recht, wordt die vordering op grond van deze wet niet verloren, doch de rechter houdt bij de
      vaststelling van de schadevergoeding rekening met hetgeen op grond van deze wet aan de werknemer of diens nagelaten
      betrekkingen is toegekend.

      8 De persoon die is gehouden tot vergoeding van de schade die door de werknemer of diens nagelaten betrekkingen
      is geleden als gevolg van een ongeval, is voor de tegemoetkoming aan de werknemer of diens nagelaten betrekkingen
      toegekend op grond van deze wet aansprakelijk jegens degene te wiens laste die tegemoetkoming komt. Van degene die
      aansprakelijk is voor een periodieke uitkering op grond van deze wet kan door degene te wiens laste die uitkering
      komt, een daarmede overeenkomende uitkering ineens worden gevorderd.

      9 De tegemoetkoming is onvervreemdbaar, niet vatbaar voor verpanding of belening, evenmin voor executoriaal of
      conservatoir beslag, noch voor faillissementsbeslag, behalve tot verhaal van het verschuldigde wegens levering
      van levensbehoeften, verstrekt aan degene tegen wie het beslag gedaan wordt, en tot verhaal van onderhoud waartoe
      degene, die de uitkering geniet, ingevolge wettelijke regelingen is gehouden.

      10 De aansprakelijkheid, volgende uit de bepalingen van deze wet, van de niet binnen de openbare lichamen Bonaire,
      Sint Eustatius of Saba gevestigde werkgever wordt gedragen door zijn binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028497/2026-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister is belast met de uitvoering van deze wet, met dien verstande, dat de heffing van de premie
      geschiedt door de inspecteur en de invordering daarvan door de ontvanger.

      2 Eenieder is verplicht ten behoeve van de uitvoering uit eigen beweging of op verzoek aan Onze Minister
      inlichtingen te verstrekken, desverlangd schriftelijk. De door Onze Minister verlangde inlichtingen moeten binnen
      een door Onze Minister te stellen termijn worden verstrekt. De werknemer, dan wel diens nagelaten betrekkingen,
      gewezen werknemer en werkgever zijn verplicht uit eigen beweging aan Onze Minister inlichtingen te verstrekken
      waarvan redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte of
      de duur van de uitkering. Ook is eenieder verplicht de door Onze Minister gegeven aanwijzingen ten behoeve van de
      uitvoering van deze wet op te volgen.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de verplichtingen uit
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028497/2026-01-01#Artikel12
  - number: 12a
    text: |-
      1 Onze Minister is belast met het toezicht op het bij of krachtens deze wet bepaalde en kan bij ministeriële
      regeling functionarissen belasten met het toezicht op deze wet.

      2 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].

      3 Op het binnentreden in woningen of in tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke
      toestemming van de bewoner, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref4] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref5], [156, tweede lid][ref6],
      [157, tweede en derde lid][ref7], [158, eerste lid, laatste zinsnede][ref8], en [160, eerste lid][ref9], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van taakuitoefening van de
      functionarissen, aangewezen op grond van het eerste lid.


