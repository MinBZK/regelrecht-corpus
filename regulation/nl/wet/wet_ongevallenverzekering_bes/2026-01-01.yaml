  - number: 15a
    text: |-
      Een administratieve boete vervalt, indien degene aan wie de administratieve boete is opgelegd, wegens het feit
      op grond waarvan boete is verschuldigd, onherroepelijk is veroordeeld, is vrijgesproken of is ontslagen van
      rechtsvervolging.
    url: https://wetten.overheid.nl/BWBR0028497/2026-01-01#Artikel15a
  - number: 15b
    text: |-
      1 Met de opsporing van bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde functionarissen, belast de door Onze Minister
      van Justitie, in overeenstemming met Onze Minister, aangewezen ambtenaren.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de vereisten waaraan de
      op grond van het eerste lid aangewezen functionarissen dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
