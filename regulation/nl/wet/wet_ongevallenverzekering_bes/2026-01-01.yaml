  - number: 5c
    text: |-
      1 De werknemer die ongevallengeld ontvangt is verplicht in voldoende mate te trachten mogelijkheden tot het
      verrichten van zijn normale arbeid bij de eigen werkgever te behouden of te verkrijgen.

      2 Ter naleving van de verplichting, bedoeld in het eerste lid, is de werknemer in elk geval verplicht:

      a. mee te werken aan activiteiten of werkzaamheden die zijn werkgever met het oog op arbeidsinschakeling wenselijk
      acht;

      b. mee te werken aan aanpassing van de arbeidsplaats en aan door de werkgever beschikbaar gestelde voorzieningen
      die worden verstrekt met het oog op werkhervatting en zo nodig te proberen die aanpassing en die voorzieningen
      te verkrijgen.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel. Deze
      regels kunnen mede betrekking hebben op de ondersteuning van werknemers gericht op werkhervatting.

      4 Bij ministeriële regeling kunnen regels worden gesteld waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0028497/2026-01-01#Artikel5c
  - number: '6'
    text: |-
      1 Onze Minister stelt op aanvraag, mede aan de hand van de geneeskundige beoordeling, vast of recht op
      ongevallengeld bestaat. De werkgever aan wie op grond van [artikel 5, twaalfde lid, tweede zin][ref1], de uitkering
      wordt verstrekt informeert de werknemer zo spoedig mogelijk over de hiermee gemoeide aanspraak.

      2 Een aanvraag wordt ingediend door middel van een door Onze Minister beschikbaar gesteld formulier.

      3 De behandelende geneeskundige deelt de bevindingen en zijn daaruit volgende voorschriften aan Onze Minister zodra
      de behandelende geneeskundige vaststelt dat de werknemer in verband met de gevolgen van het ongeval:

      a. zich onder geneeskundige behandeling moet stellen;

      b. zich niet of niet langer onder geneeskundige behandeling behoeft te stellen;

      c. als bedlegerig patiënt behandeld moet worden;

      d. niet of niet langer als bedlegerig patiënt behandeld behoeft te worden;

      e. naar zijn oordeel geheel of gedeeltelijk arbeidsongeschikt is;

      f. naar zijn oordeel niet of niet langer geheel of gedeeltelijk arbeidsongeschikt is;

      g. de voortdurende hulp van derden nodig heeft;

      h. niet of niet langer de voortdurende hulp van derden nodig heeft;

      i. kunstmiddelen behoeft of onderricht in het gebruik daarvan.

      4 Indien wordt vastgesteld dat de gewezen werknemer die recht heeft op ongevallengeld als bedoeld in
      [artikel 5, eerste lid][ref2], niet of niet langer geheel of gedeeltelijk arbeidsongeschikt dan wel verminderd
      arbeidsongeschikt is, wordt de uitkering beëindigd respectievelijk herzien met ingang van de eerste dag van de
      tweede kalendermaand, volgend op het tijdstip waarop de herziene vaststelling van de arbeidsongeschiktheid heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel5
