  - number: 5a
    text: |-
      1 Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba blijkt dat het prijsindexcijfer voor het derde kwartaal van
      het lopende jaar, vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is
      gestegen of gedaald, stelt Onze Minister het bedrag vast, dat met ingang van 1 januari van het komende jaar
      in de plaats treedt van het in [artikel 5, negende lid][ref1], genoemde bedrag. Onze Minister bepaalt welke
      consumentenprijsindexcijfers voor de toepassing van de eerste zin worden gebruikt. De consumentenprijsindexcijfers
      kunnen voor de onderscheiden openbare lichamen en voor belanghebbenden die woonachtig zijn buiten de openbare
      lichamen, verschillend zijn.

      2 Indien er naar het oordeel van Onze Minister bijzondere omstandigheden zijn, kan het bedrag, bedoeld in het
      eerste lid, bij ministeriële regeling met ingang van een bij die regeling aan te geven datum worden gewijzigd.

      3 Het overeenkomstig het eerste lid herziene dan wel overeenkomstig het tweede lid gewijzigde of vastgestelde
      bedrag treedt in de plaats van het bedrag, genoemd in [artikel 5, negende lid][ref2].

      4 Indien een wijziging als bedoeld in het tweede lid samenvalt met een herziening als bedoeld in het eerste lid,
      wordt het bedrag voorafgaande aan de wijziging herzien en geschiedt de herziening bij de in het tweede lid bedoelde
      ministeriële regeling.


