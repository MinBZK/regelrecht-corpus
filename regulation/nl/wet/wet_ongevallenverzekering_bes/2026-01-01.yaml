  - number: '3'
    text: |-
      1 De werknemer aan wie een ongeval is overkomen heeft op grond van deze wet en ongeacht het voortduren van het
      dienstverband recht op een uitkering tegenover Onze Minister.

      2 De nagelaten betrekkingen van de werknemer, die als gevolg van een ongeval is overleden, hebben op grond van deze
      wet recht op een uitkering tegenover Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028497/2026-01-01#Artikel3
  - number: '5'
    text: |-
      1 De werknemer, die als gevolg van het ongeval geheel of gedeeltelijk arbeidsongeschikt is, heeft recht op een
      uitkering tegenover Onze Minister, ongevallengeld genaamd, met ingang van de dag na die van de melding van het
      ongeval.

      2 Bij gehele arbeidsongeschiktheid bedraagt het ongevallengeld per dag:

      a. gedurende de eerste 52 weken: 100% van het loon per dag van de werknemer;

      b. voor de verdere duur: 80% van het loon per dag van de werknemer;

      3 Indien het loon met terugwerkend kracht is verhoogd, wordt voor de bepaling van het ongevallengeld met deze
      verhoging rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer
      is uitbetaald.

      4 Bij gedeeltelijke arbeidsongeschiktheid bedraagt het ongevallengeld per dag gedurende de in het tweede lid
      genoemde tijdvakken een in een evenredige verhouding tot het percentage van de arbeidsongeschiktheid staand deel
      van de in het tweede lid genoemde percentages van het loon per dag.

      5 De werknemer heeft geen recht op ongevallengeld over de zondagen, of de daarvoor voor hem in de plaats tredende
      vrije dagen, terwijl de werknemer voor wie een werkweek van vijf dagen of minder geldt bovendien geen recht heeft
      op ongevallengeld over de vrije zaterdagen of de daarvoor voor hem in de plaats tredende vrije dagen.

      6 Wanneer de werknemer tijdens zijn arbeidsongeschiktheid van zijn werkgever loon ontvangt, wordt het
      ongevallengeld per dag verminderd met het bedrag, waarmede het ongevallengeld en het loon per dag tezamen het
      oorspronkelijke loon per dag overtreft.

      7 a. Van de nagelaten betrekkingen van de als gevolg van het hem overkomen ongeval overleden werknemer hebben, met
      ingang van de dag na die van het overlijden, recht op een uitkering:

      de echtgenote of echtgenoot met wie de overleden werknemer ten tijde van het ongeval gehuwd was, of van wie de
      overledene gescheiden was doch in wier levensonderhoud de overledene moest voorzien, met dien verstande dat de
      uitkering eindigt op de dag dat zij of hij opnieuw in het huwelijk treedt;

      de kinderen van de werknemer in wier levensonderhoud de overledene geheel of gedeeltelijk moest voorzien of
      voorzag;

      de ouders, indien de overledene kostwinner was, tot de dood van de langstlevende met dien verstande dat zij slechts
      dan recht hebben op uitkering, indien eerdergenoemde nagelaten betrekkingen hun volle uitkering hebben ontvangen
      en de maximum uitkering als bedoeld in onderdeel b nog niet is bereikt, terwijl het recht van de ouder van de
      overledene in ieder geval eindigt op de dag, waarop hij of zij opnieuw in het huwelijk treedt.

      b. De uitkering van de echtgenote of echtgenoot bedraagt per dag dertig procent; aan een kind per dag vijftien
      procent, doch twintig procent indien het ouderloos is en aan de ouder of ouders ten hoogste dertig procent van
      het loon per dag van de overleden werknemer, met dien verstande dat de uitkeringen aan alle nagelaten betrekkingen
      tezamen niet meer dan zestig procent van het loon per dag bedragen. Indien de echtgenote of echtgenoot en de
      kinderen tezamen, eventueel de kinderen tezamen, recht zouden hebben op een hogere uitkering dan zestig procent van
      het loon per dag, wordt de uitkering aan ieder evenredig verminderd.

      c. De nagelaten betrekkingen hebben geen recht op uitkeringen over de zondagen, terwijl de nagelaten betrekkingen
      van de werknemer voor wie een vijfdaagse werkweek gold bovendien geen recht hebben op uitkeringen over de
      zaterdagen.

      d. Een kind kan tegelijkertijd slechts op grond van één overlijden uitkering genieten.

      8 a. Het ongevallengeld waartoe de werknemer gerechtigd is, kan indien de arbeidsongeschiktheid langer dan 52
      weken heeft bestaan en vermindering of verdere vermindering daarvan niet is te verwachten, worden omgezet in
      een uitkering ineens bedragende het ongevallengeld per dag, vermenigvuldigd met 1872, indien het loon per dag
      gebaseerd is op een zesdaagse werkweek en met 1560 indien het loon per dag gebaseerd is op een vijfdaagse werkweek.
      In geval het arbeidsongeschiktheidspercentage lager is dan 30% kan de omzetting al dan niet op verzoek van de
      werknemer plaats hebben; in geval het arbeidsongeschiktheidspercentage 30% of hoger is kan de omzetting slechts in
      buitengewone gevallen – ter beoordeling van Onze Minister – plaats hebben, op verzoek van de werknemer.

      b. Indien de werknemer geen Nederlander is en zich vestigt of heeft gevestigd in een plaats buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba kan het ongevallengeld, waartoe hij gerechtigd is, op de onder a bedoelde
      wijze worden omgezet in een uitkering ineens.

      c. Indien de werknemer, die als gevolg van het hem overkomen ongeval is overleden, geen Nederlander was en zijn
      nagelaten betrekkingen zich vestigen of zijn gevestigd in een plaats buiten de openbare lichamen Bonaire, Sint
      Eustatius en Saba kan de uitkering waarop de nagelaten betrekkingen recht hebben worden omgezet in een uitkering
      ineens, bedragende voor ieder van hen het totaal van de periodieke uitkeringen waartoe hij gerechtigd is, doch over
      ten hoogste zes jaren.

      9 De nagelaten betrekkingen van een werknemer die als gevolg van een hem overkomen ongeval is overleden, hebben als
      tegemoetkoming in de begrafeniskosten recht op een uitkering ineens, bedragende USD 5 559 .

      10 De echtgenote, echtgenoot of ouder van de overledene, bedoeld in het zevende lid, onderdeel a, die een huwelijk
      aangaat, heeft recht op een uitkering ineens, bedragende het totaal van de periodieke uitkeringen waartoe zij of
      hij gerechtigd is, over twee jaren.

      11 De overleden werknemer wordt als kostwinner in de zin van het zevende lid, onderdeel a, aangemerkt voor zover de
      overleden werknemer geheel of in overwegende mate in het levensonderhoud van zijn of haar ouders voorzag.

      12 Tijdens het dienstverband is de werkgever in geval van arbeidsongeschiktheid van de werknemer verplicht een
      uitkering gelijk aan het ongevallengeld waarop de werknemer over de desbetreffende loontermijn tegenover Onze
      Minister recht heeft, aan de werknemer uit te betalen op de dag waarop het loon moet worden uitbetaald of zou
      moeten worden uitbetaald indien de werknemer niet arbeidsongeschikt zou zijn. De werkgever die op grond van deze
      verplichting de uitkering uitbetaalt, heeft, in plaats van de werknemer, tegenover Onze Minister recht op het
      desbetreffende ongevallengeld en op uitbetaling daarvan door Onze Minister. Indien de werkgever de uitkering niet
      tijdig uitbetaalt, keert Onze Minister het ongevallengeld aan de werknemer uit.

      13 Ingeval het ongevallengeld, bedoeld in het tweede lid, aan de werknemer persoonlijk door Onze Minister wordt
      uitbetaald, wordt de premie, bedoeld in [artikel 8, tweede lid, van de Wet Ziekteverzekering BES][ref1] door Onze
      Minister op het ongevallengeld ingehouden.

      14 Onze Minister is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders
      van instellingen van sociale voorzieningen, het ongevallengeld van een werknemer, hetzij periodiek, hetzij middels
      een uitkering ineens verstrekt, te verminderen ter ontneming van een ten onrechte verkregen voordeel van de
      werknemer op het gebied van sociale voorzieningen.

      15 Onze Minister is eveneens bevoegd om het ongevallengeld van een werknemer, hetzij periodiek, hetzij middels een
      uitkering ineens verstrekt, te verminderen ter ontneming van een ten onrechte verkregen voordeel van de werknemer
      op het gebied van de door Onze Minister uitbetaalde socialeverzekeringsuitkeringen.

      16 De in het veertiende en vijftiende lid bedoelde vermindering kan ineens geschieden indien het ten onrechte
      genoten voordeel niet groter is dan een derde deel van het door Onze Minister verstrekte ongevallengeld. In alle
      andere gevallen kan de vermindering niet meer bedragen dan een derde deel van het ongevallengeld.

      17 Voor zover het loon per dag meer heeft bedragen dan een door Onze Minister vastgesteld bedrag, blijft het bij de
      berekening van de uitkering buiten aanmerking.


