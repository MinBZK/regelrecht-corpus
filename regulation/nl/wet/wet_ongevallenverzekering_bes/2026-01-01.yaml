  - number: 15c
    text: |-
      1 Een herziening of intrekking van een beschikking op grond van [artikel 12d][ref1], vindt uitsluitend
      plaats indien de herziening of intrekking ziet op een periode op of na de dag van inwerkingtreding van
      [artikel VII, onderdeel Gc][ref2].

      2 Een terugvordering van een ten onrechte uitbetaalde uitkering op grond van [artikel 12e][ref3], vindt
      uitsluitend plaats indien de terugvordering ziet op een periode op of na de dag van inwerkingtreding van
      [artikel VII, onderdeel Gc][ref4].


