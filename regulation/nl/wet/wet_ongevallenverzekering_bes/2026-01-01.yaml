    text: |-
      1 Onverminderd voorschriften als gesteld op grond van [artikel 7, eerste lid, onderdelen d of e][ref1], kunnen
      bij ministeriële regeling controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder dan strikt
      noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De werknemer, dan wel diens nagelaten betrekkingen en werkgever, zijn verplicht de voorschriften op te volgen en
      anderszins aan Onze Minister desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering
      van deze wet.

      3 De werknemer, dan wel diens nagelaten betrekkingen en werkgever, onthouden zich van zeer ernstige misdragingen
      jegens de met de uitvoering van deze wet belaste personen en instanties tijdens het verrichten van hun
      werkzaamheden.


