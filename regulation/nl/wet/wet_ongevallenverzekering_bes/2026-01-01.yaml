  - number: 6a
    text: |-
      1 De beschikking tot toekenning van de uitkering vermeldt het bedrag dat wordt verstrekt aan de werkgever, bedoeld
      in [artikel 5, twaalfde lid, tweede zin][ref1], en indien de werkgever zijn verplichting, genoemd in artikel 5,
      twaalfde lid, eerste zin, niet naleeft, aan de werknemer.

      2 Een beschikking op grond van deze wet wordt gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      3 Deze redelijke termijn is in ieder geval verstreken wanneer Onze Minister binnen acht weken na ontvangst van de
      aanvraag geen beschikking heeft gegeven, noch een mededeling als bedoeld in het vierde lid is gedaan.

      4 Indien de beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel5
