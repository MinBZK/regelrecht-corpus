  - number: 12c
    text: |-
      1 Onze Minister kan de betaling opschorten of schorsen, indien op grond van duidelijke aanwijzingen het oordeel is
      of het gegronde vermoeden bestaat, dat:

      a. het recht op een uitkering niet of niet meer bestaat;

      b. het recht op een lagere uitkering bestaat; of

      c. de werknemer of werkgever een verplichting, die op grond van de [artikelen 12, tweede lid][ref1] en [12b][ref2]
      is opgelegd, niet is nagekomen.

      2 Geen opschorting of schorsing vindt plaats indien het niet nakomen van de verplichting, bedoeld in het eerste
      lid, onderdeel c, redelijkerwijs geen gevolgen kan hebben voor het recht op een uitkering.

      3 Voordat Onze Minister overgaat tot opschorting of schorsing van de betaling, heeft de werknemer of werkgever de
      gelegenheid een zienswijze bekend te maken voor zover:

      a. de beschikking steunt op gegevens over feiten die de werknemer of werkgever betreffen; en

      b. die gegevens niet door de werknemer of werkgever zelf zijn verstrekt.

      4 Onze Minister doet schriftelijk mededeling van de opschorting of schorsing.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028497#Artikel12b
