  - number: '7'
    text: |-
      1 De werknemer heeft geen recht op uitkering of verliest dit recht:

      a. indien het ongeval te wijten is aan zijn opzet of grove schuld, dan wel aan het gebruik van alcoholhoudende
      drank of bedwelmende middelen;

      b. indien en zolang hij zich niet onder behandeling van de behandelende geneeskundige heeft gesteld;

      c. indien hij zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd of de mate van zijn
      arbeidsongeschiktheid toeneemt;

      d. indien hij niet op de tijden en plaatsen, door Onze Minister aangewezen, de behandelende geneeskundige
      toestaat hem te onderzoeken of te behandelen dan wel diens voorschriften niet opvolgt of zich daarnaast aan andere
      geneeskundige behandeling onderwerpt;

      e. indien hij niet op de tijden en plaatsen, door Onze Minister aangewezen, de controlerende geneeskundige toestaat
      hem te onderzoeken;

      f. indien hij de aanwijzingen van de controlerende geneeskundige ook wanneer deze afwijken van de voorschriften van
      de behandelende geneeskundige, niet opvolgt;

      g. indien hij zonder toestemming van Onze Minister het eiland verlaat, waar hem de uitkering wordt verstrekt;

      h. indien hij een uitreiziger is.

      2 De nagelaten betrekkingen van de werknemer, die als gevolg van een hem overkomen ongeval is overleden, hebben
      geen recht op uitkering indien er sprake is van een van de gevallen als bedoeld in het eerste lid, onderdelen a,
      c en h, evenmin als diegene van de nagelaten betrekkingen, die het de werknemer overkomen ongeval opzettelijk,
      door zijn grove schuld of onder de invloed van alcoholhoudende drank of bedwelmende middelen heeft veroorzaakt, en
      evenmin diegene die als nagelaten betrekking een uitreiziger zijn.

      3 Indien de werknemer of diens nagelaten betrekkingen tevens rechten ontlenen aan een buitenlandse soortgelijke
      wettelijke regeling worden de rechten, waarop op grond van deze wet aanspraak bestaat dienovereenkomstig
      verminderd.

      4 Indien de werknemer of diens nagelaten betrekkingen tevens recht hebben op pensioen
      op grond van de [Wet algemene ouderdomsverzekering BES][ref1] of op grond van de
      [Wet algemene weduwen- en wezenverzekering BES][ref2] worden de uitkeringen, waarop op grond van deze wet aanspraak
      bestaat, dienovereenkomstig verminderd met ingang van het tijdstip waarop twee jaren zijn verlopen na de dag van
      de melding van het ongeval bij Onze Minister, onderscheidenlijk in geval de aanspraak op ongevallengeld bestaat op
      grond van dezelfde gebeurtenis als die op grond waarvan het weduwen-, weduwnaars- of wezenpensioen werd toegekend
      of verhoogd. In het laatste geval komt slechts het bedrag waarmede het weduwen- of weduwnaarspensioen werd verhoogd
      voor vermindering in aanmerking.

      5 Voor de persoon, bedoeld in het eerste lid, onderdeel h, herleeft, onverminderd de bepalingen van deze wet,
      het recht op uitkering op de dag dat niet langer het gegronde vermoeden bestaat dat hij zich buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba bevindt met het doel om zich aan te sluiten bij een organisatie als
      bedoeld in [artikel 1, onderdeel p][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028387
      [ref3]: https://wetten.overheid.nl/BWBR0028497#Artikel1
