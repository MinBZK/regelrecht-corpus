  - number: 5b
    text: |-
      1 Het loon per dag waarnaar de uitkering is berekend, wordt voor de werknemer, bedoeld in
      [artikel 5, eerste lid][ref1], van wie het dienstverband is geëindigd, herzien met ingang van de dag waarop en in
      de mate waarin het bedrag, genoemd in [artikel 9, eerste lid, van de Wet minimumlonen BES][ref2] wordt herzien.

      2 Onze Minister maakt in de Staatscourant bekend met ingang van welke dag en met welk percentage een herziening als
      bedoeld in het eerste lid plaatsvindt.

      3 Een herziening van de uitkering als gevolg van een herziening van het dagloon vindt plaats zonder dat dit bij
      beschikking is vastgesteld.

      4 Onze Minister betaalt de herziene uitkering bij de eerstvolgende uitkeringsbetaling nadat de herziening, bedoeld
      in het eerste lid, heeft plaatsgevonden.


