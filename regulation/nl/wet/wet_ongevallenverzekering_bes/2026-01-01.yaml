  - number: '8'
    text: |-
      1 Ter zake van de kosten verbonden aan deze wet is een premie verschuldigd, die gezamenlijk wordt geheven met de
      zorgverzekeringspremie.

      2 De premie, bedoeld in het eerste lid, wordt geheven naar een percentage van het loon van de werknemer.

      3 Het premiepercentage, bedoeld in het tweede lid, wordt met ingang van elk kalenderjaar voor de periode van één
      jaar vastgesteld bij ministeriële regeling in overeenstemming met Onze Minister van Financiën.

      4 Indien het loon met terugwerkende kracht is verhoogd, wordt voor de berekening van de premie met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.

      5 De verschuldigde premie op grond van deze wet wordt door de inspecteur geheven van de werkgever door middel van
      afdracht op aangifte.

      6 De premie, bedoeld in het eerste lid, wordt geheven met overeenkomstige toepassing van
      [hoofdstuk IV van de Wet loonbelasting BES][ref1], met dien verstande dat in plaats van «inhoudingsplichtige»
      telkens gelezen wordt «werkgever».

      7 De premie komt ten gunste van het Rijk.

      8 Ten laste van het Rijk, komen de door Onze Minister verstrekte uitkeringen op grond van deze wet en alle kosten
      verbonden aan de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0028497/2026-01-01#Artikel8
