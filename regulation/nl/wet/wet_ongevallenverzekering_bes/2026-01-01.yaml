      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. *werkgever:* iedere natuurlijke of rechtspersoon, die binnen de openbare lichamen Bonaire, Sint Eustatius of
      Saba één of meer werknemers arbeid doet verrichten, alsmede de natuurlijke of rechtspersoon die, gevestigd binnen
      de openbare lichamen Bonaire, Sint Eustatius of Saba, één of meer werknemers, die eveneens binnen de openbare
      lichamen Bonaire, Sint Eustatius en Saba gevestigd zijn, arbeid doet verrichten in het buitenland;

      c. *werknemer:* een natuurlijk persoon, die met overeenkomstige toepassing van
      [artikel 2 van de Wet loonbelasting BES][ref1] als werknemer wordt beschouwd omdat hij tot een inhoudingsplichtige
      in dienstbetrekking staat, met uitzondering van:

      1°. thuiswerkers, met uitzondering van degenen die werken met bij algemene maatregel van bestuur als gevaarlijk
      aangewezen stoffen,

      2°. de kapitein en schepelingen op zeeschepen van Aruba, Curaçao, Sint Maarten of van de openbare lichamen Bonaire,
      Sint Eustatius en Saba,

      3°. degene, die in dienst is van een publiekrechtelijk lichaam en aan de voor hem geldende rechtspositieregelingen
      recht op uitkering bij ongeval kan ontlenen, en

      4°. de bestuurder of commissaris, bedoeld in
      [artikel 3, tweede lid, onderdeel a, van de Wet loonbelasting BES][ref2];

      d. *behandelende geneeskundige:* de geneeskundige die op aanwijzing of met goedvinden van Onze Minister de
      werknemer onderzoekt of behandelt;

      e. *controlerende geneeskundige:* de geneeskundige die als zodanig door Onze Minister is aangewezen;

      f. *ongeval:* een ongeval dat de werknemer in verband met zijn dienstbetrekking is overkomen en de bij algemene
      maatregel van bestuur aan te wijzen ziekten en lichamelijke letsels, in betrekkelijk korte tijd ontstaan, mits is
      voldaan aan de daarbij gestelde voorwaarden;

      g. *arbeidsongeschiktheid:* de toestand waarin de werknemer verkeert, die als gevolg van een ongeval gedurende een
      etmaal of langer niet in staat is om zijn normale arbeid te verrichten of deze arbeid zo lang niet mag verrichten
      hetzij om een medisch noodzakelijk onderzoek mogelijk te maken hetzij om te voorkomen dat zijn genezing wordt
      belemmerd;

      h. *loon:* het loon, bedoeld in [artikel 6 van de Wet loonbelasting BES][ref3];

      i. *loon per dag van de werknemer voor wie een zesdaagse werkweek geldt:*

      1°. bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal
      werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld door zes,

      2°. bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door zes,

      3°. bij een maandloon: de waarde in het economisch verkeer van het loon per maand vermenigvuldigd met drie en
      gedeeld door 78;

      j. *loon per dag van de werknemer voor wie een vijfdaagse werkweek geldt:*

      1°. bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal
      werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld door vijf,

      2°. bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door vijf,

      3°. bij een maandloon: de waarde in het economisch verkeer van het loon per maand vermenigvuldigd met drie en
      gedeeld door 65;

      k. *loon per dag van een werknemer met een werkweek van minder dan vijf dagen:*

      1°. bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal
      werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld door het aantal dagen waarop de
      werknemer op grond van zijn arbeidsovereenkomst werkt;

      2°. bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door het aantal dagen
      waarop de werknemer op grond van zijn arbeidsovereenkomst werkt;

      3°. bij een maandloon: de waarde in het economisch verkeer van het loon per maand gedeeld door het aantal dagen per
      maand dat op grond van de arbeidsovereenkomst zou zijn gewerkt;

      l. *kinderen:*

      1°. minderjarige wettige en natuurlijke kinderen,

      2°. minderjarige onwettige kinderen ten aanzien van wie de mannelijke werknemer of gewezen werknemer bij
      rechterlijk vonnis is veroordeeld tot het voorzien in het levensonderhoud, dan wel bij authentieke akte de
      onderhoudsplicht heeft erkend, of die met hem in een gezinsverband samenwonen,

      3°. minderjarige aangehuwde en pleegkinderen behorende tot het gezinsverband van de werknemer of gewezen werknemer,
      en

      4°. kinderen, genoemd onder 1°, 2°, en 3° in dit onderdeel, die meerderjarig zijn geworden en wier tijd geheel of
      grotendeels in beslag wordt genomen door of in verband met het volgen van onderwijs of van een beroepsopleiding
      voor zover zij de leeftijd van 25 jaar niet hebben bereikt;

      m. *pleegkinderen:* de kinderen die door de werknemer of gewezen werknemer worden onderhouden en opgevoed als waren
      zij eigen kinderen;

      n. *inspecteur:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;

      o. *ontvanger:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;

      p. *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of
      inlichtingen- en veiligheidsdiensten, gericht aan Onze Minister, is gebleken dat het gegronde vermoeden
      bestaat dat deze persoon zich buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt met het
      doel om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties, bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref4].

      2 Bij algemene maatregel van bestuur kunnen personen, die op grond van het eerste lid niet de hoedanigheid van
      werknemer hebben, als werknemer worden aangemerkt en kunnen hiervoor nadere regels worden gesteld.


