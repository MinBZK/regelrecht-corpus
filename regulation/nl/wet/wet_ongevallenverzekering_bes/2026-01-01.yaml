    text: |-
      1 Op overtreding van [artikel 11, vierde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, twaalfde lid, eerste zin][ref2], [6, eerste lid, tweede zin][ref3],
      [8h][ref4], [12, tweede lid][ref5], en krachtens [artikel 13][ref6] wordt een boete geheven van de tweede
      categorie.

      2 Onder het niet voldoen aan de verplichtingen van [artikel 12, tweede lid][ref7], wordt mede verstaan het
      verstrekken van inlichtingen die onjuist zijn.

      3 Indien er sprake is van herhaling van eenzelfde overtreding binnen twee jaar wordt het maximum van de boetes,
      genoemd in het eerste lid, verdubbeld.

      4 De boete wordt geheven door een beschikking van Onze Minister.


