articles:
  - number: '1'
    text: |-
      In deze landsverordening wordt verstaan onder: - *Minister:* de Minister van Arbeid en Sociale Zaken;
        - *bank:* de Sociale Verzekeringsbank;
        - *werkgever:* iedere natuurlijke of rechtspersoon, die hier te lande een of meer werknemers arbeid doet
      verrichten, alsmede de natuurlijke of rechtspersoon die, hier te lande gevestigd, een of meer werknemers, die
      eveneens hier te lande gevestigd zijn, arbeid doet verrichten in het buitenland;
        - *werknemer:* een ieder die voor een werkgever in dienstverband of persoonlijk in aangenomen werk arbeid verricht,
      behalve: 'voor wat degene betreft, die persoonlijk in aangenomen werk arbeid verricht: indien hij zelf door de bank'
      als werkgever is aangemerkt; ouders en inwonende kinderen van de werkgever tenzij van een normaal dienstverband
      tegen het gebruikelijke loon sprake is; huispersoneel en thuiswerkers, met uitzondering van hen, die arbeiden met
      bij landsbesluit, houdende algemene maatregelen als gevaarlijk aangewezen stoffen; de kapitein en schepelingen op
      Nederlands-Antilliaanse zeeschepen; degene, die in dienst is van een publiekrechtelijk lichaam en aan de voor hem
      geldende rechtspositieregelingen aanspraak op tegemoetkoming bij ongeval kan ontlenen. Indien de in aangenomen werk
      arbeidende persoon, die niet zelf door de bank als werkgever is aangemerkt, zich bij het verrichten van zijn arbeid
      door anderen laat bijstaan, worden ook die anderen beschouwd als werknemer van de werkgever, van wie het werk is
      aangenomen. Bij landsbesluit houdende algemene maatregelen kunnen personen, die ingevolge het voorgaande niet de
      hoedanigheid van werknemer hebben, als werknemer worden aangemerkt, eventueel onder nader te stellen voorwaarden;
        - *Behandelende geneeskundige:* de geneeskundige die op aanwijzing of met goedvinden van de bank de werknemer
      onderzoekt of behandelt;
        - *Controlerende geneeskundige:* de geneeskundige die als zodanig door de bank is aangewezen;
        - *Ongeval:* een ongeval dat de werknemer in verband met zijn dienstbetrekking is overkomen, alsook de bij
      landsbesluit houdende algemene maatregelen aan te wijzen ziekten en lichamelijke letsels, in betrekkelijk korte
      tijd ontstaan, mits voldaan is aan de daarbij gestelde voorwaarden;
        - *Arbeidsongeschiktheid:* de toestand waarin de werknemer verkeert, die als gevolg van een ongeval gedurende een
      etmaal of langer niet in staat is om zijn normale arbeid te verrichten of deze arbeid zo lang niet mag verrichten
      hetzij om een medisch noodzakelijk onderzoek mogelijk te maken hetzij om te voorkomen dat zijn genezing wordt
      belemmerd;
        - *Loon:* elke uitkering in welke vorm ook welke de werknemer als vergoeding voor zijn arbeid ten laste van zijn
      werkgever geniet, alsook ontvangsten van derden, welke van invloed zijn op de voorwaarden der arbeidsovereenkomst,
      behalve: vergoeding voor het verrichten van overwerk in de zin van de Arbeidsregeling 1952 (P.B. 1958, no. 24);
        - *de toeslag op het loon ingevolge artikel 58 van de Landsverordening Algemene Ouderdomsverzekering (P.B. 1960,
      no. 83) en artikel 52 van de Landsverordening Algemene Weduwen- en wezenverzekering (PB. 1965, no. 194):* de
      sociale verzekeringspremies welke ten laste van de werkgever komen; vergoeding boven het normale loon voor het
      tijdelijk verrichten van andere dan de normale arbeid, waartoe hij ingevolge arbeidsovereenkomst met zijn werkgever
      verplicht is; vergoeding welke bij uitzondering wordt gegeven voor het verrichten van een boven het normale
      liggende arbeidsprestatie;
        - *dagloon van de werknemer voor wie een 6-daagse werkweek geldt:* bij een uurloon: de geldswaarde van het loon
      per uur, vermenigvuldigd met het aantal werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld
      door 6; bij een weekloon: de geldswaarde van het loon per week gedeeld door 6; bij een maandloon: de geldswaarde
      van het loon per maand vermenigvuldigd met 3 en gedeeld door 78;
        - *dagloon van de werknemer voor wie een 5-daagse werkweek geldt:* bij een uurloon: de geldswaarde van het loon
      per uur, vermenigvuldigd met het aantal werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld
      door 5; bij een weekloon: de geldswaarde van het loon per week gedeeld door 5; bij een maandloon: de geldswaarde
      van het loon per maand vermenigvuldigd met 3 en gedeeld door 65;
        - *kinderen:* minderjarige wettige en natuurlijke kinderen; minderjarige onwettige kinderen ten aanzien van
      wie de mannelijke werknemer of gewezen werknemer bij rechterlijk vonnis is veroordeeld tot het voorzien in het
      levensonderhoud danwel bij authentieke akte de onderhoudsplicht heeft erkend, of die met hem in een gezinsverband
      samenwonen; minderjarige aangehuwde en pleegkinderen behorende tot het gezinsverband van de werknemer of gewezen
      werknemer; en kinderen, genoemd in de hieraan voorafgaande gedachtenstrepen, die meerderjarig zijn geworden en
      wier tijd geheel of grotendeels in beslag wordt genomen door of in verband met het volgen van onderwijs of van een
      beroepsopleiding voorzover zij de leeftijd van 25 jaar niet hebben bereikt;
        - *pleegkinderen:* de kinderen die door de werknemer of gewezen werknemer worden onderhouden en opgevoed als waren
      zij eigen kinderen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      Werkgever en werknemer stellen bij de aanvang van het dienstverband en telkens, wanneer het loon gewijzigd wordt,
      het dagloon vast met inachtneming van het daaromtrent in [artikel 1][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel1
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '1'
  - number: '2.2'
    text: |-
      Indien het loon geheel of gedeeltelijk bestaat uit huisvesting, verstrekkingen in natura, onderricht of geldelijke
      uitkeringen waarvan de grootte niet bij voorbaat vaststaat zoals provisie, commissie, tantième, fooien, vergoeding
      voor aangenomen werk e.d., bepalen werkgever en werknemer ter vaststelling van het dagloon de gemiddelde
      geldswaarde daarvan.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Indien het aantal werkuren per week, in het geval een uurloon wordt betaald niet bij voorbaat vaststaat, bepalen
      werkgever en werknemer, ter vaststelling van het dagloon het te verwachten gemiddelde aantal werkuren per week.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel2
  - number: '2.4'
    text: |-
      De bank kan al dan niet op verzoek van werkgever of werknemer het dagloon vaststellen of het vastgestelde dagloon
      wijzigen. Zij brengt haar beslissing, welke in de plaats treedt van de beslissing van werkgever en werknemer,
      schriftelijk en met redenen omkleed ter kennis van de werkgever en de werknemer.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel2
  - number: '2.5'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen kunnen regelen worden vastgesteld, welke bij de bepaling van de
      geldswaarde van het niet in geld genoten loon moeten worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De werknemer aan wie een ongeval is overkomen heeft krachtens de bepalingen van deze landsverordening en ongeacht
      het voortduren van het dienstverband tegenover de bank recht op tegemoetkoming, bestaande uit geneeskundige
      behandeling en verpleging, en uitkeringen in geld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      De nagelaten betrekkingen van de werknemer, die als gevolg van een ongeval is overleden, hebben krachtens de
      bepalingen van deze landsverordening tegenover de bank recht op tegemoetkoming, bestaande uit uitkeringen in geld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De werknemer heeft recht op geneeskundige behandeling en verpleging zolang de gevolgen van het ongeval dit
      noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: '4.2'
    text: 'De geneeskundige behandeling en verpleging omvat:'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.a
    text: |-
      geneeskundig onderzoek en geneeskundige behandeling met inbegrip van specialistisch onderzoek en specialistische
      behandeling;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.b
    text: verpleging in een ziekeninrichting met inbegrip van verblijf ter observatie;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.c
    text: verstrekking van geneesmiddelen en verbandmiddelen;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.d
    text: |-
      verstrekking en vernieuwing van kunstmiddelen, welke kunnen bijdragen tot vermindering of opheffing van de
      arbeidsongeschiktheid of tot verbetering van de levensomstandigheden en welke voorkomen op een bij landsbesluit,
      houdende algemene maatregelen vastgestelde lijst;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.e
    text: onderricht in het gebruik van kunstmiddelen als vorenbedoeld;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.f
    text: vervoer;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: 4.2.g
    text: voortdurende hulp van derden
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Op schriftelijk verzoek van de werknemer kan de bank bepalen dat in plaats van geneeskundige behandeling en
      verpleging een vergoeding wordt verstrekt overeenkomstig de regelen daaromtrent bij landsbesluit, houdende algemene
      maatregelen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      De werknemer, die als gevolg van het ongeval geheel of gedeeltelijk arbeidsongeschikt is, heeft recht op een
      uitkering in geld, ongevallengeld genaamd, met ingang van de dag na die van de melding van het ongeval bij de bank.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.2'
    text: 'Bij gehele arbeidsongeschiktheid bedraagt het ongevallengeld per dag:'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.2.a
    text: 'gedurende de eerste 52 weken: 100% van het dagloon van de werknemer;'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.2.b
    text: 'voor de verdere duur: 80% van het dagloon van de werknemer;'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      Indien het loon met terugwerkend kracht is verhoogd, wordt ter bepaling van het ongevallengeld met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.4'
    text: |-
      Bij gedeeltelijke arbeidsongeschiktheid bedraagt het ongevallengeld per dag gedurende de in het tweede lid genoemde
      tijdvakken een in een evenredige verhouding tot het percentage van de arbeidsongeschiktheid staand deel van de in
      het tweede lid genoemde percentages van het dagloon.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.5'
    text: |-
      De werknemer heeft geen recht op ongevallengeld over de zondagen, of de daarvoor voor hem in de plaats tredende
      vrije dagen, terwijl de werknemer voor wie een 5-daagse werkweek geldt bovendien geen recht heeft op ongevallengeld
      over de vrije zaterdagen of de daarvoor voor hem in de plaats tredende vrije dagen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.6'
    text: |-
      Wanneer de werknemer tijdens zijn arbeidsongeschiktheid van zijn werkgever loon ontvangt, wordt het ongevallengeld
      per dag verminderd met het bedrag, waarmede het ongevallengeld en het loon per dag tezamen het oorspronkelijke loon
      per dag overtreft.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.7.a
    text: |-
      Van de nagelaten betrekkingen van de als gevolg van het hem overkomen ongeval overleden werknemer hebben, met
      ingang van de dag na die van het overlijden, recht op een uitkering in geld: de echtgenote of echtgenoot met wie
      de overleden werknemer ten tijde van het ongeval gehuwd was, of van wie de overledene gescheiden was doch in wier
      levensonderhoud de overledene moest voorzien, met dien verstande dat de uitkering eindigt op de dag dat zij of
      hij opnieuw in het huwelijk treedt; de kinderen van de werknemer in wier levensonderhoud de overledene geheel
      of gedeeltelijk moest voorzien of voorzag; de ouders, indien de overledene kostwinner was, tot de dood van de
      langstlevende met dien verstande dat zij slechts dan recht hebben op uitkering, indien eerdergenoemde nagelaten
      betrekkingen hun volle uitkering hebben ontvangen en de maximum uitkering als bedoeld in onderdeel b nog niet
      is bereikt, terwijl het recht van de ouder van de overledene in ieder geval eindigt op de dag, waarop hij of zij
      opnieuw in het huwelijk treedt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.7.b
    text: |-
      De uitkering van de echtgenote of echtgenoot bedraagt per dag dertig procent; aan een kind per dag vijftien
      procent, doch twintig procent indien het ouderloos is en aan de ouder of ouders ten hoogste dertig procent van het
      dagloon van de overleden werknemer, met dien verstande dat de uitkeringen aan alle nagelaten betrekkingen tezamen
      niet meer dan zestig procent van het dagloon bedragen. Indien de echtgenote of echtgenoot en de kinderen tezamen,
      eventueel de kinderen tezamen, recht zouden hebben op een hogere uitkering dan zestig procent van het dagloon,
      wordt de uitkering aan ieder evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.7.c
    text: |-
      De nagelaten betrekkingen hebben geen recht op uitkeringen over de zondagen, terwijl de nagelaten betrekkingen van
      de werknemer voor wie een 5-daagse werkweek gold bovendien geen recht hebben op uitkeringen over de zaterdagen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.7.d
    text: Een kind kan tegelijkertijd slechts op grond van één overlijden uitkering genieten.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.8.a
    text: |-
      Het ongevallengeld waartoe de werknemer gerechtigd is, kan indien de arbeidsongeschiktheid langer dan 52 weken
      heeft bestaan en vermindering of verdere vermindering daarvan niet is te verwachten, worden omgezet in een
      uitkering ineens bedragende het ongevallengeld per dag, vermenigvuldigd met 1872, indien het dagloon gebaseerd
      is op een 6-daagse werkweek en met 1560 indien het dagloon gebaseerd is op een 5-daagse werkweek. In geval het
      arbeidsongeschiktheidspercentage lager is dan 30% kan de omzetting al dan niet op verzoek van de werknemer plaats
      hebben; in geval het arbeidsongeschiktheidspercentage 30% of hoger is kan de omzetting slechts in buitengewone
      gevallen – ter beoordeling van de bank – plaats hebben, op verzoek van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.8.b
    text: |-
      Indien de werknemer geen Nederlander is en zich vestigt of heeft gevestigd in een plaats buiten de Nederlandse
      Antillen kan het ongevallengeld, waartoe hij gerechtigd is, op de onder a bedoelde wijze worden omgezet in een
      uitkering ineens.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: 5.8.c
    text: |-
      Indien de werknemer, die als gevolg van het hem overkomen ongeval is overleden, geen Nederlander was en zijn
      nagelaten betrekkingen zich vestigen of zijn gevestigd in een plaats buiten de Nederlandse Antillen kan de
      uitkering waarop de nagelaten betrekkingen recht hebben worden ongezet in een uitkering ineens, bedragende voor
      ieder van hen het totaal van de periodieke uitkeringen waartoe hij gerechtigd is, doch over ten hoogste zes jaren.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.9'
    text: |-
      De nagelaten betrekkingen van een werknemer die als gevolg van een hem overkomen ongeval is overleden, hebben als
      tegemoetkoming in de begrafeniskosten recht op een uitkering ineens, bedragende f 1000,–.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.10'
    text: |-
      De echtgenote, echtgenoot of ouder van de overledene, bedoeld in het zevende lid, onderdeel a, die een huwelijk
      aangaat, heeft recht op een uitkering ineens, bedragende het totaal van de periodieke uitkeringen waartoe zij of
      hij gerechtigd is, over twee jaren.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.11'
    text: |-
      Wanneer het dagloon van de werknemer, voor wie een 6-daagse werkweek geldt, meer dan NAF 164,25 bedraagt en van de
      werknemer, voor wie een 5-daagse werkweek geldt, meer dan NAF 197,10 bedraagt, komt het meerdere niet in aanmerking
      voor berekening van de uitkeringen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.12'
    text: |-
      De overleden werknemer wordt als kostwinner in de zin van het zevende lid, onderdeel a aangemerkt voor zover hij of
      zij geheel of in overwegende mate in het levensonderhoud van zijn of haar ouders voorzag.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.13'
    text: |-
      Tijdens het dienstverband is de werkgever in geval van arbeidsongeschiktheid van de werknemer verplicht een
      uitkering gelijk aan het ongevallengeld waarop de werknemer over de betreffende loontermijn tegenover de bank
      recht heeft, aan de werknemer uit te betalen op de dag waarop het loon moet worden uitbetaald of zou moeten
      worden uitbetaald indien de werknemer niet arbeidsongeschikt zou zijn. De werkgever die een uitkering volgens het
      bepaalde in de voorgaande volzin heeft uitbetaald heeft, in plaats van de werknemer, tegenover de bank recht op het
      betreffende ongevallengeld en op uitbetaling daarvan uiterlijk zeven dagen na schriftelijke aanvrage bij de bank,
      in te dienen na afloop van de maand waarin de uitkering werd uitbetaald. Indien de werkgever de uitkering niet
      tijdig uitbetaalt, keert de bank het ongevallengeld aan de werknemer uit.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.14'
    text: |-
      Voor het eerst per 1 januari 1977 en vervolgens per 1 januari van elk jaar, kan bij landsbesluit houdende algemene
      maatregelen, met inachtneming van het bepaalde in het volgende lid, een toeslag worden verleend op de in artikel 5,
      tweede en vierde lid respectievelijk het zevende lid, onderdeel a, bedoelde ongevallengelden en uitkeringen indien
      deze zijn of worden toegekend terzake van een ongeval welke vóór de datum waarop de toeslag wordt verleend, heeft
      plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.15'
    text: |-
      De toeslag wordt berekend op basis van de stijging welke het prijsindexcijfer van de gezinsconsumptie voor de
      maand augustus daaraan voorafgaande aangeeft ten opzichte van het prijsindexcijfer voor de maand augustus van het
      voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.16'
    text: |-
      Ingeval het ongevallengeld, bedoeld in het tweede lid, aan de werknemer persoonlijk door de bank wordt uitbetaald,
      wordt de premie, bedoeld in artikel 8, tweede lid, van de Landsverordening Ziekteverzekering (P.B. 1966, no.15)
      door de bank op het ongevallengeld ingehouden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.16'
    text: |-
      De Bank is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders van
      instellingen van sociale voorzieningen, het ongevallengeld van een werknemer, hetzij periodiek, hetzij middels een
      uitkering ineens verstrekt, te verminderen ter ontneming van een ten onrechte verkregen voordeel van de werknemer
      op het gebied van sociale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.17'
    text: |-
      De Bank is eveneens bevoegd om het ongevallengeld van een werknemer, hetzij periodiek, hetzij middels een uitkering
      ineens verstrekt, te verminderen ter ontneming van een ten onrechte verkregen voordeel van de werknemer op het
      gebied van de door de Bank uitgevoerde sociale verzekeringswetten.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '5.18'
    text: |-
      De in het zestiende en zeventiende lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten
      voordeel niet groter is dan een derde deel van het door de Bank verstrekte ongevallengeld. In alle andere gevallen
      kan de vermindering niet meer bedragen dan een derde deel van het ongevallengeld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Zo spoedig mogelijk deelt de bank, mede aan de hand van de bevindingen en voorschriften van de behandelende
      geneeskundige, aan de rechthebbende schriftelijk mede welke tegemoetkoming zal worden verstrekt en eventueel dat en
      op welke gronden de bank zich niet of niet langer tot tegemoetkoming gehouden acht. De werknemer stelt de werkgever
      onverwijld van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Zodra de behandelende geneeskundige bevindt dat de werknemer in verband met de gevolgen van het ongeval: zich
      onder geneeskundige behandeling moet stellen; zich niet of niet langer onder geneeskundige behandeling behoeft
      te stellen: als bedlegerig patiënt behandeld moet worden; niet of niet langer als bedlegerig patiënt behandeld
      behoeft te worden; geheel of gedeeltelijk arbeidsongeschikt is; niet of niet langer geheel of gedeeltelijk
      arbeidsongeschikt is; de voortdurende hulp van derden nodig heeft; niet of niet langer de voortdurende hulp van
      derden nodig heeft; kunstmiddelen behoeft of onderricht in het gebruik daarvan; geeft hij van deze bevindingen en
      zijn daaruit volgende voorschriften kennis aan de bank.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel6
  - number: '7.1'
    text: 'De werknemer heeft geen recht op tegemoetkoming of verliest dit recht:'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.a
    text: |-
      indien het ongeval te wijten is aan zijn opzet of grove schuld, dan wel aan het gebruik van alcoholhoudende drank
      of bedwelmende middelen;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.b
    text: indien en zolang hij zich niet onder behandeling van de behandelende geneeskundige heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.c
    text: |-
      indien hij zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd of de mate van zijn
      arbeidsongeschiktheid toeneemt;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.d
    text: |-
      indien hij niet op de tijden en plaatsen, door de bank aangewezen, de behandelende geneeskundige toestaat hem te
      onderzoeken of te behandelen dan wel diens voorschriften niet opvolgt of zich daarnaast aan andere geneeskundige
      behandeling onderwerpt;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.e
    text: |-
      indien hij niet op de tijden en plaatsen, door de bank aangewezen, de controlerende geneeskundige toestaat hem
      te onderzoeken;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.f
    text: |-
      indien hij de aanwijzingen van de controlerende geneeskundige ook wanneer deze afwijken van de voorschriften van de
      behandelende geneeskundige, niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: 7.1.g
    text: indien hij zonder toestemming van de bank het eiland verlaat, waar hem de tegemoetkoming wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      De nagelaten betrekkingen van de werknemer, die als gevolg van een hem overkomen ongeval is overleden, hebben geen
      recht op tegemoetkoming indien er sprake is van een der gevallen als bedoeld onder a en c van het voorgaande lid,
      evenmin als diegene der nagelaten betrekkingen, die het de werknemer overkomen ongeval opzettelijk, door zijn grove
      schuld of onder de invloed van alcoholhoudende drank of bedwelmende middelen heeft veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Indien de werknemer of diens nagelaten betrekkingen tevens rechten ontlenen aan een buitenlandse soortgelijke
      wettelijke regeling worden de rechten, waarop krachtens deze landsverordening aanspraak bestaat dienovereenkomstig
      verminderd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: '7.4'
    text: |-
      Indien de werknemer of diens nagelaten betrekkingen tevens recht hebben op pensioen krachtens de Landsverordening
      Algemene Ouderdomsverzekering (P .B. 1960, no. 83) of krachtens de Landsverordening Algemene Weduwen- en
      wezenverzekering (P.B. 1965, no. 194)1 worden de uitkeringen, waarop krachtens deze landsverordening aanspraak
      bestaat, dienovereenkomstig verminderd met ingang van het tijdstip waarop twee jaren zijn verlopen na de dag van
      de melding van het ongeval bij de bank, onderscheidenlijk in geval de aanspraak op ongevallengeld bestaat op grond
      van dezelfde gebeurtenis als die op grond waarvan het weduwen-, weduwnaars- of wezenpensioen werd toegekend of
      verhoogd. In het laatste geval komt slechts het bedrag waarmede het weduwen- of weduwnaarspensioen werd verhoogd
      voor vermindering in aanmerking.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      De werkgever is terzake van de kosten aan de uitvoering van deze landsverordening verbonden aan de bank een premie
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De premie wordt berekend naar een percentage van het dagloon van de werknemer. Het percentage wordt vastgesteld bij
      landsbesluit, houdende algemene maatregelen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      Als regel wordt het percentage telkens voor een periode van twee jaren vastgesteld en wel zodanig dat het totaal
      van de over de eerstvolgende periode te ontvangen premies voldoende zal zijn om daaruit de te verwachten uitgaven
      van het ongevallenfonds, bedoeld in het negende lid, over die periode te voldoen, alsmede om een bij landsbesluit,
      houdende algemene maatregelen te bepalen reserve te vormen en in stand te houden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      Wanneer het dagloon van de werknemer voor wie een 6-daagse werkweek geldt meer dan NAF. 164,25 en van de werknemer
      voor wie een 5-daagse werkweek geldt meer dan NAF. 197,10 bedraagt, is over het meerdere geen premie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.5'
    text: |-
      De bedragen, genoemd in het vierde lid en in artikel 5, elfde lid, kunnen bij landsbesluit, houdende algemene
      maatregelen worden aangepast aan de ontwikkeling van de prijsindexcijfers van de gezinsconsumptie. De aanpassing
      heeft plaats met ingang van de eerste dag van enig kalenderjaar op basis van de stijging welke het prijsindexcijfer
      voor de maand augustus daaraan voorafgaande aangeeft ten opzichte van, het prijsindexcijfer voor de maand augustus,
      van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.6'
    text: |-
      Indien het loon met terugwerkende kracht is verhoogd, wordt voor de berekening van de premie met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.7'
    text: De premie wordt ten behoeve van de bank van de werkgever geheven door middel van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.8'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen kunnen de werkgevers naar de werkzaamheden, welke zij doen
      verrichten, in gevarenklassen worden ingedeeld. Daarbij kan worden bepaald, dat en op welke wijze de premie met het
      oog op de gevarenklasse of -klassen, waarin de werkgaver is ingedeeld, wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.9'
    text: |-
      De premie wordt gestort in een door de bank beheerd ongevallenfonds. Bij landsbesluit, houdende algemene
      maatregelen worden voorschriften vastgesteld met betrekking tot de belegging van de gelden van het ongevallenfonds.
      Het bepaalde in de artikelen 3, leden 2, 3, 4 en 5, 4, 21, lid 1, 21a, 21b, 21c en 21d van de Landsverordening
      op de Loonbelasting 1976 (P.B. 1975, no. 254) is van overeenkomstige toepassing ten aanzien van de ingevolge deze
      landsverordening verschuldigde premie, met dien verstande dat in plaats van «inhoudingsplichtige» telkens gelezen
      wordt «werkgever(s)» en dat de Directeur van de Sociale Verzekeringsbank in de plaats treedt van de Inspecteur
      der Belasting.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: '8.10'
    text: |-
      Ten laste van het ongevallenfonds komen de door de bank verstrekte tegemoetkomingen, bedoeld in deze
      landsverordening, alsmede alle andere kosten verbonden aan de uitvoering van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8
  - number: 8a.1
    text: |-
      De werkgever is verplicht de premie, bedoeld in [artikel 8, eerste lid][ref1], binnen vijftien dagen na het einde
      van de maand waarop deze betrekking heeft, op aangifte af te dragen. Indien de werkgever het loon van de werknemer
      over een tijdvak van langer dan een maand uitbetaalt, is de werkgever verplicht de premie binnen vijftien dagen na
      het einde van dat tijdvak, op aangifte af te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel8
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '8'
  - number: 8a.2
    text: De werkgever is niet gerechtigd de af te dragen premie te compenseren met vorderingen op de bank.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8a
  - number: 8a.3
    text: |-
      De aangifte wordt gelijktijdig met de afdracht gedaan bij de bank in het eilandgebied waar de werkgever gevestigd
      is. Indien de werkgever niet binnen de Nederlandse Antillen gevestigd is, geschieden vorenbedoelde aangifte en
      afdracht bij de bank in het eilandgebied waar de betrokken werknemers hun werkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8a
  - number: 8a.4
    text: De bank kan onder door haar te stellen voorwaarden uitstel van het doen van aangifte verlenen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8a
  - number: 8a.5
    text: |-
      De bank kan van de werkgever die de premie over een tijdvak van langer dan een maand moet afdragen, vorderen
      dat hij binnen vijftien dagen na het einde van elke maand een gedeelte van de af te dragen premie bij wijze van
      voorlopige betaling afdraagt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8a
  - number: 8a.6
    text: |-
      Ook in gevallen dat geen premie behoeft te worden afgedragen, moet de aangifte op de in het eerste, derde tot en
      met het vijfde lid aangegeven wijze gedaan worden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8a
  - number: 8b.1
    text: |-
      De bank verstrekt de werkgever het benodigde aantal aangifteformulieren, hetzij op diens verzoek, hetzij
      ambtshalve. De werkgever is, in het geval hij deze formulieren niet van de bank heeft ontvangen, verplicht om de
      bank te verzoeken deze te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8b
  - number: 8b.2
    text: |-
      De werkgever is gehouden het aangifteformulier duidelijk, volledig, stellig en zonder voorbehoud naar waarheid in
      te vullen of te doen invullen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8b
  - number: 8b.3
    text: |-
      De werkgever draagt af onafhankelijk van het feit of en tot welk bedrag andere werkgevers van de werknemer
      afdragen, behoudens een andersluidende beslissing van de bank. Indien er onverschuldigd is betaald, zal de
      onverschuldigd betaalde premie op verzoek naar verhouding van de betaalde premie worden gerestitueerd aan de
      rechthebbenden. De rechtsvordering tot terugbetaling van onverschuldigd betaalde premie verjaart door verloop van
      drie jaren sedert het einde van het kalenderjaar, waarin de premie is afgedragen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8b
  - number: 8b.4
    text: |-
      Een werkgever die de Nederlandse Antillen wenst te verlaten, is verplicht terstond aangifte en afdracht te doen
      over het lopende kalenderjaar:
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8b
  - number: 8c.1
    text: |-
      Indien de premie geheel of gedeeltelijk niet binnen de voorgeschreven termijn is afgedragen, kan de te weinig
      afgedragen premie door middel van een aanslag, op te leggen ten name van de werkgever, nageheven worden, zolang
      niet sedert het einde van het kalenderjaar, waarin de premieschuld is ontstaan, vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8c
  - number: 8c.2
    text: Ten aanzien van eenzelfde tijdvak kunnen meerdere aanslagen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8c
  - number: 8d.1
    text: |-
      Indien de werkgever niet binnen de voorgeschreven termijn aangifte en afdracht doet, danwel het aangifteformulier
      onjuist of onvolledig invult, wordt het bedrag van de premie verhoogd met ten hoogste 100%. Deze verhoging wordt
      als premie beschouwd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8d
  - number: 8d.2
    text: |-
      De verhoging als bedoeld in het eerste lid kan buiten toepassing blijven, indien de in gebreke geblevene uit eigen
      beweging schriftelijk mededeling heeft gedaan, dat ten onrechte geen of te weinig premie is afgedragen en daarbij
      tevens de nodige inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8d
  - number: 8e.1
    text: |-
      De werkgever is gehouden een loonadministratie te voeren, waaruit duidelijk blijkt aan de hand waarvan en de wijze
      waarop de premie is berekend.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8e
  - number: 8e.2
    text: |-
      De loonadministratie moet gedurende vijf jaren na het einde van het kalenderjaar waarop zij betrekking heeft,
      worden bewaard.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8e
  - number: 8f.1
    text: 'Hoofdelijk aansprakelijk is:'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8f
  - number: 8f.1.a
    text: |-
      voor de premie en de administratieve boete verschuldigd respectievelijk af te dragen door een niet binnen de
      Nederlandse Antillen wonende of gevestigde werkgever: de leider van zijn vaste inrichting binnen de Nederlandse
      Antillen, zijn binnen de Nederlandse Antillen wonende of gevestigde vaste vertegenwoordiger danwel degene die de
      leiding heeft van de hier te lande verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8f
  - number: 8f.1.b
    text: |-
      voor de premie en de administratieve boete verschuldigd respectievelijk af te dragen door een binnen de Nederlandse
      Antillen gevestigde rechtspersoon: ieder van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8f
  - number: 8f.1.c
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door twee of meer werkgevers:
      ieder van de werkgevers.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8f
  - number: 8f.2
    text: De heffing van de premie ingevolge het eerste lid geschiedt door middel van een aanslag.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8f
  - number: 8g.1
    text: |-
      De werkgever, diens vaste vertegenwoordiger of degene die de leiding heeft van de hier te lande verrichte
      werkzaamheden is desgevraagd gehouden aan de bank of aan de door deze aangewezen personen en deskundigen inzage
      te verlenen of afschrift te verstrekken van de boeken, bescheiden en geschriften, welke door de bank voor de
      vaststelling van de premie van belang worden geacht.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8g
  - number: 8g.2
    text: |-
      Degene die inzage van de boeken, bescheiden en geschriften, bedoeld in het eerste lid, is gevraagd, wordt geacht
      die in zijn bezit te hebben, tenzij het tegendeel aannemelijk is gemaakt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8g
  - number: 8g.3
    text: |-
      Bij een weigering om te voldoen aan de verplichting, bedoeld in het eerste lid, kan een werkgever, diens vaste
      vertegenwoordiger of degene die de leiding heeft van de hier te lande verrichte werkzaamheden, zich niet met
      vrucht beroepen op de omstandigheid dat hij uit hoofde van zijn stand, zijn beroep of zijn ambt tot geheimhouding
      verplicht is, zelfs al mocht deze hem bij enig wettelijk voorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8g
  - number: 8h
    text: |-
      Het is een ieder verboden hetgeen hem bij de uitvoering van deze landsverordening of in verband daarmede,
      nopens inkomen, opbrengst, uitdelingen, medische gegevens en in het algemeen nopens de zaken of werkzaamheden
      van een ander, blijkt of medegedeeld wordt, verder bekend te maken dan nodig is voor de uitvoering van deze
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8h
  - number: 8i.1
    text: |-
      Invordering van de premie, de administratieve boete en al hetgeen de bank verder uit hoofde van deze
      landsverordening te vorderen heeft, heeft plaats volgens de regelen, welke van toepassing zijn op de invordering
      van de directe belastingen, met dien verstande dat de bank in plaats van de Ontvanger met de invordering is belast.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8i
  - number: 8i.2
    text: |-
      De vordering wegens premie, met inbegrip van alle kosten, is bevoorrecht op alle goederen van de werkgever
      en gaat boven alle andere voorrechten met uitzondering van die ter zake van de directe belastingen, die van
      de [artikelen 287][ref1] en [288, onder a, van Boek 3 van het Burgerlijk Wetboek][ref2], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3], voor zover de daarbedoelde kosten zijn gemaakt na de
      voorlopige of definitieve aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
  - number: 8i.3
    text: Aanslagen zijn invorderbaar vijftien dagen na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8i
  - number: 8i.4
    text: |-
      Indien er sprake is van een geval als bedoeld in [artikel 8b, vierde lid][ref1], is de aanslag terstond
      invorderbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel8b
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: 8b
  - number: '9.1'
    text: |-
      In bijzondere gevallen kan de Minister, gehoord de bank, bepalen dat de werknemer en diens nagelaten betrekkingen
      in plaats van tegenover de bank tegenover de werkgever recht hebben op tegemoetkoming als bedoeld in deze
      landsverordening. In dat geval is de werkgever de premie als bedoeld in artikel 8 niet verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: '9.2'
    text: 'De Minister maakt van zijn in het voorgaande lid bedoelde bevoegdheid slechts gebruik, indien:'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: 9.2.a
    text: |-
      de werkgever tot zekerheid voor de nakoming van zijn verplichtingen garantie stelt volgens nader bij landsbesluit,
      houdende algemene maatregelen te stellen regelen;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: 9.2.b
    text: |-
      de werkgever de beschikking heeft over een medische dienst, welke in staat is de werknemer geneeskundige
      behandeling en verpleging te verstrekken overeenkomstig de bepalingen van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde werkgever is verplicht om de bank op nader door haar vast te stellen wijze opgave
      te doen van de ongevallen, die in zijn bedrijf zijn voorgekomen en met betrekking tot de ongevallen aantekening te
      houden van plaats, tijd en eventueel oorzaak van het ongeval, de behandelende geneeskundige, eventuele getuigen, de
      vaststelling van de tegemoetkoming en de verstrekte uitkeringen in geld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      In de gevallen, waarin de Minister van zijn bevoegdheid, als bedoeld in het eerste lid gebruik heeft gemaakt,
      wordt voor de toepassing van de [artikelen 1][ref1] onder «behandelend geneeskundige», [4 lid 3][ref2],
      [5 lid 1][ref3], [6][ref4] en [7 lid 1 onder d en g][ref5] in plaats van «bank» gelezen «werkgever» en zijn de
      [artikelen 5 lid 12][ref6] en [6 lid 1, tweede volzin][ref7], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028497#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028497#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028497#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0028497#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0028497#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0028497#Artikel6
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028497
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0028497
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0028497
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0028497
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0028497
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0028497
        artikel: '6'
  - number: '9.5'
    text: |-
      De rechthebbende, die bezwaar heeft tegen de beslissing van de werkgever kan binnen drie weken na dagtekening
      daarvan een bezwaarschrift indienen bij de bank. Deze beslist op het bezwaarschrift en brengt haar beslissing,
      welke in de plaats treedt van de beslissing van de werkgever, schriftelijk en met redenen omkleed ter kennis van de
      werkgever en de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: '9.6'
    text: |-
      De vordering van de arbeider [bedoeld zal zijn: werknemer] en diens nagelaten betrekkingen
      wegens de tegemoetkoming is bevoorrecht op alle goederen van de werkgever en gaat boven alle
      andere voorrechten met uitzondering van die terzake van de directe belastingen, die van de
      [artikelen 287][ref1] en [288, onder a, van Boek 3 van het Burgerlijk Wetboek][ref2], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3], voor zover de daar bedoelde kosten zijn gemaakt na het
      ontstaan van de vordering van de arbeider [bedoeld zal zijn: werknemer] of diens nagelaten betrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '9.7'
    text: |-
      De tegemoetkoming aan de in dit artikel bedoelde werknemer of aan diens nagelaten betrekkingen wordt zonder enig
      voorbehoud door de bank gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: '9.8'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen kunnen regelen worden gesteld met inachtneming waarvan de in
      dit artikel bedoelde werkgever de verplichting tot het verstrekken van de in deze landsverordening bedoelde
      tegemoetkoming aan de bank kan overdragen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Tegen een beslissing van de Bank staat voor belanghebbende binnen zes weken na de dag waarop deze is gegeven,
      beroep open bij het Gerecht in eerste aanleg van de Nederlandse Antillen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel10
  - number: 10a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel10a
  - number: 10b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel10b
  - number: 10c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel10c
  - number: '11.1'
    text: |-
      De aanspraken krachtens deze landsverordening vervallen, indien het ongeval niet binnen een jaar na de dag, waarop
      het de werknemer is overkomen, bij de bank hetzij bij de eigen risicodrager is gemeld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      De termijnen van de uitkeringen in geld, welke met zijn ingevorderd binnen twee jaar na de eerste dag waarop zij
      konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Ieder beding, dat de aansprakelijkheid van de werkgever ingevolge de bepalingen van deze landsverordening uitsluit
      of vermindert, is nietig
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.4'
    text: |-
      Het is de werkgever verboden de voor hem uit de bepalingen van deze landsverordening voortvloeiende kosten geheel
      of gedeeltelijk te verhalen op het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.5'
    text: |-
      De werknemer, aan wie een ongeval is overkomen, doch die deswege niet arbeidsongeschikt is geworden, behoudt,
      indien hij ten behoeve van geneeskundige onderzoek of behandeling, noodzakelijk het verrichten van zijn arbeid
      onderbreekt, gedurende die tijd tegenover zijn werkgever recht op loon.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.6'
    text: |-
      De werknemer, die de tegemoetkoming in ontvangst neemt, wordt daardoor niet geacht van het recht op het hem
      eventueel meer toekomende afstand te hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.7'
    text: |-
      Indien de werknemer of diens nagelaten betrekkingen in verband met het ongeval, op grond waarvan een tegemoetkoming
      als bedoeld in deze landsverordening is toegekend, tegen de werkgever een rechtsvordering tot schadevergoeding
      heeft naar burgerlijk recht, wordt die vordering op grond van deze landsverordening niet verloren, doch de
      rechter houdt bij de vaststelling der schadevergoeding rekening met hetgeen krachtens deze landsverordening aan de
      werknemer of diens nagelaten betrekkingen is toegekend.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.8'
    text: |-
      Hij, die gehouden is tot vergoeding der schade door de werknemer of diens nagelaten betrekkingen geleden, als
      gevolg van een ongeval, is voor de tegemoetkoming aan de werknemer of diens nagelaten betrekkingen toegekend
      krachtens deze landsverordening aansprakelijk jegens degene te wiens laste die tegemoetkoming komt. Van degene die
      als vorenbedoeld aansprakelijk is voor een periodieke uitkering krachtens deze landsverordening kan door degene te
      wiens laste die uitkering komt, een daarmede overeenkomende uitkering ineens worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.9'
    text: |-
      De tegemoetkoming is onvervreemdbaar, niet vatbaar voor verpanding of belening, evenmin voor executoriaal of
      conservatoir beslag, noch voor faillissementsbeslag, behalve tot verhaal van het verschuldigde wegens levering
      van levensbehoeften, verstrekt aan degeen tegen wie het beslag gedaan wordt, en tot verhaal van onderhoud waartoe
      degene, die de uitkering geniet, ingevolge wettelijke regelingen is gehouden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '11.10'
    text: |-
      De aansprakelijkheid, volgende uit de bepalingen van deze landsverordening, van de niet hier te lande gevestigde
      werkgever wordt gedragen door zijn hier te lande gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel11
  - number: '12.1'
    text: De bank is belast met de uitvoering van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Een ieder is verplicht ten behoeve van de uitvoering uit eigen beweging of op verzoek aan de bank inlichtingen te
      verstrekken, desverlangd schriftelijk. De door de bank verlangde inlichtingen moeten binnen een door de bank te
      stellen termijn worden verstrekt. Ook is een ieder verplicht de door de bank gegeven aanwijzingen ten behoeve van
      de uitvoering van deze landsverordening op te volgen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      Bij niet naleving van de in tweede lid opgelegde verplichtingen door de werknemer is de bank bevoegd de te
      verstrekken tegemoetkomingen en vergoedingen op te schorten.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12
  - number: 12a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze landsverordening bepaalde zijn belast de directeur,
      de onder-directeur, alsmede het daartoe bij landsbesluit aangewezen overige administratieve personeel van de bank.
      Een zodanige aanwijzing wordt bekendgemaakt in De Curaçaosche Courant.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.2.e
    text: |-
      woningen of tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.4
    text: |-
      Op het binnentreden in woningen of in tot woning bestemde gedeelten van vaartuigen als bedoeld in het
      tweede lid, onderdeel e, is [Titel X van het Derde Boek van het Wetboek van Strafvordering][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: 12a.5
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.6
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die in het
      kader van de toezichtsuitoefening op grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
  - number: 12a.7
    text: |-
      [Artikel 12, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel12
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '12'
  - number: '13'
    text: |-
      Ter uitvoering van deze landsverordening kunnen nadere regelen worden gesteld bij landsbesluit, houdende algemene
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Alle ingevolge deze landsverordening opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij
      van het recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel14
  - number: 14a.1
    text: |-
      Op overtreding van [artikel 11, vierde lid][ref1], en het niet of niet tijdig nakomen van een van de verplichtingen
      gesteld bij de [artikelen 5, dertiende lid, eerste volzin][ref2], [6, eerste lid, tweede volzin][ref3],
      [8b, vierde lid][ref4], [8e][ref5], [8g, eerste lid][ref6], [8h][ref7], [9, derde lid][ref8],
      [12, tweede lid][ref9], en krachtens [artikel 13][ref10] wordt een boete geheven van ten hoogste vijfduizend
      gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028497#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028497#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028497#Artikel8b
      [ref5]: https://wetten.overheid.nl/BWBR0028497#Artikel8e
      [ref6]: https://wetten.overheid.nl/BWBR0028497#Artikel8g
      [ref7]: https://wetten.overheid.nl/BWBR0028497#Artikel8h
      [ref8]: https://wetten.overheid.nl/BWBR0028497#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0028497#Artikel12
      [ref10]: https://wetten.overheid.nl/BWBR0028497#Artikel13
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028497
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028497
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028497
        artikel: 8b
      - id: ref5
        bwb_id: BWBR0028497
        artikel: 8e
      - id: ref6
        bwb_id: BWBR0028497
        artikel: 8g
      - id: ref7
        bwb_id: BWBR0028497
        artikel: 8h
      - id: ref8
        bwb_id: BWBR0028497
        artikel: '9'
      - id: ref9
        bwb_id: BWBR0028497
        artikel: '12'
      - id: ref10
        bwb_id: BWBR0028497
        artikel: '13'
  - number: 14a.2
    text: |-
      Onder het niet voldoen aan de verplichtingen van de [artikelen 9, derde lid][ref1], en [12, tweede lid][ref2],
      wordt mede verstaan het verstrekken van inlichtingen die onjuist zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028497#Artikel12
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028497
        artikel: '12'
  - number: 14a.3
    text: |-
      Indien een aanslag, welke werd opgelegd wegens het niet voldoen aan de verplichting van
      [artikel 8a, zesde lid][ref1], in zijn geheel moet worden verminderd, wordt een boete geheven van honderd gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel8a
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: 8a
  - number: 14a.4
    text: |-
      Indien er sprake is van herhaling van eenzelfde overtreding binnen twee jaar wordt het maximum van de boetes,
      genoemd in het eerste en het derde lid, verdubbeld.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel14a
  - number: 14a.5
    text: De boete wordt geheven middels aanslagen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel14a
  - number: '15.1'
    text: |-
      Overtreding van [artikel 11, vierde lid][ref1], en het niet of niet tijdig nakomen van een van de verplichtingen
      gesteld bij de [artikelen 5, dertiende lid, eerste volzin][ref2], [6, eerste lid, tweede volzin][ref3],
      [8b, vierde lid][ref4], [8e][ref5], [8g, eerste lid][ref6], [8h][ref7], [9, derde lid][ref8],
      [12, tweede lid][ref9] en krachtens [artikel 13][ref10] wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van ten hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028497#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028497#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028497#Artikel8b
      [ref5]: https://wetten.overheid.nl/BWBR0028497#Artikel8e
      [ref6]: https://wetten.overheid.nl/BWBR0028497#Artikel8g
      [ref7]: https://wetten.overheid.nl/BWBR0028497#Artikel8h
      [ref8]: https://wetten.overheid.nl/BWBR0028497#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0028497#Artikel12
      [ref10]: https://wetten.overheid.nl/BWBR0028497#Artikel13
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028497
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028497
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028497
        artikel: 8b
      - id: ref5
        bwb_id: BWBR0028497
        artikel: 8e
      - id: ref6
        bwb_id: BWBR0028497
        artikel: 8g
      - id: ref7
        bwb_id: BWBR0028497
        artikel: 8h
      - id: ref8
        bwb_id: BWBR0028497
        artikel: '9'
      - id: ref9
        bwb_id: BWBR0028497
        artikel: '12'
      - id: ref10
        bwb_id: BWBR0028497
        artikel: '13'
  - number: '15.2'
    text: |-
      Het opzettelijk, mondeling of schriftelijk verstrekken of doen verstrekken van inlichtingen als bedoeld in de
      [artikelen 9, derde lid][ref1], en [12, tweede lid][ref2], die onjuist zijn alsmede het afleggen van een valse
      verklaring aan de bank, wordt gestraft met gevangenisstraf van ten hoogste één jaar of een geldboete van ten
      hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028497#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028497#Artikel12
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028497
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028497
        artikel: '12'
  - number: '15.3'
    text: |-
      Het opzettelijk door giften, beloften, misbruik van gezag, geweld, bedreiging of misleiding bewegen van een
      werknemer om geen gebruik te maken van een hem volgens deze landsverordening toekomend recht wordt gestraft met
      gevangenisstraf van ten hoogste één jaar of geldboete van ten hoogste tienduizend gulden.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15
  - number: '15.4'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn overtredingen en de in het tweede en derde lid strafbaar
      gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15
  - number: 15a
    text: |-
      Een administratieve boete vervalt, indien degene die haar heeft belopen, wegens het feit op grond waarvan boete is
      verschuldigd, onherroepelijk is veroordeeld, is vrijgesproken of is ontslagen van rechtsvervolging.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15a
  - number: 15b.1
    text: |-
      Met de opsporing van de bij deze landsverordening strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren, belast de directeur, de onder-
      directeur, het daartoe bij landsbesluit aangewezen overige administratieve personeel van de bank, alsmede de
      daartoe bij landsbesluit aangewezen ambtenaren van de Inspectie der Belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 15b.2
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de vereisten
      waaraan de krachtens het eerste lid aangewezen personen dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel15b
  - number: '16.1'
    text: |-
      Deze landsverordening, welke kan worden aangehaald als «Landsverordening Ongevallenverzekering», treedt in werking
      op een nader bij landsbesluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel16
  - number: '16.2'
    text: Op het tijdstip als bedoeld in het voorgaande lid vervalt de Ongevallenregeling 1936 (P.B. 1946, no. 103).
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel16
  - number: '16.3'
    text: |-
      Aanspraken op tegemoetkoming krachtens de Ongevallenregeling 1936 opgrond van ongevallen, welke vóór de dag van
      inwerkingtreding van deze landsverordening hebben plaats gehad, blijven nadien van kracht doch worden geacht
      te bestaan krachtens deze landsverordening. De tegemoetkomingen komen ten laste van degene, te wiens laste die
      tegemoetkomingen krachtens de Ongevallenregeling 1936 zouden zijn gekomen; zij worden verstrekt door de bank tenzij
      degene te wiens laste zij komen wederom eigen risicodrager is. Betreft de tegemoetkoming een periodieke uitkering
      welke de bank verstrekt, dan kan de bank een daarmede overeenkomende uitkering ineens vorderen van degene te wiens
      laste die uitkering komt.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel16
  - number: '16.4'
    text: |-
      De op het tijdstip van inwerkingtreding van deze landsverordening bestaande verzekeringsovereenkomsten, gesloten
      ingevolge het bepaalde in artikel 10, lid 1 van de Ongevallenregeling 1936, eindigen op genoemd tijdstip.
    url: https://wetten.overheid.nl/BWBR0028497/2010-10-10#Artikel16
