$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatbesluit_bzk_2012
regulatory_layer: WET
publication_date: '2016-09-29'
valid_from: '2016-07-07'
bwb_id: BWBR0031837
url: https://wetten.overheid.nl/BWBR0031837/2016-07-07
preamble:
  text: |-
    Gelet op de Algemene wet bestuursrecht;

    Mede gelet op de Comptabiliteitswet 2011 en het Besluit privaatrechtelijke rechtshandelingen 1996;

    Mede gelet op het Koninklijk besluit van 18 oktober 1988, houdende regeling van de functie en verantwoordelijkheid
    van de Secretaris-generaal;

    Besluiten vast te stellen het navolgende Mandaatbesluit:
  url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
  - number: 1.1.a
    text: '*Ministerie:* het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
  - number: 1.1.b
    text: |-
      *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel de Minister voor Wonen en
      Rijksdienst, afhankelijk van het beleidsterrein;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
  - number: 1.1.c
    text: |-
      *stuk:* een schriftelijk stuk dat een besluit inhoudt of een ander schriftelijk stuk dat wordt toegerekend aan
      de Minister;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
  - number: 1.1.d
    text: |-
      *diensthoofd:* een directeur-generaal, de hoofddirecteur van de Dienst Concernstaf en Bedrijfsvoering of de
      Nationaal Commissaris Digitale Overheid;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
  - number: 1.1.e
    text: |-
      *directeur:* de leidinggevende werkzaam binnen een in het [Organisatiebesluit BZK 2012][ref1] genoemd
      dienstonderdeel die rechtstreeks ressorteert onder een directeur-generaal, de hoofddirecteur van de Dienst
      Concernstaf en Bedrijfsvoering of de Nationaal Commissaris Digitale Overheid;


      [ref1]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0031833
  - number: 1.1.f
    text: '*mandaat:* de bevoegdheid om namens de Minister besluiten te nemen en stukken af te doen en te ondertekenen;'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
  - number: 1.1.g
    text: |-
      *werkterrein:* de taken van de betreffende functionaris en zijn dienstonderdeel overeenkomstig het
      [Organisatiebesluit BZK 2012][ref1] en de daarop gebaseerde besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0031833
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.2
  - number: 1.2.a
    text: 'volmacht: de bevoegdheid om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te verrichten;'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.2
  - number: 1.2.b
    text: |-
      machtiging: de bevoegdheid om namens de Minister handelingen te verrichten die noch een besluit noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel1.2
  - number: '2.1'
    text: 'Mandaat wordt niet verleend met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.a
    text: het vaststellen van een algemeen verbindend voorschrift;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.b
    text: |-
      het beslissen op een bezwaarschrift tegen een besluit dat persoonlijk door de Minister onderscheidenlijk de
      Secretaris-generaal is genomen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.c
    text: het beslissen op een beroepschrift;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.d
    text: het instellen van een agentschap of baten-lastendienst bij het Ministerie;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.e
    text: het oprichten van een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.f
    text: het geven van aanwijzingen aan een ander bestuursorgaan op grond van een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.g
    text: het toepassen van aanwijzing 3 van de Aanwijzingen inzake externe contacten van rijksambtenaren;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.h
    text: |-
      het vaststellen van de organisatie van het Ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: 2.1.i
    text: de verantwoordelijkheid voor departementale verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.j
    text: |-
      het uitoefenen van de op grond van departementale regelgeving aan de Minister voorbehouden bevoegdheden met
      betrekking tot vertrouwensfuncties en veiligheidsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.k
    text: |-
      het instellen van een adviescommissie of klachtencommissie waarvan de voorzitter geen deel uitmaakt van het
      Ministerie en niet werkzaam is onder verantwoordelijkheid van de Minister, en het benoemen en ontslaan van de
      (plaatsvervangend) voorzitter en (plaatsvervangend) leden van die commissie;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.l
    text: het benoemen en ontslaan van departementale vertrouwenspersonen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.m
    text: |-
      het verlenen van goedkeuring aan, het schorsen of het vernietigen van, dan wel het onthouden van goedkeuring aan
      besluiten van een ander bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.n
    text: |-
      het definitief buiten invordering stellen onderscheidenlijk kwijtschelden van vorderingen op derden vanaf door de
      Minister van Financiën vastgestelde grensbedragen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.o
    text: |-
      het definitief vaststellen van een sectorale arbeidsvoorwaardenovereenkomst waarvoor de Minister verantwoordelijk
      is;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.p
    text: |-
      een stuk dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een beslissing neemt die door
      de Minister behoort te worden genomen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.1.q
    text: politieke of maatschappelijke aangelegenheden van principiële aard.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.1
  - number: 2.2.1
    text: 'Mandaat wordt eveneens niet verleend met betrekking tot het afdoen en ondertekenen van stukken aan:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.a
    text: de Koning;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.b
    text: de Raad van Ministers (van het Koninkrijk) en daaruit gevormde onderraden en commissies;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.c
    text: |-
      de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van uit de Kamers gevormde
      commissies;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.d
    text: een minister of een staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.e
    text: de Raad van State (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.f
    text: de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.g
    text: de Nationale Ombudsman;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.h
    text: de Gouverneurs van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.i
    text: de Ministers van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.j
    text: de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.k
    text: de besturen van de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.1.l
    text: buitenlandse autoriteiten, in rang gelijk aan of hoger dan een minister of een staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: 2.2.2
    text: |-
      In afwijking van het eerste lid kan in bijzondere gevallen voor bepaalde aangelegenheden door de Minister aan de
      Secretaris-generaal of een diensthoofd of algemeen directeur mandaat worden verleend.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel2.2
  - number: '3.1'
    text: |-
      Aan de Secretaris-generaal wordt mandaat verleend ten aanzien van aangelegenheden die, gelet op het
      __REF000___________________________________________________________________________________________________________
      _________________, behoren tot het werkterrein van de Secretaris-generaal en die, onverminderd het bepaalde in dit
      besluit, redelijkerwijs niet behoren te worden voorgelegd aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '3.2'
    text: 'Onverminderd het bepaalde in dit besluit heeft het mandaat van de Secretaris-generaal in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.a
    text: |-
      het werkterrein van de functionarissen en organisatieonderdelen van het Ministerie, met uitzondering van de taken,
      genoemd in het Organisatiebesluit Bureau Algemene Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.b
    text: |-
      het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het Ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.c
    text: |-
      het vaststellen van de formatie van het Ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: 3.2.d
    text: |-
      het rechtstreeks leiding geven aan de diensthoofden en overige rechtstreeks onder de Secretaris-generaal
      ressorterende functionarissen, voor zover ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst
      niet anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.e
    text: |-
      het nader vaststellen van de inrichting van de onder de directeuren-generaal, de hoofddirecteur van de Dienst
      Concernstaf en Bedrijfsvoering en de Nationaal Commissaris Digitale Overheid ressorterende dienstonderdelen op
      grond van het [Organisatiebesluit BZK 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031833
  - number: 3.2.f
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.g
    text: |-
      het beslissen op bezwaarschriften, anders dan bedoeld in [artikel 4.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel4
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 3.2.h
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering van
      de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 3.2.i
    text: |-
      het behandelen van klachten ingevolge een wettelijke regeling met betrekking tot klachtrecht, waarover door een
      commissie wordt gerapporteerd of geadviseerd;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.j
    text: |-
      het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 3.2.k
    text: |-
      personele beheersbeslissingen op grond van het [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref1]
      ten aanzien van de directeuren van de Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: 3.2.l
    text: |-
      de verantwoordelijkheid voor het beheer van de archiefbescheiden bij het Ministerie op grond van de geldende
      regelgeving;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.m
    text: |-
      het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het Ministerie is
      betrokken;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.n
    text: het vaststellen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in dit artikel;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
  - number: 3.2.o
    text: |-
      het beslissen op bezwaarschriften tegen de door de directeur-generaal van de Algemene
      Inlichtingen- en Veiligheidsdienst genomen besluiten met betrekking tot aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '4'
  - number: 3.2.p
    text: |-
      het wijzigen van [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: 3.3.1
    text: |-
      Het mandaat van de Secretaris-generaal is niet van toepassing op het nemen van besluiten en het afdoen en
      ondertekenen van stukken met betrekking tot beslissingen ten aanzien van de directeur-generaal voor de Algemene
      Bestuursdienst, voor zover deze samenhangen met de taken, genoemd in het Organisatiebesluit Bureau Algemene
      Bestuursdienst.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.3
  - number: 3.3.2
    text: |-
      Het mandaat van de Secretaris-generaal is evenmin van toepassing op de bevoegdheden die zijn toegedeeld aan het
      bestuur en de voorzitter van de huurcommissie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.3
  - number: 3.3.3
    text: |-
      Voor het aangaan van (meerjarige) verplichtingen op het terrein van ICT boven de 10 miljoen euro inclusief BTW per
      (meerjarige) verplichting heeft de Secretaris-generaal volmacht samen met het betreffende diensthoofd
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.3
  - number: 3.4.1
    text: |-
      De Secretaris-generaal is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.4
  - number: 3.4.2
    text: |-
      De Secretaris-generaal kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris of in bijzondere gevallen aan een andere functionaris, ten aanzien van aangelegenheden op het
      werkterrein van die functionaris.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.4
  - number: 3.4.3
    text: |-
      De Secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van deze paragraaf, mondeling of
      schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met
      inachtneming van [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '3.5'
    text: |-
      De Secretaris-generaal verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 3.4, derde lid][ref1], beschreven situatie, na advies van de directeur Constitutionele Zaken en Wetgeving,
      de directeur Financieel-economische Zaken en de directeur Personeel en Organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel3
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.6.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de Secretaris-generaal worden diens taken uitgeoefend door het
      diensthoofd of de diensthoofden, die bij schriftelijk besluit van de Secretaris-generaal in overeenstemming met de
      Minister is of zijn aangewezen als plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.6
  - number: 3.6.2
    text: |-
      Bij gebreke van voornoemd besluit of bij afwezigheid van de aangewezen plaatsvervanger(s) is één van de
      diensthoofden, naar anciënniteit van de benoeming in de functie, met de plaatsvervanging belast.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel3.6
  - number: '4.1'
    text: |-
      Aan het diensthoofd wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van het
      diensthoofd en die, onverminderd het bepaalde in dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan
      een hoger bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.1
  - number: '4.2'
    text: 'Onverminderd het bepaalde in dit besluit, heeft het mandaat van het diensthoofd in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.a
    text: |-
      het werkterrein van het diensthoofd en de onder het diensthoofd ressorterende functionarissen en dienstonderdelen
      en het uitoefenen van integraal management dienaangaande met inbegrip van aangelegenheden op organisatorisch,
      personeel, financieel en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.b
    text: |-
      het vaststellen van de capaciteitsplannen binnen de door de Secretaris-generaal vastgestelde formatie van de onder
      de diensthoofden ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.c
    text: het leiding geven aan de rechtstreeks onder het diensthoofd ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.d
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van de onder het diensthoofd ressorterende dienstonderdelen, voor zover niet een onder het
      diensthoofd ressorterende functionaris als zodanig optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 4.2.e
    text: |-
      het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel is
      betrokken;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.f
    text: |-
      het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van het
      diensthoofd;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.g
    text: |-
      het beheer van de archiefbescheiden van de onder het diensthoofd ressorterende dienstonderdelen op grond van de
      desbetreffende departementale regelgeving;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.h
    text: |-
      het afnemen van de eed of de belofte van ambtenaren die worden aangesteld bij een onder het diensthoofd
      ressorterend dienstonderdeel;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.2.i
    text: |-
      het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn werkterrein,
      en met uitzondering van die besluiten die door de Minister, de Secretaris-generaal of het diensthoofd zijn genomen,
      onverminderd [artikel 4.3][ref1] en voor zover in wet- en regelgeving niet anders is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel4
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.j
    text: het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.2
  - number: 4.3.1
    text: |-
      Het mandaat van de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst
      omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '4'
  - number: 4.3.2
    text: Het eerste lid is niet van toepassing op bezwaarschriften dienaangaande.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.3
  - number: '4.4'
    text: 'Het mandaat van de directeur-generaal Bestuur en Koninkrijksrelaties omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.4
  - number: 4.4.a
    text: |-
      de leiding van het overleg met de centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van
      overheidswerkgevers, bedoeld in de [Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008494
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0008494
  - number: 4.4.b
    text: |-
      de bevoegdheid om te beslissen op bezwaarschriften tegen namens de Minister genomen besluiten met betrekking tot
      de uitvoering van de begroting voor Koninkrijksrelaties, met uitzondering van besluiten die door de Minister, de
      Secretaris-generaal of de directeur-generaal Bestuur en Koninkrijksrelaties zijn genomen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.4
  - number: '4.5'
    text: |-
      Het mandaat van de directeur-generaal Organisatie en Bedrijfsvoering Rijk omvat tevens de leiding van het overleg
      met de Sectorcommissie overleg rijkspersoneel, genoemd in het [Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '4.7'
    text: |-
      Het mandaat van de directeur-generaal Wonen en Bouwen omvat tevens het beslissen op verzoeken om informatie, als
      bedoeld in [artikel 6, tweede lid, van de Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008536#Artikel6
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0008536
        artikel: '6'
  - number: '4.8'
    text: |-
      Het mandaat van de directeur-generaal Rijksvastgoedbedrijf omvat tevens het beslissen op verzoeken om informatie, als
      bedoeld in [artikel 6, tweede lid, van de Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008536#Artikel6
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0008536
        artikel: '6'
  - number: 4.9.1
    text: |-
      Het mandaat om te beslissen op bezwaarschriften tegen besluiten met betrekking tot een personele aangelegenheid
      wordt uitgeoefend door de hoofddirecteur Dienst Concernstaf en Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.9
  - number: 4.9.2
    text: |-
      Het mandaat om de Minister namens de Staat in gerechtelijke procedures met betrekking tot een personele
      aangelegenheid te vertegenwoordigen wordt uitgeoefend door de hoofddirecteur Concernstaf en Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.9
  - number: '4.10'
    text: |-
      Het mandaat van het diensthoofd is niet van toepassing op het nemen van besluiten en het afdoen en ondertekenen van
      stukken met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
  - number: 4.10.a
    text: |-
      de onderdeeloverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het
      Ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
  - number: 4.10.b
    text: |-
      het nader vaststellen van de inrichting van de onder de diensthoofden ressorterende dienstonderdelen op basis van
      het [Organisatiebesluit BZK 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0031833
  - number: 4.10.c
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
  - number: 4.10.d
    text: |-
      het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 4.10.e
    text: |-
      personele beheersbeslissingen op grond van het [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref1]
      ten aanzien van de directeuren van de Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: 4.10.f
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering van
      de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 4.10.g
    text: |-
      het optreden als bevoegd gezag als bedoeld in het [Besluit melden vermoeden van misstand bij Rijk en Politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0026951
  - number: 4.10.h
    text: |-
      het verlenen van ontslag aan een ambtenaar op grond van [artikel 125e van de Ambtenarenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 4.10.i
    text: |-
      het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in
      dit artikel;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
  - number: 4.10.j
    text: |-
      het toekennen van vergoeding van representatiekosten op grond van
      [artikel 68a Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel68a
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 68a
  - number: 4.10a
    text: |-
      Het mandaat van de directeur-generaal Bestuur en Koninkrijksrelaties is niet van toepassing op het nemen van
      besluiten en het afdoen en ondertekenen van stukken met betrekking tot personele beheersbeslissingen op grond van
      het Mandaatbesluit Colleges financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.10a
  - number: 4.11.1
    text: |-
      Het mandaat van het diensthoofd met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan het diensthoofd ter beschikking is gesteld op basis van een door de
      Secretaris-generaal en de directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van dat deel
      van de begroting waarvoor het diensthoofd verantwoordelijk is, met een maximumbedrag per (meerjarige) verplichting
      als vermeld in de [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: 4.11.2
    text: |-
      Het diensthoofd is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door de Minister of de
      Secretaris-generaal, met instemming van de directeur Financieel-economische Zaken.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.11
  - number: 4.11.3
    text: |-
      In afwijking van het eerste en het tweede lid geldt voor het diensthoofd van een baten-lastendienst dat hij
      verantwoordelijk is voor een kostendekkende exploitatie binnen de afspraken die hij met de eigenaar en de
      opdrachtgevers heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.11
  - number: 4.11.4
    text: |-
      Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor DBFMO-trajecten,
      reguliere projecten, integrale beheercontracten en huurcontracten heeft de directeur-generaal Rijksvastgoedbedrijf
      volmacht samen met de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.11
  - number: 4.11.5
    text: Het diensthoofd legt over het door hem gevoerde financiële beheer verantwoording af aan de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.11
  - number: 4.12.1
    text: |-
      Het diensthoofd is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan. De directeur-generaal Rijksvastgoedbedrijf kan tevens
      ondermandaat verlenen ten aanzien van personele bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.12
  - number: 4.12.2
    text: |-
      Het diensthoofd kan bij toepassing van de bevoegdheid tot het verlenen van ondermandaat, bedoeld in het eerste
      lid, afwijken van hetgeen in dit besluit is bepaald over het mandaat van de algemeen directeur of de directeur, met
      uitzondering van het bepaalde in [artikel 6.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel6
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 4.12.3
    text: |-
      Het diensthoofd is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde
      in het eerste en tweede lid, mondeling of schriftelijk ondermandaat te verlenen aan
      een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: 4.12.4
    text: |-
      Het diensthoofd kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      of in bijzondere gevallen aan een andere functionaris, ten aanzien van aangelegenheden op het werkterrein van de
      functionaris.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.12
  - number: 4.12.5
    text: |-
      Het verlenen van ondermandaat door het diensthoofd, niet zijnde een diensthoofd die leiding geeft aan een baten-
      lasten dienst of een agentschap, voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel
      mogelijk aan in [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming
      van het aldaar genoemde maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: '4.13'
    text: |-
      Het diensthoofd verleent ondermandaat bij schriftelijk besluit, in overeenstemming met de Secretaris-generaal en na
      advies van de directeur Financieel-economische Zaken en de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.13
  - number: 4.14.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van het diensthoofd worden diens taken volledig uitgeoefend door het
      plaatsvervangend diensthoofd.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.14
  - number: 4.14.2
    text: |-
      De aanwijzing van een plaatsvervangend diensthoofd geschiedt door het diensthoofd met inachtneming van het
      [Organisatiebesluit BZK 2012][ref1] en in overeenstemming met de Secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0031833
  - number: 4.14.3
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van het diensthoofd, niet zijnde een diensthoofd die
      leiding geeft aan een baten-lasten dienst of een agentschap en het plaatsvervangend diensthoofd worden de taken van
      het diensthoofd bij wijze van plaatsvervanging uitgeoefend door de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel4.14
  - number: '6.1'
    text: |-
      Aan de directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van de
      directeur en die, onverminderd dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan een hoger bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.1
  - number: '6.2'
    text: 'Onverminderd dit besluit, heeft het mandaat van de directeur in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
  - number: 6.2.a
    text: |-
      het werkterrein van de directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen en het
      uitoefenen van integraal management dienaangaande met inbegrip van aangelegenheden op organisatorisch, personeel,
      financieel en materieel gebied;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
  - number: 6.2.b
    text: het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
  - number: 6.2.c
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 6.2.d
    text: |-
      het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel is
      betrokken;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
  - number: 6.2.e
    text: |-
      het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding voert
      voor zover het een buitendienst, agentschap of baten-lastendienst betreft.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
  - number: 6.2.f
    text: |-
      het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn werkterrein,
      en met uitzondering van die besluiten die door de Minister, de Secretaris-generaal, het diensthoofd of de directeur
      zijn genomen, voor zover in wet- en regelgeving niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.2
  - number: '6.3'
    text: 'De directeur Financieel-economische Zaken is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.3
  - number: 6.3.a
    text: |-
      tot het af doen en ondertekenen van stukken in verband met de uitvoering van
      [artikel 21 van de Comptabiliteitswet 2001][ref1] en het [Besluit taak FEZ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0005333
  - number: 6.3.b
    text: |-
      tot het geven van instructies aan de onderdelen die verantwoordelijk zijn voor de financiële bedrijfsvoering en
      control;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.3
  - number: 6.3.c
    text: |-
      tot het inhoudelijk aansturen van onderdelen die zijn betrokken bij het bewaken van en adviseren over de uitvoering
      van de bedrijfsvoering in brede zin;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.3
  - number: 6.3.d
    text: |-
      tot het met inachtneming van dit besluit tekenen en afdoen van stukken met betrekking tot het werkterrein van de
      hoofddirecteur van de Dienst Concernstaf en Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.3
  - number: '6.4'
    text: 'De directeur Personeel en Organisatie is met inachtneming van dit besluit bevoegd:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
  - number: 6.4.a
    text: |-
      tot het ondertekenen van procedurele stukken in het kader van de behandeling van bezwaarschriften tegen besluiten
      van of namens de Minister met betrekking tot een personele aangelegenheid;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
  - number: 6.4.b
    text: |-
      tot het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het Ministerie inzake
      rechtspositionele vraagstukken;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
  - number: 6.4.c
    text: tot het ondertekenen van brieven met betrekking tot het voeren van de salarisadministratie bij de directie;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
  - number: 6.4.d
    text: |-
      tot het afdoen en ondertekenen van stukken met betrekking tot het aangaan van raamovereenkomsten inzake
      organisatie-advisering, opleiding, scholing, training en assessments bij het Ministerie, en overeenkomsten inzake
      departementale vervoersregelingen, arbeidsomstandigheden, bedrijfsmaatschappelijk werk en kinderopvang;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
  - number: 6.4.e
    text: |-
      tot het afdoen en ondertekenen van stukken met betrekking tot de vergoeding van representatiekosten op grond van
      [artikel 68a Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel68a
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 68a
  - number: 6.4.f
    text: |-
      tot het geven van vakinhoudelijke instructies aan de P&O-afdelingen van alle dienstonderdelen en tot het geven van
      advies aan managers op het gebied van P&O zaken van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.4
  - number: '6.5'
    text: |-
      De directeur Communicatie is met inachtneming van dit besluit bevoegd om stukken af te doen en te ondertekenen
      met betrekking tot het aangaan van raamovereenkomsten inzake de inzet van media ten behoeve van departementale
      voorlichting en communicatie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5
  - number: 6.5a
    text: |-
      De directeur Bestuur, Democratie en Financiën is met inachtneming van dit besluit bevoegd tot het afdoen en
      ondertekenen van stukken in verband met de uitvoering van de [Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0036443
  - number: 6.5b
    text: |-
      De directeur Organisatie Personeelsbeleid Rijk is met inachtneming van dit besluit bevoegd om stukken af te doen en
      te ondertekenen die voortvloeien uit:
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5b
  - number: 6.5b.a
    text: het centraal opdrachtgeverschap aan P-Direkt voor de uitvoering van de standaard dienstverlening;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5b
  - number: 6.5b.b
    text: het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5b
  - number: 6.5c
    text: |-
      De directeur Faciliteiten-, Huisvesting- en Inkoopbeleid Rijk is met inachtneming van dit besluit bevoegd om
      stukken af te doen en te ondertekenen die voortvloeien uit:
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5c
  - number: 6.5c.a
    text: het centraal opdrachtgeverschap aan FM Haaglanden voor de uitvoering van de standaard dienstverlening;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5c
  - number: 6.5c.b
    text: het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.5c
  - number: 6.6.1
    text: |-
      Het mandaat van de directeur is niet van toepassing op het nemen van besluiten en het afdoen en ondertekenen van
      stukken met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.a
    text: |-
      personele aangelegenheden ten aanzien van rechtstreeks onder het diensthoofd of de algemeen directeur ressorterende
      functionarissen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.b
    text: het aanstellen van een ambtenaar;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.c
    text: het verlenen van een gratificatie bij ambtsjubileum;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.d
    text: het opleggen van een disciplinaire straf;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.e
    text: het schorsen van een ambtenaar in zijn ambt;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.f
    text: het verlenen van ontslag aan een ambtenaar;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.g
    text: het aanwijzen van een ambtenaar als herplaatsingskandidaat;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.h
    text: |-
      het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd of de algemeen directeur, tenzij deze bevoegdheid in hogere regelgeving aan de desbetreffende
      functionaris is toegekend;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.i
    text: het besluiten tot een reorganisatie in de zin van de rechtspositieregeling;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.j
    text: het toekennen van materiële schadevergoeding vanaf € 2.500,– of immateriële schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.k
    text: het vaststellen van de formatie van de onder de diensthoofden ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.6.1.l
    text: |-
      de onderwerpen genoemd in [artikel 4.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel4
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 6.6.2
    text: |-
      De beperkingen genoemd in het eerste lid, onderdeel b tot en met f, gelden niet voor het mandaat van de directeur
      die leiding geeft aan een baten-lastendienst of agentschap, of aan een organisatieonderdeel waarbij de ambtenaren
      niet aangesteld worden op het niveau van het dienstonderdeel (flexibilisering), maar op het niveau van het
      desbetreffende organisatieonderdeel.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.6
  - number: 6.7.1
    text: |-
      Het mandaat van de directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van uitgaven
      is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door het diensthoofd
      en de DG-controller goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor de directeur
      verantwoordelijk is met een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: 6.7.2
    text: |-
      De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door de Minister, de Secretaris-
      generaal of het diensthoofd, met instemming van de DG-Controller en binnen het vastgestelde budget dat aan het
      diensthoofd ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.7
  - number: 6.7.3
    text: De directeur legt over het door hem gevoerde financiële beheer verantwoording af aan het diensthoofd.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.7
  - number: 6.7.4
    text: |-
      In afwijking van de voorgaande leden geldt voor een directeur van een baten-lastendienst of agentschap dat hij
      verantwoordelijk is voor een kostendekkende exploitatie binnen de afspraken die hij met opdrachtgevers en de
      eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen en het doen van uitgaven geldt voor de
      directeur een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: 6.7.5
    text: |-
      Het maximum bedrag per (meerjarige) verplichting, bedoeld in het eerste lid, is niet van toepassing op mandaat dat
      is verleend ten aanzien van het centraal opdrachtgeverschap.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.7
  - number: 6.8.1
    text: |-
      De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder hem
      ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.8
  - number: 6.8.2
    text: |-
      De directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de bevoegdheid
      toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende functionaris
      ten aanzien van aangelegenheden op het werkterrein van de functionaris.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.8
  - number: 6.8.3
    text: |-
      De directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste en tweede lid, mondeling of
      schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met
      inachtneming van [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: 6.8.4
    text: |-
      De directeur is bevoegd tot het verlenen van ondermandaat aan de rechtstreeks onder de directeur ressorterende
      afdelingshoofden en aan de rechtstreeks onder de afdelingshoofden ressorterende leidinggevenden ten aanzien van het
      vaststellen van beoordelingen, indien en voor zover deze functionarissen zelf leidinggevenden aansturen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.8
  - number: 6.8.5
    text: |-
      Het verlenen van ondermandaat door de directeur, niet zijnde een directeur die leiding geeft aan een baten-lasten
      dienst of een agentschap, voor het aangaan van financiële verplichtingen en het doen van uitgaven is enkel mogelijk
      aan in [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende functionarissen met inachtneming van het
      aldaar genoemde maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0031837
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0031837
  - number: 6.9.1
    text: |-
      De directeur verleent ondermandaat bij schriftelijk besluit, in overeenstemming met het diensthoofd en met
      kennisgeving aan de directeur Personeel en Organisatie en de directeur Financieel-economische Zaken.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.9
  - number: 6.9.2
    text: |-
      De door de directeur gemandateerde, bedoeld in [artikel 6.8, eerste lid][ref1], verleent ondermandaat bij
      schriftelijk besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur Personeel en
      Organisatie en aan de directeur Financieel-economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel6
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '6.10'
    text: |-
      De rechtstreeks onder de directeur ressorterende leidinggevenden zijn, voor zover door de directeur met
      toepassing van [artikel 6.8, eerste lid][ref1], niet anders is bepaald, ten aanzien van de onder hen ressorterende
      functionarissen bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel6
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6.10.a
    text: het vaststellen van het wekelijkse werkrooster;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.10
  - number: 6.10.b
    text: het verlenen van vakantieverlof;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.10
  - number: 6.10.c
    text: het verlenen van buitengewoon verlof van korte duur;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.10
  - number: 6.10.d
    text: het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.10
  - number: 6.10.e
    text: |-
      het voeren respectievelijk de verslaglegging van het gesprek, bedoeld in
      [artikel 71 van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
  - number: 6.11.1
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de directeur worden diens taken volledig uitgeoefend door de
      plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.11
  - number: 6.11.2
    text: |-
      De aanwijzing van een plaatsvervangend directeur geschiedt door de directeur met inachtneming van het
      [Organisatiebesluit BZK 2012][ref1] en in overeenstemming met het diensthoofd of de algemeen directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0031833
  - number: 6.11.3
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur worden
      de taken van de directeur bij wijze van plaatsvervanging uitgeoefend door het diensthoofd.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.11
  - number: 6.11.4
    text: |-
      In afwijking van het vorige lid kan de plaatsvervanging van de directeur die leiding geeft aan een baten-
      lastendienst of agentschap volledig worden uitgeoefend door de functionaris die daartoe door de directeur in
      overeenstemming met het diensthoofd is aangewezen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel6.11
  - number: '7.1'
    text: 'De uitoefening van een mandaat geschiedt met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.1
  - number: 7.1.a
    text: algemene en bijzondere aanwijzingen van de mandaatgever ten aanzien van de uitoefening van het mandaat;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.1
  - number: 7.1.b
    text: departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.1
  - number: 7.1.c
    text: |-
      de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in het
      bijzonder de [Comptabiliteitswet 2001][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het departementale
      kader voor externe inhuur, het [Organisatiebesluit BZK 2012][ref5] en (de richtlijnen inzake) administratieve
      organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0031833
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0007804
      - id: ref4
        bwb_id: BWBR0005333
      - id: ref5
        bwb_id: BWBR0031833
  - number: 7.2.1
    text: |-
      De uitoefening van een mandaat geschiedt binnen de door de Secretaris-generaal vastgestelde kaders met betrekking
      tot het beleid en beheer inzake de bedrijfsvoering van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.2
  - number: 7.2.2
    text: De uitoefening van een mandaat, geschiedt met inachtneming van de departementale procedures en richtlijnen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.2
  - number: 7.2.3
    text: |-
      Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de Secretaris-generaal, de directeur Financieel-economische Zaken en de directeur
      van het dienstonderdeel binnen de Dienst Concernstaf en Bedrijfsvoering die het aangaat en wordt schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.2
  - number: 7.3.1
    text: |-
      De gemandateerde is verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die
      inzicht bieden in het door en namens de gemandateerde gevoerde financiële beheer en beheer van niet-geldelijke
      zaken op grond van diens mandaat.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.3
  - number: 7.3.2
    text: |-
      De directeur Financieel-economische Zaken is bevoegd om de administraties, bedoeld in het eerste lid, te
      onderzoeken ten behoeve van de uitvoering van taken behorende tot hun werkterrein.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.3
  - number: 7.4.1
    text: |-
      Ondertekening van besluiten en stukken op grond van mandaat vindt plaats op de volgende
      wijze: De Minister van Binnenlandse Zaken en Koninkrijksrelaties, namens deze, (handtekening)
      (naam..............................................................................................................
      .................................
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.4
  - number: 7.4.2
    text: |-
      In afwijking van het eerste lid wordt een beslissing in het kader van het beleidsdeel inzake
      wonen en rijksdienst als volgt ondertekend: De Minister voor Wonen en Rijksdienst, namens
      deze...............................................................................................................
      .................. (handtekening)
      (naam) ............................................................................................................
      .............................. (aanduiding functie
      gemandateerde).........................................................................................
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.4
  - number: 7.4.3
    text: |-
      Bij ondertekening van besluiten en stukken op grond van volmacht wordt de aanduiding van de Minister voorafgegaan
      door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.4
  - number: 7.4.4
    text: 'Bij ondertekening van besluiten en stukken door een plaatsvervanger wordt de handtekening voorafgegaan door: b/a.'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.4
  - number: '7.5'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de Minister, de Secretaris-generaal, het diensthoofd of de
      algemeen directeur over de doorverlening van zijn mandaat.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel7.5
  - number: 8.1.1
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.1
  - number: 8.1.2
    text: |-
      De Secretaris-generaal, de diensthoofden, de directeuren, ieder voor zover het hem aangaat, zijn verantwoordelijk
      voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een
      goed beheer van dit besluit onderscheidenlijk het mandaatregister mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.1
  - number: 8.1.3
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.1
  - number: 8.1.4
    text: |-
      De directeur Personeel en Organisatie rapporteert aan de Minister en de Secretaris-generaal over het beheer van dit
      besluit en het centrale mandaatregister.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.1
  - number: 8.2.1
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor de inrichting en het beheer van een centraal
      mandaatregister.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.2
  - number: 8.2.2
    text: 'Het register biedt inzicht in:'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.2
  - number: 8.2.2.a
    text: |-
      de functies en namen van functionarissen aan wie door of namens de Minister (onder)mandaat is (door)verleend, met
      aanduiding van de verleende bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.2
  - number: 8.2.2.b
    text: |-
      de functies en namen van functionarissen die de Minister vertegenwoordigen in een (bestuurs)orgaan van een
      rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.2
  - number: 8.2.3
    text: Het register is openbaar.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.2
  - number: 8.2.4
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor de gegevensverstrekking uit het register. Bij de uitvoering
      van deze werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving en de
      directeur Communicatie.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.2
  - number: 8.3.1
    text: |-
      In afwijking van [artikel 7.2, tweede lid][ref1], worden gegevens met betrekking tot de verlening van ondermandaat
      aan functionarissen in de rang van directeur en daaronder ressorterende functionarissen bij de Algemene
      Inlichtingen- en Veiligheidsdienst opgenomen in een door de directeur-generaal van de Algemene Inlichtingen- en
      Veiligheidsdienst bijgehouden mandaatregister.


      [ref1]: https://wetten.overheid.nl/BWBR0031837#Artikel7
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0031837
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.3.2
    text: |-
      De directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de Secretaris-
      generaal nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.3
  - number: '8.4'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel8.4
  - number: 9.1.1
    text: |-
      Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen op de terreinen van het voormalige Ministerie van Justitie en het voormalige Ministerie van
      Volkshuisvesting, Ruimtelijke Ordening en Milieu die met ingang van 14 oktober 2010 bij het Ministerie zijn
      ondergebracht en waarin op het tijdstip van inwerkingtreding van dit besluit niet is voorzien, blijven van kracht
      totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in
      intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel9.1
  - number: 9.1.2
    text: |-
      Besluiten of handelingen die op grond van het [Mandaatbesluit BZK 2009][ref1] zijn genomen of verricht in de
      periode van 14 oktober 2010 tot de datum van inwerkingtreding van dit besluit en waarin op het tijdstip van
      inwerkingtreding van dit besluit niet is voorzien, worden aangemerkt als te zijn genomen of verricht namens de
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0027413
  - number: '9.2'
    text: |-
      Het [Mandaatbesluit BZK 2009][ref1], de
      [Tijdelijke regeling mandaat, volmacht en machtiging Immigratie en Asiel][ref2] en het
      [Tijdelijk besluit mandaat, volmacht en machtiging Wonen, Wijken en Integratie, en Rijksgebouwendienst][ref3]
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0027413
      [ref2]: https://wetten.overheid.nl/BWBR0028860
      [ref3]: https://wetten.overheid.nl/BWBR0029897
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0027413
      - id: ref2
        bwb_id: BWBR0028860
      - id: ref3
        bwb_id: BWBR0029897
  - number: '9.3'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 14 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel9.3
  - number: '9.4'
    text: 'Dit besluit wordt aangehaald als: Mandaatbesluit BZK 2012.'
    url: https://wetten.overheid.nl/BWBR0031837/2016-07-07#Artikel9.4
