  - number: '13'
    text: |-
      De secretaris en de ambtenaren van staat leggen alvorens hun ambt te aanvaarden in een vergadering van de Raad in
      handen van de voorzitter, de volgende eed (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke
      naam of welk voorwendsel ook, aan iemand iets heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, van niemand enig geschenk of enige
      belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk.

      Ik zweer (beloof) dat ik al de plichten, aan mijn ambt verbonden, eerlijk en vlijtig zal vervullen.

      Zo waarlijk helpe mij God almachtig!»

      (Dat verklaar en beloof ik»).
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel13
  - number: '14'
    text: |-
      1 Op voorstel van de vice-president regelt de Raad zijn werkzaamheden alsmede voor zover nodig de overige
      aangelegenheden welke op het college betrekking hebben en niet uitsluitend de Afdeling advisering of de Afdeling
      bestuursrechtspraak aangaan.

      2 De regeling wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel14
  - number: '15'
    text: |-
      1 De Raad beslist bij meerderheid van stemmen.

      2 Indien de stemmen staken, beslist de stem van de voorzitter der vergadering.

      3 De Raad beslist niet, indien minder dan de helft van het aantal leden aanwezig is, waaruit de Raad, de vice-
      president inbegrepen, op dat moment bestaat.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel15
  - number: '16'
    text: |-
      De vice-president, de leden, de staatsraden en de staatsraden in buitengewone dienst nemen geheimhouding in acht,
      voorzover:

      a. de aard van de aangelegenheid daartoe noopt;

      b. Onze Minister wie het aangaat dit nodig acht, of

      c. de meerderheid van degenen die aan de beraadslaging deelnemen daartoe besluit.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel16
  - number: 16a
    text: |-
      1 De Raad kent een Afdeling advisering.

      2 De Afdeling advisering bestaat uit:

      a. de vice-president en

      b. de leden, de staatsraden en de staatsraden in buitengewone dienst die in de Afdeling advisering zijn benoemd.

      3 De leden van het koninklijk huis, bedoeld in [artikel 1, tweede en derde lid][ref1], hebben zitting in de
      Afdeling advisering. Artikel 1, vierde lid, is van overeenkomstige toepassing.

      4 De vice-president is voorzitter van de Afdeling advisering. [Artikel 7][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel7
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel16a
