  - number: '11'
    text: |-
      1 Aan de Raad worden toegevoegd een secretaris en het nodige aantal ambtenaren van staat.

      2 Zij worden bij koninklijk besluit op voordracht van de Raad benoemd en bij koninklijk besluit, de Raad gehoord,
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel11
  - number: '12'
    text: |-
      1 Voor benoeming tot secretaris of ambtenaar van staat komt in aanmerking degene:

      a. aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs door een universiteit dan wel de Open Universiteit waarop de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek betrekking heeft, de graad Bachelor op het gebied van het recht en tevens de graad
      Master op het gebied van het recht is verleend, of

      b. die op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester te
      voeren heeft verkregen.

      [Artikel 5, vierde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2] is van overeenkomstige toepassing.

      2 Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.

      3 In bijzondere gevallen kan van het eerste lid worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel12
    references:
