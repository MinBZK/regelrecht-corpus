  - number: 27a
    text: |-
      1 Bij de voorbereiding van adviezen en ontwerp-besluiten beraadslaagt de Afdeling advisering met gesloten deuren.

      2 De Afdeling advisering beslist bij meerderheid van stemmen.

      3 Indien de stemmen staken, beslist de stem van de voorzitter der vergadering. Van die omstandigheid wordt in het
      advies melding gemaakt.

      4 De Afdeling advisering beslist niet, indien minder dan de helft van de leden van de Afdeling advisering aanwezig
      is.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel27a
  - number: 27b
    text: |-
      1 De adviezen zijn met redenen omkleed.

      2 Degene die in de vergadering van de Afdeling advisering een van de meerderheid afwijkende mening heeft kenbaar
      gemaakt, kan een afzonderlijk advies uitbrengen.

      3 Dit advies wordt bij het advies van de Afdeling advisering gevoegd.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel27b
  - number: 27c
    text: |-
      1 De voorzitter regelt de werkzaamheden van de Afdeling advisering.

      2 De regeling wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel27c
  - number: 27d
    text: |-
      1 Bij de voorbereiding van:

      a. een advies omtrent de vernietiging van een besluit, of

      b. een ontwerp-besluit omtrent een geschil als bedoeld in [artikel 136 van de Grondwet][ref1], kan de Afdeling
      advisering belanghebbenden, getuigen, deskundigen en tolken oproepen om te worden gehoord.

      2 [Artikel 45][ref2] en de [artikelen 8:24][ref3], [8:25][ref4], [8:27 tot en met 8:29][ref5],
      [8:31 tot en met 8:36, eerste lid][ref6], [8:39][ref7], [8:50][ref8] en
      [8:61 van de Algemene wet bestuursrecht][ref9] zijn van overeenkomstige toepassing.

      3 Een door Onze Minister wie het aangaat aangewezen ambtenaar kan bij de beraadslaging aanwezig zijn om
      inlichtingen te geven.

      4 Ambtsberichten en andere door Onze Minister aangewezen stukken zijn niet openbaar.

      5 Het ontwerp van een koninklijk besluit tot vernietiging is niet openbaar.


