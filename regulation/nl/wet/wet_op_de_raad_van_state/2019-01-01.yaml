  - number: 30b
    text: De Afdeling bestuursrechtspraak is belast met de berechting van de bij de wet aan haar opgedragen geschillen.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel30b
  - number: '42'
    text: |-
      1 De Afdeling bestuursrechtspraak vormt en bezet op voorstel van de voorzitter enkelvoudige, meervoudige en grote
      kamers.

      2 De meervoudige kamers en grote kamers bestaan uit drie onderscheidenlijk vijf leden, van wie een als voorzitter
      optreedt.

      3 Leden van de Afdeling bestuursrechtspraak die niet voldoen aan het vereiste, gesteld in
      [artikel 2, vierde lid][ref1], kunnen:

      a. geen zitting hebben in een enkelvoudige kamer en

      b. niet de meerderheid vormen van de leden van een meervoudige of grote kamer.

      4 Een lid van de Afdeling bestuursrechtspraak dat betrokken is geweest bij de totstandkoming van een advies van de
      Raad, neemt geen deel aan de behandeling van een geschil over een rechtsvraag waarop dat advies betrekking had.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel2
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '43'
    text: |-
      1 De voorzitter van een meervoudige of grote kamer doet in raadkamer hoofdelijk omvraag. De voorzitter maakt zelf
      als laatste zijn oordeel kenbaar.

      2 Ieder lid is verplicht aan de besluitvorming deel te nemen.

      3 Een afwezig lid kan zijn oordeel niet door een van de aanwezige leden doen voordragen of het schriftelijk
      uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel43
  - number: '44'
    text: |-
      Het is de leden van de Afdeling bestuursrechtspraak en de ten behoeve van deze afdeling werkzame ambtenaren
      verboden:

      a. hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie
      wordt gevorderd,

      b. de gevoelens te openbaren die in raadkamer zijn geuit, en

      c. over een voor hen aanhangige zaak of over een zaak die naar zij weten of redelijkerwijs kunnen vermoeden, voor
      hen aanhangig zal worden, op enigerlei bijzondere wijze in contact te treden met partijen, gemachtigden of degene
      die een partij bijstaat.
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel44
  - number: '45'
    text: |-
      1 De voorzitter van de Afdeling bestuursrechtspraak stelt een regeling vast voor de behandeling van klachten.

      2 Klachten kunnen niet een rechterlijke uitspraak betreffen.

      3 [Titel 9.1 van de Algemene wet bestuursrecht][ref1], met uitzondering van de zinsnede «of een ander» in
      [artikel 9:1, eerste lid][ref2], is van overeenkomstige toepassing, met dien verstande dat onder bestuursorgaan
      wordt verstaan: de Afdeling bestuursrechtspraak.

      4 De regeling, bedoeld in het eerste lid, wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:1
  - number: '58'
    text: |-
      1 Tegen de vice-president, de staatsraden en de staatsraden in buitengewone dienst kan noch een rechtsvervolging,
      noch een rechtsvordering worden ingesteld wegens hetgeen zij tijdens de beraadslaging in de Raad, de Afdeling
      advisering, de Afdeling bestuursrechtspraak of een kamer van die Afdeling bestuursrechtspraak hebben gezegd, dan
      wel daaraan schriftelijk hebben overgelegd.

      2 [Artikel 42 van de Wet rechtspositie rechterlijke ambtenaren][ref1] is van overeenkomstige toepassing op de leden
      van de Afdeling bestuursrechtspraak, met dien verstande dat in plaats van «Onze Minister» steeds wordt gelezen: de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel42
    url: https://wetten.overheid.nl/BWBR0002367/2019-01-01#Artikel58
