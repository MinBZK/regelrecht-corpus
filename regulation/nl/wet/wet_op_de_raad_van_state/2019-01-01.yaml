  - number: '3'
    text: |-
      1 De vice-president en de leden worden bij koninklijk besluit ontslagen:

      a. op eigen verzoek, en

      b. met ingang van de eerste dag van de maand, volgend op die, waarin zij de leeftijd van zeventig jaren hebben
      bereikt.

      2 De vice-president en de leden worden voorts door de Raad, bij met redenen omkleed besluit,
      ontslagen, geschorst, of bij ongeschiktheid wegens ziekte met een andere taak belast, en de
      leden worden door de vice-president, bij met redenen omkleed besluit, berispt overeenkomstig
      [hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met dien verstande dat:

        - in plaats van «procureur-generaal» wordt gelezen: vice-president;
        - in plaats van «plaatsvervangend procureur-generaal» wordt gelezen: het oudste aanwezige lid, naar rang van
      benoeming;
        - in plaats van «bij een gerecht dan wel binnen het gezagsbereik van Onze Minister» wordt gelezen: binnen de Raad
      dan wel binnen het gezagsbereik van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - in plaats van «functionele autoriteit» wordt gelezen: vice-president;
        - de Raad de mededeling van een beslissing als bedoeld in
      [artikel 46p, vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2], doet aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.

      3 De [artikelen 46i, vijfde lid][ref3], [46k, vijfde lid][ref4], en
      [46l, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref5] zijn van overeenkomstige toepassing, met
      dien verstande dat wordt gelezen:

        - in plaats van «de rechterlijke ambtenaar»: de vice-president of het lid;
        - in plaats van «op voordracht van Onze Minister»: op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties;
        - in plaats van «de Hoge Raad»: de Raad.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot
      voorzieningen in verband met ziekte, arbeidsongeschiktheid en werkloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
