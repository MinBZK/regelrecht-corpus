  - number: 18a.2
    text: Het ontwerp van een koninklijk besluit tot vernietiging is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel18a
  - number: 18a.3
    text: |-
      Een door Onze Minister wie het aangaat aangewezen ambtenaar kan in een vergadering als bedoeld in het eerste lid
      aanwezig zijn om inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel18a
  - number: '19'
    text: |-
      De Raad regelt de werkzaamheden van de algemene vergadering en de in [artikel 17][ref1] bedoelde afdelingen,
      alsmede voor zover nodig de overige aangelegenheden, welke op het college betrekking hebben en niet uitsluitend de
      Afdeling bestuursrechtspraak aangaan. De regeling wordt in de *Staatscourant* bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel17
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '17'
        hoofdstuk: I
  - number: '20'
    text: |-
      In de gevallen, bedoeld in [artikel 15][ref1], wordt de aangelegenheid hetzij door de Koning, op voordracht van
      Onze Minister wie het aangaat, hetzij door Onze Minister krachtens koninklijke machtiging, ter overweging aanhangig
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '15'
        hoofdstuk: I
  - number: '21.1'
    text: |-
      Onze Ministers geven aan de Raad of aan zijn afdelingen de inlichtingen, die in verband met de te behandelen zaken
      vereist worden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel21
  - number: '21.2'
    text: |-
      Het inwinnen door de Raad en zijn afdelingen van inlichtingen bij anderen dan Onze Minister, wie de zaak aangaat,
      geschiedt door tussenkomst van deze.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel21
  - number: '21.3'
    text: De vice-president kan personen oproepen om aan de Raad of zijn afdelingen voorlichting en advies te geven.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel21
  - number: '22'
    text: De Raad beraadslaagt met Onze Minister, wie de zaak aangaat, indien de Raad of de Minister zulks mocht verlangen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel22
  - number: '23.1'
    text: |-
      Het aantal staatsraden, de vice-president en de staatsraden in buitengewone dienst daaronder begrepen, dat tot
      het vaststellen van een advies van de Raad wordt gevorderd, bedraagt niet minder dan de helft van het aantal
      staatsraden, waaruit de Raad, de vice-president inbegrepen, bestaat op het ogenblik, waarop het advies wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel23
  - number: '23.2'
    text: |-
      Het advies wordt vastgesteld bij volstrekte meerderheid van stemmen. Bij staking van stemmen beslist de stem van de
      voorzitter der vergadering. Van die omstandigheid wordt in het advies melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel23
  - number: '24.1'
    text: Het advies van de Raad is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel24
  - number: '24.2'
    text: |-
      Hij, die in de vergadering een mening kenbaar heeft gemaakt, van die der meerderheid afwijkende, kan zich in deze
      vergadering de bevoegdheid voorbehouden tot het uitbrengen van een afzonderlijk advies, hetwelk bij het advies van
      de Raad wordt gevoegd.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel24
  - number: 24a
    text: |-
      De vice-president, de staatsraden en de staatsraden in buitengewone dienst nemen geen deel aan de beraadslagingen
      en stemmen niet mee, indien daardoor hun onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel24a
  - number: 24b
    text: |-
      De vice-president, de staatsraden en de staatsraden in buitengewone dienst nemen geheimhouding in acht indien deze
      door de Koning of door Onze Minister wie de zaak aangaat nodig is geoordeeld dan wel indien de meerderheid van
      degenen die aan de beraadslaging deelnemen, daartoe heeft besloten.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel24b
  - number: '25'
    text: Van de koninklijke besluiten in zaken, waarover de Raad is gehoord, wordt aan deze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25
  - number: 25a.1
    text: Onze Minister wie het rechtstreeks aangaat draagt zorg voor het openbaar maken van
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
  - number: 25a.1.a
    text: adviezen van de Raad, door Ons gevraagd,
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
  - number: 25a.1.b
    text: |-
      voordrachten en andere voorstellen Ons gedaan ingevolge [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel16
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '16'
        hoofdstuk: I
  - number: 25a.2
    text: |-
      Openbaarmaking van de adviezen, bedoeld in het eerste lid onder *a,* geschiedt te zamen met openbaarmaking van de
      aan de Raad voorgelegde tekst, voor zover daarin wijzigingen zijn aangebracht nadat het advies is gevraagd, en van
      het nader rapport aan Ons. Zij heeft plaats voor wat betreft - adviezen over door Ons ingezonden voorstellen van
      wet: gelijktijdig met de inzending daarvan aan de Tweede Kamer der Staten-Generaal;
        - adviezen over voorstellen van wet door de Staten-Generaal aan Ons gedaan: gelijktijdig met de afkondiging van
      de wet;
        - adviezen over verdragen met andere mogendheden en volkenrechtelijke organisaties, aan de Staten-Generaal ter
      stilzwijgende goedkeuring over te leggen: gelijktijdig met de overlegging daarvan aan de Staten-Generaal;
        - adviezen over algemene maatregelen van bestuur en andere koninklijke besluiten: gelijktijdig met de afkondiging.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
  - number: 25a.3
    text: |-
      Openbaarmaking van adviezen als bedoeld in het eerste lid, onder *a*, welke niet kan geschieden zoals voorzien in
      het tweede lid, alsmede openbaarmaking van voordrachten en andere voorstellen, gedaan ingevolge [artikel 16][ref1],
      geschiedt uiterlijk binnen dertig dagen nadat is beslist op het advies, de voordracht of een ander voorstel van de
      Raad. Daarbij worden mede openbaar gemaakt het nader rapport en, in voorkomend geval, de aan de Raad voorgelegde
      tekst alsmede het koninklijk besluit, indien de openbaarmaking niet elders is geregeld. De openbaarmaking heeft
      plaats op de wijze, voorgeschreven in [artikel 9, eerste en tweede lid, van de Wet openbaarheid van bestuur][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel9
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '16'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '9'
  - number: 25a.4
    text: Openbaarmaking blijft achterwege
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
  - number: 25a.4.a
    text: |-
      in de gevallen, bedoeld in [artikel 10 van de Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 25a.4.b
    text: |-
      indien een advies als bedoeld in het eerste lid, onder *a,* zonder meer instemmend luidt, dan wel uitsluitend
      opmerkingen van redaktionele aard bevat.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
  - number: 25a.5
    text: |-
      De Raad doet in zijn adviezen, bedoeld in het eerste lid, voorstellen omtrent de toepassing van de bepalingen van
      het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25a
  - number: 25b.1
    text: |-
      De Tweede Kamer der Staten-Generaal en de Staten-Generaal in verenigde vergadering dragen zorg voor het openbaar
      maken van de adviezen van de Raad, bedoeld in [artikel 15][ref1], alsmede voor een schriftelijke reactie op deze
      adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 15a
        hoofdstuk: I
  - number: 25b.2
    text: Openbaarmaking van de adviezen geschiedt te zamen met openbaarmaking van de schriftelijke reactie.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25b
  - number: 25b.3
    text: 'Openbaarmaking blijft achterwege:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25b
  - number: 25b.3.a
    text: |-
      in de gevallen, bedoeld in [artikel 10 van de Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 25b.3.b
    text: indien het advies zonder meer instemmend luidt, dan wel uitsluitend opmerkingen van redaktionele aard bevat.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25b
  - number: 25b.4
    text: De Raad doet in de adviezen voorstellen omtrent de toepassing van de bepalingen van het derde lid.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel25b
  - number: '26'
    text: |-
      Een afdeling van de Raad, genaamd Afdeling bestuursrechtspraak, is belast met de behandeling van de bij de wet aan
      haar opgedragen geschillen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel26
  - number: '27.1'
    text: De Afdeling bestaat uit de staatsraden en de staatsraden in buitengewone dienst.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel27
  - number: '27.2'
    text: |-
      Bij koninklijk besluit op voordracht van Onze Minister van Justitie in overeenstemming met Onze Minister van
      Binnenlandse Zaken wordt uit de staatsraden een voorzitter van de Afdeling benoemd. Voor de benoeming doet de Raad
      een aanbeveling.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel27
  - number: '27.3'
    text: |-
      De benoeming geldt voor het leven. Zij kan slechts op verzoek van de voorzitter worden ingetrokken en vervalt in
      geval van ontslag als staatsraad.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel27
  - number: '28.1'
    text: De voorzitter van de Afdeling kan worden vervangen door een ander lid van de Afdeling.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel28
  - number: '28.2'
    text: |-
      De voorzitter regelt de werkzaamheden van de Afdeling, alsmede de overige aangelegenheden die uitsluitend de
      Afdeling aangaan.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel28
  - number: '28.3'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van de Afdeling.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel28
  - number: '29.1'
    text: |-
      De Afdeling vormt en bezet op voorstel van de voorzitter enkelvoudige en meervoudige kamers. De meervoudige kamers
      bestaan uit drie leden, van wie een als voorzitter optreedt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel29
  - number: '29.2'
    text: |-
      De voorzitter van de Afdeling, degene die hem vervangt, degene die zitting heeft in een enkelvoudige kamer en de
      meerderheid van de leden van een meervoudige kamer:
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel29
  - number: 29.2.a
    text: |-
      moet op grond van het afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht zijn verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 29.2.b
    text: |-
      moeten op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester te
      voeren hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 29.2a
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het tweede lid, onderdeel a,
      gelijk worden gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '30.1'
    text: |-
      De voorzitter van een meervoudige kamer doet in raadkamer hoofdelijk omvraag. De voorzitter maakt zelf als laatste
      zijn oordeel kenbaar.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel30
  - number: '30.2'
    text: Ieder lid is verplicht aan de besluitvorming deel te nemen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel30
  - number: '30.3'
    text: |-
      Een afwezig lid kan zijn oordeel niet door een van de aanwezige leden doen voordragen of het schriftelijk
      uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel30
  - number: '31'
    text: 'Het is de leden van de Afdeling en de ten behoeve van de Afdeling werkzame ambtenaren verboden:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel31
  - number: 31.a
    text: |-
      hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie wordt
      gevorderd,
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel31
  - number: 31.b
    text: de gevoelens te openbaren die in raadkamer zijn geuit, en
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel31
  - number: 31.c
    text: |-
      over een voor hen aanhangige zaak of over een zaak die naar zij weten of redelijkerwijs kunnen vermoeden, voor hen
      aanhangig zal worden, op enigerlei bijzondere wijze in contact te treden met partijen, gemachtigden of degene die
      een partij bijstaat.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel31
  - number: '32.1'
    text: |-
      Degene die een klacht heeft over de wijze waarop een lid van de Afdeling zich bij de deelneming aan de
      werkzaamheden van de Afdeling jegens hem heeft gedragen, kan, tenzij de klacht een beslissing betreft, de vice-
      president verzoeken een vordering in te stellen bij de Raad van State tot het doen van een onderzoek naar die
      gedraging.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel32
  - number: '32.2'
    text: |-
      Het verzoekschrift dient de naam en het adres van de verzoeker te bevatten. De bedoelde gedraging en de daaromtrent
      gerezen klacht moeten er zo duidelijk mogelijk in worden omschreven.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel32
  - number: '33.1'
    text: 'De vice-president voldoet aan het verzoek, tenzij:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
  - number: 33.1.a
    text: |-
      niet is voldaan aan de vereisten, vermeld in [artikel 32, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel32
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '32'
        hoofdstuk: II
  - number: 33.1.b
    text: |-
      reeds aanstonds blijkt dat het verzoekschrift onredelijk lang na het ontstaan van de klacht is ingediend of geen
      genoegzame gronden inhoudt om het instellen van een onderzoek te vorderen,
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
  - number: 33.1.c
    text: |-
      een verzoekschrift van de verzoeker, dezelfde gedraging betreffende, in behandeling is of - behoudens indien een
      nieuwe omstandigheid, dezelfde gedraging betreffende, is bekend geworden en zulks tot een ander oordeel zou hebben
      kunnen leiden - is afgedaan,
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
  - number: 33.1.d
    text: |-
      voor de verzoeker met betrekking tot de klacht een voorziening bij een rechterlijke instantie openstaat of heeft
      opengestaan en hij daarvan geen gebruik heeft gemaakt, dan wel ten aanzien van die klacht een uitspraak van een
      rechterlijke instantie is gedaan waartegen geen rechtsmiddel openstaat,
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
  - number: 33.1.e
    text: |-
      door de vice-president een vordering als bedoeld in [artikel 3][ref1] juncto
      [hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref2] is of zal worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 3a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0008365
        hoofdstuk: 6A
  - number: '33.2'
    text: |-
      De vice-president stelt de verzoeker en degene op wiens gedraging het verzoekschrift betrekking heeft, in de
      gelegenheid hem inlichtingen te verstrekken. Hij hoort de in de eerste volzin bedoelde personen, wanneer dezen
      dit verzoeken.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
  - number: '33.3'
    text: |-
      De vice-president stelt de verzoeker en degene op wiens gedraging het verzoekschrift betrekking heeft, op de hoogte
      van de uitkomsten van het vooronderzoek. Staat naar het oordeel van de vice-president met betrekking tot de klacht
      een voorziening bij een rechterlijke instantie open, dan geeft hij daarvan kennis aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel33
  - number: '34.1'
    text: |-
      De Raad stelt de verzoeker en degene op wiens gedraging het verzoekschrift betrekking heeft in de gelegenheid naar
      aanleiding van de vordering van de vice-president, al dan niet in elkaars tegenwoordigheid, te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel34
  - number: '34.2'
    text: |-
      Het onderzoek geschiedt in raadkamer. De Raad kan, hetzij op verzoek van de vice-president, hetzij op verzoek van
      een van de in het eerste lid bedoelde personen, hetzij ambtshalve, getuigen horen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel34
  - number: '34.3'
    text: |-
      De Raad kan het horen, bedoeld in het eerste en het tweede lid, opdragen aan een door hem in te stellen bijzondere
      afdeling, die aan de Raad verslag uitbrengt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel34
  - number: '35.1'
    text: |-
      De Raad beslist bij een uitspraak, waarin hij zijn bevindingen met betrekking tot de in het verzoekschrift genoemde
      bezwaren opneemt en zijn oordeel uitspreekt over de gegrondheid daarvan.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel35
  - number: '35.2'
    text: |-
      Een afschrift van de uitspraak wordt door de secretaris gezonden aan de verzoeker en aan degene op wiens gedraging
      het verzoekschrift betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel35
  - number: '36.1'
    text: |-
      Indien bij de Afdeling beroep kan worden ingesteld, is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met
      uitzondering van de [artikelen 8:1, eerste en tweede lid][ref2], [8:4][ref3], [8:5][ref4], [8:6, eerste lid][ref5],
      [8:7][ref6], [8:8][ref7], [8:9][ref8], [8:10][ref9] en [8:13][ref10], van overeenkomstige toepassing, met dien
      verstande dat [artikel 8:86, eerste lid][ref11], slechts kan worden toegepast indien partijen daarvoor toestemming
      hebben gegeven. Ook hierop worden partijen in de uitnodiging, bedoeld in [artikel 8:83, eerste lid][ref12],
      gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref12]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
