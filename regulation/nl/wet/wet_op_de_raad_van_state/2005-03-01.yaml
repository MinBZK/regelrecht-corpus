$id: wet_op_de_raad_van_state
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '2005-03-01'
bwb_id: BWBR0002367
url: https://wetten.overheid.nl/BWBR0002367/2005-03-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 21 December 1861, Stb. 129, houdende
    regeling van de samenstelling en de bevoegdheid van de Raad van State, door een nieuwe wet te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: De Raad van State bestaat, buiten de Koning als voorzitter, uit een vice-president en ten hoogste 28 staatsraden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel1
  - number: '2.1'
    text: |-
      De vermoedelijke opvolger van de Koning heeft, nadat zijn achttiende jaar is vervuld, van rechtswege zitting in
      de Raad.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel2
  - number: '2.2'
    text: De Koning kan ook andere leden van het koninklijk huis wanneer zij meerderjarig zijn zitting in de Raad verlenen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel2
  - number: '2.3'
    text: |-
      De leden van het koninklijk huis, die zitting in de Raad hebben, kunnen aan de beraadslagingen deelnemen, doch
      onthouden zich van stemmen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel2
  - number: '3.1'
    text: |-
      De vice-president en de staatsraden worden bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse
      Zaken in overeenstemming met Onze Minister van Justitie voor het leven benoemd. Voor de benoeming van de vice-
      president wordt de Raad gehoord; voor de benoeming van de staatsraden doet de Raad een aanbeveling.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel3
  - number: '3.2'
    text: |-
      Hun wordt bij koninklijk besluit ontslag verleend op eigen verzoek en bij het bereiken van de zeventigjarige
      leeftijd. In het laatste geval gaat het ontslag in op de eerste dag van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel3
  - number: 3a.1
    text: |-
      De vice-president en de staatsraden worden door de Raad, bij met redenen omkleed besluit, ontslagen,
      geschorst, of bij ongeschiktheid wegens ziekte met een andere taak belast, en de staatsraden worden
      door de vice-president, bij met redenen omkleed besluit, gewaarschuwd overeenkomstig het bepaalde in
      [hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met dien verstande dat wordt gelezen: - in
      plaats van «procureur-generaal»: vice-president;
        - in plaats van «plaatsvervangend procureur-generaal»: de oudste aanwezige staatsraad, naar rang van benoeming;
        - in plaats van «bij een gerecht dan wel binnen het gezagsbereik van Onze Minister»: binnen de Raad dan wel binnen
      het gezagsbereik van de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - in plaats van «functionele autoriteit»: vice-president. De Raad doet de mededeling van beslissingen, bedoeld in
      [artikel 46p, vijfde en zesde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2], aan de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 3a.2
    text: |-
      De [artikelen 46i, vierde lid][ref1], [46k, vijfde lid][ref2], en
      [46l, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref3] zijn van overeenkomstige toepassing, met
      dien verstande dat wordt gelezen: - in plaats van «de rechterlijke ambtenaar»: de vice-president of de staatsraad;
        - in plaats van «op voordracht van Onze Minister»: op voordracht van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties;
        - in plaats van «de Hoge Raad»: de Raad


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46l
  - number: 3a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot wachtgeld en
      voorzieningen in verband met ziekte en arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel3a
  - number: '4.1'
    text: |-
      Er kunnen staatsraden in buitengewone dienst worden benoemd ten getale van ten hoogste 50. De [artikelen 3][ref1],
      [3][ref2] en [32 tot en met 35][ref3] zijn op hen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0002367#Artikel32
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002367
        artikel: 3a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002367
        artikel: '32'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Zij worden gekozen uit hen, die bewijzen hebben gegeven van bekwaamheid in zaken van wetgeving, bestuur of
      rechtspraak dan wel van bijzondere deskundigheid in aangelegenheden, die de wetgeving, het bestuur of de
      rechtspraak raken.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel4
  - number: '4.3'
    text: |-
      Zij kunnen bij koninklijk besluit worden aangewezen om voor een bepaalde tijd, doch voor ten hoogste vijf jaar,
      twee vijfde deel, de helft, drie vijfde deel of vier vijfde deel van de taak van een staatsraad te vervullen en
      hebben alsdan gelijke bevoegdheid als de staatsraden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel4
  - number: '4.4'
    text: |-
      De staatsraden in buitengewone dienst die niet ingevolge het derde lid een vaste deeltaak vervullen kunnen door de
      vice-president worden opgeroepen om deel te nemen aan bepaalde werkzaamheden van de Raad en hebben alsdan gelijke
      bevoegdheid als de staatsraden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel4
  - number: '5'
    text: |-
      Om tot vice-president of tot staatsraad of tot staatsraad in buitengewone dienst te kunnen worden benoemd moet men
      Nederlander zijn.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel5
  - number: '7.1'
    text: 'Onverenigbaar met het ambt van vice-president of staatsraad zijn:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel7
  - number: 7.1.a
    text: de openbare betrekkingen, aan welke een vaste beloning of toelage is verbonden;
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel7
  - number: 7.1.b
    text: |-
      het lidmaatschap van publiekrechtelijke colleges, waarvoor de keuze geschiedt bij krachtens wettelijk voorschrift
      uitgeschreven verkiezingen;
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel7
  - number: 7.1.c
    text: het ambt of beroep van advocaat, procureur, notaris, accountant, belastingconsulent of zaakwaarnemer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel7
  - number: '7.2'
    text: |-
      De vice-president, de staatsraden en de staatsraden in buitengewone dienst vervullen geen betrekkingen waarvan
      de uitoefening ongewenst is met het oog op een goede vervulling van hun ambt of op de handhaving van hun
      onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel7
  - number: '7.3'
    text: |-
      De betrekkingen die de vice-president, de staatsraden en de staatsraden in buitengewone dienst buiten hun ambt
      vervullen worden door de vice-president openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel7
  - number: '8.1'
    text: |-
      Alvorens hun ambt te aanvaarden leggen de vice-president, de staatsraden en de staatsraden in buitengewone dienst
      in handen van de Koning de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, tot het verkrijgen
      van mijn aanstelling, middellijk noch onmiddellijk, onder welke naam of welk voorwendsel ook, aan iemand iets heb
      gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, van niemand
      enig geschenk of enige belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk. Ik zweer (beloof) trouw
      aan de Koning, dat ik het Statuut voor het Koninkrijk en de [Grondwet][ref1] steeds zal helpen onderhouden en mijn
      ambt met eerlijkheid, nauwgezetheid en onpartijdigheid zal vervullen. Zo waarlijk helpe mij God almachtig!" (Dat
      verklaar en beloof ik").


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '8.2'
    text: |-
      Deze eed (verklaring en belofte) kan door de staatsraden en de staatsraden in buitengewone dienst ook worden
      afgelegd in een vergadering van de Raad in handen van de vice-president, daartoe door de Koning gemachtigd.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel8
  - number: '10'
    text: |-
      De vice-president wordt bij verhindering of ontstentenis vervangen door de oudste aanwezige staatsraad, naar rang
      van benoeming.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel10
  - number: '11.1'
    text: Aan de Raad worden toegevoegd een secretaris en het vereiste aantal ambtenaren van Staat in de nodige rangen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel11
  - number: '11.2'
    text: |-
      Zij worden bij koninklijk besluit op voordracht van de Raad benoemd en bij koninklijk besluit, de Raad gehoord,
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel11
  - number: '12.1'
    text: 'Voor benoeming tot secretaris of ambtenaar van Staat komt in aanmerking degene:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel12
  - number: 12.1.a
    text: |-
      aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding
      in het wetenschappelijk onderwijs door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 12.1.b
    text: |-
      die op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester te
      voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 12.1a
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '12.2'
    text: In bijzondere gevallen kan van het bepaalde in het vorige lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel12
  - number: '13'
    text: |-
      De secretaris en de ambtenaren van Staat leggen alvorens hun ambt te aanvaarden in een vergadering van de Raad
      in handen van de voorzitter, de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, tot het
      verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke naam of welk voorwendsel ook, aan
      iemand iets heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten,
      van niemand enig geschenk of enige belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk. Ik zweer
      (beloof) dat ik al de plichten, aan mijn ambt verbonden, eerlijk en vlijtig zal vervullen. Zo waarlijk helpe mij
      God almachtig!" (Dat verklaar en beloof ik").
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel13
  - number: '14'
    text: |-
      De Raad is belast met de taak, bij [artikel 38 van de Grondwet][ref1] aan hem opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel38
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '38'
  - number: '15.1'
    text: 'Wij horen de Raad over:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: 15.1.a
    text: de voorstellen van wet door Ons aan de Staten-Generaal te doen;
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: 15.1.b
    text: de ontwerpen van algemene maatregelen van bestuur;
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: 15.1.c
    text: de voorstellen tot goedkeuring van een verdrag of van het voornemen tot opzegging van een verdrag.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: '15.2'
    text: |-
      Wij horen de Raad voorts in de gevallen waarin een wet dit voorschrijft, zomede over alle zaken waaromtrent Wij het
      nodig oordelen. Wij horen de Raad niet over de bij de Tweede Kamer der Staten-Generaal of bij de Staten-Generaal
      in verenigde vergadering door een of meer leden aanhangig gemaakte voorstellen van wet, voordat zij door de Staten-
      Generaal zijn aangenomen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: '15.3'
    text: |-
      Wij brengen bij de Raad ter overweging de ontwerpen van krachtens enige wet te nemen koninklijke besluiten tot
      vernietiging.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: '15.4'
    text: |-
      Aan het hoofd van de voorstellen en ontwerpen, bedoeld in het eerste lid, en van de besluiten, bedoeld in het derde
      lid, wordt vermeld dat de Raad van State daaromtrent is gehoord.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15
  - number: 15a.1
    text: |-
      De Tweede Kamer der Staten-Generaal hoort de Raad over de bij haar door een of meer leden aanhangig gemaakte
      voorstellen van wet, voordat zij deze in behandeling neemt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15a
  - number: 15a.2
    text: |-
      In de gevallen waarin de Tweede Kamer zulks nodig oordeelt, hoort zij de Raad voorts omtrent de in het eerste lid
      bedoelde voorstellen, nadat deze in behandeling zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15a
  - number: 15a.3
    text: |-
      Het bepaalde in het eerste en tweede lid is van overeenkomstige toepassing ten aanzien van de Staten-Generaal in
      verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15a
  - number: 15b
    text: 'Het horen van de Raad kan achterwege blijven over:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15b
  - number: 15b.a
    text: voorstellen van wet tot wijziging van de begroting van het Rijk;
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15b
  - number: 15b.b
    text: |-
      voorstellen van wet tot goedkeuring van een verdrag of van het voornemen tot opzegging van een verdrag, indien dit
      verdrag of dit voornemen eerder ter stilzwijgende goedkeuring aan de Staten-Generaal was voorgelegd.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15b
  - number: 15c.1
    text: |-
      De Raad heeft tot taak het opstellen van een ontwerp van een koninklijk besluit als bedoeld in
      [artikel 136 van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel136
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '136'
  - number: 15c.2
    text: |-
      Binnen zes maanden nadat het ontwerp is opgesteld kan Onze Minister wie het aangaat, de Raad gemotiveerd verzoeken
      zijn ontwerp in nadere overweging te nemen. Indien het koninklijk besluit afwijkt van het ontwerp of het nader
      ontwerp wordt het in het *Staatsblad* geplaatst met het ontwerp, bedoeld in het eerste lid en indien daarvan sprake
      is, het nader ontwerp. Indien niet binnen zes maanden een verzoek als bedoeld in de eerste volzin is gedaan luidt
      het koninklijk besluit overeenkomstig het ontwerp.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel15c
  - number: '16.1'
    text: |-
      De Raad is bevoegd Ons voordrachten te doen omtrent onderwerpen van wetgeving of bestuur, waaromtrent hij het doen
      van voorstellen van wet of het uitvaardigen van algemene maatregelen van bestuur wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel16
  - number: '16.2'
    text: |-
      Ook overigens kan de Raad Ons van zijn gevoelen doen blijken over aangelegenheden, die naar zijn oordeel van
      bijzondere betekenis zijn.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel16
  - number: '17'
    text: |-
      De Raad regelt zijn verdeling in afdelingen, welke elk betrekking hebben op één of meer ministeries. De regeling
      wordt in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel17
  - number: '18.1'
    text: De afdelingen hebben tot taak het voorbereiden van de behandeling van zaken in de Raad.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel18
  - number: '18.2'
    text: Zij dienen op verzoek Onze Ministers van voorlichting in zaken van wetgeving en bestuur.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel18
  - number: 18a.1
    text: |-
      Een afdeling kan bij de voorbereiding van een ingevolge [artikel 15, derde lid][ref1], uit te brengen advies
      omtrent vernietiging van een besluit, onderscheidenlijk bij het onderzoek van en de voorbereiding van een
      ontwerp-besluit inzake de beslissing van geschillen als bedoeld in [artikel 15][ref2], belanghebbenden,
      getuigen, deskundigen en tolken oproepen om in een vergadering met gesloten deuren te worden gehoord. De
      [artikelen 32 tot en met 35][ref3], alsmede de [artikelen 8:24][ref4], [8:25][ref5], [8:27 tot en met 8:29][ref6],
      [8:31][ref7], [8:32][ref8], [8:33 tot en met 8:36, eerste lid][ref9], [8:39][ref10], [8:50][ref11] en
      [8:61 van de Algemene wet bestuursrecht][ref12] zijn van overeenkomstige toepassing. Ambtsberichten en andere door
      Onze Minister wie het aangaat aangewezen stukken zijn niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel15c
