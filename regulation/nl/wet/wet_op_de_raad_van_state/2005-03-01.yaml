        artikel: '8'
  - number: '36.2'
    text: De zaken die bij de Afdeling aanhangig worden gemaakt, worden in behandeling genomen door een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel36
  - number: '36.3'
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel36
  - number: '36.4'
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel36
  - number: '36.5'
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel36
  - number: '37.1'
    text: |-
      Een belanghebbende en het bestuursorgaan kunnen bij de Afdeling hoger beroep instellen tegen een uitspraak van de
      rechtbank als bedoeld in [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen een uitspraak van de
      voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2], tenzij tegen de uitspraak
      hoger beroep kan worden ingesteld bij de Centrale Raad van Beroep, het College van Beroep voor het bedrijfsleven of
      het gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '37.2'
    text: 'Geen hoger beroep kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
  - number: 37.2.a
    text: |-
      een uitspraak van de rechtbank na toepassing van [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 37.2.b
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:54a van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 37.2.c
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 37.2.d
    text: |-
      een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, tweede lid, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 37.2.e
    text: |-
      een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75][ref1], in verband met
      [artikel 8:84, vierde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '37.3'
    text: |-
      Tegen andere beslissingen van de rechtbank onderscheidenlijk de voorzieningenrechter kan slechts tegelijkertijd met
      het hoger beroep tegen de in het eerste lid bedoelde uitspraak hoger beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel37
  - number: '38.1'
    text: |-
      De secretaris doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de griffier van de rechtbank
      die de uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel38
  - number: '38.2'
    text: |-
      De griffier van de rechtbank, bedoeld in het eerste lid, zendt de gedingstukken met vier afschriften van het
      proces-verbaal van de zitting, voor zover dit op de zaak betrekking heeft, en vier afschriften van de uitspraak
      binnen een week na ontvangst van de in het eerste lid bedoelde mededeling aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel38
  - number: '39.1'
    text: |-
      Op het hoger beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van
      [afdeling 8.1.1][ref2] en de [artikelen 8:10](onbekend), [8:13](onbekend), [8:41](onbekend), [8:74](onbekend)
      en [8:82](onbekend), van overeenkomstige toepassing, voor zover in deze paragraaf niet anders is bepaald.
      [Artikel 8:86, eerste lid][ref3], kan slechts worden toegepast indien een enkelvoudige kamer van de rechtbank
      uitspraak op het beroep heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '39.2'
    text: De zaken die bij de Afdeling aanhangig worden gemaakt, worden in behandeling genomen door een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39
  - number: '39.3'
    text: |-
      Indien een zaak die door een enkelvoudige kamer van de rechtbank is behandeld naar het oordeel van de meervoudige
      kamer geschikt is voor verdere behandeling door één rechter, kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39
  - number: '39.4'
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39
  - number: '39.5'
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39
  - number: 39a.1
    text: |-
      In geval van intrekking van het hoger beroep door het bestuursorgaan kan het bestuursorgaan
      op verzoek van een partij bij afzonderlijke uitspraak met overeenkomstige toepassing van
      [artikel 8:75 van de Algemene wet bestuursrecht][ref1] in de kosten worden veroordeeld. Indien het hoger beroep
      mondeling wordt ingetrokken, wordt het verzoek door de partij die daarbij aanwezig is mondeling gedaan tegelijk
      met de intrekking van het hoger beroep. Indien aan dit vereiste niet is voldaan, wordt het verzoek niet-
      ontvankelijk verklaard. Indien het hoger beroep schriftelijk wordt ingetrokken, wordt het verzoek schriftelijk
      gedaan. De [artikelen 6:5 tot en met 6:9][ref2], [6:11][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6] en
      [6:21 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 39a.2
    text: |-
      [Artikel 8:73a, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '40.1'
    text: |-
      Van de indiener van het beroepschrift wordt door de secretaris een griffierecht geheven. Indien de uitspraak van
      de rechtbank, voor zover daartegen hoger beroep is ingesteld, betrekking heeft op meer dan één besluit of indien
      het een gezamenlijk beroepschrift van twee of meer indieners ter zake van dezelfde uitspraak betreft, is eenmaal
      griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van het tweede lid ter
      zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde griffierecht.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '40.2'
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: 40.2.a
    text: € 207 indien door een natuurlijke persoon hoger beroep is ingesteld, tenzij bij wet anders is bepaald, en
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: 40.2.b
    text: € 414 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '40.3'
    text: |-
      Indien het bestuursorgaan hoger beroep heeft ingesteld en de uitspraak van de rechtbank wordt in stand gelaten,
      wordt van de desbetreffende rechtspersoon een griffierecht geheven van € 414.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '40.4'
    text: |-
      De secretaris wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de secretarie dan wel ter secretarie dient te zijn gestort. Indien het bedrag
      niet binnen deze termijn is bijgeschreven of gestort, wordt het hoger beroep niet-ontvankelijk verklaard, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '40.5'
    text: |-
      Indien het hoger beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende rechtspersoon. In de overige gevallen kan de desbetreffende rechtspersoon, indien het hoger beroep
      wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '40.6'
    text: |-
      De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover het prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '40.7'
    text: Dit artikel is van overeenkomstige toepassing op een verzoek om herziening.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel40
  - number: '41.1'
    text: |-
      Van de verzoeker om een voorlopige voorziening wordt door de secretaris een griffierecht geheven.
      [Artikel 40, eerste lid, tweede en derde volzin, tweede en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel40
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '40'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.2'
    text: |-
      [Artikel 40, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken bedraagt. De
      voorzitter kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel40
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '40'
        hoofdstuk: II
        paragraaf: '2'
  - number: '41.3'
    text: |-
      Indien het verzoek wordt ingetrokken omdat het bestuursorgaan, onderscheidenlijk de belanghebbende tot wie het
      bestreden besluit is gericht, aan de voorzitter schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde voorlopige
      maatregelen te zullen nemen, wordt het betaalde griffierecht door de secretaris terugbetaald. In de overige
      gevallen kan de desbetreffende rechtspersoon, indien het verzoek wordt ingetrokken, het betaalde griffierecht
      geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel41
  - number: '41.4'
    text: |-
      De uitspraak kan inhouden dat het betaalde griffierecht door de door de voorzitter aangewezen rechtspersoon geheel
      of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel41
  - number: '41.5'
    text: |-
      Indien het verzoek is gedaan door het bestuursorgaan en het verzoek geheel of gedeeltelijk wordt toegewezen, kan
      de uitspraak inhouden dat het betaalde griffierecht door de secretaris aan de desbetreffende rechtspersoon wordt
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel41
  - number: '41.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een verzoek om voorlopige voorziening dat wordt gedaan nadat een
      verzoek om herziening is gedaan.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel41
  - number: '42'
    text: |-
      De Afdeling bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering van de gronden,
      of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou behoren te doen.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel42
  - number: '43.1'
    text: |-
      Indien de Afdeling de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de uitspraak tevens in
      dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de door de Afdeling aangewezen
      rechtspersoon wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel43
  - number: '43.2'
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht geheel of gedeeltelijk door de door
      de Afdeling aangewezen rechtspersoon wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel43
  - number: '44.1'
    text: 'De Afdeling wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld, indien:'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel44
  - number: 44.1.a
    text: |-
      de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en de Afdeling
      deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk ontvankelijkverklaring van het
      beroep, of
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel44
  - number: 44.1.b
    text: |-
      de Afdeling om andere redenen dan bedoeld in onderdeel *a* van oordeel is dat de zaak opnieuw door de rechtbank
      moet worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel44
  - number: '44.2'
    text: |-
      De secretaris zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk aan
      de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel44
  - number: '45'
    text: |-
      In de gevallen, bedoeld in [artikel 44, eerste lid, onderdeel ][ref1], kan de Afdeling de zaak zonder terugwijzing
      afdoen, indien zij naar haar oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel44
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '46'
    text: |-
      Indien de Afdeling van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de bevoegde, kan zij de
      onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel46
  - number: '47'
    text: |-
      Tegen de vice-president, de staatsraden en de staatsraden in buitengewone dienst kan noch een rechtsvervolging,
      noch een rechtsvordering worden ingesteld wegens hetgeen zij tijdens de beraadslaging in de Raad, een afdeling als
      bedoeld in [artikel 17][ref1], de Afdeling bestuursrechtspraak of een kamer van die Afdeling hebben gezegd, dan wel
      daaraan schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel17
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '17'
        hoofdstuk: I
  - number: '48'
    text: 'Deze wet wordt aangehaald als: Wet op de Raad van State.'
    url: https://wetten.overheid.nl/BWBR0002367/2005-03-01#Artikel48
