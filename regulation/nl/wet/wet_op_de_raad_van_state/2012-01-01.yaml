  - number: '17'
    text: |-
      1 Wij horen de Afdeling advisering over:

      a. de voorstellen van wet door Ons aan de Staten-Generaal te doen;

      b. de ontwerpen van algemene maatregelen van bestuur;

      c. de voorstellen tot goedkeuring van een verdrag of van het voornemen tot opzegging van een verdrag.

      2 Wij horen de Afdeling advisering voorts in de gevallen waarin een wet dit voorschrijft en over alle
      aangelegenheden waaromtrent Wij het nodig oordelen.

      3 Wij brengen bij de Afdeling advisering ter overweging de ontwerpen van krachtens enige wet te nemen koninklijke
      besluiten tot vernietiging.

      4 De voorstellen, ontwerpen en besluiten vermelden dat de Afdeling advisering van de Raad van State is gehoord.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 De Tweede Kamer der Staten-Generaal hoort de Afdeling advisering over de bij haar door een of meer leden
      aanhangig gemaakte voorstellen van wet, voordat zij deze in behandeling neemt.

      2 In de gevallen waarin de Tweede Kamer der Staten-Generaal zulks nodig oordeelt, hoort zij de Afdeling advisering
      voorts omtrent de in het eerste lid bedoelde voorstellen, nadat deze in behandeling zijn genomen.

      3 Wij horen de Afdeling advisering niet over de bij de Tweede Kamer der Staten-Generaal door een of meer leden
      aanhangig gemaakte voorstellen van wet, voordat zij door de Staten-Generaal zijn aangenomen.

      4 Het eerste, het tweede en het derde lid zijn van overeenkomstige toepassing ten aanzien van de Staten-Generaal in
      verenigde vergadering.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel18
  - number: '19'
    text: |-
      Het horen van de Afdeling advisering kan achterwege blijven over:

      a. voorstellen van wet tot wijziging van de begroting van het Rijk;

      b. voorstellen van wet tot goedkeuring van een verdrag of van het voornemen tot opzegging van een verdrag, indien
      dit verdrag of dit voornemen eerder ter stilzwijgende goedkeuring aan de Staten-Generaal was voorgelegd.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel19
  - number: '20'
    text: |-
      1 De Afdeling advisering stelt het ontwerp op van een koninklijk besluit als bedoeld in
      [artikel 136 van de Grondwet][ref1].

      2 Binnen zes maanden nadat het ontwerp is opgesteld kan Onze Minister wie het aangaat, de Afdeling advisering
      gemotiveerd verzoeken haar ontwerp in nadere overweging te nemen. Indien het koninklijk besluit afwijkt van het
      ontwerp of het nader ontwerp wordt het in het Staatsblad geplaatst met het ontwerp, bedoeld in het eerste lid en
      indien daarvan sprake is, het nader ontwerp. Indien niet binnen zes maanden een verzoek als bedoeld in de eerste
      volzin is gedaan luidt het koninklijk besluit overeenkomstig het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel136
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '136'
  - number: '21'
    text: De Afdeling advisering adviseert Ons voorts indien zij dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel21
  - number: 21a
    text: |-
      1 De Afdeling advisering dient op verzoek Onze Ministers dan wel een van beide kamers der Staten-Generaal van
      voorlichting in aangelegenheden van wetgeving en bestuur.

      2 Indien voorlichting wordt gegeven aan een van beide kamers der Staten-Generaal, draagt deze kamer zorg voor de
      openbaarmaking, bedoeld in [artikel 26, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel26
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '26'
        hoofdstuk: II
        afdeling: '1'
  - number: '22'
    text: |-
      In de gevallen, bedoeld in [artikel 17][ref1], wordt de aangelegenheid hetzij door Ons, op voordracht van Onze
      Minister wie het aangaat, hetzij door Onze Minister krachtens koninklijke machtiging, ter overweging aanhangig
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel17
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '17'
        hoofdstuk: II
        afdeling: '1'
  - number: '23'
    text: |-
      1 Onze Ministers geven aan de Afdeling advisering de inlichtingen, die in verband met de uitoefening van haar taak
      vereist worden.

      2 Het inwinnen door de Afdeling advisering van inlichtingen bij anderen dan Onze Minister, wie het aangaat,
      geschiedt door tussenkomst van deze.

      3 De vice-president kan personen oproepen om aan de Afdeling advisering voorlichting en advies te geven.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel23
  - number: '24'
    text: |-
      De Afdeling advisering beraadslaagt met Onze Minister, wie het aangaat, indien de Afdeling advisering of de
      Minister zulks mocht verlangen.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel24
  - number: '25'
    text: |-
      Van de koninklijke besluiten in aangelegenheden, waarover de Afdeling advisering is gehoord, wordt aan deze
      mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel25
  - number: '26'
    text: |-
      1 Onze Minister wie het rechtstreeks aangaat draagt zorg voor het openbaar maken in de Staatscourant van

      a. adviezen van de Afdeling advisering, door Ons gevraagd,

      b. adviezen als bedoeld in [artikel 21][ref1],

      c. voorlichting in aangelegenheden van wetgeving en bestuur als bedoeld in [artikel 21a][ref2].

      2 Openbaarmaking van de adviezen, bedoeld in het eerste lid onder a, geschiedt tezamen met openbaarmaking van de
      aan de Afdeling advisering voorgelegde tekst en van het nader rapport aan Ons. Zij heeft plaats voor wat betreft

      a. adviezen over door Ons ingezonden voorstellen van wet: gelijktijdig met de inzending daarvan aan de Tweede Kamer
      der Staten-Generaal;

      b. adviezen over voorstellen van wet door de Staten-Generaal aan Ons gedaan: gelijktijdig met de bekendmaking van
      de wet;

      c. adviezen over verdragen met andere mogendheden en volkenrechtelijke organisaties, aan de Staten-Generaal ter
      stilzwijgende goedkeuring over te leggen: gelijktijdig met de overlegging daarvan aan de Staten-Generaal;

      d. adviezen over algemene maatregelen van bestuur en andere koninklijke besluiten: gelijktijdig met de
      bekendmaking.

      3 Openbaarmaking van adviezen als bedoeld in het eerste lid, onder a, welke niet kan geschieden zoals voorzien
      in het tweede lid, alsmede openbaarmaking van adviezen als bedoeld in het eerste lid, onder b en van voorlichting
      in aangelegenheden van wetgeving en bestuur als bedoeld in het eerste lid, onder c, geschiedt uiterlijk binnen
      dertig dagen nadat is beslist op het advies, de voordracht of een ander voorstel van de Afdeling advisering
      onderscheidenlijk op de voorlichting in aangelegenheden van wetgeving en bestuur van die Afdeling. Daarbij worden,
      in voorkomend geval, mede openbaar gemaakt het nader rapport en de aan de Afdeling advisering voorgelegde tekst
      alsmede het koninklijk besluit, indien de openbaarmaking niet elders is geregeld. De openbaarmaking heeft plaats op
      de wijze, voorgeschreven in [artikel 9, eerste en tweede lid, van de Wet openbaarheid van bestuur][ref3].

      4 Openbaarmaking blijft achterwege in de gevallen, bedoeld in
      [artikel 10 van de Wet openbaarheid van bestuur][ref4].

      5 Actieve openbaarmaking kan achterwege blijven indien een advies als bedoeld in het eerste lid, onder a, zonder
      meer instemmend luidt, dan wel uitsluitend opmerkingen van redactionele aard bevat.

      6 De Afdeling advisering doet in haar adviezen, bedoeld in het eerste lid, voorstellen omtrent de toepassing van de
      bepalingen van het vierde of vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel26
