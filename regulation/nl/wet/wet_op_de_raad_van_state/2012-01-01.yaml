  - number: 27e
    text: |-
      De vice-president, de leden, de staatsraden en de staatsraden in buitengewone dienst nemen geen deel aan de
      beraadslagingen en stemmen niet mee, indien daardoor hun onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel27e
  - number: '30'
    text: |-
      1 De Raad kent een Afdeling bestuursrechtspraak.

      2 De Afdeling bestuursrechtspraak bestaat uit de leden, de staatsraden en de staatsraden in buitengewone dienst die
      in de Afdeling bestuursrechtspraak zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel30
  - number: 30a
    text: |-
      1 Bij koninklijk besluit op voordracht van Onze Minister van Justitie in overeenstemming met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties wordt uit de leden van de afdeling bestuursrechtspraak die voldoen aan
      het vereiste, gesteld in [artikel 2, vierde lid][ref1], een voorzitter van de afdeling bestuursrechtspraak benoemd.
      Voor de benoeming doet de Raad een aanbeveling, de afdeling bestuursrechtspraak gehoord.

      2 De benoeming geldt voor het leven. Zij kan slechts op verzoek van de voorzitter worden ingetrokken en vervalt in
      geval van ontslag als lid van de Raad.

      3 De voorzitter kan worden vervangen door een ander lid van de Afdeling bestuursrechtspraak dat voldoet aan het
      vereiste, gesteld in [artikel 2, vierde lid][ref2].

      4 De voorzitter is lid van de Raad van State, zo nodig in afwijking van [artikel 1, eerste lid][ref3].

      5 De voorzitter regelt de werkzaamheden van de Afdeling bestuursrechtspraak.

      6 De daartoe door de voorzitter schriftelijk aangewezen ambtenaren verrichten de werkzaamheden die bij of krachtens
      de wet aan de griffier zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002367#Artikel1
