  - number: '51'
    text: |-
      1 Van de indiener van het beroepschrift wordt door de secretaris een griffierecht geheven. Indien de uitspraak van
      de rechtbank, voor zover daartegen hoger beroep is ingesteld, betrekking heeft op meer dan één besluit of indien
      het een gezamenlijk beroepschrift van twee of meer indieners ter zake van dezelfde uitspraak betreft, is eenmaal
      griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van het tweede lid ter
      zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde griffierecht.

      2 Het griffierecht bedraagt:

      a. € 232 indien door een natuurlijke persoon hoger beroep is ingesteld, tenzij bij wet anders is bepaald, en

      b. € 466 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.

      3 Indien het bestuursorgaan hoger beroep heeft ingesteld en de uitspraak van de rechtbank wordt in stand gelaten,
      wordt van het bestuursorgaan een griffierecht geheven van € 466.

      4 De secretaris wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de secretarie dan wel ter secretarie dient te zijn gestort. Indien het bedrag
      niet binnen deze termijn is bijgeschreven of gestort, wordt het hoger beroep niet-ontvankelijk verklaard, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.

      5 Indien het hoger beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door het
      bestuursorgaan. In de overige gevallen kan het bestuursorgaan, indien het hoger beroep wordt ingetrokken, het
      betaalde griffierecht geheel of gedeeltelijk vergoeden.

      6 De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.

      7 Dit artikel is van overeenkomstige toepassing op een verzoek om herziening.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel51
  - number: '52'
    text: |-
      1 Van de verzoeker om een voorlopige voorziening wordt door de secretaris een griffierecht geheven.
      [Artikel 51, eerste lid, tweede en derde volzin, tweede en zesde lid][ref1], is van overeenkomstige toepassing.

      2 [Artikel 51, vierde lid][ref2], is van overeenkomstige toepassing, met dien verstande dat de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken bedraagt. De
      voorzitter kan een kortere termijn stellen.

      3 Indien het verzoek wordt ingetrokken omdat het bestuursorgaan, onderscheidenlijk de belanghebbende tot wie het
      bestreden besluit is gericht, aan de voorzitter schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde voorlopige
      maatregelen te zullen nemen, wordt het betaalde griffierecht door de secretaris terugbetaald. In de overige
      gevallen kan het bestuursorgaan, indien het verzoek wordt ingetrokken, het betaalde griffierecht geheel of
      gedeeltelijk vergoeden.

      4 De uitspraak kan inhouden dat het betaalde griffierecht door het door de voorzitter aangewezen bestuursorgaan
      geheel of gedeeltelijk wordt vergoed.

      5 Indien het verzoek is gedaan door het bestuursorgaan en het verzoek geheel of gedeeltelijk wordt toegewezen, kan
      de uitspraak inhouden dat het betaalde griffierecht door de secretaris aan het bestuursorgaan wordt terugbetaald.

      6 Dit artikel is van overeenkomstige toepassing op een verzoek om voorlopige voorziening dat wordt gedaan nadat een
      verzoek om herziening is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel51
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel52
