        bwb_id: BWBR0001840
        artikel: '38'
  - number: '8'
    text: |-
      1 Er kunnen staatsraden worden benoemd.

      2 Zij worden gekozen uit hen, die bekwaamheid of deskundigheid hebben bewezen op het gebied van wetgeving, bestuur
      of rechtspraak dan wel in aangelegenheden die daaraan raken.

      3 De staatsraden worden bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie voor het leven benoemd. Voor zover zij
      niet met rechtspraak worden belast, kunnen zij voor een bepaalde tijd van ten minste drie jaren worden benoemd.
      Vacatures worden in de Staatscourant gepubliceerd onder opgave van het profiel van de gezochte kandidaat of
      kandidaten. De Tweede Kamer der Staten-Generaal voert ten minste eenmaal per jaar overleg met de vice-president
      over de vacatures. Voor de benoeming doet de Raad een aanbeveling. De aanbeveling wordt gedaan gehoord de afdeling
      of afdelingen van de Raad waarvan de te benoemen staatsraad deel zal uitmaken.

      4 De [artikelen 2, derde tot en met vijfde lid][ref1], [3][ref2], [4][ref3],
      [5, eerste lid, aanhef en onder d, en tweede lid][ref4], en [6][ref5] zijn op hen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel2
