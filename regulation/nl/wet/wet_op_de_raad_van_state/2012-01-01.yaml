  - number: 30b
    text: De Afdeling bestuursrechtspraak is belast met de berechting van de bij de wet aan haar opgedragen geschillen.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel30b
  - number: '42'
    text: |-
      1 De Afdeling bestuursrechtspraak vormt en bezet op voorstel van de voorzitter enkelvoudige en meervoudige kamers.

      2 De meervoudige kamers bestaan uit drie leden, van wie een als voorzitter optreedt.

      3 Leden van de Afdeling bestuursrechtspraak die niet voldoen aan het vereiste, gesteld in
      [artikel 2, vierde lid][ref1], kunnen:

      a. geen zitting hebben in een enkelvoudige kamer en

      b. niet de meerderheid vormen van de leden van de meervoudige kamer.

      4 Een lid van de Afdeling bestuursrechtspraak dat betrokken is geweest bij de totstandkoming van een advies van de
      Raad, neemt geen deel aan de behandeling van een geschil over een rechtsvraag waarop dat advies betrekking had.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel2
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '2'
        hoofdstuk: I
        afdeling: '1'
  - number: '43'
    text: |-
      1 De voorzitter van een meervoudige kamer doet in raadkamer hoofdelijk omvraag. De voorzitter maakt zelf als
      laatste zijn oordeel kenbaar.

      2 Ieder lid is verplicht aan de besluitvorming deel te nemen.

      3 Een afwezig lid kan zijn oordeel niet door een van de aanwezige leden doen voordragen of het schriftelijk
      uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel43
  - number: '44'
    text: |-
      Het is de leden van de Afdeling bestuursrechtspraak en de ten behoeve van deze afdeling werkzame ambtenaren
      verboden:

      a. hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie
      wordt gevorderd,

      b. de gevoelens te openbaren die in raadkamer zijn geuit, en

      c. over een voor hen aanhangige zaak of over een zaak die naar zij weten of redelijkerwijs kunnen vermoeden, voor
      hen aanhangig zal worden, op enigerlei bijzondere wijze in contact te treden met partijen, gemachtigden of degene
      die een partij bijstaat.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel44
  - number: '45'
    text: |-
      1 De Afdeling bestuursrechtspraak stelt een regeling vast voor de behandeling van klachten.

      2 Klachten zijn niet mogelijk ten aanzien van gedragingen waartegen ingevolge een wettelijk geregelde voorziening
      een procedure bij een rechterlijke instantie openstaat of heeft opengestaan, dan wel beroep openstaat of heeft
      opengestaan tegen een uitspraak die in een zodanige procedure is gedaan. Klachten kunnen evenmin een rechterlijke
      beslissing betreffen.

      3 [Titel 9.1 van de Algemene wet bestuursrecht][ref1], met uitzondering van de zinsnede «of een ander» in
      [artikel 9:1, eerste lid][ref2], is van overeenkomstige toepassing, met dien verstande dat onder bestuursorgaan
      wordt verstaan: de Afdeling bestuursrechtspraak.

      4 De regeling, bedoeld in het eerste lid, wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:1
  - number: '46'
    text: |-
      1 Indien bij de Afdeling bestuursrechtspraak beroep kan worden ingesteld, is
      [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van de
      [artikelen 8:1, eerste en tweede lid][ref2], [8:4][ref3], [8:5][ref4], [8:6, eerste lid][ref5], [8:7][ref6],
      [8:8][ref7], [8:9][ref8], [8:10][ref9] , [8:13][ref10] en [8:51a, eerste lid][ref11], van overeenkomstige
      toepassing, met dien verstande dat [artikel 8:86, eerste lid][ref12], slechts kan worden toegepast indien
      partijen daarvoor toestemming hebben gegeven. Ook hierop worden partijen in de uitnodiging, bedoeld in
      [artikel 8:83, eerste lid][ref13], gewezen.

      2 De zaken die bij de Afdeling bestuursrechtspraak aanhangig worden gemaakt, worden in behandeling genomen door een
      meervoudige kamer.

      3 Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.

      4 Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.

      5 Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.

      6 De Afdeling bestuursrechtspraak kan het bestuursorgaan opdragen een gebrek in het bestreden besluit te herstellen
      of te laten herstellen. De vorige volzin vindt geen toepassing, indien belanghebbenden die niet als partij aan het
      geding deelnemen daardoor onevenredig kunnen worden benadeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
