preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 21 December 1861, Stb. 129, houdende
    regeling van de samenstelling en de bevoegdheid van de Raad van State, door een nieuwe wet te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Raad van State bestaat, buiten de Koning als voorzitter, uit een vice-president en ten hoogste tien leden.

      2 De vermoedelijke opvolger van de Koning heeft, nadat zijn achttiende jaar is vervuld, van rechtswege zitting in
      de Raad.

      3 Bij koninklijk besluit kan ook andere leden van het koninklijk huis wanneer zij meerderjarig zijn, zitting in de
      Raad worden verleend.

      4 De leden van het koninklijk huis die zitting in de Raad hebben, kunnen aan de beraadslagingen deelnemen, doch
      onthouden zich van stemmen.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel1
  - number: '2'
    text: |-
      1 De vice-president en de leden worden bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie voor het leven benoemd. Vacatures
      worden in de Staatscourant gepubliceerd onder opgave van het profiel van de gezochte kandidaat of kandidaten. De
      Tweede Kamer der Staten-Generaal voert ten minste eenmaal per jaar overleg met de vice-president over de vacatures.

      2 Voor de benoeming van de vice-president wordt de Raad gehoord. Voor de benoeming van de leden doet de Raad een
      aanbeveling. De aanbeveling wordt gedaan gehoord de afdeling of afdelingen van de Raad waarvan het te benoemen lid
      deel zal uitmaken.

      3 De leden worden bij koninklijk besluit benoemd in de Afdeling advisering of de Afdeling bestuursrechtspraak,
      dan wel in beide afdelingen. Het aantal leden dat in beide afdelingen wordt benoemd, bedraagt ten hoogste 10. De
      benoeming kan worden gewijzigd, met dien verstande dat een benoeming in de Afdeling bestuursrechtspraak slechts op
      verzoek van het lid kan worden beëindigd.

      4 Een lid kan slechts deelnemen aan de rechtsprekende taak indien:

      a. hem op grond van het afleggen van een afsluitend examen van een opleiding in het wetenschappelijk onderwijs door
      een universiteit dan wel de Open Universiteit waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek
      betrekking heeft, de graad Bachelor op het gebied van het recht en tevens de graad Master op het gebied van het
      recht is verleend, of

      b. hij op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester
      te voeren heeft verkregen. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking
      tot de beroepsvereisten. [Artikel 5, vierde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2] is van
      overeenkomstige toepassing.

      5 Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het vierde lid, onderdeel a,
      gelijk worden gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.

      6 In bijzondere gevallen kan van het vierde lid worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005682
