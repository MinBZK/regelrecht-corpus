        artikel: '44'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 44a
  - number: '6'
    text: |-
      1 Alvorens hun ambt te aanvaarden leggen de vice-president en de leden in handen van de Koning de volgende eed
      (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke
      naam of welk voorwendsel ook, aan iemand iets heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, van niemand enig geschenk of enige
      belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk.

      Ik zweer (beloof) trouw aan de Koning, dat ik het Statuut voor het Koninkrijk en de Grondwet steeds zal helpen
      onderhouden en mijn ambt met eerlijkheid, nauwgezetheid en onpartijdigheid zal vervullen.

      Zo waarlijk helpe mij God almachtig!»

      (Dat verklaar en beloof ik»).

      2 Deze eed (verklaring en belofte) kan door de leden ook worden afgelegd in een vergadering van de Raad in handen
      van de vice-president, daartoe door de Koning gemachtigd.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel6
  - number: '7'
    text: |-
      De vice-president wordt bij verhindering of ontstentenis vervangen door het oudste aanwezige lid, naar rang van
      benoeming.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel7
  - number: 7a
    text: |-
      De Raad is belast met de taken, bij de [artikelen 35][ref1] en [38 van de Grondwet][ref2] aan hem opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel38
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel7a
