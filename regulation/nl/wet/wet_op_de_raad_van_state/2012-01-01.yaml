  - number: '47'
    text: |-
      1 Een belanghebbende en het bestuursorgaan kunnen bij de Afdeling bestuursrechtspraak hoger beroep instellen tegen
      een uitspraak van de rechtbank als bedoeld in [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen
      een uitspraak van de voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2], tenzij
      tegen de uitspraak hoger beroep kan worden ingesteld bij de Centrale Raad van Beroep, het College van Beroep voor
      het bedrijfsleven of het gerechtshof.

      2 Geen hoger beroep kan worden ingesteld tegen:

      a. een uitspraak van de rechtbank na toepassing van
      [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref3],

      b. een uitspraak van de rechtbank als bedoeld in [artikel 8:54a van die wet][ref4],

      c. een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref5],

      d. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, tweede lid, van die wet][ref6], en

      e. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75a, eerste lid][ref7], in verband met
      [artikel 8:84, vierde lid, van die wet][ref8].

      3 Tegelijkertijd met het hoger beroep tegen de in het eerste lid bedoelde uitspraak kan hoger beroep worden
      ingesteld tegen:

      a. een tussenuitspraak als bedoeld in [artikel 8:80a van de Algemene wet bestuursrecht][ref9]; of

      b. een andere beslissing van de rechtbank.


