  - number: '9'
    text: De staatsraden hebben bij de vervulling van hun taak de bevoegdheden van een lid van de Raad.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 Er kunnen staatsraden in buitengewone dienst worden benoemd.

      2 Een staatsraad in buitengewone dienst neemt slechts deel aan de werkzaamheden van de Raad of van een van zijn
      afdelingen, voorzover hij daartoe door de vice-president is opgeroepen.

      3 De [artikelen 2, derde tot en met vijfde lid][ref1], [3][ref2], [4][ref3],
      [5, eerste lid, aanhef en onder d, en tweede lid][ref4], [6][ref5], [8, tweede en derde lid][ref6], en [9][ref7]
      zijn van overeenkomstige toepassing.


