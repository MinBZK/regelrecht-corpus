  - number: '4'
    text: Slechts Nederlanders kunnen worden benoemd tot vice-president of tot lid.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onverenigbaar met het ambt van vice-president of lid zijn:

      a. de openbare betrekkingen, aan welke een vaste beloning of toelage is verbonden;

      b. het lidmaatschap van publiekrechtelijke colleges, waarvoor de keuze geschiedt bij krachtens wettelijk
      voorschrift uitgeschreven verkiezingen;

      c. het ambt of beroep van advocaat, notaris, accountant, belastingconsulent of zaakwaarnemer;

      d. betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van hun ambt of op de
      handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.

      2 Behoudens indien de onverenigbaarheid ook uit een ander wettelijk voorschrift voortvloeit, kan ten aanzien van
      een lid op diens verzoek van het eerste lid, onderdeel a, bij koninklijk besluit, de Raad van State gehoord, voor
      een bepaalde tijd ontheffing worden verleend.

      3 Gedurende de ontheffing, bedoeld in het tweede lid, is het lid ontheven van de waarneming van zijn ambt.

      4 De bezoldiging wordt gedurende de periode van de ontheffing van de waarneming van zijn ambt ingehouden.

      5 De betrekkingen die de vice-president en de leden buiten hun ambt vervullen worden door de vice-
      president openbaar gemaakt. De [artikelen 44, derde tot en met zesde en achtste lid][ref1], en
      [44a van de Wet rechtspositie rechterlijke ambtenaren][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel5
    references:
