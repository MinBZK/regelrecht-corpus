  - number: '27'
    text: |-
      1 De Tweede Kamer der Staten-Generaal en de Staten-Generaal in verenigde vergadering
      dragen zorg voor het openbaar maken van de adviezen van de Afdeling advisering, bedoeld in
      [artikel 18, eerste en tweede lid, onderscheidenlijk vierde lid][ref1], alsmede voor een schriftelijke reactie op
      deze adviezen.

      2 Openbaarmaking van de adviezen geschiedt tezamen met openbaarmaking van de schriftelijke reactie.

      3 Openbaarmaking blijft achterwege in de gevallen, bedoeld in
      [artikel 10 van de Wet openbaarheid van bestuur][ref2].

      4 Actieve openbaarmaking kan achterwege blijven indien het advies zonder meer instemmend luidt, dan wel uitsluitend
      opmerkingen van redactionele aard bevat.

      5 De Afdeling advisering doet in de adviezen voorstellen omtrent de toepassing van de bepalingen van het derde of
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
