  - number: '53'
    text: |-
      De Afdeling bestuursrechtspraak bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met
      verbetering van de gronden, of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de
      rechtbank zou behoren te doen.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel53
  - number: '54'
    text: |-
      1 Indien de Afdeling bestuursrechtspraak de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de
      uitspraak tevens in dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door het door de
      Afdeling bestuursrechtspraak aangewezen bestuursorgaan wordt vergoed.

      2 In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht geheel of gedeeltelijk door het
      door de Afdeling bestuursrechtspraak aangewezen bestuursorgaan wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel54
  - number: '55'
    text: |-
      1 De Afdeling bestuursrechtspraak wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld,
      indien:

      a. de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en de
      Afdeling bestuursrechtspraak deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk
      ontvankelijkverklaring van het beroep, of

      b. de Afdeling bestuursrechtspraak om andere redenen dan bedoeld in onderdeel *a* van oordeel is dat de zaak
      opnieuw door de rechtbank moet worden behandeld.

      2 De secretaris zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk
      aan de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel55
  - number: '56'
    text: |-
      In de gevallen, bedoeld in [artikel 55, eerste lid, onderdeel a][ref1], kan de Afdeling bestuursrechtspraak de zaak
      zonder terugwijzing afdoen, indien zij naar haar oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel55
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '55'
        hoofdstuk: III
        afdeling: '3'
  - number: '57'
    text: |-
      Indien de Afdeling bestuursrechtspraak van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de
      bevoegde, kan zij de onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel57
  - number: '58'
    text: |-
      1 Tegen de vice-president, de staatsraden en de staatsraden in buitengewone dienst kan noch een rechtsvervolging,
      noch een rechtsvordering worden ingesteld wegens hetgeen zij tijdens de beraadslaging in de Raad, de Afdeling
      advisering, de Afdeling bestuursrechtspraak of een kamer van die Afdeling bestuursrechtspraak hebben gezegd, dan
      wel daaraan schriftelijk hebben overgelegd.

      2 [Artikel 42 van de Wet rechtspositie rechterlijke ambtenaren][ref1] is van overeenkomstige toepassing op de leden
      van de Afdeling bestuursrechtspraak, met dien verstande dat in plaats van «Onze Minister» steeds wordt gelezen: de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel42
    url: https://wetten.overheid.nl/BWBR0002367/2012-01-01#Artikel58
