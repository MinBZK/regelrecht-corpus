---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_normering_topinkomens_toegelaten_instellingen_volkshuisvesting
regulatory_layer: WET
publication_date: '2014-11-28'
valid_from: '2026-01-01'
bwb_id: BWBR0034245
url: https://wetten.overheid.nl/BWBR0034245/2026-01-01
preamble:
  text: |-
    Gelet op de artikelen 2.7 en 2.9 van de Wet normering bezoldiging topfunctionarissen publieke en semipublieke
    sector;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#ArtikelAanhef
articles:
   - number: '1'
     text: |-
       In deze regeling wordt verstaan onder:

       a. *toegelaten instelling:* krachtens [artikel 19, eerste lid, van de Woningwet][ref1] toegelaten rechtspersoon;

       b. *wet:* [Wet normering topinkomens][ref2].


       [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
       [ref2]: https://wetten.overheid.nl/BWBR0032249
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel1
     references:
       - id: ref1
         bwb_id: BWBR0005181
         artikel: '19'
       - id: ref2
         bwb_id: BWBR0032249
   - number: '2'
     text: |-
       Een toegelaten instelling wordt ingedeeld in een bezoldigingsklasse overeenkomstig de bij deze regeling behorende
       tabel.
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel2
   - number: '3'
     text: |-
       De bezoldiging van een topfunctionaris van een toegelaten instelling bedraagt per bezoldigingsklasse in 2026 ten
       hoogste:

       | Bezoldigingsklasse | Maximale bezoldiging |
       |---------------------|----------------------|
       | A                   | € 123.000            |
       | B                   | € 140.000            |
       | C                   | € 155.000            |
       | D                   | € 164.000            |
       | E                   | € 192.000            |
       | F                   | € 219.000            |
       | G                   | € 245.000            |
       | H                   | De maximale bezoldiging, bedoeld in [artikel 2.3 van de wet][ref1]. |

       [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2.3
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel3
     references:
       - id: ref1
         bwb_id: BWBR0032249
         artikel: '2.3'
     machine_readable:
       execution:
         parameters:
           - name: bezoldigingsklasse
             type: string
             required: true
             description: Bezoldigingsklasse (A t/m H)
         input:
           - name: maximale_bezoldiging_wet_artikel_2_3
             type: amount
             source:
               regulation: wet_normering_topinkomens
               output: maximale_bezoldiging
             type_spec:
               unit: eurocent
         output:
           - name: maximale_bezoldiging
             type: amount
             type_spec:
               unit: eurocent
         actions:
           - output: maximale_bezoldiging
             value:
               operation: IF
               cases:
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: A
                   then: 12300000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: B
                   then: 14000000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: C
                   then: 15500000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: D
                   then: 16400000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: E
                   then: 19200000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: F
                   then: 21900000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: G
                   then: 24500000
                 - when:
                     operation: EQUALS
                     subject: $bezoldigingsklasse
                     value: H
                   then: $maximale_bezoldiging_wet_artikel_2_3
               default: 0
   - number: '4'
     text: |-
       1 Een aanvraag als bedoeld in [artikel 2.7, derde lid, van de wet][ref1] van een toegelaten instelling om met
       ingang van een kalenderjaar te worden ingedeeld in een andere klasse dan die waarin zij volgens de bij deze
       regeling behorende tabel is ingedeeld, wordt ingediend voor 1 maart van het kalenderjaar.

       2 Een aanvraag als bedoeld in het eerste lid bevat een deugdelijke motivering voor de aanvraag.

       3 Bij een aanvraag als bedoeld in het eerste lid wordt een verklaring van het toezichthoudende orgaan van de
       toegelaten instelling gevoegd waaruit zijn instemming met de aanvraag blijkt.


       [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2.7
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel4
     references:
       - id: ref1
         bwb_id: BWBR0032249
         artikel: '2.7'
     machine_readable:
       execution:
         parameters:
           - name: peildatum
             type: date
             required: false
             description: De datum waarop de geldigheid van de aanvraag wordt getoetst
           - name: heeft_motivering
             type: boolean
             required: true
             description: Bevat de aanvraag een deugdelijke motivering
           - name: heeft_toestemming_toezichthouder
             type: boolean
             required: true
             description: Is er instemming van het toezichthoudende orgaan
         output:
           - name: aanvraag_valide
             type: boolean
         actions:
           - output: aanvraag_valide
             value:
               operation: AND
               left:
                 operation: DATE_BEFORE
                 left: $peildatum
                 right:
                   operation: DATE
                   year:
                     operation: DATE_YEAR
                     subject: $peildatum
                   month: 3
                   day: 1
               right:
                 operation: AND
                 left: $heeft_motivering
                 right: $heeft_toestemming_toezichthouder
   - number: '5'
     text: |
       De verantwoordelijke, bedoeld in [artikel 1.1 van de wet][ref1], verstrekt langs elektronische weg op
       uiterlijk 1 juli van het jaar volgend op het boekjaar, in aanvulling op de openbaarmakingsplicht, bedoeld in
       [artikel 4.1, eerste en tweede lid, van de wet][ref2], de gegevens bedoeld in artikel 4.1, eerste en tweede lid,
       van de wet, aan de minister.

       [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1.1
       [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel4.1
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel5
     references:
       - id: ref1
         bwb_id: BWBR0032249
         artikel: '1.1'
       - id: ref2
         bwb_id: BWBR0032249
         artikel: '4.1'
     machine_readable:
       execution:
         parameters:
           - name: boekjaar
             type: date
             required: true
             description: Het boekjaar waarvoor gerapporteerd wordt
         output:
           - name: rapportage_deadline
             type: date
         actions:
           - output: rapportage_deadline
             value:
               operation: DATE
               year:
                 operation: ADD
                 left:
                   operation: DATE_YEAR
                   subject: $boekjaar
                 right: 1
               month: 7
               day: 1
   - number: '6'
     text: Deze regeling treedt in werking met ingang van 1 januari 2014.
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel6
   - number: '7'
     text: 'Deze regeling wordt aangehaald als: Regeling normering topinkomens toegelaten instellingen volkshuisvesting.'
     url: https://wetten.overheid.nl/BWBR0034245/2026-01-01#Artikel7
