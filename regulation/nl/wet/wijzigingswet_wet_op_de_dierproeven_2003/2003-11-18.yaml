preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Wet op de dierproeven een verbod neer te leggen
    op het doen van proeven op homonoïde primaten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015677/2003-11-18#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.

      2 [Artikel 10e van de Wet op de dierproeven][ref1] geldt niet voor proeven met gebruikmaking van chimpansees (pan
      troglodytes) ten behoeve van onderzoek naar een vaccin tegen hepatitis-C, waarvan de uitvoering is begonnen vóór 1
      januari 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10e
    url: https://wetten.overheid.nl/BWBR0015677/2003-11-18#ArtikelII
