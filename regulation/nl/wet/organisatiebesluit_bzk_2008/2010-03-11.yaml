  - number: '4.1'
    text: |-
      1 Tot de taak van de directoraten-generaal, het Bureau Algemene Bestuursdienst, de Dienst Concernstaf en
      Bedrijfsvoering, de Algemene Inlichtingen- en Veiligheidsdienst en de Inspectie Openbare Orde en Veiligheid behoort
      voorts de uitvoering van andere taken dan hiervoor genoemd, in opdracht van een Minister of de secretaris-generaal,
      voor zover hogere wet- en regelgeving zich daartegen niet verzet.

      2 Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd
      in het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de Minister, de
      secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel4.1
  - number: '4.2'
    text: |-
      1 De plaatsvervangend secretaris-generaal, de directeuren-generaal, het hoofd van het Bureau Algemene
      Bestuursdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid stellen met inachtneming van dit besluit
      de inrichting van hun dienstonderdelen nader vast door vermelding van deze inrichting in het capaciteitsplan.

      2 In afwijking van het eerste lid stelt de secretaris-generaal met inachtneming van dit besluit de inrichting
      van de Algemene Inlichtingen- en Veiligheidsdienst vast op voordracht van het hoofd van de Algemene Inlichtingen-
      en Veiligheidsdienst en na advisering van de directeur Personeel en Organisatie voor zover nodig nader vast bij
      schriftelijk besluit.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel4.2
  - number: '4.3'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal, het hoofd van de
      Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid, ieder voor
      zover het hem aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur
      Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel4.3
  - number: '4.4'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties en
      geschiedt op voordracht van de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel4.4
  - number: '4.5'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2008.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel4.5
  - number: '4.6'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2008.'
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel4.6
