preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit organisatie en formatie rijksdienst 2007;

    Besluit vast te stellen het navolgende organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *Ministerie:* het ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *Capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van het
      directoraat-generaal, respectievelijk van de Dienst Concernstaf en Bedrijfsvoering of de Inspectie Openbare Orde en
      Veiligheid wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel1
  - number: '2.1'
    text: |-
      1 De hoofdstructuur van het Ministerie bestaat uit de volgende dienstonderdelen:

      a. de Algemene Leiding (AL);

      b. de dienst Concernstaf en Bedrijfsvoering (DCB);

      c. het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (DGOBR);

      d. het directoraat-generaal Bestuur en Koninkrijksrelaties (DGBK);

      e. het directoraat-generaal Veiligheid (DGV);

      f. de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);

      g. het Bureau Algemene Bestuursdienst (BABD);

      h. de Inspectie Openbare Orde en Veiligheid (IOOV).

      2 De Algemene Leiding ressorteert onder de Minister.

      3 De overige in het eerste lid genoemde dienstonderdelen ressorteren onder de Algemene Leiding van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel2.1
  - number: '2.2'
    text: |-
      1 Er is een managementteam Binnenlandse Zaken en Koninkrijksrelaties (MTBZK).

      2 Het MTBZK is samengesteld uit de secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-
      generaal en het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst. De leden kunnen zich incidenteel
      laten vervangen door hun plaatsvervangers of, in uitzonderlijke gevallen, door een andere rechtstreeks onder hen
      ressorterende functionaris.

      De secretaris-generaal vertegenwoordigt de Inspectie Openbare Orde en Veiligheid in het MTBZK. Op verzoek van de
      secretaris-generaal kan het hoofd van de Inspectie OOV worden uitgenodigd voor het bijwonen van het MTBZK.

      De directeur Financieel-economische Zaken heeft een permanente uitnodiging tot het als adviseur bijwonen van het
      MTBZK.

      3 Het overleg in het MTBZK heeft, onverminderd het bepaalde in de departementale mandaat- en volmachtbesluiten over
      de bevoegdheden van de afzonderlijke leden van het managementteam Binnenlandse Zaken en Koninkrijksrelaties ten
      aanzien van de onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van respectievelijk het
      bereiken van overeenstemming over de departementale beleids- en beheerskaders en het toezien op de uitvoering van
      deze kaders.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het secretariaat van het MTBZK wordt gevoerd door de directeur van de directie Bestuursondersteuning.

      6 Het MTBZK regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel2.2
  - number: '2.3'
    text: |-
      1 Er is een Centraal HRM-beraad.

      2 Het Centraal HRM-beraad is samengesteld uit de secretaris-generaal, de plaatsvervangend secretaris-generaal, de
      directeuren-generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst en de directeur Personeel en
      Organisatie van de dienst Concernstaf en Bedrijfsvoering. De leden kunnen zich incidenteel laten vervangen door hun
      plaatsvervangers. De secretaris-generaal vertegenwoordigt de Inspectie Openbare Orde en Veiligheid in het Centraal
      HRM-beraad. Op verzoek van de secretaris-generaal kan het hoofd van de Inspectie OOV worden uitgenodigd voor het
      CHRM-beraad.

      3 Het overleg in het Centraal HRM-beraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van het managementteam Binnenlandse Zaken en
      Koninkrijksrelaties ten aanzien van de onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van
      respectievelijk het bereiken van overeenstemming over aspecten van het departementale personeelsbeleid en personele
      aangelegenheden alsmede het toezien op de uitvoering hiervan. In het overleg komen in ieder geval de volgende
      aangelegenheden aan de orde.

      a. de beleidsontwikkeling van management-development bij het Ministerie;

      b. de benoeming van functionarissen in schaal 14 en hoger bij het Ministerie;

      c. de werkzaamheden van het Centraal HRM-beraad met betrekking tot de personeelsschouw, zoals aangegeven in het
      departementale beleid ter zake.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het hoofd van de afdeling HRM-Advies van de directie Personeel en Organisatie is verantwoordelijk voor het voeren
      van het secretariaat van het Centraal HRM-beraad.

      6 Het Centraal HRM-beraad regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel2.3
  - number: '2.4'
    text: |-
      1 Er is een Audit Committee.

      2 Het Audit Committee is samengesteld uit de leden van de het managementteam Binnenlandse Zaken en
      Koninkrijksrelaties, de directeur Financieel-economische Zaken en de directeur Auditdienst dan wel personen die
      deze leden vertegenwoordigen. Aan het Audit Committee zijn één of meerdere externe deelnemers toegevoegd.

      3 Het Audit Committee vormt zich een oordeel over:

      a. de bedrijfsvoering en de opzet en werking van het management control systeem;

      b. het samenstel van en de samenhang tussen de producten vanuit control, audit en certificering;

      c. het auditjaarplan en de daarin voorgenomen onderzoeken;

      d. de uitkomsten van de bedrijfsvoeringonderzoeken en de verwerking ervan.

      4 Het Audit Committee adviseert de secretaris-generaal over de maatregelen die zo nodig moeten worden genomen.

      5 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      6 De directie Financieel-economische Zaken voert het secretariaat van het Audit Committee.

      7 Het Audit Committee regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel2.4
  - number: '3.1'
    text: |-
      1 De Algemene Leiding bestaat uit de secretaris-generaal.

      2 De plaatsvervangend secretaris-generaal maakt deel uit van de Algemene Leiding, voor zover de secretaris-generaal
      hem structureel het uitoefenen van bepaalde elementen van het aan de secretaris-generaal voorbehouden takenpakket
      heeft overgedragen. De secretaris-generaal stelt een dergelijke taakoverdracht vast en maakt deze genoegzaam
      bekend.

      3 De secretaris-generaal is belast met de ambtelijke leiding van het Ministerie. Tot deze taak behoort in ieder
      geval:

      a. het informeren en adviseren van de Minister over aangelegenheden, de Minister of het Ministerie betreffende;

      b. het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en
      beleidsuitvoering binnen het Ministerie;

      c. het uitoefenen van de algemene controlfunctie bij het Ministerie;

      d. het rechtstreeks leiding geven aan de plaatsvervangend secretaris-generaal, de directeuren-generaal, het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid;

      e. het voorzitterschap van het MTBZK, het Centraal HRM-beraad en het Audit Committee;

      f. het zorgdragen voor, het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het Ministerie;

      g. het voeren van overleg met de Groepsondernemingsraad en de centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];

      h. het optreden als gemachtigd ambtenaar in de zin van de Uitvoeringsregeling openbaarheid van bestuur Binnenlandse
      Zaken;

      i. het plegen van inhoudelijke afstemming met de directeuren van de Auditdienst en de directies Financieel
      Economische Zaken (FEZ) en Constitutionele Zaken en Wetgeving (CZW);

      j. het uitvoeren van taken als bedoeld in
      [artikel 3 van het Besluit voorschrift informatiebeveiliging rijksdienst 2007][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0022141#Artikel3
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0022141
        artikel: '3'
  - number: '3.2'
    text: |-
      1 De plaatsvervangend secretaris-generaal is belast met de leiding van de dienst Concernstaf en Bedrijfsvoering.

      2 De dienst Concernstaf en Bedrijfsvoering heeft de volgende kerntaken:

      a. de concernsturing en de strategische advisering van het managementteam van het Ministerie;

      b. de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de bedrijfsvoering;

      c. de ondersteuning en het beheer van de bedrijfsprocessen.

      3 De dienst Concernstaf en Bedrijfsvoering bestaat uit de volgende organisatieonderdelen:

      a. het bureau dienst Concernstaf en Bedrijfsvoering (BDCB);

      b. de directie Bestuursondersteuning (BO);

      c. de directie Communicatie en Informatie (C&I);

      d. de directie Personeel en Organisatie (P&O);

      e. de directie Bedrijfsvoering (BV);

      f. de directie Financieel Economische Zaken (FEZ);

      g. de directie Constitutionele Zaken en Wetgeving (CZW).

      4 Uitsluitend onder beheersmatige leiding van de plaatsvervangend secretaris-generaal vallen de Auditdienst (AD),
      de projectdirectie Nieuwbouw Justitie & BZK (PNJB), het gemeenschappelijke secretariaat van de Raad voor het
      openbaar bestuur en de Raad voor de financiële verhoudingen (sRob/Rfv) en het secretariaat van de Kiesraad (sKR)
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.2
  - number: '3.3'
    text: |-
      1 Het bureau dienst Concernstaf en Bedrijfsvoering staat onder leiding van een hoofd.

      2 Het bureau heeft tot taak de plaatsvervangend secretaris-generaal te ondersteunen bij de uitvoering van de
      beleids- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.3
  - number: '3.4'
    text: |-
      1 De directie Bestuursondersteuning staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het beheers- en beleidsmatig ondersteunen en adviseren van de bewindspersonen en de algemene leiding;

      b. het voeren van het secretariaat van de ambtelijke en politieke leiding;

      c. het coördineren van aangelegenheden met betrekking tot het parlement of de ministerraad;

      d. het ondersteunen van de secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      beveiliging van het Ministerie;

      e. het coördineren en bevorderen van strategische kennisontwikkeling;

      f. de vertegenwoordiging van het Ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie (PVEU);

      g. het coördineren van de internationale strategische adviesfunctie van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.4
  - number: '3.5'
    text: |-
      1 De directie Financieel-economische Zaken staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het uitvoeren van taken die voortvloeien uit [artikel 21 van de Comptabiliteitswet 2001][ref1];

      b. het uitvoeren van taken die voortvloeien uit het [Besluit taak FEZ][ref2];

      c. taken die voortvloeien uit [artikel 3, zevende lid, van het Beheersbesluit KABGNA/KABGA 1998][ref3];

      d. het stellen van kaders voor de bedrijfsvoering van het Ministerie;

      e. het uitoefenen van de financiële control van het Ministerie;

      f. het strategisch adviseren van de Algemene Leiding en de Minister over het departementaal financieel-economisch
      beleid waarbij doelmatigheid en doeltreffendheid van het beleid vanuit een brede financiële invalshoek word
      beoordeeld;

      g. het verzorgen van de proces- en financiële infrastructuur;

      h. het verzorgen van de financiële administraties;

      i. het ontwikkelen, invoeren en beheren van systemen van management en financiële informatievoorziening;

      j. het adviseren en ondersteunen van de (beleids)directies in sturings-, beheersings- en
      verantwoordingsvraagstukken;

      k. het verrichten van financieel onderzoek;

      l. het verzorgen van de uitvoering van de Financiële-verhoudingswet.

      3 De directeur Financieel-economische Zaken is tevens Coördinerend Directeur Inkoop. Deze is verantwoordelijk voor:

      a. het stellen van kaders voor het inkoopbeleid van het Ministerie;

      b. de coördinatie van de inkoopfunctie en het contractbeheer van het Ministerie;

      c. centrale ondersteuning en advisering bij inkoopvraagstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
      [ref3]: https://wetten.overheid.nl/BWBR0009743#Artikel3
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.5
