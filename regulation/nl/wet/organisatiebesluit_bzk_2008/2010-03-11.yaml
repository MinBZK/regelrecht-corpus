  - number: '3.12'
    text: |-
      1 Het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen staat onder leiding van een secretaris.

      2 Het secretariaat heeft tot taak beide raden inhoudelijk en administratief te ondersteunen bij hun advisering.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.12
  - number: '3.13'
    text: |-
      1 Het secretariaat voor de Kiesraad staat onder leiding van een secretaris/directeur.

      2 Het secretariaat biedt ondersteuning aan de Kiesraad bij het vervullen van zijn wettelijke taken op het terrein
      van verkiezingen.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.13
  - number: '3.14'
    text: |-
      1 Het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal heeft tot taak zorg te dragen voor een integrale aanpak op het terrein van
      bedrijfsvoering van de Rijksoverheid door:

      a. kaderstelling op de onderscheiden terreinen van de bedrijfsvoering;

      b. het bevorderen, realiseren en (doen) in stand houden van samenwerking en gezamenlijke uitvoeringsorganisaties;

      c. het in programma’s (doen) realiseren van Rijksbrede voorzieningen op het terrein van de bedrijfsvoering.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het bureau Directeur-Generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (BDGOBR);

      b. de directie Faciliteiten-, Huisvesting- en Inkoopbeleid Rijk (FHIR);

      c. de directie Organisatie en Personeelsbeleid Rijk (OP Rijk);

      d. de directie Informatiseringsbeleid Rijk (I Rijk);

      e. de baten-lastendienst i.o. P-Direkt;

      f. de baten-lastendienst de Werkmaatschappij (Wmij);

      g. het agentschap Centrale Archief Selectiedienst (CAS).
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.14
  - number: '3.15'
    text: |-
      1 Het bureau Directeur-Generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder
      leiding van een hoofd.

      2 Het bureau heeft tot taak de directeur-generaal te ondersteunen bij de uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.15
  - number: '3.16'
    text: |-
      1 De directie Faciliteiten-, Huisvesting- en Inkoopbeleid Rijk staat onder leiding van een directeur.

      2 De directie heeft tot taak de kaderstelling en de regievoering ten aanzien van het beleid van de Rijksoverheid
      over de facilitaire dienstverlening, de huisvesting en inkopen en de regievoering ten aanzien van het beleid van de
      Rijksoverheid over aanbesteden.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.16
  - number: '3.17'
    text: |-
      1 De directie Organisatie en Personeelsbeleid Rijk staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a) het ondersteunen van de Minister bij het afsluiten van de arbeidsvoorwaarden van het Rijk;

      b) het ondersteunen van de arbeidskwaliteit van het Rijk;

      c) de organisatie van de Rijksoverheid en de daaraan verbonden uitvoeringsorganisaties op centraal niveau;

      d) de informatievoorziening op het vlak van de bedrijfsvoering bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.17
  - number: '3.18'
    text: |-
      1 De directie Informatiseringsbeleid Rijk staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen en beheren van kaders voor informatiseringsbeleid binnen het Rijk;

      b. het in brede zin bevorderen van de kwaliteit van informatisering binnen het Rijk;

      c. het volgen van grote projecten voor informatie- en communicatietechnologie binnen het Rijk en het periodiek
      daarover rapporteren aan de Tweede Kamer;

      d. het fungeren als opdrachtgever voor rijksbrede projecten en beheerorganisaties op het gebied van informatie-
      en communicatietechnologie;

      e. het bevorderen en faciliteren van informatiebeveiliging op het gebied van personeel, informatie- en
      communicatietechnologie en organisatie.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.18
  - number: '3.19'
    text: |-
      1 De baten-lastendienst i.o. P-Direkt staat onder leiding van een directeur.

      2 P-Direkt heeft tot taak om in één Shared Service Center HRM een efficiënte en kwalitatief hoogwaardige
      salaris- en personeelsadministratie te realiseren gebaseerd op gezamenlijk ontwikkelde en beheerde personeels- en
      salarissystemen voor de Rijksoverheid (met uitzondering van het Ministerie van Defensie en de Staten-Generaal).
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.19
  - number: '3.20'
    text: |-
      1 De baten-lastendienst Werkmaatschappij staat onder leiding van een directeur.

      2 De Werkmaatschappij heeft tot taak de interdepartementale samenwerkingsverbanden binnen de Rijksoverheid op het
      gebied van bedrijfsvoering te faciliteren.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.20
  - number: '3.21'
    text: |-
      1 Het agentschap Centrale Archief Selectiedienst staat onder leiding van een directeur.

      2 Het agentschap heeft de taken, bedoeld in het besluit van 12 december 1996, houdende regels met betrekking tot
      taak en werkwijze van de Centrale Archief Selectiedienst.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.21
  - number: '3.22'
    text: |-
      1 Het directoraat-generaal Bestuur en Koninkrijksrelaties staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal draagt zorg voor het bestuurlijk en ambtelijk functioneren van de publieke sector
      in Nederland en voor de handhaving en uitvoering van het Statuut van het Koninkrijk, door het uitvoeren van de
      volgende taken:

      a. het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties
      met de overige onderdelen van het Koninkrijk, de Europese Unie en andere internationale instellingen;

      b. het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, o.a.
      met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het Provinciefonds);

      c. het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit
      de eigenstandige positie van provincies en gemeenten;

      d. het zorgdragen voor de kwaliteit, integriteit, diversiteit en veiligheid van het overheidpersoneel;

      e. de ontwikkeling van een adequate dienstverlening en vermindering van regeldruk;

      f. het zorgdragen voor een goed Gemeenschappelijke Basis Administratiestelsel en voor een goed functionerend
      reisdocumentenstelsel en het daarbij behorende persoonsinformatiebeleid;

      g. het zorgdragen voor goede relaties met en coördinatie van de samenwerking met de Nederlandse Antillen en Aruba.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het bureau Directeur-Generaal Bestuur en Koninkrijksrelaties (BDGBK);

      b. de directie Koninkrijksrelaties (DKR);

      c. de directie Openbaar Bestuur en Democratie (DOBD);

      d. de directie Arbeidszaken Publieke Sector (APS);

      e. de directie Gemeenschappelijke Beheer Organisatie Overheid (GBO Overheid);

      f. de programmadirectie Dienstverlening, Regeldruk en Informatiebeleid (PDRI);

      g. de programmadirectie Krachtig Bestuur (PKB);

      h. de Vertegenwoordiging van Nederland in Aruba (VNO);

      i. de Vertegenwoordiging van Nederland in de Nederlandse Antillen (VNW);

      j. de baten-lastendienst Basisadministratie Persoonsgegevens en Reisdocumenten (BPR).
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.22
  - number: '3.23'
    text: |-
      1 Het bureau Directeur-Generaal van het directoraat-generaal Koninkrijksrelaties en Bestuur staat onder leiding van
      een hoofd.

      2 Het bureau heeft tot taak de Directeur-Generaal te ondersteunen bij de uitvoering van de beleids- en
      beheerstaken.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.23
  - number: '3.24'
    text: |-
      1 De directie Koninkrijksrelaties staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a) het ontwikkelen van het samenwerkingsbeleid in algemene zin respectievelijk van het Nederlands beleid met
      betrekking tot de samenwerkingsrelatie met de Nederlandse Antillen en Aruba;

      b) het ontwikkelen, coördineren en uitvoeren van de samenwerking en het onderhouden van betrekkingen met de
      Nederlandse Antillen en Aruba;

      c) het initiëren en coördineren van het Nederlandse beleid ten aanzien van de Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.24
  - number: '3.25'
    text: |-
      1 De directie Openbaar Bestuur en Democratie staat onder leiding van een directeur.

      2 De directie heeft tot taak het ontwikkelen van beleid en wetgeving met betrekking tot de inrichting, werking
      en financiering van het binnenlandse bestuur waarbij specifieke aandacht wordt gegeven aan de burger in dit
      democratische bestel en de uitvoering van de in de [Financiële verhoudingswet][ref1] en [Gemeente][ref2]- en
      [Provinciewet][ref3] neergelegde taken van de minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008290
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0005645
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0008290
      - id: ref2
        bwb_id: BWBR0005416
      - id: ref3
        bwb_id: BWBR0005645
  - number: '3.26'
    text: |-
      1 De directie Arbeidszaken Publieke Sector staat onder leiding van een directeur.

      2 De directie heeft tot taak het zorgdragen voor de voorwaarden voor het functioneren van politieke ambtsdragers en
      voor de inzet van goed gekwalificeerde medewerkers in de openbare sector.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.26
  - number: '3.27'
    text: |-
      1 De directie Gemeenschappelijke Beheer Organisatie Overheid staat onder leiding van een directeur.

      2 De Gemeenschappelijke Beheer Organisatie Overheid heeft tot taak het ondersteunen van de elektronische
      dienstverlening aan burgers en bedrijven door de noodzakelijke infrastructurele basisvoorzieningen te beheren en
      verder te ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.27
  - number: '3.28'
    text: |-
      1 De programmadirectie Dienstverlening Regeldruk en Informatiebeleid staat onder leiding van een
      programmadirecteur.

      2 Het programma heeft de volgende taken:

      a. het verbeteren van de publieke dienstverlening;

      b. het vergroten van de toegankelijkheid van overheidsinformatie;

      c. het verminderen van de regeldruk.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.28
  - number: '3.29'
    text: |-
      1 De programmadirectie Krachtig Bestuur staat onder leiding van een programmadirecteur.

      2 Het programma heeft tot taak het vergroten van de bestuurskracht van het openbaar bestuur als geheel door
      gemeenten te faciliteren in het efficiënt en effectief oplossen van maatschappelijke problemen op een manier die
      tegemoet komt aan de wensen van de burgers.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.29
  - number: '3.30'
    text: |-
      1 De Vertegenwoordiging van Nederland in Aruba staat onder leiding van een Vertegenwoordiger.

      2 De Vertegenwoordiging heeft bij koninklijk besluit van 24 april 1997, regelende de positie en functie van
      Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen onderscheidenlijk Aruba,
      de volgende taken:

      a) het optreden als vertegenwoordiger van de Nederlandse regering bij de regering van Aruba;

      b) het onderhouden van contacten met de regering van Aruba, alsmede met andere autoriteiten van Aruba;

      c) het informeren van de ministers en de ambtelijke leiding van het ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in Aruba;

      d) het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan Aruba;

      e) het zorgdragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.30
  - number: '3.31'
    text: |-
      1 De Vertegenwoordiging van Nederland in de Nederlandse Antillen staat onder leiding van een Vertegenwoordiger.

      2 De Vertegenwoordiging heeft bij koninklijk besluit van 24 april 1997, regelende de positie en functie van
      Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen onderscheidenlijk Aruba,
      de volgende taken:

      a) het optreden als vertegenwoordiger van de Nederlandse regering bij de regering en de eilandbesturen van de
      Nederlandse Antillen;

      b) het onderhouden van contacten met de regering en de eilandbesturen en met andere autoriteiten in de Nederlandse
      Antillen;

      c) het informeren van de ministers en de ambtelijke leiding van het ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in de Nederlandse Antillen;

      d) het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan de Nederlandse Antillen;

      e) het zorgdragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.31
  - number: '3.32'
    text: |-
      1 De baten-lastendienst Basisadministratie Persoonsgegevens en Reisdocumenten staat onder leiding van een
      directeur.

      2 De baten-lastendienst heeft de volgende taken:

      a. de instandhouding van de gemeentelijke basisadministratie persoonsgegevens;

      b. het uitvoeren van het beleid inzake reisdocumenten en de uitvoering van de Paspoortwet;

      c. het zorgdragen voor de implementatie van grootschalige ICT-projecten op het terrein van identiteitsmanagement.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.32
  - number: '3.33'
    text: |-
      1 Het directoraat-generaal Veiligheid staat onder leiding van een directeur-generaal en een plaatsvervangend
      directeur-generaal.

      2 Het directoraat-generaal draagt zorg voor een integrale aanpak op het terrein van veiligheid.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. het bureau Directeur-Generaal van het directoraat-generaal Veiligheid (BDGV);

      b. de afdeling Financiën DGV (FDGV)

      c. de directie Veiligheid en Bestuur (VB);

      d. de directie Politie en Veiligheidsregio’s (PV);

      e. de directie Nationale Veiligheid (NV);

      f. het bureau Landelijk Management Development Politie en Brandweer (BLMD);

      g. het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA);

      h. de baten-lastendienst Landelijke Faciliteit Rampenbestrijding (LFR);

      i. de baten-lastendienst het Korps landelijke politiediensten (KLPD).
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.33
  - number: '3.34'
    text: |-
      1 Het bureau Directeur-Generaal van het directoraat-generaal Veiligheid staat onder leiding van een hoofd.

      2 Het bureau heeft tot taak het ondersteunen van het managementteam van het directoraat-generaal Veiligheid (MTV)
      en de directies bij de uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.34
  - number: '3.35'
    text: |-
      1 De afdeling Financiën Directeur-Generaal Veiligheid staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak het ondersteunen van het managementteam van het directoraat-generaal Veiligheid en de
      directies bij de uitvoering van de Veiligheidsbegroting.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.35
  - number: '3.36'
    text: |-
      1 De directie Veiligheid en Bestuur staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen van een lange termijn visie op maatschappelijke veiligheidsvraagstukken vanuit bestuurlijk
      oogpunt;

      b. het bevorderen van fysieke veiligheid.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.36
  - number: '3.37'
    text: |-
      1 De directie Politie en Veiligheidsregio’s staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen van een (lange termijn) visie op de kwaliteit, de inrichting en de ontwikkeling van en de
      samenhang tussen de veiligheidsorganisaties en de feitelijke inrichting ervan;

      b. het ontwikkelen van beleid op de taakuitvoering en bevoegdheden van de veiligheidsorganisaties;

      c. leveren van een bijdrage aan de besluitvorming over:

        - de landelijke prioriteiten in het werk van de veiligheidsorganisaties;
        - het relatiebeheer van de veiligheidsorganisaties;
        - het beleid op kwaliteit van personeel en materiaal van de veiligheidsorganisaties;
        - het bekostigingsbeleid en monitoring van politie en veiligheidsregio’s;
        - het (financieel) toezicht op de regionale politiekorpsen, Zelfstandige Bestuursorganen en baten-lastendiensten.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.37
  - number: '3.38'
    text: |-
      1 De directie Nationale Veiligheid staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het voorkomen van en prepareren voor dreigingen tegen de nationale veiligheid;

      b. het in dit kader ontwikkelen van een eenheid in visie en optreden tussen de verschillende regio’s en het
      nationale niveau.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.38
  - number: '3.39'
    text: |-
      1 Het bureau Landelijk Management Development Politie en Brandweer staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het samen met het politieveld en het brandweerveld vormgeven, ontwikkelen en uitvoeren van het landelijk
      beleid voor management development voor de politie en brandweer en daarbij behorende instrumenten, een en ander in
      afstemming met het regionaal beleid;

      b. het realiseren van een landelijke infrastructuur van het management development voor de politie en brandweer;

      c. het zorgdragen voor de voorbereiding van en advisering over Kroonbenoemingen bij de politie;

      d. het adviseren over benoemingen in de strategische top van de brandweer.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.39
  - number: '3.40'
    text: |-
      1 Het bureau Korpsbeheer en relatiebeheer agentschappen staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het adviseren en ondersteunen van de directeur-generaal bij de uitvoering van diens taken als gemandateerd
      beheerder van het Korps landelijke politiediensten en als beheerder van de baten-lastendienst Landelijke Faciliteit
      Rampenbestrijding en de Onderzoeksraad voor Veiligheid;

      b. het faciliteren van het Korps landelijke politiediensten, de baten-lastendienst Landelijke Faciliteit
      Rampenbestrijding en de Onderzoeksraad voor Veiligheid in de relatie met de beheerder;

      c. het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het Korps landelijke politiediensten, de
      baten-lastendienst Landelijke Faciliteit Rampenbestrijding en de Onderzoeksraad voor Veiligheid;

      d. het faciliteren van het Korps landelijke politiediensten, de baten-lastendienst Landelijke Faciliteit
      Rampenbestrijding en de Onderzoeksraad voor Veiligheid in de relaties met het Ministerie.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.40
  - number: '3.41'
    text: |-
      1 De baten-lastendienst Landelijke Faciliteit Rampenbestrijding staat onder leiding van een directeur.

      2 De Landelijke Faciliteit Rampenbestrijding heeft de volgende taken:

      a. het uitvoeren van opdrachten op het gebied van rampenbeheersing en brandweerzorg in benodigd materieel,
      telecommunicatie, geneeskundige hulpverlening, logistiek en in beleid betreffende het waarschuwen van bevolking;

      b. het verstrekken van extra materieel voor grootschalige brandbestrijding en technische hulpverlening aan de
      regionale brandweren;

      c. het verstrekken van extra materieel voor de geneeskundige hulpverlening bij ongevallen en rampen alsmede de
      bijzonder politiemiddelen voor de directie Politie.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.41
  - number: '3.42'
    text: |-
      1 De baten-lastendienst het Korps landelijke politiediensten staat onder leiding van een korpschef.

      2 Het Korps is belast met de taken, bedoeld in [artikel 38 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
  - number: '3.43'
    text: |-
      1 De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      3 De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:

      a. de Eenheid Strategie en Beleid (S&B);

      b. de Eenheid Kenniscentrum Verbetermanagement & Innovatie (KVI);

      c. de Eenheid Dienstencentrum (DC);

      d. de Eenheid Binnenlandse Veiligheid (BV);

      e. de Eenheid Veiligheidsonderzoeken (VO).

      f. de Eenheid Inlichtingen Buitenland (IB);

      g. de Eenheid Nationaal Bureau Verbindingsbeveiliging (NBV);

      h. de Eenheid Regie (ER);

      i. de Eenheid Trendanalyse & Fenomeenonderzoek (Terra);

      j. de Eenheid Operationele Expertise & Ondersteuning (OPEX);

      k. de Eenheid Informatie Management (IM).


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: '3.44'
    text: |-
      1 De Eenheid Strategie en Beleid, de Eenheid Kenniscentrum Verbetermanagement & Innovatie en de Eenheid
      Dienstencentrum staan onder leiding van het plaatsvervangend hoofd.

      2 De Eenheid Strategie en Beleid heeft de volgende taken:

      a. het adviseren en ondersteunen van de dienstleiding en het managementteam van de Algemene Inlichtingen- en
      Veiligheidsdienst met betrekking tot de strategische inrichting, de besturing en beheersing van alle hoofdprocessen
      en met betrekking tot de vertegenwoordiging van de Algemene Inlichtingen- en Veiligheidsdienst;

      b. het opstellen en handhaven van strategische kaders en bijbehorend(e) beleid(sregels).

      3 De Eenheid Kenniscentrum Verbetermanagement & Innovatie heeft de volgende taken:

      a. het zorg dragen voor systematische kwaliteitszorg;

      b. het ontwikkelen en bewaken van het procesmanagement;

      c. het bevorderen van innovatie.

      4 De Eenheid Dienstencentrum heeft de volgende taken:

      a. het ondersteunen van de Algemene Inlichtingen- en Veiligheidsdienst op het gebied van administratieve, personele
      en facilitaire diensten;

      b. het leveren van dienstbrede, generieke voorzieningen.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.44
  - number: '3.45'
    text: |-
      1 De Eenheid Binnenlandse Veiligheid en de Eenheid Veiligheidsonderzoeken staan onder leiding van de directeur
      Binnenlandse Veiligheid.

      2 De Eenheid Binnenlandse Veiligheid heeft de volgende taken:

      a. het verrichten van onderzoek naar personen en organisaties die een bedreiging kunnen vormen voor de
      democratische rechtsorde, de veiligheid van de Staat of andere gewichtige belangen van de Staat aangaande:

        - tegenkrachten bij integratie;
        - terrorisme;
        - politiek (gewelddadig) activisme;
        - ongewenste bemoeienis van vreemde mogendheden;
        - bedreiging internationale rechtsorde;
        - integriteitaantastingen.

      b. het bevorderen van de beveiliging van onderdelen van overheid en bedrijfsleven die van vitaal belang zijn voor
      de instandhouding van het maatschappelijk leven;

      c. het bevorderen van de beveiliging van de aangewezen personen, objecten en diensten behorende tot het rijksdomein
      door het maken van dreigingsinschattingen en -meldingen en risicoanalyses.

      3 De Eenheid Veiligheidsonderzoeken heeft de volgende taken:

      a. het adviseren bij de aanwijzing van vertrouwensfuncties en het instemmen met de aanwijzing van
      vertrouwensfuncties;

      b. het verrichten van veiligheidsonderzoeken naar personen die vertrouwensfuncties vervullen of gaan vervullen bij
      overheid en bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.45
  - number: '3.46'
    text: |-
      1 De Eenheid Inlichtingen Buitenland en de Eenheid Nationaal Bureau Verbindingsbeveiliging staan onder leiding van
      de directeur Inlichtingen Buitenland.

      2 De Eenheid Inlichtingen Buitenland heeft tot taak het verrichten van
      onderzoek betreffende andere landen ten aanzien van onderwerpen die op grond van
      [artikel 6, tweede lid, onderdeel d, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1] zijn
      aangewezen.

      3 De Eenheid Nationaal Bureau Verbindingsbeveiliging heeft de volgende taken:

      a. het bevorderen van de beveiliging van communicatie- en informatiesystemen waarvan de beveiliging door het belang
      van de Staat wordt geboden;

      b. het fungeren als National Security Authority (NSA), National Communications Security Authority (NCSA), Nationale
      Distributie Autoriteit (NDA) en Nationale Tempest Autoriteit (NTA).


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: '3.47'
    text: |-
      1 De Eenheid Regie, de Eenheid Trendanalyse & Fenomeenonderzoek en de Eenheid Operationele Expertise &
      Ondersteuning staan onder leiding van de directeur Operationele ondersteuning.

      2 De Eenheid Regie heeft de volgende taken:

      a. het sturen op resultaat, samenhang en samenwerking in het inlichtingenproces, met als doel het effectief en
      efficiënt laten verlopen van dat proces;

      b. de centrale intake van ongerichte informatie voor het inlichtingenproces;

      c. de centrale planning en afhandeling van rapportages van de Algemene Inlichtingen- en Veiligheidsdienst afkomstig
      uit het inlichtingenproces.

      3 De Eenheid Trendanalyse & Fenomeenonderzoek heeft tot taak om fenomenen die vallen binnen de operationele
      taakvelden van de dienst, maar die de taakgebieden van afzonderlijke eenheden of teams overstijgen, te signaleren,
      te verklaren en relevante ontwikkelingen en trends tijdig te onderkennen.

      4 De Eenheid Operationele Expertise & Ondersteuning heeft de volgende taken:

      a. het toegankelijk maken en ontsluiten van (digitale) gegevensverzamelingen;

      b. het procesmatig aansturen en het relatiebeheer betreffende instanties als genoemd in
      [artikel 60 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1];

      c. het leveren van bijzondere operationele informatie en diensten;

      d. het verzorgen van de relaties met buitenlandse inlichtingen- en veiligheidsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel60
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '60'
  - number: '3.48'
    text: |-
      1 De Eenheid Informatie Management staan onder leiding van de directeur Informatie Management.

      2 De Eenheid Informatie Management heeft de volgende taken:

      a. het bepalen van de strategie en de inrichting van de informatiestromen en -verwerkingsfuncties;

      b. het zorg dragen voor de continuïteit en de betrouwbaarheid van de informatiesystemen;

      c. de ontwikkeling van informatiesystemen en innovatie van de informatiehuishouding.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.48
  - number: '3.51'
    text: |-
      1 Het Bureau Algemene Bestuursdienst staat onder leiding van een directeur-generaal.

      2 Het bureau bestaat uit de volgende organisatieonderdelen:

      a. de eenheid Management Development (MD);

      b. de eenheid Innovatie, Ontwikkeling en Opleiding (IO&O);

      c. de eenheid Strategie, Informatiemanagement en Managementadvies (SIM);

      d. de eenheid ABD Interim.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.51
  - number: '3.52'
    text: |-
      1 De eenheid Management Development staat onder leiding van een directeur.

      2 De eenheid heeft de volgende taken:

      a. het ontwikkelen, vormgeven en uitbouwen van beleid en instrumentarium voor Management Development van de leden
      van de Algemene Bestuursdienst in het algemeen en voor de ABD-schouw in het bijzonder;

      b. het vormgeven, ontwikkelen en ondersteunen van selectie voor vacatures bij de Algemene Bestuursdienst;

      c. het voeren van regie ten aanzien van de uitvoering van Management Development beleid voor de leden van de
      Algemene Bestuursdienst naar de onderdelen van de rijksoverheid;

      d. het vervullen van het werkgeverschap voor de Topmanagementgroep.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.52
  - number: '3.53'
    text: |-
      1 De eenheid Innovatie, Ontwikkeling en Opleiding staat onder leiding van een directeur.

      2 De eenheid heeft de volgende taken:

      a. het ontwikkelen, vormgeven en (doen) uitvoeren van primaire diensten met een bijzonder karakter;

      b. het realiseren van samenwerkingsverbanden tussen topmanagers van de rijksdienst;

      c. het geven van sturing aan de opbouw en het onderhoud van een internationaal management development netwerk;

      d. het vormgeven, ontwikkelen en uitvoeren van een managementpool;

      e. het zorgdragen voor de ontwikkeling, vormgeving en uitvoering van een loopbaanprogramma waaronder begrepen
      Intercollegiale consultatie en coaching;

      f. het ontwikkelen, vormgeven en uitvoeren van het kandidatenprogramma.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.53
  - number: '3.54'
    text: |-
      1 De eenheid Strategie, Informatiemanagement en Managementadvies staat onder leiding van een hoofd.

      2 De eenheid heeft de volgende taken:

      a. het adviseren over de strategische ontwikkeling van de Algemene Bestuursdienst en het management development
      beleid in het concern Rijk;

      b. het adviseren over ontwikkelingen met betrekking tot kennismanagement en in- en externe communicatie en
      informatievoorziening;

      c. het ondersteunen van de directeur-generaal bij de uitvoering van de beleids- en beheerstaken;

      d. het verzorgen van de secretariële ondersteuning van de directeur-generaal en de plaatsvervangend directeur-
      generaal.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.54
  - number: '3.55'
    text: |-
      1 De eenheid ABD-Interim staat onder leiding van een hoofd.

      2 De eenheid ABD-Interim heeft de volgende taken:

      a) de investering in de verdere kwaliteitsontwikkeling van de Rijksmanager te bevorderen;

      b) het behouden van kennis voor de Rijksdienst door het aanbieden van uitdagende Interim posities;

      c) de door het Kabinet gewenste kostenbesparing als gevolg van de terugdringing externe inhuur te bereiken.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.55
  - number: '3.56'
    text: |-
      1 De inspectie Openbare Orde en Veiligheid staat onder leiding van een hoofd.

      2 De inspectie heeft de taken, bedoeld in [artikel 53a van de Politiewet 1993][ref1] en
      [artikel 19 van de Brandweerwet 1985][ref2], [artikel 32 van de Wet op de LSOP en het politieonderwijs][ref3] en
      andere bij wet opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0014623#Artikel32
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.56
