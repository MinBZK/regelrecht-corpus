      - id: ref2
        bwb_id: BWBR0005252
  - number: '3.7'
    text: |-
      1 De directie Communicatie en Informatie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ervoor zorgdragen dat medewerkers van het Ministerie een gebruikersvriendelijke toegang hebben tot de
      informatie die zij nodig hebben voor hun werk;

      b. het ervoor zorgdragen dat medewerkers van het Ministerie de informatie die zij nodig hebben voor hun werk
      optimaal kunnen beheren;

      c. het ondersteunen van medewerkers het Ministerie bij het inzetten van communicatie in hun beleids- en
      ondersteunende processen;

      d. het zijn van eerstverantwoordelijke voor de corporate communicatiestrategie;

      e. het uitvoeren van een regierol op het gebied van beleidscommunicatie;

      f. het onderhouden van de contacten met de pers en het verzorgen van de woordvoering voor en presentatie van de
      bewindslieden.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.7
  - number: '3.8'
    text: |-
      1 De directie Personeel en Organisatie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het ontwikkelen, implementeren en evalueren van het human resource management-, arbeidsomstandigheden- en
      arbeidsvoorwaardenbeleid;

      b. het doen van onderzoek en het monitoren van het gevoerde beleid en beheer;

      c. het adviseren en ondersteunen op het terrein van human resource management, organisatie, arbeidsomstandigheden,
      juridische personeelsaangelegenheden en medezeggenschap;

      d. het afstemmen van vraag en aanbod van personeel;

      e. het voeren van de personeels- en salarisadministratie;

      f. het beheren van personeelssystemen;

      g. het uitoefenen van taken als bedoeld in [artikel 2 van het Beheersbesluit KABGNA/KABGA 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009743#Artikel2
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0009743
        artikel: '2'
  - number: '3.9'
    text: |-
      1 De directie Bedrijfsvoering staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het voeren van regie op de facilitaire en informatie- en communicatietechnologiedienstverlening door onder meer
      het uitvoeren van contract- en leveranciersmanagement alsmede account- en servicelevelmanagement;

      b. het ontwikkelen en/of aanpassen van (nieuwe) diensten met behulp van innovaties in het werkveld;

      c. het geven van specialistisch advies over niet gangbare dienstverlening;

      d. het beheren van de informatie- en communicatietechnologie en het geven van service op de voorzieningen voor
      informatie- en communicatietechnologie binnen het departement.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.9
  - number: '3.10'
    text: |-
      1 De Projectdirectie Nieuwbouw Justitie & BZK staat onder leiding van een directeur.

      2 De projectdirectie heeft de volgende taken:

      a. het bevorderen van het tot stand komen van nieuwe huisvesting en de bijbehorende voorzieningen voor het
      kerndepartement;

      b. het voorbereiden van de verhuizing;

      c. het voeren van overleg met de ontwerpende en uitvoerende partijen waaronder het verzorgen van
      interdepartementale afstemming en afstemming met de betrokken gemeente;

      d. de zorg voor een adequate informatievoorziening over het project.
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.10
  - number: '3.11'
    text: |-
      1 De Auditdienst staat onder leiding van een directeur.

      2 De Auditdienst heeft de taken, bedoeld in:

      a. [artikel 66 van de Comptabiliteitswet 2001][ref1];

      b. het [Besluit taak DAD][ref2];

      c. [artikel 3, achtste lid, van het Beheersbesluit KABGNA/KABGA 1998][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0007535
      [ref3]: https://wetten.overheid.nl/BWBR0009743#Artikel3
