  - number: '3.6'
    text: |-
      1 De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het in samenwerking met verantwoordelijke beleidsonderdelen voorbereiden en beheren van alle wet- en regelgeving
      op het terrein van Binnenlandse Zaken en Koninkrijksrelaties met uitzondering van de wet- en regelgeving ten
      behoeve van de AIVD en de ministeriële uitvoeringsregelingen van BPR;

      b. het behandelen van constitutionele vraagstukken en het voorbereiden van en adviseren over het constitutionele
      beleid;

      c. het toetsen van regelgeving en verdragen alsmede overige beleidsvoornemens van andere Ministeries aan het
      Statuut, de [Grondwet][ref1] en aan verdragsbepalingen met constitutionele inslag;

      d. het namens de Minister bijdragen aan de ontwikkeling van het wetgevingskwaliteitsbeleid;

      e. het geven van juridisch advies over civielrechtelijke kwesties, de [Wet openbaarheid van bestuur][ref2],
      bestuursrecht en andere juridische aangelegenheden;

      f. het behandelen van bijzondere opdrachten van de departementsleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0025266/2010-03-11#Artikel3.6
    references:
