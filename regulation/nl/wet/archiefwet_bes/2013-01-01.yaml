    text: |-
      1 De op grond van artikel 7 van de Archieflandsverordening 2007 vastgestelde lijsten van voor vernietiging in
      aanmerking komende archiefbescheiden die onmiddellijk voorafgaand aan het tijdstip van transitie, bedoeld in
      [artikel 1, onder a, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] van toepassing
