        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028369
        artikel: '20'
        hoofdstuk: II
  - number: '22'
    text: |-
      1 De beheerder van de archiefbewaarplaats stelt de daar berustende archiefbescheiden aan de verzoeker ter
      raadpleging of gebruik beschikbaar met inachtneming van de aan de openbaarheid gestelde beperkingen.

      2 De beheerder is bevoegd een verzoek tot raadpleging of gebruik van archiefbescheiden af te wijzen, indien naar
      zijn oordeel de toestand van de archiefbescheiden zich daartegen verzet of deze aan de verzoeker niet veilig kunnen
      worden toevertrouwd.

      3 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek tot raadpleging of gebruik vindt schriftelijk
      plaats. In geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom
      vraagt. De verzoeker wordt op deze mogelijkheid gewezen.

      Indien de aard of de mate van raadpleging of gebruik van de archiefbescheiden een ernstige bedreiging vormt voor
      hun toestand, is de beheerder bevoegd te bepalen dat in de plaats van die archiefbescheiden reproducties, niet
      zijnde archiefbescheiden als bedoeld in [artikel 1, onderdeel c, sub 4][ref1], ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel1
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028369
        artikel: '1'
        hoofdstuk: I
  - number: '23'
    text: |-
      De beheerder gaat slechts over tot vernietiging van in de archiefbewaarplaats berustende archiefbescheiden na
      hiertoe te zijn gemachtigd van degene, op wiens last deze archiefbescheiden zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel23
  - number: '24'
    text: |-
      De zorgdrager ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden gaat slechts over
      tot vervreemding van in de archiefbewaarplaats berustende archiefbescheiden indien de vervreemding strekt ter
      uitvoering van een in enige wet neergelegd voorschrift of na hiertoe te zijn gemachtigd door degene, op wiens last
      deze archiefbescheiden zijn overgebracht.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel24
  - number: '25'
    text: |-
      1 De beheerder van de archiefbewaarplaats leent archiefbescheiden voor een bepaalde tijd uit aan het
      overheidsorgaan, waaronder de bescheiden, indien zij niet naar de archiefbewaarplaats waren overgebracht, zouden
      berusten tenzij naar zijn oordeel de toestand van de archiefbescheiden zich daartegen verzet.

      2 De beheerder van de archiefbewaarplaats is, met inachtneming van de aan de openbaarheid gestelde beperkingen,
      bevoegd archiefbescheiden voor een bepaalde tijd uit te lenen aan een instelling, mits een deskundig beheer en een
      veilige bewaring zijn gewaarborgd. Aan een zodanige uitlening kunnen voorwaarden worden verbonden.

      3 De beheerder is bevoegd een verzoek tot uitlening als bedoeld in het tweede lid af te wijzen, indien naar zijn
      oordeel de toestand van de archiefbescheiden zich daartegen verzet of deze aan de verzoeker niet veilig kunnen
      worden toevertrouwd.

      4 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek tot uitlening als bedoeld in het tweede lid
      vindt schriftelijk plaats. In geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de
      verzoeker daarom vraagt. De verzoeker wordt op deze mogelijkheid gewezen.

      5 Indien de aard of de mate van raadpleging of gebruik van de archiefbescheiden bij de in het tweede lid bedoelde
      uitlening een ernstige bedreiging vormt voor hun toestand, is de beheerder bevoegd te bepalen dat in de plaats van
      die archiefbescheiden reproducties worden uitgeleend.

      6 De aan uitlening verbonden kosten kunnen de verzoeker in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel25
  - number: '26'
    text: |-
      De beheerder van de archiefbewaarplaats is bevoegd afschriften af te geven van een authentieke akte die volgens
      deze wet door hem bewaard moet worden.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel26
  - number: '27'
    text: |-
      1 De bestuurscolleges van de openbare lichamen Bonaire, Sint Eustatius en Saba dragen zorg voor de
      archiefbescheiden van de organen van die openbare lichamen, overeenkomstig een door de eilandsraad vast te stellen
      eilandsverordening.

      2 De kosten, verbonden aan de uitoefening van de zorg, bedoeld in het eerste lid, komen ten laste van het openbaar
      lichaam.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel27
  - number: '28'
    text: |-
      Voor de bewaring van de op grond van [artikel 17, eerste lid][ref1], en [artikel 18, eerste lid][ref2], over
      te brengen archiefbescheiden van de organen van de openbare lichamen Bonaire, Sint Eustatius en Saba wijst het
      bestuurscollege een eilandarchiefbewaarplaats aan.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028369#Artikel18
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028369
        artikel: '17'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028369
        artikel: '18'
        hoofdstuk: II
  - number: 28a
    text: |-
      1 De eilandarchiefbewaarplaats wordt beheerd door een eilandarchivaris, die in het bezit dient te zijn van een
      diploma archivistiek of, zo geen zodanige archivaris mocht zijn benoemd, door de eilandsecretaris.

      2 Ten aanzien van het beheer van de archiefbescheiden van de organen van de openbare lichamen Bonaire, Sint
      Eustatius en Saba, voor zover deze archiefbescheiden niet zijn overgebracht naar een archiefbewaarplaats, is, onder
      de bevelen van het bestuurscollege, met het toezicht op de naleving van het bepaalde bij of krachtens deze wet
      belast de eilandarchivaris. Met betrekking tot dit toezicht stelt de eilandraad een eilandsverordening vast.

      3 De eilandarchivaris wordt door het bestuurscollege benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel28a
  - number: 28b
    text: |-
      1 Een regeling tussen de openbare lichamen Bonaire, Sint Eustatius en Saba als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1] houdt tevens een voorziening in omtrent de zorg voor de archiefbescheiden
      van bij die regeling ingestelde openbare lichamen of gemeenschappelijke organen.

      2 Deze voorziening wordt getroffen zoveel mogelijk overeenkomstig de bepalingen van deze wet.

      3 Zolang bij een gemeenschappelijke regeling niet is voldaan aan de verplichting tot het treffen van een
      voorziening als bedoeld in het eerste lid, zijn van overeenkomstige toepassing de bepalingen die ter zake gelden
      voor het openbaar lichaam waar het ingestelde lichaam of orgaan is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '29'
    text: |-
      1 Onze Minister is bevoegd overheidsorganen erop te wijzen dat zij dienen te voldoen aan het bepaalde bij of
      krachtens deze wet.

      2 Ingeval een overheidsorgaan een aanwijzing als bedoeld in het eerste lid niet opvolgt, kan Onze Minister bepalen,
      dat de archiefbescheiden van dat orgaan of een door hem aan te wijzen deel daarvan naar de archiefbewaarplaats,
      gehoord de beheerder daarvan, wordt vervoerd om daar tot nadere beschikking te worden bewaard. De kosten van
      vervoer, van het in goede, geordende en toegankelijke staat brengen en van bewaring komen ten laste van het
      betrokken openbaar lichaam.

      3 Onze Minister maakt van zijn bevoegdheid, genoemd in het tweede lid, geen gebruik dan na overleg met het
      betrokken overheidsorgaan.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel29
  - number: 29a
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde ten aanzien van de zorg voor en het
      beheer van archiefbescheiden zijn belast de bij besluit van Onze Minister aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Een toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een ruimte waarin de archiefbescheiden
      worden bewaard, te betreden. Zo nodig verschaft hij zich toegang met behulp van de sterke arm. Hij is bevoegd zich
      te doen vergezellen van personen die daartoe door hem zijn aangewezen.

      4 Een toezichthouder is bevoegd inzage te vorderen van zakelijke gegevens en bescheiden. Hij is bevoegd van de
      gegevens kopieën te maken. Indien het maken van kopieën niet ter plaatse kan geschieden, is hij bevoegd de gegevens
      en bescheiden voor dat doel voor korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.

      5 Indien een toezichthouder met toepassing van het derde lid een ruimte betreedt waarin de archiefbescheiden
      worden bewaard, dan wel met toepassing van het vierde lid inzage vordert van die archiefbescheiden, neemt hij de
      voorschriften ten aanzien van de beveiliging van geheimen in acht.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel29a
  - number: '30'
    text: |-
      1 Degene die niet aan de verplichting voldoet hem opgelegd bij [artikel 11, eerste lid][ref1], wordt gestraft met
      een geldboete van de tweede categorie.

      2 Het feit is een overtreding.


