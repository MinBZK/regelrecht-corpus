  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. *overheidsorgaan:*

      1°. een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld; of

      2°. een ander persoon of college met enig openbaar gezag bekleed;

      c. *archiefbescheiden:*

      1°. bescheiden, ongeacht hun vorm, door een overheidsorgaan ontvangen of opgemaakt en naar hun aard bestemd
      daaronder te berusten;

      2°. bescheiden, ongeacht hun vorm, met overeenkomstige bestemming, ontvangen of opgemaakt door instellingen of
      personen, wier rechten of functies op enig overheidsorgaan zijn overgegaan;

      3°. bescheiden, ongeacht hun vorm, welke ingevolge overeenkomsten met of beschikkingen van instellingen of personen
      dan wel uit andere hoofde in de archiefbewaarplaats zijn opgenomen om daar te berusten;

      4°. reproducties, ongeacht hun vorm, welke bij of krachtens deze wet in de plaats zijn gesteld van de
      archiefbescheiden, bedoeld in onderdeel c, sub 1, 2 of 3 of welke op grond van het bepaalde in [artikel 8][ref1]
      zijn vervaardigd;

      d. *zorgdrager:* degene die bij of krachtens deze wet belast is met de zorg voor de archiefbescheiden;

      e. *archiefruimte:* een ruimte, bestemd of aangewezen voor de bewaring van archiefbescheiden in afwachting van hun
      overbrenging ingevolge [artikel 17][ref2];

      f. *archiefbewaarplaats:* een krachtens deze wet voor blijvende bewaring van archiefbescheiden aangewezen
      bewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028369#Artikel17
