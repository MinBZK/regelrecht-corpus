  - number: '2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden onder overheidsorganen tevens begrepen
      overheidsorganen, welke voor of na de inwerkingtreding van deze wet zijn of zullen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Een overheidsorgaan brengt en bewaart de onder hem berustende archiefbescheiden in goede, geordende en
      toegankelijke staat, en draagt alsmede zorg voor de selectie en vernietiging van de daarvoor in aanmerking komende
      archiefbescheiden, volgens bij of krachtens algemene maatregel van bestuur, te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel3
  - number: '4'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel4
  - number: '5'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een regeling waarbij een overheidsorgaan wordt opgeheven, samengevoegd of gesplitst, dan wel waarbij een of meer
      taken van een overheidsorgaan worden overgedragen aan een ander overheidsorgaan, houdt een voorziening in omtrent
      hun archiefbescheiden.

      2 Een regeling, waarbij een tijdelijk overheidsorgaan, wordt ingesteld, houdt een voorziening in omtrent de
      bewaring van de archiefbescheiden na zijn opheffing.

      3 Een regeling, waarbij taken van een overheidsorgaan geheel of gedeeltelijk worden overgedragen aan een
      rechtspersoon houdt een voorziening in omtrent de terbeschikkingstelling aan die rechtspersoon van de op die
      taken betrekking hebbende archiefbescheiden, voor zover deze niet zijn overgebracht naar een archiefbewaarplaats,
      voor een tijdvak van ten hoogste twintig jaar. Deze voorziening houdt tenminste in een nadere bepaling van het
      in eerste volzin bedoelde tijdvak, alsmede een bepaling omtrent het toezicht op het beheer van de desbetreffende
      archiefbescheiden, overeenkomstig het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel6
  - number: '7'
    text: |-
      1 De zorgdrager ontwerpt selectielijsten waarin tenminste wordt aangegeven welke archiefbescheiden voor
      vernietiging in aanmerking komen.

      2 De lijsten worden door Onze Minister vastgesteld.

      3 Onze Minister-President kan regels stellen op grond waarvan in geval van oorlog, oorlogsgevaar of andere
      buitengewone omstandigheden kan worden afgeweken van hetgeen in deze wet bepaald is met betrekking tot de
      vernietiging van archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 De zorgdrager is bevoegd archiefbescheiden, voor zover niet overgedragen naar een archiefbewaarplaats, te
      vervangen door reproducties, teneinde de aldus vervangen bescheiden te vernietigen. Voor de vervanging van
      archiefbescheiden die niet als te vernietigen worden aangemerkt in de lijsten, bedoeld in [artikel 7][ref1], is een
      machtiging vereist van Onze Minister. Deze machtiging houdt tevens een machtiging tot vernietiging in.

      2 De substitutie, bedoeld in het eerste lid, geschiedt volgens bij of krachtens algemene maatregel van bestuur, te
      stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel7
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028369
        artikel: '7'
        hoofdstuk: II
  - number: '9'
    text: |-
      1 De zorgdrager is bevoegd tot vervreemding van niet in de archiefbewaarplaats berustende archiefbescheiden na
      hiertoe te zijn gemachtigd door Onze Minister.

      2 Voor de vervreemding van archiefbescheiden als bedoeld in het eerste lid is geen machtiging vereist indien de
      vervreemding geschiedt ter uitvoering van een in enige wet neergelegd voorschrift.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel9
  - number: '10'
    text: |-
      Indien archiefbescheiden ten onrechte berusten onder een ander overheidsorgaan dan dat waaronder zij behoren te
      berusten, ziet de zorgdrager erop toe, dat die bescheiden te bestemder plaatse geraken.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel10
  - number: '11'
    text: |-
      1 Ieder die archiefbescheiden onder zich heeft, staat deze binnen vier weken, nadat hij een daartoe strekkende
      kennisgeving heeft ontvangen, aan het overheidsorgaan, waaronder zij volgens de bepalingen van deze wet behoren te
      berusten, voor rekening en risico van dat overheidsorgaan af, teneinde het in de gelegenheid te stellen hiervan een
      reproductie te vervaardigen.

      2 Het overheidsorgaan geeft de archiefbescheiden binnen vier weken na ontvangst terug aan degene, die deze heeft
      afgestaan, ook al kan de overheid op die bescheiden uit andere hoofde rechten doen gelden.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel11
  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de duurzaamheid van
      door overheidsorganen op te maken archiefbescheiden, omtrent de bouw, verbouwing, inrichting en verandering van
      inrichting van archiefruimten en archiefbewaarplaatsen, alsmede omtrent het gebruik van gebouwen of gedeelten van
      gebouwen als archiefruimte of archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel12
  - number: '13'
    text: |-
      Omtrent de opleidingseisen voor het archiefbeheer worden regels vastgesteld bij of krachtens algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel13
  - number: '14'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel14
  - number: '15'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel15
  - number: '16'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel16
  - number: '17'
    text: |-
      1 De zorgdrager brengt de archiefbescheiden die niet voor vernietiging in aanmerking komen en ouder zijn dan
      twintig jaar over naar een archiefbewaarplaats.

      2 Omtrent de overdracht van archiefbescheiden worden bij of krachtens algemene maatregel van bestuur, regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel17
  - number: '18'
    text: |-
      1 De zorgdrager kan archiefbescheiden die niet voor vernietiging in aanmerking komen en jonger zijn dan twintig
      jaar naar een archiefbewaarplaats overbrengen, wanneer naar het oordeel van de beheerder van de archiefbewaarplaats
      voldoende aanleiding bestaat hiervoor ruimte beschikbaar te stellen.

      2 Indien archiefbescheiden ouder dan twintig jaar door het overheidsorgaan nog veelvuldig worden gebruikt
      of geraadpleegd kan op verzoek van de zorgdrager machtiging tot opschorting van de overbrenging van die
      archiefbescheiden worden verleend door Onze Minister.

      3 De machtiging, bedoeld in het tweede lid, wordt verleend voor een periode van ten hoogste tien jaar, na afloop
      waarvan verlenging kan worden verkregen.

      4 Aan de machtiging kunnen voorwaarden worden verbonden.

      5 De machtiging kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel18
  - number: '19'
    text: |-
      De archiefbescheiden die in een archiefbewaarplaats berusten zijn, behoudens het bepaalde in de
      [artikelen 20][ref1], [21][ref2] en [22][ref3], openbaar. Ieder is, behoudens de beperkingen die voortvloeien
      uit het in die artikelen bepaalde, bevoegd die archiefbescheiden kosteloos te raadplegen en daarvan of daaruit
      afbeeldingen, afschriften, uittreksels en bewerkingen te maken of op zijn kosten te doen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028369#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028369#Artikel22
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel19
    references:
