        artikel: '1'
        hoofdstuk: I
  - number: '21'
    text: |-
      1 De openbaarheid van de in [artikel 1, onderdeel c, sub 3][ref1], bedoelde archiefbescheiden kan worden beperkt
      bij de desbetreffende overeenkomsten en beschikkingen.

      2 Indien deze archiefbescheiden uit andere hoofde in een archiefbewaarplaats zijn opgenomen om daar te
      berusten, kan de zorgdrager beperkingen aan de openbaarheid stellen. Het bepaalde in [artikel 20][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028369#Artikel20
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel21
