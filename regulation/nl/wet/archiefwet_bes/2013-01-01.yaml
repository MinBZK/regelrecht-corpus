        artikel: '22'
        hoofdstuk: II
  - number: '20'
    text: |-
      1 Bij de overbrenging van de in [artikel 1, onderdeel c, sub 1 en 2][ref1], bedoelde archiefbescheiden kan de
      zorgdrager, na advies van de beheerder van de archiefbewaarplaats, slechts beperkingen aan de openbaarheid stellen
      voor een bepaalde termijn en met het oog op:

      a. de eerbiediging van de persoonlijke levenssfeer;

      b. het belang van de Staat of zijn bondgenoten;

      c. het anderszins voorkomen van onevenredige bevoordeling of benadeling van betrokken natuurlijke of rechtspersonen
      dan wel van derden.

      2 De zorgdrager kan, ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden, na de overbrenging,
      bedoeld in het eerste lid, niet alsnog beperkingen als bedoeld in het eerste lid stellen, tenzij zich na het
      tijdstip van overbrenging omstandigheden hebben voorgedaan die, waren zij op dat tijdstip bekend geweest, tot het
      stellen van beperkingen aan de openbaarheid ingevolge het eerste lid zouden hebben geleid.

      3 De zorgdrager kan, ten aanzien van de in de archiefbewaarplaats berustende archiefbescheiden, gehoord degene op
      wiens last de archiefbescheiden zijn overgebracht, de ingevolge het eerste of het tweede lid aan de openbaarheid
      gestelde beperkingen opheffen, dan wel ten aanzien van een verzoeker buiten toepassing laten, indien het belang van
      de gestelde beperkingen niet opweegt tegen diens belang tot raadpleging of gebruik van de archiefbescheiden.

      4 Ingevolge het eerste of het tweede lid aan de openbaarheid gestelde beperkingen hebben geen betrekking op
      archiefbescheiden die ouder zijn dan vijfenzeventig jaar, tenzij door Onze Minister anders wordt beslist.

      5 Het derde lid is niet van toepassing op archiefbescheiden aan de openbaarheid waarvan beperkingen zijn gesteld
      met het oog op het belang van de Staat of zijn bondgenoten.

      6 In geval van archiefbescheiden die het belang van de Staat of zijn bondgenoten betreffen vindt het vierde lid
      slechts toepassing voor zover de ministerraad niet anders beslist.

      7 Met betrekking tot de archiefbescheiden, bedoeld in het vijfde lid, zijn van toepassing de regelingen inzake
      het recht op informatie die zouden gelden indien de archiefbescheiden niet naar een archiefbewaarplaats waren
      overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028369#Artikel1
    url: https://wetten.overheid.nl/BWBR0028369/2013-01-01#Artikel20
    references:
