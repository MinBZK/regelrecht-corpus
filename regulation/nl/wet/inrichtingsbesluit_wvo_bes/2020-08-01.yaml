  - number: 21.5.b
    text: |-
      Papiaments, Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en
      literatuur, Italiaanse taal en literatuur, Arabische taal en literatuur, of Turkse taal en literatuur ter keuze van
      de leerling voor zover het bevoegd gezag deze vakken aanbiedt: 400,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.c
    text: |-
      een van de volgende culturele profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag deze
      vakken aanbiedt:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.c.1°
    text: |-
      kunst (beeldende vormgeving), kunst (muziek), kunst (drama), kunst (dans), muziek, tekenen, handvaardigheid of
      textiele vormgeving: 320;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.c.2°
    text: 'filosofie: 320;'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.c.3°
    text: |-
      Papiaments, Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en
      literatuur, Italiaanse taal en literatuur, Arabische taal en literatuur, of Turkse taal en literatuur: 400,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.d
    text: |-
      een van de volgende maatschappelijke profielkeuzevakken ter keuze van de leerling, voor zover het bevoegd gezag
      deze vakken aanbiedt:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.d.1°
    text: 'aardrijkskunde: 320;'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.d.2°
    text: 'maatschappijwetenschappen: 320;'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.5.d.3°
    text: 'economie: 400.'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: '21.6'
    text: 'Het vrije deel van elk profiel in het havo kan omvatten:'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.a
    text: 'de vakken, genoemd in het eerste tot en met het vijfde lid, voor zover nog niet gekozen, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.a.1°
    text: |-
      van de vakken wiskunde A en wiskunde B er slechts één deel kan uitmaken van het profiel, dat wiskunde D uitsluitend
      kan worden gekozen indien ook wiskunde B deel uitmaakt van het profiel, en
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.a.2°
    text: |-
      kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek, en
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.a.3°
    text: van de vakken tekenen, handvaardigheid en textiele vormgeving er slechts één deel kan uitmaken van het profiel,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b
    text: |-
      de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, met dien verstande dat
      deze vakken slechts deel kunnen uitmaken van het vrije deel voor zover de desbetreffende taal niet reeds eerder is
      gevolgd of al deel uitmaakt van het profiel:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.1°
    text: 'Papiaments (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.2°
    text: 'Spaanse taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.3°
    text: 'Duitse taal en literatuur (elementair): 480,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.4°
    text: 'Russische taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.5°
    text: 'Italiaanse taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.6°
    text: 'Arabische taal en literatuur (elementair): 320, en'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.b.7°
    text: 'Turkse taal en literatuur (elementair): 320,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.c
    text: 'de volgende vakken, met de daarbij vermelde normatieve studielast in uren:'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.c.1°
    text: 'kunst (algemeen): 120,'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.c.2°
    text: 'algemene natuurwetenschappen: 120, en'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.c.3°
    text: 'bewegen, sport en maatschappij: 320, en'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: 21.6.d
    text: door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: '21.7'
    text: |-
      Het zesde lid, aanhef en onderdeel a, onder 1°, vindt toepassing onverminderd de mogelijkheid voor de leerling
      om een in dat onderdeel bedoeld wiskundevak dat het bevoegd gezag aanbiedt, te kiezen als extra vak, met dien
      verstande dat alleen is toegestaan de combinatie van wiskunde A en wiskunde B.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel21
  - number: '22'
    text: |-
      Indien het bevoegd gezag bij de vaststelling van vakken en andere programma-onderdelen van het vrije deel andere
      instellingen of deskundige personen van buiten de school betrekt, kan het onderwijs in die vakken en andere
      programma-onderdelen van het vrije deel, onverminderd de verantwoordelijkheid van het bevoegd gezag voor het
      onderwijs aan de school, mede worden verzorgd door die andere instellingen of deskundige personen. Daarbij stelt
      het bevoegd gezag als voorwaarde dat die instellingen of deskundige personen voldoen aan de met betrekking tot hun
      geldende wettelijke voorschriften en voorzover die voorschriften ontbreken, aan de binnen de beroepsgroep algemeen
      erkende normen. [Artikel 80, eerste lid, van de wet][ref1] is ten aanzien van degenen die dit onderwijs verzorgen
      van overeenkomstige toepassing, met dien verstande dat als getuigschrift als bedoeld in onderdeel b. 1° van dat lid
      geldt een kwalificatie die, gelet op de eerste en tweede volzin, passend is. Het bevoegd gezag stelt de inspectie
      in kennis van de kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel80
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '80'
  - number: '23.1'
    text: |-
      Het bevoegd gezag van een school voor vwo of havo kan een leerling ontheffing verlenen van het volgen van het
      onderwijs in het vak lichamelijke opvoeding indien de leerling vanwege diens lichamelijke gesteldheid niet in staat
      is dit onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende ontheffing en vermeldt
      daarbij de gronden waarop deze ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
  - number: '23.2'
    text: |-
      De leerling van een school voor vwo die in het bezit is van het diploma havo is vrijgesteld van het volgen van
      onderwijs in het vak maatschappijleer. Indien het betreft het atheneum is deze leerling tevens vrijgesteld van het
      volgen van onderwijs in het vak culturele en kunstzinnige vorming.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
  - number: '23.3'
    text: |-
      De leerling van een school voor vwo die in het bezit is van het diploma havo of het diploma vmbo en die in
      plaats van de vakken, genoemd in [artikel 22][ref1], respectievelijk in [artikel 16][ref2], [artikel 18][ref3]
      of [artikel 29 van de wet][ref4], of als extra vak examen heeft afgelegd in één of meer vakken van
      [artikel 20][ref5], is vrijgesteld van het volgen van onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0030284
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.4'
    text: |-
      Het bevoegd gezag van een atheneum kan een leerling ontheffing verlenen van het volgen van onderwijs in de taal
      genoemd in [artikel 20, eerste lid, onder c][ref1], in de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: 23.4.a
    text: |-
      de leerling heeft een stoornis die specifiek betrekking heeft op taal of een zintuiglijke stoornis die effect heeft
      op taal;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
  - number: 23.4.b
    text: de leerling heeft een andere moedertaal dan de Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
  - number: 23.4.c
    text: |-
      de leerling volgt onderwijs in het profiel natuur en techniek of het profiel natuur en gezondheid en het onderwijs
      in de taal verhindert naar verwachting een succesvolle afronding van de opleiding.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
  - number: '23.5'
    text: |-
      Bij toepassing van het vierde lid, wordt de taal vervangen door een van de vakken of programma-onderdelen,
      genoemd in [artikel 20, derde tot en met zesde lid, of in het zevende lid, onder c of d][ref1], met een normatieve
      studielast van tenminste 440 uren, ter keuze van de leerling, voor zover het bevoegd gezag deze als zodanig
      aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.6'
    text: |-
      De leerling van een school voor havo die in het bezit is van het diploma vmbo en die in plaats van de vakken,
      genoemd in in [artikel 16][ref1], [artikel 18][ref2] of [artikel 29 van de wet][ref3], of als extra vak examen
      heeft afgelegd in één of meer vakken van [artikel 21][ref4] of [20][ref5], is vrijgesteld van het volgen van
      onderwijs in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0029589#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0029589
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.1'
    text: |-
      In het derde leerjaar van een school voor mavo volgt de leerling in de theoretische leerweg onderwijs in ten minste
      zeven vakken waarin eindexamen kan worden afgelegd, niet behorend tot het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel24
  - number: '24.2'
    text: |-
      Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar,
      is in afwijking van het eerste lid het aantal vakken, bedoeld in dat lid, zes.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel24
  - number: '25.1'
    text: |-
      De profielvakken, bedoeld in [artikel 18, zesde lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 25.1.a
    text: bouwen, wonen en interieur;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.b
    text: produceren, installeren en energie;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.c
    text: mobiliteit en transport;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.d
    text: media, vormgeving en ICT;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.e
    text: maritiem en techniek;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.f
    text: zorg en welzijn;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.g
    text: economie en ondernemen;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.h
    text: horeca, bakkerij en recreatie;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.i
    text: groen; en
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: 25.1.j
    text: dienstverlening en producten.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
  - number: '25.2'
    text: |-
      Het extra vak bedoeld in [artikel 18, negende lid, onderdeel d, van de wet][ref1], is Papiaments.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: '26.1'
    text: |-
      De profielvakken, bedoeld in [artikel 29, zesde lid, van de wet][ref1], zijn de vakken, genoemd in
      [artikel 25, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel25
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
  - number: '26.2'
    text: |-
      In het derde leerjaar volgt de leerling in de gemengde leerweg ten minste onderwijs in een beroepsgericht programma
      en vijf algemene vakken waarin eindexamen kan worden afgelegd, niet behorend tot het gemeenschappelijk deel. Indien
      de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar, is het
      aantal algemene vakken, bedoeld in de eerste volzin, vier.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel26
  - number: '27.1'
    text: |-
      Bij ministeriële regeling worden beroepsgerichte keuzevakken vastgesteld die deel kunnen uitmaken van het
      beroepsgerichte programma van leerlingen in de basisberoepsgerichte, kaderberoepsgerichte en gemengde leerweg van
      het vmbo.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel27
  - number: '27.2'
    text: |-
      Het bevoegd gezag zorgt ervoor dat de school voldoende beroepsgerichte keuzevakken verzorgt waar leerlingen uit
      kunnen kiezen in het kader van hun beroepsgerichte programma.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel27
  - number: '27.3'
    text: |-
      Bij zijn keuze welke beroepsgerichte keuzevakken door de school worden verzorgd, consulteert het bevoegd gezag een
      of meer instellingen voor middelbaar beroepsonderwijs en een of meer regionale arbeidsmarktpartijen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel27
  - number: '28.1'
    text: |-
      In samenwerking met een of meer instellingen voor middelbaar beroepsonderwijs en een of meer regionale
      arbeidsmarktpartijen kan het bevoegd gezag van een school voor vbo een nieuw beroepsgericht keuzevak ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28
  - number: '28.2'
    text: |-
      Het bevoegd gezag stelt de medezeggenschapsraad van de school vooraf op de hoogte van het voornemen tot
      ontwikkeling van een nieuw beroepsgericht keuzevak.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28
  - number: '28.3'
    text: |-
      Het bevoegd gezag meldt het voornemen tot ontwikkeling van een nieuw beroepsgericht keuzevak zo spoedig mogelijk
      aan Onze Minister door middel van een bij ministeriële regeling vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28
  - number: '28.4'
    text: Onze Minister brengt binnen zes weken na de melding schriftelijk advies uit over het voornemen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28
  - number: '28.5'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften gegeven worden over de procedure voor het melden van het
      voornemen tot ontwikkeling van beroepsgerichte keuzevakken.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28
  - number: 28a.1
    text: |-
      Een aanvraag tot goedkeuring van een nieuw ontwikkeld beroepsgericht keuzevak wordt ingediend bij Onze Minister
      door middel van een bij ministeriële regeling vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.2
    text: |-
      Bij ministeriële regeling worden voorwaarden vastgesteld waaraan nieuwe beroepsgerichte keuzevakken moeten voldoen.
      Daartoe behoren in elk geval voorwaarden met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.2.a
    text: de aard en omvang van het beroepsgerichte keuzevak;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.2.b
    text: |-
      de opbouw van de leerstof, gedifferentieerd naar de verschillende leerwegen waarin het beroepsgerichte keuzevak kan
      worden aangeboden; en
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.2.c
    text: |-
      de mate waarin het nieuwe beroepsgerichte keuzevak zich onderscheidt van reeds bestaande beroepsgerichte
      keuzevakken.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.3
    text: |-
      Onze Minister besluit binnen dertien weken op de aanvraag, bedoeld in het eerste lid en laat zich daarbij adviseren
      door een onafhankelijke adviescommissie.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.4
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften gegeven worden over de procedure voor het verlenen van
      goedkeuring aan nieuw ontwikkelde beroepsgerichte keuzevakken.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
  - number: 28a.5
    text: |-
      Als Onze Minister de aanvraag inwilligt, neemt hij het nieuwe beroepsgerichte keuzevak uiterlijk met ingang van
      1 augustus daaropvolgend op in de regeling, bedoeld in [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel27
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '27'
        hoofdstuk: III
        paragraaf: '3'
  - number: '29.1'
    text: |-
      Het bevoegd gezag van een school voor mavo of vbo kan een leerling, na overleg met de leerling en, indien de
      leerling minderjarig is, met diens ouders, voogden of verzorgers, ontheffing verlenen van het volgen van het
      onderwijs in lichamelijke opvoeding, indien de leerling vanwege diens lichamelijke gesteldheid niet in staat is dit
      onderwijs te volgen. Het bevoegd gezag geeft de inspectie kennis van de verleende ontheffing en vermeldt daarbij de
      gronden waarop deze ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
  - number: '29.2'
    text: |-
      Het bevoegd gezag kan toestaan dat een ontheffing, verleend voor de eerste twee leerjaren van het volgen van een
      tweede moderne vreemde taal, tevens geldt als ontheffing voor die taal voor de periode waarin de leerling onderwijs
      in de kaderberoepsgerichte, theoretische of gemengde leerweg volgt, met dien verstande dat Arabische taal, Turkse
      taal, Duitse taal, Papiaments, maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde in de
      plaats komt van het onderwijs in de taal waarvoor de vrijstelling is verleend. Deze toestemming kan slechts worden
      verleend ten behoeve van leerlingen die:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
  - number: 29.2.a
    text: |-
      op grond van [artikel 18, tweede lid][ref1], beschikken over een ontheffing en deze ontheffing wordt voortgezet,


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel18
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '18'
        hoofdstuk: III
        paragraaf: '3'
  - number: 29.2.b
    text: |-
      in de periode van de eerste twee leerjaren onderwijs in de Arabische taal, de Turkse taal, Duitse taal of
      Papiaments volgden, of
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
  - number: 29.2.c
    text: |-
      onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
  - number: '29.3'
    text: |-
      Dit artikel geldt tevens voor leerlingen die in een hoger leerjaar voor de eerste maal in Nederland tot een school
      zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
  - number: '29.4'
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de theoretische leerweg, die in het bezit is van het
      diploma vmbo in de kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg en die in plaats van de vakken,
      als bedoeld in [artikel 18 van de wet][ref1], of als extra vak examen heeft afgelegd in één of meer vakken van
      [artikel 16 van de wet][ref2] of [artikel 21][ref3] dan wel [20][ref4], is vrijgesteld van het volgen van onderwijs
      in dit vak respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0029589#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0029589
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: '29.5'
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de basisberoepsgerichte leerweg, die in het bezit is
      van het diploma vmbo in een andere leerweg, een diploma vwo of een diploma havo, is van het volgen van onderwijs
      vrijgesteld indien het betreft vakken waarmee overeenkomen een of meer vakken waarin examen is afgelegd, of waarmee
      overeenkomen vakken waarin als extra vak examen is afgelegd.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
  - number: '29.6'
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de kaderberoepsgerichte leerweg, die in het bezit is
      van het diploma vmbo in de basisberoepsgerichte leerweg en die in plaats van de vakken van de basisberoepsgerichte
      leerweg, genoemd in [artikel 18 van de wet][ref1], of als extra vak examen heeft afgelegd in één of meer vakken
      van de kaderberoepsgerichte leerweg, genoemd in artikel 18, is vrijgesteld van het volgen van onderwijs in dit vak
      respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: '29.7'
    text: |-
      De leerling van een school voor vmbo, voor zover het betreft de gemengde leerweg, die in het bezit is van
      het diploma vmbo in een andere leerweg, en die in plaats van de vakken van de gemengde leerweg, bedoeld in
      [artikel 29 van de wet][ref1], of als extra vak examen heeft afgelegd in één of meer vakken, genoemd in
      [artikel 16][ref2] of [artikel 18 van de wet][ref3], [artikel 20][ref4] dan wel [artikel 21][ref5], is
      vrijgesteld van het volgen van onderwijs in dit vak, respectievelijk deze vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0029589#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0029589#Artikel21
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0029589
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '30.1'
    text: |-
      Deze paragraaf is van toepassing op scholen voor mavo voor zover daaraan onderwijs in de gemengde leerweg wordt
      verzorgd, en op scholen voor vbo
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel30
  - number: '30.2'
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op arbeidstraining. Onder arbeidstraining wordt verstaan het
      onderricht in de praktijk van de uitoefening van een vak of beroep aan scholen voor praktijkonderwijs, bedoeld
      in [artikel 31, zesde lid, van de wet][ref1], voor zover dat onderricht plaatsvindt buiten de school voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
  - number: '31.1'
    text: |-
      In het derde en vierde leerjaar kunnen de lessen in profielvakken of beroepsgerichte keuzevakken worden besteed
      aan stage.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel31
  - number: '31.2'
    text: |-
      Voor een school voor praktijkonderwijs bedraagt het in [artikel 31, zesde lid, van de wet][ref1] bedoelde aantal
      uren stage of arbeidstraining gedurende de cursusduur gemiddeld ten hoogste 50% van het aantal uren waarin
      onderwijs wordt verzorgd, met dien verstande dat voor leerlingen voor wie de partiële leerplicht nog niet is
      geëindigd, tot het einde van die leerplicht de stage of arbeidstraining per schoolweek ten hoogste 80% bedraagt van
      het aantal uren waarin in die week onderwijs wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
  - number: '32'
    text: Het doel, de inhoud, de omvang, de opbouw en de organisatie van de stage worden beschreven in een stageplan.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel32
  - number: '33'
    text: Een stage wordt doorlopen op een of meer stageplaatsen, ter beschikking gesteld door een of meer stagegevers.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel33
  - number: '34.1'
    text: |-
      Het bevoegd gezag sluit met de leerling en de stagegever te zamen een schriftelijke stage-overeenkomst waaruit
      blijkt dat de leerling leeractiviteiten ontplooit in het kader van het stageplan.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: '34.2'
    text: 'De stage-overeenkomst bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: 34.2.a
    text: |-
      de leeractiviteiten die de leerling bij de aangewezen stagegever op een of meer bepaalde stageplaatsen moet
      ontplooien;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: 34.2.b
    text: de aanvangsdatum, de einddatum en de tijden van de onder a bedoelde leeractiviteiten;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: 34.2.c
    text: |-
      een regeling voor de begeleiding van de leerling bij de stagegever waarin in elk geval duidelijk wordt gemaakt welk
      aandeel in de begeleiding door de stageleraar respectievelijk door de stagebegeleider, aan te wijzen door of namens
      het bevoegd gezag onderscheidenlijk de stagegever, wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: 34.2.d
    text: de wijze waarop de stagegever bij de beoordeling van de leeractiviteiten van de leerling wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: 34.2.e
    text: |-
      een regeling die de inspectie in staat stelt toezicht te houden op de leeractiviteiten die door de leerling bij de
      stagegever worden ontplooid.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: '34.3'
    text: |-
      De stage-overeenkomst bepaalt voorts wie de verzekering tegen het financiële risico van ongevallen en tegen
      wettelijke aansprakelijkheid van de leerling voor de tijd dat deze zich bevindt bij de stagegever zal sluiten en
      ten laste van wie de te betalen premie zal komen, indien een zodanige verzekeringsovereenkomst zal worden gesloten.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: '34.4'
    text: |-
      In geval van minderjarigheid van de leerling wordt de stage-overeenkomst door diens ouders, voogden of verzorgers
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel34
  - number: '35'
    text: |-
      Met het oog op de stage kan het bevoegd gezag ten behoeve van de leerlingen een schriftelijke
      samenwerkingsovereenkomst met een of meer stagegevers aangaan waarin mede een of meer onderdelen van de stage-
      overeenkomst, bedoeld in [artikel 34, tweede lid][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel34
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '34'
        hoofdstuk: III
        paragraaf: '4'
  - number: '36'
    text: Dit besluit treedt in werking met ingang van 1 augustus 2011 in Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel36
  - number: '37'
    text: 'Dit besluit wordt aangehaald als: Inrichtingsbesluit WVO BES'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel37
