preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van 23 september 2010, nr. WJZ/236456
    (3843), directie Wetgeving en Juridische Zaken, gedaan in overeenstemming met Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit en mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 16, tiende lid, 18, negende en tiende lid, 29, tiende lid, 31, zesde lid, 39, 40, 41, 45, 64,
    twaalfde en dertiende lid, en 65, eerste lid van de Wet voortgezet onderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 oktober 2010, no. W05.10.0466/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 31 januari 2011, nr. WJZ
    259969 (3843), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Economische Zaken,
    Landbouw en Innovatie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *basisberoepsgerichte leerweg:* de basisberoepsgerichte leerweg, genoemd in
      [artikel 18 van de wet][ref1];
        - *beroepsgericht keuzevak:* beroepsgericht keuzevak als bedoeld in [artikel 18, zevende lid, onderdeel a][ref2],
      of [artikel 29, zevende lid, onderdeel b, van de wet][ref3];
        - *beroepsgericht programma:* beroepsgericht programma als bedoeld in [artikel 15, eerste lid, onderdeel c][ref4],
      [16, eerste lid, onderdeel c][ref5], of [17 eerste lid, onderdeel d, van het Eindexamenbesluit VO BES][ref6];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref7];
        - *de vakken behorende tot de beeldende vorming:* tekenen, handvaardigheid, textiele vormgeving, fotografie, film,
      audio-visuele vorming;
        - *gemeenschappelijk deel:* het in [artikel 38, vierde lid, onderdeel a, van de wet][ref8] bedoelde onderdeel van
      het profiel;
        - *gemengde leerweg:* de gemengde leerweg, genoemd in [artikel 29 van de wet][ref9];
        - *havo:* hoger algemeen voortgezet onderwijs;
        - *inspectie:* de inspectie, als bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref10];
        - *instelling voor middelbaar beroepsonderwijs:* instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref11];
        - *kaderberoepsgerichte leerweg:* de kaderberoepsgerichte leerweg, genoemd in [artikel 18 van de wet][ref12];
        - *mavo:* middelbaar algemeen voortgezet onderwijs;
        - *normatieve studielast:* de normatieve studielast, bedoeld in [artikel 38, vijfde lid, van de wet][ref13];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *praktijkonderwijs:* het praktijkonderwijs, bedoeld in [artikel 31 van de wet][ref14];
        - *profiel:* het profiel, bedoeld in [artikel 16, tweede lid][ref15], [18, tweede lid][ref16],
      [29, tweede lid][ref17], of [38, tweede lid, van de wet][ref18];
        - *profieldeel:* het in [artikel 38, vierde lid, onderdeel b, van de wet][ref19] bedoelde onderdeel van het
      profiel;
        - *profielvak:* profielvak als bedoeld in [artikel 18, zesde lid][ref20], of
      [artikel 29, zesde lid, van de wet][ref21];
        - *school:* een school voor vwo, een school voor havo, een school voor mavo, een school voor vbo of een school
      voor praktijkonderwijs;
        - *stage:* de stage, bedoeld in [artikel 45, derde lid, onderdeel b, van de wet][ref22];
        - *stagebegeleider:* degene die is belast met de begeleiding van de leerling en werkzaam is bij de stagegever;
        - *stagegever:* de rechtspersoon of de natuurlijke persoon bij wie de stage wordt doorlopen;
        - *stageleraar:* de leraar van de school waarop de leerling is ingeschreven, belast met het toezicht op de leerling
      tijdens het verloop van de stage;
        - *theoretische leerweg:* de theoretische leerweg, genoemd in [artikel 16 van de wet][ref23];
        - *vbo:* voorbereidend beroepsonderwijs;
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs;
        - *vwo:* voorbereidend wetenschappelijk onderwijs;
        - *vrij deel:* het in [artikel 38, vierde lid, onderdeel c, van de wet][ref24] bedoelde onderdeel van het profiel;
        - *wet:* [ Wet voortgezet onderwijs BES][ref25].


