  - number: '2.1'
    text: |-
      Het bevoegd gezag kan bepalen dat de in [artikel 64, eerste lid, van de wet][ref1] bedoelde bevoegdheid tot
      toelating onder zijn verantwoordelijkheid wordt uitgeoefend door een door het bevoegd gezag in te stellen
      toelatingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
  - number: '2.2'
    text: |-
      Het bevoegd gezag regelt de werkzaamheden, omvang en samenstelling van de in het eerste lid bedoelde
      toelatingscommissie en kan de uitoefening van de bevoegdheid door de commissie nader regelen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel2
  - number: '3.1'
    text: |-
      Tot het eerste leerjaar van een school, behalve voor zover het betreft een school voor praktijkonderwijs, kan als
      leerling slechts worden toegelaten degene die:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel3
  - number: 3.1.a
    text: |-
      afkomstig is van een school als bedoeld in de [Wet primair onderwijs BES][ref1] of de [Wet primair onderwijs][ref2]
      en bij wie naar het oordeel van de directeur van de school voor basisonderwijs de grondslag voor het volgen van
      aansluitend voortgezet onderwijs in voldoende mate is gelegd, of


      [ref1]: https://wetten.overheid.nl/BWBR0030280
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030280
      - id: ref2
        bwb_id: BWBR0003420
  - number: 3.1.b
    text: |-
      afkomstig is van een school als bedoeld in de [Wet primair onderwijs BES][ref1] of de [Wet primair onderwijs][ref2]
      en aan het einde van het schooljaar de leeftijd van 14 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030280
      - id: ref2
        bwb_id: BWBR0003420
  - number: '3.2'
    text: |-
      Bij beslissingen over de toelating op grond van het eerste lid betrekt het bevoegd gezag het onderwijskundig
      rapport dat ingevolge [artikel 48 van de Wet primair onderwijs BES][ref1] is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel48
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '48'
  - number: '3.3'
    text: De toelating tot het eerste leerjaar van een school kan niet voorwaardelijk geschieden.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel3
  - number: '3.4'
    text: |-
      In gevallen waarin toepassing van het eerste of tweede lid niet mogelijk is, kan de inspectie afwijking van het
      eerste of tweede lid toestaan.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd het bepaalde in [artikel 3][ref1] wordt de beslissing over de toelating van een kandidaat-leerling
      tot het eerste leerjaar van een school voor vwo, voor havo of voor mavo, mede gebaseerd op een onderzoek naar de
      geschiktheid voor het volgen van het onderwijs aan de school waarvoor de toelating wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel3
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '3'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      Het onderzoek naar de geschiktheid vindt plaats met behulp van ten minste één van de hierna genoemde middelen, ter
      keuze van het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: 4.2.a
    text: |-
      een toelatingsexamen, door de leraren van de school afgenomen, dat zich ten minste uitstrekt over de vakken
      Nederlandse taal en rekenen;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: 4.2.b
    text: een proefklas;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: 4.2.c
    text: |-
      een onderzoek naar de kennis en het inzicht van de kandidaat-leerling in ten minste het laatstelijk door hem
      gevolgde schooljaar aan de basisschool;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: 4.2.d
    text: een psychologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: '4.3'
    text: |-
      Een kandidaat-leerling wordt niet onderworpen aan een psychologisch onderzoek als bedoeld in het tweede lid,
      onderdeel d, dan met toestemming van hen die de ouderlijke macht of de voogdij over hem uitoefenen. Dezen worden op
      hun verzoek in de gelegenheid gesteld van de resultaten van het onderzoek kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: '4.4'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het rapport van het in het tweede lid, onderdeel d, bedoelde
      psychologisch onderzoek wordt bewaard op een plaats die uitsluitend toegankelijk is voor het bevoegd gezag en
      de met het onderzoek belaste functionarissen. De ouders, voogden of verzorgers van de kandidaat-leerling en de
      inspectie krijgen desgewenst inzage in dit psychologisch rapport. Het psychologisch rapport wordt in de school
      bewaard tot ten minste drie jaren en ten hoogste vijf jaren na het tijdstip waarop de leerling de school heeft
      verlaten en wordt in elk geval binnen twee maanden na het verstrijken van laatstbedoelde termijn van ten hoogste
      vijf jaren vernietigd.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: '4.5'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een in het eerste lid genoemde school die een
      gemeenschappelijk eerste leerjaar heeft met een school voor vbo.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel4
  - number: '5.1'
    text: |-
      Het bevoegd gezag doet mededeling aan de inspectie van de te volgen procedure voor de toelating tot het
      eerste leerjaar. Het zendt jaarlijks binnen 6 maanden na de toelating een verslag betreffende de toegepaste
      toelatingsmiddelen en van de daarmee opgedane ervaringen aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel5
  - number: '5.2'
    text: |-
      Het bevoegd gezag stelt de directeur van de school waar de leerling basisonderwijs heeft genoten in kennis van de
      beslissing omtrent de toelating en, na afloop van het eerste leerjaar, indien de directeur dit verzoekt, van de
      studieresultaten van de leerling.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor vwo of voor havo
      tot het eerste leerjaar van die school toelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel4
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '4'
        hoofdstuk: II
  - number: 6.1.a
    text: de kandidaat-leerling die tot het eerste leerjaar van een andere school voor vwo of voor havo is toegelaten;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
  - number: 6.1.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor mavo gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van [artikel 3][ref1] of [artikel 4][ref2] kan het bevoegd gezag van een school voor mavo tot het
      eerste leerjaar van die school toelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel4
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '4'
        hoofdstuk: II
  - number: 6.2.a
    text: |-
      de kandidaat-leerling die tot het eerste leerjaar van een andere school voor mavo of tot het eerste leerjaar van
      een school voor vwo of voor havo is toegelaten;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
  - number: 6.2.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor vbo gedeeltelijk heeft doorlopen, indien de
      studieresultaten daartoe naar het oordeel van het bevoegd gezag aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van [artikel 3][ref1] kan het bevoegd gezag van een school voor vbo tot het eerste leerjaar van die
      school toelaten de kandidaat die tot het eerste leerjaar van enige school is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel3
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '3'
        hoofdstuk: II
  - number: '7'
    text: |-
      Tot een school voor praktijkonderwijs kan als leerling worden toegelaten degene die de leeftijd van ten minste 12
      jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd het bepaalde in de [artikelen 3][ref1] en [7][ref2] wordt een kandidaat-leerling niet toegelaten tot
      een school of profiel, aangewezen op grond van [artikel 50, vijfde lid, van de wet][ref3], dan nadat het bevoegd
      gezag zich ervan heeft vergewist dat dit onderwijs voor hem het meest aangewezen is, gelet op de bijzondere aard en
      doelstelling van het desbetreffende onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel50
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '50'
  - number: '9'
    text: |-
      Een leerling, komende van een gelijksoortige school, wordt bij toelating geplaatst in het leerjaar waarin de
      leerling op die school onderwijs had mogen volgen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9
  - number: 9a.1
    text: |-
      Een leerling die in het bezit is van een diploma vmbo in de theoretische leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
  - number: 9a.1.a
    text: |-
      de vakken, genoemd in [artikel 16, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: 9a.1.b
    text: |-
      de vakken, genoemd in [artikel 16, zevende lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '16'
  - number: 9a.1.c
    text: |-
      de vakken, genoemd in [artikel 20, derde tot en met zevende lid][ref1], met uitzondering van de vakken genoemd in
      artikel 20, zevende lid, onderdeel c, subonderdelen 1° en 2°, en onderdeel d; of


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9a.1.d
    text: |-
      de vakken, genoemd in [artikel 21, tweede tot en met zesde lid][ref1], met uitzondering van de vakken, genoemd in
      artikel 21, zesde lid, onderdeel c, subonderdelen 1° en 2°, en onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel21
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9a.2
    text: |-
      Een leerling die in het bezit is van een diploma vmbo in de gemengde leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
  - number: 9a.2.a
    text: |-
      de vakken, genoemd in [artikel 29, zesde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 9a.2.b
    text: |-
      de vakken, genoemd in [artikel 29, zevende lid, onderdeel c, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 9a.2.c
    text: de vakken, bedoeld in het eerste lid, onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel9a
  - number: '10'
    text: |-
      Alvorens toepassing te geven aan [artikel 64, twaalfde lid, van de wet][ref1], vergewist de inspectie zich ervan,
      dat het bevoegd gezag de ouders van de betrokken leerling in de gelegenheid heeft gesteld te worden gehoord over
      het verzoek van het bevoegd gezag. De inspectie betrekt bij haar beslissing in elk geval de zienswijze van de
      ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
  - number: '11.1'
    text: |-
      Voorwaardelijke bevordering wordt uitdrukkelijk op het eindrapport vermeld. Bovendien wordt hiervan schriftelijk
      mededeling gedaan aan ouders, voogden of verzorgers, waarbij wordt vermeld het tijdstip waarop definitief omtrent
      de overgang zal worden beslist alsmede de voorwaarden waaraan moet worden voldaan om te kunnen worden bevorderd.
      Dit tijdstip ligt tussen 1 oktober en 1 januari daarop volgend.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel11
  - number: '11.2'
    text: Een leerling wordt niet voorwaardelijk bevorderd tot het hoogste leerjaar.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel11
  - number: '12.1'
    text: Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel12
  - number: '12.2'
    text: |-
      Het besluit tot schorsing wordt schriftelijk aan de betrokkene en, indien deze nog niet meerderjarig is, ook aan de
      ouders, voogden of verzorgers van de betrokkene bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel12
  - number: '12.3'
    text: |-
      Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel12
  - number: '13.1'
    text: |-
      Het bevoegd gezag kan besluiten tot definitieve verwijdering van een leerling nadat deze en, indien de leerling
      nog niet meerderjarig is, ook diens ouders, voogden of verzorgers, in de gelegenheid is onderscheidenlijk zijn
      gesteld hierover te worden gehoord. Een leerling wordt op grond van onvoldoende vorderingen niet in de loop van een
      schooljaar verwijderd.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel13
  - number: '13.2'
    text: |-
      Definitieve verwijdering van een leerplichtige leerling geschiedt slechts na overleg met de inspectie. Hangende
      dit overleg kan de leerling worden geschorst. Het overleg strekt er mede toe, na te gaan op welke andere wijze de
      betrokken leerling onderwijs zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel13
  - number: '13.3'
    text: |-
      Het bevoegd gezag stelt de inspectie van een definitieve verwijdering schriftelijk en met opgave van redenen in
      kennis.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel13
  - number: 13a
    text: |-
      Het bevoegd gezag maakt bij beslissingen tot verwijdering van leerlingen op de grond dat deze niet zijn bevorderd
      tot het zesde leerjaar van het vwo dan wel het vijfde leerjaar van het havo, geen onderscheid tussen leerlingen op
      basis van de schoolsoort of leerweg waarvoor zij eerder stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel13a
  - number: '14.1'
    text: |-
      De besluiten tot weigering van de toelating van een kandidaat-leerling of tot definitieve verwijdering van een
      leerling worden schriftelijk en met opgave van redenen aan de leerling en, indien deze nog niet meerderjarig is,
      ook aan diens ouders, voogden of verzorgers, bekendgemaakt, waarbij tevens de inhoud van het tweede lid wordt
      vermeld.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel14
  - number: '14.2'
    text: Binnen zes weken na de bekendmaking kunnen belanghebbenden bezwaar maken bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel14
  - number: '14.3'
    text: |-
      Het bevoegd gezag beslist in overeenstemming met [artikel 64 van de wet][ref1] binnen vier weken na ontvangst van
      het bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, onderscheidenlijk de leerling en, indien deze
      nog niet meerderjarig is, ook diens ouders, voogden of verzorgers, in de gelegenheid is, onderscheidenlijk zijn
      gesteld, te worden gehoord en kennis heeft onderscheidenlijk hebben kunnen nemen van de op die besluiten betrekking
      hebbende adviezen of rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
  - number: '14.4'
    text: |-
      Het bevoegd gezag kan de desbetreffende leerling, gedurende de behandeling van het bezwaar tegen een besluit tot
      definitieve verwijdering de toegang tot de school ontzeggen.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel14
  - number: '15.1'
    text: |-
      Het aantal dagen dat per schooljaar ten hoogste voor vakanties op grond van
      [artikel12b, derde lid, van de wet][ref1], mag worden besteed, bedraagt 66 bij een zesdaagse schoolweek en 55 bij
      een vijfdaagse schoolweek.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12b
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 12b
  - number: '15.2'
    text: |-
      Indien na aftrek van het aantal dagen dat wordt besteed voor vakanties die centraal worden vastgesteld op grond van
      [artikel 12b, vierde lid, van de wet][ref1], dagen resteren van de in het eerste lid bedoelde aantallen, kan het
      bevoegd gezag voor het betreffende schooljaar een of meer vakanties vaststellen waarvoor ten hoogste dat resterend
      aantal dagen mag worden besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12b
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 12b
  - number: '15.3'
    text: |-
      Onder dagen in het eerste lid wordt verstaan elke dag van de week met uitzondering van de zondag bij een zesdaagse
      schoolweek en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek. Op die zondagen
      respectievelijk zaterdagen en zondagen wordt geen onderwijs verzorgd.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
  - number: '15.4'
    text: |-
      Tenzij vallend binnen een op grond van het tweede lid of op grond van [artikel 12b, vierde lid, van de wet][ref1]
      vastgestelde vakantie, worden de volgende dagen, waarop eveneens geen onderwijs wordt verzorgd, niet meegeteld bij
      het aantal dagen, bedoeld in het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12b
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 12b
  - number: 15.4.a
    text: nieuwjaarsdag, tweede paasdag, Hemelvaartsdag, tweede pinksterdag en de beide kerstdagen, alsmede
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
  - number: 15.4.b
    text: Koningsdag en Koninkrijksdag.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
  - number: '15.5'
    text: |-
      Indien aan een bijzondere school onderwijs wordt gegeven gebaseerd op een levensbeschouwing volgens welke andere
      dan de in het vierde lid, onderdeel a, genoemde dagen als feestdagen worden aangemerkt, kan in plaats van op de
      dagen, bedoeld in het vierde lid, onderdeel a, die vallen buiten een op grond van het tweede lid of op grond van
      [artikel 12b, vierde lid, van de wet][ref1] vastgestelde vakantie, geen onderwijs worden verzorgd op andere dagen.
      Bij toepassing van de eerste volzin worden laatstgenoemde dagen niet meegeteld bij het aantal dagen, bedoeld in het
      eerste lid. De eerste volzin kan per schooljaar worden toegepast voor ten hoogste het aantal dagen als bedoeld in
      het vierde lid, onderdeel a, dat buiten een op grond van het tweede lid of op grond van artikel 12b, vierde lid,
      van de wet vastgestelde vakantie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel12b
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: 12b
  - number: 15a
    text: |-
      Buiten de vakanties en de andere dagen waarop geen onderwijs wordt verzorgd ingevolge artikel 12b, derde of vierde
      lid, van de wet en [artikel 15, tweede tot en met vijfde lid][ref1], wijst het bevoegd gezag bij een zesdaagse
      schoolweek ten hoogste dertien dagen en bij een vijfdaagse schoolweek ten hoogste twaalf dagen per schooljaar aan
      waarop geen onderwijs wordt verzorgd, waarvan ten hoogste zes dagen onmiddellijk aansluitend voor of na de voor de
      school op grond van [artikel 12b, vierde lid, van de wet][ref2] vastgestelde zomervakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel12b
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 12b
  - number: '16.1'
    text: |-
      Voor afwijkingen als bedoeld in [artikel 36, tweede lid, eerste volzin, van de wet][ref1] kunnen in aanmerking
      komen leerlingen die naar het oordeel van het bevoegd gezag niet in staat zijn al het onderwijs dat wordt verzorgd
      op basis van de kerndoelen te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel36
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '36'
  - number: '16.2'
    text: |-
      Het bevoegd gezag stelt een commissie in die adviseert ten aanzien van welke leerlingen
      [artikel 36, tweede lid, van de wet][ref1] toepassing kan vinden. Het bevoegd gezag regelt de omvang en
      samenstelling van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel36
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '36'
  - number: '16.3'
    text: |-
      In haar advies doet de commissie aan het bevoegd gezag voorstellen ten aanzien van de aard van de in het tweede lid
      bedoelde afwijkingen. Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
  - number: '16.4'
    text: 'De commissie betrekt in elk geval bij haar oordeelsvorming:'
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
  - number: 16.4.a
    text: |-
      in voorkomende gevallen het in [artikel 3, tweede lid][ref1], bedoelde onderwijskundig rapport en de resultaten van
      het in [artikel 4][ref2] bedoelde onderzoek naar de geschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel4
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '4'
        hoofdstuk: II
  - number: 16.4.b
    text: |-
      indien de omstandigheid op grond waarvan afwijking wordt voorgesteld daartoe aanleiding geeft, de van een
      deskundige verkregen verklaring;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
  - number: 16.4.c
    text: |-
      de zienswijze van de ouders, voogden of verzorgers van de leerlingen, welke zienswijze blijkt uit een schriftelijke
      verklaring;
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
  - number: 16.4.d
    text: |-
      de zienswijze van de leraar of leraren, belast met het betrokken onderwijs, welke zienswijze blijkt uit een
      schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
  - number: '16.5'
    text: |-
      Het advies wordt schriftelijk uitgebracht aan het bevoegd gezag. Indien het bevoegd gezag voornemens is af te
      wijken van het advies van de commissie, overlegt het over dit voornemen met de commissie. De beslissing van het
      bevoegd gezag is met redenen omkleed. Het bevoegd gezag zendt een afschrift van zijn beslissing, vergezeld van het
      advies van de commissie en de daarbij gevoegde verklaringen, bedoeld in het vierde lid, aan de ouders, voogden of
      verzorgers van de betrokken leerlingen, aan de betrokken leraar of leraren en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel16
  - number: '17.1'
    text: |-
      Het onderwijsprogramma in de eerste drie leerjaren aan een school voor vwo en een school voor havo omvat tevens
      onderwijs in Franse taal en Spaanse taal.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: '17.2'
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het volgen
      van onderwijs in Franse taal of Spaanse taal, indien de leerling onderwijs volgt in Papiaments, Duitse taal,
      Russische taal, Italiaanse taal, Arabische taal, Turkse taal of, in het vwo, Chinese taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: '17.3'
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het volgen
      van onderwijs in Franse taal of Spaanse taal dan wel in beide talen, indien de leerling
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: 17.3.a
    text: voor de eerste maal tot een school voor havo of een school voor vwo is toegelaten,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: 17.3.b
    text: is geplaatst in een hoger leerjaar dan het eerste,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: 17.3.c
    text: voordien buiten Nederland vergelijkbaar onderwijs heeft gevolgd, en
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: 17.3.d
    text: daarbij geen of te weinig onderwijs in de desbetreffende taal of talen heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: '17.4'
    text: |-
      In de eerste drie leerjaren van een gymnasium wordt tevens onderwijs verzorgd in Latijnse taal en cultuur en
      Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel17
  - number: '18.1'
    text: |-
      Het onderwijsprogramma in de eerste twee leerjaren aan een school voor mavo en een school voor vbo omvat
      tevens onderwijs in Franse taal of Spaanse taal. Deze verplichting geldt niet voor leerlingen voor wie
      naar de verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte leerweg als bedoeld in
      [artikel 18, eerste lid, van de wet][ref1] het meest geschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: '18.2'
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen van het volgen
      van onderwijs in Franse taal of Spaanse taal:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: 18.2.a
    text: indien de leerling onderwijs volgt in Papiaments, Duitse taal, Arabische taal of Turkse taal, of
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: 18.2.b
    text: indien de leerling
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: 18.2.b.1°
    text: voor de eerste maal tot een school voor mavo of een school voor vbo is toegelaten,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: 18.2.b.2°
    text: is geplaatst in een hoger leerjaar dan het eerste,
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: 18.2.b.3°
    text: voordien buiten Nederland vergelijkbaar onderwijs heeft gevolgd, en
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: 18.2.b.4°
    text: daarbij geen of te weinig onderwijs in de desbetreffende taal of talen heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: '18.3'
    text: |-
      De leerling die op basis van het eerste lid, geen onderwijs volgt in de Franse taal of Spaanse taal, volgt in het
      profiel economie en ondernemen of het profiel horeca, bakkerij en recreatie van de basisberoepsgerichte leerweg
      in plaats hiervan, naar keuze van de leerling, het vak Arabische taal, Turkse taal, Duitse taal, Papiaments,
      maatschappijkunde, geschiedenis en staatsinrichting of aardrijkskunde.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel18
  - number: '19'
    text: |-
      Praktijkonderwijs omvat ten minste Nederlandse taal, rekenen/wiskunde, informatiekunde en lichamelijke opvoeding,
      alsmede het onderwijs waarvan het bevoegd gezag, na overleg met het bestuurscollege dat daarbij de werkgevers
      betrekt die werkzaam zijn op de regionale arbeidsmarkt, heeft vastgesteld dat dit van belang is voor het uitoefenen
      van functies binnen die arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel19
  - number: '20.1'
    text: |-
      Het gemeenschappelijk deel van elk profiel in het atheneum omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:
    url: https://wetten.overheid.nl/BWBR0029589/2020-08-01#Artikel20
  - number: 20.1.a
    text: 'Nederlandse taal en literatuur: 480,'
