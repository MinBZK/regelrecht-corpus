preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '2'
    text: |-
      Jaarlijks maakt de minister voor het volgende kalenderjaar een raming van de hoogte van de rijksbijdrage, bedoeld
      in [artikel 76c, onderdeel h, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76c
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76c
  - number: '3'
    text: |-
      1 Op de eerste dag van elk kwartaal stort de minister 25% van het op grond van [artikel 2][ref1] geraamde bedrag,
      op de rekening-courant ten name van het Uitvoeringsinstituut werknemersverzekeringen bij de Minister van Financiën.
      De Minister kan na overleg met het Uitvoeringsinstituut werknemersverzekeringen van het op grond van de eerste
      volzin berekende bedrag afwijken.

      2 Indien de dag, bedoeld in het eerste lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt afdracht
      plaats op de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0017784#Artikel2
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017784
        artikel: '2'
  - number: '4'
    text: |-
      1 Uiterlijk op 1 juni dient het Uitvoeringsinstituut werknemersverzekeringen de afrekening over het afgelopen
      kalenderjaar bij de minister in.

      2 In de afrekening wordt op basis van de jaarrekening, bedoeld in
      [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de kasstroom van de rijksbijdrage
      inzichtelijk gemaakt.

      3 Op grond van de afrekening vindt voor 15 juli een betaling plaats ten gunste of ten laste van het
      Arbeidsongeschiktheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '5'
    text: |-
      De minister stelt jaarlijks voor 31 oktober het bedrag vast dat over het afgelopen kalenderjaar als rijksbijdrage
      als bedoeld in [artikel 76c, onderdeel h, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], ten gunste
      komt van het Arbeidsongeschiktheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76c
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76c
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Financieringsregeling rijksbijdrage Arbeidsongeschiktheidsfonds.'
    url: https://wetten.overheid.nl/BWBR0017784/2005-01-01#Artikel7
