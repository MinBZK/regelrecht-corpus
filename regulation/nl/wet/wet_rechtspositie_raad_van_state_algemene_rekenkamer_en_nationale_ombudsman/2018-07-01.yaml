        artikel: '35'
  - number: '4'
    text: |-
      1 De vice-president van de Raad van State kan een lid van de Raad van State en een staatsraad op diens verzoek
      gedurende een bepaalde periode ontheffen van de waarneming van zijn ambt.

      2 De bezoldiging blijft gedurende de periode van de ontheffing van de waarneming van zijn ambt achterwege.
    url: https://wetten.overheid.nl/BWBR0024788/2018-07-01#Artikel4
  - number: '5'
    text: |-
      1 De substituut-ombudsman die ingevolge [artikel 10, eerste lid, van de Wet Nationale ombudsman][ref1] gedurende
      meer dan 30 dagen onafgebroken is belast met de vervanging van de ombudsman, geniet een vervangingstoelage ter
      hoogte van het verschil tussen zijn bezoldiging en de bezoldiging van de ombudsman.

      2 De substituut-ombudsman die ingevolge [artikel 10, derde lid, van de Wet Nationale ombudsman][ref2] is belast met
      de waarneming van het ambt van de ombudsman, geniet voor de duur van de waarneming een waarnemingstoelage tot de
      hoogte van het bedrag van de bezoldiging van de ombudsman.

      3 Degene die op grond van [artikel 2, vijfde lid][ref3], of
      [artikel 10, tweede of vierde lid, van de Wet Nationale ombudsman][ref4], de ombudsman vervangt respectievelijk het
      ambt van ombudsman waarneemt, geniet voor de duur van de vervanging respectievelijk de waarneming, de bezoldiging
      en de vakantie-uitkering die voor dit ambt zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel10
