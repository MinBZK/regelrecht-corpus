  - number: '7'
    text: |-
      Onverschuldigd betaalde bezoldiging als bedoeld in [artikel 1, eerste tot en met vijfde lid][ref1],
      uitkeringen als bedoeld in artikel 1, zesde lid, vergoeding als bedoeld in [artikel 2, eerste lid][ref2],
      en ambtsjubileumgratificaties, vakantie-uitkeringen en eindejaarsuitkeringen als bedoeld in
      [artikel 3, eerste lid][ref3], kunnen worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0024788#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024788#Artikel3
    url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#Artikel7
