preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtspositie van de vice-president van de Raad van
    State, de staatsraden en de staatsraden in buitengewone dienst, alsmede van de president en de overige leden van de
    Algemene Rekenkamer, alsmede van de Nationale ombudsman en de substituut-ombudsmannen te harmoniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De bezoldiging van de vice-president van de Raad van State, de president van de Algemene Rekenkamer en de
      Nationale ombudsman wordt bepaald op € 14.760,00 per maand.

      2 De bezoldiging van de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State wordt bepaald op
      € 13.787,12 per maand.

      3 De bezoldiging van de overige leden van de Raad van State, de overige leden in gewone dienst van de Algemene
      Rekenkamer en de substituut-ombudsmannen wordt bepaald op € 12.875,98 per maand.

      4 De staatsraden ontvangen een zodanig deel van de in het derde lid bedoelde bezoldiging als overeenkomt met de
      vastgestelde omvang van de te verrichten taak.

      5 De bezoldiging vangt aan met de dag van indiensttreding. De bezoldiging eindigt in ieder geval met ingang van de
      dag na het overlijden.

      6 Na het overlijden van de vice-president van de Raad van State, de president van de Algemene Rekenkamer, de
      Nationale ombudsman, de leden van de Raad van State en de staatsraden, de overige leden van de Algemene Rekenkamer
      of de substituut-ombudsmannen wordt een uitkering verstrekt op de voet van hetgeen hieromtrent voor de ambtenaren
      die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties in een collectieve arbeidsovereenkomst is overeengekomen.

      7 Indien voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een wijziging van het loon
      is overeengekomen en daarbij is overeengekomen dat die wijziging een algemeen karakter draagt, worden de in het
      eerste, tweede en derde lid genoemde bedragen bij ministeriële regeling overeenkomstig gewijzigd.
    url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#Artikel1
  - number: '2'
    text: |-
      1 De staatsraden in buitengewone dienst en de leden in buitengewone dienst van de Algemene Rekenkamer ontvangen
      voor het deelnemen aan de werkzaamheden van de Raad van State onderscheidenlijk de Algemene Rekenkamer een bij
      algemene maatregel van bestuur te regelen vergoeding.

      2 De reis- en verblijfkosten van de in het eerste lid genoemde functionarissen worden vergoed op de voet van
      hetgeen hieromtrent voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het
      Ministerie van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#Artikel2
  - number: '3'
    text: |-
      1 De vice-president van de Raad van State, de president van de Algemene Rekenkamer, de Nationale ombudsman, de
      leden van de Raad van State en de staatsraden, de overige leden in gewone dienst van de Algemene Rekenkamer en
      de substituut-ombudsmannen ontvangen een eindejaarsuitkering van 8,3 procent van de bezoldiging en een vakantie-
      uitkering van 8 procent van de bezoldiging.

      2 Indien voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een eenmalige uitkering is
      overeengekomen, ontvangen de vice-president van de Raad van State, de president van de Algemene Rekenkamer, de
      Nationale ombudsman, de leden van de Raad van State en de staatsraden, de overige leden in gewone dienst van de
      Algemene Rekenkamer en de substituut-ombudsmannen deze op gelijke voet.

      3 Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van:

      a. de voorzieningen die aan de in het eerste lid genoemde functionarissen ter beschikking worden gesteld en
      noodzakelijk zijn voor de vervulling van hun ambt;

      b. een vaste vergoeding voor de kosten van voorzieningen die voor eigen rekening van de in het eerste lid genoemde
      functionarissen komen en door hen mede worden aangewend ten behoeve van de vervulling van hun ambt.

      4 In de in het derde lid bedoelde algemene maatregel van bestuur kan worden bepaald dat in deze algemene maatregel
      van bestuur opgenomen bedragen bij ministeriële regeling kunnen worden gewijzigd op een in deze algemene maatregel
      van bestuur aangegeven wijze.

      5 Onder de in het derde lid, onder a, bedoelde voorzieningen zijn in ieder geval begrepen die met betrekking tot
      verhuizing, informatie en communicatie, binnenlandse en buitenlandse dienstreizen, vervoer en, voor zover het de
      Nationale ombudsman en de substituut-ombudsmannen betreft, een voorziening voor bedrijfsgeneeskundige zorg.

      6 De vice-president van de Raad van State, de president van de algemene Rekenkamer, de leden van de Raad
      van State en de staatsraden en de overige leden in gewone dienst van de Algemene Rekenkamer ontvangen een
      ambtsjubileumgratificatie op de voet van de regeling die hieromtrent geldt voor het personeel werkzaam bij de
      Sector Rijk.
    url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#Artikel3
  - number: 3a
    text: |-
      1 Een Nationale ombudsman of een substituut-ombudsman die naar het oordeel van een arts een
      structurele functionele beperking heeft, kan aanspraak maken op een voorziening als bedoeld in
      [artikel 35, tweede en derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] dan wel een financiële
      vergoeding daarvoor.

      2 Het gestelde bij of krachtens [artikel 35, vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#Artikel3a
