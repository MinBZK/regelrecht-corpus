  - number: '6'
    text: |-
      1 Op de bezoldiging, bedoeld in [artikel 1, eerste tot en met vijfde lid][ref1], de uitkering, bedoeld in artikel
      1, zesde lid, en de vergoeding, bedoeld in [artikel 2, eerste lid][ref2], alsmede op de ambtsjubileumgratificatie,
      de vakantie-uitkering en de eindejaarsuitkering, bedoeld in [artikel 3, eerste lid][ref3], is, voor zover in deze
      wet niet anders is bepaald, beslag mogelijk overeenkomstig de voorschriften van het gemene recht.

      2 Kostenvergoedingen krachtens [artikel 3, tweede lid][ref4], zijn niet vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0024788#Artikel1
