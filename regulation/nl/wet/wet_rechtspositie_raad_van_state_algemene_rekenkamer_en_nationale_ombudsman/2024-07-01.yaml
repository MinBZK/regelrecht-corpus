  - number: '9'
    text: |-
      1 Op bezoldiging als bedoeld in [artikel 1, eerste tot en met vijfde lid][ref1], uitkeringen als bedoeld in artikel
      1, zesde lid, vergoeding als bedoeld in [artikel 2, eerste lid][ref2], en ambtsjubileumgratificaties, vakantie-
      uitkeringen en eindejaarsuitkeringen als bedoeld in [artikel 3, eerste lid][ref3], kan ten behoeve van een
      schuldeiser van de betrokken functionaris of zijn nagelaten betrekkingen een korting worden toegepast, mits deze
      functionaris onderscheidenlijk zijn nagelaten betrekkingen de vordering van de schuldeiser erkent of erkennen dan
      wel het bestaan van de vordering blijkt uit een in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit
      een authentieke akte.

      2 Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.

      3 Beslag, faillissement, surséance van betaling en toepassing ten aanzien van de betrokken functionaris of zijn
      nagelaten betrekkingen van de schuldsaneringsregeling natuurlijke personen sluiten korting uit.


      [ref1]: https://wetten.overheid.nl/BWBR0024788#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024788#Artikel3
    url: https://wetten.overheid.nl/BWBR0024788/2024-07-01#Artikel9
