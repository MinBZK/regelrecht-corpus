  - number: '10'
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] worden,
      onverminderd [artikel 8, tweede lid][ref2], en [artikel 9, derde lid][ref3], verrekening en korting gelijkgesteld
      met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0024788#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0024788#Artikel9
