        artikel: '3'
  - number: '8'
    text: |-
      1 Met bezoldiging als bedoeld in [artikel 1, eerste tot en met vijfde lid][ref1], uitkeringen als bedoeld in
      artikel 1, zesde lid, vergoeding als bedoeld in [artikel 2, eerste lid][ref2], en ambtsjubileumgratificaties,
      vakantie-uitkeringen en eindejaarsuitkeringen als bedoeld in [artikel 3, eerste lid][ref3], kan worden verrekend
      hetgeen de betrokken functionaris of zijn nagelaten betrekkingen zelf als zodanig aan de Staat verschuldigd is
      of zijn.

      2 Verrekening als bedoeld in het eerste lid kan plaatshebben ondanks gelegd beslag of toegepaste korting als
      bedoeld in [artikel 9, eerste lid][ref4].

      3 Verrekening als bedoeld in het eerste lid is slechts in zoverre geldig als een beslag op die
      bezoldiging, ambtsjubileumgratificaties, vakantie-uitkeringen of eindejaarsuitkeringen geldig zou zijn,
      met dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding is verschuldigd
      eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref5] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0024788#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024788#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024788#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
