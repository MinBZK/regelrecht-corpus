$id: regeling_invoer_hooi_en_stro
regulatory_layer: WET
publication_date: '2005-12-22'
valid_from: '2004-10-03'
bwb_id: BWBR0007458
url: https://wetten.overheid.nl/BWBR0007458/2004-10-03
preamble:
  text: |-
    Gelet op richtlijn nr. 90/675/EEG van de Raad van de Europese Gemeenschap-pen van 10 december 1990 tot vaststelling
    van de beginselen voor de organisatie van de veterinaire controles voor producten uit derde landen die in de
    Gemeenschap worden binnengebracht (PbEG L 373) en op beschikking nr. 93/13/EEG van de Commissie van de Europese
    Gemeenschappen van 22 december 1992 tot vaststelling van de procedures voor de veterinaire controles in de
    inspectieposten aan de grens van de Gemeenschap bij het binnenbrengen van producten uit derde landen (PbEG 1993,
    L 9);

    Gelet op artikel 10, 11, eerste lid, onderdeel b, en 13, tweede lid, van de Gezondheids- en welzijnswet voor dieren
    en de artikelen 2 en 4 van het Besluit inzake het in de handel brengen van dieren en producten en de toepassing van
    maatregelen met betrekking tot in Nederland gebrachte dieren en producten;

    Gezien het advies van de Raad voor Dierenaangelegenheden, het Produktschap voor Veevoeder en het Landbouwschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#ArtikelAanhef
articles:
  - number: '1'
    text: De begripsbepalingen van artikel 1.1 van de Regeling keuring en handel dierlijke producten zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel1
  - number: '2.1'
    text: |-
      Het brengen in Nederland van een partij hooi of stro die via Nederland voor het eerst op het grondgebied van de
      Europese Gemeenschap wordt gebracht en is verzonden vanuit een derde land is verboden, tenzij:
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel2
  - number: 2.1.a
    text: |-
      de partij afkomstig is uit een derde land of gedeelte van een derde land dat voorkomt op de lijst, opgenomen in
      bijlage V, deel 1, van [verordening 136/2004/EG](32004R0136);
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel2
  - number: 2.1.b
    text: |-
      de partij vergezeld gaat van een bij de partij behorend document waaruit de oorsprong en bestemming van het hooi
      of stro blijkt en waaruit tevens blijkt dat, indien de partij is bestemd voor een lid-staat en voor zover van
      toepassing, is voldaan aan de veterinairrechtelijke voorschriften van die lid-staat van bestemming;
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel2
  - number: 2.1.c
    text: |-
      wordt voldaan aan [verordening 136/2004/EG](32004R0136) en de [artikelen 2.17 tot en met 2.23f][ref1] en
      [2.27 van de Regeling keuring en handel dierlijke producten][ref2], met dien verstande dat met het in die artikelen
      genoemde originele certificaat of document, het document, genoemd in onderdeel b, wordt bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '2.2'
    text: |-
      De [artikelen 2.24][ref1], [227][ref2] en [22.7 a van de Regeling keuring en handel dierlijke producten][ref3] zijn
      van overeenkomstige toepassing op hooi en stro.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '3'
    text: |-
      Het brengen in Nederland van een partij hooi of stro die afkomstig is uit een derde land en via het grondgebied van
      een lid-staat in Nederland wordt gebracht, is verboden, tenzij de partij vergezeld gaat van:
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel3
  - number: 3.a
    text: |-
      indien zij is bestemd voor Nederland of een lidstaat, een Gemeenschappelijk veterinair document van binnenkomst als
      bedoeld in [verordening 136/2004/EG](32004R0136) en gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van
      [richtlijn 97/78/EG](31997L0078);
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel3
  - number: 3.b
    text: |-
      indien zij bestemd is voor een derde land, het bij de partij behorende originele document en een Gemeenschappelijk
      veterinair document van binnenkomst als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel3
  - number: 3a
    text: De minister is de bevoegde autoriteit, bedoeld in artikel 10 van [verordening 136/2004/EG](32004R0136).
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel3a
  - number: '4'
    text: |-
      Deze regeling is niet van toepassing op een partij als bedoeld in artikel 16, eerste lid, van [richtlijn 97/78/
      EG](31997L0078), mits, met inachtneming van artikel 8 van [verordening 136/2004/EG](32004R0136), wordt voldaan aan
      artikel 16, eerste lid, van [richtlijn 97/78/EG](31997L0078).
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel4
  - number: '5.1'
    text: |-
      Een wijziging van de in deze regeling genoemde richtlijn of beschikking treedt voor de toepassing van de artikelen
      waarin naar die richtlijn, onderscheidenlijk beschikking is verwezen, in werking met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn onderscheidenlijk wijzigingsbeschikking uitvoering moet zijn gegeven, tenzij, in
      geval van een wijzigingsrichtlijn, bij ministerieel besluit dat in de Staatscourant wordt bekendgemaakt, een ander
      tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel5
  - number: '5.2'
    text: De minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel5
  - number: '6.1'
    text: De Regeling in-, door- en vervoer niet-geharmoniseerde produkten 1993 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel6
  - number: '6.2'
    text: De Beschikking vervoer niet-geharmoniseerde produkten 1993 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling invoer hooi en stro.'
    url: https://wetten.overheid.nl/BWBR0007458/2004-10-03#Artikel8
