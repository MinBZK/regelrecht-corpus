  - number: 34b
    text: |-
      [Artikel 34a][ref1] is van overeenkomstige toepassing op het vaststellen van het inkomen en vermogen van een andere
      persoon dan de rechtzoekende als bedoeld in [artikel 34, derde lid][ref2].


