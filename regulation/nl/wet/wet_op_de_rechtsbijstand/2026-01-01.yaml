  - number: 42b
    text: |-
      1 Het bestuur kan met het oog op de uitoefening van zijn taken een subsidie verstrekken aan één of meer
      voorzieningen.

      2 Op de subsidie, die per boekjaar wordt verstrekt, is [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1]
      van toepassing.

      3 Het bestuur stelt regels over de verstrekking van de subsidie, die in ieder geval bepalingen omvatten omtrent:

      a. de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;

      b. het verlenen van voorschotten;

      c. de gevallen waarin de voorziening een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref2] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;

      d. de handelingen, bedoeld in [artikel 4:71 van de Algemene wet bestuursrecht][ref3], waarvoor de voorziening de
      toestemming van het bestuur behoeft;

      e. het vormen van een egalisatiereserve door de voorziening;

      f. de overige aan de subsidie verbonden verplichtingen;

      g. de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht wordt genomen;

      h. het onderzoek door de accountant, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref4].

      4 Het bestuur stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref5], vast.

      5 De door het bestuur op te stellen regels voor de subsidiëring van een voorziening behoeven de goedkeuring van
      Onze Minister. De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.

      6 Voorzover noodzakelijk met het oog op het onderzoek door de accountant, bedoeld in
      [artikel 4:78 van de Algemene wet bestuursrecht][ref6], verstrekt de voorziening persoonsgegevens van
      rechtzoekenden aan de accountant.


