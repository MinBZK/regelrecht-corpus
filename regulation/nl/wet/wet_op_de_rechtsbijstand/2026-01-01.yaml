preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van artikel 18, tweede lid, van de Grondwet,
    wenselijk is nieuwe wettelijke regels vast te stellen omtrent de verstrekking door de overheid van gefinancierde
    rechtsbijstand aan minder draagkrachtigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bestuur:* het bestuur, bedoeld in [artikel 3][ref1];
        - *inkomen:* het inkomen, zoals berekend ingevolge de [artikelen 34a tot en met 34d][ref2];
        - *inkomensgegeven:* inkomensgegeven als bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref3];
        - *inspecteur:* de inspecteur, bedoeld in
      [artikel 2, derde lid, onder b, van de Algemene wet inzake rijksbelastingen][ref4];
        - *Kaderwet:* de [Kaderwet zelfstandige bestuursorganen][ref5];
        - *mediation:* het bemiddelen in een geschil waarbij een neutrale bemiddelingsdeskundige de onderhandelingen tussen
      de rechtzoekende en zijn wederpartij begeleidt teneinde vanuit hun werkelijke belangen tot gezamenlijk gedragen en
      voor ieder van hen optimale resultaten te komen;
        - *mediator:* de mediator als bedoeld in [artikel 33a][ref6];
        - *Onze Minister:* Onze Minister van Veiligheid en Justitie;
        - *peiljaar:* het tweede kalenderjaar dat voorafgaat aan het kalenderjaar waarin de aanvraag om een toevoeging
      wordt gedaan;
        - *raad:* de raad voor rechtsbijstand, bedoeld in [Hoofdstuk II][ref7];
        - *raad van advies:* de raad van advies, bedoeld in [artikel 6][ref8];
        - *rechtsbijstand:* rechtskundige bijstand aan een rechtzoekende ter zake van een rechtsbelang dat hem rechtstreeks
      en individueel aangaat, voor zover in deze wet en de daarop berustende bepalingen geregeld;
        - *rechtsbijstandverlener:* de advocaat, de medewerker van de voorziening voorzover belast met de verlening van
      rechtsbijstand en de personen, bedoeld in [artikel 13, eerste lid, onder c][ref9];
        - *rechtshulp:* het verlenen van rechtsbijstand bestaande uit het geven van eenvoudige juridische adviezen waarbij
      geen sprake is van vertegenwoordiging van de rechtzoekende, alsmede het met het oog op het verlenen van deze
      rechtsbijstand verstrekken van informatie, analyseren en verduidelijken van een probleem en het verwijzen naar
      terzake doende instanties en rechtsbijstandverleners;
        - *rechtzoekende:* degene die op grond van onvoldoende financiële draagkracht aanspraak kan maken op rechtsbijstand
      of mediation, voorzover in deze wet en de daarop berustende bepalingen geregeld, alsmede degene die zijn schade wil
      vorderen als slachtoffer van een seksueel misdrijf of een geweldsmisdrijf;
        - *toevoeging:* de toevoeging ten behoeve van rechtsbijstand als bedoeld in [artikel 24, eerste lid][ref10], of
      mediation als bedoeld in [artikel 33a][ref11];
        - *vermogen:* de rendementsgrondslag, bedoeld in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref12];
        - *voorziening:* een door het bestuur ingerichte voorziening als bedoeld in [artikel 7, tweede lid][ref13], of
      [8, tweede lid][ref14].

      2

      3 In deze wet en de daarop berustende bepalingen worden onder advocaten mede verstaan de personen, bedoeld in
      [artikel 16h van de Advocatenwet][ref15].


