  - number: 34e
    text: |-
      1 De beslissing op het bezwaar tegen de beslissing op de aanvraag om een toevoeging wordt geacht mede betrekking te
      hebben op de beslissing op de aanvraag, bedoeld in [artikel 34c, eerste lid][ref1].

      2 Indien de aanvraag, bedoeld in [artikel 34c, eerste lid][ref2], later is ingediend dan het bezwaarschrift wordt
      in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref3] de termijn waarbinnen het bestuur beslist
      geacht aan te vangen bij ontvangst van de aanvraag.

      3 Indien het bezwaarschrift later is ingediend dan de aanvraag om peiljaarverlegging wordt de termijn waarbinnen
      het bestuur op de aanvraag om peiljaarverlegging moet beslissen opgeschort tot het moment waarop op het bezwaar
      wordt beslist.


