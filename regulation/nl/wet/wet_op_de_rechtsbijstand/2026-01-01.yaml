  - number: '27'
    text: |-
      Het bestuur kan, alvorens op de aanvraag te beslissen, de rechtzoekende horen, indien hij dat noodzakelijk acht
      voor de beoordeling van de aanvraag of de financiële draagkracht van de rechtzoekende. Het bestuur kan tevens,
      tenzij het belang van de rechtzoekende zich daartegen verzet, de tegenpartij in de gelegenheid stellen haar
      standpunt uiteen te zetten.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel27
  - number: '28'
    text: |-
      1 Het bestuur kan de toevoeging weigeren indien de aanvraag:

      a. wordt ingediend nadat de rechtsbijstand reeds feitelijk is verleend;

      b. betrekking heeft op een rechtsbelang ter zake waarvan de aanvrager aanspraak kan maken op rechtsbijstand op
      grond van een eerder afgegeven toevoeging;

      c. een rechtsprobleem betreft dat naar het oordeel van het bestuur eenvoudig afgehandeld kan worden;

      d. een rechtsprobleem betreft dat door de voorziening, bedoeld in [artikel 7, tweede lid][ref1], of door een
      voorziening als bedoeld in [artikel 8, tweede lid][ref2], voor zover belast met het verlenen van rechtshulp, kan
      worden afgehandeld.

      2 Bij de in [artikel 12, derde lid][ref3], bedoelde algemene maatregel van bestuur kunnen omtrent het in het eerste
      lid bepaalde nadere regels worden gesteld.

      3 Het eerste lid, onderdelen a en c, is niet van toepassing, indien het betreft een toevoeging in een zaak waarbij
      de rechtsbijstand bestaat uit het geven van een eenvoudig rechtskundig advies. Het bestuur kan evenwel een aanvraag
      om deze toevoeging weigeren, indien de aanvraag niet binnen vier weken na het geven van het advies is ingediend.


