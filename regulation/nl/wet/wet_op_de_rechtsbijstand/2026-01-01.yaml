  - number: 33e
    text: |-
      1 De [artikelen 12, uitgezonderd het tweede lid, onderdelen c, d en f][ref1],
      [24, tweede tot en met vijfde lid][ref2], [25 tot en met 27][ref3], [28, eerste en tweede lid][ref4], en
      [30 tot en met 32][ref5] zijn van overeenkomstige toepassing op de verlening van een toevoeging met het oog op
      mediation. Bij de aanvraag om een toevoeging wordt de overeenkomst waarin de rechtzoekende en zijn wederpartij
      hebben verklaard in te stemmen met mediation overgelegd.

      2 [Artikel 33][ref6] is van overeenkomstige toepassing op de toevoeging voor mediation met uitzondering van het
      eerste lid, onder d.

      3 [Afdeling 1 van Hoofdstuk V][ref7] en de [artikelen 37, eerste, tweede, derde en vijfde lid][ref8],
      [37a tot en met 38][ref9] en [41][ref10] zijn van overeenkomstige toepassing voor het bepalen van de draagkracht
      alsmede van de eigen bijdrage van de rechtzoekende aan wie een toevoeging met het oog op mediation is verleend en
      voor het bepalen van de kosten van mediation.

      4 De [artikelen 46][ref11] en [47][ref12] zijn eveneens van overeenkomstige toepassing.


