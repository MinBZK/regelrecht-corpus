  - number: '43'
    text: |-
      1 In de gevallen waarin krachtens een wettelijk voorschrift in het [Wetboek van Strafrecht][ref1] of het
      [Wetboek van Strafvordering][ref2] voor een verdachte, veroordeelde of gewezen verdachte een raadsman door het
      bestuur wordt aangewezen of op last van de rechter door het bestuur wordt toegevoegd, is deze bijstand kosteloos,
      onverminderd het derde lid. De eerste volzin is niet van toepassing op de bijstand die door een aangewezen raadsman
      wordt verleend tijdens het in [artikel 28d van het Wetboek van Strafvordering][ref3] bedoelde verhoor van een
      verdachte van een strafbaar feit waarvoor geen voorlopige hechtenis is toegelaten.

      2 Het eerste lid, eerste volzin, is van overeenkomstige toepassing op rechtsbijstand bedoeld in:

      a. de [artikelen 24, derde lid][ref4], en [45a, tweede en derde lid, van de Uitleveringswet][ref5];

      b. [artikel 100 van de Vreemdelingenwet 2000][ref6];

      c. [artikel 65, eerste lid, van de Penitentiaire beginselenwet][ref7];

      d. [artikel 70, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref8];

      e. de [artikelen 52, derde lid][ref9], en
      [64, tweede en derde lid, van de Wet overdracht tenuitvoerlegging strafvonnissen][ref10];

      f. de [artikelen 1:7, eerste en tweede lid van de Wet verplichte geestelijke gezondheidszorg][ref11];

      g. [artikel 62, eerste lid, van de Beginselenwet verpleging ter beschikking gestelden][ref12];

      h. [artikel 5 van de Wet tijdelijk huisverbod][ref13];

      i. [artikel 38, derde lid][ref14], en
      [56d, zesde lid, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref15];

      j. de [artikelen 24, derde lid][ref16], en [43a, tweede en derde lid, van de Overleveringswet][ref17];

      k. de [artikelen 2:19, zesde lid][ref18], [2:20, tweede lid][ref19], en
      __REF002___________________________________________________________________________________________________________
      ____________.

      3 Indien een raadsman is aangewezen krachtens [artikel 39][ref21], [40][ref22] of
      [41 van het Wetboek van Strafvordering][ref23] en indien de uitspraak tegen de veroordeelde onherroepelijk is
      geworden, kan het bestuur het bedrag ter hoogte van de vergoeding, bedoeld in [artikel 37][ref24], vorderen van
      de veroordeelde wiens financiële draagkracht de in [artikel 34][ref25] genoemde bedragen overschrijdt. Omtrent
      de verplichting tot betaling door de veroordeelde zijn de [artikelen 25, derde tot en met vijfde lid][ref26],
      [34a][ref27], [34b][ref28], [34c][ref29] en [34d][ref30] van overeenkomstige toepassing, met dien verstande dat
      onder «de rechtzoekende» steeds wordt verstaan: de veroordeelde. Bij gebreke van volledige betaling kan het bestuur
      na een aanmaning als bedoeld in [artikel 4:112 van de Algemene wet bestuursrecht][ref31] het bedrag invorderen bij
      dwangbevel als bedoeld in [artikel 4:114 van de Algemene wet bestuursrecht][ref32].

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in het derde lid.


