  - number: '34'
    text: |-
      1 Rechtsbijstand overeenkomstig de bepalingen van deze wet wordt verleend aan hen wier inkomen per jaar € 21 800 of
      minder bedraagt, indien zij alleenstaand zijn, dan wel, indien zij met één of meer anderen een gemeenschappelijke
      huishouding voeren, ten hoogste € 31 000 .

      2 In afwijking van het bepaalde in het eerste lid wordt geen rechtsbijstand verleend, indien
      de rechtzoekende beschikt over een vermogen dat meer bedraagt dan het drempelbedrag, genoemd in
      [artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1].

      3 Bij de vaststelling van het inkomen en vermogen van de rechtzoekende worden, behoudens het geval van onderling
      tegenstrijdige belangen, mede in aanmerking genomen het inkomen en vermogen van:

      a. de echtgenoot of geregistreerde partner van de rechtzoekende, tenzij deze op het moment van de aanvraag duurzaam
      van hem gescheiden leeft;

      b. de persoon van verschillend of gelijk geslacht met wie de rechtzoekende duurzaam een gezamenlijke huishouding
      voert, tenzij tussen deze en de rechtzoekende op het moment van de aanvraag een bloedverwantschap in de eerste of
      tweede graad bestaat.

      4 De inkomensgrenzen, bedoeld in het eerste lid, worden jaarlijks per 1 januari aangepast met het percentage
      waarmee het indexcijfer van de lonen op 31 oktober van het voorgaande jaar afwijkt van het overeenkomstige
      indexcijfer op 31 oktober in het daaraan voorafgaande jaar, met dien verstande dat afronding plaatsvindt op het
      naastliggende veelvoud van EUR 100,-. Onze Minister maakt jaarlijks de geïndexeerde bedragen bekend door publicatie
      in de Staatscourant. Bij algemene maatregel van bestuur wordt bepaald wat onder het indexcijfer van de lonen,
      bedoeld in de eerste volzin, wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9.4a
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 9.4a
  - number: 34a
    text: |-
      1 Het inkomen van de rechtzoekende is het inkomensgegeven in het peiljaar. Voor zover van de rechtzoekende
      geen inkomensgegeven beschikbaar is, wordt onder inkomen verstaan het bedrag dat in het peiljaar het inkomen
      zo goed mogelijk benadert, dan wel het door het bestuur op grond van door de rechtzoekende overgelegde gegevens
      vastgestelde bedrag aan inkomen. Indien een inkomensgegeven over het peiljaar beschikbaar is dat afwijkt van
      het eerder toegepaste inkomensgegeven of het bedrag, bedoeld in de tweede volzin, en dat gevolg heeft voor
      het al dan niet verlenen van een toevoeging of de hoogte van de door de rechtzoekende verschuldigde eigen
      bijdrage, neemt het bestuur ambtshalve een besluit dat in de plaats komt van het eerder genomen besluit.
      [Artikel 34d, eerste lid, derde volzin][ref1], is van toepassing.

      2 Indien op grond van het ambtshalve besluit van het bestuur, bedoeld in het eerste lid, de rechtzoekende een
      hogere eigen bijdrage verschuldigd is, is hij hetgeen meer moet worden betaald verschuldigd aan het bestuur. Is
      de rechtzoekende een lagere eigen bijdrage of geen eigen bijdrage verschuldigd, dan kan hij het teveel betaalde
      vorderen van het bestuur. Over de te betalen of te vorderen bedragen worden geen renten en kosten vergoed.
      [Artikel 34f][ref2] is van overeenkomstige toepassing.

      3 Het vermogen is het vermogen in het peiljaar. Het eerste lid is van overeenkomstige toepassing.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven voor de vaststelling van het voor de
      financiële draagkracht in aanmerking te nemen inkomen en vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34d
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34f
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel34a
