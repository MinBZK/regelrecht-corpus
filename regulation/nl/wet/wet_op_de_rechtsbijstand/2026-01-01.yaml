  - number: '24'
    text: |-
      1 Het bestuur beslist op de aanvraag om een toevoeging ten behoeve van:

      a. rechtsbijstand door een advocaat;

      b. rechtsbijstand door een medewerker die in dienstbetrekking is bij een voorziening, tenzij het betreft een
      medewerker van de voorziening, bedoeld in [artikel 7, tweede lid][ref1], of van een voorziening als bedoeld in
      [artikel 8, tweede lid][ref2], voorzover het de verlening van rechtshulp betreft;

      c. rechtsbijstand door personen, bedoeld in [artikel 13, eerste lid, onder c][ref3].

      2 De rechtsbijstandverlener dient mede namens de rechtzoekende, een aanvraag om een toevoeging in bij een
      vestiging van de raad in het ressort waar de rechtsbijstandverlener kantoor houdt. De aanvraag wordt mede namens de
      rechtzoekende, ondertekend door de rechtsbijstandverlener.

      3 De aanvraag om een toevoeging bevat een genoegzame omschrijving van de feiten en omstandigheden betreffende
      het rechtsprobleem waarvoor rechtsbijstand wordt gevraagd, de aan te voeren gronden dan wel een aanduiding van de
      werkzaamheden op basis van de toevoeging die ter zake van het rechtsprobleem nodig worden geacht.

      4 De rechtsbijstandverlener kan slechts met instemming van het bestuur de toevoeging weigeren. Zolang de toevoeging
      niet is gewijzigd of ingetrokken, is hij verplicht de nodige rechtsbijstand te verlenen.

      5 De toevoeging vermeldt een omschrijving van het rechtsbelang terzake waarvan de toevoeging is verleend. Het
      besluit vermeldt tevens het bedrag van de eigen bijdrage die op de voet van het bepaalde in [artikel 35][ref4]
      is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel35
