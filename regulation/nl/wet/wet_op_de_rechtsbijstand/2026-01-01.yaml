  - number: '44'
    text: |-
      1 Aan personen die zich krachtens het [Wetboek van Strafrecht][ref1] of het [Wetboek van Strafvordering][ref2] door
      een raadsman kunnen doen bijstaan, kan het bestuur een advocaat toevoegen.

      2 De eigen bijdrage is niet verschuldigd, indien een zaak eindigt zonder de toepassing van een
      straf of maatregel dan wel zonder toepassing van [artikel 9a Wetboek van Strafrecht][ref3]. De
      eigen bijdrage is evenmin verschuldigd voor de behandeling van het beroep in cassatie als bedoeld in
      [Titel III van het Derde Boek van het Wetboek van Strafvordering][ref4] van de verdachte wiens vrijheid krachtens
      een bevel tot voorlopige hechtenis is benomen, of in een procedure tot herziening ten voordele als bedoeld in de
      [Achtste Titel van het Derde Boek van het Wetboek van Strafvordering][ref5] in geval de gewezen verdachte krachtens
      de onherroepelijke rechterlijke uitspraak zijn vrijheid is benomen. De rechtsbijstandverlener restitueert de eigen
      bijdrage aan de rechtzoekende, tenzij deze de eigen bijdrage nog niet heeft voldaan.

      3 Het bestuur is bevoegd geen eigen bijdrage op te leggen bij de toevoeging van een raadsman aan hen
      die zich anders dan als verdachte of veroordeelde krachtens het [Wetboek van Strafrecht][ref6] of
      [Wetboek van Strafvordering][ref7] laten bijstaan.

      4 Ongeacht de draagkracht is rechtsbijstand aan een slachtoffer van een seksueel misdrijf of een
      geweldsmisdrijf onderscheidenlijk aan een nabestaande van een slachtoffer van een zodanig misdrijf,
      indien het slachtoffer als gevolg van dat misdrijf is overleden, kosteloos, indien in de desbetreffende
      zaak vervolging is ingesteld en het slachtoffer onderscheidenlijk de nabestaande overeenkomstig
      [artikel 3 van de Wet schadefonds geweldsmisdrijven][ref8] in aanmerking komt voor een uitkering.


