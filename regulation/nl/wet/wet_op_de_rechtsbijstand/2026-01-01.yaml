  - number: 23i
    text: |-
      1 In het geval waarin de richtlijn van toepassing is, wordt aan de rechtzoekende, die op de dag van het
      indienen van de aanvraag om verlening van rechtsbijstand met het oog op de behandeling van de zaak in een
      andere lidstaat dan Nederland, zijn rechtmatige woonplaats of rechtmatige gewone verblijfplaats als bedoeld in
      [artikel 23b, derde lid][ref1], in Nederland heeft, rechtsbijstand verleend totdat de aanvraag om verlening van
      rechtsbijstand in overeenstemming met voornoemde richtlijn is ontvangen door de bevoegde autoriteit van de lidstaat
      waar de zaak verder zal worden behandeld.

      2 [Artikel 23b, derde lid][ref2], is van toepassing.

      3 In de gevallen, bedoeld in het eerste lid, wordt rechtsbijstand uitsluitend niet verleend, indien de daartoe
      strekkende aanvraag kennelijk van elke grond is ontbloot.

      4 De verlening van rechtsbijstand, bedoeld in het eerste lid, omvat uitsluitend de verlening van rechtshulp of de
      verlening van een adviestoevoeging

      5 Het bestuur zendt de aanvraag binnen vijftien dagen nadat de aanvraag en de daarbij begeleidende stukken zijn
      vertaald naar de bevoegde autoriteit in de lidstaat waar de zaak zal worden behandeld, tenzij de rechtsbijstand
      op grond van het derde lid niet is verleend. Het bestuur draagt zorg voor de vertaling van de aanvraag en van de
      vereiste begeleidende stukken zo spoedig mogelijk na ontvangst van de aanvraag. De kosten van de vertaling komen
      voor rekening van het bestuur.

      6 De rechtzoekende is geen kosten verschuldigd voor de handelingen van het bestuur, bedoeld in het vijfde lid.
      Indien de bevoegde autoriteit in de lidstaat waar de zaak zal worden behandeld de aanvraag om verlening van
      rechtsbijstand afwijst, is de rechtzoekende de kosten van vertaling verschuldigd aan het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel23i
