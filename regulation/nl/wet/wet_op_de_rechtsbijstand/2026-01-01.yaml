  - number: '14'
    text: |-
      Alle in Nederland kantoor houdende advocaten die daartoe een aanvraag hebben ingediend, worden door het bestuur
      ingeschreven indien zij voldoen aan de in [artikel 15][ref1] bedoelde voorwaarden. Het bestuur kan regels stellen
      met betrekking tot deze voorwaarden. Deze regels behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel15
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '15'
    text: |-
      De door het bestuur te stellen regels met betrekking tot de voorwaarden kunnen betrekking hebben op:

      a. het minimum en het maximum aantal zaken waarvoor een advocaat jaarlijks zal worden toegevoegd;

      b. de deskundigheid van de advocaat op bepaalde rechtsgebieden;

      c. de organisatie van het kantoor waar de advocaat werkzaam is;

      d. de verslaglegging door de advocaat omtrent de door hem verleende rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel15
  - number: '16'
    text: |-
      In bijzondere gevallen kan het bestuur beslissen dat rechtsbijstand zal worden verleend door een niet ingeschreven
      advocaat.

      Als bijzonder geval kan worden aangemerkt:

      a. de uitdrukkelijke en gemotiveerde wens van de rechtzoekende, door een bepaalde advocaat te worden bijgestaan;

      b. de behoefte aan bijstand door een advocaat die over specifieke deskundigheid op een bepaald rechtsgebied
      beschikt.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel16
  - number: '17'
    text: |-
      1 De inschrijving wordt door het bestuur doorgehaald bij verlies van de hoedanigheid van advocaat.

      2 Voorts kan het bestuur de inschrijving doorhalen:

      a. indien de advocaat niet voldaan heeft dan wel niet langer voldoet aan de voor de inschrijving gestelde
      voorwaarden;

      b. indien naar zijn oordeel genoegzaam is gebleken dat de rechtsbijstandverlening door de advocaat niet voldoet aan
      redelijkerwijs te stellen eisen van doelmatigheid of zorgvuldigheid;

      c. indien aan de advocaat een maatregel is opgelegd als bedoeld in
      [artikel 48, tweede lid, onder a tot en met c, van de Advocatenwet][ref1] dan wel [artikel 60aa, tweede lid][ref2];

      d. indien naar zijn oordeel genoegzaam is gebleken dat de advocaat herhaaldelijk onjuiste informatie heeft
      verstrekt ten behoeve van het vaststellen van de vergoeding;

      e. indien de advocaat niet voldoet aan de eisen gesteld aan de wijze van indiening van een aanvraag om een
      toevoeging;

      f. indien de advocaat niet voldoet aan de eisen gesteld aan de inrichting en de wijze van indiening van een
      aanvraag om vaststelling van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60aa
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
      - id: ref2
