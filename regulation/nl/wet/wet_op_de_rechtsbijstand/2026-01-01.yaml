  - number: 34f
    text: |-
      1 De rechtzoekende is het bedrag dat in het kader van de verlening van rechtsbijstand door het bestuur is betaald
      aan de rechtsbijstandverlener verschuldigd aan het bestuur, indien de rechtzoekende op grond van het besluit,
      bedoeld in [artikel 34d, eerste lid][ref1], geen recht heeft op de verlening van rechtsbijstand.

      2 Het bestuur vordert het bedrag, bedoeld in het eerste lid, van de rechtzoekende, tenzij zwaarwegende
      omstandigheden zich daartegen verzetten.

      3 Bij het vaststellen van de termijn of de termijnen waarbinnen moet worden betaald, houdt het bestuur rekening met
      de draagkracht van de rechtzoekende.

      4 Bij gebreke van volledige betaling kan het bestuur na een aanmaning als bedoeld in
      [artikel 4:112 van de Algemene wet bestuursrecht][ref2] invorderen bij dwangbevel als bedoeld in
      [artikel 4:114 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34d
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4112
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4114
