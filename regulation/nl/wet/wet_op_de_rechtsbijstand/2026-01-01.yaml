  - number: 34g
    text: |-
      1 Tenzij zwaarwegende omstandigheden zich daartegen verzetten, wordt de toevoeging met terugwerkende kracht
      ingetrokken, indien:

      a. de rechtzoekende de kosten van rechtsbijstand kan verhalen op een derde, of

      b. op het moment van de definitieve afhandeling van de zaak waarvoor die toevoeging was verleend de rechtzoekende
      als resultaat van die zaak een vordering met betrekking tot een geldsom ter hoogte van tenminste 50% van het
      drempelbedrag, genoemd in [artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001](onbekend)
      heeft.

      2 Het eerste lid, onder b, is niet van toepassing in zaken betreffende het strafrecht en het vreemdelingenrecht.

      3 [Artikel 34a, tweede lid, tweede, derde en vierde volzin][ref1], en
      [artikel 34d, eerste lid, derde volzin][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34d
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel34g
