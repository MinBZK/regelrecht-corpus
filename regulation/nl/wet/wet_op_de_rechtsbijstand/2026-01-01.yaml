  - number: '13'
    text: |-
      1 Onverminderd het tweede lid wordt rechtsbijstand verleend door:

      a. door het bestuur ingeschreven advocaten;

      b. medewerkers van een voorziening voorzover belast met de verlening van rechtsbijstand;

      c. notarissen, onverminderd het bepaalde in [artikel 56 van de Wet op het notarisambt][ref1], gerechtsdeurwaarders
      en anderen met wie de raad een overeenkomst is aangegaan tot het verlenen van rechtsbijstand op bepaalde
      rechtsgebieden.

      2 Rechtshulp wordt uitsluitend verleend door medewerkers die in dienstbetrekking zijn bij de voorziening, bedoeld
      in [artikel 7, tweede lid][ref2], of bij een voorziening als bedoeld in [artikel 8, tweede lid][ref3], voorzover
      deze belast is met het verlenen van rechtshulp, of door anderen met wie de raad in overeenstemming met de regels,
      bedoeld in het derde lid, een overeenkomst is aangegaan tot het verlenen van rechtshulp.

      3 Het bestuur stelt regels met betrekking tot het aangaan van de in het eerste lid, onder c, en tweede lid bedoelde
      overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel8
