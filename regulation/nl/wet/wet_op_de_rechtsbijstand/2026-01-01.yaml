  - number: '2'
    text: |-
      1 Er is een raad voor rechtsbijstand.

      2 De raad heeft zijn zetel te Utrecht en vestigingen in een of meer bij algemene maatregel van bestuur aan te
      wijzen plaatsen in elk ressort.

      3 De raad bezit rechtspersoonlijkheid.

      4 De raad heeft een bestuur en een raad van advies.

      5 Het bestuur kan na goedkeuring van Onze Minister een nevenvestiging openen.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 Aan het hoofd van de raad voor rechtsbijstand staat het bestuur. Het bestuur vertegenwoordigt de raad in en
      buiten rechte.

      2 Het bestuur bestaat uit ten hoogste drie leden, waaronder een voorzitter. Het lidmaatschap van het bestuur is
      onverenigbaar met het lidmaatschap van de raad van advies.

      3 De leden van het bestuur worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen na afloop van
      deze periode aansluitend tweemaal opnieuw worden herbenoemd voor een termijn van ten hoogste vier jaren. Onze
      Minister wijst de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het bestuur besluit met volstrekte meerderheid van uitgebrachte stemmen. Elk lid heeft één stem. Indien de
      stemmen staken beslist de voorzitter.

      2 Het bestuur stelt bij reglement in ieder geval regels omtrent zijn werkwijze, procedures en besluitvorming
      alsmede de vertegenwoordiging van het bestuur, bedoeld in [artikel 3, eerste lid][ref1].

      3 Het bestuur verstrekt, onverminderd zijn verplichtingen jegens Onze Minister ingevolge
      [artikel 20 van de Kaderwet][ref2], desgevraagd inlichtingen aan de raad van advies. Artikel 20 van de Kaderwet is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel20
