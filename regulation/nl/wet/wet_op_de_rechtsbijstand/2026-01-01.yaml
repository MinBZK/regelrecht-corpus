        afdeling: '1'
  - number: '35'
    text: |-
      1 Tenzij bij algemene maatregel van bestuur anders is bepaald, is de rechtzoekende een eigen bijdrage verschuldigd
      voor de verlening van rechtsbijstand.

      2 De regels omtrent de eigen bijdrage, alsmede de hoogte van de eigen bijdrage worden bij algemene maatregel van
      bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel35
  - number: '36'
    text: |-
      Aan rechtspersonen wordt overeenkomstig de bepalingen van deze wet rechtsbijstand verleend, indien van de
      rechtspersoon redelijkerwijze niet verwacht kan worden dat deze de kosten van rechtsbijstand betaalt uit eigen
      vermogen of inkomsten, waaronder begrepen bijdragen van leden of betrokkenen, alsmede subsidies van de overheid.
      [Artikel 35][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: '37'
    text: |-
      1 Het bestuur verstrekt aan een rechtsbijstandverlener een subsidie, genoemd vergoeding, voor:

      a. de door hem op basis van een toevoeging verleende rechtsbijstand;

      b. de door hem verleende rechtsbijstand in een zaak waarin een rechtsbijstandverlener rechtsbijstand heeft verleend
      in het kader van een door het bestuur getroffen regeling voor het beurtelings verlenen van rechtsbijstand in bij
      algemene maatregel van bestuur aan te wijzen zaken.

      2 De vergoeding omvat mede de bij algemene maatregel van bestuur aan te wijzen overige kosten die verband houden
      met de verlening van rechtsbijstand alsmede de omzetbelasting die over de vergoeding is verschuldigd.

      3 De voor de rechtzoekende vastgestelde eigen bijdrage wordt op de in het eerste lid bedoelde vergoeding in
      mindering gebracht.

      4 Aan ingeschreven advocaten wordt periodiek een voorschot toegekend.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden vastgesteld met betrekking tot:

      a. het bedrag van de vergoeding en de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag van de vergoeding en de besluitvorming daarover;

      c. de voorwaarden waaronder de vergoeding wordt verleend;

      d. de verplichtingen van de rechtsbijstandverlener;

      e. de vaststelling van de vergoeding;

      f. de wijziging van de vergoeding;

      g. de verlening van voorschotten;

      h. de betaling van de vergoeding;

      i. de naleving.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel37
  - number: 37a
    text: |-
      Indien een rechtspersoon een gehele of gedeeltelijke geldelijke bijdrage ontvangt voor de verlening van
      rechtskundige diensten, worden aan een advocaat die een privaatrechtelijke of publiekrechtelijke dienstbetrekking
      heeft bij deze rechtspersoon geen vergoeding verstrekt voorzover de door hem op basis van een toevoeging verleende
      rechtsbijstand redelijkerwijs kan worden aangemerkt als een rechtskundige dienst waarvoor een geldelijke bijdrage
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel37a
  - number: 37b
    text: |-
      1 Het bestuur kan aan een rechtsbijstandverlener of een samenwerkingsverband van rechtsbijstandverleners ten
      behoeve van de verlening van rechtsbijstand subsidie verstrekken voor bijzondere doeleinden en projecten.

      2 Het bestuur kan een subsidieplafond vaststellen voor de activiteiten waarvoor subsidie kan worden verstrekt.

      3 Het bestuur stelt regels vast voor de verstrekking van subsidies als bedoeld in het eerste lid.

      4 Deze regels bevatten in ieder geval:

      a. een uitwerking van de activiteiten die voor subsidie in aanmerking komen;

      b. een nadere omschrijving van aan de subsidie verbonden verplichtingen;

      c. de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;

      d. de aan de subsidie verbonden verplichtingen;

      e. de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht moet worden genomen;

      f. de wijze waarop en de termijn waarbinnen het beschikbare bedrag wordt verdeeld.

      5 De door het bestuur te stellen regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel37b
  - number: 37c
    text: |-
      Het bestuur kan met het oog op de verlening van rechtsbijstand een subsidie verstrekken voor bijzondere doeleinden
      en projecten. [Artikel 37b, tweede tot en met vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37b
        hoofdstuk: V
        afdeling: '2'
  - number: '38'
    text: |-
      1 De rechtzoekende is de hem opgelegde eigen bijdrage van rechtswege verschuldigd aan degene die hem de
      rechtsbijstand verleent. Voor het overige is hij geen vergoeding verschuldigd, behoudens voor kosten die meer in
      het bijzonder ten behoeve van zijn zaak zijn gemaakt, voor zover die op grond van [artikel 41][ref1] aan hem in
      rekening mogen worden gebracht.

      2 De ingevolge [artikel 35][ref2] verschuldigde eigen bijdrage bedraagt niet meer dan het bedrag van de vergoeding
      waarop de rechtsbijstandverlener ingevolge [artikel 37][ref3] recht heeft.

      3 De rechtsbijstandverlener licht de rechtzoekende vooraf zo goed mogelijk in over de kosten die voor hem aan de te
      verlenen rechtsbijstand verbonden zijn. Hij kan ter verzekering van de inning van de eigen bijdrage en de overige
      aan de zaak verbonden kosten die voor rekening van de rechtzoekende komen, verlangen dat de rechtzoekende een
      voorschot betaalt.

      4 Indien de rechtzoekende weigerachtig blijft de door hem aan de rechtsbijstandverlener verschuldigde bijdrage en
      vergoeding voor de kosten te voldoen, wordt het bedrag daarvan nader vastgesteld door de president van de rechtbank
      van het arrondissement waarin de rechtsbijstandverlener is gevestigd.

      5 De in het eerste lid bedoelde eigen bijdrage is van rechtswege verschuldigd aan de voorziening die door het
      bestuur is getroffen voor de verlening van rechtsbijstand, indien de rechtsbijstand door medewerkers van die
      voorziening is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel37
