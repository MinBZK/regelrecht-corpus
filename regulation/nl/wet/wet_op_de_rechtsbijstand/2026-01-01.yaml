  - number: '29'
    text: |-
      1 Een afschrift van het besluit tot toevoeging wordt zo spoedig mogelijk, doch in ieder geval voordat de
      einduitspraak is gedaan, overgelegd aan de rechter voor wie de zaak dient.

      2 Indien op grond van de [Algemene wet bestuursrecht][ref1] bezwaar of administratief beroep wordt ingesteld en
      de belanghebbende een verzoek om een kostenvergoeding doet, wordt een afschrift van het besluit tot toevoeging
      zo spoedig mogelijk, doch in ieder geval voordat het bestuursorgaan op het bezwaar heeft beslist dan wel het
      beroepsorgaan op het beroep heeft beslist, overgelegd aan dat bestuurs- of beroepsorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '30'
    text: |-
      1 In spoedeisende gevallen verleent het bestuur een voorlopige toevoeging. Het bestuur beslist zo spoedig mogelijk
      daarna over definitieve toevoeging; dit besluit treedt met terugwerkende kracht in de plaats van die tot verlening
      van een voorlopige toevoeging.

      2 Bij de verlening van de voorlopige toevoeging stelt het bestuur de aanvrager overeenkomstig
      [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] een termijn, waarbinnen deze de voor de
      beoordeling van zijn aanvraag om een definitieve toevoeging van belang zijnde gegevens moet hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '32'
    text: |-
      De toevoeging geldt uitsluitend voor het rechtsbelang ter zake waarvoor zij is verleend en, in het geval van
      een procedure, voor de behandeling daarvan in één instantie, de tenuitvoerlegging van de rechterlijke uitspraak
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel32
  - number: '33'
    text: |-
      1 Het bestuur kan de toevoeging, anders dan op verlangen van de aanvrager, wijzigen, beëindigen of intrekken,
      indien:

      a. deze is verleend op grond van onjuiste of onvolledige gegevens omtrent de aard of het belang van de zaak, de
      financiële draagkracht of de woonplaats van de aanvrager;

      b. de aanvrager de voor een goede behartiging van zijn zaak noodzakelijke medewerking weigert;

      c. de aanvrager in gebreke blijft de door hem verschuldigde eigen bijdrage en overige kosten die voor zijn rekening
      komen, dan wel een hem daarop gevraagd voorschot, te voldoen;

      d. blijkt dat een andere toevoeging mede omvat het rechtsbelang waarvoor de toevoeging is verleend.

      2 De toegevoegde rechtsbijstandverlener kan zich na beëindiging of intrekking van de toevoeging aan de zaak
      onttrekken.

      3 Indien de toevoeging wordt beëindigd of ingetrokken op grond van een situatie als bedoeld in
      het eerste lid, onder a, kan het bestuur het bedrag ter hoogte van de vergoeding, bedoeld in
      [artikel 37][ref1], vorderen van de rechtzoekende, tenzij de verlening van de vergoeding op grond van
      [artikel 4:48, eerste lid, onder c of d, van de Algemene wet bestuursrecht][ref2] is ingetrokken of gewijzigd
      of de vergoeding op grond van [artikel 4:46, tweede lid, onder c of d, van de Algemene wet bestuursrecht][ref3]
      lager is vastgesteld dan wel de vaststelling van de vergoeding op grond van
      [artikel 4:49, eerste lid, onder b, van die wet][ref4] is ingetrokken of ten nadele van de rechtsbijstandverlener
      is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel448
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel446
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel449
