  - number: 44a
    text: |-
      1 Indien een verdachte in een strafzaak is bijgestaan door een raadsman die op het moment van de verlening van
      rechtsbijstand is toegevoegd, wordt met uitzondering van de vergoeding van de eigen bijdrage, geen kostenvergoeding
      van een raadsman als bedoeld in [artikel 530, tweede lid, van het Wetboek van Strafvordering][ref1] toegekend,
      tenzij de toevoeging, anders dan na een daartoe ingediende aanvraag, wordt ingetrokken of beëindigd.

      2 In het geval op last van de rechter een raadsman is toegevoegd, wordt overeenkomstig het eerste lid geen
      kostenvergoeding toegekend, indien de toevoeging op of na de uitspraak van de rechter na een daartoe ingediend
      verzoek van de verdachte bij de rechterlijke instantie die een last heeft verstrekt, wordt ingetrokken of
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel530
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel44a
