  - number: 34c
    text: |-
      1 Indien in het jaar waarin de aanvraag om een toevoeging is gedaan sprake is van een terugval in het inkomen
      of vermogen, neemt het bestuur op aanvraag van de rechtzoekende een besluit dat is gebaseerd op het inkomen of
      vermogen in het jaar waarin de aanvraag om een toevoeging is gedaan. [Artikel 25, derde en vierde lid][ref1], is
      van overeenkomstige toepassing.

      2 Onder terugval van inkomen of vermogen wordt verstaan een vermindering van het inkomen of vermogen met ten minste
      15% ten opzichte van het peiljaar.

      3 De aanvraag wordt bij het bestuur ingediend binnen zes weken na de bekendmaking van het besluit waarin is beslist
      op de aanvraag om een toevoeging.

      4 Bij de aanvraag wordt overgelegd een verklaring waarin de oorzaak van de inkomens- of vermogensdaling wordt
      toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel25
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '25'
        hoofdstuk: IV
  - number: 34d
    text: |-
      1 Indien het bestuur de aanvraag, bedoeld in [artikel 34c, eerste lid][ref1], niet heeft afgewezen, neemt het
      bestuur indien een inkomensgegeven over het jaar van de aanvraag beschikbaar is dat afwijkt van het eerder
      toegepaste inkomensgegeven of het bedrag, bedoeld in [artikel 34a, eerste lid][ref2], tweede volzin, en dat gevolg
      heeft voor het al dan niet verlenen van een toevoeging of de hoogte van de door de rechtzoekende verschuldigde
      eigen bijdrage, ambtshalve een besluit dat in de plaats komt van het eerder genomen besluit, bedoeld in
      [artikel 34c][ref3], eerste lid, met dien verstande dat dit besluit niet van een hoger inkomensgegeven uitgaat
      dan zou zijn toegepast in het peiljaar, bedoeld in [artikel 34a, eerste lid][ref4]. De vorige volzin is van
      overeenkomstige toepassing op het vermogen in het jaar van de aanvraag. Het besluit heeft geen gevolg voor de
      beschikking tot verlening en vaststelling van de vergoeding alsmede voor het recht van de rechtsbijstandverlener om
      de eigen bijdrage die voortvloeit uit de draagkracht zoals berekend in het eerder genomen besluit te vorderen.

      2 [Artikel 34a, tweede lid][ref5], is van overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het bestuur mag beslissen
      tot de verlening van een toevoeging, indien het geschatte inkomen of vermogen de grenzen, genoemd in
      [artikel 34, eerste en tweede lid][ref6], overschrijdt dan wel de terugval in het inkomen of vermogen minder is
      dan 15%. In die gevallen is de eigen bijdrage gelijk aan de ingevolge de algemene maatregel van bestuur, bedoeld in
      [artikel 35, tweede lid][ref7], hoogst mogelijke eigen bijdrage.


