  - number: '42'
    text: |-
      1 Onze Minister verstrekt de raad een subsidie voor de uitvoering van de wettelijke taken van het bestuur en de
      raad van advies.

      2 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet
      van toepassing.

      3 De subsidie wordt per boekjaar verstrekt.

      4 [Afdeling 4.2.8][ref2], met uitzondering van de [artikelen 4:71][ref3] en
      [4:72, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref4] is van toepassing, met dien
      verstande dat:

      a. de overeenkomstig [artikel 26 van de Kaderwet][ref5] toe te zenden begroting betrekking heeft op het boekjaar
      en Onze Minister bij de ingevolge dat artikel vast te stellen datum rekening houdt met de [artikelen 4:60][ref6] en
      [4:61 van de Algemene wet bestuursrecht][ref7];

      b. in afwijking van [artikel 4:63 van de Algemene wet bestuursrecht][ref8] op de inhoud van de begroting de
      [artikelen 27][ref9] en [28 van de Kaderwet][ref10] van toepassing zijn;

      c. het activiteitenverslag, bedoeld in [artikel 4:80 van de Algemene wet bestuursrecht][ref11], wordt opgenomen in
      het jaarverslag, bedoeld in [artikel 18 van de Kaderwet][ref12].


