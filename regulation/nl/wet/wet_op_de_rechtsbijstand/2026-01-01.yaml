  - number: 33a
    text: |-
      Mediation wordt voor de toepassing van deze wet verricht door overeenkomstig [artikel 33b][ref1] ingeschreven
      mediators.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33b
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 33b
        hoofdstuk: IVa
  - number: 33b
    text: |-
      1 Alle in Nederland kantoor houdende mediators die daartoe een aanvraag hebben ingediend, worden door het bestuur
      ingeschreven, indien zij voldoen aan de door het bestuur vastgestelde voorwaarden. Het bestuur kan regels stellen
      met betrekking tot deze voorwaarden. Deze regels behoeven de goedkeuring van Onze Minister.

      2 Het eerste lid is van overeenkomstige toepassing op mediators uit andere lidstaten van de Europese Unie, met
      uitzondering van Denemarken, die geen kantoor houden in Nederland.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel33b
  - number: 33c
    text: |-
      De door het bestuur te stellen regels als bedoeld in [artikel 33b, eerste lid][ref1], met betrekking tot de
      voorwaarden kunnen betrekking hebben op:

      a. de vakbekwaamheidseisen die aan de mediator worden gesteld;

      b. de mate van gebondenheid aan door de beroepsgroep algemeen aanvaarde normen betreffende de beroepsethiek en
      beroepsuitoefening;

      c. de wijze waarop schendingen van de algemene norm betreffende de beroepsethiek en beroepsuitoefening worden
      afgehandeld;

      d. de medewerking door de mediator aan onderzoek naar de werking van mediation en aan evaluatie;

      e. de verslaglegging door de mediator van de door hem verrichte werkzaamheden;

      f. de beroepsaansprakelijkheidsverzekering;

      g. de organisatie van het kantoor waar de mediator werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33b
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 33b
        hoofdstuk: IVa
  - number: 33d
    text: |-
      1 Het bestuur kan de inschrijving doorhalen indien de mediator niet voldaan heeft dan wel niet langer voldoet aan
      de voor de inschrijving gestelde voorwaarden.

      2 [Artikel 17, tweede lid, onder b, d, e en f][ref1], is van overeenkomstige toepassing.


