        artikel: 60aa
  - number: 23a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. richtlijn: de [richtlijn 2003/8/EG](32003L0008) van de Raad van 27 januari 2003 tot verbetering van de toegang
      tot de rechter bij grensoverschrijdende geschillen, door middel van gemeenschappelijke minimumvoorschriften
      betreffende rechtsbijstand bij die geschillen;

      b. lidstaat: lidstaat van de Europese Unie met uitzondering van Denemarken.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel23a
  - number: 23b
    text: |-
      1 De bepalingen van deze afdeling zijn uitsluitend van toepassing op de verlening van rechtsbijstand aan een
      natuurlijk persoon in een grensoverschrijdend geschil op het terrein van het burgerlijk recht of het handelsrecht
      die zijn rechtmatige woonplaats of rechtmatige gewone verblijfplaats heeft in een andere lidstaat.

      2 Onder een grensoverschrijdend geschil wordt verstaan een geschil waarbij op de dag van het indienen van
      de aanvraag om verlening van rechtsbijstand met het oog op de behandeling van de zaak in Nederland of de
      tenuitvoerlegging van de beslissing in die zaak in Nederland, de rechtzoekende zijn rechtmatige woonplaats of
      rechtmatige gewone verblijfplaats heeft in een andere lidstaat.

      3 Om vast te stellen of een rechtzoekende woonplaats heeft in Nederland wordt Nederlands recht toegepast. Indien de
      rechtzoekende geen woonplaats heeft in Nederland, wordt voor de vaststelling of betrokkene een woonplaats heeft in
      een andere lidstaat het recht van die lidstaat toegepast.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel23b
  - number: 23c
    text: |-
      1 Indien de bijzondere feitelijke of juridische ingewikkeldheid van het geval of de gelijkheid van de partijen dat
      vereist, kan, in afwijking van [artikel 12, tweede lid, onder g][ref1], rechtsbijstand worden verleend.

      2 Het eerste lid is van overeenkomstige toepassing, indien het bestuur een toevoeging verleent op last van de
      rechter.

      3 Rechtsbijstand behoeft niet te worden verleend, indien de rechtzoekende in het betrokken geschil
      daadwerkelijk toegang heeft tot andere regelingen voor de dekking van de kosten van rechtsbijstand alsmede de in
      [artikel 23e][ref2] bedoelde kosten.

      4 [Artikel 33, eerste lid, onder c][ref3], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23e
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel33
