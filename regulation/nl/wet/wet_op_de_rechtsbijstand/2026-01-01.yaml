  - number: 24a
    text: |-
      1 Bij algemene maatregel van bestuur kunnen soorten zaken worden aangewezen die worden aangemerkt als zaken waarbij
      de rechtsbijstand bestaat uit het geven van een eenvoudig rechtskundig advies.

      2 Indien blijkt dat de toevoeging in een zaak waarbij de rechtsbijstand bestaat uit het geven van een
      eenvoudig rechtskundig advies, niet toereikend is voor de verlening van rechtsbijstand in die zaak, vraagt de
      rechtsbijstandverlener zo spoedig mogelijk een wijziging van de toevoeging aan.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel24a
  - number: '25'
    text: |-
      1 Voorzover beschikbaar worden bij de aanvraag om een toevoeging in ieder geval het burgerservicenummer van de
      aanvrager en van degenen als bedoeld in [artikel 34, derde lid][ref1], verstrekt.

      2 Indien het een aanvraag betreft van een vreemdeling van wie geen burgerservicenummer beschikbaar is, verstrekt
      Onze Minister op verzoek van het bestuur de gegevens die voor de beoordeling van de aanvraag noodzakelijk zijn.

      3 De inspecteur verstrekt op verzoek van het bestuur het bedrag aan vermogen dat meer bedraagt dan het
      drempelbedrag, genoemd in [artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001](onbekend) van
      de rechtzoekende en van degenen als bedoeld in [artikel 34, derde lid][ref2]. Voor zover van de rechtzoekende of
      van degenen als bedoeld in artikel 34, derde lid, geen vermogens- of inkomensgegeven beschikbaar is, verstrekt de
      inspecteur op verzoek van het bestuur zo mogelijk het bedrag dat in het peiljaar het vermogen of inkomen zo goed
      mogelijk benadert.

      4 In de gevallen waarin de inspecteur niet beschikt over de gegevens over vermogen of inkomen, bedoeld in het
      derde lid, legt de aanvrager stukken over op grond waarvan het bestuur het bedrag aan vermogen of inkomen kan
      vaststellen.

      5 Met het oog op het vaststellen van de financiële draagkracht en van de hoogte van de eigen bijdrage van
      de rechtzoekende worden op verzoek van het bestuur uit de basisregistratie personen inlichtingen verstrekt
      over de rechtzoekende en degenen met wie de rechtzoekende een gezamenlijke huishouding voert als bedoeld in
      [artikel 34, derde lid][ref3].

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de bij de aanvraag over te
      leggen gegevens en bescheiden alsmede omtrent het opvragen van het burgerservicenummer bij degenen wier inkomen of
      vermogen betrokken wordt bij de beoordeling van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel34
