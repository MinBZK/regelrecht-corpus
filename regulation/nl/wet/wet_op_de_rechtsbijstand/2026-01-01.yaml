  - number: 23e
    text: |-
      1 Onverminderd de kosten die op grond van deze wet worden vergoed, worden de hierna te noemen kosten door het
      bestuur aan de rechtzoekende vergoed voorzover die rechtstreeks verband houden met het grensoverschrijdende
      karakter van het geschil en voorzover deze kosten, niet zijnde proceskosten, ten behoeve van de rechtzoekende zijn
      gemaakt en voor rekening van de rechtzoekende komen en door de rechtzoekende zijn betaald:

      a. de kosten van tolken, voorzover deze zijn geregistreerd in het kwaliteitsregister te 's-Hertogenbosch;

      b. de kosten voor de vertaling door een beëdigde vertaler van de voor de afdoening van de zaak benodigde stukken
      die door de rechter of het bestuur worden verlangd en door de rechtzoekende worden overgelegd;

      c. de reiskosten, voorzover bij het voorleggen van de zaak van de aanvrager de aanwezigheid van betrokkenen ter
      zitting bij de wet of door de rechter geboden is en de rechter oordeelt dat de betrokkenen niet anderszins ten
      genoegen van de rechter kunnen worden gehoord, en

      d. vijftig procent van het honorarium van personen die in opdracht van de rechter in de procedure optreden.

      2 Voorzover mogelijk draagt het bestuur zorg voor de vertaling van de stukken, bedoeld in het eerste lid, onder b.

      3 De hoogte van de vergoeding van de reiskosten, bedoeld in het eerste lid, onder c, wordt berekend overeenkomstig
      [artikel 25 van het Besluit vergoedingen rechtsbijstand 2000][ref1].

      4 De hoogte van de vergoeding van het honorarium van de personen, bedoeld in het eerste lid, onder a, b en d, wordt
      berekend overeenkomstig de [Wet griffierechten burgerlijke zaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel23e
