        artikel: '530'
  - number: '47'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet aan de ontvanger van de subsidie
      onderscheidenlijk vergoeding opgelegde verplichtingen zijn belast de bij besluit van Onze Minister aangewezen
      personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      4 Aan door Onze Minister verstrekte subsidies onderscheidenlijk vergoedingen is de verplichting verbonden dat de
      ontvanger van de subsidie onderscheidenlijk vergoeding aan een toezichthouder alle medewerking verleent die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
