  - number: 7a
    text: |-
      1 Het bestuur draagt zorg voor een zo evenwichtig mogelijke spreiding van het aanbod van de verlening van zowel de
      rechtsbijstand als de mediation in de ressorten. Het bestuur is belast met het toezicht op de uitvoering van deze
      taken. Het bestuur draagt tevens zorg voor een zo doelmatig mogelijke besteding van de hem ter beschikking staande
      middelen.

      2 Het bestuur doet jaarlijks aan Onze Minister verslag over de organisatie en de werkzaamheden van de door het
      bestuur getroffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel7a
  - number: 7b
    text: |-
      Op verzoek van een nationale of internationale rechterlijke instantie of een instantie in een ander land kan het
      bestuur een verklaring omtrent het inkomen en vermogen verstrekken dat bij de vaststelling van de draagkracht in
      acht wordt genomen. Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent deze verklaring.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel7b
  - number: '8'
    text: |-
      1 Het bestuur kan voor de uitvoering of voorbereiding van bepaalde werkzaamheden commissies instellen, waarvan ook
      anderen dan leden van het bestuur deel kunnen uitmaken.

      2 Onverminderd [artikel 7, tweede lid][ref1], kan het bestuur met het oog op de uitoefening van zijn taken één of
      meer voorzieningen treffen.

      3 Indien een voorziening wordt getroffen voor de verlening van rechtsbijstand zonder afgifte van een toevoeging,
      wordt de draagkracht bepaald door het inwinnen van informatie bij de betreffende rechtzoekende. Bij of krachtens
      algemene maatregel van bestuur kunnen hieromtrent nadere regels worden gesteld.

      4 Indien de verlening van rechtshulp uitsluitend bestaat uit het verstrekken van informatiemateriaal of uit een
      onmiddellijke verwijzing naar andere instanties dan rechtsbijstandverleners of mediators wordt geen rekening
      gehouden met de draagkracht van de rechtzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
  - number: 8a
    text: |-
      Het bestuur stelt een klachtenregeling vast, waarop een ieder die een klacht heeft over een gedraging van een
      medewerker van een voorziening een beroep kan doen. Deze klachtenregeling behoeft de goedkeuring van Onze Minister.
      De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel8a
  - number: '12'
    text: |-
      1 Rechtsbijstand wordt uitsluitend verleend ter zake van in de Nederlandse rechtssfeer liggende rechtsbelangen
      aan natuurlijke en rechtspersonen wier financiële draagkracht de in [artikel 34][ref1] genoemde bedragen niet
      overschrijdt.

      2 Rechtsbijstand wordt niet verleend indien:

      a. de daartoe strekkende aanvraag kennelijk van elke grond is ontbloot;

      b. de aan de te verlenen rechtsbijstand verbonden kosten niet in redelijke verhouding staan tot het belang van
      de zaak;

      c. de daartoe strekkende aanvraag betrekking heeft op een strafzaak en het op grond van de overtreden norm
      aannemelijk is dat een in verhouding tot het inkomen lage boete zal worden opgelegd;

      d. de daartoe strekkende aanvraag wordt gedaan door een rechtspersoon die is opgericht met het doel om een
      gerechtelijke procedure te voeren;

      e. het rechtsbelang waarop de aanvraag betrekking heeft, de uitoefening van een zelfstandig beroep of bedrijf
      betreft, tenzij:

      1º. voortzetting van het beroep of bedrijf voorzover het niet in de vorm van een rechtspersoon wordt gevoerd,
      afhankelijk is van het resultaat van de aangevraagde rechtsbijstand;

      2º. het beroep of bedrijf ten minste één jaar geleden is beëindigd, de aanvrager in eerste aanleg als verweerder
      bij een procedure is betrokken of betrokken is geweest en de kosten van rechtsbijstand niet op andere wijze kunnen
      worden vergoed, of

      3°. dat rechtsbelang betrekking heeft op benadeling als bedoeld in de [artikelen 17e][ref2] en
      [17ea van de Wet bescherming klokkenluiders][ref3];

      f. het een rechtsbelang betreft dat wordt voorgelegd aan een bij verdrag met rechtspraak belast internationaal
      college of een daarmee vergelijkbaar internationaal college en het college zelf in een aanspraak op vergoeding van
      rechtsbijstand voorziet;

      g. het een belang betreft waarvan de behartiging redelijkerwijze aan de aanvrager zelf kan worden overgelaten, zo
      nodig met bijstand van een andere persoon of instelling van wie onderscheidenlijk waarvan de werkzaamheden niet
      vallen binnen de werkingssfeer van deze wet.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de overeenkomstig het tweede lid
      in acht te nemen criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel17e
      [ref3]: https://wetten.overheid.nl/BWBR0037852#Artikel17ea
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel12
