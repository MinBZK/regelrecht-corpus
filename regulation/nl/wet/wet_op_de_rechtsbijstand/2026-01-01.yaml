  - number: '6'
    text: |-
      1 De raad van advies ziet toe op de algemene gang van zaken in de raad en kan Onze Minister daarover adviseren.

      2 Bij de vervulling van zijn taak richt de raad van advies zich naar het belang van de raad, waaronder het belang
      van de behoorlijke vervulling van de bij of krachtens de wet aan het bestuur opgedragen taken.

      3 De raad van advies stelt bij reglement in ieder geval regels omtrent zijn werkwijze, procedures en
      besluitvorming.
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het bestuur heeft tot taak om:

      a. zorg te dragen voor de organisatie van alsmede de verlening van rechtsbijstand;

      b. zorg te dragen voor de organisatie van alsmede de uitvoering van de mediation alsmede het gebruik van mediation
      te bevorderen.

      2 Het bestuur treft in ieder geval een afzonderlijke voorziening die belast is met de verlening van rechtshulp,
      het bevorderen van het gebruik van mediation, het verwijzen naar een mediator alsmede met het benaderen van de
      wederpartij van de rechtzoekende met het oog op mediation.

      3 Met het oog op de uitvoering van de taken, bedoeld in het eerste lid, heeft het bestuur voorts tot taak:

      a. het nemen van besluiten op aanvragen om verlening van toevoegingen;

      b. de vaststelling en uitbetaling van vergoedingen aan rechtsbijstandverleners en mediators;

      c. de controle op werkzaamheden van rechtsbijstandverleners en mediators, voorzover deze niet elders in deze wet
      aan anderen is opgedragen;

      d. het sluiten van overeenkomsten met ingeschreven advocaten of met personen, bedoeld in
      [artikel 13, eerste lid, onder c][ref1], alsmede met mediators;

      e. de vaststelling van de draagkracht overeenkomstig de bepalingen van deze wet en het zonodig verstrekken van een
      verklaring hieromtrent, voor zover dat bij wettelijk voorschrift is bepaald;

      f. het vergoeden van de in deze wet bedoelde, door de rechtzoekende met een grensoverschrijdend geschil als bedoeld
      in [hoofdstuk IIIa][ref2] gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0006368/2026-01-01#Artikel7
