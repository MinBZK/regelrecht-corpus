  - number: '39'
    text: |-
      Bij de in [artikel 37, vijfde lid][ref1], bedoelde algemene maatregel van bestuur worden regels gesteld voor
      de vergoedingen voor diensten die bij de verlening van rechtsbijstand zijn verricht door deurwaarders en, in
      strafzaken, door tolken, alsmede omtrent betaling van krachtens wettelijk voorschrift of rechterlijk bevel in dag-
      of nieuwsbladen geplaatste oproepingen of aankondigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
