    text: |-
      1 De [artikelen 9][ref1], [11 tot en met 14][ref2], [18][ref3], [20][ref4], [21][ref5], [23][ref6],
      [39, eerste lid][ref7], en [41 van de Kaderwet][ref8] zijn van overeenkomstige toepassing op de raad van advies,
      met dien verstande dat:

      a. onder bezoldiging of schadeloosstelling als bedoeld in [artikel 14 van de Kaderwet][ref9] wordt verstaan:
      vacatiegeld; en

      b. de raad van advies het jaarverslag, bedoeld in [artikel 18, eerste lid, van de Kaderwet][ref10] tezamen met het
      jaarverslag van het bestuur kan uitbrengen.

      2 De raad van advies bestaat uit ten hoogste vijf leden, die voor een periode van ten hoogste vier jaren worden
      benoemd. Zij kunnen na afloop van deze periode aansluitend eenmaal opnieuw worden herbenoemd voor een termijn van
      ten hoogste vier jaren. Onze Minister wijst de voorzitter aan.


