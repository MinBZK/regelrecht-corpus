---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_rechtsbijstand
regulatory_layer: WET
publication_date: '2021-11-26'
valid_from: '2005-03-02'
bwb_id: BWBR0006368
url: https://wetten.overheid.nl/BWBR0006368/2005-03-02
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van artikel 18, tweede lid, van de Grondwet,
    wenselijk is nieuwe wettelijke regels vast te stellen omtrent de verstrekking door de overheid van gefinancierde
    rechtsbijstand aan minder draagkrachtigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: 1.1.a
    text: '*Onze Minister:* Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: 1.1.b
    text: |-
      *raad:* de raad voor rechtsbijstand, bedoeld in [Hoofdstuk II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006368
        hoofdstuk: II
  - number: 1.1.c
    text: '*bureau:* het onder de raad ressorterende bureau rechtsbijstandvoorziening;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: 1.1.d
    text: '*stichting:* de door de raad gesubsidieerde stichting rechtsbijstand;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: 1.1.e
    text: |-
      *rechtsbijstand:* rechtskundige bijstand aan een rechtzoekende ter zake van een rechtsbelang dat hem rechtstreeks
      en individueel aangaat, voor zover in deze wet en de daarop berustende bepalingen geregeld;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: 1.1.f
    text: |-
      *rechtzoekende:* degene die op grond van onvoldoende financiële draagkracht aanspraak kan maken op rechtsbijstand,
      voor zover in deze wet en de daarop berustende bepalingen geregeld, alsmede degene die met het oog op de toepassing
      van [artikel 51a van het Wetboek van Strafvordering][ref1] als benadeelde partij zijn schade wil vorderen;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51a
  - number: 1.1.g
    text: |-
      *jaarplan:* het door de raad op te stellen jaarplan, bedoeld in [artikel 7, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
  - number: 1.1.h
    text: |-
      *rechtsbijstandverlener:* de advocaat, de medewerker van de stichting, bedoeld in [artikel 22, eerste lid][ref1],
      en de personen, bedoeld in [artikel 13, eerste lid onder c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel13
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '22'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: 1.1.i
    text: |-
      *toevoeging:* de toevoeging van een rechtsbijstandverlener, bedoeld in [artikel 24, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel24
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '24'
        hoofdstuk: IV
  - number: 1.1.j
    text: '*inkomen:* het overeenkomstig deze wet vastgestelde netto-inkomen;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: 1.1.k
    text: |-
      *Bijstandsnorm:* de norm voor gehuwden, genoemd in [artikel 21, onderdeel c, van de Wet werk en bijstand][ref1],
      verminderd met het overeenkomstig [artikel 19, derde lid, van die wet][ref2] vastgestelde bedrag van de
      vakantietoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel19
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '19'
  - number: '1.2'
    text: In deze wet en de daarop berustende bepalingen worden onder advocaten mede verstaan procureurs.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen worden onder advocaten mede verstaan de personen, bedoeld in
      [artikel 16h van de Advocatenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
  - number: '2.1'
    text: Er is in elke hoofdplaats van het ressort van een gerechtshof een raad gevestigd.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel2
  - number: '2.2'
    text: De raad heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel2
  - number: '2.3'
    text: Onder de raad ressorteert een bureau rechtsbijstandvoorziening.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel2
  - number: '2.4'
    text: De raad subsidieert binnen zijn ressort een of meer stichtingen rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel2
  - number: '2.5'
    text: |-
      Op de subsidie, die per boekjaar wordt verstrekt, is [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '3.1'
    text: De raad bestaat uit negen leden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden van de raad. Zij worden, de raad
      gehoord, benoemd uit personen die over juridische, financiële, bestuurlijke of maatschappelijke deskundigheid of
      ervaring beschikken.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel3
  - number: '3.3'
    text: Ten hoogste vier leden van de raad kunnen zijn rechtsbijstandverleners in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel3
  - number: '3.4'
    text: De raad wijst uit zijn midden een secretaris en een penningmeester aan.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel3
  - number: '4.1'
    text: De benoeming van de voorzitter en de overige leden van de raad geschiedt voor de tijd van vier jaar.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel4
  - number: '4.2'
    text: |-
      Aftredende leden kunnen eenmaal terstond worden herbenoemd. Leden die in een tussentijdse vacature zijn benoemd
      kunnen tweemaal terstond worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel4
  - number: '5.1'
    text: 'Aan een lid wordt tussentijds ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel5
  - number: 5.1.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel5
  - number: 5.1.b
    text: |-
      indien hij naar het oordeel van de raad wegens geestelijke of lichamelijke gesteldheid moet worden geacht de
      geschiktheid tot het bekleden van het lidmaatschap te missen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel5
  - number: 5.1.c
    text: om zwaarwegende redenen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel5
  - number: '5.2'
    text: Schorsing vindt plaats wegens zwaarwegende redenen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel5
  - number: '6.1'
    text: |-
      De voorzitter en de secretaris, dan wel de directeur, bedoeld in [artikel 11, eerste lid][ref1], tezamen met de
      voorzitter of de secretaris, vertegenwoordigen de raad in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel11
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '11'
        hoofdstuk: II
        afdeling: '3'
  - number: '6.2'
    text: |-
      De leden van de raad genieten voor hun werkzaamheden ten behoeve van de raad een door Onze Minister vast te stellen
      toelage, alsmede vergoeding van reis- en verblijfkosten overeenkomstig de bepalingen welke te dien aanzien voor de
      burgerlijke rijksambtenaren gelden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel6
  - number: 6a
    text: De raad stelt een bestuursreglement vast. Het reglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel6a
  - number: '7.1'
    text: |-
      De raad is belast met de organisatie van de verlening van rechtsbijstand in het ressort en met het toezicht op de
      uitvoering daarvan. De raad draagt zorg voor een zo evenwichtig mogelijke spreiding van het aanbod van de verlening
      van rechtsbijstand in het ressort alsmede voor een zo doelmatig mogelijke besteding van de hem ter beschikking
      staande middelen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
  - number: '7.2'
    text: 'De raad heeft voorts tot taak:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
  - number: 7.2.a
    text: het nemen van besluiten op aanvragen om rechtsbijstand en die om verlening van toevoegingen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
  - number: 7.2.b
    text: de vaststelling en uitbetaling van vergoedingen aan rechtsbijstandverleners;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
  - number: 7.2.c
    text: |-
      de controle op werkzaamheden van rechtsbijstandverleners, voorzover deze niet elders in deze wet aan anderen is
      opgedragen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
  - number: 7.2.e
    text: |-
      het vergoeden van de in deze wet bedoelde, door de rechtzoekende met een grensoverschrijdend geschil als bedoeld in
      [hoofdstuk IIIa][ref1] gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006368
        hoofdstuk: IIIa
  - number: '7.3'
    text: |-
      De raad stelt voor elk kalenderjaar een jaarplan op. Van het jaarplan maken een activiteitenplan en een begroting
      deel uit. Het jaarplan geeft inzicht in de regels die ten grondslag liggen aan het werkplan van de stichting,
      bedoeld in [artikel 23][ref1]. Het jaarplan wordt van kracht zodra Onze Minister ermee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
  - number: '7.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de inrichting van het jaarplan, het beheer en de
      administratie, en omtrent voorzieningen die getroffen zullen worden als niet tijdig met een jaarplan ingestemd
      kan worden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel7
  - number: '8'
    text: |-
      De raad kan voor de uitvoering of voorbereiding van bepaalde werkzaamheden commissies instellen, waarvan ook
      anderen dan leden van de raad deel kunnen uitmaken.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel8
  - number: '9.1'
    text: |-
      De raad brengt jaarlijks verslag uit aan Onze Minister. Van het verslag maken een financieel verslag en
      een activiteitenverslag deel uit. Het activiteitenverslag besteedt aandacht aan de ontwikkeling van de
      rechtsbijstandverlening in het ressort.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel9
  - number: '9.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de inrichting van het verslag.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel9
  - number: '9.3'
    text: |-
      De raad verstrekt Onze Minister alle gewenste inlichtingen zonder dat deze tot individuele rechtzoekenden
      herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel9
  - number: '9.4'
    text: |-
      Indien de raad zijn taken, bedoeld in [artikel 7, eerste en tweede lid][ref1], naar het oordeel van Onze Minister
      ernstig verwaarloost, kan Onze Minister zonodig voorzieningen treffen. Onze Minister doet hiervan terstond
      mededeling aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
  - number: '11.1'
    text: |-
      De directeur, de plaatsvervangend directeur en de overige personeelsleden van het onder de
      raad ressorterende bureau, worden in dienst genomen op arbeidsovereenkomst naar burgerlijk
      recht. De bepalingen van [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1] alsmede
      [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] zijn op deze overeenkomst van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '6'
  - number: '11.2'
    text: Onze Minister kan regels stellen omtrent de inrichting, werkwijze en personeelsformatie van het bureau.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel11
  - number: '12.1'
    text: |-
      Rechtsbijstand wordt uitsluitend verleend ter zake van in de Nederlandse rechtssfeer liggende rechtsbelangen
      aan natuurlijke en rechtspersonen wier financiële draagkracht de in [artikel 34][ref1] genoemde bedragen niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '12.2'
    text: 'Rechtsbijstand wordt niet verleend indien:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.a
    text: de daartoe strekkende aanvraag kennelijk van elke grond is ontbloot;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.b
    text: |-
      de aan de te verlenen rechtsbijstand verbonden kosten niet in redelijke verhouding staan tot het belang van de
      zaak;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.c
    text: |-
      de daartoe strekkende aanvraag betrekking heeft op een strafzaak en het op grond van de overtreden norm aannemelijk
      is dat een in verhouding tot het inkomen lage boete zal worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.d
    text: |-
      de daartoe strekkende aanvraag wordt gedaan door een rechtspersoon die is opgericht met het doel om een
      gerechtelijke procedure te voeren;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.e
    text: |-
      het rechtsbelang waarop de aanvraag betrekking heeft, de uitoefening van een zelfstandig beroep of bedrijf betreft,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.e.1º
    text: |-
      voortzetting van het beroep of bedrijf voorzover het niet in de vorm van een rechtspersoon wordt gevoerd,
      afhankelijk is van het resultaat van de aangevraagde rechtsbijstand, of
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.e.2º
    text: |-
      het beroep of bedrijf ten minste één jaar geleden is beëindigd, de aanvrager in eerste aanleg als verweerder bij
      een procedure is betrokken of betrokken is geweest en de kosten van rechtsbijstand niet op andere wijze kunnen
      worden vergoed.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.f
    text: |-
      het een rechtsbelang betreft dat wordt voorgelegd aan een bij verdrag met rechtspraak belast internationaal
      college of een daarmee vergelijkbaar internationaal college en het college zelf in een aanspraak op vergoeding van
      rechtsbijstand voorziet;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: 12.2.g
    text: |-
      het een belang betreft waarvan de behartiging redelijkerwijze aan de aanvrager zelf kan worden overgelaten, zo
      nodig met bijstand van een andere persoon of instelling van wie onderscheidenlijk waarvan de werkzaamheden niet
      vallen binnen de werkingssfeer van deze wet.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: '12.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de overeenkomstig het tweede lid in
      acht te nemen criteria.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel12
  - number: '13.1'
    text: 'Rechtsbijstand wordt verleend door:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel13
  - number: 13.1.a
    text: door de raad ingeschreven advocaten;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel13
  - number: 13.1.b
    text: medewerkers van de stichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel13
  - number: 13.1.c
    text: |-
      notarissen, onverminderd het bepaalde in [artikel 56 van de Wet op het notarisambt][ref1], gerechtsdeurwaarders
      en anderen met wie de raad een overeenkomst is aangegaan tot het verlenen van rechtsbijstand op bepaalde
      rechtsgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel56
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '56'
  - number: '13.2'
    text: |-
      In het jaarplan worden nadere regels gesteld voor het aangaan van de in het eerste lid onder *c* bedoelde
      overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel13
  - number: '14'
    text: |-
      Alle in het ressort kantoor houdende advocaten die daartoe een aanvraag hebben ingediend, worden door de raad
      ingeschreven indien zij voldoen aan de in [artikel 15][ref1] bedoelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel15
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '15.1'
    text: 'De door de raad te stellen voorwaarden kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel15
  - number: 15.1.a
    text: het minimum en het maximum aantal zaken waarvoor een advocaat jaarlijks zal worden toegevoegd;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel15
  - number: 15.1.b
    text: de deskundigheid van de advocaat op bepaalde rechtsgebieden;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel15
  - number: 15.1.c
    text: de organisatie van het kantoor waar de advocaat werkzaam is;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel15
  - number: 15.1.d
    text: de verslaglegging door de advocaat omtrent de door hem verleende rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel15
  - number: '15.2'
    text: In het jaarplan worden nadere regels gesteld voor de krachtens het eerste lid door de raad te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel15
  - number: '16'
    text: |-
      In bijzondere gevallen kan de raad beslissen dat rechtsbijstand zal worden verleend door een niet ingeschreven
      advocaat. Als bijzonder geval kan worden aangemerkt:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel16
  - number: 16.a
    text: de uitdrukkelijke en gemotiveerde wens van de rechtzoekende, door een bepaalde advocaat te worden bijgestaan;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel16
  - number: 16.b
    text: de behoefte aan bijstand door een advocaat die over specifieke deskundigheid op een bepaald rechtsgebied beschikt.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel16
  - number: '17.1'
    text: De inschrijving wordt door de raad doorgehaald bij verlies van de hoedanigheid van advocaat.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: '17.2'
    text: 'Voorts kan de raad de inschrijving doorhalen:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: 17.2.a
    text: indien de advocaat niet voldaan heeft dan wel niet langer voldoet aan de voor de inschrijving gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: 17.2.b
    text: |-
      indien naar zijn oordeel genoegzaam is gebleken dat de rechtsbijstandverlening door de advocaat niet voldoet aan
      redelijkerwijs te stellen eisen van doelmatigheid of zorgvuldigheid;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: 17.2.c
    text: |-
      indien aan de advocaat een maatregel is opgelegd als bedoeld in
      [artikel 48, tweede lid, onder a tot en met c, van de Advocatenwet][ref1] dan wel
      [artikel 60b, tweede lid, onder a tot en met c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60b
  - number: 17.2.d
    text: |-
      indien naar zijn oordeel genoegzaam is gebleken dat de advocaat herhaaldelijk onjuiste informatie heeft verstrekt
      ten behoeve van het vaststellen van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: 17.2.e
    text: indien de advocaat niet voldoet aan de eisen gesteld aan de wijze van indiening van een aanvraag om een toevoeging;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: 17.2.f
    text: |-
      indien de advocaat niet voldoet aan de eisen gesteld aan de inrichting en de wijze van indiening van een aanvraag
      om vaststelling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel17
  - number: '18.1'
    text: |-
      In elk ressort als bedoeld in [artikel 2][ref1] zijn er één of meer stichtingen rechtsbijstand, waarvan de statuten
      de instemming van de raad behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel2
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '2'
        hoofdstuk: II
        afdeling: '1'
  - number: '18.2'
    text: |-
      Het bestuur van de stichting bestaat uit ten minste drie en ten hoogste vijf personen. Een minderheid van de leden
      van het bestuur kan rechtsbijstandverlener in de zin van deze wet zijn.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel18
  - number: '18.3'
    text: Aan de stichting is een bureau verbonden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel18
  - number: '19.1'
    text: 'De stichting heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel19
  - number: 19.1.a
    text: het verzorgen van spreekuren;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel19
  - number: 19.1.b
    text: |-
      het verzorgen van verdergaande rechtsbijstand ten vervolge op een spreekuur overeenkomstig bij algemene maatregel
      van bestuur vast te stellen grenzen of voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel19
  - number: 19.1.c
    text: het verlenen van verdergaande rechtsbijstand op basis van een toevoeging.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel19
  - number: '19.2'
    text: |-
      De stichting onderzoekt de draagkracht van de rechtzoekende in het geval van rechtsbijstand op basis
      van het eerste lid, onder *b*, behalve in het geval de rechtzoekende met het oog op de toepassing van
      [artikel 51a van het Wetboek van Strafvordering][ref1] als benadeelde partij zijn schade wil vorderen. Bij of
      krachtens de in [artikel 25, vierde lid][ref2], bedoelde algemene maatregel van bestuur worden hieromtrent nadere
      regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel25
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51a
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '25'
        hoofdstuk: IV
  - number: '20.1'
    text: |-
      Het bestuur benoemt een directeur en een plaatsvervangend directeur van de stichting. De benoeming behoeft de
      instemming van de raad.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel20
  - number: '20.2'
    text: De overige personeelsleden worden door het bestuur, op voordracht van de directeur, in dienst genomen en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel20
  - number: '20.3'
    text: |-
      Voor het vervullen van de taken, bedoeld in [artikel 19, eerste lid, onder a en b][ref1], kan de raad na
      overleg met de stichting overeenkomsten aangaan met ingeschreven advocaten of met personen, bedoeld in
      [artikel 13, eerste lid, onder c][ref2]. In het jaarplan wordt vermeld welke toepassing de raad aan het bepaalde in
      dit lid zal geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel13
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '21'
    text: |-
      Op voorstel van de raden stelt Onze Minister voor elke stichting de personeelsformatie vast voor de medewerkers in
      vaste dienst die met de verlening van rechtsbijstand zijn belast. Voor alle arrondissementen gezamenlijk kan dit
      aantal niet meer bedragen dan tien ten honderd van het aantal door de raden ingeschreven advocaten. Het jaarplan
      vermeldt per stichting het aantal medewerkers in vaste dienst dat met de verlening van rechtsbijstand is belast.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel21
  - number: '22.1'
    text: |-
      Medewerkers van de stichting die belast zijn met de verlening van rechtsbijstand, moeten voldoen aan de eisen,
      genoemd in [artikel 2, eerste lid][ref1], of [artikel 2a van de Advocatenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 2a
  - number: '22.2'
    text: |-
      De raad stelt een klachtenregeling vast, waarop een ieder die een klacht heeft over een gedraging van een
      medewerker van de stichting of van een persoon als bedoeld in [artikel 13, eerste lid, onder c][ref1], een beroep
      kan doen. Gegrondverklaring van de klacht kan ertoe leiden, dat de rechtsbijstandverlener die het betreft, al dan
      niet voor bepaalde tijd, van de verdere verlening van een door de raad te bepalen vorm van rechtsbijstand wordt
      uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel13
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '22.3'
    text: |-
      De klachtenregeling behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met
      het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel22
  - number: '23.1'
    text: |-
      De stichting stelt voor elk kalenderjaar een werkplan op. Van het werkplan maken een activiteitenplan en een
      begroting deel uit. Het werkplan wordt van kracht zodra de raad ermee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23
  - number: '23.2'
    text: |-
      In het activiteitenplan wordt aangegeven welk beleid de stichting zal voeren met betrekking tot de toegankelijkheid
      voor de rechtzoekende van het aan de stichting verbonden bureau en van advocaten die een overeenkomst zijn
      aangegaan als bedoeld in [artikel 20, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel20
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: 23a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23a
  - number: 23a.a
    text: |-
      richtlijn: de [richtlijn 2003/8/EG](32003L0008) van de Raad van 27 januari 2003 tot verbetering van de toegang tot
      de rechter bij grensoverschrijdende geschillen, door middel van gemeenschappelijke minimumvoorschriften betreffende
      rechtsbijstand bij die geschillen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23a
  - number: 23a.b
    text: 'lidstaat: lidstaat van de Europese Unie met uitzondering van Denemarken.'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23a
  - number: 23b.1
    text: |-
      De bepalingen van deze afdeling zijn uitsluitend van toepassing op de verlening van rechtsbijstand aan een
      natuurlijk persoon in een grensoverschrijdend geschil op het terrein van het burgerlijk recht of het handelsrecht
      die zijn rechtmatige woonplaats of rechtmatige gewone verblijfplaats heeft in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23b
  - number: 23b.2
    text: |-
      Onder een grensoverschrijdend geschil wordt verstaan een geschil waarbij op de dag van het indienen van de aanvraag
      om verlening van rechtsbijstand met het oog op de behandeling van de zaak in Nederland of de tenuitvoerlegging
      van de beslissing in die zaak in Nederland, de rechtzoekende zijn rechtmatige woonplaats of rechtmatige gewone
      verblijfplaats heeft in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23b
  - number: 23b.3
    text: |-
      Om vast te stellen of een rechtzoekende woonplaats heeft in Nederland wordt Nederlands recht toegepast. Indien de
      rechtzoekende geen woonplaats heeft in Nederland, wordt voor de vaststelling of betrokkene een woonplaats heeft in
      een andere lidstaat het recht van die lidstaat toegepast.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23b
  - number: 23c.1
    text: |-
      Indien de bijzondere feitelijke of juridische ingewikkeldheid van het geval of de gelijkheid van de partijen dat
      vereist, kan, in afwijking van [artikel 12, tweede lid, onder g][ref1], rechtsbijstand worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: 23c.2
    text: Het eerste lid is van overeenkomstige toepassing, indien de raad een toevoeging verleent op last van de rechter.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23c
  - number: 23c.3
    text: |-
      Rechtsbijstand behoeft niet te worden verleend, indien de rechtzoekende in het betrokken geschil daadwerkelijk
      toegang heeft tot andere regelingen voor de dekking van de kosten van rechtsbijstand alsmede de in
      [artikel 23e][ref1] bedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23e
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23e
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23c.4
    text: |-
      [Artikel 33, eerste lid, onder c][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '33'
        hoofdstuk: IV
  - number: 23d
    text: |-
      Ondanks de toepasselijkheid van de [artikelen 34][ref1] en [35][ref2] wordt rechtsbijstand verleend of worden
      kosten, bedoeld in [artikel 23e][ref3] vergoed, indien de rechtzoekende aantoont dat hij niet in staat is de kosten
      van rechtsbijstand te dragen als gevolg van de verschillen in de kosten van levensonderhoud tussen de lidstaat waar
      hij zijn woonplaats of gewone verblijfplaats heeft en Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel23e
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: 23e
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23e.1
    text: |-
      Onverminderd de kosten die op grond van deze wet worden vergoed, worden de hierna te noemen kosten door de raad aan
      de rechtzoekende vergoed voorzover die rechtstreeks verband houden met het grensoverschrijdende karakter van het
      geschil en voorzover deze kosten, niet zijnde proceskosten, ten behoeve van de rechtzoekende zijn gemaakt en voor
      rekening van de rechtzoekende komen en door de rechtzoekende zijn betaald:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
  - number: 23e.1.a
    text: de kosten van tolken, voorzover deze zijn geregistreerd in het kwaliteitsregister te 's-Hertogenbosch;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
  - number: 23e.1.b
    text: |-
      de kosten voor de vertaling door een beëdigde vertaler van de voor de afdoening van de zaak benodigde stukken die
      door de rechter of de raad worden verlangd en door de rechtzoekende worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
  - number: 23e.1.c
    text: |-
      de reiskosten, voorzover bij het voorleggen van de zaak van de aanvrager de aanwezigheid van betrokkenen ter
      terechtzitting bij de wet of door de rechter geboden is en de rechter oordeelt dat de betrokkenen niet anderszins
      ten genoegen van de rechter kunnen worden gehoord, en
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
  - number: 23e.1.d
    text: vijftig procent van het honorarium van personen die in opdracht van de rechter in de procedure optreden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
  - number: 23e.2
    text: Voorzover mogelijk draagt de raad zorg voor de vertaling van de stukken, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
  - number: 23e.3
    text: |-
      De hoogte van de vergoeding van de reiskosten, bedoeld in het eerste lid, onder c, wordt berekend overeenkomstig
      [artikel 25 van het Besluit vergoedingen rechtsbijstand 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel25
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '25'
  - number: 23e.4
    text: |-
      De hoogte van de vergoeding van het honorarium van de personen, bedoeld in het eerste lid, onder a, b en d, wordt
      berekend overeenkomstig de [Wet tarieven in burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: 23f
    text: |-
      Onverminderd de toepasselijkheid van de bepalingen van deze wet, wordt in een grensoverschrijdend geschil ook
      rechtsbijstand verleend:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23f
  - number: 23f.a
    text: voor de tenuitvoerlegging van de beslissing van de rechter in de zaak die in Nederland is behandeld;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23f
  - number: 23f.b
    text: |-
      indien bij wet of door een rechterlijke uitspraak de rechtzoekende verplicht is van een buitengerechtelijke
      procedure gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23f
  - number: 23f.c
    text: voor de tenuitvoerlegging van authentieke akten in Nederland.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23f
  - number: 23g.1
    text: |-
      De rechtzoekende dient de aanvraag om verlening van rechtsbijstand in bij de raad voor rechtsbijstand te 's-
      Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23g
  - number: 23g.2
    text: Bij ministeriële regeling wordt bepaald in welke taal of talen de aanvraag mag worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23g
  - number: 23h
    text: |-
      Indien in Nederland om erkenning, niet-erkenning of tenuitvoerlegging van een uitspraak van de rechter uit
      een andere lidstaat, wordt verzocht door een rechtzoekende die in een andere lidstaat dan Nederland zijn
      rechtmatige woonplaats of gewone verblijfplaats als bedoeld in [artikel 23b, derde lid][ref1], heeft en van wie
      de hoofdzaak in een andere lidstaat dan Nederland is behandeld waarbij hij op grond van de richtlijn, genoemd in
      [artikel 23i, eerste lid][ref2], rechtsbijstand heeft ontvangen zijn de [artikelen 23c tot en met 23g][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23i
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel23c
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 23i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: 23c
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23i.1
    text: |-
      In het geval waarin de richtlijn van toepassing is, wordt aan de rechtzoekende, die op de dag van het indienen
      van de aanvraag om verlening van rechtsbijstand met het oog op de behandeling van de zaak in een andere
      lidstaat dan Nederland, zijn rechtmatige woonplaats of rechtmatige gewone verblijfplaats als bedoeld in
      [artikel 23b, derde lid][ref1], in Nederland heeft, rechtsbijstand verleend totdat de aanvraag om verlening van
      rechtsbijstand in overeenstemming met voornoemde richtlijn is ontvangen door de bevoegde autoriteit van de lidstaat
      waar de zaak verder zal worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23i.2
    text: |-
      [Artikel 23b, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23i.3
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt rechtsbijstand uitsluitend niet verleend, indien de daartoe
      strekkende aanvraag kennelijk van elke grond is ontbloot.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
  - number: 23i.4
    text: |-
      De verlening van rechtsbijstand, bedoeld in het eerste lid, omvat uitsluitend de verlening van rechtsbijstand
      tijdens een spreekuur als bedoeld in [artikel 19][ref1] of de verlening van een adviestoevoeging


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: 23i.5
    text: |-
      De aanvraag om verlening van rechtsbijstand, bedoeld in het eerste lid, wordt gedaan bij de raad voor
      rechtsbijstand te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
  - number: 23i.6
    text: |-
      De raad, bedoeld in het vijfde lid, zendt de aanvraag binnen vijftien dagen nadat de aanvraag en de daarbij
      begeleidende stukken zijn vertaald naar de bevoegde autoriteit in de lidstaat waar de zaak zal worden behandeld,
      tenzij de rechtsbijstand op grond van het derde lid niet is verleend. De raad draagt zorg voor de vertaling van de
      aanvraag en van de vereiste begeleidende stukken zo spoedig mogelijk na ontvangst van de aanvraag. De kosten van de
      vertaling komen voor rekening van de raad.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
  - number: 23i.7
    text: |-
      De rechtzoekende is geen kosten verschuldigd voor de handelingen van de raad, bedoeld in het zesde lid. Indien de
      bevoegde autoriteit in de lidstaat waar de zaak zal worden behandeld de aanvraag om verlening van rechtsbijstand
      afwijst, is de rechtzoekende de kosten van vertaling verschuldigd aan de raad.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23i
  - number: 23j
    text: |-
      Indien in Nederland om erkenning, niet-erkenning of tenuitvoerlegging van een uitspraak van de rechter uit
      een andere lidstaat, wordt verzocht door een rechtzoekende die in Nederland zijn rechtmatige woonplaats of
      rechtmatige gewone verblijfplaats als bedoeld in [artikel 23b, derde lid][ref1], heeft en van wie de hoofdzaak
      in een andere lidstaat is behandeld waarbij hij op grond van de richtlijn rechtsbijstand heeft ontvangen, zijn de
      [artikelen 23c tot en met 23g][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23c
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 23c
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23k
    text: |-
      In het geval waarin de richtlijn van toepassing is, zijn de bepalingen in de [afdelingen 1][ref1] en
      [2 van hoofdstuk IIIa][ref2] van toepassing in afwijking van andere tussen Nederland en de lidstaten geldende
      overeenkomsten alsmede in afwijking van het Verdrag van 25 oktober 1980 inzake de toegang tot de rechter in
      internationale gevallen (Trb. 1989, 114).


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006368
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '24.1'
    text: 'De raad beslist op de aanvraag om een toevoeging ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
  - number: 24.1.a
    text: rechtsbijstand door een advocaat;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
  - number: 24.1.b
    text: |-
      rechtsbijstand door een medewerker van een stichting in het geval, bedoeld in
      [artikel 19, eerste lid, onder c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: 24.1.c
    text: |-
      rechtsbijstand door personen, bedoeld in [artikel 13, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel13
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '24.2'
    text: |-
      De rechtsbijstandverlener dient mede namens de rechtzoekende, een aanvraag om een toevoeging in bij de raad in het
      ressort waar de rechtsbijstandverlener kantoor houdt. De aanvraag wordt mede namens de rechtzoekende, ondertekend
      door de rechtsbijstandverlener.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
  - number: '24.3'
    text: |-
      De aanvraag om een toevoeging bevat een genoegzame omschrijving van de feiten en omstandigheden betreffende het
      rechtsprobleem waarvoor rechtsbijstand wordt gevraagd, de aan te voeren gronden dan wel een aanduiding van de
      werkzaamheden op basis van de toevoeging die ter zake van het rechtsprobleem nodig worden geacht.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
  - number: '24.4'
    text: |-
      De rechtsbijstandverlener kan slechts met instemming van de raad de toevoeging weigeren. Zolang de toevoeging niet
      is gewijzigd of ingetrokken, is hij verplicht de nodige rechtsbijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
  - number: '24.5'
    text: |-
      De toevoeging vermeldt een omschrijving van het rechtsbelang terzake waarvan de toevoeging is verleend. Het
      besluit vermeldt tevens het bedrag van de eigen bijdrage die op de voet van het bepaalde in [artikel 35][ref1]
      is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: '25.1'
    text: |-
      Bij de aanvraag om een toevoeging wordt een door de burgemeester van de woonplaats van de rechtzoekende kosteloos
      af te geven verklaring overgelegd. Indien de verklaring niet kan worden afgegeven op grond van het feit dat de
      aanvrager overeenkomstig de bepalingen van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] niet
      als ingezetene in de basisadministratie is ingeschreven, legt deze zoveel mogelijk overeenkomstige bescheiden over.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '25.2'
    text: |-
      Omtrent de financiële draagkracht van de aanvrager, diens gezinsleden en de personen met wie hij een
      gemeenschappelijke huishouding voert kan de raad gegevens opvragen bij:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: 25.2.a
    text: de Rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: 25.2.b
    text: de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: 25.2.c
    text: het Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: 25.2.d
    text: de gemeentelijke sociale diensten;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: 25.2.e
    text: de afdelingen bevolking van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: '25.3'
    text: De gegevens, bedoeld in het tweede lid, worden zo spoedig mogelijk aan de raad verstrekt.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: '25.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in het eerste lid bedoelde
      verklaring en de daarbij over te leggen bewijsstukken, alsmede omtrent het bij wege van steekproef opvragen door
      de raad van gegevens bij de administratie der belastingen. Deze regels kunnen inhouden dat in bepaalde gevallen met
      een andere dan de in het eerste lid bedoelde verklaring volstaan kan worden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel25
  - number: '26'
    text: |-
      Indien de overeenkomstig [artikel 25][ref1] overgelegde of opgevraagde gegevens ontoereikend zijn om de financiële
      draagkracht van de aanvrager vast te stellen, kan de raad op grond van de gegevens waarover het beschikt, zelf de
      draagkracht bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel25
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '25'
        hoofdstuk: IV
  - number: '27'
    text: |-
      De raad kan, alvorens op de aanvraag te beslissen, de rechtzoekende horen, indien hij dat noodzakelijk acht voor
      de beoordeling van de aanvraag of de financiële draagkracht van de rechtzoekende. De raad kan tevens, tenzij het
      belang van de rechtzoekende zich daartegen verzet, de tegenpartij in de gelegenheid stellen haar standpunt uiteen
      te zetten.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel27
  - number: '28.1'
    text: 'De raad kan de toevoeging weigeren indien de aanvraag:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel28
  - number: 28.1.a
    text: wordt ingediend nadat de rechtsbijstand reeds feitelijk is verleend;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel28
  - number: 28.1.b
    text: |-
      betrekking heeft op een rechtsbelang ter zake waarvan de aanvrager aanspraak kan maken op rechtsbijstand op grond
      van een eerder afgegeven toevoeging;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel28
  - number: 28.1.c
    text: een rechtsprobleem betreft dat naar het oordeel van de raad eenvoudig afgehandeld kan worden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel28
  - number: '28.2'
    text: |-
      Bij de in [artikel 12, derde lid][ref1], bedoelde algemene maatregel van bestuur kunnen omtrent het in het eerste
      lid bepaalde nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '29.1'
    text: |-
      Een afschrift van het besluit tot toevoeging wordt zo spoedig mogelijk, doch in ieder geval voordat de
      einduitspraak is gedaan, overgelegd aan de rechter voor wie de zaak dient.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel29
  - number: '29.2'
    text: |-
      Indien de rechtsbijstandverlener de toevoeging niet overeenkomstig het eerste lid
      aan de rechter heeft overgelegd en als gevolg daarvan geen toepassing is gegeven aan
      [artikel 57b, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] of
      [artikel 8:75, tweede lid, van de Algemene wet bestuursrecht][ref2], wordt op het bedrag dat als vergoeding
      is vastgesteld in mindering gebracht het bedrag dat de tegenpartij in een procedure na een veroordeling in de
      proceskosten aan de rechtzoekende moet betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel57b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 57b
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '29.3'
    text: |-
      Indien op grond van de [Algemene wet bestuursrecht][ref1] bezwaar of administratief beroep wordt ingesteld en
      de belanghebbende een verzoek om een kostenvergoeding doet, wordt een afschrift van het besluit tot toevoeging
      zo spoedig mogelijk, doch in ieder geval voordat het bestuursorgaan op het bezwaar heeft beslist dan wel het
      beroepsorgaan op het beroep heeft beslist, overgelegd aan dat bestuurs- of beroepsorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '30.1'
    text: |-
      In spoedeisende gevallen verleent de raad een voorlopige toevoeging. De raad beslist zo spoedig mogelijk daarna
      over definitieve toevoeging; dit besluit treedt met terugwerkende kracht in de plaats van die tot verlening van een
      voorlopige toevoeging.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel30
  - number: '30.2'
    text: |-
      Bij de verlening van de voorlopige toevoeging stelt de raad de aanvrager overeenkomstig
      [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] een termijn, waarbinnen deze de voor de
      beoordeling van zijn aanvraag om een definitieve toevoeging van belang zijnde gegevens moet hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '31.1'
    text: |-
      De raad verleent een voorwaardelijke toevoeging, indien de aanvraag om verlening van rechtsbijstand betrekking
      heeft op een aanmerkelijk financieel belang of het aannemelijk is dat de kosten van rechtsbijstand verhaald kunnen
      worden op een derde.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel31
  - number: '31.2'
    text: |-
      Indien op het moment van beëindiging van de zaak waarvoor een voorwaardelijke toevoeging is verleend, blijkt dat de
      financiële draagkracht van de aanvrager zodanig is toegenomen dat deze de in [artikel 34][ref1] genoemde bedragen
      overschrijdt, of dat de rechtzoekende de kosten van rechtsbijstand kon verhalen op een derde, verleent de raad geen
      definitieve toevoeging. Onder de toegenomen financiële draagkracht wordt mede verstaan de toename van de liquide
      middelen van de rechtzoekende.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '32'
    text: |-
      De toevoeging geldt uitsluitend voor het rechtsbelang ter zake waarvoor zij is verleend en, in het geval van
      een procedure, voor de behandeling daarvan in één instantie, de tenuitvoerlegging van de rechterlijke uitspraak
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel32
  - number: '33.1'
    text: 'De raad kan de toevoeging, anders dan op verlangen van de aanvrager, wijzigen, beëindigen of intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: 33.1.a
    text: |-
      deze is verleend op grond van onjuiste of onvolledige gegevens omtrent de aard of het belang van de zaak, de
      financiële draagkracht of de woonplaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: 33.1.b
    text: de aanvrager de voor een goede behartiging van zijn zaak noodzakelijke medewerking weigert;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: 33.1.c
    text: |-
      de aanvrager in gebreke blijft de door hem verschuldigde eigen bijdrage en overige kosten die voor zijn rekening
      komen, dan wel een hem daarop gevraagd voorschot, te voldoen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: 33.1.d
    text: |-
      de financiële draagkracht van de aanvrager voor de beëindiging van de rechtsbijstand aanzienlijk blijkt te zijn
      toegenomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: 33.1.e
    text: blijkt dat een andere toevoeging mede omvat het rechtsbelang waarvoor de toevoeging is verleend.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: '33.2'
    text: |-
      De toegevoegde rechtsbijstandverlener kan zich na beëindiging of intrekking van de toevoeging aan de zaak
      onttrekken.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
  - number: '33.3'
    text: |-
      Indien de toevoeging wordt beëindigd of ingetrokken op grond van een situatie als bedoeld
      in het eerste lid, onder a, kan de raad het bedrag ter hoogte van de vergoeding, bedoeld in
      [artikel 37][ref1], vorderen van de rechtzoekende, tenzij de verlening van de vergoeding op grond van
      [artikel 4:48, eerste lid, onder c of d, van de Algemene wet bestuursrecht][ref2] is ingetrokken of gewijzigd
      of de vergoeding op grond van [artikel 4:46, tweede lid, onder c of d, van de Algemene wet bestuursrecht][ref3]
      lager is vastgesteld dan wel de vaststelling van de vergoeding op grond van
      [artikel 4:49, eerste lid, onder b, van die wet][ref4] is ingetrokken of ten nadele van de rechtsbijstandverlener
      is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '34.1'
    text: |-
      Rechtsbijstand overeenkomstig de bepalingen van deze wet wordt verleend aan hen wier inkomen per maand ƒ 2 810  of
      minder bedraagt, indien zij alleenstaand zijn, dan wel, indien zij met een of meer anderen een gemeenschappelijke
      huishouding voeren, ten hoogste ƒ 4 020 .
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
  - number: '34.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid wordt geen rechtsbijstand verleend, indien de rechtzoekende
      beschikt over een eigen vermogen van ten minste € 7300, indien hij alleenstaande is, dan wel van ten minste € 10
      500 in overige gevallen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
  - number: '34.3'
    text: |-
      Bij de vaststelling van het inkomen en het vermogen van de rechtzoekende worden, behoudens in het geval van
      onderling tegenstrijdige belangen, mede in aanmerking genomen het inkomen en het vermogen van:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
  - number: 34.3.a
    text: de echtgenoot of geregistreerde partner van de rechtzoekende, tenzij deze duurzaam van hem gescheiden leeft;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
  - number: 34.3.b
    text: |-
      de persoon van verschillend of gelijk geslacht met wie de rechtzoekende duurzaam een gezamenlijke huishouding
      voert, tenzij tussen deze en de rechtzoekende een bloedverwantschap in de eerste of tweede graad bestaat.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
  - number: '34.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven voor de vaststelling van het voor de financiële
      draagkracht in aanmerking te nemen inkomen en vermogen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
  - number: '34.5'
    text: |-
      Telkens na vijf jaar wordt het vermogen, bedoeld in het tweede lid, per 1 januari aangepast met het percentage,
      bedoeld in het [vijfde lid, onder c, van artikel 35][ref1], met dien verstande dat de te wijzigen bedragen worden
      afgerond op het naastliggende veelvoud van € 100.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: '35.1'
    text: |-
      De rechtzoekende is een bijdrage van € 13.50 verschuldigd wanneer rechtsbijstand wordt verleend op basis van
      [artikel 19, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: '35.2'
    text: |-
      De rechtzoekende is een eigen bijdrage waarvan de hoogte afhankelijk is van zijn inkomen, verschuldigd wanneer
      rechtsbijstand verleend wordt op basis van een toevoeging.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: '35.3'
    text: 'De in het tweede lid bedoelde eigen bijdrage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.a
    text: 'voor hen wier inkomen per maand niet hoger is dan de bijstandsnorm: € 89 ,'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.b
    text: 'voor hen wier inkomen per maand hoger is dan de bijstandsnorm en ten hoogste ƒ 2 365,-  bedraagt: € 140 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.c
    text: 'voor hen wier inkomen per maand meer dan ƒ 2 365,-  en ten hoogste ƒ 2 505,-  bedraagt: € 206 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.d
    text: 'voor hen wier inkomen per maand meer dan ƒ 2 505,-  en ten hoogste ƒ 2 610,-  bedraagt: € 272 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.e
    text: 'voor hen wier inkomen per maand meer dan ƒ 2 610,-  en ten hoogste ƒ 2 740,-  bedraagt: € 336 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.f
    text: 'voor hen wier inkomen per maand meer dan ƒ 2 740,-  en ten hoogste ƒ 2 865,-  bedraagt: € 392 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.g
    text: 'voor hen wier inkomen per maand meer dan ƒ 2 865,-  en ten hoogste ƒ 2 980,-  bedraagt: € 453 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.h
    text: 'voor hen wier inkomen per maand meer dan ƒ 2 980,-  en ten hoogste ƒ 3 105,- bedraagt: € 511;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.i
    text: 'voor hen wier inkomen per maand meer dan ƒ 3 105,- en ten hoogste ƒ 3 240,- bedraagt: € 576 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.j
    text: 'voor hen wier inkomen per maand meer dan ƒ 3 240,-  en ten hoogste ƒ 3 365,-  bedraagt: € 626 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.k
    text: 'voor hen wier inkomen per maand meer dan ƒ 3 365,-  en ten hoogste ƒ 3 485,-  bedraagt: € 696 ;'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.3.l
    text: 'voor hen wier inkomen per maand meer dan ƒ 3 485  en ten hoogste ƒ 4 020  bedraagt: € 761 .'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: '35.4'
    text: |-
      Indien de aanvrager alleenstaand is worden de in het derde lid genoemde inkomensgrenzen met dertig procent
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: '35.5'
    text: |-
      De in [artikel 34][ref1] en de in het derde lid van dit artikel genoemde inkomensgrenzen, met uitzondering van de
      bijstandsnorm, genoemd onder a en b, alsmede de in het derde lid van dit artikel genoemde eigen bijdragen worden
      door Onze Minister als volgt aangepast:


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: 35.5.a
    text: |-
      de inkomensgrenzen worden jaarlijks per 1 januari aangepast met het percentage waarmee het indexcijfer van de lonen
      op 31 oktober van het voorgaande jaar afwijkt van het overeenkomstige indexcijfer op 31 oktober in het daaraan
      voorafgaande jaar, met dien verstande dat de te wijzigen bedragen worden afgerond op het naastliggende veelvoud van
      € 1;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.5.b
    text: |-
      de in het derde lid van dit artikel onder a genoemde eigen bijdrage wordt jaarlijks per 1 januari aangepast met het
      percentage waarmee de bijstandsnorm per 31 oktober daaraan voorafgaand afwijkt van de bijstandsnorm per 31 oktober
      van het voorgaande jaar, met dien verstande dat de te wijzigen bedragen worden afgerond op het naastliggende
      veelvoud van € 1;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: 35.5.c
    text: |-
      de overige in het derde lid van dit artikel genoemde eigen bijdragen worden jaarlijks per 1 januari aangepast
      met het percentage waarmee het indexcijfer van de lonen op 31 oktober van het voorgaande jaar afwijkt van het
      overeenkomstige indexcijfer op 31 oktober in het daaraan voorafgaande jaar, met dien verstande dat de te wijzigen
      bedragen worden afgerond op het naastliggende veelvoud van € 1.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: '35.6'
    text: |-
      De in het eerste en derde lid genoemde eigen bijdragen kunnen voorts bij algemene maatregel van bestuur worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: '35.7'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat onder het indexcijfer van de lonen als bedoeld in het vijfde
      lid wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
  - number: '35.8'
    text: |-
      Bij de in [artikel 34, vierde lid][ref1], bedoelde algemene maatregel van bestuur worden regels gesteld over de
      gevallen waarin het bureau bevoegd is geen of een lagere eigen bijdrage dan genoemd in het eerste en het derde lid
      op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '36.1'
    text: |-
      Aan rechtspersonen wordt overeenkomstig de bepalingen van deze wet rechtsbijstand verleend, indien van de
      rechtspersoon redelijkerwijze niet verwacht kan worden dat deze de kosten van rechtsbijstand betaalt uit eigen
      vermogen of inkomsten, waaronder begrepen bijdragen van leden of betrokkenen, alsmede subsidies van de overheid.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel36
  - number: '36.2'
    text: |-
      De rechtspersoon aan wie rechtsbijstand op basis van een toevoeging wordt verleend, is een eigen bijdrage
      verschuldigd als genoemd in [artikel 35, derde lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: '37.1'
    text: 'De raad verstrekt aan een rechtsbijstandverlener een subsidie, genoemd vergoeding, voor:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.1.a
    text: de door hem op basis van een toevoeging verleende rechtsbijstand;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.1.b
    text: |-
      de door hem verleende rechtsbijstand in een zaak waarin een rechtsbijstandverlener rechtsbijstand heeft verleend in
      het kader van een door de raad getroffen regeling voor het beurtelings verlenen van rechtsbijstand in bij algemene
      maatregel van bestuur aan te wijzen zaken.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: '37.2'
    text: |-
      De vergoeding omvat mede de bij algemene maatregel van bestuur aan te wijzen overige kosten die verband houden met
      de verlening van rechtsbijstand alsmede de omzetbelasting die over de vergoeding is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: '37.3'
    text: |-
      De voor de rechtzoekende vastgestelde eigen bijdrage wordt op de in het eerste lid bedoelde vergoeding in mindering
      gebracht.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: '37.4'
    text: Aan ingeschreven advocaten wordt periodiek een voorschot toegekend.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: '37.5'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden vastgesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.a
    text: het bedrag van de vergoeding en de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.b
    text: de aanvraag van de vergoeding en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.c
    text: de voorwaarden waaronder de vergoeding wordt verleend;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.d
    text: de verplichtingen van de rechtsbijstandverlener;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.e
    text: de vaststelling van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.f
    text: de wijziging van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.g
    text: de verlening van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.h
    text: de betaling van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37.5.i
    text: de naleving.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: '37.6'
    text: |-
      De in het eerste lid bedoelde vergoeding is verschuldigd aan de betrokken stichting, indien de rechtsbijstand wordt
      verleend door medewerkers van de stichting.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37
  - number: 37a
    text: |-
      Indien een rechtspersoon een gehele of gedeeltelijke geldelijke bijdrage ontvangt voor de verlening van
      rechtskundige diensten, worden aan een advocaat die een privaatrechtelijke of publiekrechtelijke dienstbetrekking
      heeft bij deze rechtspersoon geen vergoeding verstrekt voorzover de door hem op basis van een toevoeging verleende
      rechtsbijstand redelijkerwijs kan worden aangemerkt als een rechtskundige dienst waarvoor een geldelijke bijdrage
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37a
  - number: 37b.1
    text: |-
      De raad kan aan een rechtsbijstandverlener of een samenwerkingsverband van rechtsbijstandverleners ten behoeve van
      de verlening van rechtsbijstand subsidie verstrekken voor bijzondere doeleinden en projecten.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.2
    text: De raad kan een subsidieplafond vaststellen voor de activiteiten waarvoor subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.3
    text: De raad stelt regels vast voor de verstrekking van subsidies als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4
    text: 'Deze regels bevatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4.a
    text: een uitwerking van de activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4.b
    text: een nadere omschrijving van aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4.c
    text: de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4.d
    text: de aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4.e
    text: de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht moet worden genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.4.f
    text: de wijze waarop en de termijn waarbinnen het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: 37b.5
    text: De door de raad te stellen regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel37b
  - number: '38.1'
    text: |-
      De rechtzoekende is de hem opgelegde eigen bijdrage van rechtswege verschuldigd aan degene die hem de
      rechtsbijstand verleent. Voor het overige is hij geen vergoeding verschuldigd, behoudens voor kosten die meer in
      het bijzonder ten behoeve van zijn zaak zijn gemaakt, voor zover die op grond van [artikel 41][ref1] aan hem in
      rekening mogen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel41
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '41'
        hoofdstuk: V
        afdeling: '2'
  - number: '38.2'
    text: |-
      De ingevolge [artikel 35, derde lid][ref1], verschuldigde eigen bijdrage bedraagt niet meer dan het bedrag van de
      vergoeding waarop de rechtsbijstandverlener ingevolge [artikel 37][ref2] recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '38.3'
    text: |-
      De rechtsbijstandverlener licht de rechtzoekende vooraf zo goed mogelijk in over de kosten die voor hem aan de te
      verlenen rechtsbijstand verbonden zijn. Hij kan ter verzekering van de inning van de eigen bijdrage en de overige
      aan de zaak verbonden kosten die voor rekening van de rechtzoekende komen, verlangen dat de rechtzoekende een
      voorschot betaalt.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel38
  - number: '38.4'
    text: |-
      Indien de rechtzoekende weigerachtig blijft de door hem aan de rechtsbijstandverlener verschuldigde
      bijdrage en vergoeding voor de kosten te voldoen, wordt het bedrag daarvan nader vastgesteld door de
      president van de rechtbank van het arrondissement waarin de rechtsbijstandverlener is gevestigd. De
      [artikelen 34 tot en met 40 van de Wet tarieven in burgerlijke zaken][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '34'
  - number: '38.5'
    text: |-
      De in het eerste lid bedoelde eigen bijdrage is van rechtswege verschuldigd aan de stichting indien de
      rechtsbijstandverlener een medewerker van de stichting is.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel38
  - number: '39'
    text: |-
      Bij de in [artikel 37, vijfde lid][ref1], bedoelde algemene maatregel van bestuur worden regels gesteld voor de
      vergoedingen voor diensten die bij de verlening van rechtsbijstand zijn verricht door procureurs, deurwaarders en,
      in strafzaken, door tolken, alsmede omtrent betaling van krachtens wettelijk voorschrift of rechterlijk bevel in
      dag- of nieuwsbladen geplaatste oproepingen of aankondigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '40'
    text: |-
      De rechtzoekende is geen kosten verschuldigd voor het uitbrengen van een exploit of het opmaken van een proces-
      verbaal in een zaak waarin op grond van deze wet rechtsbijstand wordt verleend, noch voor de bijstand bij de
      tenuitvoerlegging van de in een zodanige zaak gegeven uitspraak.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel40
  - number: '41.1'
    text: |-
      Bij de in [artikel 37, vijfde lid][ref1], bedoelde algemene maatregel van bestuur worden regels gesteld omtrent
      de kosten die ten behoeve van de zaak zijn gemaakt en die door de rechtsbijstandverlener in rekening mogen worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '41.2'
    text: |-
      Tevens kunnen bij deze algemene maatregel van bestuur regels worden gesteld omtrent de gegevens die de
      rechtsbijstandverlener aan de raad dient over te leggen inzake:
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel41
  - number: 41.2.a
    text: de aan de rechtzoekende boven de eigen bijdrage in rekening gebrachte kosten;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel41
  - number: 41.2.b
    text: de aan de zaak bestede tijd;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel41
  - number: 41.2.c
    text: de wijze waarop de zaak is behandeld.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel41
  - number: '42.1'
    text: Onze Minister verstrekt de raad een subsidie voor de uitvoering van zijn wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42
  - number: '42.2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '42.3'
    text: De subsidie wordt per boekjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42
  - number: '42.4'
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 42a.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.a
    text: |-
      de gegevens die Onze Minister met het oog op het opstellen van de begroting verstrekt aan de raad, alsmede op welk
      tijdstip deze gegevens uiterlijk worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.b
    text: de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.c
    text: de bij de aanvraag tot subsidieverlening over te leggen gegevens of bescheiden;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.d
    text: 'de eisen waaraan de begroting moet voldoen:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.e
    text: de wijze waarop de subsidie wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.f
    text: het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.g
    text: |-
      de gevallen waarin de raad een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42a.1.h
    text: |-
      de handelingen, bedoeld in [artikel 4:71 van de Algemene wet bestuursrecht][ref1], waarvoor de raad de toestemming
      van Onze Minister behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42a.1.i
    text: het vormen van egalisatiereserves door de raad;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.j
    text: de overige aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.k
    text: de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.l
    text: de termijn waarbinnen Onze Minister op de aanvraag tot vaststelling van de subsidie beslist;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.1.m
    text: |-
      het onderzoek door de accountant, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42a.1.n
    text: de overige eisen waaraan het financiële verslag en het activiteitenverslag moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
  - number: 42a.2
    text: |-
      Onze Minister stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.1
    text: |-
      De raad verstrekt aan een stichting rechtsbijstand een subsidie ten behoeve van de kosten benodigd voor de
      uitoefening van de taken, genoemd in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: 42b.2
    text: 'De raad stelt regels over de verstrekking van de subsidie, die in ieder geval bepalingen omvatten omtrent:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.2.a
    text: de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.2.b
    text: het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.2.c
    text: |-
      de gevallen waarin de stichting een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.2.d
    text: |-
      de handelingen, bedoeld in [artikel 4:71 van de Algemene wet bestuursrecht][ref1], waarvoor de stichting de
      toestemming van de raad behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.2.e
    text: het vormen van een egalisatiereserve door de stichting;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.2.f
    text: de overige aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.2.g
    text: de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.2.h
    text: |-
      het onderzoek door de accountant, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.3
    text: |-
      De raad stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.4
    text: |-
      De door de raad te stellen regels behoeven de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
  - number: 42b.5
    text: |-
      Voorzover noodzakelijk met het oog op het onderzoek door de accountant, bedoeld in
      [artikel 4:78 van de Algemene wet bestuursrecht][ref1], verstrekt de stichting persoonsgegevens van rechtzoekenden
      aan de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42c.1
    text: |-
      De raad kan aan een stichting rechtsbijstand met het oog op de uitvoering van de taak, bedoeld in
      [artikel 19][ref1], subsidie verstrekken voor bijzondere doeleinden en projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel19
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
  - number: 42c.2
    text: |-
      Het tweede tot en met vijfde lid van [artikel 37b][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37b
        hoofdstuk: V
        afdeling: '2'
  - number: '43.1'
    text: |-
      Rechtsbijstand is kosteloos in de gevallen waarin krachtens enig wettelijk voorschrift in het
      [Wetboek van Strafrecht][ref1] of het [Wetboek van Strafvordering][ref2] aan de verdachte of de
      veroordeelde op last van de rechter een raadsman wordt toegevoegd door de raad, onverminderd het in
      [artikel 49 van het Wetboek van Strafvordering][ref3] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel49
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '49'
  - number: '43.2'
    text: 'Het eerste lid is van overeenkomstige toepassing op rechtsbijstand bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
  - number: 43.2.a
    text: |-
      [artikel 24, derde lid, van de Uitleveringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel24
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '24'
  - number: 43.2.b
    text: |-
      [artikel 100 van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel100
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '100'
  - number: 43.2.c
    text: |-
      [artikel 65, eerste lid, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel65
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '65'
  - number: 43.2.d
    text: |-
      [artikel 70, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel70
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '70'
  - number: 43.2.e
    text: |-
      [artikel 52, derde lid][ref1], en [64, tweede lid, van de Wet overdracht tenuitvoerlegging strafvonnissen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel64
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004028
        artikel: '64'
  - number: 43.2.f
    text: |-
      de [artikelen 8, derde lid][ref1], [22, eerste lid][ref2], en
      [41, twaalfde lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel41
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0005700
        artikel: '41'
  - number: 43.2.g
    text: |-
      [artikel 62, eerste lid, van de Beginselenwet verpleging ter beschikking gestelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel62
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '62'
  - number: '44.1'
    text: |-
      Aan personen die zich krachtens het [Wetboek van Strafrecht][ref1] of het [Wetboek van Strafvordering][ref2] door
      een raadsman kunnen doen bijstaan, kan de raad een advocaat toevoegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
  - number: '44.2'
    text: |-
      De eigen bijdrage bedoeld in [artikel 35, eerste en tweede lid][ref1], is niet verschuldigd voor rechtsbijstand,
      indien deze op grond van het eerste lid wordt verleend aan een rechtzoekende wiens inkomen niet meer bedraagt dan
      genoemd in [artikel 35, derde lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: '44.3'
    text: |-
      De eigen bijdrage is niet verschuldigd, indien een zaak eindigt zonder de toepassing van een straf of maatregel dan
      wel zonder toepassing van [artikel 9a Wetboek van Strafrecht][ref1]. De rechtsbijstandverlener restitueert de eigen
      bijdrage aan de rechtzoekende, tenzij deze de eigen bijdrage nog niet heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9a
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 9a
  - number: '44.4'
    text: |-
      De raad is bevoegd geen eigen bijdrage op te leggen bij de toevoeging van een raadsman aan hen die zich anders dan
      als verdachte of veroordeelde krachtens het [Wetboek van Strafrecht][ref1] of [Wetboek van Strafvordering][ref2]
      laten bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
  - number: '46.1'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit van de raad is in afwijking van
      [artikel 8:7, tweede lid, van de Algemene wet bestuursrecht][ref1], de rechtbank bevoegd binnen het rechtsgebied
      waarvan de raad is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '46.2'
    text: |-
      In afwijking van [artikel 8:41, derde lid, onder b en c, van de Algemene wet bestuursrecht][ref1] bedraagt het
      griffierecht € 37 indien door een rechtzoekende beroep wordt ingesteld tegen een besluit van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '46.3'
    text: |-
      In afwijking van [artikel 40, tweede lid, onder a en b, van de Wet op de Raad van State][ref1] bedraagt het
      griffierecht € 103 indien door een rechtzoekende hoger beroep wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel40
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '40'
  - number: '46.4'
    text: |-
      De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd
      voorzover het prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel46
  - number: '47.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de ontvanger van de subsidie onderscheidenlijk
      vergoeding opgelegde verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel47
  - number: '47.2'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '47.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel47
  - number: '47.4'
    text: |-
      Aan door Onze Minister verstrekte subsidies onderscheidenlijk vergoedingen is de verplichting verbonden dat de
      ontvanger van de subsidie onderscheidenlijk vergoeding aan een toezichthouder alle medewerking verleent die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel47
  - number: '48'
    text: |-
      [Artikel 10, eerste lid, van de Vreemdelingenwet 2000][ref1] is niet van toepassing op de aanspraken op
      rechtsbijstand overeenkomstig deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '10'
  - number: '49'
    text: |-
      De voordracht voor een krachtens [artikel 12, derde lid][ref1], [artikel 19, eerste lid, onder b][ref2],
      [artikel 34, vierde lid][ref3], [artikel 35, vijfde lid][ref4], en [artikel 37, vijfde lid][ref5], vastgestelde
      algemene maatregel van bestuur wordt niet gedaan dan nadat het ontwerp in de *Staatscourant* is bekendgemaakt en
      aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen
      en bedenkingen ter kennis van Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de
      beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '19'
        hoofdstuk: III
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
      - id: ref4
