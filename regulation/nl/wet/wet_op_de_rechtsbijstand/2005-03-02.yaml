  - number: '66.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel66
  - number: '66.2'
    text: |-
      Met ingang van dezelfde datum wordt de Wet rechtsbijstand aan on- en minvermogenden ingetrokken met dien
      verstande dat deze laatste wet en de daarop steunende bepalingen, in afwijking van het gestelde in Artikel
      IV van de Wet van 22 december 1983 tot wijziging van de Wet rechtsbijstand aan on- en minvermogenden, van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] en van de [Wet tarieven in burgerlijke zaken][ref2] van toepassing
      blijven op rechtsbijstand die krachtens een voor deze datum genomen beslissing aan een rechtzoekende wordt
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0006368/2005-03-02#Artikel66
