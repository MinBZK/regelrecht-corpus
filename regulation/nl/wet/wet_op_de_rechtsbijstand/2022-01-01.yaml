        artikel: '41'
  - number: 5.1.a
    text: |-
      onder bezoldiging of schadeloosstelling als bedoeld in [artikel 14 van de Kaderwet][ref1] wordt verstaan:
      vacatiegeld; en


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '14'
  - number: 5.1.b
    text: |-
      de raad van advies het jaarverslag, bedoeld in [artikel 18, eerste lid, van de Kaderwet][ref1] tezamen met het
      jaarverslag van het bestuur kan uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '5.2'
    text: |-
      De raad van advies bestaat uit ten hoogste vijf leden, die voor een periode van ten hoogste vier jaren worden
      benoemd. Zij kunnen na afloop van deze periode aansluitend eenmaal opnieuw worden herbenoemd voor een termijn van
      ten hoogste vier jaren. Onze Minister wijst de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel5
  - number: '6.1'
    text: De raad van advies ziet toe op de algemene gang van zaken in de raad en kan Onze Minister daarover adviseren.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij de vervulling van zijn taak richt de raad van advies zich naar het belang van de raad, waaronder het belang van
      de behoorlijke vervulling van de bij of krachtens de wet aan het bestuur opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel6
  - number: '6.3'
    text: De raad van advies stelt bij reglement in ieder geval regels omtrent zijn werkwijze, procedures en besluitvorming.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel6
  - number: '7.1'
    text: 'Het bestuur heeft tot taak om:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.1.a
    text: zorg te dragen voor de organisatie van alsmede de verlening van rechtsbijstand;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.1.b
    text: |-
      zorg te dragen voor de organisatie van alsmede de uitvoering van de mediation alsmede het gebruik van mediation
      te bevorderen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het bestuur treft in ieder geval een afzonderlijke voorziening die belast is met de verlening van rechtshulp,
      het bevorderen van het gebruik van mediation, het verwijzen naar een mediator alsmede met het benaderen van de
      wederpartij van de rechtzoekende met het oog op mediation.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: '7.3'
    text: 'Met het oog op de uitvoering van de taken, bedoeld in het eerste lid, heeft het bestuur voorts tot taak:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.3.a
    text: het nemen van besluiten op aanvragen om verlening van toevoegingen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.3.b
    text: de vaststelling en uitbetaling van vergoedingen aan rechtsbijstandverleners en mediators;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.3.c
    text: |-
      de controle op werkzaamheden van rechtsbijstandverleners en mediators, voorzover deze niet elders in deze wet aan
      anderen is opgedragen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.3.d
    text: |-
      het sluiten van overeenkomsten met ingeschreven advocaten of met personen, bedoeld in
      [artikel 13, eerste lid, onder c][ref1], alsmede met mediators;


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel13
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: 7.3.e
    text: |-
      de vaststelling van de draagkracht overeenkomstig de bepalingen van deze wet en het zonodig verstrekken van een
      verklaring hieromtrent, voor zover dat bij wettelijk voorschrift is bepaald;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
  - number: 7.3.f
    text: |-
      het vergoeden van de in deze wet bedoelde, door de rechtzoekende met een grensoverschrijdend geschil als bedoeld in
      [hoofdstuk IIIa][ref1] gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006368
        hoofdstuk: IIIa
  - number: 7a.1
    text: |-
      Het bestuur draagt zorg voor een zo evenwichtig mogelijke spreiding van het aanbod van de verlening van zowel de
      rechtsbijstand als de mediation in de ressorten. Het bestuur is belast met het toezicht op de uitvoering van deze
      taken. Het bestuur draagt tevens zorg voor een zo doelmatig mogelijke besteding van de hem ter beschikking staande
      middelen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7a
  - number: 7a.2
    text: |-
      Het bestuur doet jaarlijks aan Onze Minister verslag over de organisatie en de werkzaamheden van de door het
      bestuur getroffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7a
  - number: 7b
    text: |-
      Op verzoek van een nationale of internationale rechterlijke instantie of een instantie in een ander land kan het
      bestuur een verklaring omtrent het inkomen en vermogen verstrekken dat bij de vaststelling van de draagkracht in
      acht wordt genomen. Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent deze verklaring.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel7b
  - number: '8.1'
    text: |-
      Het bestuur kan voor de uitvoering of voorbereiding van bepaalde werkzaamheden commissies instellen, waarvan ook
      anderen dan leden van het bestuur deel kunnen uitmaken.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd [artikel 7, tweede lid][ref1], kan het bestuur met het oog op de uitoefening van zijn taken één of
      meer voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
  - number: '8.3'
    text: |-
      Indien een voorziening wordt getroffen voor de verlening van rechtsbijstand zonder afgifte van een toevoeging,
      wordt de draagkracht bepaald door het inwinnen van informatie bij de betreffende rechtzoekende. Bij of krachtens
      algemene maatregel van bestuur kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de verlening van rechtshulp uitsluitend bestaat uit het verstrekken van informatiemateriaal of uit een
      onmiddellijke verwijzing naar andere instanties dan rechtsbijstandverleners of mediators wordt geen rekening
      gehouden met de draagkracht van de rechtzoekende.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel8
  - number: 8a
    text: |-
      Het bestuur stelt een klachtenregeling vast, waarop een ieder die een klacht heeft over een gedraging van een
      medewerker van een voorziening een beroep kan doen. Deze klachtenregeling behoeft de goedkeuring van Onze Minister.
      De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel8a
  - number: '12.1'
    text: |-
      Rechtsbijstand wordt uitsluitend verleend ter zake van in de Nederlandse rechtssfeer liggende rechtsbelangen
      aan natuurlijke en rechtspersonen wier financiële draagkracht de in [artikel 34][ref1] genoemde bedragen niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '12.2'
    text: 'Rechtsbijstand wordt niet verleend indien:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.a
    text: de daartoe strekkende aanvraag kennelijk van elke grond is ontbloot;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.b
    text: |-
      de aan de te verlenen rechtsbijstand verbonden kosten niet in redelijke verhouding staan tot het belang van de
      zaak;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.c
    text: |-
      de daartoe strekkende aanvraag betrekking heeft op een strafzaak en het op grond van de overtreden norm aannemelijk
      is dat een in verhouding tot het inkomen lage boete zal worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.d
    text: |-
      de daartoe strekkende aanvraag wordt gedaan door een rechtspersoon die is opgericht met het doel om een
      gerechtelijke procedure te voeren;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.e
    text: |-
      het rechtsbelang waarop de aanvraag betrekking heeft, de uitoefening van een zelfstandig beroep of bedrijf betreft,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.e.1º
    text: |-
      voortzetting van het beroep of bedrijf voorzover het niet in de vorm van een rechtspersoon wordt gevoerd,
      afhankelijk is van het resultaat van de aangevraagde rechtsbijstand, of
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.e.2º
    text: |-
      het beroep of bedrijf ten minste één jaar geleden is beëindigd, de aanvrager in eerste aanleg als verweerder bij
      een procedure is betrokken of betrokken is geweest en de kosten van rechtsbijstand niet op andere wijze kunnen
      worden vergoed;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.f
    text: |-
      het een rechtsbelang betreft dat wordt voorgelegd aan een bij verdrag met rechtspraak belast internationaal
      college of een daarmee vergelijkbaar internationaal college en het college zelf in een aanspraak op vergoeding van
      rechtsbijstand voorziet;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: 12.2.g
    text: |-
      het een belang betreft waarvan de behartiging redelijkerwijze aan de aanvrager zelf kan worden overgelaten, zo
      nodig met bijstand van een andere persoon of instelling van wie onderscheidenlijk waarvan de werkzaamheden niet
      vallen binnen de werkingssfeer van deze wet.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: '12.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de overeenkomstig het tweede lid in
      acht te nemen criteria.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel12
  - number: '13.1'
    text: 'Onverminderd het tweede lid wordt rechtsbijstand verleend door:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel13
  - number: 13.1.a
    text: door het bestuur ingeschreven advocaten;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel13
  - number: 13.1.b
    text: medewerkers van een voorziening voorzover belast met de verlening van rechtsbijstand;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel13
  - number: 13.1.c
    text: |-
      notarissen, onverminderd het bepaalde in [artikel 56 van de Wet op het notarisambt][ref1], gerechtsdeurwaarders
      en anderen met wie de raad een overeenkomst is aangegaan tot het verlenen van rechtsbijstand op bepaalde
      rechtsgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel56
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '56'
  - number: '13.2'
    text: |-
      Rechtshulp wordt uitsluitend verleend door medewerkers die in dienstbetrekking zijn bij de voorziening, bedoeld
      in [artikel 7, tweede lid][ref1], of bij een voorziening als bedoeld in [artikel 8, tweede lid][ref2], voorzover
      deze belast is met het verlenen van rechtshulp, of door anderen met wie de raad in overeenstemming met de regels,
      bedoeld in het derde lid, een overeenkomst is aangegaan tot het verlenen van rechtshulp.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel8
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '13.3'
    text: |-
      Het bestuur stelt regels met betrekking tot het aangaan van de in het eerste lid, onder c, en tweede lid bedoelde
      overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel13
  - number: '14'
    text: |-
      Alle in Nederland kantoor houdende advocaten die daartoe een aanvraag hebben ingediend, worden door het bestuur
      ingeschreven indien zij voldoen aan de in [artikel 15][ref1] bedoelde voorwaarden. Het bestuur kan regels stellen
      met betrekking tot deze voorwaarden. Deze regels behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel15
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '15'
    text: 'De door het bestuur te stellen regels met betrekking tot de voorwaarden kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel15
  - number: 15.a
    text: het minimum en het maximum aantal zaken waarvoor een advocaat jaarlijks zal worden toegevoegd;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel15
  - number: 15.b
    text: de deskundigheid van de advocaat op bepaalde rechtsgebieden;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel15
  - number: 15.c
    text: de organisatie van het kantoor waar de advocaat werkzaam is;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel15
  - number: 15.d
    text: de verslaglegging door de advocaat omtrent de door hem verleende rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel15
  - number: '16'
    text: |-
      In bijzondere gevallen kan het bestuur beslissen dat rechtsbijstand zal worden verleend door een niet ingeschreven
      advocaat. Als bijzonder geval kan worden aangemerkt:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel16
  - number: 16.a
    text: de uitdrukkelijke en gemotiveerde wens van de rechtzoekende, door een bepaalde advocaat te worden bijgestaan;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel16
  - number: 16.b
    text: de behoefte aan bijstand door een advocaat die over specifieke deskundigheid op een bepaald rechtsgebied beschikt.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel16
  - number: '17.1'
    text: De inschrijving wordt door het bestuur doorgehaald bij verlies van de hoedanigheid van advocaat.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: '17.2'
    text: 'Voorts kan het bestuur de inschrijving doorhalen:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: 17.2.a
    text: indien de advocaat niet voldaan heeft dan wel niet langer voldoet aan de voor de inschrijving gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: 17.2.b
    text: |-
      indien naar zijn oordeel genoegzaam is gebleken dat de rechtsbijstandverlening door de advocaat niet voldoet aan
      redelijkerwijs te stellen eisen van doelmatigheid of zorgvuldigheid;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: 17.2.c
    text: |-
      indien aan de advocaat een maatregel is opgelegd als bedoeld in
      [artikel 48, tweede lid, onder a tot en met c, van de Advocatenwet][ref1] dan wel [artikel 60aa, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60aa
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60aa
  - number: 17.2.d
    text: |-
      indien naar zijn oordeel genoegzaam is gebleken dat de advocaat herhaaldelijk onjuiste informatie heeft verstrekt
      ten behoeve van het vaststellen van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: 17.2.e
    text: indien de advocaat niet voldoet aan de eisen gesteld aan de wijze van indiening van een aanvraag om een toevoeging;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: 17.2.f
    text: |-
      indien de advocaat niet voldoet aan de eisen gesteld aan de inrichting en de wijze van indiening van een aanvraag
      om vaststelling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel17
  - number: 23a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23a
  - number: 23a.a
    text: |-
      richtlijn: de [richtlijn 2003/8/EG](32003L0008) van de Raad van 27 januari 2003 tot verbetering van de toegang tot
      de rechter bij grensoverschrijdende geschillen, door middel van gemeenschappelijke minimumvoorschriften betreffende
      rechtsbijstand bij die geschillen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23a
  - number: 23a.b
    text: 'lidstaat: lidstaat van de Europese Unie met uitzondering van Denemarken.'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23a
  - number: 23b.1
    text: |-
      De bepalingen van deze afdeling zijn uitsluitend van toepassing op de verlening van rechtsbijstand aan een
      natuurlijk persoon in een grensoverschrijdend geschil op het terrein van het burgerlijk recht of het handelsrecht
      die zijn rechtmatige woonplaats of rechtmatige gewone verblijfplaats heeft in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23b
  - number: 23b.2
    text: |-
      Onder een grensoverschrijdend geschil wordt verstaan een geschil waarbij op de dag van het indienen van de aanvraag
      om verlening van rechtsbijstand met het oog op de behandeling van de zaak in Nederland of de tenuitvoerlegging
      van de beslissing in die zaak in Nederland, de rechtzoekende zijn rechtmatige woonplaats of rechtmatige gewone
      verblijfplaats heeft in een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23b
  - number: 23b.3
    text: |-
      Om vast te stellen of een rechtzoekende woonplaats heeft in Nederland wordt Nederlands recht toegepast. Indien de
      rechtzoekende geen woonplaats heeft in Nederland, wordt voor de vaststelling of betrokkene een woonplaats heeft in
      een andere lidstaat het recht van die lidstaat toegepast.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23b
  - number: 23c.1
    text: |-
      Indien de bijzondere feitelijke of juridische ingewikkeldheid van het geval of de gelijkheid van de partijen dat
      vereist, kan, in afwijking van [artikel 12, tweede lid, onder g][ref1], rechtsbijstand worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: 23c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bestuur een toevoeging verleent op last van de
      rechter.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23c
  - number: 23c.3
    text: |-
      Rechtsbijstand behoeft niet te worden verleend, indien de rechtzoekende in het betrokken geschil daadwerkelijk
      toegang heeft tot andere regelingen voor de dekking van de kosten van rechtsbijstand alsmede de in
      [artikel 23e][ref1] bedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23e
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23e
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23c.4
    text: |-
      [Artikel 33, eerste lid, onder c][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '33'
        hoofdstuk: IV
  - number: 23d
    text: |-
      Ondanks de toepasselijkheid van [artikel 34][ref1] wordt rechtsbijstand verleend of worden kosten, bedoeld in
      [artikel 23e][ref2] vergoed, indien de rechtzoekende aantoont dat hij niet in staat is de kosten van rechtsbijstand
      te dragen als gevolg van de verschillen in de kosten van levensonderhoud tussen de lidstaat waar hij zijn
      woonplaats of gewone verblijfplaats heeft en Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23e
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 23e
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23e.1
    text: |-
      Onverminderd de kosten die op grond van deze wet worden vergoed, worden de hierna te noemen kosten door het bestuur
      aan de rechtzoekende vergoed voorzover die rechtstreeks verband houden met het grensoverschrijdende karakter van
      het geschil en voorzover deze kosten, niet zijnde proceskosten, ten behoeve van de rechtzoekende zijn gemaakt en
      voor rekening van de rechtzoekende komen en door de rechtzoekende zijn betaald:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
  - number: 23e.1.a
    text: de kosten van tolken, voorzover deze zijn geregistreerd in het kwaliteitsregister te 's-Hertogenbosch;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
  - number: 23e.1.b
    text: |-
      de kosten voor de vertaling door een beëdigde vertaler van de voor de afdoening van de zaak benodigde stukken die
      door de rechter of het bestuur worden verlangd en door de rechtzoekende worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
  - number: 23e.1.c
    text: |-
      de reiskosten, voorzover bij het voorleggen van de zaak van de aanvrager de aanwezigheid van betrokkenen ter
      zitting bij de wet of door de rechter geboden is en de rechter oordeelt dat de betrokkenen niet anderszins ten
      genoegen van de rechter kunnen worden gehoord, en
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
  - number: 23e.1.d
    text: vijftig procent van het honorarium van personen die in opdracht van de rechter in de procedure optreden.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
  - number: 23e.2
    text: Voorzover mogelijk draagt het bestuur zorg voor de vertaling van de stukken, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
  - number: 23e.3
    text: |-
      De hoogte van de vergoeding van de reiskosten, bedoeld in het eerste lid, onder c, wordt berekend overeenkomstig
      [artikel 25 van het Besluit vergoedingen rechtsbijstand 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011018#Artikel25
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0011018
        artikel: '25'
  - number: 23e.4
    text: |-
      De hoogte van de vergoeding van het honorarium van de personen, bedoeld in het eerste lid, onder a, b en d, wordt
      berekend overeenkomstig de [Wet griffierechten burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: 23f
    text: |-
      Onverminderd de toepasselijkheid van de bepalingen van deze wet, wordt in een grensoverschrijdend geschil ook
      rechtsbijstand verleend:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23f
  - number: 23f.a
    text: voor de tenuitvoerlegging van de beslissing van de rechter in de zaak die in Nederland is behandeld;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23f
  - number: 23f.b
    text: |-
      indien bij wet of door een rechterlijke uitspraak de rechtzoekende verplicht is van een buitengerechtelijke
      procedure gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23f
  - number: 23f.c
    text: voor de tenuitvoerlegging van authentieke akten in Nederland.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23f
  - number: 23g
    text: |-
      Bij ministeriële regeling wordt bepaald in welke taal of talen de aanvraag om verlening van rechtsbijstand mag
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23g
  - number: 23h
    text: |-
      Indien in Nederland om erkenning, niet-erkenning of tenuitvoerlegging van een uitspraak van de rechter uit
      een andere lidstaat, wordt verzocht door een rechtzoekende die in een andere lidstaat dan Nederland zijn
      rechtmatige woonplaats of gewone verblijfplaats als bedoeld in [artikel 23b, derde lid][ref1], heeft en van wie
      de hoofdzaak in een andere lidstaat dan Nederland is behandeld waarbij hij op grond van de richtlijn, genoemd in
      [artikel 23i, eerste lid][ref2], rechtsbijstand heeft ontvangen zijn de [artikelen 23c tot en met 23g][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23i
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel23c
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 23i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: 23c
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23i.1
    text: |-
      In het geval waarin de richtlijn van toepassing is, wordt aan de rechtzoekende, die op de dag van het indienen
      van de aanvraag om verlening van rechtsbijstand met het oog op de behandeling van de zaak in een andere
      lidstaat dan Nederland, zijn rechtmatige woonplaats of rechtmatige gewone verblijfplaats als bedoeld in
      [artikel 23b, derde lid][ref1], in Nederland heeft, rechtsbijstand verleend totdat de aanvraag om verlening van
      rechtsbijstand in overeenstemming met voornoemde richtlijn is ontvangen door de bevoegde autoriteit van de lidstaat
      waar de zaak verder zal worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23i.2
    text: |-
      [Artikel 23b, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23i.3
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt rechtsbijstand uitsluitend niet verleend, indien de daartoe
      strekkende aanvraag kennelijk van elke grond is ontbloot.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23i
  - number: 23i.4
    text: |-
      De verlening van rechtsbijstand, bedoeld in het eerste lid, omvat uitsluitend de verlening van rechtshulp of de
      verlening van een adviestoevoeging
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23i
  - number: 23i.5
    text: |-
      Het bestuur zendt de aanvraag binnen vijftien dagen nadat de aanvraag en de daarbij begeleidende stukken zijn
      vertaald naar de bevoegde autoriteit in de lidstaat waar de zaak zal worden behandeld, tenzij de rechtsbijstand
      op grond van het derde lid niet is verleend. Het bestuur draagt zorg voor de vertaling van de aanvraag en van de
      vereiste begeleidende stukken zo spoedig mogelijk na ontvangst van de aanvraag. De kosten van de vertaling komen
      voor rekening van het bestuur.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23i
  - number: 23i.6
    text: |-
      De rechtzoekende is geen kosten verschuldigd voor de handelingen van het bestuur, bedoeld in het vijfde lid. Indien
      de bevoegde autoriteit in de lidstaat waar de zaak zal worden behandeld de aanvraag om verlening van rechtsbijstand
      afwijst, is de rechtzoekende de kosten van vertaling verschuldigd aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23i
  - number: 23j
    text: |-
      Indien in Nederland om erkenning, niet-erkenning of tenuitvoerlegging van een uitspraak van de rechter uit
      een andere lidstaat, wordt verzocht door een rechtzoekende die in Nederland zijn rechtmatige woonplaats of
      rechtmatige gewone verblijfplaats als bedoeld in [artikel 23b, derde lid][ref1], heeft en van wie de hoofdzaak
      in een andere lidstaat is behandeld waarbij hij op grond van de richtlijn rechtsbijstand heeft ontvangen, zijn de
      [artikelen 23c tot en met 23g][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel23c
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 23b
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 23c
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 23k
    text: |-
      In het geval waarin de richtlijn van toepassing is, zijn de bepalingen in de [afdelingen 1][ref1] en
      [2 van hoofdstuk IIIa][ref2] van toepassing in afwijking van andere tussen Nederland en de lidstaten geldende
      overeenkomsten alsmede in afwijking van het Verdrag van 25 oktober 1980 inzake de toegang tot de rechter in
      internationale gevallen (Trb. 1989, 114).


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0006368#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel23k
    references:
      - id: ref1
        bwb_id: BWBR0006368
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '24.1'
    text: 'Het bestuur beslist op de aanvraag om een toevoeging ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
  - number: 24.1.a
    text: rechtsbijstand door een advocaat;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
  - number: 24.1.b
    text: |-
      rechtsbijstand door een medewerker die in dienstbetrekking is bij een voorziening, tenzij het betreft een
      medewerker van de voorziening, bedoeld in [artikel 7, tweede lid][ref1], of van een voorziening als bedoeld in
      [artikel 8, tweede lid][ref2], voorzover het de verlening van rechtshulp betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel8
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 24.1.c
    text: |-
      rechtsbijstand door personen, bedoeld in [artikel 13, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel13
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '24.2'
    text: |-
      De rechtsbijstandverlener dient mede namens de rechtzoekende, een aanvraag om een toevoeging in bij een vestiging
      van de raad in het ressort waar de rechtsbijstandverlener kantoor houdt. De aanvraag wordt mede namens de
      rechtzoekende, ondertekend door de rechtsbijstandverlener.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
  - number: '24.3'
    text: |-
      De aanvraag om een toevoeging bevat een genoegzame omschrijving van de feiten en omstandigheden betreffende het
      rechtsprobleem waarvoor rechtsbijstand wordt gevraagd, de aan te voeren gronden dan wel een aanduiding van de
      werkzaamheden op basis van de toevoeging die ter zake van het rechtsprobleem nodig worden geacht.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
  - number: '24.4'
    text: |-
      De rechtsbijstandverlener kan slechts met instemming van het bestuur de toevoeging weigeren. Zolang de toevoeging
      niet is gewijzigd of ingetrokken, is hij verplicht de nodige rechtsbijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
  - number: '24.5'
    text: |-
      De toevoeging vermeldt een omschrijving van het rechtsbelang terzake waarvan de toevoeging is verleend. Het
      besluit vermeldt tevens het bedrag van de eigen bijdrage die op de voet van het bepaalde in [artikel 35][ref1]
      is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: 24a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen soorten zaken worden aangewezen die worden aangemerkt als zaken waarbij
      de rechtsbijstand bestaat uit het geven van een eenvoudig rechtskundig advies.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24a
  - number: 24a.2
    text: |-
      Indien blijkt dat de toevoeging in een zaak waarbij de rechtsbijstand bestaat uit het geven van een
      eenvoudig rechtskundig advies, niet toereikend is voor de verlening van rechtsbijstand in die zaak, vraagt de
      rechtsbijstandverlener zo spoedig mogelijk een wijziging van de toevoeging aan.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel24a
  - number: '25.1'
    text: |-
      Voorzover beschikbaar worden bij de aanvraag om een toevoeging in ieder geval het burgerservicenummer van de
      aanvrager en van degenen als bedoeld in [artikel 34, derde lid][ref1], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '25.2'
    text: |-
      Indien het een aanvraag betreft van een vreemdeling van wie geen burgerservicenummer beschikbaar is, verstrekt Onze
      Minister op verzoek van het bestuur de gegevens die voor de beoordeling van de aanvraag noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel25
  - number: '25.3'
    text: |-
      De inspecteur verstrekt op verzoek van het bestuur het bedrag aan vermogen dat meer bedraagt dan het heffingvrij
      vermogen van de rechtzoekende en van degenen als bedoeld in [artikel 34, derde lid][ref1]. Voor zover van de
      rechtzoekende of van degenen als bedoeld in artikel 34, derde lid, geen vermogens- of inkomensgegeven beschikbaar
      is, verstrekt de inspecteur op verzoek van het bestuur zo mogelijk het bedrag dat in het peiljaar het vermogen of
      inkomen zo goed mogelijk benadert.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '25.4'
    text: |-
      In de gevallen waarin de inspecteur niet beschikt over de gegevens over vermogen of inkomen, bedoeld in het
      derde lid, legt de aanvrager stukken over op grond waarvan het bestuur het bedrag aan vermogen of inkomen kan
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel25
  - number: '25.5'
    text: |-
      Met het oog op het vaststellen van de financiële draagkracht en van de hoogte van de eigen bijdrage van
      de rechtzoekende worden op verzoek van het bestuur uit de basisregistratie personen inlichtingen verstrekt
      over de rechtzoekende en degenen met wie de rechtzoekende een gezamenlijke huishouding voert als bedoeld in
      [artikel 34, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: '25.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de bij de aanvraag over te leggen
      gegevens en bescheiden alsmede omtrent het opvragen van het burgerservicenummer bij degenen wier inkomen of
      vermogen betrokken wordt bij de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel25
  - number: '27'
    text: |-
      Het bestuur kan, alvorens op de aanvraag te beslissen, de rechtzoekende horen, indien hij dat noodzakelijk acht
      voor de beoordeling van de aanvraag of de financiële draagkracht van de rechtzoekende. Het bestuur kan tevens,
      tenzij het belang van de rechtzoekende zich daartegen verzet, de tegenpartij in de gelegenheid stellen haar
      standpunt uiteen te zetten.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel27
  - number: '28.1'
    text: 'Het bestuur kan de toevoeging weigeren indien de aanvraag:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
  - number: 28.1.a
    text: wordt ingediend nadat de rechtsbijstand reeds feitelijk is verleend;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
  - number: 28.1.b
    text: |-
      betrekking heeft op een rechtsbelang ter zake waarvan de aanvrager aanspraak kan maken op rechtsbijstand op grond
      van een eerder afgegeven toevoeging;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
  - number: 28.1.c
    text: een rechtsprobleem betreft dat naar het oordeel van het bestuur eenvoudig afgehandeld kan worden;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
  - number: 28.1.d
    text: |-
      een rechtsprobleem betreft dat door de voorziening, bedoeld in [artikel 7, tweede lid][ref1], of door een
      voorziening als bedoeld in [artikel 8, tweede lid][ref2], voor zover belast met het verlenen van rechtshulp, kan
      worden afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel8
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '28.2'
    text: |-
      Bij de in [artikel 12, derde lid][ref1], bedoelde algemene maatregel van bestuur kunnen omtrent het in het eerste
      lid bepaalde nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '28.3'
    text: |-
      Het eerste lid, onderdelen a en c, is niet van toepassing, indien het betreft een toevoeging in een zaak waarbij de
      rechtsbijstand bestaat uit het geven van een eenvoudig rechtskundig advies. Het bestuur kan evenwel een aanvraag om
      deze toevoeging weigeren, indien de aanvraag niet binnen vier weken na het geven van het advies is ingediend.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een afschrift van het besluit tot toevoeging wordt zo spoedig mogelijk, doch in ieder geval voordat de
      einduitspraak is gedaan, overgelegd aan de rechter voor wie de zaak dient.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien op grond van de [Algemene wet bestuursrecht][ref1] bezwaar of administratief beroep wordt ingesteld en
      de belanghebbende een verzoek om een kostenvergoeding doet, wordt een afschrift van het besluit tot toevoeging
      zo spoedig mogelijk, doch in ieder geval voordat het bestuursorgaan op het bezwaar heeft beslist dan wel het
      beroepsorgaan op het beroep heeft beslist, overgelegd aan dat bestuurs- of beroepsorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '30.1'
    text: |-
      In spoedeisende gevallen verleent het bestuur een voorlopige toevoeging. Het bestuur beslist zo spoedig mogelijk
      daarna over definitieve toevoeging; dit besluit treedt met terugwerkende kracht in de plaats van die tot verlening
      van een voorlopige toevoeging.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel30
  - number: '30.2'
    text: |-
      Bij de verlening van de voorlopige toevoeging stelt het bestuur de aanvrager overeenkomstig
      [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] een termijn, waarbinnen deze de voor de
      beoordeling van zijn aanvraag om een definitieve toevoeging van belang zijnde gegevens moet hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '32'
    text: |-
      De toevoeging geldt uitsluitend voor het rechtsbelang ter zake waarvoor zij is verleend en, in het geval van
      een procedure, voor de behandeling daarvan in één instantie, de tenuitvoerlegging van de rechterlijke uitspraak
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel32
  - number: '33.1'
    text: 'Het bestuur kan de toevoeging, anders dan op verlangen van de aanvrager, wijzigen, beëindigen of intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
  - number: 33.1.a
    text: |-
      deze is verleend op grond van onjuiste of onvolledige gegevens omtrent de aard of het belang van de zaak, de
      financiële draagkracht of de woonplaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
  - number: 33.1.b
    text: de aanvrager de voor een goede behartiging van zijn zaak noodzakelijke medewerking weigert;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
  - number: 33.1.c
    text: |-
      de aanvrager in gebreke blijft de door hem verschuldigde eigen bijdrage en overige kosten die voor zijn rekening
      komen, dan wel een hem daarop gevraagd voorschot, te voldoen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
  - number: 33.1.d
    text: blijkt dat een andere toevoeging mede omvat het rechtsbelang waarvoor de toevoeging is verleend.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
  - number: '33.2'
    text: |-
      De toegevoegde rechtsbijstandverlener kan zich na beëindiging of intrekking van de toevoeging aan de zaak
      onttrekken.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
  - number: '33.3'
    text: |-
      Indien de toevoeging wordt beëindigd of ingetrokken op grond van een situatie als bedoeld in
      het eerste lid, onder a, kan het bestuur het bedrag ter hoogte van de vergoeding, bedoeld in
      [artikel 37][ref1], vorderen van de rechtzoekende, tenzij de verlening van de vergoeding op grond van
      [artikel 4:48, eerste lid, onder c of d, van de Algemene wet bestuursrecht][ref2] is ingetrokken of gewijzigd
      of de vergoeding op grond van [artikel 4:46, tweede lid, onder c of d, van de Algemene wet bestuursrecht][ref3]
      lager is vastgesteld dan wel de vaststelling van de vergoeding op grond van
      [artikel 4:49, eerste lid, onder b, van die wet][ref4] is ingetrokken of ten nadele van de rechtsbijstandverlener
      is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 33a
    text: |-
      Mediation wordt voor de toepassing van deze wet verricht door overeenkomstig [artikel 33b][ref1] ingeschreven
      mediators.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33b
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 33b
        hoofdstuk: IVa
  - number: 33b.1
    text: |-
      Alle in Nederland kantoor houdende mediators die daartoe een aanvraag hebben ingediend, worden door het bestuur
      ingeschreven, indien zij voldoen aan de door het bestuur vastgestelde voorwaarden. Het bestuur kan regels stellen
      met betrekking tot deze voorwaarden. Deze regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33b
  - number: 33b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op mediators uit andere lidstaten van de Europese Unie, met
      uitzondering van Denemarken, die geen kantoor houden in Nederland.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33b
  - number: 33c
    text: |-
      De door het bestuur te stellen regels als bedoeld in [artikel 33b, eerste lid][ref1], met betrekking tot de
      voorwaarden kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33b
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 33b
        hoofdstuk: IVa
  - number: 33c.a
    text: de vakbekwaamheidseisen die aan de mediator worden gesteld;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33c.b
    text: |-
      de mate van gebondenheid aan door de beroepsgroep algemeen aanvaarde normen betreffende de beroepsethiek en
      beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33c.c
    text: |-
      de wijze waarop schendingen van de algemene norm betreffende de beroepsethiek en beroepsuitoefening worden
      afgehandeld;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33c.d
    text: de medewerking door de mediator aan onderzoek naar de werking van mediation en aan evaluatie;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33c.e
    text: de verslaglegging door de mediator van de door hem verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33c.f
    text: de beroepsaansprakelijkheidsverzekering;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33c.g
    text: de organisatie van het kantoor waar de mediator werkzaam is.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33c
  - number: 33d.1
    text: |-
      Het bestuur kan de inschrijving doorhalen indien de mediator niet voldaan heeft dan wel niet langer voldoet aan de
      voor de inschrijving gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33d
  - number: 33d.2
    text: |-
      [Artikel 17, tweede lid, onder b, d, e en f][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel17
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: 33e.1
    text: |-
      De [artikelen 12, uitgezonderd het tweede lid, onderdelen c, d en f][ref1],
      [24, tweede tot en met vijfde lid][ref2], [25 tot en met 27][ref3], [28, eerste en tweede lid][ref4], en
      [30 tot en met 32][ref5] zijn van overeenkomstige toepassing op de verlening van een toevoeging met het oog op
      mediation. Bij de aanvraag om een toevoeging wordt de overeenkomst waarin de rechtzoekende en zijn wederpartij
      hebben verklaard in te stemmen met mediation overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel24
