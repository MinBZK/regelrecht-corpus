  - number: '43.3'
    text: |-
      Indien een raadsman is aangewezen krachtens [artikel 39][ref1], [40][ref2] of
      [41 van het Wetboek van Strafvordering][ref3] en indien de uitspraak tegen de veroordeelde onherroepelijk is
      geworden, kan het bestuur het bedrag ter hoogte van de vergoeding, bedoeld in [artikel 37][ref4], vorderen van
      de veroordeelde wiens financiële draagkracht de in [artikel 34][ref5] genoemde bedragen overschrijdt. Omtrent
      de verplichting tot betaling door de veroordeelde zijn de [artikelen 25, derde tot en met vijfde lid][ref6],
      [34a][ref7], [34b][ref8], [34c][ref9] en [34d][ref10] van overeenkomstige toepassing, met dien verstande dat onder
      «de rechtzoekende» steeds wordt verstaan: de veroordeelde. Bij gebreke van volledige betaling kan het bestuur na
      een aanmaning als bedoeld in [artikel 4:112 van de Algemene wet bestuursrecht][ref11] het bedrag invorderen bij
      dwangbevel als bedoeld in [artikel 4:114 van de Algemene wet bestuursrecht][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel41
