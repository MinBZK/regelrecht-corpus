        bwb_id: BWBR0002093
        artikel: 16h
  - number: '2.1'
    text: Er is een raad voor rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel2
  - number: '2.2'
    text: |-
      De raad heeft zijn zetel te Utrecht en vestigingen in een of meer bij algemene maatregel van bestuur aan te wijzen
      plaatsen in elk ressort.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel2
  - number: '2.3'
    text: De raad bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel2
  - number: '2.4'
    text: De raad heeft een bestuur en een raad van advies.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel2
  - number: '2.5'
    text: Het bestuur kan na goedkeuring van Onze Minister een nevenvestiging openen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel2
  - number: '3.1'
    text: |-
      Aan het hoofd van de raad voor rechtsbijstand staat het bestuur. Het bestuur vertegenwoordigt de raad in en buiten
      rechte.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het bestuur bestaat uit ten hoogste drie leden, waaronder een voorzitter. Het lidmaatschap van het bestuur is
      onverenigbaar met het lidmaatschap van de raad van advies.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel3
  - number: '3.3'
    text: |-
      De leden van het bestuur worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen na afloop van deze
      periode aansluitend tweemaal opnieuw worden herbenoemd voor een termijn van ten hoogste vier jaren. Onze Minister
      wijst de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het bestuur besluit met volstrekte meerderheid van uitgebrachte stemmen. Elk lid heeft één stem. Indien de stemmen
      staken beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het bestuur stelt bij reglement in ieder geval regels omtrent zijn werkwijze, procedures en besluitvorming alsmede
      de vertegenwoordiging van het bestuur, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel3
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '3'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '4.3'
    text: |-
      Het bestuur verstrekt, onverminderd zijn verplichtingen jegens Onze Minister ingevolge
      [artikel 20 van de Kaderwet][ref1], desgevraagd inlichtingen aan de raad van advies. Artikel 20 van de Kaderwet is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '5.1'
    text: |-
      De [artikelen 9][ref1], [11 tot en met 14][ref2], [18][ref3], [20][ref4], [21][ref5], [23][ref6],
      [39, eerste lid][ref7], en [41 van de Kaderwet][ref8] zijn van overeenkomstige toepassing op de raad van advies,
      met dien verstande dat:


