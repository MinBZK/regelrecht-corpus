        bwb_id: BWBR0006368
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: '38'
        hoofdstuk: V
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006368
        artikel: '41'
        hoofdstuk: V
        afdeling: '2'
  - number: 33e.4
    text: |-
      De [artikelen 46][ref1] en [47][ref2] zijn eveneens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel47
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '46'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '47'
        hoofdstuk: VIII
  - number: '34.1'
    text: |-
      Rechtsbijstand overeenkomstig de bepalingen van deze wet wordt verleend aan hen wier inkomen per jaar € 21 800 of
      minder bedraagt, indien zij alleenstaand zijn, dan wel, indien zij met één of meer anderen een gemeenschappelijke
      huishouding voeren, ten hoogste € 31 000 .
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34
  - number: '34.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid wordt geen rechtsbijstand verleend, indien de rechtzoekende
      beschikt over een vermogen dat meer bedraagt dan het heffingvrij vermogen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34
  - number: '34.3'
    text: |-
      Bij de vaststelling van het inkomen en vermogen van de rechtzoekende worden, behoudens het geval van onderling
      tegenstrijdige belangen, mede in aanmerking genomen het inkomen en vermogen van:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34
  - number: 34.3.a
    text: |-
      de echtgenoot of geregistreerde partner van de rechtzoekende, tenzij deze op het moment van de aanvraag duurzaam
      van hem gescheiden leeft;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34
  - number: 34.3.b
    text: |-
      de persoon van verschillend of gelijk geslacht met wie de rechtzoekende duurzaam een gezamenlijke huishouding
      voert, tenzij tussen deze en de rechtzoekende op het moment van de aanvraag een bloedverwantschap in de eerste of
      tweede graad bestaat.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34
  - number: '34.4'
    text: |-
      De inkomensgrenzen, bedoeld in het eerste lid, worden jaarlijks per 1 januari aangepast met het percentage waarmee
      het indexcijfer van de lonen op 31 oktober van het voorgaande jaar afwijkt van het overeenkomstige indexcijfer
      op 31 oktober in het daaraan voorafgaande jaar, met dien verstande dat afronding plaatsvindt op het naastliggende
      veelvoud van EUR 100,-. Onze Minister maakt jaarlijks de geïndexeerde bedragen bekend door publicatie in de
      Staatscourant. Bij algemene maatregel van bestuur wordt bepaald wat onder het indexcijfer van de lonen, bedoeld in
      de eerste volzin, wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34
  - number: 34a.1
    text: |-
      Het inkomen van de rechtzoekende is het inkomensgegeven in het peiljaar. Voor zover van de rechtzoekende geen
      inkomensgegeven beschikbaar is, wordt onder inkomen verstaan het bedrag dat in het peiljaar het inkomen zo
      goed mogelijk benadert, dan wel het door het bestuur op grond van door de rechtzoekende overgelegde gegevens
      vastgestelde bedrag aan inkomen. Indien een inkomensgegeven over het peiljaar beschikbaar is dat afwijkt van
      het eerder toegepaste inkomensgegeven of het bedrag, bedoeld in de tweede volzin, en dat gevolg heeft voor
      het al dan niet verlenen van een toevoeging of de hoogte van de door de rechtzoekende verschuldigde eigen
      bijdrage, neemt het bestuur ambtshalve een besluit dat in de plaats komt van het eerder genomen besluit.
      [Artikel 34d, eerste lid, derde volzin][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34d
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34d
        hoofdstuk: V
        afdeling: '1'
  - number: 34a.2
    text: |-
      Indien op grond van het ambtshalve besluit van het bestuur, bedoeld in het eerste lid, de rechtzoekende een
      hogere eigen bijdrage verschuldigd is, is hij hetgeen meer moet worden betaald verschuldigd aan het bestuur. Is
      de rechtzoekende een lagere eigen bijdrage of geen eigen bijdrage verschuldigd, dan kan hij het teveel betaalde
      vorderen van het bestuur. Over de te betalen of te vorderen bedragen worden geen renten en kosten vergoed.
      [Artikel 34f][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34f
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34f
        hoofdstuk: V
        afdeling: '1'
  - number: 34a.3
    text: Het vermogen is het vermogen in het peiljaar. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34a
  - number: 34a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven voor de vaststelling van het voor de
      financiële draagkracht in aanmerking te nemen inkomen en vermogen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34a
  - number: 34b
    text: |-
      [Artikel 34a][ref1] is van overeenkomstige toepassing op het vaststellen van het inkomen en vermogen van een andere
      persoon dan de rechtzoekende als bedoeld in [artikel 34, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
  - number: 34c.1
    text: |-
      Indien in het jaar waarin de aanvraag om een toevoeging is gedaan sprake is van een terugval in het inkomen
      of vermogen, neemt het bestuur op aanvraag van de rechtzoekende een besluit dat is gebaseerd op het inkomen of
      vermogen in het jaar waarin de aanvraag om een toevoeging is gedaan. [Artikel 25, derde en vierde lid][ref1], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel25
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '25'
        hoofdstuk: IV
  - number: 34c.2
    text: |-
      Onder terugval van inkomen of vermogen wordt verstaan een vermindering van het inkomen of vermogen met ten minste
      15% ten opzichte van het peiljaar.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34c
  - number: 34c.3
    text: |-
      De aanvraag wordt bij het bestuur ingediend binnen zes weken na de bekendmaking van het besluit waarin is beslist
      op de aanvraag om een toevoeging.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34c
  - number: 34c.4
    text: |-
      Bij de aanvraag wordt overgelegd een verklaring waarin de oorzaak van de inkomens- of vermogensdaling wordt
      toegelicht.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34c
  - number: 34d.1
    text: |-
      Indien het bestuur de aanvraag, bedoeld in [artikel 34c, eerste lid][ref1], niet heeft afgewezen, neemt het bestuur
      indien een inkomensgegeven over het jaar van de aanvraag beschikbaar is dat afwijkt van het eerder toegepaste
      inkomensgegeven of het bedrag, bedoeld in [artikel 34a, eerste lid][ref2], tweede volzin, en dat gevolg heeft voor
      het al dan niet verlenen van een toevoeging of de hoogte van de door de rechtzoekende verschuldigde eigen bijdrage,
      ambtshalve een besluit dat in de plaats komt van het eerder genomen besluit, bedoeld in [artikel 34c][ref3],
      eerste lid, met dien verstande dat dit besluit niet van een hoger inkomensgegeven uitgaat dan zou zijn toegepast
      in het peiljaar, bedoeld in [artikel 34a, eerste lid][ref4]. De vorige volzin is van overeenkomstige toepassing
      op het vermogen in het jaar van de aanvraag. Het besluit heeft geen gevolg voor de beschikking tot verlening
      en vaststelling van de vergoeding alsmede voor het recht van de rechtsbijstandverlener om de eigen bijdrage die
      voortvloeit uit de draagkracht zoals berekend in het eerder genomen besluit te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34c
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel34c
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34c
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 34a
        hoofdstuk: V
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: 34c
        hoofdstuk: V
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0006368
        artikel: 34a
        hoofdstuk: V
        afdeling: '1'
  - number: 34d.2
    text: |-
      [Artikel 34a, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34a
        hoofdstuk: V
        afdeling: '1'
  - number: 34d.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het bestuur mag beslissen
      tot de verlening van een toevoeging, indien het geschatte inkomen of vermogen de grenzen, genoemd in
      [artikel 34, eerste en tweede lid][ref1], overschrijdt dan wel de terugval in het inkomen of vermogen minder is
      dan 15%. In die gevallen is de eigen bijdrage gelijk aan de ingevolge de algemene maatregel van bestuur, bedoeld in
      [artikel 35, tweede lid][ref2], hoogst mogelijke eigen bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: 34e.1
    text: |-
      De beslissing op het bezwaar tegen de beslissing op de aanvraag om een toevoeging wordt geacht mede betrekking te
      hebben op de beslissing op de aanvraag, bedoeld in [artikel 34c, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34c
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34e
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34c
        hoofdstuk: V
        afdeling: '1'
  - number: 34e.2
    text: |-
      Indien de aanvraag, bedoeld in [artikel 34c, eerste lid][ref1], later is ingediend dan het bezwaarschrift wordt
      in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref2] de termijn waarbinnen het bestuur beslist
      geacht aan te vangen bij ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34e
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34c
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 34e.3
    text: |-
      Indien het bezwaarschrift later is ingediend dan de aanvraag om peiljaarverlegging wordt de termijn waarbinnen het
      bestuur op de aanvraag om peiljaarverlegging moet beslissen opgeschort tot het moment waarop op het bezwaar wordt
      beslist.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34e
  - number: 34f.1
    text: |-
      De rechtzoekende is het bedrag dat in het kader van de verlening van rechtsbijstand door het bestuur is betaald aan
      de rechtsbijstandverlener verschuldigd aan het bestuur, indien de rechtzoekende op grond van het besluit, bedoeld
      in [artikel 34d, eerste lid][ref1], geen recht heeft op de verlening van rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34d
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34d
        hoofdstuk: V
        afdeling: '1'
  - number: 34f.2
    text: |-
      Het bestuur vordert het bedrag, bedoeld in het eerste lid, van de rechtzoekende, tenzij zwaarwegende omstandigheden
      zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34f
  - number: 34f.3
    text: |-
      Bij het vaststellen van de termijn of de termijnen waarbinnen moet worden betaald, houdt het bestuur rekening met
      de draagkracht van de rechtzoekende.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34f
  - number: 34f.4
    text: |-
      Bij gebreke van volledige betaling kan het bestuur na een aanmaning als bedoeld in
      [artikel 4:112 van de Algemene wet bestuursrecht][ref1] invorderen bij dwangbevel als bedoeld in
      [artikel 4:114 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 34g.1
    text: |-
      Tenzij zwaarwegende omstandigheden zich daartegen verzetten, wordt de toevoeging met terugwerkende kracht
      ingetrokken, indien:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34g
  - number: 34g.1.a
    text: de rechtzoekende de kosten van rechtsbijstand kan verhalen op een derde, of
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34g
  - number: 34g.1.b
    text: |-
      op het moment van de definitieve afhandeling van de zaak waarvoor die toevoeging was verleend de rechtzoekende
      als resultaat van die zaak een vordering met betrekking tot een geldsom ter hoogte van tenminste 50% van het
      drempelbedrag, genoemd in [artikel 9.4a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001](onbekend)
      heeft.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34g
  - number: 34g.2
    text: Het eerste lid, onder b, is niet van toepassing in zaken betreffende het strafrecht en het vreemdelingenrecht.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34g
  - number: 34g.3
    text: |-
      [Artikel 34a, tweede lid, tweede, derde en vierde volzin][ref1], en [artikel 34d, eerste lid, derde volzin][ref2],
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34d
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel34g
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 34a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 34d
        hoofdstuk: V
        afdeling: '1'
  - number: '35.1'
    text: |-
      Tenzij bij algemene maatregel van bestuur anders is bepaald, is de rechtzoekende een eigen bijdrage verschuldigd
      voor de verlening van rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel35
  - number: '35.2'
    text: |-
      De regels omtrent de eigen bijdrage, alsmede de hoogte van de eigen bijdrage worden bij algemene maatregel van
      bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel35
  - number: '36'
    text: |-
      Aan rechtspersonen wordt overeenkomstig de bepalingen van deze wet rechtsbijstand verleend, indien van de
      rechtspersoon redelijkerwijze niet verwacht kan worden dat deze de kosten van rechtsbijstand betaalt uit eigen
      vermogen of inkomsten, waaronder begrepen bijdragen van leden of betrokkenen, alsmede subsidies van de overheid.
      [Artikel 35][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
  - number: '37.1'
    text: 'Het bestuur verstrekt aan een rechtsbijstandverlener een subsidie, genoemd vergoeding, voor:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.1.a
    text: de door hem op basis van een toevoeging verleende rechtsbijstand;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.1.b
    text: |-
      de door hem verleende rechtsbijstand in een zaak waarin een rechtsbijstandverlener rechtsbijstand heeft verleend
      in het kader van een door het bestuur getroffen regeling voor het beurtelings verlenen van rechtsbijstand in bij
      algemene maatregel van bestuur aan te wijzen zaken.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: '37.2'
    text: |-
      De vergoeding omvat mede de bij algemene maatregel van bestuur aan te wijzen overige kosten die verband houden met
      de verlening van rechtsbijstand alsmede de omzetbelasting die over de vergoeding is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: '37.3'
    text: |-
      De voor de rechtzoekende vastgestelde eigen bijdrage wordt op de in het eerste lid bedoelde vergoeding in mindering
      gebracht.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: '37.4'
    text: Aan ingeschreven advocaten wordt periodiek een voorschot toegekend.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: '37.5'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden vastgesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.a
    text: het bedrag van de vergoeding en de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.b
    text: de aanvraag van de vergoeding en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.c
    text: de voorwaarden waaronder de vergoeding wordt verleend;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.d
    text: de verplichtingen van de rechtsbijstandverlener;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.e
    text: de vaststelling van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.f
    text: de wijziging van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.g
    text: de verlening van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.h
    text: de betaling van de vergoeding;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37.5.i
    text: de naleving.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37
  - number: 37a
    text: |-
      Indien een rechtspersoon een gehele of gedeeltelijke geldelijke bijdrage ontvangt voor de verlening van
      rechtskundige diensten, worden aan een advocaat die een privaatrechtelijke of publiekrechtelijke dienstbetrekking
      heeft bij deze rechtspersoon geen vergoeding verstrekt voorzover de door hem op basis van een toevoeging verleende
      rechtsbijstand redelijkerwijs kan worden aangemerkt als een rechtskundige dienst waarvoor een geldelijke bijdrage
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37a
  - number: 37b.1
    text: |-
      Het bestuur kan aan een rechtsbijstandverlener of een samenwerkingsverband van rechtsbijstandverleners ten behoeve
      van de verlening van rechtsbijstand subsidie verstrekken voor bijzondere doeleinden en projecten.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.2
    text: Het bestuur kan een subsidieplafond vaststellen voor de activiteiten waarvoor subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.3
    text: Het bestuur stelt regels vast voor de verstrekking van subsidies als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4
    text: 'Deze regels bevatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4.a
    text: een uitwerking van de activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4.b
    text: een nadere omschrijving van aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4.c
    text: de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4.d
    text: de aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4.e
    text: de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht moet worden genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.4.f
    text: de wijze waarop en de termijn waarbinnen het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37b.5
    text: De door het bestuur te stellen regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37b
  - number: 37c
    text: |-
      Het bestuur kan met het oog op de verlening van rechtsbijstand een subsidie verstrekken voor bijzondere doeleinden
      en projecten. [Artikel 37b, tweede tot en met vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37b
        hoofdstuk: V
        afdeling: '2'
  - number: '38.1'
    text: |-
      De rechtzoekende is de hem opgelegde eigen bijdrage van rechtswege verschuldigd aan degene die hem de
      rechtsbijstand verleent. Voor het overige is hij geen vergoeding verschuldigd, behoudens voor kosten die meer in
      het bijzonder ten behoeve van zijn zaak zijn gemaakt, voor zover die op grond van [artikel 41][ref1] aan hem in
      rekening mogen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel41
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '41'
        hoofdstuk: V
        afdeling: '2'
  - number: '38.2'
    text: |-
      De ingevolge [artikel 35][ref1] verschuldigde eigen bijdrage bedraagt niet meer dan het bedrag van de vergoeding
      waarop de rechtsbijstandverlener ingevolge [artikel 37][ref2] recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '38.3'
    text: |-
      De rechtsbijstandverlener licht de rechtzoekende vooraf zo goed mogelijk in over de kosten die voor hem aan de te
      verlenen rechtsbijstand verbonden zijn. Hij kan ter verzekering van de inning van de eigen bijdrage en de overige
      aan de zaak verbonden kosten die voor rekening van de rechtzoekende komen, verlangen dat de rechtzoekende een
      voorschot betaalt.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel38
  - number: '38.4'
    text: |-
      Indien de rechtzoekende weigerachtig blijft de door hem aan de rechtsbijstandverlener verschuldigde bijdrage en
      vergoeding voor de kosten te voldoen, wordt het bedrag daarvan nader vastgesteld door de president van de rechtbank
      van het arrondissement waarin de rechtsbijstandverlener is gevestigd.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel38
  - number: '38.5'
    text: |-
      De in het eerste lid bedoelde eigen bijdrage is van rechtswege verschuldigd aan de voorziening die door het bestuur
      is getroffen voor de verlening van rechtsbijstand, indien de rechtsbijstand door medewerkers van die voorziening
      is verleend.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel38
  - number: '39'
    text: |-
      Bij de in [artikel 37, vijfde lid][ref1], bedoelde algemene maatregel van bestuur worden regels gesteld voor
      de vergoedingen voor diensten die bij de verlening van rechtsbijstand zijn verricht door deurwaarders en, in
      strafzaken, door tolken, alsmede omtrent betaling van krachtens wettelijk voorschrift of rechterlijk bevel in dag-
      of nieuwsbladen geplaatste oproepingen of aankondigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '40'
    text: |-
      De rechtzoekende is geen kosten verschuldigd voor het uitbrengen van een exploit of het opmaken van een proces-
      verbaal in een zaak waarin op grond van deze wet rechtsbijstand wordt verleend, noch voor de bijstand bij de
      tenuitvoerlegging van de in een zodanige zaak gegeven uitspraak.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel40
  - number: '41.1'
    text: |-
      Bij de in [artikel 37, vijfde lid][ref1], bedoelde algemene maatregel van bestuur worden regels gesteld omtrent
      de kosten die ten behoeve van de zaak zijn gemaakt en die door de rechtsbijstandverlener in rekening mogen worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '41.2'
    text: |-
      Tevens kunnen bij deze algemene maatregel van bestuur regels worden gesteld omtrent de gegevens die de
      rechtsbijstandverlener aan het bestuur dient over te leggen inzake:
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel41
  - number: 41.2.a
    text: de aan de rechtzoekende boven de eigen bijdrage in rekening gebrachte kosten;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel41
  - number: 41.2.b
    text: de aan de zaak bestede tijd;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel41
  - number: 41.2.c
    text: de wijze waarop de zaak is behandeld.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel41
  - number: '42.1'
    text: |-
      Onze Minister verstrekt de raad een subsidie voor de uitvoering van de wettelijke taken van het bestuur en de raad
      van advies.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
  - number: '42.2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '42.3'
    text: De subsidie wordt per boekjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
  - number: '42.4'
    text: |-
      [Afdeling 4.2.8][ref1], met uitzondering van de [artikelen 4:71][ref2] en
      [4:72, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref3] is van toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42.4.a
    text: |-
      de overeenkomstig [artikel 26 van de Kaderwet][ref1] toe te zenden begroting betrekking heeft op het boekjaar en
      Onze Minister bij de ingevolge dat artikel vast te stellen datum rekening houdt met de [artikelen 4:60][ref2] en
      [4:61 van de Algemene wet bestuursrecht][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42.4.b
    text: |-
      in afwijking van [artikel 4:63 van de Algemene wet bestuursrecht][ref1] op de inhoud van de begroting de
      [artikelen 27][ref2] en [28 van de Kaderwet][ref3] van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel28
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '28'
  - number: 42.4.c
    text: |-
      het activiteitenverslag, bedoeld in [artikel 4:80 van de Algemene wet bestuursrecht][ref1], wordt opgenomen in het
      jaarverslag, bedoeld in [artikel 18 van de Kaderwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 42a.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.a
    text: |-
      de gegevens die Onze Minister met het oog op het opstellen van de begroting verstrekt aan de raad, alsmede op welk
      tijdstip deze gegevens uiterlijk worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.b
    text: de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.c
    text: de bij de aanvraag tot subsidieverlening over te leggen gegevens of bescheiden;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.d
    text: 'de eisen waaraan de begroting moet voldoen:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.e
    text: de wijze waarop de subsidie wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.f
    text: het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.g
    text: |-
      de gevallen waarin de raad een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42a.1.h
    text: de omvang en aanvulling van de egalisatiereserves en de aanwending van overschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.i
    text: de overige aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.j
    text: de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.k
    text: de termijn waarbinnen Onze Minister op de aanvraag tot vaststelling van de subsidie beslist;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.1.l
    text: |-
      het onderzoek door de accountant, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42a.1.m
    text: de overige eisen waaraan het financiële verslag en het activiteitenverslag moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
  - number: 42a.2
    text: |-
      Onze Minister stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.1
    text: |-
      Het bestuur kan met het oog op de uitoefening van zijn taken een subsidie verstrekken aan één of meer
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.2
    text: |-
      Op de subsidie, die per boekjaar wordt verstrekt, is [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 42b.3
    text: 'Het bestuur stelt regels over de verstrekking van de subsidie, die in ieder geval bepalingen omvatten omtrent:'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.3.a
    text: de termijn die bij de indiening van de aanvraag tot subsidieverlening in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.3.b
    text: het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.3.c
    text: |-
      de gevallen waarin de voorziening een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.3.d
    text: |-
      de handelingen, bedoeld in [artikel 4:71 van de Algemene wet bestuursrecht][ref1], waarvoor de voorziening de
      toestemming van het bestuur behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.3.e
    text: het vormen van een egalisatiereserve door de voorziening;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.3.f
    text: de overige aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.3.g
    text: de termijn die bij de indiening van de aanvraag tot vaststelling van de subsidie in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.3.h
    text: |-
      het onderzoek door de accountant, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.4
    text: |-
      Het bestuur stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42b.5
    text: |-
      De door het bestuur op te stellen regels voor de subsidiëring van een voorziening behoeven de goedkeuring van Onze
      Minister. De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
  - number: 42b.6
    text: |-
      Voorzover noodzakelijk met het oog op het onderzoek door de accountant, bedoeld in
      [artikel 4:78 van de Algemene wet bestuursrecht][ref1], verstrekt de voorziening persoonsgegevens van
      rechtzoekenden aan de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 42c.1
    text: |-
      Het bestuur kan met het oog op de uitvoering van zijn taak subsidie verstrekken voor bijzondere doeleinden en
      projecten.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42c
  - number: 42c.2
    text: |-
      Het tweede tot en met vijfde lid van [artikel 37b][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel37b
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: 37b
        hoofdstuk: V
        afdeling: '2'
  - number: '43.1'
    text: |-
      In de gevallen waarin krachtens een wettelijk voorschrift in het [Wetboek van Strafrecht][ref1] of het
      [Wetboek van Strafvordering][ref2] voor een verdachte, veroordeelde of gewezen verdachte een raadsman door het
      bestuur wordt aangewezen of op last van de rechter door het bestuur wordt toegevoegd, is deze bijstand kosteloos,
      onverminderd het derde lid. De eerste volzin is niet van toepassing op de bijstand die door een aangewezen raadsman
      wordt verleend tijdens het in [artikel 28d van het Wetboek van Strafvordering][ref3] bedoelde verhoor van een
      verdachte van een strafbaar feit waarvoor geen voorlopige hechtenis is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel28d
