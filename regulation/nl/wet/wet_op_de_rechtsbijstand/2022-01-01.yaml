  - number: 33e.2
    text: |-
      [Artikel 33][ref1] is van overeenkomstige toepassing op de toevoeging voor mediation met uitzondering van het
      eerste lid, onder d.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel33
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33e
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '33'
        hoofdstuk: IV
  - number: 33e.3
    text: |-
      [Afdeling 1 van Hoofdstuk V][ref1] en de [artikelen 37, eerste, tweede, derde en vijfde lid][ref2],
      [37a tot en met 38][ref3] en [41][ref4] zijn van overeenkomstige toepassing voor het bepalen van de draagkracht
      alsmede van de eigen bijdrage van de rechtzoekende aan wie een toevoeging met het oog op mediation is verleend en
      voor het bepalen van de kosten van mediation.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel41
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel33e
    references:
