      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel20
