  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen worden onder advocaten mede verstaan de personen, bedoeld in
      [artikel 16h van de Advocatenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel1
    references:
