      [ref7]: https://wetten.overheid.nl/BWBR0020495#Artikel39
      [ref8]: https://wetten.overheid.nl/BWBR0020495#Artikel41
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel5
