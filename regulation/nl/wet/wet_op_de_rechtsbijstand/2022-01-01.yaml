  - number: '43.4'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel43
  - number: '44.1'
    text: |-
      Aan personen die zich krachtens het [Wetboek van Strafrecht][ref1] of het [Wetboek van Strafvordering][ref2] door
      een raadsman kunnen doen bijstaan, kan het bestuur een advocaat toevoegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
  - number: '44.2'
    text: |-
      De eigen bijdrage is niet verschuldigd, indien een zaak eindigt zonder de toepassing van een straf
      of maatregel dan wel zonder toepassing van [artikel 9a Wetboek van Strafrecht][ref1]. De eigen
      bijdrage is evenmin verschuldigd voor de behandeling van het beroep in cassatie als bedoeld in
      [Titel III van het Derde Boek van het Wetboek van Strafvordering][ref2] van de verdachte wiens vrijheid krachtens
      een bevel tot voorlopige hechtenis is benomen, of in een procedure tot herziening ten voordele als bedoeld in de
      [Achtste Titel van het Derde Boek van het Wetboek van Strafvordering][ref3] in geval de gewezen verdachte krachtens
      de onherroepelijke rechterlijke uitspraak zijn vrijheid is benomen. De rechtsbijstandverlener restitueert de eigen
      bijdrage aan de rechtzoekende, tenzij deze de eigen bijdrage nog niet heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0001903
      - id: ref3
        bwb_id: BWBR0001903
  - number: '44.3'
    text: |-
      Het bestuur is bevoegd geen eigen bijdrage op te leggen bij de toevoeging van een raadsman aan hen
      die zich anders dan als verdachte of veroordeelde krachtens het [Wetboek van Strafrecht][ref1] of
      [Wetboek van Strafvordering][ref2] laten bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
  - number: '44.4'
    text: |-
      Ongeacht de draagkracht is rechtsbijstand aan een slachtoffer van een misdrijf tegen de zeden of een
      geweldsmisdrijf onderscheidenlijk aan een nabestaande van een slachtoffer van een zodanig misdrijf,
      indien het slachtoffer als gevolg van dat misdrijf is overleden, kosteloos, indien in de desbetreffende
      zaak vervolging is ingesteld en het slachtoffer onderscheidenlijk de nabestaande overeenkomstig
      [artikel 3 van de Wet schadefonds geweldsmisdrijven][ref1] in aanmerking komt voor een uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel3
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '3'
  - number: 44a.1
    text: |-
      Indien een verdachte in een strafzaak is bijgestaan door een raadsman die op het moment van de verlening van
      rechtsbijstand is toegevoegd, wordt met uitzondering van de vergoeding van de eigen bijdrage, geen kostenvergoeding
      van een raadsman als bedoeld in [artikel 530, tweede lid, van het Wetboek van Strafvordering][ref1] toegekend,
      tenzij de toevoeging, anders dan na een daartoe ingediende aanvraag, wordt ingetrokken of beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel530
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '530'
  - number: 44a.2
    text: |-
      In het geval op last van de rechter een raadsman is toegevoegd, wordt overeenkomstig het eerste lid geen
      kostenvergoeding toegekend, indien de toevoeging op of na de uitspraak van de rechter na een daartoe ingediend
      verzoek van de verdachte bij de rechterlijke instantie die een last heeft verstrekt, wordt ingetrokken of
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel44a
  - number: '47.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de ontvanger van de subsidie onderscheidenlijk
      vergoeding opgelegde verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel47
  - number: '47.2'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '47.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel47
  - number: '47.4'
    text: |-
      Aan door Onze Minister verstrekte subsidies onderscheidenlijk vergoedingen is de verplichting verbonden dat de
      ontvanger van de subsidie onderscheidenlijk vergoeding aan een toezichthouder alle medewerking verleent die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel47
  - number: '48'
    text: |-
      [Artikel 10, eerste lid, van de Vreemdelingenwet 2000][ref1] is niet van toepassing op de aanspraken op
      rechtsbijstand overeenkomstig deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '10'
  - number: '49'
    text: |-
      De voordracht voor een krachtens de [artikelen 12, derde lid][ref1], [34a, vierde lid][ref2], [35][ref3] en
      [37, vijfde lid][ref4], vastgestelde algemene maatregel van bestuur wordt niet gedaan dan nadat het ontwerp in de
      *Staatscourant* is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop
      de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen. Gelijktijdig met de
      bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel37
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: 34a
        hoofdstuk: V
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0006368
        artikel: '35'
        hoofdstuk: V
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0006368
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '66.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel66
  - number: '66.2'
    text: |-
      Met ingang van dezelfde datum wordt de Wet rechtsbijstand aan on- en minvermogenden ingetrokken met dien
      verstande dat deze laatste wet en de daarop steunende bepalingen, in afwijking van het gestelde in Artikel
      IV van de Wet van 22 december 1983 tot wijziging van de Wet rechtsbijstand aan on- en minvermogenden, van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] en van de [Wet griffierechten burgerlijke zaken][ref2] van
      toepassing blijven op rechtsbijstand die krachtens een voor deze datum genomen beslissing aan een rechtzoekende
      wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0028899
  - number: '67'
    text: 'Deze wet kan worden aangehaald als: Wet op de rechtsbijstand.'
    url: https://wetten.overheid.nl/BWBR0006368/2022-01-01#Artikel67
