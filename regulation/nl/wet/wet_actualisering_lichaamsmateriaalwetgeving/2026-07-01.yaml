preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo, Wij in overweging genomen hebben, dat het wenselijk is de lichaamsmateriaalwetgeving beter aan te laten
    sluiten op de gewijzigde praktijk en onduidelijkheden weg te nemen.


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051385/2026-07-01#ArtikelAanhef
articles:
  - number: VIa
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      gevolgen van de uitzondering op het winstuitkeringsverbod voor lichaamsmateriaal dat wordt verkregen als grondstof
      voor een geneesmiddel of een medisch hulpmiddel, bedoeld in [artikel 9, zesde lid, aanhef en onder c][ref1], in het
      bijzonder de gevolgen voor de donorveiligheid en donatiebereidheid, en vervolgens telkens na vijf jaar of zoveel
      eerder als noodzakelijk blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
    url: https://wetten.overheid.nl/BWBR0051385/2026-07-01#ArtikelVIa
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '9'
  - number: VII
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0051385/2026-07-01#ArtikelVII
  - number: VIII
    text: 'Deze wet wordt aangehaald als: Wet actualisering lichaamsmateriaalwetgeving.'
    url: https://wetten.overheid.nl/BWBR0051385/2026-07-01#ArtikelVIII
