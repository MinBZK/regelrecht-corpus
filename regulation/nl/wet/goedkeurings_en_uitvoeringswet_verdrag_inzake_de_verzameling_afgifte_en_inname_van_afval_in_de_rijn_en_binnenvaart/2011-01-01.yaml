preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het op 9 september 1996 te Straatsburg tot stand gekomen Verdrag inzake
    de verzameling, afgifte en inname van afval in de Rijn- en binnenvaart (Trb. 1996, 293) ingevolge artikel 91,
    eerste lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft, alvorens het Koninkrijk daaraan kan
    worden gebonden;

    dat het voorts noodzakelijk is regels te stellen ter uitvoering van het genoemde verdrag, in hoofdzaak door middel
    van wijziging van de Wet verontreiniging oppervlaktewateren, de Wet milieubeheeren het Burgerlijk Wetboek;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010042/2011-01-01#ArtikelAanhef
articles:
  - number: VII
    text: |-
      Het tarief van de in [artikel 39c van de Binnenvaartwet][ref1] bedoelde afvalbeheerbijdrage is in het eerste
      kalenderjaar na inwerkingtreding van deze wet € 0,0075 per liter gasolie, voor zover voor dat kalenderjaar niet een
      andersluidend besluit als bedoeld in [artikel 39d, tweede lid, van die wet][ref2] is tot stand gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel39d
    url: https://wetten.overheid.nl/BWBR0010042/2011-01-01#ArtikelVII
