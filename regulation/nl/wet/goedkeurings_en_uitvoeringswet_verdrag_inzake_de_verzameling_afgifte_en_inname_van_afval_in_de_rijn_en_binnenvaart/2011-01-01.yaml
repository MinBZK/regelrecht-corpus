        artikel: 39d
  - number: VIII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel I][ref1], dat in werking treedt met ingang van de dag na de datum van uitgifte van het Staatsblad
      waarin deze wet wordt geplaatst. Bij koninklijk besluit kan een ander tijdstip worden vastgesteld, waarop
      [artikel II][ref2] voor wat betreft [hoofdstuk 4A, paragraaf 4, van de Binnenvaartwet][ref3] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0010042#ArtikelI
