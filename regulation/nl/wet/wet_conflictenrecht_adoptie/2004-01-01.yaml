  - number: '8'
    text: |-
      1 De erkenning als bedoeld in de [artikelen 6][ref1] en [7][ref2] houdt tevens in de erkenning van:

      a. de familierechtelijke betrekkingen tussen het kind en zijn adoptiefouders;

      b. het gezag van de adoptiefouders over het kind;

      c. de verbreking van de voordien bestaande familierechtelijke betrekkingen tussen het kind en zijn moeder en vader,
      indien de adoptie dit gevolg heeft in de staat waar zij plaatsvond.

      2 Ingeval de adoptie in de staat waar zij plaatsvond niet tot gevolg heeft dat de voordien bestaande
      familierechtelijke betrekkingen worden verbroken, mist de adoptie ook in Nederland dat gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015330#Artikel7
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel8
