preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te geven met betrekking tot het conflictenrecht
    inzake adoptie en de erkenning van in het buitenland tot stand gekomen adopties;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet laat onverlet de toepassing van het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag
      inzake de bescherming van kinderen en de samenwerking op het gebied van de interlandelijke adoptie
      (Trb. 1993, 197), de [Wet van 14 mei 1998][ref1] tot uitvoering van dat verdrag (Stb. 302) alsmede de
      [Wet opneming buitenlandse kinderen ter adoptie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009614
      [ref2]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009614
      - id: ref2
        bwb_id: BWBR0004447
  - number: '2'
    text: |-
      Onverminderd [artikel 1][ref1] wordt in deze wet onder adoptie verstaan de beslissing van een bevoegde autoriteit
      waarbij familierechtelijke betrekkingen tussen een minderjarig kind en twee personen tezamen of een persoon alleen
      tot stand worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel1
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015330
        artikel: '1'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      1 Op een in Nederland uit te spreken adoptie is, behoudens het in het tweede lid bepaalde, het Nederlandse recht
      van toepassing.

      2 Op de toestemming dan wel de raadpleging of de voorlichting van de ouders van het kind of van andere personen of
      instellingen is toepasselijk het recht van de staat waarvan het kind de nationaliteit bezit. Bezit het kind meer
      dan een nationaliteit, dan is van toepassing het recht van de staat waarvan het de nationaliteit bezit, waarmee
      het, alle omstandigheden in aanmerking genomen, de nauwste band heeft. Indien het aldus aangewezen recht de adoptie
      niet kent, is het Nederlandse recht van toepassing. Het ingevolge dit lid toepasselijke recht bepaalt tevens of bij
      gebreke van toestemming deze kan worden vervangen door een rechterlijke beslissing.

      3 Op de herroeping van een in Nederland uitgesproken adoptie is het Nederlandse recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Een in Nederland uitgesproken adoptie heeft, wat betreft de familierechtelijke betrekkingen tussen het kind en
      de adoptiefouders en de verbreking van de voordien bestaande familierechtelijke betrekkingen van het kind, de
      rechtsgevolgen die daaraan worden toegekend door het Nederlandse recht.
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel4
  - number: '5'
    text: |-
      De bepalingen van dit hoofdstuk hebben betrekking op adopties die tot stand zijn gekomen in staten die geen partij
      zijn bij het in [artikel 1][ref1] genoemde verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel1
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015330
        artikel: '1'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      1 Een buitenslands gegeven beslissing waarbij een adoptie tot stand is gekomen, wordt in Nederland van rechtswege
      erkend indien zij is uitgesproken door

      a. een ter plaatse bevoegde autoriteit van de vreemde staat waar de adoptiefouders en het kind zowel ten tijde van
      het verzoek tot adoptie als ten tijde van de uitspraak hun gewone verblijfplaats hadden; of

      b. een ter plaatse bevoegde autoriteit van de vreemde staat waar hetzij de adoptiefouders, hetzij het kind zowel
      ten tijde van het verzoek tot adoptie als ten tijde van de uitspraak hun gewone verblijfplaats hadden.

      2 Aan een beslissing houdende adoptie wordt erkenning onthouden indien

      a. aan die beslissing kennelijk geen behoorlijk onderzoek of behoorlijke rechtspleging is voorafgegaan, of

      b. in het geval, bedoeld in het eerste lid, onder b, de beslissing niet is erkend in de staat waar het kind,
      onderscheidenlijk de staat waar de adoptiefouders zowel ten tijde van het verzoek tot adoptie als ten tijde van de
      uitspraak hun gewone verblijfplaats hadden; of

      c. de erkenning van die beslissing kennelijk in strijd met de openbare orde zou zijn.

      3 Op de in het tweede lid, onder c, genoemde grond wordt aan een beslissing houdende adoptie in elk geval erkenning
      onthouden indien de beslissing kennelijk op een schijnhandeling betrekking heeft.

      4 De erkenning van de beslissing kan, ook wanneer daarbij een Nederlander betrokken is, niet op de in het tweede
      lid, onder c, genoemde grond worden geweigerd enkel omdat daarop een ander recht is toegepast dan uit de bepalingen
      van [hoofdstuk 2][ref1] zou zijn gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015330
        hoofdstuk: '2'
  - number: '7'
    text: |-
      1 Een buitenslands gegeven beslissing waarbij een adoptie tot stand is gekomen en die is uitgesproken door een
      ter plaatse bevoegde autoriteit van de vreemde staat waar het kind zowel ten tijde van het verzoek tot adoptie als
      ten tijde van de uitspraak zijn gewone verblijfplaats had, terwijl de adoptiefouders hun gewone verblijfplaats in
      Nederland hadden, wordt erkend indien:

      a. de bepalingen van de [Wet opneming buitenlandse kinderen ter adoptie][ref1] in acht zijn genomen, en

      b. de erkenning van de adoptie in het kennelijk belang van het kind is, en

      c. erkenning niet op een grond, bedoeld in [artikel 6, tweede of derde lid, van deze wet][ref2], zou worden
      onthouden.

      2 Een adoptie als bedoeld in het eerste lid wordt slechts erkend indien de rechter heeft vastgesteld
      dat aan de in dat lid genoemde voorwaarden voor erkenning is voldaan. Toepasselijk is de procedure van
      [artikel 26 van Boek 1 van het Burgerlijk Wetboek][ref3].

      3 De rechter die vaststelt dat aan de voorwaarden voor erkenning van de adoptie is voldaan, geeft
      ambtshalve een last tot toevoeging van een latere vermelding van de adoptie aan de daarvoor in aanmerking
      komende akte van de burgerlijke stand. De [artikelen 25, zesde lid][ref4], [25c, derde lid][ref5], en
      [25g, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004447
      [ref2]: https://wetten.overheid.nl/BWBR0015330#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel26
