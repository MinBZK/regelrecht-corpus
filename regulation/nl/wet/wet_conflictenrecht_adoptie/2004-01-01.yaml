  - number: '10'
    text: |-
      Deze wet is van toepassing op verzoeken tot adoptie die op of na het tijdstip van haar inwerkingtreding in
      Nederland worden ingediend en op de erkenning van adopties die op of na het tijdstip van haar inwerkingtreding
      buitenslands tot stand zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel10
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet conflictenrecht adoptie.'
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel12
