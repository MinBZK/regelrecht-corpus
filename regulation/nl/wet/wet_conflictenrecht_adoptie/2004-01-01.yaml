  - number: '9'
    text: |-
      In het in [artikel 8, tweede lid][ref1], bedoelde geval kan, indien het kind in Nederland
      gewone verblijfplaats heeft en daar voor permanent verblijf bij de adoptiefouders is
      toegelaten, een verzoek tot omzetting in een adoptie naar Nederlands recht worden ingediend.
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________, is
      van overeenkomstige toepassing. [Artikel 3, tweede lid, van deze wet][ref3] is van overeenkomstige toepassing op de
      toestemming van de ouders wier toestemming tot de adoptie vereist was.


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel8
