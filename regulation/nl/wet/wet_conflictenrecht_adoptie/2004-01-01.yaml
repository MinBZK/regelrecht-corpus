      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel26
    url: https://wetten.overheid.nl/BWBR0015330/2004-01-01#Artikel7
