bwb_id: BWBR0013548
url: https://wetten.overheid.nl/BWBR0013548/2002-03-30
preamble:
  text: |-
    Gelet op de artikelen 102 en 103 van de Wet geluidhinder;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze regeling worden de volgende categorieën motorvoertuigen onderscheiden: - *categorie
      lv (lichte motorvoertuigen):* motorvoertuigen op drie of meer wielen, met uitzondering van de in categorie mv en
      categorie zv bedoelde motorvoertuigen;
        - *categorie mv (middelzware motorvoertuigen):* gelede en ongelede autobussen, alsmede andere motorvoertuigen die
      ongeleed zijn en voorzien van een enkele achteras waarop vier banden zijn gemonteerd;
        - *categorie zv (zware motorvoertuigen):* gelede motorvoertuigen, alsmede motorvoertuigen die zijn voorzien van een
      dubbele achteras, met uitzondering van autobussen.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel1
  - number: '1.2'
    text: |-
      In deze regeling wordt verstaan onder: - *etmaalperiode:* gedeelte van een etmaal, waarover het equivalente
      geluidsniveau wordt bepaald;
        - *verkeersintensiteit:* aantal motorvoertuigen van een categorie motorvoertuigen als bedoeld in het eerste lid,
      dat per uur, gemiddeld over een etmaalperiode, een waarneempunt passeert;
        - *maatgevende verkeersintensiteit:* verkeersintensiteit, zoals die, in het voor de geluidsbelasting bepalende
      jaar, gemiddeld over een representatief tijdvak, optreedt;
        - *verkeerssnelheid:* voor het betreffende wegvak representatief te achten gemiddelde snelheid per categorie
      motorvoertuigen als bedoeld in het eerste lid;
        - *dicht asfaltbeton:* typeaanduiding dicht asfaltbeton zoals gespecificeerd in de Standaard RAW-bepalingen 2000,
      ISBN 9066283165.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel1
  - number: '2.1'
    text: 'Bij de bepaling van het equivalente geluidsniveau vanwege een weg, wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.a
    text: de maatgevende verkeersintensiteiten van de onderscheidene categorieën motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.b
    text: de verkeerssnelheden van de onderscheidene categorieën motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.c
    text: de geluidemissies van de onderscheidene categorieën motorvoertuigen, bepaald op een wegdek van dicht asfaltbeton;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.d
    text: de invloed van het wegdektype op de geluidemissie;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.e
    text: de verzwakking van het geluid ten gevolge van de geometrische uitbreiding van het geluidsveld;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.f
    text: de verzwakking van het geluid door absorptie van geluidsenergie in de atmosfeer;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.g
    text: de invloed van de bodem op de geluidsoverdracht;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.1.h
    text: de meteorologische invloeden op de geluidsoverdracht.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: '2.2'
    text: |-
      Bij de bepaling van het equivalente geluidsniveau wordt, afhankelijk van de situatie, bovendien rekening gehouden
      met de effecten op de geluidemissie en geluidsoverdracht, die het gevolg zijn van één of meer:
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.2.a
    text: hellingen in het beschouwde weggedeelte;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.2.b
    text: met verkeerslichten geregelde kruispunten van wegen;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.2.c
    text: snelheidsbeperkende maatregelen;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.2.d
    text: reflecties van het geluid;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: 2.2.e
    text: afschermingen van het geluid.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: '2.3'
    text: |-
      Indien het equivalente geluidsniveau wordt bepaald ter plaatse van de gevel van een woning of ander geluidsgevoelig
      gebouw, wordt slechts rekening gehouden met het op de gevel invallende geluid.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel2
  - number: '3.1'
    text: |-
      Het equivalente geluidsniveau wordt bepaald volgens de in [bijlage II][ref1] bij deze regeling beschreven
      standaardrekenmethode II.


      [ref1]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013548
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid kan het equivalente geluidsniveau worden bepaald volgens de in [bijlage I][ref1]
      bij deze regeling beschreven standaardrekenmethode I, indien de desbetreffende situatie valt binnen het
      toepassingsgebied van die standaardrekenmethode I.


      [ref1]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013548
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid kan het equivalente geluidsniveau tevens worden bepaald volgens de
      standaardmeetmethode, bedoeld in [bijlage III][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013548
  - number: '3.4'
    text: |-
      Voor de toepassing van [artikel 89 van de Wet geluidhinder][ref1] kan de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer toestaan dat gebruik wordt gemaakt van onderzoeksresultaten die zijn verkregen door
      toepassing van een methode die afwijkt van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '89'
  - number: '4'
    text: |-
      Bij een van dicht asfaltbeton afwijkend wegdektype, wordt het effect van het afwijkende wegdektype op de
      geluidemissie bepaald overeenkomstig de in [bijlage V][ref1] bij deze regeling beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013548
  - number: '5.1'
    text: |-
      De waarde van het door berekening of door meting verkregen equivalente geluidsniveau wordt afgerond naar het
      dichtstbijzijnde gehele getal, waarbij een halve eenheid wordt afgerond naar het even getal.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel5
  - number: '5.2'
    text: |-
      Bij de vaststelling van het verschil tussen twee geluidsbelastingswaarden wordt, in afwijking van het eerste lid,
      de afronding slechts toegepast op het resultaat van de berekening van het verschil.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel5
  - number: '6'
    text: |-
      De ingevolge [artikel 103 van de Wet geluidhinder][ref1] toe te passen aftrek op de ingevolge
      [artikel 5, eerste lid][ref2], bepaalde waarde van het equivalente geluidsniveau, vanwege een weg, op de gevel van
      woningen of van andere geluidsgevoelige objecten bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0013548#Artikel5
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0013548
        artikel: '5'
        paragraaf: '2'
  - number: 6.a
    text: |-
      2 dB voor wegen waarvoor de representatief te achten snelheid van lichte motorvoertuigen 70 km/uur of meer
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel6
  - number: 6.b
    text: 5 dB voor de overige wegen;
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel6
  - number: 6.c
    text: |-
      0 dB bij toepassing van [artikel 22, eerste en tweede lid][ref1], of
      [artikel 194, eerste en tweede lid, van het Bouwbesluit][ref2] en bij toepassing van artikel 111, tweede en derde
      lid, en 111a, 112 en 113 van de [Wet geluidhinder][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005321#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005321#Artikel194
      [ref3]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005321
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005321
        artikel: '194'
      - id: ref3
        bwb_id: BWBR0003227
  - number: '7.1'
    text: |-
      De resultaten van het akoestisch onderzoek ter bepaling van het equivalente geluidsniveau, worden vastgelegd in een
      overeenkomstig [bijlage IV][ref1] bij deze regeling ingericht rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013548
  - number: '7.2'
    text: |-
      In situaties die vallen buiten het toepassingsgebied van de in [bijlage II][ref1] bij deze regeling beschreven
      standaardrekenmethode II, bevat het in het eerste lid bedoelde rapport een beschrijving en een verantwoording van
      de toegepaste methode.


      [ref1]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013548
  - number: '8'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26 februari 1989, nr.
      1629118, houdende vaststelling aftrek bij berekening en meting geluidsbelasting vanwege een weg (Stcrt. 45) en het
      Reken- en Meetvoorschrift Verkeerslawaai worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel8
  - number: '9.1'
    text: |-
      Op de bepaling van het equivalente geluidsniveau, vanwege een weg, bedoeld
      in [artikel 88, eerste lid, van de Wet geluidhinder][ref1] of bedoeld in
      [artikel 8 van het Saneringsbesluit geluidhinder wegverkeer 1998][ref2], blijft het Reken- en Meetvoorschrift
      Verkeerslawaai van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0009370#Artikel8
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0009370
        artikel: '8'
  - number: '9.2'
    text: |-
      Aan het Reken- en Meetvoorschrift Verkeerslawaai kan toepassing gegeven worden ter bepaling van het equivalente
      geluidsniveau vanwege een weg voor zover vóór de eerste dag van de derde kalendermaand volgend op het tijdstip van
      inwerkingtreding van deze regeling:
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
  - number: 9.2.a
    text: |-
      een ontwerp-bestemmingsplan of het ontwerp voor een herziening daarvan als
      bedoeld in [artikel 76, eerste lid, van de Wet geluidhinder][ref1], ingevolge
      [artikel 23, eerste lid, van de Wet op de Ruimtelijke Ordening][ref2], ter inzage is gelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel23
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '23'
  - number: 9.2.b
    text: |-
      het voornemen tot het indienen van een verzoek als bedoeld in de
      [artikelen 83, eerste lid][ref1], [85][ref2] en [100a van de Wet geluidhinder][ref3], ingevolge
      [artikel 13, eerste lid, onder a, van het Besluit grenswaarden binnen zones langs wegen][ref4] is bekendgemaakt,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
      [ref4]: https://wetten.overheid.nl/BWBR0003459#Artikel13
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
      - id: ref4
        bwb_id: BWBR0003459
        artikel: '13'
  - number: 9.2.c
    text: |-
      een ontwerp-tracébesluit, respectievelijk een gewijzigd ontwerp tracébesluit als bedoeld in
      [artikel 11, eerste lid][ref1], respectievelijk [artikel 14, eerste lid, van de Tracéwet][ref2], is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel14
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '14'
  - number: 9.2.d
    text: |-
      de resultaten van het akoestisch onderzoek ingevolge [artikel 80, tweede lid, van de Wet geluidhinder][ref1] aan
      burgemeester en wethouders zijn overgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel80
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '80'
  - number: 9.2.e
    text: |-
      met betrekking tot een ontwerp-saneringsprogramma toepassing is gegeven aan
      [artikel 3:12 van de Algemene wet bestuursrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 9.2.f
    text: |-
      de aanvraag tot het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 76a van de Wet geluidhinder][ref1] is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76a
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 76a
  - number: '10.1'
    text: |-
      Bij toepassing van [artikel 9, eerste lid][ref1], bedraagt de toe te passen aftrek ingevolge
      [artikel 103 van de Wet geluidhinder][ref2] 5 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0013548#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel103
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013548
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '103'
  - number: '10.2'
    text: |-
      Indien ter bepaling van het equivalente geluidsniveau krachtens [artikel 9, tweede lid][ref1], toepassing wordt
      gegeven aan het Reken- en Meetvoorschrift Verkeerslawaai is de Regeling van de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer van 26 februari 1989, nr. 1629118, houdende aftrek bij berekening en meting
      geluidsbelasting vanwege een weg (Stcrt. 45) van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013548#Artikel9
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013548
        artikel: '9'
        paragraaf: '4'
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel11
  - number: '12'
    text: |-
      Deze regeling kan worden aangehaald als: Reken- en meetvoorschrift wegverkeerslawaai 2002. Deze regeling zal met
      toelichting in de Staatscourant worden geplaatst, met uitzondering van de bijlagen, die ter inzage worden gelegd in
      de bibliotheek van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Rijnstraat 8, 2515 XP
      Den Haag.
    url: https://wetten.overheid.nl/BWBR0013548/2002-03-30#Artikel12
