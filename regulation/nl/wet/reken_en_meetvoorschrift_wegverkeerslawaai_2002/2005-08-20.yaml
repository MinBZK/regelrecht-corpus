  - number: '5'
    text: |-
      1 De waarde van het door berekening of door meting verkregen equivalente geluidsniveau wordt afgerond naar het
      dichtstbijzijnde gehele getal, waarbij een halve eenheid wordt afgerond naar het even getal.

      2 Voor de berekening van het akoestisch effect van een wijziging op of aan een weg, worden, in afwijking van het
      eerste lid, de volgende uitgangspunten gehanteerd:

      a. indien een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld, wordt gerekend met het
      getal van de hogere waarde, zoals deze is vastgesteld;

      b. voor de heersende waarde van de geluidsbelasting wordt gerekend met het onafgeronde getal, waarbij uitvoering is
      gegeven aan [artikel 6][ref1];

      c. voor de geluidsbelasting in het toekomstige maatgevende jaar wordt gerekend met het onafgeronde getal, waarbij
      uitvoering is gegeven aan [artikel 6][ref2].

      3 Bij de berekening van het verschil tussen twee geluidsbelastingswaarden wordt, in afwijking van het eerste lid,
      de afronding slechts toegepast op het resultaat van de berekening van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0013548#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013548#Artikel6
