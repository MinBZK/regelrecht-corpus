  - number: 4a
    text: |-
      Het effect op het equivalente geluidsniveau van de in [bijlage II][ref1] bij deze regeling beschreven schermtop
      wordt bepaald overeenkomstig de in [bijlage VI][ref2] bij deze regeling beschreven methode.


