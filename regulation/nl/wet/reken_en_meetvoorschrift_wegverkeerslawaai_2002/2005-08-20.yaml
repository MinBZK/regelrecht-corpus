    text: |-
      1 De resultaten van het akoestisch onderzoek ter bepaling van het equivalente geluidsniveau, worden vastgelegd in
      een overeenkomstig [bijlage IV][ref1] bij deze regeling ingericht rapport.

      2 In situaties die vallen buiten het toepassingsgebied van de in [bijlage II][ref2] bij deze regeling beschreven
      standaardrekenmethode II, bevat het in het eerste lid bedoelde rapport een beschrijving en een verantwoording van
      de toegepaste methode.


