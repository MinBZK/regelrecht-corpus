  - number: '8'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26 februari 1989, nr.
      1629118, houdende vaststelling aftrek bij berekening en meting geluidsbelasting vanwege een weg (Stcrt. 45) en het
      Reken- en Meetvoorschrift Verkeerslawaai worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013548/2005-08-20#Artikel8
  - number: '9'
    text: |-
      1 Op de bepaling van het equivalente geluidsniveau, vanwege een weg, bedoeld
      in [artikel 88, eerste lid, van de Wet geluidhinder][ref1] of bedoeld in
      [artikel 8 van het Saneringsbesluit geluidhinder wegverkeer 1998][ref2], blijft het Reken- en Meetvoorschrift
      Verkeerslawaai van toepassing.

      2 Aan het Reken- en Meetvoorschrift Verkeerslawaai kan toepassing gegeven worden ter bepaling van het equivalente
      geluidsniveau vanwege een weg voor zover vóór de eerste dag van de derde kalendermaand volgend op het tijdstip van
      inwerkingtreding van deze regeling:

      a. een ontwerp-bestemmingsplan of het ontwerp voor een herziening daarvan als
      bedoeld in [artikel 76, eerste lid, van de Wet geluidhinder][ref3], ingevolge
      [artikel 23, eerste lid, van de Wet op de Ruimtelijke Ordening][ref4], ter inzage is gelegd,

      b. het voornemen tot het indienen van een verzoek als bedoeld in de
      [artikelen 83, eerste lid][ref5], [85][ref6] en [100a van de Wet geluidhinder][ref7], ingevolge
      [artikel 13, eerste lid, onder a, van het Besluit grenswaarden binnen zones langs wegen][ref8] is bekendgemaakt,

      c. een ontwerp-tracébesluit, respectievelijk een gewijzigd ontwerp tracébesluit als bedoeld in
      [artikel 11, eerste lid][ref9], respectievelijk [artikel 14, eerste lid, van de Tracéwet][ref10], is vastgesteld,

      d. de resultaten van het akoestisch onderzoek ingevolge [artikel 80, tweede lid, van de Wet geluidhinder][ref11]
      aan burgemeester en wethouders zijn overgelegd,

      e. met betrekking tot een ontwerp-saneringsprogramma toepassing is gegeven aan
      [artikel 3:12 van de Algemene wet bestuursrecht][ref12], of

      f. de aanvraag tot het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 76a van de Wet geluidhinder][ref13] is ingediend.


