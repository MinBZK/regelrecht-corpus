preamble:
  text: |-
    Gelet op de artikelen 102 en 103 van de Wet geluidhinder;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013548/2005-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze regeling worden de volgende categorieën motorvoertuigen onderscheiden:

        - *categorie lv (lichte motorvoertuigen):* motorvoertuigen op drie of meer wielen, met uitzondering van de in
      categorie mv en categorie zv bedoelde motorvoertuigen;
        - *categorie mv (middelzware motorvoertuigen):* gelede en ongelede autobussen, alsmede andere motorvoertuigen die
      ongeleed zijn en voorzien van een enkele achteras waarop vier banden zijn gemonteerd;
        - *categorie zv (zware motorvoertuigen):* gelede motorvoertuigen, alsmede motorvoertuigen die zijn voorzien van een
      dubbele achteras, met uitzondering van autobussen.

      2 In deze regeling wordt verstaan onder:

        - *etmaalperiode:* gedeelte van een etmaal, waarover het equivalente geluidsniveau wordt bepaald;
        - *verkeersintensiteit:* aantal motorvoertuigen van een categorie motorvoertuigen als bedoeld in het eerste lid,
      dat per uur, gemiddeld over een etmaalperiode, een waarneempunt passeert;
        - *maatgevende verkeersintensiteit:* verkeersintensiteit, zoals die, in het voor de geluidsbelasting bepalende
      jaar, gemiddeld over een representatief tijdvak, optreedt;
        - *verkeerssnelheid:* voor het betreffende wegvak representatief te achten gemiddelde snelheid per categorie
      motorvoertuigen als bedoeld in het eerste lid;
        - *dicht asfaltbeton:* typeaanduiding dicht asfaltbeton zoals gespecificeerd in de Standaard RAW-bepalingen 2000,
      ISBN 9066283165.
    url: https://wetten.overheid.nl/BWBR0013548/2005-08-20#Artikel1
  - number: '2'
    text: |-
      1 Bij de bepaling van het equivalente geluidsniveau vanwege een weg, wordt rekening gehouden met:

      a. de maatgevende verkeersintensiteiten van de onderscheidene categorieën motorvoertuigen;

      b. de verkeerssnelheden van de onderscheidene categorieën motorvoertuigen;

      c. de geluidemissies van de onderscheidene categorieën motorvoertuigen, bepaald op een wegdek van dicht
      asfaltbeton;

      d. de invloed van het wegdektype op de geluidemissie;

      e. de verzwakking van het geluid ten gevolge van de geometrische uitbreiding van het geluidsveld;

      f. de verzwakking van het geluid door absorptie van geluidsenergie in de atmosfeer;

      g. de invloed van de bodem op de geluidsoverdracht;

      h. de meteorologische invloeden op de geluidsoverdracht.

      2 Bij de bepaling van het equivalente geluidsniveau wordt, afhankelijk van de situatie, bovendien rekening gehouden
      met de effecten op de geluidemissie en geluidsoverdracht, die het gevolg zijn van één of meer:

      a. hellingen in het beschouwde weggedeelte;

      b. met verkeerslichten geregelde kruispunten van wegen;

      c. snelheidsbeperkende maatregelen;

      d. reflecties van het geluid;

      e. afschermingen van het geluid.

      3 Indien het equivalente geluidsniveau wordt bepaald ter plaatse van de gevel van een woning of ander
      geluidsgevoelig gebouw, wordt slechts rekening gehouden met het op de gevel invallende geluid.
    url: https://wetten.overheid.nl/BWBR0013548/2005-08-20#Artikel2
  - number: '3'
    text: |-
      1 Het equivalente geluidsniveau wordt bepaald volgens de in [bijlage II][ref1] bij deze regeling beschreven
      standaardrekenmethode II.

      2 In afwijking van het eerste lid kan het equivalente geluidsniveau worden bepaald volgens de in [bijlage I][ref2]
      bij deze regeling beschreven standaardrekenmethode I, indien de desbetreffende situatie valt binnen het
      toepassingsgebied van die standaardrekenmethode I.

      3 In afwijking van het eerste en tweede lid kan het equivalente geluidsniveau tevens worden bepaald volgens de
      standaardmeetmethode, bedoeld in [bijlage III][ref3] bij deze regeling.

      4 Voor de toepassing van [artikel 89 van de Wet geluidhinder][ref4] kan de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer toestaan dat gebruik wordt gemaakt van onderzoeksresultaten die zijn verkregen
      door toepassing van een methode die afwijkt van deze regeling.


