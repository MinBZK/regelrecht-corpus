  - number: '6'
    text: |-
      De ingevolge [artikel 103 van de Wet geluidhinder][ref1] toe te passen aftrek op de ingevolge
      [artikel 5, eerste lid, of tweede lid, onder b en c][ref2], bepaalde waarde van het equivalente geluidsniveau,
      vanwege een weg, op de gevel van woningen of van andere geluidsgevoelige objecten bedraagt:

      a. 2 dB voor wegen waarvoor de representatief te achten snelheid van lichte motorvoertuigen 70 km/uur of meer
      bedraagt;

      b. 5 dB voor de overige wegen;

      c. 0 dB bij toepassing van [artikel 22, eerste en tweede lid][ref3], of
      [artikel 194, eerste en tweede lid, van het Bouwbesluit][ref4] en bij toepassing van
      [artikel 111, tweede en derde lid][ref5], en [111a][ref6], [112][ref7] en [113 van de Wet geluidhinder][ref8].


