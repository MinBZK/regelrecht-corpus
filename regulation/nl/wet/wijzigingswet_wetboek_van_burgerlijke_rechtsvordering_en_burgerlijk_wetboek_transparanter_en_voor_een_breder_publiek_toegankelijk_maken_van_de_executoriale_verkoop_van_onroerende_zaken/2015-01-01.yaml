preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de executoriale verkoop van onroerende zaken
    transparanter en voor een breder publiek toegankelijk te maken en dat daartoe het Wetboek van Burgerlijke
    Rechtsvordering en het Burgerlijk Wetboek dienen te worden gewijzigd;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035637/2015-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      [Artikel I][ref1] is niet van toepassing op de executie van een onroerende zaak,
      een aandeel daarin of een beperkt recht daarop, waarvan de aanzegging overeenkomstig
      [artikel 544 van het Wetboek van Burgerlijke Rechtsvordering][ref2] heeft plaatsgevonden voor de inwerkingtreding
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0035637#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0035637/2015-01-01#ArtikelIV
