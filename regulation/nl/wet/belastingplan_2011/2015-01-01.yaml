      1 [Artikel 16a, eerste en tweede lid, van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1]
      is van overeenkomstige toepassing op de verlagingen van het belastingbedrag in de [artikelen 9a][ref2]
      en [9b van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref3] ingevolge de
      [artikelen IX, onderdelen B en C][ref4].

      2 [Artikel IX, onderdelen B en C][ref5], vindt geen toepassing ten aanzien van personenauto’s die vóór 1 januari
      2011 voor het eerst in gebruik zijn genomen.


