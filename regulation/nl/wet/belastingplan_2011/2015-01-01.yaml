  - number: XIXa
    text: |-
      1 Het toe te passen tarief op renovatie en herstel van woningen als bedoeld in post 21 van
      [Tabel I, onderdeel b, van de Wet op de omzetbelasting 1968][ref1], is het tarief dat van kracht is op het tijdstip
      waarop het belastbare feit zich voordoet.

      2 Het toe te passen tarief op kunstvoorwerpen, voorwerpen voor verzamelingen en antiquiteiten als bedoeld in
      [artikel 2a, eerste lid, onderdeel m, van de Wet op de omzetbelasting 1968][ref2], is het tarief dat van kracht is
      op het tijdstip waarop het belastbare feit zich voordoet.


