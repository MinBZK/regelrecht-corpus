  - number: XXVI
    text: |-
      1 De accijns op sigaretten wordt met ingang van 1 maart 2011 zodanig verhoogd dat de totale accijns voor de
      meest gevraagde prijsklasse sigaretten € 11,68 per 1 000 stuks hoger zal liggen dan het accijnsbedrag voor deze
      prijsklasse op 28 februari 2011. Indien met ingang van 1 maart 2011 het aldus berekende accijnsbedrag lager is
      dan het bedrag dat overeenkomt met 57 percent van de kleinhandelsprijs van de meest gevraagde prijsklasse van
      sigaretten, berekend per 1 000 stuks, geldt het laatstbedoelde bedrag.

      2 De accijns op rooktabak wordt met ingang van 1 maart 2011 zodanig verhoogd dat de totale accijns voor de meest
      gevraagde prijsklasse rooktabak € 4,93 per kilogram hoger zal liggen dan het accijnsbedrag voor deze prijsklasse op
      28 februari 2011.

      3 Bij ministeriële regeling worden met ingang van 1 maart 2011 de tarieven van de accijns, bedoeld in
      [artikel 35, eerste lid, onderdelen b en c, van de Wet op de accijns][ref1] gewijzigd. De wijziging geschiedt
      zodanig dat voor sigaretten en rooktabak van de meest gevraagde prijsklasse het specifieke gedeelte van de accijns
      50% bedraagt van de som van de totale accijns en de omzetbelasting. Daarbij dient het bedrag van de totale accijns
      gelijk te blijven aan het bedrag van de totale accijns dat na de verhoging van de accijns verschuldigd zou zijn
      zonder de wijziging. De wijziging van de bedragen die in artikel 35, eerste lid, onderdelen b en c, zijn opgenomen
      als de ten minste te betalen accijns voor 1 000 stuks sigaretten respectievelijk 1 kilogram rooktabak, geschiedt
      zodanig dat deze accijns na de wijziging van de tarieven gelijk is aan het totale bedrag van de accijns voor 1 000
      stuks sigaretten respectievelijk 1 kilogram rooktabak van de meest gevraagde prijsklasse. Bij de wijziging vindt
      afronding plaats van het procentuele gedeelte van de accijns op honderdsten van een percent.

      4 Indien een wijziging van de meest gevraagde prijsklasse van sigaretten onderscheidenlijk rooktabak als bedoeld
      in [artikel 35a van de Wet op de accijns][ref2] in het kalenderjaar 2010 heeft plaatsgevonden, treedt in afwijking
      van het vierde lid van artikel 35a van de Wet op de accijns de in het eerste lid van artikel 35a van de Wet op de
      accijns bedoelde ministeriële regeling tot wijziging van de tarieven in werking met ingang van 1 maart 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel35a
