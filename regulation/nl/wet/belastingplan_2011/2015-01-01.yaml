  - number: XXX
    text: |-
      Ingeval de samenloop van wetten die in 2010 in het Staatsblad zijn of worden gepubliceerd en wijzigingen aanbrengen
      in één of meer belastingwetten, niet of niet juist is geregeld, of indien als gevolg van die samenloop onjuistheden
      ontstaan in de aanduiding van artikelen, artikelonderdelen, verwijzingen en dergelijke in de desbetreffende wetten,
      kunnen die wetten op dit punt bij ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0029341/2015-01-01#ArtikelXXX
  - number: XXXI
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2011, met dien verstande dat:

      a. [artikel I, onderdelen A, B, F, G en H][ref1], eerst toepassing vindt nadat
      [artikel 10.1 van de Wet inkomstenbelasting 2001][ref2] bij het begin van het kalenderjaar 2011 is toegepast;

      b. [artikel IV, onderdelen A en B][ref3], eerst toepassing vindt nadat [artikel 20a, tweede lid][ref4],
      onderscheidenlijk [artikel 20b, tweede lid, van de Wet op de loonbelasting 1964][ref5] bij het begin van het
      kalenderjaar 2011 is toegepast;

      c. [artikel IV, onderdelen D en E][ref6], eerst toepassing vindt nadat
      [artikel 22d van de Wet op de loonbelasting 1964][ref7] bij het begin van het kalenderjaar 2011 is toegepast.

      2 De [artikelen XIX, onderdeel B, onder 4][ref8], en [XIXA, eerste lid][ref9], werken terug tot en met 1 oktober
      2010.

      3 In afwijking van het eerste lid treden de [artikelen XXIV][ref10] en [XXV, onderdelen B, C, D en E][ref11], in
      werking met ingang van 31 december 2010.

      4 In afwijking van het eerste lid treden [artikel XXI, onderdeel B][ref12], en [artikel XXIA][ref13] in werking met
      ingang van 1 maart 2011.


