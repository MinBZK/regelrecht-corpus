  - number: XXIa
    text: |-
      Bij verzekeringen waarbij de laatste prolongatiedatum of datum van stilzwijgende verlenging, of bij afwezigheid van
      die datum de ingangsdatum van de verzekering, vóór 1 maart 2011 ligt, is het assurantiebelastingtarief van 9,7% van
      toepassing op de premies die na 28 februari 2011 vervallen.
    url: https://wetten.overheid.nl/BWBR0029341/2015-01-01#ArtikelXXIa
  - number: XXII
    text: |-
      In afwijking van [artikel 13, eerste lid, van de Wet op belastingen van rechtsverkeer][ref1] wordt in geval van
      verkrijging van een woning binnen twaalf maanden na een vorige verkrijging in 2011 van dezelfde woning door een
      ander, de waarde verminderd met het bedrag waarover ter zake van de vorige verkrijging was verschuldigd hetzij
      overdrachtsbelasting welke niet in mindering heeft gestrekt van schenk- of erfbelasting, hetzij omzetbelasting
      welke in het geheel niet op grond van [artikel 15 van de Wet op de omzetbelasting 1968][ref2] in aftrek kon worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel15
    url: https://wetten.overheid.nl/BWBR0029341/2015-01-01#ArtikelXXII
