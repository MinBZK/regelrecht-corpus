preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met een herziening van het decoratiestelsel wenselijk
    is de wet van 4 april 1892, houdende instelling van de Orde van Oranje-Nassau, en de wet van 29 september 1815,
    houdende instelling van de Orde van de Nederlandse Leeuw, te wijzigen en tot instelling van het Kapittel voor de
    civiele orden over te gaan;

    Zo is het, dat Wij, de Raad van de State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006597/2010-10-10#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Er is een Kapittel voor de civiele orden.

      2 Het Kapittel heeft tot taak Onze Minister wie het aangaat te adviseren over het verlenen van onderscheidingen in
      een van de civiele orden.

      3 Het Kapittel is samengesteld uit tenminste drie en ten hoogste vijf leden, de voorzitter daaronder begrepen, die
      bij koninklijk besluit worden benoemd en ontslagen.

      4 De Kanselier van de Orde van de Nederlandse Leeuw is lid van het Kapittel.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van de taak, samenstelling,
      inrichting en werkwijze van het Kapittel.
    url: https://wetten.overheid.nl/BWBR0006597/2010-10-10#ArtikelIII
  - number: IV
    text: |-
      1 De commissaris van de Koning adviseert Onze Minister wie het aangaat volgens een door de regering gegeven
      ambtsinstructie over de verlening van onderscheidingen in de Orde van de Nederlandse Leeuw en de Orde van Oranje-
      Nassau aan inwoners van de provincie.

      2 De Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba adviseert Onze Minister wie
      het aangaat volgens een door de regering gegeven ambtsinstructie over de verlening van onderscheidingen in de Orde
      van de Nederlandse Leeuw en de Orde van Oranje-Nassau aan inwoners van de openbare lichamen Bonaire, Sint Eustatius
      en Saba.
    url: https://wetten.overheid.nl/BWBR0006597/2010-10-10#ArtikelIV
  - number: V
    text: |-
      1 a. Gehandhaafd blijven alle benoemingen tot Broeder, verbonden aan de Orde van de Nederlandse Leeuw, zoals deze
      hebben plaatsgevonden voor de inwerkingtreding van [artikel II][ref1] van deze wet.

      b. De toelagen die de Broeders, verbonden aan de Orde van de Nederlandse Leeuw, alsmede die welke de weduwen
      van Broeders genieten op de dag van inwerkingtreding van [artikel II][ref2] van deze wet, blijven na de
      inwerkingtreding van [dat artikel][ref3] van kracht.

      2 a. Gehandhaafd blijven alle koninklijke besluiten waarbij de eremedailles in brons, zilver en goud zijn verleend,
      zoals deze zijn genomen voor de inwerkingtreding van [artikel I][ref4] van deze wet.

      b. Het lint van de eremedaille mag als draagteken zonder de eremedaille worden gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006597#ArtikelII
