  - number: VI
    text: |-
      De tekst van de wet van 4 april 1892, houdende instelling van de Orde van Oranje-Nassau, en van de wet van 29
      september 1815, houdende instelling van de Orde van de Nederlandse Leeuw, wordt overgebracht in de wettelijke
      spelling en in het *Staatsblad*, het Publicatieblad van de Nederlandse Antillen en het Afkondigingsblad van Aruba
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006597/2010-10-10#ArtikelVI
  - number: VII
    text: De verschillende artikelen van deze rijkswet treden in werking op bij koninklijk besluit te bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0006597/2010-10-10#ArtikelVII
