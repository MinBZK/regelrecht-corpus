  - number: II.3
    text: |-
      [Artikel 56i][ref1] is niet van toepassing op gevallen waarbij de verpachter aan de in [artikel 56b][ref2] bedoelde
      verplichting heeft voldaan op het tijdstip van inwerkingtreding van [artikel 56i][ref3].


