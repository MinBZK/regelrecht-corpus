preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Pachtwet te wijzigen, in het bijzonder teneinde het
    aanbod van landbouwgronden in pacht te bevorderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007605/2007-01-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Pachtovereenkomsten, die lopen op het tijdstip van inwerkingtreding van deze wet en na dit tijdstip vallen onder
      de termen van [artikel 58][ref1] zoals dit dan luidt, blijven beheerst worden door de [Pachtwet][ref2] zoals deze
      luidde voor de inwerkingtreding van deze wet, met uitzondering van de [artikelen 19][ref3] en [56i][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002269
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002269#Artikel56i
    url: https://wetten.overheid.nl/BWBR0007605/2007-01-01#ArtikelII
