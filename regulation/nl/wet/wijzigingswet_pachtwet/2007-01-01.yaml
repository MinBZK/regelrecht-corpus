  - number: II.2
    text: |-
      Pachtverhoudingen en pachtovereenkomsten die ingevolge [Hoofdstuk VII, Titel 2, van de Landinrichtingswet][ref1]
      (*Stb.* 1985, 299) ontstaan, blijven beheerst worden door de [Pachtwet][ref2] zoals deze luidde voor de
      inwerkingtreding van deze wet, met uitzondering van de [artikelen 19][ref3] en [56i][ref4]. Het bepaalde
      in de vorige volzin is van overeenkomstige toepassing op de ingevolge [artikel 20][ref5] onderscheidenlijk
      [artikel 25 van de Reconstructiewet Midden-Delfland][ref6] (*Stb.* 1977, 233) of [artikel 61][ref7]
      onderscheidenlijk [artikel 66 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref8]
      (*Stb.* 1977, 694) of [artikel 54][ref9] onderscheidenlijk
      [artikel 76 van de Wet inrichting landelijk gebied][ref10] of [artikel 65][ref11] onderscheidenlijk
      [artikel 85 van de Reconstructiewet concentratiegebieden][ref12] nieuw te vestigen pachtverhoudingen
      onderscheidenlijk door de grondkamer te ontwerpen pachtovereenkomsten.


