preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Pachtwet te wijzigen, in het bijzonder teneinde het
    aanbod van landbouwgronden in pacht te bevorderen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007605/2002-04-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Pachtovereenkomsten, die lopen op het tijdstip van inwerkingtreding van deze wet en na dit tijdstip vallen onder
      de termen van artikel 58 zoals dit dan luidt, blijven beheerst worden door de [Pachtwet][ref1] zoals deze luidde
      voor de inwerkingtreding van deze wet, met uitzondering van de artikelen 19 en 56[][ref2].

      2 Pachtverhoudingen en pachtovereenkomsten die ingevolge [Hoofdstuk VII, Titel 2, van de Landinrichtingswet][ref3]
      (*Stb.* 1985, 299) ontstaan, blijven beheerst worden door de [Pachtwet][ref4] zoals deze luidde voor
      de inwerkingtreding van deze wet, met uitzondering van de artikelen 19 en 56[][ref5]. Het bepaalde
      in de vorige volzin is van overeenkomstige toepassing op de ingevolge artikel 20 onderscheidenlijk
      [artikel 25 van de Reconstructiewet Midden-Delfland][ref6] (*Stb.* 1977, 233) of artikel 61 onderscheidenlijk
      [artikel 66 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref7] (*Stb.* 1977, 694)
      of [artikel 65][ref8] onderscheidenlijk [artikel 85 van de Reconstructiewet concentratiegebieden][ref9] nieuw te
      vestigen pachtverhoudingen onderscheidenlijk door de grondkamer te ontwerpen pachtovereenkomsten.

      3 Artikel 56*i* is niet van toepassing op gevallen waarbij de verpachter aan de in artikel 56*b* bedoelde
      verplichting heeft voldaan op het tijdstip van inwerkingtreding van artikel 56*i*.


