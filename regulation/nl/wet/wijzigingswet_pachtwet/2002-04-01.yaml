  - number: II.3
    text: |-
      Artikel 56*i* is niet van toepassing op gevallen waarbij de verpachter aan de in artikel 56*b* bedoelde
      verplichting heeft voldaan op het tijdstip van inwerkingtreding van artikel 56*i*.
    url: https://wetten.overheid.nl/BWBR0007605/2002-04-01#ArtikelII
