preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Pachtwet te wijzigen, in het bijzonder teneinde het
    aanbod van landbouwgronden in pacht te bevorderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007605/2002-04-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Pachtovereenkomsten, die lopen op het tijdstip van inwerkingtreding van deze wet en na dit tijdstip vallen onder de
      termen van artikel 58 zoals dit dan luidt, blijven beheerst worden door de [Pachtwet][ref1] zoals deze luidde voor
      de inwerkingtreding van deze wet, met uitzondering van de artikelen 19 en 56[][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002269
      [ref2]: https://wetten.overheid.nl/BWBR0007605#ArtikelI
    url: https://wetten.overheid.nl/BWBR0007605/2002-04-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002269
      - id: ref2
        bwb_id: BWBR0007605
        artikel: I
  - number: II.2
    text: |-
      Pachtverhoudingen en pachtovereenkomsten die ingevolge [Hoofdstuk VII, Titel 2, van de Landinrichtingswet][ref1]
      (*Stb.* 1985, 299) ontstaan, blijven beheerst worden door de [Pachtwet][ref2] zoals deze luidde voor
      de inwerkingtreding van deze wet, met uitzondering van de artikelen 19 en 56[][ref3]. Het bepaalde
      in de vorige volzin is van overeenkomstige toepassing op de ingevolge artikel 20 onderscheidenlijk
      [artikel 25 van de Reconstructiewet Midden-Delfland][ref4] (*Stb.* 1977, 233) of artikel 61 onderscheidenlijk
      [artikel 66 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref5] (*Stb.* 1977, 694)
      of [artikel 65][ref6] onderscheidenlijk [artikel 85 van de Reconstructiewet concentratiegebieden][ref7] nieuw te
      vestigen pachtverhoudingen onderscheidenlijk door de grondkamer te ontwerpen pachtovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0002269
