  - number: 4a
    text: |-
      Indien de verordening, bedoeld in [artikel 5, eerste lid][ref1], daarin voorziet verstrekt het college van
      burgemeester en wethouders aan personen met een beperking, chronisch psychisch of psychosociaal probleem en daarmee
      verband houdende aannemelijke meerkosten een tegemoetkoming ter bevordering van de deelname aan het maatschappelijk
      verkeer en van het zelfstandig functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel5
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel4a
    references:
