  - number: '7'
    text: |-
      1 Op het persoonsgebonden budget waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref1] en de financiële tegemoetkomingen is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] niet van toepassing.

      2 Een persoonsgebonden budget en een financiële tegemoetkoming voor een bouwkundige of woontechnische ingreep in
      of aan een woonruimte wordt verleend aan de eigenaar van de woonruimte. [Artikel 6][ref3] is van overeenkomstige
      toepassing.


