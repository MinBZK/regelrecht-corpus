        artikel: '5'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 De gemeenteraad stelt bij verordening en met inachtneming van het bepaalde bij of krachtens deze wet
      regels over de door het college van burgemeester en wethouders te verlenen individuele voorzieningen
      en over de voorwaarden waaronder personen die een aanspraak hebben op dergelijke voorzieningen recht
      hebben op het ontvangen van die voorziening in natura, het ontvangen van een financiële tegemoetkoming
      of een persoonsgebonden budget, waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref1].

      2 De verordening, bedoeld in het eerste lid, bevat ten minste de bepaling:

      a. op welke wijze de toegang tot het aanvragen van individuele voorzieningen in samenhang met voorzieningen op het
      gebied van wonen en zorg als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref2] is geregeld;

      b. op welke wijze de verkrijging van individuele voorzieningen samenhangend afgestemd op de situatie van de
      aanvrager worden bepaald.

      3 De verordening, bedoeld in het eerste lid, bevat tevens regels over de toepassing van [artikel 4a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0020031#Artikel4a
