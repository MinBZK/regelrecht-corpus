  - number: 6a
    text: |-
      1 Het college van burgemeester en wethouders licht de personen, bedoeld in [artikel 6, eerste lid][ref1], vooraf
      in duidelijke en begrijpelijke bewoordingen in over de gevolgen van de keuze voor een individuele voorziening
      in natura, een persoonsgebonden budget, waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref2], of een financiële tegemoetkoming.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop
      een persoon als bedoeld in [artikel 6, eerste lid][ref3], door het college van burgemeester en
      wethouders geïnformeerd wordt over de keuze die deze persoon heeft tussen de individuele voorziening in
      natura, een persoonsgebonden budget waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref4], of een financiële tegemoetkoming.


