  - number: '20'
    text: |-
      1 Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering
      verstrekken ten behoeve van beleid op het terrein van openbare geestelijke gezondheidszorg, maatschappelijke opvang
      en verslavingsbeleid.

      2 Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering
      verstrekken ten behoeve van beleid op het terrein van vrouwenopvang.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van:

      a. het bedrag van de uitkering dan wel de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag van een uitkering en de besluitvorming daarover;

      c. de aan de verlening van een uitkering verbonden verplichtingen;

      d. de vaststelling van de uitkering;

      e. de intrekking of wijziging van de beschikking tot verlening en vaststelling van de uitkering;

      f. de betaling, de terugvordering van de uitkering alsmede het verlenen van voorschotten op de uitkering.

      4 Een gemeente waaraan een uitkering als bedoeld in het eerste of tweede lid wordt verstrekt en die financiële
      middelen verstrekt aan instellingen, draagt er zorg voor dat die instellingen overeenkomstig door Onze Minister bij
      ministeriële regeling te stellen regels hun werkzaamheden registreren en de geregistreerde gegevens verstrekken aan
      een door Onze Minister daartoe aangewezen instelling.

      5 Een gemeente die een uitkering als bedoeld in het eerste of tweede lid ontvangt, overlegt over de besteding van
      die uitkering met de omringende gemeenten.

      6 De door gemeenten ingevolge het eerste en tweede lid bekostigde voorzieningen op het terrein van maatschappelijke
      opvang en verslavingsbeleid zijn toegankelijk voor iedereen die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel20
  - number: '21'
    text: |-
      1 Onze Minister kan aan gemeenten een uitkering verstrekken ten behoeve van de stimulering van de maatschappelijke
      ondersteuning.

      2 [Artikel 20, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel20
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '20'
        paragraaf: '7'
  - number: 21a
    text: |-
      1 De gemeenteraad stelt basistarieven vast voor het verlenen van huishoudelijke verzorging.

      2 De basistarieven worden vastgesteld:

      a. op basis van reële kostprijzen van de onderscheidenlijke vormen van huishoudelijke verzorging; en

      b. uitgaande van inzet van personeel door de aanbieder tegen arbeidsvoorwaarden die passen bij de vereiste
      vaardigheden benodigd voor het leveren van huishoudelijke verzorging.

      3 Het college van burgemeester en wethouders neemt bij het aangaan van overeenkomsten met derden over het verlenen
      van huishoudelijke verzorging de door de gemeenteraad vastgestelde basistarieven in acht.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de vaststelling van
      de in het eerste lid bedoelde basistarieven en de in het tweede lid bedoelde arbeidsvoorwaarden.

      5 Het ontwerp van een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt aan de beide
      kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van bestuur kan
      worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of namens een der
      kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21a
  - number: 21b
    text: |-
      1 Het college van burgemeester en wethouders van elk van de bij algemene maatregel van bestuur aangewezen gemeenten
      draagt zorg voor de organisatie van een steunpunt huiselijk geweld, ten behoeve van die gemeente en de omliggende
      regio.

      2 Een steunpunt huiselijk geweld oefent de volgende taken uit:

      a. het fungeren als meldpunt voor gevallen of vermoedens van huiselijk geweld;

      b. het in kennis stellen van een instantie die passende professionele hulp kan verlenen bij huiselijk geweld, van
      een melding van huiselijk geweld of een vermoeden daarvan, indien het belang van de betrokkene dan wel de ernst van
      de situatie waarop de melding betrekking heeft daartoe aanleiding geeft;

      c. het in kennis stellen van de politie van een melding van huiselijk geweld of een vermoeden daarvan, indien het
      belang van de betrokkene dan wel de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding
      geeft;

      d. het in kennis stellen van het advies- en meldpunt kindermishandeling van een melding van huiselijk geweld of een
      vermoeden daarvan, als er kinderen in het gezin zijn;

      e. het op de hoogte stellen van degene die een melding heeft gedaan, van de stappen die naar aanleiding van de
      melding zijn ondernomen.

      3 Het steunpunt huiselijk geweld verstrekt aan degene die een vermoeden van huiselijk geweld heeft, desgevraagd
      advies over de stappen die in verband daarmee kunnen worden ondernomen en verleent daarbij zo nodig ondersteuning.

      4 Het college van burgemeester en wethouders van elk van de bij algemene maatregel van bestuur aangewezen
      gemeenten bevordert een goede samenwerking tussen het steunpunt huiselijk geweld en het advies- en meldpunt
      kindermishandeling, de hulpverlenende instanties en de politie.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkwijze van
      een steunpunt huiselijk geweld bij de uitoefening van de taken, bedoeld in het tweede en derde lid, en over de
      deskundigheid waarover een steunpunt huiselijk geweld moet beschikken om een verantwoorde uitvoering van zijn taken
      te kunnen realiseren.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21b
  - number: 21c
    text: |-
      Het steunpunt huiselijk geweld verwerkt persoonsgegevens ten behoeve van de goede vervulling van de taken, bedoeld
      in [artikel 21b, tweede en derde lid][ref1]. Het steunpunt huiselijk geweld is de verantwoordelijke voor deze
      verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: 21b
        paragraaf: 8b
  - number: 21d
    text: |-
      1 Een steunpunt huiselijk geweld kan zonder toestemming van degene die het betreft persoonsgegevens
      uitsluitend verwerken indien dit noodzakelijk is te achten voor de uitoefening van de taken, bedoeld in
      [artikel 21b, tweede lid][ref1].

      2 Een steunpunt huiselijk geweld kan zonder toestemming van degene die het betreft bijzondere persoonsgegevens als
      bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref2] uitsluitend verwerken indien uit een melding
      redelijkerwijs een vermoeden van huiselijk geweld kan worden afgeleid en dit noodzakelijk is te achten voor de
      uitoefening van de taken, bedoeld in [artikel 21b, tweede lid][ref3].

      3 Derden die op grond van een wettelijk voorschrift of op grond van hun ambt of beroep tot geheimhouding zijn
      verplicht kunnen, zonder toestemming van degene die het betreft, aan een steunpunt huiselijk geweld desgevraagd
      of uit eigen beweging inlichtingen verstrekken waarover zij beroepshalve beschikken, indien dit noodzakelijk kan
      worden geacht om een situatie van huiselijk geweld te beëindigen of een redelijk vermoeden van huiselijk geweld
      te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
