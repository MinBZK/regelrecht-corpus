  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders biedt personen die aanspraak hebben op een individuele voorziening
      de keuze tussen het ontvangen van een voorziening in natura of het ontvangen van een hiermee vergelijkbaar
      en toereikend persoonsgebonden budget, waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref1], tenzij hiertegen overwegende bezwaren bestaan.

      2 Indien een persoon gekozen heeft voor een individuele voorziening in natura, dan wordt hem deze voorziening door
      of namens het college van burgemeester en wethouders verstrekt. Het college van burgemeester en wethouders laat de
      voorziening in natura zoveel mogelijk door derden verrichten. Indien een derde de voorziening in natura verricht,
      draagt het college van burgemeester en wethouders er zorg voor dat op de persoon, die de voorziening in natura
      ontvangt, geen werkgevers- of opdrachtgeversverplichtingen komen te rusten.

      3 Het persoonsgebonden budget, waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref2], wordt door het college van burgemeester en
      wethouders als bedrag aan de persoon die aanspraak heeft op een individuele voorziening verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel5
