        bwb_id: BWBR0020031
        artikel: '13'
        paragraaf: '3'
  - number: '15'
    text: |-
      1 De gemeenteraad kan bij verordening bepalen dat een persoon van 18 jaren of ouder aan wie maatschappelijke
      ondersteuning is verleend, een eigen bijdrage verschuldigd is:

      a. voor zover die ondersteuning bestaat uit het verlenen van een individuele voorziening in natura
      of een persoonsgebonden budget waaronder de vergoeding voor een arbeidsverhouding als bedoeld in
      [artikel 5, eerste lid, van de Wet op de loonbelasting 1964][ref1], en niet bestaat uit een aan hem verleende
      financiële tegemoetkoming,

      b. voor zover de ondersteuning bestaat uit maatschappelijke opvang, waaronder vrouwenopvang.

      2 De hoogte van de eigen bijdrage kan voor de verschillende soorten van maatschappelijke ondersteuning
      verschillend worden vastgesteld en mede afhankelijk gesteld worden van het inkomen en vermogen van degene aan wie
      maatschappelijke ondersteuning is verleend en van zijn echtgenoot.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de eigen
      bijdrage.

      4 De voordracht voor een algemene maatregel van bestuur als bedoeld in het derde lid, die betrekking heeft op het
      in het tweede lid bedoelde vermogen, wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd. Indien een der kamers der Staten-Generaal besluit niet in te stemmen met het
      ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan zes weken na het besluit van die kamer der Staten-
      Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '5'
  - number: '16'
    text: |-
      Een eigen bijdrage wordt, met uitzondering van die voor maatschappelijke opvang en vrouwenopvang, vastgesteld en
      geïnd door het CAK.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel16
  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur aan te wijzen personen en instellingen kunnen het burgerservicenummer, van een
      persoon die een eigen bijdrage verschuldigd is, gebruiken voor zover dat noodzakelijk is ter uitvoering van de
      [artikelen 16][ref1] en [19][ref2], waarbij eveneens van dat nummer gebruik kan worden gemaakt:

      a. in het verkeer met de persoon op wie het nummer betrekking heeft, en

      b. in hun contacten met de personen en instanties voor zover deze zelf gemachtigd zijn tot het gebruik van het
      nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel19
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel18
