        artikel: '1'
        paragraaf: '1'
  - number: 19b
    text: |-
      De Stichting Centrum Indicatiestelling Zorg en een stichting als bedoeld in
      [artikel 4 van de Wet op de jeugdzorg][ref1] verstrekken aan Onze Minister of in geval van toepassing
      van [artikel 19a, derde lid][ref2], aan het bestuursorgaan, bedoeld in [artikel 19a, derde lid][ref3], de
      persoonsgegevens die voor Onze Minister, respectievelijk het bestuursorgaan, noodzakelijk zijn voor de uitvoering
      van [artikel 19a][ref4].


