        artikel: '19'
        paragraaf: '5'
  - number: '19'
    text: |-
      1 De hoogte van de financiële tegemoetkomingen kan voor de verschillende soorten van maatschappelijke ondersteuning
      verschillend worden vastgesteld en mede afhankelijk gesteld worden van het inkomen en vermogen van degene aan wie
      maatschappelijke ondersteuning is verleend en van zijn echtgenoot.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de financiële
      tegemoetkomingen.

      3 De voordracht voor de algemene maatregel van bestuur als bedoeld in het tweede lid, die betrekking heeft op het
      in het eerste lid bedoelde vermogen, wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd. Indien een der kamers der Staten-Generaal besluit niet in te stemmen met het
      ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan zes weken na het besluit van die kamer der Staten-
      Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel19
  - number: 19a
    text: |-
      1 Onze Minister kan aan een persoon die mantelzorg als bedoeld in [artikel 1, eerste lid, onder b][ref1], verleent
      ter waardering van zijn werk een uitkering verstrekken.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verstrekken van een uitkering. In
      ieder geval worden regels gesteld met betrekking tot:

      a. het bedrag van de uitkering;

      b. de aanvraag van de uitkering;

      c. de criteria die voor de verstrekking van de uitkering worden gesteld;

      d. de betaling van de uitkering.

      3 Onze Minister kan de in het eerste lid bedoelde bevoegdheid delegeren aan een ander bestuursorgaan.

      4 Bij ministeriële regeling worden in geval van toepassing van het derde lid regels gesteld voor de uitvoering
      door het bestuursorgaan, de vergoeding van de kosten voor de uitvoering, de begroting van de uitgaven en kosten, de
      verantwoording van de uitgaven door het bestuursorgaan, de inrichting van de administratie en het verstrekken van
      inlichtingen door het bestuursorgaan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel19a
    references:
      - id: ref1
