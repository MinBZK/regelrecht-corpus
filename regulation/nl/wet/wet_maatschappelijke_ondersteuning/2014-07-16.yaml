        paragraaf: 8b
      - id: ref2
        bwb_id: BWBR0020031
        artikel: 21b
        paragraaf: 8b
  - number: 21j
    text: |-
      1 Het steunpunt huiselijk geweld vernietigt de door hem bewaarde bescheiden binnen drie maanden na een daartoe
      strekkend schriftelijk verzoek van degene op wie de bescheiden betrekking hebben.

      2 Het eerste lid geldt niet voor zover het verzoek bescheiden betreft waarvan redelijkerwijs aannemelijk is dat
      de bewaring van aanmerkelijk belang is voor een ander dan de verzoeker alsmede voor zover het bepaalde bij of
      krachtens de wet zich tegen vernietiging verzet.

      3 Het verzoek wordt niet ingewilligd indien het gedaan is door iemand die:

      a. jonger is dan twaalf jaren, of

      b. minderjarig is en de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een
      redelijke waardering van zijn belangen ter zake.

      4 In de gevallen, bedoeld in het derde lid, kan het verzoek door een wettelijke vertegenwoordiger worden gedaan.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21j
  - number: '22'
    text: |-
      1 Het college van burgemeester en wethouders verstrekt desgevraagd kosteloos aan Onze Minister de gegevens die hij
      met betrekking tot deze wet nodig heeft.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      verstrekken van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel22
  - number: '23'
    text: |-
      De rijksbelastingdienst verstrekt:

      a. het college van burgemeester en wethouders de persoonsgegevens die voor het college noodzakelijk zijn voor de
      uitvoering van [artikel 19][ref1], en

      b. het CAK de persoonsgegevens die voor het CAK noodzakelijk zijn voor de uitvoering van [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel16
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel23
