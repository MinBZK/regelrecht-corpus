  - number: '8'
    text: |-
      1 Een vreemdeling kan voor het verlenen van een individuele voorziening, vrouwenopvang of het verstrekken van een
      uitkering als bedoeld in [artikel 19a][ref1] slechts in aanmerking komen indien hij rechtmatig verblijf houdt in de
      zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2].

      2 Een vreemdeling kan voor het verlenen van maatschappelijke opvang slechts in aanmerking komen indien hij
      rechtmatig verblijf houdt in de zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref3],
      met uitzondering van de gevallen, bedoeld in artikel 24, tweede lid, van Richtlijn 2004/38/EG.

      3 In afwijking van het eerste of het tweede lid kunnen in bij of krachtens algemene maatregel van bestuur te
      noemen gevallen, zo nodig in afwijking van [artikel 10 van de Vreemdelingenwet 2000][ref4], bij of krachtens die
      maatregel aan te geven categorieën niet rechtmatig in Nederland verblijvende vreemdelingen, geheel of gedeeltelijk
      in aanmerking komen voor bij die maatregel aan te geven voorzieningen of voor een uitkering als bedoeld in
      [artikel 19a][ref5]. Het in aanmerking komen voor een voorziening of uitkering als bedoeld in artikel 19a geeft een
      vreemdeling geen recht op rechtmatig verblijf.

      4 In de in het derde lid genoemde maatregel kan worden bepaald dat het college van burgemeester en wethouders zorg
      draagt voor het verlenen van bij die maatregel aangewezen voorzieningen.


