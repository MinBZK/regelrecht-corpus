  - number: '9'
    text: |-
      1 Het college van burgemeester en wethouders publiceert jaarlijks voor 1 juli:

      a. de uitkomsten van onderzoek naar de tevredenheid van vragers van maatschappelijke ondersteuning over de
      uitvoering van de wet, die verkregen zijn volgens een methode die na overleg met representatieve organisaties op
      het gebied van maatschappelijke ondersteuning tot stand is gekomen, en

      b. bij ministeriële regeling aangewezen gegevens over de prestaties van gemeenten op het gebied van
      maatschappelijke ondersteuning betreffende het voorgaande kalenderjaar.

      2 Het college van burgemeester en wethouders verstrekt jaarlijks voor 1 juli aan Onze Minister of een door Onze
      Minister aangewezen instelling de in het eerste lid omschreven gegevens.

      3 Onze Minister draagt er zorg voor dat op basis van de door de gemeente verstrekte gegevens voor 1 januari volgend
      op de in het tweede lid genoemde datum een rapportage wordt opgesteld en gepubliceerd waarin de gegevens van de
      gemeenten worden vergeleken.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel9
  - number: 9a
    text: |-
      1 Het college van burgemeester en wethouders draagt voortdurend zorg voor de kwaliteit en de continuïteit van de
      maatschappelijke ondersteuning.

      2 Indien het college van burgemeester en wethouders het verlenen van maatschappelijke ondersteuning door derden
      laat verrichten of van derden zaken betrekt die in het kader van het verlenen van maatschappelijke ondersteuning
      aan een persoon in eigendom worden overgedragen of in bruikleen worden gegeven, waarborgt hij daarbij de kwaliteit
      en de continuïteit van de maatschappelijke ondersteuning.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verplichtingen van
      het college van burgemeester en wethouders bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel9a
  - number: '10'
    text: |-
      1 Het college van burgemeester en wethouders laat het verlenen van maatschappelijke ondersteuning zoveel mogelijk
      verrichten door derden.

      2 Het college van burgemeester en wethouders betrekt zaken die in het kader van het verlenen van maatschappelijke
      ondersteuning aan een persoon in eigendom worden overgedragen of in bruikleen worden gegeven, van derden, tenzij
      dit redelijkerwijs niet mogelijk is.

      3 Het eerste en tweede lid zijn niet van toepassing op het verlenen van huishoudelijke verzorging. Indien het
      college van burgemeester en wethouders evenwel besluit het verlenen van huishoudelijke verzorging door derden te
      laten verrichten, vindt dit plaats in de vorm die het college passend acht. Het college is daarbij niet verplicht
      tot het uitschrijven van een aanbesteding.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel10
  - number: 10a
    text: |-
      1 Degene die in opdracht van het college van burgemeester en wethouders huishoudelijke verzorging gaat verlenen aan
      personen die daarop aanspraak hebben, treedt met degenen die vóór hem in opdracht van het college van burgemeester
      en wethouders huishoudelijke verzorging hebben verleend in overleg over de overname van het betrokken personeel.

      2 Het college van burgemeester en wethouders ziet erop toe dat het in het eerste lid bedoelde overleg plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel10a
  - number: 10b
    text: |-
      1 Het college van burgemeester en wethouders ziet er op toe dat:

      a. een derde die maatschappelijke ondersteuning verleent als bedoeld in
      [artikel 1, eerste lid, onder g, onderdeel 2°, 3°, 5°, 6° of 7°][ref1], een meldcode vaststelt, waarin
      stapsgewijs wordt aangegeven hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er
      redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk hulp kan worden geboden;

      b. indien een derde als bedoeld in het eerste lid beschikt over personeel, hij de kennis en het gebruik van die
      meldcode onder het personeel bevordert.

      2 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
        paragraaf: '1'
  - number: '11'
    text: |-
      1 Het college van burgemeester en wethouders betrekt de ingezetenen van de gemeente en in de gemeente een
      belang hebbende natuurlijke en rechtspersonen bij de voorbereiding van het beleid betreffende maatschappelijke
      ondersteuning, op de wijze voorzien in de krachtens [artikel 150 van de Gemeentewet][ref1] vastgestelde
      verordening.

      2 Het college van burgemeester en wethouders stelt ingezetenen van de gemeente en in de gemeente belang hebbende
      natuurlijke en rechtspersonen vroegtijdig in de gelegenheid zelfstandig voorstellen voor het beleid inzake
      maatschappelijke ondersteuning te doen.

      3 Het college van burgemeester en wethouders verschaft informatie die nodig is ter uitvoering van het bepaalde in
      het eerste en tweede lid.

      4 Onverminderd het eerste lid vergewist het college van burgemeester en wethouders zich bij de voorbereiding van
      het beleid tevens van de belangen en behoeften van ingezetenen die hun belangen en behoeften niet goed kenbaar
      kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '12'
    text: |-
      1 Alvorens een voordracht tot vaststelling door de gemeenteraad te doen, vraagt het college van burgemeester en
      wethouders over het ontwerp-plan advies aan de gezamenlijke vertegenwoordigers van representatieve organisaties van
      de kant van vragers op het gebied van maatschappelijke ondersteuning.

      2 Het college van burgemeester en wethouders voegt bij de voordracht tot vaststelling door de gemeenteraad tevens
      een motivering hoe het de belangen en behoeften van personen als bedoeld in [artikel 11, vierde lid][ref1], heeft
      gewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel11
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel12
    references:
