  - number: 21h
    text: |-
      1 Onverminderd het bij of krachtens de wet bepaalde, verstrekt een steunpunt huiselijk geweld aan anderen dan
      de betrokkene geen inlichtingen over de betrokkene, dan wel inzage in of afschrift van de bescheiden dan met
      toestemming van de betrokkene.

      2 Indien de betrokkene minderjarig is, is in plaats van diens toestemming de toestemming van zijn wettelijke
      vertegenwoordiger vereist, indien hij:

      a. jonger is dan twaalf jaren, of

      b. de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van
      zijn belangen ter zake.

      3 Onder anderen dan de betrokkene zijn niet begrepen degenen van wie beroepshalve de medewerking vereist is bij de
      uitvoering van de taken, bedoeld in [artikel 21b, tweede lid][ref1], door het steunpunt huiselijk geweld.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21h
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: 21b
        paragraaf: 8b
  - number: 21i
    text: |-
      Onverminderd [artikel 21j][ref1] bewaart het steunpunt huiselijk geweld bescheiden die deze met betrekking tot een
      betrokkene onder zich heeft gedurende vijftien jaren, te rekenen van het tijdstip van ontvangst of waarop zij door
      het steunpunt huiselijk geweld zijn vervaardigd, of zoveel langer als redelijkerwijs in verband met een zorgvuldige
      uitvoering van de taken, bedoeld in [artikel 21b, tweede lid][ref2], noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel21j
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21i
