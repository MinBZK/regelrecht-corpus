  - number: '4'
    text: |-
      1 Ter compensatie van de beperkingen die een persoon als bedoeld in
      [artikel 1, eerste lid, onder g, onderdeel 4°, 5° en 6°][ref1], ondervindt in zijn zelfredzaamheid en zijn
      maatschappelijke participatie, treft het college van burgemeester en wethouders voorzieningen op het gebied van
      maatschappelijke ondersteuning die hem in staat stellen:

      a. een huishouden te voeren;

      b. zich te verplaatsen in en om de woning;

      c. zich lokaal te verplaatsen per vervoermiddel;

      d. medemensen te ontmoeten en op basis daarvan sociale verbanden aan te gaan.

      2 Bij het bepalen van de voorzieningen houdt het college van burgemeester en wethouders rekening met de
      persoonskenmerken en behoeften van de aanvrager van de voorzieningen, waaronder verandering van woning in verband
      met wijziging van leefsituatie, alsmede met de capaciteit van de aanvrager om uit een oogpunt van kosten zelf in
      maatregelen te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel4
