  - number: '39'
    text: |-
      De [Welzijnswet 1994][ref1] wordt ingetrokken, met dien verstande dat zij van toepassing blijft:

      a. op de financiële verantwoording, vaststelling en uitbetaling van op grond van de [Welzijnswet 1994][ref2]
      verleende subsidies en uitkeringen, aangevraagde en aan te vragen subsidies en uitkeringen tot aan het tijdstip van
      inwerkingtreding van de wet;

      b. in wettelijke procedures en rechtsgedingen tegen besluiten die op grond van de [Welzijnswet 1994][ref3] zijn
      genomen, dan wel op tegen deze besluiten in te stellen of ingestelde beroepen, zowel in eerste aanleg als in
      verdere instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
