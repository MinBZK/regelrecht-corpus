  - number: 21f
    text: |-
      1 Indien aan een steunpunt huiselijk geweld bij de uitoefening van de taken, bedoeld in
      [artikel 21b, tweede lid][ref1], persoonsgegevens worden verstrekt door een ander dan de betrokkene, brengt hij,
      in afwijking van [artikel 34, eerste lid, van de Wet bescherming persoonsgegevens][ref2], de betrokkene hiervan
      zo spoedig mogelijk, doch in ieder geval binnen vier weken na het moment van vastlegging van de hem betreffende
      gegevens, op de hoogte.

      2 De in het eerste lid genoemde termijn kan door het steunpunt huiselijk geweld telkens met ten hoogste
      twee weken worden verlengd, voor zover dit noodzakelijk is voor de uitoefening van de taken, bedoeld in
      [artikel 21b, tweede lid][ref3], en dit noodzakelijk kan worden geacht om een situatie van huiselijk geweld te
      beëindigen of een redelijk vermoeden daarvan te onderzoeken.

      3 In afwijking van [artikel 35 van de Wet bescherming persoonsgegevens][ref4] kan een steunpunt huiselijk geweld
      de mededeling als bedoeld in dat artikel aan de betrokkene achterwege laten voor zover dit noodzakelijk kan worden
      geacht om een situatie van huiselijk geweld te beëindigen of een redelijk vermoeden daarvan te onderzoeken.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin het bekendmaken van de
      identiteit van de persoon die het huiselijk geweld of het vermoeden daarvan heeft gemeld of van de persoon van wie
      informatie in het kader van het onderzoek is verkregen, achterwege kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel35
