  - number: 21g
    text: |-
      1 Het steunpunt huiselijk geweld verstrekt aan een betrokkene desgevraagd zo spoedig mogelijk inzage in en
      afschrift van de bescheiden waarover deze met betrekking tot die betrokkene beschikt.

      2 Inzage in of afschrift van de bescheiden wordt aan de betrokkene geweigerd, indien deze:

      a. jonger dan twaalf jaren is, of

      b. de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van
      zijn belangen ter zake.

      3 Indien de betrokkene jonger is dan zestien jaren, of de leeftijd van zestien jaar heeft bereikt en niet in staat
      kan worden geacht tot een redelijke waardering van zijn belangen ter zake, worden desgevraagd aan de wettelijke
      vertegenwoordiger inlichtingen dan wel inzage in of afschrift van de bescheiden verstrekt, tenzij het belang van de
      betrokkene zich daartegen verzet.

      4 Inlichtingen over, inzage in of afschrift van bescheiden kan worden geweigerd, voor zover de persoonlijke
      levenssfeer van een ander dan de betrokkene daardoor zou worden geschaad dan wel dit noodzakelijk is voor de
      uitoefening van de taken, bedoeld in [artikel 21b, tweede lid][ref1], of om een situatie van huiselijk geweld te
      beëindigen dan wel een redelijk vermoeden daarvan te onderzoeken.

      5 Voor de verstrekking van een afschrift kan een vergoeding worden gevraagd overeenkomstig de krachtens
      [artikel 39 van de Wet bescherming persoonsgegevens][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel21b
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel39
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel21g
