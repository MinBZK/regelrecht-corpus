        artikel: '11'
        paragraaf: '2'
  - number: '13'
    text: |-
      Provinciale staten onderscheidenlijk gedeputeerde staten dragen zorg voor het voeren van beleid betreffende het
      steunfunctiewerk.
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel13
  - number: '14'
    text: |-
      1 De gemeenteraad onderscheidenlijk het college van burgemeester en wethouders van de gemeenten Amsterdam,
      Rotterdam, Den Haag en Utrecht worden voor de toepassing van [artikel 13][ref1] gelijkgesteld met provinciale
      staten onderscheidenlijk gedeputeerde staten.

      2 De in het eerste lid genoemde gemeenten worden ten aanzien van het beleid inzake steunfunctiewerk voor
      minderheden niet gelijk gesteld met een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel13
    url: https://wetten.overheid.nl/BWBR0020031/2014-07-16#Artikel14
    references:
