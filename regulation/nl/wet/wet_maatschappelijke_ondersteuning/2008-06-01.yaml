  - number: '41'
    text: |-
      1 In afwijking van [artikel 1, eerste lid, onder h][ref1], wordt in dit artikel verstaan onder huishoudelijke
      verzorging: het ondersteunen bij of het overnemen van activiteiten op het gebied van het verzorgen van het
      huishouden in verband met een somatische, psychogeriatrische of psychiatrische aandoening of beperking, een
      verstandelijke, lichamelijke of zintuiglijke handicap of een psychosociaal probleem die of dat leidt of dreigt
      te leiden tot het disfunctioneren van de verzorging van het huishouden van een persoon dan wel van de leefeenheid
      waartoe een persoon behoort, te verlenen door een instelling.

      2 De aanspraken op zorg, bedoeld in [artikel 6, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2],
      omvatten niet huishoudelijke verzorging ten behoeve van het behoud van zelfstandig functioneren of deelname aan het
      maatschappelijke verkeer.

      3 De rechten en verplichtingen die gelden op het tijdstip van de inwerkingtreding van deze wet met betrekking
      tot huishoudelijke verzorging waarvoor op grond van de [Algemene Wet Bijzondere Ziektekosten][ref3]
      een indicatiebesluit is afgegeven voor de inwerkingtreding van deze wet, tenzij de verzekerde
      in het buitenland woont, blijven gelden gedurende de looptijd van het indicatiebesluit, doch
      ten hoogste een jaar na de inwerkingtreding van deze wet, met dien verstande dat het college van
      burgemeester en wethouders in de plaats treedt van de zorgverzekeraar van betrokkene, bedoeld in
      [artikel 1, eerste lid, onder b, van de Algemene Wet Bijzondere Ziektekosten][ref4], en dat betrokkene de bijdrage
      in de kosten, bedoeld in [artikel 6, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref5], aan het
      college van burgemeester en wethouders is verschuldigd.

      4 Op een aanvraag om huishoudelijke verzorging wordt door het college van burgemeester en wethouders
      van de gemeente waar betrokkene woont, tot drie maanden nadat de gemeenteraad de verordening, bedoeld in
      [artikel 5][ref6], heeft vastgesteld, doch uiterlijk tot een jaar na de inwerkingtreding van deze wet, een
      beslissing genomen overeenkomstig de regels zoals die voor de inwerkingtreding van deze wet op deze verzorging
      van toepassing waren, met dien verstande dat het college van burgemeester en wethouders optreedt als onafhankelijk
      indicatieorgaan als bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref7].

      5 Indien op grond van het vierde lid op een aanvraag een indicatiebesluit voor huishoudelijke verzorging is
      afgegeven, is het derde lid van overeenkomstige toepassing.

      6 In wettelijke procedures en rechtsgedingen tegen besluiten betreffende huishoudelijke verzorging die op grond
      van de [Algemene Wet Bijzondere Ziektekosten][ref8] zijn genomen, dan wel op tegen deze besluiten in te stellen
      of ingestelde beroepen, blijft, zowel in eerste aanleg als in verdere instantie, het bepaalde bij of krachtens de
      [Algemene Wet Bijzondere Ziektekosten][ref9] van toepassing.


