preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen betreffende maatschappelijke
    ondersteuning en daarbij de rol van de gemeente te versterken;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:


      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;


      b. mantelzorg: langdurige zorg die niet in het kader van een hulpverlenend beroep wordt geboden aan een
      hulpbehoevende door personen uit diens directe omgeving, waarbij zorgverlening rechtstreeks voortvloeit uit de
      sociale relatie en de gebruikelijke zorg van huisgenoten voor elkaar overstijgt;


      c. maatschappelijke opvang: het tijdelijk bieden van onderdak, begeleiding, informatie en advies aan personen die,
      door een of meer problemen, al dan niet gedwongen de thuissituatie hebben verlaten en niet in staat zijn zich op
      eigen kracht te handhaven in de samenleving;


      d. vrouwenopvang: het tijdelijk bieden van onderdak en begeleiding aan vrouwen die, al dan niet gedwongen, de
      thuissituatie hebben verlaten in verband met problemen van relationele aard of geweld;


      e. openbare geestelijke gezondheidszorg: het signaleren en bestrijden van risicofactoren op het gebied van de
      openbare geestelijke gezondheidszorg, het bereiken en begeleiden van kwetsbare personen en risicogroepen, het
      functioneren als meldpunt voor signalen van crisis of dreiging van crisis bij kwetsbare personen en risicogroepen
      en het tot stand brengen van afspraken tussen betrokken organisaties over de uitvoering van de openbare geestelijke
      gezondheidszorg;


      f. verslavingsbeleid: maatschappelijke zorg gericht op verslaafden, alle individuele geneeskundige verslavingszorg
      daaronder niet begrepen, en preventie van verslavingsproblemen, met inbegrip van activiteiten in het kader van de
      bestrijding van overlast door verslaving;


      g. maatschappelijke ondersteuning:


      1°. het bevorderen van de sociale samenhang in en leefbaarheid van dorpen, wijken en buurten;


      2°. op preventie gerichte ondersteuning van jeugdigen met problemen met opgroeien en van ouders met problemen met
      opvoeden;


      3°. het geven van informatie, advies en cliëntondersteuning;


      4°. het ondersteunen van mantelzorgers daar onder begrepen steun bij het vinden van adequate oplossingen indien zij
      hun taken tijdelijk niet kunnen waarnemen, alsmede het ondersteunen van vrijwilligers;


      5°. het bevorderen van de deelname aan het maatschappelijke verkeer en van het zelfstandig functioneren van mensen
      met een beperking of een chronisch psychisch probleem en van mensen met een psychosociaal probleem;


      6°. het verlenen van voorzieningen aan mensen met een beperking of een chronisch psychisch probleem en aan mensen
      met een psychosociaal probleem ten behoeve van het behouden en het bevorderen van hun zelfstandig functioneren of
      hun deelname aan het maatschappelijke verkeer;


      7°. het bieden van maatschappelijke opvang, waaronder vrouwenopvang en het voeren van beleid ter bestrijding van
      geweld dat door iemand uit de huiselijke kring van het slachtoffer is gepleegd;


      8°. het bevorderen van openbare geestelijke gezondheidszorg, met uitzondering van het bieden van psychosociale hulp
      bij rampen;


      9°. het bevorderen van verslavingsbeleid;


      h. huishoudelijke verzorging: het ondersteunen bij of het overnemen van activiteiten op het gebied van het
      verzorgen van het huishouden van een persoon dan wel van de leefeenheid waartoe een persoon behoort;


      i. steunfunctiewerk: activiteiten die het uitvoeren of voorbereiden daarvan, ondersteunen van het door de gemeente
      te voeren beleid betreffende maatschappelijke ondersteuning.


      2 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:


      a. echtgenoot: geregistreerde partner;


      b. gehuwd: als partner geregistreerd.


      3 Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt:


      a. als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde
      meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;


      b. als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.


      4 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.


      5 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:


      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld,


      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander,


      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract, of


      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.


      6 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.


      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel1
  - number: '2'
    text: >-
      Er bestaat geen aanspraak op maatschappelijke ondersteuning voor zover met betrekking tot de problematiek die in
      het gegeven geval aanleiding geeft voor de noodzaak tot ondersteuning, een voorziening op grond van een andere
      wettelijke bepaling bestaat.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel2
  - number: '3'
    text: |-
      1 De gemeenteraad stelt een of meer plannen vast, die richting geven aan de door de gemeenteraad en het college van
      burgemeester en wethouders te nemen beslissingen betreffende maatschappelijke ondersteuning.

      2 De gemeenteraad stelt het plan telkens voor een periode van ten hoogste vier jaren vast. Het plan kan tussentijds
      gewijzigd worden.

      3 Het plan bevat de hoofdzaken van het door de gemeente te voeren beleid betreffende maatschappelijke
      ondersteuning.

      4 In het plan wordt in ieder geval aangegeven:

      a. wat de gemeentelijke doelstellingen zijn op de verschillende in [artikel 1, eerste lid, onder g][ref1], genoemde
      onderdelen van maatschappelijke ondersteuning;

      b. hoe het samenhangende beleid betreffende maatschappelijke ondersteuning zal worden uitgevoerd en welke acties in
      de door het plan bestreken periode zullen worden ondernomen;

      c. welke resultaten de gemeente in de door het plan bestreken periode wenst te behalen;

      d. welke maatregelen de gemeenteraad en het college van burgemeester en wethouders nemen om de kwaliteit te borgen
      van de wijze waarop de maatschappelijke ondersteuning wordt uitgevoerd;

      e. welke maatregelen de gemeenteraad en het college van burgemeester en wethouders nemen om voor degene aan wie
      maatschappelijke ondersteuning als bedoeld in [artikel 1, eerste lid, onder g, onderdelen 2°, 5° en 6°][ref2],
      wordt verleend, keuzevrijheid te bieden met betrekking tot de activiteiten van maatschappelijke ondersteuning;

      f. op welke wijze de gemeenteraad en het college van burgemeester en wethouders zich hebben vergewist van de
      behoeften van kleine doelgroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel3
    references:
      - id: ref1
