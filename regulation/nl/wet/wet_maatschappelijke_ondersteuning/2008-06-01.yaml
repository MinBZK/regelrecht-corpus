  - number: '24'
    text: >-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel24
  - number: '25'
    text: >-
      Roerende zaken, voor de aanschaf waarvan krachtens deze wet een financiële tegemoetkoming is verstrekt, die zijn
      aangeschaft met een persoonsgebonden budget of die krachtens deze wet in eigendom of bruikleen zijn verleend, zijn
      niet vatbaar voor vervreemding, verpanding, belening of beslag, zolang die roerende zaken voor de rechthebbende op
      die zaken nodig zijn. Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel25
  - number: '26'
    text: |-
      1 De motivering van een beschikking op een aanvraag om een individuele voorziening vermeldt op welke wijze
      de genomen beschikking bijdraagt aan het behouden en het bevorderen van de zelfredzaamheid en de normale
      maatschappelijke participatie van mensen met een beperking of een chronisch psychisch probleem en van mensen met
      een psychosociaal probleem.

      2 Bij een beslissing op het bezwaar als bedoeld in [artikel 7:12 van de Algemene wet bestuursrecht][ref1] en een
      beslissing op het beroep als bedoeld in [artikel 7:26 van de Algemene wet bestuursrecht][ref2] is het eerste lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel712
