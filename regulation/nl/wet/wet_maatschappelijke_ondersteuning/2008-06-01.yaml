        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020031
        artikel: '1'
        paragraaf: '1'
  - number: '4'
    text: |-
      1 Ter compensatie van de beperkingen die een persoon als bedoeld in
      [artikel 1, eerste lid, onder g, onderdeel 4°, 5° en 6°][ref1], ondervindt in zijn zelfredzaamheid en zijn
      maatschappelijke participatie, treft het college van burgemeester en wethouders voorzieningen op het gebied van
      maatschappelijke ondersteuning die hem in staat stellen:

      a. een huishouden te voeren;

      b. zich te verplaatsen in en om de woning;

      c. zich lokaal te verplaatsen per vervoermiddel;

      d. medemensen te ontmoeten en op basis daarvan sociale verbanden aan te gaan.

      2 Bij het bepalen van de voorzieningen houdt het college van burgemeester en wethouders rekening met de
      persoonskenmerken en behoeften van de aanvrager van de voorzieningen, alsmede met de capaciteit van de aanvrager om
      uit een oogpunt van kosten zelf in maatregelen te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
        paragraaf: '1'
  - number: '5'
    text: |-
      1 De gemeenteraad stelt met inachtneming van het bepaalde bij of krachtens deze wet bij verordening regels vast
      over de door het college van burgemeester en wethouders te verlenen individuele voorzieningen en de voorwaarden
      waaronder personen die aanspraak hebben op dergelijke voorzieningen recht hebben op het ontvangen van die
      voorziening in natura, het ontvangen van een financiële tegemoetkoming of een persoonsgebonden budget.

      2 De verordening, bedoeld in het eerste lid, bevat ten minste de bepaling:

      a. op welke wijze de toegang tot het aanvragen van individuele voorzieningen in samenhang met voorzieningen op het
      gebied van wonen en zorg als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] is geregeld;

      b. op welke wijze de verkrijging van individuele voorzieningen samenhangend afgestemd op de situatie van de
      aanvrager worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '6'
    text: >-
      Het college van burgemeester en wethouders biedt personen die aanspraak hebben op een individuele voorziening
      de keuze tussen het ontvangen van een voorziening in natura of het ontvangen van een hiermee vergelijkbaar
      persoonsgebonden budget, tenzij hiertegen overwegende bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel6
  - number: '7'
    text: |-
      1 Op de persoonsgebonden budgetten en de financiële tegemoetkomingen is
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.

      2 Een persoonsgebonden budget en een financiële tegemoetkoming voor een bouwkundige of woontechnische ingreep in
      of aan een woonruimte wordt verleend aan de eigenaar van de woonruimte. [Artikel 6][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel6
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0020031
        artikel: '6'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 Een vreemdeling kan voor het verlenen van een individuele voorziening slechts in aanmerking komen indien hij
      rechtmatig verblijf houdt in de zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].

      2 In afwijking van het eerste lid kunnen in bij of krachtens algemene maatregel van bestuur te noemen gevallen,
      zo nodig in afwijking van [artikel 10 van de Vreemdelingenwet 2000][ref2], bij of krachtens die maatregel aan te
      geven categorieën niet-rechtmatig in Nederland verblijvende vreemdelingen, geheel of gedeeltelijk in aanmerking
      komen voor bij die maatregel aan te geven individuele voorzieningen. Het in aanmerking komen voor een individuele
      voorziening geeft een vreemdeling geen recht op rechtmatig verblijf.

      3 In de in het tweede lid genoemde maatregel kan worden bepaald dat het college van burgemeester en wethouders zorg
      draagt voor het verlenen van bij die maatregel aangewezen voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '10'
  - number: '9'
    text: >-
      1 Het college van burgemeester en wethouders publiceert jaarlijks voor 1 juli:


      a. de uitkomsten van onderzoek naar de tevredenheid van vragers van maatschappelijke ondersteuning over de
      uitvoering van de wet, die verkregen zijn volgens een methode die na overleg met representatieve organisaties op
      het gebied van maatschappelijke ondersteuning tot stand is gekomen, en


      b. bij ministeriële regeling aangewezen gegevens over de prestaties van gemeenten op het gebied van
      maatschappelijke ondersteuning betreffende het voorgaande kalenderjaar.


      2 Het college van burgemeester en wethouders verstrekt jaarlijks voor 1 juli aan Onze Minister of een door Onze
      Minister aangewezen instelling de in het eerste lid omschreven gegevens.


      3 Onze Minister draagt er zorg voor dat op basis van de door de gemeente verstrekte gegevens voor 1 januari volgend
      op de in het tweede lid genoemde datum een rapportage wordt opgesteld en gepubliceerd waarin de gegevens van de
      gemeenten worden vergeleken.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel9
  - number: '10'
    text: >-
      1 Het college van burgemeester en wethouders laat het verlenen van maatschappelijke ondersteuning zoveel mogelijk
      verrichten door derden.


      2 Het college van burgemeester en wethouders betrekt zaken die in het kader van het verlenen van maatschappelijke
      ondersteuning aan een persoon in eigendom worden overgedragen of in bruikleen worden gegeven, van derden, tenzij
      dit redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel10
  - number: '11'
    text: |-
      1 Het college van burgemeester en wethouders betrekt de ingezetenen van de gemeente en in de gemeente een
      belang hebbende natuurlijke en rechtspersonen bij de voorbereiding van het beleid betreffende maatschappelijke
      ondersteuning, op de wijze voorzien in de krachtens [artikel 150 van de Gemeentewet][ref1] vastgestelde
      verordening.

      2 Het college van burgemeester en wethouders stelt ingezetenen van de gemeente en in de gemeente belang hebbende
      natuurlijke en rechtspersonen vroegtijdig in de gelegenheid zelfstandig voorstellen voor het beleid inzake
      maatschappelijke ondersteuning te doen.

      3 Het college van burgemeester en wethouders verschaft informatie die nodig is ter uitvoering van het bepaalde in
      het eerste en tweede lid.

      4 Onverminderd het eerste lid vergewist het college van burgemeester en wethouders zich bij de voorbereiding van
      het beleid tevens van de belangen en behoeften van ingezetenen die hun belangen en behoeften niet goed kenbaar
      kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '12'
    text: |-
      1 Alvorens een voordracht tot vaststelling door de gemeenteraad te doen, vraagt het college van burgemeester en
      wethouders over het ontwerp-plan advies aan de gezamenlijke vertegenwoordigers van representatieve organisaties van
      de kant van vragers op het gebied van maatschappelijke ondersteuning.

      2 Het college van burgemeester en wethouders voegt bij de voordracht tot vaststelling door de gemeenteraad tevens
      een motivering hoe het de belangen en behoeften van personen als bedoeld in [artikel 11, tweede lid][ref1], heeft
      gewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel11
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '11'
        paragraaf: '2'
  - number: '13'
    text: >-
      Provinciale staten onderscheidenlijk gedeputeerde staten dragen zorg voor het voeren van beleid betreffende het
      steunfunctiewerk.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel13
  - number: '14'
    text: |-
      1 De gemeenteraad onderscheidenlijk het college van burgemeester en wethouders van de gemeenten Amsterdam,
      Rotterdam, Den Haag en Utrecht worden voor de toepassing van [artikel 13][ref1] gelijkgesteld met provinciale
      staten onderscheidenlijk gedeputeerde staten.

      2 De in het eerste lid genoemde gemeenten worden ten aanzien van het beleid inzake steunfunctiewerk voor
      minderheden niet gelijk gesteld met een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel13
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '13'
        paragraaf: '3'
  - number: '15'
    text: >-
      1 De gemeenteraad kan bij verordening bepalen dat een persoon van 18 jaren of ouder aan wie maatschappelijke
      ondersteuning is verleend, voor zover die ondersteuning bestaat uit het verlenen van een individuele voorziening of
      een persoonsgebonden budget en niet bestaat uit een aan hem verleende financiële tegemoetkoming, een eigen bijdrage
      is verschuldigd.


      2 De hoogte van de eigen bijdrage kan voor de verschillende soorten van maatschappelijke ondersteuning verschillend
      worden vastgesteld en mede afhankelijk gesteld worden van het inkomen van degene aan wie maatschappelijke
      ondersteuning is verleend en van zijn echtgenoot.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de eigen
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel15
  - number: '16'
    text: Een eigen bijdrage wordt vastgesteld en geïnd door een door Onze Minister aan te wijzen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel16
  - number: '17'
    text: |-
      Indien naar het oordeel van Onze Minister de rechtspersoon, bedoeld in [artikel 16][ref1], zijn in dat artikel
      omschreven taak niet langer naar behoren verricht, kan Onze Minister bepalen dat de bevoegdheden die met die taak
      verband houden niet langer aan die rechtspersoon toekomen. De betrokken bevoegdheden gaan in dat geval over op
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel16
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '16'
        paragraaf: '4'
  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur aan te wijzen personen en instellingen kunnen het burgerservicenummer, of bij
      het ontbreken daarvan het sociaal-fiscaalnummer, van een persoon die een eigen bijdrage verschuldigd is, gebruiken
      voor zover dat noodzakelijk is ter uitvoering van de [artikelen 16][ref1] en [19][ref2], waarbij eveneens van dat
      nummer gebruik kan worden gemaakt:

      a. in het verkeer met de persoon op wie het nummer betrekking heeft, en

      b. in hun contacten met de personen en instanties voor zover deze zelf gemachtigd zijn tot het gebruik van het
      nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel19
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020031
        artikel: '19'
        paragraaf: 4a
  - number: '19'
    text: >-
      1 De hoogte van de financiële tegemoetkomingen kan voor de verschillende soorten van maatschappelijke
      ondersteuning verschillend worden vastgesteld en mede afhankelijk gesteld worden van het inkomen van degene aan wie
      maatschappelijke ondersteuning is verleend en van zijn echtgenoot.


      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de financiële
      tegemoetkomingen.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel19
  - number: '20'
    text: >-
      1 Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering
      verstrekken ten behoeve van beleid op het terrein van openbare geestelijke gezondheidszorg, maatschappelijke opvang
      en verslavingsbeleid.


      2 Onze Minister kan aan bij algemene maatregel van bestuur aangewezen gemeenten een specifieke uitkering
      verstrekken ten behoeve van beleid op het terrein van vrouwenopvang.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van:


      a. het bedrag van de uitkering dan wel de wijze waarop dit bedrag wordt bepaald;


      b. de aanvraag van een uitkering en de besluitvorming daarover;


      c. de aan de verlening van een uitkering verbonden verplichtingen;


      d. de vaststelling van de uitkering;


      e. de intrekking of wijziging van de beschikking tot verlening en vaststelling van de uitkering;


      f. de betaling, de terugvordering van de uitkering alsmede het verlenen van voorschotten op de uitkering.


      4 Een gemeente waaraan een uitkering als bedoeld in het eerste of tweede lid wordt verstrekt en die financiële
      middelen verstrekt aan instellingen, draagt er zorg voor dat die instellingen overeenkomstig door Onze Minister bij
      ministeriële regeling te stellen regels hun werkzaamheden registreren en de geregistreerde gegevens verstrekken aan
      een door Onze Minister daartoe aangewezen instelling.


      5 Een gemeente die een uitkering als bedoeld in het eerste of tweede lid ontvangt, overlegt over de besteding van
      die uitkering met de omringende gemeenten.


      6 De door gemeenten ingevolge het eerste en tweede lid bekostigde voorzieningen op het terrein van maatschappelijke
      opvang en verslavingsbeleid zijn toegankelijk voor iedereen die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel20
  - number: '21'
    text: |-
      1 Onze Minister kan aan gemeenten een uitkering verstrekken ten behoeve van de stimulering van de maatschappelijke
      ondersteuning.

      2 [Artikel 20, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel20
    url: https://wetten.overheid.nl/BWBR0020031/2008-06-01#Artikel21
