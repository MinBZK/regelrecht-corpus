    text: |-
      1 De [Wet voorzieningen gehandicapten][ref1] wordt ingetrokken, met dien verstande dat:

      a. zij van toepassing blijft op de financiële verantwoording, vaststelling en uitbetaling van op grond van de
      [Wet voorzieningen gehandicapten][ref2] verleende uitkeringen, aangevraagde en aan te vragen uitkeringen tot aan
      het tijdstip van inwerkingtreding van de wet;

      b. [artikel 9 van de Wet voorzieningen gehandicapten][ref3] van toepassing blijft op roerende zaken, voor de
      aanschaf waarvan met toepassing van of krachtens die wet een financiële vergoeding is verleend, dan wel die met
      toepassing van of krachtens die wet in eigendom of bruikleen zijn verleend;

      c. andere rechten en verplichtingen dan die die voortvloeien uit
      [artikel 9 van de Wet voorzieningen gehandicapten][ref4] als bedoeld onder b, die gelden op het tijdstip van
      de inwerkingtreding van deze wet met betrekking tot een beschikking waarbij op grond van de Wet voorzieningen
      gehandicapten een voorziening is verleend, blijven gelden gedurende de looptijd van de beschikking, doch ten
      hoogste een jaar na de inwerkingtreding van deze wet;

      d. zij van toepassing blijft ten aanzien van een aanvraag om een woonvoorziening, vervoersvoorziening of
      rolstoel tot drie maanden nadat de gemeenteraad de verordening, bedoeld in [artikel 5][ref5] van deze wet, heeft
      vastgesteld, doch uiterlijk tot een jaar na de inwerkingtreding van deze wet.

      2 Indien op een aanvraag als bedoeld in het eerste lid, onder d, met toepassing van de
      [Wet voorzieningen gehandicapten][ref6] bij beschikking een voorziening is verleend, blijven de andere rechten en
      verplichtingen dan die die voortvloeien uit [artikel 9 van die wet][ref7] als bedoeld in het eerste lid, onder b,
      met betrekking tot die beschikking gelden gedurende de looptijd van de beschikking, doch ten hoogste een jaar na de
      inwerkingtreding van deze wet.

      3 In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van de
      [Wet voorzieningen gehandicapten][ref8] zijn genomen, dan wel op tegen deze besluiten in te stellen of ingestelde
      beroepen, blijven, zowel in eerste aanleg als in verdere instantie, de regels van toepassing, die golden voor de
      intrekking van die wet.


