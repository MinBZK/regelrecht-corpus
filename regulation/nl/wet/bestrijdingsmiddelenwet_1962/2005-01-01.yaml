  - number: 1i
    text: |-
      1 Op verzoek van Onze Ministers verstrekt het college alle door Onze Ministers gevraagde gegevens en inlichtingen
      die zij nodig achten voor de uitoefening van hun bevoegdheden en de uitvoering van deze wet.

      2 Onze Minister stelt na overleg met het college een informatiestatuut vast. Het informatiestatuut bevat regels met
      betrekking tot de informatievoorziening tussen Onze Ministers en het college.

      3 Het college stelt jaarlijks voor 1 april een verslag op omtrent zijn werkzaamheden, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar.
      Hij biedt dit verslag aan Onze Ministers aan en stelt het algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1i
  - number: 1j
    text: |-
      Onze betrokken Minister kan het college aanwijzingen van algemene aard geven met betrekking tot de uitoefening van
      de aan het college opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1j
  - number: 1k
    text: |-
      In de Staatscourant worden bekendgemaakt:

      a. de door het college vastgestelde reglementen;

      b. de door Onze betrokken Minister gegeven aanwijzingen van algemene aard, voor zover zij te beschouwen zijn
      als algemene regels omtrent de afweging van belangen, de vaststelling van feiten of de uitleg van wettelijke
      voorschriften bij het gebruik van de aan het college toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1k
  - number: 1l
    text: |-
      1 Indien het college de hem bij deze wet opgedragen taken niet of niet naar behoren uitvoert, kan Onze betrokken
      Minister, zo nodig in afwijking van deze wet, daarin voorzien.

      2 Na het tot stand komen van een voorziening, bedoeld in het eerste lid, draagt Onze betrokken Minister zorg voor
      vervanging van de voorziening door een algemene maatregel van bestuur. De voordracht daartoe wordt Ons zo spoedig
      mogelijk, maar uiterlijk binnen drie maanden na inwerkingtreding van de voorziening gedaan.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1l
  - number: 1m
    text: |-
      1 De [artikelen 10.28 tot en met 10.31 van de Algemene wet bestuursrecht](onbekend) zijn van overeenkomstige
      toepassing op de instemming als bedoeld in de [artikelen 1c, achtste lid][ref1], [1g, tweede lid][ref2], en
      [1h, derde en vierde lid][ref3].

      2 Indien de instemming wordt onthouden aan de begroting, is het college gerechtigd gedurende ten hoogste zes
      maanden voor iedere maand gedurende welke de instemming wordt onthouden, uitgaven te doen ter grootte van ten
      hoogste een twaalfde deel van de begroting van het voorafgaande jaar waarmee is ingestemd.


