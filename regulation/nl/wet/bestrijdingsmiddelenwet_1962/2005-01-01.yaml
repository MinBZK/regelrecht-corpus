  - number: 3a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden
      gesteld met betrekking tot de toelatingscriteria of registratiecriteria als bedoeld in
      [artikel 3, eerste lid, onderdeel a en het tweede lid, onderdeel c][ref1], en kunnen beginselen voor de beoordeling
      worden vastgesteld.

      2 De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid, wordt:

      a. voor zover daarin gestelde regelen betrekking hebben op de toelatingscriteria of registratiecriteria, bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref2], Ons gedaan door Onze betrokken Minister;

      b. voor zover daarin gestelde regelen betrekking hebben op de toelatingscriteria of registratiecriteria als bedoeld
      in [artikel 3, eerste lid, onderdeel ][ref3], Ons gedaan door Onze Minister van Welzijn, Volksgezondheid en Cultuur
      in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid;

      c. voor zover daarin gestelde regelen, betrekking hebben op de toelatingscriteria of registratiecriteria
      als bedoeld in [artikel 3, eerste lid, onderdeel ][ref4], Ons gedaan door Onze Minister van Sociale Zaken en
      Werkgelegenheid in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van
      Welzijn, Volksgezondheid en Cultuur en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      d. voor zover daarin gestelde regelen, betrekking hebben op de toelatingscriteria of registratiecriteria als
      bedoeld in [artikel 3, eerste lid, onderdeel ][ref5], Ons gedaan door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij,
      Onze Minister van Welzijn, Volksgezondheid en Cultuur en Onze Minister van Sociale Zaken en Werkgelegenheid;

      e. voor zover daarin gestelde regelen betrekking hebben op meerdere toelatingscriteria of registratiecriteria
      als bedoeld in [artikel 3, eerste lid, onderdeel ][ref6], Ons gedaan door Onze meest betrokken minister in
      overeenstemming met de andere in onderdeel *b*, *c* of *d* genoemde ministers.

      3 Indien Onze Minister, bedoeld in het tweede lid, overweegt een voordracht te doen tot vaststelling, wijziging of
      intrekking van een algemene maatregel van bestuur als bedoeld in het eerste lid kan hij indien in verband met de
      toelatingscriteria of registratiecriteria, bedoeld in [artikel 3, eerste lid, onderdeel ][ref7], naar zijn oordeel
      een onmiddellijke voorziening is vereist, in overeenstemming met de andere in het tweede lid genoemde ministers
      regelen stellen overeenkomstig de in overweging zijnde maatregelen.

      4 Een regeling als bedoeld in het derde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar
      bedoelde algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking
      treden van de regeling.


