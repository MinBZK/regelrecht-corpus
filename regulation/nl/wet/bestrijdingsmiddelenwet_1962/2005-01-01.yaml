  - number: '13'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften onderscheidenlijk nadere voorschriften
      worden gegeven betreffende het afleveren, het voorhanden of in voorraad hebben, het vervoeren na aflevering
      aan de kleinhandel anders dan in een vervoeronderneming, het vervoeren door de gebruiker, en het gebruiken
      van bestrijdingsmiddelen, alsmede omtrent het verwijderen en vernietigen van bestrijdingsmiddelen, resten
      van bestrijdingsmiddelen en ledige verpakkingen. Voorzover de in de vorige volzin bedoelde voorschriften het
      verwijderen van de daarbedoelde zelfstandigheden betreffen kunnen zij mede betrekking hebben op de afgifte van die
      zelfstandigheden aan, het vervoer naar en de in ontvangstneming door personen, behorende tot een daarbij aangewezen
      categorie.

      2 Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen regels worden gesteld
      betreffende het gebruik van bestrijdingsmiddelen in verband met de veiligheid en de gezondheid bij de arbeid. Deze
      regels kunnen in ieder geval betrekking hebben op:

      a. de verdamping of verspreiding van bestrijdingsmiddelen op de werkplek;

      b. de omgang met en de opslag van bestrijdingsmiddelen;

      c. de voorkoming van blootstelling aan bestrijdingsmiddelen;

      d. kleding, kledingbergplaatsen, kleedruimten, toiletten en wasgelegenheden;

      e. persoonlijke beschermingsmiddelen;

      f. het registreren, melden of bewaren van gegevens met betrekking tot bestrijdingsmiddelen, het melden van
      ongevallen met bestrijdingsmiddelen of het melden van beroepsziekten in verband met bestrijdingsmiddelen.

      3 Door Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen onder hem ressorterende ambtenaren
      zijn namens hem bevoegd voorschriften te geven betreffende de uitvoering van een of meer voorschriften als bedoeld
      in het eerste en tweede lid met betrekking tot het vervoer of het gebruik van bestrijdingsmiddelen in verband
      met de arbeid alsmede omtrent het voorhanden hebben van deze middelen en het opbergen van ledige verpakkingen of
      restanten van bestrijdingsmiddelen. Bij de bekendmaking van het voorschrift wordt de termijn gesteld, waarbinnen
      aan het voorschrift moet worden voldaan. Een bezwaarschrift, ingediend tegen het voorschrift, heeft schorsende
      werking.

      4 Een ieder is verplicht ten aanzien van bestrijdingsmiddelen, resten van bestrijdingsmiddelen en ledige
      verpakkingen:

      a. zodanige zorgvuldigheid in acht te nemen dat geen gevaar ontstaat voor de mens dan wel voor dieren of planten
      welker instandhouding gewenst is of voor grond of water, en

      b. overigens zodanige zorgvuldigheid in acht te nemen als redelijkerwijs van hem kan worden verlangd om te
      voorkomen dat schade wordt toegebracht aan planten of delen van planten, welke aan anderen toebehoren.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel13
  - number: 13a
    text: |-
      Onze betrokken Minister kan regels stellen omtrent het voeren van een administratie en het verstrekken van
      gegevens door toelatinghouders of registratiehouders en, voor zover zij geen toelatinghouder of registratiehouder
      zijn, door fabrikanten, importeurs, handelaren en gebruikers met betrekking tot de door hen in voorraad
      gehouden, ontvangen, afgeleverde en gebruikte hoeveelheden van aangewezen bestrijdingsmiddelen of groepen
      van bestrijdingsmiddelen. De regels hebben geen betrekking op onderwerpen die uit hoofde van het bepaalde in
      [artikel 13, tweede lid, aanhef en onderdeel f][ref1], gesteld kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel13
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '13'
        paragraaf: '3'
  - number: 13b
    text: |-
      1 Bij algemene maatregel van bestuur kunnen degenen die bestrijdingsmiddelen afleveren waarvan de toelating of
      registratie niet te hunnen name is gesteld worden verplicht zich te doen inschrijven in een register.

      2 Bij of krachtens een algemene maatregel, bedoeld in het vorige lid, wordt bepaald waar de inschrijving geschiedt,
      en kunnen voorschriften worden gegeven omtrent de inrichting van het register, de wijze van aanmelding ter
      inschrijving, de wijze waarop van de inschrijving kan blijken, de duur van de inschrijving en het vervallen van
      de inschrijving.

      3 In geval van toepassing van het eerste lid is het verboden bestrijdingsmiddelen af te leveren aan anderen dan
      degenen die in het register zijn ingeschreven.

      4 Het verbod, gesteld in het vorige lid, geldt niet voor het afleveren van bestrijdingsmiddelen aan gebruikers.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel13b
  - number: 13c
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat arbeid met bestrijdingsmiddelen of categorieën van
      bestrijdingsmiddelen, dan wel arbeid met bestrijdingsmiddelen onder bepaalde omstandigheden, slechts mag worden
      verricht nadat degenen die de arbeid verrichten gezondheidskundig zijn onderzocht. Daarbij kan voorts worden
      bepaald dat dit gezondheidskundig onderzoek na de aanvang van de werkzaamheden met een bestrijdingsmiddel periodiek
      moet worden herhaald.

      2 Met betrekking tot het in het eerste lid bedoelde onderzoek kunnen door een daartoe door Onze Minister van
      Sociale Zaken en Werkgelegenheid aangewezen onder hem ressorterende ambtenaar eisen worden gesteld met betrekking
      tot:

      a. de wijze waarop en de termijn waarbinnen het onderzoek moet worden verricht;

      b. de persoon of personen door wie of onder wier leiding het onderzoek moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel13c
  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de veiligheid en de gezondheid van de
      mens en van dieren, welker instandhouding gewenst is, voorschriften worden gegeven betreffende het aanbrengen van
      waarschuwingstekens in verband met het gebruik van bestrijdingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel14
  - number: '15'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven betreffende het afleveren,
      voorhanden of in voorraad hebben en gebruiken van bestrijdingsmiddelen welke als zodanig dan wel voor wat betreft
      een uitbreiding van de toepassingsmogelijkheden kennelijk in een proefstadium verkeren. Daarbij kan worden
      afgeweken van de bepalingen van deze wet.

      2 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven betreffende het afleveren,
      voorhanden of in voorraad hebben en gebruiken van niet-toegelaten of niet-geregistreerde bestrijdingsmiddelen voor
      onderzoeksdoeleinden.

      3 Bij of krachtens algemene maatregel van bestuur kunnen met het oog op behandelingen, uitgevoerd met de in het
      eerste en tweede lid bedoelde middelen, voorschriften worden gegeven als bedoeld in [artikel 5][ref1]. Ten aanzien
      van zodanige voorschriften is [artikel 5][ref2], van overeenkomstige toepassing.

      4 Voor zover krachtens het eerste en tweede lid proefnemingen als daar bedoeld slechts na daartoe gedane aanvraag
      kunnen worden toegestaan, kunnen de kosten voortvloeiende uit deze aanvraag geheel of gedeeltelijk ten laste van de
      aanvrager worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 5a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 5a
        paragraaf: '2'
  - number: '16'
    text: |-
      1 Indien op of in eet- of drinkwaren een hoeveelheid van een of meer bestrijdingsmiddelen, bestanddelen daarvan
      of omzettingsprodukten van deze aanwezig is, welke groter is dan bij of krachtens algemene maatregel van bestuur
      is bepaald, worden zij voor de toepassing van artikel 14, eerste lid, van [verordening (EG) nr. 178/2002]
      (32002R0178) van het Europees Parlement en de Raad van 28 januari 2002 tot vaststelling van de algemene beginselen
      en voorschriften van de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid
      en tot vaststelling van procedures voor voedselveiligheidsaangelegenheden (PbEG L 31) aangemerkt als onveilige
      levensmiddelen.

      2 In de krachtens het eerste lid bepaalde hoeveelheid wordt geacht te zijn begrepen een uit anderen hoofde
      aanwezige hoeveelheid van dezelfde stof.

      3 De krachtens het eerste lid te bepalen hoeveelheid kan worden uitgedrukt in termen van een kenmerkend element,
      een kenmerkende moleculaire groep of een reactieprodukt van de betreffende stof.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel16
  - number: 16a
    text: |-
      1 Onze betrokken Minister kan in bijzondere omstandigheden van het bepaalde in de [artikelen 2, eerste lid][ref1],
      en [10, eerste en tweede lid][ref2] voor ten hoogste 120 dagen, vrijstelling of ontheffing verlenen:

      a. voor zover het gewasbeschermingsmiddelen betreft, indien de plantaardige produktie door onvoorziene, op geen
      enkele andere wijze te bestrijden gevaren wordt bedreigd;

      b. voor zover het biociden betreft, voor zover noodzakelijk wegens een onvoorzien, niet op andere wijze te
      bestrijden gevaar.

      2 De in het eerste lid bedoelde vrijstelling of ontheffing wordt in ieder geval verleend ter uitvoering van een
      communautaire maatregel met in achtneming van het daarin gestelde.

      3 Aan een vrijstelling of ontheffing kunnen voorschriften worden verbonden. Zij kunnen onder beperkingen worden
      verleend en te allen tijde worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel10
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '10'
        paragraaf: '3'
  - number: 16aa
    text: |-
      1 Onze betrokken Minister kan, wanneer de belangen van de landbouw zulks dringend vereisen, vrijstelling of
      ontheffing verlenen van het bepaalde in de [artikelen 2, eerste lid][ref1], en [10, eerste en tweede lid][ref2],
      ten aanzien van een gewasbeschermingsmiddel dat een werkzame stof bevat:

      a. die reeds vóór 26 juli 1993 werd afgeleverd;

      b. die niet bij een in [artikel 3, tweede lid, onderdeel a][ref3], bedoelde communautaire maatregel is aangewezen,
      en

      c. ten aanzien waarvan het onderzoek, bedoeld in artikel 8, tweede lid, van [Richtlijn nr. 91/414/EEG]
      (31991L0414) van de Raad van de Europese Gemeenschappen van 15 juli 1991, betreffende het op de markt brengen van
      gewasbeschermingsmiddelen (PbEG L 230), na 26 juli 2003 wordt aangevangen of voortgezet.

      2 Aan een vrijstelling of ontheffing kunnen voorschriften worden verbonden. Zij kunnen onder beperkingen worden
      verleend en te allen tijde worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3
