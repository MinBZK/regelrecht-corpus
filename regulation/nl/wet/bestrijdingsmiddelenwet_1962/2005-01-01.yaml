preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen vast te stellen met betrekking tot de
    handel in en het gebruik van bestrijdingsmiddelen, zowel uit een oogpunt van deugdelijkheid voor het doel, waarvoor
    zij bestemd zijn, als uit een oogpunt van veiligheid en gezondheid van de mens en van dieren, welker instandhouding
    gewenst is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. planten: levende planten en levende delen van planten met inbegrip van vers fruit en zaden;

      b. plantaardige produkten: van planten afkomstige produkten die geen of slechts een eenvoudige bewerking hebben
      ondergaan, zoals malen, drogen of persen, voor zover het geen planten zijn;

      c. organismen: organismen van het dieren- of plantenrijk en virussen, bacteriën, mycoplasma's of andere pathogenen
      die schade kunnen veroorzaken of waarvan uit anderen hoofde bestrijding of afwering wenselijk is;

      d. stof: chemisch element of verbinding daarvan, zoals dat of zoals deze in de natuur voorkomt of industrieel wordt
      vervaardigd, met inbegrip van verontreinigingen die onvermijdelijk bij het fabricageproces ontstaan;

      e. werkzame stof: stof of micro-organisme, met inbegrip van een virus of fungus met een algemene of algemeen
      verkrijgbare werking als bedoeld in de onderdelen *g* of *h*, op of tegen schadelijke organismen;

      f. bestrijdingsmiddel: gewasbeschermingsmiddel of biocide;

      g. gewasbeschermingsmiddel: werkzame stof of een preparaat dat één of meer werkzame stoffen bevat, bestemd om te
      worden gebruikt om:

      1°. planten of plantaardige produkten te beschermen tegen organismen of de werking daarvan te voorkomen;

      2°. levensprocessen van planten te beïnvloeden, voor zover niet zijnde meststoffen in de zin van de
      [Meststoffenwet 1947][ref1] (*Stb.* H. 123) of van de [Meststoffenwet][ref2] (*Stb.* 1986, 598);

      3°. plantaardige produkten te bewaren;

      4°. ongewenste planten te doden of

      5°. delen van planten te vernietigen of een ongewenste groei van planten te remmen of te voorkomen;

      h. biocide: werkzame stof of preparaat, welke in de vorm waarin die stof of dat preparaat aan de gebruiker wordt
      geleverd, een of meer werkzame stoffen bevat, en bestemd is om een schadelijk organisme te vernietigen, af te
      weren, onschadelijk te maken, de effecten daarvan te voorkomen af dat organisme op andere wijze langs chemische of
      biologische weg te bestrijden, niet zijnde een gewasbeschermingsmiddel, en welke is opgenomen in de lijst, bedoeld
      in het vijfde lid;

      i. biocide met gering risico: biocide dat als werkzame stof uitsluitend een of meer, bij communautaire maatregel
      aangewezen, geen aanleiding tot bezorgdheid gevende stoffen bevat;

      j. basisstof: bij communautaire maatregel opgenomen stof die hoofdzakelijk voor andere dan bestrijdingsdoeleinden
      wordt gebruikt, doch in ondergeschikte mate als biocide wordt toegepast, hetzij rechtstreeks, hetzij in een product
      dat bestaat uit die stof en een eenvoudig oplosmiddel, dat zelf geen tot bezorgdheid aanleiding gevende stof is, en
      die niet rechtstreeks voor gebruik als biocide op de markt wordt gebracht;

      k. tot bezorgdheid aanleiding gevende stof: iedere stof, met uitzondering van de werkzame stof, die als intrinsieke
      eigenschap heeft dat zij een schadelijk effect heeft op mensen, dieren of het milieu en die in een biocide in
      voldoende concentratie aanwezig is of ontstaat om een dergelijk effect te veroorzaken;

      l. afleveren: verkopen, te koop of in ruil aanbieden, ter beschikking stellen, schenken alsmede uitdelen;

      m. milieu: water, bodem, lucht en wilde soorten van dieren en planten alsmede hun onderlinge relatie en hun relatie
      met levende organismen;

      n. geïntegreerde bestrijding: rationele toepassing van een combinatie van biologische, biotechnologische,
      chemische, mechanische en fysische bestrijding, teelt- of gewasverbeteringsmaatregelen, waarbij het gebruik van
      chemische gewasbeschermingsmiddelen wordt beperkt tot het strikte minimum dat noodzakelijk is om populaties van
      organismen onder de niveaus te houden waarbij in economisch opzicht onaanvaardbare schade of verliezen optreden;

      o. verpakking: omhulsel waarin een bestrijdingsmiddel aan of ten behoeve van een gebruiker wordt afgeleverd, of dat
      daartoe is bestemd;

      p. residu: een of meer van de in een bestrijdingsmiddel aanwezige stoffen, die als gevolg van het gebruik ervan
      achterblijven, met inbegrip van de metabolieten van die stof dan wel stoffen en de producten die bij afbraak of
      reactie vrijkomen;

      q. communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in [artikel 189 van het Verdrag tot
      oprichting van de Europese Economische Gemeenschap (Trb. 1957, 91)](onbekend) betrekking hebbende op onderwerpen
      geregeld in, dan wel hun grondslag hebbende in:

        - richtlijn nr. 91 /414/EEG van de Raad van 15 juli 1991 betreffende het op de markt brengen van
      gewasbeschermingsmiddelen (Pb EG L 236);
        - [richtlijn 98/8/EG](31998L0008) van het Europees Parlement en de Raad van 16 februari 1998 betreffende het op de
      markt brengen van biociden (Pb EG L123);

      o. bedrijfslichaam: een bedrijfslichaam als bedoeld in [artikel 66 van de Wet op de bedrijfsorganisatie][ref3].

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      "Onze betrokken Minister":

      a. voor wat betreft gewasbeschermingsmiddelen, met uitzondering van gewasbeschermingsmiddelen bestemd voor
      plantaardige produkten die slechts een eenvoudige bewerking hebben ondergaan: Onze Minister van Landbouw,
      Natuurbeheer en Visserij in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en
      Werkgelegenheid;

      b. voor wat betreft biociden alsmede gewasbeschermingsmiddelen bestemd voor plantaardige produkten voor zover deze
      een eenvoudige bewerking hebben ondergaan: Onze Minister van Welzijn, Volksgezondheid en Cultuur in overeenstemming
      met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid;

      "Onze Ministers": Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van Welzijn, Volksgezondheid
      en Cultuur, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale
      Zaken en Werkgelegenheid.

      3 Onze betrokken Minister kan bij regeling deze wet ten aanzien van bepaalde bestrijdingsmiddelen of groepen van
      bestrijdingsmiddelen buiten toepassing verklaren.

      4 Voor de toepassing van het bepaalde bij of krachtens deze wet kunnen bij algemene maatregel van bestuur:

      a. andere zelfstandigheden worden gelijkgesteld met de in het eerste lid bedoelde stoffen of werkzame stoffen;

      b. andere bestemmingen worden gelijkgesteld met één of meer in de maatregel aan te wijzen bestemmingen, genoemd in
      het eerste lid, onderdelen *g* en *h*.

      5 Bij ministeriele regeling wordt een lijst van soorten biociden vastgesteld met voor elke soort een indicatieve
      lijst van beschrijvingen.

      6 Onze betrokken Minister doet mededeling in de *Staatscourant* van de vaststelling of wijziging van een
      communautaire maatregel voor zover daaraan uitvoering moet worden gegeven, onder vermelding van de artikelen van
      deze wet waarop de betreffende communautaire maatregel betrekking heeft. Een communautaire maatregel of wijziging
      daarvan treedt voor de toepassing van deze wet in werking met ingang van de dag waarop daaraan uiterlijk uitvoering
      moet zijn gegeven, tenzij Onze betrokken Minister hiervoor een ander tijdstip heeft vastgesteld.


