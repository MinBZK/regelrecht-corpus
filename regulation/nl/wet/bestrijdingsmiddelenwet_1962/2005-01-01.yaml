  - number: '10'
    text: |-
      1 Het is verboden te handelen in strijd met de krachtens de
      [artikelen 5, tweede, derde, vierde, zesde, zevende en achtste lid][ref1], [5][ref2], en
      [9, tweede en derde lid][ref3], vastgestelde voorschriften.

      2 Het is een ieder verboden van een bij regeling van Onze betrokken Minister aangewezen bestrijdingsmiddel een
      hoeveelheid voorhanden of in voorraad te hebben, tenzij die hoeveelheid bestemd is voor een gebruik waarvoor het
      middel is toegelaten, geregistreerd of ter aflevering.

      3 Het verbod van het eerste lid geldt niet voor een particuliere persoon, voor zover het betreft het gebruiken van
      een bestrijdingsmiddel in een door hem bewoonde ruimte.


