  - number: '2'
    text: |-
      1 Het is verboden een bestrijdingsmiddel af te leveren, voorhanden of in voorraad te hebben, binnen Nederland te
      brengen of te gebruiken, waarvan niet blijkt dat het ingevolge deze wet is toegelaten of voor zover het een biocide
      met een gering risico betreft, is geregistreerd.

      2 Voor de toepassing van het eerste lid gelden als toegelaten of geregistreerd: bestrijdingsmiddelen, op de
      verpakking waarvan de naam van een toegelaten of geregistreerd middel en het nummer van de toelating of de
      registratie zijn vermeld.

      3 Het verbod van het eerste lid geldt niet voor het afleveren of voorhanden of in voorraad hebben elders dan in
      winkels, op markten of op enige andere voor het publiek toegankelijke verkoopplaats van bestrijdingsmiddelen, welke
      kennelijk bestemd zijn voor uitvoer of doorvoer, mits wordt voldaan aan bij of krachtens algemene maatregel van
      bestuur gestelde regelen.

      4 Het verbod van het eerste lid geldt niet voor:

      a. het voorhanden of in voorraad hebben door een particuliere persoon, voor zover het betreft een biocide dat
      kennelijk bestemd is om door die persoon in een door hem bewoonde ruimte te worden gebruikt;

      b. het gebruiken van een biocide door een particuliere persoon in een door hem bewoonde ruimte.

      5 Het college maakt in de Staatscourant bekend dat een bestrijdingsmiddel, dat ten gevolge van de toepassing
      van [artikel 7, eerste of tweede lid][ref1], niet meer is toegelaten of geregistreerd, gedurende een bij die
      bekendmaking bepaalde termijn in afwijking van het in het eerste lid bedoelde verbod nog mag worden afgeleverd,
      gebruikt dan wel in voorraad of voorhanden gehouden. Daarbij kan het voorschriften met betrekking tot het gebruik
      geven als bedoeld in [artikel 5, tweede lid][ref2]. De termijn, bedoeld in de eerste volzin, staat in verhouding
      tot de reden waarom het bestrijdingsmiddel niet meer is toegelaten of geregistreerd.

      6 Bij regeling van Onze betrokken Minister kunnen regels worden gesteld met betrekking tot de aflevering of het
      in voorraad of voorhanden hebben van de in het vijfde lid bedoelde bestrijdingsmiddelen. Daarbij kunnen tevens
      regelen worden gesteld omtrent de verwijdering binnen een daarbij te bepalen tijdvak van een niet meer toegelaten
      of geregistreerd bestrijdingsmiddel.

      7 In afwijking van het bepaalde in het eerste lid kan Onze betrokken Minister, indien er bij het college gegronde
      aanwijzingen bestaan om te oordelen dat een ingevolge een communautaire maatregel toe te laten of te registreren
      middel gevaar oplevert voor de gezondheid van mens of dier of voor het milieu, tijdelijk bepalen dat de aflevering
      en het gebruik van dat middel verboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5
