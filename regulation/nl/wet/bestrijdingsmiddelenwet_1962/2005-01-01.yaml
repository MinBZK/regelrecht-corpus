  - number: 9a
    text: |-
      1 De toelatinghouder of registratiehouder alsmede de instanties, lichamen, organisaties of instellingen waarvan
      het verzoek als bedoeld in [artikel 5, zesde lid][ref1], is toegewezen, zijn verplicht terstond mededeling aan het
      college te doen van alle nieuwe gegevens die zij verkrijgen met betrekking tot de mogelijke gevaarlijke gevolgen
      van een bestrijdingsmiddel of van de residuen van een werkzame stof voor de gezondheid van mens of dier of voor
      het milieu.

      2 De toelatinghouder of registratiehouder alsmede de in het eerste lid bedoelde instanties, lichamen, organisaties
      of instellingen zijn onverminderd het eerste lid tevens verplicht de gegevens, bedoeld in het eerste lid terstond
      te melden aan de bevoegde instanties van de andere Lid-Staten van de Europese Gemeenschappen alsmede aan de
      Commissie van de Europese Gemeenschappen.

      3 Onze betrokken Minister kan regelen stellen omtrent de wijze waarop en de instanties waaraan een mededeling als
      bedoeld in het eerste of tweede lid dient te geschieden.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat andere dan de in het eerste lid bedoelde gegevens
      dienen te worden medegedeeld. Het derde lid is van overeenkomstige toepassing op deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
