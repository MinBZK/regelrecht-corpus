  - number: '5'
    text: |-
      1 De toelating of registratie van een bestrijdingsmiddel geldt voor een in het besluit tot toelating of
      registratie te bepalen termijn van ten hoogste tien jaren. De toelating of registratie kan één of meerdere malen
      met ten hoogste tien jaren worden verlengd indien is gebleken dat nog steeds aan de voorwaarden voor toelating
      of registratie is voldaan. Zonodig kan de toelating of registratie worden verlengd voor de periode die met de
      beoordeling van de aanvraag tot verlenging gemoeid is.

      2 Bij de toelating of de registratie:

      a. worden voorschriften gegeven omtrent:

      1. de doeleinden waarvoor het middel uitsluitend dan wel niet gebruikt mag worden;

      2. voor zover het een biocide betreft, een rationele toepassing van een combinatie van fysische, biologische,
      chemische of eventueel andere maatregelen, waardoor het gebruik van biociden tot het strikt noodzakelijke wordt
      beperkt, en

      3. voor zover het de toelating van een gewasbeschermingsmiddel betreft, waar mogelijk, de toepassing van de
      beginselen van geïntegreerde bestrijding;

      b. kunnen voorschriften worden gegeven welke onder meer betrekking hebben op:

      1. de tijden en de plaatsen waarop,

      2. de klimatologische omstandigheden waaronder,

      3. de doseringen waarin,

      4. de wijze waarop, of

      5. de technische hulpmiddelen waarmede het middel uitsluitend dan wel niet mag worden gebruikt, alsmede op de bij
      het gebruik in acht te nemen veiligheidstermijnen.

      3 Bij de toelating of registratie kunnen nadere voorschriften worden gegeven omtrent de samenstelling, kleur, vorm,
      afwerking, verpakking en aanduidingen en vermeldingen op, aan of bij de verpakking van het bestrijdingsmiddel.

      4 Bij de toelating:

      a. kan worden bepaald, dat het bestrijdingsmiddel uitsluitend mag worden afgeleverd aan en gebruikt door personen
      of rechtspersonen, behorende tot een daarbij aangewezen categorie;

      b. wordt bepaald dat het verboden is aan het grote publiek biociden af te leveren, welke ingevolge [richtlijn
      nr. 1999/45/EG](31999L0045) van het Europese Parlement en de Raad van 31 mei 1999 betreffende de onderlinge
      aanpassingen van de wettelijke en bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de verpakking
      en het kenmerken van gevaarlijke preparaten (Pb EG L 187) als vergiftig, zeer vergiftig, kankerverwekkend of
      mutageen categorie 1 of 2, of als vergiftig voor de voortplanting categorie 1 of 2 zijn ingedeeld.

      5 Het college kan, hetzij op een met redenen omkleed schriftelijk verzoek van de toelatinghouder of
      registratiehouder, hetzij in bij algemene maatregel van bestuur vast te stellen gevallen, de ingevolge dit
      artikel gestelde voorschriften wijzigen met ingang van een bij die wijziging aan te geven tijdstip. Alvorens
      tot wijziging van de voorschriften te besluiten, stelt het college de toelatinghouder of registratiehouder
      binnen een daarvoor aangegeven termijn in de gelegenheid zijn zienswijze omtrent de voorgenomen wijziging en
      het tijdstip van ingang daarvan kenbaar te maken en kan hij hem verzoeken aanvullende informatie te verschaffen.
      [Artikel 4, derde en vierde lid][ref1], is van overeenkomstige toepassing op de op verzoek of anders dan op verzoek
      te verstrekken gegevens. Indien is overgegaan tot het verrichten van dierproeven zonder dat daaraan voorafgaand
      de bedoelde inlichtingen zijn ingewonnen, worden de uit die dierproeven verkregen gegevens door het college bij de
      beslissing buiten beschouwing gelaten, tenzij zij leiden tot een inperking van de toelating.

      6 Het college kan, voor zover het gewasbeschermingsmiddelen betreft, op aanvraag van wetenschappelijke instanties,
      lichamen, organisaties en instellingen die werkzaamheden verrichten of mede verrichten op het gebied van de
      landbouw dan wel van organisaties van gebruikers van gewasbeschermingsmiddelen onder nader door Onze betrokken
      Minister gestelde regelen, de doeleinden waarvoor het middel gebruikt mag worden, bedoeld in het tweede lid,
      uitbreiden.

      7 Het college kan voorts op aanvraag van de toelating- of registratiehouder onder nader door Onze betrokken
      Minister te stellen regelen de doeleinden waarvoor een bestrijdingsmiddel gebruikt mag worden, bedoeld in het
      tweede lid, uitbreiden, voor zover het een gewasbeschermingsmiddel onderscheidenlijk biocide betreft dat een
      werkzame stof bevat die reeds vóór 26 juli 1993, onderscheidenlijk vóór 15 mei 2000 werd afgeleverd en niet bij
      een in [artikel 3, tweede lid, onderdeel a][ref2], bedoelde communautaire maatregel is aangewezen of ten aanzien
      waarvan geen communautaire maatregel geldt op grond waarvan de toelating of registratie niet verleend mag worden of
      dient te worden ingetrokken.

      8 Met uitzondering van het toelatingscriterium, bedoeld in [artikel 3, eerste lid, onderdeel a, ten derde][ref3],
      kan bij de regelen, bedoeld in het zesde en zevende lid, voor bij die regelen aangewezen bestrijdingsmiddelen
      onder meer worden bepaald dat voor de beoordeling van de uitbreiding van de doeleinden, waarvoor het middel mag
      worden gebruikt, één of meer eisen van toepassing zijn aan de hand waarvan het betrokken middel of een ander
      bestrijdingsmiddel dat dezelfde werkzame stof bevat en is toegelaten of geregistreerd voor een naar het oordeel
      van het college vergelijkbaar doeleinde, laatstelijk is beoordeeld, en dat die beoordeling, in afwijking van
      [artikel 3, eerste lid, onderdeel a, aanhef][ref4], plaatsvindt aan de hand van de stand van de wetenschappelijke
      en technische kennis op het tijdstip waarop het betrokken middel, dan wel een ander bestrijdingsmiddel, zoals
      hiervoor bedoeld, laatstelijk is beoordeeld. Het college kan, indien het belang van de volksgezondheid zich
      hier naar het oordeel van het college niet tegen verzet, op een daartoe gemotiveerd verzoek van de aanvrager,
      bepalen dat de beoordeling van de uitbreiding van de doeleinden van een bestrijdingsmiddel aan de hand van
      het toelatingscriterium, bedoeld in [artikel 3, eerste lid, onderdeel a, ten derde][ref5], voor zover dat
      toelatingscriterium betrekking heeft op de beoordeling van de uitwerking van residuen van bestrijdingsmiddelen op
      de gezondheid van de mens, in afwijking van [artikel 3, eerste lid, onderdeel a, aanhef][ref6], plaatsvindt aan
      de hand van de stand van de wetenschappelijke en technische kennis op het tijdstip waarop het betrokken middel
      laatstelijk is beoordeeld.

      9 Het bepaalde in [artikel 4, tweede tot en met zesde, achtste en negende lid][ref7], is van overeenkomstige
      toepassing op een aanvraag als bedoeld in het zesde, onderscheidenlijk zevende lid. In het geval het college
      overweegt een wijziging aan te brengen in de uitbreiding, bedoeld in het zesde, onderscheidenlijk zevende lid,
      is het bepaalde in het vijfde lid, met uitzondering van de eerste volzin, van overeenkomstige toepassing met
      dien verstande dat, indien het een uitbreiding betreft als bedoeld in het zesde lid, ook de toelatinghouder of
      registratiehouder bij die procedure wordt betrokken.


