  - number: '3'
    text: |-
      1 Een bestrijdingsmiddel wordt slechts toegelaten of geregistreerd indien:

      a. op grond van de stand van de wetenschappelijke en technische kennis en aan de hand van onderzoek van de
      gegevens, bedoeld in [artikel 4, tweede lid][ref1], met inachtneming van de bij of krachtens [artikel 3][ref2]
      vastgestelde regels en beginselen voor de beoordeling, is vastgesteld dat het bestrijdingsmiddel en zijn
      omzettingsprodukten, wanneer het overeenkomstig het bepaalde bij of krachtens deze wet wordt gebruikt:

      1. voldoende werkzaam is;

      2. geen onaanvaardbare uitwerking heeft op planten of plantaardige produkten;

      3. geen schadelijke uitwerking heeft op de gezondheid van de mens, hetzij direct, hetzij indirect;

      4. geen schadelijke uitwerking heeft op de gezondheid van dieren, hetzij direct, hetzij indirect;

      5. de gezondheid niet schaadt of de veiligheid niet in gevaar brengt van degene die het middel toepast;

      6. de gezondheid niet schaadt of de veiligheid niet in gevaar brengt van diegenen, die na toepassing van het middel
      door het verrichten van werkzaamheden daarmee of met de residuen daarvan in aanraking komen;

      7. de hoedanigheid van voedingsmiddelen niet schaadt;

      8. het welzijn van de te bestrijden gewervelde dieren niet onnodig schaadt;

      9. geen schadelijke uitwerking heeft op het grondwater;

      10. geen voor het milieu onaanvaardbaar effect heeft, waarbij in het bijzonder rekening wordt gehouden met:

        - de plaats waar het bestrijdingsmiddel in het milieu terecht komt en wordt verspreid, met name voor wat betreft
      besmetting van het water, met inbegrip van drink- en grondwater en belasting van de bodem;
        - de gevolgen voor niet-doelsoorten;

      b. de aard en de hoeveelheid van de werkzame stoffen en zo nodig de in toxicologisch en ecotoxicologisch opzicht
      belangrijke onzuiverheden en hulpstoffen en omzettingsprodukten kunnen worden bepaald overeenkomstig de bij een
      communautaire maatregel vastgestelde methoden, of, voor zover deze methoden niet zijn vastgesteld, door Onze
      betrokken Minister zijn vastgesteld of worden goedgekeurd;

      c. de residuen die het gevolg zijn van het gebruik van het bestrijdingsmiddel overeenkomstig het bepaalde bij of
      krachtens deze wet en die uit toxicologisch of milieu-oogpunt van belang zijn, kunnen worden bepaald door middel
      van methoden die voldoen aan door Onze betrokken Minister gestelde regelen;

      d. de fysisch-chemische eigenschappen van het bestrijdingsmiddel worden vastgesteld en voor het gebruik van het
      bestrijdingsmiddel overeenkomstig het bepaalde bij of krachtens deze wet aanvaardbaar zijn.

      2 Een bestrijdingsmiddel wordt voorts slechts toegelaten of geregistreerd indien:

      a. voor zover het een bestrijdingsmiddel betreft, de werkzame stof of werkzame stoffen zijn aangewezen
      bij een communautaire maatregel die de werkzame stoffen vermeldt die mogen worden gebruikt als basis voor
      bestrijdingsmiddelen en aan de daarbij gestelde voorwaarden wordt voldaan;

      b. het gehalte aan werkzame stof of werkzame stoffen en de verdere samenstelling, de kleur, vorm, afwerking,
      verpakking en aanduidingen en vermeldingen op, aan of bij de verpakking voldoen aan door Onze betrokken Minister
      gestelde regelen;

      c. voor zover het betreft een biocide, voldaan is aan de ingevolge een communautaire maatregel gestelde eisen.

      3 Een biocide wordt voorts slechts toegelaten of geregistreerd indien op adequate wijze rekening wordt gehouden
      met:

      a. alle omstandigheden waaronder het biocide normaliter gebruikt wordt,

      b. de wijze waarop het met het biocide behandelde materiaal kan worden gebruikt en

      c. de gevolgen van gebruik en verwijdering van het biocide.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
