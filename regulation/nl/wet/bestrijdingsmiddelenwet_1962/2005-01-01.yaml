  - number: '25'
    text: |-
      1 [Artikel 3, tweede lid, onderdeel ][ref1], is tot 26 juli 2003 evenmin van toepassing op
      gewasbeschermingsmiddelen die uitsluitend werkzame stoffen bevatten die niet bij de in dat artikelonderdeel
      bedoelde communautaire maatregel zijn aangewezen en reeds vóór 26 juli 1993 werden afgeleverd.

      2 Onverminderd het bepaalde in de [artikelen 5][ref2] en [7][ref3] trekt het college ter uitvoering van
      een communautaire maatregel met betrekking tot een bestrijdingsmiddel als bedoeld in het eerste lid een
      toelating, waarbij toepassing is gegeven aan het eerste lid, in, of wijzigt het de voorschriften als bedoeld in
      [artikel 5, tweede lid][ref4]. [Artikel 7, derde en vierde lid][ref5], zijn op de intrekking van de toelating en
      [artikel 5, vijfde lid, laatste zin][ref6], is op de wijziging van de voorschriften van toepassing.


