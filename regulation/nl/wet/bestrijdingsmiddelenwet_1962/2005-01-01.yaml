  - number: 25b
    text: |-
      1 [Artikel 3, tweede lid, onderdeel a][ref1], is tot en met 13 mei 2010 evenmin van toepassing op biociden die
      uitsluitend werkzame stoffen bevatten die niet bij de in dat artikelonderdeel bedoelde communautaire maatregel zijn
      aangewezen en reeds voor 13 mei 2000 werden afgeleverd.

      2 Onverminderd [artikel 5][ref2] wijzigt het college ter uitvoering van een communautaire maatregel
      met betrekking tot een bestrijdingsmiddel als bedoeld in het eerste lid, de voorschriften, bedoeld in
      [artikel 5, tweede lid][ref3] waarbij toepassing is gegeven aan het eerste lid. [Artikel 5, vijfde lid][ref4], is
      van toepassing op de wijziging van de voorschriften.

      3 Onverminderd het bepaalde in [artikel 7][ref5] trekt het college ter uitvoering van een communautaire maatregel
      met betrekking tot een bestrijdingsmiddel als bedoeld in het eerste lid, een toelating of registratie in,
      waarbij toepassing is gegeven aan het eerste lid. [Artikel 7, derde en vierde lid][ref6], is van toepassing op de
      intrekking van de toelating of registratie.


