  - number: 1a
    text: |-
      1 Er is een College voor de toelating van bestrijdingsmiddelen, voor de toepassing van het bepaalde bij of
      krachtens deze wet verder te noemen het college. Het college bezit rechtspersoonlijkheid.

      2 Voor de toepassing van deze paragraaf wordt onder «Onze Minister» verstaan: Onze Minister van Landbouw,
      Natuurbeheer en Visserij in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1a
  - number: 1b
    text: |-
      1 Het college is belast met:

      a. de uitvoering van de bij of krachtens deze wet aan hem opgedragen taken en

      b. andere, bij algemene maatregel van bestuur opgedragen taken, die verband houden met de onder a bedoelde taken.

      2 Het college draagt zorg voor de systematische bewaking van de kwaliteit van de taakverrichting.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1b
  - number: 1c
    text: |-
      1 Het college bestaat uit vijf leden, de voorzitter daaronder begrepen, en ten hoogste vier plaatsvervangende
      leden, die op voordracht van Onze Minister bij koninklijk besluit worden benoemd en ontslagen. De benoeming vindt
      plaats op grond van deskundigheid op het gebied van de taken waarmee het college is belast. Geen benoeming vindt
      plaats van aan Onze Ministers ondergeschikte personen.

      2 De leden wijzen uit hun midden een plaatsvervangend voorzitter aan.

      3 De leden, de plaatsvervangers en de voorzitter worden voor de duur van vier jaren benoemd. Zij zijn ten hoogste
      twee keer herbenoembaar.

      4 De leden hebben op persoonlijke titel zitting in het college en oefenen hun functie uit zonder last of
      ruggespraak.

      5 De leden en de plaatsvervangend leden kunnen om zwaarwichtige redenen door Onze Minister worden geschorst of
      tussentijds worden ontslagen. Ontslag kan op eigen verzoek worden verleend.

      6 Zolang in een vacature niet is voorzien, vormen de overblijvende leden het college, met de bevoegdheid van het
      volledig college.

      7 Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden.

      8 Het college regelt bij reglement zijn werkwijze. Het reglement behoeft de instemming van Onze Minister.

      9 Onze Minister kent de leden van het college een vergoeding toe voor hun werkzaamheden. Deze vergoeding komt ten
      laste van het college.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1c
  - number: 1d
    text: |-
      1 Het college heeft een secretaris en een secretariaat. Het secretariaat is belast met de ondersteuning van het
      college.

      2 De secretaris wordt op voordracht van het college benoemd door Onze Minister van Landbouw, Natuurbeheer en
      Visserij. Hij kan worden geschorst of ontslagen door Onze Minister van Landbouw, Natuurbeheer en Visserij.

      3 De secretaris van het college is tevens directeur van het secretariaat. Hij is belast met de dagelijkse leiding
      daarvan.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel1d
  - number: 1e
    text: |-
      1 Het college kan bij het reglement, bedoeld in [artikel 1c, achtste lid][ref1], zijn vertegenwoordiging in
      en buiten rechte opdragen aan een of meer leden van het college of aan de secretaris. Het kan bepalen dat deze
      vertegenwoordiging uitsluitend betrekking heeft op bepaalde aangelegenheden.

      2 Het college kan bij het reglement als bedoeld in [artikel 1c, achtste lid][ref2], de uitoefening van daarbij aan
      te wijzen taken en bevoegdheden opdragen aan een of meer leden of aan de secretaris.

      3 De opgedragen bevoegdheid wordt uit naam en onder verantwoordelijkheid van het college uitgeoefend. Het college
      kan te dien aanzien alle aanwijzingen geven die het nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1c
