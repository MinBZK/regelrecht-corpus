  - number: 11a
    text: |-
      1 Het aanbevelen of aanprijzen van een niet ingevolge deze wet toegelaten of geregistreerd bestrijdingsmiddel of
      van enig gebruik van een bestrijdingsmiddel in strijd met het bij of krachtens deze wet bepaalde, is verboden.

      2 Onze betrokken Minister stelt ter uitvoering van [richtlijn nr. 98/8/EG](31998L0008) van het Europees Parlement
      en de Raad van 16 februari 1998 betreffende het op de markt brengen van biociden (Pb EG L 123), nadere regels
      betreffende het aanbevelen en aanprijzen van biociden.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel11a
  - number: '12'
    text: |-
      1 Het is verboden aan personen beneden de leeftijd van zestien jaren bestrijdingsmiddelen af te leveren, voor welke
      krachtens [artikel 3, tweede lid, onderdeel ][ref1], [artikel 5, derde lid][ref2], of [artikel 9, derde lid][ref3],
      is voorgeschreven, dat de giftigheid moet worden aangeduid door middel van een doodshoofd.

      2 Het is verboden de in het vorige lid bedoelde bestrijdingsmiddelen af te leveren aan personen, die niet in
      het bezit zijn van een daartoe door Onze betrokken Minister aangewezen legitimatiebewijs, tenzij degene aan
      wie wordt afgeleverd aantoont, dat hij de handel in bestrijdingsmiddelen uitoefent. Aangewezen zullen worden
      legitimatiebewijzen, waaruit blijkt, dat de houder een beroep uitoefent, hetwelk het gebruik van in dit artikel
      bedoelde bestrijdingsmiddelen meebrengt.

      3 Het is aan anderen dan de houder der in het tweede lid bedoelde legitimatiebewijzen verboden de in het eerste lid
      bedoelde bestrijdingsmiddelen te gebruiken.

      4 Het in het tweede en derde lid bepaalde geldt niet ten aanzien van door Onze betrokken Minister bij in de
      *Staatscourant* bekend te maken regeling aangewezen middelen ter bestrijding van schadelijke knaagdieren, waarvan
      uit een bij die regeling vastgestelde aanduiding op de verpakking blijkt, dat deze voor gebruik door particuliere
      personen zijn bestemd.


