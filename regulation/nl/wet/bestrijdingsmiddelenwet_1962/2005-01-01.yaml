  - number: 16b
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan ter uitvoering van [artikel 13][ref1] de medewerking worden
      gevorderd van het bestuur van een bedrijfslichaam.

      2 Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regels
      bij verordening, behoeft deze verordening de goedkeuring van Onze Minister en van Onze Ministers wie het mede
      aangaat, tezamen. Krachtens de verordening genomen besluiten behoeven, voorzover dit bij of krachtens de maatregel,
      bedoeld in het eerste lid, is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel13
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '13'
        paragraaf: '3'
  - number: 16c
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet of onderdelen daarvan zijn belast de
      bij besluit van Onze betrokken Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel16c
  - number: 16d
    text: |-
      Een toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel16d
  - number: '17'
    text: |-
      1 De opsporingsambtenaar, die een monster van een bestrijdingsmiddel neemt, verpakt en verzegelt dit ter plaatse.

      2 Op verlangen van hem, in wiens bezit het bestrijdingsmiddel zich tijdens de monsterneming bevindt, neemt de
      opsporingsambtenaar een tweede monster, hetwelk hij verpakt en verzegeld in diens bezit laat.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel17
  - number: '18'
    text: |-
      1 De ambtenaar, die het monster heeft genomen, stelt dit in handen van de instelling, die voor onderzoek daarvan
      bij regeling van Onze betrokken Minister is aangewezen.

      2 Het monster wordt zo spoedig mogelijk door de aangewezen instelling onderzocht.

      3 Indien de directeur van de aangewezen instelling van mening is, dat de resultaten van het onderzoek aanleiding
      kunnen geven tot het uitlokken van een strafvervolging, doet hij hiervan mededeling aan de ambtenaar, die het
      monster heeft genomen. De uitkomsten van het onderzoek worden als bijlage bij het proces-verbaal gevoegd.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel18
  - number: '19'
    text: |-
      Bij regeling van Onze Ministers kunnen regelen worden gegeven betreffende de wijze van monsterneming, het verpakken
      en het verzegelen der monsters.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel19
  - number: '21'
    text: |-
      1 Bij gemeentelijke verordening worden geen bepalingen vastgesteld met betrekking tot de onderwerpen waarin deze
      wet voorziet.

      2 Bestaande bepalingen van gemeentelijke verordeningen met betrekking tot de onderwerpen waarin deze wet voorziet
      vervallen een jaar na het in werking treden van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel21
  - number: '22'
    text: |-
      1 De verplichting tot geheimhouding op grond van [artikel 2:5 van de Algemene wet bestuursrecht][ref1] geldt niet
      ten aanzien van die bestanddelen van een bestrijdingsmiddel, welke schadelijk zijn voor de mens, of voor dieren of
      planten, welker instandhouding gewenst is.

      2 Indien in een stuk dat ingevolge het bij of krachtens deze wet bepaalde aan Onze betrokken Minister,
      onderscheidenlijk het college, dan wel aan een andere persoon of instelling wordt overgelegd, gegevens voorkomen
      of uit zodanig stuk gegevens kunnen worden afgeleid, waarvan de geheimhouding met het oog op bedrijfsgeheimen
      gerechtvaardigd is, besluit Onze betrokken Minister, onderscheidenlijk het college, op een daartoe strekkend
      schriftelijk verzoek van degene die het stuk overlegt, dat die gegevens geheim worden gehouden. Een zodanig verzoek
      is met redenen omkleed.

      3 Onze betrokken Minister stelt regelen met betrekking tot de gegevens waarvoor de verplichting tot geheimhouding
      niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel25
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel22
    references:
