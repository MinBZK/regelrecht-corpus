  - number: '4'
    text: |-
      1 Over de toelating of registratie van een bestrijdingsmiddel wordt op aanvraag beslist door het college.

      2 Onze betrokken Minister stelt regelen omtrent het indienen van een aanvraag, de bij een aanvraag door de
      aanvrager over te leggen gegevens en zelfstandigheden, de aan de gegevens en zelfstandigheden ten grondslag
      liggende onderzoeksmethoden en omstandigheden en de wijze van behandeling daarvan. Daarbij kan onder meer worden
      bepaald:

      a. dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;

      b. in welke gevallen een aanvraag voor een toelating of registratie niet in behandeling wordt genomen.

      3 Bij de regeling, bedoeld in het tweede lid, wordt bepaald in welke gevallen en onder welke voorwaarden het
      overleggen van gevraagde gegevens achterwege kan blijven.

      4 Degene die het voornemen heeft een aanvraag in te dienen, dient, indien aan de over te leggen gegevens
      dierproeven ten grondslag liggen, alvorens tot dergelijke proeven wordt overgegaan, inlichtingen in te winnen bij
      het college omtrent:

      a. het reeds verleend zijn van een toelating of registratie voor het betrokken middel en omtrent de identiteit van
      degenen die daartoe de betrokken gegevens hebben overgelegd, en

      b. voor zover het een niet bij een communautaire maatregel als bedoeld in [artikel 3, tweede lid, onderdeel ][ref1],
      aangewezen werkzame stof van een middel betreft, het met betrekking tot die stof reeds overgelegd zijn van aan
      dierproeven ontleende gegevens en omtrent de identiteit van degenen die deze gegevens hebben overgelegd.

      De identiteit van de betrokken partijen wordt door het college over en weer aan hen bekendgemaakt nadat zij
      zekerheid heeft verkregen over het voornemen. Indien is overgegaan tot het verrichten van dierproeven zonder dat
      daaraan voorafgaand de in de eerste zin bedoelde inlichtingen zijn ingewonnen, wordt de aanvraag door het college
      niet in behandeling genomen.

      5 Bij ministeriële regeling worden regelen gesteld die onder meer betrekking kunnen hebben op:

      a. gegevens die het verzoek om inlichtingen als bedoeld in het vierde lid dienen te vergezellen;

      b. de te volgen procedure om tot verwijzing naar of uitwisseling van gegevens als bedoeld in het vierde lid te
      komen, en,

      c. de voorwaarden waaronder de gegevens als bedoeld in het vierde lid niet behoeven te worden overgelegd indien
      partijen niet tot overeenstemming komen omtrent de verwijzing naar of uitwisseling van die gegevens; onder deze
      voorwaarden kan zijn begrepen de betaling van een geldsom ter vergoeding aan degenen die die gegevens hebben
      overgelegd.

      6 De kosten van het onderzoek, voortvloeiende uit een aanvraag, de kosten van voortgezette onderzoekingen na de
      beslissing op een aanvraag, alsmede de kosten voortvloeiende uit de toepassing van het vierde en vijfde lid kunnen
      geheel of gedeeltelijk ten laste van de aanvrager worden gebracht.

      7 De toelatinghouder of registratiehouder, die in het in [artikel 6, tweede lid][ref2], bedoelde register staat
      vermeld, is periodiek een vergoeding verschuldigd.

      8 Een aanvraag kan slechts worden gedaan door een binnen de Europese Gemeenschappen permanent gevestigde
      natuurlijke of rechtspersoon die er verantwoordelijk voor is dat het middel wordt afgeleverd.

      9 Het bepaalde in dit artikel is van overeenkomstige toepassing op de verlenging van een toelating of registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel6
