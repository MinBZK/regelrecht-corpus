        bwb_id: BWBR0005537
        artikel: 2:5
  - number: '23'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter uitvoering van een communautaire maatregel inzake onderwerpen
      waarop deze wet van toepassing is, regelen worden gesteld.

      2 Bij de regelen, bedoeld in het eerste lid, kan worden afgeweken van het bij deze wet bepaalde inzoverre het
      betreft:

      a. de voorwaarden, genoemd in [artikel 3, eerste of tweede lid][ref1];

      b. werkzame stoffen voor bestrijdingsmiddelen als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2];

      c. de invulling van de in onderdeel *a* bedoelde voorwaarden, bedoeld in [artikel 3][ref3];

      d. de aanvraag als bedoeld in de [artikelen 4][ref4], [4][ref5] of [5, vijfde lid][ref6];

      e. de duur van de toelating of registratie alsmede van de verlenging daarvan als bedoeld in
      [artikel 5, eerste lid][ref7];

      f. de datum van 26 juli 2003, genoemd in [artikel 25, eerste lid][ref8];

      g. de datum van 13 mei 2010, genoemd in [artikel 25b, eerste lid][ref9].


