  - number: 5a
    text: |-
      1 Onze betrokken Minister kan bij regeling voorschriften geven omtrent:

      a. het in acht nemen van veiligheidstermijnen bij het oogsten van met een bestrijdingsmiddel behandelde planten of
      bij het in het verkeer brengen van met een bestrijdingsmiddel behandelde planten of delen daarvan;

      b. het in acht nemen van veiligheidstermijnen bij het in het verkeer brengen van voortbrengselen van met een
      bestrijdingsmiddel behandelde dieren of bij het slachten van zodanige dieren;

      c. het gebruiken van met een bestrijdingsmiddel behandelde planten of delen van planten;

      d. het telen van gewassen op met een bestrijdingsmiddel behandelde grond;

      e. het gebruiken van met een bestrijdingsmiddel behandeld water;

      f. het betreden onderscheidenlijk gebruiken van met een bestrijdingsmiddel behandelde ruimten, oppervlakken en
      goederen, dan wel van ruimten waarin zich behandelde goederen bevinden of bevonden hebben;

      g. het rekening houden met de voordelen van het gebruik van het biocide.

      2 Ten aanzien van een bestrijdingsmiddel, waarop de in het vorige lid bedoelde regeling geen betrekking heeft,
      kunnen bij de toelating of registratie één of meer voorschriften van die regeling van toepassing worden verklaard.
      Dit wordt bekend gemaakt in de Staatscourant.

      3 Degene die een bestrijdingsmiddel ten aanzien waarvan een voorschrift geldt, als bedoeld in de vorige leden,
      heeft gebruikt met betrekking tot in het eerste lid bedoelde zelfstandigheden waarvan een ander het genot heeft, is
      verplicht omtrent dat gebruik de ander, onder vermelding van de naam, de werkzame stof en het nummer van toelating
      of registratie van het bestrijdingsmiddel, zodanig op de hoogte te stellen als voor deze nodig is om vorenbedoeld
      voorschrift te kunnen naleven. Het in de vorige volzin bepaalde is van overeenkomstige toepassing op degene die het
      genot van zelfstandigheden als daar bedoeld aan een ander overdraagt.

      4 Behoudens tegenbewijs wordt men geacht niet aan de in het derde lid bedoelde verplichting te hebben voldaan, voor
      zover dit niet blijkt uit een geschrift, ondertekend door degene aan wie de inlichtingen moesten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Van een toelating of registratie wordt mededeling gedaan in de Staatscourant.

      2 Het college draagt zorg, dat van de toegelaten of geregistreerde bestrijdingsmiddelen aantekening wordt gehouden
      in een register dat volgens door Onze betrokken Minister te stellen regelen wordt ingericht.

      3 Op aanvraag van de in het register vermelde fabrikant, importeur of handelaar en tegen betaling van een bedrag
      worden wijzigingen in het register aangetekend.

      4 Van de wijziging wordt aan de belanghebbenden een bewijs verstrekt en wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002380/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het college trekt een toelating of registratie als bedoeld in [artikel 4][ref1] in, indien:

      a. niet of niet meer wordt voldaan aan het bepaalde bij of krachtens de [artikelen 3][ref2] en [3][ref3];

      b. onjuiste of misleidende informatie is verstrekt met betrekking tot de gegevens op grond waarvan een toelating of
      registratie als bedoeld in [artikel 4][ref4] is verleend of

      c. zulks noodzakelijk is ter uitvoering van een communautaire maatregel.

      2 Het college trekt een toelating of registratie als bedoeld in [artikel 4][ref5] in, indien de toelatinghouder of
      registratiehouder hiertoe een aanvraag indient.

      3 Een besluit op grond van het eerste of tweede lid wordt bekend gemaakt in de *Staatscourant*.

      4 Het besluit vermeldt de datum met ingang waarvan de intrekking van kracht wordt.

      5 Een toelating of registratie kan tijdelijk worden ingetrokken, indien het college gegronde aanwijzingen heeft dat
      het bestrijdingsmiddel een gevaar oplevert voor de gezondheid van mens of dier of voor het milieu. Het bepaalde in
      het derde en vierde lid is van overeenkomstige toepassing op de tijdelijke intrekking.

      6 In afwijking van [artikel 2, eerste lid][ref6], is het toegestaan een bestrijdingsmiddel, waarvan de toelating of
      registratie tijdelijk is ingetrokken, voorhanden of in voorraad te hebben.

      7 [Artikel 4, derde en vierde lid][ref7], is van overeenkomstige toepassing op de op verzoek of anders dan op
      verzoek te verstrekken gegevens. Indien is overgegaan tot het verrichten van dierproeven zonder dat daaraan
      voorafgaand de bedoelde inlichtingen zijn ingewonnen, worden de uit die dierproeven verkregen gegevens door het
      college bij de beslissing buiten beschouwing gelaten.


