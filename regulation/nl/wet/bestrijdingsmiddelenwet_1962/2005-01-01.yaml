  - number: 4a
    text: |-
      1 Ten behoeve van de aanwijzing van een werkzame stof bij een communautaire maatregel als bedoeld in
      [artikel 3, tweede lid, onderdeel ][ref1], alsmede de verlenging van die aanwijzing dient een aanvraag te worden
      gedaan.

      2 [Artikel 4, tweede, zesde, achtste en negende lid][ref2], is van overeenkomstige toepassing op een aanvraag
      als bedoeld in het eerste lid. Onze betrokken Minister stelt daarbij voorts regelen met betrekking tot de door
      de aanvrager aan de bevoegde instanties van de andere Lid-Staten van de Europese Gemeenschappen alsmede aan de
      Commissie van de Europese Gemeenschappen te zenden gegevens en de wijze waarop dit dient te geschieden.

      3 Onze betrokken Minister kan regelen stellen met betrekking tot de verstrekking door toelatinghouders of
      registratiehouders van gegevens met betrekking tot werkzame stoffen aan de in het tweede lid genoemde instanties en
      aan de Commissie van de Europese Gemeenschappen.

      4 Ten behoeve van het anders dan op aanvraag als bedoeld in het eerste lid aanwijzen van een werkzame stof bij
      een communautaire maatregel als bedoeld in [artikel 3, tweede lid, onderdeel ][ref3], het herbeoordelen van die
      aanwijzing alsmede het verlengen van die aanwijzing, kan Onze betrokken Minister bepalen dat de kosten verbonden
      aan de beoordeling van die werkzame stof geheel of gedeeltelijk ten laste worden gebracht van de kennisgevers als
      bedoeld in een communautaire maatregel van die werkzame stof of van een bestrijdingsmiddel waarin die werkzame stof
      wordt gebruikt.


