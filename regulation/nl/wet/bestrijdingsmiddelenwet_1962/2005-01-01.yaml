  - number: 2a
    text: |-
      1 Het is verboden een werkzame stof af te leveren, voorhanden of in voorraad te hebben of binnen Nederland te
      brengen, tenzij het bepaalde in [artikel 4][ref1] in acht is genomen.

      2 Het verbod van het eerste lid geldt niet voor een werkzame stof:

      a. die tot de samenstelling behoort van een ingevolge deze wet toegelaten of geregistreerd bestrijdingsmiddel of
      van een bestrijdingsmiddel waarvoor deze wet buiten toepassing is verklaard, of

      b. die kennelijk bestemd is om overeenkomstig het bepaalde bij of krachtens [artikel 15][ref2] voor een proef te
      worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel15
