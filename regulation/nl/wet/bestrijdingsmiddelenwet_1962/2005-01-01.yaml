  - number: '11'
    text: |-
      Het is verboden toegelaten of geregistreerde bestrijdingsmiddelen af te leveren, en, voor zover ze voor de handel
      bestemd zijn, voorhanden of in voorraad te hebben, indien de krachtens [artikel 5, tweede lid][ref1], of krachtens
      [artikel 9, tweede lid][ref2], voor het gebruik gegeven voorschriften niet op de daarbij voorgeschreven wijze
      op, aan of bij de verpakking zijn vermeld, en indien het gehalte aan werkzame stof en de verdere samenstelling
      kleur, vorm, afwerking, verpakking, aanduidingen of vermeldingen op, aan of bij de verpakking niet voldoen
      aan de krachtens [artikel 3, tweede lid, onderdeel ][ref3], gegeven algemene voorschriften, of de krachtens
      [artikel 5, derde lid][ref4], of [artikel 9, derde lid][ref5], gegeven nadere voorschriften.


