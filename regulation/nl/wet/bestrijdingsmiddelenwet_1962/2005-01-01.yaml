  - number: '9'
    text: |-
      1 Op verzoek van Onze betrokken Minister wordt een bestrijdingsmiddel door het college ambtshalve toegelaten of
      geregistreerd.

      2 Aan een toelating of registratie ingevolge het eerste lid kunnen voorschriften, als bedoeld in
      [artikel 5, tweede lid][ref1], worden verbonden.

      3 Aan een toelating of registratie ingevolge het eerste lid kunnen nadere voorschriften, als bedoeld in
      [artikel 5, derde en vierde lid][ref2], worden verbonden.

      4 Een besluit tot ambtshalve toelating of registratie, tot wijziging van de in het tweede en derde lid bedoelde
      voorschriften en tot intrekking van de toelating of registratie wordt in de *Staatscourant* bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5
