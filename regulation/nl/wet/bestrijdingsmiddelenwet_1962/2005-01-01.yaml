      1 De bedragen, gelden en vergoedingen als bedoeld in de [artikelen 4][ref1], [4a][ref2], [6][ref3] en [15][ref4]
      worden met inachtneming van het bepaalde krachtens het tweede lid door het college vastgesteld en in de
      Staatscourant bekendgemaakt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake bedragen, gelden en
      vergoedingen als bedoeld in de [artikelen 4][ref5], [4a][ref6], [6][ref7] en [15][ref8].

      3 De tarieven behoeven de goedkeuring van Onze betrokken Minister.

      4 De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.


