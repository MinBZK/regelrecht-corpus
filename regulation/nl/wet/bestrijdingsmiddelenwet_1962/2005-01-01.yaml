  - number: 25d
    text: |-
      1 Een bestrijdingsmiddel, waarvan de werkzame stof of stoffen door het college zijn aangewezen, is, in afwijking
      van het bepaalde bij of krachtens de [artikelen 3][ref1] en [3a][ref2] en van de [artikelen 4, eerste lid][ref3],
      en [5, eerste lid][ref4], van rechtswege toegelaten of geregistreerd met ingang van het in het derde lid bedoelde
      tijdstip.

      2 Bij de aanwijzing van een werkzame stof, bedoeld in het eerste lid, wordt rekening gehouden met de effecten van
      de betrokken werkzame stof, bedoeld in [artikel 3, eerste lid, onderdeel a, ten derde tot en met ten tiende][ref5].

      3 De toelating of registratie, bedoeld in het eerste lid, is van kracht met ingang van het tijdstip van beëindiging
      van de uit hoofde van [artikel 4][ref6] afgegeven toelating of registratie, met dien verstande dat indien dit
      tijdstip van beëindiging reeds is verstreken, de toelating, onderscheidenlijk registratie terug werkt tot en met
      dat tijdstip. De toelating, onderscheidenlijk registratie geldt, in afwijking van [artikel 5, eerste lid][ref7],
      tot het tijdstip waarop uiterlijk uitvoering moet zijn gegeven aan een met betrekking tot de betrokken werkzame
      stof vastgestelde communautaire maatregel als bedoeld in [artikel 3, tweede lid, onderdeel a][ref8], met
      dien verstande dat zij in ieder geval doorloopt na 26 juli 2003, dan wel 15 mei 2010 indien uiterlijk op die
      onderscheiden datum geen communautaire maatregel is vastgesteld die vermeldt of de betrokken werkzame stof mag
      worden gebruikt als basis voor een gewasbeschermingsmiddel onderscheidenlijk biocide.

      4 Met betrekking tot de in het eerste lid bedoelde bestrijdingsmiddelen is het verboden te handelen in strijd
      met de krachtens [artikel 5, tweede en derde lid][ref9], gegeven voorschriften, zoals deze golden tot het
      moment van beëindiging van de toelating of registratie uit hoofde van [artikel 4][ref10], en met de krachtens
      [artikel 13][ref11] gegeven voorschriften.

      5 Onverminderd de [artikelen 5][ref12] en [7][ref13] wordt een toelating of registratie als bedoeld in het
      eerste lid, door het college ingetrokken of worden de voorschriften, bedoeld in [artikel 5, tweede lid][ref14],
      door het college gewijzigd indien dat noodzakelijk is ter uitvoering van een communautaire maatregel.
      [Artikel 7, derde en vierde lid][ref15], zijn op de intrekking van de toelating, onderscheidenlijk registratie
      van toepassing.

      6 Het eerste lid is:

      a. niet van toepassing op een bestrijdingsmiddel waarvan de toelating of registratie ingevolge een communautaire
      maatregel niet verleend mag worden;

      b. niet van toepassing op een bestrijdingsmiddel waarvan de toelating of registratie ingevolge een communautaire
      maatregel dient te worden ingetrokken, vanaf het tijdstip waarop aan die maatregel uiterlijk uitvoering moet zijn
      gegeven;

      c. uitsluitend van toepassing op een bestrijdingsmiddel dat een werkzame stof bevat die reeds vóór 26 juli 1993,
      indien het een gewasbeschermingsmiddel betreft, onderscheidenlijk 15 mei 2000, indien het een biocide betreft,
      werd afgeleverd en niet bij een in [artikel 3, tweede lid, onderdeel a][ref16], bedoelde communautaire maatregel
      is aangewezen;

      d. uitsluitend van toepassing op een bestrijdingsmiddel dat is toegelaten of laatstelijk op 1 januari 2001
      toegelaten is geweest of is geregistreerd;

      e. niet van toepassing op een bestrijdingsmiddel waarvan de toelating of registratie is ingetrokken op verzoek van
      de toelatinghouder of ten aanzien waarvan geen aanvraag tot verlenging van de toelating of registratie is ingediend
      overeenkomstig de krachtens [artikel 4][ref17] gestelde regelen omtrent het indienen van een aanvraag;

      f. niet van toepassing op een bestrijdingsmiddel waarop
      [artikel II van de wet van 25 januari 2001, houdende wijziging van de Bestrijdingsmiddelenwet 1962][ref18]
      (landbouwkundig onmisbare gewasbeschermingsmiddelen) van toepassing is of is geweest.

      7 Een aanwijzing als bedoeld in het eerste lid wordt door de zorg van Onze Minister van Landbouw, Natuurbeheer en
      Visserij in de Staatscourant bekend gemaakt. Hij gaat daartoe niet eerder over dan nadat de aanwijzing aan beide
      Kamers der Staten-Generaal is overgelegd voor een periode van 30 dagen.

      8 Onze betrokken minister kan, ter uitvoering van een communautaire maatregel, dit artikel onder door hem te
      stellen regelen van overeenkomstige toepassing verklaren voor bestrijdingsmiddelen op basis van door hem aangewezen
      werkzame stoffen.


