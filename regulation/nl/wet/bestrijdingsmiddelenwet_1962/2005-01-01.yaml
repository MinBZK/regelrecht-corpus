  - number: '24'
    text: |-
      1 [Artikel 3, tweede lid, onderdeel ][ref1], is niet van toepassing op gewasbeschermingsmiddelen die werkzame
      stoffen bevatten die op 25 juli 1993 nog niet eerder werden afgeleverd en die niet bij de in dat artikelonderdeel
      bedoelde communautaire maatregel zijn aangewezen, mits:

      a. voldaan is aan de regelen, bedoeld in [artikel 4][ref2];

      b. door het college wordt vastgesteld dat:

        - de residuen van de betreffende werkzame stoffen geen schadelijke uitwerking hebben op de gezondheid van mens
      en dier of op het grondwater en geen voor het milieu onaanvaardbaar effect, en deze residuen, voor zover zij in
      toxicologisch opzicht of uit milieu-oogpunt van belang zijn, door middel van algemeen gebruikte methoden kunnen
      worden gemeten;
        - het gebruik van gewasbeschermingsmiddelen na een toepassing die in overeenstemming is met de goede
      gewasbeschermingspraktijken, geen schadelijke uitwerking op de gezondheid van mens en dier en geen voor het milieu
      onaanvaardbaar effect heeft als bedoeld in [artikel 3, eerste lid, onderdeel ][ref3], ten derde tot en met ten
      tiende, en
        - het gewasbeschermingsmiddel voldoet aan de overige voorwaarden voor toelating, bedoeld in de
      [artikelen 3, eerste en tweede lid][ref4], en [3][ref5].

      2 In geval van een toelating waarbij toepassing is gegeven aan het eerste lid, geldt deze voor een termijn van ten
      hoogste drie jaren. Indien de termijn van toelating korter is dan drie jaren, kan deze één of meerdere malen worden
      verlengd met dien verstande, dat de totale duur van de termijn niet langer zal zijn dan drie jaren, tenzij ter
      uitvoering van een communautaire maatregel een langere termijn kan worden gesteld.

      3 Het college kan een toelating waarbij toepassing is gegeven aan het eerste lid intrekken. Artikel 7 is van
      overeenkomstige toepassing op een zodanige intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
