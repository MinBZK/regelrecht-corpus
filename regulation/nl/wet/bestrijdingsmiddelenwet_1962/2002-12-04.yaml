        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
  - number: 25c.1.a
    text: |-
      het gebruik van het middel voor dat doeleind dringend vereist is omdat voor het gebruik uit landbouwkundig of
      volksgezondheidsoogpunt geen geschikt alternatief bestaat in de vorm van een ander gewasbeschermingsmiddel dan wel
      een mechanische of biologische methode, die hetzelfde doeleind en een vergelijkbare werkzaamheid heeft en waarvan
      met redelijke zekerheid kan worden aangenomen dat deze aanmerkelijk minder risico's heeft voor de kwaliteit van
      het milieu;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.1.b
    text: |-
      wordt voldaan aan door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming
      met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van Volksgezondheid, Welzijn en Sport en
      Onze Minister van Sociale Zaken en Werkgelegenheid gestelde regels met betrekking tot de toepassing van onderdeel
      a, die betrekking hebben op de aspecten innovatie, resistentierisico en landbouwtechnische doelmatigheid,
      daaronder mede begrepen de kosteneffectiviteit, en met betrekking tot de toelatingscriteria, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref1], ten negende en ten tiende, waarbij voor de toepassing van die regels
      wordt uitgegaan van het gebruik van het middel overeenkomstig het bepaalde bij of krachtens deze wet, en


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 25c.1.c
    text: |-
      op de toelating overeenkomstig dit artikel een beroep wordt gedaan, ofwel door de in
      [artikel 4, achtste lid][ref1], bedoelde aanvrager, ofwel, indien het uitsluitend betreft een doeleind waarvoor
      een toegelaten gewasbeschermingsmiddel gebruikt mag worden, door de in [artikel 5, zesde lid][ref2], bedoelde
      instanties, lichamen, organisaties of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
    references:
