        artikel: '5'
        paragraaf: '2'
  - number: 25c.2
    text: 'Het eerste lid is:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.2.a
    text: |-
      niet van toepassing op een gewasbeschermingsmiddel waarvan de toelating ingevolge een communautaire maatregel niet
      verleend mag worden;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.2.b
    text: |-
      niet van toepassing op een gewasbeschermingsmiddel waarvan de toelating ingevolge een communautaire maatregel dient
      te worden ingetrokken, vanaf het tijdstip waarop aan die maatregel uiterlijk uitvoering moet zijn gegeven;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.2.c
    text: |-
      uitsluitend van toepassing op een gewasbeschermingsmiddel dat een werkzame stof bevat die reeds vóór 26 juli 1993
      werd afgeleverd en niet bij een in [artikel 3, tweede lid, onderdeel a][ref1], bedoelde communautaire maatregel
      is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 25c.2.d
    text: uitsluitend van toepassing op een gewasbeschermingsmiddel dat is toegelaten of toegelaten is geweest, en
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.2.e
    text: |-
      niet van toepassing op een gewasbeschermingsmiddel waarvan de toelating is ingetrokken op verzoek van de
      toelatinghouder of ten aanzien waarvan geen aanvraag tot verlenging van de toelating is ingediend.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.3
    text: 'Een toelating die met toepassing van het eerste lid is verleend:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.3.a
    text: |-
      geldt in afwijking van [artikel 5, eerste lid][ref1], voor een in het besluit tot toelating te bepalen termijn van
      ten hoogste twee jaren. De toelating kan eenmaal met ten hoogste twee jaren worden verlengd indien is gebleken dat
      nog steeds aan de voorwaarden voor toelating is voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: 25c.3.b
    text: |-
      wordt in afwijking van [artikel 7, eerste lid, onderdeel a][ref1], ingetrokken indien niet
      of niet meer wordt voldaan aan het bepaalde bij of krachtens het eerste lid, onderdeel b,
      [artikel 3, eerste lid, onderdeel a, ten eerste tot en met ten achtste, en onderdelen b tot en met d][ref2],
      alsmede tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 25c.4
    text: |-
      Door Onze betrokken Minister kan worden bepaald dat het voorhanden of in voorraad hebben en het gebruik van het
      gewasbeschermingsmiddel vanaf een door hem te bepalen datum die niet eerder gelegen zal zijn dan 1 juli 2003
      uitsluitend mag plaatsvinden door bedrijven, personen of rechtspersonen die voldoen aan door hem te stellen eisen
      die onder meer betrekking kunnen hebben op de certificering van die bedrijven, personen of rechtspersonen, alsmede
      op de voorwaarden waaronder certificering plaatsvindt en waaraan een certificerende instelling dient te voldoen.
      Bij de te stellen eisen, bedoeld in de eerste volzin, worden de bestaande certificeringseisen, zoals vastgelegd
      in het Milieu Programma Sierteelt, in Milieu Bewuste Teelt of in daarmee vergelijkbare certificeringsstelsels, in
      acht genomen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25c.5
    text: Het is verboden te handelen in strijd met de krachtens het vierde lid gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
  - number: 25d.1
    text: |-
      Een bestrijdingsmiddel, waarvan de werkzame stof of stoffen door het college zijn aangewezen, is, in afwijking
      van het bepaalde bij of krachtens de [artikelen 3][ref1] en [3a][ref2] en van de [artikelen 4, eerste lid][ref3],
      en [5, eerste lid][ref4], van rechtswege toegelaten of geregistreerd met ingang van het in het derde lid bedoelde
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: 25d.2
    text: |-
      Bij de aanwijzing van een werkzame stof, bedoeld in het eerste lid, wordt rekening gehouden met de effecten van de
      betrokken werkzame stof, bedoeld in [artikel 3, eerste lid, onderdeel a, ten derde tot en met ten tiende][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 25d.3
    text: |-
      De toelating of registratie, bedoeld in het eerste lid, is van kracht met ingang van het tijdstip van beëindiging
      van de uit hoofde van [artikel 4][ref1] afgegeven toelating of registratie, met dien verstande dat indien dit
      tijdstip van beëindiging reeds is verstreken, de toelating, onderscheidenlijk registratie terug werkt tot en met
      dat tijdstip. De toelating, onderscheidenlijk registratie geldt, in afwijking van [artikel 5, eerste lid][ref2],
      tot het tijdstip waarop uiterlijk uitvoering moet zijn gegeven aan een met betrekking tot de betrokken werkzame
      stof vastgestelde communautaire maatregel als bedoeld in [artikel 3, tweede lid, onderdeel a][ref3], met
      dien verstande dat zij in ieder geval doorloopt na 26 juli 2003, dan wel 15 mei 2010 indien uiterlijk op die
      onderscheiden datum geen communautaire maatregel is vastgesteld die vermeldt of de betrokken werkzame stof mag
      worden gebruikt als basis voor een gewasbeschermingsmiddel onderscheidenlijk biocide.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 25d.4
    text: |-
      Met betrekking tot de in het eerste lid bedoelde bestrijdingsmiddelen is het verboden te handelen in strijd
      met de krachtens [artikel 5, tweede en derde lid][ref1], gegeven voorschriften, zoals deze golden tot het
      moment van beëindiging van de toelating of registratie uit hoofde van [artikel 4][ref2], en met de krachtens
      [artikel 13][ref3] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel13
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '13'
        paragraaf: '3'
  - number: 25d.5
    text: |-
      Onverminderd de [artikelen 5][ref1] en [7][ref2] wordt een toelating of registratie als bedoeld in het
      eerste lid, door het college ingetrokken of worden de voorschriften, bedoeld in [artikel 5, tweede lid][ref3],
      door het college gewijzigd indien dat noodzakelijk is ter uitvoering van een communautaire maatregel.
      [Artikel 7, derde en vierde lid][ref4], zijn op de intrekking van de toelating, onderscheidenlijk registratie van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel7
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '7'
        paragraaf: '2'
  - number: 25d.6
    text: 'Het eerste lid is:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
  - number: 25d.6.a
    text: |-
      niet van toepassing op een bestrijdingsmiddel waarvan de toelating of registratie ingevolge een communautaire
      maatregel niet verleend mag worden;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
  - number: 25d.6.b
    text: |-
      niet van toepassing op een bestrijdingsmiddel waarvan de toelating of registratie ingevolge een communautaire
      maatregel dient te worden ingetrokken, vanaf het tijdstip waarop aan die maatregel uiterlijk uitvoering moet zijn
      gegeven;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
  - number: 25d.6.c
    text: |-
      uitsluitend van toepassing op een bestrijdingsmiddel dat een werkzame stof bevat die reeds vóór 26 juli 1993,
      indien het een gewasbeschermingsmiddel betreft, onderscheidenlijk 15 mei 2000, indien het een biocide betreft,
      werd afgeleverd en niet bij een in [artikel 3, tweede lid, onderdeel a][ref1], bedoelde communautaire maatregel
      is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 25d.6.d
    text: |-
      uitsluitend van toepassing op een bestrijdingsmiddel dat is toegelaten of laatstelijk op 1 januari 2001 toegelaten
      is geweest of is geregistreerd;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
  - number: 25d.6.e
    text: |-
      niet van toepassing op een bestrijdingsmiddel waarvan de toelating of registratie is ingetrokken op verzoek van de
      toelatinghouder of ten aanzien waarvan geen aanvraag tot verlenging van de toelating of registratie is ingediend
      overeenkomstig de krachtens [artikel 4][ref1] gestelde regelen omtrent het indienen van een aanvraag;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: 25d.6.f
    text: |-
      niet van toepassing op een bestrijdingsmiddel waarop
      [artikel II van de wet van 25 januari 2001, houdende wijziging van de Bestrijdingsmiddelenwet 1962][ref1]
      (landbouwkundig onmisbare gewasbeschermingsmiddelen) van toepassing is of is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0012188#ArtikelII
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0012188
        artikel: II
  - number: 25d.7
    text: |-
      Een aanwijzing als bedoeld in het eerste lid wordt door de zorg van Onze Minister van Landbouw, Natuurbeheer en
      Visserij in de Staatscourant bekend gemaakt. Hij gaat daartoe niet eerder over dan nadat de aanwijzing aan beide
      Kamers der Staten-Generaal is overgelegd voor een periode van 30 dagen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
  - number: 25d.8
    text: |-
      Onze betrokken minister kan, ter uitvoering van een communautaire maatregel, dit artikel onder door hem te stellen
      regelen van overeenkomstige toepassing verklaren voor bestrijdingsmiddelen op basis van door hem aangewezen
      werkzame stoffen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25d
  - number: '26'
    text: Deze wet wordt aangehaald als Bestrijdingsmiddelenwet 1962.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel26
