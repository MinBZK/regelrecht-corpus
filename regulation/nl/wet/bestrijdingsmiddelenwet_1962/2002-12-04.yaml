---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: bestrijdingsmiddelenwet_1962
regulatory_layer: WET
publication_date: '2003-02-25'
valid_from: '2002-12-04'
bwb_id: BWBR0002380
url: https://wetten.overheid.nl/BWBR0002380/2002-12-04
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen vast te stellen met betrekking tot de
    handel in en het gebruik van bestrijdingsmiddelen, zowel uit een oogpunt van deugdelijkheid voor het doel, waarvoor
    zij bestemd zijn, als uit een oogpunt van veiligheid en gezondheid van de mens en van dieren, welker instandhouding
    gewenst is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.a
    text: 'planten: levende planten en levende delen van planten met inbegrip van vers fruit en zaden;'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.b
    text: |-
      plantaardige produkten: van planten afkomstige produkten die geen of slechts een eenvoudige bewerking hebben
      ondergaan, zoals malen, drogen of persen, voor zover het geen planten zijn;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.c
    text: |-
      organismen: organismen van het dieren- of plantenrijk en virussen, bacteriën, mycoplasma's of andere pathogenen die
      schade kunnen veroorzaken of waarvan uit anderen hoofde bestrijding of afwering wenselijk is;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.d
    text: |-
      stof: chemisch element of verbinding daarvan, zoals dat of zoals deze in de natuur voorkomt of industrieel wordt
      vervaardigd, met inbegrip van verontreinigingen die onvermijdelijk bij het fabricageproces ontstaan;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.e
    text: |-
      werkzame stof: stof of micro-organisme, met inbegrip van virussen, met een algemene of specifieke werking als
      bedoeld in de onderdelen *g* of *h* tegen organismen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.f
    text: 'bestrijdingsmiddel: gewasbeschermingsmiddel of niet-landbouwbestrijdingsmiddel;'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.g
    text: |-
      gewasbeschermingsmiddel: werkzame stof of een preparaat dat één of meer werkzame stoffen bevat, bestemd om te
      worden gebruikt om:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.g.1°
    text: planten of plantaardige produkten te beschermen tegen organismen of de werking daarvan te voorkomen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.g.2°
    text: |-
      levensprocessen van planten te beïnvloeden, voor zover niet zijnde meststoffen in de zin van de
      [Meststoffenwet 1947][ref1] (*Stb.* H. 123) of van de [Meststoffenwet][ref2] (*Stb.* 1986, 598);


      [ref1]: https://wetten.overheid.nl/BWBR0002028
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002028
      - id: ref2
        bwb_id: BWBR0004054
  - number: 1.1.g.3°
    text: plantaardige produkten te bewaren;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.g.4°
    text: ongewenste planten te doden of
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.g.5°
    text: delen van planten te vernietigen of een ongewenste groei van planten te remmen of te voorkomen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.h
    text: |-
      niet-landbouwbestrijdingsmiddel: werkzame stof of een preparaat dat één of meer werkzame stoffen bevat, bestemd om
      te worden gebruikt bij:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.h.1°
    text: |-
      het bestrijden of afweren van organismen welke schade kunnen aanbrengen aan plantaardige voortbrengselen, voor
      zover niet zijnde plantaardige produkten als bedoeld in onderdeel *b*, of aan door Onze betrokken Minister
      aangewezen voortbrengselen van dierlijke oorsprong;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.h.2°
    text: |-
      het bestrijden of afweren van organismen in of op: - gebouwen en andere opstallen, niet dienende tot verblijfplaats
      voor dieren of kweekplaatsen voor planten;
        - waterleidingbedrijven, zweminrichtingen en wateren waarin wordt gebaad en gezwommen, alsmede kampeerplaatsen,
      kampeerwagens en tenten;
        - vuilstortplaatsen;
        - voer-, vaar- en vliegtuigen, niet zijnde transportmiddelen voor dieren;
        - materialen, apparaten en gebruiksvoorwerpen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.h.3°
    text: |-
      het bestrijden of afweren van dieren welke ziekten kunnen veroorzaken bij dan wel overbrengen op de mens, voor
      zover de [Wet op de geneesmiddelenvoorziening][ref1] (*Stb.* 1958, 408) niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 1.1.h.4°
    text: het bestrijden of afweren van andere dieren dan bedoeld onder ten derde, ter voorkoming van overlast voor de mens;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.i
    text: 'afleveren: verkopen, te koop of in ruil aanbieden, ter beschikking stellen, schenken alsmede uitdelen;'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.j
    text: |-
      milieu: water, bodem, lucht en wilde soorten van dieren en planten alsmede hun onderlinge relatie en hun relatie
      met levende organismen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.k
    text: |-
      geïntegreerde bestrijding: rationele toepassing van een combinatie van biologische, biotechnologische, chemische,
      mechanische en fysische bestrijding, teelt- of gewasverbeteringsmaatregelen, waarbij het gebruik van chemische
      gewasbeschermingsmiddelen wordt beperkt tot het strikte minimum dat noodzakelijk is om populaties van organismen
      onder de niveaus te houden waarbij in economisch opzicht onaanvaardbare schade of verliezen optreden;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.l
    text: |-
      verpakking: omhulsel waarin een bestrijdingsmiddel aan of ten behoeve van een gebruiker wordt afgeleverd, of dat
      daartoe is bestemd;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.m
    text: |-
      residuen: één of meer stoffen die als reststoffen ten gevolge van het gebruik van een bestrijdingsmiddel in of
      op planten of produkten van plantaardige oorsprong, produkten van dierlijke oorsprong, of elders in het milieu
      aanwezig zijn, met inbegrip van de metabolieten en de produkten die bij afbraak of de reactie worden gevormd;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.n
    text: |-
      communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 189 van het Verdrag tot
      oprichting van de Europese Economische Gemeenschap (*Trb.* 1957, 91) ter zake van het op de markt brengen van
      bestrijdingsmiddelen en daaraan verbonden onderwerpen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.1.o
    text: |-
      bedrijfslichaam: een bedrijfslichaam als bedoeld in [artikel 66 van de Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '1.2'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: "Onze betrokken Minister":'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.2.a
    text: |-
      voor wat betreft gewasbeschermingsmiddelen, met uitzondering van gewasbeschermingsmiddelen bestemd voor
      plantaardige produkten die slechts een eenvoudige bewerking hebben ondergaan: Onze Minister van Landbouw,
      Natuurbeheer en Visserij in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en
      Werkgelegenheid;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.2.b
    text: |-
      voor wat betreft niet-landbouwbestrijdingsmiddelen alsmede gewasbeschermingsmiddelen bestemd voor plantaardige
      produkten voor zover deze een eenvoudige bewerking hebben ondergaan: Onze Minister van Welzijn, Volksgezondheid
      en Cultuur in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: '1.3'
    text: |-
      Onze betrokken Minister kan bij in de *Staatscourant* bekend te maken regeling deze wet ten aanzien van bepaalde
      bestrijdingsmiddelen of groepen van bestrijdingsmiddelen buiten toepassing verklaren.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: '1.4'
    text: 'Voor de toepassing van het bepaalde bij of krachtens deze wet kunnen bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.4.a
    text: andere zelfstandigheden worden gelijkgesteld met de in het eerste lid bedoelde stoffen of werkzame stoffen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1.4.b
    text: |-
      andere bestemmingen worden gelijkgesteld met één of meer in de maatregel aan te wijzen bestemmingen, genoemd in het
      eerste lid, onderdelen *g* en *h*, en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder "gewasbeschermingsmiddel" tevens verstaan
      een werkzame stof of een preparaat dat één of meer werkzame stoffen bevat, bestemd om: - insekten en mijten,
      voorkomend op of bij dieren, door uitwendige toepassing te bestrijden of af te weren, alsmede slakken die als
      drager kunnen optreden voor ziekteverwekkers bij dieren welker instandhouding is gewenst, te bestrijden of af te
      weren;
        - opstallen dienende tot verblijfplaats voor dieren, mesthopen en gierkelders, transportmiddelen voor dieren of
      melkwinningsapparatuur te behandelen ter bestrijding of afwering van insekten, mijten, of andere organismen dan wel
      door deze veroorzaakte omzettingsprodukten.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: '1.6'
    text: |-
      Onze betrokken Minister doet mededeling in de *Staatscourant* van de vaststelling of wijziging van een
      communautaire maatregel voor zover daaraan uitvoering moet worden gegeven, onder vermelding van de artikelen van
      deze wet waarop de betreffende communautaire maatregel betrekking heeft. Een communautaire maatregel of wijziging
      daarvan treedt voor de toepassing van deze wet in werking met ingang van de dag waarop daaraan uiterlijk uitvoering
      moet zijn gegeven, tenzij Onze betrokken Minister hiervoor een ander tijdstip heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1
  - number: 1a.1
    text: |-
      Er is een College voor de toelating van bestrijdingsmiddelen, voor de toepassing van het bepaalde bij of krachtens
      deze wet verder te noemen het college. Het college bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1a
  - number: 1a.2
    text: |-
      Voor de toepassing van deze paragraaf wordt onder «Onze Minister» verstaan: Onze Minister van Landbouw,
      Natuurbeheer en Visserij in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1a
  - number: 1b.1
    text: 'Het college is belast met:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1b
  - number: 1b.1.a
    text: de uitvoering van de bij of krachtens deze wet aan hem opgedragen taken en
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1b
  - number: 1b.1.b
    text: andere, bij algemene maatregel van bestuur opgedragen taken, die verband houden met de onder a bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1b
  - number: 1b.2
    text: Het college draagt zorg voor de systematische bewaking van de kwaliteit van de taakverrichting.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1b
  - number: 1c.1
    text: |-
      Het college bestaat uit vijf leden, de voorzitter daaronder begrepen, en ten hoogste vier plaatsvervangende leden,
      die op voordracht van Onze Minister bij koninklijk besluit worden benoemd en ontslagen. De benoeming vindt plaats
      op grond van deskundigheid op het gebied van de taken waarmee het college is belast. Geen benoeming vindt plaats
      van aan Onze Ministers ondergeschikte personen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.2
    text: De leden wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.3
    text: |-
      De leden, de plaatsvervangers en de voorzitter worden voor de duur van vier jaren benoemd. Zij zijn ten hoogste
      twee keer herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.4
    text: De leden hebben op persoonlijke titel zitting in het college en oefenen hun functie uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.5
    text: |-
      De leden en de plaatsvervangend leden kunnen om zwaarwichtige redenen door Onze Minister worden geschorst of
      tussentijds worden ontslagen. Ontslag kan op eigen verzoek worden verleend.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.6
    text: |-
      Zolang in een vacature niet is voorzien, vormen de overblijvende leden het college, met de bevoegdheid van het
      volledig college.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.7
    text: |-
      Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.8
    text: Het college regelt bij reglement zijn werkwijze. Het reglement behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1c.9
    text: |-
      Onze Minister kent de leden van het college een vergoeding toe voor hun werkzaamheden. Deze vergoeding komt ten
      laste van het college.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1c
  - number: 1d.1
    text: |-
      Het college heeft een secretaris en een secretariaat. Het secretariaat is belast met de ondersteuning van het
      college.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1d
  - number: 1d.2
    text: |-
      De secretaris wordt op voordracht van het college benoemd door Onze Minister van Landbouw, Natuurbeheer en
      Visserij. Hij kan worden geschorst of ontslagen door Onze Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1d
  - number: 1d.3
    text: |-
      De secretaris van het college is tevens directeur van het secretariaat. Hij is belast met de dagelijkse leiding
      daarvan.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1d
  - number: 1e.1
    text: |-
      Het college kan bij het reglement, bedoeld in [artikel 1c, achtste lid][ref1], zijn vertegenwoordiging in en
      buiten rechte opdragen aan een of meer leden van het college of aan de secretaris. Het kan bepalen dat deze
      vertegenwoordiging uitsluitend betrekking heeft op bepaalde aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1c
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 1c
        paragraaf: 1a
  - number: 1e.2
    text: |-
      Het college kan bij het reglement als bedoeld in [artikel 1c, achtste lid][ref1], de uitoefening van daarbij aan te
      wijzen taken en bevoegdheden opdragen aan een of meer leden of aan de secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1c
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 1c
        paragraaf: 1a
  - number: 1e.3
    text: |-
      De opgedragen bevoegdheid wordt uit naam en onder verantwoordelijkheid van het college uitgeoefend. Het college kan
      te dien aanzien alle aanwijzingen geven die het nodig acht.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1e
  - number: 1f.1
    text: |-
      De directeur en het personeel van het secretariaat zijn ambtenaar in de zin van de [Ambtenarenwet 1929][ref1],
      behoudens degene met wie een arbeidsovereenkomst naar burgerlijk recht is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 1f.2
    text: |-
      Onverminderd [artikel 1d, tweede lid][ref1], is de rechtspositie van de directeur en het personeel van het
      secretariaat in overeenstemming met de regels die gelden voor ambtenaren die zijn aangesteld bij de ministeries
      en die behoren tot de sector Rijk, met dien verstande dat waar in deze regels een bevoegdheid is toegekend aan een
      andere minister dan Onze Minister van Binnenlandse Zaken, deze bevoegdheid ten aanzien van het personeel van het
      secretariaat wordt uitgeoefend door de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1d
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 1d
        paragraaf: 1a
  - number: 1f.3
    text: Bij algemene maatregel van bestuur kan zo nodig worden afgeweken van de in het tweede lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1f
  - number: 1g.1
    text: 'De inkomsten van het college bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.1.a
    text: |-
      de opbrengsten van de bedragen, gelden en vergoedingen, bedoeld in de [artikelen 4][ref1], [4a][ref2], [6][ref3]
      en [15][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel15
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 4a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '15'
        paragraaf: '3'
  - number: 1g.1.b
    text: vergoedingen voor verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.1.c
    text: bijdragen van het Rijk;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.1.d
    text: andere baten, hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.2
    text: 'Instemming van Onze Minister behoeft een besluit van het college strekkende tot:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.2.a
    text: het aangaan van geldleningen die een door Onze Minister vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.2.b
    text: |-
      het aangaan van lease-overeenkomsten waarvan de door het college te leveren tegenprestatie een door Onze Minister
      vast te stellen omvang te boven gaat;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1g.2.c
    text: het (mede) oprichten van rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1g
  - number: 1h.1
    text: |-
      Het college stelt jaarlijks een werkplan voor het eerstvolgende jaar vast. Het werkplan bevat tevens een visie
      op de ontwikkelingen voor de eerstvolgende vier jaren met betrekking tot aard en omvang van de aan het college
      toebedeelde taken en de daaruit voortvloeiende gevolgen voor de organisatie. Het werkplan wordt vóór 1 oktober aan
      Onze Ministers ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1h.2
    text: |-
      Het college stelt jaarlijks een begroting vast. De begroting bevat ten minste een staat van lasten en baten, een
      balans en een toelichting op deze stukken.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1h.3
    text: |-
      De begroting met daaraan toegevoegd een onderbouwing aan de hand van kostencomponenten en prestatie-elementen
      alsmede een financieel meerjarenplan wordt vóór 1 oktober van het voorafgaande jaar ter instemming aan Onze
      Minister voorgelegd. Indien de begroting waarmee Onze Minister heeft ingestemd niet toereikend is, legt het college
      lopende het jaar een wijziging van die begroting ter instemming voor aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1h.4
    text: |-
      Het college dient jaarlijks vóór 1 april bij Onze Ministers een jaarrekening in waarin rekening en verantwoording
      wordt afgelegd over het afgelopen kalenderjaar. De jaarrekening gaat vergezeld van een verklaring omtrent de
      getrouwheid en de rechtmatigheid, afgegeven door een door het college, in overleg met Onze Minister aangewezen
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de
      aanwijzing van de accountant wordt bedongen dat aan Onze Minister van Landbouw, Natuurbeheer en Visserij dan wel
      aan een door hem aangewezen accountant als bedoeld in het vijfde lid op diens verzoek inzicht wordt geboden in de
      controlewerkzaamheden van de accountant. De jaarrekening behoeft de instemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1h.5
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij belast een tot de departementale accountantsdienst
      van het Ministerie van Landbouw, Natuurbeheer en Visserij behorende accountant met een onderzoek naar de
      controlewerkzaamheden van de accountant, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1h.6
    text: Het college stelt de in het vierde lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1h.7
    text: |-
      Onze Minister kan tevens een onderzoek instellen naar de doelmatigheid van het beheer, de organisatie en het beleid
      van het college. Desgevraagd geeft het college ten behoeve van dit onderzoek inzage van de boeken en bescheiden en
      verstrekt het alle inlichtingen die voor dit onderzoek nodig geoordeeld worden.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1h.8
    text: |-
      Onze Minister kan regelen stellen omtrent de inrichting van de stukken, bedoeld in het eerste, tweede, derde en
      vierde lid, alsmede omtrent de aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1h
  - number: 1i.1
    text: |-
      Op verzoek van Onze Ministers verstrekt het college alle door Onze Ministers gevraagde gegevens en inlichtingen die
      zij nodig achten voor de uitoefening van hun bevoegdheden en de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1i
  - number: 1i.2
    text: |-
      Onze Minister stelt na overleg met het college een informatiestatuut vast. Het informatiestatuut bevat regels met
      betrekking tot de informatievoorziening tussen Onze Ministers en het college.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1i
  - number: 1i.3
    text: |-
      Het college stelt jaarlijks voor 1 april een verslag op omtrent zijn werkzaamheden, het gevoerde beleid in het
      algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen kalenderjaar.
      Hij biedt dit verslag aan Onze Ministers aan en stelt het algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1i
  - number: 1j
    text: |-
      Onze betrokken Minister kan het college aanwijzingen van algemene aard geven met betrekking tot de uitoefening van
      de aan het college opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1j
  - number: 1k
    text: 'In de Staatscourant worden bekendgemaakt:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1k
  - number: 1k.a
    text: de door het college vastgestelde reglementen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1k
  - number: 1k.b
    text: |-
      de door Onze betrokken Minister gegeven aanwijzingen van algemene aard, voor zover zij te beschouwen zijn
      als algemene regels omtrent de afweging van belangen, de vaststelling van feiten of de uitleg van wettelijke
      voorschriften bij het gebruik van de aan het college toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1k
  - number: 1l.1
    text: |-
      Indien het college de hem bij deze wet opgedragen taken niet of niet naar behoren uitvoert, kan Onze betrokken
      Minister, zo nodig in afwijking van deze wet, daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1l
  - number: 1l.2
    text: |-
      Na het tot stand komen van een voorziening, bedoeld in het eerste lid, draagt Onze betrokken Minister zorg voor
      vervanging van de voorziening door een algemene maatregel van bestuur. De voordracht daartoe wordt Ons zo spoedig
      mogelijk, maar uiterlijk binnen drie maanden na inwerkingtreding van de voorziening gedaan.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1l
  - number: 1m.1
    text: |-
      De [artikelen 10.28 tot en met 10.31 van de Algemene wet bestuursrecht](onbekend) zijn van overeenkomstige
      toepassing op de instemming als bedoeld in de [artikelen 1c, achtste lid][ref1], [1g, tweede lid][ref2], en
      [1h, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel1g
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel1h
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1m
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 1c
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 1g
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0002380
        artikel: 1h
        paragraaf: 1a
  - number: 1m.2
    text: |-
      Indien de instemming wordt onthouden aan de begroting, is het college gerechtigd gedurende ten hoogste zes maanden
      voor iedere maand gedurende welke de instemming wordt onthouden, uitgaven te doen ter grootte van ten hoogste een
      twaalfde deel van de begroting van het voorafgaande jaar waarmee is ingestemd.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel1m
  - number: '2.1'
    text: |-
      Het is verboden een bestrijdingsmiddel af te leveren, voorhanden of in voorraad te hebben, binnen Nederland te
      brengen of te gebruiken, waarvan niet blijkt dat het ingevolge deze wet is toegelaten.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid gelden als toegelaten: bestrijdingsmiddelen, op de verpakking waarvan de naam
      van een toegelaten middel en het nummer van de toelating zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: '2.3'
    text: |-
      Het verbod van het eerste lid geldt niet voor het afleveren of voorhanden of in voorraad hebben elders dan in
      winkels, op markten of op enige andere voor het publiek toegankelijke verkoopplaats van bestrijdingsmiddelen, welke
      kennelijk bestemd zijn voor uitvoer of doorvoer, mits wordt voldaan aan bij of krachtens algemene maatregel van
      bestuur gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: '2.4'
    text: 'Het verbod van het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: 2.4.a
    text: |-
      het voorhanden of in voorraad hebben door een particuliere persoon, voor zover het betreft een niet-
      landbouwbestrijdingsmiddel dat kennelijk bestemd is om door die persoon in een door hem bewoonde ruimte te worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: 2.4.b
    text: |-
      het gebruiken van een niet-landbouwbestrijdingsmiddel door een particuliere persoon in een door hem bewoonde
      ruimte.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: '2.5'
    text: |-
      Het college maakt in de Staatscourant bekend dat een bestrijdingsmiddel, dat niet meer is toegelaten, gedurende
      een bij die bekendmaking bepaalde termijn in afwijking van het in het eerste lid bedoelde verbod nog mag worden
      afgeleverd, gebruikt dan wel in voorraad of voorhanden gehouden. Daarbij kan het voorschriften met betrekking tot
      het gebruik geven als bedoeld in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: '2.6'
    text: |-
      Bij regeling van Onze betrokken Minister kunnen regels worden gesteld met betrekking tot de aflevering of het
      in voorraad of voorhanden hebben van de in het vijfde lid bedoelde bestrijdingsmiddelen. Daarbij kunnen tevens
      regelen worden gesteld omtrent de verwijdering binnen een daarbij te bepalen tijdvak van een niet meer toegelaten
      bestrijdingsmiddel.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: '2.7'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan Onze betrokken Minister, indien er bij het college gegronde
      aanwijzingen bestaan om te oordelen dat een ingevolge een communautaire maatregel toe te laten middel gevaar
      oplevert voor de gezondheid van mens of dier of voor het milieu, tijdelijk bepalen dat de aflevering en het gebruik
      van dat middel verboden is.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2
  - number: 2a.1
    text: |-
      Het is verboden een werkzame stof af te leveren, voorhanden of in voorraad te hebben of binnen Nederland te
      brengen, tenzij het bepaalde in [artikel 4][ref1] in acht is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 4a
        paragraaf: '2'
  - number: 2a.2
    text: 'Het verbod van het eerste lid geldt niet voor een werkzame stof:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2a
  - number: 2a.2.a
    text: |-
      die tot de samenstelling behoort van een ingevolge deze wet toegelaten bestrijdingsmiddel of van een
      bestrijdingsmiddel waarvoor deze wet buiten toepassing is verklaard, of
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2a
  - number: 2a.2.b
    text: |-
      die kennelijk bestemd is om overeenkomstig het bepaalde bij of krachtens [artikel 15][ref1] voor een proef te
      worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel15
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '15'
        paragraaf: '3'
  - number: '3.1'
    text: 'Een bestrijdingsmiddel wordt slechts toegelaten indien:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a
    text: |-
      op grond van de stand van de wetenschappelijke en technische kennis en aan de hand van onderzoek van de gegevens,
      bedoeld in [artikel 4, tweede lid][ref1], met inachtneming van de bij of krachtens [artikel 3][ref2] vastgestelde
      regels en beginselen voor de beoordeling, is vastgesteld dat het bestrijdingsmiddel en zijn omzettingsprodukten,
      wanneer het overeenkomstig het bepaalde bij of krachtens deze wet wordt gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
  - number: 3.1.a.1
    text: voldoende werkzaam is;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.2
    text: geen onaanvaardbare uitwerking heeft op planten of plantaardige produkten;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.3
    text: geen schadelijke uitwerking heeft op de gezondheid van de mens, hetzij direct, hetzij indirect;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.4
    text: geen schadelijke uitwerking heeft op de gezondheid van dieren, hetzij direct, hetzij indirect;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.5
    text: de gezondheid niet schaadt of de veiligheid niet in gevaar brengt van degene die het middel toepast;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.6
    text: |-
      de gezondheid niet schaadt of de veiligheid niet in gevaar brengt van diegenen, die na toepassing van het middel
      door het verrichten van werkzaamheden daarmee of met de residuen daarvan in aanraking komen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.7
    text: de hoedanigheid van voedingsmiddelen niet schaadt;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.8
    text: het welzijn van de te bestrijden gewervelde dieren niet onnodig schaadt;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.9
    text: geen schadelijke uitwerking heeft op het grondwater;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.a.10
    text: |-
      geen voor het milieu onaanvaardbaar effect heeft, waarbij in het bijzonder rekening wordt gehouden met: - de plaats
      waar het bestrijdingsmiddel in het milieu terecht komt en wordt verspreid, met name voor wat betreft besmetting van
      het water, met inbegrip van drink- en grondwater en belasting van de bodem;
        - de gevolgen voor niet-doelsoorten;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.b
    text: |-
      de aard en de hoeveelheid van de werkzame stoffen en zo nodig de in toxicologisch en ecotoxicologisch opzicht
      belangrijke onzuiverheden en hulpstoffen en omzettingsprodukten kunnen worden bepaald overeenkomstig de bij een
      communautaire maatregel vastgestelde methoden, of, voor zover deze methoden niet zijn vastgesteld, door Onze
      betrokken Minister zijn vastgesteld of worden goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.c
    text: |-
      de residuen die het gevolg zijn van het gebruik van het bestrijdingsmiddel overeenkomstig het bepaalde bij of
      krachtens deze wet en die uit toxicologisch of milieu-oogpunt van belang zijn, kunnen worden bepaald door middel
      van methoden die voldoen aan door Onze betrokken Minister gestelde regelen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.1.d
    text: |-
      de fysisch-chemische eigenschappen van het bestrijdingsmiddel worden vastgesteld en voor het gebruik van het
      bestrijdingsmiddel overeenkomstig het bepaalde bij of krachtens deze wet aanvaardbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: '3.2'
    text: 'Een bestrijdingsmiddel wordt voorts slechts toegelaten indien:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3.2.a
    text: |-
      voor zover het een gewasbeschermingsmiddel betreft, anders dan bedoeld in [artikel 1, vijfde lid][ref1], de
      werkzame stof of werkzame stoffen zijn aangewezen bij een communautaire maatregel die de werkzame stoffen vermeldt
      die mogen worden gebruikt als basis voor gewasbeschermingsmiddelen en aan de daarbij gestelde voorwaarden wordt
      voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '1'
        paragraaf: '1'
  - number: 3.2.b
    text: |-
      het gehalte aan werkzame stof of werkzame stoffen en de verdere samenstelling, de kleur, vorm, afwerking,
      verpakking en aanduidingen en vermeldingen op, aan of bij de verpakking voldoen aan door Onze betrokken Minister
      gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3
  - number: 3a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de
      toelatingscriteria als bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], en kunnen beginselen voor de
      beoordeling worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.2
    text: 'De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
  - number: 3a.2.a
    text: |-
      voor zover daarin gestelde regelen betrekking hebben op de toelatingscriteria, bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], ten eerste, ten tweede, ten vierde en ten achtste, Ons gedaan door Onze
      betrokken Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.2.b
    text: |-
      voor zover daarin gestelde regelen betrekking hebben op de toelatingscriteria als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], ten derde en ten zevende, Ons gedaan door Onze Minister van Welzijn,
      Volksgezondheid en Cultuur in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Sociale Zaken en
      Werkgelegenheid;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.2.c
    text: |-
      voor zover daarin gestelde regelen, betrekking hebben op de toelatingscriteria als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], ten derde, ten vijfde en ten zesde, Ons gedaan door Onze Minister van
      Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij,
      Onze Minister van Welzijn, Volksgezondheid en Cultuur en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.2.d
    text: |-
      voor zover daarin gestelde regelen, betrekking hebben op de toelatingscriteria als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], ten negende en ten tiende, Ons gedaan door Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met Onze Minister van Landbouw,
      Natuurbeheer en Visserij, Onze Minister van Welzijn, Volksgezondheid en Cultuur en Onze Minister van Sociale Zaken
      en Werkgelegenheid;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.2.e
    text: |-
      voor zover daarin gestelde regelen betrekking hebben op meerdere toelatingscriteria als bedoeld in
      [artikel 3, eerste lid, onderdeel ][ref1], Ons gedaan door Onze meest betrokken minister in overeenstemming met de
      andere in onderdeel *b*, *c* of *d* genoemde ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.3
    text: |-
      Indien Onze Minister, bedoeld in het tweede lid, overweegt een voordracht te doen tot vaststelling, wijziging
      of intrekking van een algemene maatregel van bestuur als bedoeld in het eerste lid kan hij indien in verband met
      de toelatingscriteria, bedoeld in [artikel 3, eerste lid, onderdeel ][ref1], naar zijn oordeel een onmiddellijke
      voorziening is vereist, in overeenstemming met de andere in het tweede lid genoemde ministers regelen stellen
      overeenkomstig de in overweging zijnde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 3a.4
    text: |-
      Een regeling als bedoeld in het derde lid blijft, behoudens eerdere intrekking, van kracht totdat de daar bedoelde
      algemene maatregel van bestuur, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de regeling.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel3a
  - number: '4.1'
    text: Over de toelating van een bestrijdingsmiddel wordt op aanvraag beslist door het college.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: '4.2'
    text: |-
      Onze betrokken Minister stelt regelen omtrent het indienen van een aanvraag, de bij een aanvraag door de aanvrager
      over te leggen gegevens en zelfstandigheden, de aan de gegevens en zelfstandigheden ten grondslag liggende
      onderzoeksmethoden en omstandigheden en de wijze van behandeling daarvan. Daarbij kan onder meer worden bepaald:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.2.a
    text: dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.2.b
    text: in welke gevallen een aanvraag voor een toelating niet in behandeling wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: '4.3'
    text: |-
      Bij de regeling, bedoeld in het tweede lid, wordt bepaald in welke gevallen en onder welke voorwaarden het
      overleggen van gevraagde gegevens achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: '4.4'
    text: |-
      Degene die het voornemen heeft een aanvraag in te dienen, dient, indien aan de over te leggen gegevens dierproeven
      ten grondslag liggen, alvorens tot dergelijke proeven wordt overgegaan, inlichtingen in te winnen bij het college
      omtrent:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.4.a
    text: |-
      het reeds verleend zijn van een toelating voor het betrokken middel en omtrent de identiteit van degenen die
      daartoe de betrokken gegevens hebben overgelegd, en
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.4.b
    text: |-
      voor zover het een niet bij een communautaire maatregel als bedoeld in [artikel 3, tweede lid, onderdeel ][ref1],
      aangewezen werkzame stof van een middel betreft, het met betrekking tot die stof reeds overgelegd zijn van aan
      dierproeven ontleende gegevens en omtrent de identiteit van degenen die deze gegevens hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: '4.5'
    text: 'Bij ministeriële regeling worden regelen gesteld die onder meer betrekking kunnen hebben op:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.5.a
    text: gegevens die het verzoek om inlichtingen als bedoeld in het vierde lid dienen te vergezellen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.5.b
    text: |-
      de te volgen procedure om tot verwijzing naar of uitwisseling van gegevens als bedoeld in het vierde lid te komen,
      en,
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4.5.c
    text: |-
      de voorwaarden waaronder de gegevens als bedoeld in het vierde lid niet behoeven te worden overgelegd indien
      partijen niet tot overeenstemming komen omtrent de verwijzing naar of uitwisseling van die gegevens; onder deze
      voorwaarden kan zijn begrepen de betaling van een geldsom ter vergoeding aan degenen die die gegevens hebben
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: '4.6'
    text: |-
      De kosten van het onderzoek, voortvloeiende uit een aanvraag, de kosten van voortgezette onderzoekingen na de
      beslissing op een aanvraag, alsmede de kosten voortvloeiende uit de toepassing van het vierde en vijfde lid kunnen
      geheel of gedeeltelijk ten laste van de aanvrager worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: '4.7'
    text: |-
      De toelatinghouder, die in het in [artikel 6, tweede lid][ref1], bedoelde register staat vermeld, is periodiek een
      vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel6
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '6'
        paragraaf: '2'
  - number: '4.8'
    text: |-
      Een aanvraag kan slechts worden gedaan door een binnen de Europese Gemeenschappen permanent gevestigde natuurlijke
      of rechtspersoon die er verantwoordelijk voor is dat het middel wordt afgeleverd.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: '4.9'
    text: Het bepaalde in dit artikel is van overeenkomstige toepassing op de verlenging van een toelating.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4
  - number: 4a.1
    text: |-
      Ten behoeve van de aanwijzing van een werkzame stof bij een communautaire maatregel als bedoeld in
      [artikel 3, tweede lid, onderdeel ][ref1], alsmede de verlenging van die aanwijzing dient een aanvraag te worden
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 4a.2
    text: |-
      [Artikel 4, tweede, zesde, achtste en negende lid][ref1], is van overeenkomstige toepassing op een aanvraag
      als bedoeld in het eerste lid. Onze betrokken Minister stelt daarbij voorts regelen met betrekking tot de door
      de aanvrager aan de bevoegde instanties van de andere Lid-Staten van de Europese Gemeenschappen alsmede aan de
      Commissie van de Europese Gemeenschappen te zenden gegevens en de wijze waarop dit dient te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: 4a.3
    text: |-
      Onze betrokken Minister kan regelen stellen met betrekking tot de verstrekking door toelatinghouders van gegevens
      met betrekking tot werkzame stoffen aan de in het tweede lid genoemde instanties en aan de Commissie van de
      Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4a
  - number: 4a.4
    text: |-
      Ten behoeve van het anders dan op aanvraag als bedoeld in het eerste lid aanwijzen van een werkzame stof bij
      een communautaire maatregel als bedoeld in [artikel 3, tweede lid, onderdeel ][ref1], het herbeoordelen van die
      aanwijzing alsmede het verlengen van die aanwijzing, kan Onze betrokken Minister bepalen dat de kosten verbonden
      aan de beoordeling van die werkzame stof geheel of gedeeltelijk ten laste worden gebracht van de kennisgevers als
      bedoeld in een communautaire maatregel van die werkzame stof of van een gewasbeschermingsmiddel waarin die werkzame
      stof wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 4b.1
    text: |-
      De bedragen, gelden en vergoedingen als bedoeld in de [artikelen 4][ref1], [4a][ref2], [6][ref3] en [15][ref4]
      worden met inachtneming van het bepaalde krachtens het tweede lid door het college vastgesteld en in de
      Staatscourant bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel15
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 4a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '15'
        paragraaf: '3'
  - number: 4b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake bedragen, gelden en
      vergoedingen als bedoeld in de [artikelen 4][ref1], [4a][ref2], [6][ref3] en [15][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel15
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 4a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '15'
        paragraaf: '3'
  - number: 4b.3
    text: De tarieven behoeven de goedkeuring van Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4b
  - number: 4b.4
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel4b
  - number: '5.1'
    text: |-
      De toelating van een bestrijdingsmiddel geldt voor een in het besluit tot toelating te bepalen termijn van ten
      hoogste tien jaren. De toelating kan één of meerdere malen met ten hoogste tien jaren worden verlengd indien is
      gebleken dat nog steeds aan de voorwaarden voor toelating is voldaan. Zonodig kan de toelating worden verlengd voor
      de periode die met de beoordeling van de aanvraag tot verlenging gemoeid is.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
  - number: '5.2'
    text: |-
      Bij de toelating worden voorschriften gegeven omtrent de doeleinden waarvoor het middel uitsluitend dan wel
      niet gebruikt mag worden, alsmede, waar mogelijk, omtrent de toepassing van de beginselen van de geïntegreerde
      bestrijding, en kunnen voorschriften worden gegeven welke onder meer betrekking hebben op de tijden en plaatsen
      waarop, de klimatologische omstandigheden waaronder, de doseringen waarin, de wijze waarop en de technische
      hulpmiddelen waarmede het middel uitsluitend dan wel niet gebruikt mag worden, alsmede op de bij het gebruik in
      acht te nemen veiligheidstermijnen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
  - number: '5.3'
    text: |-
      Bij de toelating kunnen nadere voorschriften worden gegeven omtrent de samenstelling, kleur, vorm, afwerking,
      verpakking en aanduidingen en vermeldingen op, aan of bij de verpakking van het bestrijdingsmiddel.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
  - number: '5.4'
    text: |-
      Bij de toelating kan worden bepaald, dat het bestrijdingsmiddel uitsluitend mag worden afgeleverd aan en gebruikt
      door personen of rechtspersonen, behorende tot een daarbij aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
  - number: '5.5'
    text: |-
      Het college kan, hetzij op een met redenen omkleed schriftelijk verzoek van de toelatinghouder, hetzij in bij
      algemene maatregel van bestuur vast te stellen gevallen, de ingevolge dit artikel gestelde voorschriften wijzigen
      met ingang van een bij die wijziging aan te geven tijdstip. Alvorens tot wijziging van de voorschriften te
      besluiten, stelt het college de toelatinghouder binnen een daarvoor aangegeven termijn in de gelegenheid zijn
      zienswijze omtrent de voorgenomen wijziging en het tijdstip van ingang daarvan kenbaar te maken en kan hij hem
      verzoeken aanvullende informatie te verschaffen. [Artikel 4, derde en vierde lid][ref1], is van overeenkomstige
      toepassing op de op verzoek of anders dan op verzoek te verstrekken gegevens. Indien is overgegaan tot het
      verrichten van dierproeven zonder dat daaraan voorafgaand de bedoelde inlichtingen zijn ingewonnen, worden de uit
      die dierproeven verkregen gegevens door het college bij de beslissing buiten beschouwing gelaten, tenzij zij leiden
      tot een inperking van de toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: '5.6'
    text: |-
      Het college kan, voor zover het gewasbeschermingsmiddelen betreft, op aanvraag van wetenschappelijke instanties,
      lichamen, organisaties en instellingen die werkzaamheden verrichten of mede verrichten op het gebied van de
      landbouw dan wel van organisaties van gebruikers van gewasbeschermingsmiddelen onder nader door Onze betrokken
      Minister gestelde regelen, de doeleinden waarvoor het middel gebruikt mag worden, bedoeld in het tweede lid,
      uitbreiden.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
  - number: '5.7'
    text: |-
      Het bepaalde in [artikel 4, tweede tot en met zesde, achtste en negende lid][ref1], is van overeenkomstige
      toepassing op een aanvraag als bedoeld in het zesde lid, met dien verstande dat de aanvrager niet voor de
      aflevering verantwoordelijk behoeft te zijn. In het geval het college overweegt een wijziging aan te brengen in de
      uitbreiding, bedoeld in het zesde lid, is het bepaalde in het vijfde lid, met uitzondering van de eerste volzin,
      van overeenkomstige toepassing ten aanzien van de in het zesde lid bedoelde instanties, lichamen, organisaties en
      instellingen, met dien verstande dat ook de toelatinghouder bij die procedure wordt betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: 5a.1
    text: 'Onze betrokken Minister kan bij in de *Staatscourant* bekend te maken regeling voorschriften geven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.1.a
    text: |-
      het in acht nemen van veiligheidstermijnen bij het oogsten van met een bestrijdingsmiddel behandelde planten of bij
      het in het verkeer brengen van met een bestrijdingsmiddel behandelde planten of delen daarvan;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.1.b
    text: |-
      het in acht nemen van veiligheidstermijnen bij het in het verkeer brengen van voortbrengselen van met een
      bestrijdingsmiddel behandelde dieren of bij het slachten van zodanige dieren;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.1.c
    text: het gebruiken van met een bestrijdingsmiddel behandelde planten of delen van planten;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.1.d
    text: het telen van gewassen op met een bestrijdingsmiddel behandelde grond;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.1.e
    text: het gebruiken van met een bestrijdingsmiddel behandeld water;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.1.f
    text: |-
      het betreden onderscheidenlijk gebruiken van met een bestrijdingsmiddel behandelde ruimten, oppervlakken en
      goederen, dan wel van ruimten waarin zich behandelde goederen bevinden of bevonden hebben.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.2
    text: |-
      Ten aanzien van een bestrijdingsmiddel, waarop de in het vorige lid bedoelde regeling geen betrekking heeft, kunnen
      bij de toelating één of meer voorschriften van die regeling van toepassing worden verklaard. Dit wordt bekend
      gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.3
    text: |-
      Degene die een bestrijdingsmiddel ten aanzien waarvan een voorschrift geldt, als bedoeld in de vorige leden, heeft
      gebruikt met betrekking tot in het eerste lid bedoelde zelfstandigheden waarvan een ander het genot heeft, is
      verplicht omtrent dat gebruik de ander, onder vermelding van de naam, de werkzame stof en het nummer van toelating
      van het bestrijdingsmiddel, zodanig op de hoogte te stellen als voor deze nodig is om vorenbedoeld voorschrift
      te kunnen naleven. Het in de vorige volzin bepaalde is van overeenkomstige toepassing op degene die het genot van
      zelfstandigheden als daar bedoeld aan een ander overdraagt.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: 5a.4
    text: |-
      Behoudens tegenbewijs wordt men geacht niet aan de in het derde lid bedoelde verplichting te hebben voldaan, voor
      zover dit niet blijkt uit een geschrift, ondertekend door degene aan wie de inlichtingen moesten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel5a
  - number: '6.1'
    text: Van een toelating wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel6
  - number: '6.2'
    text: |-
      Het college draagt zorg, dat van de toegelaten bestrijdingsmiddelen aantekening wordt gehouden in een register dat
      volgens door Onze betrokken Minister te stellen regelen wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel6
  - number: '6.3'
    text: |-
      Op aanvraag van de in het register vermelde fabrikant, importeur of handelaar en tegen betaling van een bedrag
      worden wijzigingen in het register aangetekend.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel6
  - number: '6.4'
    text: Van de wijziging wordt aan de belanghebbenden een bewijs verstrekt en wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel6
  - number: '7.1'
    text: |-
      Het college trekt een toelating als bedoeld in [artikel 4][ref1] in, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: 7.1.a
    text: |-
      niet of niet meer wordt voldaan aan het bepaalde bij of krachtens de [artikelen 3][ref1] en [3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
  - number: 7.1.b
    text: |-
      onjuiste of misleidende informatie is verstrekt met betrekking tot de gegevens op grond waarvan een toelating als
      bedoeld in [artikel 4][ref1] is verleend of


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: 7.1.c
    text: zulks noodzakelijk is ter uitvoering van een communautaire maatregel.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
  - number: '7.2'
    text: |-
      Het college trekt een toelating als bedoeld in [artikel 4][ref1] in, indien de toelatinghouder hiertoe een aanvraag
      indient.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: '7.3'
    text: Een besluit op grond van het eerste of tweede lid wordt bekend gemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
  - number: '7.4'
    text: |-
      Het besluit vermeldt de datum met ingang waarvan de intrekking van kracht wordt. De datum wordt niet vroeger
      gesteld dan zes maanden na de datum van het besluit, tenzij bijzondere omstandigheden onmiddellijke intrekking
      noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
  - number: '7.5'
    text: |-
      Een toelating kan tijdelijk worden ingetrokken, indien het college gegronde aanwijzingen heeft dat het
      bestrijdingsmiddel een gevaar oplevert voor de gezondheid van mens of dier of voor het milieu. Het bepaalde in het
      derde en vierde lid is van overeenkomstige toepassing op de tijdelijke intrekking.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
  - number: '7.6'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], is het toegestaan een bestrijdingsmiddel, waarvan de toelating
      tijdelijk is ingetrokken, voorhanden of in voorraad te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel2
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '2'
        paragraaf: '2'
  - number: '7.7'
    text: |-
      [Artikel 4, derde en vierde lid][ref1], is van overeenkomstige toepassing op de op verzoek of anders dan op verzoek
      te verstrekken gegevens. Indien is overgegaan tot het verrichten van dierproeven zonder dat daaraan voorafgaand
      de bedoelde inlichtingen zijn ingewonnen, worden de uit die dierproeven verkregen gegevens door het college bij de
      beslissing buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
  - number: '8'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel8
  - number: '9.1'
    text: Op verzoek van Onze betrokken Minister wordt een bestrijdingsmiddel door het college ambtshalve toegelaten.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9
  - number: '9.2'
    text: |-
      Aan een toelating ingevolge het eerste lid kunnen voorschriften, als bedoeld in [artikel 5, tweede lid][ref1],
      worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Aan een toelating ingevolge het eerste lid kunnen nadere voorschriften, als bedoeld in
      [artikel 5, derde en vierde lid][ref1], worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: '9.4'
    text: |-
      Een besluit tot ambtshalve toelating, tot wijziging van de in het tweede en derde lid bedoelde voorschriften en tot
      intrekking van de toelating wordt in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9
  - number: '9.5'
    text: |-
      Degene die een ingevolge het eerste lid toegelaten bestrijdingsmiddel bereidt of invoert, is verplicht hiervan,
      telkens binnen 8 dagen nadat hij in enig kalenderjaar voor de eerste maal een hoeveelheid van het middel heeft
      afgeleverd, mededeling te doen overeenkomstig door Onze Ministers bij in de *Staatscourant* bekend te maken
      regeling gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9
  - number: 9a.1
    text: |-
      De toelatinghouder alsmede de instanties, lichamen, organisaties of instellingen waarvan het verzoek als bedoeld
      in [artikel 5, zesde lid][ref1], is toegewezen, zijn verplicht terstond mededeling aan het college te doen van alle
      nieuwe gegevens die zij verkrijgen met betrekking tot de mogelijke gevaarlijke gevolgen van een bestrijdingsmiddel
      of van de residuen van een werkzame stof voor de gezondheid van mens of dier of voor het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: 9a.2
    text: |-
      De toelatinghouder alsmede de in het eerste lid bedoelde instanties, lichamen, organisaties of instellingen zijn
      onverminderd het eerste lid tevens verplicht de gegevens, bedoeld in het eerste lid en voor zover deze betrekking
      hebben op gewasbeschermingsmiddelen, met uitzondering van die bedoeld in artikel I, vijfde lid, terstond te melden
      aan de bevoegde instanties van de andere Lid-Staten van de Europese Gemeenschappen alsmede aan de Commissie van de
      Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9a
  - number: 9a.3
    text: |-
      Onze betrokken Minister kan regelen stellen omtrent de wijze waarop en de instanties waaraan een mededeling als
      bedoeld in het eerste of tweede lid dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9a
  - number: 9a.4
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat andere dan de in het eerste lid bedoelde gegevens dienen
      te worden medegedeeld. Het derde lid is van overeenkomstige toepassing op deze gegevens.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel9a
  - number: '10.1'
    text: |-
      Het is verboden te handelen in strijd met de krachtens de [artikelen 5, tweede, derde, vierde en zesde lid][ref1],
      [5][ref2], en [9, tweede en derde lid][ref3], vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel9
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 5a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '9'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Het is een ieder verboden van een door Onze betrokken Minister bij in de *Staatscourant* bekend te maken regeling
      aangewezen bestrijdingsmiddel een hoeveelheid voorhanden of in voorraad te hebben, tenzij die hoeveelheid bestemd
      is voor een gebruik waarvoor het middel is toegelaten of ter aflevering.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel10
  - number: '10.3'
    text: |-
      Het verbod van het eerste lid geldt niet voor een particuliere persoon, voor zover het betreft het gebruiken van
      een bestrijdingsmiddel in een door hem bewoonde ruimte.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel10
  - number: '11'
    text: |-
      Het is verboden toegelaten bestrijdingsmiddelen af te leveren, en, voor zover ze voor de handel bestemd
      zijn, voorhanden of in voorraad te hebben, indien de krachtens artikel 5, tweede lid, of krachtens
      [artikel 9, tweede lid][ref1], voor het gebruik gegeven voorschriften niet op de daarbij voorgeschreven wijze
      op, aan of bij de verpakking zijn vermeld, en indien het gehalte aan werkzame stof en de verdere samenstelling
      kleur, vorm, afwerking, verpakking, aanduidingen of vermeldingen op, aan of bij de verpakking niet voldoen
      aan de krachtens [artikel 3, tweede lid, onderdeel ][ref2], gegeven algemene voorschriften, of de krachtens
      [artikel 5, derde lid][ref3], of [artikel 9, derde lid][ref4], gegeven nadere voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel9
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '9'
        paragraaf: '2'
  - number: 11a
    text: |-
      Het aanbevelen of aanprijzen van een niet ingevolge deze wet toegelaten bestrijdingsmiddel of van enig gebruik van
      een bestrijdingsmiddel in strijd met het bij of krachtens deze wet bepaalde, is verboden.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel11a
  - number: '12.1'
    text: |-
      Het is verboden aan personen beneden de leeftijd van zestien jaren bestrijdingsmiddelen af te leveren, voor welke
      krachtens [artikel 3, tweede lid, onderdeel ][ref1], [artikel 5, derde lid][ref2], of [artikel 9, derde lid][ref3],
      is voorgeschreven, dat de giftigheid moet worden aangeduid door middel van een doodshoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel9
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '9'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Het is verboden de in het vorige lid bedoelde bestrijdingsmiddelen af te leveren aan personen, die niet in
      het bezit zijn van een daartoe door Onze betrokken Minister aangewezen legitimatiebewijs, tenzij degene aan
      wie wordt afgeleverd aantoont, dat hij de handel in bestrijdingsmiddelen uitoefent. Aangewezen zullen worden
      legitimatiebewijzen, waaruit blijkt, dat de houder een beroep uitoefent, hetwelk het gebruik van in dit artikel
      bedoelde bestrijdingsmiddelen meebrengt.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel12
  - number: '12.3'
    text: |-
      Het is aan anderen dan de houder der in het tweede lid bedoelde legitimatiebewijzen verboden de in het eerste lid
      bedoelde bestrijdingsmiddelen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel12
  - number: '12.4'
    text: |-
      Het in het tweede en derde lid bepaalde geldt niet ten aanzien van door Onze betrokken Minister bij in de
      *Staatscourant* bekend te maken regeling aangewezen middelen ter bestrijding van schadelijke knaagdieren, waarvan
      uit een bij die regeling vastgestelde aanduiding op de verpakking blijkt, dat deze voor gebruik door particuliere
      personen zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel12
  - number: '13.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften onderscheidenlijk nadere voorschriften
      worden gegeven betreffende het afleveren, het voorhanden of in voorraad hebben, het vervoeren na aflevering
      aan de kleinhandel anders dan in een vervoeronderneming, het vervoeren door de gebruiker, en het gebruiken
      van bestrijdingsmiddelen, alsmede omtrent het verwijderen en vernietigen van bestrijdingsmiddelen, resten
      van bestrijdingsmiddelen en ledige verpakkingen. Voorzover de in de vorige volzin bedoelde voorschriften het
      verwijderen van de daarbedoelde zelfstandigheden betreffen kunnen zij mede betrekking hebben op de afgifte van die
      zelfstandigheden aan, het vervoer naar en de in ontvangstneming door personen, behorende tot een daarbij aangewezen
      categorie.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: '13.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur kunnen regels worden gesteld
      betreffende het gebruik van bestrijdingsmiddelen in verband met de veiligheid en de gezondheid bij de arbeid. Deze
      regels kunnen in ieder geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.2.a
    text: de verdamping of verspreiding van bestrijdingsmiddelen op de werkplek;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.2.b
    text: de omgang met en de opslag van bestrijdingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.2.c
    text: de voorkoming van blootstelling aan bestrijdingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.2.d
    text: kleding, kledingbergplaatsen, kleedruimten, toiletten en wasgelegenheden;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.2.e
    text: persoonlijke beschermingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.2.f
    text: |-
      het registreren, melden of bewaren van gegevens met betrekking tot bestrijdingsmiddelen, het melden van ongevallen
      met bestrijdingsmiddelen of het melden van beroepsziekten in verband met bestrijdingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: '13.3'
    text: |-
      Door Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen onder hem ressorterende ambtenaren zijn
      namens hem bevoegd voorschriften te geven betreffende de uitvoering van een of meer voorschriften als bedoeld in
      het eerste en tweede lid met betrekking tot het vervoer of het gebruik van bestrijdingsmiddelen in verband met de
      arbeid alsmede omtrent het voorhanden hebben van deze middelen en het opbergen van ledige verpakkingen of restanten
      van bestrijdingsmiddelen. Bij de bekendmaking van het voorschrift wordt de termijn gesteld, waarbinnen aan het
      voorschrift moet worden voldaan. Een bezwaarschrift, ingediend tegen het voorschrift, heeft schorsende werking.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: '13.4'
    text: |-
      Een ieder is verplicht ten aanzien van bestrijdingsmiddelen, resten van bestrijdingsmiddelen en ledige
      verpakkingen:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.4.a
    text: |-
      zodanige zorgvuldigheid in acht te nemen dat geen gevaar ontstaat voor de mens dan wel voor dieren of planten
      welker instandhouding gewenst is of voor grond of water, en
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13.4.b
    text: |-
      overigens zodanige zorgvuldigheid in acht te nemen als redelijkerwijs van hem kan worden verlangd om te voorkomen
      dat schade wordt toegebracht aan planten of delen van planten, welke aan anderen toebehoren.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13
  - number: 13a
    text: |-
      Onze betrokken Minister kan regels stellen omtrent het voeren van een administratie en het verstrekken van gegevens
      door toelatinghouders en, voor zover zij geen toelatinghouder zijn, door fabrikanten, importeurs, handelaren en
      gebruikers met betrekking tot de door hen in voorraad gehouden, ontvangen, afgeleverde en gebruikte hoeveelheden
      van aangewezen bestrijdingsmiddelen of groepen van bestrijdingsmiddelen. De regels hebben geen betrekking op
      onderwerpen die uit hoofde van het bepaalde in [artikel 13, tweede lid, aanhef en onderdeel f][ref1], gesteld
      kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel13
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '13'
        paragraaf: '3'
  - number: 13b.1
    text: |-
      Bij algemene maatregel van bestuur kunnen degenen die bestrijdingsmiddelen afleveren waarvan de toelating niet te
      hunnen name is gesteld worden verplicht zich te doen inschrijven in een register.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13b
  - number: 13b.2
    text: |-
      Bij of krachtens een algemene maatregel, bedoeld in het vorige lid, wordt bepaald waar de inschrijving geschiedt,
      en kunnen voorschriften worden gegeven omtrent de inrichting van het register, de wijze van aanmelding ter
      inschrijving, de wijze waarop van de inschrijving kan blijken, de duur van de inschrijving en het vervallen van
      de inschrijving.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13b
  - number: 13b.3
    text: |-
      In geval van toepassing van het eerste lid is het verboden bestrijdingsmiddelen af te leveren aan anderen dan
      degenen die in het register zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13b
  - number: 13b.4
    text: Het verbod, gesteld in het vorige lid, geldt niet voor het afleveren van bestrijdingsmiddelen aan gebruikers.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13b
  - number: 13c.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat arbeid met bestrijdingsmiddelen of categorieën van
      bestrijdingsmiddelen, dan wel arbeid met bestrijdingsmiddelen onder bepaalde omstandigheden, slechts mag worden
      verricht nadat degenen die de arbeid verrichten gezondheidskundig zijn onderzocht. Daarbij kan voorts worden
      bepaald dat dit gezondheidskundig onderzoek na de aanvang van de werkzaamheden met een bestrijdingsmiddel periodiek
      moet worden herhaald.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13c
  - number: 13c.2
    text: |-
      Met betrekking tot het in het eerste lid bedoelde onderzoek kunnen door een daartoe door Onze Minister van Sociale
      Zaken en Werkgelegenheid aangewezen onder hem ressorterende ambtenaar eisen worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13c
  - number: 13c.2.a
    text: de wijze waarop en de termijn waarbinnen het onderzoek moet worden verricht;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13c
  - number: 13c.2.b
    text: de persoon of personen door wie of onder wier leiding het onderzoek moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel13c
  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de veiligheid en de gezondheid van de
      mens en van dieren, welker instandhouding gewenst is, voorschriften worden gegeven betreffende het aanbrengen van
      waarschuwingstekens in verband met het gebruik van bestrijdingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel14
  - number: '15.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven betreffende het afleveren, voorhanden
      of in voorraad hebben en gebruiken van bestrijdingsmiddelen welke als zodanig dan wel voor wat betreft een
      uitbreiding van de toepassingsmogelijkheden kennelijk in een proefstadium verkeren. Daarbij kan worden afgeweken
      van de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel15
  - number: '15.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op behandelingen, uitgevoerd met de in het
      eerste lid bedoelde middelen, voorschriften worden gegeven als bedoeld in [artikel 5][ref1]. Ten aanzien van
      zodanige voorschriften is [artikel 5][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 5a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 5a
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Voor zover krachtens het eerste lid proefnemingen als daar bedoeld slechts na daartoe gedane aanvraag kunnen worden
      toegestaan, kunnen de kosten voortvloeiende uit deze aanvraag geheel of gedeeltelijk ten laste van de aanvrager
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel15
  - number: '16.1'
    text: |-
      Indien op of in eet- of drinkwaren een hoeveelheid van een of meer bestrijdingsmiddelen, bestanddelen daarvan
      of omzettingsprodukten van deze aanwezig is, welke groter is dan bij of krachtens algemene maatregel van bestuur
      is bepaald, worden zij voor de toepassing van [artikel 18, onder ][ref1] in ieder geval aangemerkt als eet- of
      drinkwaren die ongeschikt zijn voor gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel18
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '18'
  - number: '16.2'
    text: |-
      In de krachtens het eerste lid bepaalde hoeveelheid wordt geacht te zijn begrepen een uit anderen hoofde aanwezige
      hoeveelheid van dezelfde stof.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16
  - number: '16.3'
    text: |-
      De krachtens het eerste lid te bepalen hoeveelheid kan worden uitgedrukt in termen van een kenmerkend element, een
      kenmerkende moleculaire groep of een reactieprodukt van de betreffende stof.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16
  - number: 16a.1
    text: |-
      Onze betrokken Minister kan in bijzondere omstandigheden van het bepaalde in de [artikelen 2, eerste lid][ref1], en
      [10, eerste en tweede lid][ref2], vrijstelling of ontheffing verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel10
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '10'
        paragraaf: '3'
  - number: 16a.1.a
    text: |-
      voor zover het gewasbeschermingsmiddelen betreft, anders dan bedoeld in [artikel 1, vijfde lid][ref1], voor ten
      hoogste 120 dagen, indien de plantaardige produktie door onvoorziene, op geen enkele andere wijze te bestrijden
      gevaren wordt bedreigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '1'
        paragraaf: '1'
  - number: 16a.1.b
    text: |-
      voor zover het niet-landbouwbestrijdingsmiddelen betreft, indien de belangen van de volksgezondheid of de
      gezondheid of de veiligheid van degene die een dergelijk middel toepast, dan wel van degene die bij het betreden
      onderscheidenlijk gebruiken van te behandelen ruimten, oppervlakten en goederen, dan wel van ruimten waarin zich te
      behandelen goederen bevinden of bevonden hebben, zulks dringend vereisen;
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16a
  - number: 16a.1.c
    text: |-
      voor zover het gewasbeschermingsmiddelen betreft als bedoeld in [artikel 1, vijfde lid][ref1], wanneer de belangen
      van de landbouw of de belangen, bedoeld in onderdeel *b*, zulks dringend vereisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '1'
        paragraaf: '1'
  - number: 16a.2
    text: |-
      De in het eerste lid bedoelde vrijstelling of ontheffing wordt in ieder geval verleend ter uitvoering van een
      communautaire maatregel met in achtneming van het daarin gestelde.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16a
  - number: 16a.3
    text: |-
      Aan een vrijstelling of ontheffing kunnen voorschriften worden verbonden. Zij kunnen onder beperkingen worden
      verleend en te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16a
  - number: 16b.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ter uitvoering van [artikel 13][ref1] de medewerking worden
      gevorderd van het bestuur van een bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel13
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '13'
        paragraaf: '3'
  - number: 16b.2
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regels
      bij verordening, behoeft deze verordening de goedkeuring van Onze Minister en van Onze Ministers wie het mede
      aangaat, tezamen. Krachtens de verordening genomen besluiten behoeven, voorzover dit bij of krachtens de maatregel,
      bedoeld in het eerste lid, is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel16b
  - number: '17.1'
    text: De opsporingsambtenaar, die een monster van een bestrijdingsmiddel neemt, verpakt en verzegelt dit ter plaatse.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel17
  - number: '17.2'
    text: |-
      Op verlangen van hem, in wiens bezit het bestrijdingsmiddel zich tijdens de monsterneming bevindt, neemt de
      opsporingsambtenaar een tweede monster, hetwelk hij verpakt en verzegeld in diens bezit laat.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel17
  - number: '18.1'
    text: |-
      De ambtenaar, die het monster heeft genomen, stelt dit in handen van de instelling, die voor onderzoek daarvan door
      Onze Minister bij in de *Staatscourant* bekend te maken regeling is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel18
  - number: '18.2'
    text: Het monster wordt zo spoedig mogelijk door de aangewezen instelling onderzocht.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel18
  - number: '18.3'
    text: |-
      Indien de directeur van de aangewezen instelling van mening is, dat de resultaten van het onderzoek aanleiding
      kunnen geven tot het uitlokken van een strafvervolging, doet hij hiervan mededeling aan de ambtenaar, die het
      monster heeft genomen. De uitkomsten van het onderzoek worden als bijlage bij het proces-verbaal gevoegd.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel18
  - number: '19'
    text: |-
      Onze Ministers kunnen bij in de *Staatscourant* bekend te maken regeling regelen geven betreffende de wijze van
      monsterneming, het verpakken en het verzegelen der monsters.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel19
  - number: '21.1'
    text: |-
      Bij gemeentelijke verordening worden geen bepalingen vastgesteld met betrekking tot de onderwerpen waarin deze
      wet voorziet.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel21
  - number: '21.2'
    text: |-
      Bestaande bepalingen van gemeentelijke verordeningen met betrekking tot de onderwerpen waarin deze wet voorziet
      vervallen een jaar na het in werking treden van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel21
  - number: '22.1'
    text: |-
      De verplichting tot geheimhouding op grond van [artikel 2:5 van de Algemene wet bestuursrecht][ref1] geldt niet
      ten aanzien van die bestanddelen van een bestrijdingsmiddel, welke schadelijk zijn voor de mens, of voor dieren of
      planten, welker instandhouding gewenst is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '22.2'
    text: |-
      Indien in een stuk dat ingevolge het bij of krachtens deze wet bepaalde aan Onze betrokken Minister,
      onderscheidenlijk het college, dan wel aan een andere persoon of instelling wordt overgelegd, gegevens voorkomen
      of uit zodanig stuk gegevens kunnen worden afgeleid, waarvan de geheimhouding met het oog op bedrijfsgeheimen
      gerechtvaardigd is, besluit Onze betrokken Minister, onderscheidenlijk het college, op een daartoe strekkend
      schriftelijk verzoek van degene die het stuk overlegt, dat die gegevens geheim worden gehouden. Een zodanig verzoek
      is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel22
  - number: '22.3'
    text: |-
      Onze betrokken Minister stelt regelen met betrekking tot de gegevens waarvoor de verplichting tot geheimhouding
      niet geldt.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel22
  - number: '23.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een communautaire maatregel inzake onderwerpen waarop
      deze wet van toepassing is, regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
  - number: '23.2'
    text: |-
      Bij de regelen, bedoeld in het eerste lid, kan worden afgeweken van het bij deze wet bepaalde inzoverre het
      betreft:
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
  - number: 23.2.a
    text: |-
      de voorwaarden, genoemd in [artikel 3, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 23.2.b
    text: |-
      werkzame stoffen voor bestrijdingsmiddelen als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '1'
        paragraaf: '1'
  - number: 23.2.c
    text: |-
      de invulling van de in onderdeel *a* bedoelde voorwaarden, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
  - number: 23.2.d
    text: |-
      de aanvraag als bedoeld in de [artikelen 4][ref1], [4][ref2] of [5, vijfde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 4a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: 23.2.e
    text: |-
      de duur van de toelating alsmede van de verlenging daarvan als bedoeld in [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: 23.2.f
    text: |-
      de datum van 26 juli 2003, genoemd in [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel25
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '25'
        paragraaf: '7'
  - number: '24.1'
    text: |-
      [Artikel 3, tweede lid, onderdeel ][ref1], is niet van toepassing op gewasbeschermingsmiddelen die werkzame stoffen
      bevatten die op 25 juli 1993 nog niet eerder werden afgeleverd en die niet bij de in dat artikelonderdeel bedoelde
      communautaire maatregel zijn aangewezen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: 24.1.a
    text: |-
      voldaan is aan de regelen, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 4a
        paragraaf: '2'
  - number: 24.1.b
    text: |-
      door het college wordt vastgesteld dat: - de residuen van de betreffende werkzame stoffen geen schadelijke
      uitwerking hebben op de gezondheid van mens en dier of op het grondwater en geen voor het milieu onaanvaardbaar
      effect, en deze residuen, voor zover zij in toxicologisch opzicht of uit milieu-oogpunt van belang zijn, door
      middel van algemeen gebruikte methoden kunnen worden gemeten;
        - het gebruik van gewasbeschermingsmiddelen na een toepassing die in overeenstemming is met de goede
      gewasbeschermingspraktijken, geen schadelijke uitwerking op de gezondheid van mens en dier en geen voor het milieu
      onaanvaardbaar effect heeft als bedoeld in [artikel 3, eerste lid, onderdeel ][ref1], ten derde tot en met ten
      tiende, en
        - het gewasbeschermingsmiddel voldoet aan de overige voorwaarden voor toelating, bedoeld in de
      [artikelen 3, eerste en tweede lid][ref2], en [3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
  - number: '24.2'
    text: |-
      In geval van een toelating waarbij toepassing is gegeven aan het eerste lid, geldt deze voor een termijn van ten
      hoogste drie jaren. Indien de termijn van toelating korter is dan drie jaren, kan deze één of meerdere malen worden
      verlengd met dien verstande, dat de totale duur van de termijn niet langer zal zijn dan drie jaren, tenzij ter
      uitvoering van een communautaire maatregel een langere termijn kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel24
  - number: '24.3'
    text: |-
      Het college kan een toelating waarbij toepassing is gegeven aan het eerste lid intrekken. Artikel 7 is van
      overeenkomstige toepassing op een zodanige intrekking.
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel24
  - number: '25.1'
    text: |-
      [Artikel 3, tweede lid, onderdeel ][ref1], is tot 26 juli 2003 evenmin van toepassing op gewasbeschermingsmiddelen
      die uitsluitend werkzame stoffen bevatten die niet bij de in dat artikelonderdeel bedoelde communautaire maatregel
      zijn aangewezen en reeds vóór 26 juli 1993 werden afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Onverminderd het bepaalde in de [artikelen 5][ref1] en [7][ref2] trekt het college ter uitvoering van
      een communautaire maatregel met betrekking tot een bestrijdingsmiddel als bedoeld in het eerste lid een
      toelating, waarbij toepassing is gegeven aan het eerste lid, in, of wijzigt het de voorschriften als bedoeld in
      [artikel 5, tweede lid][ref3]. [Artikel 7, derde en vierde lid][ref4], zijn op de intrekking van de toelating en
      [artikel 5, vijfde lid, laatste zin][ref5], is op de wijziging van de voorschriften van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
        artikel: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002380
        artikel: '5'
        paragraaf: '2'
  - number: 25c.1
    text: |-
      Een gewasbeschermingsmiddel waarvan op grond van de stand van de wetenschappelijke en technische kennis en,
      met inachtneming van de regelen of beginselen, bedoeld in [artikel 3a][ref1], aan de hand van onderzoek van de
      gegevens, bedoeld in [artikel 4, tweede lid][ref2], is vastgesteld dat het middel en zijn omzettingsproducten,
      wanneer het overeenkomstig het bepaalde bij of krachtens deze wet wordt gebruikt, voor een doeleind uitsluitend
      niet voldoet aan de toelatingscriteria, bedoeld in [artikel 3, eerste lid, onderdeel a][ref3], ten negende en ten
      tiende, kan, in afwijking van de terzake bij of krachtens de [artikelen 3][ref4] en [3a][ref5] gestelde regelen of
      beginselen, voor dat doeleind worden toegelaten indien is vastgesteld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002380/2002-12-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 3a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002380
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002380
