preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het voor de kwaliteit van het onderwijs, voor de kwalificatiestructuur
    en voor een moderne en open arbeidsorganisatie op het gebied van het primair en voortgezet onderwijs alsmede op
    het gebied van de educatie en het beroepsonderwijs wenselijk is, bekwaamheidseisen voor onderwijsgevenden vast te
    stellen, mogelijk te maken dat dergelijke eisen eveneens worden vastgesteld voor nauw met het onderwijs verbonden
    leidinggevende en ondersteunende werkzaamheden en te bevorderen dat de betrokkenen hun bekwaamheid onderhouden;

    dat het tevens noodzakelijk is, de onderwerpen uit de Interimwet zij-instroom leraren primair en voortgezet
    onderwijs te regelen in de desbetreffende onderwijswetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016944/2020-04-01#ArtikelAanhef
articles:
  - number: XI
    text: |-
      1 Degene die op het tijdstip van inwerkingtreding van de bekwaamheidseisen voor leraren en docenten in het bezit
      is van een bewijs van bekwaamheid tot het geven van onderwijs, beroepsonderwijs of educatie ingevolge de wettelijke
      voorschriften zoals luidend op de dag voor dat tijdstip van inwerkingtreding, wordt bij inwerkingtreding van die
      eisen aangemerkt als aan de van toepassing zijnde bekwaamheidseisen te voldoen.

      2 Bij ministeriële regeling kunnen regels van overgangsrechtelijke aard worden vastgesteld ten aanzien van degenen
      die op het tijdstip van inwerkingtreding van de bekwaamheidseisen voor leraren en docenten, ingevolge de wettelijke
      voorschriften zoals luidend op de dag voor dat tijdstip van inwerkingtreding bevoegd zouden zijn tot het geven van
      onderwijs, beroepsonderwijs of educatie zonder in het bezit te zijn van een bewijs van bekwaamheid daarvoor.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van werkzaamheden van onderwijskundig-
      leidinggevende aard of onderwijsondersteunende werkzaamheden, voor zover daarvoor bekwaamheidseisen zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016944/2020-04-01#ArtikelXI
  - number: XX
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016944/2020-04-01#ArtikelXX
  - number: XXI
    text: 'Deze wet wordt aangehaald als: Wet op de beroepen in het onderwijs.'
    url: https://wetten.overheid.nl/BWBR0016944/2020-04-01#ArtikelXXI
