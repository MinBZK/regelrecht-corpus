  - number: '11'
    text: |-
      1 De dienst Speciale interventies heeft, indien redelijkerwijs mag worden aangenomen dat levensbedreigende
      omstandigheden tegen de politie of anderen dreigen, onder meer tot taak:

      a. het verrichten van planmatige aanhoudingen;

      b. het bewaken en beveiligen van politie-infiltranten;

      c. het assisteren bij het bewaken en beveiligen van het transport van getuigen, verdachten of gedetineerden;

      d. het assisteren bij het bewaken en beveiligen van objecten;

      e. andere werkzaamheden waarvoor toestemming is verkregen van de minister.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel11
  - number: '12'
    text: |-
      1 Het landelijk team forensische opsporing is ondergebracht bij de dienst Operationele samenwerking. Dit team
      verricht de volgende werkzaamheden:

      a. het verlenen van assistentie bij grootschalig of bijzonder forensisch onderzoek;

      b. het verlenen van assistentie bij berging en identificatie van slachtoffers bij rampen of in die gevallen waarin
      identificatie van slachtoffers technisch bijzondere moeilijkheden oplevert.

      2 De korpschef houdt ambtenaren van politie beschikbaar ten behoeve van het landelijk team forensische opsporing.
      Zij zijn direct inzetbaar.

      3 De ambtenaren van politie, bedoeld in het tweede lid, worden door de korpschef aangewezen, waarbij wordt
      aangegeven welke functie de betrokken ambtenaar in het landelijk team forensische opsporing zal vervullen.

      4 In het beheersplan wordt opgenomen welke functies zijn opgenomen in het landelijk team forensische opsporing.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel12
  - number: '13'
    text: |-
      De regionale eenheden beschikken ten behoeve van de uitoefening van de recherchefunctie over voorzieningen op het
      gebied van:

      a. tactische recherche;

      b. technische recherche;

      c. financiële recherche;

      d. digitale recherche;

      e. informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel13
  - number: '14'
    text: |-
      1 De regionale eenheden beschikken elk ten minste over een onderdeel dat is belast met het, ten behoeve van de
      recherchefunctie, verwerken van gegevens die noodzakelijk zijn voor de opsporing van misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1].

      2 De onderdelen, bedoeld in het eerste lid, houden, zelfstandig of samen met andere onderdelen, bedoeld in het
      eerste lid, ten behoeve van de recherchefunctie een gegevensbestand voor de verwerking van politiegegevens, bedoeld
      in [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref2].

      3 De regionale eenheden beschikken zelfstandig of samen met één of meer andere regionale eenheden over één of meer
      eenheden die zijn belast met de uitvoering van een bevel tot observatie als bedoeld in de [artikelen 126g][ref3] en
      [126o van het Wetboek van Strafvordering][ref4].


