  - number: '25'
    text: |-
      1 De korpschef stelt ten behoeve van de toezicht op de arrestantenzorg voor iedere regionale eenheid een commissie
      van toezicht op de arrestantenzorg in, bestaande uit ten minste vijf onafhankelijke leden.

      2 De commissies van toezicht op de arrestantenzorg hebben in ieder geval tot taak:

      a. toezicht te houden op de arrestantenzorg in de politiecellen en politiecellencomplexen in de regionale eenheid,
      waaronder tevens begrepen de politiecellen en politiecellencomplexen van de Landelijke eenheid gelegen in het
      gebied van de regionale eenheid;

      b. jaarlijks rapport uit te brengen aan de korpschef over haar werkzaamheden;

      c. gevraagd en ongevraagd aan de korpschef advies uit te brengen en inlichtingen te geven omtrent aangelegenheden
      betreffende de arrestantenzorg.

      3 De korpschef stelt regels vast over de voor een adequate taakvervulling benodigde bevoegdheden, de samenstelling,
      de werkwijze van en de jaarlijkse verslaglegging door de commissies van toezicht op de arrestantenzorg alsook over
      de benoeming, het ontslag en de vergoeding van haar leden.

      4 Bij de samenstelling van de commissies van toezicht op de arrestantenzorg wordt rekening gehouden met de
      benodigde maatschappelijke en bestuurlijke deskundigheid en ervaring van de leden.

      5 De korpschef rapporteert, mede op basis van de door de commissies van toezicht op de arrestantenzorg jaarlijks
      aan hem gezonden rapporten, jaarlijks aan de minister over de samenstelling van de commissies van toezicht op de
      arrestantenzorg en over hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel25
