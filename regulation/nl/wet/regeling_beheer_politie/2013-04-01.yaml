  - number: '24'
    text: |-
      1 De korpschef wijst de ambtenaren van politie aan die worden belast met de leiding van de politiecellencomplexen
      en het toezicht op de ingeslotenen.

      2 Met inachtneming van de [artikelen 26][ref1], [27][ref2] en
      __REF002___________________________________________________________________________________________________________
      ________ stelt de korpschef een instructie vast voor het personeel, niet zijnde ambtenaren van politie, dat is
      belast met de zorg voor ingeslotenen.


