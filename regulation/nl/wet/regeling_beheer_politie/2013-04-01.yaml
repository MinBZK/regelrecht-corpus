  - number: '10'
    text: |-
      1 Bij de dienst Specialistische recherche toepassingen zijn infiltratieteams en een team operationele ondersteuning
      ondergebracht.

      2 De infiltratieteams zijn belast met de uitvoering van een bevel tot infiltratie
      als bedoeld in [artikel 126h, eerste lid][ref1], [artikel 126p, eerste lid][ref2], of
      [artikel 126ze, eerste lid, van het Wetboek van Strafvordering][ref3] en met de begeleiding
      van personen die op grond van [artikel 126w, eerste lid][ref4], [126x, eerste lid][ref5], of
      [artikel 126zu, eerste lid, van het Wetboek van Strafvordering][ref6] bijstand verlenen aan de opsporing.

      3 De infiltratieteams kunnen worden belast met:

      a. de uitvoering van een bevel tot pseudo-koop of pseudo-dienstverlening als
      bedoeld in [artikel 126i, eerste lid][ref7], of [artikel 126q, eerste lid][ref8],
      [126zd, eerste lid, onder b van het Wetboek van Strafvordering][ref9] en met de begeleiding van
      personen die op grond van [artikel 126ij, eerste lid][ref10], [artikel 126z, eerste lid][ref11], of
      [artikel 126zt, eerste lid, onder a, van het Wetboek van Strafvordering][ref12] bijstand verlenen aan de opsporing;

      b. de uitvoering van een bevel tot stelselmatige inwinning van informatie als bedoeld
      in [artikel 126j, eerste lid][ref13], of [artikel 126qa, eerste lid][ref14], of
      [artikel 126zd, eerste lid, onder c, van het Wetboek van Strafvordering][ref15] en
      met de begeleiding van personen die op grond van [artikel 126v, eerste lid][ref16], en
      [artikel 126zt, eerste lid, onder b, van het Wetboek van Strafvordering][ref17] bijstand verlenen aan de opsporing.

      4 Het team operationele ondersteuning heeft tot taak:

      a. de selectie en de opleiding van kandidaat-leden van een infiltratieteam;

      b. algemene en bijzondere ondersteuning in het kader van de taakuitvoering van infiltratieteams, waaronder het
      verzorgen van tijdelijke identiteiten en fictieve rechtspersonen;

      c. de coördinatie van internationale rechtshulpverzoeken tot infiltratie, pseudokoop of pseudodienstverlening of
      stelselmatige inwinning van informatie;

      d. de registratie van leden van een infiltratieteam alsmede de registratie van bevelen tot infiltratie.


