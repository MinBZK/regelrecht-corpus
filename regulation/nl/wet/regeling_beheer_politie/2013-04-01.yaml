      genaamd: Landelijke eenheid.

      2 Er zijn twee ondersteunende diensten als bedoeld in [artikel 25, eerste lid, onder c van de Politiewet 2012][ref2],
      genaamd: Politiedienstencentrum en Staf korpsleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
