        artikel: '28'
  - number: '4'
    text: |-
      1 De regionale eenheden worden als volgt aangeduid:

      a. de regionale eenheid in het arrondissement Noord-Nederland als: de regionale eenheid Noord-Nederland;.

      b. de regionale eenheid in het arrondissement Oost-Nederland als: de regionale eenheid Oost-Nederland;

      c. de regionale eenheid in het arrondissement Midden-Nederland als: de regionale eenheid Midden-Nederland;

      d. de regionale eenheid in het arrondissement Noord-Holland als: de regionale eenheid Noord-Holland;

      e. de regionale eenheid in het arrondissement Amsterdam als: de regionale eenheid Amsterdam;

      f. de regionale eenheid in het arrondissement Den Haag als: de regionale eenheid Den Haag;

      g. de regionale eenheid in het arrondissement Rotterdam als: de regionale eenheid Rotterdam;

      h. de regionale eenheid in het arrondissement Zeeland-West-Brabant als: de regionale eenheid Zeeland-West-Brabant;

      i. de regionale eenheid in het arrondissement Oost-Brabant als: de regionale eenheid Oost-Brabant;

      j. de regionale eenheid in het arrondissement Limburg als: de regionale eenheid Limburg.

      2 De regionale eenheden zijn onderverdeeld in districten en functionele onderdelen. De districten zijn
      onderverdeeld in basisteams.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel4
  - number: '5'
    text: |-
      1 De Landelijke eenheid bestaat uit de volgende diensten:

      a. de dienst Nationale recherche;

      b. de dienst IPOL;

      c. de dienst Specialistische recherche toepassingen;

      d. de dienst Speciale interventies;

      e. de dienst Verkeerspolitie;

      f. de dienst Waterpolitie;

      g. de dienst Spoorwegpolitie;

      h. de dienst Operationele samenwerking;

      i. de dienst Koninklijke en diplomatieke beveiliging.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel5
  - number: '6'
    text: |-
      De dienst Nationale recherche heeft tot taak:

      a. het binnen vooraf door het bevoegd gezag vastgestelde aandachtsgebieden verrichten van onderzoeken naar zware en
      georganiseerde criminaliteit die naar aard of organisatie een landelijk of internationaal karakter hebben en die de
      rechtsstaat in ernstige mate bedreigen;

      b. het afhandelen van gecompliceerde internationale rechtshulpverzoeken op de door het bevoegd gezag aangewezen
      aandachtsgebieden van de dienst Nationale recherche en van gecompliceerde rechtshulpverzoeken die niet zijn terug
      te brengen op een specifieke regionale eenheid of opsporingsinstantie;

      c. het verrichten van onderzoeken van nationaal belang zoals die door het bevoegd gezag als zodanig zijn aangewezen
      en die naar aard of methodiek aansluiten bij de dienst;

      d. het leveren van capaciteit ten behoeve van internationale samenwerkingsverbanden;

      e. het vervullen van een landelijke expertisefunctie op de voor de dienst Nationale recherche door het bevoegd
      gezag vastgestelde aandachtsgebieden, ten behoeve van het opstellen van criminaliteitsbeeldanalyses en het
      nationaal dreigingsbeeld alsmede het vervullen van deze functie ter ondersteuning van de bestrijding en
      voorkoming van zware en georganiseerde criminaliteit en van de operationele onderzoeken van de dienst en andere
      opsporingseenheden;

      f. de bestrijding van de productie en verspreiding van XTC, de bestrijding van terrorisme en het verrichten van
      onderzoeken naar oorlogsmisdrijven.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel6
  - number: '7'
    text: |-
      De dienst IPOL stelt in opdracht van het College van procureurs-generaal vierjaarlijks een nationaal dreigingsbeeld
      op ten behoeve van de bestrijding van de georganiseerde criminaliteit.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel7
  - number: '8'
    text: |-
      1 Bij de dienst IPOL is een landelijk internationaal rechtshulpcentrum ondergebracht.

      2 Het landelijk internationaal rechtshulpcentrum heeft in ieder geval tot taak:

      a. de registratie van rechtshulpverzoeken ten behoeve van de Landelijke eenheid en de bijzondere
      opsporingsdiensten;

      b. de uitvoering van eenvoudige rechtshulpverzoeken ten behoeve van de Landelijke eenheid, alsmede de coördinatie
      van de uitvoering en het toezicht op de kwaliteit van de afhandeling van overige rechtshulpverzoeken ten behoeve
      van de Landelijke eenheid;

      c. de uitvoering van eenvoudige rechtshulpverzoeken ten behoeve van de bijzondere opsporingsdiensten;

      d. het zijn van kennis- en expertisecentrum op het gebied van internationale rechtshulp;

      e. het beheer van de informatiekanalen, genoemd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032673
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel8
