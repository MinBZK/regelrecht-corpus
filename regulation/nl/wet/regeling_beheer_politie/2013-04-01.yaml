articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *de minister:* de Minister van Veiligheid en Justitie;

      b. *aandachtsgebieden:* het geheel van delictsoorten of clusters van delictsoorten, dadergroepen, aanpakstrategieën
      of geografische gebieden waarop de activiteiten van de politie kunnen worden gericht;

      c. *horizontale fraude:* fraude in het particuliere geld- en goederenverkeer, met een particuliere partij als
      benadeelde;

      d. *taakaccent:* gebied binnen de horizontale fraude, waarop expertise is ontwikkeld;

      e. *beheersplan:* het beheersplan, bedoeld in [artikel 37, eerste lid, van de Politiewet 2012][ref1];

      f. *jaarverslag:* het jaarverslag, bedoeld in [artikel 37, eerste lid, van de Politiewet 2012][ref2];

      g. *jaaraanschrijving:* jaaraanschrijving van de minister waarin aanwijzingen worden gegeven aan de korpschef;

      h. *managementrapportage:* rapportage van de korpschef aan de minister waarin wordt ingegaan op de uitvoering van
      het beheersplan;

      i. *commissies van toezicht op de arrestantenzorg:* de commissie, bedoeld in [artikel 26][ref3];

      j. *arrestantenzorg:* zorg voor de huisvesting, veiligheid, verzorging en bejegening van ingeslotenen;

      k. *ingeslotene:* de persoon die rechtens van zijn vrijheid is beroofd, alsmede de persoon die ten behoeve van de
      hulpverlening aan hem op een politiebureau is ondergebracht;

      l. *politiecellen:* ruimten die door de politie worden gebruikt voor het insluiten van personen;

      m. *politiecellencomplex:* een in een gebouw te onderscheiden ruimte waarin één of meer gangen met daaraan grenzend
      één of meer ruimten liggen die door de politie worden gebruikt voor het insluiten van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel37
