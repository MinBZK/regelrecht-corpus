  - number: '15'
    text: |-
      De regionale eenheden beschikken ieder over een organisatie van mobiele eenheden ten behoeve van de volgende
      werkzaamheden:

      a. het optreden ter handhaving van de openbare orde en hulpverlening in het bijzonder bij grootschalige
      manifestaties en evenementen;

      b. het uitvoeren van evacuaties;

      c. het bewaken en beveiligen van objecten;

      d. het optreden bij crises en rampen;

      e. het uitvoeren van zoekacties;

      f. het aanhouden van ordeverstoorders.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel15
  - number: '16'
    text: |-
      De regionale eenheden beschikken ieder over een staf die ten behoeve van het bevoegd gezag zorg draagt voor de
      coördinatie van grootschalig politieoptreden.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel16
  - number: '17'
    text: |-
      De regionale eenheden beschikken zelfstandig of samen met één of meer andere regionale eenheden over één
      of meerdere onderdelen die uitsluitend tot taak hebben, indien redelijkerwijs mag worden aangenomen dat
      levensbedreigende omstandigheden tegen de politie of anderen dreigen, de volgende werkzaamheden uit te voeren:

      a. het verrichten van planmatige aanhoudingen;

      b. het bewaken en beveiligen van politie-infiltranten;

      c. het assisteren bij het bewaken en beveiligen van het transport van getuigen, verdachten of gedetineerden;

      d. het assisteren bij het bewaken en beveiligen van objecten;

      e. andere werkzaamheden waarvoor toestemming is verkregen van de minister.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel17
  - number: '18'
    text: |-
      1 De volgende regionale eenheden beschikken zelfstandig over een team bestrijding middencriminaliteit:

      a. De regionale eenheid Midden-Nederland;

      b. De regionale eenheid Noord-Holland;

      c. De regionale eenheid Amsterdam;

      d. De regionale eenheid Den Haag;

      e. De regionale eenheid Rotterdam.

      2 De volgende regionale eenheden beschikken tezamen over een team bestrijding middencriminaliteit:

      a. De regionale eenheden Noord-Nederland en Oost-Nederland

      b. De regionale eenheden Zeeland-West-Brabant, Oost-Brabant en Limburg.

      3 Met uitzondering van het team in De regionale eenheid Midden-Nederland bestaat een team bestrijding
      middencriminaliteit in ieder geval uit een onderdeel dat zich richt op het taakveld:

      a. fraude;

      b. milieu.

      4 Het team middencriminaliteit Midden-Nederland bestaat in ieder geval uit een onderdeel dat zich richt op het
      taakveld fraude.

      5 De teams bestrijding middencriminaliteit hebben tot taak:

      a. het verrichten van tactische en financiële opsporingsonderzoeken, alsmede het afhandelen van internationale
      rechtshulpverzoeken, naar vormen van middencriminaliteit;

      b. het verrichten van zware en middelzware opsporingsonderzoeken, alsmede het afhandelen van internationale
      rechtshulpverzoeken, naar horizontale fraude binnen het taakaccent;

      c. het vervullen van een expertisefunctie op het gebied van horizontale fraude en financieel rechercheren;

      d. het in stand houden van een fraudemeldpunt op het taakaccent;

      e. het onderdeel dat zich richt op het taakveld milieu heeft als taak het verrichten van tactische
      opsporingsonderzoeken naar complexe en ketengerelateerde milieudelicten.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel18
  - number: '19'
    text: |-
      1 De volgende regionale eenheden beschikken zelfstandig over een internationaal rechtshulpcentrum:

      a. De regionale eenheid Noord-Holland;

      b. De regionale eenheid Amsterdam;

      c. De regionale eenheid Den Haag;

      d. De regionale eenheid Rotterdam.

      2 De volgende regionale eenheden beschikken tezamen over een internationaal rechtshulpcentrum:

      a. de regionale eenheden Noord-Nederland en Oost-Nederland;

      b. de regionale eenheden Zeeland-West-Brabant, Oost-Brabant en Limburg.

      3 Een internationaal rechtshulpcentrum heeft in ieder geval tot taak:

      a. de registratie van rechtshulpverzoeken;

      b. de uitvoering van eenvoudige rechtshulpverzoeken;

      c. de coördinatie van de uitvoering en het toezicht op de kwaliteit van de afhandeling van overige
      rechtshulpverzoeken;

      d. het zijn van een kennis- en expertisecentrum op het gebied van internationale rechtshulp.
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel19
  - number: '20'
    text: |-
      De minister zendt de korpschef jaarlijks vóór 1 december een jaaraanschrijving. De jaaraanschrijving heeft
      betrekking op de managementrapportages, bedoeld in [artikel 22, eerste lid][ref1], alsmede op de voorbereidende
      werkzaamheden door de korpschef ten behoeve van het beheersplan en het jaarverslag en de daarvoor nodige
      informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0032673#Artikel22
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0032673
        artikel: '22'
        hoofdstuk: '5'
  - number: '21'
    text: |-
      1 In het beheersplan zijn, naast de indeling van de eenheden, bedoeld in
      [artikel 25, eerste lid, onder a, van de Politiewet 2012][ref1], in districten en basisteams, ten minste opgenomen:

      a. het sterktebeleid waaronder de sterkteverdeling, de organisatie en formatie en de bezetting;

      b. het personeelsbeleid waaronder de meerjarige strategische personeelsplanning, het beleid op het terrein
      van leiderschap, loopbaanbeleid, het mobiliteitsbeleid, een divers samengesteld personeelsbestand, het
      integriteitbeleid en de maatregelen die voortvloeien uit de uitvoering van de vastgestelde CAO;

      c. het ICT-beleid waaronder het beleid op het terrein van het onderhoud en vernieuwing en de informatieorganisatie;

      d. het beleid op het gebied van materieel, waaronder inkoop en huisvesting.

      2 De minister stelt het beheersplan vast na goedkeuring van de begroting voor hetzelfde jaar van zijn ministerie
      door de Staten-Generaal.

      3 De korpschef meldt een voorgenomen wijziging van de organisatie of formatie, waarvan de gevolgen nog niet in het
      beheersplan zijn opgenomen en die wijzigingen in de verdeling van de operationele sterkte tot gevolg zal hebben, zo
      spoedig mogelijk aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '22'
    text: |-
      1 De korpschef verstrekt aan de minister een 5-maandsmanagementrapportage over de maanden januari tot en met mei,
      een 8-maandsmanagementrapportage over de maanden januari tot en met augustus en een 12 maandsmanagementrapportage
      over de maanden januari tot en met december over de uitvoering van het beheersplan. Deze managementrapportages
      worden telkens uiterlijk op respectievelijk 1 juli, 1 oktober en 1 februari verstrekt aan de minister.

      2 De in het eerste lid bedoelde rapportages en het jaarverslag bevatten in ieder geval de onderstaande informatie:

      a. de omvang van de operationele sterkte, bedoeld in
      [artikel 1, onder b, van het Besluit verdeling sterkte en middelen politie][ref1], en de niet-operationele sterkte
      alsmede de verdeling van de operationele en de niet-operationele sterkte over de onderdelen van de politie;

      b. het aantal aspiranten alsmede de verdeling van de aspiranten over de onderdelen van de politie.

      3

      4 De korpschef toetst in periodieke audits de mate waarin de door hem verwerkte gegevens eenduidig, consistent en
      volledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032333#Artikel1
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0032333
        artikel: '1'
  - number: '23'
    text: |-
      1

      2 De korpschef verstrekt jaarlijks voor 1 augustus aan de minister de in onderdeel 1 en onderdeel 1.1 bij deze
      regeling behorende [bijlage 2][ref1] genoemde gegevens met betrekking tot het voorafgaande halve jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032673
    url: https://wetten.overheid.nl/BWBR0032673/2013-04-01#Artikel23
    references:
