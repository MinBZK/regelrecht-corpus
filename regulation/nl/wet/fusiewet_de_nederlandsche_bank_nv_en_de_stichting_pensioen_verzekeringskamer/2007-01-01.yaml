preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de hervorming van het toezicht op de financiële
    marktsector wenselijk is dat De Nederlandsche Bank N.V. en de Stichting Pensioen- & Verzekeringskamer fuseren tot:
    De Nederlandsche Bank N.V.;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017317/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Nederlandsche Bank N.V., gevestigd te Amsterdam, en de Stichting Pensioen- & Verzekeringskamer, gevestigd te
      Apeldoorn, fuseren. Alle vermogensbestanddelen van de Stichting Pensioen- & Verzekeringskamer gaan onder algemene
      titel over op De Nederlandsche Bank N.V. zonder dat een besluit, akte of mededeling is vereist. De Stichting
      Pensioen- & Verzekeringskamer houdt op te bestaan.

      2 De Nederlandsche Bank N.V. doet de fusie, binnen acht dagen na inwerkingtreding van deze wet, inschrijven in de
      handelsregisters waar zijzelf en de Stichting Pensioen- & Verzekeringskamer staan ingeschreven.

      3 De Nederlandsche Bank N.V. doet binnen een maand na inwerkingtreding van deze wet opgave van de fusie aan de
      beheerders van andere openbare registers dan het handelsregister waarin de overgang van rechten of de fusie kan
      worden ingeschreven. De opgave vermeldt met betrekking tot elk van de fuserende rechtspersonen rechtsvorm, naam,
      adres en woonplaats, alsmede wie de verkrijgende rechtspersoon is en de dag waarop de fusie van kracht is geworden.
      De bewaarders van de openbare registers gaan na deze opgave over tot verandering van de tenaamstelling.

      4 Ter zake van de overgang van vermogensbestanddelen blijft heffing van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0017317/2007-01-01#Artikel1
  - number: '2'
    text: |-
      De Nederlandsche Bank N.V. oefent alle taken en bevoegdheden uit die bij of krachtens enige wet aan de Pensioen- &
      Verzekeringskamer zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0017317/2007-01-01#Artikel2
  - number: '3'
    text: |-
      1 In civielrechtelijke en bestuursrechtelijke gedingen waarin de Stichting Pensioen- & Verzekeringskamer
      onderscheidenlijk de Pensioen- & Verzekeringskamer partij of belanghebbende is, treedt De Nederlandsche Bank
      N.V. in haar plaats, zonder dat daarvoor een betekening nodig is en met overneming van procureurstelling
      onderscheidenlijk aanwijzing van een gemachtigde.

      2 Bij de Pensioen- & Verzekeringskamer aanhangige bezwaarschriften worden, in de stand waarin zij zich bevinden,
      verder behandeld en afgedaan door De Nederlandsche Bank N.V.

      3 Beroep waarvoor de termijn voor de Pensioen- & Verzekeringskamer is aangevangen staat voor De Nederlandsche Bank
      N.V. open gedurende het resterende gedeelte van de beroepstermijn.

      4 Indien er op het tijdstip van inwerkingtreding van deze wet nog civiele rechtszaken aanhangig zijn bij de
      rechtbank Zutphen waarbij de Stichting Pensioen- & Verzekeringskamer partij is, wordt er uitspraak gedaan door
      deze rechtbank.
    url: https://wetten.overheid.nl/BWBR0017317/2007-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een besluit dat door de Pensioen- & Verzekeringskamer is genomen, geldt als een besluit van De Nederlandsche
      Bank N.V.

      2 Een tot de Pensioen- & Verzekeringskamer gericht verzoek om een besluit te nemen, waarop nog niet is beslist,
      wordt beschouwd te zijn gericht tot De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0017317/2007-01-01#Artikel4
  - number: '5'
    text: |-
      1 De rechten en verplichtingen van de Stichting Pensioen- & Verzekeringskamer die voortvloeien uit de
      arbeidsovereenkomsten met haar werknemers, daaronder begrepen die welke voortvloeien uit een toezegging omtrent
      pensioen als bedoeld in [artikel 2 van de Pensioen- en spaarfondsenwet][ref1], gaan over op De Nederlandsche Bank
      N.V.

      2 De geldigheid van de rechten en verplichtingen die voortvloeien uit arbeidsovereenkomsten tussen de Stichting
      Pensioen & Verzekeringskamer en de leden van haar bestuur is beperkt tot de duur van hun benoeming in dat bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0017317/2007-01-01#Artikel5
    references:
