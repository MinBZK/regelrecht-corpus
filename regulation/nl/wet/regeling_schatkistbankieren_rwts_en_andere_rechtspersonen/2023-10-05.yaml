  - number: '9'
    text: |-
      De Minister van Financiën kan in overeenstemming met de betrokken Minister in een overeenkomst met een
      rechtspersoon die deelneemt aan schatkistbankieren nadere voorwaarden verbinden aan de deelname van die
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel9
  - number: '10'
    text: |-
      1 De producten, bedoeld in [artikel 5.7, eerste lid, van de Comptabiliteitswet 2016][ref1], hebben uitsluitend de
      vorm van:

      a. producten waarbij de hoofdsom tenminste aan het einde van de looptijd intact is, uitgezet bij een financiële
      instelling die voldoet aan de in het tweede lid bedoelde eisen;

      b. vastrentende waarden, uitgegeven door een financiële instelling die voldoet aan de in het tweede lid bedoelde
      eisen.

      2 .De financiële instelling, bedoeld in het eerste lid, onderdelen a en b, voldoet aan de eisen, bedoeld in
      [artikel 2 van de Regeling uitzettingen en derivaten decentrale overheden][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0012076#Artikel2
