articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *actuele marktwaarde:* de waarde die wordt berekend op basis van de actuele rente behorend bij de resterende
      looptijden van toekomstige kasstromen (rente en aflossing) van een deposito of lening;
        - *betaalrekening:* een rekening die de rechtspersoon bij een bank aanhoudt;
        - *daggeldrente:* de dagelijkse vaststelling door de Europese Centrale Bank van de Euro Short Term Rate (€STR),
      zijnde de rente waartegen gemiddeld genomen overnight en zonder onderpand liquiditeiten zijn geleend in de
      eurogeldmarkt (afgerond op 2 decimalen);
        - *deposito:* het creditbedrag op een aan een rekening-courant gekoppelde depositorekening van de schatkist van
      het Rijk, waarover een vooraf vastgestelde rente wordt vergoed en waarover de rechtspersoon gedurende een vooraf
      vastgestelde periode niet vrij kan beschikken;
        - *inleenrente:* de rente waartegen de Staat zichzelf financiert op de (inter)nationale geld- en kapitaalmarkt via
      de uitgifte van Dutch Treasury Certificates en Dutch State Loans;
        - *lening:* de lening, bedoeld in de [artikelen 5.5, eerste en tweede lid][ref1], en
      [artikel 5.6, eerste lid, van de Comptabiliteitswet 2016][ref2];
        - *rechtspersoon:* de rechtspersoon met een wettelijke of publieke taak en de rechtspersoon die
      publieke liquide middelen beheert, bedoeld in [artikel 5.2, eerste en derde lid][ref3], respectievelijk
      [5.4 van de Comptabiliteitswet 2016][ref4];
        - *rekening-courant:* de rekening die een rechtspersoon bij de schatkist van het Rijk aanhoudt;
        - *rekening-courantkrediet:* het maximaal toegestane debetsaldo op een rekening-courant, bedoeld in
      [artikel 5.5, eerste en derde lid, van de Comptabiliteitswet 2016][ref5];

      2 De begrippen van [artikel 1.1 van de Comptabiliteitswet 2016][ref6] zijn van overeenkomstige toepassing op deze
      regeling.


