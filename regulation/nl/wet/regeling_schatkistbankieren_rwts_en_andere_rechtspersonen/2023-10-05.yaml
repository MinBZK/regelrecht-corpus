        artikel: '1.1'
  - number: '2'
    text: |-
      1 De Minister van Financiën opent op naam van de rechtspersoon een rekening-courant, waar de rechtspersoon zijn
      publieke liquide middelen aanhoudt.

      2 De Minister van Financiën koppelt de betaalrekening aan de rekening-courant. Aan de rekening-courant kan een
      depositorekening worden gekoppeld.

      3 Een deposito kan iedere gewenste looptijd hebben tot een maximum van 30 jaar.

      4 Het vervroegd laten vrijvallen van een deposito geschiedt tegen de actuele marktwaarde en is uitsluitend mogelijk
      voor zover dit noodzakelijk is voor de uitoefening van de wettelijke of publieke taak van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel2
  - number: '3'
    text: |-
      1 De Minister van Financiën sluit ten behoeve van het verstrekken van een lening een overeenkomst met de
      rechtspersoon.

      2 De Minister van Financiën kan in overeenstemming met de betrokken Minister nadere voorwaarden verbinden aan de
      lening.

      3 Een lening heeft een looptijd van minimaal twaalf maanden.

      4 De Minister van Financiën kan in overeenstemming met de rechtspersoon en de betrokken Minister een
      rentevastperiode overeenkomen die korter is dan de looptijd van een lening.

      5 Een lening kan in termijnen worden opgenomen en kan geheel of in gedeelten vervroegd worden afgelost tegen de
      actuele marktwaarde.
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel3
  - number: '4'
    text: |-
      1 De Minister van Financiën vergoedt aan de rechtspersoon rente over de liquide middelen die hij op de rekening-
      courant aanhoudt. De rente is gebaseerd op de daggeldrente.

      2 De Minister van Financiën vergoedt aan de rechtspersoon rente over een deposito. De rente is gebaseerd op de
      inleenrente die behoort bij de looptijd van het betreffende deposito.

      3 De Minister van Financiën brengt over een lening rente in rekening bij de rechtspersoon. De hoogte van de
      rente is gelijk aan de inleenrente die behoort bij de looptijd van de lening waarbij rekening wordt gehouden met
      de reguliere aflossingen die gedurende de looptijd plaatsvinden. De rente wordt door de Minister van Financiën
      vastgesteld uiterlijk op de ingangsdatum van de lening, tenzij de rechtspersoon ervoor kiest. Bij een verlenging
      van een rentevastperiode wordt de rente al voor de ingangsdatum nieuwe rentevastperiode vastgesteld uiterlijk op de
      eerste dag van de lening vast te stellen nieuwe rentevastperiode.

      4 De Minister van Financiën brengt over een rekening-courantkrediet rente in rekening. De hoogte van de rente is
      gelijk aan de daggeldrente.

      5 Wanneer de rente, bedoeld in het eerste tot en met het vijfde lid, negatief is, wordt deze rente in afwijking van
      dit artikel gelijk gesteld aan nul.
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel4
  - number: '5'
    text: |-
      1 De Minister van Financiën kan op verzoek van de rechtspersoon krediet ten laste van de rekening-courant
      verstrekken. Het krediet wordt in de vorm van een rekening-courantkrediet verstrekt.

      2 De rechtspersoon geeft in het verzoek, bedoeld in het eerste lid, de gewenste omvang van het rekening-
      courantkrediet aan.

      3 De Minister van Financiën stelt in overeenstemming met de betrokken Minister de omvang van het rekening-
      courantkrediet vast.

      4 De Minister van Financiën kan in overeenstemming met de betrokken Minister nadere voorwaarden verbinden aan een
      rekening-courantkrediet.
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel5
  - number: '6'
    text: |-
      1 Bij het overschrijden van het rekening-courantkrediet maakt de rechtspersoon de overschrijding onverwijld
      ongedaan.

      2 Indien de rechtspersoon de overschrijding, bedoeld in het eerste lid, niet binnen vijf werkdagen ongedaan
      maakt, is zij van rechtswege in verzuim. De Minister van Financiën stelt de rechtspersoon en de betrokken Minister
      schriftelijk in kennis van het verzuim, tenzij naar het oordeel van de Minister van Financiën voldoende aannemelijk
      is dat het verzuim binnen vijf werkdagen ophoudt te bestaan.

      3 De Minister van Financiën kan het gebruik van de betaalrekening door de rechtspersoon gedurende het verzuim
      beperken. De Minister van Financiën stelt de rechtspersoon en de betrokken Minister hiervan onverwijld in kennis.
      De beperking wordt ongedaan gemaakt zodra het verzuim eindigt.

      4 De rechtspersoon is, gedurende de periode waarin zij in verzuim is, een boeterente van één procent verschuldigd
      over het bedrag van de overschrijding van het rekening-courantkrediet.

      5 De Minister van Financiën is bevoegd om het bedrag waarmee het rekening-courantkrediet is overschreden te
      verrekenen met de door de betrokken Minister aan de rechtspersoon te verstrekken middelen.

      6 Niet tegenstaande een wettelijke mogelijkheid tot verrekening, mag het Ministerie van Financiën altijd hetgeen
      zij al dan niet opeisbaar of onder voorwaarde van de rechtspersoon te vorderen heeft, verrekenen met al dan niet
      opeisbare tegenvorderingen van de rechtspersoon op het Ministerie van Financiën uit hoofde van deze regeling,
      waaronder doch niet uitsluitend vorderingen uit hoofde van rekening-courant, leningen en deposito’s, ongeacht de
      valuta waarin de vorderingen en tegenvorderingen luiden. Vorderingen in vreemde valuta worden verrekend tegen de
      koers van de dag van verrekening. Verrekening kan (onder andere) geschieden door middel van incasso ten laste van
      de rekening-courant.
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel6
  - number: '7'
    text: |-
      De Minister van Financiën kan voor de rechtspersoon, bedoeld in de [artikelen 5.2][ref1] en
      [5.4 van de Comptabiliteitswet 2016][ref2], een garantie toestaan ten aanzien van de liquide middelen die de
      rechtspersoon in de schatkist van het Rijk aanhoudt, indien die rechtspersoon daartoe een verzoek bij de Minister
      van Financiën heeft ingediend en de liquide middelen die de rechtspersoon in de schatkist van het Rijk aanhoudt
      toereikend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0040289/2023-10-05#Artikel7
