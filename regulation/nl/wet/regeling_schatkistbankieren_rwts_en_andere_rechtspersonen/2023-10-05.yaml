  - number: '8'
    text: |-
      1 Voor het verplicht schatkistbankieren, bedoeld in [artikel 5.2 van de Comptabiliteitswet 2016][ref1], zijn de
      bepalingen 1 tot en met 6 van de bijlage van deze regeling van toepassing.

      2 Voor het vrijwillig schatkistbankieren, bedoeld in [artikel 5.4 van de Comptabiliteitswet 2016][ref2], zijn de
      bepalingen 1 tot en met 7 van de bijlage van deze regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5.2
