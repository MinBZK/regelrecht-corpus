preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de wijzigingen en aanvullingen, welke de wet van 15 April 1896 (Stb.
    69) regelende het toezicht op het gebruik van stoomtoestellen behoeft, het raadzaam maken, haar door een nieuwe wet
    te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In de bij of krachtens deze wet vastgestelde voorschriften wordt verstaan onder:

      toestellen: technische voortbrengselen, die worden gebruikt of zijn bestemd tot gebruik op een zodanige wijze,
      dat daarin aanwezig kan zijn damp onder een hogere druk dan die van de dampkring of vloeistof bij een temperatuur,
      waarbij de dampspanning van deze stof hoger is dan die van de dampkring;

      stoomketels: toestellen, waarin water wordt verhit door toevoer van warmte, welke niet is onttrokken aan een ander
      toestel, waarop deze wet van toepassing is;

      stoomtoestellen: stoomketels alsmede toestellen, welke met deze zodanig worden verbonden, dat tussen het toestel en
      de stoomketel overdracht van warmte door middel van damp of vloeistof plaats vindt;

      dampketels: toestellen, waarin een andere vloeistof dan water wordt verhit door toevoer van warmte welke niet is
      onttrokken aan een ander toestel, waarop deze wet van toepassing is;

      damptoestellen: dampketels alsmede toestellen, welke met deze zodanig worden verbonden, dat tussen het toestel en
      de dampketel overdracht van warmte door middel van damp of vloeistof plaats vindt;

      toebehoren: technische voortbrengselen, strekkende om het veilig gebruik van stoomtoestellen of damptoestellen
      te bevorderen;

      Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel1
  - number: 1a
    text: |-
      Het bij of krachtens deze wet bepaalde is mede van toepassing op stoomtoestellen en damptoestellen, alsmede het
      toebehoren van deze, die op het continentaal plat gebruikt worden bij een verkenningsonderzoek, het opsporen of
      winnen van delfstoffen of aardwarmte dan wel het opslaan van stoffen als bedoeld in de [Mijnbouwwet][ref1]. Bij
      of krachtens algemene maatregel van bestuur kan worden bepaald dat deze wet en de daarop berustende bepalingen
      geheel of gedeeltelijk niet van toepassing zijn op stoomtoestellen en damptoestellen, alsmede het toebehoren van
      deze, die gebruikt worden bij een verkenningsonderzoek, het opsporen of winnen van delfstoffen of aardwarmte dan
      wel het opslaan van stoffen als bedoeld in de [Mijnbouwwet][ref2]. Bij of krachtens algemene maatregel van bestuur
      kunnen ten aanzien van de in de vorige zin bedoelde stoomtoestellen en damptoestellen, alsmede het toebehoren van
      deze, voorts regels worden gesteld die afwijken van of strekken ter aanvulling van deze wet en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0014168
      - id: ref2
        bwb_id: BWBR0014168
  - number: '2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld, waaraan stoomtoestellen en
      damptoestellen, alsmede het toebehoren van deze moeten voldoen of welke met betrekking tot deze toestellen en dit
      toebehoren moeten worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel2
  - number: '3'
    text: |-
      Stoomtoestellen en damptoestellen, alsmede het toebehoren van deze zijn, naar regelen vastgesteld bij of
      krachtens algemene maatregel van bestuur, aan een voortdurend toezicht van door Onze Minister aangewezen onder
      hem ressorterende ambtenaren of door Onze Minister aangewezen diensten, instellingen, onderzoekingsbureaus of
      ondernemingen onderworpen.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel3
  - number: '4'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld, welke stoomtoestellen en damptoestellen,
      alsmede het toebehoren van deze aan keuring door door Onze Minister aangewezen onder hem ressorterende ambtenaren
      of door Onze Minister aangewezen diensten, instellingen, onderzoekingsbureaus of ondernemingen moeten worden
      onderworpen. Deze keuring vindt plaats zowel vóór het in gebruik nemen van het toestel, als op regelmatig
      opvolgende tijdstippen daarna.

      2 Ongeacht het bepaalde in het voorgaande lid kan een daartoe door Onze Minister aangewezen onder hem ressorterende
      ambtenaar of een door Onze Minister aangewezen dienst, instelling, onderzoekingsbureau of onderneming elk
      stoomtoestel of damptoestel aan een keuring onderwerpen of doen onderwerpen, indien en zodra hij hiertoe in het
      belang van de veiligheid termen aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel4
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen keuringswerkzaamheden die met betrekking
      tot een stoomtoestel of damptoestel buiten Nederland in een Lid-Staat van de Europese Economische Gemeenschap
      of in een andere Staat, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte zijn
      verricht door een aldaar gevestigde instantie of persoon, voor de toepassing van [artikel 4, eerste lid][ref1],
      en [artikel 11, eerste lid, eerste volzin][ref2], worden gelijkgesteld met keuringswerkzaamheden die door Onze
      Minister aangewezen onder hem ressorterende ambtenaren of door Onze Minister aangewezen diensten, instellingen,
      onderzoekingsbureaus of ondernemingen hebben verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002108#Artikel11
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002108
        artikel: '11'
        paragraaf: '3'
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald op welke wijze keuringen, als bedoeld in
      [artikel 4][ref1], moeten plaats vinden, welke regelen daarbij moeten worden in acht genomen en, zo nodig, op welke
      regelmatig opvolgende tijdstippen zij moeten geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel4
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '4'
        paragraaf: '2'
  - number: '7'
    text: |-
      Op schriftelijk verzoek van de eigenaar of gebruiker van een stoomtoestel of damptoestel kan dat toestel door
      een daartoe door Onze Minister aangewezen onder hem ressorterende ambtenaar of een door Onze Minister aangewezen
      dienst, instelling, onderzoekingsbureau of onderneming aan een keuring, welke niet, ingevolge de bepalingen bij of
      krachtens deze wet vastgesteld, is vereist, worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel7
  - number: '8'
    text: |-
      De eigenaar of de gebruiker van een stoomtoestel of damptoestel is verplicht de werklieden en de werktuigen, die
      voor de keuring nodig zijn, ter beschikking van een daartoe door Onze Minister aangewezen onder hem ressorterende
      ambtenaar of een door Onze Minister aangewezen dienst, instelling, onderzoekingsbureau of onderneming te stellen en
      ook overigens alle door hem verlangde medewerking met betrekking tot die keuring te verlenen.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel8
  - number: '9'
    text: |-
      Voor de bij of krachtens deze wet voorgeschreven of verzochte keuringen, alsmede voor het uitreiken van een
      vergunningsbewijs zijn vergoedingen verschuldigd overeenkomstig door Onze Minister te stellen regelen. Deze kan
      tevens regelen stellen met betrekking tot de wijze van heffing en de invordering.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden een stoomtoestel of een damptoestel, welke ingevolge [artikel 4, lid 1][ref1], aan keuring is
      onderworpen, in werking te brengen of in werking te hebben zonder in het bezit te zijn van een geldige vergunning.

      2 Het is verboden een stoomtoestel of damptoestel in werking te brengen of in werking te hebben onder andere
      omstandigheden of op andere wijze, dan in het vergunningsbewijs is aangegeven.

      3 Het is verboden een stoomtoestel of damptoestel in werking te hebben, wanneer een daartoe door Onze Minister
      aangewezen onder hem ressorterende ambtenaar namens hem of een door Onze Minister aangewezen dienst, instelling,
      onderzoekingsbureau of onderneming aan de gebruiker schriftelijk heeft medegedeeld, dat het gebruik van het toestel
      gevaar oplevert, zelfs indien voor dit toestel een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel4
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '4'
        paragraaf: '2'
  - number: '11'
    text: |-
      1 Een vergunning, als bedoeld in [artikel 10, eerste lid][ref1], wordt verleend wanneer de keuring een
      gunstig resultaat heeft opgeleverd. Bevoegd tot verlening van de vergunning zijn de daartoe door Onze Minister
      aangewezen onder hem ressorterende ambtenaren namens hem of door Onze Minister aangewezen diensten, instellingen,
      onderzoekingsbureaus of ondernemingen.

      2 Bij algemene maatregel van bestuur worden de gevallen aangegeven waarin een vergunning kan worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel10
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '10'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 De gebruiker is verplicht van elk ongeval bij het gebruik van een stoomtoestel of een damptoestel onverwijld
      kennis te geven aan een daartoe door Onze Minister aangewezen onder hem ressorterende ambtenaar.

      2 Door deze ambtenaar wordt ten spoedigste een onderzoek ter plaatse ingesteld. Van dit onderzoek wordt een proces-
      verbaal opgemaakt, hetwelk zo mogelijk een verklaring omtrent de oorzaak van het ongeval bevat; afschrift hiervan
      is voor iedere belanghebbende, tegen betaling der kosten, verkrijgbaar.

      3 Tenzij het ter voorkoming van ernstig gevaar onvermijdelijk is, is het verboden wijziging te brengen in de
      toestand waarin zich het toestel, de delen van het toestel of het toebehoren na het ongeval bevinden of deze te
      verplaatsen, alvorens de ambtenaar verklaard heeft, dat zijn onderzoek geeindigd is.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel13
  - number: 13a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen onder hem ressorterende ambtenaren. Van het besluit wordt mededeling gedaan door plaatsing in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel13a
  - number: '14'
    text: |-
      1 Overtreding van de regels, bedoeld in [artikel 1a][ref1], de voorschriften, bedoeld in [artikel 2][ref2], alsmede
      overtreding van het bepaalde in de [artikelen 8][ref3], [10][ref4], [13 eerste en derde lid][ref5] en [18][ref6]
      wordt gestraft met hechtenis van ten hoogste vier maanden of geldboete van de tweede categorie.

      2 De feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002108#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002108#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002108#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0002108#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0002108#Artikel18
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel14
