  - number: '15'
    text: |-
      Met het opsporen van de bij deze wet strafbaar gestelde feiten zijn - behalve de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] genoemde personen - daartoe door Onze Minister aangewezen
      onder hem ressorterende ambtenaren belast, alsmede andere door Onze Minister zonodig aan te wijzen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '16'
    text: |-
      Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in [artikel 15][ref1] bedoelde ambtenaren
      toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij zijn bevoegd
      zich van bepaalde door hen aan te wijzen personen doen te vergezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel15
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '15'
        paragraaf: '7'
  - number: '17'
    text: |-
      1 De opsporingsambtenaren zijn bevoegd een stoomtoestel of een damptoestel te verzegelen, indien naar hun oordeel:

      a. het gebruik van het toestel gevaar oplevert;

      b. een toestel waarvoor een vergunning is vereist, in werking is of in werking is geweest zonder dat hun het
      desbetreffende vergunningsbewijs kan worden getoond, dan wel in werking is of in werking is geweest onder andere
      omstandigheden of op andere wijze, dan in het vergunningsbewijs is aangegeven.

      2 Opheffing van de verzegeling vindt plaats zodra de reden, waartoe de verzegeling aanleiding gaf, is opgeheven of
      ongegrond is gebleken.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel17
  - number: '18'
    text: |-
      Een ieder is verplicht aan de daartoe door Onze Minister aangewezen onder hem ressorterende ambtenaren alle
      inlichtingen te verstrekken, welke deze voor de goede vervulling van hun taak ter uitvoering van deze wet behoeven,
      alsmede inzage te verlenen van alle bescheiden, waarvan bedoelde ambtenaren voor de goede vervulling van hun taak
      inzage nodig oordelen.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel18
  - number: '19'
    text: |-
      De in [artikel 15][ref1] bedoelde ambtenaren zijn, behoudens tegenover hen aan wier gezag zij uit kracht van hun
      ambt zijn onderworpen, verplicht tot geheimhouding van de namen der personen door wie een klacht is ingediend of
      aangifte is gedaan van een overtreding van het bij of krachtens deze wet bepaalde, behoudens wanneer deze personen
      hun schriftelijk hebben verklaard tegen de mededeling van hun namen geen bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel15
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '15'
        paragraaf: '7'
  - number: '20'
    text: |-
      Deze wet is niet van toepassing op stoomtoestellen en damptoestellen aan boord van oorlogsschepen alsmede op
      stoomtoestellen van locomotieven van spoorwegen, waarvan het gebruik geregeld blijft door de wet van 9 April 1875
      (*Stb.* 67) en artikel 1 der wet van 9 Juli 1900 (*Stb.* 118).
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel20
  - number: '21'
    text: |-
      Met uitzondering van [artikel 13][ref1] en de ten aanzien van het bepaalde in het eerste en derde lid van dat
      artikel geldende strafbepalingen is deze wet niet van toepassing op:

      a. stoomtoestellen en damptoestellen uitsluitend dienende tot wetenschappelijk onderzoek;

      b. stoomtoestellen en damptoestellen aan boord van vreemde vaartuigen of opgesteld op verplaatsbare inrichtingen,
      indien deze toebehoren aan in het buitenland gevestigde eigenaren en de gebruikers bewijzen, dat zij deze
      toestellen in het land, waaruit zij zijn aangevoerd, mogen gebruiken en dat deze niet meer dan drie maanden geleden
      hier te lande zijn ingevoerd;

      c. bij algemene maatregel van bestuur aangewezen toestellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002108#Artikel13
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002108
        artikel: '13'
        paragraaf: '5'
  - number: '22'
    text: De wet van 15 April 1896 (*Stb.* 69) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel22
  - number: '23'
    text: |-
      1 Deze wet kan worden aangehaald onder de titel: Stoomwet.

      2 Zij treedt in werking met ingang van een door Ons te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0002108/2003-01-01#Artikel23
