---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: stimuleringsregeling_e_health_thuis
regulatory_layer: WET
publication_date: '2019-01-25'
valid_from: '2021-02-25'
bwb_id: BWBR0041840
url: https://wetten.overheid.nl/BWBR0041840/2021-02-25
preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet VWS-subsidies en artikel 1.3 van de Kaderregeling subsidies OCW, SZW
    en VWS;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *algemene groepsvrijstellingsverordening (AGVV):* Verordening (EU) nr. 651/2014 van de Commissie van 17 juni
      2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt
      verenigbaar worden verklaard (PbEU 2014, L 187);
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: '*cliënten:* mensen met een chronische ziekte of beperking, of een groot risico daarop, die thuis wonen;'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *clusterorganisatie:* de rechtspersoon die het innovatiecluster e-health exploiteert, zijnde een aanbieder van
      ondersteuning of zorg;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *coronacrisis:* de crisis die zich vanaf de eerste COVID-19-besmetting in Nederland aan het ontwikkelen is als
      gevolg van de verspreiding van het coronavirus;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.−
    text: '*de-minimisverklaring:* verklaring als bedoeld in artikel 6, eerste lid, van de de-minimisverordening;'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.−
    text: |-
      *de-minimisverordening:* verordening (EU) nr. 1407/2013 van de Commissie van 18 december 2013 betreffende
      de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op de-
      minimissteun;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *e-health toepassingen:* digitale toepassingen die de kwaliteit van leven van cliënten verbeteren of mantelzorg
      vereenvoudigen of ontzorgen;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: '*inkoper:* inkoper van ondersteuning of zorg, zijnde een zorgverzekeraar, gemeente of zorgkantoor;'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *innovatiecluster e-health:* een innovatiecluster als bedoeld in artikel 2, onderdeel 92, van de algemene
      groepsvrijstellingsverordening, op het gebied van e-health, ten behoeve van het uitvoeren van activiteiten in het
      kader van deze regeling;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *mantelzorger:* degene die mantelzorg verleent als bedoeld in
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 1.1.–
    text: '*Minister:* Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *ondersteuning:* maatschappelijke ondersteuning als bedoeld in
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref1] (Wmo 2015);


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 1.1.–
    text: |-
      *opleidingsactiviteiten e-health:* opleiding als bedoeld in artikel 31, van de algemene
      groepsvrijstellingsverordening die leidt tot kennisoverdracht op het gebied van e-health toepassingen;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *penvoerder:* de door het samenwerkingsverband opleidingsactiviteiten e-health aangewezen clusterorganisatie die
      namens alle deelnemers van het samenwerkingsverband optreedt;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: '*professional:* de medewerker die ondersteuning biedt of zorg verleent;'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *samenwerkingsverband opleidingsactiviteiten e-health:* een geen rechtspersoonlijkheid bezittend verband, niet
      zijnde een vennootschap, bestaande uit een clusterorganisatie en andere bij het innovatiecluster e-health betrokken
      organisaties;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
  - number: 1.1.–
    text: |-
      *zorg:* Wlz-zorg en Zvw-zorg als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '1'
  - number: '1.2'
    text: |-
      Voor de toepassing van [artikel 3b][ref1] wordt onder zorg ook verstaan jeugdhulp als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '2.1'
    text: |-
      Deze regeling heeft als doel het stimuleren van activiteiten ten behoeve van het opschalen en borgen van het
      gebruik van e-health toepassingen die ondersteuning of zorg aan cliënten thuis faciliteren, zodat zij langer
      zelfstandig thuis kunnen wonen, door:
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel2
  - number: 2.1.a
    text: het op grotere schaal toepassen van e-health, uitgedrukt in aantallen cliënten;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel2
  - number: 2.1.b
    text: |-
      het structureel inbedden van het gebruik van e-health toepassingen in de reguliere werkprocessen voor ondersteuning
      of zorg; en
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel2
  - number: 2.1.c
    text: het organiseren van een duurzame wijze van bekostiging en borging daarvan in inkoop- en contractafspraken.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel2
  - number: '2.2'
    text: |-
      Voor de e-health toepassingen als bedoeld in het eerste lid geldt dat deze al structureel door minimaal 100
      cliënten of mantelzorgers in Nederland worden gebruikt. Van deze 100 cliënten of mantelzorgers maken er minimaal 10
      cliënten gebruik van ondersteuning of zorg van een aanbieder betrokken bij het innovatiecluster e-health.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het tweede lid geldt voor e-health toepassingen die bijdragen aan de continuïteit van
      ondersteuning of zorg als bedoeld in [artikel 3b][ref1] dat er sprake is van voldoende ambitie in verhouding tot
      het subsidiebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '3.1'
    text: 'De Minister kan op aanvraag voor maximaal drie jaar subsidie verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: 3.1.a
    text: een clusterorganisatie voor activiteiten van een innovatiecluster e-health; of
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: 3.1.b
    text: een clusterorganisatie voor activiteiten van een innovatiecluster e-health en opleidingsactiviteiten e-health; of
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: 3.1.c
    text: |-
      de penvoerder van een samenwerkingsverband opleidingsactiviteiten e-health voor opleidingsactiviteiten e-health van
      de deelnemers.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: '3.2'
    text: Een innovatiecluster e-health bestaat uit tenminste één aanbieder en één inkoper van ondersteuning of zorg.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: '3.3'
    text: 'Geen subsidie wordt verstrekt voor e-health toepassingen die primair gericht zijn op:'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: 3.3.a
    text: het verplaatsen van ziekenhuiszorg naar huis;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: 3.3.b
    text: de uitwisseling van gegevens.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3
  - number: 3a
    text: |-
      De Minister kan op aanvraag subsidie verstrekken aan een clusterorganisatie voor ondersteuning bij het komen tot
      een door de clusterorganisatie gedragen visie op het gebruik van e-health en doorvertaling hiervan in een concreet
      activiteitenplan.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3a
  - number: 3b.1
    text: |-
      De Minister kan subsidie verstrekken voor activiteiten in het kader van de aanschaf, lease en implementatie van
      e-health toepassingen die bijdragen aan de continuïteit van ondersteuning, zorg of jeugdhulp op afstand voor
      thuiswonende cliënten ten tijde van de coronacrisis of om de belemmeringen die het gevolg van deze crisis zijn op
      te heffen.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.2
    text: |-
      Subsidie wordt verstrekt aan aanbieders van ondersteuning of zorg en jeugdhulpaanbieders als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 3b.3
    text: |-
      Geen subsidie wordt verstrekt aan aanvragers die op 31 december 2019 een onderneming in moeilijkheden als bedoeld
      in artikel 2, punt 18 van Verordening (EU) nr. 651/2014 waren.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.4
    text: |-
      Op grond van deze regeling wordt slechts subsidie verstrekt voor activiteiten die worden verricht na 27 februari
      2020.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.5
    text: De projectperiode bedraagt maximaal 9 maanden.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.6
    text: Een activiteit komt slechts eenmaal voor subsidie op grond van onderhavige regeling in aanmerking.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.7
    text: Aanbieders, bedoeld in het tweede lid, kunnen maximaal twee keer subsidie als bedoeld in het eerste lid aanvragen.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.8
    text: |-
      Een tweede aanvraag als bedoeld in het zevende lid komt voor subsidie in aanmerking indien de activiteiten van de
      eerste aanvraag zijn afgerond.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: 3b.9
    text: Subsidie kan worden aangevraagd tot 1 juni 2020.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel3b
  - number: '4'
    text: 'Als subsidiabele kosten komen uitsluitend in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.a
    text: |-
      voor activiteiten van een innovatiecluster e-health: de kosten als bedoeld in artikel 27, vijfde en achtste lid,
      van de algemene groepsvrijstellingsverordening, met dien verstande dat de kosten als bedoeld in artikel 27, vijfde
      lid, tot een maximum van 20% van de totale subsidiabele kosten in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.b
    text: |-
      voor opleidingsactiviteiten e-health: de kosten als bedoeld in artikel 31, derde lid, van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.c
    text: |-
      voor visievorming e-health: loonkosten en kosten voor het verstrekken van advies en procesbegeleiding door
      kennisinstellingen of door onafhankelijke adviesorganisaties;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.d
    text: |-
      voor e-health toepassingen die bijdragen aan de continuïteit van ondersteuning of zorg als bedoeld in
      [artikel 3b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: 4.d.1°
    text: de kosten voor de aanschaf van e-health toepassingen;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.d.2°
    text: de lease- en licentiekosten van e-health toepassingen;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.d.3°
    text: loonkosten van professionals;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: 4.d.4°
    text: |-
      kosten voor het verstrekken van advies en procesbegeleiding door kennisinstellingen of onafhankelijke
      adviesorganisaties.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel4
  - number: '5.1'
    text: |-
      Het maximale percentage subsidie voor de activiteiten van een innovatiecluster e-health is 55% van de
      in aanmerking komende kosten, met inachtneming van artikel 27, zesde en negende lid, van de algemene
      groepsvrijstellingsverordening, tot een maximumbedrag subsidie van € 750.000.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel5
  - number: '5.2'
    text: |-
      Het maximale percentage subsidie voor opleidingsactiviteiten e-health is 70% van de in aanmerking komende kosten,
      met inachtneming van artikel 31, vierde lid, van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van [artikel 10.1 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] is het minimumbedrag subsidie
      voor een clusterorganisatie voor activiteiten van een innovatiecluster e-health € 50.000. Artikel 10.1 van de
      Kaderregeling subsidies OCW, SZW en VWS is niet van toepassing op subsidies voor opleidingsactiviteiten e-health en
      subsidies als bedoeld in [artikel 3a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041840#Artikel3a
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0041840
        artikel: 3a
  - number: '5.4'
    text: |-
      Het maximumbedrag subsidie voor een gezamenlijke subsidieaanvraag voor activiteiten van een innovatiecluster e-
      health en opleidingsactiviteiten e-health is € 750.000.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel5
  - number: '5.5'
    text: |-
      Het maximumbedrag subsidie voor de ondersteuning bij het komen tot een door de clusterorganisatie gedragen visie op
      het gebruik van e-health en doorvertaling hiervan in een concreet activiteitenplan is € 20.000.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel5
  - number: '5.6'
    text: |-
      Het subsidiebedrag voor e-health toepassingen die bijdragen aan continuïteit van ondersteuning of zorg als bedoeld
      in [artikel 3b][ref1] bedraagt maximaal € 50.000, waarvan het percentage subsidie voor de aanschafkosten of de
      lease- en licentiekosten van e-health toepassingen maximaal 50% van het totale subsidiebedrag bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '6.1'
    text: Het subsidieplafond voor 2020 bedraagt € 28.000.000 en voor 2021 € 15.000.000.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel6
  - number: '6.2'
    text: |-
      Het subsidieplafond voor subsidies als bedoeld in [artikel 3b][ref1] bedraagt € 23.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '6.3'
    text: |-
      De Minister verdeelt het ingevolge het subsidieplafond beschikbare bedrag op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel6
  - number: '7.1'
    text: Voor de aanvraag tot verlening van de subsidie wordt een door de Minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel7
  - number: '7.2'
    text: |-
      In aanvulling op [artikel 3.3 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de subsidieaanvraag
      vergezeld van een verklaring tot samenwerking ondertekend door tenminste één aanbieder en één inkoper van
      ondersteuning of zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
  - number: '7.3'
    text: |-
      In afwijking van het tweede lid, gaat de aanvraag voor een subsidie als bedoeld in [artikel 3a][ref1] vergezeld van
      een de-minimisverklaring, een beknopt plan van aanpak dat ingaat op hoe de clusterorganisatie komt tot een gedragen
      visie op het gebruik van e-health en doorvertaling hiervan in een concreet plan en een offerte indien gebruik is
      gemaakt van externe inhuur voor advies.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3a
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3a
  - number: '7.4'
    text: |-
      De aanvraag voor een subsidie als bedoeld in [artikel 3b][ref1] bedraagt een vast bedrag van € 50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '7.5'
    text: |-
      [Artikel 3.2, tweede lid, van de Kaderregeling subsidies OCW, SZW en VWS][ref1] is niet van toepassing op de
      aanvraag voor een subsidie als bedoeld in [artikel 3b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '7.6'
    text: |-
      De Minister verleent bij het besluit tot verlening van de subsidie als bedoeld in [artikel 3b][ref1] een voorschot
      van 100 procent van het bedrag van de verlening, dat direct zal worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '8'
    text: |-
      De aanvraag voor subsidie, bedoeld in [artikel 3][ref1] moet in voldoende mate voldoen aan de criteria in de
      bijlage van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: '3'
  - number: '9'
    text: 'Een subsidieaanvraag wordt in ieder geval afgewezen indien:'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel9
  - number: 9.a
    text: |-
      niet wordt voldaan aan het bepaalde in deze regeling en de [Kaderregeling subsidies OCW, SZW en VWS][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: 9.b
    text: er al een subsidie is verstrekt voor dezelfde activiteiten op grond van deze of een andere regeling;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel9
  - number: 9.c
    text: |-
      de de verstrekking van een subsidie als bedoeld in [artikel 3][ref1] niet in overeenstemming is met het bepaalde in
      de algemene groepsvrijstellingsverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: '3'
  - number: 9.d
    text: |-
      de verstrekking van een subsidie als bedoeld in [artikel 3a][ref1] niet in overeenstemming is met het bepaalde in
      de de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3a
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3a
  - number: '10.1'
    text: |-
      In aanvulling op [hoofdstuk 5 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] is de subsidieontvanger
      verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037603
        hoofdstuk: '5'
  - number: 10.1.a
    text: |-
      de inkoper die genoemd wordt in de verklaring als bedoeld in [artikel 7, tweede lid][ref1], de hele subsidieperiode
      te betrekken;


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel7
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: '7'
  - number: 10.1.b
    text: actief deel te nemen aan kennisdeling, onder andere door deelname aan bijeenkomsten en het delen van informatie;
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel10
  - number: 10.1.c
    text: |-
      mee te werken aan de monitoring van de voortgang van de beoogde tussen- en eindresultaten zoals opgenomen in de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel10
  - number: '10.2'
    text: |-
      De verplichtingen als bedoeld in het eerste lid zijn niet van toepassing indien de subsidieontvanger subsidie op
      grond van [artikel 3b][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0041840#Artikel3b
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041840
        artikel: 3b
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van 1 maart 2019 en vervalt met ingang van 1 januari 2022, met dien
      verstande dat zij van toepassing blijft op aanvragen die voor 1 januari 2022 zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Stimuleringsregeling E-health Thuis.'
    url: https://wetten.overheid.nl/BWBR0041840/2021-02-25#Artikel12
