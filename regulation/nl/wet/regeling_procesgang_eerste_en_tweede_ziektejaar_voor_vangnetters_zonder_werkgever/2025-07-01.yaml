---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_procesgang_eerste_en_tweede_ziektejaar_voor_vangnetters_zonder_werkgever
regulatory_layer: WET
publication_date: '2023-05-17'
valid_from: '2025-07-01'
bwb_id: BWBR0022309
url: https://wetten.overheid.nl/BWBR0022309/2025-07-01
preamble:
  text: |-
    Gelet op artikel 26, vierde lid, van de Wet werk en inkomen naar arbeidsvermogen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel1
  - number: 1.a
    text: |-
      de vangnetter: de persoon die op grond van [artikel 29, tweede lid, onderdeel a, b, c of d, van de Ziektewet][ref1]
      recht heeft op ziekengeld;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 1.b
    text: |-
      plan van aanpak: het plan van aanpak, bedoeld in
      [26, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel26
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '26'
  - number: '2.1'
    text: |-
      Het UWV vormt zich, indien er naar verwachting sprake is van dreigend langdurig ziekteverzuim van een vangnetter,
      binnen zes weken na de eerste dag van ongeschiktheid tot het verrichten van arbeid een oordeel over het
      desbetreffende ziektegeval.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het UWV vormt zich onverwijld een oordeel over het desbetreffende ziektegeval indien eerst na zes weken blijkt dat
      het ziekteverzuim van de vangnetter naar verwachting langdurig dreigt te zijn.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste en tweede lid vormt het UWV zich onverwijld een oordeel over het
      desbetreffende ziektegeval, indien er naar verwachting sprake is van dreigend langdurig ziekteverzuim
      en de aangifte, bedoeld in [artikel 38, tweede lid, van de Ziektewet][ref1], of de melding, bedoeld in
      [artikel 38ab, eerste lid van de Ziektewet][ref2], later wordt gedaan dan binnen zes weken na de eerste dag van
      ongeschiktheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38ab
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 38ab
  - number: '3.1'
    text: |-
      Het UWV houdt vanaf het moment waarop naar verwachting sprake is van dreigend langdurig ziekteverzuim aantekening
      als bedoeld in [artikel 25, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '3.2'
    text: |-
      Het UWV legt bij het houden van aantekening, bedoeld in het eerste lid, in ieder geval alle gegevens, documenten
      en correspondentie vast die betrekking hebben op het verloop van het ziekteverzuim, het aantal feitelijk gewerkte
      uren, en de op grond van deze regeling ondernomen activiteiten.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel3
  - number: '4.1'
    text: |-
      Indien uit het oordeel van het UWV, bedoeld in [artikel 2][ref1], blijkt dat er nog mogelijkheden zijn om de
      terugkeer naar arbeid van de vangnetter te bevorderen stelt het UWV, in overleg met die vangnetter, binnen twee
      weken na het oordeel een plan van aanpak op.


      [ref1]: https://wetten.overheid.nl/BWBR0022309#Artikel2
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022309
        artikel: '2'
  - number: '4.2'
    text: 'Het plan van aanpak omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
  - number: 4.2.a
    text: |-
      de door de vangnetter en het UWV te ondernemen activiteiten gericht op inschakeling in de arbeid, de daarmee te
      bereiken doelstellingen, de termijnen waarbinnen die doelstellingen naar verwachting kunnen worden bereikt, alsmede
      de visie van de werknemer hierop;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
  - number: 4.2.b
    text: |-
      afspraken omtrent de momenten waarop de in het plan van aanpak vastgelegde activiteiten door de vangnetter en het
      UWV periodiek worden geëvalueerd, waarbij die evaluatie de visie van de werknemer hierop omvat; en
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
  - number: 4.2.c
    text: |-
      aanwijzing van een persoon die de vastgelegde activiteiten begeleidt en het contact verzorgt tussen de vangnetter
      en het UWV.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het plan van aanpak wordt schriftelijk vastgelegd. Het UWV verstrekt hiervan onverwijld een afschrift aan de
      vangnetter en de in het tweede lid, onderdeel c, bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
  - number: '4.4'
    text: |-
      Het plan van aanpak wordt bijgesteld indien de evaluatie van dat plan van aanpak of het geneeskundige onderzoek,
      bedoeld in [artikel 28 van de Ziektewet][ref1], daartoe aanleiding geeft. Het eerste tot en met derde lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel28
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '28'
  - number: 4a
    text: |-
      Het UWV verwijst de vangnetter voor werkhervatting naar de werkgever waar hij laatstelijk op grond van een
      uitzendovereenkomst met een uitzendbeding als bedoeld in [artikel 7:691, lid 2, van het Burgerlijk Wetboek][ref1]
      in dienst was, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel691
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '691'
  - number: 4a.a
    text: |-
      de werkgever op grond van [artikel 5.2 van de Regeling Wfsv][ref1] is aangesloten bij sector 52;


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
  - number: 4a.b
    text: sprake is van dreigend langdurig ziekteverzuim van de vangnetter; en
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4a
  - number: 4a.c
    text: |-
      de vangnetter in staat is passende arbeid als bedoeld in [artikel 30, eerste lid, van de Ziektewet][ref1] te
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel30
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '30'
  - number: '5.1'
    text: |-
      Onverminderd de periodieke evaluatie, bedoeld in [artikel 4, tweede lid, onderdeel b][ref1], vindt er na afloop van
      ieder tijdvak van 26 weken een periodieke herijking plaats. Bij de periodieke herijking wordt beoordeeld of de re-
      integratiedoelstelling van het afgelopen tijdvak is behaald en wordt voor het komende tijdvak vastgesteld wat de te
      behalen re-integratiedoelstelling zal zijn en welke aanpak daartoe is vereist. [Artikel 4, derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022309#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022309#Artikel4
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022309
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022309
        artikel: '4'
  - number: '5.2'
    text: Het plan van aanpak wordt bijgesteld indien de periodieke herijking daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel5
  - number: '6'
    text: |-
      Van de termijnen, bedoeld in de [artikelen 2][ref1], [4][ref2] en [5][ref3], kan door het UWV, na overleg met de
      vangnetter, gemotiveerd worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0022309#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022309#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022309#Artikel5
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022309
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022309
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0022309
        artikel: '5'
  - number: '7'
    text: |-
      Het re-integratieverslag, bedoeld in [artikel 25, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1]
      bevat met betrekking tot de vangnetter in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 7.a
    text: de noodzakelijke administratieve gegevens van de vangnetter en het UWV;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.b
    text: gegevens omtrent de door de vangnetter laatst verrichte functie;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.c
    text: gegevens omtrent de bekwaamheden van de vangnetter;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.d
    text: vermelding van de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.e
    text: |-
      het oordeel van het UWV, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022309#Artikel2
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022309
        artikel: '2'
  - number: 7.f
    text: |-
      het plan van aanpak en de bijstellingen, bedoeld in [artikel 4, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022309#Artikel4
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022309
        artikel: '4'
  - number: 7.g
    text: |-
      de resultaten van iedere periodieke herijking als bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022309#Artikel5
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022309
        artikel: '5'
  - number: 7.h
    text: de meest recente evaluatie van de voortgang en de uitvoering van de in het plan van aanpak gemaakte afspraken;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.i
    text: |-
      een actueel oordeel van het UWV over het verloop van de ongeschiktheid tot werken, de functionele beperkingen en
      mogelijkheden van de vangnetter tot het verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.j
    text: een actueel oordeel van het UWV over de aanwezigheid van passende arbeid, en
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: 7.k
    text: een oordeel van de vangnetter omtrent de op grond van de onderdelen a tot en met i opgenomen gegevens en oordelen.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel7
  - number: '8'
    text: |-
      Deze regeling is niet van toepassing met betrekking tot personen die voor de dag van de inwerkingtreding van deze
      regeling recht hadden op ziekengeld voor de duur van dat recht op ziekengeld.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het bij koninklijke boodschap van 13 december 2006
      ingediende voorstel van wet houdende regels tot bevordering van de activering van personen die aanspraak maken op
      een uitkering op grond van de Ziektewet (Kamerstukken II 2006/2007, 30 909, nr. 1), tot wet wordt verheven en in
      werking treedt.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling wordt aangehaald als: Regeling procesgang eerste en tweede ziektejaar voor vangnetters zonder
      werkgever.
    url: https://wetten.overheid.nl/BWBR0022309/2025-07-01#Artikel10
