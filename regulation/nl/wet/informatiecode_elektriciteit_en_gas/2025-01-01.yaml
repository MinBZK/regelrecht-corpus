  - number: 1.1.7
    text: |-
      Een leverancier is voor alle kleinverbruikaansluitingen waarvoor hij in het aansluitingenregister als leverancier
      staat geregistreerd, verantwoordelijk voor de distributie van de vastgestelde meterstanden.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.7
  - number: 1.1.8
    text: |-
      Waar in [paragrafen 5.1.2][ref1] en [5.1.3][ref2] is gesteld dat de leverancier verantwoordelijk is voor het
      collecteren, valideren en vaststellen van meterstanden, schakelt de leverancier een meetbedrijf in, als bedoeld in
      [artikel 95ca, eerste lid, van de Elektriciteitswet 1998][ref3] en [artikel 44a, eerste lid, van de Gaswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 1.1.9
    text: |-
      Het meetbedrijf, bedoeld in [1.1.8][ref1], zal fouten in de meetgegevens die worden geconstateerd door de
      leverancier onverwijld corrigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel1
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 1.1.10
    text: |-
      Daar waar in deze code de leverancier wordt genoemd, wordt programmaverantwoordelijke gelezen indien een
      aangeslotene met een grootverbruikaansluiting geen leverancier heeft. In dat geval machtigt de aangeslotene zijn
      programmaverantwoordelijke om de in deze code aan de leverancier toegeschreven handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.10
  - number: 1.1.11
    text: |-
      Daar waar in deze code sprake is van een programmaverantwoordelijke, wordt de BRP bedoeld voor elektriciteit en de
      erkende programmaverantwoordelijke voor gas.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.11
  - number: 1.1.12
    text: |-
      In deze code wordt, ingeval van een meetinrichting met meer dan één telwerk, met meterstand tevens meterstanden
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.12
  - number: 1.1.13
    text: |-
      De aansluitinggegevensprocessen uit [hoofdstuk 2][ref1], de mutatieprocessen uit de [hoofdstukken 3][ref2] en
      [4][ref3] en de meetgegevensprocessen uit de [hoofdstukken 5][ref4] en [6][ref5], en de [bijlagen 1][ref6]
      en [2][ref7], zijn, in geval van elektriciteit, van toepassing per allocatiepunt, met uitzondering van
      de [artikelen 2.1.1a][ref8], [2.1.1b][ref9], 2.1.1c, [2.1.3, onderdeel t][ref10], [2.1.5a][ref11], de
      [paragrafen 2.9][ref12] en [2.10][ref13], de [artikelen 6.2.2.2][ref14], [6.2.2.2a][ref15], [6.2.2.6][ref16] en
      [6.2.2.6a][ref17] en [paragraaf 6.3.11][ref18].


