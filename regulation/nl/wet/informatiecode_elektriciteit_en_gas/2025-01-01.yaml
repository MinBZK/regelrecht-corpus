  - number: 3.14.2.1
    text: |-
      Onder een onterechte uithuizing wordt verstaan de uitvoering van de procedure, bedoeld in [3.2][ref1], op een
      aansluiting waarbij de aangeslotene niet daadwerkelijk de aansluiting heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.14.2.2
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte uithuizing op een aansluiting, dient uiterlijk
      één werkdag nadien, ter correctie een inhuizingsmelding in overeenkomstig [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.2.3
    text: |-
      Indien door de uitvoering van de onterechte uithuizing het in [2.1.4, onderdeel b][ref1], bedoelde kenmerk
      is gewijzigd, met als gevolg dat de meetinrichting op afstand uitgelezen mag worden, meldt de leverancier dit
      onmiddellijk aan de netbeheerder nadat hij de inhuizingsmelding ter correctie heeft ingediend zoals bedoeld in
      [3.14.1.4][ref2]. In afwijking van [paragraaf 9.1][ref3] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
