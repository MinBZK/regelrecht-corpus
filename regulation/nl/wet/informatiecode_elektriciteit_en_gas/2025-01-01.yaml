      muteert de regionale netbeheerder de allocatiemethode onmiddellijk naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.11.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.11.1.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2][ref1] over de mutatie, bedoeld in
      [3.11.1.1][ref2] en in voorkomende gevallen over de mutatie bedoeld in [3.11.1.1a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.11.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.11'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.11'
  - number: 3.11.2.1
    text: |-
      De regionale netbeheerder voert bij een wisseling of wijziging van een kleinverbruikmeetinrichting een fysieke
      meteropname uit overeenkomstig [paragraaf 5.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.11.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 3.12.1.1
    text: |-
      De leverancier stuurt een melding wijzigen naam op de werkdag voor de beoogde wijziging naar de regionale
      netbeheerder, indien de registratie van de naam van de aangeslotene wijzigt zonder dat hiervoor een nieuw
      leveringscontract wordt aangegaan. De melding wijzigen naam bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.1.1
  - number: 3.12.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.1.1
  - number: 3.12.1.1.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.1.1
  - number: 3.12.1.1.d
    text: de gewijzigde naam van de aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.1.1
  - number: 3.12.1.1.e
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.1.1
  - number: 3.12.2.1
    text: 'Naar aanleiding van de melding wijzigen naam controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.1
  - number: 3.12.2.1.a
    text: de melding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.1
  - number: 3.12.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.1
  - number: 3.12.2.1.c
    text: de melding wijzigen naam wordt ingediend door de in het aansluitingenregister vermelde leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.1
  - number: 3.12.2.1.d
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting met een eerdere of dezelfde datum.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.1
  - number: 3.12.2.2
    text: |-
      Als alle controles uit [3.12.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.12.2.4][ref2]. Als dat niet het geval is, wordt de wijziging naam niet uitgevoerd en wordt de procedure na
      [3.12.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.12'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.12'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 3.12.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de wijziging naam naar aanleiding van [3.12.2.2][ref1]
      uiterlijk de werkdag na ontvangst van de melding wijzigen naam aan de leverancier die de melding heeft ingediend en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 3.12.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.d
    text: 'indien aangeleverd in de melding wijzigen naam: het referentienummer van de leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.e
    text: 'de reden voor het niet uitvoeren van de melding wijzigen naam:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.e.1
    text: de melding wijzigen naam is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.e.3
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.3.e.4
    text: |-
      de melding wijzigen naam conflicteert met een eerder bevestigde, doch nog niet geëffectueerde leverancierswitch-,
      inhuizings-, uithuizings- of eindeleveringsmelding.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.3
  - number: 3.12.2.4
    text: |-
      De regionale netbeheerder bevestigt de geplande uitvoering van de melding wijzigen naam uiterlijk de werkdag na
      ontvangst van de melding wijzigen naam aan de leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.4
  - number: 3.12.2.4.a
    text: de EAN-code van de aansluiting
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.4
  - number: 3.12.2.4.b
    text: 'indien aangeleverd in de melding wijzigen naam: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.2.4
  - number: 3.12.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding voor dezelfde aansluiting is ontvangen voor een eerdere of dezelfde
      mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.12.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13.1.1
    text: |-
      Op verzoek van de aangeslotene wijzigt de regionale netbeheerder de administratieve status van de
      kleinverbruikmeetinrichting, bedoeld in [2.1.4 onderdeel b][ref1], van de kleinverbruikmeetinrichting die op
      afstand uitleesbaar is in het aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13.1.1a
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, en het verzoek van de aangeslotene inhoudt dat de kleinverbruikmeetinrichting administratief uit
      wordt gezet, collecteert de regionale netbeheerder de dan geldende meterstand(en) en stelt deze vast. Vervolgens
      muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie” met inachtneming van
      [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13.1.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2][ref1] over de mutatie, bedoeld in
      [3.13.1.1][ref2] en in voorkomende gevallen over de mutatie bedoeld in [3.13.1.1a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.13'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.13'
  - number: 3.13.1.3
    text: |-
      De meetinrichting waarvan de administratieve status op ”uit” is gezet wordt beschouwd als een meetinrichting die
      niet op afstand uitleesbaar is.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13.1.3
  - number: 3.13a.1.1
    text: |-
      Indien de regionale netbeheerder constateert dat de kleinverbruikmeetinrichting vanwege externe factoren van
      technische aard niet op afstand uitleesbaar is, dan wijzigt de regionale netbeheerder het kenmerk als bedoeld in
      [2.1.4, onderdeel g][ref1] dienovereenkomstig met inachtneming van [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13a.1.2
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3, onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft en de regionale netbeheerder de uitleesbaarheid van de kleinverbruikmeetinrichting, zoals bedoeld
      in [2.1.4, onderdeel g][ref2] wijzigt naar “niet op afstand uitleesbaar”, dan:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13a.1.2.(i)
    text: |-
      collecteert de regionale netbeheerder de dan geldende meterstand overeenkomstig [5.2.2][ref1], of indien zulks
      onmogelijk is,


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 3.13a.1.2.(ii)
    text: |-
      berekent de regionale netbeheerder de dan geldende meterstand overeenkomstig [5.1.3.3][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.13a.1.3
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2][ref1] over de mutatie bedoeld in
      [3.13a.1.1][ref2] en in voorkomende gevallen over de mutatie bedoeld in [3.13a.1.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.13a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.13a
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.13a
  - number: 3.14.1.1
    text: |-
      Onder een onterechte switch van leverancier wordt verstaan de uitvoering van de procedure, als bedoeld in
      [paragraaf 3.1][ref1], op een aansluiting waarvoor geen leveringsovereenkomst voor de desbetreffende periode tot
      stand is gekomen tussen de aangeslotene en de leverancier die de switchmelding heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.14.1.2
    text: |-
      De leverancier, die constateert dat er vermoedelijk sprake is van een onterechte switch van leverancier voor
      een aansluiting waarop een leverancier is geregistreerd in het aansluitingenregister, neemt hierover binnen
      vijf werkdagen contact op met de andere betrokken leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.1.3
    text: |-
      De leverancier, die de in [3.14.1.2][ref1] bedoelde melding heeft ontvangen, reageert binnen 10 werkdagen
      en geeft daarbij aan of al dan niet sprake is van een onterechte switch van leverancier. In afwijking van
      [paragraaf 9.1][ref2] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.14'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.1.4
    text: |-
      Indien de onterechte switch van leverancier is bevestigd, dient de leverancier die voor de desbetreffende
      aansluiting uit het aansluitingenregister is verwijderd uiterlijk één werkdag nadien, ter correctie een
      switchmelding in overeenkomstig [paragraaf 3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.14.1.5
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte switch van leverancier voor een aansluiting
      waarop geen leverancier is geregistreerd in het aansluitingenregister, dient uiterlijk één werkdag nadien
      overeenkomstig [paragraaf 3.2][ref1] een uithuizingsmelding in ter correctie van de onterechte switch bedoeld in
      [3.14.1.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.1.6
    text: |-
      Indien door de uitvoering van de onterechte switch van leverancier het in [2.1.4, onderdeel b][ref1], bedoelde
      kenmerk is gewijzigd, met als gevolg dat de meetinrichting op afstand uitgelezen mag worden, meldt de leverancier
      dit onmiddellijk aan de netbeheerder nadat hij de switchmelding ter correctie heeft ingediend zoals bedoeld in
      [3.14.1.4][ref2]. In afwijking van [paragraaf 9.1][ref3] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
