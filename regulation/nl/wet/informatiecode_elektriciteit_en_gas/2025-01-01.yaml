    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
  - number: 6.9.2.7.c
    text: de wederpartij is niet akkoord met het te verrekenen verbruik en stelt een alternatief verbruik voor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
  - number: 6.9.2.7.d
    text: de wederpartij is niet akkoord met te hanteren tarief en stelt een alternatief tarief voor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
  - number: 6.9.2.7.e
    text: de wederpartij is niet akkoord met de maximale te verrekenen periode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
  - number: 6.9.2.7.f
    text: de wederpartij is geen leverancier in voorgaande periode(n) van levering;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
  - number: 6.9.2.7.g
    text: het te verrekenen verbruik is minder dan 1000 kWh of 500 m3.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
  - number: 6.9.2.8
    text: 'De verzoekende marktpartij accepteert de ontvangen afwijzing, tenzij hij binnen tien werkdagen:'
