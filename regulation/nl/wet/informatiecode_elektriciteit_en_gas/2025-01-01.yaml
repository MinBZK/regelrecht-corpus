    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.2
  - number: 2.2b.2.e
    text: de klantsleutel overeenkomt met de klantsleutel in de klantsleuteladministratie.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.2
  - number: 2.2b.3
    text: |-
      Indien de in [2.2b.2][ref1] bedoelde controle één of meer negatieve resultaten oplevert, verstrekt de regionale
      netbeheerder de opgevraagde gegevens niet en stuurt hij de leverancier onverwijld een bericht onder vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.3
