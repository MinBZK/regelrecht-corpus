  - number: 2.2a.1
    text: |-
      Een leverancier kan ten behoeve van de identificatie van de aansluiting gegevens van de desbetreffende aansluiting
      opvragen bij de netbeheerder onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.1.a.(i)
    text: de EAN-code van de aansluiting, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.1.a.(ii)
    text: de adresgegevens van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.1.b
    text: 'indien de opvragende leverancier dat wenst op te geven, een of meer van de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.1.b.(i)
    text: de productsoort,
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.1.b.(ii)
    text: het verbruikssegment,
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.1.b.(iii)
    text: een referentienummer van de opvragende leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.1
  - number: 2.2a.2
    text: |-
      Naar aanleiding van een opvraag zoals bedoeld in [2.2a.1][ref1] controleert de netbeheerder of de opvraag volledig
      en syntactisch correct is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 2.2a.3
    text: |-
      Indien de in [2.2a.2][ref1] bedoelde controle één of meer negatieve resultaten oplevert, verstrekt de netbeheerder
      de opgevraagde gegevens niet en stuurt hij de leverancier onverwijld een bericht onder vermelding van de reden van
      afwijzing: de opvraag is niet volledig of syntactisch onjuist.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 2.2a.4
    text: |-
      Tenzij [2.2a.3][ref1] van toepassing is, stuurt de netbeheerder een bericht naar de leverancier en verstrekt
      daarbij, naar aanleiding van de in [2.2a.1][ref2] bedoelde opvraag, de gegevens als bedoeld in [B7.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2a
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2a
      - id: ref3
        bwb_id: BWBR0037934
  - number: 2.2a.5
    text: |-
      De netbeheerder verstuurt de in [2.2a.4][ref1] bedoelde gegevens, die betrekking hebben op de dag voorafgaand aan
      de dag van ontvangst van de opvraag, zo snel mogelijk doch uiterlijk de werkdag na ontvangst van de opvraag aan de
      opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2a.5
