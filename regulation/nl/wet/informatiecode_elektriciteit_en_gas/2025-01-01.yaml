  - number: 2.5.9
    text: De leverancier verstrekt de opgevraagde contractgegevens binnen 72 uur aan de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.9
  - number: 2.5.10
    text: |-
      De netbeheerder bewaart de ontvangen contractgegevens zo lang als noodzakelijk is ten behoeve van aanhangige
      geschillen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.10
  - number: 2.5.11
    text: |-
      Het is een leverancier uitsluitend toegestaan gegevens uit het contracteindegegevensregister op te vragen ten
      behoeve van
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.11
  - number: 2.5.11.a
    text: |-
      het doen van een aanbod voor levering, zoals vastgelegd in [paragraaf 2.5a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.11
    references:
