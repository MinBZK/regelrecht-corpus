        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.2
    text: |-
      Ten behoeve van de verrekening als bedoeld [5.6.1.2][ref1] en op verzoek van de belanghebbende leverancier,
      verstrekt de netbeheerder de bedrijfsgegevens van de leverancier of de programmaverantwoordelijke betreffende de
      periodes van levering waartoe de bedoelde verbruiken behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.3
    text: |-
      De belanghebbende leverancier, programmaverantwoordelijke of netbeheerder initieert het verrekenen door een
      verrekenverzoek bij de betrokken wederpartij in te dienen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.3
  - number: 5.6.2.4
    text: 'Het verrekenverzoek bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.b
    text: |-
      het type melding als bedoeld in de [paragrafen 3.1 tot en met 3.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.6.2.4.c
    text: de mutatiedatum behorende bij de melding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.d
    text: de periode waarop de beoogde verrekening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.e
    text: 'Indien het verzoek verrekenen van verbruik betreft:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.e.1
    text: de vastgestelde standen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.e.2
    text: de gehanteerde correctie standen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.e.3
    text: het te verrekenen verbruik;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.e.4
    text: |-
      het te hanteren tarief per kWh respectievelijk m3 behorende bij de periode van levering waarin een verbruik wordt
      toegewezen zoals bedoeld in [5.6.1.2][ref1] en [5.6.1.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.4.f
    text: 'Indien het verzoek het verrekenen van nettarieven betreft:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.f.1
    text: de bij deze periode behorende capaciteitstarief-EAN-code(s); en
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.f.2
    text: het totaal bedrag van de beoogde verrekening;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.4.g
    text: een toelichting op het verzoek tot verrekening.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.4
  - number: 5.6.2.5
    text: |-
      Het te hanteren tarief als bedoeld in [5.6.2.4, onderdeel e, onder 4°][ref1] wordt per kwartaal centraal
      gepubliceerd door het platform als bedoeld in [9.1.1][ref2] en als volgt bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 5.6.2.5.I
    text: |-
      voor elektriciteit: het rekenkundig 12-maandsgemiddelde van de gepubliceerde Tennet-reconciliatieprijzen
      voorafgaand aan het desbetreffende kwartaal op basis van de verhouding 55% Peak en 45% OffPeak,
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.5
  - number: 5.6.2.5.II
    text: |-
      voor gas: het rekenkundig 12-maandsgemiddelde van de gepubliceerde GTS-Neutral gasprijzen voorafgaand aan het
      desbetreffende kwartaal.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.5
  - number: 5.6.2.6
    text: |-
      De wederpartij accepteert het verrekenverzoek tenzij de wederpartij uiterlijk binnen één maand het verzoek
      gemotiveerd afwijst onder vermelding van één of meer van de volgende redenen:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.a
    text: |-
      er is op grond van [paragraaf 5.6.1][ref1] geen verplichting tot verrekening;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.6.b
    text: het verzoek is onvolledig;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.c
    text: de wederpartij is niet akkoord met het te verrekenen verbruik en stelt een alternatief verbruik voor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.d
    text: de wederpartij is niet akkoord met te hanteren tarief en stelt een alternatief tarief voor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.e
    text: de wederpartij is niet akkoord met de maximale te verrekenen periode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.f
    text: de wederpartij is geen leverancier in voorgaande periode van levering;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.g
    text: het te verrekenen verbruik is minder dan 1.000 kWh of 500 m3;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
  - number: 5.6.2.6.h
    text: |-
      de periode van levering betreft een periode als bedoeld in de [paragrafen 3.14.1 tot en met 3.14.5][ref1] waarbij
      een nul-verbruik is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 5.6.2.7
    text: |-
      De verzoekende leverancier, programmaverantwoordelijke of netbeheerder accepteert de ontvangen afwijzing, tenzij
      hij binnen tien werkdagen:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.7
  - number: 5.6.2.7.a
    text: |-
      een nieuw verzoek indient gelet op [5.6.2.6, onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.7.b
    text: |-
      in overleg treedt met de wederpartij gelet op [5.6.2.6, onderdelen c, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.8
    text: |-
      Het overleg bedoeld in [5.6.2.7, onderdeel b][ref1], leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.8.a
    text: |-
      een nieuw verzoek zoals bedoeld in [5.6.2.4][ref1] met het overeengekomen te verrekenen verbruik of te hanteren
      tarief;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.8.b
    text: een geschilbeslechting door een derde ter vaststelling van het te verrekenen verbruik of het te hanteren tarief;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.8
  - number: 5.6.2.8.c
    text: |-
      het beëindigen van het verrekenproces voor betreffende aansluiting door de marktpartij als bedoeld in
      [5.6.2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.9
    text: |-
      De leverancier, programmaverantwoordelijke of netbeheerder die recht heeft op vergoeding van de kosten, neemt
      maandelijks de verrekeningen van de voorgaande maand op in één verrekenfactuur tenzij anders overeengekomen. De
      verrekenfactuur bevat per verrekening de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.9
  - number: 5.6.2.9.a
    text: EAN-code van de desbetreffende aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.9
  - number: 5.6.2.9.b
    text: het overeengekomen of vastgestelde te verrekenen verbruik;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.9
  - number: 5.6.2.9.c
    text: het overeengekomen of vastgestelde te hanteren tarief;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.9
  - number: 5.6.2.9.d
    text: het totaalbedrag van de verrekening.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.9
  - number: 5.6.2.10
    text: |-
      De wederpartij accepteert de verrekenfactuur binnen een maand na ontvangst, tenzij hij de factuur binnen tien
      werkdagen gemotiveerd afwijst.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.10
  - number: 5.6.2.11
    text: |-
      De leverancier, programmaverantwoordelijke of netbeheerder accepteert de ontvangen afwijzing of stuurt zo
      spoedig mogelijk een correcte verrekenfactuur naar de wederpartij die hem accepteert of afwijst overeenkomstig
      [5.6.2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.12
    text: |-
      In afwijking van [paragraaf 9.1][ref1] vindt de op grond van [paragraaf 5.6.2][ref2] uit te wisselen informatie
      niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.12
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 6.1.1.1
    text: |-
      De meetverantwoordelijke stelt voor mutatieprocessen en voor de plaatsing, wijziging of wegname
      van grootverbruikmeetinrichtingen, zoals bedoeld in [paragrafen 4.1 tot en met 4.8][ref1] en
      [4.10 tot en met 4.12][ref2], overeenkomstig [6.2][ref3] voor elektriciteitsaansluitingen en [6.4][ref4] voor
      gasaansluitingen, gevalideerde meterstand vast voor grootverbruikaansluitingen, die niet behoren tot de categorieën
      zoals genoemd in [6.1.1.2][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.10'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.1.2
    text: |-
      De meetverantwoordelijke stelt voor mutatieprocessen, zoals bedoeld in [6.1.1.1][ref1], geen
      meterstand vast voor gasaansluitingen behorend tot de afnamecategorie GGV, GXX, GIS of GIN, bedoeld in
      [paragraaf 4.3.1 van de Allocatiecode gas][ref2], of voor elektriciteitsaansluitingen die onbemeten zijn op grond
      van [artikel 2.30, eerste lid van de Netcode elektriciteit](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '4'
  - number: 6.1.1.3
    text: |-
      De meetverantwoordelijke stuurt de vastgestelde meterstand en indien geen sprake is van een proces volgens
      [paragraaf 4.3][ref1] of [4.10][ref2], het berekende verbruik, zoals bedoeld in [6.1.1.1][ref3], uiterlijk de
      tiende werkdag van de maand volgend op de mutatiedatum aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.10'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.1.4
    text: |-
      De netbeheerder stelt namens de meetverantwoordelijke een verbruik vast, indien de netbeheerder voor de
      mutatieprocessen als bedoeld in de [paragrafen 4.1][ref1], [4.2][ref2], [4.4][ref3], [4.5][ref4], [4.11][ref5] en
      [4.12][ref6] de tiende werkdag van de maand volgend op de mutatiedatum geen vastgestelde meterstand en verbruik
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref5
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.11'
      - id: ref6
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 6.1.1.5
    text: |-
      De netbeheerder stuurt uiterlijk de vijftiende werkdag van de maand volgende op de mutatiedatum de meetgegevens,
      bedoeld in [6.1.1.4][ref1], naar de meetverantwoordelijke. In afwijking van [paragraaf 9.1][ref2] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 6.1.1.6
    text: |-
      De meetverantwoordelijke verwerkt de meetgegevens, bedoeld in [6.1.1.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.2.1
    text: |-
      De netbeheerder verstuurt uiterlijk de vijftiende werkdag van de maand volgend op de mutatiedatum de meetgegevens,
      zoals bedoeld in [6.1.1.3][ref1] of [6.1.1.4][ref2], naar de leverancier, waarbij wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.2.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
  - number: 6.1.2.1.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
  - number: 6.1.2.1.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
  - number: 6.1.2.1.d
    text: de startdatum van de verbruiksperiode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
  - number: 6.1.2.1.e
    text: de einddatum van de verbruiksperiode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
  - number: 6.1.2.1.f
    text: |-
      het verbruik, bedoeld onder [6.1.1.3][ref1] of [6.1.1.4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.2.1.g
    text: de meterstand behorend bij de mutatiedatum.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.1.2.1
  - number: 6.2.2.2
    text: |-
      De meetverantwoordelijke zendt de vastgestelde meetgegevens, bedoeld in [artikel 5.3.11 van de Meetcode
      elektriciteit](onbekend), per richting afzonderlijk, voor alle telemetriegrootverbruikaansluitingen waarvoor hij
      meetverantwoordelijkheid draagt, uiterlijk de eerstvolgende kalenderdag vóór 10:00 uur naar de netbeheerder en de
      programmaverantwoordelijke die actief is op de aansluiting op de dag waarop de meetgegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.2
  - number: 6.2.2.3
    text: |-
      De meetverantwoordelijke verzendt voor alle telemetriegrootverbruikaansluitingen waarvoor hij
      meetverantwoordelijkheid draagt, aan de netbeheerder en aan de programmaverantwoordelijke die actief is op de
      aansluiting op de dag waarop de meetgegevens betrekking hebben, zo spoedig mogelijk na vaststellen doch uiterlijk
      vóór 24:00 uur van de negende werkdag na de desbetreffende dag:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.3
  - number: 6.2.2.3.a
    text: de berekende of aanvullende meetgegevens bedoeld in [artikel 5.3.11 van de Meetcode elektriciteit](onbekend);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.3
  - number: 6.2.2.3.b
    text: de herziene meetgegevens bedoeld in [artikel 5.5.3 van de Meetcode elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.3
  - number: 6.2.2.4
    text: |-
      In geval van een telemetriegrootverbruikaansluiting waaraan een of meer secundaire allocatiepunten zijn toegekend,
      zijn [artikelen 6.2.2.2][ref1] en [6.2.2.3][ref2] van toepassing op elk afzonderlijk allocatiepunt dat aan deze
      aansluiting is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.6
    text: |-
      De meetverantwoordelijke verstrekt maandelijks, uiterlijk de tiende werkdag van de maand na de maand waarop
      de meetgegevens, bedoeld in [artikel 5.3.11 van de Meetcode elektriciteit](onbekend) betrekking hebben, aan de
      netbeheerder per overdrachtspunt:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6.a
    text: |-
      de werkelijke (gecorrigeerde) hoeveelheid met het net uitgewisselde energie per richting, onderscheiden naar
      normaaluren en laaguren, waarbij in geval van een meetinrichting met één telwerk deze beide hoeveelheden worden
      bepaald op basis van de waarden per onbalansverrekeningsperiode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6.b
    text: |-
      de tellerstand(en) (normaaltelwerk en laagtelwerk of in geval van een meetinrichting met één telwerk:
      enkeltelwerk);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6.c
    text: de bij de tellerstanden behorende vermenigvuldigingsfactoren;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6.d
    text: de bij de tellerstand behorende herkomstindicatie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6.e
    text: indien van toepassing de kW, per week of per maand;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6.f
    text: indien van toepassing de hoeveelheid met het net uitgewisselde blindenergie.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6
  - number: 6.2.2.6a
    text: |-
      De meetverantwoordelijke verstrekt maandelijks, uiterlijk de tiende werkdag van de maand na de maand waarop
      de meetgegevens, bedoeld in [artikel 5.3.11 van de Meetcode elektriciteit](onbekend) betrekking hebben, aan de
      netbeheerder en aan de programmaverantwoordelijke die actief is op het allocatiepunt in de maand of het deel van de
      maand waarop de meetgegevens bedoeld in artikel 5.3.11 van de Meetcode elektriciteit betrekking hebben, de volgende
      gegevens per allocatiepunt:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6a
  - number: 6.2.2.6a.a
    text: |-
      de (gecorrigeerde) hoeveelheid met het net uitgewisselde energie per richting, onderscheiden naar normaaluren en
      laaguren, waarbij in geval van een meetinrichting met één telwerk deze beide hoeveelheden worden bepaald op basis
      van de waarden per onbalansverrekeningsperiode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6a
  - number: 6.2.2.6a.b
    text: 'per leveringsrichting, per kalenderdag, per onbalansverrekeningsperiode:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6a
  - number: 6.2.2.6a.b.1
    text: de (gecorrigeerde) hoeveelheid met het net uitgewisselde energie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6a
  - number: 6.2.2.6a.b.2
    text: |-
      de herkomstindicatie, validatiestatus en indien van toepassing een reparatiemethodiek voor elk onder 1° genoemde
      waarde.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6a
  - number: 6.2.2.6b
    text: |-
      De overdracht van meetgegevens bedoeld in [6.2.2.6][ref1] en [6.2.2.6a][ref2] vindt plaats overeenkomstig hetgeen
      daaromtrent in [paragraaf 13.5 van de Netcode elektriciteit][ref3] is bepaald, waarbij voor ‘BRP’ indien daar van
      toepassing ook ‘meetverantwoordelijke’ gelezen kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Paragraaf13.5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.6b
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037940
        paragraaf: '13.5'
  - number: 6.2.2.7
    text: |-
      In geval van een profielgrootverbruikmeetinrichting op een aansluiting groter dan 3x80A en een
      productiemeetinrichting, worden de meetgegevens bedoeld in [artikel 5.2.13 van de Meetcode elektriciteit](onbekend)
      maandelijks, uiterlijk op de tiende werkdag na de dag van vaststelling zoals bedoeld in [artikel 5.2.11 van de
      Meetcode elektriciteit](onbekend) aan de netbeheerder verstrekt.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.7
  - number: 6.2.2.8
    text: |-
      In geval van een profielgrootverbruikmeetinrichting op een aansluiting kleiner dan of gelijk aan 3x80A, verstrekt
      de meetverantwoordelijke de meetgegevens bedoeld in [artikel 5.2.13 van de Meetcode elektriciteit](onbekend)
      jaarlijks, uiterlijk op de tiende werkdag na de dag van vaststelling zoals bedoeld in [artikel 5.2.11 van de
      Meetcode elektriciteit](onbekend) aan de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.2.8
  - number: 6.2.3.1
    text: |-
      Bij een constatering dat de meetgegevens onjuist zijn nadat de gegevens, bedoeld in [6.1.1.3][ref1] of
      [6.2.2.6 tot en met 6.2.2.8][ref2], verstuurd zijn en de werkelijke hoeveelheid met het net uitgewisselde energie
      te achterhalen is, verstrekt de meetverantwoordelijke een meetcorrectierapport aan de aangeslotene(n) binnen tien
      werkdagen nadat de onvolkomenheid geconstateerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.3.2
    text: |-
      In het meetcorrectierapport neemt de meetverantwoordelijke, per periode waarvoor de betrokken
      programmaverantwoordelijke, leverancier of netbeheerder gezamenlijk verantwoordelijk zijn, tenminste de volgende
      gegevens op:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.2
  - number: 6.2.3.2.a
    text: de eerder gecommuniceerde hoeveelheid met het net uitgewisselde energie per desbetreffende verbruiksperiode(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.2
  - number: 6.2.3.2.b
    text: de nieuw bepaalde hoeveelheid met het net uitgewisselde energie in de verbruiksperiode(n) bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.2
  - number: 6.2.3.2.c
    text: de periode dat de meting onjuist is geweest, en
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.2
  - number: 6.2.3.2.d
    text: de oorzaak van de onvolkomenheid en de genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.2
  - number: 6.2.3.3
    text: |-
      De meetverantwoordelijke stuurt binnen tien werkdagen nadat de onvolkomenheid is geconstateerd de gegevens bedoeld
      in [6.2.3.2][ref1] aan de programmaverantwoordelijke(n), leverancier(s) of netbeheerder(s) per periode waarvoor
      deze gezamenlijk verantwoordelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.3.4
    text: |-
      De meetverantwoordelijke verzendt zo spoedig mogelijk, doch uiterlijk vijf werkdagen nadat het bericht bedoeld
      in [6.2.3.3][ref1] is verstuurd aan de netbeheerder(s) of programmaverantwoordelijke(n) per verbruiksperiode een
      meetdatabericht, bedoeld in [6.1.1.3][ref2] of [6.2.2.6 tot en met 6.2.2.8][ref3], met de nieuwe meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.3.5
    text: |-
      De netbeheerder(s) verwerkt of verwerken, op basis van [paragraaf 6.3.12][ref1] en artikel 10.17 onderdeel 12 van
      de Netcode elektriciteit, het (de) verkregen meetdatabericht(en) met nieuwe meetgegevens bedoeld in [6.2.3.4][ref2]
      met dien verstande dat dit zo spoedig mogelijk doch binnen vijf werkdagen na ontvangst van de nieuwe meetgegevens
      geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.1
    text: |-
      Bij een constatering dat de meetgegevens onjuist zijn nadat de meetgegevens, bedoeld in [6.1.1.3][ref1] of
      [6.2.2.6 tot en met 6.2.2.8][ref2], verstuurd zijn en de werkelijke hoeveelheid met het net uitgewisselde energie
      niet meer te achterhalen is, verstrekt de meetverantwoordelijke een meetcorrectierapport aan de aangeslotene(n)
      binnen tien werkdagen nadat de onvolkomenheid geconstateerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.2
    text: |-
      In het meetcorrectierapport neemt de meetverantwoordelijke, per periode waarvoor de betrokken
      programmaverantwoordelijke, leverancier en netbeheerder gezamenlijk verantwoordelijk zijn, tenminste de volgende
      gegevens op:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.2
  - number: 6.2.4.2.a
    text: de eerder gecommuniceerde hoeveelheid met het net uitgewisselde energie per desbetreffende verbruiksperiode(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.2
  - number: 6.2.4.2.b
    text: |-
      de nieuwe, door schatting, bepaalde hoeveelheid met het net uitgewisselde energie in de verbruiksperiode(n) bedoeld
      onder a;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.2
  - number: 6.2.4.2.c
    text: de periode dat de meting onjuist is geweest en
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.2
  - number: 6.2.4.2.d
    text: de oorzaak van de onvolkomenheid en de genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.2
  - number: 6.2.4.3
    text: |-
      De meetverantwoordelijke stuurt binnen tien werkdagen nadat de onvolkomenheid is geconstateerd de gegevens bedoeld
      in [6.2.4.2][ref1] aan de programmaverantwoordelijke(n), leverancier(s) en netbeheerder(s) per periode waarvoor
      deze gezamenlijk verantwoordelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.4
    text: |-
      Als er binnen tien werkdagen na ontvangst van de in [6.2.4.1][ref1] of [6.2.4.3][ref2] bedoelde gegevens
      geen reactie is gekomen van de betrokken aangeslotene(n), netbeheerder(s), meetverantwoordelijke(n),
      programmaverantwoordelijke(n) of leverancier(s), dan stuurt de meetverantwoordelijke zo spoedig mogelijk doch
      uiterlijk vijf werkdagen daarna aan de netbeheerder(s) of programmaverantwoordelijke(n) per verbruiksperiode een
      meetdatabericht, bedoeld in [6.1.1.3][ref3] of [6.2.2.6 tot en met 6.2.2.8][ref4], met de nieuwe meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.5
    text: |-
      Een betrokken partij die een overleg wenst tussen aangeslotene(n), netbeheerder(s), meetverantwoordelijke(n),
      programmaverantwoordelijke(n) en leverancier(s) om overeenstemming te bereiken over een schatting van de werkelijke
      met het net uitgewisselde energie, verzoekt binnen tien werkdagen na ontvangst van de in [6.2.4.1][ref1] of
      [6.2.4.3][ref2] bedoelde gegevens, aan de meetverantwoordelijke dit overleg te organiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.6
    text: |-
      De meetverantwoordelijke organiseert het overleg bedoeld in [6.2.4.5][ref1], dat binnen een maand na ontvangst van
      het verzoek tot overleg, dient plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.7
    text: |-
      Als er binnen drie maanden na verstrekking van de gegevens, bedoeld in [6.2.4.3][ref1], geen overeenstemming
      is bereikt tussen de betrokken partijen over de te hanteren energiehoeveelheden, dan beslist of beslissen de
      netbeheerder(s) binnen één werkdag nadien over de te communiceren nieuwe energiehoeveelheden en verzendt of
      verzenden deze aan de meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.8
    text: |-
      Indien de op basis van [6.2.4.5][ref1] of [6.2.4.7][ref2] vastgestelde energiehoeveelheid afwijkt van de
      hoeveelheid bedoeld in [6.2.4.2][ref3], verzendt de meetverantwoordelijke, binnen vijf werkdagen na vaststelling,
      een nieuw meetcorrectierapport aan de aangeslotene(n) en een bericht als bedoeld in [6.2.4.3][ref4] aan de
      programmaverantwoordelijke(n), leverancier(s) en netbeheerder(s), per periode waarvoor de betreffende partij
      verantwoordelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.9
    text: |-
      De meetverantwoordelijke verzendt zo spoedig mogelijk doch uiterlijk binnen vijf werkdagen na het versturen van het
      bericht bedoeld in [6.2.4.8][ref1] aan de netbeheerder(s) of programmaverantwoordelijke(n) per verbruiksperiode een
      meetdatabericht, bedoeld in [6.1.1.3][ref2] of [6.2.2.6 tot en met 6.2.2.8][ref3], met de nieuwe meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.4.10
    text: |-
      De netbeheerder(s) verwerkt of verwerken, op basis van [paragraaf 6.3.12][ref1] en
      [artikel 10.17 onderdeel 12 van de Netcode elektriciteit][ref2], het (de) verkregen meetdatabericht(en) met nieuwe
      meetgegevens bedoeld in [6.2.4.4][ref3] of [6.2.4.9][ref4] met dien verstande dat dit zo spoedig mogelijk doch
      uiterlijk vijf werkdagen na ontvangst van de nieuwe meetgegevens geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.2.4.10
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037940
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.1.2
    text: |-
      De netbeheerder bewaakt, mede op basis van zijn aansluitingenregister, de ontvangst van meetgegevens
      van aansluitingen, die hij op grond van [paragraaf 6.2 van deze code][ref1] van de desbetreffende
      meetverantwoordelijken moet ontvangen op volledigheid. Bij geconstateerde tekortkomingen informeert de netbeheerder
      de meetverantwoordelijke en stelt hij de desbetreffende meetverantwoordelijke zonodig in gebreke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.1.3
    text: |-
      De netbeheerder geeft de meetgegevens van aansluitingen, die hij op grond van [paragraaf 6.2 van deze code][ref1]
      van de desbetreffende meetverantwoordelijken ontvangt, door.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.1.4
    text: |-
      De in [6.3.11][ref1] en [6.3.12][ref2] bedoelde overdracht van meetgegevens en indiening van verzoeken vindt plaats
      overeenkomstig het elektronische berichtenverkeer, bedoeld in [hoofdstuk 9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '9'
  - number: 6.3.2.1
    text: |-
      De netbeheerder controleert na de ontvangst de plausibiliteit en volledigheid van de meetgegevens, mede op basis
      van zijn aansluitingenregister, aan de hand van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.1
  - number: 6.3.2.1.a
    text: |-
      De voor een aansluiting ontvangen meetgegevens zijn kleiner dan 120% van de hoeveelheid die maximaal uitgewisseld
      kan worden op basis van de aansluitcapaciteit van de aansluiting en het volume van deze overschrijding is kleiner
      dan 500 kWh per onbalansverrekeningsperiode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.1
  - number: 6.3.2.1.b
    text: De meetgegevens passen bij de leveringsrichting van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.1
  - number: 6.3.2.1.c
    text: |-
      De meetgegevens zijn afkomstig van de meetverantwoordelijke die in het aansluitingenregister bij die aansluiting
      vermeld is.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.1
  - number: 6.3.2.2
    text: |-
      Indien voor een aansluiting niet voldaan wordt aan de controles in [6.3.2.1][ref1] stuurt de netbeheerder een
      herzieningsverzoek aan de desbetreffende meetverantwoordelijke om nieuwe of aanvullende meetgegevens aan te leveren
      en geeft de reden van het herzieningsverzoek aan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.2.3
    text: |-
      Indien de meetverantwoordelijke heeft aangegeven dat er sprake is van onderhoud als bedoeld in [9.3.1.4][ref1]
      stuurt de netbeheerder, in afwijking van [6.3.2.2][ref2], die kalenderdag geen herzieningsverzoek voor niet
      ontvangen meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.2.4
    text: |-
      De netbeheerder kan tot en met de achtste werkdag na de dag waarop de meetgegevens betrekking hebben, bij de
      desbetreffende meetverantwoordelijke een herzieningsverzoek indienen over deze meetgegevens, waarbij hij de
      volgende reden kan aangeven:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.4
  - number: 6.3.2.4.a
    text: De ontvangen meetgegevens passen niet bij de geregistreerde capaciteit van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.4
  - number: 6.3.2.4.b
    text: |-
      De geregistreerde leveringsrichting in het aansluitingenregister past niet bij de leveringsrichting van de
      ontvangen meetgegevens van de betreffende aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.4
  - number: 6.3.2.4.c
    text: Er werden wel meetgegevens verwacht, maar niet ontvangen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2.4
  - number: 6.3.2a.1
    text: |-
      Indien de meetgegevens niet voldoen aan [artikel 6.3.2.1, onderdeel a][ref1] dan neemt de netbeheerder direct
      contact op met de meetverantwoordelijke. Wanneer de meetverantwoordelijke geen nieuwe meetgegevens kan opleveren op
      grond van [6.2.2.3][ref2] dan berekent de netbeheerder namens de meetverantwoordelijke deze meetgegevens uiterlijk
      de tiende werkdag overeenkomstig [bijlage 5 van de Meetcode elektriciteit][ref3]. De netbeheerder geeft deze
      meetwaarden de reparatiemethodiek "berekend door netbeheerder".


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037946
  - number: 6.3.2a.2
    text: |-
      Indien niet voldaan wordt aan [6.3.2.1, onderdeel b][ref1] neemt de netbeheerder contact op met
      de meetverantwoordelijke en onderzoekt of de leveringsrichting correct geregistreerd staat in het
      aansluitingenregister. De netbeheerder informeert de aangeslotene indien de leveringsrichting niet correct
      geregistreerd staat en past op diens verzoek de leveringsrichting van de aansluiting aan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.2a.3
    text: |-
      Indien niet voldaan wordt aan [6.3.2.1, onderdeel c][ref1] berekent de netbeheerder de
      meetgegevens voor iedere onbalansverrekeningsperiode van de betreffende aansluiting overeenkomstig
      [bijlage 5 van de Meetcode elektriciteit][ref2]. De netbeheerder geeft deze meetwaarden de herkomstindicatie
      ‘berekend’ en de reparatiemethodiek ‘berekend door netbeheerder’.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2a.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037946
  - number: 6.3.2b.1
    text: |-
      De programmaverantwoordelijke controleert de meetgegevens die hij op grond van [artikel 6.2.2.2][ref1] en
      [6.2.2.3][ref2] van de meetverantwoordelijke ontvangen heeft voor de hem aangaande aansluitingen tenminste op de
      volgende criteria:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.2b.1.a
    text: |-
      de meetverantwoordelijke heeft meetgegevens aangeleverd voor een aansluiting waar de programmaverantwoordelijke op
      de dag waarop de meetgegevens betrekking hebben actief is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.1
  - number: 6.3.2b.1.b
    text: |-
      de door de meetverantwoordelijke aangeleverde meetgegevens zijn inhoudelijk in lijn met de verwachtingen van de
      programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.1
  - number: 6.3.2b.2
    text: |-
      Indien de programmaverantwoordelijke op basis van informatie die hij heeft bij de controle van [6.3.2b.1][ref1]
      twijfelt aan de juistheid van één of meer meetgegevens, dient de programmaverantwoordelijke eenmalig een
      herzieningsverzoek in bij de desbetreffende meetverantwoordelijke. Daarbij wordt een van de volgende redenen
      aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.2b.2.a
    text: de meetgegevens werden verwacht, maar zijn niet ontvangen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.2
  - number: 6.3.2b.2.b
    text: 'de meetgegevens worden betwist, omdat:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.2
  - number: 6.3.2b.2.b.−
    text: de meetwaarden over een te lange periode (meer dan vijf kalenderdagen) zijn geschat;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.2
  - number: 6.3.2b.2.b.−
    text: de juistheid wordt betwist; of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.2
  - number: 6.3.2b.2.b.−
    text: langer dan zeven kalenderdagen gemeten nul-waarden zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.2
  - number: 6.3.2b.3
    text: |-
      Indien de meetverantwoordelijke heeft aangegeven dat er sprake is van onderhoud als bedoeld in [9.3.1.4][ref1]
      stuurt de programmaverantwoordelijke, in afwijking van [6.3.2b.2][ref2], die kalenderdag geen herzieningsverzoek
      voor niet ontvangen meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.2b.4
    text: |-
      Indien [lid b van artikel 6.3.2b.2][ref1] van toepassing is, doet de programmaverantwoordelijke voor de betwiste
      meetgegevens van een onbalansverrekeningsperiode zelf een voorstel aan de meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.2b.5
    text: |-
      De programmaverantwoordelijke kan tot en met de achtste werkdag na de dag waarop de meetgegevens betrekking hebben
      bij de desbetreffende meetverantwoordelijke een herzieningsverzoek over deze meetgegevens indienen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.5
  - number: 6.3.2b.6
    text: |-
      In afwijking van [6.3.2b.5][ref1] dient de programmaverantwoordelijke voor de zesde kalenderdag geen
      herzieningsverzoek in overeenkomstig [6.3.2b.2 lid b][ref2] voor de meetgegevens die de programmaverantwoordelijke
      ontvangen heeft op de eerste kalenderdag na de dag waarop de meetgegevens betrekking hebben, indien de
      meetverantwoordelijke bij de meetgegevens aangeeft dat er sprake is van een storing in de meetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.2b.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.11.1
    text: |-
      De netbeheerder geeft aan de netbeheerder van het landelijk hoogspanningsnet de hoeveelheid op het net ingevoede
      duurzame of wkk-elektriciteit per aansluiting, of, indien [artikel 3.2, eerste lid, van de Netcode elektriciteit]
      (onbekend) van toepassing is, per productie-installatie van een groen- of wkk-producent door.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.11.1
  - number: 6.3.11.2
    text: |-
      De netbeheerder geeft aan de groen- of wkk-producent de hoeveelheid op het net ingevoede duurzame of wkk-
      elektriciteit per aansluiting, of, indien [artikel 3.2, eerste lid, van de Netcode elektriciteit](onbekend) van
      toepassing is, per productie-installatie door.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.11.2
  - number: 6.3.11.3
    text: |-
      De in [6.3.11.1][ref1] en [6.3.11.2][ref2] bedoelde informatieoverdracht vindt voor aansluitingen groter dan 3x80A
      op laagspanningsniveau steeds plaats op uiterlijk de vijftiende werkdag van de maand na de maand waarop de data
      betrekking heeft of zoveel vaker als met de aangeslotene is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.11.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.11.4
    text: |-
      De in [6.3.11.1][ref1] en [6.3.11.2][ref2] bedoelde informatieoverdracht vindt voor aansluitingen kleiner of gelijk
      aan 3x80A op laagspanningsniveau éénmaal per jaar op een door de netbeheerder te bepalen tijdstip plaats of zoveel
      vaker als met de aangeslotene overeengekomen. In dat geval worden de in 6.3.11.1 en 6.3.11.2 bedoelde hoeveelheden
      verdeeld in twaalf gelijke delen, tenzij betere gegevens over de maandelijkse hoeveelheden beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.11.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.11.5
    text: |-
      Indien een aangeslotene met een productie-installatie voor duurzame of wkk-elektriciteit in aanmerking wenst te
      komen voor garanties van oorsprong respectievelijk wkk-certificaten voor niet-netlevering, zijn de bepalingen
      [6.3.11.1 tot en met 6.3.11.4][ref1] van overeenkomstige toepassing op de meetdata die wordt gegenereerd door de
      meetinrichting bedoeld in [2.1.1, onderdeel c van de Meetcode elektriciteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.11.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: '2'
  - number: 6.3.12.1
    text: |-
      De netbeheerder geeft per grootverbruikaansluiting met een doorlaatwaarde kleiner dan of gelijk aan 3x80A op
      laagspanningsniveau jaarlijks, of zoveel vaker als de netbeheerder een meterstand van de meetverantwoordelijke
      ontvangt, aan de leverancier die voor de desbetreffende aansluiting balanceringsverantwoordelijkheid draagt of laat
      dragen, de laatste en voorlaatste tellerstand(en) voor de hoeveelheid met het net uitgewisselde energie alsmede
      de hoeveelheid in de tussenliggende periode op de desbetreffende aansluiting uitgewisselde elektrische energie,
      onderscheiden naar normaaluren en laaguren als er sprake is van een meetinrichting met twee telwerken, door, tenzij
      op grond van een aansluit- en transportovereenkomst met de desbetreffende aangeslotene anders is overeengekomen.
      Deze overdracht van meetgegevens vindt plaats uiterlijk op de vijftiende werkdag van de maand genoemd in het
      aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.12.1
  - number: 6.3.12.2
    text: |-
      De netbeheerder geeft per profielgrootverbruikaansluiting met een doorlaatwaarde groter dan 3x80A
      op laagspanningsniveau maandelijks aan de leverancier die voor de desbetreffende aansluiting
      balanceringsverantwoordelijkheid draagt of laat dragen, de laatste en voorlaatste tellerstand(en) voor de
      hoeveelheid met het net uitgewisselde energie alsmede de hoeveelheid in de tussenliggende periode op de
      desbetreffende aansluiting uitgewisselde elektrische energie, onderscheiden naar normaaluren en laaguren
      als er sprake is van een meetinrichting met twee telwerken, door, tenzij op grond van een aansluit- en
      transportovereenkomst met de desbetreffende aangeslotene anders is overeengekomen. Deze overdracht van meetgegevens
      vindt plaats uiterlijk op de vijftiende werkdag van de maand na de maand waarop de meetgegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.12.2
  - number: 6.3.12.3
    text: |-
      De netbeheerder geeft per grootverbruikaansluiting met een doorlaatwaarde groter dan 3x80A maandelijks of zoveel
      vaker als overeengekomen aan de leverancier die voor de desbetreffende aansluiting balanceringsverantwoordelijkheid
      draagt of laat dragen, de laatste en voorlaatste tellerstand(en) voor de hoeveelheid met het net uitgewisselde
      energie alsmede de hoeveelheid in de tussenliggende periode op de desbetreffende aansluiting uitgewisselde
      elektrische energie, onderscheiden naar normaaluren en laaguren, door, tenzij op grond van een aansluit- en
      transportovereenkomst met de desbetreffende aangeslotene anders is overeengekomen. Deze overdracht van meetgegevens
      vindt plaats uiterlijk op de vijftiende werkdag van de maand na de maand waarop de meetgegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.12.3
  - number: 6.3.12.4
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.12.4
  - number: 6.3.12.5
    text: |-
      De netbeheerder dient de meetgegevens als bedoeld in [6.3.12.1 tot en met 6.3.12.3][ref1], alsmede de meetgegevens
      die hij ontvangt op grond van [6.2.2][ref2], gedurende een termijn van tenminste drie jaren beschikbaar te houden.
      De netbeheerder verstrekt de aangeslotene of diens gemachtigde op verzoek de meetgegevens van de desbetreffende
      aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.3.12.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.4.1.1
    text: |-
      In geval van een telemetriegrootverbruiker wordt de meting op de dag van verzameling van de meetgegevens door de
      meetverantwoordelijke op volledigheid gevalideerd aan de hand van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.1
  - number: 6.4.1.1.a
    text: |-
      status in de meetinrichting aangaande de meting of de meetwaarde en status van het meetkanaal geeft geen indicatie
      van een fout;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.1
  - number: 6.4.1.1.b
    text: |-
      tijdsynchroniteit van de meetinrichting en meetperiode blijft binnen de in
      [4.3.4.2 tot en met 4.3.4.4 van de Meetcode gas RNB][ref1] aangegeven eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: '4'
  - number: 6.4.1.1.c
    text: alle meetperioden zijn aanwezig en bevatten een meetwaarde.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.1
  - number: 6.4.1.2
    text: |-
      In geval van een telemetriegrootverbruiker worden de gecollecteerde meetgegevens op de dag van verzameling van de
      meetgegevens door de meetverantwoordelijke op juistheid gevalideerd aan de hand van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.2
  - number: 6.4.1.2.a
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.2
  - number: 6.4.1.2.b
    text: de door de meetinrichting gemeten hoeveelheid gas [m3(n)] is groter dan of gelijk aan nul;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.2
  - number: 6.4.1.2.c
    text: |-
      de door de meetinrichting gemeten hoeveelheid gas [m3(n)] per meetperiode is kleiner dan 120% van de hoeveelheid
      die maximaal uitgewisseld kan worden op basis van de van de maximale capaciteit van de meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.2
  - number: 6.4.1.2.d
    text: de gemeten hoeveelheid gas is niet langer dan één week gelijk aan nul.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.2
  - number: 6.4.1.3
    text: |-
      Als de meetgegevens niet voldoen aan het in [6.4.1.2, onderdeel d][ref1], genoemde validatiecriterium wordt met de
      aangeslotene overlegd of het gemeten verbruik overeenkomt met het verbruik dat zou mogen worden verwacht. Indien
      het gemeten verbruik overeenkomt met het gebruik dat zou mogen worden verwacht, wordt voldaan aan het gestelde in
      6.4.1.2, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.4
    text: |-
      De verzamelde meetgegevens van uurlijks op afstand uitleesbare meetinrichtingen worden direct na het verstrijken
      van het betreffende klokuur door de meetverantwoordelijke op juistheid gevalideerd aan de hand van de criteria als
      gesteld in [6.4.1.2, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.5
    text: |-
      Indien de gecollecteerde meetgegevens van uurlijks op afstand uitleesbare meetinrichtingen niet voldoen aan de
      criteria volgens [6.4.1.4][ref1] worden deze meetgegevens niet verzonden aan het Centraal Systeem Stuursignaal van
      de netbeheerder van het landelijk gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.6
    text: |-
      In geval van een profielgrootverbruiker worden de verzamelde meetgegevens gevalideerd op volledigheid en op
      juistheid aan de hand van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.6
  - number: 6.4.1.6.a
    text: de voor de bepaling van de hoeveelheid gas benodigde tellerstanden zijn beschikbaar;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.6
  - number: 6.4.1.6.b
    text: |-
      de gemeten hoeveelheid gas is groter dan 50% van het verbruik dat op grond van het verbruik tijdens de voorafgaande
      periode zou mogen worden verwacht;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.6
  - number: 6.4.1.6.c
    text: |-
      de gemeten hoeveelheid gas is kleiner dan 200% van het verbruik dat op grond van het verbruik tijdens de
      voorafgaande periode zou mogen worden verwacht.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.6
  - number: 6.4.1.7
    text: |-
      Indien de meetgegevens genoemd in [6.4.1.6][ref1] niet voldoen aan de in 6.4.1.6 genoemde validatiecriteria
      worden de meetgegevens door de meetverantwoordelijke (opnieuw) afgelezen of worden in overleg met de aangeslotene
      vastgesteld dat het gemeten verbruik overeenkomt met het verbruik dat zou mogen worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.8
    text: |-
      Indien de meetgegevens bedoeld in [6.4.1.6][ref1] wel voldoen aan de in 6.4.1.6 genoemde validatiecriteria, worden
      de meetgegevens door de meetverantwoordelijke vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.9
    text: |-
      De validatie en vaststelling zoals bedoeld in [6.4.1.6][ref1] en [6.4.1.8][ref2] vindt plaats uiterlijk de werkdag
      na de dag van dataverzameling zoals bedoeld in [5.2 van de Meetcode gas RNB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037925
        paragraaf: '5.2'
  - number: 6.4.1.10
    text: |-
      Bij een invoeder met een aansluiting met een capaciteit groter dan 40 m³(n)/uur waarvan het gas conform [B5.6.9
      van de Allocatiecode gas](onbekend) aan de (erkende programmaverantwoordelijke van) de invoeder toegerekend dient
      te worden met de werkelijke gemeten calorische waarde van het ingevoede gas, verzamelt de meetverantwoordelijke de
      gegevens die conform [5a.6 van de Meetcode gas RNB][ref1] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Paragraaf5a.6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037925
        paragraaf: 5a.6
  - number: 6.4.2.0
    text: |-
      In het geval de in deze paragraaf bedoelde gegevensuitwisseling betrekking heeft op de aansluiting van een gesloten
      distributiesysteem gas dat is aangesloten op een regionaal gastransportnet, waarvan de beheerder gebruik wil maken
      van de in de [Allocatiecode gas][ref1] genoemde berichten, verzendt de meetverantwoordelijke de meetgegevens van de
      aansluiting van een gesloten distributiesysteem gas tevens aan de beheerder van het gesloten distributiesysteem. In
      afwijking van [paragraaf 9.1][ref2] vindt dit niet verplicht plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037931
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.0
    references:
      - id: ref1
        bwb_id: BWBR0037931
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 6.4.2.1
    text: |-
      In geval van een telemetriegrootverbruiker bewerkt de meetverantwoordelijke op de werkdag volgend op de gasdag van
      verzameling van de meetgegevens de meetgegevens alvorens deze aan de regionale netbeheerder te verzenden zodanig
      dat de herleide volumes in normaal kubieke meters [m3(n)] worden verzonden. Ontbrekende meetgegevens worden geschat
      door de meetverantwoordelijke. De meetverantwoordelijke verzendt de meetgegevens van alle aangeslotenen waarvoor
      hij meetverantwoordelijkheid draagt, voorzien van de van toepassing zijnde statuscode.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.1
  - number: 6.4.2.2
    text: |-
      De meetverantwoordelijke verzendt de in [6.4.2.1][ref1] genoemde meetgegevens aan de regionale netbeheerder
      overeenkomstig hetgeen daaromtrent in [hoofdstuk 9][ref2] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
  - number: 6.4.2.4
    text: |-
      De meetgegevens van een telemetriegrootverbruiker van een bepaalde gasmaand worden uiterlijk op de vierde
      werkdag van de maand, volgend op de maand waarop de meetgegevens betrekking hebben, voor 07:00 uur, door de
      meetverantwoordelijke verzonden aan de regionale netbeheerder. De meetverantwoordelijke verzendt per aansluiting de
      meetgegevens van een gasmaand in één bericht.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.4
  - number: 6.4.2.5
    text: |-
      Uiterlijk op de twaalfde werkdag, voor 12:00 uur, van de maand na de maand waarin de desbetreffende
      gasdag valt, ontvangt de meetverantwoordelijke van de regionale netbeheerder de meetgegevens van een
      telemetriegrootverbruiker retour waarvan een leverancier of een programmaverantwoordelijke op grond van
      [4.6.3 van de Allocatiecode gas][ref1] bij de regionale netbeheerder om correctie heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '4'
  - number: 6.4.2.6
    text: |-
      Gewijzigde meetgegevens van een telemetriegrootverbruiker van een bepaalde gasmaand, worden uiterlijk op de
      veertiende werkdag van de maand, volgend op de maand waarop de meetgegevens betrekking hebben, voor 07:00
      uur, door de meetverantwoordelijke gecorrigeerd en gevalideerd verzonden aan de regionale netbeheerder. De
      meetverantwoordelijke verzendt per aansluiting met gewijzigde meetgegevens de meetgegevens voor de gehele gasmaand
      in één bericht.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.6
  - number: 6.4.2.7
    text: |-
      De meetverantwoordelijke gaat na of de overeenkomstig [6.4.2.5][ref1] terug ontvangen meetgegevens moet worden
      gecorrigeerd en zendt de al dan niet gecorrigeerde definitieve meetgegevens uiterlijk op de vijftiende werkdag, van
      de maand na de maand waarin de desbetreffende gasdag valt, voor 12:00 uur opnieuw aan de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.8
    text: |-
      Wanneer de in [6.4.2.7][ref1] bedoelde meetgegevens binnen de in [6.4.2.6][ref2] genoemde termijn niet opnieuw
      worden aangeleverd, dan worden deze na de vijftiende werkdag van de maand na de maand waarin de desbetreffende
      gasdag valt, gebruikt voor de allocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.9
    text: |-
      De meetverantwoordelijke voert de werkzaamheden bedoeld in [6.4.1.1 tot en met 6.4.1.9][ref1] uit voor een uurlijks
      op afstand uitleesbare meetinrichting, direct na het verstrijken van een klokuur alvorens de meetgegevens te
      verzenden aan het Centraal Systeem Stuursignaal van de netbeheerder van het landelijk gastransportnet. De herleide
      volumes worden hierbij bepaald in normaal kubieke meters [m3(n)] en afgerond op hele waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.10
    text: |-
      De meetgegevens van uurlijks op afstand uitleesbare meetinrichtingen van een bepaald uur worden uiterlijk 5 minuten
      na het verstrijken van dat uur door de meetverantwoordelijke verzonden aan het Centraal Systeem Stuursignaal van de
      netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.10
  - number: 6.4.2.11
    text: |-
      In geval van een profielgrootverbruiker worden de meetgegevens genoemd in [6.4.1.6][ref1] uiterlijk op de tiende
      werkdag na de dag van vaststelling zoals bedoeld in [6.4.1.8][ref2] aan de regionale netbeheerder verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.12
    text: |-
      Alle op grond van [5.4.3.1][ref1] of [5.4.3.2 van de Meetcode gas RNB][ref2] automatisch gerepareerde meetgegevens
      worden overeenkomstig [6.4.1][ref3] gevalideerd alvorens als definitief te kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.12
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0037925
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.13
    text: |-
      Indien onvolledige of onjuiste meetgegevens niet automatisch kunnen worden gerepareerd, verzendt de
      meetverantwoordelijke nullen dan wel voorlopige waarden aan de regionale netbeheerder en geeft daarbij aan dat
      er sprake is van niet betrouwbare meetgegevens. De meetgegevens worden binnen de daarvoor in [6.4.2.4][ref1]
      vastgestelde periode gerepareerd en als definitieve data verzonden overeenkomstig [6.4.2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.14
    text: |-
      Voor reparaties welke niet op een van de in [6.4.2.12][ref1] of [6.4.2.13][ref2] bedoelde wijzen kunnen
      worden uitgevoerd, moet in overleg met de aangeslotene, de regionale netbeheerder en de desbetreffende
      programmaverantwoordelijke een afspraak worden gemaakt over het repareren van de meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.14
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.15
    text: |-
      Alle op grond van [6.4.2.12 tot en met 6.4.2.14][ref1] gerepareerde meetgegevens worden overeenkomstig
      [6.4.1][ref2] gevalideerd alvorens door de meetverantwoordelijke als definitief te kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.15
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.16
    text: |-
      Onvolkomenheden aan de meetinrichting die leiden tot aanpassing van de onder 4.3.1.2 van de
      [Meetcode gas RNB][ref1] genoemde gegevens alsmede onvolkomenheden met betrekking tot de datacollectie worden
      binnen vijf werkdagen na constatering door de meetverantwoordelijke gemeld aan de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.16
    references:
      - id: ref1
        bwb_id: BWBR0037925
  - number: 6.4.2.17
    text: |-
      Bij een invoeder met een aansluiting met een capaciteit groter dan 40 m³(n)/uur waarvan het gas conform [B5.6.9
      van de Allocatiecode gas](onbekend) aan de (erkende programmaverantwoordelijke van) de invoeder toegerekend
      dient te worden met de werkelijke gemeten calorische waarde van het ingevoede gas, worden de gegevens genoemd in
      [6.4.1.10][ref1] van een bepaalde gasmaand uiterlijk op de vierde werkdag van de maand, volgend op de maand waarop
      de gegevens betrekking hebben, voor 07:00 uur door de meetverantwoordelijke verzonden aan de netbeheerder. De
      meetverantwoordelijke verzendt per aansluiting de gegevens van een gasmaand in één bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.2.17
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.3.1
    text: |-
      Bij een constatering dat de meetgegevens onjuist zijn, nadat de meetgegevens, bedoeld in [6.1.1.3][ref1] of
      [6.4.2.11][ref2], verstuurd zijn en de werkelijke hoeveelheid met het net uitgewisselde volume [m3(n)] te
      achterhalen is, verstrekt de meetverantwoordelijke een meetcorrectierapport aan de aangeslotene(n) binnen tien
      werkdagen nadat de onvolkomenheid geconstateerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.3.2
    text: |-
      Bij een constatering na de termijn, bedoeld in [6.4.2.8][ref1], dat de meetgegevens, bedoeld in [6.4.2.4][ref2] of
      [6.4.2.7][ref3], onjuist zijn en de werkelijke hoeveelheid met het net uitgewisselde volume [m3(n)] te achterhalen
      is, verstrekt de meetverantwoordelijke een meetcorrectierapport aan de aangeslotene(n) binnen tien werkdagen nadat
      de onvolkomenheid geconstateerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.3.3
    text: |-
      In het meetcorrectierapport bedoeld in [6.4.3.1][ref1] of [6.4.3.2][ref2] neemt de meetverantwoordelijke, per
      periode waarvoor de betrokken programmaverantwoordelijke, leverancier en netbeheerder gezamenlijk verantwoordelijk
      zijn, tenminste de volgende gegevens op:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.3.3.a
    text: het eerder gecommuniceerde met het net uitgewisselde volume [m3(n)] per desbetreffende verbruiksperiode(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.3
  - number: 6.4.3.3.b
    text: het nieuw bepaalde met het net uitgewisselde volume [m3(n)] in de verbruiksperiode(n) bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.3
  - number: 6.4.3.3.c
    text: de periode dat de meting onjuist is geweest en
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.3
  - number: 6.4.3.3.d
    text: de oorzaak van de onvolkomenheid en de genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.3
  - number: 6.4.3.4
    text: |-
      De meetverantwoordelijke stuurt binnen tien werkdagen nadat de onvolkomenheid is geconstateerd de gegevens bedoeld
      in [6.4.3.3][ref1] aan de programmaverantwoordelijke(n), leverancier(s) en netbeheerder(s) per periode waarvoor
      deze gezamenlijk verantwoordelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.3.5
    text: |-
      Onjuiste meetgegevens veroorzaakt door een onvolkomenheid in het volumeherleidingsinstrument of het niet juist
      toepassen van de herleidingmethode worden conform het bepaalde in [6.4.3.1 tot en met 6.4.3.4][ref1] behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.3.6
    text: |-
      De meetverantwoordelijke verzendt zo spoedig mogelijk, doch uiterlijk vijf werkdagen nadat het bericht als
      bedoeld in [6.4.3.3][ref1] is verstuurd aan de netbeheerder, per verbruiksperiode een meetdatabericht, bedoeld in
      [6.1.1.3][ref2], [6.4.2.4][ref3] of [6.4.2.11][ref4], met de nieuwe meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.1
    text: |-
      Bij een constatering dat de meetgegevens onjuist zijn door een onvolkomenheid aan de gasmeter, nadat de
      meetgegevens bedoeld in [6.1.1.3][ref1] of [6.4.2.11][ref2], verstuurd zijn en het werkelijke met het
      net uitgewisselde volume [m3(n)] niet meer te achterhalen is, verstrekt de meetverantwoordelijke een
      meetcorrectierapport aan de aangeslotene(n) binnen tien werkdagen nadat de onvolkomenheid geconstateerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.2
    text: |-
      Bij een constatering na de termijn, bedoeld in [6.4.2.8][ref1], dat de meetgegevens, bedoeld in [6.4.2.4][ref2] of
      [6.4.2.7][ref3], onjuist zijn door een onvolkomenheid aan de gasmeter en het werkelijke met het net uitgewisselde
      volume [m3(n)] niet meer te achterhalen is, verstrekt de meetverantwoordelijke een meetcorrectierapport aan de
      aangeslotene(n) binnen tien werkdagen nadat de onvolkomenheid geconstateerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
