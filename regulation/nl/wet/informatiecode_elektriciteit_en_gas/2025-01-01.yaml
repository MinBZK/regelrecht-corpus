      een toewijzing van verbruik verrekenen de betrokken leveranciers of de leverancier en netbeheerder het toegewezen
      verbruik volledig indien het toegewezen verbruik boven de 1.000 kWh of 500 m3 uitkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
