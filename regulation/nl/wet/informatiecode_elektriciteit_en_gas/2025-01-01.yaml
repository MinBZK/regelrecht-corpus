        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.3.3.2
    text: |-
      De netbeheerder informeert de nieuwe leverancier en nieuwe programmaverantwoordelijke en, indien aanwezig,
      meetverantwoordelijke overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [4.3.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.4.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en het verbruik bij het inhuizingsproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.4.1.1
    text: |-
      De leverancier informeert de aangeslotene tenminste twintig werkdagen voorafgaand aan de eindeleveringsdatum over
      zijn voornemen om de levering te beëindigen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.1.1
  - number: 4.4.2.1
    text: |-
      De actuele leverancier stuurt tenminste twaalf werkdagen en ten hoogste twintig werkdagen voor de
      eindeleveringsdatum een eindeleveringsmelding naar de netbeheerder, waarin is vermeld:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.2.1
  - number: 4.4.2.1.a
    text: de EAN-code van de aansluiting,
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.2.1
  - number: 4.4.2.1.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.2.1
  - number: 4.4.2.1.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.2.1
  - number: 4.4.2.1.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.2.1
  - number: 4.4.2.1.e
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.2.1
  - number: 4.4.3.1
    text: 'Naar aanleiding van de eindeleveringsmelding controleert de netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.1.a
    text: de eindeleveringsmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.1.c
    text: |-
      de eindeleveringsdatum ten opzichte van de datum van indienen tenminste twaalf werkdagen en ten hoogste twintig
      werkdagen in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.1.d
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde switchmelding, inhuizingsmelding, uithuizingsmelding of
      eindeleveringsmelding is voor dezelfde aansluiting met dezelfde of een eerdere datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.1.e
    text: de eindeleveringsmelding wordt ingediend door de in het aansluitingenregister vermelde leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.1.f
    text: de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.1
  - number: 4.4.3.2
    text: |-
      Als alle controles uit [4.4.3.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.4.3.4][ref2]. Als dat niet het geval is, wordt de eindelevering niet uitgevoerd en wordt de procedure na
      [4.4.3.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.3.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de eindelevering naar aanleiding van [4.4.3.2][ref1] uiterlijk de
      werkdag na ontvangst van de eindeleveringsmelding aan de leverancier die de eindeleveringsmelding heeft ingediend
      en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
