      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Paragraaf2.6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.3
