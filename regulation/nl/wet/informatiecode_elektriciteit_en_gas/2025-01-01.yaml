  - number: 10.1.4b.5
    text: |-
      De regionale netbeheerder bewaart de door hem op grond van [2.15.4][ref1] ontvangen toestemmingsgegevens ten
      hoogste één maand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
