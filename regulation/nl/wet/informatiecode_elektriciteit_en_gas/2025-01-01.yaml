    text: |-
      In afwijking van [5.1.2.2][ref1] wordt de vastgestelde meterstand, behorende bij de mutatiedatum van de onterechte
      uithuizing, door de leverancier vastgesteld voor de mutatiedatum van de inhuizingsmelding die hij ter correctie
      heeft ingediend als bedoeld in [3.14.2.2][ref2].


