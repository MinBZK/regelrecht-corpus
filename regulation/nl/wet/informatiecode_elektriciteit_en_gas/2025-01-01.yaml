    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.e.3
    text: aanduiding van de herkomst van de meterstand;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.e.4
    text: in geval van elektriciteit de telwerkidentificatie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.f
    text: 'indien de leverancier dit wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.2.1
    text: |-
      [Paragraaf 5.2][ref1] is niet van toepassing op onbemeten kleinverbruikaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.2.1
    text: 'De regionale netbeheerder voert fysieke meteropnames uit op kleinverbruikaansluitingen in de onderstaande gevallen:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.2.2.1
  - number: 5.2.2.1.a
    text: |-
      ten minste eenmaal in de 36 maanden bij kleinverbruikmeetinrichtingen die niet op afstand uitleesbaar zijn,
      met inbegrip van kleinverbruikmeetinrichtingen die administratief uit staan, door middel van aflezing op de
      meetinrichting bij de aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.2.2.1
  - number: 5.2.2.1.b
    text: |-
      in geval van de processen, bedoeld in [paragrafen 3.8 tot en met 3.11][ref1] voor alle
      kleinverbruikmeetinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 5.2.2.2
    text: |-
      De regionale netbeheerder valideert voor de leverancier of de fysiek opgenomen meterstand binnen de
      validatiegrenzen, bedoeld in [5.1.3.1][ref1], valt. Indien de fysiek opgenomen meterstand buiten de
      validatiegrenzen valt, verifieert de regionale netbeheerder of de fysiek opgenomen meterstand op de
      kleinverbruikmeetinrichting weergegeven is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.2.3
    text: |-
      De regionale netbeheerder stelt de fysiek opgenomen meterstand vast voor de leverancier die op het moment van de
      fysieke opname als leverancier op de desbetreffende aansluiting in het aansluitingenregister vermeld staat, stelt
      deze stand in het toegankelijk meetregister beschikbaar en informeert de leverancier hierover.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.2.2.3
  - number: 5.3.1.1
    text: |-
      De leverancier bepaalt het verbruik voor de facturatie, overeenkomstig [paragrafen 5.3.2][ref1] en [5.3.3][ref2],
      op basis van vastgestelde meterstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.1.2
    text: |-
      In afwijking van [5.3.1.1][ref1] zal de leverancier in geval van een schakelstoring in de meetinrichting, in
      overleg met de aangeslotene, het gemeten verbruik, op basis van de in het toegankelijk meetregister aanwezige
      meetreeks, en ten behoeve van de facturatie, verdelen naar normaal en laag tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.1.3
    text: |-
      In afwijking van [5.3.1.1][ref1] zal de leverancier het door de netbeheerder op grond van [5.3.4][ref2] berekende
      en gecommuniceerde verbruik overnemen in zijn facturatie indien hij hiervoor niet zelf een verbruik kan bepalen
      door storing van de meetinrichting, niet zijnde een schakelstoring.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.1
    text: |-
      Voor een op afstand uitleesbare meetinrichting wordt het verbruik voor de normaaluren bepaald door het verschil
      tussen de vastgestelde meterstand en de voorlaatste vastgestelde meterstand van het hoogtelwerk of normaaltelwerk
      te vermenigvuldigen met de vermenigvuldigingsfactor van het telwerk.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.1
  - number: 5.3.2.2
    text: |-
      Voor een op afstand uitleesbare meetinrichting wordt het verbruik voor de laaguren bepaald door het verschil tussen
      de vastgestelde meterstand en de voorlaatste vastgestelde meterstand van het laagtelwerk te vermenigvuldigen met de
      vermenigvuldigingsfactor van het telwerk.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.2
  - number: 5.3.2.2a
    text: |-
      Voor een niet op afstand uitleesbare meetinrichting, die beschikt over twee telwerken voor een leveringsrichting,
      wordt het verbruik op het normaaltelwerk bepaald door het verschil tussen de vastgestelde meterstand en de
      voorlaatst vastgestelde meterstand van het normaaltelwerk te vermenigvuldigen met de vermenigvuldigingsfactor van
      het telwerk.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.2a
  - number: 5.3.2.2b
    text: |-
      Voor een niet op afstand uitleesbare meetinrichting, die beschikt over twee telwerken voor een leveringsrichting,
      wordt het verbruik op het laagtelwerk bepaald door het verschil tussen de vastgestelde meterstand en de voorlaatst
      vastgestelde meterstand van het laagtelwerk te vermenigvuldigen met de vermenigvuldigingsfactor van het telwerk.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.2b
  - number: 5.3.2.3
    text: |-
      In afwijking van [5.3.2.2a][ref1] wordt in het geval dat een meetinrichting beschikt over een totaaltelwerk
      en een laagtelwerk, het verbruik bepaald door het verschil tussen de vastgestelde meterstand en de voorlaatste
      vastgestelde meterstand van het totaaltelwerk te vermenigvuldigen met de vermenigvuldigingsfactor van het telwerk
      en het verbruik voor het laagtelwerk op nul te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.4
    text: |-
      In afwijking van [5.3.2.2b][ref1] wordt in het geval dat een meetinrichting beschikt over een totaaltelwerk en een
      hoog- of normaaltelwerk, het verbruik bepaald door het verschil tussen de vastgestelde meterstand en de voorlaatste
      vastgestelde meterstand van het totaaltelwerk te vermenigvuldigen met de vermenigvuldigingsfactor van het telwerk
      en het verbruik voor het normaaltelwerk op nul te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.4a
    text: |-
      De in [5.3.2.2a][ref1], [5.3.2.2b][ref2], [5.3.2.3][ref3] en [5.3.2.4][ref4] bepaalde verbruiken worden in het
      allocatie- en reconciliatieproces als verbruik in normaaluren beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.5
    text: |-
      De netbeheerder bepaalt het verbruik voor een kleinverbruikaansluiting zonder meetinrichting op basis van het
      belastingprofiel dat overeenkomstig de systematiek beschreven in [bijlage 19 van de Netcode elektriciteit]
      (onbekend) is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.5
  - number: 5.3.2.6
    text: |-
      Indien de meterbeheerder een defect heeft vastgesteld in de meetinrichting, niet zijnde een
      schakelstoring, of fraude met de meetinrichting heeft geconstateerd, zal de netbeheerder, in afwijking van
      [5.3.2.1 tot en met 5.3.2.4][ref1], het te veel of te weinig geregistreerde verbruik bepalen voor de periode dat de
      meetinrichting niet correct heeft gefunctioneerd op basis van één of meerdere van de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.6.(i)
    text: de in het toegankelijk meetregister aanwezige betrouwbare meetreeks;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.6
  - number: 5.3.2.6.(ii)
    text: een met een herstelde meetinrichting gedurende twee maanden geregistreerd volume;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.6
  - number: 5.3.2.6.(iii)
    text: een ijkrapport;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.6
  - number: 5.3.2.6.(iv)
    text: indien door de desbetreffende klant aan de netbeheerder verstrekt, de productie-installatiegegevens.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.2.6
  - number: 5.3.3.1
    text: |-
      Het verbruik wordt bepaald door het verschil te bepalen tussen de vastgestelde meterstand en de voorlaatste
      vastgestelde meterstand van het telwerk en door dit verschil te vermenigvuldigen met de gewogen calorische factor
      van het desbetreffende netgebied voor de betreffende verbruiksperiode, de vermenigvuldigingsfactor van het telwerk
      en de volumeherleidingsfactor. De onderdelen uit deze formule worden als volgt bepaald:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.1.a
    text: 'de gewogen calorische factor voor de verbruiksperiode (GCFV) wordt berekend met de volgende formule:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.1.b
    text: |-
      voor de bij de aansluiting horende profielcategorie wordt de som van de profielfracties berekend met de volgende
      formule: 'Somfracties = Σ VP (h) Waarin: h = uren in maand x VP = de profielfracties van het verondersteld profiel'
      van de profielcategorie in de desbetreffende verbruiksperiode, rekening houdend met het juiste temperatuurgebied
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.1.c
    text: |-
      de profielfracties voor een bepaalde verbruiksperiode worden berekend aan de hand van de volgende formule: VP =
      TOP + TAP Waarin: TOP = temperatuuronafhankelijke deel van het profiel TAP = temperatuurafhankelijke deel van het
      profiel
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.1.d
    text: 'indien TAC groter is dan TST dan geldt TAP = 0 Waarin: TAC = actuele temperatuurcoëfficient; TST = stooktemperatuur'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.1.e
    text: 'indien TAC kleiner dan of gelijk aan TST is dan geldt: TAP = RER x (TST – TAC) Waarin: RER = regressiecoëfficient'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.1.f
    text: |-
      TOP, RER en TST worden beschikbaar gesteld door het platform bedoeld in [B3.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.3.3.1.g
    text: |-
      voor niet temperatuur gecorrigeerde meetinrichtingen is de volumeherleidingsfactor op grond van de 7-gradenmethode
      bepaald op 1 voor de verbruiksperiode tot 1 januari 2015 en op grond van de 15-gradenmethode bepaald op 0,97624
      voor de verbruiksperiode vanaf 1 januari 2015, met inachtneming van [5.1.3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.3.1.h
    text: voor temperatuur gecorrigeerde meetinrichtingen wordt geen volumeherleidingsfactor toegepast.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.1
  - number: 5.3.3.2
    text: |-
      Het verbruik voor kleinverbruikaansluitingen zonder meetinrichting wordt bepaald overeenkomstig [B3.4.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.3.3.3
    text: |-
      Indien de meterbeheerder een defect heeft vastgesteld in de meetinrichting, of fraude met de meetinrichting heeft
      geconstateerd, zal de netbeheerder in afwijking van 5.3.3.1, het te veel of te weinig geregistreerde verbruik
      bepalen voor de periode dat de meetinrichting niet correct heeft gefunctioneerd op basis van één of meerdere van de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.3
  - number: 5.3.3.3.(i)
    text: de in het toegankelijk meetregister aanwezige betrouwbare meetreeks;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.3
  - number: 5.3.3.3.(ii)
    text: het met een herstelde meetinrichting gedurende twee maanden geregistreerde volume;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.3
  - number: 5.3.3.3.(iii)
    text: een ijkrapport.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.3.3
  - number: 5.3.4.1
    text: |-
      Naar aanleiding van de ontvangen vastgestelde meterstand van de leverancier, bedoeld in [5.1.4.1][ref1],
      controleert de regionale netbeheerder of:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.4.1.a
    text: het bericht met de vastgestelde meterstand volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.1.c
    text: de aansluiting op de opnamedatum van de meterstand is voorzien van een meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.1.d
    text: |-
      de leverancier die de vastgestelde meterstand heeft verstuurd op grond van de collectie van een periodieke
      meterstand, bedoeld in [5.1.2.1][ref1], als de leverancier op de aansluiting in het aansluitingenregister vermeld
      staat voor de opnamedatum, waarop de meterstand betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.4.1.e
    text: |-
      de leverancier die de vastgestelde meterstand heeft verstuurd op grond van de collectie van een meterstand bij een
      mutatieproces, bedoeld in [5.1.2.2][ref1], de leverancier is die het betreffende mutatieproces heeft geïnitieerd;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.4.1.f
    text: het aantal vastgestelde meterstanden overeen komt met het aantal actieve telwerken van de meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.1.g
    text: |-
      het aantal posities van de vastgestelde meterstanden niet groter is dan het aantal posities (telwielen) van de
      telwerken van de meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.1.h
    text: de ontvangen vastgestelde periodieke meterstand, de meest recent vastgestelde meterstand is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.1.i
    text: |-
      de vastgestelde meterstand tijdig is ingediend, gelet op de mogelijkheid van de in [5.5.1.3][ref1] bedoelde
      wederpartij om hierover in dispuut te treden;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.3.4.1.j
    text: de aansluiting een kleinverbruikaansluiting is.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.1
  - number: 5.3.4.2
    text: |-
      Indien naar aanleiding van [5.3.4.1][ref1] de ontvangen meterstand niet verwerkt kan worden, bericht de regionale
      netbeheerder dit uiterlijk de werkdag na ontvangst van de vastgestelde meterstand aan de leverancier en vermeldt
      daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.4.2.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b
    text: 'de reden van het niet verwerken van de vastgestelde meterstand:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.1
    text: het bericht is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.3
    text: de aansluiting is op de opnamedatum van de meterstand niet voorzien van een meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.4
    text: de leverancier is niet vermeld in het aansluitingenregister voor de opnamedatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.5
    text: de leverancier is niet de leverancier die het mutatieproces heeft geïnitieerd;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.6
    text: het aantal vastgestelde meterstanden komt niet overeen met het aantal actieve telwerken van de meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.7
    text: |-
      het aantal posities van de vastgestelde meterstand is groter dan het aantal posities van het telwerk van de
      meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.8
    text: de ontvangen vastgestelde periodieke meterstand is niet de meest recent vastgestelde meterstand;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.b.9
    text: |-
      de vastgestelde meterstand is te laat ingediend waardoor de wederpartij als bedoeld in [5.5.1.3][ref1], hierover
      niet meer in dispuut kan treden;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.3.4.2.b.10
    text: de aansluiting is geen kleinverbruikaansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.2.c
    text: 'indien aangeleverd in het bericht: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.3.4.2
  - number: 5.3.4.3
    text: |-
      De regionale netbeheerder collecteert een op afstand uitleesbare meterstand namens de leverancier, indien de
