        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.4
    text: De regionale netbeheerders stellen het EAN-codeboek online beschikbaar.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.3.4
  - number: 2.4.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een openbaar
      register, hierna te noemen het CalGos-boek.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.4.1
  - number: 2.4.2
    text: |-
      De regionale netbeheerders maken uiterlijk de zevende werkdag van de maand per netgebied gegevens openbaar in het
      CalGos-boek, bedoeld in [2.4.1][ref1]. Deze gegevens betreffen het naar dat netgebied getransporteerde gas zoals
      bedoeld in [paragraaf 2.4 van de Allocatiecode gas][ref2] van de maand voorafgaand aan de huidige maand:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Paragraaf2.4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037931
        paragraaf: '2.4'
  - number: 2.4.2.a
    text: de maandgemiddelde calorische omrekenfactor;
