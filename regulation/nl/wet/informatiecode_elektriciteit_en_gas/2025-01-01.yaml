    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.5
  - number: 4.4.3.5.d
    text: de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.5
  - number: 4.4.3.5.e
    text: 'de procesidentificatie die van toepassing is, te weten: eindelevering;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.5
  - number: 4.4.3.6
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de
      meetverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.6.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.6.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.6.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.6.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.6.e
    text: 'de procesidentificatie die van toepassing is, te weten: eindelevering;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.6.f
    text: 'indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.6
  - number: 4.4.3.7
    text: |-
      Ingeval de aangeslotene voorafgaand aan de eindeleveringsdatum tijdig alsnog recht op levering verkrijgt, meldt de
      leverancier dit aan de netbeheerder:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.7
  - number: 4.4.3.7.a
    text: |-
      door middel van een inhuizingsmelding, bedoeld in [4.3.1.1][ref1], indien hij de actuele leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [4.3.2.1][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.4.3.7.b
    text: |-
      door middel van een switchmelding, bedoeld in [4.1.1.1][ref1], indien hij een nieuwe leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [4.1.2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.4.3.8
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces PV-
      switch, indien de eindelevering, bedoeld in [4.4.2.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.4.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig
      [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding of uithuizingsmelding is
      ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.4.4.2
    text: |-
      De netbeheerder informeert de meetverantwoordelijke overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties,
      bedoeld in [4.4.4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.5.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en het verbruik bij het eindeleveringsproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.5.1.1
    text: |-
      De leverancier stuurt tenminste vijf werkdagen en ten hoogste twintig werkdagen voor de switchdatum namens
      de aangeslotene een programmaverantwoordelijkeswitchmelding, hierna te noemen een PV-switchmelding naar de
      netbeheerder. In de PV-switchmelding is opgenomen:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.1.1.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.1.1.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.1.1.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.1.1.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.1.1.f
    text: 'indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.1.1
  - number: 4.5.2.1
    text: 'Naar aanleiding van de switchmelding controleert de netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.a
    text: de PV-switchmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.c
    text: |-
      de PV-switchdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig werkdagen
      in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.d
    text: de nieuwe programmaverantwoordelijke een volledige erkenning heeft volgens het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.e
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting voor een eerdere of dezelfde datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.f
    text: de switchmelding wordt ingediend door de in het aansluitingenregister vermelde leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.1.g
    text: de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.1
  - number: 4.5.2.2
    text: |-
      Als alle controles uit [4.5.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.5.2.4][ref2]. Als dat niet het geval is, wordt de PV-switch niet uitgevoerd en wordt de procedure na
      [4.5.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.2.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de PV-switch naar aanleiding van [4.5.2.2][ref1] uiterlijk de
      werkdag na ontvangst van de PV-switchmelding aan de leverancier die de PV-switchmelding heeft ingediend en vermeldt
      daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f
    text: 'de reden van het niet uitvoeren van de switch:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.1
    text: de switchmelding is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.3
    text: de switchdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.4
    text: de nieuwe programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.5
    text: |-
      de switchmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding voor een eerdere of dezelfde datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.6
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.f.7
    text: de aansluiting is geblokkeerd voor automatische mutaties;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.3.g
    text: 'indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.3
  - number: 4.5.2.4
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de
      leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.d
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.f
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.4.g
    text: 'indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.4
  - number: 4.5.2.5
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de oude
      programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.5
  - number: 4.5.2.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.5
  - number: 4.5.2.5.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.5
  - number: 4.5.2.5.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.5
  - number: 4.5.2.5.d
    text: de bedrijfs-EAN-code van de oude programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.5
  - number: 4.5.2.5.e
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.5
  - number: 4.5.2.6
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de
      nieuwe programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6.d
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6.f
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6
  - number: 4.5.2.6a
    text: |-
      Uiterlijk de werkdag na ontvangst van de switchmelding en direct na het bericht als bedoeld in [4.5.2.6][ref1]
      verzendt de netbeheerder aan de nieuwe programmaverantwoordelijke een bericht met de gegevens bedoeld in
      [bijlage 7.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.6a
