  - number: 6.4.4.3
    text: |-
      In het meetcorrectierapport bedoeld in [6.4.4.1][ref1] of [6.4.4.2][ref2] neemt de meetverantwoordelijke, per
      periode waarvoor de betrokken programmaverantwoordelijke, leverancier en netbeheerder gezamenlijk verantwoordelijk
      zijn, tenminste de volgende gegevens op:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.3
