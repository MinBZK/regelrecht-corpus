        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.5.2.1
    text: 'Naar aanleiding van de switchmelding controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.1.a
    text: de PV-switchmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.1.c
    text: |-
      de PV-switchdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig werkdagen in
      de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.1.d
    text: |-
      de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.1.e
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting voor een eerdere of dezelfde datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.1.f
    text: de PV-switchmelding is ingediend door de in het aansluitingenregister vermelde leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.1
  - number: 3.5.2.2
    text: |-
      Als alle controles uit [3.5.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.5.2.4][ref2]. Als dat niet het geval is, wordt de PV-switch niet uitgevoerd en wordt de procedure na
      [3.5.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de PV-switch naar aanleiding van [3.5.2.2][ref1] uiterlijk
      de werkdag na ontvangst van de PV-switchmelding aan de leverancier die de PV-switchmelding heeft ingediend en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f
    text: 'de reden van het niet uitvoeren van de switch:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f.1
    text: de switchmelding is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f.3
    text: de switchdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f.4
    text: de nieuwe programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f.5
    text: |-
      de switchmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde switch, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.f.6
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.3.g
    text: 'indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.3
  - number: 3.5.2.4
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding
      aan de leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.d
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.f
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.4.g
    text: 'indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.4
  - number: 3.5.2.5
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de switchmelding aan
      de oude programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.5
  - number: 3.5.2.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.5
  - number: 3.5.2.5.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.5
  - number: 3.5.2.5.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.5
  - number: 3.5.2.5.d
    text: de bedrijfs-EAN-code van de oude programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.5
  - number: 3.5.2.5.e
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.5
  - number: 3.5.2.6
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding
      aan de nieuwe programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6.d
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6.f
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6
  - number: 3.5.2.6a
    text: |-
      Uiterlijk de werkdag na ontvangst van de switchmelding en direct na het bericht als bedoeld in [3.5.2.6][ref1]
      verzendt de netbeheerder aan de nieuwe programmaverantwoordelijke een bericht met de gegevens bedoeld in
      [bijlage 7.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.2.6a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 3.5.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.5.3.2
    text: |-
      De regionale netbeheerder informeert de leverancier en nieuwe programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1] over de mutaties, bedoeld in [3.5.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.1.1
    text: |-
      De leverancier informeert de regionale netbeheerder tenminste vijfentwintig werkdagen en ten hoogste
      dertig werkdagen voor de beoogde switchdatum over het voornemen om een bulk PV-switch uit te voeren. In de
      vooraankondiging wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.1.1
  - number: 3.6.1.1.a
    text: de beoogde switchdatum van de in te dienen bulk PV-switch;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.1.1
  - number: 3.6.1.1.b
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.1.1
  - number: 3.6.1.1.c
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.1.1
  - number: 3.6.1.1.d
    text: bij benadering het aantal aansluitingen dat de bulk PV-switch zal bevatten.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.1.1
  - number: 3.6.1.2
    text: |-
      In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde
      berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.6.2.1
    text: |-
      Op grond van de leveringsovereenkomsten met de desbetreffende kleinverbruikers stuurt de leverancier tenminste
      vijf werkdagen en ten hoogste twintig werkdagen voor de switchdatum een melding bulk PV-switch naar de regionale
      netbeheerder. In afwijking van [1.1.4][ref1] wordt in het bericht vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel1
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 3.6.2.1.a
    text: de EAN-codes van de aansluitingen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.2.1.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.2.1.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.2.1.d
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.2.1.e
    text: 'de procesidentificatie die van toepassing is, te weten: "PV-switch";'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.2.1.f
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.2.1.g
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.2.1
  - number: 3.6.3.1
    text: |-
      Naar aanleiding van de melding bulk PV-switch controleert de regionale netbeheerder of: a. de melding bulk PV-
      switch volledig en syntactisch correct is; b. de switchdatum ten opzichte van de datum van indienen tenminste
      vijf werkdagen en ten hoogste twintig werkdagen in de toekomst ligt; c. de nieuwe programmaverantwoordelijke
      een volledige erkenning heeft volgens het programmaverantwoordelijkenregister; Per individuele aansluiting in
      de melding bulk PV-switch controleert de regionale netbeheerder of: d. de EAN-code van de aansluiting voor komt
      in het aansluitingenregister; e. de melding bulk PV-switch wordt ingediend door de in het aansluitingenregister
      vermelde leverancier; f. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding,
      inhuizingsmelding, uithuizingsmelding of eindeleveringsmelding is voor een eerdere of dezelfde datum; g. de
      aansluiting volgens het aansluitingenregister een kleinverbruikaansluiting is.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.1
  - number: 3.6.3.2
    text: |-
      De regionale netbeheerder beëindigt de bulk PV-switchprocedure en bericht dit uiterlijk drie werkdagen na
      ontvangst van de melding bullk PV-switch aan de leverancier, indien één of meerdere van de controles, bedoeld in
      [3.6.3.1, onderdeel a tot en met c][ref1], een negatief resultaat opleveren, en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.3.2.a
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.2.b
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.2.c
    text: 'de reden van het niet uitvoeren van de melding bulk PV-switch:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.2.c.1
    text: de melding bulk PV-switch is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.2.c.2
    text: de switchdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.2.c.3
    text: de nieuwe programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.2.d
    text: 'indien aangeleverd in de bulk PV-switchmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.6.3.2
  - number: 3.6.3.3
    text: |-
      De regionale netbeheerder beëindigt de PV-switchprocedure voor de desbetreffende aansluiting en bericht dit
      uiterlijk drie werkdagen na ontvangst van de melding bulk PV-switch aan de leverancier, indien één of meerdere van
      de controles, bedoeld in [3.6.3.1, onderdeel d tot en met g][ref1], een negatief resultaat opleveren, en vermeldt
      daarbij: a. de bedrijfs-EAN-code van de regionale netbeheerder; b. de bedrijfs-EAN-code van de leverancier; c.
      indien aangeleverd in de bulk PV-switchmelding: het referentienummer van de leverancier; Per aansluiting waarvoor
      de melding wordt afgewezen wordt vermeld: d. de EAN-code van de aansluiting; e. de reden van het niet uitvoeren van
      de PV-switch: 1° de EAN-code van de aansluiting is onbekend; 2° de indienende leverancier is onjuist; 3° de melding
      bulk PV-switch conflicteert met een eerdere leverancierswitchmelding, inhuizingsmelding, uithuizingsmelding of
      eindeleveringsmelding; 4° de aansluiting is volgens het aansluitingenregister geen kleinverbruikaansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
