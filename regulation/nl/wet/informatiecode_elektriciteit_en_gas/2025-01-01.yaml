        artikel: 95la
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 42a
  - number: 10.2.2
    text: |-
      De gedragscode, bedoeld in [10.2.1][ref1], bevat tenminste de onderwerpen waarover de netbeheerders verantwoording
      afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.2.2
    references:
