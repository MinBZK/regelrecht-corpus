      gereconcilieerd en de correctie zelf niet op grond hiervan verrekend wordt.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.3
  - number: 6.9.2.1
    text: |-
      De verrekeningen als bedoeld in [paragraaf 6.9.1][ref1] vinden plaats overeenkomstig het proces in
      [paragraaf 6.9.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.1
