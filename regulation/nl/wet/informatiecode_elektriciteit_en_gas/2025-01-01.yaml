        artikel: '22'
  - number: 1.1.2
    text: |-
      De in deze code gebruikte begrippen die ook in de [Elektriciteitswet 1998][ref1] of de [Gaswet][ref2]
      worden gebruikt, hebben de betekenis die daaraan in de desbetreffende wet is toegekend. Van de overige in
      deze code gebruikte begrippen is de betekenis vastgelegd in de [Begrippencode elektriciteit][ref3] of de
      [Begrippencode gas][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
      [ref3]: https://wetten.overheid.nl/BWBR0037938
      [ref4]: https://wetten.overheid.nl/BWBR0037923
