  - number: 2.2b.5
    text: |-
      De netbeheerder verstuurt de in [2.2b.4][ref1] bedoelde gegevens, die betrekking hebben op de dag voorafgaand aan
      de dag van ontvangst van de opvraag, zo snel mogelijk doch uiterlijk de werkdag na ontvangst van de opvraag aan de
      opvragende leverancier.


