        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.2
    text: |-
      Ten behoeve van de verrekening als bedoeld in [6.9.1.1][ref1] of [6.9.1.2][ref2] en op verzoek van
      de belanghebbende leverancier, verstrekt de netbeheerder de bedrijfsgegevens van de leverancier of de
      programmaverantwoordelijke betreffende de periodes van levering waartoe de te verrekenen verbruiken behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.3
    text: |-
      De belanghebbende leverancier, programmaverantwoordelijke of netbeheerder initieert het verrekenen op grond van
      [6.9.1.1][ref1] of [6.9.1.2][ref2] door een verrekenverzoek bij de betrokken wederpartij in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.3
