      De regionale netbeheerder registreert de in [2.5.5, onderdelen a en b][ref1], bedoelde gegevens onmiddellijk in
      het contracteindegegevensregister en verwijdert deze één maand nadien uit het contracteindegegevensregister. De
      netbeheerder archiveert de verwijderde gegevens gedurende 1 jaar in verband met mogelijke klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.7
    references:
