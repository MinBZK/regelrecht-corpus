  - number: 4.5.2.7
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de
      meetverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.7
  - number: 4.5.2.7.a
    text: de EAN-code van de aansluiting;
