    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.3
  - number: 2.5a.3.d.4
    text: |-
      de door de leverancier aangeleverde klantsleutel komt niet overeen met de klantsleutel voor de aansluiting in de
      klantsleuteladministratie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.3
