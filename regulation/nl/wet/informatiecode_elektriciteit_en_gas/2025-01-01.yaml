      de waarde ‘telemetrie’ heeft voor de betreffende onbalansverrekeningsperiode: de in
      [Bijlage 3, artikel 9 van de Netcode elektriciteit][ref2] bedoelde reconciliatieprijs per
      onbalansverrekeningsperiode, voor meetperiodes na 1 januari 2025 en de in [artikel 15.7, eerste lid van de Netcode
      elektriciteit](onbekend) bedoelde per kalendermaand gewogen day-ahead-clearingprijs voor normaaluren en laaguren
      voor de meetperiodes voor 1 januari 2025.


