  - number: 3.1.2.9
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering, PV-switch of wijzigen naam, indien de leverancierswitch, bedoeld in [3.1.1.1][ref1], het
      desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.10
    text: |-
      De netbeheerder beëindigt de procedure van een, voor dezelfde mutatiedatum, reeds bevestigde switch van leverancier
      of inhuizing, indien de leverancierswitch, bedoeld in [3.1.1.1][ref1], de reeds bevestigde switch van leverancier
      annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.10
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.11
    text: |-
      De netbeheerder verstuurt een verliesbericht van de beëindiging van de procedure als bedoeld in [3.1.2.10][ref1]
      naar de betrokken partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.3.2
    text: |-
      De regionale netbeheerder informeert de nieuwe leverancier en de nieuwe programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [3.1.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.4
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.4.1
    text: |-
      De nieuwe leverancier collecteert de meterstand behorende bij het switchproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.4.2
    text: |-
      De nieuwe leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de actuele leverancier één
      werkdag voor de uithuizingsdatum namens deze aangeslotene een uithuizingsmelding naar de regionale netbeheerder. De
      uithuizingsmelding bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.1
  - number: 3.2.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.1
  - number: 3.2.1.1.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.1
  - number: 3.2.1.1.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.1
  - number: 3.2.1.1.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.1
  - number: 3.2.1.1.e
    text: 'indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.1
  - number: 3.2.1.2
    text: |-
      In afwijking van [3.2.1.1][ref1] stuurt de actuele leverancier de uithuizingsmelding, bedoeld in 3.2.1.1,
      tenminste één werkdag en ten hoogste twintig werkdagen voor de uithuizingsdatum naar de regionale netbeheerder,
      indien de aansluiting een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend
      bij een afnemer bedoeld in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of
      [artikel 52c][ref4] of [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.2.2.1
    text: 'Naar aanleiding van de uithuizingsmelding controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.a
    text: de uithuizingsmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.c
    text: |-
      de uithuizingsdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig werkdagen
      in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.d
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting met een eerdere datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.e
    text: 'de uithuizingsmelding is ingediend door:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.e.i
    text: de in het aansluitingenregister vermelde leverancier, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.1.e.ii
    text: |-
      bij een aansluiting zonder geregistreerde leverancier: de leverancier van een bevestigde inhuizing met dezelfde
      mutatiedatum.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.1
  - number: 3.2.2.2
    text: |-
      Als alle controles uit [3.2.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.2.2.4][ref2]. Als dat niet het geval is, wordt de uithuizing niet uitgevoerd en wordt de procedure na
      [3.2.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de uithuizing naar aanleiding van [3.2.2.2][ref1]
      uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de leverancier die de uithuizingsmelding heeft
      ingediend en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.d
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.e
    text: 'de reden van het niet uitvoeren van de uithuizing:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.e.1
    text: de uithuizingsmelding is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.e.3
    text: de uithuizingsdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.e.4
    text: |-
      de uithuizingsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde leverancierswitchmelding,
      inhuizingsmelding of eindeleveringsmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.e.5
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.3.f
    text: 'indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.3
  - number: 3.2.2.4
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding
      aan de actuele leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.4.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.4.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.4.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.4.e
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.4.f
    text: 'indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.4
  - number: 3.2.2.5
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding
      aan de actuele programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.5
  - number: 3.2.2.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.5
  - number: 3.2.2.5.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.5
  - number: 3.2.2.5.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.5
  - number: 3.2.2.5.d
    text: de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.5
  - number: 3.2.2.5.e
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.5
  - number: 3.2.2.6
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      eindelevering, PV-switch of wijzigen naam, indien de uithuizing, bedoeld in [3.2.1.1][ref1], het desbetreffende
      mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de actuele leverancier aangeleverde
      gegevens overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding of
      uithuizingsmelding voor dezelfde aansluiting is ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.3.2
    text: |-
      De regionale netbeheerder zet, indien de aansluiting is voorzien van een meetinrichting die op afstand uitleesbaar
      is, de administratieve status van de meetinrichting, bedoeld in [2.1.4 onderdeel b][ref1], op "aan" indien deze op
      "uit" staat.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.3.4
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.4.1
    text: |-
      De actuele leverancier collecteert de meterstand behorende bij het uithuizingsproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.4.2
    text: |-
      De actuele leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de nieuwe leverancier
      tenminste op de inhuizingsdatum en ten hoogste twee werkdagen voor de inhuizingsdatum namens deze aangeslotene een
      inhuizingsmelding naar de regionale netbeheerder. De inhuizingsmelding bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.b
    text: de naam van de nieuwe aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.c
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.d
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.e
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.f
    text: de bedrijfs-EAN-code van de programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.g
    text: het correspondentieadres van de aangeslotene indien dit afwijkt van het adres behorende bij de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.i
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.j
    text: 'indien de leverancier hierover beschikt: de geboortedatum van de aangeslotene;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.1.k
    text: 'indien de leverancier hierover beschikt: het KvK-nummer van de aangeslotene.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.1
  - number: 3.3.1.2
    text: |-
      In afwijking van [3.3.1.1][ref1] stuurt de nieuwe leverancier de in 3.3.1.1 bedoelde inhuizingsmelding tenminste
      op de inhuizingsdatum en ten hoogste twintig werkdagen voor de inhuizingsdatum naar de regionale netbeheerder,
      indien de aansluiting een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend
      bij een afnemer bedoeld in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of
      [artikel 52c][ref4] of [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.3.2.1
    text: 'Naar aanleiding van de inhuizingsmelding controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.1.a
    text: de inhuizingsmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.1.c
    text: |-
      de inhuizingsdatum ten opzichte van de datum van indienen tenminste op dezelfde datum en ten hoogste twintig
      werkdagen in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.1.d
    text: de nieuwe leverancier is opgenomen in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.1.e
    text: |-
      de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.1.f
    text: |-
      de mutatiedatum niet ligt vóór de mutatiedatum van een eerder bevestigde leverancierswitchmelding of
      inhuizingsmelding voor dezelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.1
  - number: 3.3.2.2
    text: |-
      Als alle controles uit [3.3.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.3.2.4][ref2]. Als dat niet het geval is, wordt de inhuizing niet uitgevoerd en wordt de procedure na
      [3.3.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de inhuizing naar aanleiding van [3.3.2.2][ref1] uiterlijk
      de werkdag na ontvangst van de inhuizingsmelding aan de leverancier die de inhuizingsmelding heeft ingediend en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.c
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.d
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e
    text: 'de reden van het niet uitvoeren van de inhuizing:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e.1
    text: de inhuizingsmelding is onvolledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e.3
    text: de inhuizingsdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e.4
    text: de nieuwe leverancier komt niet voor in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e.5
    text: de programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.e.6
    text: |-
      de mutatiedatum van de inhuizingsmelding ligt vóór de mutatiedatum van een eerder bevestigde inhuizingsmelding
      of leverancierswitchmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.3.f
    text: 'indien aangeleverd in de inhuizingsmelding: het referentienummer van de nieuwe leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.3
  - number: 3.3.2.4
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de
      inhuizingsmelding aan de nieuwe leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.b
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.c
    text: de naam van de inhuizende aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.d
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.e
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.f
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.g
    text: |-
      indien de inhuizingsmelding tevens een uithuizing van de oude leverancier tot gevolg heeft: de bedrijfs-EAN-code
      van de oude leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.h
    text: 'de procesidentificatie die van toepassing is, te weten: inhuizing;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.4.i
    text: 'indien aangeleverd in de inhuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.4
  - number: 3.3.2.5
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de
      inhuizingsmelding aan de nieuwe programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5.b
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5.d
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5.f
    text: 'de procesidentificatie die van toepassing is, te weten: inhuizing.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5
  - number: 3.3.2.5a
    text: |-
      Uiterlijk de werkdag na ontvangst van de inhuizingsmelding en direct na het bericht als bedoeld in [3.3.2.5][ref1]
      verzendt de netbeheerder aan de nieuwe programmaverantwoordelijke een bericht met de gegevens bedoeld in
      [bijlage 7.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.5a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 3.3.2.6
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht als gevolg van de inhuizing uiterlijk de werkdag na
      ontvangst van de inhuizingsmelding aan de oude leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.6.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.6.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.6.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.6.d
    text: de bedrijfs-EAN-code van de oude leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.6.e
    text: de bedrijfs-EAN-code van de nieuwe leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.6.f
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.6
  - number: 3.3.2.7
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht als gevolg van de inhuizing uiterlijk de werkdag na
      ontvangst van de inhuizingsmelding aan de oude programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.7
  - number: 3.3.2.7.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.7
  - number: 3.3.2.7.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.7
  - number: 3.3.2.7.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.7
  - number: 3.3.2.7.d
    text: de bedrijfs-EAN-code van de oude programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.7
  - number: 3.3.2.7.e
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.7
  - number: 3.3.2.8
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering, PV-switch of wijzigen naam, indien de inhuizing, bedoeld in [3.3.1.1][ref1], het
      desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.2.9
    text: |-
      De netbeheerder beëindigt de procedure van een, voor dezelfde mutatiedatum, reeds bevestigde inhuizing of switch
      van leverancier, indien de inhuizing, bedoeld in [3.3.1.1][ref1], de reeds bevestigde switch van leverancier
      annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.2.10
    text: |-
      De netbeheerder verstuurt een verliesbericht van de beëindiging van de procedure als bedoeld in [3.3.2.9][ref1]
      naar de betrokken partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.2.10
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.3.2
    text: |-
      De regionale netbeheerder informeert de nieuwe leverancier en nieuwe programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [3.3.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3.3
    text: |-
      De regionale netbeheerder zet, indien de aansluiting is voorzien van een meetinrichting die op afstand uitleesbaar
      is, de administratieve status van de meetinrichting, bedoeld in [2.1.4 onderdeel b][ref1], op "aan" tenzij de
      aangeslotene voorafgaand aan de inhuizing heeft aangegeven dat de administratieve status van de meetinrichting,
      bedoeld in 2.1.4 onderdeel b, op "uit" moet staan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.3.5
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.4.1
    text: |-
      De nieuwe leverancier collecteert de meterstand behorende bij het inhuizingsproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.4.2
    text: |-
      De nieuwe leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.1.1
    text: |-
      De leverancier informeert de aangeslotene tenminste twintig werkdagen voorafgaand aan het indienen
      van de eindeleveringsmelding bij de regionale netbeheerder over zijn voornemen om de levering te
      beëindigen. De leverancier zorgt dat is voldaan aan de voorwaarden van de regeling, bedoeld in
      [artikel 95b, achtste lid, van de Elektriciteitswet 1998][ref1] en [artikel 44, achtste lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel44
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95b
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '44'
  - number: 3.4.1a.1
    text: |-
      Voorafgaand aan het eindeleveringsbericht stuurt de actuele leverancier een vooraankondiging eindeleveringsmelding
      tien werkdagen voor de voorgenomen mutatiedatum van de in te dienen eindeleveringsmelding naar de regionale
      netbeheerder. De vooraankondiging eindelevering bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1a.1
  - number: 3.4.1a.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1a.1
  - number: 3.4.1a.1.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1a.1
  - number: 3.4.1a.1.c
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1a.1
  - number: 3.4.1a.1.d
    text: 'de procesidentificatie die van toepassing is, te weten: vooraankondiging eindelevering;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1a.1
  - number: 3.4.1a.1.e
    text: de voorgenomen mutatiedatum.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.1a.1
  - number: 3.4.2.1
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.1
  - number: 3.4.2.2
    text: |-
      De actuele leverancier stuurt een eindeleveringsmelding één werkdag voor de eindeleveringsdatum naar de regionale
      netbeheerder, waarin is vermeld:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.2
  - number: 3.4.2.2.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.2
  - number: 3.4.2.2.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.2
  - number: 3.4.2.2.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.2
  - number: 3.4.2.2.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.2
  - number: 3.4.2.2.e
    text: 'indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.2
  - number: 3.4.2.3
    text: |-
      In afwijking van [3.4.2.2][ref1] stuurt de actuele leverancier de in 3.4.2.2 bedoelde eindeleveringsmelding
      tenminste één werkdag en ten hoogste twintig werkdagen voor de eindeleveringsdatum naar de regionale netbeheerder,
      indien de aansluiting een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend
      bij een afnemer bedoeld in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of
      [artikel 52 c][ref4] of [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.4.3.1
    text: 'Naar aanleiding van de eindeleveringsmelding controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.1.a
    text: de eindeleveringsmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.1.c
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.1.d
    text: |-
      de eindeleveringsdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig
      werkdagen in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.1.e
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde eindeleverings-, leverancierswitch-, uithuizings- of
      inhuizingsmelding is voor dezelfde aansluiting met dezelfde of een eerdere datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.1.f
    text: de eindeleveringsmelding wordt ingediend door de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.1
  - number: 3.4.3.2
    text: |-
      Als alle controles uit [3.4.3.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.4.3.4][ref2]. Als dat niet het geval is, wordt de eindelevering niet uitgevoerd en wordt de procedure na
      [3.4.3.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.3.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de eindelevering naar aanleiding van [3.4.3.2][ref1]
      uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de leverancier die de eindeleveringsmelding
      heeft ingediend en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.3.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e
    text: 'de reden van het niet uitvoeren van de eindelevering:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e.1
    text: de eindeleveringsmelding is onvolledig of syntactisch niet correct;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e.2
    text: de EAN-code van de aansluiting is onbekend
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e.4
    text: de eindeleveringsdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e.5
    text: |-
      de eindeleveringsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde eindeleverings-,
      switch-, uithuizings- of inhuizingsmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.e.6
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.3.f
    text: 'indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.3
  - number: 3.4.3.4
    text: |-
      De regionale netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding
      aan de actuele leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.4.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.4.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.4.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.4.e
    text: 'de procesidentificatie die van toepassing is, te weten: eindelevering;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.4.f
    text: 'indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.4
  - number: 3.4.3.5
    text: |-
      De regionale netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding
      aan de actuele programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.5
  - number: 3.4.3.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.5
  - number: 3.4.3.5.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.5
  - number: 3.4.3.5.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.5
  - number: 3.4.3.5.d
    text: de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.5
  - number: 3.4.3.5.e
    text: 'de procesidentificatie die van toepassing is, te weten: eindelevering.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.5
  - number: 3.4.3.6
    text: |-
      Ingeval de aangeslotene voorafgaand aan de eindeleveringsdatum tijdig alsnog recht op levering verkrijgt, meldt de
      leverancier dit aan de regionale netbeheerder:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.6
  - number: 3.4.3.6.a
    text: |-
      door middel van een inhuizingsmelding, bedoeld in [3.3.1.1][ref1], indien hij de actuele leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [3.3.2.1][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.4.3.6.b
    text: |-
      door middel van een switchmelding, bedoeld in [3.1.1.1][ref1], indien hij een nieuwe leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [3.1.2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.4.3.7
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      eindelevering, PV-switch of wijzigen naam, indien de eindelevering, bedoeld in [3.4.2.2][ref1], het desbetreffende
      mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.4.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de actuele leverancier aangeleverde
      gegevens overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding of
      uithuizingsmelding voor dezelfde aansluiting is ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.4.2
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.5.1
    text: |-
      De actuele leverancier collecteert de meterstand behorende bij het eindeleveringsproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.5.2
    text: |-
      De actuele leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.5.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de actuele leverancier één
      werkdag voor de switchdatum een programmaverantwoordelijke-switchmelding, hierna te noemen een PV-switchmelding
      naar de regionale netbeheerder. In de PV-switchmelding is opgenomen:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.1.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.1.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.1.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.1.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.1.f
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.1
  - number: 3.5.1.2
    text: |-
      In afwijking van [3.5.1.1][ref1] stuurt de leverancier de in 3.5.1.1 bedoelde switchmelding tenminste één werkdag
      en ten hoogste twintig werkdagen voor de switchdatum naar de regionale netbeheerder, indien de aansluiting een
      kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend bij een afnemer bedoeld
      in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of [artikel 52c][ref4] of
      [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
