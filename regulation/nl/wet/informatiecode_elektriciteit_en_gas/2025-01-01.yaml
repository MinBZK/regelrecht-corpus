        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 2.5.11.b
    text: |-
      voorbereiding van levering, zoals vastgelegd in [paragraaf 2.5b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.11
