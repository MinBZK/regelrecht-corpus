      De regionale netbeheerder registreert de in [2.5.3][ref1] bedoelde gegevens binnen een werkdag in het
      contracteindegegevensregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.6
    references:
