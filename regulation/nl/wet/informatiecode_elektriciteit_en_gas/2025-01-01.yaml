        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.11
    text: |-
      De netbeheerder verstuurt een verliesbericht van de beëindiging van de procedure bedoeld in [4.3.2.10][ref1] naar
      de betrokken partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.11
