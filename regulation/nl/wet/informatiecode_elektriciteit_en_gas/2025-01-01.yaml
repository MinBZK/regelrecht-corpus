        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.3.a
    text: het eerder gecommuniceerde met het net uitgewisselde volume [m3(n)] per desbetreffende verbruiksperiode(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.3
  - number: 6.4.4.3.b
    text: |-
      het nieuw, door schatting, bepaalde met het net uitgewisselde volume [m3(n)] in de verbruiksperiode(n) bedoeld
      onder a;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.3
  - number: 6.4.4.3.c
    text: de periode dat de meting onjuist is geweest en
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.3
  - number: 6.4.4.3.d
    text: de oorzaak van de onvolkomenheid en de genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.3
  - number: 6.4.4.4
    text: |-
      De meetverantwoordelijke stuurt binnen tien werkdagen nadat de onvolkomenheid is geconstateerd de gegevens bedoeld
      in [6.4.4.3][ref1] aan de programmaverantwoordelijke(n), leverancier(s) en netbeheerder(s) per periode waarvoor
      deze gezamenlijk verantwoordelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.5
    text: |-
      Als er binnen tien werkdagen na ontvangst van de in [6.4.4.1][ref1], [6.4.4.2][ref2] of [6.4.4.4][ref3] bedoelde
      gegevens geen reactie is gekomen van de betrokken aangeslotene(n), netbeheerder(s), meetverantwoordelijke(n),
      programmaverantwoordelijke(n) of leverancier(s), is (zijn) het (de) nieuw, door schatting, bepaalde volume(s)
      [m3(n)], bedoeld in [6.4.4.3 onderdeel b][ref4], geaccepteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
