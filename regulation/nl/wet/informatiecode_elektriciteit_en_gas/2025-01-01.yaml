    text: het verzoek is niet voorzien van een toestemmingssleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.3
  - number: 2.5b.1
    text: |-
      Een leverancier die beschikt over een leveringsovereenkomst waarvan de startdatum voor levering in te
      toekomst ligt en (i) wiens leveringsovereenkomst voor de desbetreffende kleinverbruiker is geregistreerd
      in het contracteindegegevensregister, of (ii) wiens melding als bedoeld in [2.5.5][ref1] voor de
      desbetreffende kleinverbruiker is geregistreerd in het contracteindegegevensregister, kan bij de netbeheerder
      contracteindegegevens horend bij de desbetreffende kleinverbruikaansluiting opvragen onder vermelding van: a. de
      bedrijfs-EAN-code van de opvragende leverancier; b. de EAN-code van de aansluiting; c. indien de leverancier dat
      wenst op te geven: een referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
