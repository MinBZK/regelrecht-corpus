  - number: 6.9.1.3.b.1°
    text: |-
      een correctie op grond van [6.4.3.4][ref1] of [6.4.3.6][ref2] plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.3
