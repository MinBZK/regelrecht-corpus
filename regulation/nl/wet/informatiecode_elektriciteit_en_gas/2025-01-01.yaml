  - number: 2.7.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een register,
      hierna te noemen het netbeheerdersregister.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.1
  - number: 2.7.2
    text: |-
      De regionale netbeheerders stellen in het netbeheerdersregister, bedoeld in [2.7.1][ref1], aan leveranciers,
      programmaverantwoordelijken en meetverantwoordelijken de volgende gegevens online beschikbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.7.2.a
    text: de bedrijfsnaam;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.b
    text: de handelsna(a)m(en);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.c
    text: de bedrijfs-EAN-codes waarmee hij zich in het berichtenverkeer identificeert;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.d
    text: de EAN-codes van zijn netgebieden;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.e
    text: de adresgegevens;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.f
    text: het bankrekeningnummer ten behoeve van de afdracht in het leveranciersmodel;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.g
    text: het BTW-nummer;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.h
    text: het inschrijfnummer bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.2.i
    text: de gegevens van de contactpersonen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.2
  - number: 2.7.3
    text: |-
      In het netbeheerdersregister, bedoeld in [2.7.1][ref1], wordt van de gegevens, bedoeld in [2.7.2][ref2], tevens de
      begindatum en, indien bekend, de einddatum van de geldigheid van de gegevens per gegeven vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.7.4
    text: |-
      Bij een nieuwe registratie in het netbeheerdersregister, bedoeld in [2.7.1][ref1], stelt de netbeheerder de
      gegevens, bedoeld in [2.7.2, onderdelen a tot en met h][ref2] tenminste één maand en de gegevens, bedoeld in
      2.7.2 onderdeel i tenminste vijf werkdagen voor de beoogde ingangsdatum beschikbaar in netbeheerdersregister onder
      vermelding van de eerste geldigheidsdatum van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.7.5
    text: |-
      Bij de wijziging van een bestaande registratie in het netbeheerdersregister, bedoeld in [2.7.1][ref1], stelt de
      netbeheerder wijzigingen in de gegevens, bedoeld in [2.7.2, onderdelen a tot en met h][ref2] tenminste één maand en
      wijzigingen in de gegevens, bedoeld in 2.7.2 onderdeel i tenminste vijf werkdagen voor de beoogde wijzigingsdatum
      beschikbaar in het netbeheerdersregister onder vermelding van de ingangsdatum van de wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.7.6
    text: |-
      In aanvulling op het beschikbaar stellen van de gegevens, bedoeld in [2.7.4][ref1] en [2.7.5][ref2], communiceert
      de netbeheerder de gegevens overeenkomstig de termijnen, bedoeld in 2.7.4 en 2.7.5, rechtstreeks aan de
      leveranciers, geregistreerd in het leveranciersregister, bedoeld in [2.8.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.6
    references:
