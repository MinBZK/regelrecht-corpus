    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.f
    text: de wijze waarop de desbetreffende kleinverbruiker de toestemming heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.g
    text: |-
      de postcode en het huisnummer met eventuele huisnummertoevoeging van het adres van de desbetreffende
      kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.h
    text: de EAN-code van de aansluiting van de desbetreffende kleinverbruiker.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.3
    text: |-
      De netbeheerder kan, indien daar reden voor is, de gegevens uit de toestemmingenadministratie gedurende de
      bewaartermijn als bedoeld in [10.1.4b.2][ref1] en [10.1.4b.3][ref2], opvragen bij de leverancier onder vermelding
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.3
    references:
