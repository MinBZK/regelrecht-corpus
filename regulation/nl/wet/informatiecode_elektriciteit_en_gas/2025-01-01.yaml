  - number: 3.14.1.9
    text: |-
      Indien tussen de onterechte switch van leverancier en de uitvoering van de correctie een wisseling van
      de meetinrichting heeft plaatsgevonden zoals bedoeld in [paragraaf 3.11][ref1], wordt in afwijking van
      [3.14.1.8][ref2] de vastgestelde meterstand ten tijde van de meterplaatsing door de leverancier vastgesteld voor de
      mutatiedatum van de switchmelding die ter correctie is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.1.9
