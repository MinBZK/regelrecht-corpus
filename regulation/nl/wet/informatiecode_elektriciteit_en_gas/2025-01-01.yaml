  - number: 3.14.4.2
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte eindelevering meldt dit onmiddellijk aan
      de netbeheerder en dient uiterlijk één werkdag nadien, ter correctie een inhuizingsmelding in overeenkomstig
      [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.4.2
