        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.4.3
    text: |-
      Indien bij de uitvoering van de inhuizing bedoeld in [3.14.4.2][ref1], het in [2.1.4 onderdeel b][ref2] bedoelde
      kenmerk, is gewijzigd met als gevolg dat de meetinrichting op afstand uitgelezen mag worden, meldt de leverancier
      dit onmiddellijk aan de netbeheerder na het indienen van de inhuizingsmelding als bedoeld in 3.14.4.2. In afwijking
      van [paragraaf 9.1][ref3] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


