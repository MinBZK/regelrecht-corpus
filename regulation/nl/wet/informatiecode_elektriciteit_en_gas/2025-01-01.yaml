  - number: 3.14.3.1
    text: |-
      Onder een onterechte procedure wordt verstaan de uitvoering van de procedure, bedoeld in [paragraaf 3.3][ref1],
      op een aansluiting waarbij de veronderstelde aangeslotene niet daadwerkelijk op de aansluiting is ingehuisd dan
      wel dat er geen leveringsovereenkomst voor de desbetreffende aansluiting tussen de aangeslotene en de leverancier
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.3.1
