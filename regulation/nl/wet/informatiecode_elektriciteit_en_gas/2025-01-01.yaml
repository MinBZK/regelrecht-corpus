        paragraaf: 2.2d
  - number: 2.2.1
    text: |-
      De netbeheerder verzendt uiterlijk de werkdag volgend op de dag dat één of meerdere gegevens in het
      aansluitingenregister zijn gewijzigd de stamgegevens van de desbetreffende aansluiting aan de actuele leverancier
      op de aansluiting en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.a
    text: 'de reden van verzending van de stamgegevens, te weten: "wijziging stamgegevens";'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.b
    text: 'de aanduiding van het desbetreffende mutatieproces, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.b.(i)
    text: een leverancierswitch, een inhuizing, of een switch van programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.b.(ii)
    text: een meterwissel, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.b.(iii)
    text: een verzoek tot wijziging van de allocatiemethode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.c
    text: de datum waarop het aansluitingenregister door de netbeheerder is gemuteerd;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2.1
  - number: 2.2.1.d
    text: |-
      de gegevens bedoeld in [B7.1][ref1];


