        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.14'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.3.5
    text: |-
      Indien de onterechte inhuizing is bevestigd, dient de leverancier die voor de betreffende aansluiting uit het
      aansluitingenregister is verwijderd, uiterlijk één werkdag nadien overeenkomstig [paragraaf 3.3][ref1] een
      inhuizingsmelding in ter correctie van de onterechte inhuizing bedoeld in [3.14.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.3.5
