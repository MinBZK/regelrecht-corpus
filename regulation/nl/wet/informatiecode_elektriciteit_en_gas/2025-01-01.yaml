        paragraaf: '6.4'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref6
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.5.1
    text: |-
      De netbeheerder beschouwt de nieuwe meetgegevens bedoeld in [6.4.3.6][ref1] en [6.4.4.10][ref2] als definitieve
      meetgegevens en verwerkt deze, na toepassing van de calorische correctie, indien mogelijk in de reconciliatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.5.2
    text: |-
      De netbeheerder verzendt, in geval van [6.1.1.3][ref1] of [6.4.2.11][ref2], de calorisch gecorrigeerde nieuwe
      meetgegevens [m3(n;35,17)], op basis van [paragraaf 6.5.2][ref3], aan de leverancier(s) met dien verstande dat dit
      zo spoedig mogelijk doch uiterlijk vijf werkdagen na ontvangst van de nieuwe meetgegevens geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.4.5.3
    text: |-
      De netbeheerder verzendt, ingeval van een telemetriegrootverbruik aansluiting, de calorisch gecorrigeerde
      nieuwe meetgegevens [m3(n;35,17)], op basis van [artikel 2.6.1 Allocatiecode gas][ref1], aan de leverancier(s)
      en programmaverantwoordelijk(n). In afwijking van [paragraaf 9.1][ref2] vindt de informatie-uitwisseling na de
      tiende werkdag van de vierde maand na de maand waarop de nieuwe meetgegevens betrekking hebben niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 6.5.1.1
    text: |-
      De regionale netbeheerder maakt bij het vaststellen van de (meet)gegevens die volgens deze paragraaf worden
      doorgegeven, gebruik van meetgegevens geregistreerd door meetinrichtingen op aansluitingen, die hij op grond
      van [paragraaf 6.4][ref1] van deze van de desbetreffende meetverantwoordelijken ontvangt en van de meetgegevens
      geregistreerd door de meetinrichtingen op de aansluitingen van zijn net met andere netten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.5.1.2
    text: |-
      De regionale netbeheerder bewaakt de ontvangst van meetgegevens van aangeslotenen, die hij op grond van
      [paragraaf 6.4][ref1] van de desbetreffende meetverantwoordelijken moet ontvangen. Bij geconstateerde
      tekortkomingen informeert de regionale netbeheerder de meetverantwoordelijke en stelt de meetverantwoordelijke
      zonodig in gebreke. Indien de meetverantwoordelijke de geconstateerde tekortkomingen niet alsnog opheft, meldt de
      regionale netbeheerder dit aan de aangeslotene en aan de netbeheerder van het landelijk hoogspanningsnet. Indien
      dit noodzakelijk is voor de voortgang van de in de [Allocatiecode gas][ref2] beschreven processen, worden de
      desbetreffende meetgegevens overeenkomstig [6.5.1.3][ref3] vastgesteld en geeft de regionale netbeheerder daarbij
      aan dat er sprake is van overeenkomstig 6.5.1.3 vastgestelde meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037931
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037931
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.5.1.3
    text: |-
      De regionale netbeheerder treft, wanneer hij in het geval, bedoeld in [6.5.1.2][ref1], niet in staat
      is definitieve meetgegevens aan de beheerder van het landelijk gastransportnet te verstrekken, met de
      desbetreffende meetverantwoordelijke en de programmaverantwoordelijke die het aangaat een regeling omtrent de
      te gebruiken meetgegevens. Deze meetgegevens worden geacht definitief te zijn en worden aan de desbetreffende
      programmaverantwoordelijke en aan de beheerder van het landelijk gastransportnet verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.5.1.4
    text: |-
      De regionale netbeheerder bepaalt de hoeveelheid energie uit het aantal normaal kubieke meters [m3 (n)] volume)
      dat hij op grond van [paragraaf 6.4][ref1] van de desbetreffende meetverantwoordelijken ontvangt en de calorische
      bovenwaarde van het gas die:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.5.1.4.a
    text: door de beheerder van het landelijk gastransportnet aan de regionale netbeheerder wordt aangeleverd, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.4
  - number: 6.5.1.4.b
    text: |-
      door de regionale netbeheerder overeenkomstig het gestelde in [hoofdstuk 5 van de Meetcode gas LNB][ref1] zelf
      wordt bepaald, of


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        hoofdstuk: '5'
  - number: 6.5.1.4.c
    text: |-
      door de meetverantwoordelijke in geval van een invoeder met een aansluiting met een capaciteit groter dan 40 m3(n)/
      uur overeenkomstig artikel 6.4.2.21 aan de netbeheerder is aangeleverd. Voor elk ontbrekend uur en voor elk uur
      waarbij de door de meetverantwoordelijke aangeleverde calorische waarde groter is dan 36 MJ/m3(n) hanteert de
      netbeheerder 34,11 MJ/m3(n) als waarde voor de calorische bovenwaarde, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.4
  - number: 6.5.1.4.d
    text: |-
      de beheerder van een gesloten distributienet ontvangt van de beheerder van het regionale net waar zijn gesloten
      distributienet op is aangesloten, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.4
  - number: 6.5.1.4.e
    text: |-
      die de regionale netbeheerder dan wel de beheerder van een gesloten distributienet op grond van [artikel B5.6.13
      van de Allocatiecode gas](onbekend) heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.1.4
  - number: 6.5.2.1
    text: |-
      De regionale netbeheerder geeft voor een profielgrootverbruikaansluiting ten minste eenmaal per maand aan de
      leverancier de laatste tellerstand(en) alsmede het in de tussenliggende periode op de aansluiting uitgewisselde
      hoeveelheid gas, uitgedrukt in kubieke meter Groningen gas [m3(n;35,17)] door. Deze overdracht van gegevens vindt
      plaats uiterlijk op de twintigste werkdag van de maand volgend op de maand waarop de meetgegevens betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.2.1
  - number: 6.5.2.2
    text: |-
      De regionale netbeheerder geeft per telemetriegrootverbruikaansluiting maandelijks de uitgewisselde hoeveelheid gas
      per meetperiode uitgedrukt in MJ door aan de leverancier(s). Deze overdracht van gegevens vindt plaats uiterlijk op
      de zestiende werkdag van de maand na de maand waarin de desbetreffende gasdag valt.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.2.2
  - number: 6.5.2.3
    text: |-
      De regionale netbeheerder houdt de gegevens als bedoeld in [6.5.2.1][ref1] en [6.5.2.2][ref2], alsmede de gegevens
      die hij ontvangt op grond van [6.4.2][ref3] gedurende een termijn van ten minste drie jaar beschikbaar. De
      regionale netbeheerder verstrekt de aangeslotene of diens gemachtigde op verzoek de gegevens van de desbetreffende
      aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.6.1
    text: |-
      De netbeheerder berekent een standaardjaarafname en standaardjaarinvoeding voor de grootverbruikaansluitingen
      elektriciteit binnen zijn netgebied volgens de methode in [Bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 6.6.1a
    text: |-
      De netbeheerder berekent een standaardjaarverbruik voor de profielgrootverbruikaansluitingen gas binnen zijn
      netgebied volgens de methode in [Bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.6.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 6.6.2
    text: |-
      De netbeheerder muteert het aansluitingenregister met de nieuw bepaalde standaardjaarafname elektriciteit, de
      standaardjaarinvoeding elektriciteit of het standaardjaarverbruik gas uiterlijk vijf werkdagen na de ontvangst van
      de meetgegevens van de meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.6.2
  - number: 6.6.3
    text: |-
      De marktpartijen worden overeenkomstig [2.2][ref1] geïnformeerd over wijzigingen in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 6.7.1
    text: |-
      Leveranciers en programmaverantwoordelijken kunnen historische meetgegevens opvragen bij de netbeheerder indien zij
      beschikken over een daartoe strekkende machtiging van de desbetreffende aangeslotene. In deze opvraag historische
      meetgegevens zijn, indien van toepassing, opgenomen:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.c
    text: de bedrijfs-EAN-code van de opvragende leverancier, programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.d
    text: 'de procesidentificatie, te weten: “opvraag historische meetgegevens”;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.e
    text: het type aanvraag, zijnde ‘verzoek voor historische meetgegevens’;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.f
    text: de startdatum van de periode, waarover meetgegevens worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.g
    text: de einddatum van de periode, waarover meetgegevens worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.1.h
    text: |-
      indien de opvragende leverancier, programmaverantwoordelijke dit wenst op te geven: het referentienummer van de
      opvragende leverancier, programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.1
  - number: 6.7.2
    text: 'Naar aanleiding van de ontvangen opvraag historische meetgegevens controleert de netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.2
  - number: 6.7.2.a
    text: de opvraag historische meetgegevens volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.2
  - number: 6.7.2.b
    text: de EAN-code van de aansluiting voorkomt in zijn aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.2
  - number: 6.7.2.c
    text: |-
      de opvragende leverancier geregistreerd staat in het leveranciersregister, dan wel de opvragende
      programmaverantwoordelijke een volledige erkenning heeft volgens het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.2
  - number: 6.7.2.d
    text: |-
      voor de in de opvraag aangegeven periode historische meetgegevens voor de desbetreffende aansluiting beschikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.2
  - number: 6.7.3
    text: |-
      De netbeheerder bericht dat de opvraag historische meetgegevens niet wordt uitgevoerd uiterlijk vijf werkdagen
      na ontvangst van de opvraag historische meetgegevens aan de opvragende leverancier of programmaverantwoordelijke,
      indien één of meer van de controles, bedoeld in [6.7.2][ref1], een negatief resultaat opleveren, en vermeldt
      daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.7'
  - number: 6.7.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.c
    text: de bedrijfs-EAN-code van de opvragende leverancier, programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.d
    text: de procesidentificatie, zijnde ‘opvraag historische meetgegevens’;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.e
    text: 'de reden van het niet uitvoeren van de opvraag historische meetgegevens:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.e.1
    text: De opvraag historische meetgegevens is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.e.2
    text: De EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.e.3
    text: |-
      de opvragende leverancier komt niet voor in het leveranciersregister, dan wel de opvragende
      programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.e.4
    text: Geen historische meetgegevens beschikbaar;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.3.f
    text: 'indien aangeleverd in de opvraag: het referentienummer van de opvragende leverancier, programmaverantwoordelijke.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.3
  - number: 6.7.4
    text: |-
      De netbeheerder verstuurt de opgevraagde historische meetgegevens zo snel mogelijk doch uiterlijk vijf werkdagen na
      ontvangst van de opvraag historische meetgegevens aan de opvragende leverancier of programmaverantwoordelijke als
      alle controles, bedoeld in [6.7.2][ref1], een positief resultaat opleveren en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.4
    references:
