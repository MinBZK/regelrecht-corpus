  - number: 3.14.1.8
    text: |-
      In afwijking van [5.1.2.2][ref1] wordt de vastgestelde meterstand, behorende bij de mutatiedatum van de
      onterechte switch van leverancier, door de leverancier vastgesteld voor de mutatiedatum van de switchmelding
      of uithuizingsmelding die hij ter correctie heeft ingediend als bedoeld in [3.14.1.4][ref2] respectievelijk
      [3.14.1.5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
