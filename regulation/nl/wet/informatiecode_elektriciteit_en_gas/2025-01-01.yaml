        paragraaf: 2.2b
  - number: 10.2.1
    text: |-
      Netbeheerders stellen een gedragscode op ten aanzien van gebruik, vastleggen, uitwisselen en bewaren van gegevens
      die zijn verkregen uit een meetinrichting bedoeld in [artikel 95la van de Elektriciteitswet van 1998][ref1] of
      [42a van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.2.1
    references:
