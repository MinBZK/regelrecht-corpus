      leverancier die verantwoordelijk is voor de periode van de levering na de onterechte uitvoering van de procedure
      als bedoeld in [paragraaf 4.1 tot en met paragraaf 4.4][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.2
