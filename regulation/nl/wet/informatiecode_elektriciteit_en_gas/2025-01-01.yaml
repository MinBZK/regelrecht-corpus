  - number: 2.6.3
    text: |-
      Het is een leverancier uitsluitend toegestaan de in [2.6.2][ref1] bedoelde gegevens op te vragen als:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
