    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2c.2
  - number: 2.2c.2.c
    text: de aansluiting een kleinverbruikaansluiting is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2c.2
  - number: 2.2c.2.d
