    text: |-
      het verbruik, waarop de correctie betrekking heeft, reeds op grond van [paragraaf 10.5 Netcode elektriciteit][ref1]
      is gereconcilieerd en de correctie zelf niet op grond hiervan verrekend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Paragraaf10.5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.3
