  - number: 4.2.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.d
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e
    text: 'de reden van het niet uitvoeren van de uithuizing:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.1
    text: de uithuizingsmelding is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.3
    text: de uithuizingsdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.4
    text: de uithuizingsmelding conflicteert met een eerdere bevestigde maar nog niet geëffectueerde uithuizingsmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.5
    text: |-
      de uithuizingsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde leverancierswitchmelding
      of inhuizingsmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.6
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.e.7
    text: de aansluiting is geblokkeerd voor automatische mutaties;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.3.f
    text: 'indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
  - number: 4.2.2.4
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de
      actuele leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.4.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.4.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.4.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.4.e
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.4.f
    text: 'indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.4
  - number: 4.2.2.5
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de
      actuele programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.5
  - number: 4.2.2.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.5
  - number: 4.2.2.5.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.5
  - number: 4.2.2.5.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.5
  - number: 4.2.2.5.d
    text: de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.5
  - number: 4.2.2.5.e
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.5
  - number: 4.2.2.6
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de
      meetverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.6.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.6.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.6.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.6.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.6.e
    text: |-
      indien de uithuizing het gevolg is van een inhuizing, bedoeld in [4.3][ref1], bevat de melding tevens de bedrijfs-
      EAN-code van de nieuwe leverancier op de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.2.2.6.f
    text: 'de procesidentificatie die van toepassing is, te weten: uithuizing;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.6.g
    text: 'indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.6
  - number: 4.2.2.7
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering of PV-switch, indien de uithuizing, bedoeld in [4.2.1.1][ref1], het desbetreffende
      mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de actuele leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.2.3.2
    text: |-
      De netbeheerder informeert de meetverantwoordelijke overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties,
      bedoeld in [4.2.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.4.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en verbruik bij het uithuizingsproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.3.1.1
    text: |-
      De aangeslotene machtigt zijn actuele dan wel de nieuwe leverancier, in het inhuizingsproces hierna te noemen
      de nieuwe leverancier, om namens hem de inhuizing af te wikkelen. Op grond van deze machtiging stuurt de
      nieuwe leverancier tenminste vijf werkdagen voor de inhuizingsdatum en ten hoogste twintig werkdagen voor de
      inhuizingsdatum namens deze aangeslotene een inhuizingsmelding naar de netbeheerder. De inhuizingsmelding bevat de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.b
    text: de naam van de nieuwe aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.c
    text: de adresgegevens van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.d
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.e
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.f
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.g
    text: de bedrijfs-EAN-code van de programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.i
    text: 'indien de nieuwe leverancier dat wenst op te geven: het referentienummer van de nieuwe leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.j
    text: 'indien de leverancier hierover beschikt: de geboortedatum van de aangeslotene;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.1.k
    text: 'indien de leverancier hierover beschikt: het KvK-nummer van de aangeslotene.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.1
  - number: 4.3.1.2
    text: |-
      In afwijking van [4.3.1.1][ref1] stuurt de nieuwe leverancier de inhuizingsmelding tenminste op de inhuizingsdatum
      en ten hoogste twintig werkdagen voor de inhuizingsdatum naar de netbeheerder indien het een inhuizingsmelding
      betreft voor een aansluiting, waarop op het moment van inhuizen geen leverancier is geregistreerd in het
      aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.1
    text: 'Naar aanleiding van de inhuizingsmelding controleert de netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.a
    text: de inhuizingsmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.c
    text: |-
      de inhuizingsdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig werkdagen
      in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.d
    text: |-
      of de inhuizingdatum ten opzichte van de datum van indienen tenminste op dezelfde datum en ten hoogste twintig
      werkdagen in de toekomst ligt, indien op de desbetreffende aansluiting op de inhuizingsdatum geen leverancier is
      geregistreerd in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.e
    text: de nieuwe leverancier is opgenomen in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.f
    text: |-
      de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.g
    text: |-
      de mutatiedatum van de melding niet ligt vóór de mutatiedatum van een eerder bevestigde, leverancierswitchmelding
      of inhuizingsmelding voor dezelfde EAN-code;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.1.h
    text: de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.1
  - number: 4.3.2.2
    text: |-
      Als alle controles uit [4.3.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.3.2.4][ref2]. Als dat niet het geval is, wordt de inhuizing niet uitgevoerd en wordt de procedure na
      [4.3.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de inhuizing naar aanleiding van [4.3.2.2][ref1] uiterlijk de
      werkdag na ontvangst van de inhuizingsmelding aan de leverancier die de inhuizingsmelding heeft ingediend en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.c
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.d
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e
    text: 'de reden van het niet uitvoeren van de inhuizing:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.1
    text: de inhuizingsmelding is onvolledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.3
    text: de inhuizingsdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.4
    text: de nieuwe leverancier komt niet voor in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.5
    text: de programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.6
    text: |-
      de mutatiedatum van de inhuizingsmelding ligt vóór de mutatiedatum van een eerder bevestigde inhuizingsmelding
      of leverancierswitchmelding;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.e.7
    text: de aansluiting is geblokkeerd voor automatische mutaties;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.3.f
    text: 'indien aangeleverd in de inhuizingsmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.3
  - number: 4.3.2.4
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de inhuizingsmelding aan de
      nieuwe leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.4
  - number: 4.3.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.4
  - number: 4.3.2.4.b
    text: de inhuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.4
  - number: 4.3.2.4.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.4
  - number: 4.3.2.4.d
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.4
  - number: 4.3.2.4.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.4
