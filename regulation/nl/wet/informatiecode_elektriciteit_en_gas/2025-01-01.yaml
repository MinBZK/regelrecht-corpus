  - number: 1.1.14
    text: |-
      Indien aan een aansluiting secundaire allocatiepunten zijn toegekend, worden de op een aansluiting van
      toepassing zijnde processen uit het [Besluit leveringszekerheid Elektriciteitswet 1998][ref1] en uit de
      [Regeling afsluitbeleid voor kleinverbruikers van elektriciteit en gas][ref2] toegepast per allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0019567
      [ref2]: https://wetten.overheid.nl/BWBR0030164
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.14
    references:
      - id: ref1
        bwb_id: BWBR0019567
      - id: ref2
        bwb_id: BWBR0030164
  - number: 1.1.15
    text: |-
      Daar waar in deze code sprake is van een verplichting of handeling tussen een leverancier en een aangeslotene,
      wordt in geval van een secundair allocatiepunt met aangeslotene bedoeld degene die de beschikking heeft over dat
      secundaire allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.15
  - number: 1.1.16
    text: |-
      Daar waar in deze code sprake is van het programmaverantwoordelijkenregister, wordt in geval van elektriciteit het
      BRP-register bedoeld.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.16
  - number: 2.1.1
    text: |-
      De netbeheerder identificeert de aansluitingen en geplande aansluitingen op het eigen net door aan elke aansluiting
      of geplande aansluiting één unieke EAN-code toe te kennen. De netbeheerder deelt de aangeslotene desgevraagd mee
      welke EAN-code aan diens aansluiting is toegekend.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.1
  - number: 2.1.1a
    text: Het primaire allocatiepunt van een aansluiting wordt geïdentificeerd met dezelfde EAN-code als de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.1a
  - number: 2.1.1b
    text: De netbeheerder kent tevens een EAN-code toe aan elk secundair allocatiepunt dat aan een aansluiting is toegekend.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.1b
  - number: 2.1.2
    text: |-
      De netbeheerders hebben gezamenlijk een centraal register, hierna te noemen het centraal aansluitingenregister,
      waarin elke netbeheerder zijn register, bedoeld in [2.1.3][ref1], beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.3
    text: |-
      De netbeheerder beheert voor het eigen net een register, hierna te noemen het aansluitingenregister, waarin per
      aansluiting of geplande aansluiting geïdentificeerd door de EAN-code van de aansluiting, bedoeld in [2.1.1][ref1],
      voor zover beschikbaar voor geplande aansluitingen, de volgende gegevens zijn vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.3.a
    text: de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.b
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.c
    text: de EAN-code van het netgebied waarin de aansluiting zich bevindt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.d
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.e
    text: de adresgegevens behorend bij het overdrachtspunt van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.f
    text: de identificatie van de actuele leverancier behorende bij de desbetreffende aansluiting (bedrijfs-EAN-code);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.g
    text: de identificatie van de actuele programmaverantwoordelijke op de desbetreffende aansluiting (bedrijfs-EAN-code);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.h
    text: een kenmerk dat de fysieke status van de aansluiting weergeeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.i
    text: een kenmerk dat de administratieve status van de aansluiting weergeeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.j
    text: een kenmerk dat de leveringsrichting op de aansluiting weergeeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.3
  - number: 2.1.3.l
    text: |-
