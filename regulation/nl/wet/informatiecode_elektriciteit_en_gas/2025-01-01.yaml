  - number: 10.1.5.1
    text: |-
      Een onderneming, als bedoeld in [artikel 54 van de Elektriciteitswet 1998][ref1] en
      [artikel 22 van de Gaswet][ref2], die de gegevens genoemd in deze code voor een ander doel dan genoemd in
      [paragraaf 10.1][ref3] vastlegt, uitwisselt, gebruikt of bewaart legt hiervoor het doel en de bewaartermijnen vast
      in een gedragscode of vraagt hiervoor ondubbelzinnige toestemming van de betrokkene als bedoeld in de Algemene
      verordening gegevensbescherming, tenzij in [10.1.5][ref4] uitdrukkelijk anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk10
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.5.1
