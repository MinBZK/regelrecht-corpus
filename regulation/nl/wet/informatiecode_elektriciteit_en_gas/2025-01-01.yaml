    text: |-
      De in [2.6.3, onderdelen c en d][ref1], bedoelde leverancier kan voorafgaand aan zijn periode van levering de
      volgende gegevens opvragen uit het toegankelijk meetregister:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
