  - number: 3.14.1.7
    text: |-
      Nadat de netbeheerder de in [3.14.1.6][ref1] bedoelde melding heeft ontvangen en de in [3.14.1.4][ref2] bedoelde
      switchmelding heeft verwerkt, wijzigt de netbeheerder het in [2.1.4, onderdeel b][ref3], bedoelde kenmerk
      onmiddellijk met als gevolg dat de meetinrichting niet op afstand uitgelezen mag worden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
