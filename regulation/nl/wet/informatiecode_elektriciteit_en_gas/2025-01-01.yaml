  - number: 6.9.1.1
    text: |-
      Indien de in [4.16.5][ref1] bedoelde correctie leidt tot een toewijzing van verbruik dat niet behoort
      tot de betreffende programmaverantwoordelijke, verrekenen de leverancier en programmaverantwoordelijke
      of de betrokken programmaverantwoordelijken de toegewezen verbruiken tot maximaal het verbruik
      voor een periode als bedoeld in [artikel 28 van boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 307, eerste lid, van boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel307
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '307'
  - number: 6.9.1.2
    text: |-
      Indien het te verrekenen verbruik boven 1000 kWh of 500 m3 uitkomt en het te verrekenen verbruik niet
      meer beslaat dan een periode als bedoeld in [artikel 28 van boek 7 van het Burgerlijk Wetboek][ref1] of
      [artikel 307, eerste lid, van boek 3 van het Burgerlijk Wetboek][ref2], verrekenen de betrokken leveranciers of de
      leverancier en netbeheerder de toegewezen verbruiken ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel307
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.1.2
    references:
