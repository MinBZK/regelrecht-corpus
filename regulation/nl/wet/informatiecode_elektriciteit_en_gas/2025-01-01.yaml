  - number: 10.1.4b.2
    text: De leverancier bewaart de door hem vastgelegde toestemmingsgegevens één jaar.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4b.2
  - number: 10.1.4b.3
    text: |-
      In afwijking van [10.1.4b.2][ref1] bewaart de leverancier de vastgelegde toestemmingsgegevens zo lang als
      noodzakelijk is ten behoeve van aanhangige geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4b.3
