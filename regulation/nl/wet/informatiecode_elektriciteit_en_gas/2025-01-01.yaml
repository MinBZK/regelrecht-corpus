        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.7.a
    text: |-
      er is op grond van [paragraaf 6.9.1][ref1] geen verplichting tot verrekening;


