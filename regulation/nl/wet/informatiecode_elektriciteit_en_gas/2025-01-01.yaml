        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.2.1
    text: |-
      De verrekeningen als bedoeld in [paragraaf 5.6.1][ref1] vinden plaats overeenkomstig het proces dat in deze
      paragraaf is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.2.1
