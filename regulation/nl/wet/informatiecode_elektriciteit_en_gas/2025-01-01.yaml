      programmaverantwoordelijke een volledige erkenning heeft volgens het programmaverantwoordelijkenregister
      dan wel de opvragende meetverantwoordelijke beschikt over een erkenning als bedoeld in
      [bijlage 4.2 van de Meetcode elektriciteit][ref1] of [bijlage 3.2 van de Meetcode gas RNB](onbekend).


