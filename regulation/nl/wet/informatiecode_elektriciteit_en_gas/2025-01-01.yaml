    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e
    text: 'de reden van het niet uitvoeren van de eindelevering:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e.1
    text: de eindeleveringsmelding is onvolledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e.3
    text: de eindeleveringsdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e.4
    text: |-
      de eindeleveringsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde switchmelding,
      inhuizingsmelding, uithuizingsmelding of eindeleveringsmelding met dezelfde of een eerdere datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e.5
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.e.6
    text: de aansluiting is geblokkeerd voor automatische mutaties;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.3.f
    text: 'indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.3
  - number: 4.4.3.4
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de
      actuele leverancier en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.4.b
    text: de eindeleveringsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.4.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.4.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.4.e
    text: 'de procesidentificatie die van toepassing is, te weten: eindelevering;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.4.f
    text: 'indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.4
  - number: 4.4.3.5
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de
      actuele programmaverantwoordelijke en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.4.3.5
