  - number: 5.6.1.8
    text: |-
      Onverminderd [5.6.1.1 tot en met 5.6.1.7][ref1] kunnen leveranciers en netbeheerders op andere gronden het
      verrekenen van verbruik of nettarieven overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.8
