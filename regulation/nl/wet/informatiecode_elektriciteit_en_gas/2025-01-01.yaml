    text: |-
      De gegevens, bedoeld in [2.7.2][ref1] en [2.7.3][ref2], worden bewaard voor een termijn van minstens zeven jaar,
      ingaande vanaf de datum van beëindiging van de geldigheid van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.7
    references:
