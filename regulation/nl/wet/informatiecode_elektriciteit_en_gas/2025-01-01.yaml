  - number: 2.15.4
    text: |-
      De leverancier verstrekt de uit de toestemmingenadministratie opgevraagde gegevens binnen 72 uur aan de regionale
      netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.4
  - number: 3.1.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de nieuwe leverancier één
      werkdag voor de switchdatum namens deze aangeslotene een switchmelding naar de regionale netbeheerder. De
      switchmelding bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.c
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.d
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.e
    text: de bedrijfs-EAN-code van de programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.f
    text: het correspondentieadres van de aangeslotene indien dit afwijkt van het adres behorende bij de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.g
    text: 'indien de leverancier dat wenst op te geven: de naam van de aangeslotene;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.h
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.i
    text: |-
      indien de leverancier de naam van de aangeslotene overeenkomstig 3.1.1.1, onderdeel g, heeft opgegeven, en hierover
      beschikt: de geboortedatum van de aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.1.j
    text: |-
      indien de leverancier de naam van de aangeslotene overeenkomstig 3.1.1.1, onderdeel g, heeft opgegeven, en hierover
      beschikt: het KvK-nummer van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.1
  - number: 3.1.1.2
    text: |-
      In afwijking van [3.1.1.1][ref1] stuurt de nieuwe leverancier de switchmelding, bedoeld in 3.1.1.1, tenminste één
      werkdag en ten hoogste twintig werkdagen voor de switchdatum naar de regionale netbeheerder, indien de aansluiting
      een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend bij een afnemer bedoeld
      in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of [artikel 52c][ref4] of
      [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.1.2.1
    text: 'Naar aanleiding van de switchmelding controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.1.a
    text: de switchmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.1.c
    text: |-
      de switchdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig werkdagen in de
      toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.1.d
    text: de nieuwe leverancier is opgenomen in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.1.e
    text: |-
      de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.1.f
    text: |-
      de mutatiedatum niet ligt vóór de mutatiedatum van een eerder bevestigde leverancierswitchmelding of
      inhuizingsmelding voor dezelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.1
  - number: 3.1.2.2
    text: |-
      In aanvulling op [3.1.2.1][ref1] controleert de regionale netbeheerder of de naam van de aangeslotene, bedoeld in
      [3.1.1.1 onderdeel g][ref2], is ingevuld in de switchmelding, indien op de aansluiting in het aansluitingenregister
      geen leverancier is geregistreerd op de switchdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.3
    text: |-
      Als alle controles uit [3.1.2.1][ref1] en [3.1.2.2][ref2] een positief resultaat geven, wordt de procedure
      vervolgd vanaf [3.1.2.5][ref3]. Als dat niet het geval is, wordt de switch niet uitgevoerd en wordt de procedure na
      [3.1.2.4][ref4] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.3
    references:
