  - number: 4.3.2.9
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering of PV-switch indien de inhuizing, bedoeld in [4.3.1.1][ref1], het desbetreffende
      mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.9
