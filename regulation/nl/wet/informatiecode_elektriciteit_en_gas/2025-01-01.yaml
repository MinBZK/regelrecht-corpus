      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 2.2b.1
    text: |-
      Een leverancier die beschikt over een toestemming van de afnemer kan, ten behoeve van het doen van een aanbod voor
      een leveringsovereenkomst, bij de netbeheerder gegevens van de desbetreffende kleinverbruikaansluiting opvragen
      onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.1
  - number: 2.2b.1.a
    text: de bedrijfs-EAN-code van de opvragende leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.1
  - number: 2.2b.1.b
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.1
  - number: 2.2b.1.c
    text: 'indien de opvragende leverancier dat wenst op te geven: een referentienummer van de opvragende leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.1
  - number: 2.2b.1.d
    text: de toestemmingssleutel;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.1
  - number: 2.2b.1.e
    text: de klantsleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.1
  - number: 2.2b.2
    text: |-
      Naar aanleiding van een opvraag zoals bedoeld in [2.2b.1][ref1] controleert de netbeheerder of:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2b.2
