  - number: 2.1.8
    text: |-
      De netbeheerder effectueert wijzigingen in het aansluitingenregister op de mutatiedatum op tijdstip 00:00 uur (in
      geval van elektriciteit) en op tijdstip 06:00 uur (in geval van gas). Een leverancier, programmaverantwoordelijke
      en meetverantwoordelijke die voor een bepaalde dag is vermeld in het aansluitingenregister voldoet vanaf deze
      volledige dag aan de voorwaarden die aan de betreffende marktpartij worden gesteld.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.8
  - number: 2.1.9
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet en de netbeheerder van het landelijk gastransportnet hebben
      het recht de voor hen relevante onderdelen van de door de andere netbeheerders beheerde aansluitingenregisters
      in te zien. Zij kunnen de andere netbeheerders verzoeken hen gegevens met betrekking tot een individuele
      programmaverantwoordelijke met een volledige erkenning te verstrekken.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.9
  - number: 2.1.10
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet verleent de andere netbeheerders desgevraagd inzage in het
      meetverantwoordelijkenregister, bedoeld in [B4.2.2 van de Meetcode elektriciteit][ref1] en [B3.2.2 van de Meetcode
      gas RNB](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 2.1.11
