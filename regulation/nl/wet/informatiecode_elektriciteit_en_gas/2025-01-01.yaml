        paragraaf: '4.1'
  - number: 4.1.2.11
    text: |-
      De netbeheerder beëindigt de procedure van een, voor dezelfde mutatiedatum reeds bevestigde switch van leverancier
      of inhuizing, indien de leverancierswitch, bedoeld in [4.1.1.1][ref1], de reeds bevestigde switch van leverancier
      annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.11
