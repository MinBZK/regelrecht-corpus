  - number: 3.14.4.1
    text: |-
      Onder een onterechte eindelevering wordt verstaan de onbedoelde uitvoering van de procedure, als bedoeld in
      [paragraaf 3.4][ref1], op een aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.4.1
