        bwb_id: BWBR0037934
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.2.4
    text: |-
      Netbeheerders leggen jaarlijks verantwoording af door middel van een uniforme toelichting op de jaarrekening,
      bedoeld in [B6.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 10.2.5
    text: |-
      In aanvulling op [10.2.4][ref1] publiceren de netbeheerders de verantwoording, bedoeld in [10.2.2][ref2], op hun
      publieke websites.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.2.5
