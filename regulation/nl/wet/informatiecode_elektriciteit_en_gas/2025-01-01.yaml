        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.4
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de switch naar aanleiding van [3.1.2.3][ref1] uiterlijk
      de werkdag na ontvangst van de switchmelding aan de leverancier die de switchmelding heeft ingediend en vermeldt
      daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.1.2.4
