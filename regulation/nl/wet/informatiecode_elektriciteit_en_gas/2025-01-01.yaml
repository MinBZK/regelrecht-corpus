        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.10.b.13°
    text: |-
      het bedrag van de correctie (excl. BTW), bepaald door het product van het te verrekenen volume en het te hanteren
      tarief.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.10
  - number: 6.9.2.11
    text: |-
      Indien de verbruiksperiode van een gecorrigeerd verbruik langer is dan één kalendermaand, dan wordt het in
      [artikel 6.9.2.10 onder q][ref1] genoemde volume naar kalendermaanden verdeeld op de wijze zoals beschreven in
      [Allocatiecode gas Bijlage 6, art. B6.2.3.2](onbekend) en [Netcode elektriciteit Bijlage 3 art.1.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037940
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
      - id: ref2
        bwb_id: BWBR0037940
  - number: 6.9.2.12
    text: |-
      Indien de leverancier, op basis van het in de voorgaande maand ontvangen meetdatabericht veronderstelt een
      verzamelverrekenverzoek op grond van [6.9.1.3][ref1] te moeten ontvangen, maar deze niet heeft ontvangen, meldt de
      leverancier dit bij de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.12
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.13
    text: |-
      De leverancier accepteert het verzamelverrekenverzoek, als bedoeld in [6.9.2.10][ref1], tenzij hij uiterlijk binnen
      één maand na ontvangst het verzoek gemotiveerd afwijst met vermelding van één of meer van de volgende redenen en
      met onderbouwing waarom de leverancier tot deze afwijzing is gekomen: één of meerdere verrekenverzoek(en);


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.13.a
    text: ontbreekt dan wel ontbreken;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.b
    text: is dan wel zijn onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.c
    text: komt dan wel komen niet overeen met het meetcorrectierapport;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.d
    text: gebruikt dan wel gebruiken een onjuist tarief;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.e
    text: hanteert dan wel hanteren een onjuist te verrekenen volume;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.f
    text: betreft dan wel betreffen een periode, waarover de leverancier geen leverancier was op de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.g
    text: overschrijdt dan wel overschrijden de wettelijke verjaringstermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.h
    text: heeft dan wel hebben geen verplichting tot verrekening; of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.13.i
    text: is dan wel zijn achterhaald, omdat nadien een nieuwe correctie is ontvangen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.13
  - number: 6.9.2.14
    text: |-
      De netbeheerder verwerkt de afwijzing en verstuurt een nieuw verzamelverrekenverzoek indien relevant conform
      [6.9.2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.14
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.15
    text: |-
      De leverancier, programmaverantwoordelijke of netbeheerder die recht heeft op vergoeding van de kosten, neemt
      maandelijks de geaccepteerde verrekeningen, als bedoeld in [6.9.2.4][ref1], van de voorgaande maand op in één
      verrekenfactuur tenzij anders overeengekomen. De verrekenfactuur bevat per verrekening de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.15
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.15.a
    text: EAN-code van de desbetreffende aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.15
  - number: 6.9.2.15.b
    text: het overeengekomen of vastgestelde te verrekenen verbruik;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.15
  - number: 6.9.2.15.c
    text: het overeengekomen of vastgestelde te hanteren tarief;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.15
  - number: 6.9.2.15.d
    text: het totaalbedrag van de verrekening.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.15
  - number: 6.9.2.16
    text: |-
      De leverancier of netbeheerder die op grond van het geaccepteerde verzamelverrekenverzoek, als bedoeld in
      [6.9.2,10][ref1], per saldo te vorderen heeft, verzendt naar de wederpartij een verrekenfactuur binnen 20
      werkdagen na accordering van het verzamelverrekenverzoek voor het saldo indien het totale bedrag van het
      verzamelverrekenverzoek groter is dan Euro 50. De verrekenfactuur bevat tenminste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.16
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.16.a
    text: referentie van het verzamelverrekenverzoek; of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.16
  - number: 6.9.2.16.b
    text: het totaalbedrag van het verzamelverrekenverzoek.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.16
  - number: 6.9.2.17
    text: |-
      De wederpartij accepteert de verrekenfactuur binnen een maand na ontvangst, tenzij hij de factuur binnen tien
      werkdagen gemotiveerd afwijst.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.17
  - number: 6.9.2.18
    text: |-
      De leverancier, programmaverantwoordelijke of netbeheerder accepteert de ontvangen afwijzing of stuurt zo
      spoedig mogelijk een correcte verrekenfactuur naar de wederpartij die hem voldoet of afwijst overeenkomstig
      [6.9.2.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.18
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: 6.9.2.19
    text: |-
      In afwijking van [paragraaf 9.1][ref1] vindt de op grond van [paragraaf 6.9.2][ref2] uit te wisselen informatie
      niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.19
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.9'
  - number: '7.1'
    text: |-
      De allocatie en reconciliatie elektriciteit wordt uitgevoerd overeenkomstig [hoofdstuk 10 van de Netcode
      elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      De allocatie en reconciliatie gas wordt uitgevoerd overeenkomstig de [Allocatiecode gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
  - number: 8.1.1
    text: |-
      De leverancier informeert de aangeslotene namens de regionale netbeheerder bij een voorgenomen inhuizing van een
      aangeslotene ongeacht of er bij inhuizing een leveringsovereenkomst tot stand komt over:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.1
  - number: 8.1.1.a
    text: dat er een aansluit- en transportovereenkomst met de regionale netbeheerder vereist is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.1
  - number: 8.1.1.b
    text: |-
      de op de aansluit- en transportovereenkomst van de regionale netbeheerder van toepassing zijnde algemene
      voorwaarden voor aansluiting en transport;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.1
  - number: 8.1.1.c
    text: dat aan de regionale netbeheerder tarieven verschuldigd zijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.1
  - number: 8.1.1.d
    text: |-
      indien van toepassing, dat er aan de aansluiting een of meer secundaire allocatiepunten zijn toegekend en dat de
      installatie die bij een secundair allocatiepunt hoort, niet mag worden gebruikt ten behoeve van bewoning van een
      ruimte.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.1
  - number: 8.1.2
    text: |-
      Uiterlijk 10 werkdagen na aanvang van de levering bij een inhuizing bevestigt en verstrekt de leverancier namens
      de regionale netbeheerder aan de aangeslotene de tot stand gekomen aansluit- en transportovereenkomst met de daarop
      van toepassing zijnde algemene voorwaarden en informeert hem over:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.2
  - number: 8.1.2.a
    text: de naam- en adresgegevens van de regionale netbeheerder behorende bij de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.2
  - number: 8.1.2.b
    text: het bij de aansluiting behorende nettarief;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.2
  - number: 8.1.2.c
    text: een omschrijving van de op de aansluiting aanwezige tariefcode.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.2
  - number: 8.1.2a
    text: |-
      Voorafgaand aan het aangaan van een leveringscontract ten behoeve van levering op een secundair allocatiepunt
      informeert de leverancier namens de netbeheerder de contractant dat de installatie die bij het secundair
      allocatiepunt hoort, niet mag worden gebruikt ten behoeve van bewoning van een ruimte.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.2a
  - number: 8.1.3
    text: |-
      De leverancier toont tot twee jaar na beëindiging van de leveringsovereenkomst op een gemotiveerd verzoek van de
      regionale netbeheerder op welke wijze aan de informatieverplichting, bedoeld in [8.1.1][ref1], [8.1.2][ref2] en
      [8.1.2a][ref3] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.1.4
    text: |-
      De regionale netbeheerder stuurt wijzigingen in zijn aansluit- en transportovereenkomst, de algemene voorwaarden
      voor de aansluiting en transport gas voor aangeslotenen of de algemene voorwaarden voor de aansluiting en transport
      elektriciteit voor aangeslotenen met een toelichting ten minste één maand vóór inwerkingtreding hiervan aan
      de leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 8.1.5
    text: |-
      De leverancier bevestigt de ontvangst van wijzigingen in de aansluit- en transportovereenkomst, de algemene
      voorwaarden voor de aansluiting en transport gas voor aangeslotenen of de algemene voorwaarden voor de aansluiting
      en transport elektriciteit voor aangeslotenen uiterlijk de werkdag na ontvangst van de wijziging aan de regionale
      netbeheerder. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 8.1.6.1
    text: |-
      De gezamenlijke regionale netbeheerders stellen per afnemerscategorie voor kleinverbruikers zoals genoemd in de
      Tarievencode elektriciteit en Tarievencode gas een vijfcijferige tariefcode vast.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.6
  - number: 8.1.6.2
    text: |-
      De gezamenlijke regionale netbeheerders stellen de onder 1 bedoelde tariefcodes online beschikbaar aan de
      leveranciers.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.6
  - number: 8.1.6.3
    text: |-
      De regionale netbeheerder stelt per afnemerscategorie voor kleinverbruikers zoals genoemd in de Tarievencode
      elektriciteit en Tarievencode gas een capaciteitstariefcode vast in de vorm van een EAN-code. De
      capaciteitstariefcode bestaat uit de landcode, zijn vijfcijferige bedrijfscode, de bij de afnemerscategorie horende
      tariefcode zoals bepaald in onderdeel a en het controlegetal.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.6
  - number: 8.1.6.4
    text: De regionale netbeheerder stelt de onder 3 bedoelde capaciteitstariefcodes online beschikbaar aan de leveranciers.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.6
  - number: 8.1.6.5
    text: |-
      De regionale netbeheerder bepaalt het nettarief per dag met vier decimalen achter de komma per afnemerscategorie
      voor kleinverbruikers zoals genoemd in de Tarievencode elektriciteit en Tarievencode gas.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.6
  - number: 8.1.6.6
    text: |-
      De regionale netbeheerder informeert leveranciers middels het elektronisch berichtenverkeer over het onder 5
      bedoelde tarief met de capaciteitstariefcode zoals bedoeld in onder 2.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.6
  - number: 8.1.7
    text: |-
      De regionale netbeheerder stuurt wijzigingen in zijn nettarieven ten minste één maand vóór inwerkingtreding aan
      de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.7
  - number: 8.1.8
    text: |-
      De leverancier stuurt uiterlijk de werkdag na ontvangst van de gewijzigde nettarieven een ontvangstbevestiging aan
      de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.8
  - number: 8.1.9
    text: |-
      De regionale netbeheerder informeert zijn klanten over de wijzigingen in de aansluit- en transportovereenkomst,
      de algemene voorwaarden voor de aansluiting en transport gas voor aangeslotenen, de algemene voorwaarden voor de
      aansluiting en transport elektriciteit voor aangeslotenen of nettarieven.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.1.9
  - number: 8.2.1
    text: |-
      De regionale netbeheerder stuurt voor elk van zijn fiscale entiteiten uiterlijk de derde werkdag
      van iedere maand een specificatie van de verplichting van de te factureren bedragen, bedoeld in
      [artikelen 53][ref1] en [95cb, zesde lid van de Elektriciteitswet 1998][ref2] en [artikelen 21][ref3] en
      [44b, zesde lid van de Gaswet][ref4], betreffende de voorafgaande maand aan elke bedrijfs-EAN-code van de
      leverancier. Deze specificatie van de verplichting bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel44b
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95cb
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 44b
  - number: 8.2.1.a
    text: de maand waarop de specificatie van de verplichting betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
  - number: 8.2.1.b
    text: |-
      de bedrijfs-EAN-code(s) van de fiscale entiteit van de regionale netbeheerder waarop de specificatie van de
      verplichting betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
  - number: 8.2.1.c
    text: de bedrijfs-EAN-code van de leverancier waarop de specificatie van de verplichting betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
  - number: 8.2.1.d
    text: |-
      het totale bedrag (exclusief BTW) dat de betreffende leverancier volgens het aansluitingenregister over de maand,
      bedoeld in [8.2.1 onderdeel a][ref1], geacht wordt te factureren en moet afdragen;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.1.e
    text: |-
      per aansluiting waarvoor de betreffende leverancier in de maand, bedoeld in [8.2.1 onderdeel a][ref1], in het
      aansluitingenregister staat per capaciteitstariefcode:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.1.e.1
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
  - number: 8.2.1.e.2
    text: de capaciteitstariefcode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
  - number: 8.2.1.e.3
    text: |-
      het aantal dagen dat de betreffende leverancier in de maand, bedoeld in [8.2.1 onderdeel a][ref1], op de
      betreffende aansluiting met de betreffende capaciteitstariefcode en met de fysieke status actief in het
      aansluitingenregister stond;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.1.e.4
    text: het bijbehorende nettarief per dag (exclusief BTW);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
  - number: 8.2.1.e.5
    text: |-
      het bijbehorende totaalbedrag voor de maand, bedoeld in [8.2.1 onderdeel a][ref1], (exclusief BTW).


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.2
  - number: 8.2.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.3
  - number: 8.2.4
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.4
  - number: 8.2.5
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.5
  - number: 8.2.6
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.6
  - number: 8.2.7
    text: |-
      De regionale netbeheerders en een representatief deel van de leveranciers stellen jaarlijks gezamenlijk een
      kalender op om te voldoen aan de termijn, bedoeld in [8.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.3.1
    text: |-
      De leverancier houdt voor de regionale netbeheerder een factuur- en BTW-administratie bij voor wat betreft het door
      hem gefactureerde nettarief.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.1
  - number: 8.3.2
    text: |-
      De leverancier verstrekt de factuur- en BTW-administratie, bedoeld in [8.3.1][ref1], onverwijld aan de regionale
      netbeheerder indien de Belastingdienst de regionale netbeheerder hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.3.3
    text: |-
      Ingeval de leverancier ten aanzien van de betreffende nettarieven een bijzonder BTW-tarief bij de aangeslotene in
      rekening heeft gebracht of zal brengen, kan de leverancier de netbeheerder verzoeken om de teveel afgedragen BTW
      te verrekenen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.3
  - number: 8.3.4
    text: |-
      Het verzoek als bedoeld in [8.3.3][ref1]. verzendt de leverancier uiterlijk in de maand februari, volgend op het
      kalenderjaar waarop het verzoek betrekking heeft, en bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.3.4.a
    text: de EAN-code van de betreffende aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.b
    text: |-
      de periode van het betreffende kalenderjaar waarin de leverancier op de aansluiting stond geregistreerd, en,
      overeenkomstig het besluit van de belastinginspecteur, een bijzonder BTW-tarief in rekening mocht of mag worden
      gebracht;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.c
    text: het belastingobject;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.d
    text: het aan de betrokken netbeheerder afgedragen bedrag exclusief BTW;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.e
    text: het aan de betrokken netbeheerder afgedragen BTW-bedrag
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.f
    text: het bijzondere BTW-tarief als bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.g
    text: het BTW-bedrag op grond van het besluit van de belastinginspecteur als bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.h
    text: het door de betrokken netbeheerder te verrekenen BTW-bedrag;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.4.i
    text: een kenmerk van het besluit van de belastinginspecteur als bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.4
  - number: 8.3.5
    text: |-
      Naar aanleiding van het in [8.3.3][ref1] bedoelde verzoek zal de netbeheerder het te verrekenen BTW-bedrag
      uiterlijk 28 maart van het desbetreffende kalenderjaar overboeken.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.3.6
    text: |-
      In afwijking van het bepaalde in [paragraaf 9.1][ref1] vindt de gegevensuitwisseling als bedoeld in [8.3.3][ref2]
      en [8.3.4][ref3] niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel8.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 9.1.1
    text: |-
      De netbeheerders en een representatief deel van de leveranciers, de programmaverantwoordelijken en de
      meetverantwoordelijken organiseren gezamenlijk een overlegplatform, waarin regels worden vastgesteld met
      betrekking tot de elektronische uitwisseling van gegevens, bedoeld in artikel 6 van de regeling, bedoeld in
      [artikelen 53][ref1] en [95cb, zesde lid, van de Elektriciteitswet 1998][ref2] en [artikelen 21][ref3] en
      [44b, zesde lid, van de Gaswet][ref4] met uitzondering van [hoofdstuk 7][ref5] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel44b
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95cb
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 44b
      - id: ref5
        bwb_id: BWBR0037934
        hoofdstuk: '7'
  - number: 9.1.2
    text: |-
      De ondernemingen als bedoeld in [9.1.1][ref1], bedoeld in [9.1.1][ref2], stelt regels omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.2.a
    text: |-
      procedures en specificaties van de te gebruiken centrale communicatiesystemen voor de geautomatiseerde
      berichtenuitwisseling;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.2
  - number: 9.1.2.b
    text: berichtspecificaties voor de (elektronische) gegevensuitwisseling;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.2
  - number: 9.1.2.c
    text: communicatieprotocollen voor de gegevensuitwisseling;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.2
  - number: 9.1.2.d
    text: |-
      de wijze waarop marktpartijen hun autorisatie- en beveiligingsbeleid bedoeld in [9.1a][ref1] inrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: 9.1a
  - number: 9.1.3
    text: |-
      De netbeheerders zijn gezamenlijk verantwoordelijk voor de centrale communicatiesystemen en besteden de inrichting
      en het beheer ervan in het algemeen en de uitvoeringshandelingen als bedoeld in [9.1.5][ref1], [9.1.7][ref2] en
      [9.1.10][ref3] in het bijzonder uit aan een uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.4
    text: |-
      Het in [paragraaf 13.5 van de Netcode elektriciteit][ref1] bedoelde centrale communicatiesysteem wordt beheerd door
      de netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Paragraaf13.5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037940
        paragraaf: '13.5'
  - number: 9.1.5
    text: |-
      De gezamenlijke netbeheerders organiseren bij wijziging van de procedures, specificaties, berichtspecificaties
      of communicatieprotocollen, bedoeld in [9.1.2][ref1], een test waarbij een netbeheerder, leverancier,
      programmaverantwoordelijke of meetverantwoordelijke die aantoonbaar voldoet aan de betreffende procedures,
      specificaties, berichtspecificaties of communicatieprotocollen een verklaring ontvangt dat de test succesvol is
      doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.6
    text: |-
      Het is een netbeheerder, leverancier, programmaverantwoordelijke of meetverantwoordelijke slechts toegestaan een
      bericht uit te wisselen met de centrale communicatiesystemen, als die onderneming voor het betreffende bericht in
      bezit is van de verklaring, bedoeld in [9.1.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7
    text: |-
      De gezamenlijke netbeheerders zullen de toegang van een netbeheerder, leverancier, programmaverantwoordelijke of
      meetverantwoordelijke tot de centrale systemen weigeren indien:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
  - number: 9.1.7.a
    text: |-
      de onderneming niet beschikt over de verklaring, bedoeld in [9.1.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7.b
    text: |-
      de onderneming, na daartoe uitgenodigd door de uitvoeringsorganisatie, bedoeld in [9.1.3][ref1], niet onverwijld
      een test aanvraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7.c
    text: |-
      de onderneming binnen twee weken na de uitnodiging, bedoeld in [9.1.7 onderdeel b][ref1], nog niet de in
      [9.1.5][ref2] bedoelde verklaring in het bezit heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7.d
    text: |-
      de onderneming uit eigen beweging de verklaring, bedoeld in [9.1.5][ref1], inlevert bij de uitvoeringsorganisatie,
      bedoeld in [9.1.3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7.e
    text: |-
      de verklaring, bedoeld in [9.1.5][ref1], vanuit beveiligingsoverwegingen wordt ingetrokken


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7.f
    text: de toezichthouder daar een aanwijzing toe geeft.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.7
  - number: 9.1.8
    text: |-
      Onverminderd het bepaalde in [artikel 9.1.1][ref1], stellen de gezamenlijke netbeheerders het elektronische
      berichtenverkeer, bedoeld in [9.1.2][ref2], open voor berichtenverkeer ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.8.a
    text: |-
      gesloten distributiesystemen elektriciteit die voldoen aan de voorwaarden genoemd in
      [artikel 5.8 van de Netcode elektriciteit][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '5'
  - number: 9.1.8.b
    text: |-
      gesloten distributiesystemen gas, aangesloten op een regionaal transportnet, die voldoen aan de voorwaarden van
      [artikel 2.4.5a van de Aansluit- en transportcode gas RNB][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: '2'
  - number: 9.1.8.c
    text: |-
      gesloten distributiesystemen gas aangesloten op het landelijk gastransportnet waarvan de beheerder middels een
      overeenkomst met de gezamenlijke netbeheerders er zorg voor draagt dat de administratieve processen, zoals bedoeld
      in [artikel 22 van de Gaswet][ref1], op zijn net worden uitgevoerd overeenkomstig de [hoofdstukken 1][ref2],
      [2][ref3], [4][ref4] en [6][ref5] en [Bijlage B3.4][ref6] van deze code.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0037934
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0037934
  - number: 9.1.9
    text: |-
      De gezamenlijke netbeheerders voeren de openstelling als bedoeld in [9.1.8][ref1] pas uit als de beheerder van
      het gesloten distributiesysteem een afschrift van de aan hem krachtens [artikel 15, tweede lid, van de Wet][ref2]
      verleende ontheffing heeft verstrekt aan de uitvoeringsorganisatie, bedoeld in [9.1.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.10
    text: |-
      Indien een ontheffing op grond van artikel 15, tweede lid, van de Wet vervalt, dan wel ingetrokken wordt, stellen
      de gezamenlijke netbeheerders daarop het elektronische berichtenverkeer niet langer open voor het desbetreffende
      gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.10
  - number: 9.1.11
    text: |-
      De ondernemingen als bedoeld in [9.1.1][ref1], stelt iedere netbeheerder, leverancier, programmaverantwoordelijke
      en meetverantwoordelijke op de hoogte van de in [9.1.2][ref2] bedoelde procedures, specificaties,
      berichtspecificaties en communicatieprotocollen door publicatie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.12
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen is gehouden tot de uitvoering en
      instandhouding van beveiligingsprocedures en -maatregelen om berichten en de verbindingen met de centrale
      communicatiesystemen te beschermen tegen verlies en tegen ongeautoriseerde kennisneming, wijziging of vernietiging,
      alsmede om ongeautoriseerde toegang tot de centrale communicatiesystemen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.12
  - number: 9.1.13
    text: |-
      Indien beveiligingsprocedures of -maatregelen leiden tot de afwijzing van een bericht of een fout in het bericht
      aan het licht brengen, stelt de ontvanger de verzender hiervan in overeenstemming met de het daaromtrent bepaalde
      in de regels bedoeld in [9.1.2][ref1] op de hoogte. De ontvanger geeft aan het bericht geen gevolg totdat hij
      door de verzender is geïnstrueerd. Ingeval de verzender het bericht opnieuw verzendt, is daarbij ondubbelzinnig
      aangegeven dat het een gecorrigeerd bericht betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1a.1
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen heeft een autorisatiebeleid dat bepaalt dat
      alle dataverzoeken en mutatieverzoeken, van de betreffende marktpartij in de centrale communicatiesystemen, tot de
      persoon herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1a.1
  - number: 9.1a.2
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen, draagt er zorg voor dat het gebruik van de
      centrale communicatiesystemen door een door hem ingeschakelde derde altijd verloopt via een door die onderneming
      gecontroleerd communicatiesysteem.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1a.2
  - number: 9.1a.3
    text: |-
      De onderneming die gebruik maakt van de centrale communicatiesystemen, beschikt over een procedure die de
      omgang met beveiligingsincidenten beschrijft en meldt beveiligingsincidenten met betrekking tot de centrale
      communicatiesystemen onverwijld aan de gezamenlijke netbeheerders.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1a.3
  - number: 9.1a.4
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen dient te waarborgen dat een door hem
      ingeschakelde derde voldoet aan de verplichtingen bedoeld in [9.1.12][ref1] en [9.1a.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.1a.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.1a
  - number: 9.2.1
    text: |-
      Registraties van berichten die overeenkomstig het bepaalde in deze code zijn verzonden, leveren, behoudens
      tegenbewijs, bewijs op van de in die berichten vervatte gegevens.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.2.1
  - number: 9.2.2
    text: |-
      In plaats van de termijn van één werkdag, genoemd in [hoofdstukken 2][ref1], [3][ref2] en [4][ref3], verzendt de
      netbeheerder gewoonlijk ook buiten werkdagen aan de betreffende leverancier(s), programmaverantwoordelijke(n) en
      meetverantwoordelijke(n) indien het centraal aansluitingenregister, bedoeld in [2.1.2][ref4], beschikbaar is en het
      mutatieproces storingsvrij volledig geautomatiseerd en zonder menselijke interventie kan worden afgerond


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.2.2.a
    text: |-
      het antwoord op een ontvangen melding van een mutatie uiterlijk de volgende kalenderdag na ontvangst van de
      melding; en
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.2.2
  - number: 9.2.2.b
    text: de stamgegevens uiterlijk de volgende kalenderdag na effectuering van een mutatie in het aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.2.2
  - number: 9.3.1.1
    text: |-
      De netbeheerder voert op niet-werkdagen gepland onderhoud uit aan zijn systemen voor de processen genoemd in
      [hoofdstuk 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 9.3.1.2
    text: |-
      De netbeheerder bericht de betrokken partijen uiterlijk een werkdag voor de dag van onderhoud over de periode
      van het geplande onderhoud, bedoeld in [9.3.1.1][ref1]. Het bericht wordt niet verstuurd via het elektronisch
      berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 9.3.1.3
    text: |-
      De meetverantwoordelijke voert op niet-werkdagen gepland onderhoud uit aan zijn systemen voor de processen genoemd
      in [hoofdstuk 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 9.3.1.4
    text: |-
      De meetverantwoordelijke bericht de betrokken partijen uiterlijk een werkdag voor de dag van onderhoud over
      de periode van het geplande onderhoud, bedoeld in [9.3.1.3][ref1]. Het bericht wordt niet verstuurd via het
      elektronisch berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel9.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 10.1.1.1
    text: |-
      De gegevens, bedoeld in [paragraaf 2.1][ref1], worden vastgelegd, uitgewisseld, gebruikt of bewaard voor het
      faciliteren van de marktprocessen voor de elektriciteitsmarkt en de gasmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 10.1.1.2
    text: |-
      De netbeheerder, de leverancier, de programmaverantwoordelijke en de meetverantwoordelijke bewaren de gegevens uit
      het aansluitingenregister van de aansluitingen waarvoor zij verantwoordelijk zijn gedurende ten hoogste acht jaar
      nadat de gegevens hun geldigheid hebben verloren.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.2
  - number: 10.1.1.3
    text: |-
      Een aangeslotene of op grond van een machtiging van de aangeslotene een leverancier, een programmaverantwoordelijke
      of een meetverantwoordelijke heeft het recht om het aansluitingenregister in te zien voor zijn aansluitingen.
      Na ontvangst van gegevens uit het aansluitingenregister heeft elk van de genoemde partijen de plicht hem
      betreffende onjuistheden in het aansluitingenregister, binnen vijf werkdagen na ontvangst van de gegevens uit het
      aansluitingenregister te melden voor correctie.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.3
  - number: 10.1.1.4
    text: |-
      Correctie van gegevens uit het aansluitingenregister worden doorgevoerd overeenkomstig de processen, bedoeld in
      [paragrafen 3.1 tot en met 3.5][ref1] en [3.12][ref2] voor kleinverbruikaansluitingen of de processen, bedoeld in
      [paragrafen 4.1 tot en met 4.8][ref3] voor grootverbruikaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.12'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 10.1.1.5
    text: |-
      Voor de onjuistheden, bedoeld in [10.1.1.3][ref1], die niet kunnen worden gecorrigeerd via de correctieprocessen,
      bedoeld in [10.1.1.4][ref2], controleert de netbeheerder de melding en corrigeert de onjuistheden uiterlijk twintig
      werkdagen na ontvangst van de melding in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.1.6
    text: |-
      De direct aangeslotene, de leverancier en de programmaverantwoordelijke hebben het recht om het
      aansluitingenregister landelijk gastransport in te zien voor hen betreffende aansluitingen. Desgevraagd verstrekt
      de netbeheerder van het landelijk gastransportnet de voor hen relevante stamgegevens als bedoeld in [2.13.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 10.1.1.7
    text: |-
      De direct aangeslotene, de leverancier en de programmaverantwoordelijke hebben het recht om onjuistheden in
      het aansluitingenregister landelijk gastransportnet met betrekking tot hen betreffende aansluitingen te doen
      corrigeren. Indien de direct aangeslotene of de programmaverantwoordelijke verzoekt de gegevens te wijzigen,
      stemt de netbeheerder van het landelijk gastransportnet dit af met de betrokken leverancier. Indien de leverancier
      akkoord is met de voorgestelde wijziging, stuurt deze de wijziging in door middel van een daartoe bestemd switch
      mutatieformulier. Vervolgens effectueert de netbeheerder van het landelijk gastransportnet deze wijziging in het
      aansluitingenregister landelijk gastransportnet overeenkomstig [2.13.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 10.1.2.1
    text: |-
      De gegevens bedoeld in [paragraaf 2.3][ref1] worden vastgelegd, uitgewisseld, gebruikt of bewaard ten behoeve van
      de marktprocessen voor de elektriciteitsmarkt en gasmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 10.1.2.2
    text: |-
      De netbeheerder bewaart de gegevens in het EAN-codeboek van de aansluitingen waarvoor hij verantwoordelijk is ten
      hoogste tot het moment, waarop de gegevens opnieuw beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.2.2
  - number: 10.1.2.3
    text: De opvragende partij bewaart de gegevens die hij uit het EAN-codeboek heeft ontvangen ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.2.3
  - number: 10.1.3.1
    text: |-
      De contracteindegegevens, bedoeld in [paragraaf 2.5][ref1], worden vastgelegd, uitgewisseld, gebruikt of bewaard
      voor de uitvoering van processen, bedoeld in [hoofdstuk 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
  - number: 10.1.3.2
    text: |-
      De leveranciers bewaren de door hen beschikbaar gestelde contracteindegegevens ten hoogste zeven jaar nadat de
      gegevens hun geldigheid hebben verloren.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.3.2
  - number: 10.1.3.3
    text: De leveranciers bewaren ontvangen contracteindegegevens ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.3.3
  - number: 10.1.3.4
    text: |-
      Een aangeslotene heeft het recht om de contracteindegegevens, die zijn eigen aansluiting betreffen, op te vragen
      bij zijn leverancier. De aangeslotene heeft het recht hem betreffende onjuistheden in de contracteindegegevens te
      melden aan zijn leverancier en te doen corrigeren.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.3.4
  - number: 10.1.4.1
    text: |-
      De gegevens in het toegankelijk meetregister, bedoeld in [paragraaf 2.6][ref1], worden vastgelegd, uitgewisseld,
      gebruikt of bewaard voor de uitvoering van processen, genoemd in [hoofdstuk 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
  - number: 10.1.4.2
    text: |-
      De regionale netbeheerders bewaren de door hen beschikbaar gestelde gegevens uit het toegankelijk meetregister van
      alle kleinverbruikaansluitingen ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4.2
  - number: 10.1.4.3
    text: Leveranciers bewaren de door hen opgevraagde gegevens uit het toegankelijk meetregister ten hoogste 3 maanden.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4.3
  - number: 10.1.4a.1
    text: |-
      De klantsleutel als bedoeld in [2.14.1][ref1] wordt vastgelegd, uitgewisseld of bewaard voor de uitvoering van de
      processen bedoeld in [paragrafen 2.2b][ref2] en [2.5a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.14'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 10.1.4a.2
    text: |-
      De regionale netbeheerders bewaren de klantsleutel als bedoeld in [2.14.1][ref1] totdat zij deze moeten verwijderen
      op grond van [2.14.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4a.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.14'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.14'
  - number: 10.1.4a.3
    text: |-
      De leverancier bewaart de door hem op grond van [2.2b.1][ref1] of [2.5a.1][ref2] verkregen klantsleutel niet langer
      dan voor het doen van een aanbod nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4a.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 10.1.4b.1
    text: |-
      De toestemmingen als bedoeld in [2.15.1][ref1] worden vastgelegd, uitgewisseld of bewaard voor de uitvoering van de
      processen bedoeld in [paragraaf 2.2b][ref2] en [2.5a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4b.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
