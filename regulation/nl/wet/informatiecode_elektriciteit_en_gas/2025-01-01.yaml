        paragraaf: '4.11'
  - number: 4.12.1.1
    text: |-
      De netbeheerder informeert de meetverantwoordelijke, indien mogelijk tenminste vijf werkdagen voorafgaand aan de
      datum waarop de aansluiting wordt verwijderd, over de geplande verwijdering van de aansluiting. In afwijking van
      [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.12.2.1
    text: |-
      De netbeheerder controleert, voorafgaand aan de effectuering in het aansluitingenregister, bedoeld in
      [4.12.2.4][ref1], of er voor de desbetreffende aansluiting nog eerder bevestigde, doch nog niet geëffectueerde
      leverancierswitchmeldingen, inhuizingsmeldingen, uithuizingsmeldingen, eindeleveringsmeldingen of PV-
      switchmeldingen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 4.12.2.2
    text: |-
      Indien een of meerdere reeds bevestigde, doch nog niet geëffectueerde meldingen, bedoeld in [4.12.2.1][ref1],
      aanwezig zijn, verwijdert de netbeheerder deze meldingen, beëindigt de netbeheerder de procedure(s) en informeert
      de netbeheerder de leverancier hierover. In afwijking van [paragraaf 9.1][ref2] vindt deze informatie-uitwisseling
      niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.12'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.12.2.3
    text: |-
      De leverancier informeert de programmaverantwoordelijke over de verwijdering van eerder ingediende, doch nog niet
      geëffectueerde meldingen, zoals genoemd in [4.12.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 4.12.2.4
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de aansluiting is verwijderd effectueert de netbeheerder de status
      van de aansluiting, bedoeld in [2.1.3, onderdeel h][ref1], die van toepassing is, te weten: “verwijderd” in het
      aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.12.2.4a
    text: |-
      Indien een primair allocatiepunt wordt verwijderd, verwijdert de netbeheerder tegelijkertijd ook de bijbehorende
      secundaire allocatiepunten.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.2.4a
  - number: 4.12.2.5
    text: |-
      De netbeheerder informeert de leverancier, de programmaverantwoordelijke en de meetverantwoordelijke die voor de
      aansluiting in het aansluitingenregister vermeld staan, overeenkomstig [paragraaf 2.2][ref1] omtrent de mutatie,
      bedoeld in [4.12.2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.12.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 4.14.1.1
    text: |-
      Ten einde een switchmelding te kunnen doen verwerken, en voor zover van toepassing, meldt de nieuwe leverancier
      zich eenmalig aan als juridische entiteit bij de netbeheerder van het landelijk gastransportnet door middel van het
      daartoe bestemd en door genoemde netbeheerder beschikbaar gesteld aanmeldformulier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.1
  - number: 4.14.1.2
    text: |-
      Ingeval de direct aangeslotene van leverancier en/of programmaverantwoordelijke wisselt, stuurt de nieuwe
      leverancier de switchmelding naar de netbeheerder van het landelijke gastransportnet door middel van een daartoe
      bestemd switch-mutatieformulier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.2
  - number: 4.14.1.3
    text: |-
      De nieuwe leverancier stuurt de switchmelding bij voorkeur één maand doch uiterlijk vijf werkdagen voor de
      switchdatum naar de netbeheerder van het landelijk gastransportnet, tenzij anders wordt overeengekomen. De
      switchmelding bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.b
    text: de naam van de direct aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.c
    text: de bedrijfs-EAN-code van de (nieuwe) programmaverantwoordelijke(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.d
    text: de naam van de (nieuwe) programmaverantwoordelijke(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.e
    text: de bedrijfs-EAN-code van de (nieuwe) leverancier(s);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.f
    text: de naam van de (nieuwe) leverancier(s);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.g
    text: |-
      de ingangsdatum/beëindigingsdatum van de bij de aansluiting behorende relatie(s) programmaverantwoordelijke(n)
      enerzijds en de leverancier(s) anderzijds;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.1.3.h
    text: opmerkingen (vrij tekstveld).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.1.3
  - number: 4.14.2.1
    text: 'Naar aanleiding van de switchmelding controleert de netbeheerder van het landelijk gastransportnet of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.1
  - number: 4.14.2.1.a
    text: de switchmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.1
  - number: 4.14.2.1.b
    text: |-
      de EAN-code behoort bij een aansluiting als bedoeld in [2.13.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 4.14.2.1.c
    text: de switchdatum ten opzichte van de datum van de switchmelding ten minste vijf werkdagen in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.1
  - number: 4.14.2.1.d
    text: |-
      de nieuwe leverancier als juridische entiteit bekend is als bedoeld in [4.14.1.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.14'
  - number: 4.14.2.1.e
    text: |-
      de opgegeven programmaverantwoordelijke een transportovereenkomst heeft afgesloten met de netbeheerder van het
      landelijke gastransportnet voor het desbetreffende entry/exitpunt met een transportcapaciteit groter dan 0 op de
      ingangsdatum zoals genoemd in het in [4.14.1.2][ref1] bedoelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.14'
  - number: 4.14.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet wijst de switchmelding af die niet voldoet aan de vereisten a,
      b, d en e van het voorgaande artikel en stelt de nieuwe leverancier in staat om de switchmelding binnen een termijn
      van 5 werkdagen inhoudelijk aan te passen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.2.2
  - number: 4.14.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet muteert het aansluitingenregister naar aanleiding
      van de switchmelding die al dan niet na inhoudelijke aanpassing, voldoet aan de vereisten
      [a, b, d en e van 4.14.2.1][ref1], dan wel ingeval van een niet-tijdige melding of een niet-tijdige inhoudelijke
      aanpassing, uiterlijk 5 werkdagen na ontvangst van de switchmelding die hier (uiteindelijk) aan voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.14'
  - number: 4.14.3.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de desbetreffende leverancier(s) en
      programmaverantwoordelijk(en) over de mutatie zodra deze is geëffectueerd.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.14.3.2
  - number: 4.15.1.1
    text: |-
      Ingeval de levering beëindigd wordt, stuurt de leverancier de eindeleveringsmelding naar de netbeheerder van het
      landelijk gastransportnet door middel van een daartoe bestemd eindeleveringsformulier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.1
  - number: 4.15.1.2
    text: |-
      De leverancier stuurt het eindeleveringsformulier uiterlijk één maand voor de einddatum van de levering naar de
      netbeheerder van het landelijk gastransportnet. De eindeleveringsmelding bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.b
    text: de naam van de direct aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.c
    text: de bedrijfs-EAN-code van de programmaverantwoordelijke(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.d
    text: de naam van de programmaverantwoordelijke(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.e
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.f
    text: de naam van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.g
    text: |-
      de beëindigingsdatum van de van de bij de aansluiting behorende relatie(s) programmaverantwoordelijke(n) enerzijds
      en de leverancier relatie(s) anderzijds voor de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.1.2.h
    text: in het vrije tekstveld de melding dat de levering wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.1.2
  - number: 4.15.2.1
    text: 'Naar aanleiding van de eindeleveringsmelding controleert de netbeheerder van het landelijk gastransportnet of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.2.1
  - number: 4.15.2.1.a
    text: de EAN-code van de aansluiting voorkomt in het aansluitingenregister landelijk gastransport;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.2.1
  - number: 4.15.2.1.b
    text: |-
      de einddatum van de levering ten opzichte van de datum van indienen van de eindeleveringsmelding ten minste één
      maand in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.2.1
  - number: 4.15.2.1.c
    text: |-
      er geen eerder bevestigde en nog niet geëffectueerde switchmelding is betreffende de relatie(s)
      programmaverantwoordelijke(n) enerzijds en de leverancier(s) anderzijds voor dezelfde aansluiting van dezelfde of
      een eerdere datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.2.1
  - number: 4.15.2.1.d
    text: |-
      de eindeleveringsmelding is ingediend door de in het aansluitingenregister landelijk gastransportnet vermelde
      leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.2.1
  - number: 4.15.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet wijst de eindeleveringsmelding af die niet voldoet aan de
      vereisten a, c en d van het voorgaande artikel en stelt de leverancier in staat om de eindeleveringsmelding aan
      te passen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.2.2
  - number: 4.15.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet muteert het aansluitingenregister overeenkomstig [2.13.1][ref1]
      naar aanleiding van de eindeleveringsmelding die voldoet aan de vereisten [a, c en d van 4.15.2.1][ref2], uiterlijk
      één maand nadat deze is ontvangen dan wel afdoende aan de genoemde vereisten is aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.13'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.15'
  - number: 4.15.3.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de direct aangeslotene, de leverancier en de
      programmaverantwoordelijke(-n) over de mutatie zodra deze is geëffectueerd.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.15.3.2
  - number: 4.16.1.1
    text: |-
      Onder een onterechte switch van leverancier wordt verstaan de uitvoering van de procedure, bedoeld in
      [paragraaf 4.1][ref1], op een aansluiting waarvoor geen leveringsovereenkomst voor de desbetreffende periode tot
      stand is gekomen tussen de aangeslotene en de leverancier die de switchmelding heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.16.1.2
    text: |-
      De leverancier, die constateert dat er vermoedelijk sprake is van een onterechte switch van leverancier voor
      een aansluiting waarop, op het moment van indienen van de switchmelding een leverancier is geregistreerd in
      het aansluitingenregister, neemt hierover binnen één werkdag contact op met de andere betrokken leverancier.
      In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde
      berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.1.3
    text: |-
      De leverancier die de in [4.16.1.2][ref1] bedoelde melding heeft ontvangen, reageert binnen vijf werkdagen
      en geeft daarbij aan of al dan niet sprake is van een onterechte switch van leverancier. In afwijking van
      [paragraaf 9.1][ref2] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.1.4
    text: |-
      Indien de leverancier bedoeld in [4.16.1.2][ref1] de onterechte switch van leverancier bevestigt, dient de
      leverancier, die voor de desbetreffende aansluiting uit het aansluitingenregister is of zal worden verwijderd,
      zo snel mogelijk, maar uiterlijk één werkdag na die bevestiging ter correctie een switchmelding in overeenkomstig
      [paragraaf 4.1][ref2], waarbij de mutatiedatum gebaseerd wordt op de kortst mogelijke termijn van indienen van de
      mutatie, genoemd in [4.1.1][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.16.1.5
    text: |-
      Indien de switchmelding, die de leverancier bedoeld in [4.16.1.4][ref1] ter correctie indient, uiterlijk vijf
      werkdagen voor de mutatiedatum van de onterechte switchmelding wordt ingediend, hanteert de leverancier als
      mutatiedatum de mutatiedatum van de onterechte switchmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
  - number: 4.16.1.6
    text: |-
      De leverancier, die constateert dat er sprake is van een onterechte switch van leverancier voor een aansluiting
      waarop, op moment van indienen van de switchmelding geen leverancier is geregistreerd in het aansluitingenregister
      of op moment van constatering geen rechtsgeldige overeenkomst meer bestaat bij de andere leverancier, neemt
      hierover binnen één werkdag contact op met de netbeheerder. In afwijking van [paragraaf 9.1][ref1] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.1.7
    text: |-
      De leverancier dient zo snel mogelijk, maar uiterlijk één werkdag nadien ter correctie een uithuizingsmelding in
      overeenkomstig [paragraaf 4.2][ref1]. waarbij de mutatiedatum gebaseerd wordt op de kortst mogelijke termijn van
      indienen van de mutatie, genoemd in [4.2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.16.2.1
    text: |-
      Onder een onterechte uithuizing wordt verstaan de uitvoering van de procedure, bedoeld in [paragraaf 4.2][ref1],
      waarbij de aangeslotene niet daadwerkelijk de aansluiting heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.16.2.2
    text: |-
      De leverancier, die constateert dat er sprake is van een onterechte uithuizing op een aansluiting, dient
      zo snel mogelijk, maar uiterlijk één werkdag nadien ter correctie een inhuizingsmelding in overeenkomstig
      [paragraaf 4.3][ref1], waarbij de mutatiedatum gebaseerd wordt op de kortst mogelijke termijn van indienen van de
      mutatie, genoemd in [4.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.16.2.3
    text: |-
      De leverancier, die de inhuizingsmelding ter correctie heeft ingediend, stelt de netbeheerder uiterlijk binnen één
      werkdag na indienen op de hoogte van de correctie. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-
      uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.3.1
    text: |-
      Onder een onterechte inhuizing wordt verstaan de uitvoering van de procedure, bedoeld in [paragraaf 4.3][ref1],
      waarbij de veronderstelde aangeslotene niet daadwerkelijk op de aansluiting is ingehuisd dan wel dat er op de
      mutatiedatum geen leveringsovereenkomst voor de desbetreffende aansluiting tussen de aangeslotene en de leverancier
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.16.3.2
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte inhuizing op een aansluiting waarop geen
      leverancier is geregistreerd in het aansluitingenregister of waarvan de leveringsovereenkomst ondertussen
      is geëindigd, dient zo snel mogelijk, maar uiterlijk één werkdag na die constatering ter correctie een
      uithuizingsmelding in overeenkomstig [paragraaf 4.2][ref1]. waarbij de mutatiedatum gebaseerd wordt op de kortst
      mogelijke termijn van indienen van de mutatie, genoemd in [4.2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.16.3.3
    text: |-
      De leverancier, die de uithuizingsmelding ter correctie heeft ingediend, informeert de netbeheerder hierover.
      In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde
      berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.3.4
    text: |-
      De leverancier die constateert dat er vermoedelijk sprake is van een onterechte inhuizing op een aansluiting,
      waarop een leverancier is geregistreerd in het aansluitingenregister, neemt hierover binnen één werkdag contact op
      met de andere betrokken leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet
      plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.3.5
    text: |-
      De leverancier die de in [4.16.3.4][ref1] bedoelde melding heeft ontvangen, reageert binnen vijf werkdagen en geeft
      daarbij aan of al dan niet sprake is van een onterechte inhuizing. In afwijking van [paragraaf 9.1][ref2] vindt
      deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.3.6
    text: |-
      Indien de leverancier bedoeld in [4.16.3.5][ref1] de onterechte inhuizingsmelding bevestigt, dient de leverancier
      die voor de betreffende aansluiting uit het aansluitingenregister is verwijderd, zo snel mogelijk, maar uiterlijk
      één werkdag na die bevestiging een inhuizingsmelding in ter correctie overeenkomstig [paragraaf 4.3][ref2]
      waarbij de mutatiedatum gebaseerd wordt op de kortst mogelijke termijn van indienen van de mutatie, genoemd in
      [4.3.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.16.3.7
    text: |-
      Indien de inhuizingsmelding, die de leverancier bedoeld in [4.16.3.6][ref1] ter correctie indient, uiterlijk vijf
      werkdagen voor de mutatiedatum van de onterechte inhuizingsmelding wordt ingediend, hanteert de leverancier als
      mutatiedatum de mutatiedatum van de onterechte inhuizingsmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
  - number: 4.16.4.1
    text: |-
      Onder een onterechte eindelevering wordt verstaan de onbedoelde uitvoering van de procedure, bedoeld in
      [paragraaf 4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.16.4.2
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte eindelevering meldt dit onmiddellijk aan
      de netbeheerder. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.4.3
    text: |-
      De leverancier bedoeld in [4.16.4.2][ref1], dient uiterlijk één werkdag na constatering een inhuizingsmelding ter
      correctie in overeenkomstig [paragraaf 4.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.16.4.4
    text: |-
      De inhuizingsmelding, bedoeld in [4.16.4.3][ref1], heeft als mutatiedatum de datum van moment van indiening van
      de inhuizingsmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
  - number: 4.16.5.1
    text: 'Onder een onterechte switch van programmaverantwoordelijke wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.5.1
  - number: 4.16.5.1.I
    text: |-
      het op een aansluiting onbedoeld uitvoeren van de procedure, bedoeld in [paragraaf 4.5][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.16.5.1.II
    text: |-
      het in de switchmelding bedoeld in [4.1.1.1, onderdeel e][ref1] of in de inhuizingsmelding bedoeld in
      [4.3.1.1, onderdeel g][ref2], doorgeven van een bedrijfs-EAN-code van een andere programmaverantwoordelijke dan
      is beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.16.5.2
    text: |-
      De leverancier of programmaverantwoordelijke, die constateert dat er sprake is van een onterechte switch
      van programmaverantwoordelijke, neemt hierover binnen één werkdag contact op met de betrokken leverancier of
      programmaverantwoordelijken. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats
      via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.16.5.3
    text: |-
      De leverancier, bedoeld in [4.16.5.2][ref1], corrigeert een onterechte switch van programmaverantwoordelijke
      binnen één werkdag na constatering, met een PV-switchmelding overeenkomstig [paragraaf 4.5][ref2] waarbij de kortst
      mogelijke indientermijn wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.16.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.16'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 5.1.1
    text: |-
      [Paragraaf 5.1][ref1] is niet van toepassing op onbemeten kleinverbruikaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.2.1
    text: |-
      Indien de allocatiemethode van een kleinverbruikaansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde
      “profielallocatie” heeft, collecteert de leverancier voor deze kleinverbruikaansluiting ten minste eenmaal per 12
      maanden een meterstand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.2.1a
    text: |-
      Indien de allocatiemethode van een kleinverbruikaansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde
      “slimme-meter-allocatie” heeft, collecteert de leverancier voor deze kleinverbruikaansluiting maandelijks een op
      afstand uitleesbare meterstand van de eerste kalenderdag van de desbetreffende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.2.2
    text: |-
      De leverancier collecteert in het kader van een mutatieproces een meterstand die betrekking heeft op de
      mutatiedatum, zoals bedoeld in [paragrafen 3.1 tot en met 3.4][ref1] en [3.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 5.1.2.3
    text: |-
      De leverancier meldt bij de opvraag, bedoeld in [5.1.2.1][ref1] of [5.1.2.2][ref2], aan de aangeslotene dat het
      niet (tijdig) verstrekken van de bedoelde meterstand leidt tot berekening of schatting van de meterstand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.1
    text: |-
      De leverancier valideert de meterstand, bedoeld in [5.1.2][ref1], met uitzondering van de meterstand zoals bedoeld
      in [artikel 5.1.2.1a][ref2], met behulp van de in het toegankelijk meetregister vermelde historische meterstanden
      en de uit het aansluitingenregister verkregen standaardjaarafname elektriciteit, standaardjaarinvoeding
      elektriciteit of standaardjaarverbruik gas en controleert of de meterstand, indien van toepassing voor zowel het
      normaaltelwerk als het laagtelwerk, tussen de volgende validatiegrenzen ligt:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.1.a
    text: |-
      Bovengrens afname elektriciteit = Vorige meterstand + 200% * [SOM fractie (Datum: Datum)] * SJA /
      vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
  - number: 5.1.3.1.b
    text: |-
      Ondergrens afname elektriciteit = Vorige meterstand + 50% * [SOM fractie (Datum: Datum)] * SJA /
      vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
  - number: 5.1.3.1.c
    text: |-
      Bovengrens invoeding elektriciteit = Vorige meterstand + 200% * [SOM fractie (Datum: Datum)] * SJI /
      vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
  - number: 5.1.3.1.d
    text: |-
      Ondergrens invoeding elektriciteit = Vorige meterstand + 50% * [SOM fractie (Datum: Datum)] * SJI /
      vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
  - number: 5.1.3.1.e
    text: 'Bovengrens gas = Vorige meterstand + 200% * [SOM fractie (Datum: Datum)] * SJV / vermenigvuldigingsfactor;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
  - number: 5.1.3.1.f
    text: 'Ondergrens gas = Vorige meterstand + 50% * [SOM fractie (Datum: Datum)] * SJV / vermenigvuldigingsfactor.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.1
  - number: 5.1.3.2
    text: |-
      De leverancier treedt in overleg met de aangeslotene indien de gecollecteerde meterstanden buiten de grenzen,
      bedoeld in [5.1.3.1][ref1], vallen, met als doel om:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.2.a
    text: een nieuwe door de aangeslotene aangeleverde meterstand te verkrijgen, of;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.2
  - number: 5.1.3.2.b
    text: |-
      te constateren dat de op grond van [artikel 5.1.2][ref1] gecollecteerde meterstand wel gebruikt kan worden en als
      gevalideerd wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.3
    text: |-
      De leverancier berekent de meterstand indien geen collectie op grond van [paragraaf 5.1.2][ref1] heeft kunnen
      plaatsvinden of wanneer in overleg met de aangeslotene, bedoeld in [5.1.3.2][ref2], geen duidelijkheid is verkregen
      over de bruikbaarheid van de meterstand die buiten de validatiegrenzen, bedoeld in [5.1.3.1][ref3], valt. Voor deze
      berekening wordt gebruik gemaakt van de volgende algoritmen:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.3.a
    text: |-
      Berekende meterstand (afname elektriciteit normaal) = Vorige meterstand (normaal) + [SOM fractie (Datum: Datum)] *
      SJA / vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
  - number: 5.1.3.3.b
    text: |-
      Berekende meterstand (afname elektriciteit laag) = Vorige meterstand (laag) + [SOM fractie (Datum: Datum
      meterstand)] * SJA / vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
  - number: 5.1.3.3.c
    text: |-
      Berekende meterstand (afname elektriciteit totaal) = Vorige meterstand (totaal) + [SOM fractie (Datum: Datum)] *
      (SJA+ SJA) / vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
  - number: 5.1.3.3.d
    text: |-
      Berekende meterstand (gas) = Vorige meterstand+ [SOM fractie (Datum: Datum)] * SJV / (vermenigvuldigingsfactor *
      volumeherleidingsfactor), met inachtneming van [5.1.3.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.3.e
    text: Berekende meterstand (invoeding elektriciteit normaal) = Vorige meterstand (invoeding elektriciteit normaal);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
  - number: 5.1.3.3.f
    text: Berekende meterstand (invoeding elektriciteit laag) = Vorige meterstand (invoeding elektriciteit laag).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.3
  - number: 5.1.3.4
    text: |-
      De leverancier stelt de gevalideerde meterstand, bedoeld in [5.1.3.1][ref1] of [5.1.3.2 onderdeel b][ref2], of de
      berekende meterstand, bedoeld in [5.1.3.3][ref3], vast voor de opnamedatum bij een periodieke meterstand of voor de
      mutatiedatum bij een mutatieproces.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.4a
    text: |-
      De leverancier stelt de gecollecteerde meterstand als bedoeld in [5.1.2.1a][ref1] vast op uiterlijk de vijftiende
      werkdag van de desbetreffende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.4a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.5
    text: |-
      Gedurende de periode van 1 januari 2015 tot en met 31 december 2016 wordt in plaats van de volumeherleidingsfactor
      tijdelijk een afwijkende factor toegepast door de volumeherleidingsfactor te vermenigvuldigen met 1,008027. De
      tijdelijk toe te passen factor wordt daarmee 0,98408 (= 0,97624 x 1,008027).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.5
  - number: 5.1.3.6
    text: |-
      Bij het valideren en berekenen van standen, als bedoeld in [5.1.3.1][ref1] en [5.1.3.3][ref2] gebruikt de
      leverancier, of de netbeheerder namens de leverancier, in geval van elektriciteit de overeenkomstig [Bijlage 16 van
      de Netcode elektriciteit](onbekend) vastgestelde profielfracties, indien van toepassing per tariefperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.4.1
    text: |-
      De leverancier verstuurt de vastgestelde meterstand, bedoeld in [5.1.3.4][ref1] en [5.1.3.4a][ref2], de werkdag
      na vaststelling, doch uiterlijk binnen de termijnen, bedoeld in [5.3.4.3][ref3], naar de regionale netbeheerder en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.1.4.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.d
    text: de van toepassing zijnde procesidentificatie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.e
    text: per telwerk de volgende gegevens;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
  - number: 5.1.4.1.e.1
    text: de meterstand;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.1.4.1
