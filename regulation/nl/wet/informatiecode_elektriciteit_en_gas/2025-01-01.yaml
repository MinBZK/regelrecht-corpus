  - number: 3.14.4.6
    text: |-
      Indien tussen de onterechte eindelevering en de uitvoering van de correctie een wisseling van de meetinrichting
      heeft plaatsgevonden zoals bedoeld in [paragraaf 3.11][ref1], wordt in afwijking van [3.14.4.5][ref2] de
      vastgestelde meterstand ten tijde van de meterplaatsing door de leverancier vastgesteld voor de mutatiedatum van de
      inhuizingsmelding die ter correctie is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.11'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.5.1
    text: 'Onder een onterechte switch van programmaverantwoordelijke wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.5.1
  - number: 3.14.5.1.(i)
    text: |-
      het op een aansluiting onbedoeld uitvoeren van een procedure, als bedoeld in [paragraaf 3.5][ref1] of
      [paragraaf 3.6][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.14.5.1.(ii)
    text: |-
      het in de switchmelding als bedoeld in [3.1.1.1, onderdeel e][ref1] of in de inhuizingsmelding als bedoeld in
      3.3.1.1, onderdeel f, doorgeven van een bedrijfs-EAN-code van een andere programmaverantwoordelijke dan is beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.14.5.2
    text: |-
      De leverancier, die constateert dat er sprake is van een onterechte PV-switch, neemt hierover binnen vijf werkdagen
      contact op met de betrokken programmaverantwoordelijken. In afwijking van [paragraaf 9.1][ref1] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.5.3
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte switch van programmaverantwoordelijke,
      dient binnen één werkdag na de melding zoals bedoeld in [3.14.5.2][ref1], ter correctie een PV-switchmelding in
      overeenkomstig [paragraaf 3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.14'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.15.1.1
    text: |-
      De actuele leverancier die beschikt over een toestemming van de aangeslotene dat de regionale netbeheerder de
      allocatiemethode wijzigt, stuurt de betreffende wijziging van de allocatiemethode op de gewenste mutatiedatum
      naar de regionale netbeheerder. Voor de wijziging van de allocatiemethode van “profielallocatie” in “slimme-
      meter-allocatie” verleent de aangeslotene door middel van een actieve handeling vooraf toestemming aan de actuele
      leverancier. De melding “wijziging allocatiemethode” bevat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.1.1.b
    text: de mutatiedatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.1.1.c
    text: de gewenste allocatiemethode;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.1.1.d
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.1.1.e
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.1.1.f
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.1.1
  - number: 3.15.2.1
    text: 'Naar aanleiding van het verzoek tot wijziging van de allocatiemethode controleert de regionale netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.a
    text: het verzoek tot wijziging van de allocatiemethode volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.b
    text: de EAN-code van de aansluiting voorkomt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.c
    text: de aansluiting een elektriciteitsaansluiting betreft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.d
    text: de gewenste mutatiedatum gelijk is aan datum indiening wijzigingsverzoek;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.e
    text: de wijziging van de allocatiemethode wordt ingediend door de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.f
    text: de allocatiemethode is toegestaan;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.g
    text: de aansluiting op afstand uitleesbaar is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.1.h
    text: de gewenste allocatiemethode niet reeds van toepassing is.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.1
  - number: 3.15.2.2
    text: |-
      Als alle controles uit [3.15.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.15.3][ref2]. Als dat niet het geval is, wordt de wijziging niet uitgevoerd en wordt de procedure na
      [3.15.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.15'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.15'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 3.15.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de wijziging van de allocatiemethode naar aanleiding van
      [3.15.2.2][ref1] uiterlijk de werkdag na ontvangst van het verzoek tot wijziging van de allocatiemethode aan de
      leverancier die het verzoek tot wijziging van de allocatiemethode heeft ingediend en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 3.15.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.b
    text: de bedrijfs-EAN-code van de regionale netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.c
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d
    text: 'de reden van het niet uitvoeren van de wijziging van de allocatiemethode:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.1
    text: het verzoek tot wijziging van de allocatiemethode is onvolledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.3
    text: de aansluiting betreft geen elektriciteitsaansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.4
    text: de gewenste mutatiedatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.5
    text: de indienende leverancier is onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.6
    text: de allocatiemethode is niet toegestaan
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.7
    text: de aansluiting is niet op afstand uitleesbaar;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.d.8
    text: de gewenste allocatiemethode wordt reeds toegepast;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.2.3.e
    text: 'indien aangeleverd in het verzoek tot wijziging van de allocatiemethode: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.2.3
  - number: 3.15.3.1
    text: |-
      De regionale netbeheerder muteert het veld, zoals bedoeld in [2.1.3 onderdeel s][ref1], in het
      aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.15.3.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2.][ref1] over de mutatie, bedoeld in
      [3.15.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 3.15.4.1
    text: |-
      De leverancier collecteert de meterstand behorende bij de wijziging van de allocatiemethode, stelt deze vast
      en distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde “in bedrijf” heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.15.4.2
    text: |-
      De leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde “in bedrijf” heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.15.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.1.1.1
    text: |-
      De aangeslotene machtigt de nieuwe leverancier om namens hem de switch van leverancier af te wikkelen. Op grond
      van deze machtiging stuurt de nieuwe leverancier tenminste vijf werkdagen en ten hoogste twintig werkdagen voor
      de switchdatum namens deze aangeslotene een switchmelding naar de netbeheerder. De switchmelding bevat de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.b
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.d
    text: de bedrijfs-EAN-code van de nieuwe leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.e
    text: de bedrijfs-EAN-code van de programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.f
    text: 'indien de leverancier dat wenst op te geven: de naam van de aangeslotene;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.g
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.h
    text: |-
      indien de leverancier de naam van de aangeslotene overeenkomstig 4.1.1.1, onderdeel f, heeft opgegeven, en hierover
      beschikt: de geboortedatum van de aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.1.1.i
    text: |-
      indien de leverancier de naam van de aangeslotene overeenkomstig 4.1.1.1, onderdeel f, heeft opgegeven, en hierover
      beschikt: het KvK-nummer van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.1.1
  - number: 4.1.2.1
    text: 'Naar aanleiding van de switchmelding controleert de netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.a
    text: de switchmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.c
    text: |-
      de switchdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig werkdagen in
      de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.d
    text: de nieuwe leverancier is opgenomen in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.e
    text: |-
      de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.f
    text: |-
      de mutatiedatum niet ligt vóór de mutatiedatum van een eerder bevestigde leverancierswitchmelding of
      inhuizingsmelding voor dezelfde aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.1.g
    text: de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.1
  - number: 4.1.2.2
    text: |-
      In aanvulling op [4.1.2.1][ref1] controleert de netbeheerder of de naam van de aangeslotene is ingevuld in de
      switchmelding, indien op de aansluiting in het aansluitingenregister geen leverancier is geregistreerd op de
      switchdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.2.3
    text: |-
      Als alle controles uit [4.1.2.1][ref1] en [4.1.2.2][ref2] een positief resultaat geven, wordt de procedure
      vervolgd vanaf [4.1.2.5][ref3]. Als dat niet het geval is, wordt de switch niet uitgevoerd en wordt de procedure na
      [4.1.2.4][ref4] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.2.4
    text: |-
      De netbeheerder bericht het niet uitvoeren van de switch naar aanleiding van [4.1.2.3][ref1] uiterlijk de werkdag
