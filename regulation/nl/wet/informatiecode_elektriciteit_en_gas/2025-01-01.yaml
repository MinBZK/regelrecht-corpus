    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 2.5.3
    text: |-
      De leverancier verstrekt tenminste eenmaal per vijf werkdagen, per actuele leveringsovereenkomst en per
      leveringsovereenkomst die in de toekomst start, de volgende contractgegevens aan de regionale netbeheerders voor
      registratie in het contracteindegegevensregister:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.3
  - number: 2.5.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.3
  - number: 2.5.3.b
    text: de einddatum van de leveringsovereenkomst indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.3
  - number: 2.5.3.c
    text: de opzegtermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.3
  - number: 2.5.3.d
    text: de bedrijfs-EAN-code van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.3
  - number: 2.5.4
    text: |-
      [Artikel 2.5.3][ref1] is niet van toepassing op aansluitingen waarvoor een beroep is gedaan op
      [artikel 95n van de Elektriciteitswet 1998][ref2] of op [artikel 52c van de Gaswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
