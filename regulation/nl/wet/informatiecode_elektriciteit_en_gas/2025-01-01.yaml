    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.7
  - number: 4.5.2.7.e
    text: de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.7
  - number: 4.5.2.7.f
    text: 'de procesidentificatie die van toepassing is, te weten: wijziging PV;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.7
  - number: 4.5.2.7.g
    text: 'indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.2.7
  - number: 4.5.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig
      [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.5.3.2
    text: |-
      De netbeheerder informeert de leverancier, nieuwe programmaverantwoordelijke en meetverantwoordelijke
      overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [4.5.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.6.1.1
    text: |-
      De aangeslotene wijst een nieuwe meetverantwoordelijke aan, machtigt de nieuwe meetverantwoordelijke voor het
      afwikkelen van het proces switch van meetverantwoordelijke, hierna te noemen MV-switch en verstrekt daarbij de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.1.1
  - number: 4.6.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.1.1
  - number: 4.6.1.1.b
    text: gewenste datum van ingang;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.1.1
  - number: 4.6.1.1.c
    text: voor zover van toepassing de wens voor een telemetriegrootverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.1.1
  - number: 4.6.1.2
    text: |-
      De nieuwe meetverantwoordelijke spreekt met de oude meetverantwoordelijke af wanneer en hoe de daadwerkelijke
      wisseling van het beheer en voor zover van toepassing van de meetinrichting(en) wordt uitgevoerd. Betreft
      het een telemetriegrootverbruikmeetinrichting, dan wordt tevens afgesproken op welke wijze de data van
      de dag van verwisseling tussen beide meetverantwoordelijken wordt uitgewisseld. De data-aanlevering van
      telemetriegrootverbruikmeetinrichtingen op de dag van de switch is een verantwoordelijkheid van de nieuwe
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.1.2
  - number: 4.6.2.1
    text: |-
      Op grond van de in [4.6.1.1][ref1] bedoelde machtiging stuurt de nieuwe meetverantwoordelijke op de mutatiedatum
      en ten hoogste twintig werkdagen voor de beoogde mutatiedatum een melding MV-switch naar de netbeheerder. In de
      melding MV-switch is opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.1.a
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
  - number: 4.6.2.1.b
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
  - number: 4.6.2.1.c
    text: 'de procesidentificatie die van toepassing is, te weten: “MV-switch”;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
  - number: 4.6.2.1.d
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
  - number: 4.6.2.1.e
    text: de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
  - number: 4.6.2.1.f
    text: 'indien de meetverantwoordelijke dat wenst op te geven: het referentienummer van de meetverantwoordelijke.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.1
  - number: 4.6.2.2
    text: |-
      Naar aanleiding van de in [4.6.2.1][ref1] bedoelde melding controleert de netbeheerder of:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.2.a
    text: de melding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.2.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.2.c
    text: |-
      de switchdatum ten opzichte van de datum van indienen niet in het verleden en ten hoogste twintig werkdagen in de
      toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.2.d
    text: de nieuwe meetverantwoordelijke geregistreerd staat in het MV-register;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.2.e
    text: er geen eerder bevestigde, doch niet geëffectueerde MV-switchmeldingen zijn met betrekking tot dezelfde EAN-code;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.2.f
    text: de aansluiting niet geblokkeerd is voor automatische mutaties;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.2.g
    text: 'indien het een elektriciteitsaansluiting betreft: de EAN-code een primair allocatiepunt betreft.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.2
  - number: 4.6.2.3
    text: |-
      Als de in [4.6.2.2][ref1] genoemde controles een negatief resultaat geven, wordt de procedure gestopt en wordt de
      nieuwe meetverantwoordelijke uiterlijk de werkdag na ontvangst van de melding MV-switch op de hoogte gesteld van de
      reden waarom de procedure is gestopt. In het bericht wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.c
    text: de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.d
    text: 'de procesidentificatie die van toepassing is, te weten: “MV-switch”;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e
    text: 'de reden van het niet uitvoeren van de MV-switch:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.1
    text: de melding MV-switch is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.3
    text: de switchdatum voldoet niet aan de gestelde indientermijn;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.4
    text: de meetverantwoordelijke komt niet voor in het MV-register;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.5
    text: de melding conflicteert met eerder ingediende, doch nog niet geëffectueerde meldingen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.6
    text: de aansluiting is geblokkeerd voor geautomatiseerde mutaties;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.e.7
    text: de EAN-code betreft geen primair allocatiepunt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.3.f
    text: 'indien aangeleverd in de switchmelding: het referentienummer van de meetverantwoordelijke.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.3
  - number: 4.6.2.4
    text: |-
      De netbeheerder verstuurt uiterlijk de werkdag na ontvangst van de melding MV-switch een verliesbericht aan de oude
      meetverantwoordelijke als alle controles, bedoeld in [4.6.2.2][ref1], een positief resultaat opleveren en vermeldt
      daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
  - number: 4.6.2.4.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
  - number: 4.6.2.4.c
    text: de bedrijfs-EAN-code van de oude meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
  - number: 4.6.2.4.d
    text: de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
  - number: 4.6.2.4.e
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
  - number: 4.6.2.4.f
    text: 'de procesidentificatie die van toepassing is, te weten: “MV-switch”.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4
  - number: 4.6.2.4a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, stuurt de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het in [artikel 4.6.2.4][ref1] bedoelde bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.5
    text: |-
      De netbeheerder verstuurt uiterlijk de werkdag na ontvangst van de melding MV-switch een verwervingsbericht aan de
      nieuwe meetverantwoordelijke als alle controles, bedoeld in [4.6.2.2][ref1], een positief resultaat opleveren en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5.c
    text: de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5.e
    text: de bedrijfs-EAN-code van de oude meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5.f
    text: de switchdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5.g
    text: 'de procesidentificatie die van toepassing is, te weten: “MV-switch”;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5.h
    text: 'indien aangeleverd in de switchmelding: het referentienummer van de nieuwe meetverantwoordelijke.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5
  - number: 4.6.2.5a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, stuurt de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het in [artikel 4.6.2.5][ref1] bedoelde bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.6.2.5a
