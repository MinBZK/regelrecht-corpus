        paragraaf: '10.1'
  - number: 2.15.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.3
  - number: 2.15.3.b
    text: |-
      de toestemmingssleutel van de opvraag zoals bedoeld in [2.2b.1, onderdeel d][ref1], of [2.5a.1, onderdeel d.][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.3
