    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.6.3
  - number: 2.6.3.b
    text: de leverancier op de desbetreffende aansluiting geregistreerd is geweest;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.6.3
  - number: 2.6.3.c
    text: |-
      voor de desbetreffende aansluiting een leveringsovereenkomst van de leverancier is geregistreerd in het
      contracteindegegevensregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.6.3
  - number: 2.6.3.d
    text: |-
      voor de desbetreffende aansluiting een melding als bedoeld in [2.5.5][ref1] van de leverancier is geregistreerd in
      het contracteindegegevensregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.6.3
