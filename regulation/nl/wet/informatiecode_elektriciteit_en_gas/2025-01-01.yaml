  - number: 2.5a.1
    text: |-
      Een leverancier die beschikt over een toestemming van de afnemer kan, ten behoeve van het doen van een aanbod voor
      een leveringsovereenkomst, bij de netbeheerder contracteindegegevens van de desbetreffende kleinverbruikaansluiting
      opvragen onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.1
  - number: 2.5a.1.a
    text: de bedrijfs-EAN-code van de opvragende leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.1
  - number: 2.5a.1.b
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.1
  - number: 2.5a.1.c
    text: 'indien de opvragende leverancier dat wenst op te geven: een referentienummer van de opvragende leverancier;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.1
  - number: 2.5a.1.d
    text: de toestemmingssleutel;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.1
  - number: 2.5a.1.e
    text: de klantsleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.1
  - number: 2.5a.2
    text: 'De regionale netbeheerder controleert of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.2
  - number: 2.5a.2.a
    text: de opvraag volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.2
  - number: 2.5a.2.b
    text: de EAN-code van de aansluiting is geregistreerd in het contracteindegegevensregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.2
  - number: 2.5a.2.c
    text: de bedrijfs-EAN-code van de opvragende leverancier voorkomt in het leveranciersregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.2
  - number: 2.5a.2.d
    text: de klantsleutel overeenkomt met de klant-sleutel voor deze aansluiting in de klantsleuteladministratie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.2
  - number: 2.5a.2.e
    text: de opvraag is voorzien van een toestemmingssleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.2
  - number: 2.5a.3
    text: |-
      Indien de controle één of meer negatieve resultaten oplevert, verstrekt de regionale netbeheerder de opgevraagde
      gegevens niet en stuurt hij de leverancier uiterlijk één werkdag na ontvangst van de opvraag een bericht onder
      vermelding van:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.3
  - number: 2.5a.3.a
    text: de bedrijfs-EAN-code van de opvragende leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.3
  - number: 2.5a.3.b
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5a.3
  - number: 2.5a.3.c
    text: 'indien aangeleverd bij de opvraag: het referentienummer van de opvragende leverancier;'
