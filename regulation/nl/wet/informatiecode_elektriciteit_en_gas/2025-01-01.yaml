        paragraaf: '2.7'
  - number: 2.7.8
    text: |-
      Een regionale netbeheerder kan de geldigheid van zijn gegevens in het netbeheerdersregister laten beëindigen onder
      voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.8
  - number: 2.7.8.a
    text: |-
      er in het aansluitingenregister geen actieve aansluitingen zijn opgenomen met verwijzingen naar de bedrijfs-EAN-
      code van de betreffende netbeheerder, en;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.8
  - number: 2.7.8.b
    text: |-
      er geen verplichtingen op gebied van facturering en afdracht, als bedoeld in [paragraaf 8.2][ref1], meer bestaan
      tussen de netbeheerder en enig leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.7.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 2.8.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en beheer van een register, hierna
      te noemen het leveranciersregister.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.1
  - number: 2.8.2
    text: |-
      De leveranciers stellen in het leveranciersregister, bedoeld in [2.8.1][ref1], aan de netbeheerders,
      programmaverantwoordelijken en meetverantwoordelijken, voor zover van toepassing voor elektriciteit en gas
      afzonderlijk per bedrijfs-EAN-code, de volgende gegevens online beschikbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: 2.8.2.a
    text: de bedrijfs-EAN-code waarmee de leverancier zich in het berichtenverkeer identificeert;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.b
    text: de datum van dagtekening;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.c
    text: de bedrijfsnaam;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.d
    text: de handelsna(a)men;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.e
    text: |-
      aan welke categorie(ën) de leverancier levert of wil gaan leveren, onderscheiden naar kleinverbruikers waarvoor een
      leveringsvergunning vereist is, kleinverbruikers waarvoor geen leveringsvergunning vereist is en grootverbruikers;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.f
    text: de adresgegevens;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.g
    text: het bankrekeningnummer;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.h
    text: het BTW-nummer;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.i
    text: het inschrijfnummer bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.j
    text: |-
      voor zover er sprake is van levering aan kleinverbruikers waarvoor een leveringsvergunning vereist is: het
      nummer van het Besluit op grond waarvan de Autoriteit Consument en Markt hem voor het betreffende product een
      leveringsvergunning voor kleinverbruikers heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.k
    text: de gegevens van de contactpersonen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.2.l
    text: |-
      indien de bedrijfs-EAN-code eerder gebruikt is door een andere leverancier, een verklaring met ingang van
      welke datum de leverancier met instemming van de oude leverancier, alle rechten en plichten ter zake overneemt
      respectievelijk heeft overgenomen.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.2
  - number: 2.8.3
    text: |-
      In het leveranciersregister, bedoeld in [2.8.1][ref1], wordt van de gegevens, bedoeld in [2.8.2][ref2], tevens de
      begindatum en, indien bekend, de einddatum van de geldigheid van de gegevens per gegeven vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: 2.8.4
    text: |-
      Bij een nieuwe registratie in het leveranciersregister, bedoeld in [2.8.1][ref1], stelt de leverancier de gegevens,
      bedoeld in [2.8.2, onderdelen a tot en met j en l][ref2] tenminste één maand en de gegevens, bedoeld in 2.8.2
      onderdeel k tenminste vijf werkdagen voor de beoogde ingangsdatum beschikbaar in het leveranciersregister onder
      vermelding van de eerste geldigheidsdatum van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: 2.8.5
    text: |-
      Bij de wijziging van een bestaande registratie in het leveranciersregister, bedoeld in [2.8.1][ref1], stelt
      de leverancier wijzigingen in de gegevens, bedoeld in [2.8.2, onderdelen a tot en met j en l][ref2] tenminste
      één maand en wijzigingen in de gegevens, bedoeld in 2.8.2 onderdeel k tenminste vijf werkdagen voor de beoogde
      wijzigingsdatum beschikbaar in het leveranciersregister onder vermelding van de ingangsdatum van de wijzigingen.
      De leveranciers geven opnieuw een verklaring als bedoeld in 2.8.2, onderdeel l, af indien de wijzigingen daartoe
      aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: 2.8.6
    text: |-
      In aanvulling op het beschikbaar stellen van de gegevens, bedoeld in [2.8.4][ref1] en [2.8.5][ref2], communiceert
      de leverancier de gegevens overeenkomstig de termijnen, bedoeld in 2.8.4 en 2.8.5, rechtstreeks aan de
      netbeheerders, geregistreerd in het netbeheerdersregister, bedoeld in [2.7.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.8.7
    text: |-
      De gegevens, bedoeld in [2.8.2][ref1] en [2.8.3][ref2], worden bewaard voor een termijn van minstens zeven jaar,
      ingaande vanaf de datum van beëindiging van de geldigheid van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: 2.8.8
    text: |-
      Een leverancier kan de geldigheid van zijn gegevens in het leveranciersregister laten beëindigen onder voorwaarde
      dat:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.8
  - number: 2.8.8.a
    text: |-
      er in het aansluitingenregister geen actieve aansluitingen zijn opgenomen met verwijzingen naar de bedrijfs-EAN-
      code van de betreffende leverancier, en;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.8
  - number: 2.8.8.b
    text: |-
      de leverancier aan alle verplichtingen op gebied van facturering en afdracht, als bedoeld in [paragraaf 8.2][ref1],
      heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.8.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 2.9.1.1
    text: |-
      De netbeheerder kan ten behoeve van de uitbetaling van compensatievergoedingen, bedoeld in [artikel 8.8 van de
      Netcode elektriciteit](onbekend) en [artikel 4.2.1 van de Aansluit- en transportcode gas RNB][ref1], tot uiterlijk
      dertig werkdagen nadat een storing is opgetreden de contactgegevens en bankrekeningnummers van de aangeslotenen
      behorende bij de getroffen kleinverbruikaansluitingen opvragen bij de leveranciers.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: '4'
  - number: 2.9.1.2
    text: |-
      De netbeheerder stuurt per leverancier, voor de aansluitingen waarop de leverancier op het moment van het optreden
      van de storing, bedoeld in [2.9.1.1][ref1], in het aansluitingenregister geregistreerd is, een verzoek om gegevens
      ten behoeve van compensatievergoeding voor de in 2.9.1.1 bedoelde aansluitingen. In dit bericht worden de volgende
      gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.9'
  - number: 2.9.1.2.a
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.2
  - number: 2.9.1.2.b
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.2
  - number: 2.9.1.2.c
    text: de datum waarop de storing heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.2
  - number: 2.9.1.2.d
    text: de EAN-code(s) van de getroffen aansluiting(en);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.2
  - number: 2.9.1.2.e
    text: 'indien de netbeheerder dat wenst op te geven: het referentienummer van de netbeheerder.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.1.2
  - number: 2.9.2.1
    text: |-
      De leverancier stuurt de netbeheerder uiterlijk tien werkdagen na ontvangst van de opvraag, bedoeld in
      [2.9.1.2][ref1], de gegevens ten behoeve van compensatievergoedingen. In dit bericht worden de volgende gegevens
      vermeld: a. de bedrijfs-EAN-code van de netbeheerder; b. de bedrijfs-EAN-code van de leverancier; c. indien
      aangeleverd in de opvraag: het referentienummer van de netbeheerder. Per aansluiting waarvoor de opvraag, bedoeld
      in [2.9.1.2][ref2], is ingediend: d. de EAN-code van de aansluiting; e. indien de leverancier, voor de datum waarop
      de storing heeft plaatsgevonden, op de betreffende aansluiting over een leveringsovereenkomst met de aangeslotene
      beschikt: 1° de achternaam, initialen en tussenvoegsels van de aangeslotene; 2° het correspondentieadres van de
      aangeslotene; 3° indien beschikbaar: het bankrekeningnummer van de aangeslotene. f. indien de leverancier, voor
      de datum waarop de storing heeft plaatsgevonden, op de betreffende aansluiting niet over een leveringsovereenkomst
      met de aangeslotene beschikt: 1° in plaats van de achternaam, initialen en tussenvoegsels van de aangeslotene wordt
      de waarde "nee" ingevuld; 2° er wordt geen correspondentieadres van de aangeslotene ingevuld; 3° er wordt geen
      bankrekeningnummer van de aangeslotene ingevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.9'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.9'
  - number: 2.10.1
    text: |-
      De netbeheerder is gerechtigd om maximaal twee keer per jaar een controle van de naamsgegevens van de aangeslotene,
      bedoeld in [2.1.3 onderdeel a][ref1], uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.10.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.10.2
    text: |-
      De netbeheerder vraagt voor de uitvoering van de controle, bedoeld in [2.10.1][ref1], per leverancier de
      naamsgegevens van de aangeslotenen op voor alle kleinverbruikaansluitingen waarvoor de leverancier in het
      aansluitingenregister verantwoordelijk is. In afwijking van [paragraaf 9.1][ref2] vindt deze informatie-
      uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.10.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.10'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 2.10.3
    text: De leverancier stuurt de naamsgegevens van de aangeslotenen voor alle gevraagde aansluitingen naar de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.10.3
  - number: 2.10.4
    text: |-
      De netbeheerder controleert de ontvangen naamsgegevens van de leverancier ten opzichte van de geregistreerde
      naam in het aansluitingenregister en stuurt de gegevens van de aansluitingen waarvoor verschillen in naam zijn
      geconstateerd aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.10.4
  - number: 2.10.5
    text: |-
      De leverancier stuurt voor de aansluitingen waarbij de netbeheerder een verschil in naam heeft geconstateerd een
      wijziging naam overeenkomstig [paragraaf 3.12][ref1] aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.10.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 2.10.6
    text: |-
      Voor elke controle, waarbij het percentage geconstateerde verschillen in naam groter is dan één procent van het
      totaal aantal kleinverbruikaansluitingen in de controle, is de netbeheerder voor de leverancier waarbij dit is
      geconstateerd gerechtigd een extra controle uit te voeren in aanvulling op het maximale aantal controles in de
      periode, bedoeld in [2.10.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.10.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.10'
  - number: 2.11.1
    text: |-
      De meetverantwoordelijke stuurt een opvraag gegevens van het primaire deel van de meetinrichting naar de
      netbeheerder en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.1
  - number: 2.11.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.1
  - number: 2.11.1.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.1
  - number: 2.11.1.c
    text: de bedrijfs-EAN-code van de meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.1
  - number: 2.11.1.d
    text: |-
      indien de opvragende meetverantwoordelijke dat wenst op te geven: het referentienummer van de
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.1
  - number: 2.11.2
    text: |-
      Naar aanleiding van de ontvangen opvraag gegevens van het primaire deel van de meetinrichting controleert de
      netbeheerder of:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.2
  - number: 2.11.2.a
    text: de melding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.2
  - number: 2.11.2.b
    text: de EAN-code van de aansluiting voor komt in zijn aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.2
  - number: 2.11.2.c
    text: de meetverantwoordelijke geregistreerd staat in het MV-register;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.2
  - number: 2.11.2.d
    text: |-
      de EAN-code betrekking heeft op een secundair allocatiepunt als bedoeld in [artikel 2.9 van de Netcode
      elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.2
  - number: 2.11.3
    text: |-
      De opvraag gegevens van het primaire deel van de meetinrichting wordt niet uitgevoerd als één of meer van de
      controles, bedoeld in [2.11.2][ref1], een negatief resultaat opleveren. De netbeheerder bericht dit uiterlijk
      de werkdag na ontvangst van de opvraag gegevens van het primaire deel van de meetinrichting aan de opvragende
      meetverantwoordelijke en vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.c
    text: de EAN-code van de opvragende meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.d
    text: 'de reden van het niet uitvoeren van de opvraag:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.d.1
    text: de opvraag van de gegevens van het primaire deel van de meetinrichting is niet volledig of syntactisch onjuist;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.d.2
    text: de EAN-code van de aansluiting is onbekend;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.d.3
    text: de meetverantwoordelijke komt niet voor in het MV-register;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.d.4
    text: |-
      de EAN-code heeft betrekking op een secundair allocatiepunt als bedoeld in [artikel 2.9 van de Netcode
      elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.3.e
    text: 'indien aangeleverd in de opvraag: het referentienummer van de meetverantwoordelijke;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.3
  - number: 2.11.4
    text: |-
      De netbeheerder stuurt de volgende gegevens uiterlijk vijf werkdagen na ontvangst van de opvraag, bedoeld in
      [2.11.1][ref1], aan de opvragende meetverantwoordelijke indien alle controles, bedoeld in [2.11.2][ref2], een
      positief resultaat opleveren en de opvraag betrekking heeft op een elektriciteitsaansluiting:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.4.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.4.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.4.c
    text: de bedrijfs-EAN-code van de meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.4.d
    text: het tijdstip van verzending van het bericht;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.4.e
    text: 'het product dat op de desbetreffende aansluiting wordt geleverd, zijnde: elektriciteit;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.4.f
    text: de benodigde technische gegevens van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.4.g
    text: 'indien aangeleverd in de opvraag: het referentienummer van de meetverantwoordelijke;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.4
  - number: 2.11.5
    text: |-
      De netbeheerder stuurt de volgende gegevens uiterlijk vijf werkdagen na ontvangst van de opvraag, bedoeld in
      [2.11.1][ref1], aan de opvragende meetverantwoordelijke indien alle controles, bedoeld in [2.11.2][ref2], een
      positief resultaat opleveren en de opvraag betrekking heeft op een gasaansluiting:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.5.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.5.b
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.5.c
    text: de bedrijfs-EAN-code van de meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.5.d
    text: het tijdstip van verzending van het bericht;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.5.e
    text: 'het product dat op de desbetreffende aansluiting wordt geleverd, zijnde: gas;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.5.f
    text: |-
      de benodigde technische gegevens van de aansluiting waaronder of de meter zich in de geregelde of ongeregelde druk
      bevindt en wat de waarde van de druk is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.5.g
    text: 'indien aangeleverd in de opvraag: het referentienummer van de meetverantwoordelijke;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.5
  - number: 2.11.6
    text: |-
      De netbeheerder verzendt uiterlijk de werkdag volgend op de dag dat één of meer technische gegevens van het
      primaire deel van de meetinrichting zijn gewijzigd, de desbetreffende gegevens aan de meetverantwoordelijke en
      vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.6
  - number: 2.11.6.a
    text: de reden van verzending van de gegevens, te weten ‘wijziging gegevens’;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.6
  - number: 2.11.6.b
    text: |-
      indien het een elektriciteitsaansluiting betreft: de gegevens bedoeld in [2.11.4][ref1], met uitzondering van
      onderdeel g;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.6.c
    text: |-
      indien het een gasaansluiting betreft: de gegevens bedoeld in [2.11.5][ref1], met uitzondering van onderdeel g.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.11.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.12.1
    text: |-
      Een aangeslotene met een grootverbruikaansluiting elektriciteit met een aansluitcapaciteit groter dan of gelijk aan
      10 MVA of een grootverbruikaansluiting gas met de afnamecategorie GGV heeft het recht om zijn aansluiting door de
      netbeheerder in het aansluitingenregister te laten blokkeren voor de automatische verwerking van mutatieprocessen,
      bedoeld in hoofdstuk vier.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.12.1
  - number: 2.12.2
    text: |-
      Een aangeslotene mandateert een leverancier om de blokkade op automatische verwerking, bedoeld in [2.12.1][ref1],
      tijdelijk op te laten heffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.12.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.12.3
    text: |-
      Een leverancier, die beschikt over een mandaat van een aangeslotene bedoeld in [2.12.2][ref1] om een mutatie
      bedoeld in hoofdstuk vier door te voeren, verzoekt de netbeheerder om de blokkade voor automatische mutaties
      voorafgaand aan het indienen van een melding van een mutatie tijdelijk op te heffen. In afwijking van
      [paragraaf 9.1][ref2] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.12.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 2.12.4
    text: |-
      Na het uitvoeren van de mutatie, bedoeld in [2.12.3][ref1], wordt de aansluiting door de netbeheerder opnieuw
      geblokkeerd voor automatische mutaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.12.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.13.1
    text: |-
      De netbeheerder van het landelijk gastransportnet beheert voor aansluitingen van direct aangeslotenen op het
      landelijk gastransportnet die exclusief gas afnemen voor eigen verbruik, een register, hierna te noemen het
      aansluitingenregister landelijk gastransportnet. In dit register worden per aansluiting de volgende gegevens
      vastgelegd:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.b
    text: de naam van de direct aangeslotene;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.c
    text: de identificatie van de programmaverantwoordelijke(n) op de desbetreffende aansluiting (bedrijfs-EAN-code);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.d
    text: de naam van de programmaverantwoordelijke(n);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.e
    text: de identificatie van de leverancier(s) behorende bij de desbetreffende aansluiting (bedrijfs-EAN-code);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.f
    text: de naam van de leverancier(s);
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.g
    text: |-
      de ingangsdatum van de bij de aansluiting behorende relatie(s) programmaverantwoordelijke(n) enerzijds en de
      leverancier(s) anderzijds;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.1.h
    text: opmerkingen (vrij tekstveld).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.1
  - number: 2.13.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de leverancier en de programmaverantwoordelijke
      ten minste eenmaal per jaar schriftelijk over de voor de leverancier respectievelijk programmaverantwoordelijke
      relevante stamgegevens van de hen betreffende aansluitingen als bedoeld in [2.13.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.13.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 2.14.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een centrale
      administratie van klantsleutels, hierna te noemen de klantsleuteladministratie.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.1
  - number: 2.14.2
    text: 'De klantsleuteladministratie heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.2
  - number: 2.14.2.a
    text: |-
      de afnemers die beschikken over een aansluiting als bedoeld in [artikel 95a van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 2.14.2.b
    text: |-
      de afnemers die beschikken over een aansluiting als bedoeld in [artikel 43 van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 2.14.3
    text: |-
      De leverancier verstrekt uiterlijk de volgende werkdag nadat een mutatie heeft plaatsgevonden als bedoeld in
      [3.1.3.1][ref1] of [3.3.3.1][ref2], of nadat de door hem geadministreerde sleutelgegevens zijn gewijzigd, de hem
      bekende klantsleutel aan de regionale netbeheerder onder vermelding van de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 2.14.3.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.3
  - number: 2.14.3.b
    text: de bedrijfs-EAN-code van de leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.3
  - number: 2.14.3.c
    text: 'Indien de leverancier daarover beschikt: de laatste drie cijfers van de IBAN van de afnemer op de aansluiting;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.3
  - number: 2.14.3.d
    text: 'indien de leverancier daarover beschikt: de maand en dag van de geboortedatum van de afnemer op de aansluiting;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.3
  - number: 2.14.3.e
    text: 'indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.3
  - number: 2.14.4
    text: |-
      De regionale netbeheerder verwerkt de in [2.14.3][ref1] bedoelde gegevens niet, en bericht de leverancier hierover
      binnen een werkdag, ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.14'
  - number: 2.14.4.a
    text: de gegevensverstrekking syntactisch onjuist of onvolledig is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.4
  - number: 2.14.4.b
    text: de EAN-code van de aansluiting niet voorkomt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.4
  - number: 2.14.4.c
    text: de verstrekkende leverancier niet de actuele leverancier is.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.4
  - number: 2.14.5
    text: |-
      Tenzij [2.14.4][ref1] van toepassing is, verwerkt de regionale netbeheerder de in [2.14.3][ref2] bedoelde gegevens
      binnen een werkdag in de klantsleuteladministratie en bericht de leverancier hierover onmiddellijk nadien.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.14'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.14'
  - number: 2.14.6
    text: |-
      Indien de netbeheerder een leveranciersswitch, uithuizing, inhuizing of een verwijdering van een aansluiting
      in het aansluitingenregister heeft geëffectueerd op grond van [3.1.3.1][ref1], [3.2.3.1][ref2], [3.3.3.1][ref3]
      respectievelijk [3.10.1.4][ref4], verwijdert de netbeheerder onmiddellijk nadien de bij de desbetreffende
      aansluiting behorende klantsleutel uit de klantsleuteladministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.14.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: 2.15.1
    text: |-
      De leverancier is verantwoordelijk voor de inrichting en het beheer van een administratie van toestemmingen
      die kleinverbruikers hem hebben verstrekt voor het doen van opvragingen als bedoeld in [2.2b.1][ref1] of
      [2.5a.1][ref2], hierna te noemen de toestemmingenadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 2.15.2
    text: 'De toestemmingenadministratie bevat minimaal de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.a
    text: de toestemmingssleutel;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.b
    text: de naam van de desbetreffende kleinverbruiker;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.c
    text: de datum waarop de toestemming door de leverancier is ontvangen;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.d
    text: het doel van de toestemming;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.15.2
  - number: 2.15.2.e
