        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.1.3.2
    text: |-
      De netbeheerder informeert de nieuwe leverancier, nieuwe programmaverantwoordelijke en meetverantwoordelijke
      overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [4.1.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en het verbruik behorend bij het switchproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.2.1.1
    text: |-
      De aangeslotene machtigt zijn actuele leverancier om namens hem de uithuizing af te wikkelen. Op grond van
      deze machtiging stuurt de actuele leverancier tenminste vijf werkdagen en ten hoogste twintig werkdagen voor de
      uithuizingsdatum namens deze aangeslotene een uithuizingsmelding naar de netbeheerder. De uithuizingsmelding bevat
      de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.1.1
  - number: 4.2.1.1.a
    text: de EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.1.1
  - number: 4.2.1.1.b
    text: de uithuizingsdatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.1.1
  - number: 4.2.1.1.c
    text: de bedrijfs-EAN-code van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.1.1
  - number: 4.2.1.1.d
    text: de bedrijfs-EAN-code van de actuele leverancier;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.1.1
  - number: 4.2.1.1.e
    text: 'indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.1.1
  - number: 4.2.2.1
    text: 'Naar aanleiding van de uithuizingsmelding controleert de netbeheerder of:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.a
    text: de uithuizingsmelding volledig en syntactisch correct is;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.b
    text: de EAN-code van de aansluiting voor komt in het aansluitingenregister;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.c
    text: |-
      de uithuizingsdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig
      werkdagen in de toekomst ligt;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.d
    text: |-
      er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting met een eerdere datum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.e
    text: 'de uithuizingsmelding is ingediend door:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.e.i
    text: de in het aansluitingenregister vermelde leverancier, of
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.e.ii
    text: |-
      bij een aansluiting zonder geregistreerde leverancier; de leverancier van een bevestigde inhuizing met dezelfde
      mutatiedatum;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.1.f
    text: de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.1
  - number: 4.2.2.2
    text: |-
      Als alle controles uit [4.2.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.2.2.4][ref2]. Als dat niet het geval is, wordt de uithuizing niet uitgevoerd en wordt de procedure na
      [4.2.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.2.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de uithuizing naar aanleiding van [4.2.2.2][ref1] uiterlijk de
      werkdag na ontvangst van de uithuizingsmelding aan de leverancier die de uithuizingsmelding heeft ingediend en
      vermeldt daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.2.2.3
