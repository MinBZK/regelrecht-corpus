  - number: 2.2c.1
    text: |-
      Een leverancier die beschikt over een leveringsovereenkomst, maar nog niet de actuele leverancier is op de
      desbetreffende kleinverbruikaansluiting, en (i) wiens leveringsovereenkomst voor de desbetreffende kleinverbruiker
      is geregistreerd in het contracteindegegevensregister, of (ii) wiens melding als bedoeld in [2.5.5][ref1] voor
      de desbetreffende kleinverbruiker is geregistreerd in het contracteindegegevensregister, kan bij de netbeheerder
      gegevens horend bij de desbetreffende kleinverbruikaansluiting opvragen onder vermelding van: a. de bedrijfs-EAN-
      code van de opvragende leverancier; b. de EAN-code van de aansluiting; c. indien de leverancier dat wenst op te
      geven: een referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.2c.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.2c.2
    text: |-
