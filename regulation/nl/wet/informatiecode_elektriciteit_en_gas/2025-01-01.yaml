  - number: 5.5.1.1
    text: |-
      Het dispuutproces wordt gebruikt om geschillen op te lossen tussen leveranciers en regionale netbeheerders
      over alle vastgestelde meterstanden, bedoeld in [5.1.3.4][ref1], [5.2.2.3][ref2] en [5.3.4.3][ref3], en, indien
      noodzakelijk, meterstanden te corrigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.5.1.2
    text: |-
      De dispuuttermijn eindigt op de laatste kalenderdag van de derde maand na de maand waarin de dag valt waarop de
      vastgestelde meterstand betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.2
  - number: 5.5.1.3
    text: |-
      De regionale netbeheerder of leverancier die het dispuutproces start (hierna te noemen: de wederpartij) heeft tot
      twintig werkdagen, voordat de dispuuttermijn verstrijkt, de tijd om een vastgestelde meterstand te beoordelen en op
      basis van de tabel in [bijlage 5][ref1] te besluiten om in dispuut te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.5.1.4
    text: |-
      De wederpartij stuurt uiterlijk twintig werkdagen, voordat de dispuuttermijn verstrijkt, een dispuutmelding met
      een alternatieve meterstand naar de leverancier die de meterstand, bedoeld in [5.1.3.4][ref1] of [5.3.4.3][ref2],
      of naar de regionale netbeheerder die de meterstand, bedoeld in [5.2.2.3][ref3], heeft vastgesteld waartegen in
      dispuut wordt getreden (hierna te noemen: de initiërende partij). De meegestuurde alternatieve meterstand geldt
      voor de mutatiedatum waarop het dispuut betrekking heeft. In dit bericht worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5.1.4.a
    text: EAN-code van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.b
    text: 'de reden van het verzenden van het bericht, te weten: "meterstand in dispuut";'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.c
    text: de bedrijfs-EAN-code van de wederpartij;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.d
    text: de bedrijfs-EAN-code van de initiërende partij;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.e
    text: de van toepassing zijnde procesidentificatie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.f
    text: de identificatie van de meetinrichting;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.g
    text: 'per telwerk de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.g.1
    text: de meterstand;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.g.2
    text: de datum waarop de meterstand betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.g.3
    text: aanduiding van de herkomst van de meterstand;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.g.4
    text: 'in geval van elektriciteit: de telwerkindicatie;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.h
    text: 'indien de wederpartij dit wenst op te geven: het referentienummer van de wederpartij;'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.1.4.i
    text: 'indien de wederpartij dit wenst op te geven: een toelichting.'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.1.4
  - number: 5.5.2.1
    text: |-
      De initiërende partij beoordeelt uiterlijk vijf werkdagen na ontvangst van de dispuutmelding op basis van de tabel
      in [bijlage 5][ref1] de ontvangen alternatieve meterstand van de wederpartij en besluit tot:


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.5.2.1.a
    text: |-
      het accepteren van de alternatieve meterstand en het proces wordt vervolgd vanaf [5.5.4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.1.b
    text: |-
      het niet accepteren van de alternatieve meterstand, zodat een overleg, zoals bedoeld in [5.5.2.2][ref1],
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.2
    text: |-
      Het overleg tussen de initiërende partij en wederpartij vindt plaats binnen vijf werkdagen na ontvangst van de
      alternatieve meterstand. Dit overleg kan leiden tot:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.2
  - number: 5.5.2.2.a
    text: |-
      overeenstemming over de vast te stellen meterstand en het proces wordt vervolgd vanaf [5.5.4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.2.b
    text: |-
      geen overeenstemming over de vast te stellen meterstand en een fysieke opname op basis van kosten ongelijk, bedoeld
      in [5.5.3.1][ref1], wordt ingepland.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.3
    text: |-
      De alternatieve meterstand is geaccepteerd door de initiërende partij, indien de initiërende partij niet tijdig
      heeft gereageerd op de ontvangst van de dispuutmelding van de wederpartij, als bedoeld in [5.5.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.4
    text: |-
      Indien de opnamedatum van de alternatieve stand die op basis van de in [bijlage 5][ref1] opgenomen beslistabel
      wint, ligt buiten een periode van drie maanden voor de mutatiedatum van de vastgestelde stand waarop het dispuut
      betrekking heeft, dan kan de initiërende partij de dispuutmelding afwijzen, zodat een overleg, zoals bedoeld in
      [5.5.2.2][ref2], noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.1
    text: |-
      Na instemming van de initiërende partij en de wederpartij over de kosten van de fysieke opname op basis kosten
      ongelijk, laat de initiërende partij de fysieke opname naar aanleiding van [5.5.2.2, onderdeel b][ref1], uiterlijk
      vijf werkdagen voor het verstrijken van de dispuuttermijn uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.2
    text: |-
      De alternatieve meterstand van de wederpartij, bedoeld in [5.5.1.4][ref1], wordt geaccepteerd door de initiërende
      partij indien niet tijdig een fysieke opname op basis van kosten ongelijk heeft kunnen plaatsvinden, bedoeld in
      [5.5.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.3
    text: 'De initiërende partij accepteert:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.3
  - number: 5.5.3.3.a
    text: 'de oorspronkelijke meterstand op:'
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.3
  - number: 5.5.3.3.a.(i)
    text: |-
      een levertelwerk, indien deze ligt tussen de op basis van interpolatie van de fysieke opname op basis kosten
      ongelijk afgeleide meterstand + 15% * SJV / vermenigvuldigingsfactor en de op basis van interpolatie van de fysieke
      opname op basis kosten ongelijk afgeleide meterstand – 15% * SJV / vermenigvuldigingsfactor;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.3
  - number: 5.5.3.3.a.(ii)
    text: |-
      een teruglevertelwerk (elektriciteit), indien deze ligt tussen de op basis van interpolatie van de fysieke
      opname op basis kosten ongelijk afgeleide meterstand + 15% * 5000 kWh / vermenigvuldigingsfactor en de op
      basis van interpolatie van de fysieke opname op basis kosten ongelijk afgeleide meterstand – 15% * 5000 kWh /
      vermenigvuldigingsfactor.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.3
  - number: 5.5.3.3.b
    text: |-
      de op basis van interpolatie van de fysieke opname op basis kosten ongelijk afgeleide meterstand op de betreffende
      mutatiedatum, indien de oorspronkelijke meterstand buiten de grenzen, gesteld in [5.5.3.3, onderdeel a][ref1],
      valt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.4
    text: |-
      De initiërende partij meldt het resultaat van de beoordeling uit [5.5.3.3][ref1] uiterlijk vijf werkdagen voor het
      verstrijken van de dispuuttermijn aan de wederpartij en het proces wordt vervolgd vanaf [5.5.4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.4.1
    text: |-
      De initiërende partij stelt zo snel mogelijk doch uiterlijk vijf werkdagen voor het verstrijken van de
      dispuuttermijn een meterstand vast, indien de oorspronkelijk vastgestelde meterstand wordt herzien.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.4.1
  - number: 5.5.4.2
    text: |-
      De initiërende partij, indien deze een leverancier is, verstuurt de in [5.5.4.1][ref1] vastgestelde meterstand
      binnen één werkdag na de vaststelling doch uiterlijk vijf werkdagen voor het verstrijken van de dispuuttermijn naar
      de regionale netbeheerder overeenkomstig [paragraaf 5.1.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.5.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.1.1
    text: |-
      Indien de in [3.14.5.3][ref1] bedoelde correctiemelding leidt tot een toewijzing van verbruik
      dat niet behoort tot de betreffende programmaverantwoordelijke, verrekenen de leverancier en
      programmaverantwoordelijke de in de reconciliatie toegewezen verbruiken tot maximaal het verbruik
      voor een periode als bedoeld in [artikel 28 van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 307, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel307
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.14'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '307'
  - number: 5.6.1.2
    text: |-
      Tenzij betrokken partijen ter zake een dispuutproces hebben afgerond als bedoeld in [paragraaf 5.5][ref1],
      verrekenen de betrokken leveranciers of de leverancier en netbeheerder het ten onrechte toegewezen verbruik
      volledig indien:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.6.1.2.a
    text: |-
      een verbruik is toegewezen als bedoeld in [paragraaf 5.3][ref1] dat geheel of gedeeltelijk behoort tot de periode
      van levering van de wederpartij; en


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.6.1.2.b
    text: het ten onrechte toegewezen verbruik boven de 1.000 kWh of 500 m3 uitkomt.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.2
  - number: 5.6.1.3
    text: |-
      Indien het in [5.6.1.2][ref1] bedoelde verbruik een positief verbruik betreft, vindt de verrekening plaats voor
      zover het verbruik een periode beslaat als bedoeld in [artikel 28 van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 307, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel307
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '307'
  - number: 5.6.1.4
    text: |-
      In afwijking van [5.6.1.2][ref1] verrekenen de betrokken leveranciers of de leverancier en netbeheerder het te
      veel of te weinig geregistreerde verbruik als bedoeld in [5.3.2.6][ref2] of [5.3.3.3][ref3] ook ingeval betrokken
      partijen een dispuutproces hebben afgerond. De voorwaarden bedoeld in [5.6.1.2, onderdelen a en b][ref4], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.1.5
    text: |-
      Indien een switch van leverancier heeft plaatsgevonden als bedoeld in [paragraaf 3.1][ref1] en er ingevolge
      [5.6.1.2][ref2], onderdeel b, geen verrekening plaatsvindt, verrekent de actuele leverancier het te veel
      gefactureerde verbruik met de betreffende afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel5.6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.6.1.6
    text: |-
      Indien de melding zoals bedoeld in [3.14.1.2][ref1] en [3.14.3.3][ref2] niet tijdig wordt beantwoord of de
      correctiemelding zoals bedoeld in [3.14.1.4][ref3], [3.14.2.2][ref4], [3.14.3.5][ref5] en [3.14.4.2][ref6]
      niet tijdig is ingediend, worden de nettarieven verrekend die behoren bij de periode tussen het moment waarop
      ten onrechte is gemuteerd ingevolge [paragraaf 3.1 tot en met paragraaf 3.4][ref7] en de mutatiedatum van de
      correctiemelding.


