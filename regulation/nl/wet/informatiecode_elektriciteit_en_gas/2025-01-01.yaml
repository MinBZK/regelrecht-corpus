        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.3.2
    text: |-
      De leverancier die constateert dat het een onterechte inhuizing betreft op een aansluiting, waarop geen
      leverancier is geregistreerd in het aansluitingenregister dient uiterlijk één werkdag nadien, ter correctie een
      uithuizingsmelding in overeenkomstig [paragraaf 3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.14.3.3
    text: |-
      De leverancier die constateert dat er vermoedelijk sprake is van een onterechte inhuizing op een aansluiting,
      waarop een leverancier is geregistreerd in het aansluitingenregister, neemt hierover binnen vijf werkdagen contact
      op met de andere betrokken leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling
      niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.3.4
    text: |-
      De leverancier die de in [3.14.3.3][ref1] bedoelde melding heeft ontvangen, reageert binnen 10 werkdagen en geeft
      daarbij aan of al dan niet sprake is van een onterechte inhuizing. In afwijking van [paragraaf 9.1][ref2] vindt
      deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel3.14.3.4
