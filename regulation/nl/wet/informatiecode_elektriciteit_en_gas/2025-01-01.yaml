  - number: 10.1.5.2
    text: |-
      De leverancier bewaart de hem op grond van [2.2b.4][ref1] verstrekte gegevens ten hoogste drie maanden voor het
      doen van een aanbod voor een leveringsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.5.2
