  - number: 3.14.3.6
    text: |-
      Indien door de uitvoering van de onterechte inhuizing het in [2.1.4, onderdeel b][ref1], bedoelde kenmerk is
      gewijzigd, met als gevolg dat de meetinrichting op afstand uitgelezen mag worden, meldt de leverancier dit
