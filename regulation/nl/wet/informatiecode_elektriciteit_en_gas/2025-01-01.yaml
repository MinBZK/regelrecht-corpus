        bwb_id: BWBR0037934
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.2.3
    text: |-
      Netbeheerders melden de gedragscode, bedoeld in [10.2.1][ref1], in overeenstemming met de Algemene verordening
      gegevensbescherming aan bij het Autoriteit persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.2.3
    references:
