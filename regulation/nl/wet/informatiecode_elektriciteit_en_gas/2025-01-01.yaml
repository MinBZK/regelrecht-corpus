        paragraaf: '6.4'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.6
    text: |-
      Een betrokken partij die een overleg wenst tussen aangeslotene(n), netbeheerder(s), meetverantwoordelijke(n),
      programmaverantwoordelijke(n) en leverancier(s) om overeenstemming te bereiken over de schatting van het vast te
      stellen gecorrigeerde volume [m3(n)], verzoekt de meetverantwoordelijke binnen tien werkdagen na ontvangst van de
      in [6.4.4.1][ref1], [6.4.4.2][ref2] of [6.4.4.4][ref3] bedoelde gegevens dit overleg te organiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.7
    text: |-
      De meetverantwoordelijke organiseert het overleg bedoeld in [6.4.4.6][ref1], dat binnen een maand na ontvangst van
      een verzoek tot overleg, dient plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.8
    text: |-
      Als er binnen drie maanden na verstrekking van de gegevens, bedoeld in [6.4.4.3][ref1], geen overeenstemming
      is bereikt tussen de betrokken partijen over het te hanteren volume [m3(n)], dan beslist of beslissen de
      netbeheerder(s), binnen één werkdag nadien, over het te communiceren nieuwe volume [m3(n)] en verzendt of verzenden
      deze aan de meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.9
    text: |-
      Indien het, op basis van [6.4.4.7][ref1] of [6.4.4.8][ref2] vastgestelde volume [m3(n)], afwijkt van het
      volume bedoeld in [6.4.4.3][ref3], verzendt de meetverantwoordelijke binnen vijf werkdagen na vaststelling
      een nieuw meetcorrectierapport of een bericht als bedoeld in [6.4.4.3][ref4], aan de aangeslotene(n),
      programmaverantwoordelijke(n), leverancier(s) of netbeheerder(s), per periode waarvoor de betreffende partij
      verantwoordelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.4.10
    text: |-
      Indien de nieuwe meetgegevens bedoeld in [6.4.4.5][ref1], [6.4.4.6][ref2] of [6.4.4.8][ref3] zijn geaccepteerd,
      overeengekomen of vastgesteld, verzendt de meetverantwoordelijke zo spoedig mogelijk doch uiterlijk binnen
      vijf werkdagen, aan de netbeheerder per verbruiksperiode een meetdatabericht, bedoeld in [6.1.1.3][ref4],
      [6.4.2.4][ref5] of [6.4.2.11][ref6], met de nieuwe meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.4.4.10
    references:
      - id: ref1
