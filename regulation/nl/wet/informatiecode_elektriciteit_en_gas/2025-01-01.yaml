        artikel: '10'
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.4b.4
    text: |-
      De regionale netbeheerder bewaart de door hem op grond van [2.2b.1][ref1] of [2.5a.1][ref2] ontvangen
      toestemmingssleutel ten hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4b.4
