    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.6
  - number: 6.9.2.6.d
    text: |-
      Om te komen tot een zo correct mogelijke verrekening, als bedoeld in lid a, zullen de betrokken marktpartijen
      elkaar, indien mogelijk, de voor de verrekening benodigde meetdata verstrekken.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.6
  - number: 6.9.2.7
    text: |-
      De wederpartij accepteert het verrekenverzoek als bedoeld in [6.9.2.3][ref1], tenzij de wederpartij uiterlijk
      binnen één maand het verzoek gemotiveerd afwijst met vermelding van één of meer van de volgende redenen:


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.9.2.7
    references:
