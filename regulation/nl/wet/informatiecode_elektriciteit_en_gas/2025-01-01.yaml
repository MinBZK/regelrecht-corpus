      tariefperiode voor meetperiodes na 1 januari 2025 en [artikel 15.7, tweede lid van de Netcode elektriciteit]
      (onbekend) bedoelde gemiddelde gewogen day-ahead-clearingprijs per kalendermaand zonder onderscheid naar normaal en
      laaguren voor de meetperiodes voor 1 januari 2025.


