    text: |-
      In afwijking van [10.1.4b.5][ref1] bewaart de regionale netbeheerder de ontvangen toestemmingsgegevens zo lang als
      noodzakelijk is ten behoeve van aanhangige geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel10.1.4b.6
