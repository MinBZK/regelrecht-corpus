        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.10
    text: |-
      De netbeheerder beëindigt de procedure van een, voor dezelfde mutatiedatum, reeds bevestigde inhuizing of switch
      van leverancier, indien de inhuizing, bedoeld in [4.3.1.1][ref1], de reeds bevestigde switch van leverancier
      annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel4.3.2.10
    references:
      - id: ref1
