articles:
  - number: 1.1.1
    text: |-
      Deze code bevat de voorwaarden bedoeld in [artikel 54 eerste lid van de Elektriciteitswet 1998][ref1] en
      [artikel 22 eerste lid van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel22
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel1.1.1
