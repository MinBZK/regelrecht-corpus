  - number: 2.4.2.b
    text: de temperatuur gecorrigeerde profielfracties (TCPF) van elke afnamecategorie;
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.4.2
  - number: 2.4.2.c
    text: de gewogen gemiddelde calorische waarden per uur.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.4.2
  - number: 2.5.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een register,
      hierna te noemen het contracteindegegevensregister. Dit contracteindegegevensregister is alleen van toepassing op
      aansluitingen die vallen onder de werking van:
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.1
  - number: 2.5.1.a
    text: |-
      [artikel 95a van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 2.5.1.b
    text: |-
      [artikel 43 van de Gaswet][ref1].


