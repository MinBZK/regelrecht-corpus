    text: voor zover van toepassing de meterstand behorend bij de mutatiedatum.
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.7.4
  - number: 6.8.1
    text: |-
      De netbeheerder berekent een jaarverbruik voor de telemetriegrootverbruikaansluitingen binnen zijn netgebied
      overeenkomstig de methode beschreven in [B1a.3 van de Allocatiecode gas](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.8.1
  - number: 6.8.2
    text: |-
      Voor het berekenen van het jaarverbruik gebruikt de netbeheerder als grondslag de gegevens als bedoeld
      [6.5.2.2][ref1], uitgedrukt in [m3(n;35,17)]; hij gebruikt hiervoor de meest recente gegevens van de voorbije
      maanden met dien verstande dat de totale verbruiksperiode minstens 300 dagen beslaat, en de maanden januari en
      februari insluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.8.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.8.3
    text: |-
      De netbeheerder muteert het aansluitingenregister met het nieuw bepaalde jaarverbruik uiterlijk vijf werkdagen na
      overdracht van de meetgegevens bedoeld in [6.5.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6
    url: https://wetten.overheid.nl/BWBR0037934/2025-01-01#Artikel6.8.3
