        artikel: 1.1.8
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 1.1.10
    text: |-
      Daar waar in deze code de leverancier wordt genoemd, wordt programmaverantwoordelijke gelezen indien een
      aangeslotene met een grootverbruikaansluiting geen leverancier heeft. In dat geval machtigt de aangeslotene zijn
      programmaverantwoordelijke om de in deze code aan de leverancier toegeschreven handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.10
  - number: 1.1.11
    text: |-
      Daar waar in deze code sprake is van een programmaverantwoordelijke, wordt de BRP bedoeld voor elektriciteit en de
      erkende programmaverantwoordelijke voor gas.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.11
  - number: 1.1.12
    text: |-
      In deze code wordt, ingeval van een meetinrichting met meer dan één telwerk, met meterstand tevens meterstanden
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.12
  - number: 1.1.13
    text: |-
      De aansluitinggegevensprocessen uit [hoofdstuk 2][ref1], de mutatieprocessen uit de [hoofdstukken 3][ref2] en
      [4][ref3] en de meetgegevensprocessen uit de [hoofdstukken 5][ref4] en [6][ref5], en de [bijlagen 1][ref6]
      en [2][ref7], zijn, in geval van elektriciteit, van toepassing per allocatiepunt, met uitzondering van
      de [artikelen 2.1.1a][ref8], [2.1.1b][ref9], 2.1.1c, [2.1.3, onderdeel t][ref10], [2.1.5a][ref11], de
      [paragrafen 2.9][ref12] en [2.10][ref13], de [artikelen 6.2.2.2][ref14], [6.2.2.2a][ref15], [6.2.2.6][ref16] en
      [6.2.2.6a][ref17] en [paragraaf 6.3.11][ref18].


