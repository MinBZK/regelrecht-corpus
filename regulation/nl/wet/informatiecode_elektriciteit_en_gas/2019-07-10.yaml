        paragraaf: '4.3'
  - number: 4.2.2.7
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering, PV-switch of wijzigen verblijfsfunctie of complexbepaling, indien de uithuizing, bedoeld
      in [4.2.1.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.2.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.7
