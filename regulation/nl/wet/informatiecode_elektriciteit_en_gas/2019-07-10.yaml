        paragraaf: '4.3'
  - number: 4.3.2.4
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de inhuizingsmelding aan de
      nieuwe leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de inhuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. indien de inhuizingsmelding tevens een uithuizing van de oude leverancier tot gevolg heeft: de bedrijfs-EAN-code
      van de oude leverancier.

      g. de procesidentificatie die van toepassing is, te weten: inhuizing;

      h. indien aangeleverd in de inhuizingsmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.4
  - number: 4.3.2.5
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de inhuizingsmelding aan de
      nieuwe programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de inhuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: inhuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.5
  - number: 4.3.2.6
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de inhuizingsmelding indien
      aanwezig aan de meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de inhuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de programmaverantwoordelijke;

      f. indien de inhuizingsmelding tevens een uithuizing van de oude leverancier tot gevolg heeft: de bedrijfs-EAN-code
      van de oude leverancier.

      g. de procesidentificatie die van toepassing is, te weten: inhuizing;

      h. indien aangeleverd in de inhuizingsmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.6
  - number: 4.3.2.7
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de inhuizingsmelding aan de oude
      leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de oude leverancier;

      e. de bedrijfs-EAN-code van de nieuwe leverancier.

      f. de procesidentificatie die van toepassing is, te weten: uithuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.7
  - number: 4.3.2.8
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de inhuizingsmelding aan de oude
      programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: uithuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.8
  - number: 4.3.2.9
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      inhuizing, uithuizing, eindelevering, PV-switch of wijzigen verblijfsfunctie of complexbepaling, indien de
      inhuizing, bedoeld in [4.3.1.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.3.1.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.3.3.2
    text: |-
      De netbeheerder informeert de nieuwe leverancier en nieuwe programmaverantwoordelijke en, indien aanwezig,
      meetverantwoordelijke overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [4.3.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.3.3.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.4.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en het verbruik bij het inhuizingsproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.4.1.1
    text: |-
      De leverancier informeert de aangeslotene tenminste twintig werkdagen voorafgaand aan de eindeleveringsdatum over
      zijn voornemen om de levering te beëindigen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.1.1
  - number: 4.4.2.1
    text: |-
      De actuele leverancier stuurt tenminste twaalf werkdagen en ten hoogste twintig werkdagen voor de
      eindeleveringsdatum een eindeleveringsmelding naar de netbeheerder, waarin is vermeld:

      a. de EAN-code van de aansluiting,

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.2.1
  - number: 4.4.3.1
    text: |-
      Naar aanleiding van de eindeleveringsmelding controleert de netbeheerder of:

      a. de eindeleveringsmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de eindeleveringsdatum ten opzichte van de datum van indienen tenminste twaalf werkdagen en ten hoogste twintig
      werkdagen in de toekomst ligt;

      d. er geen eerder bevestigde, doch nog niet geëffectueerde switchmelding, inhuizingsmelding, uithuizingsmelding of
      eindeleveringsmelding is voor dezelfde aansluiting met dezelfde of een eerdere datum;

      e. de eindeleveringsmelding wordt ingediend door de in het aansluitingenregister vermelde leverancier;

      f. de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.1
  - number: 4.4.3.2
    text: |-
      Als alle controles uit [4.4.3.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.4.3.4][ref2]. Als dat niet het geval is, wordt de eindelevering niet uitgevoerd en wordt de procedure na
      [4.4.3.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.4.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.4.3.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.4.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.4.3.1
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.4.3.4
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.4.3.3
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.3.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de eindelevering naar aanleiding van [4.4.3.2][ref1] uiterlijk de
      werkdag na ontvangst van de eindeleveringsmelding aan de leverancier die de eindeleveringsmelding heeft ingediend
      en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de reden van het niet uitvoeren van de eindelevering:

      1° de eindeleveringsmelding is onvolledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de eindeleveringsdatum voldoet niet aan de gestelde indientermijn;

      4° de eindeleveringsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde switchmelding,
      inhuizingsmelding, uithuizingsmelding of eindeleveringsmelding met dezelfde of een eerdere datum;

      5° de indienende leverancier is onjuist;

      6° de aansluiting is geblokkeerd voor automatische mutaties;

      f. indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.4.3.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.4.3.2
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.3.4
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de
      actuele leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de procesidentificatie die van toepassing is, te weten: eindelevering;

      f. indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.4
  - number: 4.4.3.5
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de
      actuele programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: eindelevering;
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.5
  - number: 4.4.3.6
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de
      meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de procesidentificatie die van toepassing is, te weten: eindelevering;

      f. indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.6
  - number: 4.4.3.7
    text: |-
      Ingeval de aangeslotene voorafgaand aan de eindeleveringsdatum tijdig alsnog recht op levering verkrijgt, meldt de
      leverancier dit aan de netbeheerder:

      a. door middel van een inhuizingsmelding, bedoeld in [4.3.1.1][ref1], indien hij de actuele leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [4.3.2.1][ref2];

      b. door middel van een switchmelding, bedoeld in [4.1.1.1][ref3], indien hij een nieuwe leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [4.1.2.1][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.3.1.1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
