      De regionale netbeheerder voert bij het fysiek uit bedrijf nemen van de aansluiting een fysieke meteropname uit
      overeenkomstig [paragraaf 5.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
