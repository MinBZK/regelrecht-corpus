  - number: 2.8.8
    text: |-
      Een leverancier kan de geldigheid van zijn gegevens in het leveranciersregister laten beëindigen onder voorwaarde
      dat:

      a. er in het aansluitingenregister geen actieve aansluitingen zijn opgenomen met verwijzingen naar de bedrijfs-EAN-
      code van de betreffende leverancier, en;

      b. de leverancier aan alle verplichtingen op gebied van facturering en afdracht, als bedoeld in
      [paragraaf 8.2][ref1], heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.8.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 2.9.1.1
    text: |-
      De netbeheerder kan ten behoeve van de uitbetaling van compensatievergoedingen, bedoeld in [artikel 8.8 van de
      Netcode elektriciteit](onbekend) en [artikel 4.2.1 van de Aansluit- en transportcode gas RNB][ref1], tot uiterlijk
      dertig werkdagen nadat een storing is opgetreden de contactgegevens en bankrekeningnummers van de aangeslotenen
      behorende bij de getroffen kleinverbruikaansluitingen opvragen bij de leveranciers.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 4.2.1
  - number: 2.9.1.2
    text: |-
      De netbeheerder stuurt per leverancier, voor de aansluitingen waarop de leverancier op het moment van het optreden
      van de storing, bedoeld in [2.9.1.1][ref1], in het aansluitingenregister geregistreerd is, een verzoek om gegevens
      ten behoeve van compensatievergoeding voor de in 2.9.1.1 bedoelde aansluitingen. In dit bericht worden de volgende
      gegevens vermeld:

      a. de bedrijfs-EAN-code van de netbeheerder;

      b. de bedrijfs-EAN-code van de leverancier;

      c. de datum waarop de storing heeft plaatsgevonden;

      d. de EAN-code(s) van de getroffen aansluiting(en);

      e. indien de netbeheerder dat wenst op te geven: het referentienummer van de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.9.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.9.1.1
        hoofdstuk: '2'
        paragraaf: '2.9'
  - number: 2.9.2.1
    text: |-
      De leverancier stuurt de netbeheerder uiterlijk tien werkdagen na ontvangst van de opvraag, bedoeld in
      [2.9.1.2][ref1], de gegevens ten behoeve van compensatievergoedingen. In dit bericht worden de volgende gegevens
      vermeld:

      a. de bedrijfs-EAN-code van de netbeheerder;

      b. de bedrijfs-EAN-code van de leverancier;

      c. indien aangeleverd in de opvraag: het referentienummer van de netbeheerder.

      Per aansluiting waarvoor de opvraag, bedoeld in [2.9.1.2][ref2], is ingediend:

      d. de EAN-code van de aansluiting;

      e. indien de leverancier, voor de datum waarop de storing heeft plaatsgevonden, op de betreffende aansluiting over
      een leveringsovereenkomst met de aangeslotene beschikt:

      1° de achternaam, initialen en tussenvoegsels van de aangeslotene;

      2° het correspondentieadres van de aangeslotene;

      3° indien beschikbaar: het bankrekeningnummer van de aangeslotene.

      f. indien de leverancier, voor de datum waarop de storing heeft plaatsgevonden, op de betreffende aansluiting niet
      over een leveringsovereenkomst met de aangeslotene beschikt:

      1° in plaats van de achternaam, initialen en tussenvoegsels van de aangeslotene wordt de waarde "nee" ingevuld;

      2° er wordt geen correspondentieadres van de aangeslotene ingevuld;

      3° er wordt geen bankrekeningnummer van de aangeslotene ingevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.9.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.9.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.9.1.2
        hoofdstuk: '2'
        paragraaf: '2.9'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.9.1.2
        hoofdstuk: '2'
        paragraaf: '2.9'
  - number: 2.10.1
    text: |-
      De netbeheerder is gerechtigd om maximaal twee keer per jaar een controle van de naamsgegevens van de aangeslotene,
      bedoeld in [2.1.3 onderdeel a][ref1], uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.10.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.10.2
    text: |-
      De netbeheerder vraagt voor de uitvoering van de controle, bedoeld in [2.10.1][ref1], per leverancier de
      naamsgegevens van de aangeslotenen op voor alle kleinverbruikaansluitingen waarvoor de leverancier in het
      aansluitingenregister verantwoordelijk is. In afwijking van [paragraaf 9.1][ref2] vindt deze informatie-
      uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.10.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.10.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.10.1
        hoofdstuk: '2'
        paragraaf: '2.10'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 2.10.3
    text: De leverancier stuurt de naamsgegevens van de aangeslotenen voor alle gevraagde aansluitingen naar de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.10.3
  - number: 2.10.4
    text: |-
      De netbeheerder controleert de ontvangen naamsgegevens van de leverancier ten opzichte van de geregistreerde
      naam in het aansluitingenregister en stuurt de gegevens van de aansluitingen waarvoor verschillen in naam zijn
      geconstateerd aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.10.4
  - number: 2.10.5
    text: |-
      De leverancier stuurt voor de aansluitingen waarbij de netbeheerder een verschil in naam heeft geconstateerd een
      wijziging naam of verblijfsfunctie of complexbepaling overeenkomstig [paragraaf 3.12][ref1] aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.10.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 2.10.6
    text: |-
      Voor elke controle, waarbij het percentage geconstateerde verschillen in naam groter is dan één procent van het
      totaal aantal kleinverbruikaansluitingen in de controle, is de netbeheerder voor de leverancier waarbij dit is
      geconstateerd gerechtigd een extra controle uit te voeren in aanvulling op het maximale aantal controles in de
      periode, bedoeld in [2.10.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.10.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.10.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.10.1
        hoofdstuk: '2'
        paragraaf: '2.10'
  - number: 2.11.1
    text: |-
      De meetverantwoordelijke stuurt een opvraag gegevens van het primaire deel van de meetinrichting naar de
      netbeheerder en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de meetverantwoordelijke;

      d. indien de opvragende meetverantwoordelijke dat wenst op te geven: het referentienummer van de
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.11.1
  - number: 2.11.2
    text: |-
      Naar aanleiding van de ontvangen opvraag gegevens van het primaire deel van de meetinrichting controleert de
      netbeheerder of:

      a. de melding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in zijn aansluitingenregister;

      c. de meetverantwoordelijke geregistreerd staat in het MV-register;

      d. de EAN-code betrekking heeft op een secundair allocatiepunt als bedoeld in [artikel 2.9 van de Netcode
      elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.11.2
  - number: 2.11.3
    text: |-
      De opvraag gegevens van het primaire deel van de meetinrichting wordt niet uitgevoerd als één of meer van de
      controles, bedoeld in [2.11.2][ref1], een negatief resultaat opleveren. De netbeheerder bericht dit uiterlijk
      de werkdag na ontvangst van de opvraag gegevens van het primaire deel van de meetinrichting aan de opvragende
      meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de EAN-code van de opvragende meetverantwoordelijke;

      d. de reden van het niet uitvoeren van de opvraag:

      1° de opvraag van de gegevens van het primaire deel van de meetinrichting is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de meetverantwoordelijke komt niet voor in het MV-register;

      4° de EAN-code heeft betrekking op een secundair allocatiepunt als bedoeld in [artikel 2.9 van de Netcode
      elektriciteit](onbekend).

      e. indien aangeleverd in de opvraag: het referentienummer van de meetverantwoordelijke;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.11.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.11.2
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.4
    text: |-
      De netbeheerder stuurt de volgende gegevens uiterlijk vijf werkdagen na ontvangst van de opvraag, bedoeld in
      [2.11.1][ref1], aan de opvragende meetverantwoordelijke indien alle controles, bedoeld in [2.11.2][ref2], een
      positief resultaat opleveren en de opvraag betrekking heeft op een elektriciteitsaansluiting:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de meetverantwoordelijke;

      d. het tijdstip van verzending van het bericht;

      e. het product dat op de desbetreffende aansluiting wordt geleverd, zijnde: elektriciteit;

      f. de benodigde technische gegevens van de aansluiting;

      g. indien aangeleverd in de opvraag: het referentienummer van de meetverantwoordelijke;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.11.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.11.1
        hoofdstuk: '2'
        paragraaf: '2.11'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.11.2
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.5
    text: |-
      De netbeheerder stuurt de volgende gegevens uiterlijk vijf werkdagen na ontvangst van de opvraag, bedoeld in
      [2.11.1][ref1], aan de opvragende meetverantwoordelijke indien alle controles, bedoeld in [2.11.2][ref2], een
      positief resultaat opleveren en de opvraag betrekking heeft op een gasaansluiting:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de meetverantwoordelijke;

      d. het tijdstip van verzending van het bericht;

      e. het product dat op de desbetreffende aansluiting wordt geleverd, zijnde: gas;

      f. de benodigde technische gegevens van de aansluiting;

      g. indien aangeleverd in de opvraag: het referentienummer van de meetverantwoordelijke;


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.11.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.11.1
        hoofdstuk: '2'
        paragraaf: '2.11'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.11.2
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.11.6
    text: |-
      De netbeheerder verzendt uiterlijk de werkdag volgend op de dag dat één of meer technische gegevens van het
      primaire deel van de meetinrichting zijn gewijzigd, de desbetreffende gegevens aan de meetverantwoordelijke en
      vermeldt daarbij:

      a. de reden van verzending van de gegevens, te weten ‘wijziging gegevens’;

      b. indien het een elektriciteitsaansluiting betreft: de gegevens bedoeld in [2.11.4][ref1], met uitzondering van
      onderdeel g;

      c. indien het een gasaansluiting betreft: de gegevens bedoeld in [2.11.5][ref2], met uitzondering van onderdeel g.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.11.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.11.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.11.4
        hoofdstuk: '2'
        paragraaf: '2.11'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.11.5
        hoofdstuk: '2'
        paragraaf: '2.11'
  - number: 2.12.1
    text: |-
      Een aangeslotene met een grootverbruikaansluiting elektriciteit met een aansluitcapaciteit groter dan of gelijk aan
      10 MVA of een grootverbruikaansluiting gas met de afnamecategorie GGV heeft het recht om zijn aansluiting door de
      netbeheerder in het aansluitingenregister te laten blokkeren voor de automatische verwerking van mutatieprocessen,
      bedoeld in hoofdstuk vier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.12.1
  - number: 2.12.2
    text: |-
      Een aangeslotene mandateert een leverancier om de blokkade op automatische verwerking, bedoeld in [2.12.1][ref1],
      tijdelijk op te laten heffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.12.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.12.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.12.1
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.12.3
    text: |-
      Een leverancier, die beschikt over een mandaat van een aangeslotene bedoeld in [2.12.2][ref1] om een mutatie
      bedoeld in hoofdstuk vier door te voeren, verzoekt de netbeheerder om de blokkade voor automatische mutaties
      voorafgaand aan het indienen van een melding van een mutatie tijdelijk op te heffen. In afwijking van
      [paragraaf 9.1][ref2] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.12.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.12.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.12.2
        hoofdstuk: '2'
        paragraaf: '2.12'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 2.12.4
    text: |-
      Na het uitvoeren van de mutatie, bedoeld in [2.12.3][ref1], wordt de aansluiting door de netbeheerder opnieuw
      geblokkeerd voor automatische mutaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.12.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.12.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.12.3
        hoofdstuk: '2'
        paragraaf: '2.12'
  - number: 2.13.1
    text: |-
      De netbeheerder van het landelijk gastransportnet beheert voor aansluitingen van direct aangeslotenen op het
      landelijk gastransportnet die exclusief gas afnemen voor eigen verbruik, een register, hierna te noemen het
      aansluitingenregister landelijk gastransportnet. In dit register worden per aansluiting de volgende gegevens
      vastgelegd:

      a. de EAN-code van de aansluiting;

      b. de naam van de direct aangeslotene;

      c. de identificatie van de programmaverantwoordelijke(n) op de desbetreffende aansluiting (bedrijfs-EAN-code);

      d. de naam van de programmaverantwoordelijke(n);

      e. de identificatie van de leverancier(s) behorende bij de desbetreffende aansluiting (bedrijfs-EAN-code);

      f. de naam van de leverancier(s);

      g. de ingangsdatum van de bij de aansluiting behorende relatie(s) programmaverantwoordelijke(n) enerzijds en de
      leverancier(s) anderzijds;

      h. opmerkingen (vrij tekstveld).
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.13.1
  - number: 2.13.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de leverancier en de programmaverantwoordelijke
      ten minste eenmaal per jaar schriftelijk over de voor de leverancier respectievelijk programmaverantwoordelijke
      relevante stamgegevens van de hen betreffende aansluitingen als bedoeld in [2.13.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.13.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.13.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.13.1
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 2.14.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een centrale
      administratie van klantsleutels, hierna te noemen de klantsleuteladministratie.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.14.1
  - number: 2.14.2
    text: |-
      De klantsleuteladministratie heeft betrekking op:

      a. de afnemers die beschikken over een aansluiting als bedoeld in [artikel 95a van de Elektriciteitswet 1998][ref1];

      b. de afnemers die beschikken over een aansluiting als bedoeld in [artikel 43 van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.14.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 2.14.3
    text: |-
      De leverancier verstrekt uiterlijk de volgende werkdag nadat een mutatie heeft plaatsgevonden als bedoeld in
      [3.1.3.1][ref1] of [3.3.3.1][ref2], of nadat de door hem geadministreerde sleutelgegevens zijn gewijzigd, de hem
      bekende klantsleutel aan de regionale netbeheerder onder vermelding van de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de leverancier;

      c. Indien de leverancier daarover beschikt: de laatste drie cijfers van de IBAN van de afnemer op de aansluiting;

      d. indien de leverancier daarover beschikt: de maand en dag van de geboortedatum van de afnemer op de aansluiting;

      e. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.14.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.3.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.3.3.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 2.14.4
    text: |-
      De regionale netbeheerder verwerkt de in [2.14.3][ref1] bedoelde gegevens niet, en bericht de leverancier hierover
      binnen een werkdag, ingeval:

      a. de gegevensverstrekking syntactisch onjuist of onvolledig is;

      b. de EAN-code van de aansluiting niet voorkomt in het aansluitingenregister;

      c. de verstrekkende leverancier niet de actuele leverancier is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.14.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.14.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.14.3
        hoofdstuk: '2'
        paragraaf: '2.14'
  - number: 2.14.5
    text: |-
      Tenzij [2.14.4][ref1] van toepassing is, verwerkt de regionale netbeheerder de in [2.14.3][ref2] bedoelde gegevens
      binnen een werkdag in de klantsleuteladministratie en bericht de leverancier hierover onmiddellijk nadien.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.14.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.14.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.14.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.14.4
        hoofdstuk: '2'
        paragraaf: '2.14'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.14.3
        hoofdstuk: '2'
        paragraaf: '2.14'
  - number: 2.14.6
    text: |-
      Indien de netbeheerder een leveranciersswitch, uithuizing, inhuizing of een verwijdering van een aansluiting
      in het aansluitingenregister heeft geëffectueerd op grond van [3.1.3.1][ref1], [3.2.3.1][ref2], [3.3.3.1][ref3]
      respectievelijk [3.10.1.4][ref4], verwijdert de netbeheerder onmiddellijk nadien de bij de desbetreffende
      aansluiting behorende klantsleutel uit de klantsleuteladministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel3.10.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.14.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.3.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.2.3.1
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.3.3.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 3.10.1.4
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: 2.15.1
    text: |-
      De leverancier is verantwoordelijk voor de inrichting en het beheer van een administratie van toestemmingen
      die kleinverbruikers hem hebben verstrekt voor het doen van opvragingen als bedoeld in [2.2b.1][ref1] of
      [2.5a.1][ref2], hierna te noemen de toestemmingenadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5a.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.15.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.1
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5a.1
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 2.15.2
    text: |-
      De toestemmingenadministratie bevat minimaal de volgende gegevens:

      a. de toestemmingssleutel;

      b. de naam van de desbetreffende kleinverbruiker;

      c. de datum waarop de toestemming door de leverancier is ontvangen;

      d. het doel van de toestemming;

      e. de toestemming;

      f. de wijze waarop de desbetreffende kleinverbruiker de toestemming heeft gegeven;

      g. de postcode en het huisnummer met eventuele huisnummertoevoeging van het adres van de desbetreffende
      kleinverbruiker;

      h. de EAN-code van de aansluiting van de desbetreffende kleinverbruiker.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.15.2
  - number: 2.15.3
    text: |-
      De netbeheerder kan, indien daar reden voor is, de gegevens uit de toestemmingenadministratie gedurende de
      bewaartermijn als bedoeld in [10.1.4b.2][ref1] en [10.1.4b.3][ref2], opvragen bij de leverancier onder vermelding
      van:

      a. de EAN-code van de aansluiting;

      b. de toestemmingssleutel van de opvraag zoals bedoeld in [2.2b.1, onderdeel d][ref3], of
      [2.5a.1, onderdeel d.][ref4]


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.1.4b.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10.1.4b.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5a.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.15.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.1.4b.2
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 10.1.4b.3
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 2.2b.1
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 2.5a.1
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 2.15.4
    text: |-
      De leverancier verstrekt de uit de toestemmingenadministratie opgevraagde gegevens binnen 72 uur aan de regionale
      netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.15.4
  - number: 3.1.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de nieuwe leverancier één
      werkdag voor de switchdatum namens deze aangeslotene een switchmelding naar de regionale netbeheerder. De
      switchmelding bevat:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de programmaverantwoordelijke;

      f. het correspondentieadres van de aangeslotene indien dit afwijkt van het adres behorende bij de aansluiting;

      g. indien de leverancier dat wenst op te geven: de naam van de aangeslotene;

      h. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier;

      i. indien de leverancier de naam van de aangeslotene overeenkomstig 3.1.1.1, onderdeel g, heeft opgegeven, en
      hierover beschikt: de geboortedatum van de aangeslotene;

      j. indien de leverancier de naam van de aangeslotene overeenkomstig 3.1.1.1, onderdeel g, heeft opgegeven, en
      hierover beschikt: het KvK-nummer van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.1.1
  - number: 3.1.1.2
    text: |-
      In afwijking van [3.1.1.1][ref1] stuurt de nieuwe leverancier de switchmelding, bedoeld in 3.1.1.1, tenminste één
      werkdag en ten hoogste twintig werkdagen voor de switchdatum naar de regionale netbeheerder, indien de aansluiting
      een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend bij een afnemer bedoeld
      in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of [artikel 52c][ref4] of
      [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.1.2.1
    text: |-
      Naar aanleiding van de switchmelding controleert de regionale netbeheerder of:

      a. de switchmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de switchdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig werkdagen in
      de toekomst ligt;

      d. de nieuwe leverancier is opgenomen in het leveranciersregister;

      e. de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      f. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding of inhuizingsmelding is voor
      dezelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.1
  - number: 3.1.2.2
    text: |-
      In aanvulling op [3.1.2.1][ref1] controleert de regionale netbeheerder of de naam van de aangeslotene, bedoeld in
      [3.1.1.1 onderdeel g][ref2], is ingevuld in de switchmelding, indien op de aansluiting in het aansluitingenregister
      geen leverancier is geregistreerd op de switchdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.2.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.1.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.3
    text: |-
      Als alle controles uit [3.1.2.1][ref1] en [3.1.2.2][ref2] een positief resultaat geven, wordt de procedure
      vervolgd vanaf [3.1.2.5][ref3]. Als dat niet het geval is, wordt de switch niet uitgevoerd en wordt de procedure na
      [3.1.2.4][ref4] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.2.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.1.2.2
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.1.2.5
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 3.1.2.4
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.4
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de switch naar aanleiding van [3.1.2.3][ref1] uiterlijk
      de werkdag na ontvangst van de switchmelding aan de leverancier die de switchmelding heeft ingediend en vermeldt
      daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe leverancier;

      d. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      e. de switchdatum

      f. de reden van het niet uitvoeren van de switch:

      1° de switchmelding is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de switchdatum voldoet niet aan de gestelde indientermijn;

      4° de leverancier komt niet voor in het leveranciersregister;

      5° de programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      6° de switchmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde switchmelding of
      inhuizingsmelding;

      7° in het aansluitingenregister is geen leverancier vermeld en de switchmelding bevat geen naam van de
      aangeslotene;

      g. indien aangeleverd in de switchmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.2.3
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2.5
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding
      aan de nieuwe leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de bedrijfs-EAN-code van de oude leverancier;

      g. de procesidentificatie die van toepassing is, te weten: leverancierswitch;

      h. indien aangeleverd in de switchmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.5
  - number: 3.1.2.6
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding
      aan de nieuwe programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: leverancierswitch;
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.6
  - number: 3.1.2.7
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de switchmelding aan
      de oude leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de oude leverancier;

      e. de bedrijfs-EAN-code van de nieuwe leverancier;

      f. de procesidentificatie die van toepassing is, te weten: leverancierswitch;
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.7
  - number: 3.1.2.8
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de switchmelding aan
      de oude programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: leverancierswitch.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.8
  - number: 3.1.2.9
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering, PV-switch of wijzigen naam of verblijfsfunctie of complexbepaling, indien de
      leverancierswitch, bedoeld in [3.1.1.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.1.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.3.2
    text: |-
      De regionale netbeheerder informeert de nieuwe leverancier en de nieuwe programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [3.1.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.1.3.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.4
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.4.1
    text: |-
      De nieuwe leverancier collecteert de meterstand behorende bij het switchproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.4.2
    text: |-
      De nieuwe leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de actuele leverancier één
      werkdag voor de uithuizingsdatum namens deze aangeslotene een uithuizingsmelding naar de regionale netbeheerder. De
      uithuizingsmelding bevat:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.1.1
  - number: 3.2.1.2
    text: |-
      In afwijking van [3.2.1.1][ref1] stuurt de actuele leverancier de uithuizingsmelding, bedoeld in 3.2.1.1,
      tenminste één werkdag en ten hoogste twintig werkdagen voor de uithuizingsdatum naar de regionale netbeheerder,
      indien de aansluiting een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend
      bij een afnemer bedoeld in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of
      [artikel 52c][ref4] of [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.2.1.1
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.2.2.1
    text: |-
      Naar aanleiding van de uithuizingsmelding controleert de regionale netbeheerder of:

      a. de uithuizingsmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de uithuizingsdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig
      werkdagen in de toekomst ligt;

      d. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting met een eerdere of dezelfde datum;

      e. de uithuizingsmelding is ingediend door de in het aansluitingenregister vermelde leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.2.1
  - number: 3.2.2.2
    text: |-
      Als alle controles uit [3.2.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.2.2.4][ref2]. Als dat niet het geval is, wordt de uithuizing niet uitgevoerd en wordt de procedure na
      [3.2.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.2.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.2.2.4
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.2.2.3
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de uithuizing naar aanleiding van [3.2.2.2][ref1]
      uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de leverancier die de uithuizingsmelding heeft
      ingediend en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de uithuizingsdatum;

      e. de reden van het niet uitvoeren van de uithuizing:

      1° de uithuizingsmelding is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de uithuizingsdatum voldoet niet aan de gestelde indientermijn;

      4° de uithuizingsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde
      leverancierswitchmelding, inhuizingsmelding of eindeleveringsmelding;

      5° de indienende leverancier is onjuist;

      f. indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.2.2.2
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2.4
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding
      aan de actuele leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de procesidentificatie die van toepassing is, te weten: uithuizing;

      f. indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.2.4
  - number: 3.2.2.5
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding
      aan de actuele programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: uithuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.2.5
  - number: 3.2.2.6
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      eindelevering, PV-switch of wijzigen naam of verblijfsfunctie of complexbepaling, indien de uithuizing, bedoeld in
      [3.2.1.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.2.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.2.1.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de actuele leverancier aangeleverde
      gegevens overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding of
      uithuizingsmelding voor dezelfde aansluiting is ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.3.2
    text: |-
      De regionale netbeheerder zet, indien de aansluiting is voorzien van een meetinrichting die op afstand uitleesbaar
      is, de administratieve status van de meetinrichting, bedoeld in [2.1.4 onderdeel b][ref1], op "aan" indien deze op
      "uit" staat.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.4
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.3.4
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.4.1
    text: |-
      De actuele leverancier collecteert de meterstand behorende bij het uithuizingsproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.2.4.2
    text: |-
      De actuele leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de nieuwe leverancier
      tenminste op de inhuizingsdatum en ten hoogste twee werkdagen voor de inhuizingsdatum namens deze aangeslotene een
      inhuizingsmelding naar de regionale netbeheerder. De inhuizingsmelding bevat:

      a. de EAN-code van de aansluiting;

      b. de naam van de nieuwe aangeslotene;

      c. de inhuizingsdatum;

      d. de bedrijfs-EAN-code van de regionale netbeheerder;

      e. de bedrijfs-EAN-code van de nieuwe leverancier;

      f. de bedrijfs-EAN-code van de programmaverantwoordelijke;

      g. het correspondentieadres van de aangeslotene indien dit afwijkt van het adres behorende bij de aansluiting;

      h. in geval van een elektriciteitsaansluiting, of er sprake is van een aansluiting met verblijfsfunctie of
      complexbepaling;

      i. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier;

      j. indien de leverancier hierover beschikt: de geboortedatum van de aangeslotene;

      k. indien de leverancier hierover beschikt: het KvK-nummer van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.1.1
  - number: 3.3.1.2
    text: |-
      In afwijking van [3.3.1.1][ref1] stuurt de nieuwe leverancier de in 3.3.1.1 bedoelde inhuizingsmelding tenminste
      op de inhuizingsdatum en ten hoogste twintig werkdagen voor de inhuizingsdatum naar de regionale netbeheerder,
      indien de aansluiting een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend
      bij een afnemer bedoeld in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of
      [artikel 52c][ref4] of [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.3.1.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.3.2.1
    text: |-
      Naar aanleiding van de inhuizingsmelding controleert de regionale netbeheerder of:

      a. de inhuizingsmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de inhuizingsdatum ten opzichte van de datum van indienen tenminste op dezelfde datum en ten hoogste twintig
      werkdagen in de toekomst ligt;

      d. de nieuwe leverancier is opgenomen in het leveranciersregister;

      e. de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      f. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding of inhuizingsmelding is voor
      dezelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.1
  - number: 3.3.2.2
    text: |-
      Als alle controles uit [3.3.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.3.2.4][ref2]. Als dat niet het geval is, wordt de inhuizing niet uitgevoerd en wordt de procedure na
      [3.3.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.3.2.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.3.2.4
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.3.2.3
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de inhuizing naar aanleiding van [3.3.2.2][ref1] uiterlijk
      de werkdag na ontvangst van de inhuizingsmelding aan de leverancier die de inhuizingsmelding heeft ingediend en
      vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe leverancier;

      d. de inhuizingsdatum;

      e. de reden van het niet uitvoeren van de inhuizing:

      1° de inhuizingsmelding is onvolledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de inhuizingsdatum voldoet niet aan de gestelde indientermijn;

      4° de nieuwe leverancier komt niet voor in het leveranciersregister;

      5° de programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      6° de inhuizingsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde inhuizingsmelding of
      leverancierswitchmelding;

      f. indien aangeleverd in de inhuizingsmelding: het referentienummer van de nieuwe leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.3.2.2
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.2.4
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de
      inhuizingsmelding aan de nieuwe leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de inhuizingsdatum;

      c. de naam van de inhuizende aangeslotene;

      d. de bedrijfs-EAN-code van de regionale netbeheerder;

      e. de bedrijfs-EAN-code van de nieuwe leverancier;

      f. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      g. indien de inhuizingsmelding tevens een uithuizing van de oude leverancier tot gevolg heeft: de bedrijfs-EAN-code
      van de oude leverancier;

      h. de procesidentificatie die van toepassing is, te weten: inhuizing;

      i. indien aangeleverd in de inhuizingsmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.4
  - number: 3.3.2.5
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de
      inhuizingsmelding aan de nieuwe programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de inhuizingsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: inhuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.5
  - number: 3.3.2.6
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht als gevolg van de inhuizing uiterlijk de werkdag na
      ontvangst van de inhuizingsmelding aan de oude leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de oude leverancier;

      e. de bedrijfs-EAN-code van de nieuwe leverancier.

      f. de procesidentificatie die van toepassing is, te weten: uithuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.6
  - number: 3.3.2.7
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht als gevolg van de inhuizing uiterlijk de werkdag na
      ontvangst van de inhuizingsmelding aan de oude programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: uithuizing.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.7
  - number: 3.3.2.8
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering, PV-switch of wijzigen naam of verblijfsfunctie of complexbepaling, indien de inhuizing,
      bedoeld in [3.3.1.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.3.1.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.3.2
    text: |-
      De regionale netbeheerder informeert de nieuwe leverancier en nieuwe programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [3.3.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.3.3.1
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.3.3
    text: |-
      De regionale netbeheerder zet, indien de aansluiting is voorzien van een meetinrichting die op afstand uitleesbaar
      is, de administratieve status van de meetinrichting, bedoeld in [2.1.4 onderdeel b][ref1], op "aan" tenzij de
      aangeslotene voorafgaand aan de inhuizing heeft aangegeven dat de administratieve status van de meetinrichting,
      bedoeld in 2.1.4 onderdeel b, op "uit" moet staan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.4
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.3.5
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.4.1
    text: |-
      De nieuwe leverancier collecteert de meterstand behorende bij het inhuizingsproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.3.4.2
    text: |-
      De nieuwe leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.3.4.2
    references:
      - id: ref1
