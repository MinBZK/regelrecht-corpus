  - number: 2.1.7a
    text: |-
      Voordat de netbeheerder de in [2.1.7][ref1] bedoelde mutaties daadwerkelijk uitvoert, verstrekt de netbeheerder de
      gegevens bedoeld in [2.1.3][ref2] en [2.1.4][ref3] aan de leverancier die de levering aan de hem toegewezen afnemer
      voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.7
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
