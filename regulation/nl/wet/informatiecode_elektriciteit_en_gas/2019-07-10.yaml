  - number: 2.6.3
    text: |-
      Het is een leverancier uitsluitend toegestaan de in [2.6.2][ref1] bedoelde gegevens op te vragen als:

      a. de leverancier op de desbetreffende aansluiting is geregistreerd;

      b. de leverancier op de desbetreffende aansluiting geregistreerd is geweest;

      c. voor de desbetreffende aansluiting een leveringsovereenkomst van de leverancier is geregistreerd in het
      contracteindegegevensregister;

      d. voor de desbetreffende aansluiting een melding als bedoeld in [2.5.5][ref2] van de leverancier is geregistreerd
      in het contracteindegegevensregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.6.2
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.6.4
    text: |-
      De in [2.6.3, onderdeel a][ref1], bedoelde leverancier kan gegevens uit het toegankelijk meetregister opvragen
      voor zover:

      a. deze gegevens betrekking hebben op de periode waarin de leverancier op de aansluiting vermeld is in het
      aansluitingenregister, of

      b. deze gegevens betrekking hebben op de daaraan voorafgaande periode:

      1° de laatste vastgestelde stand met de herkomst zoals bedoeld in [B5.1][ref2] met uitzondering van de berekende en
      de overeengekomen stand, en

      2° de berekende en overeengekomen standen na de datum van de onder 1° bedoelde laatst vastgestelde stand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.6.3
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 2.6.5
    text: |-
      De in [2.6.3, onderdeel b][ref1], bedoelde leverancier kan gegevens uit het toegankelijk meetregister opvragen voor
      zover deze gegevens betrekking hebben op de periode waarin de leverancier op de aansluiting vermeld is geweest in
      het aansluitingenregister of op de eerstvolgende vier maanden daarna.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.6.3
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.6.6
    text: |-
      De in [2.6.3, onderdelen c en d][ref1], bedoelde leverancier kan voorafgaand aan zijn periode van levering de
      volgende gegevens opvragen uit het toegankelijk meetregister:

      a. de laatste vastgestelde stand met de herkomst zoals bedoeld in [B5.1][ref2] met uitzondering van de berekende en
      de overeengekomen stand, en

      b. de berekende en overeengekomen standen na de datum van de onder a bedoelde laatst vastgestelde stand tot aan het
      moment van opvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.6.3
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 2.6.7
    text: |-
      De leverancier vraagt de gegevens als bedoeld in [2.6.4][ref1], [2.6.5][ref2] en [2.6.6][ref3] op bij de
      netbeheerder onder vermelding van de volgende gegevens:

      a. zijn bedrijfs-EAN-code;

      b. de EAN-code van de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.6.4
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.6.5
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 2.6.6
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.6.8
    text: |-
      De netbeheerder controleert of:

      a. de opvraag volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voorkomt in het toegankelijk meetregister, en

      c. de opvragende leverancier als leverancier in het aansluitingenregister is vermeld of is vermeld geweest op de
      aansluiting, dan wel,

      (i) er van de opvragende leverancier voor de desbetreffende aansluiting een leveringsovereenkomst of een melding
      als bedoeld in [2.5.5][ref1] is geregistreerd in het contracteindegegevensregister, en

      (ii) het een meetinrichting betreft die niet op afstand uitleesbaar is of niet uitgelezen mag worden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.6.9
    text: |-
      Indien de controle één of meer negatieve resultaten oplevert, verstrekt de regionale netbeheerder de opgevraagde
      gegevens niet en stuurt hij de leverancier onverwijld een bericht onder vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. de reden van afwijzing:

      1° de opvraag is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de opvragende leverancier is niet als leverancier in het aansluitingenregister vermeld of vermeld geweest op
      de aansluiting;

      4° voor de desbetreffende aansluiting is geen leveringsovereenkomst of melding als bedoeld in [2.5.5][ref1]
      geregistreerd voor de opvragende leverancier;

      5° het betreft een meetinrichting die op afstand uitleesbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.6.10
    text: |-
      Tenzij [2.6.9][ref1] van toepassing is, stuurt de regionale netbeheerder onverwijld een bericht aan de leverancier
      en verstrekt daarbij de volgende gegevens voor zover die betrekking hebben op de in [2.6.4][ref2], [2.6.5][ref3] en
      [2.6.6][ref4] bedoelde periodes:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. de identificatie van de meetinrichting;

      d. per verbruiksperiode per telwerk:

      1° de beginstand met bijbehorende opnamedatum en herkomst van de meterstand;

      2° de eindstand met bijbehorende opnamedatum en herkomst van de meterstand;

      3° het verbruik;

      4° de tariefzone.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.10
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.6.9
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.6.4
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 2.6.5
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 2.6.6
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.7.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een register,
      hierna te noemen het netbeheerdersregister.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.7.1
  - number: 2.7.2
    text: |-
      De regionale netbeheerders stellen in het netbeheerdersregister, bedoeld in [2.7.1][ref1], aan leveranciers,
      programmaverantwoordelijken en meetverantwoordelijken de volgende gegevens online beschikbaar:

      a. de bedrijfsnaam;

      b. de handelsna(a)m(en);

      c. de bedrijfs-EAN-codes waarmee hij zich in het berichtenverkeer identificeert;

      d. de EAN-codes van zijn netgebieden;

      e. de adresgegevens;

      f. het bankrekeningnummer ten behoeve van de afdracht in het leveranciersmodel;

      g. het BTW-nummer;

      h. het inschrijfnummer bij de Kamer van Koophandel;

      i. de gegevens van de contactpersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.7.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.7.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.7.1
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.7.3
    text: |-
      In het netbeheerdersregister, bedoeld in [2.7.1][ref1], wordt van de gegevens, bedoeld in [2.7.2][ref2], tevens de
      begindatum en, indien bekend, de einddatum van de geldigheid van de gegevens per gegeven vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.7.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.7.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.7.3
