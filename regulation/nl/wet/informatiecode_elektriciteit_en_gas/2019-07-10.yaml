        paragraaf: '5.2'
  - number: 3.9.1.1
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de aansluiting fysiek uit bedrijf is genomen effectueert de regionale
      netbeheerder de waarde, bedoeld in [2.1.3, onderdeel h][ref1], die van toepassing is, te weten: "uit bedrijf" in
      het aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
