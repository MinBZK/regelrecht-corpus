        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.11.2.2
        hoofdstuk: '4'
        paragraaf: '4.11'
  - number: 4.12.1.1
    text: |-
      De netbeheerder informeert de meetverantwoordelijke, indien mogelijk tenminste vijf werkdagen voorafgaand aan de
      datum waarop de aansluiting wordt verwijderd, over de geplande verwijdering van de aansluiting. In afwijking van
      [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.12.2.1
    text: |-
      De netbeheerder controleert, voorafgaand aan de effectuering in het aansluitingenregister, bedoeld in
      [4.12.2.4][ref1], of er voor de desbetreffende aansluiting nog eerder bevestigde, doch nog niet geëffectueerde
      leverancierswitchmeldingen, inhuizingsmeldingen, uithuizingsmeldingen, eindeleveringsmeldingen of PV-
      switchmeldingen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.12.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.12.2.4
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 4.12.2.2
    text: |-
      Indien een of meerdere reeds bevestigde, doch nog niet geëffectueerde meldingen, bedoeld in [4.12.2.1][ref1],
      aanwezig zijn, verwijdert de netbeheerder deze meldingen, beëindigt de netbeheerder de procedure(s) en informeert
      de netbeheerder de leverancier hierover. In afwijking van [paragraaf 9.1][ref2] vindt deze informatie-uitwisseling
      niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.12.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.12.2.1
        hoofdstuk: '4'
        paragraaf: '4.12'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.12.2.3
    text: |-
      De leverancier informeert de programmaverantwoordelijke over de verwijdering van eerder ingediende, doch nog niet
      geëffectueerde meldingen, zoals genoemd in [4.12.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.12.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.12.2.2
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 4.12.2.4
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de aansluiting is verwijderd effectueert de netbeheerder de status
      van de aansluiting, bedoeld in [2.1.3, onderdeel h][ref1], die van toepassing is, te weten: “verwijderd” in het
      aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.12.2.4a
    text: |-
      Indien een primair allocatiepunt wordt verwijderd, verwijdert de netbeheerder tegelijkertijd ook de bijbehorende
      secundaire allocatiepunten.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.2.4a
  - number: 4.12.2.5
    text: |-
      De netbeheerder informeert de leverancier, de programmaverantwoordelijke en de meetverantwoordelijke die voor de
      aansluiting in het aansluitingenregister vermeld staan, overeenkomstig [paragraaf 2.2][ref1] omtrent de mutatie,
      bedoeld in [4.12.2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.12.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.12.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.12.2.4
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 4.13.1.1
    text: |-
      De leverancier stuurt een melding wijzigen verblijfsfunctie of complexbepaling op de werkdag voor de beoogde
      wijziging naar de netbeheerder, waarbij wordt vermeld:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de gewijzigde verblijfsfunctie of complexbepaling;

      d. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.1.1
  - number: 4.13.2.1
    text: |-
      Naar aanleiding van de melding wijzigen verblijfsfunctie of complexbepaling controleert de netbeheerder of:

      a. de melding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de melding wijzigen verblijfsfunctie of complexbepaling wordt ingediend door de in het aansluitingenregister
      vermelde leverancier;

      d. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitch-, inhuizings-, uithuizings- of
      eindeleveringsmelding is voor dezelfde aansluiting met dezelfde datum.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.2.1
  - number: 4.13.2.2
    text: |-
      Als alle controles uit [4.13.2.1][ref1] een positief resultaat geven, wordt de wijziging verblijfsfunctie of
      complexbepaling uitgevoerd en wordt de procedure vervolgd vanaf [4.13.2.4][ref2]. Als dat niet het geval is,
      wordt de wijziging verblijfsfunctie of complexbepaling niet uitgevoerd en wordt de procedure na [4.13.2.3][ref3]
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.13.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.13.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.13.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.13.2.1
        hoofdstuk: '4'
        paragraaf: '4.13'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.13.2.4
        hoofdstuk: '4'
        paragraaf: '4.13'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.13.2.3
        hoofdstuk: '4'
        paragraaf: '4.13'
  - number: 4.13.2.3
    text: |-
      Indien naar aanleiding van [4.13.2.2][ref1] de wijziging verblijfsfunctie of complexbepaling niet uitgevoerd
      wordt, bericht de netbeheerder dit uiterlijk de werkdag na ontvangst van de melding wijzigen verblijfsfunctie of
      complexbepaling aan de leverancier die de melding heeft ingediend, waarbij wordt vermeld:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. indien aangeleverd in de melding wijzigen verblijfsfunctie of complexbepaling: het referentienummer van de
      leverancier;

      e. de reden voor het niet uitvoeren van de melding wijzigen verblijfsfunctie of complexbepaling:

      1° de melding wijzigen verblijfsfunctie of complexbepaling is niet volledig of syntactisch onjuist;

      2° de EAN-code is onbekend;

      3° de indienende leverancier is onjuist;

      4° de melding verblijfsfunctie of complexbepaling conflicteert met een eerder bevestigde, maar nog niet
      geëffectueerde leverancierswitch-, inhuizings-, uithuizings- of eindeleveringsmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.13.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.13.2.2
        hoofdstuk: '4'
        paragraaf: '4.13'
  - number: 4.13.2.4
    text: |-
      De netbeheerder bevestigt de geplande uitvoering van de melding wijzigen verblijfsfunctie of complexbepaling
      uiterlijk de werkdag na ontvangst van de melding wijzigen verblijfsfunctie of complexbepaling aan de leverancier.
      De melding bevat:

      a. de EAN-code van de aansluiting;

      b. indien aangeleverd in de melding wijzigen verblijfsfunctie of complexbepaling: het referentienummer van de
      leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.2.4
  - number: 4.13.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig
      [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.13.3.2
    text: |-
      De netbeheerder informeert de leverancier, programmaverantwoordelijke en meetverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.13.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 4.14.1.1
    text: |-
      Ten einde een switchmelding te kunnen doen verwerken, en voor zover van toepassing, meldt de nieuwe leverancier
      zich eenmalig aan als juridische entiteit bij de netbeheerder van het landelijk gastransportnet door middel van het
      daartoe bestemd en door genoemde netbeheerder beschikbaar gesteld aanmeldformulier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.1.1
  - number: 4.14.1.2
    text: |-
      Ingeval de direct aangeslotene van leverancier en/of programmaverantwoordelijke wisselt, stuurt de nieuwe
      leverancier de switchmelding naar de netbeheerder van het landelijke gastransportnet door middel van een daartoe
      bestemd switch-mutatieformulier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.1.2
  - number: 4.14.1.3
    text: |-
      De nieuwe leverancier stuurt de switchmelding bij voorkeur één maand doch uiterlijk vijf werkdagen voor de
      switchdatum naar de netbeheerder van het landelijk gastransportnet, tenzij anders wordt overeengekomen. De
      switchmelding bevat:

      a. de EAN-code van de aansluiting;

      b. de naam van de direct aangeslotene;

      c. de bedrijfs-EAN-code van de (nieuwe) programmaverantwoordelijke(n);

      d. de naam van de (nieuwe) programmaverantwoordelijke(n);

      e. de bedrijfs-EAN-code van de (nieuwe) leverancier(s);

      f. de naam van de (nieuwe) leverancier(s);

      g. de ingangsdatum/beëindigingsdatum van de bij de aansluiting behorende relatie(s) programmaverantwoordelijke(n)
      enerzijds en de leverancier(s) anderzijds;

      h. opmerkingen (vrij tekstveld).
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.1.3
  - number: 4.14.2.1
    text: |-
      Naar aanleiding van de switchmelding controleert de netbeheerder van het landelijk gastransportnet of:

      a. de switchmelding volledig en syntactisch correct is;

      b. de EAN-code behoort bij een aansluiting als bedoeld in [2.13.1][ref1];

      c. de switchdatum ten opzichte van de datum van de switchmelding ten minste vijf werkdagen in de toekomst ligt;

      d. de nieuwe leverancier als juridische entiteit bekend is als bedoeld in [4.14.1.1][ref2];

      e. de opgegeven programmaverantwoordelijke een transportovereenkomst heeft afgesloten met de netbeheerder van het
      landelijke gastransportnet voor het desbetreffende entry/exitpunt met een transportcapaciteit groter dan 0 op de
      ingangsdatum zoals genoemd in het in [4.14.1.2][ref3] bedoelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.13.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.14.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.14.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.13.1
        hoofdstuk: '2'
        paragraaf: '2.13'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.14.1.1
        hoofdstuk: '4'
        paragraaf: '4.14'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.14.1.2
        hoofdstuk: '4'
        paragraaf: '4.14'
  - number: 4.14.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet wijst de switchmelding af die niet voldoet aan de vereisten a,
      b, d en e van het voorgaande artikel en stelt de nieuwe leverancier in staat om de switchmelding binnen een termijn
      van 5 werkdagen inhoudelijk aan te passen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.2.2
  - number: 4.14.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet muteert het aansluitingenregister naar aanleiding
      van de switchmelding die al dan niet na inhoudelijke aanpassing, voldoet aan de vereisten
      [a, b, d en e van 4.14.2.1][ref1], dan wel ingeval van een niet-tijdige melding of een niet-tijdige inhoudelijke
      aanpassing, uiterlijk 5 werkdagen na ontvangst van de switchmelding die hier (uiteindelijk) aan voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.14.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.14.2.1
        hoofdstuk: '4'
        paragraaf: '4.14'
  - number: 4.14.3.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de desbetreffende leverancier(s) en
      programmaverantwoordelijk(en) over de mutatie zodra deze is geëffectueerd.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.14.3.2
  - number: 4.15.1.1
    text: |-
      Ingeval de levering beëindigd wordt, stuurt de leverancier de eindeleveringsmelding naar de netbeheerder van het
      landelijk gastransportnet door middel van een daartoe bestemd eindeleveringsformulier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.15.1.1
  - number: 4.15.1.2
    text: |-
      De leverancier stuurt het eindeleveringsformulier uiterlijk één maand voor de einddatum van de levering naar de
      netbeheerder van het landelijk gastransportnet. De eindeleveringsmelding bevat:

      a. de EAN-code van de aansluiting;

      b. de naam van de direct aangeslotene;

      c. de bedrijfs-EAN-code van de programmaverantwoordelijke(n);

      d. de naam van de programmaverantwoordelijke(n);

      e. de bedrijfs-EAN-code van de leverancier;

      f. de naam van de leverancier;

      g. de beëindigingsdatum van de van de bij de aansluiting behorende relatie(s) programmaverantwoordelijke(n)
      enerzijds en de leverancier relatie(s) anderzijds voor de aansluiting;

      h. in het vrije tekstveld de melding dat de levering wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.15.1.2
  - number: 4.15.2.1
    text: |-
      Naar aanleiding van de eindeleveringsmelding controleert de netbeheerder van het landelijk gastransportnet of:

      a. de EAN-code van de aansluiting voorkomt in het aansluitingenregister landelijk gastransport;

      b. de einddatum van de levering ten opzichte van de datum van indienen van de eindeleveringsmelding ten minste één
      maand in de toekomst ligt;

      c. er geen eerder bevestigde en nog niet geëffectueerde switchmelding is betreffende de relatie(s)
      programmaverantwoordelijke(n) enerzijds en de leverancier(s) anderzijds voor dezelfde aansluiting van dezelfde of
      een eerdere datum;

      d. de eindeleveringsmelding is ingediend door de in het aansluitingenregister landelijk gastransportnet vermelde
      leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.15.2.1
  - number: 4.15.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet wijst de eindeleveringsmelding af die niet voldoet aan de
      vereisten a, c en d van het voorgaande artikel en stelt de leverancier in staat om de eindeleveringsmelding aan
      te passen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.15.2.2
  - number: 4.15.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet muteert het aansluitingenregister overeenkomstig [2.13.1][ref1]
      naar aanleiding van de eindeleveringsmelding die voldoet aan de vereisten [a, c en d van 4.15.2.1][ref2], uiterlijk
      één maand nadat deze is ontvangen dan wel afdoende aan de genoemde vereisten is aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.13.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.15.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.15.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.13.1
        hoofdstuk: '2'
        paragraaf: '2.13'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.15.2.1
        hoofdstuk: '4'
        paragraaf: '4.15'
  - number: 4.15.3.2
    text: |-
      De netbeheerder van het landelijk gastransportnet informeert de direct aangeslotene, de leverancier en de
      programmaverantwoordelijke(-n) over de mutatie zodra deze is geëffectueerd.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.15.3.2
  - number: 5.1.1
    text: |-
      [Paragraaf 5.1][ref1] is niet van toepassing op onbemeten kleinverbruikaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.2.1
    text: |-
      Indien de allocatiemethode van een kleinverbruikaansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde
      “profielallocatie” heeft, collecteert de leverancier voor deze kleinverbruikaansluiting ten minste eenmaal per 12
      maanden een meterstand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.2.1a
    text: |-
      Indien de allocatiemethode van een kleinverbruikaansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde
      “slimme-meter-allocatie” heeft, collecteert de leverancier voor deze kleinverbruikaansluiting maandelijks een op
      afstand uitleesbare meterstand van de eerste kalenderdag van de desbetreffende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.2.2
    text: |-
      De leverancier collecteert in het kader van een mutatieproces een meterstand die betrekking heeft op de
      mutatiedatum, zoals bedoeld in [paragrafen 3.1 tot en met 3.4][ref1] en [3.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 5.1.2.3
    text: |-
      De leverancier meldt bij de opvraag, bedoeld in [5.1.2.1][ref1] of [5.1.2.2][ref2], aan de aangeslotene dat het
      niet (tijdig) verstrekken van de bedoelde meterstand leidt tot berekening of schatting van de meterstand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.2.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.2.2
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.1
    text: |-
      De leverancier valideert de meterstand, bedoeld in [5.1.2][ref1], met uitzondering van de meterstand zoals bedoeld
      in [artikel 5.1.2.1a][ref2], met behulp van de in het toegankelijk meetregister vermelde historische meterstanden
      en het uit het aansluitingenregister verkregen standaardjaarverbruik en controleert of de meterstand, indien van
      toepassing voor zowel het normaaltelwerk als het laagtelwerk, tussen de volgende validatiegrenzen ligt:

      a. Bovengrens = Vorige meterstand + 200% * [SOM fractie (Datum : Datum)] * SJV / vermenigvuldigingsfactor

      b. Ondergrens = Vorige meterstand + 50% * [SOM fractie (Datum : Datum)] * SJV / vermenigvuldigingsfactor;

      c. Bovengrens teruglevering (elektriciteit) = vorige meterstand + 5000 kWh / 365 * [SOM dagen (Datum : Datum)];

      d. Ondergrens teruglevering (elektriciteit) = vorige meterstand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.2.1a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.2
    text: |-
      De leverancier treedt in overleg met de aangeslotene indien de gecollecteerde meterstanden buiten de grenzen,
      bedoeld in [5.1.3.1][ref1], vallen, met als doel om:

      a. een nieuwe door de aangeslotene aangeleverde meterstand te verkrijgen, of;

      b. te constateren dat de op grond van [artikel 5.1.2][ref2] gecollecteerde meterstand wel gebruikt kan worden en
      als gevalideerd wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.3.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.3
    text: |-
      De leverancier berekent de meterstand indien geen collectie op grond van [paragraaf 5.1.2][ref1] heeft kunnen
      plaatsvinden of wanneer in overleg met de aangeslotene, bedoeld in [5.1.3.2][ref2], geen duidelijkheid is verkregen
      over de bruikbaarheid van de meterstand die buiten de validatiegrenzen, bedoeld in [5.1.3.1][ref3], valt. Voor deze
      berekening wordt gebruik gemaakt van de volgende algoritmen:

      a. Berekende meterstand (elektriciteit normaal) = Vorige meterstand (normaal)+ [SOM fractie (Datum : Datum)] *
      SJV / vermenigvuldigingsfactor;

      b. Berekende meterstand (elektriciteit laag) = Vorige meterstand (laag) + [SOM fractie (Datum : Datum)] * SJV /
      vermenigvuldigingsfactor;

      c. Berekende meterstand (elektriciteit totaal) = Vorige meterstand (totaal) + [SOM fractie (Datum : Datum)] * SJV /
      vermenigvuldigingsfactor;

      d. Berekende meterstand (gas) = Vorige meterstand+ [SOM fractie (Datum : Datum)] * SJV / (vermenigvuldigingsfactor
      * volumeherleidingsfactor), met inachtneming van [5.1.3.5][ref4];

      e. Berekende meterstand (teruglevering elektriciteit normaal) = vorige meterstand (teruglevering elektriciteit
      normaal);

      f. Berekende meterstand (teruglevering elektriciteit laag) = vorige meterstand (teruglevering elektriciteit laag).


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.3.2
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.1.3.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 5.1.3.5
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.4
    text: |-
      De leverancier stelt de gevalideerde meterstand, bedoeld in [5.1.3.1][ref1] of [5.1.3.2 onderdeel b][ref2], of de
      berekende meterstand, bedoeld in [5.1.3.3][ref3], vast voor de opnamedatum bij een periodieke meterstand of voor de
      mutatiedatum bij een mutatieproces.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.3.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.3.2
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.1.3.3
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.4a
    text: |-
      De leverancier stelt de gecollecteerde meterstand als bedoeld in [5.1.2.1a][ref1] vast op uiterlijk de vijftiende
      werkdag van de desbetreffende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.3.4a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.2.1a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.3.5
    text: |-
      Gedurende de periode van 1 januari 2015 tot en met 31 december 2016 wordt in plaats van de volumeherleidingsfactor
      tijdelijk een afwijkende factor toegepast door de volumeherleidingsfactor te vermenigvuldigen met 1,008027. De
      tijdelijk toe te passen factor wordt daarmee 0,98408 (= 0,97624 x 1,008027).
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.3.5
  - number: 5.1.4.1
    text: |-
      De leverancier verstuurt de vastgestelde meterstand, bedoeld in [5.1.3.4][ref1] en [5.1.3.4a][ref2], de werkdag
      na vaststelling, doch uiterlijk binnen de termijnen, bedoeld in [5.3.4.3][ref3], naar de regionale netbeheerder en
      vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de van toepassing zijnde procesidentificatie;

      e. per telwerk de volgende gegevens;

      1° de meterstand;

      2° de datum waarop de meterstand betrekking heeft;

      3° aanduiding van de herkomst van de meterstand;

      4° in geval van elektriciteit de telwerkidentificatie;

      f. indien de leverancier dit wenst op te geven: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.4a
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.3.4
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.3.4a
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.3.4.3
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.2.1
    text: |-
      [Paragraaf 5.2][ref1] is niet van toepassing op onbemeten kleinverbruikaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.2.1
    text: |-
      De regionale netbeheerder voert fysieke meteropnames uit op kleinverbruikaansluitingen in de onderstaande gevallen:

      a. ten minste eenmaal in de 36 maanden bij kleinverbruikmeetinrichtingen die niet op afstand uitleesbaar zijn,
      met inbegrip van kleinverbruikmeetinrichtingen die administratief uit staan, door middel van aflezing op de
      meetinrichting bij de aangeslotene;

      b. in geval van de processen, bedoeld in [paragrafen 3.8 tot en met 3.11][ref1] voor alle
      kleinverbruikmeetinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 5.2.2.2
    text: |-
      De regionale netbeheerder valideert voor de leverancier of de fysiek opgenomen meterstand binnen de
      validatiegrenzen, bedoeld in [5.1.3.1][ref1], valt. Indien de fysiek opgenomen meterstand buiten de
      validatiegrenzen valt, verifieert de regionale netbeheerder of de fysiek opgenomen meterstand op de
      kleinverbruikmeetinrichting weergegeven is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.3.1
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.2.3
    text: |-
      De regionale netbeheerder stelt de fysiek opgenomen meterstand vast voor de leverancier die op het moment van de
      fysieke opname als leverancier op de desbetreffende aansluiting in het aansluitingenregister vermeld staat, stelt
      deze stand in het toegankelijk meetregister beschikbaar en informeert de leverancier hierover.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.2.2.3
  - number: 5.3.1.1
    text: |-
      De leverancier bepaalt het verbruik voor de facturatie, overeenkomstig [paragrafen 5.3.2][ref1] en [5.3.3][ref2],
      op basis van vastgestelde meterstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.1.2
    text: |-
      In afwijking van [5.3.1.1][ref1] zal de leverancier in geval van een schakelstoring in de meetinrichting, in
      overleg met de aangeslotene, het gemeten verbruik, op basis van de in het toegankelijk meetregister aanwezige
      meetreeks, en ten behoeve van de facturatie, verdelen naar normaal en laag tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.1.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.1.3
    text: |-
      In afwijking van [5.3.1.1][ref1] zal de leverancier het door de netbeheerder op grond van [5.3.4][ref2] berekende
      en gecommuniceerde verbruik overnemen in zijn facturatie indien hij hiervoor niet zelf een verbruik kan bepalen
      door storing van de meetinrichting, niet zijnde een schakelstoring.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.1.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.1
    text: |-
      Het verbruik voor de normaaluren wordt bepaald door het verschil te bepalen tussen de vastgestelde meterstand en de
      voorlaatste vastgestelde meterstand van het hoogtelwerk of normaaltelwerk en door dit verschil te vermenigvuldigen
      met de vermenigvuldigingsfactor van het telwerk.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.2.1
  - number: 5.3.2.2
    text: |-
      Het verbruik voor de laaguren wordt bepaald door het verschil te bepalen tussen de vastgestelde meterstand
      en de voorlaatste vastgestelde meterstand van het laagtelwerk en door dit verschil te vermenigvuldigen met de
      vermenigvuldigingsfactor van het telwerk.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.2.2
  - number: 5.3.2.3
    text: |-
      In afwijking van [5.3.2.1][ref1] wordt in het geval dat een meetinrichting beschikt over een totaaltelwerk en
      een laagtelwerk, het verbruik voor de normaaluren bepaald door het verschil te bepalen tussen de vastgestelde
      meterstand en de voorlaatste vastgestelde meterstand van het totaaltelwerk en dit verschil te vermenigvuldigen met
      de vermenigvuldigingsfactor van het telwerk en dit verbruik te verminderen met het verbruik voor het laagtelwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.2.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.4
    text: |-
      In afwijking van [5.3.2.2][ref1] wordt in het geval dat een meetinrichting beschikt over een totaaltelwerk en een
      hoog- of normaaltelwerk, het verbruik voor de laaguren bepaald door het verschil te bepalen tussen de vastgestelde
      meterstand en de voorlaatste vastgestelde meterstand van het totaaltelwerk en dit verschil te vermenigvuldigen
      met de vermenigvuldigingsfactor van het telwerk en dit verbruik te verminderen met het verbruik voor het
      normaaltelwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.2.2
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.2.5
    text: |-
      Het verbruik voor een kleinverbruikaansluiting zonder meetinrichting wordt door de regionale netbeheerder bepaald
      op basis van:

      a. het belastingprofiel dat overeenkomstig de systematiek beschreven in [bijlage B2][ref1] wordt bepaald voor zover
      het een installatie voor openbare verlichting of een verkeersregelinstallatie betreft;

      b. het verbruiksprofiel dat overeenkomstig de systematiek beschreven in [bijlage B1.3][ref2] wordt bepaald voor
      zover het een andere installatie dan een installatie voor openbare verlichting of een verkeersregelinstallatie
      betreft met dien ten verstande dat de regionale netbeheerder het standaardjaarverbruik bepaalt op basis van de
      gegevens genoemd in [artikel 2.30, tweede lid, van de Netcode elektriciteit](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
  - number: 5.3.2.6
    text: |-
      Indien de meterbeheerder een defect heeft vastgesteld in de meetinrichting, niet zijnde een
      schakelstoring, of fraude met de meetinrichting heeft geconstateerd, zal de netbeheerder, in afwijking van
      [5.3.2.1 tot en met 5.3.2.4][ref1], het te veel of te weinig geregistreerde verbruik bepalen voor de periode dat de
      meetinrichting niet correct heeft gefunctioneerd op basis van één of meerdere van de volgende gegevens:

      (i) de in het toegankelijk meetregister aanwezige betrouwbare meetreeks;

      (ii) een met een herstelde meetinrichting gedurende twee maanden geregistreerd volume;

      (iii) een ijkrapport;

      (iv) indien door de desbetreffende klant aan de netbeheerder verstrekt, de productie-installatiegegevens.

      Het aldus te veel of te weinig geregistreerde verbruik wordt gesaldeerd met het op basis van de
      [artikelen 5.3.2.1 tot en met 5.3.2.4][ref2] te bepalen verbruik behorende bij de periode van de vastgestelde stand
      die als eerstvolgende op grond van [paragraaf 5.5][ref3] niet meer te corrigeren zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.2.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.3.2.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.3.3.1
    text: |-
      Het verbruik wordt bepaald door het verschil te bepalen tussen de vastgestelde meterstand en de voorlaatste
      vastgestelde meterstand van het telwerk en door dit verschil te vermenigvuldigen met de gewogen calorische factor
      van het desbetreffende netgebied voor de betreffende verbruiksperiode, de vermenigvuldigingsfactor van het telwerk
      en de volumeherleidingsfactor. De onderdelen uit deze formule worden als volgt bepaald:

      a. de gewogen calorische factor voor de verbruiksperiode (GCFV) wordt berekend met de volgende formule:

      b. voor de bij de aansluiting horende profielcategorie wordt de som van de profielfracties berekend met de volgende
      formule:

      Somfracties = Σ VP (h)

      Waarin:

      h = uren in maand x

      VP = de profielfracties van het verondersteld profiel van de profielcategorie in de desbetreffende
      verbruiksperiode, rekening houdend met het juiste temperatuurgebied

      c. de profielfracties voor een bepaalde verbruiksperiode worden berekend aan de hand van de volgende formule:

      VP = TOP + TAP

      Waarin:

      TOP = temperatuuronafhankelijke deel van het profiel

      TAP = temperatuurafhankelijke deel van het profiel

      d. indien TAC groter is dan TST dan geldt TAP = 0

      Waarin:

      TAC = actuele temperatuurcoëfficient;

      TST = stooktemperatuur

      e. indien TAC kleiner dan of gelijk aan TST is dan geldt:

      TAP = RER x (TST – TAC)

      Waarin:

      RER = regressiecoëfficient

      f. TOP, RER en TST worden beschikbaar gesteld door het platform bedoeld in [B3.1.2][ref1].

      g. voor niet temperatuur gecorrigeerde meetinrichtingen is de volumeherleidingsfactor op grond van de 7-
      gradenmethode bepaald op 1 voor de verbruiksperiode tot 1 januari 2015 en op grond van de 15-gradenmethode bepaald
      op 0,97624 voor de verbruiksperiode vanaf 1 januari 2015, met inachtneming van [5.1.3.5][ref2].

      h. voor temperatuur gecorrigeerde meetinrichtingen wordt geen volumeherleidingsfactor toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.3.5
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.3.2
    text: |-
      Het verbruik voor kleinverbruikaansluitingen zonder meetinrichting wordt bepaald overeenkomstig [B3.4.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.3.3.3
    text: |-
      Indien de meterbeheerder een defect heeft vastgesteld in de meetinrichting, of fraude met de meetinrichting heeft
      geconstateerd, zal de netbeheerder in afwijking van 5.3.3.1, het te veel of te weinig geregistreerde verbruik
      bepalen voor de periode dat de meetinrichting niet correct heeft gefunctioneerd op basis van één of meerdere van de
      volgende gegevens:

      (i) de in het toegankelijk meetregister aanwezige betrouwbare meetreeks;

      (ii) het met een herstelde meetinrichting gedurende twee maanden geregistreerde volume;

      (iii) een ijkrapport.

      Het aldus te veel of te weinig geregistreerde verbruik wordt gesaldeerd met het op basis van
      [artikel 5.3.3.1][ref1] te bepalen verbruik behorende bij de periode van de vastgestelde stand die als
      eerstvolgende op grond van [paragraaf 5.5][ref2] niet meer te corrigeren zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.3.4.1
    text: |-
      Naar aanleiding van de ontvangen vastgestelde meterstand van de leverancier, bedoeld in [5.1.4.1][ref1],
      controleert de regionale netbeheerder of:

      a. het bericht met de vastgestelde meterstand volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de aansluiting op de opnamedatum van de meterstand is voorzien van een meetinrichting;

      d. de leverancier die de vastgestelde meterstand heeft verstuurd op grond van de collectie van een periodieke
      meterstand, bedoeld in [5.1.2.1][ref2], als de leverancier op de aansluiting in het aansluitingenregister vermeld
      staat voor de opnamedatum, waarop de meterstand betrekking heeft;

      e. de leverancier die de vastgestelde meterstand heeft verstuurd op grond van de collectie van een meterstand
      bij een mutatieproces, bedoeld in [5.1.2.2][ref3], de leverancier is die het betreffende mutatieproces heeft
      geïnitieerd;

      f. het aantal vastgestelde meterstanden overeen komt met het aantal actieve telwerken van de meetinrichting;

      g. het aantal posities van de vastgestelde meterstanden niet groter is dan het aantal posities (telwielen) van de
      telwerken van de meetinrichting;

      h. de ontvangen vastgestelde periodieke meterstand, de meest recent vastgestelde meterstand is;

      i. de vastgestelde meterstand tijdig is ingediend, gelet op de mogelijkheid van de in [5.5.1.3][ref4] bedoelde
      wederpartij om hierover in dispuut te treden;

      j. de aansluiting een kleinverbruikaansluiting is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.4.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.2.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.1.2.2
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 5.5.1.3
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.3.4.2
    text: |-
      Indien naar aanleiding van [5.3.4.1][ref1] de ontvangen meterstand niet verwerkt kan worden, bericht de regionale
      netbeheerder dit uiterlijk de werkdag na ontvangst van de vastgestelde meterstand aan de leverancier en vermeldt
      daarbij:

      a. de EAN-code van de aansluiting;

      b. de reden van het niet verwerken van de vastgestelde meterstand:

      1° het bericht is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de aansluiting is op de opnamedatum van de meterstand niet voorzien van een meetinrichting;

      4° de leverancier is niet vermeld in het aansluitingenregister voor de opnamedatum;

      5° de leverancier is niet de leverancier die het mutatieproces heeft geïnitieerd;

      6° het aantal vastgestelde meterstanden komt niet overeen met het aantal actieve telwerken van de meetinrichting;

      7° het aantal posities van de vastgestelde meterstand is groter dan het aantal posities van het telwerk van de
      meetinrichting;

      8° de ontvangen vastgestelde periodieke meterstand is niet de meest recent vastgestelde meterstand;

      9° de vastgestelde meterstand is te laat ingediend waardoor de wederpartij als bedoeld in [5.5.1.3][ref2], hierover
      niet meer in dispuut kan treden;

      10° de aansluiting is geen kleinverbruikaansluiting;

      c. indien aangeleverd in het bericht: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.1.3
