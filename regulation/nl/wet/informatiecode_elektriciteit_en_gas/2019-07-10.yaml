        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.4.5
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, bepaalt de regionale netbeheerder het verbruik overeenkomstig [5.3.2][ref2], op basis van:

      (i) de overeenkomstig [5.1.3.4a][ref3] vastgestelde meterstanden;

      (ii) de overeenkomstig [5.3.4.3, onderdeel c][ref4] gecollecteerde meterstanden;

      (iii) de overeenkomstig [5.3.4.3a][ref5] vastgestelde meterstanden, of

      (iv) de overeenkomstig [5.3.4.3b][ref6] berekende meterstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.4a
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3a
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3b
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.4.5
