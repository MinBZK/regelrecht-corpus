        artikel: 4.4.4.1
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.5.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en het verbruik bij het eindeleveringsproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.5.1.1
    text: |-
      De leverancier stuurt tenminste vijf werkdagen en ten hoogste twintig werkdagen voor de switchdatum namens
      de aangeslotene een programmaverantwoordelijkeswitchmelding, hierna te noemen een PV-switchmelding naar de
      netbeheerder. In de PV-switchmelding is opgenomen:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.1.1
  - number: 4.5.2.1
    text: |-
      Naar aanleiding van de switchmelding controleert de netbeheerder of:

      a. de PV-switchmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de PV-switchdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig
      werkdagen in de toekomst ligt;

      d. de nieuwe programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      e. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting voor een eerdere of dezelfde datum;

      f. de switchmelding wordt ingediend door de in het aansluitingenregister vermelde leverancier;

      g. de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.1
  - number: 4.5.2.2
    text: |-
      Als alle controles uit [4.5.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.5.2.4][ref2]. Als dat niet het geval is, wordt de PV-switch niet uitgevoerd en wordt de procedure na
      [4.5.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.5.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.5.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.2
    references:
