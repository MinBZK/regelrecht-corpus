        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.3.4.3
    text: |-
      De regionale netbeheerder collecteert een op afstand uitleesbare meterstand namens de leverancier, indien de
      leverancier in gebreke blijft en de regionale netbeheerder geen tijdig vastgestelde meterstand van de leverancier,
      bedoeld in [5.1.4.1][ref1], heeft ontvangen:

      a. binnen vijftien werkdagen na de mutatiedatum van het betreffende mutatieproces, bedoeld in
      [3.1 tot en met 3.4][ref2] en [3.15][ref3], of;

      b. binnen veertien maanden na de laatst vastgestelde meterstand, waarbij een meterstand wordt berekend en
      vastgesteld voor de datum van één jaar na de opnamedatum van de laatst vastgestelde meterstand, of

      c. binnen vijftien werkdagen na het begin van de maand waarop de meterstand, zoals bedoeld in [5.1.2.1a][ref4],
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.2.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.4.1
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
