  - number: 5.3.4.4
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “profielallocatie”
      heeft, bepaalt de regionale netbeheerder het verbruik voor de reconciliatie, overeenkomstig [5.3.2][ref2] en
      [5.3.3][ref3], op basis van alle ontvangen vastgestelde meterstanden en namens de leverancier door de regionale
      netbeheerder vastgestelde meterstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
