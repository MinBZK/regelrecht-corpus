  - number: 2.1.5a
    text: |-
      Indien aan een aansluiting secundaire allocatiepunten zijn toegekend, neemt de netbeheerder in het
      aansluitingenregister tevens deze secundaire allocatiepunten op en legt daarvan de volgende gegevens vast:

      a. Van [artikel 2.1.3][ref1], de onderdelen b, f tot en met j, q tot en met s, en u;

      b. Van [artikel 2.1.3][ref2], de onderdelen c, d, e, l en p waarbij de netbeheerder er zorg voor draagt dat deze
      onderdelen voor de secundaire allocatiepunten gelijk zijn aan die voor het bijbehorende primaire allocatiepunt;

      c. Van [artikel 2.1.4][ref3], de onderdelen b, d, f, g en h; en

      d. Van [artikel 2.1.5][ref4],

      (i) onderdeel f, en

      (ii) de onderdelen a, b, c en g, waarbij de netbeheerder er zorg voor draagt dat deze onderdelen voor de secundaire
      allocatiepunten gelijk zijn aan die voor het bijbehorende primaire allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.5
