        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.3.4.3a
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 5.3.4.3b
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: 5.3.4.4
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref6
        bwb_id: BWBR0037934
        artikel: 5.3.4.4
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.5.2
    text: |-
      De regionale netbeheerder verstuurt de gegevens, bedoeld in [5.3.5.1][ref1], naar de leverancier(s), waarbij wordt
      vermeld:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de verbruiksperiode;

      d. de van toepassing zijnde procesidentificatie;

      e. identificatie van de meetinrichting;

      f. per telwerk de volgende gegevens:

      1° de beginstand met bijbehorende opnamedatum en herkomst van de meterstand;

      2° de eindstand met bijbehorende opnamedatum en herkomst van de meterstand;

      3° het verbruik;

      g. indien aangeleverd in de ontvangen vastgestelde meterstand: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.5.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.5.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.5.3
    text: |-
      De regionale netbeheerder stelt de vastgestelde meterstand en verbruik uiterlijk vijf werkdagen na de ontvangst van
      de vastgestelde meterstand of uiterlijk vijf werkdagen nadat de regionale netbeheerder namens de leverancier een
      meterstand heeft vastgesteld, beschikbaar in het toegankelijk meetregister.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.5.3
  - number: 5.4.1.1
    text: |-
      De regionale netbeheerder bepaalt het standaardjaarverbruik overeenkomstig [bijlage B1.3][ref1] voor
      elektriciteitsaansluitingen en [bijlage B3.4][ref2] voor gasaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
  - number: 5.4.1.2
    text: |-
      Behoudens het bepaalde in [B3.4.7][ref1] past de netbeheerder op 1 januari 2015 eenmalig het standaardjaarverbruik
      aan voor alle gasaansluitingen van de profielcategorieën G1A en G2A, door het bestaande standaardjaarverbruik te
      vermenigvuldigen met 0,98408.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.4.1.2a
    text: |-
      Behoudens het bepaalde in [B3.4.7][ref1] past de netbeheerder op 1 januari 2017 eenmalig het standaardjaarverbruik
      aan voor alle gasaansluitingen van de profielcategorieën G1A en G2A, door het bestaande standaardjaarverbruik te
      delen door 1,008027.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.4.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.4.1.3
    text: |-
      De netbeheerder bepaalt het verbruik voor het bepalen van het standaardjaarverbruik gas overeenkomstig
      [5.3.3.1][ref1] waarbij voor letter g wordt gelezen: ‘voor niet temperatuur gecorrigeerde meetinrichtingen
      is de volumeherleidingsfactor op grond van de 15-graden methode bepaald op 0,97624’, met inachtneming van
      [5.1.3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.1.3.5
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.4.1.4
    text: |-
      Indien er sprake is van een niet correct geregistreerd verbruik als gevolg van een defect in de meetinrichting,
      niet zijnde een schakelstoring, zal de netbeheerder in afwijking van [5.4.1.1][ref1] het standaard jaarverbruik
      vaststellen op het gemiddelde van het profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.4.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.4.1.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.4.1.5
    text: |-
      Indien er sprake is van een niet correct geregistreerd verbruik als gevolg van een schakelstoring in de
      meetinrichting, zal de netbeheerder in afwijking van [5.4.1.1][ref1] een standaard jaarverbruik bepalen door de
      verhouding 40% normaal en 60% laag toe te passen op het vastgestelde totale standaard jaarverbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.4.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.4.1.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.5.1.1
    text: |-
      Het dispuutproces wordt gebruikt om geschillen op te lossen tussen leveranciers en regionale netbeheerders
      over alle vastgestelde meterstanden, bedoeld in [5.1.3.4][ref1], [5.2.2.3][ref2] en [5.3.4.3][ref3], en, indien
      noodzakelijk, meterstanden te corrigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.2.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.3.4
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.2.2.3
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.3.4.3
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.5.1.2
    text: |-
      De dispuuttermijn eindigt op de laatste kalenderdag van de derde maand na de maand waarin de dag valt waarop de
      vastgestelde meterstand betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.1.2
  - number: 5.5.1.3
    text: |-
      De regionale netbeheerder of leverancier die het dispuutproces start (hierna te noemen: de wederpartij) heeft tot
      twintig werkdagen, voordat de dispuuttermijn verstrijkt, de tijd om een vastgestelde meterstand te beoordelen en op
      basis van de tabel in [bijlage 5][ref1] te besluiten om in dispuut te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 5.5.1.4
    text: |-
      De wederpartij stuurt uiterlijk twintig werkdagen, voordat de dispuuttermijn verstrijkt, een dispuutmelding met
      een alternatieve meterstand naar de leverancier die de meterstand, bedoeld in [5.1.3.4][ref1] of [5.3.4.3][ref2],
      of naar de regionale netbeheerder die de meterstand, bedoeld in [5.2.2.3][ref3], heeft vastgesteld waartegen in
      dispuut wordt getreden (hierna te noemen: de initiërende partij). De meegestuurde alternatieve meterstand geldt
      voor de mutatiedatum waarop het dispuut betrekking heeft. In dit bericht worden vermeld:

      a. EAN-code van de aansluiting;

      b. de reden van het verzenden van het bericht, te weten: "meterstand in dispuut";

      c. de bedrijfs-EAN-code van de wederpartij;

      d. de bedrijfs-EAN-code van de initiërende partij;

      e. de van toepassing zijnde procesidentificatie;

      f. de identificatie van de meetinrichting;

      g. per telwerk de volgende gegevens:

      1° de meterstand;

      2° de datum waarop de meterstand betrekking heeft;

      3° aanduiding van de herkomst van de meterstand;

      4° in geval van elektriciteit: de telwerkindicatie;

      h. indien de wederpartij dit wenst op te geven: het referentienummer van de wederpartij;

      i. indien de wederpartij dit wenst op te geven: een toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.2.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.1.3.4
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.3.4.3
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.2.2.3
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5.2.1
    text: |-
      De initiërende partij beoordeelt uiterlijk vijf werkdagen na ontvangst van de dispuutmelding op basis van de tabel
      in [bijlage 5][ref1] de ontvangen alternatieve meterstand van de wederpartij en besluit tot:

      a. het accepteren van de alternatieve meterstand en het proces wordt vervolgd vanaf [5.5.4.1][ref2];

      b. het niet accepteren van de alternatieve meterstand, zodat een overleg, zoals bedoeld in [5.5.2.2][ref3],
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.5.4.1
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 5.5.2.2
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.2
    text: |-
      Het overleg tussen de initiërende partij en wederpartij vindt plaats binnen vijf werkdagen na ontvangst van de
      alternatieve meterstand. Dit overleg kan leiden tot:

      a. overeenstemming over de vast te stellen meterstand en het proces wordt vervolgd vanaf [5.5.4.1][ref1];

      b. geen overeenstemming over de vast te stellen meterstand en een fysieke opname op basis van kosten ongelijk,
      bedoeld in [5.5.3.1][ref2], wordt ingepland.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.4.1
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.5.3.1
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.3
    text: |-
      De alternatieve meterstand is geaccepteerd door de initiërende partij, indien de initiërende partij niet tijdig
      heeft gereageerd op de ontvangst van de dispuutmelding van de wederpartij, als bedoeld in [5.5.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.2.1
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.2.4
    text: |-
      Indien de opnamedatum van de alternatieve stand die op basis van de in [bijlage 5][ref1] opgenomen beslistabel
      wint, ligt buiten een periode van drie maanden voor de mutatiedatum van de vastgestelde stand waarop het dispuut
      betrekking heeft, dan kan de initiërende partij de dispuutmelding afwijzen, zodat een overleg, zoals bedoeld in
      [5.5.2.2][ref2], noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.5.2.2
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.1
    text: |-
      Na instemming van de initiërende partij en de wederpartij over de kosten van de fysieke opname op basis kosten
      ongelijk, laat de initiërende partij de fysieke opname naar aanleiding van [5.5.2.2, onderdeel b][ref1], uiterlijk
      vijf werkdagen voor het verstrijken van de dispuuttermijn uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.2.2
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.2
    text: |-
      De alternatieve meterstand van de wederpartij, bedoeld in [5.5.1.4][ref1], wordt geaccepteerd door de initiërende
      partij indien niet tijdig een fysieke opname op basis van kosten ongelijk heeft kunnen plaatsvinden, bedoeld in
      [5.5.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.1.4
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.5.3.1
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.3
    text: |-
      De initiërende partij accepteert:

      a. de oorspronkelijke meterstand op:

      (i) een levertelwerk, indien deze ligt tussen de op basis van interpolatie van de fysieke opname op basis kosten
      ongelijk afgeleide

      meterstand + 15% * SJV / vermenigvuldigingsfactor en de op basis van interpolatie van de fysieke opname op basis
      kosten ongelijk afgeleide

      meterstand – 15% * SJV / vermenigvuldigingsfactor;

      (ii) een teruglevertelwerk (elektriciteit), indien deze ligt tussen de op basis van interpolatie van de fysieke
      opname op basis kosten ongelijk afgeleide

      meterstand + 15% * 5000 kWh / vermenigvuldigingsfactor en de op basis van interpolatie van de fysieke opname op
      basis kosten ongelijk afgeleide

      meterstand – 15% * 5000 kWh / vermenigvuldigingsfactor.

      b. de op basis van interpolatie van de fysieke opname op basis kosten ongelijk afgeleide meterstand
      op de betreffende mutatiedatum, indien de oorspronkelijke meterstand buiten de grenzen, gesteld in
      [5.5.3.3, onderdeel a][ref1], valt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.3.3
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.3.4
    text: |-
      De initiërende partij meldt het resultaat van de beoordeling uit [5.5.3.3][ref1] uiterlijk vijf werkdagen voor het
      verstrijken van de dispuuttermijn aan de wederpartij en het proces wordt vervolgd vanaf [5.5.4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.4.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.3.3
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.5.4.1
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5.4.1
    text: |-
      De initiërende partij stelt zo snel mogelijk doch uiterlijk vijf werkdagen voor het verstrijken van de
      dispuuttermijn een meterstand vast, indien de oorspronkelijk vastgestelde meterstand wordt herzien.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.4.1
  - number: 5.5.4.2
    text: |-
      De initiërende partij, indien deze een leverancier is, verstuurt de in [5.5.4.1][ref1] vastgestelde meterstand
      binnen één werkdag na de vaststelling doch uiterlijk vijf werkdagen voor het verstrijken van de dispuuttermijn naar
      de regionale netbeheerder overeenkomstig [paragraaf 5.1.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.5.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.5.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.5.4.1
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 6.1.1.1
    text: |-
      De meetverantwoordelijke stelt voor mutatieprocessen en voor de plaatsing, wijziging of wegname van
      grootverbruikmeetinrichtingen, zoals bedoeld in [paragrafen 4.1 tot en met 4.4][ref1], [4.6 tot en met 4.8][ref2]
      en [4.10 tot en met 4.12][ref3], overeenkomstig [6.2][ref4] voor elektriciteitsaansluitingen en [6.4][ref5] voor
      gasaansluitingen, gevalideerde meterstand vast voor grootverbruikaansluitingen, die niet behoren tot de categorieën
      zoals genoemd in [6.1.1.2][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.10'
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref5
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref6
        bwb_id: BWBR0037934
        artikel: 6.1.1.2
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.1.2
    text: |-
      De meetverantwoordelijke stelt voor mutatieprocessen, zoals bedoeld in [6.1.1.1][ref1], geen
      meterstand vast voor gasaansluitingen behorend tot de afnamecategorie GGV, GXX, GIS of GIN, bedoeld in
      [paragraaf 4.3.1 van de Allocatiecode gas][ref2], of voor elektriciteitsaansluitingen die onbemeten zijn op grond
      van [artikel 2.30, eerste lid van de Netcode elektriciteit](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel4.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.1.1.1
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: 4.3.1
  - number: 6.1.1.3
    text: |-
      De meetverantwoordelijke stuurt de vastgestelde meterstand en indien geen sprake is van een proces volgens
      [paragraaf 4.3][ref1] of [4.10][ref2], het berekende verbruik, zoals bedoeld in [6.1.1.1][ref3], uiterlijk de
      tiende werkdag van de maand volgend op de mutatiedatum aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.10'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.1.1.1
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.1.4
    text: |-
      De netbeheerder stelt namens de meetverantwoordelijke een verbruik vast, indien de netbeheerder voor de
      mutatieprocessen als bedoeld in de [paragrafen 4.1][ref1], [4.2][ref2], [4.4][ref3], [4.11][ref4] en [4.12][ref5]
      de tiende werkdag van de maand volgend op de mutatiedatum geen vastgestelde meterstand en verbruik heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.11'
      - id: ref5
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.12'
  - number: 6.1.1.5
    text: |-
      De netbeheerder stuurt uiterlijk de vijftiende werkdag van de maand volgende op de mutatiedatum de meetgegevens,
      bedoeld in [6.1.1.4][ref1], naar de meetverantwoordelijke. In afwijking van [paragraaf 9.1][ref2] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.1.1.4
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 6.1.1.6
    text: |-
      De meetverantwoordelijke verwerkt de meetgegevens, bedoeld in [6.1.1.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.1.1.5
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.2.1
    text: |-
      De netbeheerder verstuurt uiterlijk de vijftiende werkdag van de maand volgend op de mutatiedatum de meetgegevens,
      zoals bedoeld in [6.1.1.3][ref1] of [6.1.1.4][ref2], naar de leverancier, waarbij wordt vermeld:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de startdatum van de verbruiksperiode;

      e. de einddatum van de verbruiksperiode;

      f. het verbruik, bedoeld onder [6.1.1.3][ref3] of [6.1.1.4][ref4];

      g. de meterstand behorend bij de mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6.1.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.1.1.3
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.1.1.4
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.1.1.3
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 6.1.1.4
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.1.1
    text: |-
      In geval van een telemetriegrootverbruikmeetinrichting wordt de meting op de dag van de verzameling van de
      meetgegevens door de meetverantwoordelijke op volledigheid gevalideerd aan de hand van de volgende criteria:

      a. status in de meetinrichting aangaande de meting of de meetwaarde en status van het meetkanaal geeft geen
      indicatie van een fout;

      b. tijdsynchroniteit van de meetinrichting en meetperiode blijft binnen de in
      [4.3.5.3 tot en met 4.3.5.5 van de Meetcode elektriciteit][ref1] aangegeven normen;

      c. alle meetperioden zijn aanwezig en bevatten een meetwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.5.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.5.3
  - number: 6.2.1.2
    text: |-
      In geval van een telemetriegrootverbruikmeetinrichting worden de gecollecteerde meetgegevens op de dag van de
      verzameling van de meetgegevens door de meetverantwoordelijke op juistheid gevalideerd aan de hand van de volgende
      criteria:

      a. in geval van een hoofdmeting en een controlemeting is het verschil per dag in de hoeveelheid energie
      gemeten door de hoofdmeting en de controlemeting kleiner dan tweemaal de geldende nauwkeurigheidsklasse van
      de meetinrichting zoals bepaald in [bijlage B1 van de Meetcode elektriciteit][ref1] vermenigvuldigd met het
      daguitwisseling van de hoofdmeter;

      b. de gemeten hoeveelheid energie is groter dan of gelijk aan nul;

      c. de hoeveelheid met het net uitgewisselde energie per meetperiode is kleiner dan 120% van het nominale capaciteit
      van de meetinrichting;

      d. de gemeten hoeveelheid energie is niet langer dan een week gelijk aan nul.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 6.2.1.3
    text: |-
      De op grond van [6.2.1.1][ref1] of [6.2.1.2][ref2] afgekeurde meetgegevens worden, voor zover mogelijk, automatisch
      gerepareerd overeenkomstig [5.4.3 van de Meetcode elektriciteit][ref3] opdat ze alsnog aan [6.2.1.1][ref4] en
      [6.2.1.2][ref5] voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Paragraaf5.4.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.1
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.1.1
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.1.2
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037946
        paragraaf: 5.4.3
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 6.2.1.1
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: 6.2.1.2
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.1.4
    text: |-
      In geval van een profielgrootverbruikmeetinrichting en een productiemeetinrichting worden de verzamelde
      meetgegevens gevalideerd op volledigheid en op juistheid aan de hand van de volgende criteria:

      a. de voor de bepaling van de hoeveelheid uitgewisselde energie benodigde tellerstanden zijn beschikbaar;

      b. de gemeten hoeveelheid met het net uitgewisselde energie is groter dan 50% van de hoeveelheid die op grond van
      de uitwisseling tijdens de voorafgaande periode zou mogen worden verwacht;

      c. de gemeten hoeveelheid met het net uitgewisselde energie is kleiner dan 200% van de hoeveelheid die op grond van
      de uitwisseling tijdens de voorafgaande periode zou mogen worden verwacht.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.4
  - number: 6.2.1.5
    text: |-
      Indien de meetgegevens bedoeld in [6.2.1.4][ref1] niet voldoen aan de in 6.2.1.4 genoemde validatiecriteria, worden
      de meetgegevens door de meetverantwoordelijke (opnieuw) af- of uitgelezen of wordt in overleg met de aangeslotene
      vastgesteld of de gemeten hoeveelheid overeenkomt met de hoeveelheid die zou mogen worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.1.4
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.1.6
    text: |-
      Indien de meetgegevens bedoeld in [6.2.1.4][ref1] wel voldoen aan de in 6.2.1.4 genoemde validatiecriteria, worden
      de meetgegevens door de meetverantwoordelijke vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.1.4
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.1.7
    text: |-
      De validatie en vaststelling zoals bedoeld in [6.2.1.4][ref1] en [6.2.1.6][ref2] vindt plaats uiterlijk de werkdag
      na de dag van verzameling van meetgegevens zoals bedoeld in [5.2 van de Meetcode elektriciteit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.6
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.1.4
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.1.6
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037946
        paragraaf: '5.2'
  - number: 6.2.2.1
    text: |-
      In geval van een telemetriegrootverbruikmeetinrichting past de meetverantwoordelijke de vermenigvuldigingsfactor
      toe op de in het validatieproces goedgekeurde meetgegevens alvorens deze te verzenden aan de netbeheerder opdat de
      werkelijke hoeveelheid met het net uitgewisselde energie in het overdrachtspunt van de aansluiting wordt verzonden.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.1
  - number: 6.2.2.2
    text: |-
      De op grond van [6.2.2.1][ref1] tot stand gekomen meetgegevens inzake alle aansluitingen waarvoor hij
      meetverantwoordelijkheid draagt, worden tezamen met de op basis van 3.3.3.4 van de [Meetcode elektriciteit][ref2]
      bepaalde meetgegevens, op de eerstvolgende werkdag vóór 10:00 uur door de meetverantwoordelijke verzonden aan de
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.1
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037946
  - number: 6.2.2.2a
    text: |-
      In geval van een grootverbruikaansluiting waaraan een of meer secundaire allocatiepunten zijn toegekend, is
      [artikel 6.2.2.2][ref1] van toepassing op elk afzonderlijk allocatiepunt dat aan deze aansluiting is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.2
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.3
    text: |-
      Eventuele niet-automatisch gerepareerde meetgegevens, bedoeld in [6.2.2.1][ref1], van een bepaalde dag worden,
      samen met de naar aanleiding van [5.5.1 van de Meetcode elektriciteit][ref2] gecorrigeerde meetgegevens, vóór 10:00
      uur op de vijfde werkdag na de desbetreffende dag door de meetverantwoordelijke als zodanig gekenmerkt verzonden
      aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.5.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.1
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.5.1
  - number: 6.2.2.4
    text: |-
      De mede naar aanleiding van [5.5.1 van de Meetcode elektriciteit][ref1] vastgestelde definitieve meetgegevens,
      zoals bedoeld in [6.2.2.1][ref2], van een bepaalde dag worden vóór 24:00 uur van de negende werkdag na de
      desbetreffende dag door de meetverantwoordelijke verzonden aan de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.5.1
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.2.1
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.5
    text: |-
      Alle meetgegevens, zoals bedoeld in [6.2.2.1][ref1], die zijn afgekeurd in het validatieproces worden in het
      bericht waarmee ze worden verzonden aangemerkt als voorlopige meetgegevens. Wanneer meetgegevens binnen de in
      [6.2.2.4][ref2] genoemde termijn niet opnieuw worden aangeleverd, dan worden deze na tien werkdagen definitief.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.1
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.2.4
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.6
    text: |-
      Maandelijks, uiterlijk de tiende werkdag van de maand na de maand waarop de meetgegevens, zoals bedoeld in
      [6.2.2.1][ref1] betrekking hebben, verstrekt de meetverantwoordelijke aan de netbeheerder:

      a. de werkelijke (gecorrigeerde) hoeveelheid met het net uitgewisselde energie, onderscheiden naar normaaluren en
      laaguren, in het overdrachtspunt van de aansluiting, waarbij in geval van een meetinrichting met één telwerk deze
      beide hoeveelheden worden bepaald op basis van de 15-minutenwaarden;

      b. de tellerstand(en) (normaaltelwerk en laagtelwerk of in geval van een meetinrichting met één telwerk:
      enkeltelwerk);

      c. de bij de tellerstanden behorende vermenigvuldigingsfactoren;

      d. indien van toepassing de kW of de hoeveelheid met het net uitgewisselde blindenergie.

      Deze overdracht van meetgegevens vindt plaats uiterlijk de tiende werkdag van de maand na de maand waarop
      de meetgegevens betrekking heeft en overeenkomstig hetgeen daaromtrent in [paragraaf 13.5 van de Netcode
      elektriciteit](onbekend) is bepaald, waarbij voor ‘erkende programmaverantwoordelijke’ dient te worden gelezen
      ‘meetverantwoordelijke’.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.1
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.6a
    text: |-
      In geval van een grootverbruikaansluiting waaraan een of meer secundaire allocatiepunten zijn toegekend, is
      [artikel 6.2.2.6][ref1] van toepassing op de aansluiting als geheel en artikel 6.2.2.6, de onderdelen a en b, op
      elk afzonderlijk allocatiepunt dat aan deze aansluiting is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.6a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.6
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.7
    text: |-
      In geval van een profielgrootverbruikmeetinrichting op een aansluiting groter dan 3x80A en een
      productiemeetinrichting, worden de meetgegevens bedoeld in [6.2.1.4][ref1] maandelijks, uiterlijk op de tiende
      werkdag na de dag van vaststelling zoals bedoeld in [6.2.1.6][ref2] aan de netbeheerder verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.1.4
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.1.6
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.8
    text: |-
      In geval van een profielgrootverbruikmeetinrichting op een aansluiting kleiner dan of gelijk aan 3x80A, worden de
      meetgegevens bedoeld in [6.2.1.4][ref1] jaarlijks, uiterlijk op de tiende werkdag na de dag van vaststelling zoals
      bedoeld in [6.2.1.6][ref2] aan de netbeheerder verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.1.4
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.1.6
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.9
    text: |-
      Alle op grond van [5.4.3.1][ref1] of [5.4.3.2 van de Meetcode elektriciteit][ref2] automatisch gerepareerde
      meetgegevens worden overeenkomstig [6.2.1.1][ref3] en [6.2.1.2][ref4] gevalideerd alvorens als definitief te kunnen
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel5.4.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel5.4.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 5.4.3.1
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 5.4.3.2
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.2.1.1
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 6.2.1.2
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.10
    text: |-
      Indien onvolledige of onjuiste meetgegevens niet automatisch kunnen worden gerepareerd, vervangt de
      meetverantwoordelijke handmatig de meetgegevens door nullen dan wel voorlopige waarden. De definitieve meetgegevens
      worden binnen de daarvoor in [6.2.2.3][ref1] vastgestelde periode gerepareerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.10
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.3
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.11
    text: |-
      Voor reparaties die niet op een van de in [6.2.2.9][ref1] of [6.2.2.10][ref2] bedoelde wijzen kunnen worden
      uitgevoerd, moet in overleg met de aangeslotene, de netbeheerder, de leverancier en de desbetreffende
      programmaverantwoordelijke een afspraak worden gemaakt over het repareren van de meetgegevens. Indien een
      meetverantwoordelijke niet de mogelijkheid heeft om meetgegevens te collecteren en te valideren voor de vijfde
      werkdag na de dag waarop de meetgegevens betrekking hebben, dient de meetverantwoordelijke een schatting te
      maken die overeenkomstig [6.2.2.3][ref3] aan de netbeheerder wordt overgedragen. De meetverantwoordelijke legt de
      gemaakte schatting voor aan de aangeslotene, netbeheerder, programmaverantwoordelijke en leverancier zodat hij voor
      de overeenkomstig [6.2.2.4][ref4] uit te voeren acties instemming kan hebben ontvangen van betrokken partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.10
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.9
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.2.10
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.2.2.3
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 6.2.2.4
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.12
    text: |-
      De meetverantwoordelijke registreert alle reparaties die overeenkomstig [6.2.2.9 tot en met 6.2.2.11][ref1] zijn
      uitgevoerd en verstrekt de aangeslotene en de netbeheerder desgevraagd een rapportage over deze reparaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.9
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.13
    text: |-
      Desgevraagd geeft de meetverantwoordelijke aan de netbeheerder van het landelijk hoogspanningsnet inzage in de
      registratie met betrekking tot de onder [6.2.2.12][ref1] genoemde reparaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.12
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.12
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.14
    text: |-
      Onvolkomenheden aan de meetinrichting die leiden tot aanpassing van de onder
      [4.3.3.2 van de Meetcode elektriciteit][ref1] bedoelde meetgegevens alsmede onvolkomenheden met betrekking tot de
      verzameling van meetgegevens worden binnen vijf werkdagen na constatering door de meetverantwoordelijke gemeld aan
      de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.3.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.14
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.3.2
  - number: 6.2.2.15
    text: |-
      Indien na het verstrijken van de tiende werkdag na de maand waarop de meetgegevens betrekking hebben wordt
      geconstateerd dat er, als gevolg van een onvolkomenheid aan de meetinrichting of de verzameling van meetgegevens,
      sprake is van onjuiste meetgegevens, wordt door de meetverantwoordelijke de werkelijke hoeveelheid met het net
      uitgewisselde energie in de desbetreffende maand en het voor de allocatie aangeleverde volume aan de aangeslotene
      doorgegeven binnen tien werkdagen na de maand waarin de onvolkomenheid geconstateerd is. De meetverantwoordelijke
      informeert binnen deze termijn de programmaverantwoordelijke, leverancier en netbeheerder over de aan de
      aangeslotene verstrekte informatie. Tevens verzendt de meetverantwoordelijke aan de netbeheerder een nieuw bericht
      met de juiste maand meetgegevens binnen dezelfde termijn. De netbeheerder verwerkt dit nieuw verkregen bericht met
      maandmeetgegevens uiterlijk de vijftiende werkdag van de daaropvolgende maand.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.15
  - number: 6.2.2.16
    text: |-
      Indien na het verstrijken van de tiende werkdag na de maand, waarop de meetgegevens betrekking hebben, wordt
      geconstateerd dat er, als gevolg van een onvolkomenheid in de meetinrichting, sprake is van onjuiste meetgegevens
      in het allocatieproces, wordt door de meetverantwoordelijke binnen een maand een overleg geïnitieerd met
      aangeslotene, netbeheerder, programmaverantwoordelijke en leverancier met als doel overeenstemming te bereiken over
      een schatting van het werkelijke met het net uitgewisselde energie. Indien binnen een periode van drie maanden na
      informeren van de onvolkomenheid in de meetinrichting geen overeenstemming is bereikt tussen partijen beslist de
      netbeheerder over het door de meetverantwoordelijke te communiceren volume. De meetverantwoordelijke communiceert
      het overeengekomen volume overeenkomstig [6.2.2.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.15
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.2.2.16
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.15
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.1.1
    text: |-
      De netbeheerder maakt bij het samenstellen van de meetgegevens die volgens deze paragraaf worden doorgegeven,
      gebruik van meetgegevens, geregistreerd door meetinrichtingen op aansluitingen, die hij op grond van
      [paragraaf 6.2 van deze code][ref1] van de desbetreffende meetverantwoordelijken ontvangt en van de meetgegevens
      geregistreerd door de meetinrichtingen in het (de) overdrachtspunt(en) van de aansluitingen van zijn net met andere
      netten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.1.2
    text: |-
      De netbeheerder bewaakt, mede op basis van zijn aansluitingenregister, de ontvangst van meetgegevens
      van aansluitingen, die hij op grond van [paragraaf 6.2 van deze code][ref1] van de desbetreffende
      meetverantwoordelijken moet ontvangen op volledigheid. Bij geconstateerde tekortkomingen informeert de
      netbeheerder de meetverantwoordelijke en stelt hij de desbetreffende meetverantwoordelijke zonodig in gebreke.
      Indien de meetverantwoordelijke de eventueel geconstateerde tekortkomingen zoals bedoeld in 4.1a.1 van de
      [Meetcode elektriciteit][ref2] niet opheft, meldt de netbeheerder dit aan de aangeslotene, aan de Autoriteit
      Consument en Markt en aan de netbeheerder van het landelijk hoogspanningsnet. Indien dit noodzakelijk is voor
      de voortgang van de in deze paragraaf beschreven processen, worden de desbetreffende meetgegevens overeenkomstig
      [artikel 10.17, elfde lid, van de Netcode elektriciteit][ref3] vastgesteld en geeft de netbeheerder daarbij aan dat
      er sprake is van overeenkomstig artikel 10.17, elfde lid, van de Netcode elektriciteit vastgestelde meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037946
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel10.17
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037946
      - id: ref3
        bwb_id: BWBR0037940
        artikel: '10.17'
  - number: 6.3.1.3
    text: |-
      De netbeheerder geeft de meetgegevens van aansluitingen, die hij op grond van [paragraaf 6.2 van deze code][ref1]
      van de desbetreffende meetverantwoordelijken ontvangt, door.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.1.4
    text: |-
      De in [6.3.11][ref1] en [6.3.12][ref2] bedoelde overdracht van meetgegevens en indiening van verzoeken vindt plaats
      overeenkomstig het elektronische berichtenverkeer, bedoeld in [hoofdstuk 9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '9'
  - number: 6.3.2.1
    text: |-
      De netbeheerder controleert telkens onmiddellijk na afloop van de in [6.2.2.2][ref1] en [6.2.2.3][ref2] genoemde
      termijnen en op basis van zijn aansluitingenregister de ontvangst van meetgegevens van aansluitingen, die hij van
      de desbetreffende meetverantwoordelijken heeft ontvangen, op volledigheid aan de hand van de volgende criteria:

      a. Voor een aansluiting uit het aansluitingenregister zijn van de daar vermelde meetverantwoordelijke geen
      meetgegevens ontvangen;

      b. De voor een aansluiting ontvangen meetgegevens passen naar het oordeel van de netbeheerder niet bij de
      capaciteit van de desbetreffende aansluiting;

      c. Een meetverantwoordelijke levert meetgegevens aan van een aansluiting waarvoor in het aansluitingenregister een
      andere meetverantwoordelijk staat vermeld;

      d. Voor een aansluiting hanteert de meetverantwoordelijke een langere periode voor het schatten van meetgegevens
      dan volgens [5.4 van de Meetcode elektriciteit][ref3] is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.2.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0037946#Paragraaf5.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.2.2.2
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.2.2.3
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037946
        paragraaf: '5.4'
  - number: 6.3.2.2
    text: |-
      Indien voor een aansluiting een van de criteria uit [6.3.2.1][ref1] van toepassing is, dan richt de netbeheerder
      een herzieningsverzoek aan de desbetreffende meetverantwoordelijke om nieuwe of aanvullende meetgegevens aan te
      leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.3.2.1
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.11.1
    text: |-
      De netbeheerder geeft aan de netbeheerder van het landelijk hoogspanningsnet de hoeveelheid op het net ingevoede
      duurzame of wkk-elektriciteit per aansluiting, of, indien [artikel 3.2, eerste lid, van de Netcode elektriciteit]
      (onbekend) van toepassing is, per productie-installatie van een groen- of wkk-producent door.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.11.1
  - number: 6.3.11.2
    text: |-
      De netbeheerder geeft aan de groen- of wkk-producent de hoeveelheid op het net ingevoede duurzame of wkk-
      elektriciteit per aansluiting, of, indien [artikel 3.2, eerste lid, van de Netcode elektriciteit](onbekend) van
      toepassing is, per productie-installatie door.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.11.2
  - number: 6.3.11.3
    text: |-
      De in [6.3.11.1][ref1] en [6.3.11.2][ref2] bedoelde informatieoverdracht vindt voor aansluitingen groter dan 3x80A
      op laagspanningsniveau steeds plaats op uiterlijk de vijftiende werkdag van de maand na de maand waarop de data
      betrekking heeft of zoveel vaker als met de aangeslotene is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.11.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.11.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.11.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.3.11.1
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.3.11.2
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.11.4
    text: |-
      De in [6.3.11.1][ref1] en [6.3.11.2][ref2] bedoelde informatieoverdracht vindt voor aansluitingen kleiner of gelijk
      aan 3x80A op laagspanningsniveau éénmaal per jaar op een door de netbeheerder te bepalen tijdstip plaats of zoveel
      vaker als met de aangeslotene overeengekomen. In dat geval worden de in 6.3.11.1 en 6.3.11.2 bedoelde hoeveelheden
      verdeeld in twaalf gelijke delen, tenzij betere gegevens over de maandelijkse hoeveelheden beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.11.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.11.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.11.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.3.11.1
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.3.11.2
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.11.5
    text: |-
      Indien een aangeslotene met een productie-installatie voor duurzame of wkk-elektriciteit in aanmerking wenst te
      komen voor garanties van oorsprong respectievelijk wkk-certificaten voor niet-netlevering, zijn de bepalingen
      [6.3.11.1 tot en met 6.3.11.4][ref1] van overeenkomstige toepassing op de meetdata die wordt gegenereerd door de
      meetinrichting bedoeld in [2.1.1, onderdeel c van de Meetcode elektriciteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.11.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946#Artikel2.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.11.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.3.11.1
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037946
        artikel: 2.1.1
  - number: 6.3.12.1
    text: |-
      De netbeheerder geeft per grootverbruikaansluiting met een doorlaatwaarde kleiner dan of gelijk aan 3x80A op
      laagspanningsniveau jaarlijks, of zoveel vaker als de netbeheerder een meterstand van de meetverantwoordelijke
      ontvangt, aan de leverancier die voor de desbetreffende aansluiting balanceringsverantwoordelijkheid draagt of laat
      dragen, de laatste en voorlaatste tellerstand(en) voor de hoeveelheid met het net uitgewisselde energie alsmede
      de hoeveelheid in de tussenliggende periode op de desbetreffende aansluiting uitgewisselde elektrische energie,
      onderscheiden naar normaaluren en laaguren als er sprake is van een meetinrichting met twee telwerken, door, tenzij
      op grond van een aansluit- en transportovereenkomst met de desbetreffende aangeslotene anders is overeengekomen.
      Deze overdracht van meetgegevens vindt plaats uiterlijk op de vijftiende werkdag van de maand genoemd in het
      aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.12.1
  - number: 6.3.12.2
    text: |-
      De netbeheerder geeft per grootverbruikaansluiting met een doorlaatwaarde groter dan 3x80A op laagspanningsniveau
      en een gecontracteerd transportvermogen kleiner dan 100 kW maandelijks aan de leverancier die voor de
      desbetreffende aansluiting balanceringsverantwoordelijkheid draagt of laat dragen, de laatste en voorlaatste
      tellerstand(en) voor de hoeveelheid met het net uitgewisselde energie alsmede de hoeveelheid in de tussenliggende
      periode op de desbetreffende aansluiting uitgewisselde elektrische energie, onderscheiden naar normaaluren en
      laaguren als er sprake is van een meetinrichting met twee telwerken, door, tenzij op grond van een aansluit- en
      transportovereenkomst met de desbetreffende aangeslotene anders is overeengekomen. Deze overdracht van meetgegevens
      vindt plaats uiterlijk op de vijftiende werkdag van de maand na de maand waarop de meetgegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.12.2
  - number: 6.3.12.3
    text: |-
      De netbeheerder geeft per aansluiting met een gecontracteerd transportvermogen groter dan of gelijk aan 100
      kW maandelijks of zoveel vaker als overeengekomen aan de leverancier die voor de desbetreffende aansluiting
      balanceringsverantwoordelijkheid draagt of laat dragen, de laatste en voorlaatste tellerstand(en) voor de
      hoeveelheid met het net uitgewisselde energie alsmede de hoeveelheid in de tussenliggende periode op de
      desbetreffende aansluiting uitgewisselde elektrische energie, onderscheiden naar normaaluren en laaguren,
      door, tenzij op grond van een aansluit- en transportovereenkomst met de desbetreffende aangeslotene anders is
      overeengekomen. Deze overdracht van meetgegevens vindt plaats uiterlijk op de vijftiende werkdag van de maand na de
      maand waarop de meetgegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.12.3
  - number: 6.3.12.4
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.12.4
  - number: 6.3.12.5
    text: |-
      De netbeheerder dient de meetgegevens als bedoeld in [6.3.12.1 tot en met 6.3.12.3][ref1], alsmede de meetgegevens
      die hij ontvangt op grond van [6.2.2][ref2], gedurende een termijn van tenminste drie jaren beschikbaar te houden.
      De netbeheerder verstrekt de aangeslotene of diens gemachtigde op verzoek de meetgegevens van de desbetreffende
      aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.3.12.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.3.12.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.3.12.1
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.4.1.1
    text: |-
      In geval van een telemetriegrootverbruiker wordt de meting op de dag van verzameling van de meetgegevens door de
      meetverantwoordelijke op volledigheid gevalideerd aan de hand van de volgende criteria:

      a. status in de meetinrichting aangaande de meting of de meetwaarde en status van het meetkanaal geeft geen
      indicatie van een fout;

      b. tijdsynchroniteit van de meetinrichting en meetperiode blijft binnen de in
      [4.3.4.2 tot en met 4.3.4.4 van de Meetcode gas RNB][ref1] aangegeven eisen;

      c. alle meetperioden zijn aanwezig en bevatten een meetwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.4.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 4.3.4.2
  - number: 6.4.1.2
    text: |-
      In geval van een telemetriegrootverbruiker worden de gecollecteerde meetgegevens op de dag van verzameling van de
      meetgegevens door de meetverantwoordelijke op juistheid gevalideerd aan de hand van de volgende criteria:

      a. [Vervallen]

      b. de door de meetinrichting gemeten hoeveelheid gas [m3(n)] is groter dan of gelijk aan nul;

      c. de door de meetinrichting gemeten hoeveelheid gas [m3(n)] per meetperiode is kleiner dan 120% van de maximale
      capaciteit van de meetinrichting;

      d. de gemeten hoeveelheid gas is niet langer dan één week gelijk aan nul.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.2
  - number: 6.4.1.3
    text: |-
      Als de meetgegevens niet voldoen aan het in [6.4.1.2, onderdeel d][ref1], genoemde validatiecriterium wordt met de
      aangeslotene overlegd of het gemeten verbruik overeenkomt met het verbruik dat zou mogen worden verwacht. Indien
      het gemeten verbruik overeenkomt met het gebruik dat zou mogen worden verwacht, wordt voldaan aan het gestelde in
      6.4.1.2, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.2
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.4
    text: |-
      De verzamelde meetgegevens van uurlijks op afstand uitleesbare meetinrichtingen worden direct na het verstrijken
      van het betreffende klokuur door de meetverantwoordelijke op juistheid gevalideerd aan de hand van de criteria als
      gesteld in [6.4.1.2, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.2
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.5
    text: |-
      Indien de gecollecteerde meetgegevens van uurlijks op afstand uitleesbare meetinrichtingen niet voldoen aan de
      criteria volgens [6.4.1.4][ref1] worden deze meetgegevens niet verzonden aan het Centraal Systeem Stuursignaal van
      de netbeheerder van het landelijk gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.4
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.6
    text: |-
      In geval van een profielgrootverbruiker worden de verzamelde meetgegevens gevalideerd op volledigheid en op
      juistheid aan de hand van de volgende criteria:

      a. de voor de bepaling van de hoeveelheid gas benodigde tellerstanden zijn beschikbaar;

      b. de gemeten hoeveelheid gas is groter dan 50% van het verbruik dat op grond van het verbruik tijdens de
      voorafgaande periode zou mogen worden verwacht;

      c. de gemeten hoeveelheid gas is kleiner dan 200% van het verbruik dat op grond van het verbruik tijdens de
      voorafgaande periode zou mogen worden verwacht.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.6
  - number: 6.4.1.7
    text: |-
      Indien de meetgegevens genoemd in [6.4.1.6][ref1] niet voldoen aan de in 6.4.1.6 genoemde validatiecriteria
      worden de meetgegevens door de meetverantwoordelijke (opnieuw) afgelezen of worden in overleg met de aangeslotene
      vastgesteld dat het gemeten verbruik overeenkomt met het verbruik dat zou mogen worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.6
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.8
    text: |-
      Indien de meetgegevens bedoeld in [6.4.1.6][ref1] wel voldoen aan de in 6.4.1.6 genoemde validatiecriteria, worden
      de meetgegevens door de meetverantwoordelijke vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.6
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.1.9
    text: |-
      De validatie en vaststelling zoals bedoeld in [6.4.1.6][ref1] en [6.4.1.8][ref2] vindt plaats uiterlijk de werkdag
      na de dag van dataverzameling zoals bedoeld in [5.2 van de Meetcode gas RNB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.8
      [ref3]: https://wetten.overheid.nl/BWBR0037925#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.6
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.4.1.8
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0037925
        paragraaf: '5.2'
  - number: 6.4.1.10
    text: |-
      Bij een invoeder met een aansluiting met een capaciteit groter dan 40 m³(n)/uur waarvan het gas conform [B5.6.9
      van de Allocatiecode gas](onbekend) aan de (erkende programmaverantwoordelijke van) de invoeder toegerekend dient
      te worden met de werkelijke gemeten calorische waarde van het ingevoede gas, verzamelt de meetverantwoordelijke de
      gegevens die conform [5a.6 van de Meetcode gas RNB][ref1] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Paragraaf5a.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037925
        paragraaf: 5a.6
  - number: 6.4.2.1
    text: |-
      In geval van een telemetriegrootverbruiker bewerkt de meetverantwoordelijke op de werkdag volgend op de gasdag van
      verzameling van de meetgegevens de meetgegevens alvorens deze aan de regionale netbeheerder te verzenden zodanig
      dat de herleide volumes in normaal kubieke meters [m3(n)] worden verzonden. Ontbrekende meetgegevens worden geschat
      door de meetverantwoordelijke. De meetverantwoordelijke verzendt de meetgegevens van alle aangeslotenen waarvoor
      hij meetverantwoordelijkheid draagt, voorzien van de van toepassing zijnde statuscode.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.1
  - number: 6.4.2.2
    text: |-
      De meetverantwoordelijke verzendt de in [6.4.2.1][ref1] genoemde meetgegevens aan de regionale netbeheerder
      overeenkomstig hetgeen daaromtrent in [hoofdstuk 9][ref2] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.1
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '9'
  - number: 6.4.2.4
    text: |-
      De meetgegevens van een telemetriegrootverbruiker van een bepaalde gasmaand worden uiterlijk op de vierde
      werkdag van de maand, volgend op de maand waarop de meetgegevens betrekking hebben, voor 07:00 uur, door de
      meetverantwoordelijke verzonden aan de regionale netbeheerder. De meetverantwoordelijke verzendt per aansluiting de
      meetgegevens van een gasmaand in één bericht.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.4
  - number: 6.4.2.5
    text: |-
      Uiterlijk op de twaalfde werkdag, voor 12:00 uur, van de maand na de maand waarin de desbetreffende
      gasdag valt, ontvangt de meetverantwoordelijke van de regionale netbeheerder de meetgegevens van een
      telemetriegrootverbruiker retour waarvan een leverancier of een programmaverantwoordelijke op grond van
      [4.6.3 van de Allocatiecode gas][ref1] bij de regionale netbeheerder om correctie heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4.6.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4.6.3
  - number: 6.4.2.6
    text: |-
      Gewijzigde meetgegevens van een telemetriegrootverbruiker van een bepaalde gasmaand, worden uiterlijk op de
      veertiende werkdag van de maand, volgend op de maand waarop de meetgegevens betrekking hebben, voor 07:00
      uur, door de meetverantwoordelijke gecorrigeerd en gevalideerd verzonden aan de regionale netbeheerder. De
      meetverantwoordelijke verzendt per aansluiting met gewijzigde meetgegevens de meetgegevens voor de gehele gasmaand
      in één bericht.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.6
  - number: 6.4.2.7
    text: |-
      De meetverantwoordelijke gaat na of de overeenkomstig [6.4.2.5][ref1] terug ontvangen meetgegevens moet worden
      gecorrigeerd en zendt de al dan niet gecorrigeerde definitieve meetgegevens uiterlijk op de vijftiende werkdag, van
      de maand na de maand waarin de desbetreffende gasdag valt, voor 12:00 uur opnieuw aan de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.5
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.8
    text: |-
      Wanneer de in [6.4.2.7][ref1] bedoelde meetgegevens binnen de in [6.4.2.6][ref2] genoemde termijn niet opnieuw
      worden aangeleverd, dan worden deze na de vijftiende werkdag van de maand na de maand waarin de desbetreffende
      gasdag valt, gebruikt voor de allocatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.7
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.7
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.4.2.6
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.9
    text: |-
      De meetverantwoordelijke voert de werkzaamheden bedoeld in [6.4.1.1 tot en met 6.4.1.9][ref1] uit voor een uurlijks
      op afstand uitleesbare meetinrichting, direct na het verstrijken van een klokuur alvorens de meetgegevens te
      verzenden aan het Centraal Systeem Stuursignaal van de netbeheerder van het landelijk gastransportnet. De herleide
      volumes worden hierbij bepaald in normaal kubieke meters [m3(n)] en afgerond op hele waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.1
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.10
    text: |-
      De meetgegevens van uurlijks op afstand uitleesbare meetinrichtingen van een bepaald uur worden uiterlijk 5 minuten
      na het verstrijken van dat uur door de meetverantwoordelijke verzonden aan het Centraal Systeem Stuursignaal van de
      netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.10
  - number: 6.4.2.11
    text: |-
      In geval van een profielgrootverbruiker worden de meetgegevens genoemd in [6.4.1.6][ref1] uiterlijk op de tiende
      werkdag na de dag van vaststelling zoals bedoeld in [6.4.1.8][ref2] aan de regionale netbeheerder verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.6
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.4.1.8
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.12
    text: |-
      Alle op grond van [5.4.3.1][ref1] of [5.4.3.2 van de Meetcode gas RNB][ref2] automatisch gerepareerde meetgegevens
      worden overeenkomstig [6.4.1][ref3] gevalideerd alvorens als definitief te kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel5.4.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.12
    references:
      - id: ref1
        bwb_id: BWBR0037925
        artikel: 5.4.3.1
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 5.4.3.2
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.13
    text: |-
      Indien onvolledige of onjuiste meetgegevens niet automatisch kunnen worden gerepareerd, verzendt de
      meetverantwoordelijke nullen dan wel voorlopige waarden aan de regionale netbeheerder en geeft daarbij aan dat
      er sprake is van niet betrouwbare meetgegevens. De meetgegevens worden binnen de daarvoor in [6.4.2.4][ref1]
      vastgestelde periode gerepareerd en als definitieve data verzonden overeenkomstig [6.4.2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.4
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.4.2.2
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.14
    text: |-
      Voor reparaties welke niet op een van de in [6.4.2.12][ref1] of [6.4.2.13][ref2] bedoelde wijzen kunnen
      worden uitgevoerd, moet in overleg met de aangeslotene, de regionale netbeheerder en de desbetreffende
      programmaverantwoordelijke een afspraak worden gemaakt over het repareren van de meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.12
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.13
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.14
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.12
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.4.2.13
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.15
    text: |-
      Alle op grond van [6.4.2.12 tot en met 6.4.2.14][ref1] gerepareerde meetgegevens worden overeenkomstig
      [6.4.1][ref2] gevalideerd alvorens door de meetverantwoordelijke als definitief te kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.12
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.15
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.12
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.16
    text: |-
      Onvolkomenheden aan de meetinrichting die leiden tot aanpassing van de onder 4.3.1.2 van de
      [Meetcode gas RNB][ref1] genoemde gegevens alsmede onvolkomenheden met betrekking tot de datacollectie worden
      binnen vijf werkdagen na constatering door de meetverantwoordelijke gemeld aan de regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037925
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.16
    references:
      - id: ref1
        bwb_id: BWBR0037925
  - number: 6.4.2.17
    text: |-
      Indien gedurende de periode tussen de veertiende werkdag van de maand volgend op de maand waarin de gasdag valt
      waarop de meetgegevens betrekking hebben en de achtste werkdag van de vierde maand na de maand waarin de gasdag
      valt waarop de meetgegevens betrekking hebben, wordt geconstateerd dat er, als gevolg van een onvolkomenheid
      aan de meetinrichting of de verzameling van meetgegevens, sprake is van onjuiste meetgegevens, wordt door de
      meetverantwoordelijke, na afstemming met de desbetreffende leverancier, programmaverantwoordelijke, regionale
      netbeheerder of aangeslotene, een schatting gemaakt van het werkelijk verbruik voor de uren gedurende de
      (vermoedelijke) periode dat de meting onjuist is geweest. De meetverantwoordelijke zendt deze gecorrigeerde
      meetgegevens uiterlijk om 07:00 uur op de achtste werkdag van de vierde maand na de maand waarin de gasdag valt
      waarop de gegevens betrekking hebben aan de regionale netbeheerder. De regionale netbeheerder beschouwt deze
      meetgegevens als definitieve meetgegevens.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.17
  - number: 6.4.2.18
    text: |-
      Indien gedurende de periode tussen de achtste werkdag van de vierde maand na de maand waarin de gasdag valt
      waarop de meetgegevens betrekking hebben en het einde van de reconciliatietermijn, wordt geconstateerd dat er,
      als gevolg van een onvolkomenheid aan de meetinrichting of de verzameling van meetgegevens, sprake is van onjuiste
      meetgegevens, wordt, na afstemming met de desbetreffende leverancier, programmaverantwoordelijke, regionale
      netbeheerder of aangeslotene, door de meetverantwoordelijke een schatting gemaakt van het werkelijk verbruik
      gedurende de (vermoedelijke) periode dat de meting onjuist is geweest.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.18
  - number: 6.4.2.19
    text: |-
      De in [6.4.2.18][ref1] genoemde correctie wordt binnen vijftien werkdagen na constatering van de onvolkomenheid
      door de meetverantwoordelijke schriftelijk gemeld aan de aangeslotene, de regionale netbeheerder, de
      programmaverantwoordelijke en de leverancier. Bij deze melding worden de aard van de onvolkomenheid alsmede de
      genomen maatregelen vermeld en worden over de (vermoedelijke) periode waarin sprake was van een onvolkomenheid de
      volgende gegevens verstrekt:

      a. de oude en nieuwe (geschatte) volumes (per maand);

      b. de oude en nieuwe (geschatte) hoogste uurwaarden per maand;

      c. indien beschikbaar, de oude en nieuwe (geschatte) uurwaarden voor alle in deze periode vallende uren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.18
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.19
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.18
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.20
    text: |-
      Indien ten gevolge van de in [6.4.2.17][ref1] of [6.4.2.18][ref2] bedoelde onvolkomenheid de herleidingsfactor
      afwijkt van de voor deze aansluiting kenmerkende herleidingsfactor, wordt, na het opheffen van de oorzaak,
      de omrekening van het niet herleide naar het herleide volume gedaan met de historische voor deze aansluiting
      kenmerkende herleidingsfactor. De herleide verschillen worden door de meetverantwoordelijke aan zowel de
      aangeslotene als aan de regionale netbeheerder gemeld. Het gecorrigeerd volume wordt door de regionale
      netbeheerder, met inachtneming van 6.4.2.17 of 6.4.2.18, verwerkt in de reconciliatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.17
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.18
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.20
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.2.17
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.4.2.18
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.4.2.21
    text: |-
      Bij een invoeder met een aansluiting met een capaciteit groter dan 40 m³(n)/uur waarvan het gas conform [B5.6.9
      van de Allocatiecode gas](onbekend) aan de (erkende programmaverantwoordelijke van) de invoeder toegerekend
      dient te worden met de werkelijke gemeten calorische waarde van het ingevoede gas, worden de gegevens genoemd in
      [6.4.1.10][ref1] van een bepaalde gasmaand uiterlijk op de vierde werkdag van de maand, volgend op de maand waarop
      de gegevens betrekking hebben, voor 07:00 uur door de meetverantwoordelijke verzonden aan de netbeheerder. De
      meetverantwoordelijke verzendt per aansluiting de gegevens van een gasmaand in één bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.1.10
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.4.2.21
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.4.1.10
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.5.1.1
    text: |-
      De regionale netbeheerder maakt bij het vaststellen van de (meet)gegevens die volgens deze paragraaf worden
      doorgegeven, gebruik van meetgegevens geregistreerd door meetinrichtingen op aansluitingen, die hij op grond
      van [paragraaf 6.4][ref1] van deze van de desbetreffende meetverantwoordelijken ontvangt en van de meetgegevens
      geregistreerd door de meetinrichtingen op de aansluitingen van zijn net met andere netten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.5.1.2
    text: |-
      De regionale netbeheerder bewaakt de ontvangst van meetgegevens van aangeslotenen, die hij op grond van
      [paragraaf 6.4][ref1] van de desbetreffende meetverantwoordelijken moet ontvangen. Bij geconstateerde
      tekortkomingen informeert de regionale netbeheerder de meetverantwoordelijke en stelt de meetverantwoordelijke
      zonodig in gebreke. Indien de meetverantwoordelijke de geconstateerde tekortkomingen niet alsnog opheft, meldt de
      regionale netbeheerder dit aan de aangeslotene en aan de netbeheerder van het landelijk hoogspanningsnet. Indien
      dit noodzakelijk is voor de voortgang van de in de [Allocatiecode gas][ref2] beschreven processen, worden de
      desbetreffende meetgegevens overeenkomstig [6.5.1.3][ref3] vastgesteld en geeft de regionale netbeheerder daarbij
      aan dat er sprake is van overeenkomstig 6.5.1.3 vastgestelde meetgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037931
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.5.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037931
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.5.1.3
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.5.1.3
    text: |-
      De regionale netbeheerder treft, wanneer hij in het geval, bedoeld in [6.5.1.2][ref1], niet in staat
      is definitieve meetgegevens aan de beheerder van het landelijk gastransportnet te verstrekken, met de
      desbetreffende meetverantwoordelijke en de programmaverantwoordelijke die het aangaat een regeling omtrent de
      te gebruiken meetgegevens. Deze meetgegevens worden geacht definitief te zijn en worden aan de desbetreffende
      programmaverantwoordelijke en aan de beheerder van het landelijk gastransportnet verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.5.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.5.1.2
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.5.1.4
    text: |-
      De regionale netbeheerder bepaalt de hoeveelheid energie uit het aantal normaal kubieke meters [m3(n)] volume)
      dat hij op grond van [paragraaf 6.4][ref1] van deze van de desbetreffende meetverantwoordelijken ontvangt en de
      calorische bovenwaarde van het gas die:

      a. door de beheerder van het landelijk gastransportnet aan de regionale netbeheerder wordt aangeleverd of

      b. door de regionale netbeheerder overeenkomstig het gestelde in [hoofdstuk 5 van de Meetcode gas LNB][ref2] zelf
      wordt bepaald, of

      c. door de meetverantwoordelijke in geval van een invoeder met een aansluiting met een capaciteit groter dan 40
      m³(n)/uur overeenkomstig [6.4.2.21][ref3] aan de netbeheerder is aangeleverd. Voor elk ontbrekend uur en voor elk
      uur waarbij de door de meetverantwoordelijke aangeleverde calorische waarde groter is dan 36 MJ/m3(n) hanteert de
      netbeheerder 34,11 MJ/m3(n) als waarde voor de calorische bovenwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel6.4.2.21
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0037935
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 6.4.2.21
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.5.2.1
    text: |-
      De regionale netbeheerder geeft voor een profielgrootverbruikaansluiting ten minste eenmaal per maand aan de
      leverancier de laatste tellerstand(en) alsmede het in de tussenliggende periode op de aansluiting uitgewisselde
      hoeveelheid gas, uitgedrukt in kubieke meter Groningen gas [m3(n;35,17)] door. Deze overdracht van gegevens vindt
      plaats uiterlijk op de twintigste werkdag van de maand volgend op de maand waarop de meetgegevens betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.2.1
  - number: 6.5.2.2
    text: |-
      De regionale netbeheerder geeft per telemetriegrootverbruikaansluiting maandelijks de uitgewisselde hoeveelheid gas
      per meetperiode uitgedrukt in MJ door aan de leverancier(s). Deze overdracht van gegevens vindt plaats uiterlijk op
      de zestiende werkdag van de maand na de maand waarin de desbetreffende gasdag valt.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.2.2
  - number: 6.5.2.3
    text: |-
      De regionale netbeheerder houdt de gegevens als bedoeld in [6.5.2.1][ref1] en [6.5.2.2][ref2], alsmede de gegevens
      die hij ontvangt op grond van [6.4.2][ref3] gedurende een termijn van ten minste drie jaar beschikbaar. De
      regionale netbeheerder verstrekt de aangeslotene of diens gemachtigde op verzoek de gegevens van de desbetreffende
      aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel6.5.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.5.2.1
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 6.5.2.2
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.6.1
    text: |-
      De netbeheerder berekent een standaardjaarverbruik voor de profielgrootverbruikaansluitingen binnen zijn netgebied
      overeenkomstig de methode beschreven in:

      a. [Bijlage 1][ref1] voor de grootverbruikaansluitingen elektriciteit;

      b. [Bijlage 3][ref2] voor de grootverbruikaansluitingen gas.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
      - id: ref2
        bwb_id: BWBR0037934
  - number: 6.6.2
    text: |-
      De netbeheerder muteert het aansluitingenregister met het nieuw bepaalde standaardjaarverbruik uiterlijk vijf
      werkdagen na de ontvangst van de meetgegevens van de meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.6.2
  - number: 6.6.3
    text: |-
      De marktpartijen worden overeenkomstig [2.2][ref1] geïnformeerd over wijzigingen in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 6.7.1
    text: |-
      Leveranciers en programmaverantwoordelijken kunnen historische meetgegevens opvragen bij de netbeheerder indien zij
      beschikken over een daartoe strekkende machtiging van de desbetreffende aangeslotene. In deze opvraag historische
      meetgegevens zijn, indien van toepassing, opgenomen:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de opvragende leverancier, programmaverantwoordelijke;

      d. de procesidentificatie, te weten: “opvraag historische meetgegevens”;

      e. het type aanvraag, zijnde ‘verzoek voor historische meetgegevens’;

      f. de startdatum van de periode, waarover meetgegevens worden opgevraagd;

      g. de einddatum van de periode, waarover meetgegevens worden opgevraagd;

      h. indien de opvragende leverancier, programmaverantwoordelijke dit wenst op te geven: het referentienummer van de
      opvragende leverancier, programmaverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.7.1
  - number: 6.7.2
    text: |-
      Naar aanleiding van de ontvangen opvraag historische meetgegevens controleert de netbeheerder of:

      a. de opvraag historische meetgegevens volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voorkomt in zijn aansluitingenregister;

      c. de opvragende leverancier geregistreerd staat in het leveranciersregister, dan wel de opvragende
      programmaverantwoordelijke een volledige erkenning heeft volgens het programmaverantwoordelijkenregister;

      d. voor de in de opvraag aangegeven periode historische meetgegevens voor de desbetreffende aansluiting beschikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.7.2
  - number: 6.7.3
    text: |-
      De netbeheerder bericht dat de opvraag historische meetgegevens niet wordt uitgevoerd uiterlijk vijf werkdagen
      na ontvangst van de opvraag historische meetgegevens aan de opvragende leverancier of programmaverantwoordelijke,
      indien één of meer van de controles, bedoeld in [6.7.2][ref1], een negatief resultaat opleveren, en vermeldt
      daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de opvragende leverancier, programmaverantwoordelijke;

      d. de procesidentificatie, zijnde ‘opvraag historische meetgegevens’;

      e. de reden van het niet uitvoeren van de opvraag historische meetgegevens:

      1° De opvraag historische meetgegevens is niet volledig of syntactisch onjuist;

      2° De EAN-code van de aansluiting is onbekend;

      3° de opvragende leverancier komt niet voor in het leveranciersregister, dan wel de opvragende
      programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      4° Geen historische meetgegevens beschikbaar;

      f. indien aangeleverd in de opvraag: het referentienummer van de opvragende leverancier,
      programmaverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.7.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.7.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.7.2
        hoofdstuk: '6'
        paragraaf: '6.7'
  - number: 6.7.4
    text: |-
      De netbeheerder verstuurt de opgevraagde historische meetgegevens zo snel mogelijk doch uiterlijk vijf werkdagen na
      ontvangst van de opvraag historische meetgegevens aan de opvragende leverancier of programmaverantwoordelijke als
      alle controles, bedoeld in [6.7.2][ref1], een positief resultaat opleveren en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de opvragende partij;

      d. de startdatum van de verbruiksperiode;

      e. de einddatum van de verbruiksperiode;

      f. het verbruik;

      g. voor zover van toepassing de meterstand behorend bij de mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.7.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.7.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.7.2
        hoofdstuk: '6'
        paragraaf: '6.7'
  - number: 6.8.1
    text: |-
      De netbeheerder berekent een jaarverbruik voor de telemetriegrootverbruikaansluitingen binnen zijn netgebied
      overeenkomstig de methode beschreven in [B1a.3 van de Allocatiecode gas](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.8.1
  - number: 6.8.2
    text: |-
      Voor het berekenen van het jaarverbruik gebruikt de netbeheerder als grondslag de gegevens als bedoeld
      [6.5.2.2][ref1], uitgedrukt in [m3(n;35,17)]; hij gebruikt hiervoor de meest recente gegevens van de voorbije
      maanden met dien verstande dat de totale verbruiksperiode minstens 300 dagen beslaat, en de maanden januari en
      februari insluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.8.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.5.2.2
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.8.3
    text: |-
      De netbeheerder muteert het aansluitingenregister met het nieuw bepaalde jaarverbruik uiterlijk vijf werkdagen na
      overdracht van de meetgegevens bedoeld in [6.5.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel6.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.8.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 6.5.2.2
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.8.4
    text: |-
      De marktpartijen worden overeenkomstig [2.2][ref1] geïnformeerd over wijzigingen in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel6.8.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.1'
    text: |-
      De allocatie en reconciliatie elektriciteit wordt uitgevoerd overeenkomstig [hoofdstuk 10 van de Netcode
      elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel7.1
  - number: '7.2'
    text: |-
      De allocatie en reconciliatie gas wordt uitgevoerd overeenkomstig de [Allocatiecode gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0037931
  - number: 8.1.1
    text: |-
      De leverancier informeert de aangeslotene namens de regionale netbeheerder bij een voorgenomen inhuizing van een
      aangeslotene ongeacht of er bij inhuizing een leveringsovereenkomst tot stand komt over:

      a. dat er een aansluit- en transportovereenkomst met de regionale netbeheerder vereist is;

      b. de op de aansluit- en transportovereenkomst van de regionale netbeheerder van toepassing zijnde algemene
      voorwaarden voor aansluiting en transport;

      c. dat aan de regionale netbeheerder tarieven verschuldigd zijn;

      d. indien van toepassing, dat er aan de aansluiting een of meer secundaire allocatiepunten zijn toegekend en dat
      de installatie die bij een secundair allocatiepunt hoort, niet mag worden gebruikt ten behoeve van bewoning van
      een ruimte.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.1
  - number: 8.1.2
    text: |-
      Uiterlijk 10 werkdagen na aanvang van de levering bij een inhuizing bevestigt en verstrekt de leverancier namens
      de regionale netbeheerder aan de aangeslotene de tot stand gekomen aansluit- en transportovereenkomst met de daarop
      van toepassing zijnde algemene voorwaarden en informeert hem over:

      a. de naam- en adresgegevens van de regionale netbeheerder behorende bij de aansluiting;

      b. het bij de aansluiting behorende nettarief;

      c. een omschrijving van de op de aansluiting aanwezige tariefcode.

      De regionale netbeheerder stelt de leverancier in staat om, indien de aangeslotene elektronisch met de leverancier
      een leveringsovereenkomst aangaat respectievelijk is aangegaan, het bevestigen, verstrekken en informeren in de zin
      van de eerste volzin van deze bepaling ook langs elektronische weg te doen plaatsvinden conform de eisen die wet en
      regelgeving aan elektronisch contracteren stellen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.2
  - number: 8.1.2a
    text: |-
      Voorafgaand aan het aangaan van een leveringscontract ten behoeve van levering op een secundair allocatiepunt
      informeert de leverancier namens de netbeheerder de contractant dat de installatie die bij het secundair
      allocatiepunt hoort, niet mag worden gebruikt ten behoeve van bewoning van een ruimte.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.2a
  - number: 8.1.3
    text: |-
      De leverancier toont tot twee jaar na beëindiging van de leveringsovereenkomst op een gemotiveerd verzoek van de
      regionale netbeheerder op welke wijze aan de informatieverplichting, bedoeld in [8.1.1][ref1], [8.1.2][ref2] en
      [8.1.2a][ref3] is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel8.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel8.1.2a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 8.1.1
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 8.1.2
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 8.1.2a
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.1.4
    text: |-
      De regionale netbeheerder stuurt wijzigingen in zijn aansluit- en transportovereenkomst, de algemene voorwaarden
      voor de aansluiting en transport gas voor aangeslotenen of de algemene voorwaarden voor de aansluiting en transport
      elektriciteit voor aangeslotenen met een toelichting ten minste één maand vóór inwerkingtreding hiervan aan
      de leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 8.1.5
    text: |-
      De leverancier bevestigt de ontvangst van wijzigingen in de aansluit- en transportovereenkomst, de algemene
      voorwaarden voor de aansluiting en transport gas voor aangeslotenen of de algemene voorwaarden voor de aansluiting
      en transport elektriciteit voor aangeslotenen uiterlijk de werkdag na ontvangst van de wijziging aan de regionale
      netbeheerder. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het
      geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 8.1.6
    text: |-
      De regionale netbeheerder bepaalt het tarief per dag met vier decimalen achter de komma voor de nettarieven,
      bedoeld in [B4.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 8.1.7
    text: |-
      De regionale netbeheerder stuurt wijzigingen in zijn nettarieven ten minste één maand vóór inwerkingtreding aan
      de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.7
  - number: 8.1.8
    text: |-
      De leverancier stuurt uiterlijk de werkdag na ontvangst van de gewijzigde nettarieven een ontvangstbevestiging aan
      de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.8
  - number: 8.1.9
    text: |-
      De regionale netbeheerder informeert zijn klanten over de wijzigingen in de aansluit- en transportovereenkomst,
      de algemene voorwaarden voor de aansluiting en transport gas voor aangeslotenen, de algemene voorwaarden voor de
      aansluiting en transport elektriciteit voor aangeslotenen of nettarieven.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.1.9
  - number: 8.2.1
    text: |-
      De regionale netbeheerder stuurt voor elk van zijn fiscale entiteiten uiterlijk de derde werkdag
      van iedere maand een specificatie van de verplichting van de te factureren bedragen, bedoeld in
      [artikelen 53][ref1] en [95cb, zesde lid van de Elektriciteitswet 1998][ref2] en [artikelen 21][ref3] en
      [44b, zesde lid van de Gaswet][ref4], betreffende de voorafgaande maand aan elke bedrijfs-EAN-code van de
      leverancier. Deze specificatie van de verplichting bevat:

      a. de maand waarop de specificatie van de verplichting betrekking heeft;

      b. de bedrijfs-EAN-code(s) van de fiscale entiteit van de regionale netbeheerder waarop de specificatie van de
      verplichting betrekking heeft;

      c. de bedrijfs-EAN-code van de leverancier waarop de specificatie van de verplichting betrekking heeft;

      d. het totale bedrag (exclusief BTW) dat de betreffende leverancier volgens het aansluitingenregister over de
      maand, bedoeld in [8.2.1 onderdeel a][ref5], geacht wordt te factureren en moet afdragen;

      e. per aansluiting waarvoor de betreffende leverancier in de maand, bedoeld in [8.2.1 onderdeel a][ref6], in het
      aansluitingenregister staat per capaciteitstariefcode:

      1° de EAN-code van de aansluiting;

      2° de capaciteitstariefcode;

      3° het aantal dagen dat de betreffende leverancier in de maand, bedoeld in [8.2.1 onderdeel a][ref7], op
      de betreffende aansluiting met de betreffende capaciteitstariefcode en met de fysieke status actief in het
      aansluitingenregister stond;

      4° het bijbehorende nettarief per dag (exclusief BTW);

      5° het bijbehorende totaalbedrag voor de maand, bedoeld in [8.2.1 onderdeel a][ref8], (exclusief BTW).


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel44b
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel8.2.1
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel8.2.1
      [ref7]: https://wetten.overheid.nl/BWBR0037934#Artikel8.2.1
      [ref8]: https://wetten.overheid.nl/BWBR0037934#Artikel8.2.1
