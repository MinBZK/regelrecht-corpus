  - number: 1.1.7
    text: |-
      Een leverancier is voor alle kleinverbruikaansluitingen waarvoor hij in het aansluitingenregister als leverancier
      staat geregistreerd, verantwoordelijk voor de distributie van de vastgestelde meterstanden.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.7
  - number: 1.1.8
    text: |-
      Waar in [paragrafen 5.1.2][ref1] en [5.1.3][ref2] is gesteld dat de leverancier verantwoordelijk is voor het
      collecteren, valideren en vaststellen van meterstanden, schakelt de leverancier een meetbedrijf in, als bedoeld in
      [artikel 95ca, eerste lid, van de Elektriciteitswet 1998][ref3] en [artikel 44a, eerste lid, van de Gaswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 1.1.9
    text: |-
      Het meetbedrijf, bedoeld in [1.1.8][ref1], zal fouten in de meetgegevens die worden geconstateerd door de
      leverancier onverwijld corrigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel1.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.9
