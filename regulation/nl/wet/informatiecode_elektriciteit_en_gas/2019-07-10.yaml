        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.1.1
    text: |-
      De leverancier informeert de aangeslotene tenminste twintig werkdagen voorafgaand aan het indienen
      van de eindeleveringsmelding bij de regionale netbeheerder over zijn voornemen om de levering te
      beëindigen. De leverancier zorgt dat is voldaan aan de voorwaarden van de regeling, bedoeld in
      [artikel 95b, achtste lid, van de Elektriciteitswet 1998][ref1] en [artikel 44, achtste lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel44
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95b
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '44'
  - number: 3.4.1a.1
    text: |-
      Voorafgaand aan het eindeleveringsbericht stuurt de actuele leverancier een vooraankondiging eindeleveringsmelding
      tien werkdagen voor de voorgenomen mutatiedatum van de in te dienen eindeleveringsmelding naar de regionale
      netbeheerder. De vooraankondiging eindelevering bevat:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de actuele leverancier;

      d. de procesidentificatie die van toepassing is, te weten: vooraankondiging eindelevering;

      e. de voorgenomen mutatiedatum.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.1a.1
  - number: 3.4.2.1
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.2.1
  - number: 3.4.2.2
    text: |-
      De actuele leverancier stuurt een eindeleveringsmelding één werkdag voor de eindeleveringsdatum naar de regionale
      netbeheerder, waarin is vermeld:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.2.2
  - number: 3.4.2.3
    text: |-
      In afwijking van [3.4.2.2][ref1] stuurt de actuele leverancier de in 3.4.2.2 bedoelde eindeleveringsmelding
      tenminste één werkdag en ten hoogste twintig werkdagen voor de eindeleveringsdatum naar de regionale netbeheerder,
      indien de aansluiting een kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend
      bij een afnemer bedoeld in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of
      [artikel 52 c][ref4] of [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.4.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.4.2.2
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.4.3.1
    text: |-
      Naar aanleiding van de eindeleveringsmelding controleert de regionale netbeheerder of:

      a. de eindeleveringsmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. [Vervallen]

      d. de eindeleveringsdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig
      werkdagen in de toekomst ligt;

      e. er geen eerder bevestigde, doch nog niet geëffectueerde eindeleverings-, leverancierswitch-, uithuizings- of
      inhuizingsmelding is voor dezelfde aansluiting met dezelfde of een eerdere datum;

      f. de eindeleveringsmelding wordt ingediend door de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.1
  - number: 3.4.3.2
    text: |-
      Als alle controles uit [3.4.3.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.4.3.4][ref2]. Als dat niet het geval is, wordt de eindelevering niet uitgevoerd en wordt de procedure na
      [3.4.3.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.4.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.4.3.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.4.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.4.3.1
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.4.3.4
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.4.3.3
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.3.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de eindelevering naar aanleiding van [3.4.3.2][ref1]
      uiterlijk de werkdag na ontvangst van de eindeleveringsmelding aan de leverancier die de eindeleveringsmelding
      heeft ingediend en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de reden van het niet uitvoeren van de eindelevering:

      1° de eindeleveringsmelding is onvolledig of syntactisch niet correct;

      2° de EAN-code van de aansluiting is onbekend

      3° [Vervallen]

      4° de eindeleveringsdatum voldoet niet aan de gestelde indientermijn;

      5° de eindeleveringsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde eindeleverings-,
      switch-, uithuizings- of inhuizingsmelding;

      6° de indienende leverancier is onjuist;

      f. indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.4.3.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.4.3.2
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.3.4
    text: |-
      De regionale netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding
      aan de actuele leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de procesidentificatie die van toepassing is, te weten: eindelevering;

      f. indien aangeleverd in de eindeleveringsmelding: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.4
  - number: 3.4.3.5
    text: |-
      De regionale netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de eindeleveringsmelding
      aan de actuele programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de eindeleveringsdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: eindelevering.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.5
  - number: 3.4.3.6
    text: |-
      Ingeval de aangeslotene voorafgaand aan de eindeleveringsdatum tijdig alsnog recht op levering verkrijgt, meldt de
      leverancier dit aan de regionale netbeheerder:

      a. door middel van een inhuizingsmelding, bedoeld in [3.3.1.1][ref1], indien hij de actuele leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [3.3.2.1][ref2];

      b. door middel van een switchmelding, bedoeld in [3.1.1.1][ref3], indien hij een nieuwe leverancier van de
      aangeslotene is. De procedure wordt vervolgd vanaf [3.1.2.1][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel3.1.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.3.1.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.3.2.1
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.1.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 3.1.2.1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.4.3.7
    text: |-
      De regionale netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      eindelevering, PV-switch of wijzigen naam of verblijfsfunctie of complexbepaling, indien de eindelevering, bedoeld
      in [3.4.2.2][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.4.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.4.2.2
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.4.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de actuele leverancier aangeleverde
      gegevens overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding of
      uithuizingsmelding voor dezelfde aansluiting is ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.4.2
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.5.1
    text: |-
      De actuele leverancier collecteert de meterstand behorende bij het eindeleveringsproces, stelt deze vast en
      distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.4.5.2
    text: |-
      De actuele leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde "in bedrijf" heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.4.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.5.1.1
    text: |-
      Op grond van de leveringsovereenkomst met de desbetreffende kleinverbruiker stuurt de actuele leverancier één
      werkdag voor de switchdatum een programmaverantwoordelijke-switchmelding, hierna te noemen een PV-switchmelding
      naar de regionale netbeheerder. In de PV-switchmelding is opgenomen:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.1.1
  - number: 3.5.1.2
    text: |-
      In afwijking van [3.5.1.1][ref1] stuurt de leverancier de in 3.5.1.1 bedoelde switchmelding tenminste één werkdag
      en ten hoogste twintig werkdagen voor de switchdatum naar de regionale netbeheerder, indien de aansluiting een
      kleinverbruikaansluiting is die deel uit maakt van een groep aansluitingen, behorend bij een afnemer bedoeld
      in [artikel 95n][ref2] of [95ca tweede lid van de Elektriciteitswet 1998][ref3] of [artikel 52c][ref4] of
      [44a tweede lid van de Gaswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.5.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel95ca
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel44a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.5.1.1
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 95ca
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 52c
      - id: ref5
        bwb_id: BWBR0011440
        artikel: 44a
  - number: 3.5.2.1
    text: |-
      Naar aanleiding van de switchmelding controleert de regionale netbeheerder of:

      a. de PV-switchmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de PV-switchdatum ten opzichte van de datum van indienen tenminste één werkdag en ten hoogste twintig werkdagen
      in de toekomst ligt;

      d. de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      e. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting voor een eerdere of dezelfde datum;

      f. de PV-switchmelding is ingediend door de in het aansluitingenregister vermelde leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.2.1
  - number: 3.5.2.2
    text: |-
      Als alle controles uit [3.5.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.5.2.4][ref2]. Als dat niet het geval is, wordt de PV-switch niet uitgevoerd en wordt de procedure na
      [3.5.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.5.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.5.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.5.2.1
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.5.2.4
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.5.2.3
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de PV-switch naar aanleiding van [3.5.2.2][ref1] uiterlijk
      de werkdag na ontvangst van de PV-switchmelding aan de leverancier die de PV-switchmelding heeft ingediend en
      vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de reden van het niet uitvoeren van de switch:

      1° de switchmelding is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de switchdatum voldoet niet aan de gestelde indientermijn;

      4° de nieuwe programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      5° de switchmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde switch, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding;

      6° de indienende leverancier is onjuist;

      g. indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.5.2.2
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.5.2.4
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding
      aan de leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: wijziging PV;

      g. indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.2.4
  - number: 3.5.2.5
    text: |-
      De regionale netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de switchmelding aan
      de oude programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: wijziging PV.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.2.5
  - number: 3.5.2.6
    text: |-
      De regionale netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding
      aan de nieuwe programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de regionale netbeheerder;

      d. de bedrijfs-EAN-code van de leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: wijziging PV.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.2.6
  - number: 3.5.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.5.3.2
    text: |-
      De regionale netbeheerder informeert de leverancier en nieuwe programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1] over de mutaties, bedoeld in [3.5.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.5.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.5.3.1
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.6.1.1
    text: |-
      De leverancier informeert de regionale netbeheerder tenminste vijfentwintig werkdagen en ten hoogste
      dertig werkdagen voor de beoogde switchdatum over het voornemen om een bulk PV-switch uit te voeren. In de
      vooraankondiging wordt vermeld:

      a. de beoogde switchdatum van de in te dienen bulk PV-switch;

      b. de bedrijfs-EAN-code van de leverancier;

      c. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      d. bij benadering het aantal aansluitingen dat de bulk PV-switch zal bevatten.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.1.1
  - number: 3.6.1.2
    text: |-
      In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde
      berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.6.2.1
    text: |-
      Op grond van de leveringsovereenkomsten met de desbetreffende kleinverbruikers stuurt de leverancier tenminste
      vijf werkdagen en ten hoogste twintig werkdagen voor de switchdatum een melding bulk PV-switch naar de regionale
      netbeheerder. In afwijking van [1.1.4][ref1] wordt in het bericht vermeld:

      a. de EAN-codes van de aansluitingen;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: "PV-switch";

      f. de switchdatum;

      g. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel1.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 1.1.4
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 3.6.3.1
    text: |-
      Naar aanleiding van de melding bulk PV-switch controleert de regionale netbeheerder of:

      a. de melding bulk PV-switch volledig en syntactisch correct is;

      b. de switchdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig werkdagen
      in de toekomst ligt;

      c. de nieuwe programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      Per individuele aansluiting in de melding bulk PV-switch controleert de regionale netbeheerder of:

      d. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      e. de melding bulk PV-switch wordt ingediend door de in het aansluitingenregister vermelde leverancier;

      f. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor een eerdere of dezelfde datum;

      g. de aansluiting volgens het aansluitingenregister een kleinverbruikaansluiting is.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.3.1
  - number: 3.6.3.2
    text: |-
      De regionale netbeheerder beëindigt de bulk PV-switchprocedure en bericht dit uiterlijk drie werkdagen na
      ontvangst van de melding bullk PV-switch aan de leverancier, indien één of meerdere van de controles, bedoeld in
      [3.6.3.1, onderdeel a tot en met c][ref1], een negatief resultaat opleveren, en vermeldt daarbij:

      a. de bedrijfs-EAN-code van de regionale netbeheerder;

      b. de bedrijfs-EAN-code van de leverancier;

      c. de reden van het niet uitvoeren van de melding bulk PV-switch:

      1° de melding bulk PV-switch is niet volledig of syntactisch onjuist;

      2° de switchdatum voldoet niet aan de gestelde indientermijn;

      3° de nieuwe programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      d. indien aangeleverd in de bulk PV-switchmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.6.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.6.3.1
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.3.3
    text: |-
      De regionale netbeheerder beëindigt de PV-switchprocedure voor de desbetreffende aansluiting en bericht dit
      uiterlijk drie werkdagen na ontvangst van de melding bulk PV-switch aan de leverancier, indien één of meerdere van
      de controles, bedoeld in [3.6.3.1, onderdeel d tot en met g][ref1], een negatief resultaat opleveren, en vermeldt
      daarbij:

      a. de bedrijfs-EAN-code van de regionale netbeheerder;

      b. de bedrijfs-EAN-code van de leverancier;

      c. indien aangeleverd in de bulk PV-switchmelding: het referentienummer van de leverancier;

      Per aansluiting waarvoor de melding wordt afgewezen wordt vermeld:

      d. de EAN-code van de aansluiting;

      e. de reden van het niet uitvoeren van de PV-switch:

      1° de EAN-code van de aansluiting is onbekend;

      2° de indienende leverancier is onjuist;

      3° de melding bulk PV-switch conflicteert met een eerdere leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding;

      4° de aansluiting is volgens het aansluitingenregister geen kleinverbruikaansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.6.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.6.3.1
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.3.4
    text: |-
      De regionale netbeheerder verstuurt uiterlijk drie werkdagen na ontvangst van de melding bulk PV-switch aan
      de oude programmaverantwoordelijke een verliesbericht voor de aansluitingen waarbij alle controles, bedoeld in
      [3.6.3.1][ref1], een positief resultaat opleveren en vermeldt daarbij:

      a. de EAN-code(s) van de aansluiting(en);

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      d. de switchdatum;

      e. de procesidentificatie die van toepassing is, te weten: "PV-switch".


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.6.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.6.3.1
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.3.5
    text: |-
      De regionale netbeheerder verstuurt uiterlijk drie werkdagen na ontvangst van de melding bulk PV-switch aan de
      leverancier een verwervingsbericht voor de aansluitingen waarbij alle controles, bedoeld in [3.6.3.1][ref1], een
      positief resultaat opleveren en vermeldt daarbij:

      a. de EAN-code(s) van de aansluiting(en);

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      e. indien aangeleverd in de bulk PV-switchmelding: het referentienummer van de leverancier;

      f. de switchdatum;

      g. de procesidentificatie die van toepassing is, te weten: "PV-switch".


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.6.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.6.3.1
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.3.6
    text: |-
      De regionale netbeheerder verstuurt uiterlijk drie werkdagen na ontvangst van de melding bulk PV-switch aan de
      nieuwe programmaverantwoordelijke een verwervingsbericht voor de aansluitingen waarbij alle controles, bedoeld in
      [3.6.3.1][ref1], een positief resultaat opleveren en vermeldt daarbij:

      a. de EAN-code(s) van de aansluiting(en);

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      e. de switchdatum;

      f. de procesidentificatie die van toepassing is, te weten: "PV-switch".


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.6.3.1
