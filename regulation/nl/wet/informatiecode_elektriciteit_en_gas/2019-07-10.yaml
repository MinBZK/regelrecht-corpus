  - number: 1.1.14
    text: |-
      Indien aan een aansluiting secundaire allocatiepunten zijn toegekend, worden de op een aansluiting van
      toepassing zijnde processen uit het [Besluit leveringszekerheid Elektriciteitswet 1998][ref1] en uit de
      [Regeling afsluitbeleid voor kleinverbruikers van elektriciteit en gas][ref2] toegepast per allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0019567
      [ref2]: https://wetten.overheid.nl/BWBR0030164
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.14
    references:
      - id: ref1
        bwb_id: BWBR0019567
      - id: ref2
        bwb_id: BWBR0030164
  - number: 1.1.15
    text: |-
      Daar waar in deze code sprake is van een verplichting of handeling tussen een leverancier en een aangeslotene,
      wordt in geval van een secundair allocatiepunt met aangeslotene bedoeld degene die de beschikking heeft over dat
      secundaire allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.15
  - number: 1.1.16
    text: |-
      Daar waar in deze code sprake is van het programmaverantwoordelijkenregister, wordt in geval van elektriciteit het
      BRP-register bedoeld.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.16
  - number: 2.1.1
    text: |-
      De netbeheerder identificeert de aansluitingen en geplande aansluitingen op het eigen net door aan elke aansluiting
      of geplande aansluiting één unieke EAN-code toe te kennen. De netbeheerder deelt de aangeslotene desgevraagd mee
      welke EAN-code aan diens aansluiting is toegekend.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.1
  - number: 2.1.1a
    text: Het primaire allocatiepunt van een aansluiting wordt geïdentificeerd met dezelfde EAN-code als de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.1a
  - number: 2.1.1b
    text: De netbeheerder kent tevens een EAN-code toe aan elk secundair allocatiepunt dat aan een aansluiting is toegekend.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.1b
  - number: 2.1.2
    text: |-
      De netbeheerders hebben gezamenlijk een centraal register, hierna te noemen het centraal aansluitingenregister,
      waarin elke netbeheerder zijn register, bedoeld in [2.1.3][ref1], beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.3
    text: |-
      De netbeheerder beheert voor het eigen net een register, hierna te noemen het aansluitingenregister, waarin per
      aansluiting of geplande aansluiting geïdentificeerd door de EAN-code van de aansluiting, bedoeld in [2.1.1][ref1],
      voor zover beschikbaar voor geplande aansluitingen, de volgende gegevens zijn vastgelegd:

      a. de naam van de aangeslotene met wie de aansluit- en transportovereenkomst is gesloten;

      b. de EAN-code van de aansluiting;

      c. de EAN-code van het netgebied waarin de aansluiting zich bevindt;

      d. de bedrijfs-EAN-code van de netbeheerder;

      e. de adresgegevens behorend bij het overdrachtspunt van de aansluiting;

      f. de identificatie van de actuele leverancier behorende bij de desbetreffende aansluiting (bedrijfs-EAN-code);

      g. de identificatie van de actuele programmaverantwoordelijke op de desbetreffende aansluiting (bedrijfs-EAN-code);

      h. een kenmerk dat de fysieke status van de aansluiting weergeeft;

      i. een kenmerk dat de administratieve status van de aansluiting weergeeft;

      j. een kenmerk dat de leveringsrichting op de aansluiting weergeeft;

      k.

      l. de aanduiding of de aansluiting behoort tot de categorie grootverbruik, kleinverbruik of
      [artikel 1 lid 2 of lid 3 van de Elektriciteitswet 1998][ref2];

      m.

      n.

      o.

      p. de wijze waarop de desbetreffende aansluiting wordt bemeten;

      q. de profielcategorie voor elektriciteit respectievelijk de afnamecategorie voor gas die van toepassing is op de
      desbetreffende aansluiting;

      r. in geval van aansluitingen waarbij de allocatie met behulp van profielen plaatsvindt: het standaardjaarverbruik,
      in geval van een elektriciteitsaansluiting onderscheiden naar normaaluren en laaguren indien de aansluiting over
      een meetinrichting met telwerken voor normaaluren en laaguren beschikt;

      s. een kenmerk dat de allocatiemethode op de aansluiting weergeeft;

      t. de EAN-codes van de secundaire allocatiepunten die aan de aansluiting zijn toegekend;

      u. in geval van een secundair allocatiepunt: de EAN-code van het bijbehorende primaire allocatiepunt;

      v. [gereserveerd]

      w. de aanduiding of het een elektriciteits- of gasaansluiting betreft;

      x. indien de netbeheerder hierover beschikt: een nadere duiding omtrent de locatie van het overdrachtspunt van
      de aansluiting;

      y. indien de netbeheerder hierover beschikt: BAG-nummeridentificatie zoals bedoeld in de
      [Wet basisregistraties adressen en gebouwen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0023466
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.1
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0023466
  - number: 2.1.4
    text: |-
      In aanvulling op [2.1.3][ref1] neemt de netbeheerder in het aansluitingenregister ten aanzien van
      kleinverbruikaansluitingen de volgende gegevens op:

      a. de capaciteitstariefcode;

      b. in geval van een aansluiting die is voorzien van een kleinverbruikmeetinrichting die op afstand uitleesbaar is:
      een kenmerk dat weergeeft of de aangeslotene de mogelijkheid om op afstand uit te lezen administratief heeft laten
      uitzetten;

      c. [Vervallen]

      d. het identificatienummer van de meetinrichting;

      e. in geval van een gasaansluiting: een kenmerk dat weergeeft of de meting door de kleinverbruikmeetinrichting
      wordt gecorrigeerd voor temperatuur;

      f. per telwerk van de meetinrichting, bedoeld onder d, de volgende gegevens:

      1° in geval van elektriciteit: de telwerkindicatie;

      2° in geval van elektriciteit en uitsluitend voor een niet op afstand uitleesbare meetinrichting: of dit het
      telwerk normaal of het telwerk laag of een combinatie daarvan betreft;

      3° in geval van elektriciteit en uitsluitend voor een niet op afstand uitleesbare meetinrichting: de
      energierichting van het telwerk;

      4°

      5° het aantal posities voor de komma;

      6° de vermenigvuldigingsfactor;

      g. in geval van een aansluiting die is voorzien van een kleinverbruikmeetinrichting die op afstand uitleesbaar is:
      een kenmerk dat weergeeft of de kleinverbruikmeetinrichting gelet op externe factoren van technische aard al dan
      niet op afstand uitleesbaar is;

      h. een kenmerk dat weergeeft of de kleinverbruikmeetinrichting een conventionele meter dan wel een op afstand
      uitleesbare meter is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.5
    text: |-
      In aanvulling op [2.1.3][ref1] neemt de netbeheerder in het aansluitingenregister ten
      aanzien van grootverbruikaansluitingen met inbegrip van de aansluitingen bedoeld in
      [artikel 1, tweede en derde lid van de Elektriciteitswet 1998][ref2], de volgende gegevens op:

      a. de bedrijfs-EAN-code van de meetverantwoordelijke dan wel, indien sprake is van een aansluiting waarbij op grond
      van [artikel 2.30, eerste lid van de Netcode elektriciteit](onbekend) geen comptabele meetinrichting aanwezig is of
      indien sprake is van een aansluiting zoals bedoeld in [B3.4.7][ref3], de bedrijfs-EAN-code van de netbeheerder;

      b. in geval van aansluitingen waarbij eenmaal per jaar het verbruik wordt bepaald: de maand waarin de
      verbruiksbepaling plaatsvindt;

      c. in geval van een elektriciteitsaansluiting groter dan 3x80A: het op de aansluiting gecontracteerde
      transportvermogen [kW];

      d. in geval van aansluitingen van telemetriegrootverbruikers gas: het jaarverbruik telemetriegrootverbruikers
      (uitgedrukt in m3(n;35,17));

      e. in geval van aansluitingen van telemetriegrootverbruikers gas: het maxverbruik (uitgedrukt in m3(n;35,17)/uur);

      f. in geval van een elektriciteitsaansluiting waarachter zich een of meer elektriciteitsproductie-installaties
      bevinden: de aard van die elektriciteitsproductie-installaties aangeduid met de primaire energiebron;

      g. in geval van een elektriciteitsaansluiting tot en met 3x80A: de doorlaatwaarde van de aansluiting, aangeduid als
      het aantal beschikbaar gestelde fasen vermenigvuldigd met de nominale waarde van de overstroombeveiliging per fase;

      h. in geval van een elektriciteitsaansluiting: een registratie van de verblijfsfunctie of complexbepaling;

      i. in geval van een profielgrootverbruikaansluiting gas: de aansluitcapaciteit van de aansluiting, aangeduid als de
      G-waarde van de meetinrichting die zich bij de aansluiting bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0037934
