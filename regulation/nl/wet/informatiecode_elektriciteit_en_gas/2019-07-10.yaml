  - number: 5.3.5.1
    text: |-
      De regionale netbeheerder verstuurt uiterlijk vijf werkdagen na ontvangst van de vastgestelde meterstand,
      bedoeld in [5.3.4.1][ref1], of uiterlijk vijf werkdagen nadat de regionale netbeheerder namens de leverancier een
      meterstand heeft bepaald en vastgesteld, bedoeld in [5.3.4.3][ref2], [5.3.4.3a][ref3] en [5.3.4.3b][ref4], aan:

      a. de actuele leverancier de vastgestelde meterstand en het verbruik, bepaald in [5.3.4.4][ref5], in geval van een
      periodieke, tussentijdse of fysieke meteropname;

      b. de oude leverancier de vastgestelde meterstand en het verbruik, bepaald in [5.3.4.4][ref6], in geval van een
      leverancierswitch, uithuizing, eindelevering of inhuizing waarmee een uithuizing is uitgevoerd;

      c. de nieuwe leverancier de vastgestelde meterstand in geval van een leverancierswitch of inhuizing.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3a
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3b
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.4
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.5.1
    references:
      - id: ref1
