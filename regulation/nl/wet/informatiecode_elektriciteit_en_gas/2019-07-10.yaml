        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.8.1.1
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de aansluiting fysiek in bedrijf is genomen effectueert de regionale
      netbeheerder de fysieke status van de aansluiting, bedoeld in [2.1.3, onderdeel h][ref1], die van toepassing is, te
      weten: "in bedrijf" in het aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.8.1.1
    references:
