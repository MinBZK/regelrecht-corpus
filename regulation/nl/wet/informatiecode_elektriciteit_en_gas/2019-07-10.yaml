  - number: 2.7.5
    text: |-
      Bij de wijziging van een bestaande registratie in het netbeheerdersregister, bedoeld in [2.7.1][ref1], stelt de
      netbeheerder wijzigingen in de gegevens, bedoeld in [2.7.2, onderdelen a tot en met h][ref2] tenminste één maand en
