        artikel: 4.5.2.2
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.2.4
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de
      leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: wijziging PV;

      g. indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.4
  - number: 4.5.2.5
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de oude
      programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: wijziging PV.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.5
  - number: 4.5.2.6
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de
      nieuwe programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: wijziging PV.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.6
  - number: 4.5.2.7
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de PV-switchmelding aan de
      meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: wijziging PV;

      g. indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.7
  - number: 4.5.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig
      [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.3.1
