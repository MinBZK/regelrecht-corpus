        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.5.3.1
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.6.1.1
    text: |-
      De aangeslotene wijst een nieuwe meetverantwoordelijke aan, machtigt de nieuwe meetverantwoordelijke voor het
      afwikkelen van het proces switch van meetverantwoordelijke, hierna te noemen MV-switch en verstrekt daarbij de
      volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. gewenste datum van ingang;

      c. voor zover van toepassing de wens voor een telemetriegrootverbruikmeetinrichting.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.1.1
  - number: 4.6.1.2
    text: |-
      De nieuwe meetverantwoordelijke spreekt met de oude meetverantwoordelijke af wanneer en hoe de daadwerkelijke
      wisseling van het beheer en voor zover van toepassing van de meetinrichting(en) wordt uitgevoerd. Betreft
      het een telemetriegrootverbruikmeetinrichting, dan wordt tevens afgesproken op welke wijze de data van
      de dag van verwisseling tussen beide meetverantwoordelijken wordt uitgewisseld. De data-aanlevering van
      telemetriegrootverbruikmeetinrichtingen op de dag van de switch is een verantwoordelijkheid van de nieuwe
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.1.2
  - number: 4.6.2.1
    text: |-
      Op grond van de in [4.6.1.1][ref1] bedoelde machtiging stuurt de nieuwe meetverantwoordelijke op de mutatiedatum
      en ten hoogste twintig werkdagen voor de beoogde mutatiedatum een melding MV-switch naar de netbeheerder. In de
      melding MV-switch is opgenomen:

      a. de switchdatum;

      b. de EAN-code van de aansluiting;

      c. de procesidentificatie die van toepassing is, te weten: “MV-switch”;

      d. de bedrijfs-EAN-code van de netbeheerder;

      e. de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;

      f. indien de meetverantwoordelijke dat wenst op te geven: het referentienummer van de meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.1.1
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.2
    text: |-
      Naar aanleiding van de in [4.6.2.1][ref1] bedoelde melding controleert de netbeheerder of:

      a. de melding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de switchdatum ten opzichte van de datum van indienen niet in het verleden en ten hoogste twintig werkdagen in
      de toekomst ligt;

      d. de nieuwe meetverantwoordelijke geregistreerd staat in het MV-register;

      e. er geen eerder bevestigde, doch niet geëffectueerde MV-switchmeldingen zijn met betrekking tot dezelfde EAN-
      code;

      f. de aansluiting niet geblokkeerd is voor automatische mutaties;

      g. indien het een elektriciteitsaansluiting betreft: de EAN-code een primair allocatiepunt betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.2.1
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.3
    text: |-
      Als de in [4.6.2.2][ref1] genoemde controles een negatief resultaat geven, wordt de procedure gestopt en wordt de
      nieuwe meetverantwoordelijke uiterlijk de werkdag na ontvangst van de melding MV-switch op de hoogte gesteld van de
      reden waarom de procedure is gestopt. In het bericht wordt vermeld:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;

      d. de procesidentificatie die van toepassing is, te weten: “MV-switch”;

      e. de reden van het niet uitvoeren van de MV-switch:

      1° de melding MV-switch is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de switchdatum voldoet niet aan de gestelde indientermijn;

      4° de meetverantwoordelijke komt niet voor in het MV-register;

      5° de melding conflicteert met eerder ingediende, doch nog niet geëffectueerde meldingen;

      6° de aansluiting is geblokkeerd voor geautomatiseerde mutaties;

      7° de EAN-code betreft geen primair allocatiepunt;

      f. indien aangeleverd in de switchmelding: het referentienummer van de meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.2.2
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.4
    text: |-
      De netbeheerder verstuurt uiterlijk de werkdag na ontvangst van de melding MV-switch een verliesbericht aan de oude
      meetverantwoordelijke als alle controles, bedoeld in [4.6.2.2][ref1], een positief resultaat opleveren en vermeldt
      daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de oude meetverantwoordelijke;

      d. de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;

      e. de switchdatum;

      f. de procesidentificatie die van toepassing is, te weten: “MV-switch”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.2.2
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.4a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, stuurt de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het in [artikel 4.6.2.4][ref1] bedoelde bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.2.4
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.5
    text: |-
      De netbeheerder verstuurt uiterlijk de werkdag na ontvangst van de melding MV-switch een verwervingsbericht aan de
      nieuwe meetverantwoordelijke als alle controles, bedoeld in [4.6.2.2][ref1], een positief resultaat opleveren en
      vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;

      e. de bedrijfs-EAN-code van de oude meetverantwoordelijke;

      f. de switchdatum;

      g. de procesidentificatie die van toepassing is, te weten: “MV-switch”;

      h. indien aangeleverd in de switchmelding: het referentienummer van de nieuwe meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.2.2
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.2.5a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, stuurt de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het in [artikel 4.6.2.5][ref1] bedoelde bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.2.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.2.5a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.6.2.5
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de nieuwe meetverantwoordelijke aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.6.3.1a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, muteert de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het aansluitingenregister met de door de nieuwe meetverantwoordelijke aangeleverde gegevens
      overeenkomstig [artikel 2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.3.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.6.3.2
    text: |-
      De netbeheerder informeert de leverancier, de programmaverantwoordelijke en de nieuwe meetverantwoordelijke
      overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties, bedoeld in [4.6.3.1][ref2] en [4.6.3.1a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.6.3.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.6.3.1
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.6.3.1a
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.7.1.1
    text: |-
      Bij een plaatsing, wijziging of wegname van het secundaire deel van de meetinrichting voor een
      elektriciteitsaansluiting of een plaatsing, wijziging of wegname van de meetinrichting voor een gasaansluiting
      wordt de toegang tot de meterruimte geregeld, overeenkomstig [4.3.1.1 van de Meetcode elektriciteit][ref1] en
      [4.3.1.1 van de Meetcode gas RNB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel4.3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Artikel4.3.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.7.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: 4.3.1.1
      - id: ref2
        bwb_id: BWBR0037925
        artikel: 4.3.1.1
  - number: 4.7.2.1
    text: |-
      Indien de plaatsing, wijziging of wegname van het secundaire deel van de meetinrichting voor een
      elektriciteitsaansluiting of de plaatsing, wijziging of wegname van de meetinrichting voor een gasaansluiting in
      combinatie met een MV-switch wordt uitgevoerd, meldt de nieuwe meetverantwoordelijke het moment van de aanvang
      van de werkzaamheden bij de oude meetverantwoordelijke, zodat deze de laatste uitlezing van de weg te nemen
      meetinrichting kan verrichten. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet
      plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.7.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.7.2.2
    text: |-
      De nieuwe meetverantwoordelijke registreert de meterstand van de weg te nemen meetinrichting bij de wegname en
      de meterstand van de te plaatsen meetinrichting bij de plaatsing en bericht de meterstand bij wegname aan de oude
      meetverantwoordelijke. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via
      het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.7.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.7.2.3
    text: |-
      De nieuwe meetverantwoordelijke bericht de plaatsing of wijziging van het secundaire deel van de meetinrichting
      binnen vijf werkdagen nadat het secundaire deel van de meetinrichting is geplaatst aan de netbeheerder, indien
      de plaatsing of wijziging van de meetinrichting betrekking heeft op een elektriciteitsaansluiting, waarbij wordt
      vermeld:

      a. de EAN-code van de aansluiting waarbij de meetinrichting hoort;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;

      d. de aanduiding dat het bericht betrekking heeft op een elektriciteitsaansluiting;

      e. van elk verwijderd telwerk:

      1° het nummer van de meetinrichting waarvan het telwerk deel uitmaakte

      2° de omschrijving van de te meten grootheid

      3° de vermenigvuldigingsfactor

      4° het aantal posities voor de komma

      5° de stand op het moment van buitengebruikstelling

      6° de datum en het tijdstip van buitengebruikstelling

      7° de aanduiding of er sprake is van een meetinrichting die op afstand uitleesbaar is;

      8° de tariefzone;

      9° de energierichting;

      f. een schatting van de hoeveelheid niet gemeten energie tussen de buitengebruikstelling van de oude meetinrichting
      en de ingebruikname van de nieuwe meetinrichting;

      g. van elk nieuw telwerk:

      1° het nummer van de meetinrichting waarvan het telwerk deel uitmaakt;

      2° de omschrijving van de te meten grootheid;

      3° de vermenigvuldigingsfactor;

      4° het aantal posities voor de komma;

      5° de stand op het moment van ingebruikname;

      6° de datum en het tijdstip van ingebruikname;

      7° de aanduiding of er sprake is van een meetinrichting die op afstand uitleesbaar is;

      8° de tariefzone;

      9° de energierichting.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.7.2.3
  - number: 4.7.2.4
    text: |-
      De nieuwe meetverantwoordelijke bericht de plaatsing of wijziging van de meetinrichting binnen vijf werkdagen
      nadat de meetinrichting is geplaatst aan de netbeheerder, indien de plaatsing of wijziging van de meetinrichting
      betrekking heeft op een gasaansluiting, waarbij wordt vermeld:

      a. de EAN-code van de aansluiting waarbij de meetinrichting hoort;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe meetverantwoordelijke;

      d. de aanduiding dat het bericht betrekking heeft op een gasaansluiting;

      e. van elk verwijderd telwerk:

        - het nummer van de gasmeter of het volumeherleidingsinstrument waarvan het telwerk deel uitmaakte;
        - de omschrijving van de te meten grootheid;
        - de vermenigvuldigingsfactor;
        - het aantal posities voor de komma;
        - de energierichting;
        - de stand op het moment van buitengebruikstelling;
        - de datum en het tijdstip van buitengebruikstelling;

      f. een schatting van het niet gemeten herleid volume in normaal kubieke meter [m3(n)] tussen de
      buitengebruikstelling van de oude meetinrichting en de ingebruikname van de nieuwe meetinrichting;

      g. van elk nieuw telwerk:

        - het nummer van de gasmeter of het volumeherleidingsinstrument waarvan het telwerk deel uitmaakt;
        - de omschrijving van de te meten grootheid;
        - de vermenigvuldigingsfactor;
        - het aantal posities voor de komma;
        - de energierichting;
        - de stand op het moment van ingebruikname;
        - de datum en het tijdstip van ingebruikname;

      h. de G-waarde van de gasmeter.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.7.2.4
  - number: 4.7.2.5
    text: |-
      Indien een aan de aansluiting toegekend secundair allocatiepunt wordt verwijderd, maar de bijbehorende
      meetinrichting niet wordt verwijderd, wordt deze meetinrichting toegevoegd aan de meetinrichting behorend bij het
      primaire allocatiepunt van de desbetreffende aansluiting.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.7.2.5
  - number: 4.8.1.1
    text: |-
      De meetverantwoordelijke stelt de leverancier uiterlijk twee werkdagen na beëindiging van de
      beheerovereenkomst, als bedoeld in [paragraaf 1.2.4 van de Meetcode elektriciteit][ref1] en
      [paragraaf 1.2.4 van de Meetcode gas RNB][ref2], hiervan op de hoogte indien de beheerovereenkomst tussen de
      meetverantwoordelijke en de afnemer die beschikt over een grootverbruikaansluiting wordt beëindigd. In afwijking
      van [paragraaf 9.1][ref3] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Paragraaf1.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0037925#Paragraaf1.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037946
        paragraaf: 1.2.4
      - id: ref2
        bwb_id: BWBR0037925
        paragraaf: 1.2.4
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.8.2.1
    text: |-
      De meetverantwoordelijke stuurt uiterlijk twee werkdagen na de datum waarop de beheerovereenkomst is beëindigd een
      melding beëindiging meetverantwoordelijkheid naar de netbeheerder, waarin is vermeld:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de meetverantwoordelijke;

      d. de einddatum van de beheerovereenkomst;

      e. indien de meetverantwoordelijke dat wenst op te geven: het referentienummer van de meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.1
  - number: 4.8.2.2
    text: |-
      Naar aanleiding van de melding beëindiging meetverantwoordelijkheid controleert de netbeheerder of:

      a. de melding beëindiging meetverantwoordelijkheid volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de einddatum van de beheerovereenkomst ten opzichte van de datum van indienen ten hoogste twee werkdagen in het
      verleden ligt;

      d. de melding beëindiging meetverantwoordelijkheid wordt ingediend door de in het aansluitingenregister vermelde
      meetverantwoordelijke;

      e. de aansluiting niet geblokkeerd is voor automatische mutaties;

      f. indien het een elektriciteitsaansluiting betreft: de EAN-code een primair allocatiepunt betreft.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.2
  - number: 4.8.2.3
    text: |-
      Als alle controles uit [4.8.2.2][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.8.2.5][ref2]. Als dat niet het geval is, wordt de melding beëindiging meetverantwoordelijkheid niet uitgevoerd
      en wordt de procedure na [4.8.2.4][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.2.5
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.8.2.2
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.8.2.5
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.8.2.4
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8.2.4
    text: |-
      De netbeheerder bericht het niet uitvoeren van de beëindiging meetverantwoordelijkheid naar aanleiding van
      [4.8.2.3][ref1] uiterlijk de werkdag na ontvangst van de melding beëindiging meetverantwoordelijkheid aan de
      meetverantwoordelijke die de melding heeft ingediend en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de meetverantwoordelijke;

      d. de einddatum van de beheerovereenkomst;

      e. de reden van het niet uitvoeren van de beëindiging meetverantwoordelijkheid:

      1° de melding beëindiging meetverantwoordelijkheid is onvolledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de einddatum van de beheerovereenkomst voldoet niet aan de gestelde indientermijn;

      4° de indienende meetverantwoordelijke is onjuist;

      5° de aansluiting is geblokkeerd voor automatische mutaties;

      6° de EAN-code betreft geen primair allocatiepunt;

      f. indien aangeleverd in de melding beëindiging meetverantwoordelijkheid: het referentienummer van de
      meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.8.2.3
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8.2.5
    text: |-
      De netbeheerder stuurt een verliesbericht uiterlijk de werkdag na ontvangst van de melding beëindiging
      meetverantwoordelijkheid aan de meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de meetverantwoordelijke;

      d. de datum waarop de meetverantwoordelijkheid eindigt;

      e. de procesidentificatie die van toepassing is, te weten: einde meetverantwoordelijkheid;

      f. indien aangeleverd in de melding beëindiging meetverantwoordelijkheid: het referentienummer van de
      meetverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.5
  - number: 4.8.2.5a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, stuurt de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het in [artikel 4.8.2.5][ref1] bedoelde bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.2.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.5a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.8.2.5
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8.2.6
    text: |-
      De netbeheerder wijst uiterlijk drie werkdagen na ontvangst van de melding beëindiging meetverantwoordelijkheid
      de afnemer per brief op de gevolgen indien de afnemer niet binnen tien werkdagen na het einde van de
      beheerovereenkomst een nieuwe meetverantwoordelijke heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.6
  - number: 4.8.2.7
    text: |-
      De netbeheerder voert de beëindiging meetverantwoordelijkheid uit, bedoeld in [paragraaf 4.8.3][ref1], indien geen
      nieuwe meetverantwoordelijke zich meldt binnen tien werkdagen na de einddatum van de beheerovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de meetverantwoordelijke aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.8.3.1a
    text: |-
      Indien het een elektriciteitsaansluiting betreft waaraan naast het primaire allocatiepunt ook één of meer
      secundaire allocatiepunten zijn toegekend, muteert de netbeheerder tevens voor elk bijbehorend secundair
      allocatiepunt het aansluitingenregister met de door de nieuwe meetverantwoordelijke aangeleverde gegevens
      overeenkomstig [artikel 2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.3.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.8.3.2
    text: |-
      De netbeheerder informeert de leverancier en programmaverantwoordelijke overeenkomstig [paragraaf 2.2][ref1]
      omtrent de mutaties, bedoeld in [4.8.3.1][ref2] en [4.8.3.1a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.8.3.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.8.3.1
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.8.3.1a
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.9.1
    text: |-
      De netbeheerder registreert een nieuwe aansluiting in het aansluitingenregister en legt tenminste de volgende
      gegevens in het aansluitingenregister vast:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de fysieke status van de aansluiting, bedoeld in [2.1.3, onderdeel h][ref1], die van toepassing is, te weten:
      “in aanleg”;

      d. ingeval van een elektriciteitsaansluiting: de verblijfsfunctie of complexbepaling van de aansluiting, bedoeld in
      [2.1.3, onderdeel m][ref2], te weten: “geen verblijfsfunctie, geen complex”;

      e. indien de registratie betrekking heeft op een secundair allocatiepunt: de EAN-code van het bijbehorende primaire
      allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.9.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.10.1.1
    text: |-
      De netbeheerder informeert, tenzij anders overeengekomen, de meetverantwoordelijke tenminste tien werkdagen
      voorafgaand aan de datum waarop de aansluiting in bedrijf wordt genomen over de geplande inbedrijfname. In
      afwijking van [paragraaf 9.1][ref1] vindt deze informatie-uitwisseling niet plaats via het geautomatiseerde
      berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.10.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.10.2.1
    text: |-
      De netbeheerder neemt de aansluiting pas fysiek in bedrijf indien hij heeft geconstateerd dat voor deze aansluiting
      een leverancier, programmaverantwoordelijke en meetverantwoordelijke zijn geregistreerd en dat de meetinrichting is
      geplaatst, blijkend uit een bericht zoals bedoeld in [artikel 4.7.2.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.7.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.10.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.7.2.4
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 4.10.2.1a
    text: |-
      De netbeheerder informeert de meetverantwoordelijke op de datum waarop de aansluiting fysiek in bedrijf wordt
      genomen over de inbedrijfname van de aansluiting. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-
      uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.10.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.10.2.2
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de aansluiting fysiek in bedrijf is genomen effectueert de netbeheerder
      de fysieke status van de aansluiting, bedoeld in [2.1.3 onderdeel h][ref1], die van toepassing is, te weten: "in
      bedrijf" in het aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.10.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.10.2.3
    text: |-
      De netbeheerder informeert de leverancier, de programmaverantwoordelijke en de meetverantwoordelijke die voor de
      desbetreffende aansluiting in het aansluitingenregister vermeld staan, overeenkomstig [paragraaf 2.2][ref1] omtrent
      de mutatie, bedoeld in [4.10.2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.10.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.10.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.10.2.2
        hoofdstuk: '4'
        paragraaf: '4.10'
  - number: 4.11.1.1
    text: |-
      De netbeheerder informeert de meetverantwoordelijke tenminste tien werkdagen voorafgaand aan de datum waarop de
      aansluiting uit bedrijf wordt genomen over de geplande uitbedrijfname. In afwijking van [paragraaf 9.1][ref1] vindt
      deze informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.11.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.11.2.1
    text: |-
      De netbeheerder informeert de meetverantwoordelijke op de datum waarop de aansluiting fysiek uit bedrijf wordt
      genomen over de uitbedrijfname van de aansluiting. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-
      uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.11.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 4.11.2.2
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de aansluiting fysiek uit bedrijf is genomen effectueert de
      netbeheerder de fysieke status van de aansluiting, bedoeld in [2.1.3, onderdeel h][ref1], die van toepassing is, te
      weten: "uit bedrijf" in het aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.11.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
