        artikel: 4.5.2.3
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5.2.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de PV-switch naar aanleiding van [4.5.2.2][ref1] uiterlijk de
      werkdag na ontvangst van de PV-switchmelding aan de leverancier die de PV-switchmelding heeft ingediend en vermeldt
      daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de reden van het niet uitvoeren van de switch:

      1° de switchmelding is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de switchdatum voldoet niet aan de gestelde indientermijn;

      4° de nieuwe programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      5° de switchmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding voor een eerdere of dezelfde datum;

      6° de indienende leverancier is onjuist;

      7° de aansluiting is geblokkeerd voor automatische mutaties;

      g. indien aangeleverd in de PV-switchmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.5.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.5.2.3
