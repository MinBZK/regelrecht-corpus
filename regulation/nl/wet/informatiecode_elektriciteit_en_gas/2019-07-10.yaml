  - number: 11.1.4
    text: |-
      De Informatiecode Elektriciteit en Gas, zoals vastgesteld bij besluit van 13 juni 2013 en nadien diverse malen
      gewijzigd, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel11.1.4
  - number: 11.1.5
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel11.1.5
  - number: 11.1.6
    text: 'Dit besluit wordt aangehaald als: Informatiecode elektriciteit en gas.'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel11.1.6
