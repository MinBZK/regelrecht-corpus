        artikel: 3.8.1.1
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.8.2.1
    text: |-
      De regionale netbeheerder voert bij het fysiek in bedrijf nemen van de aansluiting een fysieke meteropname uit
      overeenkomstig [paragraaf 5.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.8.2.1
