        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.15'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 5.1.2.1a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.3.4.3a
    text: |-
      Ter uitvoering van het bepaalde in [5.3.2.6, onder (ii)][ref1] en [5.3.3.3, onder (ii)][ref2], stelt de regionale
      netbeheerder namens de leverancier een stand vast.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.4.3a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 5.3.2.6
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 5.3.3.3
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.4.3b
    text: |-
      Indien de leverancier in gebreke blijft en de regionale netbeheerder geen tijdig vastgestelde meterstand zoals
      bedoeld in [5.1.4.1][ref1] van de leverancier heeft ontvangen, noch een op afstand uitleesbare meterstand
      kon verkrijgen zoals bedoeld in [5.3.4.3][ref2], berekent de regionale netbeheerder een meterstand namens de
      leverancier overeenkomstig [5.1.3.3][ref3]:

      a. binnen vijftien werkdagen na de mutatiedatum van het betreffende mutatieproces, bedoeld in
      [3.1 tot en met 3.4][ref4] en [3.15][ref5], of

      b. binnen veertien maanden na de laatst vastgestelde meterstand, waarbij een meterstand wordt berekend en
      vastgesteld voor de datum van één jaar na de opnamedatum van de laatst vastgestelde meterstand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel5.3.4.3b
