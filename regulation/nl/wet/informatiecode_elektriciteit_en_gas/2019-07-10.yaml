  - number: 2.5.9
    text: De leverancier verstrekt de opgevraagde contractgegevens binnen 72 uur aan de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.9
  - number: 2.5.10
    text: |-
      De netbeheerder bewaart de ontvangen contractgegevens zo lang als noodzakelijk is ten behoeve van aanhangige
      geschillen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.10
  - number: 2.5.11
    text: |-
      Het is een leverancier uitsluitend toegestaan gegevens uit het contracteindegegevensregister op te vragen ten
      behoeve van

      a. het doen van een aanbod voor levering, zoals vastgelegd in [paragraaf 2.5a][ref1];

      b. voorbereiding van levering, zoals vastgelegd in [paragraaf 2.5b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.5a
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.5b
  - number: 2.5a.1
    text: |-
      Een leverancier die beschikt over een toestemming van de afnemer kan, ten behoeve van het doen van een aanbod voor
      een leveringsovereenkomst, bij de netbeheerder contracteindegegevens van de desbetreffende kleinverbruikaansluiting
      opvragen onder vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. indien de opvragende leverancier dat wenst op te geven: een referentienummer van de opvragende leverancier;

      d. de toestemmingssleutel;

      e. de klantsleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5a.1
  - number: 2.5a.2
    text: |-
      De regionale netbeheerder controleert of:

      a. de opvraag volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting is geregistreerd in het contracteindegegevensregister;

      c. de bedrijfs-EAN-code van de opvragende leverancier voorkomt in het leveranciersregister;

      d. de klantsleutel overeenkomt met de klant-sleutel voor deze aansluiting in de klantsleuteladministratie;

      e. de opvraag is voorzien van een toestemmingssleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5a.2
  - number: 2.5a.3
    text: |-
      Indien de controle één of meer negatieve resultaten oplevert, verstrekt de regionale netbeheerder de opgevraagde
      gegevens niet en stuurt hij de leverancier uiterlijk één werkdag na ontvangst van de opvraag een bericht onder
      vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. indien aangeleverd bij de opvraag: het referentienummer van de opvragende leverancier;

      d. de reden van afwijzing:

      1° de opvraag contracteindegegevens is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting komt niet voor in het contracteindegegevensregister;

      3° de bedrijfs-EAN-code van de opvragende leverancier komt niet voor in het leveranciersregister;

      4° de door de leverancier aangeleverde klantsleutel komt niet overeen met de klantsleutel voor de aansluiting in
      de klantsleuteladministratie;

      5° het verzoek is niet voorzien van een toestemmingssleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5a.3
  - number: 2.5b.1
    text: |-
      Een leverancier die beschikt over een leveringsovereenkomst waarvan de startdatum voor levering in te toekomst
      ligt en

      (i) wiens leveringsovereenkomst voor de desbetreffende kleinverbruiker is geregistreerd in het
      contracteindegegevensregister, of

      (ii) wiens melding als bedoeld in [2.5.5][ref1] voor de desbetreffende kleinverbruiker is geregistreerd in het
      contracteindegegevensregister,

      kan bij de netbeheerder contracteindegegevens horend bij de desbetreffende kleinverbruikaansluiting opvragen onder
      vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. indien de leverancier dat wenst op te geven: een referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5b.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5b.2
    text: |-
      De regionale netbeheerder controleert of:

      a. de opvraag volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting is geregistreerd in het contracteindegegevensregister;

      c. de bedrijfs-EAN-code van de opvragende leverancier voorkomt in het leveranciersregister;

      d. er in het contracteindegegevensregister een leveringsovereenkomst of een melding als bedoeld in [2.5.5][ref1]
      voor deze aansluiting is geregistreerd ten name van de opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5b.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5b.3
    text: |-
      Indien de controle één of meer negatieve resultaten oplevert, verstrekt de regionale netbeheerder de opgevraagde
      gegevens niet en stuurt hij de leverancier uiterlijk één werkdag na ontvangst van de opvraag een bericht onder
      vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. indien aangeleverd bij de opvraag: het referentienummer van de opvragende leverancier;

      d. de reden van afwijzing:

      1° de opvraag contracteindegegevens is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting komt niet voor in het contracteindegegevensregister;

      3° de bedrijfs-EAN-code van de opvragende leverancier komt niet voor in het leveranciersregister;

      4° in het contracteindegegevensregister is voor deze aansluiting geen leveringsovereenkomst of een melding als
      bedoeld in [2.5.5][ref1] geregistreerd ten name van de opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5b.3
