  - number: 2.6.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een register,
      hierna te noemen het toegankelijk meetregister.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.1
  - number: 2.6.2
    text: |-
      De regionale netbeheerders stellen, per EAN-code van een kleinverbruikaansluiting, in het toegankelijk meetregister
      de volgende gegevens beschikbaar:

      a. de EAN-code van de aansluiting;

      b. de meterstanden bedoeld in [5.1.4.1][ref1], [5.2.2.3][ref2], [5.3.4.3][ref3], [5.3.4.3a][ref4] en
      [5.3.4.3b][ref5];

      c. indien bepaald op basis van de meterstanden, bedoeld in [2.6.2, onderdeel b][ref6]: de verbruiken, bedoeld in
      [5.3.4.4][ref7] en [5.3.4.5][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel5.2.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3a
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.3b
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel2.6.2
      [ref7]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.4
      [ref8]: https://wetten.overheid.nl/BWBR0037934#Artikel5.3.4.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.6.2
