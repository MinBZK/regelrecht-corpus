  - number: 1.1.3
    text: In deze code wordt, in geval van gas, onder net mede verstaan gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.3
  - number: 1.1.4
    text: |-
      Tenzij anders vermeld, worden de in deze code beschreven processen toegepast per aansluiting en, voor zover van
      toepassing, voor elektriciteit en gas afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel1.1.4
  - number: 1.1.5
    text: |-
      Voor de beheerder van het landelijk gastransportnet zijn van deze code uitsluitend de volgende bepalingen
      van toepassing: [1.1.1 tot en met 1.1.5][ref1], [1.1.11][ref2] en de [paragrafen 2.13][ref3], [4.14][ref4],
      [4.15][ref5], [10.1.1.6][ref6] en [10.1.1.7][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel1.1.1
