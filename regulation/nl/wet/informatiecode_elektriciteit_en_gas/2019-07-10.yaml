  - number: 2.1.5c
    text: |-
      Indien aan een aansluiting secundaire allocatiepunten zijn toegekend, worden de gegevens die de netbeheerder op
      grond van de [artikelen 2.1.3][ref1], [2.1.4][ref2] en [2.1.5][ref3] voor de aansluiting heeft vastgelegd beschouwd
      te zijn toegekend aan het primaire allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
