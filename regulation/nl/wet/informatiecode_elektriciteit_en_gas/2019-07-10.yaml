        artikel: 4.1.2.1
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.4.3.8
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces PV-
      switch of wijzigen verblijfsfunctie of complexbepaling, indien de eindelevering, bedoeld in [4.4.2.1][ref1], het
      desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.4.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.3.8
