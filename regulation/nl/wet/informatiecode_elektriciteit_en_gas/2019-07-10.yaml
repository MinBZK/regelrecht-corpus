    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de actuele leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.3.1
