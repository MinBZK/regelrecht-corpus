  - number: 3.10.1.1
    text: |-
      De regionale netbeheerder controleert, voorafgaand aan de effectuering in het aansluitingenregister, bedoeld in
      [3.10.1.4][ref1], of er voor de desbetreffende aansluiting nog eerder bevestigde, doch nog niet geëffectueerde
      leverancierswitchmeldingen, inhuizingsmeldingen, uithuizingsmeldingen, eindeleveringsmeldingen of PV-
      switchmeldingen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.10.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.10.1.4
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: 3.10.1.2
    text: |-
      De regionale netbeheerder verwijdert eerder bevestigde, doch nog niet geëffectueerde meldingen, bedoeld in
      [3.10.1.1][ref1], indien deze aanwezig zijn, beëindigt de procedure(s) en informeert de leverancier hierover. In
      afwijking van [paragraaf 8.1.1][ref2] vindt deze informatie niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.10.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel8.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.10.1.1
        hoofdstuk: '3'
        paragraaf: '3.10'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 8.1.1
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 3.10.1.3
    text: |-
      De leverancier informeert de programmaverantwoordelijke over de verwijdering van eerder ingediende, doch nog niet
      geëffectueerde meldingen, bedoeld in [3.10.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.10.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.10.1.2
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: 3.10.1.4
    text: |-
      De regionale netbeheerder effectueert uiterlijk vijf werkdagen na de datum waarop de aansluiting is verwijderd
      de waarde, genoemd in [2.1.3, onderdeel h][ref1], die van toepassing is, te weten: “verwijderd” in het
      aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.10.1.4a
    text: |-
      Indien een primair allocatiepunt wordt verwijderd, verwijdert de netbeheerder tegelijkertijd ook de bijbehorende
      secundaire allocatiepunten.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.1.4a
  - number: 3.10.1.5
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan, overeenkomstig [paragraaf 2.2][ref1] over de mutatie, bedoeld in
      [3.10.1.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.10.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.10.1.4
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: 3.10.2.1
    text: |-
      De regionale netbeheerder voert bij het verwijderen van de aansluiting een fysieke meteropname uit overeenkomstig
      [paragraaf 5.2][ref1] indien de fysieke status van de aansluiting, genoemd in [2.1.3 onderdeel h][ref2],
      voorafgaand aan de verwijdering van de aansluiting de waarde "in bedrijf" had.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.10.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.11.1.1
    text: |-
      Uiterlijk vijf werkdagen na de datum waarop de kleinverbruikmeetinrichting is gewisseld of gewijzigd effectueert de
      regionale netbeheerder dit in het aansluitingenregister overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.11.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.11.1.1a
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, en de regionale netbeheerder stelt vast dat de meetinrichting niet op afstand uitleesbaar is,
      muteert de regionale netbeheerder de allocatiemethode onmiddellijk naar de waarde “profielallocatie”.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.11.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.11.1.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2][ref1] over de mutatie, bedoeld in
      [3.11.1.1][ref2] en in voorkomende gevallen over de mutatie bedoeld in [3.11.1.1a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.11.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.11.1.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.11.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.11.1.1
        hoofdstuk: '3'
        paragraaf: '3.11'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.11.1.1a
        hoofdstuk: '3'
        paragraaf: '3.11'
  - number: 3.11.2.1
    text: |-
      De regionale netbeheerder voert bij een wisseling of wijziging van een kleinverbruikmeetinrichting een fysieke
      meteropname uit overeenkomstig [paragraaf 5.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.11.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 3.12.1.1
    text: |-
      De leverancier stuurt een melding wijzigen naam of verblijfsfunctie of complexbepaling op de werkdag voor de
      beoogde wijziging naar de regionale netbeheerder, indien de verblijfsfunctie of complexbepaling wijzigt of
      de registratie van de naam van de aangeslotene wijzigt zonder dat hiervoor een nieuw leveringscontract wordt
      aangegaan. De melding wijzigen naam of verblijfsfunctie of complexbepaling bevat de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de reden van wijzigen:

      1° alleen wijziging van de naam van de aangeslotene;

      2° alleen wijziging van de verblijfsfunctie of complexbepaling;

      3° wijzigen van zowel de naam als de verblijfsfunctie of complexbepaling;

      d. de gewijzigde gegevens, bedoeld in [3.12.1.1 onderdeel c][ref1];

      e. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.12.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.12.1.1
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 3.12.2.1
    text: |-
      Naar aanleiding van de melding wijzigen naam of verblijfsfunctie of complexbepaling controleert de regionale
      netbeheerder of:

      a. de melding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de melding wijzigen naam of verblijfsfunctie of complexbepaling wordt ingediend door de in het
      aansluitingenregister vermelde leverancier;

      d. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting met een eerdere of dezelfde datum.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.2.1
  - number: 3.12.2.2
    text: |-
      Als alle controles uit [3.12.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.12.2.4][ref2]. Als dat niet het geval is, wordt de wijziging naam of verblijfsfunctie of complexbepaling niet
      uitgevoerd en wordt de procedure na [3.12.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.12.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.12.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.12.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.12.2.1
        hoofdstuk: '3'
        paragraaf: '3.12'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.12.2.4
        hoofdstuk: '3'
        paragraaf: '3.12'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.12.2.3
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 3.12.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de wijziging naam of verblijfsfunctie of complexbepaling
      naar aanleiding van [3.12.2.2][ref1] uiterlijk de werkdag na ontvangst van de melding wijzigen naam of
      verblijfsfunctie of complexbepaling aan de leverancier die de melding heeft ingediend en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. indien aangeleverd in de melding wijzigen naam of verblijfsfunctie of complexbepaling: het referentienummer van
      de leverancier;

      e. de reden voor het niet uitvoeren van de melding wijzigen naam of verblijfsfunctie of complexbepaling:

      1° de melding wijzigen naam of verblijfsfunctie of complexbepaling is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de indienende leverancier is onjuist;

      4° de melding wijzigen naam of verblijfsfunctie of complexbepaling conflicteert met een eerder bevestigde, doch nog
      niet geëffectueerde leverancierswitch-, inhuizings-, uithuizings- of eindeleveringsmelding.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.12.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.12.2.2
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 3.12.2.4
    text: |-
      De regionale netbeheerder bevestigt de geplande uitvoering van de melding wijzigen naam of verblijfsfunctie
      of complexbepaling uiterlijk de werkdag na ontvangst van de melding wijzigen naam of verblijfsfunctie of
      complexbepaling aan de leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting

      b. indien aangeleverd in de melding wijzigen naam of verblijfsfunctie of complexbepaling: het referentienummer van
      de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.2.4
  - number: 3.12.3.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding voor dezelfde aansluiting is ontvangen voor een eerdere of dezelfde
      mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.12.3.2
    text: |-
      De regionale netbeheerder informeert de leverancier en programmaverantwoordelijke overeenkomstig
      [paragraaf 2.2][ref1], indien de mutaties, bedoeld in [3.12.3.1][ref2], een wijziging van de verblijfsfunctie of
      complexbepaling betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.12.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.12.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.12.3.1
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: 3.13.1.1
    text: |-
      Op verzoek van de aangeslotene wijzigt de regionale netbeheerder de administratieve status van de
      kleinverbruikmeetinrichting, bedoeld in [2.1.4 onderdeel b][ref1], van de kleinverbruikmeetinrichting die op
      afstand uitleesbaar is in het aansluitingenregister overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.4
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13.1.1a
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3 onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft, en het verzoek van de aangeslotene inhoudt dat de kleinverbruikmeetinrichting administratief uit
      wordt gezet, collecteert de regionale netbeheerder de dan geldende meterstand(en) en stelt deze vast. Vervolgens
      muteert de regionale netbeheerder de allocatiemethode naar de waarde “profielallocatie” met inachtneming van
      [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13.1.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2][ref1] over de mutatie, bedoeld in
      [3.13.1.1][ref2] en in voorkomende gevallen over de mutatie bedoeld in [3.13.1.1a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.13.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.13.1.1a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.13.1.1
        hoofdstuk: '3'
        paragraaf: '3.13'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.13.1.1a
        hoofdstuk: '3'
        paragraaf: '3.13'
  - number: 3.13.1.3
    text: |-
      De meetinrichting waarvan de administratieve status op ”uit” is gezet wordt beschouwd als een meetinrichting die
      niet op afstand uitleesbaar is.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13.1.3
  - number: 3.13a.1.1
    text: |-
      Indien de regionale netbeheerder constateert dat de kleinverbruikmeetinrichting vanwege externe factoren van
      technische aard niet op afstand uitleesbaar is, dan wijzigt de regionale netbeheerder het kenmerk als bedoeld in
      [2.1.4, onderdeel g][ref1] dienovereenkomstig met inachtneming van [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.4
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13a.1.2
    text: |-
      Indien de allocatiemethode van de aansluiting, bedoeld in [2.1.3, onderdeel s][ref1], de waarde “slimme-meter-
      allocatie” heeft en de regionale netbeheerder de uitleesbaarheid van de kleinverbruikmeetinrichting, zoals bedoeld
      in [2.1.4, onderdeel g][ref2] wijzigt naar “niet op afstand uitleesbaar”, dan:

      (i) collecteert de regionale netbeheerder de dan geldende meterstand overeenkomstig [5.2.2][ref3], of indien zulks
      onmogelijk is,

      (ii) berekent de regionale netbeheerder de dan geldende meterstand overeenkomstig [5.1.3.3][ref4]

      en stelt deze vast. Vervolgens muteert de regionale netbeheerder de allocatiemethode naar de waarde
      “profielallocatie” met inachtneming van [2.1.8][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel5.1.3.3
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.4
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 5.1.3.3
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.13a.1.3
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2][ref1] over de mutatie bedoeld in
      [3.13a.1.1][ref2] en in voorkomende gevallen over de mutatie bedoeld in [3.13a.1.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.13a.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.13a.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.13a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.13a.1.1
        hoofdstuk: '3'
        paragraaf: 3.13a
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.13a.1.2
        hoofdstuk: '3'
        paragraaf: 3.13a
  - number: 3.14.1.1
    text: |-
      Onder een onterechte leverancierswitch wordt verstaan de uitvoering van de leverancierswitch, bedoeld in
      [3.1][ref1], op een aansluiting waarvoor geen leveringsovereenkomst voor de desbetreffende periode tot stand is
      gekomen tussen de aangeslotene en de leverancier die de leverancierswitchmelding heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.14.1.2
    text: |-
      De leverancier, die constateert dat er sprake is van een onterechte leverancierswitch, neemt hierover binnen
      vijf werkdagen contact op met de andere betrokken leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.1.3
    text: |-
      De leverancier, die voor de desbetreffende aansluiting uit het aansluitingenregister is verwijderd, dient terstond
      een leverancierswitch in ter correctie van de onterechte leverancierswitch, bedoeld in [3.14.1.1][ref1], voor deze
      aangeslotene overeenkomstig [paragraaf 3.1][ref2], indien de leveranciers constateren dat er sprake is van een
      onterechte leverancierswitch.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.1.1
        hoofdstuk: '3'
        paragraaf: '3.14'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.14.1.4
    text: |-
      In de leverancierswitch die ter correctie is ingediend, bedoeld in [3.14.1.3][ref1], wordt de laatst vastgestelde
      meterstand op de aansluiting gebruikt voor de mutatiedatum van de leverancierswitch die als correctie is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.1.3
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.1.5
    text: |-
      De leveranciers verrekenen de inkoopkosten onderling, indien de switch die ter correctie is ingediend, bedoeld in
      [3.14.1.3][ref1], op een later tijdstip dan dertien maanden na de onterechte leverancierswitch plaatsvindt en één
      van de leveranciers dit verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.1.3
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.2.1
    text: |-
      Onder een onterechte uithuizing wordt verstaan de uitvoering van de uithuizing, bedoeld in [3.2][ref1], op een
      aansluiting waarbij de aangeslotene niet daadwerkelijk de aansluiting heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.14.2.2
    text: |-
      De leverancier, die constateert dat er sprake is van een onterechte uithuizing op een aansluiting, dient terstond
      een inhuizing ter correctie in overeenkomstig [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.2.3
    text: |-
      In de inhuizing ter correctie, bedoeld in [3.14.2.2][ref1], wordt de meterstand die voor de aansluiting op de
      mutatiedatum van de onterechte uithuizing is gebruikt, vastgesteld voor de datum van de inhuizing die ter correctie
      is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.2.2
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.2.4
    text: De leverancier vergoedt de kosten als gevolg van de onterechte uithuizing aan de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.2.4
  - number: 3.14.3.1
    text: |-
      Onder een onterechte inhuizing wordt verstaan de uitvoering van de inhuizing, bedoeld in [paragraaf 3.3][ref1],
      op een aansluiting waarbij de veronderstelde aangeslotene niet daadwerkelijk op de aansluiting is ingehuisd dan
      wel dat er geen leveringsovereenkomst voor de desbetreffende aansluiting tussen de aangeslotene en de leverancier
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.3.2
    text: |-
      De leverancier die constateert dat het een onterechte inhuizing betreft op een aansluiting, waarbij op het moment
      van inhuizen geen leverancier in het aansluitingenregister geregistreerd staat, zal terstond een uithuizing ter
      correctie indienen overeenkomstig [paragraaf 3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.14.3.3
    text: |-
      In de uithuizing ter correctie, bedoeld in [3.14.3.2][ref1], wordt de laatst vastgestelde meterstand op de
      aansluiting gebruikt voor de mutatiedatum van de uithuizing die als correctie is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.3.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.3.2
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.3.4
    text: |-
      De leverancier die constateert dat het een onterechte inhuizing betreft op een aansluiting, waarbij op het moment
      van inhuizen een leverancier in het aansluitingenregister geregistreerd staat, neemt hierover binnen vijf werkdagen
      contact op met de andere betrokken leverancier. In afwijking van [paragraaf 9.1][ref1] vindt deze informatie-
      uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.3.5
    text: |-
      De leverancier die door de onterechte inhuizing uit het aansluitingenregister is verwijderd, dient terstond een
      inhuizing ter correctie in voor deze aangeslotene overeenkomstig [paragraaf 3.3][ref1], indien de leveranciers,
      bedoeld in [3.14.3.4][ref2], constateren dat er sprake is van een onterechte inhuizing.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.3.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.14.3.4
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.3.6
    text: |-
      In de inhuizing ter correctie, bedoeld in [3.14.3.5][ref1], wordt de laatst vastgestelde meterstand op de
      aansluiting gebruikt voor de mutatiedatum van de inhuizing die als correctie is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.3.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.3.5
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.3.7
    text: |-
      De leveranciers verrekenen de inkoopkosten onderling, indien de inhuizing ter correctie, bedoeld in
      [3.14.3.6][ref1], op een later tijdstip dan dertien maanden na de onterechte inhuizing plaatsvindt en één van de
      leveranciers dit verlangt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.3.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.3.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.3.6
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.4.1
    text: |-
      Onder een onterechte eindelevering wordt verstaan de onbedoelde uitvoering van het proces eindelevering op een
      aansluiting, bedoeld in [paragraaf 3.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.14.4.2
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte eindelevering, dient terstond een inhuizing ter
      correctie in overeenkomstig [3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.14.4.3
    text: |-
      In de inhuizing ter correctie, bedoeld in [3.14.4.2][ref1], wordt de meterstand, die op de mutatiedatum van de
      onterechte eindelevering is vastgesteld, gebruikt voor de mutatiedatum van de inhuizing die als correctie is
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.4.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.4.2
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.14.5.1
    text: |-
      Onder een onterechte PV-switch wordt verstaan de onbedoelde uitvoering van het proces PV-switch op een aansluiting,
      bedoeld in [paragraaf 3.5][ref1] of [paragraaf 3.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.14.5.2
    text: |-
      De leverancier, die constateert dat er sprake is van een onterechte PV-switch, neemt hierover binnen vijf werkdagen
      contact op met de betrokken programmaverantwoordelijken. In afwijking van [paragraaf 9.1][ref1] vindt deze
      informatie-uitwisseling niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 3.14.5.3
    text: |-
      De leverancier die constateert dat er sprake is van een onterechte PV-switch, dient terstond een PV-switch ter
      correctie in overeenkomstig [3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.14.5.4
    text: |-
      De programmaverantwoordelijke die naar aanleiding van de onterechte PV-switch, bedoeld in [3.14.5.1][ref1],
      onterecht in het aansluitingenregister is geregistreerd, verrekent de volumes en eventuele kosten met de
      leverancier wanneer dit noodzakelijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.14.5.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.14.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.14.5.1
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: 3.15.1.1
    text: |-
      De actuele leverancier die beschikt over een machtiging van de aangeslotene om de allocatiemethode te wijzigen,
      stuurt de betreffende wijziging van de allocatiemethode op de gewenste mutatiedatum naar de regionale netbeheerder.
      De melding “wijziging allocatiemethode” bevat:

      a. de EAN-code van de aansluiting;

      b. de mutatiedatum;

      c. de gewenste allocatiemethode;

      d. de bedrijfs-EAN-code van de regionale netbeheerder;

      e. de bedrijfs-EAN-code van de actuele leverancier;

      f. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.1.1
  - number: 3.15.2.1
    text: |-
      Naar aanleiding van het verzoek tot wijziging van de allocatiemethode controleert de regionale netbeheerder of:

      a. het verzoek tot wijziging van de allocatiemethode volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voorkomt in het aansluitingenregister;

      c. de aansluiting een elektriciteitsaansluiting betreft;

      d. de gewenste mutatiedatum gelijk is aan datum indiening wijzigingsverzoek;

      e. de wijziging van de allocatiemethode wordt ingediend door de actuele leverancier;

      f. de allocatiemethode is toegestaan;

      g. de aansluiting op afstand uitleesbaar is;

      h. de gewenste allocatiemethode niet reeds van toepassing is.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.2.1
  - number: 3.15.2.2
    text: |-
      Als alle controles uit [3.15.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [3.15.3][ref2]. Als dat niet het geval is, wordt de wijziging niet uitgevoerd en wordt de procedure na
      [3.15.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.15.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel3.15.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.15.2.1
        hoofdstuk: '3'
        paragraaf: '3.15'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.15'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 3.15.2.3
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 3.15.2.3
    text: |-
      De regionale netbeheerder bericht het niet uitvoeren van de wijziging van de allocatiemethode naar aanleiding van
      [3.15.2.2][ref1] uiterlijk de werkdag na ontvangst van het verzoek tot wijziging van de allocatiemethode aan de
      leverancier die het verzoek tot wijziging van de allocatiemethode heeft ingediend en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de reden van het niet uitvoeren van de wijziging van de allocatiemethode:

      1° het verzoek tot wijziging van de allocatiemethode is onvolledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de aansluiting betreft geen elektriciteitsaansluiting;

      4° de gewenste mutatiedatum voldoet niet aan de gestelde indientermijn;

      5° de indienende leverancier is onjuist;

      6° de allocatiemethode is niet toegestaan

      7° de aansluiting is niet op afstand uitleesbaar;

      8° de gewenste allocatiemethode wordt reeds toegepast;

      e. indien aangeleverd in het verzoek tot wijziging van de allocatiemethode: het referentienummer van de
      leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel3.15.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 3.15.2.2
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 3.15.3.1
    text: |-
      De regionale netbeheerder muteert het veld, zoals bedoeld in [2.1.3 onderdeel s][ref1], in het
      aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig [2.1.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.15.3.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de programmaverantwoordelijke die voor de aansluiting
      in het aansluitingenregister vermeld staan overeenkomstig [paragraaf 2.2.][ref1] over de mutatie, bedoeld in
      [3.15.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.15.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.15.3.1
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: 3.15.4.1
    text: |-
      De leverancier collecteert de meterstand behorende bij de wijziging van de allocatiemethode, stelt deze vast
      en distribueert deze overeenkomstig [hoofdstuk 5][ref1] indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref2], de waarde “in bedrijf” heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.15.4.2
    text: |-
      De leverancier stelt geen meterstand vast indien de fysieke status van de aansluiting, bedoeld in
      [2.1.3 onderdeel h][ref1], niet de waarde “in bedrijf” heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.15.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.1.1.1
    text: |-
      De aangeslotene machtigt de nieuwe leverancier om namens hem de switch van leverancier af te wikkelen. Op grond
      van deze machtiging stuurt de nieuwe leverancier tenminste vijf werkdagen en ten hoogste twintig werkdagen voor
      de switchdatum namens deze aangeslotene een switchmelding naar de netbeheerder. De switchmelding bevat de volgende
      gegevens:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de programmaverantwoordelijke;

      f. indien de leverancier dat wenst op te geven: de naam van de aangeslotene;

      g. indien de leverancier dat wenst op te geven: het referentienummer van de leverancier;

      h. indien de leverancier de naam van de aangeslotene overeenkomstig 4.1.1.1, onderdeel f, heeft opgegeven, en
      hierover beschikt: de geboortedatum van de aangeslotene;

      i. indien de leverancier de naam van de aangeslotene overeenkomstig 4.1.1.1, onderdeel f, heeft opgegeven, en
      hierover beschikt: het KvK-nummer van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.1.1
  - number: 4.1.2.1
    text: |-
      Naar aanleiding van de switchmelding controleert de netbeheerder of:

      a. de switchmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de switchdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig werkdagen
      in de toekomst ligt;

      d. de nieuwe leverancier is opgenomen in het leveranciersregister;

      e. de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      f. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding of inhuizingsmelding is voor
      dezelfde aansluiting;

      g. de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.1
  - number: 4.1.2.2
    text: |-
      In aanvulling op [4.1.2.1][ref1] controleert de netbeheerder of de naam van de aangeslotene is ingevuld in de
      switchmelding, indien op de aansluiting in het aansluitingenregister geen leverancier is geregistreerd op de
      switchdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.1.2.1
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.2.3
    text: |-
      Als alle controles uit [4.1.2.1][ref1] en [4.1.2.2][ref2] een positief resultaat geven, wordt de procedure
      vervolgd vanaf [4.1.2.5][ref3]. Als dat niet het geval is, wordt de switch niet uitgevoerd en wordt de procedure na
      [4.1.2.4][ref4] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.5
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.1.2.1
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.1.2.2
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.1.2.5
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 4.1.2.4
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.2.4
    text: |-
      De netbeheerder bericht het niet uitvoeren van de switch naar aanleiding van [4.1.2.3][ref1] uiterlijk de werkdag
      na ontvangst van de switchmelding aan de leverancier die de switchmelding heeft ingediend en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe leverancier;

      d. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      e. de switchdatum;

      f. de reden van het niet uitvoeren van de switch:

      1° de switchmelding is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de switchdatum voldoet niet aan de gestelde indientermijn;

      4° de nieuwe leverancier komt niet voor in het leveranciersregister;

      5° de programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      6° de switchmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde switchmelding of
      inhuizingsmelding;

      7° in het aansluitingenregister is geen leverancier vermeld en de switchmelding bevat geen naam van de
      aangeslotene;

      8° de aansluiting is geblokkeerd voor automatische mutaties;

      g. indien aangeleverd in de switchmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.1.2.3
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.2.5
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding aan de
      nieuwe leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de bedrijfs-EAN-code van de oude leverancier;

      g. de procesidentificatie die van toepassing is, te weten: leverancierswitch;

      h. indien aangeleverd in de switchmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.5
  - number: 4.1.2.6
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding aan de
      nieuwe programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de procesidentificatie die van toepassing is, te weten: leverancierswitch.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.6
  - number: 4.1.2.7
    text: |-
      De netbeheerder verstuurt een verwervingsbericht uiterlijk de werkdag na ontvangst van de switchmelding aan de
      meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de nieuwe leverancier;

      e. de bedrijfs-EAN-code van de nieuwe programmaverantwoordelijke;

      f. de bedrijfs-EAN-code van de oude leverancier;

      g. de procesidentificatie die van toepassing is, te weten: leverancierswitch;

      h. indien aangeleverd in de switchmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.7
  - number: 4.1.2.8
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de switchmelding aan de oude
      leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de oude leverancier;

      e. de bedrijfs-EAN-code van de nieuwe leverancier;

      f. de procesidentificatie die van toepassing is, te weten: leverancierswitch.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.8
  - number: 4.1.2.9
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de switchmelding aan de oude
      programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de switchdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de oude programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: leverancierswitch.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.9
  - number: 4.1.2.10
    text: |-
      De netbeheerder beëindigt de procedure van een reeds bevestigd, maar nog niet geëffectueerd mutatieproces
      uithuizing, eindelevering, PV-switch of wijzigen verblijfsfunctie of complexbepaling, indien de leverancierswitch,
      bedoeld in [4.1.1.1][ref1], het desbetreffende mutatieproces annuleert.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.1.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.2.10
