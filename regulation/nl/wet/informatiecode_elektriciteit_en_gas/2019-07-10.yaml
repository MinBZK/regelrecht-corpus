        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.6.4.2
    text: |-
      De regionale netbeheerder informeert de leverancier en de nieuwe programmaverantwoordelijke conform [2.2][ref1]
      omtrent de in [3.6.4.1][ref2] bedoelde mutaties. In afwijking van [1.1.4][ref3] worden de stamgegevensberichten van
      alle gemuteerde aansluitingen in de bulk PV-switch per ontvangende partij gebundeld in een bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel3.6.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel1.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 3.6.4.1
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 1.1.4
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 3.7.1
    text: |-
      De regionale netbeheerder registreert een nieuwe aansluiting in het aansluitingenregister en legt tenminste de
      volgende gegevens in het aansluitingenregister vast:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de regionale netbeheerder;

      c. de fysieke status van de aansluiting, bedoeld in [2.1.3 onderdeel h][ref1], die van toepassing is, te weten:
      “in aanleg”;

      d. ingeval van een elektriciteitsaansluiting: de verblijfsfunctie of complexbepaling van de aansluiting, bedoeld in
      [2.1.3 onderdeel m][ref2], te weten: “geen verblijfsfunctie, geen complex”;

      e. indien de registratie betrekking heeft op een secundair allocatiepunt: de EAN-code van het bijbehorende primaire
      allocatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.7.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
