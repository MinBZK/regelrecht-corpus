        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.4.1
    text: |-
      De regionale netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel3.6.4.1
