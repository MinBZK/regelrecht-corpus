        artikel: 4.1.3.1
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en het verbruik behorend bij het switchproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.2.1.1
    text: |-
      De aangeslotene machtigt zijn actuele leverancier om namens hem de uithuizing af te wikkelen. Op grond van
      deze machtiging stuurt de actuele leverancier tenminste vijf werkdagen en ten hoogste twintig werkdagen voor de
      uithuizingsdatum namens deze aangeslotene een uithuizingsmelding naar de netbeheerder. De uithuizingsmelding bevat
      de volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. indien de actuele leverancier dat wenst op te geven: het referentienummer van de actuele leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.1.1
  - number: 4.2.2.1
    text: |-
      Naar aanleiding van de uithuizingsmelding controleert de netbeheerder of:

      a. de uithuizingsmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de uithuizingsdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig
      werkdagen in de toekomst ligt;

      d. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding, inhuizingsmelding,
      uithuizingsmelding of eindeleveringsmelding is voor dezelfde aansluiting met een eerdere of dezelfde datum;

      e. de uithuizingsmelding is ingediend door de in het aansluitingenregister vermelde leverancier;

      f. de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.1
  - number: 4.2.2.2
    text: |-
      Als alle controles uit [4.2.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.2.2.4][ref2]. Als dat niet het geval is, wordt de uithuizing niet uitgevoerd en wordt de procedure na
      [4.2.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.2.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.2.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.2.2.1
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.2.2.4
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.2.2.3
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.2.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de uithuizing naar aanleiding van [4.2.2.2][ref1] uiterlijk de
      werkdag na ontvangst van de uithuizingsmelding aan de leverancier die de uithuizingsmelding heeft ingediend en
      vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de leverancier;

      d. de uithuizingsdatum;

      e. de reden van het niet uitvoeren van de uithuizing:

      1° de uithuizingsmelding is niet volledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de uithuizingsdatum voldoet niet aan de gestelde indientermijn;

      4° de uithuizingsmelding conflicteert met een eerdere bevestigde maar nog niet geëffectueerde uithuizingsmelding;

      5° de uithuizingsmelding conflicteert met een eerder bevestigde maar nog niet geëffectueerde
      leverancierswitchmelding of inhuizingsmelding;

      6° de indienende leverancier is onjuist;

      7° de aansluiting is geblokkeerd voor automatische mutaties;

      f. indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.2.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.2.2.2
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.2.4
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de
      actuele leverancier en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. de procesidentificatie die van toepassing is, te weten: uithuizing;

      f. indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.4
  - number: 4.2.2.5
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de
      actuele programmaverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele programmaverantwoordelijke;

      e. de procesidentificatie die van toepassing is, te weten: uithuizing;
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.5
  - number: 4.2.2.6
    text: |-
      De netbeheerder verstuurt een verliesbericht uiterlijk de werkdag na ontvangst van de uithuizingsmelding aan de
      meetverantwoordelijke en vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de uithuizingsdatum;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de bedrijfs-EAN-code van de actuele leverancier;

      e. indien de uithuizing het gevolg is van een inhuizing, bedoeld in [4.3][ref1], bevat de melding tevens de
      bedrijfs-EAN-code van de nieuwe leverancier op de aansluiting.

      f. de procesidentificatie die van toepassing is, te weten: uithuizing;

      g. indien aangeleverd in de uithuizingsmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.2.6
    references:
