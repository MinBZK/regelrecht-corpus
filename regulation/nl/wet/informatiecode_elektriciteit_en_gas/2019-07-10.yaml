        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.7
    text: |-
      In uitzondering op [2.1.6][ref1] kan een netbeheerder de velden, bedoeld in [2.1.3 onderdeel f en g][ref2], muteren
      zonder opdracht van een leverancier ter uitvoering van het besluit, bedoeld in [artikelen 16, achtste lid][ref3],
      en [95f, tweede lid, van de Elektriciteitswet 1998][ref4] en [artikelen 10a, vierde lid][ref5] en
      [47, tweede lid, van de Gaswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
