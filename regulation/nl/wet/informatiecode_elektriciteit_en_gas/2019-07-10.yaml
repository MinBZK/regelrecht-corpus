  - number: 8.2.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.2.2
  - number: 8.2.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.2.3
  - number: 8.2.4
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.2.4
  - number: 8.2.5
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.2.5
  - number: 8.2.6
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.2.6
  - number: 8.2.7
    text: |-
      De regionale netbeheerders en een representatief deel van de leveranciers stellen jaarlijks gezamenlijk een
      kalender op om te voldoen aan de termijn, bedoeld in [8.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 8.2.1
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.3.1
    text: |-
      De leverancier houdt voor de regionale netbeheerder een factuur- en BTW-administratie bij voor wat betreft het door
      hem gefactureerde nettarief.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.3.1
  - number: 8.3.2
    text: |-
      De leverancier verstrekt de factuur- en BTW-administratie, bedoeld in [8.3.1][ref1], onverwijld aan de regionale
      netbeheerder indien de Belastingdienst de regionale netbeheerder hierom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 8.3.1
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.3.3
    text: |-
      Ingeval de leverancier ten aanzien van de betreffende nettarieven een bijzonder BTW-tarief bij de aangeslotene in
      rekening heeft gebracht of zal brengen, kan de leverancier de netbeheerder verzoeken om de teveel afgedragen BTW
      te verrekenen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.3.3
  - number: 8.3.4
    text: |-
      Het verzoek als bedoeld in [8.3.3][ref1]. verzendt de leverancier uiterlijk in de maand februari, volgend op het
      kalenderjaar waarop het verzoek betrekking heeft, en bevat de volgende gegevens:

      a. de EAN-code van de betreffende aansluiting;

      b. de periode van het betreffende kalenderjaar waarin de leverancier op de aansluiting stond geregistreerd, en,
      overeenkomstig het besluit van de belastinginspecteur, een bijzonder BTW-tarief in rekening mocht of mag worden
      gebracht;

      c. het belastingobject;

      d. het aan de betrokken netbeheerder afgedragen bedrag exclusief BTW;

      e. het aan de betrokken netbeheerder afgedragen BTW-bedrag

      f. het bijzondere BTW-tarief als bedoeld in onderdeel b;

      g. het BTW-bedrag op grond van het besluit van de belastinginspecteur als bedoeld in onderdeel b;

      h. het door de betrokken netbeheerder te verrekenen BTW-bedrag;

      i. een kenmerk van het besluit van de belastinginspecteur als bedoeld in onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 8.3.3
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.3.5
    text: |-
      Naar aanleiding van het in [8.3.3][ref1] bedoelde verzoek zal de netbeheerder het te verrekenen BTW-bedrag
      uiterlijk 28 maart van het desbetreffende kalenderjaar overboeken.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel8.3.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 8.3.3
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.3.6
    text: |-
      In afwijking van het bepaalde in [paragraaf 9.1][ref1] vindt de gegevensuitwisseling als bedoeld in [8.3.3][ref2]
      en [8.3.4][ref3] niet plaats via het geautomatiseerde berichtenverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel8.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel8.3.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel8.3.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 8.3.3
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 8.3.4
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 9.1.1
    text: |-
      De netbeheerders en een representatief deel van de leveranciers, de programmaverantwoordelijken en de
      meetverantwoordelijken organiseren gezamenlijk een overlegplatform, waarin regels worden vastgesteld met
      betrekking tot de elektronische uitwisseling van gegevens, bedoeld in artikel 6 van de regeling, bedoeld in
      [artikelen 53][ref1] en [95cb, zesde lid, van de Elektriciteitswet 1998][ref2] en [artikelen 21][ref3] en
      [44b, zesde lid, van de Gaswet][ref4] met uitzondering van [hoofdstuk 7][ref5] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel44b
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95cb
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0011440
        artikel: 44b
      - id: ref5
        bwb_id: BWBR0037934
        hoofdstuk: '7'
  - number: 9.1.2
    text: |-
      De ondernemingen als bedoeld in [9.1.1][ref1], bedoeld in [9.1.1][ref2], stelt regels omtrent:

      a. procedures en specificaties van de te gebruiken centrale communicatiesystemen voor de geautomatiseerde
      berichtenuitwisseling;

      b. berichtspecificaties voor de (elektronische) gegevensuitwisseling;

      c. communicatieprotocollen voor de gegevensuitwisseling;

      d. de wijze waarop marktpartijen hun autorisatie- en beveiligingsbeleid bedoeld in [9.1a][ref3] inrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.1
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 9.1.1
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '9'
        paragraaf: 9.1a
  - number: 9.1.3
    text: |-
      De netbeheerders zijn gezamenlijk verantwoordelijk voor de centrale communicatiesystemen en besteden de inrichting
      en het beheer ervan in het algemeen en de uitvoeringshandelingen als bedoeld in [9.1.5][ref1], [9.1.7][ref2] en
      [9.1.10][ref3] in het bijzonder uit aan een uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.7
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.10
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.5
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 9.1.7
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 9.1.10
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.4
    text: |-
      Het in [paragraaf 13.5 van de Netcode elektriciteit][ref1] bedoelde centrale communicatiesysteem wordt beheerd door
      de netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Paragraaf13.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037940
        paragraaf: '13.5'
  - number: 9.1.5
    text: |-
      De gezamenlijke netbeheerders organiseren bij wijziging van de procedures, specificaties, berichtspecificaties
      of communicatieprotocollen, bedoeld in [9.1.2][ref1], een test waarbij een netbeheerder, leverancier,
      programmaverantwoordelijke of meetverantwoordelijke die aantoonbaar voldoet aan de betreffende procedures,
      specificaties, berichtspecificaties of communicatieprotocollen een verklaring ontvangt dat de test succesvol is
      doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.2
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.6
    text: |-
      Het is een netbeheerder, leverancier, programmaverantwoordelijke of meetverantwoordelijke slechts toegestaan een
      bericht uit te wisselen met de centrale communicatiesystemen, als die onderneming voor het betreffende bericht in
      bezit is van de verklaring, bedoeld in [9.1.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.5
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.7
    text: |-
      De gezamenlijke netbeheerders zullen de toegang van een netbeheerder, leverancier, programmaverantwoordelijke of
      meetverantwoordelijke tot de centrale systemen weigeren indien:

      a. de onderneming niet beschikt over de verklaring, bedoeld in [9.1.5][ref1];

      b. de onderneming, na daartoe uitgenodigd door de uitvoeringsorganisatie, bedoeld in [9.1.3][ref2], niet onverwijld
      een test aanvraagt;

      c. de onderneming binnen twee weken na de uitnodiging, bedoeld in [9.1.7 onderdeel b][ref3], nog niet de in
      [9.1.5][ref4] bedoelde verklaring in het bezit heeft;

      d. de onderneming uit eigen beweging de verklaring, bedoeld in [9.1.5][ref5], inlevert bij de
      uitvoeringsorganisatie, bedoeld in [9.1.3][ref6];

      e. de verklaring, bedoeld in [9.1.5][ref7], vanuit beveiligingsoverwegingen wordt ingetrokken

      f. de toezichthouder daar een aanwijzing toe geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.7
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.5
      [ref5]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.5
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.3
      [ref7]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.5
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 9.1.3
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 9.1.7
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 9.1.5
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref5
        bwb_id: BWBR0037934
        artikel: 9.1.5
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref6
        bwb_id: BWBR0037934
        artikel: 9.1.3
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref7
        bwb_id: BWBR0037934
        artikel: 9.1.5
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.8
    text: |-
      Onverminderd het bepaalde in [artikel 9.1.1][ref1] stellen de gezamenlijke netbeheerders het elektronische
      berichtenverkeer, bedoeld in [9.1.2][ref2], open voor berichtenverkeer ten behoeve van gesloten distributiesystemen
      die voldoen aan de voorwaarden genoemd in [artikel 5.8 van de Netcode elektriciteit](onbekend). Daarbij stellen de
      gezamenlijke netbeheerders de beheerder van het desbetreffende gesloten distributiesysteem op de hoogte van de in
      artikel 9.1.2 bedoelde regels door toezending daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.1
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 9.1.2
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.9
    text: |-
      De gezamenlijke netbeheerders voeren de openstelling als bedoeld in [9.1.8][ref1] pas uit als de beheerder van
      het gesloten distributiesysteem een afschrift van de aan hem krachtens [artikel 15, tweede lid, van de Wet][ref2]
      verleende ontheffing heeft verstrekt aan de uitvoeringsorganisatie, bedoeld in [9.1.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.8
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.8
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 9.1.3
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.10
    text: |-
      Indien een ontheffing op grond van artikel 15, tweede lid, van de Wet vervalt, dan wel ingetrokken wordt, stellen
      de gezamenlijke netbeheerders daarop het elektronische berichtenverkeer niet langer open voor het desbetreffende
      gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.10
  - number: 9.1.11
    text: |-
      De ondernemingen als bedoeld in [9.1.1][ref1], stelt iedere netbeheerder, leverancier, programmaverantwoordelijke
      en meetverantwoordelijke op de hoogte van de in [9.1.2][ref2] bedoelde procedures, specificaties,
      berichtspecificaties en communicatieprotocollen door publicatie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.11
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.1
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 9.1.2
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1.12
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen is gehouden tot de uitvoering en
      instandhouding van beveiligingsprocedures en -maatregelen om berichten en de verbindingen met de centrale
      communicatiesystemen te beschermen tegen verlies en tegen ongeautoriseerde kennisneming, wijziging of vernietiging,
      alsmede om ongeautoriseerde toegang tot de centrale communicatiesystemen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.12
  - number: 9.1.13
    text: |-
      Indien beveiligingsprocedures of -maatregelen leiden tot de afwijzing van een bericht of een fout in het bericht
      aan het licht brengen, stelt de ontvanger de verzender hiervan in overeenstemming met de het daaromtrent bepaalde
      in de regels bedoeld in [9.1.2][ref1] op de hoogte. De ontvanger geeft aan het bericht geen gevolg totdat hij
      door de verzender is geïnstrueerd. Ingeval de verzender het bericht opnieuw verzendt, is daarbij ondubbelzinnig
      aangegeven dat het een gecorrigeerd bericht betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.2
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: 9.1a.1
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen heeft een autorisatiebeleid dat bepaalt dat
      alle dataverzoeken en mutatieverzoeken, van de betreffende marktpartij in de centrale communicatiesystemen, tot de
      persoon herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1a.1
  - number: 9.1a.2
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen, draagt er zorg voor dat het gebruik van de
      centrale communicatiesystemen door een door hem ingeschakelde derde altijd verloopt via een door die onderneming
      gecontroleerd communicatiesysteem.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1a.2
  - number: 9.1a.3
    text: |-
      De onderneming die gebruik maakt van de centrale communicatiesystemen, beschikt over een procedure die de
      omgang met beveiligingsincidenten beschrijft en meldt beveiligingsincidenten met betrekking tot de centrale
      communicatiesystemen onverwijld aan de gezamenlijke netbeheerders.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1a.3
  - number: 9.1a.4
    text: |-
      Een onderneming die toegang heeft tot de centrale communicatiesystemen dient te waarborgen dat een door hem
      ingeschakelde derde voldoet aan de verplichtingen bedoeld in [9.1.12][ref1] en [9.1a.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1.12
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel9.1a.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.1a.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 9.1.12
        hoofdstuk: '9'
        paragraaf: '9.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 9.1a.1
        hoofdstuk: '9'
        paragraaf: 9.1a
  - number: 9.2.1
    text: |-
      Registraties van berichten die overeenkomstig het bepaalde in deze code zijn verzonden, leveren, behoudens
      tegenbewijs, bewijs op van de in die berichten vervatte gegevens.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.2.1
  - number: 9.2.2
    text: |-
      In plaats van de termijn van één werkdag, genoemd in [hoofdstukken 2][ref1], [3][ref2] en [4][ref3], verzendt de
      netbeheerder gewoonlijk ook buiten werkdagen aan de betreffende leverancier(s), programmaverantwoordelijke(n) en
      meetverantwoordelijke(n) indien het centraal aansluitingenregister, bedoeld in [2.1.2][ref4], beschikbaar is en het
      mutatieproces storingsvrij volledig geautomatiseerd en zonder menselijke interventie kan worden afgerond

      a. het antwoord op een ontvangen melding van een mutatie uiterlijk de volgende kalenderdag na ontvangst van de
      melding; en

      b. de stamgegevens uiterlijk de volgende kalenderdag na effectuering van een mutatie in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 2.1.2
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 10.1.1.1
    text: |-
      De gegevens, bedoeld in [paragraaf 2.1][ref1], worden vastgelegd, uitgewisseld, gebruikt of bewaard voor het
      faciliteren van de marktprocessen voor de elektriciteitsmarkt en de gasmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 10.1.1.2
    text: |-
      De netbeheerder, de leverancier, de programmaverantwoordelijke en de meetverantwoordelijke bewaren de gegevens uit
      het aansluitingenregister van de aansluitingen waarvoor zij verantwoordelijk zijn gedurende ten hoogste acht jaar
      nadat de gegevens hun geldigheid hebben verloren.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.2
  - number: 10.1.1.3
    text: |-
      Een aangeslotene of op grond van een machtiging van de aangeslotene een leverancier, een programmaverantwoordelijke
      of een meetverantwoordelijke heeft het recht om het aansluitingenregister in te zien voor zijn aansluitingen.
      Na ontvangst van gegevens uit het aansluitingenregister heeft elk van de genoemde partijen de plicht hem
      betreffende onjuistheden in het aansluitingenregister, binnen vijf werkdagen na ontvangst van de gegevens uit het
      aansluitingenregister te melden voor correctie.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.3
  - number: 10.1.1.4
    text: |-
      Correctie van gegevens uit het aansluitingenregister worden doorgevoerd overeenkomstig de processen, bedoeld in
      [paragrafen 3.1 tot en met 3.5][ref1] en [3.12][ref2] voor kleinverbruikaansluitingen of de processen, bedoeld in
      [paragrafen 4.1 tot en met 4.8][ref3] voor grootverbruikaansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
        paragraaf: '3.12'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 10.1.1.5
    text: |-
      Voor de onjuistheden, bedoeld in [10.1.1.3][ref1], die niet kunnen worden gecorrigeerd via de correctieprocessen,
      bedoeld in [10.1.1.4][ref2], controleert de netbeheerder de melding en corrigeert de onjuistheden uiterlijk twintig
      werkdagen na ontvangst van de melding in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.1.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10.1.1.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.1.1.3
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 10.1.1.4
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.1.6
    text: |-
      De direct aangeslotene, de leverancier en de programmaverantwoordelijke hebben het recht om het
      aansluitingenregister landelijk gastransport in te zien voor hen betreffende aansluitingen. Desgevraagd verstrekt
      de netbeheerder van het landelijk gastransportnet de voor hen relevante stamgegevens als bedoeld in [2.13.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.13.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.13.1
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 10.1.1.7
    text: |-
      De direct aangeslotene, de leverancier en de programmaverantwoordelijke hebben het recht om onjuistheden in
      het aansluitingenregister landelijk gastransportnet met betrekking tot hen betreffende aansluitingen te doen
      corrigeren. Indien de direct aangeslotene of de programmaverantwoordelijke verzoekt de gegevens te wijzigen,
      stemt de netbeheerder van het landelijk gastransportnet dit af met de betrokken leverancier. Indien de leverancier
      akkoord is met de voorgestelde wijziging, stuurt deze de wijziging in door middel van een daartoe bestemd switch
      mutatieformulier. Vervolgens effectueert de netbeheerder van het landelijk gastransportnet deze wijziging in het
      aansluitingenregister landelijk gastransportnet overeenkomstig [2.13.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.13.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.13.1
        hoofdstuk: '2'
        paragraaf: '2.13'
  - number: 10.1.2.1
    text: |-
      De gegevens bedoeld in [paragraaf 2.3][ref1] worden vastgelegd, uitgewisseld, gebruikt of bewaard ten behoeve van
      de marktprocessen voor de elektriciteitsmarkt en gasmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 10.1.2.2
    text: |-
      De netbeheerder bewaart de gegevens in het EAN-codeboek van de aansluitingen waarvoor hij verantwoordelijk is ten
      hoogste tot het moment, waarop de gegevens opnieuw beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.2.2
  - number: 10.1.2.3
    text: De opvragende partij bewaart de gegevens die hij uit het EAN-codeboek heeft ontvangen ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.2.3
  - number: 10.1.3.1
    text: |-
      De contracteindegegevens, bedoeld in [paragraaf 2.5][ref1], worden vastgelegd, uitgewisseld, gebruikt of bewaard
      voor de uitvoering van processen, bedoeld in [hoofdstuk 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '3'
  - number: 10.1.3.2
    text: |-
      De leveranciers bewaren de door hen beschikbaar gestelde contracteindegegevens ten hoogste zeven jaar nadat de
      gegevens hun geldigheid hebben verloren.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.3.2
  - number: 10.1.3.3
    text: De leveranciers bewaren ontvangen contracteindegegevens ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.3.3
  - number: 10.1.3.4
    text: |-
      Een aangeslotene heeft het recht om de contracteindegegevens, die zijn eigen aansluiting betreffen, op te vragen
      bij zijn leverancier. De aangeslotene heeft het recht hem betreffende onjuistheden in de contracteindegegevens te
      melden aan zijn leverancier en te doen corrigeren.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.3.4
  - number: 10.1.4.1
    text: |-
      De gegevens in het toegankelijk meetregister, bedoeld in [paragraaf 2.6][ref1], worden vastgelegd, uitgewisseld,
      gebruikt of bewaard voor de uitvoering van processen, genoemd in [hoofdstuk 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '5'
  - number: 10.1.4.2
    text: |-
      De regionale netbeheerders bewaren de door hen beschikbaar gestelde gegevens uit het toegankelijk meetregister van
      alle kleinverbruikaansluitingen ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4.2
  - number: 10.1.4.3
    text: Leveranciers bewaren de door hen opgevraagde gegevens uit het toegankelijk meetregister ten hoogste 3 maanden.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4.3
  - number: 10.1.4a.1
    text: |-
      De klantsleutel als bedoeld in [2.14.1][ref1] wordt vastgelegd, uitgewisseld of bewaard voor de uitvoering van de
      processen bedoeld in [paragrafen 2.2b][ref2] en [2.5a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.14.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.14.1
        hoofdstuk: '2'
        paragraaf: '2.14'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 10.1.4a.2
    text: |-
      De regionale netbeheerders bewaren de klantsleutel als bedoeld in [2.14.1][ref1] totdat zij deze moeten verwijderen
      op grond van [2.14.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.14.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.14.6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4a.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.14.1
        hoofdstuk: '2'
        paragraaf: '2.14'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.14.6
        hoofdstuk: '2'
        paragraaf: '2.14'
  - number: 10.1.4a.3
    text: |-
      De leverancier bewaart de door hem op grond van [2.2b.1][ref1] of [2.5a.1][ref2] verkregen klantsleutel niet langer
      dan voor het doen van een aanbod nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5a.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4a.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.1
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5a.1
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 10.1.4b.1
    text: |-
      De toestemmingen als bedoeld in [2.15.1][ref1] worden vastgelegd, uitgewisseld of bewaard voor de uitvoering van de
      processen bedoeld in [paragraaf 2.2b][ref2] en [2.5a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.15.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4b.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.15.1
        hoofdstuk: '2'
        paragraaf: '2.15'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 10.1.4b.2
    text: De leverancier bewaart de door hem vastgelegde toestemmingsgegevens één jaar.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4b.2
  - number: 10.1.4b.3
    text: |-
      In afwijking van [10.1.4b.2][ref1] bewaart de leverancier de vastgelegde toestemmingsgegevens zo lang als
      noodzakelijk is ten behoeve van aanhangige geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.1.4b.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4b.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.1.4b.2
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.4b.4
    text: |-
      De regionale netbeheerder bewaart de door hem op grond van [2.2b.1][ref1] of [2.5a.1][ref2] ontvangen
      toestemmingssleutel ten hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5a.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4b.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.1
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5a.1
        hoofdstuk: '2'
        paragraaf: 2.5a
  - number: 10.1.4b.5
    text: |-
      De regionale netbeheerder bewaart de door hem op grond van [2.15.4][ref1] ontvangen toestemmingsgegevens ten
      hoogste één maand.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.15.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4b.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.15.4
        hoofdstuk: '2'
        paragraaf: '2.15'
  - number: 10.1.4b.6
    text: |-
      In afwijking van [10.1.4b.5][ref1] bewaart de regionale netbeheerder de ontvangen toestemmingsgegevens zo lang als
      noodzakelijk is ten behoeve van aanhangige geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.1.4b.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.4b.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.1.4b.5
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.5.1
    text: |-
      Een onderneming, als bedoeld in [artikel 54 van de Elektriciteitswet 1998][ref1] en
      [artikel 22 van de Gaswet][ref2], die de gegevens genoemd in deze code voor een ander doel dan genoemd in
      [paragraaf 10.1][ref3] vastlegt, uitwisselt, gebruikt of bewaart legt hiervoor het doel en de bewaartermijnen vast
      in een gedragscode of vraagt hiervoor ondubbelzinnige toestemming van de betrokkene als bedoeld in de Algemene
      verordening gegevensbescherming, tenzij in [10.1.5][ref4] uitdrukkelijk anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk10
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '10'
        paragraaf: '10.1'
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '10'
        paragraaf: '10.1'
  - number: 10.1.5.2
    text: |-
      De leverancier bewaart de hem op grond van [2.2b.4][ref1] verstrekte gegevens ten hoogste drie maanden voor het
      doen van een aanbod voor een leveringsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.1.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.4
        hoofdstuk: '2'
        paragraaf: 2.2b
  - number: 10.2.1
    text: |-
      Netbeheerders stellen een gedragscode op ten aanzien van gebruik, vastleggen, uitwisselen en bewaren van gegevens
      die zijn verkregen uit een meetinrichting bedoeld in [artikel 95la van de Elektriciteitswet van 1998][ref1] of
      [42a van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.2.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95la
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 42a
  - number: 10.2.2
    text: |-
      De gedragscode, bedoeld in [10.2.1][ref1], bevat tenminste de onderwerpen waarover de netbeheerders verantwoording
      afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.2.1
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.2.3
    text: |-
      Netbeheerders melden de gedragscode, bedoeld in [10.2.1][ref1], in overeenstemming met de Algemene verordening
      gegevensbescherming aan bij het Autoriteit persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.2.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.2.1
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.2.4
    text: |-
      Netbeheerders leggen jaarlijks verantwoording af door middel van een uniforme toelichting op de jaarrekening,
      bedoeld in [B6.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 10.2.5
    text: |-
      In aanvulling op [10.2.4][ref1] publiceren de netbeheerders de verantwoording, bedoeld in [10.2.2][ref2], op hun
      publieke websites.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.2.4
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 10.2.2
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: 10.3.1
    text: |-
      Leveranciers stellen een gedragscode op ten aanzien van gebruik, vastleggen, uitwisselen en bewaren van gegevens
      die zijn verkregen uit een meetinrichting bedoeld in [artikel 95la van de Elektriciteitswet van 1998][ref1] of
      [42a van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.3.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95la
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 42a
  - number: 10.3.2
    text: |-
      De gedragscode, bedoeld in [10.3.1][ref1], bevat tenminste:

      a. de wijze waarop kleinverbruikers de leverancier machtigen voor het opvragen van meer gegevens
      dan is toegestaan op grond van [artikel 26ab eerste lid van de Elektriciteitswet 1998][ref2] of
      [artikel 13b eerste lid van de Gaswet][ref3].

      b. de onderwerpen waarover de leveranciers verantwoording afleggen, zijnde:

      1° meetgegevens ten behoeve van facturatie en de mutatieprocessen, bedoeld in deze code;

      2° meetgegevens ten behoeve van de verbruiksterugkoppeling, besparingsadviezen en overige doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel26ab
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel13b
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.3.1
        hoofdstuk: '10'
        paragraaf: '10.3'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 26ab
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 13b
  - number: 10.3.3
    text: |-
      Leveranciers melden de gedragscode, bedoeld in [10.3.1][ref1], in overeenstemming met de Algemene verordening
      gegevensbescherming aan bij het Autoriteit persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.3.1
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: 10.3.4
    text: |-
      De leverancier legt jaarlijks verantwoording, bedoeld in [10.3.2 onderdeel b][ref1], af door middel van een
      toelichting op de jaarrekening, bedoeld in [B6.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 10.3.2
        hoofdstuk: '10'
        paragraaf: '10.3'
      - id: ref2
        bwb_id: BWBR0037934
  - number: 10.3.5
    text: |-
      In aanvulling op [10.3.4][ref1] publiceert de leverancier de verantwoording, bedoeld in [10.3.2 onderdeel b][ref2],
      op zijn publieke website.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel10.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel10.3.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel10.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
