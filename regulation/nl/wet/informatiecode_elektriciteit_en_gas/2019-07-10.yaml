        artikel: 4.2.3.1
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.4.1
    text: |-
      Het collecteren, vaststellen en distribueren van de meterstand en verbruik bij het uithuizingsproces wordt
      overeenkomstig [hoofdstuk 6][ref1] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 4.3.1.1
    text: |-
      De aangeslotene machtigt zijn actuele dan wel de nieuwe leverancier, in het inhuizingsproces hierna te noemen
      de nieuwe leverancier, om namens hem de inhuizing af te wikkelen. Op grond van deze machtiging stuurt de
      nieuwe leverancier tenminste vijf werkdagen voor de inhuizingsdatum en ten hoogste twintig werkdagen voor de
      inhuizingsdatum namens deze aangeslotene een inhuizingsmelding naar de netbeheerder. De inhuizingsmelding bevat de
      volgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de naam van de nieuwe aangeslotene;

      c. de adresgegevens van de aansluiting;

      d. de inhuizingsdatum;

      e. de bedrijfs-EAN-code van de netbeheerder;

      f. de bedrijfs-EAN-code van de nieuwe leverancier;

      g. de bedrijfs-EAN-code van de programmaverantwoordelijke;

      h. in geval van een elektriciteitsaansluiting, of er sprake is van een aansluiting met verblijfsfunctie of
      complexbepaling;

      i. indien de nieuwe leverancier dat wenst op te geven: het referentienummer van de nieuwe leverancier;

      j. indien de leverancier hierover beschikt: de geboortedatum van de aangeslotene;

      k. indien de leverancier hierover beschikt: het KvK-nummer van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.1.1
  - number: 4.3.1.2
    text: |-
      In afwijking van [4.3.1.1][ref1] stuurt de nieuwe leverancier de inhuizingsmelding tenminste op de inhuizingsdatum
      en ten hoogste twintig werkdagen voor de inhuizingsdatum naar de netbeheerder indien het een inhuizingsmelding
      betreft voor een aansluiting, waarop op het moment van inhuizen geen leverancier is geregistreerd in het
      aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.1.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.3.1.1
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.1
    text: |-
      Naar aanleiding van de inhuizingsmelding controleert de netbeheerder of:

      a. de inhuizingsmelding volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voor komt in het aansluitingenregister;

      c. de inhuizingsdatum ten opzichte van de datum van indienen tenminste vijf werkdagen en ten hoogste twintig
      werkdagen in de toekomst ligt;

      d. of de inhuizingdatum ten opzichte van de datum van indienen tenminste op dezelfde datum en ten hoogste twintig
      werkdagen in de toekomst ligt, indien op de desbetreffende aansluiting op het moment van inhuizen geen leverancier
      is geregistreerd in het aansluitingenregister;

      e. de nieuwe leverancier is opgenomen in het leveranciersregister;

      f. de opgegeven programmaverantwoordelijke een volledige erkenning heeft volgens het
      programmaverantwoordelijkenregister;

      g. er geen eerder bevestigde, doch nog niet geëffectueerde leverancierswitchmelding of inhuizingsmelding is voor
      dezelfde EAN-code;

      h. de aansluiting niet geblokkeerd is voor automatische mutaties.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.1
  - number: 4.3.2.2
    text: |-
      Als alle controles uit [4.3.2.1][ref1] een positief resultaat geven, wordt de procedure vervolgd vanaf
      [4.3.2.4][ref2]. Als dat niet het geval is, wordt de inhuizing niet uitgevoerd en wordt de procedure na
      [4.3.2.3][ref3] beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.2.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 4.3.2.1
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 4.3.2.4
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 4.3.2.3
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.3
    text: |-
      De netbeheerder bericht het niet uitvoeren van de inhuizing naar aanleiding van [4.3.2.2][ref1] uiterlijk de
      werkdag na ontvangst van de inhuizingsmelding aan de leverancier die de inhuizingsmelding heeft ingediend en
      vermeldt daarbij:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de netbeheerder;

      c. de bedrijfs-EAN-code van de nieuwe leverancier;

      d. de inhuizingsdatum;

      e. de reden van het niet uitvoeren van de inhuizing:

      1° de inhuizingsmelding is onvolledig of syntactisch onjuist;

      2° de EAN-code van de aansluiting is onbekend;

      3° de inhuizingsdatum voldoet niet aan de gestelde indientermijn;

      4° de nieuwe leverancier komt niet voor in het leveranciersregister;

      5° de programmaverantwoordelijke komt niet voor in het programmaverantwoordelijkenregister;

      6° de inhuizingsmelding conflicteert met een eerder bevestigde, maar nog niet geëffectueerde inhuizingsmelding
      of leverancierswitchmelding;

      7° de aansluiting is geblokkeerd voor automatische mutaties;

      f. indien aangeleverd in de inhuizingsmelding: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel4.3.2.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.3.2.3
    references:
      - id: ref1
