  - number: 2.7.8
    text: |-
      Een regionale netbeheerder kan de geldigheid van zijn gegevens in het netbeheerdersregister laten beëindigen onder
      voorwaarde dat:

      a. er in het aansluitingenregister geen actieve aansluitingen zijn opgenomen met verwijzingen naar de bedrijfs-EAN-
      code van de betreffende netbeheerder, en;

      b. er geen verplichtingen op gebied van facturering en afdracht, als bedoeld in [paragraaf 8.2][ref1], meer bestaan
      tussen de netbeheerder en enig leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.7.8
    references:
