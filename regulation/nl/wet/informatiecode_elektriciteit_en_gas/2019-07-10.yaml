        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 2.8.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en beheer van een register, hierna
      te noemen het leveranciersregister.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.8.1
  - number: 2.8.2
    text: |-
      De leveranciers stellen in het leveranciersregister, bedoeld in [2.8.1][ref1], aan de netbeheerders,
      programmaverantwoordelijken en meetverantwoordelijken, voor zover van toepassing voor elektriciteit en gas
      afzonderlijk per bedrijfs-EAN-code, de volgende gegevens online beschikbaar:

      a. de bedrijfs-EAN-code waarmee de leverancier zich in het berichtenverkeer identificeert;

      b. de datum van dagtekening;

      c. de bedrijfsnaam;

      d. de handelsna(a)men;

      e. aan welke categorie(ën) de leverancier levert of wil gaan leveren, onderscheiden naar kleinverbruikers
      waarvoor een leveringsvergunning vereist is, kleinverbruikers waarvoor geen leveringsvergunning vereist is en
      grootverbruikers;

      f. de adresgegevens;

      g. het bankrekeningnummer;

      h. het BTW-nummer;

      i. het inschrijfnummer bij de Kamer van Koophandel;

      j. voor zover er sprake is van levering aan kleinverbruikers waarvoor een leveringsvergunning vereist is: het
      nummer van het Besluit op grond waarvan de Autoriteit Consument en Markt hem voor het betreffende product een
      leveringsvergunning voor kleinverbruikers heeft verstrekt;

      k. de gegevens van de contactpersonen;

      l. indien de bedrijfs-EAN-code eerder gebruikt is door een andere leverancier, een verklaring met ingang van
      welke datum de leverancier met instemming van de oude leverancier, alle rechten en plichten ter zake overneemt
      respectievelijk heeft overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.8.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.8.2
