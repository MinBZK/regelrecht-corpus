        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.3.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de nieuwe leverancier aangeleverde gegevens
      overeenkomstig [2.1.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.1.3.1
