  - number: 4.4.4.1
    text: |-
      De netbeheerder muteert het aansluitingenregister met de door de leverancier aangeleverde gegevens overeenkomstig
      [2.1.8][ref1], tenzij een later ingediende leverancierswitchmelding, inhuizingsmelding of uithuizingsmelding is
      ontvangen voor een eerdere of dezelfde mutatiedatum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.8
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.8
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.4.4.2
    text: |-
      De netbeheerder informeert de meetverantwoordelijke overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties,
      bedoeld in [4.4.4.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.4.4.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.4.4.2
