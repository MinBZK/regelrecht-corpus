  - number: 2.1.8
    text: |-
      De netbeheerder effectueert wijzigingen in het aansluitingenregister op de mutatiedatum op tijdstip 00:00 uur (in
      geval van elektriciteit) en op tijdstip 06:00 uur (in geval van gas). Een leverancier, programmaverantwoordelijke
      en meetverantwoordelijke die voor een bepaalde dag is vermeld in het aansluitingenregister voldoet vanaf deze
      volledige dag aan de voorwaarden die aan de betreffende marktpartij worden gesteld.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.8
  - number: 2.1.9
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet en de netbeheerder van het landelijk gastransportnet hebben
      het recht de voor hen relevante onderdelen van de door de andere netbeheerders beheerde aansluitingenregisters
      in te zien. Zij kunnen de andere netbeheerders verzoeken hen gegevens met betrekking tot een individuele
      programmaverantwoordelijke met een volledige erkenning te verstrekken.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.9
  - number: 2.1.10
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet verleent de andere netbeheerders desgevraagd inzage in het
      meetverantwoordelijkenregister, bedoeld in [B4.2.2 van de Meetcode elektriciteit][ref1] en [B3.2.2 van de Meetcode
      gas RNB](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: 2.1.11
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet respectievelijk de beheerder van het landelijk gastransportnet
      verlenen de andere netbeheerders desgevraagd inzage in het programmaverantwoordelijkenregister, bedoeld in
      [artikel 10.3 van de Netcode elektriciteit][ref1] en [paragraaf 3.2 van de Transportcode gas LNB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.3
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.11
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '10.3'
      - id: ref2
        bwb_id: BWBR0037950
        paragraaf: '3.2'
  - number: 2.1.12
    text: |-
      Het is een leverancier uitsluitend toegestaan gegevens uit het aansluitingenregister op te vragen ten behoeve van

      a. identificatie van de aansluiting, zoals vastgelegd in [paragraaf 2.2a][ref1];

      b. het doen van een aanbod voor levering, zoals vastgelegd in [paragraaf 2.2b][ref2];

      c. voorbereiding van levering, zoals vastgelegd in [paragraaf 2.2c][ref3];

      d. levering, zoals vastgelegd in [paragraaf 2.2d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2a
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2b
      - id: ref3
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2c
      - id: ref4
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2d
  - number: 2.1.13
    text: |-
      Het is een programmaverantwoordelijke en een meetverantwoordelijke uitsluitend toegestaan gegevens uit het
      aansluitingenregister op te vragen voor de situatie zoals vastgelegd in [paragraaf 2.2d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.13
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '2'
        paragraaf: 2.2d
  - number: 2.2.1
    text: |-
      De netbeheerder verzendt uiterlijk de werkdag volgend op de dag dat één of meerdere gegevens in het
      aansluitingenregister zijn gewijzigd de stamgegevens van de desbetreffende aansluiting aan de actuele leverancier
      op de aansluiting en vermeldt daarbij:

      a. de reden van verzending van de stamgegevens, te weten: "wijziging stamgegevens";

      b. de aanduiding van het desbetreffende mutatieproces, indien het betreft:

      (i) een leverancierswitch, een inhuizing, of een switch van programmaverantwoordelijke;

      (ii) een meterwissel, of

      (iii) een verzoek tot wijziging van de allocatiemethode;

      c. de datum waarop het aansluitingenregister door de netbeheerder is gemuteerd;

      d. de gegevens bedoeld in [B7.1][ref1];

      e. het referentienummer van de leverancier in het geval dat de stamgegevens worden verzonden bij een mutatieproces,
      waarbij de leverancier een referentienummer heeft opgegeven in de betreffende melding.


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 2.2.2
    text: |-
      De netbeheerder verzendt uiterlijk de werkdag volgend op de dag dat één of meerdere gegevens in het
      aansluitingenregister zijn gewijzigd, de gegevens van de desbetreffende aansluiting aan de actuele
      programmaverantwoordelijke op de aansluiting en vermeldt daarbij:

      a. de reden van verzending van de gegevens, te weten: "wijziging gegevens van de aansluiting";

      b. de aanduiding van het desbetreffende mutatieproces, indien het betreft:

      (i) een leveranciersswitch, een inhuizing, of een switch van programmaverantwoordelijke, of

      (ii) een verzoek tot wijziging van de allocatiemethode;

      c. de datum waarop het aansluitingenregister door de netbeheerder is gemuteerd;

      d. de gegevens bedoeld in [B7.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 2.2.3
    text: |-
      De netbeheerder verzendt uiterlijk de werkdag volgend op de dag dat één of meerdere gegevens in het
      aansluitingenregister zijn gewijzigd, de gegevens van de desbetreffende aansluiting aan de actuele
      meetverantwoordelijke op de aansluiting en vermeldt daarbij:

      a. de reden van verzending van de gegevens, te weten: "wijziging gegevens van de aansluiting";

      b. de aanduiding van het desbetreffende mutatieproces:

      (i) een leveranciersswitch, een inhuizing, een uithuizing, een eindelevering, een switch van
      programmaverantwoordelijke, een switch van meetverantwoordelijke, of een wisseling of een wijziging van de
      meetinrichting, of

      (ii) een verzoek tot wijziging van de allocatiemethode;

      c. de datum waarop het aansluitingenregister door de netbeheerder is gemuteerd;

      d. de gegevens bedoeld in [B7.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
  - number: 2.2.6
    text: |-
      In afwijking van [2.2.1][ref1], [2.2.2][ref2] en [2.2.3][ref3] verzendt de netbeheerder geen stamgegevens indien
      als gevolg van het proces 3.12 uitsluitend de gegevens, genoemd in [2.1.3, onderdeel a][ref4], wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2.3
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.2.2
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0037934
        artikel: 2.2.3
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.2a.1
    text: |-
      Een leverancier kan ten behoeve van de identificatie van de aansluiting gegevens van de desbetreffende aansluiting
      opvragen bij de netbeheerder onder vermelding van:

      a. (i) de EAN-code van de aansluiting, of

      (ii) de adresgegevens van de aansluiting;

      b. indien de opvragende leverancier dat wenst op te geven, een of meer van de volgende gegevens:

      (i) de productsoort,

      (ii) het verbruikssegment,

      (iii) een referentienummer van de opvragende leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2a.1
  - number: 2.2a.2
    text: |-
      Naar aanleiding van een opvraag zoals bedoeld in [2.2a.1][ref1] controleert de netbeheerder of de opvraag volledig
      en syntactisch correct is.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2a.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2a.1
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 2.2a.3
    text: |-
      Indien de in [2.2a.2][ref1] bedoelde controle één of meer negatieve resultaten oplevert, verstrekt de netbeheerder
      de opgevraagde gegevens niet en stuurt hij de leverancier onverwijld een bericht onder vermelding van de reden van
      afwijzing: de opvraag is niet volledig of syntactisch onjuist.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2a.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2a.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2a.2
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 2.2a.4
    text: |-
      Tenzij [2.2a.3][ref1] van toepassing is, stuurt de netbeheerder een bericht naar de leverancier en verstrekt
      daarbij, naar aanleiding van de in [2.2a.1][ref2] bedoelde opvraag, de gegevens als bedoeld in [B7.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2a.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2a.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2a.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2a.3
        hoofdstuk: '2'
        paragraaf: 2.2a
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.2a.1
        hoofdstuk: '2'
        paragraaf: 2.2a
      - id: ref3
        bwb_id: BWBR0037934
  - number: 2.2a.5
    text: |-
      De netbeheerder verstuurt de in [2.2a.4][ref1] bedoelde gegevens, die betrekking hebben op de dag voorafgaand aan
      de dag van ontvangst van de opvraag, zo snel mogelijk doch uiterlijk de werkdag na ontvangst van de opvraag aan de
      opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2a.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2a.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2a.4
        hoofdstuk: '2'
        paragraaf: 2.2a
  - number: 2.2b.1
    text: |-
      Een leverancier die beschikt over een toestemming van de afnemer kan, ten behoeve van het doen van een aanbod voor
      een leveringsovereenkomst, bij de netbeheerder gegevens van de desbetreffende kleinverbruikaansluiting opvragen
      onder vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. indien de opvragende leverancier dat wenst op te geven: een referentienummer van de opvragende leverancier;

      d. de toestemmingssleutel;

      e. de klantsleutel.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2b.1
  - number: 2.2b.2
    text: |-
      Naar aanleiding van een opvraag zoals bedoeld in [2.2b.1][ref1] controleert de netbeheerder of:

      a. de opvraag volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voorkomt in het aansluitingenregister;

      c. de aansluiting een kleinverbruikaansluiting is;

      d. de bedrijfs-EAN-code van de leverancier voorkomt in het leveranciersregister;

      e. de klantsleutel overeenkomt met de klantsleutel in de klantsleuteladministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2b.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.1
        hoofdstuk: '2'
        paragraaf: 2.2b
  - number: 2.2b.3
    text: |-
      Indien de in [2.2b.2][ref1] bedoelde controle één of meer negatieve resultaten oplevert, verstrekt de regionale
      netbeheerder de opgevraagde gegevens niet en stuurt hij de leverancier onverwijld een bericht onder vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de in de opvraag opgegeven EAN-code van de aansluiting;

      c. de reden van afwijzing:

      1. de opvraag is niet volledig of syntactisch onjuist;

      2. de EAN-code van de aansluiting komt niet voor in het aansluitingenregister;

      3. de EAN-code aansluiting betreft geen kleinverbruikaansluiting;

      4. de bedrijfs-EAN-code van de opvragende leverancier komt niet voor in het leveranciersregister;

      5. de klantsleutel komt niet overeen met de klantsleutel zoals bekend in de klantsleuteladministratie;

      6. er is voor deze aansluiting geen klantsleutel aanwezig in de klantsleuteladministratie;

      d. indien aangeleverd in de opvraag: het referentienummer van de opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2b.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.2
        hoofdstuk: '2'
        paragraaf: 2.2b
  - number: 2.2b.5
    text: |-
      De netbeheerder verstuurt de in [2.2b.4][ref1] bedoelde gegevens, die betrekking hebben op de dag voorafgaand aan
      de dag van ontvangst van de opvraag, zo snel mogelijk doch uiterlijk de werkdag na ontvangst van de opvraag aan de
      opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2b.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2b.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2b.4
        hoofdstuk: '2'
        paragraaf: 2.2b
  - number: 2.2c.1
    text: |-
      Een leverancier die beschikt over een leveringsovereenkomst, maar nog niet de actuele leverancier is op de
      desbetreffende kleinverbruikaansluiting, en

      (i) wiens leveringsovereenkomst voor de desbetreffende kleinverbruiker is geregistreerd in het
      contracteindegegevensregister, of

      (ii) wiens melding als bedoeld in [2.5.5][ref1] voor de desbetreffende kleinverbruiker is geregistreerd in het
      contracteindegegevensregister,

      kan bij de netbeheerder gegevens horend bij de desbetreffende kleinverbruikaansluiting opvragen onder vermelding
      van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de EAN-code van de aansluiting;

      c. indien de leverancier dat wenst op te geven: een referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2c.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.2c.2
    text: |-
      Naar aanleiding van een opvraag zoals bedoeld in [2.2c.1][ref1] controleert de netbeheerder of:

      a. de opvraag volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voorkomt in het aansluitingenregister;

      c. de aansluiting een kleinverbruikaansluiting is;

      d. de bedrijfs-EAN-code van de leverancier voorkomt in het leveranciersregister;

      e. er in het contracteindegegevensregister een leveringsovereenkomst of een melding als bedoeld in [2.5.5][ref2]
      voor deze aansluiting is geregistreerd ten name van de opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2c.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2c.1
        hoofdstuk: '2'
        paragraaf: 2.2c
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.2c.3
    text: |-
      Indien de in [2.2c.2][ref1] bedoelde controle één of meer negatieve resultaten oplevert, verstrekt de regionale
      netbeheerder de opgevraagde gegevens niet en stuurt hij de leverancier onverwijld een bericht onder vermelding van:

      a. de bedrijfs-EAN-code van de opvragende leverancier;

      b. de in de opvraag opgegeven EAN-code van de aansluiting;

      c. de reden van afwijzing:

      1. de opvraag is niet volledig of syntactisch onjuist;

      2. de EAN-code van de aansluiting komt niet voor in het aansluitingenregister;

      3. de EAN-code aansluiting betreft geen kleinverbruikaansluiting;

      4. de bedrijfs-EAN-code van de opvragende leverancier komt niet voor in het leveranciersregister;

      5. in het contracteindegegevensregister is voor deze aansluiting geen leveringsovereenkomst of een melding als
      bedoeld in [2.5.5][ref2] geregistreerd ten name van de opvragende leverancier;

      d. indien aangeleverd in de opvraag: het referentienummer van de opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2c.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2c.2
        hoofdstuk: '2'
        paragraaf: 2.2c
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.2c.4
    text: |-
      Tenzij [2.2c.3][ref1] van toepassing is, stuurt de regionale netbeheerder een bericht naar de leverancier
      en verstrekt daarbij, naar aanleiding van de in [2.2c.1][ref2] bedoelde opvraag, de gegevens als bedoeld in
      [B7.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2c.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2c.3
        hoofdstuk: '2'
        paragraaf: 2.2c
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.2c.1
        hoofdstuk: '2'
        paragraaf: 2.2c
      - id: ref3
        bwb_id: BWBR0037934
  - number: 2.2c.5
    text: |-
      De netbeheerder verstuurt de in [2.2c.4][ref1] bedoelde gegevens, die betrekking hebben op de dag voorafgaand aan
      de dag van ontvangst van de opvraag, zo snel mogelijk doch uiterlijk de werkdag na ontvangst van de opvraag aan de
      opvragende leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2c.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2c.4
        hoofdstuk: '2'
        paragraaf: 2.2c
  - number: 2.2d.1
    text: |-
      De actuele leverancier, de actuele programmaverantwoordelijke dan wel, indien het een grootverbruikaansluiting
      betreft, de actuele meetverantwoordelijke behorende bij de desbetreffende aansluiting, of een leverancier,
      programmaverantwoordelijke of meetverantwoordelijke die beschikt over een machtiging van de aangeslotene om
      eenmalig de gegevens van de aansluiting op te vragen voor een grootverbruikaansluiting, kan bij de netbeheerder de
      gegevens van de desbetreffende aansluiting opvragen onder vermelding van:

      a. de bedrijfs-EAN-code van de opvragende partij;

      b. de EAN-code van de aansluiting;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. indien de opvragende partij dat wenst op te geven: een referentienummer van de opvragende partij.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2d.1
  - number: 2.2d.2
    text: |-
      Naar aanleiding van een opvraag zoals bedoeld in [2.2d.1][ref1] controleert de netbeheerder of:

      a. de opvraag volledig en syntactisch correct is;

      b. de EAN-code van de aansluiting voorkomt in het aansluitingenregister;

      c. indien het een kleinverbruikaansluiting betreft, de opvragende partij de actuele leverancier dan wel actuele
      programmaverantwoordelijke behorende bij de desbetreffende aansluiting is;

      d. de bedrijfs-EAN-code van de opvragende leverancier voorkomt in het leveranciersregister dan wel de opvragende
      programmaverantwoordelijke een volledige erkenning heeft volgens het programmaverantwoordelijkenregister
      dan wel de opvragende meetverantwoordelijke beschikt over een erkenning als bedoeld in
      [bijlage 4.2 van de Meetcode elektriciteit][ref2] of [bijlage 3.2 van de Meetcode gas RNB](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2d.1
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2d.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2d.1
        hoofdstuk: '2'
        paragraaf: 2.2d
      - id: ref2
        bwb_id: BWBR0037946
  - number: 2.2d.3
    text: |-
      Indien de in [2.2d.2][ref1] bedoelde controle één of meer negatieve resultaten oplevert, verstrekt de regionale
      netbeheerder de opgevraagde gegevens niet en stuurt hij de opvragende partij onverwijld een bericht onder
      vermelding van:

      a. de bedrijfs-EAN-code van de opvragende partij;

      b. de in de opvraag opgegeven EAN-code van de aansluiting;

      c. de bedrijfs-EAN-code van de netbeheerder;

      d. de reden van afwijzing:

      1. de opvraag is niet volledig of syntactisch onjuist;

      2. de EAN-code van de aansluiting komt niet voor in het aansluitingenregister;

      3. de bedrijfs-EAN-code van de leverancier komt niet voor in het leveranciersregister, dan wel de opvragende
      programmaverantwoordelijke beschikt volgens het programmaverantwoordelijkenregister niet over een volledige
      erkenning, dan wel de opvragende meetverantwoordelijke beschikt niet over een erkenning;

      4. indien het een kleinverbruikaansluiting betreft: de opvragende partij is niet de actuele leverancier dan wel
      programmaverantwoordelijke behorende bij de desbetreffende aansluiting.

      e. indien aangeleverd in de opvraag: het referentienummer van de opvragende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2d.2
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2d.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2d.2
        hoofdstuk: '2'
        paragraaf: 2.2d
  - number: 2.2d.4
    text: |-
      Tenzij [2.2d.3][ref1] van toepassing is, stuurt de regionale netbeheerder een bericht naar de opvragende partij
      en verstrekt daarbij, naar aanleiding van de in [2.2d.1][ref2] bedoelde opvraag, de gegevens als bedoeld in
      [B7.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2d.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2d.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2d.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2d.3
        hoofdstuk: '2'
        paragraaf: 2.2d
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.2d.1
        hoofdstuk: '2'
        paragraaf: 2.2d
      - id: ref3
        bwb_id: BWBR0037934
  - number: 2.2d.5
    text: |-
      De netbeheerder verstuurt de in [2.2d.4][ref1] bedoelde gegevens, die betrekking hebben op de dag voorafgaand aan
      de dag van ontvangst van de opvraag, zo snel mogelijk doch uiterlijk de werkdag na ontvangst van de opvraag aan de
      opvragende leverancier, programmaverantwoordelijke of meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2d.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.2d.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.2d.4
        hoofdstuk: '2'
        paragraaf: 2.2d
  - number: 2.3.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een openbaar
      register, hierna te noemen het EAN-codeboek.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.3.1
  - number: 2.3.2
    text: |-
      De regionale netbeheerders stellen in het EAN-codeboek per aansluiting de volgende gegevens beschikbaar zoals
      bedoeld in [2.1.3, onderdelen b, d, e, u en w][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.4
    text: De regionale netbeheerders stellen het EAN-codeboek online beschikbaar.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.3.4
  - number: 2.4.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een register,
      hierna te noemen het CalGos-boek.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.4.1
  - number: 2.4.2
    text: |-
      De regionale netbeheerders stellen uiterlijk de achttiende werkdag van de maand per netgebied aan de leveranciers
      de maandgemiddelde calorische omrekenfactor van het naar dat netgebied getransporteerde gas van tenminste de maand
      voorafgaand aan de huidige maand online in het CalGos-boek, bedoeld in [2.4.1][ref1], beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.4.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.4.1
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.5.1
    text: |-
      De regionale netbeheerders zijn gezamenlijk verantwoordelijk voor de inrichting en het beheer van een register,
      hierna te noemen het contracteindegegevensregister. Dit contracteindegegevensregister is alleen van toepassing op
      aansluitingen die vallen onder de werking van:

      a. [artikel 95a van de Elektriciteitswet 1998][ref1];

      b. [artikel 43 van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 2.5.3
    text: |-
      De leverancier verstrekt tenminste eenmaal per vijf werkdagen, per actuele leveringsovereenkomst en per
      leveringsovereenkomst die in de toekomst start, de volgende contractgegevens aan de regionale netbeheerders voor
      registratie in het contracteindegegevensregister:

      a. de EAN-code van de aansluiting;

      b. de einddatum van de leveringsovereenkomst indien van toepassing;

      c. de opzegtermijn;

      d. de bedrijfs-EAN-code van de leverancier.
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.3
  - number: 2.5.4
    text: |-
      [Artikel 2.5.3][ref1] is niet van toepassing op aansluitingen waarvoor een beroep is gedaan op
      [artikel 95n van de Elektriciteitswet 1998][ref2] of op [artikel 52c van de Gaswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.3
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 95n
      - id: ref3
        bwb_id: BWBR0011440
        artikel: 52c
  - number: 2.5.5
    text: |-
      Onverminderd [2.5.3][ref1] en [2.5.4][ref2] kan de leverancier, onmiddellijk nadat hij met een kleinverbruiker een
      leveringsovereenkomst heeft afgesloten, hiervan een melding doen met de hiernavolgende gegevens:

      a. de EAN-code van de aansluiting;

      b. de bedrijfs-EAN-code van de leverancier;

      c. indien gewenst: het referentienummer van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.3
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.3
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.5.4
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.6
    text: |-
      De regionale netbeheerder registreert de in [2.5.4][ref1] bedoelde gegevens binnen een werkdag in het
      contracteindegegevensregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.4
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.4
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.7
    text: |-
      De regionale netbeheerder registreert de in [2.5.5, onderdelen a en b][ref1], bedoelde gegevens onmiddellijk in
      het contracteindegegevensregister en verwijdert deze één maand nadien uit het contracteindegegevensregister. De
      netbeheerder archiveert de verwijderde gegevens gedurende 1 jaar in verband met mogelijke klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.5.7
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.5.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.8
    text: |-
      De regionale netbeheerder kan, indien daar reden voor is, de door de leverancier vastgelegde contractgegevens,
      behorende bij een opvraging zoals bedoeld in [2.2c.1][ref1], [2.5a.1][ref2] of [2.5b.1][ref3] bij de leverancier
      opvragen onder vermelding van:

      a. de EAN-code van de aansluiting;

      b. de datum van de opvraag zoals bedoeld in[ 2.2c.1][ref4], [2.5a.1][ref5] of [2.5b.1][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5a.1
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.5b.1
      [ref4]: https://wetten.overheid.nl/BWBR0037934#Artikel2.2c.1
