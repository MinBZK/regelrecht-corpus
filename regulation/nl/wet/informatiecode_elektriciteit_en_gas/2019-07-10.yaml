        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.2.3.2
    text: |-
      De netbeheerder informeert de meetverantwoordelijke overeenkomstig [paragraaf 2.2][ref1] omtrent de mutaties,
      bedoeld in [4.2.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel4.2.3.1
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel4.2.3.2
