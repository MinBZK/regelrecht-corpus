  - number: 2.1.6
    text: |-
      De velden, bedoeld in [2.1.3 onderdeel f en g][ref1], kunnen door de netbeheerder alleen worden gemuteerd in
      opdracht van een leverancier op de door de leverancier aangegeven datum.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037934/2019-07-10#Artikel2.1.6
