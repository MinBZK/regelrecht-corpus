  - number: 1.1.6
    text: |-
      In deze code wordt met uitzondering van [hoofdstuk 3][ref1], [5][ref2] en [8][ref3], en [artikelen 2.1.2][ref4]
      en [9.1.1][ref5] onder regionale netbeheerder of netbeheerder tevens de beheerder van een gesloten
      distributiesysteem verstaan, indien deze beheerder van het gesloten distributiesysteem gebruik maakt van het
      elektronisch berichtenverkeer.


