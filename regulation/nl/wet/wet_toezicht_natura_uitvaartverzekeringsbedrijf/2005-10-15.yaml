        artikel: '54'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0007477
        artikel: '55'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0007477
        artikel: '56'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0007477
        artikel: '57'
        hoofdstuk: '6'
      - id: ref7
        bwb_id: BWBR0007477
        artikel: '59'
        hoofdstuk: '6'
      - id: ref8
        bwb_id: BWBR0007477
        artikel: '61'
        hoofdstuk: '7'
      - id: ref9
        bwb_id: BWBR0007477
        artikel: '84'
        hoofdstuk: '9'
      - id: ref10
        bwb_id: BWBR0007477
        artikel: 93a
        hoofdstuk: 10A
  - number: 93a.1
    text: |-
      Onze Minister is bevoegd aan de Pensioen- & Verzekeringskamer de gegevens of inlichtingen te vragen die naar
      zijn oordeel nodig zijn voor een onderzoek naar de toereikendheid van deze wet of de wijze waarop de Pensioen- &
      Verzekeringskamer deze wet uitvoert of heeft uitgevoerd, indien dat ter wille van het bedrijfseconomisch toezicht
      nodig blijkt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
  - number: 93a.2
    text: |-
      De Pensioen- & Verzekeringskamer is verplicht aan Onze Minister de in het eerste lid bedoelde gegevens of
      inlichtingen te verstrekken. Indien Onze Minister de Pensioen- & Verzekeringskamer vraagt bepaalde gegevens
      of inlichtingen te verstrekken die onder [artikel 87, eerste en tweede lid][ref1], vallen, is de Pensioen- &
      Verzekeringskamer niet verplicht deze gegevens of inlichtingen te verstrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel87
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '87'
        hoofdstuk: '9'
  - number: 93a.2.a
    text: |-
      deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke verzekeraar die in het bezit is van een vergunning als bedoeld in [artikel 11][ref1] of waarvan die
      vergunning is ingetrokken of vervallen, en ten aanzien waarvan overeenkomstig [artikel 66][ref2] de noodregeling
      is uitgesproken of die in staat van faillissement is verklaard of op grond van een rechterlijke uitspraak is
      ontbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: 93a.2.b
    text: |-
      deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      verzekeraar in staat te stellen zijn bedrijf voort te zetten; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
  - number: 93a.2.c
    text: |-
      deze zijn ontvangen van een instantie als bedoeld in [artikel 88, eerste lid][ref1], tenzij de uitdrukkelijke
      instemming is verkregen van die instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel88
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '88'
        hoofdstuk: '9'
  - number: 93a.3
    text: |-
      Onze Minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
  - number: 93a.4
    text: |-
      Onze Minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen uitsluitend
      gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Pensioen- &
      Verzekeringskamer deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
  - number: 93a.5
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. Artikel 87 is van toepassing.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
  - number: 93a.6
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
  - number: 93a.7
    text: |-
      De [Wet openbaarheid van bestuur][ref1], de [Wet Nationale ombudsman][ref2] en
      [titel 9.2 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing met betrekking tot de in dit artikel
      bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
      - id: ref3
        bwb_id: BWBR0005537
  - number: 93b.1
    text: |-
      Onze Minister en de Pensioen- & Verzekeringskamer kunnen een last onder dwangsom opleggen
      ter zake van overtreding van voorschriften gesteld, bij of krachtens de [artikelen 11][ref1],
      [17, eerste tot en met derde lid][ref2], [17, vierde lid, eerste volzin][ref3], [17, vijfde lid][ref4],
      [18, eerste tot en met vierde lid][ref5], [18a][ref6], [22, eerste lid, onderdeel e][ref7],
      [22, tweede lid][ref8], [23, tweede lid, laatste volzin][ref9],[ 23, derde lid, eerste volzin][ref10],
      [23, derde lid, laatste volzin][ref11], [23, vierde lid, tweede volzin][ref12], [23, vijfde lid][ref13],
      [25][ref14], [27, tweede lid][ref15], [27, derde lid, onderdeel a][ref16], [27, vijfde lid, eerste volzin][ref17],
      [27a, tweede tot en met vierde lid][ref18], [28, tweede en derde lid][ref19], voor zover het betreft
      het voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref20] en het voorschrift inzage
      te verlenen in zakelijke gegevens en bescheiden, [29, zesde lid, laatste volzin][ref21],[ 30][ref22],
      [31, eerste en tweede lid][ref23], [31a, eerste en tweede lid][ref24], [32, eerste lid][ref25],
      [32, tweede lid, tweede volzin][ref26], [33, eerste tot en met derde lid, vijfde volzin][ref27],
      [33, vijfde en zesde lid][ref28], [33, zevende lid, eerste volzin][ref29],
      [33a, eerste lid, eerste en derde volzin][ref30], [33c, eerste lid][ref31], [34, eerste en tweede lid][ref32],
      [35, eerste, vierde en vijfde lid][ref33], [36, eerste lid][ref34], [36, tweede lid, tweede volzin][ref35],
      [37][ref36], [38, eerste tot en met vijfde lid][ref37], [39, eerste en tweede lid][ref38],
      [40, eerste, derde en vierde lid][ref39], [40c, eerste lid, laatste volzin][ref40], [40c, tweede lid][ref41],
      [41][ref42], [44, tweede lid][ref43], [45, eerste tot en met vierde lid][ref44], [46][ref45],
      [47, eerste en tweede lid][ref46], [48][ref47], [49, eerste tot en met derde lid][ref48],
      [50][ref49], [51, eerste lid][ref50], [51, tweede lid, eerste volzin][ref51], [51, vierde lid][ref52],
      [54, eerste en vijfde lid][ref53], [55, derde lid][ref54], [56, eerste en tweede lid][ref55],
      [57, eerste, tweede en vierde lid][ref56], [58][ref57], [59, eerste lid][ref58], [63][ref59],
      [64, eerste lid][ref60], [82, eerste, vierde en zesde lid][ref61], [84, achtste lid][ref62], [86][ref63],
      [89, tweede lid][ref64], [90, tweede lid][ref65], en [92, eerste lid][ref66], voor zover zij zijn belast met de
      uitvoering van het toezicht ter zake van die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel17
