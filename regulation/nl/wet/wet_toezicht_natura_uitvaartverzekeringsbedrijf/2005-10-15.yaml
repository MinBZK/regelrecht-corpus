---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_natura_uitvaartverzekeringsbedrijf
regulatory_layer: WET
publication_date: '2008-04-08'
valid_from: '2005-10-15'
bwb_id: BWBR0007477
url: https://wetten.overheid.nl/BWBR0007477/2005-10-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijke bepalingen vast te stellen ten aanzien van
    het natura-uitvaartverzekeringsbedrijf;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt - voor zover niet anders blijkt - verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.a
    text: |-
      overeenkomsten van natura-uitvaartverzekering: overeenkomsten van verzekering in verband met de verzorging van de
      uitvaart van de mens die uitsluitend strekken tot het verrichten van andere dan geldelijke prestaties;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.b
    text: |-
      natura-uitvaartverzekeringsbedrijf: het als bedrijf sluiten van overeenkomsten van natura-uitvaartverzekering
      voor eigen rekening, met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van natura-
      uitvaartverzekering, ook al wordt daarmee niet beoogd het maken van winst;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.c
    text: |-
      verzekeraar: ieder die het natura-uitvaartverzekeringsbedrijf uitoefent, met uitzondering van levensverzekeraars
      als bedoeld in [artikel 1, eerste lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.d
    text: 'vestiging: zetel of bijkantoor van een verzekeraar op het grondgebied van een staat;'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.e
    text: 'zetel: plaats waar de verzekeraar overeenkomstig zijn statuten zijn zetel heeft;'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.f
    text: |-
      bijkantoor: elke duurzame aanwezigheid, met uitzondering van de zetel, van een verzekeraar op het grondgebied van
      een staat, ook indien er slechts sprake is van een bureau, beheerd door eigen personeel van de verzekeraar of door
      een zelfstandig persoon die gemachtigd is duurzaam voor de verzekeraar op te treden;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.g
    text: |-
      verrichten van diensten: het in de uitoefening van het natura-uitvaartverzekeringsbedrijf sluiten van een
      overeenkomst van natura-uitvaartverzekering vanuit een vestiging, gelegen in een andere staat dan die waar de
      verzekeringnemer zijn gewone verblijfplaats heeft;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.h
    text: |-
      premie: de in geld uitgedrukte prestatie, door de verzekeringnemer verschuldigd uit hoofde van een overeenkomst van
      natura-uitvaartverzekering;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.i
    text: |-
      vertegenwoordiger: degene die door een verzekeraar met zetel buiten Nederland is aangesteld om hem in Nederland te
      vertegenwoordigen bij de uitoefening van zijn bevoegdheden en bij de naleving van de voorschriften die ingevolge
      deze wet voor hem gelden;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.j
    text: |-
      acquisitie: alle handelingen, strekkende tot het voorbereiden of tot stand brengen van overeenkomsten van natura-
      uitvaartverzekering;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.k
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.l
    text: |-
      toezichthoudende autoriteit: de instantie die in enige staat bij of krachtens de wet met het toezicht op het
      natura-uitvaartverzekeringsbedrijf is belast;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.m
    text: |-
      gekwalificeerde deelneming: een rechtstreeks of middellijk belang van ten minste 10 procent van het geplaatste
      aandelenkapitaal van een onderneming, of het rechtstreeks of middellijk kunnen uitoefenen van ten minste 10
      procent van de stemrechten in een onderneming, of het rechtstreeks of middellijk kunnen uitoefenen van een daarmee
      vergelijkbare zeggenschap in een onderneming; bij het bepalen van het aantal stemrechten, dat iemand in een
      onderneming of instelling heeft, worden tot diens stemrechten mede gerekend de stemrechten waarover hij beschikt of
      geacht wordt te beschikken op grond van artikel 12 van de Wet melding zeggenschap en kapitaalbelang in ter beurze
      genoteerde vennootschappen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.n
    text: |-
      Pensioen- & Verzekeringskamer: de Pensioen- & Verzekeringskamer, bedoeld in
      [artikel 2, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel2
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '2'
  - number: 1.o
    text: |-
      groep: een groep als bedoeld in artikel 24b van Boek 2 van het Burgerlijk Wetboek, met dien verstande dat indien
      een natuurlijk persoon, rechtspersoon of vennootschap:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.o.1°
    text: |-
      via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: 1.o.2°
    text: |-
      in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in artikel 24c van
      Boek 2 van het Burgerlijk Wetboek, dan wel, voor zover het natuurlijke personen betreft, een met een deelneming
      overeenkomende positie,
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel1
  - number: '2.1'
    text: Het toezicht op de verzekeraars, zoals dit uit deze wet voortvloeit, berust bij de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel2
  - number: '2.2'
    text: |-
      De Pensioen- & Verzekeringskamer verstrekt Onze Minister desgevraagd de inlichtingen die nodig zijn voor de
      beoordeling van de uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor
      zover deze betrekking hebben op het natura-uitvaartverzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel2
  - number: '3.1'
    text: |-
      De Pensioen- & Verzekeringskamer brengt jaarlijks over haar werkzaamheden en bevindingen ingevolge deze
      wet aan Ons verslag uit. In het verslag worden niet opgenomen de door haar gegeven aanwijzingen, bedoeld in
      [artikel 27, eerste lid][ref1], waarvan geen mededeling is gedaan, noch wordt ten aanzien van afzonderlijke
      verzekeraars melding gemaakt van inlichtingen die niet in de openbaar te maken staten, bedoeld in
      [artikel 33, vierde lid][ref2], zijn opgenomen. Een oordeel over enige verzekeraar wordt in dit verslag niet
      kenbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel33
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.2'
    text: Het verslag wordt door de zorg van de Pensioen- & Verzekeringskamer openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel3
  - number: '4.1'
    text: |-
      De Pensioen- & Verzekeringskamer legt te haren kantore ten behoeve van een ieder een lijst ter inzage van de
      verzekeraars:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel4
  - number: 4.1.a
    text: |-
      die in het bezit zijn van een vergunning als bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4.1.b
    text: met zetel buiten Nederland die bevoegd zijn naar Nederland diensten te verrichten.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel4
  - number: '4.2'
    text: |-
      Bij de verzekeraars als bedoeld in het eerste lid, onderdeel *a*, met zetel buiten Nederland worden tevens de naam
      en de woonplaats van de vertegenwoordiger vermeld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel4
  - number: '5'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt het sluiten van overeenkomsten die
      strekken tot fondsvorming ter voldoening van de verzorging van de uitvaart van de mens als uitoefening van het
      natura-uitvaartverzekeringsbedrijf beschouwd indien deze overeenkomsten worden aangegaan door verzekeraars en voor
      deze verzekeraars geen beleggingsrisico inhouden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel5
  - number: 5a.1
    text: |-
      De Pensioen- & Verzekeringskamer werkt samen met de autoriteiten die ingevolge de
      [Wet toezicht beleggingsinstellingen][ref1], de [Wet toezicht effectenverkeer 1995][ref2], de
      [Wet toezicht kredietwezen 1992][ref3] onderscheidenlijk de [Wet toezicht verzekeringsbedrijf 1993][ref4], belast
      zijn met het toezicht op beleggingsinstellingen, effecteninstellingen, kredietinstellingen onderscheidenlijk
      verzekeraars, met het oog op het tot stand brengen van gelijkgerichte regelgeving en beleid ter zake van bij
      ministeriële regeling aan te wijzen onderwerpen die zowel het toezicht ingevolge deze wet als het toezicht
      ingevolge een van de eerdergenoemde wetten betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
      [ref2]: https://wetten.overheid.nl/BWBR0007657
      [ref3]: https://wetten.overheid.nl/BWBR0005792
      [ref4]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004809
      - id: ref2
        bwb_id: BWBR0007657
      - id: ref3
        bwb_id: BWBR0005792
      - id: ref4
        bwb_id: BWBR0006509
  - number: 5a.2
    text: |-
      De Pensioen- & Verzekeringskamer voert het toezicht ingevolge deze wet, voor zover het betrekking heeft op de
      onderwerpen, bedoeld in het eerste lid, uit met inachtneming van daartoe met de overige in het eerste lid bedoelde
      autoriteiten te sluiten overeenkomsten. Deze overeenkomsten bevatten afspraken over coördinatie en afstemming van
      regelgeving en beleid, en in voorkomende gevallen over uitvoering van toezicht. De Pensioen- & Verzekeringskamer
      draagt er zorg voor dat zij of een van de overige in het eerste lid bedoelde autoriteiten een afschrift van de
      gesloten overeenkomsten zendt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel5a
  - number: 5a.3
    text: |-
      Binnen zes maanden na afloop van elk kalenderjaar draagt de Pensioen- & Verzekeringskamer in samenwerking met de
      overige in het eerste lid bedoelde autoriteiten zorg voor een gezamenlijk verslag dat openbaar wordt gemaakt en
      waarin melding wordt gemaakt van de wijze waarop uitvoering is gegeven aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel5a
  - number: '6.1'
    text: |-
      De Pensioen- & Verzekeringskamer werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het
      toezicht op verzekeraars die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de
      [Wet toezicht kredietwezen 1992][ref1], de [Wet toezicht beleggingsinstellingen][ref2] onderscheidenlijk
      de [Wet toezicht effectenverkeer 1995][ref3] belast zijn met het toezicht op kredietinstellingen,
      beleggingsinstellingen onderscheidenlijk effectenbemiddelaars en vermogensbeheerders die tot diezelfde groep
      behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
      [ref2]: https://wetten.overheid.nl/BWBR0004809
      [ref3]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005792
      - id: ref2
        bwb_id: BWBR0004809
      - id: ref3
        bwb_id: BWBR0007657
  - number: '6.2'
    text: |-
      De Pensioen- & Verzekeringskamer pleegt, in de gevallen bedoeld in het eerste lid, waar nodig overleg met een
      autoriteit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel6
  - number: '6.3'
    text: |-
      De Pensioen- & Verzekeringskamer werkt, in de gevallen bedoeld in het eerste lid, waar nodig samen op basis van
      een of meer daartoe met een autoriteit als bedoeld in het eerste lid overeen te komen regelingen. Deze regelingen
      betreffen in elk geval afspraken over het stellen van gemeenschappelijke eisen, het coördineren van werkzaamheden
      uit hoofde van ieders uitoefening van het toezicht en het uitwisselen van gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel6
  - number: '6.4'
    text: |-
      De Pensioen- & Verzekeringskamer verstrekt aan een autoriteit als bedoeld in het eerste lid dan wel de
      autoriteit die is belast met de uitvoering van de [Wet inzake de geldtransactiekantoren][ref1] of de
      [Wet toezicht trustkantoren][ref2] de gegevens of inlichtingen die zij verkregen heeft bij de vervulling van de
      haar ingevolge deze wet opgedragen taak en die betrekking hebben op de deskundigheid van personen als bedoeld in
      [artikel 18, eerste en derde lid][ref3], onderscheidenlijk de voornemens, de handelingen en de antecedenten van
      personen als bedoeld in [artikel 18, tweede en vierde lid][ref4], voor zover de Pensioen- & Verzekeringskamer van
      oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het toezicht dat door die
      andere autoriteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0013816
      [ref2]: https://wetten.overheid.nl/BWBR0016189
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007477#Artikel18
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013816
      - id: ref2
        bwb_id: BWBR0016189
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007477
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6.5'
    text: |-
      De verplichting als bedoeld in het vierde lid geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in [artikel 88, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel88
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '88'
        hoofdstuk: '9'
  - number: '7'
    text: 'Deze wet is, tenzij daaruit anders voortvloeit, van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel7
  - number: 7.a
    text: verzekeraars met zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel7
  - number: 7.b
    text: 'verzekeraars met zetel buiten Nederland voor wat betreft:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel7
  - number: 7.b.1°
    text: een bijkantoor in Nederland;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel7
  - number: 7.b.2°
    text: het verrichten van diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel7
  - number: '8.1'
    text: |-
      De Pensioen- & Verzekeringskamer beslist voor de toepassing van deze wet of een handeling of een samenstel
      van handelingen al dan niet uitoefening van het natura-uitvaartverzekeringsbedrijf of een andersoortig
      bedrijf vormt en of een handeling of een samenstel van handelingen al dan niet uitoefening van het natura-
      uitvaartverzekeringsbedrijf vanuit een vestiging in Nederland vormt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel8
  - number: '8.2'
    text: 'De Pensioen- & Verzekeringskamer beslist ambtshalve dan wel op aanvraag van:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel8
  - number: 8.2.a
    text: |-
      hetzij degene die de handeling of het samenstel van handelingen verricht of voornemens is te verrichten
      onderscheidenlijk de verzekeraar die de overeenkomst van natura-uitvaartverzekering sluit of voornemens is te
      sluiten;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel8
  - number: 8.2.b
    text: |-
      hetzij een representatieve organisatie van verzekeraars als bedoeld in [artikel 92, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel92
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '92'
        hoofdstuk: '9'
  - number: '9.1'
    text: |-
      Deze wet is niet van toepassing op verenigingen en onderlinge waarborgmaatschappijen met zetel in Nederland die op
      het tijdstip van inwerkingtreding van deze wet het natura-uitvaartverzekeringsbedrijf uitoefenen en:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel9
  - number: 9.1.a
    text: naar Nederlands recht zijn opgericht voor 1 januari 1995;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel9
  - number: 9.1.b
    text: waarvan het aantal meerderjarige verzekerden minder dan 3000 bedraagt; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel9
  - number: 9.1.c
    text: |-
      die niet binnen de in [artikel 94][ref1] genoemde termijn een vergunning als bedoeld in [artikel 11][ref2] hebben
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel11
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '94'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Op verzekeraars die voldoen aan de onderdelen *a* en *b* van het eerste lid, maar die voor 1 januari 1995 niet
      de rechtsvorm vereniging of onderlinge waarborgmaatschappij bezaten, is [artikel 95][ref1] van overeenkomstige
      toepassing met dien verstande dat deze verzekeraars zich slechts kunnen omzetten in een onderlinge
      waarborgmaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel95
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '95'
        hoofdstuk: '11'
  - number: '10'
    text: |-
      Dit hoofdstuk is niet van toepassing op verzekeraars met zetel buiten Nederland voor wat betreft het verrichten van
      diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel10
  - number: '11'
    text: |-
      Het is verboden het natura-uitvaartverzekeringsbedrijf uit te oefenen zonder een vergunning van de Pensioen-
      & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel11
  - number: '12.1'
    text: 'Bij de aanvraag van een vergunning legt de aanvrager aan de Pensioen- & Verzekeringskamer over:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
  - number: 12.1.a
    text: een programma van werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
  - number: 12.1.b
    text: een authentiek afschrift van de akte van oprichting;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
  - number: 12.1.c
    text: een exemplaar van zijn statuten;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
  - number: 12.1.d
    text: een lijst met namen en adressen van zijn bestuurders en commissarissen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
  - number: 12.1.e
    text: |-
      de voorgenomen maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
      met uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: '12.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het programma van werkzaamheden, bedoeld in het
      eerste lid, onderdeel *a*. Deze regels kunnen verschillen naar gelang de zetel van de verzekeraar zich bevindt in
      of buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel12
  - number: '13'
    text: |-
      Indien de stukken die bij de aanvraag van een vergunning zijn overgelegd, de Pensioen- & Verzekeringskamer
      aanleiding geven tot het maken van opmerkingen, stelt zij de aanvrager in de gelegenheid op deze opmerkingen binnen
      een door haar te stellen termijn te antwoorden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel13
  - number: '14'
    text: |-
      De Pensioen- & Verzekeringskamer verleent een vergunning aan ieder die te haren genoegen heeft aangetoond dat hij
      aan de bij of krachtens deze wet gestelde eisen voor het verkrijgen van de vergunning voldoet.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel14
  - number: '15.1'
    text: |-
      De Pensioen- & Verzekeringskamer beslist binnen acht weken. Indien toepassing is gegeven aan [artikel 13][ref1],
      begint de in de eerste volzin genoemde termijn op het tijdstip waarop de inlichtingen door de Pensioen- &
      Verzekeringskamer zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel13
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '15.2'
    text: De Pensioen- & Verzekeringskamer doet van de verlening van een vergunning mededeling in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel15
  - number: '16'
    text: 'Bij de aanvraag van een vergunning legt de aanvrager tevens aan de Pensioen- & Verzekeringskamer over:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel16
  - number: 16.a
    text: |-
      een lijst met namen en adressen van de personen die het dagelijks beleid bepalen van de groep waartoe de aanvrager
      behoort en tevens uit dien hoofde het dagelijks beleid van de aanvrager mede bepalen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel16
  - number: 16.b
    text: |-
      een lijst met namen en adressen van de personen die het beleid bepalen of mede bepalen van de groep waartoe de
      aanvrager behoort en tevens uit dien hoofde het beleid van de aanvrager mede bepalen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel16
  - number: 16.c
    text: |-
      gegevens over de identiteit van degenen die een gekwalificeerde deelneming houden in de onderneming van de
      aanvrager alsmede over de omvang van die deelneming;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel16
  - number: 16.d
    text: gegevens over de formele en de feitelijke zeggenschapsstructuur van de groep waartoe de aanvrager behoort.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel16
  - number: '17.1'
    text: |-
      Verzekeraars met zetel in Nederland dienen de rechtsvorm van naamloze vennootschap of onderlinge
      waarborgmaatschappij te bezitten. Zij kunnen eveneens de rechtsvorm aannemen van een Europese vennootschap zodra
      deze bestaat.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel17
  - number: '17.2'
    text: Het dagelijks beleid van een verzekeraar wordt bepaald door ten minste twee personen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel17
  - number: '17.3'
    text: |-
      Een verzekeraar die de rechtsvorm van naamloze vennootschap of Europese vennootschap bezit, heeft ten minste drie
      commissarissen als bedoeld in artikel 140 van Boek 2 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel17
  - number: '17.4'
    text: |-
      De Pensioen- & Verzekeringskamer kan aan een verzekeraar van het bepaalde in het tweede of derde lid ontheffing
      verlenen en aan deze ontheffing beperkingen stellen of voorschriften verbinden, onverminderd het bepaalde in
      [artikel 158 van Boek 2 van het Burgerlijk Wetboek][ref1]. Een ontheffing kan worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
  - number: '17.5'
    text: |-
      Een verzekeraar behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige
      mate ondoorzichtig is dat deze, naar het oordeel van de Pensioen- & Verzekeringskamer, een belemmering vormt voor
      het adequaat uitoefenen van toezicht op de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel17
  - number: '17.6'
    text: |-
      Indien een verzekeraar in een groep is verbonden met een natuurlijke of rechtspersoon op wie, onderscheidenlijk
      waarop, het recht van een staat die geen lid is van de Europese Unie van toepassing is, mag het recht van die
      staat, naar het oordeel van de Pensioen- & Verzekeringskamer, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel17
  - number: '18.1'
    text: |-
      De deskundigheid van de personen die het dagelijks beleid van een verzekeraar bepalen, dient naar het
      oordeel van de Pensioen- & Verzekeringskamer voldoende te zijn in verband met de uitoefening van het natura-
      uitvaartverzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel18
  - number: '18.2'
    text: |-
      De voornemens, de handelingen of de antecedenten van de personen die het beleid van de verzekeraar bepalen of
      mede bepalen, mogen de Pensioen- & Verzekeringskamer geen aanleiding geven tot het oordeel dat, met het oog op de
      belangen van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen betrokken zijn of zullen
      worden bij overeenkomsten van verzekering, gesloten of te sluiten met de verzekeraar, de betrouwbaarheid van deze
      personen niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel18
  - number: '18.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de personen die het dagelijks beleid bepalen van de groep
      waartoe de verzekeraar behoort, voor zover zij tevens uit dien hoofde het dagelijks beleid van de verzekeraar mede
      bepalen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel18
  - number: '18.4'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de personen die het beleid bepalen of mede bepalen van de groep
      waartoe de verzekeraar behoort en tevens uit dien hoofde het beleid van de verzekeraar mede bepalen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel18
  - number: 18a
    text: |-
      De personen die het dagelijks beleid van een verzekeraar bepalen, verrichten hun werkzaamheden in verband daarmee
      vanuit Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel18a
  - number: '19'
    text: |-
      De geschiktheid van de houders van een gekwalificeerde deelneming in de onderneming van de aanvrager dient
      naar het oordeel van de Pensioen- & Verzekeringskamer voldoende te zijn met het oog op een gezonde, prudente
      en integere bedrijfsvoering van de verzekeraar. Onder integere bedrijfsvoering wordt in dit artikel verstaan de
      bedrijfsvoering met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: '20'
    text: 'De aanvrager van een vergunning dient te beschikken over:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel20
  - number: 20.a
    text: |-
      het minimum bedrag van het garantiefonds bedoeld in [artikel 40, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 20.b
    text: |-
      financiële middelen tot dekking van de te verwachten kosten voor de inrichting van de administratie en van het
      produktienet.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel20
  - number: '21.1'
    text: |-
      Bij de aanvraag van een vergunning legt de verzekeraar met zetel buiten Nederland tevens aan de Pensioen- &
      Verzekeringskamer over de akte van aanstelling van de vertegenwoordiger alsook, indien de vertegenwoordiger
      rechtspersoon is, de statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister
      en de akte van aanstelling van de natuurlijke persoon, bedoeld in [artikel 23, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '21.2'
    text: De modellen van de akten van aanstelling worden door de Pensioen- & Verzekeringskamer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel21
  - number: '22.1'
    text: 'Een verzekeraar die een vergunning aanvraagt dient:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: 22.1.a
    text: naar het recht van de staat van zijn zetel rechtspersoon te zijn;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: 22.1.b
    text: |-
      in de staat van zijn zetel bevoegd te zijn tot uitoefening van het natura-uitvaartverzekeringsbedrijf, dit bedrijf
      vanuit een vestiging in die staat daadwerkelijk uit te oefenen en bevoegd te zijn een bijkantoor in Nederland te
      openen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: 22.1.c
    text: |-
      met betrekking tot zijn gehele in en buiten Nederland uitgeoefende natura-uitvaartverzekeringsbedrijf over
      een solvabiliteitsmarge te beschikken, die ten minste overeenkomt met de ingevolge [artikel 40][ref1] vereiste
      solvabiliteitsmarge;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 22.1.d
    text: |-
      met inachtneming van [artikel 47, tweede lid][ref1], te beschikken over het minimum bedrag van het garantiefonds
      bedoeld in [artikel 40, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 22.1.e
    text: |-
      het in onderdeel *d* bedoelde minimum bedrag van het garantiefonds aan te houden in bij of krachtens algemene
      maatregel van bestuur te bepalen waarden volgens de daarbij te stellen regels;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: 22.1.f
    text: |-
      te beschikken over financiële middelen tot dekking van de te verwachten kosten voor de inrichting van de
      administratie en van het produktienet in Nederland;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: 22.1.g
    text: |-
      zowel in zijn bijkantoor als in de staat van zijn zetel te beschikken over een goede administratieve organisatie en
      adequate interne controleprocedures; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: 22.1.h
    text: |-
      zowel in zijn bijkantoor als in de staat van zijn zetel te beschikken over adequate maatregelen, gericht op het
      bevorderen en handhaven van een integere bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: '22.2'
    text: |-
      In de bij of krachtens algemene maatregel van bestuur te stellen regels, bedoeld in het eerste lid, onderdeel
      e, kan worden voorgeschreven dat de verzekeraar voor bepaalde handelingen toestemming van de Pensioen- &
      Verzekeringskamer behoeft.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel22
  - number: '23.1'
    text: |-
      De verzekeraar stelt als zijn vertegenwoordiger een natuurlijk persoon of een rechtspersoon aan, die zijn
      woonplaats in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
  - number: '23.2'
    text: |-
      De vertegenwoordiger heeft ten aanzien van de uitoefening van het natura-uitvaartverzekeringsbedrijf vanuit de
      bijkantoren in Nederland van rechtswege alle bevoegdheden die de verzekeraar bezit. Hij maakt daarvan gebruik voor
      zover de Pensioen- & Verzekeringskamer zulks verlangt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
  - number: '23.3'
    text: |-
      De vertegenwoordiger is gehouden namens de verzekeraar te voldoen aan de bij of krachtens deze wet gegeven
      voorschriften. Het ontbreken van de vertegenwoordiger of zijn in gebreke zijn ontslaat de verzekeraar niet van de
      verplichting te voldoen aan deze voorschriften.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
  - number: '23.4'
    text: |-
      De Pensioen- & Verzekeringskamer kan ambtshalve of op aanvraag van de verzekeraar ontheffing verlenen van
      het bepaalde in de eerste volzin van het derde lid. Aan een ontheffing kunnen beperkingen worden gesteld of
      voorschriften worden verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
  - number: '23.5'
    text: |-
      Is de vertegenwoordiger rechtspersoon, dan wijst hij op zijn beurt een natuurlijk persoon aan die in Nederland
      zijn woonplaats heeft en die hem bij uitsluiting van ieder ander vertegenwoordigt bij de uitoefening van zijn
      bevoegdheden en bij de nakoming van zijn uit deze wet voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
  - number: '23.6'
    text: |-
      Als woonplaats van de verzekeraar in Nederland geldt de woonplaats van zijn vertegenwoordiger, met dien verstande
      dat, indien de vertegenwoordiger een natuurlijk persoon is die een kantoor houdt, dit kantoor als woonplaats van de
      verzekeraar wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
  - number: '23.7'
    text: |-
      [Artikel 18, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de natuurlijke persoon die als
      vertegenwoordiger is aangesteld en op de natuurlijke persoon, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel18
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24'
    text: |-
      Dit hoofdstuk is, behoudens [de artikelen 25][ref1], [26][ref2] en [28][ref3] tot en met [30][ref4], niet van
      toepassing op verzekeraars met zetel buiten Nederland voor wat betreft het verrichten van diensten naar Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0007477#Artikel30
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007477
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot aan het publiek te
      verstrekken informatie door verzekeraars.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: '25.2'
    text: |-
      Onze Minister kan, op aanvraag, bepalen dat een verzekeraar niet behoeft te voldoen aan alle in het eerste lid
      bedoelde regels, indien de verzekeraar aantoont dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat
      de doeleinden die deze wet beoogt te bereiken anderszins voldoende zijn bereikt. Onze Minister kan een besluit als
      bedoeld in de vorige volzin wijzigen of intrekken, indien naar zijn oordeel de omstandigheden waaronder het besluit
      is genomen zodanig zijn gewijzigd, dat de doeleinden die deze wet beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: '25.3'
    text: |-
      [De artikelen 27, eerste en tweede lid][ref1] en [28][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel28
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '25.4'
    text: |-
      Taken en bevoegdheden die Onze Minister op grond van dit artikel heeft, kunnen bij algemene maatregel van bestuur
      worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van dit artikel jegens
      Onze Minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: '25.5'
    text: |-
      Een overdracht als bedoeld in het vierde lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      vereisten voldoet:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: 25.5.a
    text: hij dient in staat te zijn de in het vierde lid bedoelde taken en bevoegdheden naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: 25.5.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon, dat een
      onafhankelijke vervulling van de in het vierde lid bedoelde taken en bevoegdheden zo veel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: '25.6'
    text: Aan de overdracht, bedoeld in het vierde lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel25
  - number: '26.1'
    text: |-
      Een verzekeraar draagt er zorg voor dat in overeenkomsten van natura-uitvaartverzekering uitdrukkelijk wordt
      bepaald dat de verzekeringnemer beschikt over een termijn van ten minste twee weken, gerekend vanaf het tijdstip
      waarop de verzekeringnemer ervan in kennis wordt gesteld dat de overeenkomst is gesloten, om de overeenkomst met
      onmiddellijke ingang schriftelijk op te zeggen. De kennisgeving van de verzekeraar geschiedt schriftelijk binnen
      vier weken na het sluiten van de overeenkomst. De opzegging door de verzekeringnemer heeft ten gevolge dat hij en
      de verzekeraar met ingang van het tijdstip waarop de verzekeraar deze opzegging heeft ontvangen, worden ontheven
      van alle uit deze overeenkomst voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op overeenkomsten die strekken tot fondsvorming ter voldoening van
      de verzorging van de uitvaart van de mens.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel26
  - number: '27.1'
    text: |-
      Indien de Pensioen- & Verzekeringskamer zulks noodzakelijk acht in het belang van degenen die als verzekeringnemers
      of verzekerden betrokken zijn of zullen worden bij overeenkomsten van natura-uitvaartverzekering, gesloten of te
      sluiten door een verzekeraar, kan zij die verzekeraar een aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.2'
    text: De verzekeraar volgt een aanwijzing binnen de door de Pensioen- & Verzekeringskamer gestelde termijn op.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.3'
    text: |-
      Indien de Pensioen- & Verzekeringskamer niet binnen twee weken na de bekendmaking van de aanwijzing een haar
      bevredigend antwoord van de verzekeraar heeft ontvangen of naar haar oordeel niet of onvoldoende aan haar
      aanwijzing is gevolg gegeven, kan zij:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: 27.3.a
    text: |-
      de verzekeraar aanzeggen, dat vanaf een bepaald tijdstip alle of bepaalde organen van de verzekeraar, daaronder
      voor de toepassing van dit artikel de vertegenwoordiger begrepen, hun bevoegdheden slechts mogen uitoefenen na
      toestemming door een of meer door de Pensioen- & Verzekeringskamer aangewezen personen en met inachtneming van de
      opdrachten van deze personen, welke aanzegging terstond van kracht wordt;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: 27.3.b
    text: |-
      de verzekeraar aanzeggen, dat de Pensioen- & Verzekeringskamer van de aanwijzing mededeling zal doen in de
      *Staatscourant* en in een of meer dagbladen te harer keuze, bij welke mededeling, indien de verzekeraar dit
      verlangt, tevens de correspondentie wordt gepubliceerd, die naar aanleiding van de aanwijzing tussen de Pensioen- &
      Verzekeringskamer en de verzekeraar is gevoerd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.4'
    text: |-
      Indien het in het eerste lid bedoelde belang onverwijld ingrijpen noodzakelijk maakt, kan de Pensioen- &
      Verzekeringskamer zonder toepassing van het eerste lid onmiddellijk uitvoering geven aan het derde lid, onderdeel
      *a*, nadat zij de verzekeraar in de gelegenheid heeft gesteld zijn mening over de onmiddellijke uitvoering te
      geven.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.5'
    text: |-
      De organen van de verzekeraar verlenen de door de Pensioen- & Verzekeringskamer aangewezen personen alle
      medewerking. De Pensioen- & Verzekeringskamer kan de betrokken organen van de verzekeraar toestaan bepaalde
      handelingen zonder machtiging te verrichten.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.6'
    text: |-
      De door de Pensioen- & Verzekeringskamer aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste
      twee jaren na de bekendmaking van de aanzegging, bedoeld in het derde lid, onderdeel *a*, behoudens de bevoegdheid
      van de Pensioen- & Verzekeringskamer om deze termijn te verlengen telkens voor ten hoogste een jaar. Een zodanige
      verlenging maakt de Pensioen- & Verzekeringskamer aan de verzekeraar bekend. De verlenging wordt terstond
      van kracht. De Pensioen- & Verzekeringskamer kan te allen tijde de door haar aangewezen personen door anderen
      vervangen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.7'
    text: |-
      Voor schade ten gevolge van handelingen, welke zijn verricht in strijd met een aanzegging als bedoeld in het
      derde lid, onderdeel *a*, zijn degenen, die deze handelingen als orgaan van de verzekeraar verrichten, persoonlijk
      aansprakelijk tegenover de verzekeraar. De verzekeraar kan de ongeldigheid van deze handelingen inroepen, indien de
      wederpartij wist, dat de vereiste toestemming ontbrak of daarvan niet onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.8'
    text: |-
      De Pensioen- & Verzekeringskamer trekt in elk geval de maatregel, bedoeld in het derde lid, onderdeel *a*, in zodra
      zij van oordeel is, dat het in het eerste lid bedoelde belang deze maatregel niet langer noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: '27.9'
    text: |-
      De werking van het besluit tot publikatie van een aanwijzing, bedoeld in het derde lid, onderdeel *b*, wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist. Indien
      de verzekeraar na de publikatie alsnog voldoet aan de aanwijzing doet de Pensioen- & Verzekeringskamer hiervan op
      dezelfde wijze mededeling als bij de voorafgaande publikatie.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27
  - number: 27a.1
    text: |-
      Indien een verzekeraar tot een groep behoort en de deskundigheid of betrouwbaarheid van de in
      [artikel 18, derde en vierde lid][ref1], bedoelde personen naar het oordeel van de Pensioen- & Verzekeringskamer
      niet langer buiten twijfel staat, kan deze aan de personen of instellingen die via een formele of feitelijke
      zeggenschapsstructuur het beleid bepalen van de groep waartoe de verzekeraar behoort, de aanwijzing geven dat de
      eerstgenoemde personen het beleid van die verzekeraar niet meer kunnen bepalen of mede bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel18
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 27a.2
    text: |-
      De personen en instellingen tot wie de aanwijzing is gericht, volgen deze binnen de door de Pensioen- &
      Verzekeringskamer gestelde termijn op.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27a
  - number: 27a.3
    text: |-
      De personen en instellingen tot wie de aanwijzing is gericht, informeren de Pensioen- & Verzekeringskamer binnen de
      door haar gestelde termijn over de maatregelen die zijn getroffen om aan de aanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27a
  - number: 27a.4
    text: |-
      De verzekeraar geeft geen gevolg aan algemene of bijzondere instructies van personen op wie een aanwijzing van de
      Pensioen- & Verzekeringskamer als bedoeld in het eerste lid betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel27a
  - number: '28.1'
    text: |-
      De Pensioen- & Verzekeringskamer kan bij: - verzekeraars;
        - vertegenwoordigers;
        - ondernemingen of instellingen die met een verzekeraar met zetel in Nederland in een groep zijn verbonden;
        - ondernemingen of instellingen die een gekwalificeerde deelneming houden in een verzekeraar met zetel in
      Nederland;
        - ondernemingen of instellingen waarop onderdeel c niet van toepassing is en waarin door een verzekeraar met zetel
      in Nederland of door een lid of meer leden te zamen van een in onderdeel c bedoelde groep voor meer dan vijftig
      procent rechtstreeks of middellijk wordt deelgenomen;
        - pools waarin verzekeraars ter egalisering van risico's samenwerken en daarmee vergelijkbare vormen van
      samenwerking tussen verzekeraars op verzekeringstechnisch gebied;
        - een ieder die zich naar het oordeel van de Pensioen- & Verzekeringskamer voordoet als verzekeraar, alle
      inlichtingen inwinnen of doen inwinnen, die redelijkerwijs nodig zijn voor de uitoefening van de taken en
      bevoegdheden die zij op grond van deze wet heeft en teneinde na te gaan of de bij of krachtens deze wet gestelde
      bepalingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel28
  - number: '28.2'
    text: |-
      Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen de door de
      Pensioen- & Verzekeringskamer te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel28
  - number: '28.3'
    text: |-
      Ten aanzien van personen die door de Pensioen- & Verzekeringskamer zijn belast met het inwinnen van inlichtingen
      of met de uitoefening van andere taken en bevoegdheden die de Pensioen- & Verzekeringskamer heeft op grond van
      het bij of krachtens deze wet bepaalde, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4],
      [5:17][ref5] en [5:20 van de Algemene wet bestuursrech][ref6]t van overeenkomstige toepassing, met dien verstande
      dat indien een onderzoek als bedoeld in [artikel 89, eerste lid][ref7], wordt ingesteld, degene bij wie het
      onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen
      van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0007477#Artikel89
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0007477
        artikel: '89'
        hoofdstuk: '9'
  - number: '29.1'
    text: |-
      De Pensioen- & Verzekeringskamer kan getuigen en deskundigen alsmede bestuurders en commissarissen van een
      verzekeraar en van een in [artikel 28, eerste lid][ref1], bedoelde onderneming, instelling of pool en de
      betrokken vertegenwoordiger oproepen. Indien deze vertegenwoordiger rechtspersoon is, geldt deze bevoegdheid ten
      aanzien van de bestuurders en commissarissen van de vertegenwoordiger en ten aanzien van de door hem aangewezen
      natuurlijke persoon die hem vertegenwoordigt bij de uitoefening van zijn bevoegdheden en bij de nakoming van zijn
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel28
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '29.2'
    text: Deze personen zijn verplicht op die oproeping te verschijnen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
  - number: '29.3'
    text: De oproeping geschiedt op de wijze door de Pensioen- & Verzekeringskamer te bepalen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
  - number: '29.4'
    text: |-
      Bij oproeping door middel van dagvaarding wordt de tussenkomst van het Openbaar Ministerie ingeroepen en vinden de
      bepalingen aangaande het dagvaarden van getuigen en deskundigen in strafzaken overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
  - number: '29.5'
    text: |-
      Indien de opgeroepene niet op de dagvaarding verschijnt, kan de Pensioen- & Verzekeringskamer daarvan proces-
      verbaal opmaken. Zij kan hem andermaal doen dagvaarden en daarbij een bevel tot medebrenging voegen of zodanig
      bevel laten uitvaardigen. Tot het ten uitvoer leggen van zodanig bevel verleent het Openbaar Ministerie zijn
      tussenkomst; de Pensioen- & Verzekeringskamer richt het verzoek daartoe tot de officier van justitie, hoofd van het
      parket bij de rechtbank binnen welker rechtsgebied de Pensioen- & Verzekeringskamer is gevestigd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
  - number: '29.6'
    text: |-
      De getuigen zijn verplicht getuigenis af te leggen, behoudens verschoning wegens ambts- of beroepsgeheim. De
      deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten. De overige in het eerste lid
      bedoelde personen zijn verplicht alle gevraagde inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
  - number: '29.7'
    text: |-
      De Pensioen- & Verzekeringskamer kan de getuige de eed afnemen.
      [Artikel 177 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel177
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '177'
  - number: '29.8'
    text: |-
      De [artikelen 17][ref1] en [23, eerste lid, van de Wet op de Parlementaire Enquête][ref2], zijn van
      overeenkomstige toepassing, met dien verstande dat deskundigen niet worden gegijzeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001841#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001841#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001841
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0001841
        artikel: '23'
  - number: '29.9'
    text: |-
      Het afnemen van verhoren van getuigen en deskundigen alsook van de overige in het eerste lid bedoelde personen
      geschiedt op een plaats, door de Pensioen- & Verzekeringskamer te bepalen. Zij kan een of meer van de leden van
      haar bestuur dan wel een of meer van haar medewerkers machtigen een verhoor als in de eerste volzin bedoeld af te
      nemen. Het afnemen van de eed geschiedt echter steeds door een lid van haar bestuur.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
  - number: '29.10'
    text: |-
      De Pensioen- & Verzekeringskamer kent aan getuigen en deskundigen op hun verlangen een vergoeding toe
      overeenkomstig het bepaalde bij of krachtens de [Wet tarieven in burgerlijke zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '30'
    text: |-
      Bij of krachtens de in [artikel 31a][ref1] bedoelde algemene maatregel van bestuur kan worden voorgeschreven
      dat verzekeraars bepaalde gegevens ter zake van de integere bedrijfsvoering aan de Pensioen- &
      Verzekeringskamers melden. Onder integere bedrijfsvoering wordt in dit artikel verstaan de bedrijfsvoering
      met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 31a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: 18a
  - number: '31.1'
    text: Een verzekeraar draagt zorg voor een goede administratieve organisatie en adequate interne controleprocedures.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31
  - number: '31.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan aan verzekeraars regels stellen voor hun bedrijfsvoering met betrekking tot de
      administratieve organisatie – met inbegrip van de financiële administratie – en de interne controle.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31
  - number: 31a.1
    text: |-
      Een verzekeraar draagt zorg voor adequate maatregelen, gericht op het bevorderen en handhaven van een integere
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.2
    text: |-
      Met het oog op een integere bedrijfsvoering worden bij of krachtens algemene maatregel van bestuur aan verzekeraars
      regels gesteld ter zake van:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.2.a
    text: het tegengaan van verstrengeling van tegenstrijdige belangen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.2.b
    text: |-
      het voorkomen van betrokkenheid van de verzekeraar en van zijn werknemers bij strafbare feiten die het vertrouwen
      in de verzekeraar of in de financiële markten in het algemeen schaden;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.2.c
    text: |-
      het voorkomen van betrokkenheid van de verzekeraar en van zijn werknemers bij handelingen die anderszins in het
      maatschappelijk verkeer zodanig onaanvaardbaar zijn, dat deze het vertrouwen in de verzekeraar of in de financiële
      markten in het algemeen schaden;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.2.d
    text: het vaststellen van de identiteit, de aard en de achtergrond van de cliënten van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.2.e
    text: andere bij algemene maatregel van bestuur te noemen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
  - number: 31a.3
    text: |-
      Onder integere bedrijfsvoering wordt in dit artikel verstaan de bedrijfsvoering met
      uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: '32.1'
    text: Een verzekeraar doet het boekjaar gelijk lopen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel32
  - number: '32.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan van het bepaalde in het eerste lid ontheffing verlenen. Aan een ontheffing
      kunnen beperkingen worden gesteld of voorschriften worden verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel32
  - number: '33.1'
    text: |-
      Een verzekeraar dient binnen vier maanden na afloop van elk boekjaar bij de Pensioen- & Verzekeringskamer staten
      in, die te zamen een duidelijk beeld geven van het door de verzekeraar gevoerde beheer en van zijn financiële
      toestand. De indiening geschiedt in tweevoud en voor wat betreft de staten die ingevolge het zesde lid openbaar
      worden gemaakt, in drievoud, tenzij de Pensioen- & Verzekeringskamer andere aantallen vaststelt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan een verzekeraar, categorieën van verzekeraars of alle verzekeraars
      voorschrijven dat een of meer van deze staten met een hogere frequentie of binnen een kortere termijn worden
      ingediend of dat staten vergezeld worden van een toelichting.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.3'
    text: |-
      Een van de staten behelst het actuarieel verslag dat wordt voorzien van een verklaring van de actuaris. Met zijn
      verklaring bevestigt de actuaris dat hij zich ervan heeft overtuigd dat de in het actuarieel verslag genoemde
      voorzieningen prudent zijn vastgesteld en de in een staat opgenomen sterftevergelijking juist is weergegeven.
      Ten bewijze van een en ander waarmerkt de actuaris de betrokken staten. Hij is bevoegd zijn verklaring nader toe
      te lichten of op enig punt een voorbehoud te maken. De verzekeraar machtigt bij de opdracht tot het onderzoek
      de actuaris schriftelijk om desgevraagd of ingevolge een daartoe strekkende overeenkomst tussen de verzekeraar,
      de actuaris en de Pensioen- & Verzekeringskamer, aan de Pensioen- & Verzekeringskamer alle inlichtingen te
      verstrekken, die redelijkerwijze geacht kunnen worden nodig te zijn voor de vervulling van de haar bij of krachtens
      deze wet opgelegde taak. De Pensioen- & Verzekeringskamer stelt de verzekeraar in de gelegenheid aanwezig te zijn
      bij het verstrekken van inlichtingen door de actuaris.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.4'
    text: |-
      Indien de actuaris naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige waarborgen
      biedt dat deze de toevertrouwde taak met betrekking tot de verzekeraar naar behoren zal vervullen, kan de Pensioen-
      & Verzekeringskamer bepalen dat hij niet bevoegd is een verklaring als bedoeld in het derde lid met betrekking tot
      die verzekeraar af te leggen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.5'
    text: |-
      De modellen van de staten worden bij of krachtens algemene maatregel van bestuur vastgesteld. In de algemene
      maatregel van bestuur wordt bepaald welke staten openbaar moeten worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.6'
    text: |-
      De verzekeraar legt de openbaar te maken staten op al zijn kantoren in Nederland ter inzage van een ieder tot
      achttien maanden na afloop van het boekjaar. Tot zolang verstrekt hij ieder op verzoek een afschrift tegen ten
      hoogste de kostprijs.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.7'
    text: |-
      Een verzekeraar met zetel buiten Nederland dient zijn jaarrekening in drievoud bij de Pensioen- & Verzekeringskamer
      in zodra hij deze openbaar heeft gemaakt of krachtens het recht van de staat van zijn zetel openbaar moet hebben
      gemaakt. Op deze jaarrekening is het vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
  - number: '33.8'
    text: |-
      De Pensioen- & Verzekeringskamer kan bepalen dat de staten, bedoeld in het tweede lid, niet vergezeld gaan van een
      verklaring als bedoeld in het derde lid of van een verklaring als bedoeld in [artikel 33a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 33a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 33a.1
    text: |-
      Een verzekeraar doet de staten, bedoeld in [artikel 33, eerste lid][ref1], vergezeld gaan
      van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Ten bewijze dat de staten door hem
      zijn onderzocht of, indien het staten betreft als bedoeld in [artikel 33, tweede lid][ref3], in zijn onderzoek
      zijn betrokken, waarmerkt de accountant de staten. De verzekeraar machtigt bij de opdracht tot het onderzoek
      de accountant schriftelijk desgevraagd of ingevolge een daartoe strekkende overeenkomst tussen de verzekeraar,
      de accountant en de Pensioen- & Verzekeringskamer, aan de Pensioen- & Verzekeringskamer alle inlichtingen te
      verstrekken, die redelijkerwijze geacht kunnen worden nodig te zijn voor de vervulling van de haar bij of krachtens
      deze wet opgelegde taak. De Pensioen- & Verzekeringskamer stelt de verzekeraar in de gelegenheid aanwezig te zijn
      bij het verstrekken van inlichtingen door de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel33
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 33a.2
    text: |-
      De accountant, bedoeld in het eerste lid, meldt de Pensioen- & Verzekeringskamer zo spoedig mogelijk elke
      omstandigheid waarvan hij bij de uitvoering van zijn werkzaamheden als bedoeld in het eerste lid kennis heeft
      gekregen en die:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.2.a
    text: in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.2.b
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.2.c
    text: het voortbestaan van de verzekeraar bedreigt; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.2.d
    text: leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.3
    text: |-
      Op de accountant die naast zijn werkzaamheden voor de verzekeraar ook werkzaamheden uitvoert voor een andere
      onderneming of instelling, is de meldingsplicht, bedoeld in het tweede lid, van overeenkomstige toepassing indien
      de verzekeraar dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de andere onderneming
      of instelling dochtermaatschappij is van de verzekeraar. Voor de toepassing van de eerste volzin wordt onder
      dochtermaatschappij verstaan een dochtermaatschappij als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk
      Wetboek](onbekend), met dien verstande dat een verzekeraar tevens dochtermaatschappij kan zijn van een natuurlijk
      persoon of vennootschap.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.4
    text: |-
      De accountant die op grond van het tweede of derde lid tot een melding aan de Pensioen- & Verzekeringskamer is
      overgegaan, is niet aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt
      dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33a.5
    text: |-
      Indien de accountant naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige waarborgen
      biedt dat deze de toevertrouwde taak met betrekking tot de verzekeraar naar behoren zal vervullen, kan de Pensioen-
      & Verzekeringskamer bepalen dat hij niet bevoegd is een verklaring als bedoeld in het eerste lid met betrekking tot
      die verzekeraar af te leggen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33a
  - number: 33b
    text: |-
      Op een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die
      de jaarrekening van een verzekeraar controleert, is [artikel 33a, tweede tot en met vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel33a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: 33a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 33c.1
    text: |-
      De Pensioen- & Verzekeringskamer kan een verzekeraar, categorieën van verzekeraars of alle verzekeraars
      voorschrijven dat bijzondere opgaven met een door de Pensioen- & Verzekeringskamer bepaalde frequentie en binnen
      een door haar bepaalde termijn worden ingediend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33c
  - number: 33c.2
    text: |-
      De modellen van de bijzondere opgaven worden bij ministeriële regeling vastgesteld. Deze opgaven worden niet
      openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33c
  - number: 33c.3
    text: |-
      De Pensioen- & Verzekeringskamer kan bepalen dat de bijzondere opgaven vergezeld gaan van een verklaring als
      bedoeld in [artikel 33, derde lid][ref1] of van een verklaring als bedoeld in [artikel 33a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel33a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: 33a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '34.1'
    text: |-
      Een verzekeraar met zetel in Nederland dient binnen zes maanden na afloop van het boekjaar zijn jaarverslag
      in drievoud bij de Pensioen- & Verzekeringskamer in, tenzij de Pensioen- & Verzekeringskamer een ander aantal
      vaststelt. Een verzekeraar die [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref1] toepast, dient het
      jaarverslag, bedoeld in [artikel 403, eerste lid, onderdeel e, van Boek 2 van het Burgerlijk Wetboek][ref2],
      onverwijld na de neerlegging daarvan ten kantore van het handelsregister bij de Pensioen- & Verzekeringskamer in.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel403
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '403'
      - id: ref2
        bwb_id: BWBR0003045
  - number: '34.2'
    text: |-
      Een verzekeraar met zetel buiten Nederland dient, tenzij de Pensioen- & Verzekeringskamer een ander aantal
      vaststelt, zijn jaarverslag in drievoud bij haar in zodra hij het openbaar heeft gemaakt of krachtens het recht van
      de staat van zijn zetel openbaar moet hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel34
  - number: '34.3'
    text: |-
      [Artikel 33, vijfde lid][ref1], geldt ook voor het ingediende jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '35.1'
    text: 'Een verzekeraar:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
  - number: 35.1.a
    text: |-
      legt een authentiek afschrift van elke wijziging in zijn statuten aan de Pensioen- & Verzekeringskamer
      over en brengt elke wijziging in de akte van aanstelling van zijn vertegenwoordiger, bedoeld in
      [artikel 23, eerste lid][ref1], ter kennis van de Pensioen- & Verzekeringskamer, een en ander binnen twee weken
      na de totstandkoming van de desbetreffende wijziging. Dezelfde verplichting rust op de vertegenwoordiger die
      rechtspersoon is met betrekking tot elke wijziging in zijn statuten en in de akte van aanstelling van de door hem
      overeenkomstig [artikel 23, vijfde lid][ref2], aangewezen natuurlijke persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 35.1.b
    text: |-
      brengt elke wijziging in de samenstelling van zijn bestuur en raad van commissarissen en elke aanstelling van
      een vertegenwoordiger als bedoeld in [artikel 42, eerste lid][ref1], en 44, tweede lid, vooraf ter kennis van de
      Pensioen- & Verzekeringskamer;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel42
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 35.1.c
    text: |-
      brengt elke wijziging in de samenstelling van de personen die het dagelijks beleid bepalen van de groep waartoe de
      verzekeraar behoort en uit dien hoofde het dagelijks beleid van de verzekeraar mede bepalen vooraf ter kennis van
      de Pensioen- & Verzekeringskamer;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
  - number: 35.1.d
    text: |-
      brengt elke wijziging in de samenstelling van de personen die het beleid bepalen of mede bepalen van de groep
      waartoe de verzekeraar behoort en uit dien hoofde het beleid van de verzekeraar mede bepalen vooraf ter kennis van
      de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
  - number: '35.2'
    text: |-
      Een wijziging als bedoeld in het eerste lid, onderdeel b, c of d, wordt niet doorgevoerd indien de Pensioen- &
      Verzekeringskamer binnen zes weken na ontvangst van de melding of, indien de Pensioen- & Verzekeringskamer om
      nadere gegevens of inlichtingen heeft verzocht, binnen zes weken na de ontvangst van die gegevens of inlichtingen
      aan de verzekeraar bekend maakt dat zij niet met de voorgenomen wijziging instemt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
  - number: '35.3'
    text: |-
      Indien zich een wijziging voordoet van de antecedenten, bedoeld in [artikel 18, tweede of vierde lid][ref1], stelt
      de verzekeraar de Pensioen- & Verzekeringskamer daarvan onverwijld schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel18
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '35.4'
    text: |-
      Een verzekeraar doet binnen twee weken na het voor de eerste maal sluiten van een nieuw type overeenkomst van
      natura-uitvaartverzekering aan de Pensioen- & Verzekeringskamer opgave van de technische grondslagen voor de
      berekening van het desbetreffende tarief en van de desbetreffende technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
  - number: '35.5'
    text: |-
      Een verzekeraar doet binnen twee weken aan de Pensioen- & Verzekeringskamer opgave van de wijzigingen in de
      technische grondslagen voor de berekening van zijn tarieven en van de technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel35
  - number: '36.1'
    text: |-
      Het is een verzekeraar verboden overeenkomsten van natura-uitvaartverzekering, gesloten vanuit een vestiging in
      Nederland, zonder toestemming van degenen die aan die overeenkomsten rechten kunnen ontlenen, over te boeken naar
      een vestiging van deze verzekeraar buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel36
  - number: '36.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan ontheffing verlenen van het in het eerste lid gegeven verbod indien de
      verzekeraar aannemelijk maakt dat de belangen van degenen die aan de betrokken overeenkomsten rechten kunnen
      ontlenen, zich tegen de overboeking niet verzetten. Aan een ontheffing kunnen beperkingen worden gesteld of
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel36
  - number: '37'
    text: |-
      Een verzekeraar met zetel in Nederland mag geen ander bedrijf dan het natura-uitvaartverzekeringsbedrijf
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel37
  - number: '38.1'
    text: |-
      Een verzekeraar houdt toereikende technische voorzieningen aan. Rekening houdend met alle financiële aspecten van
      zijn onderneming stelt hij de premies voor te sluiten overeenkomsten van natura-uitvaartverzekering op adequate
      wijze vast. Bij of krachtens algemene maatregel van bestuur kunnen ter zake van het bepaalde in dit lid nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel38
  - number: '38.2'
    text: |-
      De technische voorzieningen worden volledig door waarden gedekt. Ten aanzien van deze waarden kunnen bij of
      krachtens algemene maatregel van bestuur regels worden gesteld. De Pensioen- & Verzekeringskamer kan tegen de
      aard en de waardering van deze waarden bedenkingen naar voren brengen, aan welke bedenkingen de verzekeraar dient
      tegemoet te komen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel38
  - number: '38.3'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen moeten in toereikende mate kunnen worden geïnd
      of te gelde gemaakt in de muntsoort van de staat waarin de verzekerde ten tijde van het sluiten van de overeenkomst
      zijn woonplaats heeft. Voor zover deze waarden dienen tot dekking van de technische voorzieningen voor de vanuit de
      vestigingen in Nederland aangegane verplichtingen moeten zij in Nederland aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel38
  - number: '38.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het
      bepaalde in het derde lid. Daarbij kan tevens worden bepaald dat en in hoeverre de Pensioen- & Verzekeringskamer
      vrijstelling of ontheffing kan verlenen van gegeven voorschriften. Aan een vrijstelling en een ontheffing kunnen
      beperkingen worden gesteld of voorschriften worden verbonden en zij kunnen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel38
  - number: '38.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat en in hoeverre vorderingen op
      herverzekeraars als de waarden, bedoeld in het tweede lid, in aanmerking kunnen worden genomen. Ten aanzien van
      deze waarden is het derde lid, laatste volzin, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel38
  - number: '39.1'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de vestigingen in Nederland
      aangegane verplichtingen uit of krachtens overeenkomsten van natura-uitvaartverzekering, worden als zodanig door de
      verzekeraar geadministreerd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel39
  - number: '39.2'
    text: |-
      In een der staten, bedoeld in [artikel 33][ref1], vermeldt de verzekeraar de bedragen die de in het eerste lid
      bedoelde waarden per categorie, als aangegeven in de desbetreffende staat, in totaal belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel33
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '40.1'
    text: |-
      Een verzekeraar dient te beschikken over een solvabiliteitsmarge die ten minste een bedrag beloopt dat wordt
      berekend op de wijze, voorgeschreven bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40
  - number: '40.2'
    text: |-
      Een derde gedeelte van de overeenkomstig het eerste lid berekende solvabiliteitsmarge vormt het garantiefonds. Het
      garantiefonds beloopt evenwel ten minste € 45 378,02.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40
  - number: '40.3'
    text: In afwijking van het eerste lid beloopt de solvabiliteitsmarge ten minste het minimum bedrag van het garantiefonds.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40
  - number: '40.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke vermogensbestanddelen de solvabiliteitsmarge
      en het garantiefonds kunnen vormen en welke vermogensbestanddelen daarbij een aftrek dienen te vormen. Voorts
      wordt vermeld de mate waarin en de voorwaarden waaronder het in de eerste volzin bepaalde geschiedt. De Pensioen- &
      Verzekeringskamer kan tegen de waardering van de vermogensbestanddelen bedenkingen naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40
  - number: '40.5'
    text: |-
      Indien een verzekeraar weet of redelijkerwijze kan voorzien dat zijn solvabiliteitsmarge niet voldoet of zal
      voldoen aan de eisen die daaraan krachtens het eerste of derde lid zijn gesteld, doet hij hiervan terstond aan de
      Pensioen- & Verzekeringskamer mededeling.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40
  - number: 40a.1
    text: |-
      Een verzekeraar die voornemens is een bijkantoor te openen buiten Nederland, stelt de Pensioen- & Verzekeringskamer
      daarvan schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.2
    text: 'De kennisgeving geschiedt onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.2.a
    text: de staat waarin de verzekeraar voornemens is het bijkantoor te openen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.2.b
    text: |-
      een programma van werkzaamheden, met betrekking waartoe bij ministeriële regeling nadere regels worden gesteld en
      waarin met name de aard van de overeenkomsten van natura-uitvaartverzekering die door het bijkantoor zullen worden
      gesloten en de voorziene organisatiestructuur – met inbegrip van de financiële administratie en de interne controle
      – ten behoeve van het bijkantoor zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.2.c
    text: het adres van het bijkantoor; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.2.d
    text: |-
      de naam en het adres van de vertegenwoordiger en, zo de vertegenwoordiger rechtspersoon is, de naam en het adres
      van de natuurlijke persoon, bedoeld in [artikel 40c, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40c
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 40c
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 40a.3
    text: |-
      De verzekeraar doet de in het tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de Pensioen-
      & Verzekeringskamer zulks verlangt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.4
    text: |-
      Indien de verzekeraar, gezien de werkzaamheden die hij vanuit het bijkantoor voornemens is te verrichten, niet
      voldoet of naar het oordeel van de Pensioen- & Verzekeringskamer niet zal kunnen voldoen aan de bij of krachtens
      deze wet gestelde eisen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.4.a
    text: |-
      de deskundigheid, de voornemens, de handelingen of de antecedenten van de personen die het dagelijks beleid
      van de verzekeraar bepalen of van de vertegenwoordiger en, zo de vertegenwoordiger rechtspersoon is, de
      deskundigheid, de voornemens, de handelingen of de antecedenten van de natuurlijke persoon, bedoeld in
      [artikel 40c, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40c
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 40c
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 40a.4.b
    text: de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.4.c
    text: de solvabiliteitsmarge;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.4.d
    text: de administratieve organisatie; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.4.e
    text: de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40a.5
    text: |-
      De Pensioen- & Verzekeringskamer maakt binnen zes weken na ontvangst van de kennisgeving, bedoeld in het
      eerste lid, haar beslissing over het verlenen van toestemming voor het openen van het bijkantoor bekend aan de
      verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40a
  - number: 40b.1
    text: |-
      Een verzekeraar meldt een wijziging van de gegevens, bedoeld in artikel 40a, tweede lid, onderdelen b tot en met d,
      ten minste een maand tevoren schriftelijk aan de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40b
  - number: 40b.2
    text: |-
      De verzekeraar doet de in het eerste lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de Pensioen-
      & Verzekeringskamer zulks verlangt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40b
  - number: 40b.3
    text: |-
      Indien de verzekeraar beschikt over de ingevolge artikel 40 vereiste solvabiliteitsmarge en de Pensioen- &
      Verzekeringskamer geen bedenkingen heeft tegen de wijziging maakt zij dit aan de verzekeraar bekend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40b
  - number: 40b.4
    text: |-
      Indien het voornemen bestaat om de bedrijfsuitoefening vanuit het bijkantoor te staken, stelt de verzekeraar de
      Pensioen- & Verzekeringskamer daarvan ten minste een maand tevoren schriftelijk in kennis. Zodra de verzekeraar
      zijn voornemen uitvoert, meldt hij dit onverwijld aan de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40b
  - number: 40c.1
    text: |-
      De vertegenwoordiger, bedoeld in artikel 40a, heeft ten aanzien van de uitoefening van het verzekeringsbedrijf
      vanuit het bijkantoor van rechtswege alle bevoegdheden die de verzekeraar bezit, tenzij het recht van de staat
      waar het bijkantoor is gevestigd zich daartegen verzet. Hij maakt daarvan gebruik voor zover de Pensioen- &
      Verzekeringskamer zulks verlangt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40c
  - number: 40c.2
    text: |-
      Is de vertegenwoordiger een rechtspersoon, dan wijst hij op zijn beurt een natuurlijk persoon aan die hem bij
      uitsluiting van ieder ander vertegenwoordigt bij de uitoefening van zijn bevoegdheden en bij de nakoming van zijn
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40c
  - number: 40c.3
    text: |-
      Artikel 18, eerste en tweede lid, is van overeenkomstige toepassing op de natuurlijke persoon die als
      vertegenwoordiger is aangesteld en op de natuurlijke persoon, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel40c
  - number: '41'
    text: |-
      Een verzekeraar met zetel buiten Nederland mag vanuit de bijkantoren in Nederland geen ander bedrijf dan het
      natura-uitvaartverzekeringsbedrijf uitoefenen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel41
  - number: '42.1'
    text: |-
      Ontslag van de vertegenwoordiger is niet geldig tenzij het gepaard gaat met de aanstelling van een opvolger
      met gebruikmaking van het model, bedoeld in [artikel 21, tweede lid][ref1]. Het ontslag gaat niet in voordat
      een akte van ontslag en de akte van aanstelling van de opvolger aan de Pensioen- & Verzekeringskamer zijn
      overgelegd en zij aan het bestuur van de verzekeraar heeft meegedeeld dat zij tegen het ontslag geen bedenkingen
      heeft. Is de opvolger rechtspersoon, dan doet de verzekeraar de akte van aanstelling vergezeld gaan van de
      statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister en de akte van
      aanstelling van de natuurlijke persoon, bedoeld in [artikel 23, vijfde lid][ref2], opgemaakt overeenkomstig
      [artikel 21, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel21
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '42.2'
    text: |-
      De vertegenwoordiger die heeft bedankt, behoudt zijn hoedanigheid totdat hij van zijn bedanken kennis heeft gegeven
      aan de Pensioen- & Verzekeringskamer en zij aan het bestuur van de verzekeraar heeft meegedeeld dat zij daartegen
      geen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel42
  - number: '43.1'
    text: |-
      De vertegenwoordiger houdt van rechtswege op vertegenwoordiger te zijn vanaf de dag van het op hem van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, de verlening van surséance van
      betaling, de faillietverklaring, de ontbinding, bedoeld in artikel 19 van Boek 2 van het Burgerlijk Wetboek, de
      onderbewindstelling van één of meer van de goederen, bedoeld in titel 19 van Boek 1 van het Burgerlijk Wetboek, of
      de ondercuratelestelling.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel43
  - number: '43.2'
    text: |-
      De aanwijzing, bedoeld in [artikel 23, vijfde lid][ref1], vervalt van rechtswege vanaf de dag
      van het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen,
      de verlening van surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in
      [artikel 19 van Boek 2 van het Burgerlijk Wetboek][ref2], de onderbewindstelling van één of meer van de goederen,
      bedoeld in [titel 19 van Boek 1 van het Burgerlijk Wetboek][ref3], of de ondercuratelestelling van de aangewezen
      natuurlijke persoon alsmede vanaf de dag van verlening van surséance van betaling of faillietverklaring van de
      vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0002656
  - number: '44.1'
    text: |-
      Van het overlijden, het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, de
      surséance van betaling, de faillietverklaring, de ontbinding, bedoeld in artikel 19 van Boek 2 van het
      Burgerlijk Wetboek, de onderbewindstelling van één of meer van de goederen, bedoeld in titel 19 van Boek 1 van
      het Burgerlijk Wetboek, of de ondercuratelestelling van de vertegenwoordiger of de natuurlijke persoon, bedoeld
      in [artikel 23, vijfde lid][ref1], alsmede van het ontslag van deze natuurlijke persoon geeft de verzekeraar
      onderscheidenlijk de vertegenwoordiger binnen een week aan de Pensioen- & Verzekeringskamer kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '44.2'
    text: |-
      In de gevallen, genoemd in het eerste lid, alsook in het geval dat de vertegenwoordiger of de natuurlijke persoon,
      bedoeld in [artikel 23, vijfde lid][ref1], heeft bedankt, stelt de verzekeraar of wijst de vertegenwoordiger binnen
      een door de Pensioen- & Verzekeringskamer te bepalen termijn een nieuwe vertegenwoordiger onderscheidenlijk een
      ander natuurlijk persoon aan. Artikel 21, eerste lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '44.3'
    text: |-
      Zolang de vertegenwoordiger ontbreekt, wordt de verzekeraar geacht zijn woonplaats te hebben ten
      parkette van de officier van justitie bij de rechtbank binnen welker rechtsgebied de verzekeraar volgens
      [artikel 23, zesde lid][ref1], het laatst zijn woonplaats had, of anders ten parkette van de officier van justitie
      bij de rechtbank binnen welker rechtsgebied de Pensioen- & Verzekeringskamer is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '45.1'
    text: |-
      Een verzekeraar houdt voor zijn vanuit de bijkantoren in Nederland aangegane verplichtingen uit overeenkomsten van
      natura-uitvaartverzekering toereikende technische voorzieningen aan. Rekening houdend met alle financiële aspecten
      van zijn onderneming stelt hij de premies voor te sluiten overeenkomsten van natura-uitvaartverzekering op adequate
      wijze vast. Bij of krachtens algemene maatregel van bestuur kunnen ter zake van het bepaalde in dit lid nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel45
  - number: '45.2'
    text: |-
      De technische voorzieningen worden volledig door waarden gedekt. Ten aanzien van deze waarden kunnen bij of
      krachtens algemene maatregel van bestuur regels worden gesteld. De Pensioen- & Verzekeringskamer kan tegen de
      aard en de waardering van deze waarden bedenkingen naar voren brengen, aan welke bedenkingen de verzekeraar dient
      tegemoet te komen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel45
  - number: '45.3'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen moeten in toereikende mate kunnen worden geïnd
      of te gelde gemaakt in de muntsoort van de staat waarin de verzekerde ten tijde van het sluiten van de overeenkomst
      zijn woonplaats heeft. Deze waarden moeten in Nederland aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel45
  - number: '45.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het
      bepaalde in het derde lid. Daarbij kan tevens worden bepaald dat en in hoeverre de Pensioen- & Verzekeringskamer
      vrijstelling of ontheffing kan verlenen van gegeven voorschriften. Aan een vrijstelling en een ontheffing kunnen
      beperkingen worden gesteld of voorschriften worden verbonden en zij kunnen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel45
  - number: '45.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat en in hoeverre vorderingen op
      herverzekeraars als de waarden, bedoeld in het tweede lid, in aanmerking kunnen worden genomen. Deze waarden
      behoeven niet in Nederland aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel45
  - number: '46'
    text: |-
      Ten aanzien van de waarden die dienen tot dekking van de technische voorzieningen is [artikel 39][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel39
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '47.1'
    text: |-
      Een verzekeraar dient voor het natura-uitvaartverzekeringsbedrijf dat hij vanuit de bijkantoren in Nederland
      uitoefent, te beschikken over een solvabiliteitsmarge ten aanzien waarvan [artikel 40][ref1] van overeenkomstige
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '47.2'
    text: De waarden die de solvabiliteitsmarge vertegenwoordigen, dienen in Nederland aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel47
  - number: '48'
    text: |-
      Een verzekeraar voert hier te lande de administratie met betrekking tot de bijkantoren in Nederland en bewaart hier
      te lande de desbetreffende zakelijke gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel48
  - number: '49.1'
    text: 'Een verzekeraar met zetel buiten Nederland, die diensten verricht naar Nederland, dient:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: 49.1.a
    text: naar het recht van de staat van zijn zetel rechtspersoon te zijn;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: 49.1.b
    text: |-
      in de staat van zijn zetel bevoegd te zijn tot uitoefening van het natura-uitvaartverzekeringsbedrijf en dit
      bedrijf vanuit een vestiging in die staat daadwerkelijk uit te oefenen; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: 49.1.c
    text: |-
      met betrekking tot het gehele door hem uitgeoefende natura-uitvaartverzekeringsbedrijf te beschikken over een
      solvabiliteitsmarge, die ten minste overeenkomt met de ingevolge [artikel 40][ref1] vereiste solvabiliteitsmarge.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '49.2'
    text: |-
      De verzekeraar die voornemens is voor de eerste maal diensten te verrichten naar Nederland, legt, onder vermelding
      van de adressen van zijn zetel en van de vestiging van waaruit hij de diensten wenst te verrichten, aan de
      Pensioen- & Verzekeringskamer over:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: 49.2.a
    text: |-
      een authentiek afschrift van de akte van oprichting, een exemplaar van zijn statuten alsmede een lijst met namen en
      adressen van zijn bestuurders en commissarissen; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: 49.2.b
    text: bescheiden waaruit blijkt dat de verzekeraar voldoet aan de in het eerste lid gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: '49.3'
    text: |-
      De verzekeraar kan het verrichten van diensten aanvangen vanaf de officieel bevestigde datum van ontvangst door de
      Pensioen- & Verzekeringskamer van de in het tweede lid bedoelde bescheiden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel49
  - number: '50'
    text: |-
      Een verzekeraar die diensten verricht naar Nederland, dient binnen zes maanden na afloop van het boekjaar bij de
      Pensioen- & Verzekeringskamer een opgave in van de in dat boekjaar uit hoofde van het verrichten van diensten naar
      Nederland geboekte premies, zonder aftrek van herverzekering. Het model van de opgave wordt door de Pensioen- &
      Verzekeringskamer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel50
  - number: '51.1'
    text: |-
      Een verzekeraar die bij het verrichten van diensten naar Nederland in strijd handelt met de belangen van degenen
      die als verzekeringnemers of verzekerden zullen worden betrokken bij overeenkomsten van natura-uitvaartverzekering
      of inbreuk maakt op hier te lande geldende voorschriften maakt daaraan op verzoek van de Pensioen- &
      Verzekeringskamer een einde.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel51
  - number: '51.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan aan een verzekeraar voorschriften of een verbod opleggen ter zake van
      acquisitie met betrekking tot overeenkomsten van natura-uitvaartverzekering, door de verzekeraar te sluiten bij het
      verrichten van diensten naar Nederland. De voorschriften en het verbod kunnen slechts worden opgelegd in het belang
      van degenen die als verzekeringnemers of verzekerden zullen worden betrokken bij deze overeenkomsten of indien de
      verzekeraar inbreuk maakt op hier te lande geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel51
  - number: '51.3'
    text: |-
      Van het besluit van de Pensioen- & Verzekeringskamer, houdende voorschriften of een verbod ter zake van acquisitie,
      en de intrekking daarvan, wordt in de *Staatscourant* mededeling gedaan zodra de beroepstermijn is verstreken of,
      indien beroep is ingesteld, zodra op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel51
  - number: '51.4'
    text: |-
      Het is verboden in Nederland te bemiddelen bij of op andere soortgelijke wijze mee te werken aan de voorbereiding
      of de totstandkoming van overeenkomsten van natura-uitvaartverzekering met betrekking waartoe aan een verzekeraar
      een verbod van acquisitie is opgelegd, dan wel te handelen in strijd met de voorschriften of het verbod, opgelegd
      ingevolge het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel51
  - number: '52.1'
    text: |-
      Een verzekeraar met zetel in Nederland kan slechts met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer en bij akte zijn rechten en verplichtingen uit een of meer overeenkomsten van natura-
      uitvaartverzekering:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
  - number: 52.1.a
    text: |-
      gesloten vanuit een vestiging in Nederland overdragen aan een andere verzekeraar of aan een levensverzekeraar met
      vestiging in Nederland in het kader van diens bedrijfsuitoefening vanuit een vestiging in Nederland;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
  - number: 52.1.b
    text: |-
      gesloten vanuit een bijkantoor in een andere staat overdragen aan een andere verzekeraar of levensverzekeraar in
      het kader van diens bedrijfsuitoefening vanuit een vestiging in Nederland indien de wetgeving van de staat van
      het bijkantoor voorziet in een dergelijke overdracht en de toezichthoudende autoriteit in die staat, voor zover
      aanwezig, daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
  - number: '52.2'
    text: |-
      Een verzekeraar met zetel buiten Nederland kan slechts met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer en bij akte zijn rechten en verplichtingen uit een of meer overeenkomsten van natura-
      uitvaartverzekering, gesloten vanuit een bijkantoor in Nederland, overdragen aan een andere verzekeraar of
      levensverzekeraar in het kader van diens bedrijfsuitoefening vanuit een vestiging in Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
  - number: '52.3'
    text: |-
      Indien de wetgeving van een andere staat niet voorziet in een toestemmingsprocedure voor een verzekeraar met
      zetel aldaar tot overdracht van zijn rechten en verplichtingen uit een of meer overeenkomsten van natura-
      uitvaartverzekering, gesloten vanuit een bijkantoor in Nederland, aan een andere verzekeraar of aan een
      levensverzekeraar met zetel buiten Nederland, in het kader van diens bedrijfsuitoefening vanuit een bijkantoor
      in Nederland kan de overdracht bij akte plaatsvinden met schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer. De Pensioen- & Verzekeringskamer verleent geen toestemming alvorens de toezichthoudende
      autoriteit, voor zover aanwezig, van de staat van de zetel van de overdragende verzekeraar heeft verklaard met die
      overdracht in te stemmen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
  - number: '52.4'
    text: |-
      In afwijking van het eerste tot en met het derde lid kan een verzekeraar zijn rechten en verplichtingen uit een
      overeenkomst van natura-uitvaartverzekering op schriftelijk verzoek van de verzekeringnemer overdragen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
  - number: '52.5'
    text: |-
      Met overdracht van de rechten en verplichtingen uit alle overeenkomsten van natura-uitvaartverzekering
      wordt gelijkgesteld de overgang van deze rechten en verplichtingen bij een fusie als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1] of bij een splitsing als bedoeld in
      [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '52.6'
    text: |-
      In dit hoofdstuk wordt onder levensverzekeraar verstaan een levensverzekeraar als bedoeld in
      [artikel 1, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: '53.1'
    text: |-
      Een aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot overdracht van rechten en
      verplichtingen gaat vergezeld van een ontwerp-overeenkomst met alle ter toelichting dienende stukken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel53
  - number: '53.2'
    text: |-
      Voor een overdracht aan een verzekeraar of levensverzekeraar met zetel in Nederland verleent de Pensioen- &
      Verzekeringskamer geen toestemming indien deze verzekeraar, mede gelet op de voorgenomen overdracht, niet beschikt
      over de vereiste solvabiliteitsmarge.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel53
  - number: '53.3'
    text: |-
      Voor een overdracht aan een verzekeraar met zetel buiten Nederland in het kader van diens bedrijfsuitoefening
      vanuit een bijkantoor in Nederland verleent de Pensioen- & Verzekeringskamer geen toestemming indien het betrokken
      bijkantoor, mede gelet op de voorgenomen overdracht, niet beschikt over de vereiste solvabiliteitsmarge.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel53
  - number: '53.4'
    text: |-
      Indien de Pensioen- & Verzekeringskamer aanvankelijk al dan niet bedenkingen heeft tegen het ontwerp van de tot de
      overdracht strekkende overeenkomst, maakt zij dit aan de verzekeraar bekend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel53
  - number: '54.1'
    text: |-
      Indien de Pensioen- & Verzekeringskamer tegen het ontwerp aanvankelijk geen bedenkingen heeft of nadat aan deze
      bedenkingen is tegemoetgekomen, doet de verzekeraar van zijn voornemen tot overdracht van rechten en verplichtingen
      mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen wijze. Daarbij wordt
      mededeling gedaan van een door de Pensioen- & Verzekeringskamer vast te stellen termijn, binnen welke de betrokken
      polishouders zich bij de Pensioen- & Verzekeringskamer schriftelijk tegen de overdracht kunnen verzetten.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '54.2'
    text: |-
      Indien een vierde of meer van de polishouders zich binnen de gestelde termijn tegen de overdracht hebben verzet,
      kan een overdracht niet volgen, ook niet ten aanzien van hen die zich tegen de overdracht niet hebben verzet. De
      Pensioen- & Verzekeringskamer maakt dit aan de verzekeraar bekend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '54.3'
    text: |-
      Heeft de Pensioen- & Verzekeringskamer alsnog bedenkingen tegen de overdracht, dan maakt zij deze bedenkingen na
      afloop van de gestelde termijn aan de verzekeraar bekend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '54.4'
    text: |-
      Indien zich niet binnen de gestelde termijn een vierde of meer van de polishouders tegen de overdracht hebben
      verzet en tegen de overdracht ook bij de Pensioen- & Verzekeringskamer geen bedenkingen bestaan of aan deze
      bedenkingen is tegemoetgekomen, verleent de Pensioen- & Verzekeringskamer de verzekeraar toestemming tot de
      overdracht. De overdracht kan dan volgen en is van kracht ten aanzien van alle belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '54.5'
    text: |-
      De verzekeraar die zijn rechten en verplichtingen met toestemming van de Pensioen- & Verzekeringskamer heeft
      overgedragen, doet van de overdracht mededeling in de *Staatscourant* met vermelding van de datum waarop zij is
      geschied. De inhoud van deze publikatie behoeft de voorafgaande toestemming van de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '54.6'
    text: |-
      Indien een verzekeringnemer die lid is van een onderlinge waarborgmaatschappij met zetel in Nederland of van een
      onderneming dan wel instelling op onderlinge grondslag met zetel buiten Nederland, ingevolge de overdracht geen
      overeenkomst van natura-uitvaartverzekering meer bij deze verzekeraar heeft lopen, eindigt zijn lidmaatschap uit
      dien hoofde van rechtswege met ingang van de tweede dag, volgende op die van de dagtekening van de *Staatscourant*
      waarin de publikatie is geplaatst.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '54.7'
    text: |-
      Voor de toepassing van het eerste, tweede of vierde lid wordt onder polishouder verstaan de verzekeringnemer of
      zijn rechtsopvolger.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel54
  - number: '55.1'
    text: |-
      Een verzekeraar met zetel in Nederland kan zich zonder schriftelijke toestemming van de Pensioen- &
      Verzekeringskamer niet omzetten in een andere rechtsvorm.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel55
  - number: '55.2'
    text: |-
      Een aanvraag ter verkrijging van toestemming van de Pensioen- & Verzekeringskamer tot omzetting gaat vergezeld van
      een ontwerp van een notariële akte van omzetting die de nieuwe statuten bevat met alle ter toelichting dienende
      stukken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel55
  - number: '55.3'
    text: |-
      Indien met toestemming van de Pensioen- & Verzekeringskamer omzetting heeft plaatsgevonden, doet de verzekeraar van
      de omzetting mededeling in de *Staatscourant* en op andere door de Pensioen- & Verzekeringskamer te bepalen wijze.
      Voor zover door de verzekeraar in dienstverrichting naar een andere staat overeenkomsten in de uitoefening van het
      natura-uitvaartverzekeringsbedrijf zijn gesloten, doet de verzekeraar van de omzetting tevens mededeling in die
      staat. De inhoud van deze publikaties behoeft de voorafgaande toestemming van de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel55
  - number: '56.1'
    text: |-
      Indien een verzekeraar met zetel in Nederland niet voldoet aan de bij of krachtens [artikel 38][ref1] gestelde
      eisen met betrekking tot de technische voorzieningen, kan de Pensioen- & Verzekeringskamer de vrije beschikking
      door de verzekeraar over zijn waarden, waar zij zich ook bevinden, beperken of hem verbieden om anders dan met
      schriftelijke machtiging van de Pensioen- & Verzekeringskamer te beschikken over deze waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel38
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '56.2'
    text: |-
      Indien een verzekeraar met zetel buiten Nederland niet voldoet aan de bij of krachtens [artikel 45][ref1]
      gestelde eisen met betrekking tot de technische voorzieningen, kan de Pensioen- & Verzekeringskamer de vrije
      beschikking door de verzekeraar over zijn waarden, die betrekking hebben op zijn vanuit Nederland uitgeoefende
      verzekeringsbedrijf, beperken of hem verbieden om anders dan met schriftelijke machtiging van de Pensioen- &
      Verzekeringskamer te beschikken over deze waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel45
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '56.3'
    text: |-
      De beperking of het verbod wordt door de Pensioen- & Verzekeringskamer door middel van een deurwaardersexploot aan
      de verzekeraar bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel56
  - number: '56.4'
    text: |-
      De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel56
  - number: '56.5'
    text: |-
      De Pensioen- & Verzekeringskamer heft de beperking of het verbod op zodra de verzekeraar weer voldoet aan de in het
      eerste lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel56
  - number: '57.1'
    text: |-
      Indien een verzekeraar niet meer beschikt over de vereiste solvabiliteitsmarge, dient hij - tenzij het tweede
      lid van toepassing is - binnen acht weken of zoveel eerder als de Pensioen- & Verzekeringskamer bepaalt, bij de
      Pensioen- & Verzekeringskamer een saneringsplan ter toestemming in, dat aangeeft op welke wijze en binnen welke
      termijn de solvabiliteitsmarge weer op de vereiste omvang zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel57
  - number: '57.2'
    text: |-
      Indien de solvabiliteitsmarge is gedaald of naar het oordeel van de Pensioen- & Verzekeringskamer zal dalen beneden
      het garantiefonds, dient de verzekeraar bij de Pensioen- & Verzekeringskamer binnen een door haar te bepalen
      termijn een financieringsplan ter toestemming in, dat aangeeft hoe op korte termijn de solvabiliteitsmarge weer op
      de vereiste omvang zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel57
  - number: '57.3'
    text: |-
      Ingeval het eerste lid reeds toepassing vond, geeft het financieringsplan tevens aan hoe het saneringsplan waarvoor
      reeds toestemming is verleend, daarin wordt verwerkt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel57
  - number: '57.4'
    text: |-
      De Pensioen- & Verzekeringskamer kan op aanvraag van de verzekeraar wijzigingen in een plan waarvoor toestemming
      is verleend toestaan dan wel, bij gewijzigde omstandigheden, wijzigingen in het plan eisen of de toestemming
      intrekken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel57
  - number: '58'
    text: |-
      Een verzekeraar wiens solvabiliteitsmarge niet voldoet aan de bij of krachtens deze wet gestelde eisen, doet aan
      de Pensioen- & Verzekeringskamer binnen de door haar te bepalen termijn en op de door haar te bepalen wijze opgave
      van de in [artikel 39][ref1] onderscheidenlijk [artikel 46][ref2] bedoelde waarden en van de wijzigingen die daarin
      vervolgens optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel46
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '59.1'
    text: |-
      De Pensioen- & Verzekeringskamer kan in het geval, bedoeld in [artikel 57, eerste lid][ref1], in uitzonderlijke
      omstandigheden, waarbij zij van oordeel is dat de financiële positie van de verzekeraar nog verder zal
      verslechteren, alsook in het geval, bedoeld in [artikel 57, tweede lid][ref2], de vrije beschikking door
      de verzekeraar over zijn waarden, waar zij zich ook bevinden, beperken of hem verbieden om anders dan met
      schriftelijke machtiging van de Pensioen- & Verzekeringskamer te beschikken over deze waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel57
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '57'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '57'
        hoofdstuk: '6'
  - number: '59.2'
    text: |-
      De beslissing waarbij de beperking of het verbod wordt opgelegd, wordt door de Pensioen- & Verzekeringskamer door
      middel van een deurwaardersexploot aan de verzekeraar bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel59
  - number: '59.3'
    text: |-
      De verzekeraar kan de ongeldigheid van een rechtshandeling, verricht in strijd met de beperking of het verbod,
      inroepen indien de wederpartij de maatregel kende of daarvan niet onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel59
  - number: '59.4'
    text: |-
      De Pensioen- & Verzekeringskamer heft de beperking of het verbod op, zodra de verzekeraar weer voldoet aan de bij
      of krachtens deze wet gestelde eisen met betrekking tot de solvabiliteitsmarge.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel59
  - number: '60'
    text: 'De Pensioen- & Verzekeringskamer kan een vergunning intrekken indien de verzekeraar:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
  - number: 60.a
    text: daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
  - number: 60.b
    text: niet meer voldoet aan de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
  - number: 60.c
    text: |-
      niet binnen de ingevolge [artikel 57][ref1] door de Pensioen- & Verzekeringskamer goedgekeurde termijn de
      solvabiliteitsmarge op de vereiste omvang heeft gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel57
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '57'
        hoofdstuk: '6'
  - number: 60.d
    text: |-
      ernstig in gebreke blijft aan verplichtingen, hem bij of krachtens de wet in of buiten Nederland opgelegd, te
      voldoen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
  - number: 60.e
    text: |-
      met zetel in Nederland dan wel, vanuit zijn bijkantoren in Nederland, indien hij zijn zetel buiten Nederland heeft,
      de bedrijfsuitoefening gedurende meer dan zes maanden heeft gestaakt; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
  - number: 60.f
    text: binnen twaalf maanden na de verlening van de vergunning daarvan geen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel60
  - number: '61.1'
    text: |-
      De werking van het besluit tot intrekking van een vergunning wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien de verzekeraar de voorzitter van het College van Beroep voor het bedrijfsleven heeft verzocht
      een voorlopige voorziening te treffen, op dat verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel61
  - number: '61.2'
    text: |-
      De Pensioen- & Verzekeringskamer doet van het besluit in de *Staatscourant* mededeling, zodra de intrekking van
      kracht is geworden. Zij kan, indien zij dit in het belang van verzekeringnemers of verzekerden acht, het besluit
      eveneens op andere door haar te bepalen wijze publiceren.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel61
  - number: '62.1'
    text: |-
      Houdt de verzekeraar op te bestaan, dan vervallen de aan hem verleende vergunningen. Artikel 61, tweede lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel62
  - number: '62.2'
    text: |-
      Herleeft de rechtspersoon vervolgens, dan is [artikel 63][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel63
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '63'
        hoofdstuk: '7'
  - number: '63'
    text: |-
      De intrekking van de vergunning verplicht de verzekeraar zijn bedrijf af te wikkelen,
      tenzij de intrekking gepaard gaat met de verlening van een vergunning als bedoeld in
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1]. De verzekeraar die verplicht is zijn
      bedrijf af te wikkelen, blijft onderworpen aan de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: '64.1'
    text: |-
      Indien de Pensioen- & Verzekeringskamer de vergunning intrekt op grond van
      [artikel 60, onderdelen b, c of d][ref1], beperkt zij de uitoefening van de beschikkingsbevoegdheid door de
      verzekeraar over zijn waarden of verbiedt zij hem om anders dan met haar schriftelijke machtiging over deze waarden
      te beschikken, voor zover zulks niet reeds is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel60
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '60'
        hoofdstuk: '7'
  - number: '64.2'
    text: |-
      Bij de publikatie, bedoeld in [artikel 61, tweede lid][ref1], wordt tevens mededeling gedaan van de beperking
      of het verbod, opgelegd ingevolge het eerste lid of [de artikelen 56, eerste en tweede lid][ref2], en
      [59, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel59
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '61'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '56'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '59'
        hoofdstuk: '6'
  - number: '64.3'
    text: |-
      De verzekeraar kan niet op grond van de beperking of het verbod, opgelegd ingevolge het eerste lid, een beroep
      doen op de ongeldigheid van een rechtshandeling die voor de openbaarmaking is verricht, tenzij de wederpartij de
      beperking onderscheidenlijk het verbod kende of daarvan niet onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel64
  - number: '64.4'
    text: |-
      Indien het besluit tot intrekking wordt vernietigd, heft de Pensioen- & Verzekeringskamer de beperking of het
      verbod, opgelegd ingevolge het eerste lid, op.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel64
  - number: '65.1'
    text: |-
      Een verzoek tot faillietverklaring van een verzekeraar - eigen aangifte daaronder begrepen - wordt niet in
      behandeling genomen zolang de verzekeraar in het bezit is van een vergunning als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '65.2'
    text: |-
      Op een verzoek tot faillietverklaring van een verzekeraar wordt niet beslist dan nadat de rechter de Pensioen- &
      Verzekeringskamer in de gelegenheid heeft gesteld haar gevoelen daaromtrent kenbaar te maken en nadat de vergunning
      is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel65
  - number: '65.3'
    text: De wettelijke bepalingen inzake surséance van betaling zijn op verzekeraars niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel65
  - number: '66.1'
    text: |-
      Wanneer het belang der gezamenlijke schuldeisers bij de afwikkeling van het bedrijf van een verzekeraar een
      bijzondere voorziening vordert, kan de rechtbank binnen welker rechtsgebied de verzekeraar zijn woonplaats heeft,
      op verzoek van de Pensioen- & Verzekeringskamer de noodregeling uitspreken, ongeacht of de verzekeraar over een
      vergunning beschikt of heeft beschikt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.2'
    text: |-
      Bij het uitspreken van de noodregeling benoemt de rechtbank één of meer bewindvoerders. De Pensioen- &
      Verzekeringskamer kan voor de benoeming voordrachten doen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.3'
    text: |-
      De rechtbank verleent aan de bewindvoerders een machtiging. De machtiging strekt zowel tot vereffening van het
      geheel of van een gedeelte van de portefeuille van de verzekeraar als tot overdracht van alle of van een deel van
      zijn rechten en verplichtingen uit of krachtens overeenkomsten van natura-uitvaartverzekering. Zolang nog niet
      blijkt dat de verzekeraar een negatief eigen vermogen heeft, strekt de machtiging mede tot vereffening van het
      vermogen van de onderneming van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.4'
    text: |-
      Ten aanzien van een verzekeraar met zetel buiten Nederland heeft de machtiging betrekking op het vanuit zijn
      bijkantoren in Nederland uitgeoefende verzekeringsbedrijf. Bij of krachtens algemene maatregel van bestuur kan
      worden bepaald welke activa en passiva tot dat bedrijf moeten worden gerekend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.5'
    text: De Pensioen- & Verzekeringskamer zendt een afschrift van haar verzoekschrift aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.6'
    text: |-
      De rechtbank behandelt het verzoek van de Pensioen- & Verzekeringskamer tot het uitspreken van de noodregeling
      met de meeste spoed op een niet openbare terechtzitting op de voet van de rechtspleging in burgerlijke zaken, voor
      zover daarvan bij deze wet niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.7'
    text: |-
      De rechtbank kan inzage nemen of doen nemen van de zakelijke gegevens en bescheiden van de verzekeraar.
      [Artikel 30][ref1] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel30
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '66.8'
    text: |-
      De rechtbank geeft geen beschikking dan nadat de verzekeraar en de Pensioen- & Verzekeringskamer zijn gehoord
      althans behoorlijk zijn opgeroepen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.9'
    text: |-
      De beschikking van de rechtbank wordt met redenen omkleed en wordt, indien de noodregeling wordt uitgesproken, op
      een openbare terechtzitting uitgesproken. De griffier doet van de zakelijke inhoud van de beschikking mededeling in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.10'
    text: |-
      De beschikking is uitvoerbaar bij voorraad, terugwerkend tot aan het begin van de dag waarop zij is uitgesproken,
      niettegenstaande enige daartegen gerichte voorziening.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.11'
    text: |-
      Bij de beschikking bepaalt de rechtbank de duur van de machtiging op ten hoogste anderhalf jaar. Voor het
      verstrijken van de gestelde termijn kunnen de bewindvoerders eenmaal of meermalen verlenging van de geldigheidsduur
      voor ten hoogste anderhalf jaar verzoeken. Het verzoek wordt behandeld op dezelfde wijze als een verzoek tot het
      uitspreken van de noodregeling. Zolang bij de afloop van de geldigheidsduur van de machtiging op een verzoek tot
      verlenging niet is beschikt, blijft de machtiging gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '66.12'
    text: |-
      De Pensioen- & Verzekeringskamer kan een verzoek tot het uitspreken van de noodregeling bij de rechtbank indienen
      zonder tussenkomst van een procureur.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel66
  - number: '67.1'
    text: |-
      Wanneer een verzoek tot het uitspreken van de noodregeling aanhangig is tegelijk met een verzoek tot
      faillietverklaring, wordt de behandeling van het verzoek tot faillietverklaring geschorst totdat op het verzoek tot
      het uitspreken van de noodregeling is beschikt. Indien de rechtbank de noodregeling uitspreekt, vervalt het verzoek
      tot faillietverklaring van rechtswege.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel67
  - number: '67.2'
    text: |-
      Het uitspreken van de noodregeling heeft mede tot gevolg dat de verzekeraar slechts in staat van faillissement kan
      worden verklaard overeenkomstig [artikel 78][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel78
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '78'
        hoofdstuk: '8'
  - number: '67.3'
    text: |-
      De rechtbank kan op verzoek van de bewindvoerders of ambtshalve de noodregeling beëindigen. De griffier doet van de
      intrekking mededeling in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel67
  - number: '67.4'
    text: |-
      De bewindvoerders kunnen een verzoek tot het beëindigen van de noodregeling bij de rechtbank indienen zonder
      tussenkomst van een procureur.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel67
  - number: '67.5'
    text: |-
      Door de beschikking, bedoeld in het derde lid of de mededeling, bedoeld in [artikel 74, vierde lid][ref1],
      vervallen van rechtswege de bevoegdheden, welke de bewindvoerders ingevolge de machtiging, bedoeld in
      [artikel 66][ref2] of de bijzondere machtiging, bedoeld in [artikel 74, eerste lid][ref3], hadden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel74
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '74'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '74'
        hoofdstuk: '8'
  - number: '68'
    text: |-
      Op verzoek van de bewindvoerders benoemt de rechtbank een van haar leden tot rechter-commissaris die
      toezicht houdt op de vereffening welke plaats heeft ingevolge [artikel 72a][ref1]. Met betrekking tot de
      beschikkingen van de rechter-commissaris, gegeven ter uitvoering van het in de eerste volzin bepaalde, zijn de
      [artikelen 66][ref2] en[ 67, eerste lid, van de Faillissementswet][ref3] van overeenkomstige toepassing. Het
      [tweede lid van artikel 67 van die wet][ref4] is van overeenkomstige toepassing voor zover de daarin opgesomde
      artikelen in [artikel 72a][ref5] van overeenkomstige toepassing zijn verklaard. Hetgeen in de genoemde artikelen
      is bepaald met betrekking tot de curator onderscheidenlijk de gefailleerde is van toepassing op de bewindvoerders
      onderscheidenlijk de verzekeraar dan wel het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0007477#Artikel72a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 72a
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0001860
        artikel: '67'
      - id: ref5
        bwb_id: BWBR0007477
        artikel: 72a
        hoofdstuk: '8'
  - number: '69'
    text: |-
      Vanaf het begin van de dag van de uitspraak waarbij de rechtbank de machtiging verleent, mogen aan de in
      [de artikelen 39][ref1] en [46][ref2] bedoelde waarden geen andere waarden worden toegevoegd dan de sindsdien
      ontvangen premies of de met die premies verkregen waarden, voor zover deze dienen tot dekking van de technische
      voorzieningen. Indien faillissement wordt uitgesproken zonder voorafgaande machtiging of later dan vier weken na de
      beëindiging van de machtiging, geldt hetzelfde verbod vanaf de dag van de faillietverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel46
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '70.1'
    text: |-
      Indien de rechtbank de machtiging verleent, oefenen de bewindvoerders bij uitsluiting alle bevoegdheden van de
      bestuurders, de commissarissen of de vertegenwoordiger van de verzekeraar uit.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.2'
    text: De bewindvoerders waken voor de belangen van de gezamenlijke schuldeisers.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.3'
    text: |-
      De bestuurders, de commissarissen of de vertegenwoordiger van de verzekeraar verlenen bij de uitoefening door de
      bewindvoerders van de in het eerste lid bedoelde bevoegdheden alle door hen gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.4'
    text: |-
      Indien meer dan één bewindvoerder is benoemd, is voor de geldigheid van hun handelingen toestemming van de
      meerderheid of bij staking van stemmen een beslissing van de voorzieningenrechter van de rechtbank vereist. De
      bewindvoerder aan wie bij de machtiging, bedoeld in [artikel 66, derde lid][ref1], een bepaalde werkkring is
      aangewezen, is binnen de grenzen daarvan zelfstandig tot handelen bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: '70.5'
    text: |-
      De rechtbank kan te allen tijde een bewindvoerder, na deze en de Pensioen- & Verzekeringskamer gehoord, althans
      behoorlijk opgeroepen te hebben, ontslaan en door een ander vervangen, of aan de bewindvoerder één of meer
      bewindvoerders toevoegen, een en ander op verzoek van de bewindvoerder, de andere bewindvoerders, de Pensioen- &
      Verzekeringskamer of één of meer schuldeisers dan wel ambtshalve.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.6'
    text: |-
      De bewindvoerders kunnen de bestuurders of de vertegenwoordiger van de verzekeraar machtigen bepaalde handelingen
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.7'
    text: |-
      Een besluit van aandeelhouders of leden van een verzekeraar met zetel in Nederland behoeft, om van kracht te zijn,
      de toestemming van de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.8'
    text: |-
      Wordt een besluit van aandeelhouders of leden dat ingevolge de statuten of reglementen van een verzekeraar met
      zetel in Nederland voor een handeling is vereist, niet genomen of verkrijgt dit besluit niet de volgens de statuten
      of reglementen vereiste toestemming, dan kunnen de bewindvoerders dit besluit nemen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.9'
    text: |-
      De bewindvoerders kunnen personen machtigen alle of een deel van de bevoegdheden uit te oefenen die zij ingevolge
      het eerste lid hebben. De bewindvoerders kunnen de rechtbank verzoeken een beloning voor de gemachtigden vast te
      stellen. De bewindvoerders doen van de naam en woonplaats van een door hen gemachtigde alsook van de intrekking van
      een machtiging mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
  - number: '70.10'
    text: |-
      Het loon van de personen, aangewezen ingevolge [artikel 66, zevende lid][ref1], het loon en de verschotten van
      de bewindvoerders, alsmede de overige kosten van de noodregeling worden bepaald door de rechtbank en vormen een
      boedelschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: '71'
    text: |-
      Ingevolge de hun verleende machtiging kunnen de bewindvoerders, ongeacht hetgeen daaromtrent bij de statuten van de
      verzekeraar is bepaald:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel71
  - number: 71.a
    text: |-
      alle nog niet gedane stortingen op de aandelen in het geplaatste kapitaal onderscheidenlijk het waarborgkapitaal
      van een verzekeraar uitschrijven en innen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel71
  - number: 71.b
    text: |-
      naheffingen opleggen en innen tot het in de statuten van een onderlinge waarborgmaatschappij met zetel in Nederland
      of van een onderneming dan wel instelling op onderlinge grondslag met zetel buiten Nederland bepaalde maximum.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel71
  - number: '72.1'
    text: |-
      Het uitspreken van de noodregeling heeft tot gevolg dat de verzekeraar niet kan worden genoodzaakt tot betaling van
      zijn schulden die voor het uitspreken van de noodregeling zijn ontstaan. Alle uit dien hoofde aangevangen executies
      worden geschorst en gelegde beslagen vervallen. [Artikel 36 van de Faillissementswet][ref1] is van overeenkomstige
      toepassing op de in de eerste zin bedoelde schulden.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel36
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '36'
  - number: '72.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op vorderingen als bedoeld in [artikel 80, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel80
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '80'
        hoofdstuk: '8'
  - number: '72.3'
    text: |-
      Onverminderd het bepaalde in [artikel 72a][ref1], geldt het in het eerste lid bepaalde niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel72a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 72a
        hoofdstuk: '8'
  - number: 72.3.a
    text: vorderingen die door pand of hypotheek op goederen van de verzekeraar zijn gedekt;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
  - number: 72.3.b
    text: termijnen van huurkoop.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
  - number: '72.4'
    text: |-
      Voor zover vorderingen die door pand of hypotheek zijn gedekt, niet op de daaraan onderworpen goederen kunnen
      worden verhaald, werkt de uitspraak wel ten aanzien van deze vorderingen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
  - number: '72.5'
    text: |-
      Het uitspreken van de noodregeling werkt niet ten voordele van de borgen en andere medeschuldenaren van de
      verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72
  - number: 72a.1
    text: |-
      De bewindvoerders kunnen uitkeringen doen op vorderingen die niet voortvloeien uit handelingen met de verzekeraar
      na het uitspreken van de noodregeling verricht, voor zover dit gelet op de liquiditeitspositie van de verzekeraar
      verantwoord is te achten en indien is voldaan aan de volgende leden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
  - number: 72a.2
    text: |-
      De bewindvoerders maken een staat op waaruit blijken de aard en het bedrag van de baten en schulden van
      de verzekeraar, de namen en woonplaatsen van de schuldeisers alsmede het bedrag der vorderingen van iedere
      schuldeiser. Een door de bewindvoerders gewaarmerkt afschrift van deze staat wordt ter kosteloze inzage van een
      ieder ter griffie van de rechtbank neergelegd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
  - number: 72a.3
    text: |-
      Op verzoek van de bewindvoerders bepaalt de rechter-commissaris de dag waarop uiterlijk de vorderingen
      moeten worden ingediend, en voorts dag, uur en plaats, waarop de verificatievergadering zal worden
      gehouden. De bewindvoerders geven van deze beschikkingen onmiddellijk aan alle bekende schuldeisers
      schriftelijk kennis en doen daarvan aankondiging in een of meer door de rechter-commissaris aan te wijzen
      dagbladen. De [artikelen 110 tot en met 113 van de Faillissementswet][ref1] zijn van overeenkomstige
      toepassing, met dien verstande dat hetgeen is bepaald met betrekking tot de curator onderscheidenlijk de
      gefailleerde van toepassing is op de bewindvoerders onderscheidenlijk de verzekeraar dan wel het bijkantoor.
      [Artikel 78, vierde lid, onderdeel e][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel78
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '110'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '78'
        hoofdstuk: '8'
  - number: 72a.4
    text: |-
      Een afschrift van de lijst van voorlopig erkende schuldvorderingen en van de lijst van betwiste vorderingen wordt
      door de bewindvoerders ter griffie van de rechtbank neergelegd om aldaar gedurende veertien dagen voorafgaande
      aan de verificatievergadering kosteloos voor een ieder ter inzage te liggen. De bewindvoerders geven alle bekende
      schuldeisers voor het begin van deze periode schriftelijk van de nederlegging bericht waarbij zij een nadere
      oproeping tot de verificatievergadering voegen. Voorts doen de bewindvoerders van de nederlegging mededeling in een
      of meer door de rechter-commissaris aan te wijzen dagbladen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
  - number: 72a.5
    text: |-
      Met betrekking tot de verificatie zijn de [artikelen 119 tot en met 122][ref1], [123 tot en met 127][ref2],
      [129][ref3], [132 tot en met 137][ref4], [260, eerste lid][ref5], [261][ref6] en
      [262, eerste en derde lid, van de Faillissementswet][ref7] van overeenkomstige toepassing. Daarbij zijn de
      bepalingen met betrekking tot de curator onderscheidenlijk de gefailleerde van toepassing op de bewindvoerders
      onderscheidenlijk de verzekeraar. [Artikel 59 van de Faillissementswet][ref8] is van overeenkomstige toepassing
      met uitzondering van het aldaar bepaalde ten aanzien van de vergoeding bedoeld in artikel 63a, derde lid, en de
      vergoeding voor het gebruik, bedoeld in [artikel 63b, vierde lid, van de Faillissementswet][ref9]. In afwijking van
      de in [artikel 127, eerste lid, van de Faillissementswet][ref10] genoemde termijn geldt de termijn die ingevolge
      het derde lid van dit artikel voor de indiening van vorderingen is bepaald. De vorderingen welke opeisbaar worden
      op of na de datum van de beschikking, bedoeld in [artikel 66, eerste lid][ref11], worden geverifieerd voor de
      waarde welke zij hebben op het tijdstip waarop deze vorderingen opeisbaar worden, met dien verstande dat dit ten
      aanzien van vorderingen welke vallen onder de werking van [artikel 74, eerste lid][ref12], slechts geldt voor zover
      deze bepaling niet reeds op deze vorderingen is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel132
      [ref5]: https://wetten.overheid.nl/BWBR0001860#Artikel260
      [ref6]: https://wetten.overheid.nl/BWBR0001860#Artikel261
      [ref7]: https://wetten.overheid.nl/BWBR0001860#Artikel262
      [ref8]: https://wetten.overheid.nl/BWBR0001860#Artikel59
      [ref9]: https://wetten.overheid.nl/BWBR0001860#Artikel63b
      [ref10]: https://wetten.overheid.nl/BWBR0001860#Artikel127
      [ref11]: https://wetten.overheid.nl/BWBR0007477#Artikel66
      [ref12]: https://wetten.overheid.nl/BWBR0007477#Artikel74
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
