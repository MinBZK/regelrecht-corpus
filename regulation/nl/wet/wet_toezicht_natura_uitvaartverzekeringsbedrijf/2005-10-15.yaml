        hoofdstuk: '8'
  - number: 72a.6
    text: |-
      De bestuurders van de verzekeraar dan wel de vertegenwoordigers van het bijkantoor wonen de verificatievergadering
      bij teneinde aldaar alle inlichtingen over de oorzaken van de in [artikel 66, eerste lid][ref1], bedoelde toestand
      en de staat van de boedel te geven die hen door de rechter-commissaris worden gevraagd. De schuldeisers kunnen
      de rechter-commissaris verzoeken omtrent bepaalde door hen op te geven punten inlichtingen aan de bestuurders
      dan wel aan de vertegenwoordigers van het bijkantoor te vragen. De vragen aan de bestuurders dan wel aan de
      vertegenwoordigers van het bijkantoor gesteld en de door hen gegeven antwoorden worden in het proces-verbaal
      opgetekend. In afwijking van het bepaalde in [artikel 121, vierde lid, van de Faillissementswet][ref2] levert het
      proces-verbaal van de verificatievergadering ten aanzien van de verbintenissen van de verzekeraar welke ingevolge
      [artikel 74, eerste lid][ref3], worden overgedragen slechts kracht van gewijsde op voor zover de desbetreffende
      bedingen niet worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel74
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
      - id: ref2
