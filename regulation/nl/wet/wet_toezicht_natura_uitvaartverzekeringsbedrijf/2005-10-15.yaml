  - number: 93e
    text: |-
      Degene jegens wie door Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete
      op te leggen, een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem wegens
      een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen.
      Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93e
  - number: 93f.1
    text: |-
      Indien Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen,
      voornemens is een boete op te leggen, geeft hij dan wel de Pensioen- & Verzekeringskamer de betrokkene daarvan
      kennis onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93f
  - number: 93f.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister, dan wel de
      Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, de betrokkene in de gelegenheid
      om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd,
      tenzij het een overtreding betreft die in de bijlage, of de algemene maatregel van bestuur, bedoeld in
      [artikel 93d][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel93d
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0007477
        artikel: 93d
        hoofdstuk: 10_B
  - number: 93g.1
    text: |-
      Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, legt de
      boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93g
  - number: 93g.2
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93g
  - number: 93g.2.a
    text: het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93g
  - number: 93g.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93g
  - number: 93g.2.c
    text: |-
      de termijn, bedoeld in [artikel 93i, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel93i
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93g
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 93i
        hoofdstuk: 10_B
  - number: 93h.1
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93h
  - number: 93h.2
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 93f, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel93f
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93h
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 93f
        hoofdstuk: 10_B
  - number: 93i.1
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
  - number: 93i.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 93f, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel93f
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 93f
        hoofdstuk: 10_B
  - number: 93i.3
    text: |-
      Indien de boete niet tijdig is betaald, stuurt Onze Minister, dan wel de Pensioen- & Verzekeringskamer indien
      zij de boete heeft opgelegd, schriftelijk een aanmaning om binnen twee weken de boete, verhoogd met de kosten van
      de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de boete, voor zover deze niet binnen de
      gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
  - number: 93i.4
    text: |-
      Bij gebreke van tijdige betaling kan Onze Minister, dan wel de Pensioen- & Verzekeringskamer indien zij de boete
      heeft opgelegd, de boete, verhoogd met de kosten van de aanmaning en van de invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
  - number: 93i.5
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 93i.6
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat,
      dan wel de Pensioen- & Verzekeringskamer indien zij de boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
  - number: 93i.7
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
  - number: 93i.8
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93i
  - number: 93j.1
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvordering is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht](onbekend).
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93j
  - number: 93j.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 93c][ref1] vervalt, indien
      Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, ter zake
      van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel93c
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93j
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 93c
        hoofdstuk: 10_B
  - number: 93k.1
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93k
  - number: 93k.2
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete wordt
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93k
  - number: 93l
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93l
  - number: 93m.1
    text: |-
      Met het oog op de belangen van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen
      betrokken zijn of zullen worden bij overeenkomsten van verzekering, gesloten of te sluiten met de verzekeraar,
      kunnen Onze Minister en de Pensioen- & Verzekeringskamer, onverminderd [artikel 87, eerste en tweede lid][ref1],
      het feit ter zake waarvan de last onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift,
      alsmede de naam, het adres en de woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is
      opgelegd, ter openbare kennis brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel87
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93m
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '87'
        hoofdstuk: '9'
  - number: 93m.2
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93m
  - number: 93n.1
    text: |-
      De Pensioen- & Verzekeringskamer kan, in afwijking van artikel 87, teneinde de naleving van deze wet te bevorderen
      ter openbare kennis brengen: - haar weigering om een aangevraagde vergunning, ontheffing of verklaring van geen
      bezwaar te verlenen, wanneer deze weigering niet meer in beroep kan worden getroffen en de aanvrager handelt als
      was hem de vergunning, ontheffing of verklaring van geen bezwaar verleend;
        - het feit dat een verzekeraar het natura-uitvaartverzekeringsbedrijf uitoefent zonder in het bezit te zijn van de
      ingevolge artikel 11 vereiste vergunning;
        - het feit dat een verzekeraar diensten verricht naar Nederland zonder te hebben voldaan aan de procedure die
      ingevolge artikel 49 is vereist voor verzekeraars met zetel buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93n
  - number: 93o
    text: |-
      Degene jegens wie door de Pensioen- & Verzekeringskamer een handeling is verricht waaraan hij in redelijkheid de
      gevolgtrekking kan verbinden dat de Pensioen- & Verzekeringskamer zijn handelen of nalaten op grond van artikel
      93n ter openbare kennis zal brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt
      hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93o
  - number: 93p.1
    text: |-
      De Pensioen- & Verzekeringskamer geeft, indien zij voornemens is op grond van artikel 93n een feit ter openbare
      kennis te brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93p
  - number: 93p.2
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht](onbekend), is de Pensioen- & Verzekeringskamer
      niet gehouden de betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de
      betrokkene geen adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93p
  - number: 93q
    text: |-
      De beschikking om op grond van artikel 93n een feit ter openbare kennis te brengen vermeldt in ieder geval: - het
      feit dat ter openbare kennis wordt gebracht;
        - de wijze waarop het feit ter openbare kennis wordt gebracht; en
        - de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93q
  - number: 93r
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om op
      grond van artikel 93n een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93r
  - number: 93s
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht](onbekend) treedt de beschikking in werking op de
      dag waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of,
      indien beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het
      adres ook niet met een redelijke inspanning kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93s
  - number: 93t.1
    text: |-
      De bevoegdheid om op grond van artikel 93n een feit ter openbare kennis te brengen vervalt indien ter zake van het
      feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het
      recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht](onbekend).
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93t
  - number: 93t.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in artikel 93n vervalt, indien de Pensioen- &
      Verzekeringskamer het feit reeds ter openbare kennis heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93t
  - number: 93u.1
    text: |-
      De bevoegdheid om op grond van artikel 93n een feit ter openbare kennis te brengen vervalt drie jaren na de dag
      waarop het feit heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93u
  - number: 93u.2
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93u
  - number: 93v
    text: |-
      De werkzaamheden in verband met het op grond van artikel 93n ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93v
  - number: '94.1'
    text: |-
      Verzekeraars die op het tijdstip van inwerkingtreding van deze wet het natura-uitvaartverzekeringsbedrijf
      uitoefenen, vragen binnen zes maanden na dit tijdstip bij de Verzekeringskamer de vergunning aan, die zij ingevolge
      [artikel 11][ref1] van deze wet of [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2]
      behoeven voor de uitoefening van hun bedrijf op genoemd tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '24'
  - number: '94.2'
    text: |-
      Met betrekking tot de aanvraag zijn [de artikelen 12, onderdeel ][ref1], [20, onderdeel ][ref2], en
      [22, eerste lid, onderdeel ][ref3], niet van toepassing, met dien verstande dat de polisvoorwaarden en de
      jaarstukken over het laatstverstreken jaar wel overgelegd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel22
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '94.3'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], maakt de Verzekeringskamer haar beslissing op de aanvraag binnen
      vijftien maanden na het tijdstip van inwerkingtreding van de wet aan de aanvrager bekend. De Verzekeringskamer kan
      deze termijn verlengen. Een afwijzende beslissing staat wat haar gevolgen betreft gelijk met een besluit van de
      Verzekeringskamer tot intrekking van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel15
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '94.4'
    text: |-
      Zolang een verzekeraar als bedoeld in het eerste lid de beslissing van de Verzekeringskamer nog niet heeft
      ontvangen, wordt hij gelijkgesteld met een verzekeraar die de aangevraagde vergunning bezit.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel94
  - number: '95.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 94, eerste lid][ref1], met zetel in Nederland, mag het natura-
      uitvaartverzekeringsbedrijf voortzetten zonder te voldoen aan [artikel 17, eerste lid][ref2], van deze wet of aan
      [artikel 28, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref3] zulks evenwel gedurende ten hoogste
      twaalf maanden na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel28
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '94'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '28'
  - number: '95.2'
    text: |-
      De in het eerste lid bedoelde verzekeraar kan zich gedurende twaalf maanden na het in werking treden van deze wet
      zonder machtiging van de rechter omzetten in een naamloze vennootschap of onderlinge waarborgmaatschappij. Hiertoe
      is een besluit vereist waarop de bepalingen van de wet en de statuten of reglementen over statutenwijziging van
      toepassing zijn. De omzetting geschiedt bij notariële akte die de nieuwe statuten bevat. De verzekeraar doet opgave
      van de omzetting ter inschrijving in de openbare registers waarin hij moet zijn of moet worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel95
  - number: '95.3'
    text: |-
      Indien de verzekeraar die de rechtsvorm van stichting bezit, zich omzet in een onderlinge waarborgmaatschappij,
      dient in de statuten iedere verplichting van de leden of oud-leden om in een tekort bij te dragen te worden
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel95
  - number: '95.4'
    text: |-
      Indien en voor zover statutaire bepalingen de omzetting niet toestaan of een ander orgaan van de verzekeraar dan
      het bestuur zijn medewerking tot omzetting niet verleent, kan niettemin tot omzetting worden besloten door het
      bestuur van de verzekeraar met machtiging van de rechtbank binnen welker rechtsgebied hij statutair is gevestigd,
      gegeven op een daartoe strekkend verzoek van het bestuur van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel95
  - number: '96.1'
    text: |-
      Een verzekeraar als bedoeld in [artikel 94, eerste lid][ref1], wiens solvabiliteitsmarge, zonder dat
      rekening wordt gehouden met de herverzekering van zijn verplichtingen, lager is dan het overeenkomstig
      [artikel 40, eerste lid][ref2], voorgeschreven bedrag, of wiens solvabiliteitsmarge lager is dan het minimum bedrag
      van het garantiefonds, bedoeld in [artikel 40, tweede lid][ref3], is ontheven van de verplichting over de vereiste
      solvabiliteitsmarge onderscheidenlijk over het minimum bedrag van het garantiefonds te beschikken. Deze ontheffing
      geldt tot het einde van het boekjaar waarin aan de vereisten wordt voldaan, doch uiterlijk tot vier jaar na het
      tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel40
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '94'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '96.2'
    text: |-
      Een verzekeraar kan slechts een beroep doen op de ontheffing indien hij beschikt over een door de Verzekeringskamer
      goedgekeurd plan dat aangeeft op welke wijze en binnen welke termijn de solvabiliteitsmarge op de vereiste omvang
      zal worden gebracht. De verzekeraar dient dit plan binnen acht weken na de inwerkingtreding van deze wet bij de
      Verzekeringskamer ter goedkeuring in.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel96
  - number: '96.3'
    text: |-
      De Verzekeringskamer is bevoegd op verzoek van de verzekeraar wijzigingen in een goedgekeurd plan toe te staan dan
      wel, bij gewijzigde omstandigheden, wijzigingen in het plan te eisen of de goedkeuring in te trekken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel96
  - number: '97'
    text: |-
      Ten aanzien van overeenkomsten van natura-uitvaartverzekering die met een onderlinge waarborgmaatschappij zijn
      gesloten voor 26 juli 1976 en waaruit de rechten en verplichtingen na het in werking treden van deze wet worden
      overgedragen, geldt artikel 62, aanhef en onderdeel *a*, van Boek 2 van het Burgerlijk Wetboek van de overdracht
      af, zulks in afwijking van [artikel 47, tweede lid, van de Overgangswet][ref1] voor het nieuwe Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel47
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '47'
  - number: '98'
    text: |-
      Ingeval voor het tijdstip van inwerkingtreding van deze wet de faillietverklaring van een verzekeraar is
      uitgesproken, blijven op het faillissement en op de vereffening of de overdracht van verbintenissen de bepalingen
      van toepassing die voor dat tijdstip golden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel98
  - number: '108'
    text: |-
      Onze Minister van Financiën zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel108
  - number: '109'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel109
  - number: '110'
    text: 'Deze wet wordt aangehaald als: Wet toezicht natura-uitvaartverzekeringsbedrijf.'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel110
