  - number: 93b.3
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93b
  - number: 93c.1
    text: |-
      Onze Minister en de Pensioen- & Verzekeringskamer kunnen een bestuurlijke boete opleggen ter
      zake van overtreding van voorschriften gesteld, bij of krachtens de [artikelen 11][ref1],
      [17, eerste tot en met derde lid][ref2], [17, vierde lid, eerste volzin][ref3], [17, vijfde lid][ref4],
      [18, eerste tot en met vierde lid][ref5], [18a][ref6], [22, eerste lid, onderdeel e][ref7],
      [22, tweede lid][ref8], [23, tweede lid, laatste volzin][ref9],[ 23, derde lid, eerste volzin][ref10],
      [23, derde lid, laatste volzin][ref11],[ 23, vierde lid, tweede volzin][ref12],
      [23, vijfde lid][ref13], [25][ref14], [26, eerste lid, eerste en tweede volzin, 26, tweede lid][ref15],
      __REF015___________________________________________________________________________________________________________
      __, [28, tweede en derde lid][ref17], voor zover het betreft het voorschrift van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref18] en het voorschrift inzage te verlenen in zakelijke
      gegevens en bescheiden, [29, zesde lid, laatste volzin][ref19], [30][ref20], [31, eerste en tweede lid][ref21],
      [31a, eerste en tweede lid][ref22], [32, eerste lid, 32, tweede lid, tweede volzin][ref23],
      [33, eerste tot en met derde lid, vijfde volzin, 33, vijfde en zesde lid, 33, zevende lid, eerste volzin][ref24],
      [33a, eerste lid, eerste en derde volzin, 33a, tweede en derde lid][ref25], [33b][ref26],
      [33c, eerste lid][ref27], [34, eerste en tweede lid][ref28], [35, eerste tot en met vijfde lid][ref29],
      [36, eerste lid, 36, tweede lid, tweede volzin][ref30], [37][ref31], [38, eerste tot en met vijfde lid][ref32],
      [39, eerste en tweede lid,][ref33][40, eerste en derde tot en met vijfde lid][ref34],
      [40a, eerste tot en met derde lid][ref35], [40b, eerste, tweede en vierde lid][ref36],
      [40c, eerste lid, laatste volzin][ref37], [40c, tweede lid][ref38],[41][ref39],
      [44, eerste en tweede lid][ref40], [45, eerste tot en met vierde lid][ref41], [46][ref42],
      [47, eerste en tweede lid][ref43], [48][ref44], [49, eerste tot en met derde lid][ref45], [50][ref46],
      [51, eerste lid, 51, tweede lid, eerste volzin, 51, vierde lid][ref47], [54, eerste en vijfde lid][ref48],
      [55, derde lid][ref49], [56, eerste en tweede lid][ref50], [57, eerste, tweede en vierde lid][ref51], [58][ref52],
      [59, eerste lid][ref53], [63][ref54], [64, eerste lid][ref55], [82, eerste, vierde en zesde lid][ref56],
      [84, achtste lid][ref57], [85, eerste en tweede lid][ref58], [86][ref59], [89, tweede lid][ref60],
      [90, tweede lid][ref61], en [92, eerste lid][ref62], voor zover zij zijn belast met de uitvoering van het toezicht
      ter zake van die artikelen.


