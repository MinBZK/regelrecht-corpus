      - id: ref5
        bwb_id: BWBR0001860
        artikel: '184'
      - id: ref6
        bwb_id: BWBR0001860
        artikel: '184'
      - id: ref7
        bwb_id: BWBR0001860
        artikel: '186'
  - number: 72a.10
    text: |-
      In afwijking van de laatste zin van het zevende lid kan op geverifieerde vorderingen welke opeisbaar
      worden op of na de datum van de beschikking als bedoeld in [artikel 66, eerste lid][ref1], voor zover
      [artikel 74, eerste lid][ref2], niet reeds op deze vorderingen werd toegepast, een uitkering eerst worden gedaan
      zodra deze vorderingen opeisbaar zijn geworden. Tot dat tijdstip wordt een bedrag aan liquide middelen afgezonderd
      tot ten minste het beloop van het totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen
      zullen kunnen worden uitgekeerd, dan wel wordt deze uitkering op andere wijze zeker gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel74
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '74'
        hoofdstuk: '8'
  - number: '73.1'
    text: |-
      Met betrekking tot verrekening en schuldoverneming vinden de [artikelen 234][ref1] en
      [235 van de Faillissementswet][ref2] overeenkomstige toepassing, met dien verstande dat de schuldenaar van de
      verzekeraar die zijn schuld wil verrekenen met een vordering aan order of toonder, gehouden is te bewijzen dat hij
      het papier reeds op het ogenblik der uitspraak, waarbij het verzoek werd toegewezen, te goeder trouw had verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel235
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '235'
  - number: '73.2'
    text: |-
      Met betrekking tot wederkerige overeenkomsten in het algemeen en tot termijnzaken, overeenkomsten van huurkoop,
      huurovereenkomsten en arbeidsovereenkomsten in het bijzonder, waarbij de verzekeraar ten aanzien waarvan de
      noodregeling is uitgesproken, partij is, vinden de [artikelen 236][ref1], [237][ref2], [237][ref3], [238][ref4] en
      [239 van de Faillissementswet][ref5] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel236
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel237
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel237a
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel238
      [ref5]: https://wetten.overheid.nl/BWBR0001860#Artikel239
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '236'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '237'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: 237a
      - id: ref4
        bwb_id: BWBR0001860
        artikel: '238'
      - id: ref5
        bwb_id: BWBR0001860
        artikel: '239'
  - number: '73.3'
    text: |-
      De bewindvoerders kunnen bestuurders, commissarissen en de vertegenwoordiger namens de verzekeraar ontslaan. Bij
      dit ontslag worden de overeengekomen of wettelijke termijnen in acht genomen, met dien verstande echter dat een
      termijn van zes weken in elk geval voldoende is.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel73
  - number: '73.4'
    text: |-
      Met betrekking tot de voldoening van een schuld aan de verzekeraar nadat de noodregeling is uitgesproken, vindt
      [artikel 240 van de Faillissementswet][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel240
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '240'
  - number: '74.1'
    text: |-
      De rechtbank kan tegelijk met de in [artikel 66][ref1] bedoelde machtiging of daarna de bewindvoerders op hun
      verzoek een bijzondere machtiging verlenen die strekt tot een of meer van de volgende handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: 74.1.a
    text: |-
      wijziging, bij de overdracht van rechten en verplichtingen uit of krachtens overeenkomsten van natura-
      uitvaartverzekering, van die overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
  - number: 74.1.b
    text: verkorting van de duur van overeenkomsten van natura-uitvaartverzekering.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
  - number: '74.2'
    text: |-
      Wijzigingen als bedoeld in het eerste lid, onderdeel *a*, kunnen niet tot gevolg hebben dat aan verzekeringnemers
      meer verplichtingen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
  - number: '74.3'
    text: |-
      Ten aanzien van de bijzondere machtiging zijn
      [de artikelen 66, vierde tot en met achtste lid, negende lid, eerste volzin, tiende en elfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: '74.4'
    text: |-
      Zodra overdracht van rechten en verplichtingen krachtens de in [artikel 66][ref1] bedoelde machtiging heeft
      plaatsgevonden, doen de bewindvoerders van deze overdracht en, zo handelingen door hen zijn verricht krachtens de
      in het eerste lid bedoelde bijzondere machtiging, van deze handelingen mededeling in de *Staatscourant* en in ten
      minste drie door de rechtbank aan te wijzen dagbladen. De bewindvoerders kunnen, indien zij dit in het belang van
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen achten, de bedoelde overdracht en handelingen tevens
      op andere wijze publiceren


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: '74.5'
    text: |-
      De overdracht en de wijziging, bedoeld in het eerste lid, onderdeel *a*, worden ten aanzien van alle
      andere belanghebbenden dan de betrokken verzekeraars van kracht met ingang van de tweede dag, volgende
      op die van de dagtekening van de *Staatscourant* waarin de publikatie is geplaatst. Op de overdracht zijn
      [de artikelen 52, eerste, tweede, vierde en vijfde lid][ref1], [53, eerste, tweede en vierde lid][ref2], en
      [54][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel54
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '52'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '53'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '54'
        hoofdstuk: '5'
  - number: '74.6'
    text: |-
      Wijzigingen als bedoeld in het eerste lid, onderdeel a, laten onverlet de uitkeringen die overeenkomstig
      [artikel 72a][ref1] zijn gedaan voor de dag van de indiening van het verzoek om de machtiging als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel72a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 72a
        hoofdstuk: '8'
  - number: 74a.1
    text: |-
      Een vereniging waarvan ten minste 35% van de verzekeringnemers van de verzekeraar ten aanzien waarvan de
      noodregeling is uitgesproken lid is, kan zich aanmelden bij de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74a
  - number: 74a.2
    text: |-
      De bewindvoerders horen de vereniging alvorens zij de bevoegdheden, bedoeld in [artikel 74, eerste lid][ref1],
      uitoefenen, indien deze op een door de bewindvoerders te bepalen moment ten genoegen van de bewindvoerders heeft
      aangetoond dat zij aan de in het eerste lid gestelde vereisten voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel74
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '74'
        hoofdstuk: '8'
  - number: '75'
    text: |-
      Een overdracht van rechten en verplichtingen ingevolge dit hoofdstuk mag geen nadeel toebrengen aan de rechten van
      de overblijvende schuldeisers.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel75
  - number: '77'
    text: |-
      Voor de toepassing van de [artikelen 194][ref1], [342][ref2] en [343 van het Wetboek van Strafrecht][ref3] wordt
      met faillissement gelijkgesteld de rechtstoestand waarin een verzekeraar verkeert zolang te zijnen aanzien de
      noodregeling als bedoeld in [artikel 66][ref4] van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel342
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel343
      [ref4]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '342'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '343'
      - id: ref4
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: '78.1'
    text: |-
      De bewindvoerders dienen, de Pensioen- & Verzekeringskamer gehoord, een verzoek tot faillietverklaring in, indien
      blijkt dat de verzekeraar een negatief eigen vermogen heeft en het met de verleende machtiging te bereiken doel
      is verwezenlijkt of niet meer kan worden verwezenlijkt. De Pensioen- & Verzekeringskamer dient een verzoek tot
      faillietverklaring in indien geen machtiging werd verleend en geen redelijk vooruitzicht meer bestaat dat het met
      een machtiging te bereiken doel alsnog kan worden verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
  - number: '78.2'
    text: |-
      Bij de beoordeling van de omvang van het eigen vermogen van een verzekeraar met zetel buiten Nederland worden
      uitsluitend de activa en passiva in aanmerking genomen die moeten worden gerekend tot het vanuit zijn bijkantoren
      in Nederland uitgeoefende verzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
  - number: '78.3'
    text: |-
      De bewindvoerders onderscheidenlijk de Pensioen- & Verzekeringskamer kunnen een verzoek als bedoeld in de eerste
      volzin onderscheidenlijk de tweede volzin van het eerste lid zonder tussenkomst van een procureur indienen. De
      faillietverklaring wordt uitgesproken ongeacht of de verzekeraar verkeert in een toestand van te hebben opgehouden
      te betalen. Het bepaalde in de eerste titel en in [artikel 284 van de Faillissementswet][ref1] is overigens van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel284
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '284'
  - number: '78.4'
    text: |-
      De noodregeling en de machtiging houden van rechtswege op van kracht te zijn ingeval de verzekeraar in staat van
      faillissement wordt verklaard. Alsdan, zomede indien de faillietverklaring wordt uitgesproken binnen vier weken na
      de beëindiging van de noodregeling, gelden de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
  - number: 78.4.a
    text: |-
      het tijdstip waarop de termijnen, in de [artikelen 43][ref1] en [45 van de Faillissementswet][ref2] vermeld,
      aanvangen, wordt berekend vanaf het tijdstip waarop de beschikking houdende machtiging uitvoerbaar is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel45
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '45'
  - number: 78.4.b
    text: |-
      een beroep op verrekening kan in afwijking van [artikel 53 van de Faillissementswet][ref1] slechts worden gedaan
      indien de vordering en de schuldplichtigheid beide zijn ontstaan voor het tijdstip waarop de beschikking, houdende
      machtiging, uitvoerbaar is geworden, of voortvloeien uit een handeling voor dat tijdstip met de gefailleerde
      verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel53
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '53'
  - number: 78.4.c
    text: |-
      handelingen, ingevolge [artikel 70][ref1] door of namens de bewindvoerders verricht gedurende de tijd dat de
      machtiging van kracht was, worden beschouwd als handelingen van de curator, terwijl boedelschulden, gedurende die
      tijd ontstaan, ook in het faillissement als boedelschulden zullen gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel70
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '70'
        hoofdstuk: '8'
  - number: 78.4.d
    text: |-
      de boedel is niet aansprakelijk voor verbintenissen van de verzekeraar die in strijd met
      [artikel 70, eerste en zesde lid][ref1], zijn aangegaan gedurende de tijd dat de machtiging van kracht was, dan
      voor zover deze daardoor is gebaat;


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel70
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '70'
        hoofdstuk: '8'
  - number: 78.4.e
    text: |-
      vorderingen uit overeenkomsten van natura-uitvaartverzekering kunnen in afwijking van
      [artikel 110, eerste lid, van de Faillissementswet][ref1] worden ingediend door overlegging van de polis of een
      afschrift daarvan, zonder dat de waarde van de vordering behoeft te worden vermeld. Voor zover de curator de
      vordering erkent, stelt hij de omvang daarvan vast;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel110
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '110'
  - number: 78.4.e
    text: |-
      overigens is, voor zover niet reeds ingevolge [artikel 72a][ref1] tot volledige uitvoering gekomen, het bepaalde in
      [titel I van de Faillissementswet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: 72a
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0001860
  - number: 78a
    text: |-
      Indien een faillietverklaring wordt uitgesproken op verzoek van de bewindvoerders dan wel binnen vier weken na
      het einde van de noodregeling, geldt dat het tijdstip waarop de termijnen vermeld in de [artikelen 43][ref1] en
      [45 van de Faillissementswet][ref2] en in [artikel 138, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref3]
      aanvangen, wordt berekend vanaf het tijdstip waarop de noodregeling is uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel138
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '138'
  - number: '79'
    text: |-
      De bewindvoerders brengen tijdens de noodregeling telkens na verloop van drie maanden, alsmede na beëindiging van
      de noodregeling zo spoedig mogelijk verslag omtrent hun werkzaamheden uit aan de rechtbank. Een afschrift van dit
      verslag zenden de bewindvoerders aan Onze Minister en aan de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel79
  - number: '80.1'
    text: |-
      In geval van noodregeling overeenkomstig dit hoofdstuk of van faillissement van een verzekeraar worden de
      boedelschulden, overeenkomstig de bepalingen van de [Faillissementswet][ref1], al naar gelang de aard van de
      betrokken boedelschuld hetzij mede over de in [de artikelen 39][ref2] en [46][ref3] bedoelde waarden omgeslagen,
      hetzij uitsluitend van een bepaalde bate van de boedel afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001860
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel46
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001860
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '80.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid dienen in geval van noodregeling of van faillissement van een
      verzekeraar de waarden, ingevolge [de artikelen 39][ref1] en [46][ref2] geadministreerd voor de vanuit de
      vestigingen in Nederland aangegane verplichtingen uit of krachtens overeenkomsten van natura-uitvaartverzekering,
      uitsluitend tot voldoening van de volgende vorderingen en wel in de hierna vermelde volgorde:


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel46
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 80.2.a
    text: |-
      de vorderingen van werknemers en gewezen werknemers alsmede de vorderingen van hun nabestaanden met betrekking tot
      reeds vervallen termijnen van pensioen, voor zover de vordering niet ouder is dan een jaar;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
  - number: 80.2.b
    text: |-
      de vorderingen van werknemers, niet zijnde bestuurders van de verzekeraar waarbij zij in dienst zijn, en gewezen
      werknemers alsmede de vorderingen van hun nabestaanden met betrekking tot in de toekomst tot uitkering komende
      termijnen van toegezegd pensioen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
  - number: 80.2.c
    text: |-
      de vorderingen van werknemers met betrekking tot het loon over het voorafgaande jaar en hetgeen over het lopende
      jaar verschuldigd is, benevens het bedrag van de verhoging van dat loon ingevolge artikel 625 van Boek 7 van het
      Burgerlijk Wetboek alsmede het bedrag van de uitgaven, door de werknemer voor de verzekeraar als werkgever gedaan,
      en de bedragen, door de verzekeraar aan de werknemer krachtens titel 10 van Boek 7 van het Burgerlijk Wetboek in
      verband met de beëindiging van de arbeidsovereenkomst verschuldigd;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
  - number: 80.2.d
    text: |-
      de vorderingen en rechten betreffende prestaties, die zijn ontstaan of nog zullen ontstaan uit overeenkomsten van
      natura-uitvaartverzekering, gesloten vanuit een vestiging in Nederland.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
  - number: '80.3'
    text: |-
      Onder de in het tweede lid, onderdeel *d*, bedoelde vorderingen worden mede begrepen de vorderingen ter zake van
      prestaties krachtens lopende overeenkomsten van natura-uitvaartverzekering, ontstaan op of na de dag waarop de
      machtiging, bedoeld in [artikel 66][ref1], is verleend dan wel, indien een faillissement wordt uitgesproken zonder
      voorafgaande machtiging of later dan vier weken na de beëindiging van de machtiging, op of na de dag waarop het
      faillissement is uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '66'
        hoofdstuk: '8'
  - number: '80.4'
    text: |-
      Op de ingevolge [de artikelen 39][ref1] en [46][ref2] geadministreerde waarden voor de vanuit de vestigingen in
      Nederland aangegane verplichtingen uit of krachtens overeenkomsten van natura-uitvaartverzekering zijn, behoudens
      vorderingen die door pand of hypotheek op deze waarden zijn gedekt, geen andere vorderingen verhaalbaar, tenzij
      vaststaat dat alle vorderingen, genoemd in het tweede lid, zullen kunnen worden voldaan en dat in de toekomst
      zodanige vorderingen niet meer zullen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel46
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '80.5'
    text: |-
      Ingeval de in het tweede lid bedoelde vorderingen niet volledig uit de ingevolge [de artikelen 39][ref1] en
      [46][ref2] geadministreerde waarden voor de vanuit de vestigingen in Nederland aangegane verplichtingen uit of
      krachtens overeenkomsten van natura-uitvaartverzekering zijn voldaan, hebben de betrokken schuldeisers voor het
      overblijvende deel van hun vorderingen te zamen met de overige schuldeisers een gelijk recht om naar evenredigheid
      van ieders vordering uit de overige goederen te worden voldaan, behoudens de door de wet erkende redenen van
      voorrang.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel46
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '82.1'
    text: |-
      Het is iedere natuurlijke persoon of rechtspersoon verboden, anders dan na verkregen verklaring van geen bezwaar,
      een gekwalificeerde deelneming in een verzekeraar met zetel in Nederland te houden, te verwerven of te vergroten
      dan wel enige zeggenschap verbonden aan een gekwalificeerde deelneming in een verzekeraar met zetel in Nederland
      uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: '82.2'
    text: 'Een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid wordt verleend, tenzij:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: 82.2.a
    text: |-
      de Pensioen- & Verzekeringskamer van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een invloed
      op de betrokken verzekeraar die in strijd is met het belang van degenen die als verzekeringnemers of verzekerden
      betrokken zijn of zullen worden bij overeenkomsten van natura-uitvaartverzekering, gesloten of te sluiten door een
      rechtstreeks of middellijk bij de handeling betrokken verzekeraar;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: 82.2.b
    text: |-
      de Pensioen- & Verzekeringskamer van oordeel is dat de handeling ertoe zou leiden of zou kunnen leiden
      dat de betrokken verzekeraar behoort of zou gaan behoren tot een groep waarbinnen de formele of feitelijke
      zeggenschapsstructuur in zodanige mate ondoorzichtig is dat deze een belemmering zou vormen voor het adequaat
      uitoefenen van toezicht op de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: 82.2.c
    text: |-
      de Pensioen- & Verzekeringskamer van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste
      ontwikkeling van de financiële sector;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: 82.2.d
    text: de Pensioen- & Verzekeringskamer van oordeel is dat een integere bedrijfsvoering onvoldoende is gewaarborgd; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: 82.2.e
    text: |-
      Onze Minister van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling van
      de financiële sector.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: '82.3'
    text: |-
      Aan een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid kunnen op grond van de
      overwegingen als bedoeld in het tweede lid, onderdelen a, b, c en d, onderscheidenlijk het tweede lid, onderdeel e,
      beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: '82.4'
    text: |-
      Ingeval het houden, het verwerven of het vergroten van een gekwalificeerde deelneming in een verzekeraar als
      bedoeld in het eerste lid is verricht, zonder dat voor die handeling een verklaring van geen bezwaar is verkregen
      of de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is de in overtreding zijnde
      natuurlijke persoon of rechtspersoon gehouden binnen een door Onze Minister dan wel vanwege Onze Minister door de
      Pensioen- & Verzekeringskamer te bepalen termijn de verrichte handeling ongedaan te maken dan wel de beperkingen
      alsnog in acht te nemen. Deze verplichting vervalt op het tijdstip waarop en voor zover voor de desbetreffende
      handeling alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in acht genomen beperkingen worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: '82.5'
    text: |-
      Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming in een verzekeraar
      als bedoeld in het eerste lid geschiedt, zonder dat voor het houden, het verwerven of het vergroten van de
      gekwalificeerde deelneming dan wel voor het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde
      deelneming in een verzekeraar als bedoeld in het eerste lid een verklaring van geen bezwaar is verkregen of de
      bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is een mede door de uitgeoefende
      zeggenschap tot stand gekomen besluit vernietigbaar. Het besluit kan worden vernietigd op vordering van Onze
      Minister dan wel vanwege Onze Minister van de Pensioen- & Verzekeringskamer. Het besluit wordt in dat geval door
      de rechtbank, binnen welker rechtsgebied de verzekeraar gevestigd is, vernietigd indien het besluit zonder dat de
      desbetreffende zeggenschap zou zijn uitgeoefend, anders zou hebben geluid dan wel niet zou zijn genomen, tenzij
      voor het tijdstip van de uitspraak alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in acht
      genomen beperkingen worden ingetrokken. De rechtbank regelt voor zover nodig de gevolgen van de vernietiging.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: '82.6'
    text: |-
      Ingeval aan de verklaring van geen bezwaar als bedoeld in het eerste lid verbonden voorschriften niet worden
      nagekomen, kan Onze Minister dan wel vanwege Onze Minister de Pensioen- & Verzekeringskamer een termijn vaststellen
      waarbinnen de in overtreding zijnde natuurlijke persoon dan wel rechtspersoon de niet nagekomen voorschriften
      alsnog moet vervullen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel82
  - number: '83.1'
    text: |-
      Voor het geval van een houder van een verklaring van geen bezwaar als bedoeld in [artikel 82, eerste lid][ref1],
      die aan het hoofd staat van een groep waartoe een of meer verzekeraars als bedoeld in [artikel 1, onderdeel ][ref2],
      en een of meer kredietinstellingen als bedoeld in [artikel 1, eerste lid, onderdeel ][ref3] behoren en waartoe
      ten minste één verzekeraar met zetel in Nederland behoort die een vergunning als bedoeld in [artikel 11][ref4]
      heeft verkregen, kan de Pensioen- & Verzekeringskamer, in overeenstemming met de autoriteit die ingevolge
      de [Wet toezicht kredietwezen 1992][ref5] belast is met het toezicht op kredietinstellingen, op grond van de
      overwegingen als bedoeld in [artikel 82, tweede lid, onderdelen ][ref6], voorschriften formuleren.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007477#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0005792
      [ref6]: https://wetten.overheid.nl/BWBR0007477#Artikel82
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005792
      - id: ref6
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
  - number: '83.2'
    text: |-
      De voorschriften worden overeenkomstig [artikel 82, derde lid][ref1], door Onze Minister aan een verklaring van
      geen bezwaar als bedoeld in [artikel 82, eerste lid][ref2], verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel82
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
  - number: '83.3'
    text: |-
      Indien de voorschriften worden gewijzigd, kan Onze Minister, de Pensioen- & Verzekeringskamer gehoord, dan wel
      in door Onze Minister bepaalde gevallen vanwege Onze Minister de Pensioen- & Verzekeringskamer, de gewijzigde
      voorschriften verbinden aan de verklaring van geen bezwaar die aan een houder als bedoeld in het eerste lid is
      verleend.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel83
  - number: '83.4'
    text: De voorschriften worden bekendgemaakt door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel83
  - number: '84.1'
    text: |-
      Op een aanvraag tot het verkrijgen van een verklaring van geen bezwaar als bedoeld in
      [artikel 82, eerste lid][ref1], wordt beslist door Onze Minister, de Pensioen- & Verzekeringskamer gehoord, dan wel
      in door Onze Minister bepaalde gevallen vanwege Onze Minister door de Pensioen- & Verzekeringskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel82
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
  - number: '84.2'
    text: |-
      Indien een verklaring van geen bezwaar wordt verleend, kan de aanvrager tevens toestemming worden verleend tot
      het vergroten van de gekwalificeerde deelneming, waarbij als bovengrens 20, 33, 50 of 100 procent kan gelden.
      Indien een verklaring van geen bezwaar wordt verleend voor een deelneming in een verzekeraar, kan op verzoek van
      de aanvrager worden bepaald dat de verleende verklaring van geen bezwaar geldt voor alle groepsmaatschappijen
      gezamenlijk, onverminderd [artikel 23 van de Wet toezicht kredietwezen 1992][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel23
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '23'
  - number: '84.3'
    text: |-
      De aanvraag wordt ingediend bij de Pensioen- & Verzekeringskamer. De Pensioen- & Verzekeringskamer zendt de
      aanvraag, vergezeld van haar advies, aan Onze Minister behoudens in de gevallen waarin zij vanwege Onze Minister
      beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: '84.4'
    text: Op de aanvraag wordt binnen dertien weken beslist.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: '84.5'
    text: |-
      De verleende verklaring van geen bezwaar als bedoeld in [artikel 82, eerste lid][ref1], wordt door Onze Minister
      dan wel vanwege Onze Minister door de Pensioen- & Verzekeringskamer aan de betrokken verzekeraar bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel82
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
  - number: '84.6'
    text: |-
      Van de afgifte van een verklaring van geen bezwaar wordt door Onze Minister dan wel vanwege Onze Minister door
      de Pensioen- & Verzekeringskamer mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze Minister of
      de Pensioen- & Verzekeringskamer van oordeel is, dat publikatie zou leiden of zou kunnen leiden tot onevenredige
      bevoordeling of benadeling van bij de beslissing betrokkenen of derden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: '84.7'
    text: |-
      Een verklaring van geen bezwaar kan door Onze Minister, de Pensioen- & Verzekeringskamer gehoord, dan wel in door
      Onze Minister bepaalde gevallen vanwege Onze Minister door de Pensioen- & Verzekeringskamer worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: 84.7.a
    text: op aanvraag van de houder;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: 84.7.b
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van geen bezwaar zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: 84.7.c
    text: |-
      indien niet alsnog binnen de termijn, bedoeld in [artikel 82, zesde lid][ref1], aan alle bij de verklaring van geen
      bezwaar gestelde voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel82
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
  - number: '84.8'
    text: |-
      Indien zich met betrekking tot een verleende verklaring van geen bezwaar omstandigheden voordoen of feiten bekend
      worden welke:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: 84.8.a
    text: |-
      naar het oordeel van de Pensioen- & Verzekeringskamer tot strijd met het belang leiden of zouden kunnen leiden
      van degenen die als verzekeringnemers of verzekerden betrokken zijn of zullen worden bij overeenkomsten van
      natura-uitvaartverzekering, gesloten of te sluiten door een rechtstreeks of middellijk bij de handeling betrokken
      verzekeraar onderscheidenlijk tot een invloed op de betrokken verzekeraar die in strijd is met het belang van
      degenen die als verzekeringnemers of verzekerden betrokken zijn of zullen worden bij overeenkomsten van natura-
      uitvaartverzekering, gesloten of te sluiten door een rechtstreeks of middellijk bij de handeling betrokken
      verzekeraar;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: 84.8.b
    text: |-
      naar het oordeel van de Pensioen- & Verzekeringskamer ertoe leiden of zouden kunnen leiden dat de betrokken
      verzekeraar zou gaan behoren tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige
      mate ondoorzichtig is dat deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de
      verzekeraar;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: 84.8.c
    text: |-
      naar het oordeel van de Pensioen- & Verzekeringskamer ertoe leiden of zouden kunnen leiden dat een integere
      bedrijfsvoering onvoldoende is gewaarborgd, waarbij onder integere bedrijfsvoering wordt verstaan de
      bedrijfsvoering met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: 84.8.d
    text: |-
      naar het oordeel van de Pensioen- & Verzekeringskamer of Onze Minister leiden of zouden kunnen leiden tot een
      ongewenste ontwikkeling van de financiële sector;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: '84.9'
    text: |-
      De wijziging of de intrekking van een verklaring van geen bezwaar als bedoeld in [artikel 82, eerste lid][ref1],
      wordt door Onze Minister dan wel vanwege Onze Minister door de Pensioen- & Verzekeringskamer aan de betrokken
      verzekeraar bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel82
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '82'
        hoofdstuk: '9'
  - number: '84.10'
    text: |-
      Indien de omvang van een deelneming waarvoor een verklaring van geen bezwaar is afgegeven onder de 10 procent
      daalt, vervalt de afgegeven verklaring van geen bezwaar van rechtswege.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: '84.11'
    text: |-
      Van de wijziging of de intrekking van een verklaring van geen bezwaar wordt door Onze Minister dan wel vanwege Onze
      Minister door de Pensioen- & Verzekeringskamer mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze
      Minister of de Pensioen- & Verzekeringskamer van oordeel is, dat publikatie zou leiden of zou kunnen leiden tot
      onevenredige bevoordeling of benadeling van bij de beslissing betrokkenen of derden.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel84
  - number: '85.1'
    text: |-
      Iedere natuurlijke persoon of rechtspersoon stelt de Pensioen- & Verzekeringskamer vooraf in kennis van een
      zodanige wijziging van diens gekwalificeerde deelneming in een verzekeraar met zetel in Nederland:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: 85.1.a
    text: |-
      waardoor de omvang van deze deelneming boven de 20, 33, 50 of 95 procent stijgt, 100 procent wordt dan wel waardoor
      de verzekeraar een dochtermaatschappij wordt;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: 85.1.b
    text: |-
      waardoor de omvang van deze deelneming onder de 10, 20, 33, 50, 95 of 100 procent daalt dan wel waardoor de
      verzekeraar ophoudt een dochtermaatschappij te zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: '85.2'
    text: |-
      Een verzekeraar met zetel in Nederland stelt, voor zover hem bekend, de Pensioen- & Verzekeringskamer in de
      maand juli van elk jaar in kennis van de identiteit van iedere natuurlijke persoon of rechtspersoon die een
      gekwalificeerde deelneming in deze verzekeraar houdt. Tevens stelt de verzekeraar met zetel in Nederland, zodra
      zulks hem bekend wordt, de Pensioen- & Verzekeringskamer in kennis van iedere verwerving, afstoting of wijziging
      van een gekwalificeerde deelneming in deze verzekeraar:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: 85.2.a
    text: |-
      waardoor de omvang van deze deelneming boven de 20, 33, 50 of 95 procent stijgt, 100 procent wordt dan wel waardoor
      de verzekeraar een dochtermaatschappij wordt; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: 85.2.b
    text: |-
      waardoor de omvang van deze deelneming onder de 10, 20, 33, 50, 95 of 100 procent daalt dan wel waardoor de
      verzekeraar ophoudt een dochtermaatschappij te zijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: '85.3'
    text: |-
      De Pensioen- & Verzekeringskamer stelt Onze Minister eens per jaar in kennis van de gegevens waarover zij ingevolge
      het eerste en het tweede lid beschikt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel85
  - number: '86'
    text: |-
      Het is verboden in Nederland te bemiddelen bij of op andere soortgelijke wijze mee te werken aan de voorbereiding
      of de totstandkoming van overeenkomsten van natura-uitvaartverzekering met een verzekeraar die het natura-
      uitvaartverzekeringsbedrijf uitoefent zonder in het bezit te zijn van de ingevolge [artikel 11][ref1] vereiste
      vergunning dan wel die diensten verricht naar Nederland zonder te hebben voldaan aan de procedure die ingevolge
      deze wet is vereist voor verzekeraars met zetel buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '87.1'
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke
      verzekeraars zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een instantie als bedoeld in
      [de artikelen 88, eerste lid][ref1], of [88][ref2], zijn ontvangen, worden niet gepubliceerd en zijn geheim.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel88a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '88'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: 88a
        hoofdstuk: '9'
  - number: '87.2'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie als
      bedoeld in [de artikelen 88, eerste lid][ref1], of [88][ref2], ontvangen, of van gegevens of inlichtingen, bij het
      onderzoek van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te maken of daaraan verder of
      anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel88a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '88'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: 88a
        hoofdstuk: '9'
  - number: '87.3'
    text: |-
      Het eerste en tweede lid laten, ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '87.4'
    text: |-
      Het eerste en tweede lid laten evenzo, ten aanzien van degene op wie het tweede lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en van
      [artikel 66 van de Faillissementswet][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een verzekeraar die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden. Het in de vorige volzin bepaalde geldt niet voor gegevens of inlichtingen die
      betrekking hebben op verzekeraars die betrokken zijn of zijn geweest bij een poging de desbetreffende verzekeraar
      in staat te stellen zijn bedrijf voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: '87.5'
    text: |-
      De Pensioen- & Verzekeringskamer is, in afwijking van het eerste en tweede lid, bevoegd met gebruikmaking van
      gegevens of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, mededelingen
      te doen mits deze niet kunnen worden herleid tot afzonderlijke verzekeraars.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel87
  - number: '88.1'
    text: |-
      De Pensioen- & Verzekeringskamer kan, in afwijking van [artikel 87, eerste en tweede lid][ref1], gegevens
      of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan
      Nederlandse of buitenlandse overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege
      aangewezen instanties die belast zijn met het toezicht op financiële markten of op natuurlijke personen en
      rechtspersonen die op die markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel87
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '87'
        hoofdstuk: '9'
  - number: 88.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: '88.2'
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      overheidsinstantie dan wel van een buitenlandse van overheidswege aangewezen instantie, die is belast met het
      toezicht op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn,
      verstrekt de Pensioen- & Verzekeringskamer deze niet aan een Nederlandse of buitenlandse instantie als bedoeld in
      het eerste lid, tenzij de buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: '88.3'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan degene die de gegevens of inlichtingen op grond
      van dat lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, mag dat verzoek slechts worden ingewilligd:
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.3.a
    text: voor zover het beoogde gebruik niet in strijd is met het eerste of tweede lid; dan wel
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.3.b
    text: |-
      voor zover die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of
      inlichtingen zou kunnen verkrijgen; alsmede
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88.3.c
    text: |-
      pas na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88
  - number: 88a.1
    text: |-
      De Pensioen- & Verzekeringskamer kan, in afwijking van [artikel 87, eerste en tweede lid][ref1],
      gegevens of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak,
      verstrekken aan een rechter-commissaris voor zover die belast is met het toezicht uit hoofde van
      [artikel 64 van de Faillissementswet][ref2] op de curator die betrokken is bij het beheer en de vereffening van de
      failliete boedel van een verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel64
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '87'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '64'
  - number: 88a.2
    text: 'De Pensioen- & Verzekeringskamer verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88a
  - number: 88a.2.a
    text: |-
      indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88a
  - number: 88a.2.b
    text: |-
      indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van
      Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële
      markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze instanties niet
      instemmen met het verstrekken van de gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88a
  - number: 88a.3
    text: |-
      [Artikel 87, eerste tot en met vierde lid][ref1], is van overeenkomstige toepassing met betrekking tot de op grond
      van het eerste lid verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel87
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '87'
        hoofdstuk: '9'
  - number: '89.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, kan de Pensioen- & Verzekeringskamer
      ten behoeve van een instantie die werkzaam is in een staat die met Nederland partij is bij een verdrag of die met
      Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die staat belast
      is met de uitvoering van wettelijke regelingen inzake het toezicht op het natura-uitvaartverzekeringsbedrijf,
      inlichtingen vragen aan of een onderzoek instellen of doen instellen bij een ieder die ingevolge deze wet onder
      haar toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of
      inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel89
  - number: '89.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door de Pensioen- & Verzekeringskamer te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel89
  - number: '90.1'
    text: |-
      De Pensioen- & Verzekeringskamer kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 89, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel89
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '89'
        hoofdstuk: '9'
  - number: '90.2'
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 89, eerste lid][ref1], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel89
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '89'
        hoofdstuk: '9'
  - number: '90.3'
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel90
  - number: '91.1'
    text: |-
      De kosten van de Pensioen- & Verzekeringskamer, verbonden aan de uitoefening van deze wet en
      van de [Wet toezicht verzekeringsbedrijf 1993][ref1], worden verhaald op de wijze, bedoeld in
      [artikel 186, eerste, derde en vierde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006509
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel186
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0006509
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '186'
  - number: '91.2'
    text: |-
      De kosten en beloning van door de Pensioen- & Verzekeringskamer aangewezen personen, bedoeld
      in [artikel 27, derde lid, onderdeel ][ref1], en de kosten van de publikaties, bedoeld in
      [artikel 27, derde lid, onderdeel ][ref2], komen ten laste van de betrokken verzekeraar, die daartoe van de
      Pensioen- & Verzekeringskamer een aanslag ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel27
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '92.1'
    text: |-
      Voor de uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel92
  - number: '92.2'
    text: Onze Minister kan representatieve organisaties van verzekeraars aanwijzen.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel92
  - number: '93.1'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '93.2'
    text: |-
      Ten aanzien van een besluit tot intrekking van een vergunning blijft
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '93.3'
    text: |-
      Ingeval beroep wordt ingesteld tegen besluiten als bedoeld in [de artikelen 27][ref1], [53][ref2], [54][ref3],
      [55][ref4], [56][ref5], [57][ref6], [59][ref7], [61][ref8], [84][ref9] en [93a, eerste lid][ref10], zal de
      terechtzitting worden gehouden met gesloten deuren. De uitspraak wordt alsdan niet in het openbaar uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0007477#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0007477#Artikel56
      [ref6]: https://wetten.overheid.nl/BWBR0007477#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0007477#Artikel59
      [ref8]: https://wetten.overheid.nl/BWBR0007477#Artikel61
      [ref9]: https://wetten.overheid.nl/BWBR0007477#Artikel84
      [ref10]: https://wetten.overheid.nl/BWBR0007477#Artikel93a
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
