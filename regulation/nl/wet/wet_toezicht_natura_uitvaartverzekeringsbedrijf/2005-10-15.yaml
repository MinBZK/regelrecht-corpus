  - number: 93c.2
    text: |-
      De bestuurlijke boete komt toe aan de staat indien deze door de Minister van Financiën is opgelegd, of aan de
      Pensioen- & Verzekeringskamer indien deze door haar is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93c
  - number: 93c.3
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93c
  - number: 93d.1
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93d
  - number: 93d.2
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93d
  - number: 93d.3
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93d
  - number: 93d.4
    text: |-
      Onze Minister, dan wel de Pensioen- & Verzekeringskamer voor zover zij bevoegd is een boete op te leggen, kan het
      bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de boete in een bepaald geval
      op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93d
  - number: 93d.5
    text: |-
      Voor overtreding van voorschriften gesteld bij of krachtens een algemene maatregel van bestuur op grond
      van de [artikelen 22, eerste lid, onderdeel e][ref1], [25, eerste lid][ref2], [31a, tweede lid][ref3],
      [33, vijfde lid][ref4], [38, eerste lid, laatste volzin][ref5], [38, tweede lid, tweede volzin][ref6],
      [38, vierde lid, eerste volzin][ref7], [38, vijfde lid][ref8], [40, eerste en vierde lid][ref9],
      [45, eerste lid, laatste volzin, 45, tweede lid, tweede volzin, 45, vierde en vijfde lid][ref10], en
      [92, eerste lid][ref11], wordt het bedrag van de boete bepaald op de wijze als voorzien in de bijlage behorend bij
      die algemene maatregel van bestuur, met dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste
      € 900 000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel31a
      [ref4]: https://wetten.overheid.nl/BWBR0007477#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0007477#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0007477#Artikel38
      [ref7]: https://wetten.overheid.nl/BWBR0007477#Artikel38
      [ref8]: https://wetten.overheid.nl/BWBR0007477#Artikel38
      [ref9]: https://wetten.overheid.nl/BWBR0007477#Artikel40
      [ref10]: https://wetten.overheid.nl/BWBR0007477#Artikel45
      [ref11]: https://wetten.overheid.nl/BWBR0007477#Artikel92
    url: https://wetten.overheid.nl/BWBR0007477/2005-10-15#Artikel93d
