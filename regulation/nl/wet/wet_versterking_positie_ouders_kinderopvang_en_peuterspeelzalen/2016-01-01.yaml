preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de positie van ouders die gebruik maken van een
    kindercentrum, gastouderbureau of peuterspeelzaal voor de opvang van hun kind te versterken door de houders
    van kindercentra, gastouderbureaus en peuterspeelzalen te verplichten om zowel een interne- als een externe
    klachtenbehandelingsprocedure in te stellen en door het adviesrecht van de oudercommissie te wijzigen alsmede
    enkele andere aanpassingen aan te brengen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036623/2016-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036623/2016-01-01#ArtikelII
  - number: III
    text: 'Deze wet wordt aangehaald als: Wet versterking positie ouders kinderopvang en peuterspeelzalen.'
    url: https://wetten.overheid.nl/BWBR0036623/2016-01-01#ArtikelIII
