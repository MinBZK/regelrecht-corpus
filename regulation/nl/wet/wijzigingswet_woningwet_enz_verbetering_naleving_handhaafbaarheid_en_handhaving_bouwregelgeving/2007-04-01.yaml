        bwb_id: BWBR0005181
  - number: V.a
    text: |-
      aanschrijving als bedoeld in [afdeling 2 van hoofdstuk III van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Afdeling2
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelV
    references:
      - id: ref1
