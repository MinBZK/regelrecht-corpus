  - number: VI
    text: |-
      Na de inwerkingtreding van deze wet berust een besluit als bedoeld in
      [artikel 100, tweede lid, van de Woningwet][ref1], zoals deze luidde tot het tijdstip van inwerkingtreding van deze
      wet, op [artikel 100a, eerste lid, van de Woningwet][ref2], als gewijzigd door deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel100a
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 100a
  - number: VII
    text: |-
      Aan de in [artikel 100c, eerste of tweede lid, van de Woningwet][ref1], als gewijzigd door deze wet, opgenomen
      verplichting wordt voor de eerste maal voldaan binnen een jaar, respectievelijk twee jaar, na inwerkingtreding van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel100c
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 100c
  - number: VIII
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelVIII
