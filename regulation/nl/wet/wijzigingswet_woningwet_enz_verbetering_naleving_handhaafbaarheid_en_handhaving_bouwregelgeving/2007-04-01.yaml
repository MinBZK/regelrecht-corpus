        artikel: '243'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '305'
  - number: V
    text: |-
      De [Woningwet][ref1] zoals deze luidde tot het tijdstip van inwerkingtreding van deze wet blijft van kracht ten
      aanzien van een vóór dat tijdstip bekendgemaakte:


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelV
    references:
