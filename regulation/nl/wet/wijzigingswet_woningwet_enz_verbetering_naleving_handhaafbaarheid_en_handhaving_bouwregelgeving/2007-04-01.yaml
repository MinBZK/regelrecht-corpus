preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Woningwet te wijzigen ter verbetering van de
    naleving, handhaafbaarheid en handhaving van de bouwregelgeving en enkele andere wetten in verband hiermee te
    wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt binnen vijf jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      [hoofdstuk VI, afdeling 2, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Afdeling2
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        afdeling: '2'
  - number: IVb.B
    text: |-
      [Artikel 256][ref1] vervalt, met dien verstande dat het bepaalde in [dat artikel][ref2], zoals dat luidde tot
      het tijdstip van inwerkingtreding van deze wet, van kracht blijft ten aanzien van de huurprijs van een woning die
      ingevolge [artikel 29 van de Woningwet][ref3], zoals dat luidde tot het tijdstip van inwerkingtreding van deze wet,
      onbewoonbaar is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel256
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelIVb
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '256'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '29'
  - number: IVd
    text: |-
      De [Woningwet][ref1] zoals deze luidde tot het tijdstip van inwerkingtreding van deze wet blijft van
      kracht ten aanzien van gevallen waarin een rechterlijke uitspraak als bedoeld in [artikel 243][ref2]
      of [305, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref3], is gevorderd en op het tijdstip van
      inwerkingtreding van deze wet nog geen sprake was van een onherroepelijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel305
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelIVd
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
