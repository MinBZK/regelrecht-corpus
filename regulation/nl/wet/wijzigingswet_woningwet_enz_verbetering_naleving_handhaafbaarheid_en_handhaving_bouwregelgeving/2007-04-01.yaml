        afdeling: '2'
  - number: V.b
    text: |-
      onbewoonbaarverklaring als bedoeld in [afdeling 3 van hoofdstuk III van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Afdeling3
    url: https://wetten.overheid.nl/BWBR0021058/2007-04-01#ArtikelV
    references:
