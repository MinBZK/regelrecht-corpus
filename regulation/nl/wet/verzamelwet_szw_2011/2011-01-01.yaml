preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen op het terrein van de wetgeving
    van het Ministerie van Sociale Zaken en Werkgelegenheid aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029226/2011-01-01#ArtikelAanhef
articles:
  - number: XXIV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en kunnen terugwerken tot en met
      een in dat besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029226/2011-01-01#ArtikelXXIV
  - number: XXV
    text: 'Deze wet wordt aangehaald als: Verzamelwet SZW 2011.'
    url: https://wetten.overheid.nl/BWBR0029226/2011-01-01#ArtikelXXV
