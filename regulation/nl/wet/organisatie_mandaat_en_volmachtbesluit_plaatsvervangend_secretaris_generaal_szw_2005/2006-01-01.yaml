        artikel: 9:1
  - number: '4'
    text: |-
      De Auditdienst is verantwoordelijk voor de uitvoering van de taken van de departementale Accountantsdienst, bedoeld
      in de [Comptabiliteitswet 2001][ref1] en daarop gebaseerde regelgeving.

      De Auditdienst controleert de financiële verantwoording van de departementsonderdelen en de bedrijfsvoering die
      daaraan ten grondslag ligt. De Auditdienst adviseert op het gebied van financieel beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: '5'
    text: |-
      De directie Algemene Zaken is verantwoordelijk voor:

      a. het beheren en exploiteren van de Haagse vestigingen van het ministerie voorzover daarin niet uitsluitend
      organisatieonderdelen die ressorteren onder de inspecteur-generaal of het Agentschap SZW gehuisvest zijn en het
      beheren en exploiteren van de vestigingen van organisatieonderdelen die ressorteren onder de inspecteur-generaal of
      het Agentschap SZW voorzover zij gebruik maken van de departementale infrastructuur dan wel gehuisvest zijn in een
      vestiging waar ook andere onderdelen van het ministerie gehuisvest zijn, dan wel indien dit met het Agentschap SZW
      respectievelijk de inspecteur-generaal is overeengekomen;

      b. het vervaardigen en beschikbaar stellen van hoogwaardige postale-, grafische- en multimedia-producten en
      diensten, alsmede het project We Print Together;

      c. het adviseren over en het ontwikkelen en implementeren van departementaal beleid op het gebied van documentaire
      informatievoorziening en het beheren van afgesloten archieven;

      d. de advisering en begeleiding op het gebied van inkoop, (Europese) aanbestedingen, huisvesting, milieumanagement
      en materieel beheer;

      e. het verrichten van procedurele handelingen in het kader van (Europese) aanbestedingsprocedures;

      f. het uitvoeren van het aspect-controllerschap ten aanzien van materieel beheer;

      g. de beveiliging van het ministerie in het algemeen en de persoonlijke beveiliging van de bewindspersonen en hun
      huisgenoten in het bijzonder;

      h. het coördineren en faciliteren van de crisisbeheersingsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het Bureau SG is verantwoordelijk voor de inhoudelijke, logistieke en secretariële ondersteuning van de
      secretaris-generaal en de plaatsvervangend secretaris-generaal.

      2 Het Bureau SG draagt zorg voor de directe secretariële, logistieke en protocollaire ondersteuning van de
      bewindspersonen.
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel6
  - number: '7'
    text: |-
      De directie Communicatie is verantwoordelijk voor:

      a. het ontwikkelen van het departementale voorlichtingsbeleid, het geven van voorlichting aan publiek en pers en
      het beschikbaar stellen van documentaire informatie;

      b. de ondersteuning van de bewindspersonen en de directies op het gebied van publiciteit en externe optredens en
      de advisering van de beleidsdirecties over de wijze waarop het beleid kan worden gecommuniceerd aan de voor hen
      relevante doelgroepen;

      c. het functioneel en inhoudelijk beheer van de departementale websystemen, waaronder het content
      managementsysteem, het internetloket, de zoekmachine en het algemene deel van SZW-web.
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel7
  - number: '8'
    text: |-
      1 De directie Gemeenschappelijke Organisatie Bedrijfsvoering is verantwoordelijk voor een efficiënte en kwalitatief
      goede uitvoering van ondersteunende taken en werkzaamheden op de volgende gebieden:

      a. personeelsbeheer en -administratie;

      b. departementale salarisadministratie;

      c. documentaire informatievoorziening en archivering;

      d. registratie en afhandeling van verplichtingen;

      e. kas- en vorderingenbeheer, alsmede financiële administratie;

      f. functioneel beheer van departementale bedrijfsvoeringssystemen;

      g. ondersteuning en voeren van het secretariaat van de medezeggenschap en het georganiseerd overleg.

      2 De directeur Gemeenschappelijke Organisatie Bedrijfsvoering, is onverminderd het bepaalde in
      [artikel 3, eerste lid, onder l][ref1], verantwoordelijk voor de behandeling van klachten over de wijze waarop de
      bemiddelingsorganisatie, bedoeld in artikel 1, onderdeel f, van de Regeling Kinderopvang SZW, uitvoering geeft aan
      de Regeling Kinderopvang SZW.


      [ref1]: https://wetten.overheid.nl/BWBR0017833#Artikel3
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017833
        artikel: '3'
        paragraaf: '3'
  - number: '9'
    text: |-
      De directie ICT-diensten is verantwoordelijk voor:

      a. het ontwikkelen van technologiebeleid, inclusief standaarden op het gebied van de ICT-infrastructuur,
      webtechnologie en kantoorautomatisering van het ministerie;

      b. de ontwikkeling en implementatie van de ICT-infrastructuur en websystemen van het ministerie, waaronder
      netwerken binnen en tussen de verschillende vestigingen van het ministerie, centrale computerapparatuur en data-
      basesystemen, directiespecifieke en departementale informatiesystemen en werkplekapparatuur, inclusief apparatuur
      voor telewerkplekken;

      c. het functioneel beheer van de kantoorautomatiseringstoepassingen en, op verzoek van de eigenaar daarvan, van
      ICT-systemen;

      d. het uitvoeren van het technisch beheer en de exploitatie en beveiliging van de ICT-infrastructuur van het
      ministerie, voor zover dit geen betrekking heeft op digitaal bewijsmateriaal dat door de Sociale Inlichtingen-
      en Opsporingsdienst is opgeslagen en zich bevindt op door de directie ICT-diensten specifiek daartoe aangewezen
      computerapparatuur binnen het netwerkdomein van het ministerie;

      e. het onderhouden van door de directie ICT-diensten ontwikkelde websystemen;

      f. het controleren van en toezicht houden op extern beheer en exploitatie van informatiesystemen;

      g. het beheer van de automatiseringsmiddelen van het ministerie.
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel9
  - number: '10'
    text: |-
      De directie Personeel, Organisatie en Informatie is verantwoordelijk voor:

      a. het adviseren van de secretaris-generaal, de plaatsvervangend secretaris-generaal, de inspecteur-generaal en de
      directeuren-generaal over het personeels-, organisatie-, informatie- en informatiseringsbeleid;

      b. het beleid op het gebied van primaire en secundaire arbeidsvoorwaarden, rechtspositionele aangelegenheden van
      (ex-) medewerkers van het ministerie, arbeidsomstandigheden, bedrijfsvoering, planning en control op de personele-,
      informatieve- en organisatorische processen, administratieve organisatie, informatiebeveiliging en medezeggenschap;

      c. het adviseren van organisatieonderdelen bij de implementatie van departementaal beleid op bovengenoemde
      terreinen, alsmede het adviseren over en het leveren van projectleiding ten behoeve van directiespecifieke
      veranderingstrajecten;

      d. het adviseren en ondersteunen van medewerkers over loopbaanontwikkeling en op het terrein van
      bedrijfsmaatschappelijk werk;

      e. het behandelen van bezwaarschriften, beroepschriften en zaken van de Nationale ombudsman van (ex-)medewerkers
      van het ministerie inzake aangelegenheden verband houdend met de dienstbetrekking, met uitzondering van het nemen
      van beslissingen in bezwaar- en beroepsprocedures;

      f. het ontwikkelen van beleid op het gebied van de personele informatievoorziening;

      g. het ontwikkelen en uitvoeren van ministeriebrede opleidings- en leerprojecten, waaraan naast de medewerkers van
      het ministerie ook andere belanghebbenden kunnen deelnemen;

      h. de advisering van de plaatsvervangend secretaris-generaal over de verdeling van de middelen uit de begroting
      voor ICT.
    url: https://wetten.overheid.nl/BWBR0017833/2006-01-01#Artikel10
  - number: '11'
    text: |-
      1 De Sociale Inlichtingen- en Opsporingsdienst is – onder gezag van de officier van justitie – verantwoordelijk
      voor de opsporing van zware strafbare feiten op de beleidsterreinen waarvoor de minister verantwoordelijkheid
      draagt en de strafbare feiten, welke worden geconstateerd in het kader van genoemde opsporing en welke
      daarmee verband houden. In het kader van de opsporing van deze strafbare feiten is de Sociale Inlichtingen- en
      Opsporingsdienst verantwoordelijk voor het voeren van registers als genoemd in de [Wet politieregisters][ref1] en
      het verwerken van persoonsgegevens binnen het kader van de [Wet bescherming persoongegevens][ref2].

      2 De Sociale Inlichtingen- en Opsporingsdienst is mede in verband met de opsporing, bedoeld in het eerste
      lid, belast met het toetsen van voorgenomen wet- en regelgeving op handhaafbaarheid en fraudegevoeligheid, het
      verzamelen van beleidsrelevante informatie, het opstellen van rapportages (criminaliteitsbeelden, risicoanalyses en
      onderzoeksevaluaties) en het adviseren van beleidsdirecties daarover.

      3 De Sociale Inlichtingen- en Opsporingsdienst is verantwoordelijk voor het uitvoeren van het technisch
      beheer, de exploitatie en de beveiliging van de ICT-infrastructuur, voor zover dit betrekking heeft op digitaal
      bewijsmateriaal dat door de Sociale Inlichtingen- en Opsporingsdienst is opgeslagen en zich bevindt op door de
      directie ICT-diensten specifiek daartoe aangewezen computerapparatuur binnen het netwerkdomein van het ministerie.


