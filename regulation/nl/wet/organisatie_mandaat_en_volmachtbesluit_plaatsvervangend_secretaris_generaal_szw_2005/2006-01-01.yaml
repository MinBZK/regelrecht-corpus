  - number: '13'
    text: |-
      1 De directeur Algemene Zaken is gevolmachtigd tot het aangaan van overeenkomsten met betrekking tot:

      a. voorzieningen op het gebied van telefonie en het technisch beheer daarvan;

      b. de huisvesting en facilitaire voorzieningen ten behoeve van de Haagse vestigingen van het ministerie;

      c. de facilitaire dienstverlening die wordt verricht in het kader van het project We Print Together ten behoeve van
      het Ministerie van Sociale Zaken en Werkgelegenheid, het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, het Ministerie van Volksgezondheid, Welzijn en Sport;

      d. systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties van ICT-systemen van de directie
      Algemene Zaken.

      2 De directeur Communicatie is gevolmachtigd tot het aangaan van overeenkomsten met betrekking tot:

      a. de organisatie van voorlichtings- en informatiecampagnes en de productie en distributie van
      voorlichtingsmateriaal;

      b. systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties van voorlichtings- en
      documentatiesystemen;

      c. externe advisering in het kader van voorlichtingsprojecten.

      3 De directeur Gemeenschappelijke Organisatie Bedrijfsvoering is gevolmachtigd tot het aangaan van overeenkomsten
      met betrekking tot

      a. personeelsbeheerssystemen, salarissystemen en systemen voor documentregistratie en -verwerking, voorzover deze
      noodzakelijk zijn voor een goede uitvoering van de taken en werkzaamheden, bedoeld in [artikel 8][ref1];

      b. systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties van departementale financiële
      informatiesystemen;

      c. de opvang van kinderen van medewerkers van het ministerie;

      d. de gerechtelijke en buitengerechtelijke invordering van geldvorderingen van de Staat.

      4 De directeur ICT-diensten is gevolmachtigd tot het aangaan van overeenkomsten met betrekking tot websystemen, de
      technische infrastructuur, de hardware, de kantoorautomatiseringssoftware, de datacommunicatievoorzieningen, met
      uitzondering van telefonie, en het technisch beheer van geautomatiseerde systemen.

      5 De directeur Personeel, Organisatie en Informatie is gevolmachtigd tot het aangaan van overeenkomsten met
      betrekking tot:

      a. departementsbrede informatievoorziening, waaronder informatiebeveiliging en privacybescherming;

      b. de Landsadvocaat inzake advisering en procureurstelling alsmede het instellen van gerechtelijke procedures met
      betrekking tot beroepschriften van (ex-)medewerkers van het ministerie inzake aangelegenheden verband houdende met
      de dienstbetrekking;

      c. de arbodienst en het centraal flankerend beleid ten behoeve van herplaatsers.


      [ref1]: https://wetten.overheid.nl/BWBR0017833#Artikel8
