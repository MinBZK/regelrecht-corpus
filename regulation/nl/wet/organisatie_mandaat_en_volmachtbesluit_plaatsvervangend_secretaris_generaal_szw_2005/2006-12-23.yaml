    text: |-
      1 De [artikelen 3][ref1], [12][ref2] en [14][ref3] zijn van overeenkomstige toepassing op de projectleiders.

      2 De plaatsvervangend secretaris-generaal stelt de jaarplannen vast van de projectorganisaties. Gegeven het
      budget dat door de secretaris-generaal aan de plaatsvervangend secretaris-generaal ter beschikking is gesteld,
      kent de plaatsvervangend secretaris-generaal aan de projectleiders de budgetten toe waarover deze mogen
      beschikken. De plaatsvervangend secretaris-generaal bewaakt de voortgang van de uitvoering van jaarplannen van
      de projectorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0017833#Artikel3
