  - number: '14'
    text: |-
      1 De directeuren kunnen hun vertegenwoordigingsbevoegdheden in een door hen te bepalen omvang doorverlenen
      aan onder hen ressorterende functionarissen, met dien verstande dat bevoegdheden met betrekking tot
      personeelsaangelegenheden slechts kunnen worden doorverleend aan rechtstreeks onder hen ressorterende
      functionarissen en slechts voor zover het betreft:

      a. het opmaken, niet zijnde vaststellen, van een beoordeling van medewerkers;

      b. het houden van manager-medewerker gesprekken;

      c. verlof van medewerkers;

      d. kleine beloningen, niet zijnde gratificaties, onder gelijktijdige mededeling daarvan aan de directeur.

      2 In afwijking van het eerste lid kunnen directeuren bevoegdheden met betrekking tot personeelsaangelegenheden,
      genoemd in het eerste lid, onder a tot en met d, doorverlenen aan functionarissen die rechtstreeks ressorteren
      onder rechtstreeks onder hen ressorterende functionarissen voor zover dit noodzakelijk is vanwege de
      organisatiestructuur van de directie en voorzover de plaatsvervangend secretaris-generaal daar schriftelijk mee
      instemt.

      3 Onverminderd het bepaalde in het eerste lid kunnen directeuren, na voorafgaande schriftelijke toestemming van de
      plaatsvervangend secretaris-generaal, hun vertegenwoordigingsbevoegdheden doorverlenen aan functionarissen van een
      ander organisatieonderdeel, mits de betreffende functionaris daarmee schriftelijk instemt.

      4 De (door)verlening van (onder-)mandaat, volmacht en machtiging kan uitsluitend bij een schriftelijk besluit
      geschieden.
