  - number: 11a
    text: |-
      De projectorganisatie We Print Together is verantwoordelijk voor:

      a. het vervaardigen en beschikbaar stellen van reprografische hoog volume producten en diensten conform de
      afspraken in de Service Level Agreements zoals afgesloten met de ministeries van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer en Volksgezondheid, Welzijn en Sport;

      b. het zorgvuldig, tijdig en veilig retour leveren van reproductieopdrachten aan de klant;

      c. het aanleveren van productiegegevens en -informatie en managementrapportages aan de Service Level Agreement
      partners;

      d. het nemen en onderhouden van maatregelen ter waarborging van de beschikbaarheid, de integriteit en de
      exclusiviteit van de documenten en de informatie daarin;

      e. het hebben van een noodplan, waarop kan worden teruggevallen in geval van calamiteiten.
    url: https://wetten.overheid.nl/BWBR0017833/2006-12-23#Artikel11a
  - number: 11b
    text: |-
      De projectorganisatie InterCoach is verantwoordelijk voor:

      a. het organiseren van een leergang en follow-up voor directeuren met talent voor coaching;

      b. het bemiddelen bij coachtrajecten tussen tot coach opgeleide directeuren en collega's van andere ministeries;

      c. het onderhouden van een kwaliteitssysteem ter borging van de coachtrajecten.
    url: https://wetten.overheid.nl/BWBR0017833/2006-12-23#Artikel11b
  - number: 11c
    text: |-
      De projectorganisatie Bureau Huisvestingsprojecten Rijksoverheid is verantwoordelijk voor:

      a. het bieden van ondersteuning aan ministeries bij huisvestingsvraagstukken en -projecten;

      b. het adviseren aan ministeries over huisvestingsvraagstukken.
    url: https://wetten.overheid.nl/BWBR0017833/2006-12-23#Artikel11c
  - number: '12'
    text: |-
      1 Elk van de directeuren is bevoegd om namens een bewindspersoon besluiten te nemen, overeenkomsten aan te gaan
      en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn, voorzover
      zij verband houden met de taken en verantwoordelijkheden van zijn directie, tenzij deze zijn voorbehouden aan
      een bewindspersoon, de secretaris-generaal of de plaatsvervangend secretaris-generaal, dan wel dit ingevolge
      [artikel 13][ref1] onder de volmacht van een andere directeur valt.

      2 Aan elke directeur wordt mandaat en machtiging verleend tot het nemen van besluiten over en het vaststellen en
      ondertekenen van stukken die betrekking hebben op:

      a. de in [artikel 3, eerste lid, onder e][ref2], genoemde personeelsaangelegenheden;

      b. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref3], voor zover
      deze klachten betrekking hebben op gedragingen van de onder elk van hen ressorterende functionarissen.

      3 De in het eerste lid genoemde bevoegdheid omvat de bevoegdheid tot het verlenen en vaststellen van subsidies en
      rijksvergoedingen, het aangaan van verbetertrajecten en het korten op bevoorschotting, voor zover het de uitvoering
      betreft van regelingen op zijn werkterrein.

      4 De in het eerste lid genoemde bevoegdheid om overeenkomsten aan te gaan is beperkt tot overeenkomsten met een
      waarde per overeenkomst onder de laagste drempel voor aanbesteding conform de Europese aanbestedingsrichtlijnen,
      met dien verstande dat de volgende overeenkomsten mogen worden aangegaan tot een waarde van € 500.000,– per
      overeenkomst:

      a. overeenkomsten welke gebaseerd zijn op een mantelovereenkomst;

      b. overeenkomsten voor het opleiden van medewerkers van de directie;

      c. overeenkomsten voor het inhuren van personeel voor de uitvoering van werkzaamheden die onder de directe
      verantwoordelijkheid van het departementale management worden verricht;

      d. arbeidsovereenkomsten naar burgerlijk recht;

      e. overeenkomsten met betrekking tot raden en commissies;

      f. overeenkomsten met betrekking tot onderzoek;

      g. overeenkomsten met betrekking tot systeemontwikkeling, functioneel beheer, onderhoud van applicaties en
      licenties van automatiseringssystemen, waarvoor de directeur schriftelijk door de plaatsvervangend secretaris-
      generaal is aangewezen als systeemeigenaar.

      h. overeenkomsten als bedoeld in [artikel 13][ref4].


