articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. directie: een van de organisatieonderdelen, genoemd in [artikel 2, onderdelen a tot en met h][ref1];

      b. projectorganisatie: een van de organisatieonderdelen, genoemd in [artikel 2, onderdelen i tot en met k][ref2];

      c. directeur: een functionaris die leiding geeft aan een directie;

      d. projectleider: een functionaris die leiding geeft aan een projectorganisatie;

      e. ICT: informatie- en communicatietechnologie.


      [ref1]: https://wetten.overheid.nl/BWBR0017833#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017833#Artikel2
