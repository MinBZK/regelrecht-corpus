    text: |-
      De aanvraagperiode, bedoeld in
      [artikel 8, eerste lid, van de Regeling effectgerichte maatregelen in bossen en natuurterreinen][ref1] wordt voor
      het jaar 2005 vastgesteld van 1 november 2004 tot 1 maart 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel8
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '8'
  - number: 9g
    text: |-
      Het subsidieplafond, bedoeld in
      [artikel 2, eerste lid, van de Regeling effectgerichte maatregelen in bossen en natuurterreinen][ref1] wordt voor
      het jaar 2005 vastgesteld op:

      a. € 1.600.000,– voor de Vereniging tot Behoud van Natuurmonumenten;

      b. € 1.965.000,– voor De Landschappen;

      c. € 2.240.000,– voor de Unie van Bosgroepen;

      d. € 445.000,– voor particulieren.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel8
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0007715
        artikel: '8'
  - number: 9h
    text: |-
      Het subsidieplafond, bedoeld in [artikel 5, eerste lid, van de Regeling versterking recreatie](onbekend) wordt voor
      de in [artikel 2 van die regeling](onbekend) bedoelde onderscheiden doelstellingen voor het jaar 2005 als volgt
      vastgesteld:

      a. voor de doelstelling, bedoeld in onderdeel a van dat artikel: € 1.400.000,–;

      b. voor de doelstelling, bedoeld in onderdeel b van dat artikel: € 1.600.000,–;

      c. voor de doelstelling, bedoeld in onderdeel c van dat artikel: € 0,–;

      d. voor de doelstelling, bedoeld in onderdeel d van dat artikel: € 0,–.
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9h
  - number: 9i
    text: |-
      1 Voor het begrotingsjaar 2005 worden de volgende subsidieplafonds vastgesteld:

      a. € 1.256.400,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a, d en e, van de Subsidieregeling natuurbeheer 2000][ref1] ten behoeve van de basis-, plus-
      recreatie- en landschapspakketten, opgenomen in de [bijlagen 12 tot en met 56][ref2] en [58][ref3];

      b. € 105.102.000,– voor subsidies als bedoeld in de [artikelen 42, eerste lid][ref4], en
      [51, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref5] ten behoeve van de basis- , plus- en
      landschapspakketten, opgenomen in de [bijlagen 12 tot en met 56][ref6];

      c. € 0,– voor subsidies als bedoeld in de [artikelen 42, tweede lid][ref7], en
      [51, tweede lid, van de Subsidieregeling natuurbeheer 2000][ref8] ten behoeve van de basis- en pluspakketten,
      opgenomen in de [bijlage 20][ref9], [37][ref10] en [38][ref11];

      d. € 11.638.598,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Subsidieregeling agrarisch natuurbeheer][ref12] ten behoeve
      van de beheers- en landschapspakketten, opgenomen in de [bijlagen 6 tot en met 16][ref13], [18][ref14],
      [23 tot en met 46][ref15];

      e. € 5.995.642,– voor subsidies aan anderen dan beheerders als bedoeld in
      [artikel 4 van de Subsidieregeling agrarisch natuurbeheer][ref16] ten behoeve van de beheers- en
      landschapspakketten, opgenomen in de [bijlagen 6 tot en met 28][ref17] en [29 tot en met 46][ref18];

      f. € 12.000.000,– voor subsidie als bedoeld in [artikel 2a van de Subsidieregeling agrarisch natuurbeheer][ref19].

      2 In zoverre in afwijking van het eerste lid wordt voor de provincie Flevoland het subsidieplafond, bedoeld in het
      eerste lid, onderdelen d en e, vastgesteld op € 0,–.


