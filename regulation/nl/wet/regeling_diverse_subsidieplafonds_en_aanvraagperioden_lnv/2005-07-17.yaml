    text: |-
      Voor de aanvraagperiode, genoemd in [artikel 12 van de Infrastructuurregeling glastuinbouwgebieden][ref1], bedraagt
      het subsidieplafond voor subsidies op grond van [die regeling][ref2] € 12.500.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0009462#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009462
