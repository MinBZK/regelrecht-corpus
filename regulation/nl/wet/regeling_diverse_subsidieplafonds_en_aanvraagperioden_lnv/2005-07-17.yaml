        bwb_id: BWBR0010448
  - number: 9o
    text: |-
      Met betrekking tot het begrotingsjaar 2005 wordt voor alle in [artikel 2 van de Regeling subsidies particuliere
      terreinbeherende natuurbeschermingsorganisaties](onbekend) genoemde categorieën gezamenlijk een subsidieplafond
      vastgesteld van € 31,2 miljoen.
