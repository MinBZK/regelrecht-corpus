  - number: 9j
    text: |-
      1 Aanvragen voor de instandhouding of ontwikkeling van basis-, plus-, recreatie- en landschapspakketten,
      opgenomen in de [bijlagen 12 tot en met 56][ref1] en [58 van de Subsidieregeling natuurbeheer 2000][ref2]
      en voor de instandhouding of ontwikkeling van beheers- en landschapspakketten, opgenomen in de
      [bijlagen 6 tot en met 46 van de Subsidieregeling agrarisch natuurbeheer][ref3] kunnen worden ingediend in de
      periode van 1 november 2004 tot en met 24 december 2004.

      2 Aanvragen voor subsidie als bedoeld in [artikel 2a van de Subsidieregeling agrarisch natuurbeheer][ref4] kunnen
      worden ingediend in de periode van 8 december 2004 tot en met 18 januari 2005.

      3 In afwijking van het eerste lid kunnen aanvragen voor subsidies als bedoeld in de
      [artikelen 42, eerste lid][ref5], en [51, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref6] ten behoeve
      van de basis-, plus- en landschapspakketten, opgenomen in de [bijlage 12 tot en met 56][ref7], tevens worden
      ingediend in de periode van 1 mei 2005 tot en met 31 mei 2005.


