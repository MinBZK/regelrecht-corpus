    text: |-
      Voor de aanvraagperiode, bedoeld in [artikel 11 van het Besluit ontwikkeling van landschappen][ref1], bedraagt het
      subsidieplafond voor subsidies op grond van dat besluit voor het jaar 2005 € 815.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel11
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9
