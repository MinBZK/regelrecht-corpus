      De beoordelingscriteria, bedoeld in
      [artikel 3, vierde lid, van de Regeling subsidie plattelandsontwikkelingsprogramma provincies][ref1], zijn de in
      [bijlage 2][ref2] bij deze regeling opgenomen criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0013683#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016764
