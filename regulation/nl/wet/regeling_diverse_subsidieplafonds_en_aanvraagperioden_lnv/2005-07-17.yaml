  - number: '8'
    text: |-
      Voor de aanvraagperiode, bedoeld in [artikel 6][ref1], bedraagt het subsidieplafond voor programma’s als bedoeld in
      [artikel 21 van de Regeling draagvlak][ref2] natuur € 1.400.000.


      [ref1]: https://wetten.overheid.nl/BWBR0016764#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel21
