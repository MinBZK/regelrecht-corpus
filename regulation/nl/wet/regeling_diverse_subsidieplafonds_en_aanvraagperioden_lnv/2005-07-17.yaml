articles:
  - number: '1'
    text: |-
      Gelet op [artikel 5, eerste lid, van de Regeling herstel historische buitenplaatsen][ref1], kunnen aanvragen tot
      subsidieverlening op grond van deze regeling, voor het jaar 2005 worden ingediend in de periode van 15 mei tot en
      met 15 augustus 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel5
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '5'
  - number: '2'
    text: |-
      Het subsidieplafond, bedoeld in [artikel 4, eerste lid, van de Regeling herstel historische buitenplaatsen][ref1],
      voor het jaar 2005 bedraagt € 215.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel4
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '4'
  - number: '3'
    text: |-
      De aanvraagperiode, bedoeld in [artikel 12 van de Regeling subsidiëring Actieplan BBI-Matra 2005–2008][ref1],
      wordt voor het jaar 2005 vastgesteld op de periode van 15 juni tot en met 27 juli 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel12
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '12'
  - number: '4'
    text: |-
      Het subsidieplafond, bedoeld in
      [artikel 11, eerste en tweede lid, van de Regeling subsidiëring Actieplan BBI-Matra 2005–2008][ref1], bedraagt
      voor het jaar 2005 € 1.430.000,– voor projecten en € 2.800.000,– voor programma’s. In het jaar 2005 komen
      projecten, waarvan de subsidiabele kosten meer bedragen dan € 110.000,–, en programma’s, waarvan de subsidiabele
      kosten meer bedragen dan € 560.000,–, niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel11
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '11'
  - number: '5'
    text: |-
      Gelet op [artikel 14, derde lid, van het Besluit natuurbeheer Midden- en Oost-Europa 2001][ref1],
      wordt het thema beleidsontwikkeling natuurbeheer en ecologische netwerken, genoemd in
      [artikel 4, tweede lid, onderdeel a, van deze regeling][ref2], het hoogst gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016764#Artikel4
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel5
