    text: |-
      De verhoging, bedoeld in [artikel 30, eerste lid, van de Subsidieregeling natuurbeheer 2000](onbekend), zoals die
      luidde tot 25 oktober 2003, bedraagt:

      a. € 10,19 voor het jaar 2004;

      b. € 10,36 voor het jaar 2005.
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9l
  - number: 9m
    text: |-
      Het percentage, bedoeld in [artikel 44, vierde lid, van de Subsidieregeling natuurbeheer 2000](onbekend), zoals die
      luidde tot 1 oktober 2004, waarmee de subsidie functieverandering voor de subsidies die zijn verleend op grond van
      aanvragen voor de begrotingsjaren 2000, 2001, 2002, 2003 en 2004 wordt verhoogd, is 1,7%.
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9m
  - number: 9n
    text: |-
      Het subsidieplafond voor het jaar 2005 wordt voor aanvragen op grond van het
      [Besluit instandhouding schaapskuddes][ref1] vastgesteld op € 300.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0010448
    url: https://wetten.overheid.nl/BWBR0016764/2005-07-17#Artikel9n
    references:
