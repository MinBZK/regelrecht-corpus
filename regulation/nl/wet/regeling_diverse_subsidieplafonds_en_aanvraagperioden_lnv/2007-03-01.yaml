    text: |-
      De verhoging, bedoeld in [artikel 30, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref1], zoals die
      luidde tot 25 oktober 2003, bedraagt:

      a. € 10,19 voor het jaar 2004;

      b. € 10,36 voor het jaar 2005;

      c. € 10,51 voor het jaar 2006;

      d. € 10,65 voor het jaar 2007.


