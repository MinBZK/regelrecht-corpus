  - number: 9j
    text: |-
      1 Aanvragen voor de instandhouding of ontwikkeling van basis-, plus-, recreatie- en landschapspakketten,
      opgenomen in de [bijlagen 12 tot en met 56][ref1] en [58 van de Subsidieregeling natuurbeheer 2000][ref2]
      en voor de instandhouding of ontwikkeling van beheers- en landschapspakketten, opgenomen in de
      [bijlagen 6 tot en met 28][ref3] en [29 tot en met 46 van de Subsidieregeling agrarisch natuurbeheer][ref4] kunnen
      worden ingediend in de periode van 1 december 2005 tot en met 31 januari 2006.

      2 Aanvragen voor de ontwikkeling van het beheerspakket, bedoeld in
      [bijlage 28b van de Subsidieregeling agrarisch natuurbeheer][ref5], kunnen worden ingediend in de periode van 15
      april tot en met 14 mei 2006. De subsidie kan worden verleend met terugwerkende kracht tot en met 1 januari 2006.

      3 Aanvragen voor de ontwikkeling van de beheerspakketten, opgenomen in de
      [bijlagen 28c tot en met 28f, van de Subsidieregeling agrarisch natuurbeheer][ref6], kunnen worden ingediend in de
      periode van 15 juni 2006 tot en met 27 juli 2006.

      4 Aanvragen voor subsidies op grond van de [Subsidieregeling natuurbeheer 2000][ref7], bedoeld in
      [artikel 9i, derde lid, onderdeel b][ref8], kunnen worden ingediend in de periode van 15 juni 2006 tot en met 27
      juli 2006.

      5 Aanvragen voor subsidie op grond van de [Subsidieregeling agrarisch natuurbeheer][ref9] voor terreinen,
      bedoeld in [artikel 9i, derde lid, onderdeel j][ref10], kunnen voor de beheers- en landschapspakketten,
      opgenomen in de [bijlagen 6 tot en met 14][ref11], [16 tot en met 18][ref12], [22 tot en met 28][ref13] en
      [29 tot en met 46][ref14], worden ingediend in de periode van 15 juni 2006 tot en met 27 juli 2006.


