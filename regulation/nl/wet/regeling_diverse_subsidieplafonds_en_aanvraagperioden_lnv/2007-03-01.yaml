articles:
  - number: '1'
    text: |-
      Aanvragen tot subsidieverlening op grond van
      [artikel 5, eerste lid, van de Regeling herstel historische buitenplaatsen][ref1], voor het jaar 2006 kunnen worden
      ingediend in de periode van 1 maart tot en met 1 juni 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel5
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '5'
  - number: '2'
    text: |-
      Het subsidieplafond, bedoeld in [artikel 4, eerste lid, van de Regeling herstel historische buitenplaatsen][ref1],
      voor het jaar 2006 bedraagt € 215.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0014003#Artikel4
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014003
        artikel: '4'
  - number: '3'
    text: |-
      De aanvraagperiode, bedoeld in [artikel 12 van de Regeling subsidiëring Actieplan BBI-Matra 2005–2008][ref1],
      wordt voor het jaar 2007 vastgesteld op de periode 1 maart tot en met 30 maart 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel12
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '12'
  - number: '4'
    text: |-
      Het subsidieplafond, bedoeld in
      [artikel 11, eerste en tweede lid, van de Regeling subsidiëring Actieplan BBI-Matra 2005-2008][ref1], bedraagt
      voor het jaar 2007 € 2.713.250. In het jaar 2007 komen projecten waarvan de aangevraagde subsidie meer bedraagt dan
      € 220.000 niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel11
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '11'
  - number: '5'
    text: |-
      Gelet op [artikel 14, derde lid, van het Besluit natuurbeheer Midden- en Oost-Europa 2001][ref1],
      wordt het thema beleidsontwikkeling natuurbeheer en ecologische netwerken, genoemd in
      [artikel 4, tweede lid, onderdeel a, van deze regeling][ref2], het hoogst gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016764#Artikel4
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0016764
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Aanvragen tot subsidieverlening op grond van de [Regeling draagvlak natuur][ref1] kunnen worden ingediend van 1
      juli 2006 tot en met 31 juli 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0012519
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012519
  - number: '7'
    text: |-
      Voor de aanvraagperiode, bedoeld in [artikel 6][ref1], bedraagt het subsidieplafond voor projecten als bedoeld in
      [artikel 16 van de Regeling draagvlak natuur][ref2] voor het jaar 2006 € 1.400.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0016764#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel16
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016764
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012519
        artikel: '16'
  - number: '8'
    text: |-
      Voor de aanvraagperiode, bedoeld in [artikel 6][ref1], bedraagt het subsidieplafond voor programma’s als bedoeld in
      [artikel 21 van de Regeling draagvlak natuur][ref2] voor het jaar 2006 € 1.400.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0016764#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel21
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel8
