        artikel: '3'
  - number: 9b
    text: |-
      1 De communautaire bijdragen, bedoeld in
      [artikel 3, tweede lid, van de Regeling subsidie plattelandsontwikkelingsprogramma provincies][ref1], voor de
      aanvraagperioden, bedoeld in [artikel 9a][ref2], zijn de in [kolom 2 van bijlage 1][ref3] bij deze regeling
      opgenomen bedragen.

      2 De met de in het eerste lid bedoelde communautaire bijdrage verband houdende, te laste van
      het Europees Oriëntatie- en Garantiefonds voor de Landbouw komende, uitgaven, kunnen in de bij
      [kolom 3 en 4 van bijlage 1][ref4] bij deze regeling vermelde periodes niet tot hogere uitgaven leiden dan de
      aldaar vermelde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013683#Artikel3
