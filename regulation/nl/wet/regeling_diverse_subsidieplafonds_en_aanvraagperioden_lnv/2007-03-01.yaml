  - number: 9ma
    text: |-
      1 Per hectare wordt voor de beheerspakketten, opgenomen in de
      [bijlagen 28c tot en met 28f, van de Subsidieregeling agrarisch natuurbeheer][ref1], een
      beheersbijdrage vastgesteld, waarbij voor de beheerspakketten, opgenomen in de [bijlagen 28c][ref2] en
      [28d, van de Subsidieregeling agrarisch natuurbeheer][ref3], per hectare een maximumbedrag wordt vastgesteld.

      2 Het Faunafonds, bedoeld in [artikel 83 van de Flora- en faunawet][ref4], adviseert de Minister van Landbouw,
      Natuur en Voedselkwaliteit over de omvang van het bedrag tussen het beheersbedrag per hectare, bedoeld in het
      eerste lid, en het maximumbedrag per hectare, bedoeld in het eerste lid. Bedoelde omvang wordt per beheerseenheid
      bepaald aan de hand van de inkomensderving die in bedoelde beheerseenheid door het foerageren van ganzen is
      veroorzaakt.

      3 Het advies van het Faunafonds, bedoeld in het tweede lid, berust op taxaties die op grond van de Regeling
      vaststelling beleidsregels schadevergoeding Faunafonds worden uitgevoerd door door het Faunafonds aangewezen
      taxateurs.


