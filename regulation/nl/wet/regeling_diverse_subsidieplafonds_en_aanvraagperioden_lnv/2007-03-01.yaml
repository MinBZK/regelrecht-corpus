  - number: '9'
    text: |-
      Het subsidieplafond voor de aanvraagperiode, bedoeld in
      [artikel 11 van het Besluit ontwikkeling van landschappen][ref1], bedraagt voor het jaar 2006 € 815.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0010601#Artikel11
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel9
