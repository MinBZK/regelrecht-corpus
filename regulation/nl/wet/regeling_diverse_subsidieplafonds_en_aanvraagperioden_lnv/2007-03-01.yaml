    text: |-
      Het subsidieplafond, bedoeld in [artikel 5, eerste lid, van de Regeling versterking recreatie][ref1] wordt voor
      de in [artikel 2 van die regeling][ref2] bedoelde onderscheiden doelstellingen voor het jaar 2006 als volgt
      vastgesteld:

      a. voor de doelstelling, bedoeld in [onderdeel a van dat artikel][ref3]: € 1.533.301,–;.

      b. voor de doelstelling, bedoeld in [onderdeel b van dat artikel][ref4]: € 5.650.000,–;.

      c. voor de doelstelling, bedoeld in [onderdeel c van dat artikel][ref5]: € 0,–;

      d. voor de doelstelling, bedoeld in [onderdeel d van dat artikel][ref6]: € 0,–.


