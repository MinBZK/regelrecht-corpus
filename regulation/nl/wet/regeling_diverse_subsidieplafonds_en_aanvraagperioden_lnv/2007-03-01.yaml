      De aanvraagperiode, bedoeld in
      [artikel 8, eerste lid, van de Regeling effectgerichte maatregelen in bossen en natuurterreinen][ref1] wordt voor
      het jaar 2007 vastgesteld van 1 november 2006 tot en met 28 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel8
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel9f
