  - number: 9a
    text: |-
      1 De aanvraagperiode voor subsidieaanvragen op grond van de
      [Regeling subsidie plattelandsontwikkelingsprogramma provincies][ref1], bedoeld in
      [artikel 3, eerste lid, van de Regeling subsidie plattelandsontwikkelingsprogramma provincies][ref2], zijn voor de
      onderstaande provincies de volgende tijdvakken:








                    Limburg:


                    1 april tot 1 oktober 2004 en, mits bij voldoende beschikbaar bedrag, 1 juli tot 1 september 2005;




                    Noord-Brabant:


                    3 januari tot 8 maart 2005;




                    Utrecht:


                    16 april tot 1 juni 2004 en 1 september tot 2 oktober 2004;




                    Zuid-Holland:


                    1 mei tot 16 juni 2004;




                    Drenthe, Friesland
                    en Groningen:


                    29 maart 2004 tot 15 juni 2004 en 9 mei tot 1 juni 2005;




                    Gelderland:


                    16 september tot 2 december 2004 en, mits bij voldoende beschikbaar bedrag, 2 december 2004 tot 2
      maart 2005;




                    Noord-Holland:


                    28 juni tot 9 oktober 2004;




                    Overijssel:


                    15 september tot 1 november 2004;




                    Zeeland:


                    1 december 2003 tot 15 juli 2004, 15 juli tot 1 december 2004 en 1 december 2004 tot 15 juli 2005.






      2 Onder beschikbaar bedrag als bedoeld in het eerste lid, wordt verstaan: som van de communautaire bijdrage en de
      daarmee corresponderende nationale bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0013683
      [ref2]: https://wetten.overheid.nl/BWBR0013683#Artikel3
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel9a
    references:
