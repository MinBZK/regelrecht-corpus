  - number: 9m
    text: |-
      Het percentage, bedoeld in [artikel 44, vierde lid, van de Subsidieregeling natuurbeheer 2000][ref1], zoals die
      luidde tot 1 oktober 2004, waarmee de subsidie functieverandering voor de subsidies die zijn verleend op grond van
      aanvragen voor de begrotingsjaren 2000, 2001, 2002, 2003, 2004, 2005 en 2006 wordt verhoogd, is 1,3%.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel44
    url: https://wetten.overheid.nl/BWBR0016764/2007-03-01#Artikel9m
