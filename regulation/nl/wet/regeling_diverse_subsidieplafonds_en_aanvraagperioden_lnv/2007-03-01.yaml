  - number: 9i
    text: |-
      1 Voor het begrotingsjaar 2005 worden de volgende subsidieplafonds vastgesteld:

      a. € 1.256.400,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a, d en e, van de Subsidieregeling natuurbeheer 2000][ref1] ten behoeve van de basis-, plus-
      recreatie- en landschapspakketten, opgenomen in de [bijlagen 12 tot en met 56][ref2] en [58][ref3];

      b. € 105.102.000,– voor subsidies als bedoeld in de [artikelen 42, eerste lid][ref4], en
      [51, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref5] ten behoeve van de basis- , plus- en
      landschapspakketten, opgenomen in de [bijlagen 12 tot en met 56][ref6];

      c. € 0,– voor subsidies als bedoeld in de [artikelen 42, tweede lid][ref7], en
      [51, tweede lid, van de Subsidieregeling natuurbeheer 2000][ref8] ten behoeve van de basis- en pluspakketten,
      opgenomen in de [bijlage 20][ref9], [37][ref10] en [38][ref11];

      d. € 11.638.598,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Subsidieregeling agrarisch natuurbeheer][ref12] ten behoeve
      van de beheers- en landschapspakketten, opgenomen in de [bijlagen 6 tot en met 16][ref13], [18][ref14],
      [23 tot en met 46][ref15];

      e. € 5.995.642,– voor subsidies aan anderen dan beheerders als bedoeld in
      [artikel 4 van de Subsidieregeling agrarisch natuurbeheer][ref16] ten behoeve van de beheers- en
      landschapspakketten, opgenomen in de [bijlagen 6 tot en met 28][ref17] en [29 tot en met 46][ref18];

      f. € 12.000.000,– voor subsidie als bedoeld in [artikel 2a van de Subsidieregeling agrarisch natuurbeheer][ref19].

      2 In zoverre in afwijking van het eerste lid wordt voor de provincie Flevoland het subsidieplafond, bedoeld in het
      eerste lid, onderdelen d en e, vastgesteld op € 0,–.

      3 Voor het begrotingsjaar 2006 worden de volgende subsidieplafonds vastgesteld:

      a. € 95.900.000,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a, d en e, van de Subsidieregeling natuurbeheer 2000][ref20] ten behoeve van de basis-,
      plus-, recreatie- en landschapspakketten, opgenomen in de [bijlagen 12 tot en met 56][ref21] en [58][ref22];

      b. € 152.350.005,– voor subsidies als bedoeld in de [artikelen 42, eerste lid][ref23], en
      [51, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref24] ten behoeve van de basis-, plus- en
      landschapspakketten, opgenomen in de [bijlagen 12 tot en met 56][ref25];

      c. € 0,– voor subsidies als bedoeld in de [artikelen 42, tweede lid][ref26], en
      [51, tweede lid, van de Subsidieregeling natuurbeheer 2000][ref27] ten behoeve van het basispakket, opgenomen in
      [bijlage 20][ref28], en het pluspakket, opgenomen in [bijlage 38][ref29];

      d. € 43.900.000,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Subsidieregeling agrarisch natuurbeheer][ref30] ten
      behoeve van de beheers- en landschapspakketten, opgenomen in de [bijlagen 6 tot en met 28][ref31]
      en [29 tot en met 46][ref32], voor terreinen ten behoeve waarvan in het jaar 2004 of 2005
      die subsidies of een subsidie op grond van een beschikking of regeling als bedoeld in
      [artikel 29, onderdeel d, subonderdelen 2 tot en met 5, van de Subsidieregeling agrarisch natuurbeheer][ref33]
      zijn verstrekt;

      e. € 29.000.000,– voor subsidies als bedoeld in
      [artikel 2, onderdelen a tot en met c, van de Subsidieregeling agrarisch natuurbeheer][ref34] ten behoeve van de
      beheers- en landschapspakketten, opgenomen in de [bijlagen 6 tot en met 14][ref35], [16 tot en met 18][ref36],
      [23 tot en met 28][ref37] en [29 tot en met 46][ref38], voor terreinen ten behoeve waarvan in het jaar
      2004 of 2005 die subsidies of een subsidie op grond van een beschikking of regeling als bedoeld in
      [artikel 29, onderdeel d, subonderdelen 2 tot en met 5, van de Subsidieregeling agrarisch natuurbeheer][ref39] niet
      zijn verstrekt;

      f. € 1.000.000,– voor subsidie als bedoeld in
      [artikel 2, onderdeel a, van de Subsidieregeling agrarisch natuurbeheer][ref40] ten behoeve van
      het beheerspakket, opgenomen in [bijlage 22][ref41], voor terreinen ten behoeve waarvan in het jaar
      2004 of 2005 die subsidie of een subsidie op grond van een beschikking of regeling als bedoeld in
      [artikel 29, onderdeel d, subonderdelen 2 tot en met 5, van de Subsidieregeling agrarisch natuurbeheer][ref42] niet
      is verstrekt;

      g. € 100.000,– voor subsidie als bedoeld in
      [artikel 2, onderdeel a, van de Subsidieregeling agrarisch natuurbeheer][ref43] ten behoeve van het beheerspakket,
      opgenomen in [bijlage 28b][ref44];

      h. € 25.200.000,– voor subsidie als bedoeld in
      [artikel 2, onderdeel a, van de Subsidieregeling agrarisch natuurbeheer][ref45] ten behoeve van de
      beheerspakketten, opgenomen in de [bijlagen 28c tot en met 28f][ref46];

      i. € 1.360.000,– voor subsidie als bedoeld in [artikel 2a van de Subsidieregeling agrarisch natuurbeheer][ref47];

      j. € 1.600.560,– voor subsidie als bedoeld in
      [artikel 2, onderdeel a, van de Subsidieregeling agrarisch natuurbeheer][ref48], voor terreinen gelegen in het
      blok, bedoeld in [artikel 1 van de Landinrichtingswet][ref49], dat betrokken is in de ruilverkaveling ‘Lage
      Maaskant’. De datum, bedoeld in [artikel 36 van de Subsidieregeling agrarisch natuurbeheer][ref50] ligt niet voor
      1 mei.

      4 In zoverre in afwijking van het derde lid, onderdelen e en f, wordt voor de provincies Flevoland en Friesland het
      subsidieplafond vastgesteld op € 0,–.

      5 De verplichtingen op grond van de beheerspakketten, opgenomen in de
      [bijlagen 28c tot en met 28f bij de Subsidieregeling agrarisch natuurbeheer][ref51], gelden vanaf 1 oktober.


