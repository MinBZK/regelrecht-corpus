  - number: 9g
    text: |-
      Het subsidieplafond, bedoeld in
      [artikel 2, eerste lid, van de Regeling effectgerichte maatregelen in bossen en natuurterreinen][ref1] wordt voor
      het jaar 2007 vastgesteld op:

      a. € 1.638.400,– voor de Vereniging Natuurmonumenten;

      b. € 2.012.160,– voor De Landschappen;

      c. € 2.293.760,– voor de Unie van Bosgroepen;

      d. € 455.680,– voor particulieren.


      [ref1]: https://wetten.overheid.nl/BWBR0007715#Artikel8
