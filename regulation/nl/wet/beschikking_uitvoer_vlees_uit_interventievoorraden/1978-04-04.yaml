preamble:
  text: |-
    Gelet op artikel 71 van de Veewet,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003166/1978-04-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het verbod tot uitvoer van vlees zonder dat een onderzoek, als bedoeld in [artikel 68 van de Veewet][ref1]
      heeft plaatsgehad, wordt ontheffing verleend ten aanzien van vlees dat door een interventiebureau van een andere
      lid-staat van de Europese Economische Gemeenschap op grond van een machtiging, als bedoeld in artikel 1 van de
      [Verordening (EEG) nr. 1055/77](31977R1055) van de Raad van de Gemeenschap (Pb. E.G. 24 mei 1977, nr. L. 128/1)
      in Nederland is opgeslagen en overeenkomstig het bepaalde in artikel 5, tweede lid, van de [Verordening (EEG)
      nr. 1722/77](31977R1722) van de Europese Commissie (Pb EG 29 juli 1977, nr. L 189/36) ten invoer tot gebruik is
      ingeklaard, mits dit vlees onmiddellijk na deze inklaring rechtstreeks wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
    url: https://wetten.overheid.nl/BWBR0003166/1978-04-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
  - number: '2'
    text: |-
      Deze beschikking kan worden aangehaald als Beschikking uitvoer vlees uit interventievoorraden en treedt in werking
      op de dag na haar bekendmaking in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003166/1978-04-04#Artikel2
