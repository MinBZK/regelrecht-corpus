  - number: '20'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de afdelingshoofden of daarmee
      vergelijkbare leidinggevende functionarissen bevoegd om ten aanzien van het tot hun afdeling behorende personeel
      namens de Staat der Nederlanden de volgende handelingen en beslissingen te verrichten of te nemen:

      1. Het vaststellen van een vacante functie zoals bedoeld in het [besluit Werving en Selectie][ref2];

      2. Het openstellen van een vacature op grond van het [besluit Werving en Selectie][ref3];

      3. Bij openstelling van een vacature is het afdelingshoofd ten aanzien van het eigen organisatieonderdeel waar
      de vacature bestaat bevoegd met betrekking tot het besluit tot het aanbieden van een arbeidsovereenkomst aan
      de kandidaat die voor de functie in aanmerking komt en het afwijzen van de overige kandidaten, uitgezonderd de
      teamleiders of vergelijkbare leidinggevende functionarissen;

      4. Het stellen van voorwaarden voor het aangaan van een arbeidsovereenkomst zoals bedoeld in de CAO Rijk, de
      [Wet op de medische keuringen][ref4] en het werving- en selectiebeleid;

      5. Het toekennen van buitengewoon verlof op grond van de CAO Rijk.

      6. Het toekennen van toelagen voor:

      a. een periodieke verhoging van het salaris,

      b. toelage onregelmatige dienst,

      c. vaste toelage onregelmatige dienst,

      d. aflopende toelage onregelmatige dienst,

      e. toelage werktijdverschuiving,

      f. toelage bereikbaarheids- en beschikbaarheidsdienst,

      g. toelage bezwarende omstandigheden,

      h. toelage waarnemen hogere functie en

      i. toelagen die vallen onder de Van Werk Naar Werk voorzieningen;

      7. Ten aanzien van de goedkeuring van bijzondere beloningsregelingen zoals de vergoeding voor Bedrijfshulpverlening
      en stagevergoeding;

      8. Het met personeel direct ressorterend onder het afdelingshoofd voeren van voortgang dan wel personeelsgesprekken
      zoals bedoeld in de CAO Rijk;

      9. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs op grond van de CAO Rijk;

      10. Goedkeuring dan wel afwijzing van verzoeken tot vergoeding buitenlandse dienstreizen binnen Europa en de
      bijbehorende reis en verblijfskosten;

      11. Het beslissen over stopzetten of opschorten van loondoorbetaling tijdens ziekte wanneer zich één van de gronden
      daarvoor genoemd in de regelgeving voordoet;

      12. Het uitvoeren van de verplichtingen van de werkgever met betrekking tot de bedrijfsgeneeskundige begeleiding
      van de ambtenaar bij ziekte en arbeidsongeschiktheid; en

      13. De bevoegdheden opgenomen in [artikel 21][ref5] worden uitgeoefend door de afdelingshoofden voor zover het
      handelingen en beslissingen betreft aangaande de direct onder hen ressorterende leidinggevenden.


