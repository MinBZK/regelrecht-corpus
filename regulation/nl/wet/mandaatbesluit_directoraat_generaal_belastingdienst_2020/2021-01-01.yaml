    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het mandaatbesluit Ministerie van Financiën 20120][ref1]zijn de algemeen directeuren bevoegd de
      navolgende handelingen en beslissingen te verrichten of te nemen:

      1. Het vaststellen van de organisatie op afdelings- en teamniveau, en hiermee samenhangend het beslissen tot
      reorganisaties van deze onderdelen binnen de eigen directie. Het vaststellen van de organisatie en hiermee
      samenhangende beslissingen tot reorganisatie op het niveau van afdelingen vindt plaats na instemming van de DG;

      2. Het beslissen tot groepsgewijze werving en selectie voor (groeps)functies.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Hoofdstuk4
