  - number: '22'
    text: |-
      1 Het [mandaatbesluit Directoraat-Generaal Belastingdienst 2018][ref1] wordt ingetrokken.

      2 Besluiten of handelingen die op grond van het [mandaatbesluit Directoraat-Generaal Belastingdienst 2018][ref2]
      zijn genomen of verricht in de periode tot de datum van inwerkingtreding van dit besluit en waarin op het tijdstip
      van inwerkingtreding van dit besluit niet is voorzien, worden aangemerkt als te zijn genomen of verricht namens
      de DG.

      3 Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen, waarin op het tijdstip van inwerkingtreding van dit besluit niet is voorzien, blijven van kracht
      totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in
      intrekking daarvan.


