  - number: '12'
    text: |-
      1 Bij het maken van afspraken, afdoen van stukken en ondertekenen van uitgaande brieven met betrekking tot de in
      [bijlage 2][ref1] opgenomen personeelsaangelegenheden is voorafgaand advies van de directeur SSO Organisatie &
      Personeel (O&P), of een door de directeur SSO O&P aan te wijzen afdelingshoofd, vereist, of is voorafgaand advies
      van de directeur DLSO vereist indien het de Douane betreft, of is voorafgaand advies van de directeur FIOD vereist
      indien het de FIOD betreft.

      2 Bij het beslissen over verzoeken ten aanzien van het starten van een gerechtelijke procedure met betrekking tot
      personeelsaangelegenheden is voorafgaande goedkeuring door de directeur concerndirectie Organisatie & Personeel
      vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0043518
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel12
    references:
