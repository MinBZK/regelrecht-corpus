  - number: '2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a) volmacht: de bevoegdheid om namens de Minister voor de Staat of de Staat der Nederlanden privaatrechtelijke
      rechtshandelingen te verrichten; en

      b) machtiging: de bevoegdheid om namens de Minister voor de Staat of de Staat der Nederlanden handelingen te
      verrichten die noch een besluit noch een privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de gemandateerde of gevolmachtigde worden diens taken volledig
      uitgeoefend door een aangewezen plaatsvervanger. De aanwijzing van een plaatsvervanger geschiedt door de
      mandaatgever of gevolmachtigde met inachtneming van het [Organisatiebesluit directoraat-generaal Belastingdienst
      2020](onbekend) en in overeenstemming met de algemene leiding DGBD ten aanzien van de directeuren van de
      topstructuur DGBD.

      De aanwijzing van een plaatsvervanger anders dan plaatsvervanger voor de directeuren van de topstructuur DGBD,
      geschiedt door de directeur van de topstructuur DGBD van het betreffende organisatieonderdeel met inachtneming van
      het [Organisatiebesluit directoraat-generaal Belastingdienst 2020](onbekend).

      2 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de gemandateerde of gevolmachtigde en diens
      plaatsvervanger worden de taken volledig uitgeoefend door de naasthogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel3
  - number: '4'
    text: |-
      Indien beslissingsbevoegde functionarissen zoals bedoeld in dit besluit, in een onderdeel niet voorkomen behoren de
      bevoegdheden toe aan de naast hogere leidinggevende functionaris.
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel4
  - number: '5'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden mandaathouders of
      gevolmachtigden in overleg met de algemene leiding van het DGBD, voordat van bevoegdheden gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel5
  - number: '6'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt:

      *Voor alle besluiten met uitzondering van de personeelsbesluiten:*

      DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS VAN FINANCIËN,

      Namens deze,

      (handtekening)

      Gevolgd door naam en functie van de (onder)gemandateerde functionaris

      *Voor personeelsbesluiten:*

      Staat der Nederlanden, waarvan de zetel is gevestigd te Den Haag, vertegenwoordigd door DE MINISTER VAN FINANCIËN,
      resp. DE STAATSSECRETARIS VAN FINANCIËN, meer in het bijzonder door [naam organisatieonderdeel], namens deze,

      (HANDTEKENING)

      [naam], [functie]
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel6
  - number: '7'
    text: |-
      1 De pDG is (beheersmatig) verantwoordelijk voor de directies, genoemd in het [organisatiebesluit
      directoraat-generaal Belastingdienst 2020](onbekend) opgenomen [bijlage 2 onder A en K tot en met X]
      (onbekend), voor de samenhang tussen die directies en – met inachtneming van de hetgeen bepaald in de
      [artikelen 11 tot en met 16 van het mandaatbesluit van het ministerie van Financiën 2020][ref1] – voor de
      bijbehorende bedrijfsvoering.

      2 De directeuren van de topstructuur DGBD hebben binnen het kader van de jaarcontracten en binnen eventueel door de
      staatssecretaris of namens de staatssecretaris door de algemene leiding van het ministerie of de algemene leiding
      van het DGBD gegeven richtlijnen mandaat ten aanzien van het nemen van besluiten en afdoen van stukken betreffende
      alle aangelegenheden die behoren tot hun werkterrein tenzij bij wet anders is bepaald of de aard van de bevoegdheid
      zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel11
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '11'
  - number: '8'
    text: |-
      1 Conform het [mandaatbesluit Ministerie van Financiën 2020][ref1], verleent de DG voor de in [artikel 3][ref2]
      van het voornoemde mandaatbesluit genoemde bevoegdheden ondermandaat aan budgethouders.

      2 De directeuren van de topstructuur DGBD zoals genoemd in [artikel 7 lid 2][ref3] worden gemandateerd door de DG
      om financiële verplichtingen aan te gaan. In een ondermandaat wordt de omvang ervan aangegeven.

      3 De leidinggevende functionarissen, zoals genoemd in [bijlage 1][ref4], die ressorteren onder de directeuren
      behorende tot de topstructuur DGBD, worden gemandateerd, voor zover het binnen het eigen werkterrein betreft,
      financiële verplichtingen aan te gaan. Deze verplichtingen zijn beperkt tot de maximumbedragen als genoemd in
      bijlage 1. Daarnaast geldt de restrictie dat een budgethouder niet meer mag verplichten dan het beschikbare budget.

      4 Verplichtingen van of boven de € 50.000,– exclusief BTW worden alleen aangegaan mits er goedkeuring is van de
      controller van de concerndirectie Control & Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0043022
      [ref2]: https://wetten.overheid.nl/BWBR0043022#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0043518#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0043518
