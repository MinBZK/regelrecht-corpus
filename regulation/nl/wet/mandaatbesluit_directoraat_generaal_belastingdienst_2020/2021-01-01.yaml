        bwb_id: BWBR0043518
  - number: '13'
    text: |-
      Onderdeel van deze regeling vormt een mandaat- en volmachtregister dat wordt gepubliceerd. Het mandaat- en
      volmachtregister bevat handtekeningen en parafen van de gemandateerde / gevolmachtigde functionarissen zoals
      bedoeld in de [hoofdstukken 2][ref1] en [3][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0043518#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043518#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel13
