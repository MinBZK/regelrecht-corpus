        hoofdstuk: '3'
  - number: '14'
    text: |-
      Met inachtneming van [hoofdstuk 4 van het mandaatbesluit Ministerie van Financiën 2020][ref1] is de algemene
      leiding van het DGBD bevoegd namens de Staat der Nederlanden, en voor lid 16 namens de Staatssecretaris van
      Financiën, ten aanzien van het personeel van het DGBD de navolgende handelingen en beslissingen te verrichten of
      te nemen:

      1. Tot het aangaan van een arbeidsovereenkomst met werknemers met een bezoldiging van schaal 15 of hoger in
      functies met een lagere schaal dan de voor de werknemers tot dan toe geldende schaal;

      2. Het voordragen van functies die ten behoeve van het instellen van een veiligheidsonderzoek voor aanwijzing als
      vertrouwensfuncties in aanmerking komen;

      3. Uitzending naar en plaatsing in het buitenland;

      4. Het beslissen tot directie overstijgende groepsgewijze werving en selectie voor (groeps)functies;

      5. Het afkondigen van een vacaturestop;

      6. Het aanwijzen van vertrouwenspersonen integriteit;

      7. Het beslissen over de toekenning van een stimuleringspremie;

      8. Het beslissen over de afwijkingen bij de toepassing van het sociaal flankerend beleid;

      9. Het beslissen over het maken van een buitenlandse dienstreis, uitgezonderd de buitenlandse dienstreizen vanuit
      de directies Douane en FIOD;

      10. Het beslissen over privéverlenging van een buitenlandse dienstreis;

      11. Het beslissen over de vergoeding van representatiekosten;

      12. Het aanwijzen van brugdagen;

      13. Het beslissen op verzoeken tot doorwerken na het bereiken van de AOW-gerechtigde leeftijd;

      14. Het beslissen ten aanzien van schadeloosstelling (vanaf € 5.000,–), inclusief besluitvorming over
      schadevergoeding die voortvloeit uit door de rechter gedane uitspraken;

      15. Het beëindigen van de arbeidsovereenkomst middels:

      a. Het verzoeken van toestemming aan het UWV tot ontslag wegens langdurige arbeidsongeschiktheid;

      b. Het verzoeken tot ontbinding van de arbeidsovereenkomst wegens langdurige arbeidsongeschiktheid;

      c. Het verzoeken tot ontbinding van de arbeidsovereenkomst wegens het bij regelmaat niet kunnen verrichten van
      de bedongen arbeid als gevolg van ziekte of gebreken van de werknemer met voor de bedrijfsvoering onaanvaardbare
      gevolgen;

      d. Het verzoeken tot ontbinding van de arbeidsovereenkomst wegens de ongeschiktheid van de werknemer tot het
      verrichten van de bedongen arbeid, anders dan ten gevolge van ziekte of gebreken van de werknemer;

      e. Het verzoeken van ontbinding van de arbeidsovereenkomst wegens een combinatie van ontslaggronden, tenzij één
      ontbindingsgronden is voorbehouden aan de pSG.

      16. Het geven van toestemming op verzoeken om systemen te mogen raadplegen naar aanleiding van vermoedens van niet
      integer gedrag door medewerkers;

      17. Het aanwijzen van de voorzitter, de plaatsvervangend voorzitter, de leden en de plaatsvervangend leden, de
      secretaris en de plaatsvervangend secretaris van de Klachtencommissie ongewenste omgangsvormen;

      18. Handelingen en beslissingen verband houdende met de klachtenregeling seksuele intimidatie;

      19. Handelingen en beslissingen verband houdende met een adviesaanvraag bij de Commissie gelijke behandeling;

      20. Met inachtneming van de [artikelen 11 tot en met 13][ref2] en
      [15 van het mandaatbesluit Ministerie van Financiën 2020][ref3] worden de bevoegdheden opgenomen in
      [artikelen 7][ref4], [10][ref5] en [11][ref6] uitgeoefend door de algemene leiding voor zover het rechtspositionele
      handelingen en beslissingen betreft aangaande directeuren van de topstructuur DGBD; en

      21. Het verrichten van handelingen en nemen van beslissingen voor zover dit besluit daarin niet voorziet.


