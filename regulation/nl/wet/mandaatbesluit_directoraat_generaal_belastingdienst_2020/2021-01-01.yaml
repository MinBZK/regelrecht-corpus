preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:9 en 10:12 van de Algemene wet bestuursrecht en artikel 4.6 eerste lid van de
    Comptabiliteitswet 2016 en de artikelen 2, 3, 4, 8, 10, 11 tot en met 16 Mandaatbesluit Ministerie van Financiën
    2020 en hoofdstuk 5 van het Organisatiebesluit Ministerie van Financiën 2020; en

    In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *bewindspersoon:* de Minister of de Staatssecretaris van Financiën;

      b. *de staatssecretaris:* de Staatssecretaris van Financiën

      c. *het DGBD:* het directoraat-generaal Belastingdienst;

      d. *de DG:* de directeur-generaal Belastingdienst;

      e. *de pDG:* de plaatsvervangend directeur-generaal Belastingdienst;

      f. *algemene leiding DGBD:* de DG en de plaatsvervangend directeur-generaal (pDG);

      g. *directeuren van de topstructuur DGBD:* algemeen directeur, (hoofd)directeur van concerndirecties, shared
      service organisaties (SSO) of corporate diensten;

      h. *mandaat:* de bevoegdheid om in naam van een bewindspersoon besluiten te nemen;

      i. *volmacht:* volmacht als bedoeld in [artikel 3:60, eerste lid, van het Burgerlijk Wetboek][ref1], om namens de
      Staat der Nederlanden rechtshandelingen te verrichten;

      j. *ondervolmacht:* de volmacht die de gevolmachtigde aan een ander verleent;

      k. *gevolmachtigde:* degene aan wie volmacht is verleend;

      l. *gemandateerde:* degene aan wie mandaat is verleend;

      m. *volmachtverlener:* degene die volmacht verleent;

      n. *mandaatgever:* degene die mandaat verleent;

      o. *medewerker:* de ambtenaar in de zin van de [Ambtenarenwet 2017][ref2] die werkzaam is bij het ministerie van
      Financiën;

      p. *CAO Rijk:* de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren werkzaam binnen de sector
      Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel1
