  - number: '18'
    text: |-
      De algemeen directeur van de Douane en de FIOD is bevoegd te beslissen over het maken en verlengen van een
      buitenlandse dienstreis ten aanzien van het personeel van de eigen directie.
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel18
  - number: '19'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de overige directeuren bevoegd
      om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel namens de Staat der Nederlanden de
      volgende handelingen en beslissingen te verrichten of te nemen:

      1. Ten aanzien van de onder de directeur ressorterende teamleiders of vergelijkbare leidinggevende functionarissen:

      a. Het vaststellen van een vacante functie zoals bedoeld in het [besluit Werving en Selectie][ref2];

      b. Het openstellen van een vacature op grond van het [besluit Werving en Selectie][ref3];

      c. Bij openstelling van een vacature is de directeur ten aanzien van het eigen organisatieonderdeel waar de
      vacature bestaat bevoegd met betrekking tot de beslissing tot het aanbieden van een arbeidsovereenkomst aan de
      kandidaat die voor de functie in aanmerking komt en het afwijzen van de overige kandidaten; en

      d. Het stellen van voorwaarden voor het aangaan van een arbeidsovereenkomst zoals bedoeld in de CAO Rijk, de
      [Wet op de medische keuringen][ref4] en het werving- en selectiebeleid.

      2. Het bepalen van de inhoud en het waarderingsniveau van de feitelijk opgedragen functie binnen de kaders van het
      functiegebouw Rijk dan wel op grond van de systematiek voor groepsfuncties;

      3. Het met personeel direct ressorterend onder de directeur en het personeel van salarisschaal 15 en hoger voeren
      van voortgangs- dan wel personeelsgesprekken;

      4. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs ten aanzien van de direct onder de directeur ressorterend personeel;

      5. Het beslissen ten aanzien van schadeloosstelling tot € 5.000,–, inclusief besluitvorming over schadevergoeding
      die voortvloeit uit door de rechter gedane uitspraken;

      6. Het toekennen van maatregelen van sociaal flankerend beleid, uitgezonderd de toekenning van een
      stimuleringspremie;

      7. Verzoeken tot uitbreiding tot en met 36 uur per week dan wel vermindering van de arbeidsduur;

      8. Afwijzing van de aanvraag betreffende Partiële Arbeidsparticipatie Senioren (PAS);

      9. Het inhouden van salaris;

      10. Ten aanzien van salaris aan de ambtenaar die als militair of als vrijwillig ambtenaar van politie, in
      werkelijke dienst is;

      11. Ten aanzien van de nabestaandenuitkering in geval van overlijden van de ambtenaar;

      12. Ten aanzien van de nabestaandenuitkering bij vermissing van een ambtenaar;

      13. Ten aanzien van het geen aanspraak hebben op salaris dan wel het vervallen van aanspraken op grond van het
      aflopen van het dienstverband tijdens ziekte, dan wel het niet nakomen van de verplichtingen tijdens ziekte;

      14. Het aanwijzen van bedrijfshulpverleners;

      15. Het vaststellen van de personeelsbeoordeling als beoordelingsautoriteit;

      16. Het toekennen van een diensttijd of ambtsjubileumgratificatie;

      17. Het toekennen van toeslagen vanwege periodieke salarisverhoging, toelage eenmalige uitkering op een andere
      grond en toelage personenchauffeurs;

      18. Het toekennen van vergoedingen voor overwerk;

      19. Handelingen en beslissingen met betrekking tot het treffen van ordemaatregelen als opgenomen in de CAO Rijk;

      20. Het aanwijzen van vertegenwoordigers van de Staat der Nederlanden bij de behandeling van een procedure bij het
      UWV, de rechtbank, het Gerechtshof en bij de rechtbank bij beroep en de Centrale Raad van Beroep bij hoger beroep;
      en

      21. De bevoegdheden opgenomen in [artikelen 20][ref5] en [21][ref6] worden uitgeoefend door de overige directeuren
      voor zover het rechtspositionele handelingen en besluiten betreft aangaande de direct onder hen ressorterende
      leidinggevenden.


