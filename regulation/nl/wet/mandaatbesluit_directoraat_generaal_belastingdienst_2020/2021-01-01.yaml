  - number: '10'
    text: |-
      Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD onder de 1.000.000 euro exclusief
      btw – materieel – aan derden zijn voorbehouden aan de algemeen directeur directie Informatievoorziening en
      directeur SSO Facilitaire Dienstverlening, na goedkeuring van de controller van de concerndirectie Control &
      Financiën. Het aangaan van verplichtingen tot het leveren van dienstverlening door het DGBD boven de 1.000.000
      euro, is voorbehouden aan de algemene leiding van het DGBD.
    url: https://wetten.overheid.nl/BWBR0043518/2021-01-01#Artikel10
  - number: '11'
    text: |-
      Aan de DG is voorbehouden te beslissen over aanbestedingsprocedures, indien een andere dan de procedures als
      bedoeld in de [hoofdstukken 1.2][ref1] en [2.1 van de Aanbestedingswet 2012][ref2] wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk1.2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
