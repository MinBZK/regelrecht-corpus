  - number: '21'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het mandaatbesluit van het ministerie van Financiën 2020][ref1] zijn de teamleiders of daarmee
      vergelijkbare leidinggevende functionarissen bevoegd om ten aanzien van het tot hun team behorende personeel namens
      de Staat der Nederlanden de volgende handelingen en beslissingen te verrichten of te nemen:

      1. Ten aanzien van de toekenning aan werknemers van individuele keuzemogelijkheden in het arbeidsvoorwaardenpakket;

      2. Toekennen aanvraag aanpassing van de werktijdregeling in het kader van de regeling Partiële Arbeidsparticipatie
      Senioren (PAS);

      3. Ten aanzien van vakantie en verlof;

      4. Over het toekennen van studiefaciliteiten als bedoeld in ten aanzien van werknemers tot en met salarisschaal 14,
      tot een bedrag van € 5.000,–;

      5. Goedkeuring dan wel afwijzing van verzoeken tot vergoeding van verhuiskosten en -verlof, declaraties woon-werk-
      verkeer, binnenlandse dienstreizen en de bijbehorende reis en verblijfskosten;

      6. Het met ambtenaren voeren van voortgang dan wel personeelsgesprekken; en

      7. Het uitvoeren van de verplichtingen van de werkgever met betrekking tot de bedrijfsgeneeskundige begeleiding van
      de ambtenaar bij ziekte en arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Hoofdstuk4
