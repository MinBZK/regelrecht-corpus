  - number: '16'
    text: |-
      Met inachtneming van hetgeen is bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het mandaatbesluit Ministerie van Financiën 2020][ref1] zijn de directeuren van de topstructuur
      DGBD bevoegd om ten aanzien van het tot het eigen organisatieonderdeel behorende personeel namens de Staat der
      Nederlanden de in het eerste tot en met achtste onderdeel en tiende tot en met dertiende onderdeel genoemde
      handelingen en beslissingen te verrichten of te nemen en ten aanzien van het tot het DGBD behorende personeel
      namens de Staat der Nederlanden en de in het negende onderdeel genoemde rechtspositionele handeling te verrichten.

      1. Het openstellen van een vacature op grond van het [besluit Werving en Selectie][ref2];

      2. Het wijzigen van een salarisschaal zonder wijziging van de functie met instemming van de medewerker;

      3. Het beslissen tot opleggen van straffen (conform CAO Rijk), met uitzondering van de wettelijke mogelijkheden
      het dienstverband te beëindigen, aan functionarissen tot en met schaal 14 voor zover het geen leidinggevende
      functionarissen betreft;

      4. Toekennen van buitengewoon verlof van lange duur;

      5. Het opmaken en bespreken van de personeelsbeoordeling en het indien wenselijk aanwijzen van informanten en
      adviseurs ten aanzien van de direct onder de directeur ressorterend personeel;

      6. Het toekennen van een beloning dan wel non-activiteitswedde in verband met het vervullen van een openbare
      functie;

      7. Tijdelijke ontheffing uit de functie in verband met het bekleden van een functie in een publiekrechtelijk
      college;

      8. Het toestaan of afwijzen van de door de ambtenaar opgegeven nevenwerkzaamheden op grond van de
      integriteitsbepalingen opgenomen in de [Ambtenarenwet 2017][ref3];

      9. Het afnemen van de eed of de belofte, tenzij dit verband houdt met een tijdelijke arbeidsovereenkomst;

      10. Over het toekennen van studiefaciliteiten ten aanzien van werknemers met salarisschaal 15 of hoger, of vanaf
      een bedrag van € 5.000,–;

      11. Uitvoering geven aan een sociale dan wel medische indicatie;

      12. Het beslissen over verzoeken om het starten van of verweren in een gerechtelijke procedure,
      voor zover die betrekking hebben op handelingen of beslissingen waarbij een werknemer als bedoeld in
      [artikel 1 van de Ambtenarenwet][ref4] als zodanig belanghebbende is; en

      13. De bevoegdheden opgenomen in [artikelen 19][ref5], [20][ref6] en [21][ref7] worden uitgeoefend door de
      directeuren van de topstructuur DGBD voor zover het handelingen en beslissingen betreft aangaande de direct onder
      hen ressorterende leidinggevenden.


