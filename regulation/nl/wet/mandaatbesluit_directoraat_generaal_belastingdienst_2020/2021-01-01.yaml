  - number: '15'
    text: |-
      Met inachtneming van hetgeen bepaald in voorgaande artikelen en in
      [hoofdstuk 4 van het mandaatbesluit Ministerie van Financiën 2020][ref1] is de pDG bevoegd om ten aanzien van
      de directies als bedoeld in [artikel 7 lid 1][ref2] van dit besluit namens de Staat der Nederlanden de navolgende
      handelingen en beslissingen te verrichten of te nemen:

      1. Het beslissen over verzoeken ten aanzien van het starten van of verweren in een gerechtelijke procedure,
      voor zover die betrekking hebben op handelingen of beslissingen waarbij een ambtenaar als bedoeld in
      [artikel 1 van de Ambtenarenwet 2017][ref3] als zodanig belanghebbende is;

      2. Het beslissen tot groepsgewijze werving en selectie voor (groeps)functies;

      3. Het vaststellen van de organisatie op afdelings- en teamniveau, en hiermee samenhangend het beslissen tot
      reorganisaties van deze onderdelen. Het vaststellen van de organisatie en hiermee samenhangende beslissingen tot
      reorganisatie op het niveau van afdelingen vindt plaats na instemming van de DG.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0043518#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel1
