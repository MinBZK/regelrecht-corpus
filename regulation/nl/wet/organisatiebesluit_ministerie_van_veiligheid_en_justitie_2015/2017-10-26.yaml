  - number: '46'
    text: |-
      1 De dienst Terugkeer en Vertrek (DT&V) is als taakorganisatie belast met de uitvoering van de
      vreemdelingenwetgeving ten aanzien van vertrek en uitzetting.

      2 De dienst bestaat uit:

      a. de directie Internationale aangelegenheden;

      b. de directie Ondersteuning en Voorbereiden Terugkeer;

      c. de directie Toezicht en Maatregelen;

      d. de afdeling Strategisch advies;

      e. de afdeling Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel46
  - number: '47'
    text: |-
      De Immigratie- en Naturalisatiedienst (IND) is een baten-lastendienst die belast is met de uitvoering van de
      vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '48'
    text: |-
      1 Het secretariaat van de Adviescommissie voor Vreemdelingenzaken (secretariaat ACVZ) is belast met de ambtelijke
      ondersteuning van die commissie.

      2 Het secretariaat bestaat uit:

      a. het procescluster Advisering;

      b. het procescluster Informatie en Documentatie;

      c. het procescluster Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel48
  - number: '50'
    text: |-
      1 De Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV) heeft tot taak het versterken van de
      nationale veiligheid en het voorkomen van maatschappelijke ontwrichting door dreigingen voor de vitale belangen van
      de samenleving te identificeren en de weerbaarheid en bescherming van die vitale belangen te versterken. Hiertoe
      verricht de NCTV in het bijzonder activiteiten die zijn gericht op:

      a. het bevorderen van de identificatie en de analyse van dreigingen en risico's op het gebied van terrorisme en
      nationale veiligheid;

      b. het reduceren van kansen of effecten van de genoemde dreigingen en risico’s door:

      i. het verhogen van weerbaarheid van vitale belangen;

      ii. zorg te dragen voor een dekkend stelsel van de crisisbeheersing vanaf het niveau van de veiligheidsregio’s, met
      name wat betreft de organisatie van de brandweerzorg en de geneeskundige hulpverlening in die regio’s, tot en met
      het nationale niveau;

      c. het nemen van beschermingsmaatregelen ten aanzien van daartoe aangewezen bijzondere personen, objecten en
      diensten;

      d. het adequaat functioneren van het stelsel van bewaken en beveiligen;

      e. het zorgdragen voor de samenhang in de besluitvorming bij een dreigende ramp of crisis;

      f. de strategieontwikkeling rond cyber security, het realiseren van risicomanagement op het gebied van cyber
      security en het bevorderen van de publiek-private samenwerking op het gebied van cyber security.

      2 De Nationaal Coördinator Terrorismebestrijding en Veiligheid bestaat uit de volgende dienstonderdelen:

      a. de directie Analyse en Strategie (DAS);

      b. de directie Cyber Security (DCS);

      c. de directie Bewaking, Beveiliging en Burgerluchtvaart (DB3);

      d. de stafafdeling Bedrijfsvoering;

      e. de directie Weerbaarheidsverhoging (WVH);

      f. de programmadirectie Contraterrorisme (CT);

      g. het Nationaal Crisis Centrum (NCC);

      h. het Landelijk Operationeel Coördinatie Centrum (LOCC).
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel50
  - number: '51'
    text: |-
      1 De NCTV legt inhoudelijk direct verantwoording af aan de minister.

      2 De NCTV wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel51
  - number: '52'
    text: |-
      1 De directie Analyse en Strategie heeft de volgende taken:

      a. de coördinatie van algemene parlementaire aangelegenheden en de voorbereiding van interdepartementale en
      politiek-bestuurlijke besluitvorming;

      b. de strategische positionering van de NCTV;

      c. de uitvoering van de decentrale juridische functie ten behoeve van de NCTV;

      d. de voorbereiding van de internationale en Europese beleidsvorming op het gebied van de NCTV;

      e. het in samenwerking en in overleg met andere partijen binnen en buiten de NCTV aanleveren van dreiging
      gerelateerde producten ten behoeve van de eigen werkzaamheden en de werkzaamheden van veiligheidspartners;

      f. het tijdens een crisis opstellen van het actuele dreigings- en incidentenbeeld en de omgevingsanalyse ten
      behoeve van de crisisbesluitvorming.

      2 De directie bestaat uit:

      a. de afdeling Strategie;

      b. de afdeling Terrorisme en Extremisme;

      c. de afdeling Natuurlijke, Technische en Maatschappelijke Dreiging.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel52
  - number: '53'
    text: |-
      1 De directie Cyber Security heeft de volgende taken:

      a. de coördinatie van de uitvoering van de Nationale Cyber Security Strategie;

      b. het voeren van actief risicomanagement op het gebied van cyber security;

      c. het vergroten van de digitale weerbaarheid van de Nederlandse samenleving;

      d. het voeren van het secretariaat van de publiek-private samenwerking op het gebied van cyber security.

      2 De directie bestaat uit:

      a. het cluster Operationele Ondersteuning;

      b. de afdeling Cyber Security Beleid;

      c. de afdeling Monitoring en Respons;

      d. de afdeling Expertise en Advies;

      e. de afdeling Marktontwikkelingen en Partnerschappen.

      3 De afdelingen genoemd onder het tweede lid onder c tot en met e vormen samen het Nationaal Cyber Security
      Centrum.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel53
  - number: '54'
    text: |-
      1 De directie Bewaking, Beveiliging en Burgerluchtvaart heeft de volgende taken:

      a. het opstellen, onderhouden en uitvoeren van het nationaal stelsel van bewaken en
      beveiligen, het stelsel van speciale eenheden, het Alerteringssysteem Terrorismebestrijding, de
      [Regeling bijstand bestrijding luchtvaartterrorisme][ref1] en het uitvoeren van risicoanalyses ten behoeve van de
      burgerluchtvaart op basis waarvan eventuele aanvullende beveiligingsmaatregelen worden genomen;

      b. het in nationaal en internationaal verband opstellen van het beleid op het gebied van de beveiliging van de
      burgerluchtvaart;

      c. het opstellen van regels en het geven van aanwijzingen aan de Koninklijke marechaussee en de luchtvaartsector op
      basis van de [Luchtvaartwet][ref2] en de [Politiewet 2012][ref3];

      d. het aansturen van de Koninklijke marechaussee, voor zover deze onder het gezag van de minister is belast met het
      toezicht op de uitvoering van de beveiligingsmaatregelen door de luchtvaartsector;

      e. het opstellen, onderhouden en uitvoeren van het Nationaal Beveiligingsplan voor de Burgerluchtvaart;

      f. het deelnemen aan internationale beveiligingsinspecties op luchthavens.

      2 De directie bestaat uit:

      a. de afdeling Beveiliging Burgerluchtvaart en Alertering Terrorismebestrijding;

      b. de afdeling Bewaking en Beveiliging.


      [ref1]: https://wetten.overheid.nl/BWBR0018217
      [ref2]: https://wetten.overheid.nl/BWBR0002267
      [ref3]: https://wetten.overheid.nl/BWBR0031788
