  - number: '2'
    text: |-
      Het ministerie heeft een hoofdstructuur, bestaande uit de volgende dienstonderdelen (clusters):

      a. het cluster secretaris-generaal (SG-cluster);

      b. het cluster plaatsvervangend secretaris-generaal (pSG-cluster);

      c. het directoraat-generaal Straffen en Beschermen (DGSenB);

      d. het directoraat-generaal Politie (DGPOL);

      e. het directoraat-generaal Rechtspleging en Rechtshandhaving DGRR);

      f. het directoraat-generaal Vreemdelingenzaken (DGVZ);

      g. de Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV);

      h. de Inspectie Veiligheid en Justitie (IVenJ).
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel2
  - number: '3'
    text: |-
      1 De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen.

      2 De secretaris-generaal wordt bij afwezigheid vervangen door de plaatsvervangend secretaris-generaal. Bij
      afwezigheid van de secretaris-generaal en de plaatsvervangend secretaris-generaal vindt vervanging plaats door een
      van de directeuren-generaal of de Nationaal Coördinator Terrorismebestrijding en Veiligheid, in volgorde van de
      datum van benoeming.

      3 De hoofden van de clusters zijn belast met de beleids- en bedrijfsvoering van de tot hun cluster behorende
      onderdelen.

      4 Eén van de tot het directoraat-generaal behorende directeuren wordt op voordracht van de desbetreffende
      directeur-generaal namens de minister door de secretaris-generaal aangewezen als plaatsvervangend directeur-
      generaal. Het voorgaande is van overeenkomstige toepassing op de Nationaal Coördinator Terrorismebestrijding en
      Veiligheid, de plaatsvervangend secretaris-generaal en het hoofd van de Inspectie Veiligheid en Justitie.

      5 De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal, de directeuren-generaal en de
      Nationaal Coördinator Terrorismebestrijding en Veiligheid vormen samen de bestuursraad. De bestuursraad formuleert
      de ministeriebrede en gemeenschappelijke kaders en bewaakt dat de activiteiten en het beleid van de onderscheiden
      clusters daarbinnen blijven.

      De voorzitter van het College van procureurs-generaal, de hoofddirecteur van de Dienst Justitiële Inrichtingen,
      de hoofddirecteur van de Immigratie- en Naturalisatiedienst en de korpschef van de Nationale Politie nemen als
      toehoorder deel aan de bestuursraad.


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel2
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel3
    references:
