  - number: '61'
    text: |-
      1 De directie Toezicht is belast met de uitvoering van de toezichttaken conform het inspectiewerkplan.

      2 Binnen deze directie worden de inspectieonderzoeken uitgevoerd, geclusterd naar domein, waarbij domein gezien
      moet worden als een naar onderwerp inhoudelijk gerelateerde clustering van projecten.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel61
  - number: '62'
    text: |-
      De directie Strategie en Innovatie is belast met:

      a. de strategische en innovatieve functie en de ontwikkeling van nieuwe onderzoeksdomeinen en -taken.

      b. onderzoeken voorbereiden vanuit de ontwikkeltaak van de directie.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel62
  - number: '63'
    text: |-
      1 Het Stafbureau IVenJ is belast met de bedrijfsvoering, de uitvoering van de communicatie en de ondersteuning van
      de leiding van IVenJ.

      2 Het bureau stelt de leiding in staat om de processen binnen IVenJ te beheersen en aan te sturen.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel63
  - number: '64'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde clusters en daaronder ressorterende dienstonderdelen liggen
      voor het daarbij werkzame personeel ter inzage:

      a. een exemplaar van dit besluit;

      b. het organisatie- en formatierapport van het betreffende dienstonderdeel.


