articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *ministerie:* Ministerie van Veiligheid en Justitie;

      b. *minister:* Minister van Veiligheid en Justitie;

      c. *staatssecretaris:* Staatssecretaris van Veiligheid en Justitie;

      d. *departementsleiding:* minister en de staatssecretaris alsmede de secretaris-generaal, de plaatsvervangend
      secretaris-generaal, de directeuren-generaal, de Nationaal Coördinator Terrorismebestrijding en Veiligheid en het
      hoofd van de Inspectie Veiligheid en Justitie gezamenlijk;

      e. *bestuursdepartement:* de departementsleiding alsmede de beleids-, staf- en bedrijfsvoeringonderdelen ter
      ondersteuning van de departementsleiding;

      f. *bestuursraad:* de bestuursraad, bedoeld in [artikel 3, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036820#Artikel3
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel1
