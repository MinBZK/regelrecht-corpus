      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De hoofden van de clusters zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de
      directeur Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk maken.
