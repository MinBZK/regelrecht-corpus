  - number: '60'
    text: |-
      1 De Inspectie Veiligheid en Justitie (IVenJ) is belast met:

      a. toezichtstaken op het terrein van het ministerie en heeft daartoe de volgende hoofdtaken:

      i. het houden van toezicht op de uitvoering en de naleving van de regelgeving op het terrein van het ministerie en
      van regelgeving op andere daartoe bij of krachtens de wet aangewezen beleidsterreinen;

      ii. het gevraagd en ongevraagd verstrekken van inlichtingen en adviezen aan de minister of staatssecretaris over
      onderwerpen die tot hun taken horen;

      iii. het vervullen van andere door de minister aan de Inspectie opgedragen toezichtstaken.

      b. de handhavingstaken bedoeld in [hoofdstuk 9 van de Jeugdwet][ref1] met uitzondering van het geven en handhaven
      van een schriftelijke aanwijzing.

      2 De Inspectie Veiligheid en Justitie bestaat uit de volgende dienstonderdelen:

      a. de directie Toezicht (DT);

      b. de directie Strategie en Innovatie (DSI);

      c. het stafbureau Inspectie VenJ (Stafbureau IVenJ).


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk9
