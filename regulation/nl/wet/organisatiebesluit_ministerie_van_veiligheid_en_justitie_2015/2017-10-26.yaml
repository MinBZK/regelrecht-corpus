    text: |-
      1 De directie Strafrechtketen (DSK) is belast met:

      a. de bestuurlijke informatievoorziening over de strafrechtketen en het bevorderen van de ketensamenwerking binnen
      de strafrechtketen;

      b. de administratieve en secretariële ondersteuning ten behoeve van het landelijk en bestuurlijk
      Strafrechtketenberaad.

      2 De directie Strafrechtketen is voorts belast met het uitvoeren van ontwikkelopgaven die moeten bijdragen
      aan een effectieve coördinatie op de keteninformatievoorziening, het optimaliseren van de bestuurlijke
      informatievoorziening en het verbeteren van de samenwerking binnen de strafrechtketen.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel41a
  - number: '42'
    text: |-
      1 De baten-lastendienst Nederlands Forensisch Instituut (NFI) heeft met het oog op de waarheidsvinding in
      strafzaken de volgende kerntaken:

      a. het verrichten van onafhankelijk forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake daarvan uitbrengen van verslag;

      b. het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken ter bevordering van kennis op het
      gebied van forensisch onderzoek;

      c. het zijn van een nationaal en internationaal kennis- en expertisecentrum op het gebied van forensisch onderzoek.

      2 Bij de uitvoering van deze taken levert het NFI producten of diensten aan het openbaar ministerie, de politie, de
      bijzondere opsporingsdiensten, de zittende magistratuur en het ministerie.

      3 Het NFI is voorts belast met door de minister aangewezen bijkomende taken.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel42
  - number: '43'
    text: |-
      1 De Justitiële Informatiedienst (JustID) fungeert als centrale voorziening ten behoeve van de registratie van
      justitiële en strafvorderlijke gegevens en de verstrekking daarvan aan daartoe bevoegde personen en instanties.

      2 Onder meer het Centraal Informatiepunt Onderzoek Telecommunicatie (CIOT) en het Platform Interceptie & Decriptie
      & Signaalanalyse (PIDS) zijn ondergebracht bij JustID.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel43
