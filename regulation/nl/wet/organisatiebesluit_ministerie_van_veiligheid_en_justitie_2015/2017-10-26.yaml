    text: |-
      1 De directie Regie Vreemdelingenketen (DRV) heeft tot taak de vreemdelingenketen in staat te stellen
      de [Vreemdelingenwet 2000][ref1] en het vreemdelingenbeleid snel en zorgvuldig uit te voeren en daarover
      verantwoording af te leggen door het ondersteunen van zowel de ketenregisseur als de bij de vreemdelingenketen
      aangesloten organisaties. De directie heeft binnen het cluster tevens een aantal ondersteunende taken, waaronder de
      controllersfunctie, en beheert met de Verantwoordelijke Autoriteit de Europese Migratie- en Veiligheidsfondsen van
      meerdere beleidsonderwerpen.

      2 De directie bestaat uit:

      a. de afdeling Ketensturing;

      b. de afdeling Ketenvoorzieningen;

      c. het bureau Bedrijfsvoering en Control;

      d. het bureau Verantwoordelijke Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel45a
