  - number: '68'
    text: |-
      Na inwerkingtreding van dit besluit wordt in mandaatbesluiten die verwijzen naar de
      [Organisatieregeling Ministerie van Veiligheid en Justitie 2011][ref1], gelezen het Organisatiebesluit Ministerie
      van Veiligheid en Justitie 2015. In afwachting van aanpassing van deze verwijzingen in de mandaatbesluiten moet
      worden geacht te zijn verwezen naar bepalingen van gelijke strekking uit het Organisatiebesluit Ministerie van
      Veiligheid en Justitie 2015.


