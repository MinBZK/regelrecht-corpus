        bwb_id: BWBR0005252
  - number: '6'
    text: |-
      1 De directie Europese en Internationale Aangelegenheden (DEIA) draagt zorg voor een ministeriebrede strategie- en
      visieontwikkeling ten aanzien van multilaterale, Europese en bilaterale horizontale dossiers en beleidsvraagstukken
      en ten aanzien van Koninkrijksamenwerking, internationale projecten en expertisegebieden. Tevens is de directie
      belast met de zorg voor een gecoördineerde en effectieve inzet van Nederland op het gebied van Veiligheid en
      Justitie binnen het kader van de samenwerking binnen de Europese Unie en in het kader van de samenwerking op
      multilateraal, bilateraal en Koninkrijksniveau. Tenslotte faciliteert de directie de politieke en ambtelijke
      leiding alsmede de directies in logistieke en instrumentele zin op voornoemde terreinen en verzorgt zij de daarop
      betrekking hebbende informatievoorziening aan interne dossierhouders en belanghebbenden.

      2 De directie bevordert en bewaakt de eenheid van optreden op de in het eerste lid genoemde terreinen met
      inachtneming van de eigen beleidsverantwoordelijkheid van andere dienstonderdelen voor de internationale aspecten
      van hun beleidsterrein.

      3 De directie bestaat uit:

      a. de afdeling Europese Unie;

      b. de afdeling Internationale Betrekkingen en Projecten;

      c. de afdeling Veiligheid en Justitie van de Permanente Vertegenwoordiging bij de Europese Unie;

      d. de attachees Veiligheid en Justitie op andere Nederlandse ambassades en permanente vertegenwoordigingen in het
      buitenland;

      e. de managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel6
  - number: '7'
    text: |-
      De Centrale Eenheid Strategie (CES) is belast met:

      a. het ontwikkelen van strategische inzichten en agendavorming voor de middellange en lange termijn door intern en
      extern als verbinder te fungeren;

      b. het stimuleren van visievorming op de middellange en lange termijn;

      c. het organiseren van de strategische dialoog in de bestuursraad;

      d. het ondersteunen van de gedachtewisseling over strategische thema’s tussen de leden van de departementsleiding;

      e. het signaleren van ontwikkelingen die een aanzet tot vernieuwing voor het ministerie kunnen betekenen.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel7
  - number: '8'
    text: |-
      1 Het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC) is belast met:

      a. het verrichten van onderzoek en het doen verrichten van onderzoek, waaronder het evalueren van beleid en
      beleidsprogramma's;

      b. het adviseren over voorgenomen beleid en beleidsprogramma’s;

      c. het ontwikkelen, onderhouden en toegankelijk maken van data;

      d. het verspreiden van binnen het WODC aanwezige kennis;

      e. de documentatie van (sociaal-)wetenschappelijke publicaties op het terrein van Veiligheid en Justitie.

      2 Het WODC bestaat uit:

      a. de onderzoeksafdeling Criminaliteit, Veiligheid, Rechtshandhaving en Sancties (CVRS);

      b. de onderzoeksafdeling Rechtsbestel, Wetgeving, Internationale en vreemdelingenaangelegenheden (RWI);

      c. de afdeling Externe Wetenschappelijke Betrekkingen (EWB);

      d. de afdeling Statistische lnformatievoorziening en Beleidsanalyse (SIBa);

      e. de afdeling Documentaire lnformatievoorziening (DIV);

      f. de afdeling Bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel8
  - number: '9'
    text: |-
      1 Het bureau Secretaris-Generaal (BSG) is belast met:

      a. algemene staftaken, zoals de algemene parlementaire coördinatie en de secretariële, administratieve en
      organisatorische ondersteuning van de minister, de staatssecretaris, de secretaris-generaal en de plaatsvervangend
      secretaris-generaal;

      b. de protocollaire ondersteuning van de departementsleiding van het ministerie en vervult daarbij een
      coördinerende rol;

      c. de integrale beveiliging van het departement. Deze taken worden gekenmerkt door een representatief of
      vertrouwelijk karakter;

      2 Het bureau is voorts belast met het beheer van het instituut Nationaal rapporteur mensenhandel en seksueel geweld
      tegen kinderen.

      3 Het bureau bestaat uit:

      a. de afdeling Advies;

      b. de afdeling Project-, Programma- en Adviescentrum (PPAC);

      c. de afdeling Managementondersteuning Departementsleiding;

      d. de Beveiligingsautoriteit (BA);

      e. het Bureau Protocol en Evenementen;

      f. het Bedrijfsbureau.

      4 De directeur Bestuursondersteuning is het hoofd van het bureau Secretaris-Generaal.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel9
  - number: '10'
    text: |-
      1 De directie Communicatie (DCOM) is belast met het geven van informatie van en over het ministerie. Hierbij wordt
      gezocht naar een goede balans tussen het belang van het ministerie en dat van de ontvangers. Ook heeft de directie
      tot taak om politieke en maatschappelijke signalen op te vangen en terug te koppelen binnen de organisatie.

      2 De directie bestaat uit:

      a. het Stafbureau;

      b. de afdeling Persvoorlichting, Beleidspresentatie en Nieuwsredactie;

      c. de afdeling Communicatie & Redactie.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel10
  - number: '11'
    text: |-
      1 De directie Financieel-Economische Zaken (DFEZ) is belast met de advisering van de departementsleiding
      over financiële en macro-economische aspecten van beleid, bedrijfsvoering en uitvoering als bedoeld in
      [artikel 27, eerste en tweede lid, van de Comptabiliteitswet 2001][ref1] en de daaruit voortvloeiende regelgeving.

      2 De directie bestaat uit:

      a. de afdeling Begroting en Kaderstelling;

      b. de afdeling Financiële Infrastructuur & Concernadministratie;

      c. de afdeling Financieel-Economische Advisering & Control.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel27
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '27'
  - number: 11a
    text: |-
      Het Innovatieteam is belast met:

      a. het versterken van de innovatieve functie van het ministerie;

      b. het faciliteren van innovatieprojecten voor het ministerie;

      c. internationale samenwerking op het gebied van innovatie;

      d. verbinden van onderzoek en technologie met het werkterrein van het ministerie;

      e. versterken van de samenwerking met externe partners;

      f. interne en externe communicatie en netwerkvorming voor innovatie.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel11a
  - number: '12'
    text: |-
      Het bureau Adviescollege Verloftoetsing tbs is belast met het ondersteunen van het Adviescollege Verloftoetsing tbs
      alsmede het ontwikkelen van richtlijnen en andere vormen van methodische aanpak ten behoeve van dat adviescollege.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel12
  - number: '13'
    text: |-
      1 Het pSG-cluster heeft taken op het terrein van de bedrijfsvoering van het ministerie, in het bijzonder
      betreffende personeel, informatievoorziening, organisatie, automatisering, huisvesting en facilities.

      Daarbij kunnen de volgende taken worden onderscheiden:

      a. departementsbrede kaderstelling, control en advisering aan de secretaris-generaal en bewindslieden;

      b. departementale controle- en auditfunctie;

      c. departementsbrede coördinatie ten behoeve van de inbreng van het VenJ-belang in interdepartementale overleggen
      en trajecten op het terrein van bedrijfsvoering;

      d. advisering van integraal managers in de rol van DG-controller;

      e. dienstverlening op het terrein van bedrijfsvoering ter ondersteuning van de primaire processen op het
      bestuursdepartement.

      2 Het pSG-cluster bestaat uit de volgende dienstonderdelen:

      a. de directie Personeel en Organisatie (DP&O);

      b. de directie Informatisering en Inkoop (DI&I);

      c. het Dienstencentrum (DC);

      d. de directie Huisvesting en Facilities (DHF).
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel13
  - number: '14'
    text: |-
      1 De directie Personeel en Organisatie (DP&O) is belast met:

      a. advisering van de departementsleiding over en de ontwikkeling, organisatie, coördinatie van en control op het
      ministeriebreed organisatie- en personeelsbeleid;

      b. de uitvoering van de departementale werkgeverstaken;

      c. de eerstelijnsadvisering ten aanzien van organisatie- en personeelsaangelegenheden aan de hoofden van de
      clusters en de daaronder ressorterende dienstonderdelen;

      d. de ontwikkeling en organisatie van opleidingsprogramma’s ten behoeve van alle beleidsambtenaren van het
      ministerie.

      2 De directie bestaat uit:

      a. de afdeling Beleidsimplementatie;

      b. de afdeling Kwaliteit, Control en interne Bedrijfsvoering;

      c. de afdeling Dienstverlening;

      d. het Bureau Ondersteuning Medezeggenschap.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel14
  - number: '15'
    text: |-
      De directie Informatisering en Inkoop (DI&I) adviseert de departementsleiding over strategische vraagstukken op het
      gebied van informatievoorziening en ICT, ondersteunt de dienstonderdelen van het ministerie bij de inrichting van
      de keteninformatisering en de beheersing van grote ICT-projecten en draagt zorg voor de uitvoering van projecten
      op het gebied van de VenJ-brede ICT-infrastructuur. Daarnaast stelt de directie ten behoeve van de dienstonderdelen
      van het ministerie kaders en centrale voorzieningen vast met het oog op rechtmatige, efficiënte en duurzame inkoop.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel15
  - number: '17'
    text: |-
      1 Het Dienstencentrum (DC) verzorgt voor het bestuursdepartement de levering van diensten op het gebied van
      huisvesting, facilitaire dienstverlening, ICT, inkoopondersteuning, werkplekservices en diensten op het gebied
      van post en informatievoorziening. Het Dienstencentrum is tevens belast met contractmanagement binnen de
      bedrijfsvoering ten behoeve van het bestuursdepartement.

      2 Het Dienstencentrum bestaat uit:

      a. het cluster Klantadvies en ondersteuning;

      b. het cluster Leveranciersmanagement;

      c. het cluster Portfoliomanagement;

      d. het cluster Bedrijfsvoering;

      e. het cluster inkoop uitvoeringscentrum (IUC);

      f. het cluster Productie informatievoorziening (PIV).
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel17
  - number: '18'
    text: |-
      De directie Huisvesting en Facilities (DHF) is belast met het realiseren van beleid, kaders en richtlijnen
      op het terrein van huisvesting en daarmee verband houdende faciliteiten alsmede met de uitvoering van
      huisvestingsprojecten voor het ministerie en aan het ministerie gerelateerde internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel18
  - number: '19'
    text: |-
      1 Het directoraat-generaal Straffen en Beschermen (DGSenB) is belast met:

      a. het ontwikkelen en uitvoeren van beleid voor de bescherming en begeleiding van jeugdigen in onveilige
      opvoedsituaties en voor een persoonsgerichte en groepsgerichte aanpak van jeugdigen die in aanraking komen of
      dreigen te komen met politie en Justitie;

      b. het ontwikkelen en uitvoeren van beleid voor slachtoffers van geweld en criminaliteit;

      c. de bescherming van personen en instellingen tegen criminaliteit, recidive en onveiligheid;

      d. een effectieve en integrale tenuitvoerlegging van straffen en maatregelen inclusief de regie op dit deel van
      de strafrechtketen.

      2 Het directoraat-generaal bestaat uit een stafondersteuning en de volgende dienstonderdelen:

      a. de directie Sanctietoepassing en Jeugd (DSJ);

      b. de directie Beschermen, Aanpakken en Voorkomen (DBAenV);

      c. de directie Control, Bedrijfsvoering en Juridische Zaken (CBJ);

      d. de baten-lastendienst Dienst JUSTIS;

      e. de baten-lastendienst Dienst Justitiële Inrichtingen (DJI);

      f. de baten-lastendienst Centraal Justitieel Incassobureau (CJIB);

      g. de raad voor de kinderbescherming (RvdK).
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel19
  - number: '20'
    text: |-
      De directeur-generaal Straffen en Beschermen wordt secretarieel, organisatorisch en administratief ondersteund door
      de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel20
  - number: '21'
    text: |-
      1 De directie Sanctietoepassing en Jeugd (DSJ) is belast met de advisering aan de departementsleiding over en de
      coördinatie, ontwikkeling en evaluatie van beleid dat is gericht op:

      a. de consequente en effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en
      maatregelen bij volwassenen;

      b. de vermindering van de recidive door gedragsinterventies en goede aansluiting op maatschappelijke opvang;

      c. de bescherming van minderjarigen;

      d. interlandelijke adoptie, internationale kinderbescherming en internationale kinderontvoering met uitzondering
      van het uitvoeringsbeleid;

      e. het functioneren van de uitvoeringsketen van strafrechtelijke beslissingen, de jeugdketen en de slachtofferketen
      en het verbeteren van de prestaties van deze ketens.

      2 De directie heeft een adviserende taak in de besturing en beleidsvoering van de raad voor de kinderbescherming en
      de Dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.

      3 De directie heeft tot taak het Landelijk Bureau Inning Onderhoudsbijdragen beheersmatig en financieel aan te
      sturen.

      4 De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties
      en instellingen en stuurt deze aan.

      5 De directie wordt ondersteund door een staf en bestaat uit:

      a. de portefeuille Boetes en Detentie;

      b. de portefeuille Toezicht en Behandeling;

      c. de portefeuille Jeugd;

      d. de portefeuille Ketenregie;

      e. het secretariaat van de Raad voor strafrechtstoepassing en jeugdbescherming (secretariaat RSJ).

      6 Het secretariaat RSJ is belast met de bedrijfsvoering en ondersteuning van de Raad voor strafrechtstoepassing
      en jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel21
  - number: '22'
    text: |-
      1 De directie Beschermen, Aanpakken en Voorkomen (DBAenV) is belast met de advisering aan de departementsleiding
      over en de coördinatie, ontwikkeling en evaluatie van beleid dat is gericht op:

      a. het voorkomen en aanpakken van overvallen, woninginbraken straatroof en vermogenscriminaliteit;

      b. het voorkomen en aanpakken van bedreigende situaties voor kinderen en gezinnen;

      c. het voorkomen en aanpakken van jeugdcriminaliteit met justitiële instrumenten;

      d. het versterken van de dienstverlening aan en de positie van slachtoffers van criminaliteit;

      e. het voorkomen van criminaliteit door inzet van preventieve maatregelen met het oog op een veilige en
      rechtvaardige samenleving;

      f. het reguleren en beheersen van kansspelen.

      2 De directie heeft een coördinerende taak in de besturing en beleidsvoering van de Dienst JUSTIS en de Dienst
      Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.

      3 De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties
      en instellingen en stuurt deze aan.

      4 De directie onderhoudt contacten met de kansspelautoriteit ter uitvoering van de werkzaamheden bedoeld in het
      eerste lid, aanhef en onder f.

      5 De directie wordt ondersteund door een staf en bestaat uit:

      a. de portefeuille Aanpak High Impact Crimes;

      b. de portefeuille Integrale Aanpak Kindermishandeling en Jeugdgroepen;

      c. de portefeuille Slachtofferbeleid;

      d. de portefeuille Integriteit en Kansspelen;

      e. het secretariaat van het Schadefonds Geweldsmisdrijven (secretariaat SGM).

      6 Het secretariaat SGM is belast met de bedrijfsvoering en ondersteuning van het Schadefonds Geweldsmisdrijven.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel22
  - number: '23'
    text: |-
      1 De directie Control, Bedrijfsvoering en Juridische Zaken (CBJ) is belast met een integrale controltaak en
      advisering daarover aan de directeur-generaal Straffen en Beschermen en de directeuren Beschermen, Aanpakken en
      Voorkomen en Sanctietoepassing en Jeugd. De controltaak omvat in ieder geval de financiële en beleidsmatige control
      ten aanzien van de taakorganisaties, rechtspersonen met een wettelijke taak, zelfstandige bestuursorganen en
      gesubsidieerde organisaties en instellingen op het terrein van DGSenB.

      2 Daarnaast is de directie belast met het gevraagd en ongevraagd advies uitbrengen over bedrijfsvoerings-,
      informatiemanagement- en juridische vraagstukken, het ondersteunen bij en voeren van juridische procedures en de
      verzorging van de interne bedrijfsvoering.

      3 De directie is budgettair verantwoordelijk voor:

      a. de Stichting Adoptievoorzieningen;

      b. het Centrum Internationale Kinderontvoering;

      c. de International Social Services;

      d. de [Regeling tegemoetkoming adoptiekosten][ref1].

      4 De Centrale autoriteit Internationale Kinderaangelegenheden van de portefeuille, genoemd in het vijfde lid,
      onder c, verricht de werkzaamheden van de Centrale autoriteit interlandelijke adoptie, de Centrale autoriteit
      internationale kinderbescherming en de Centrale autoriteit internationale kinderontvoering. De Centrale autoriteit
      Internationale Kinderaangelegenheden is verantwoordelijk voor het uitvoeringsbeleid ten aanzien van voornoemde
      werkzaamheden.

      5 De directie bestaat uit:

      a. de portefeuille Control;

      b. de portefeuille Bedrijfsvoering;

      c. de portefeuille Juridische en Internationale Zaken;

      d. het onderdeel Informatiemanagement.


