      - id: ref3
        bwb_id: BWBR0031788
  - number: '55'
    text: |-
      De stafafdeling Bedrijfsvoering heeft tot taak de ondersteuning van de NCTV op het gebied van de bedrijfsvoering,
      in het bijzonder betreffende personeelsaangelegenheden, informatiemanagement, huisvesting, automatisering,
      beveiliging en de financiële controle.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel55
  - number: '56'
    text: |-
      1 De directie Weerbaarheidsverhoging heeft de volgende taken:

      a. het versterken van de weerbaarheid van de Nederlandse samenleving door het weerbaarder maken van vitale
      belangen, het voorkomen en beperken van de gevolgen van een ramp of crisis en het herstellen van de daardoor
      veroorzaakte schade;

      b. het zorg dragen voor een optimaal functioneren van het stelsel voor crisisbeheersing en rampenbestrijding, zowel
      voor de landelijke crisisorganisatie als voor het stelsel van veiligheidsregio’s.

      2 De directie bestaat uit:

      a. de afdeling Veiligheidsregio’s;

      b. de afdeling Generieke Veiligheid;

      c. de afdeling Risicoaanpak;

      d. de afdeling Informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel56
  - number: '57'
    text: |-
      1 De programmadirectie Contraterrorisme heeft als taak de coördinatie bij het voorkomen en tegengaan van
      radicalisering en terrorisme, met name via regie op beleid, uitvoering en communicatie voortkomend uit de
      realisatie van het Actieprogramma Integrale Aanpak Jihadisme.

      2 De programmadirectie bestaat uit:

      a. het cluster Versterking samenwerking;

      b. het cluster Politiek-bestuurlijke- en Internationale zaken;

      c. het cluster Tegengaan Radicalisering.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel57
  - number: '58'
    text: |-
      1 Het Nationaal Crisis Centrum heeft de volgende taken:

      a. zorg dragen voor rijksbrede crisiscoördinatie;

      b. het faciliteren, adviseren en het op verzoek coördineren bij grote evenementen met een potentieel risico op
      openbare orde- en veiligheidsproblematiek;

      c. het ontwikkelen en uitvoeren van de risico- en crisiscommunicatie en corporate communicatie.

      2 Het centrum bestaat uit:

      a. de eenheid Crisiscoördinatie;

      b. de eenheid Communicatie.
    url: https://wetten.overheid.nl/BWBR0036820/2017-10-26#Artikel58
  - number: '59'
    text: |-
      1 Het Landelijk Operationeel Coördinatie Centrum (LOCC) maakt deel uit van de nationale
      crisisbesluitvormingsstructuur en draagt hierbij zorg voor het aanleveren van het multidisciplinair Landelijk
      Operationeel Beeld en het operationeel advies bij nationale en internationale incidenten, crises, rampen en
      grootschalige evenementen.

      2 Het LOCC coördineert nationale en internationale bijstand, met inbegrip van de bijstand, bedoeld in de
      [Wet veiligheidsregio’s][ref1] en de [Politiewet 2012][ref2].

      3 Het LOCC draagt tevens, als zijnde de National Training Coördinator, zorg voor de coördinatie, opleiding en inzet
      van de Nederlandse experts in het kader van EU Civil Protection Mechanism.


      [ref1]: https://wetten.overheid.nl/BWBR0027466
      [ref2]: https://wetten.overheid.nl/BWBR0031788
