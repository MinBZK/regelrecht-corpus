valid_from: '2019-01-01'
bwb_id: BWBR0002075
url: https://wetten.overheid.nl/BWBR0002075/2019-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen tot wering en
    bestrijding van organismen, welke schadelijk zijn voor de Landbouw;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. "inspecteur-generaal": inspecteur-generaal van de Nederlandse Voedsel- en Warenautoriteit alsmede de ambtenaar
      die hem vervangt;

      c. "instelling": privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, bedoeld in [artikel 9][ref1];

      d.

      e. "schadelijke organismen": voor planten of plantaardige produkten schadelijke organismen van dierlijke of
      plantaardige aard, alsmede virussen, mycoplasma's, viroïden, rickettsia’s of andere ziekteverwekkers;

      f. "planten": levende planten en levende delen van planten, met inbegrip van verse vruchten en zaden;

      g. "plantaardige produkten": voortbrengselen van plantaardige oorsprong die niet verwerkt zijn of die slechts een
      eenvoudige bewerking hebben ondergaan, voor zover het geen planten betreft;

      h. "verhandelen": verkopen, te koop aanbieden of afleveren alsmede met het oog daarop voorhanden of in voorraad
      hebben;

      i. "invoeren": brengen in Nederland;

      j. "uitvoeren": brengen buiten Nederland;

      k. "telen": brengen of houden van planten in grond of in een ander cultuurmedium.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel9
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '9'
  - number: '2'
    text: |-
      1 Ter voorkoming van het optreden en van de verbreiding van schadelijke organismen kan Onze Minister de in- en
      uitvoer van schadelijke organismen, van planten of plantaardige produkten, van grond of andere cultuurmedia en van
      voor planten of plantaardige produkten gebruikt verpakkingsmateriaal verbieden of regelen stellen waaraan voor, bij
      of na de invoer, onderscheidenlijk voor of bij de uitvoer moet worden voldaan.

      2 De in het eerste lid bedoelde regelen kunnen onder meer betrekking hebben op:

      a. de eisen waaraan de aldaar genoemde zaken moeten voldoen;

      b. het aanmelden van het voornemen tot invoer, onderscheidenlijk uitvoer;

      c. het te verrichten onderzoek;

      d. het in tijdelijke afzondering houden;

      e. de plaats van bestemming en het gebruiksdoel;

      f. het vervoer naar de plaats waar het onderzoek of de tijdelijke afzondering zal geschieden, naar de plaats van
      bestemming, dan wel naar de plaats van weder uitvoer;

      g. de reiniging en ontsmetting van ruimten waarin ingevoerde zaken, genoemd in het eerste lid, zijn opgeslagen
      geweest, van transportmiddelen waarmee die zaken zijn vervoerd of verplaatst en van voorwerpen die bij de opslag,
      het vervoer of de verplaatsing zijn gebruikt.

      3 De inspecteur-generaal is bevoegd, ter voorkoming van het optreden en van de verbreiding van schadelijke
      organismen, de in- en uitvoer van een zending, geheel of ten dele bestaande uit schadelijke organismen, planten,
      plantaardige produkten, grond of andere cultuurmedia, of uit voor planten of plantaardige produkten gebruikt
      verpakkingsmateriaal, te verbieden of voorschriften te geven waaraan voor, bij of na de invoer, onderscheidenlijk
      voor of bij de uitvoer van die zending moet worden voldaan.

      4 Een ieder wie zulks aangaat is verplicht planten, plantaardige produkten, grond of andere cultuurmedia en
      schadelijke organismen, die op grond van het krachtens de voorgaande leden bepaalde niet hadden mogen worden
      ingevoerd, overeenkomstig een hem door de inspecteur-generaal gegeven bevel binnen de daarin gestelde termijn uit
      te voeren dan wel te behandelen of te vernietigen en zo nodig daartoe op de in het bevel aangegeven wijze naar een
      daarin bepaalde plaats te brengen.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel2
  - number: '3'
    text: |-
      1 Ter voorkoming van het optreden en van de verbreiding van schadelijke organismen en ter bestrijding daarvan
      kunnen bij of krachtens algemene maatregel van bestuur regelen worden gesteld omtrent:

      a. het telen, oogsten en rooien van planten, het geven van een bepaalde bestemming aan planten of plantaardige
      produkten en het kenmerken, onder verzegeling brengen, bewaren, voorhanden of in voorraad hebben, verhandelen,
      verplaatsen, vervoeren, bewerken, behandelen en vernietigen of anderszins onschadelijk maken van planten
      en plantaardige produkten, daarvoor gebruikt verpakkingsmateriaal, schadelijke organismen, grond of andere
      cultuurmedia en resten daarvan en afval van planten en plantaardige produkten;

      b. het reinigen en ontsmetten van ruimten, installaties, transportmiddelen, werktuigen en gereedschappen en het
      reinigen, ontsmetten of zo nodig vernietigen van gebruikte materialen en andere voorwerpen;

      c. het toepassen van ontsmettingsmaatregelen door personen bij het betreden of verlaten van ruimten of terreinen;

      d. het treffen van voorzieningen in of aan ruimten;

      e. voor de teelt van planten te gebruiken of gebruikt water;

      f. het melden van verschijnselen van aantasting van planten of plantaardige produkten door schadelijke organismen;

      g. andere onderwerpen, voor zover de nakoming van internationale overeenkomsten of van besluiten van
      volkenrechtelijke organisaties zulks met zich meebrengt, of

      h. administratieve verplichtingen en verplichtingen betreffende het verstrekken van informatie die samenhangen met
      de onderdelen a tot en met g.

      2 Onze Minister is bevoegd in het belang van de bestrijding van schadelijke organismen regelen, als in het eerste
      lid bedoeld, te stellen voor een termijn van ten hoogste vier maanden.

      3 Indien een onmiddellijke voorziening geboden is, is Onze Minister bevoegd om, voor een termijn van ten hoogste
      vier maanden, ten aanzien van individuele gevallen voorschriften te geven betreffende hetgeen in het eerste lid
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel3
  - number: 3a
    text: |-
      1 Degene die planten, behorende tot door Onze Minister aangewezen soorten of groepen, bedrijfsmatig teelt is
      verplicht jaarlijks overeenkomstig door Onze Minister te stellen regelen opgave te doen van door hem met die
      planten te betelen terreinen en plaatsen.

      2 Degene die planten, behorende tot door Onze Minister aangewezen soorten of groepen, al dan niet bedrijfsmatig
      verhandelt is verplicht jaarlijks overeenkomstig door Onze Minister te stellen regelen opgave te doen van de
      terreinen en gebouwen welke hij gebruikt voor opslag, bewerking en het ter verzending gereedmaken van die planten.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel3a
  - number: '4'
    text: |-
      Onze Minister is bevoegd in gevallen waarin de schade, welke het gevolg is van het toepassen van krachtens
      [artikel 3][ref1] gegeven voorschriften, onevenredig zwaar op een of meer personen zou drukken, uit ’s Rijks
      schatkist een tegemoetkoming te verlenen in de geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '3'
  - number: '5'
    text: |-
      Onze Minister kan, wanneer de toepassing van [artikel 3][ref1] tot onbillijkheden aanleiding zou geven door of
      vanwege de inspecteur-generaal op ’s Rijks kosten bepaalde maatregelen tot wering en bestrijding van schadelijke
      organismen doen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '3'
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven betreffende het invoeren of
      kweken van parasieten van schadelijke organismen.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel6
  - number: 6a
    text: |-
      1 Onze Minister kan bepalen dat vergoeding van kosten wordt geheven volgens een door Onze Minister vastgesteld
      tarief voor in het kader van de haar opgedragen taak door de Nederlandse Voedsel- en Warenautoriteit of een
      instelling gedane onderzoekingen of verrichtingen.

      2 Onze Minister kan regelen stellen met betrekking tot het heffen en betalen van de vergoeding. Daarbij kan worden
      bepaald dat de vergoeding wordt geheven door de instelling die de onderzoekingen of verrichtingen uitvoert.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel6a
  - number: '7'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel7
  - number: '8'
    text: |-
      1 Aan de bekendmaking van ingevolge deze wet genomen besluiten die niet tot een of meer belanghebbenden zijn
      gericht, verlenen de burgemeesters desgevraagd hun medewerking.

      2 De ingevolge deze wet vastgestelde regelen van algemene aard worden, voorzover niet neergelegd in een algemene
      maatregel van bestuur, in de *Nederlandse Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel8
  - number: '9'
    text: |-
      Bij algemene maatregel van bestuur kunnen instellingen die daartoe de bereidheid te kennen geven in een bij
      die maatregel te bepalen omvang en op een daarbij te bepalen wijze mede worden belast met de uitvoering van de
      krachtens [artikel 3, eerste lid][ref1], gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '3'
  - number: 9a
    text: |-
      Op een instelling als bedoeld in [artikel 9][ref1] is de [Kaderwet zelfstandige bestuursorganen][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0020495
  - number: '10'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van
      Onze Minister aangewezen ambtenaren, alsmede de bij besluit van Onze Minister aangewezen personen, belast met
      werkzaamheden ter uitvoering van het bij of krachtens deze wet bepaalde, werkzaam bij controle-instellingen
      of keuringsinstellingen als bedoeld in [artikel 8 van de Landbouwkwaliteitswet][ref1] onderscheidenlijk
      [artikel 19 van de Zaaizaad- en plantgoedwet 2005][ref2].

      2 De in het eerste lid bedoelde ambtenaren en personen zijn tevens belast met het onderzoek naar de aanwezigheid
      van schadelijke organismen.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '19'
  - number: '11'
    text: |-
      De [artikelen 5:13][ref1] en [5:15][ref2] tot en met [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 10, tweede lid][ref4], bedoelde ambtenaren en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref4]: https://wetten.overheid.nl/BWBR0002075#Artikel10
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:13
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:15
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 5:20
      - id: ref4
        bwb_id: BWBR0002075
        artikel: '10'
  - number: '12'
    text: |-
      1 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], voor zover het betreft de verplichting tot het
      verlenen van medewerking aan een krachtens [artikel 10][ref2] aangewezen ambtenaar of persoon.

      2 Verkrijgen de in [artikel 10][ref3] bedoelde ambtenaren of personen de wetenschap of het vermoeden van de
      aanwezigheid van schadelijke organismen dan zijn zij bevoegd, in afwachting van krachtens deze wet voor te
      schrijven maatregelen, in individuele gevallen voor de tijd van acht en veertig uur of zoveel langer als naar
      het oordeel van Onze Minister nodig is het vervoeren of verplaatsen van de schadelijke organismen, van planten,
      plantaardige produkten, grond of andere cultuurmedia of andere goederen waarin of waarop zich de schadelijke
      organismen kunnen bevinden, te verbieden of daaromtrent voorschriften te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref2]: https://wetten.overheid.nl/BWBR0002075#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002075#Artikel10
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel12
