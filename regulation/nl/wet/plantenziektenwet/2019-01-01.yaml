        artikel: '10'
  - number: 17a
    text: |-
      De Bloembollenziektenwet 1937 (*S.* no. 639 L) wordt ingetrokken met ingang van een bij koninklijk besluit nader te
      bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel17a
  - number: '18'
    text: Deze wet kan worden aangehaald onder de titel van Plantenziektenwet.
    url: https://wetten.overheid.nl/BWBR0002075/2019-01-01#Artikel18
