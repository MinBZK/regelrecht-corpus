  - number: '121.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie voor de productie van hernieuwbare warmte uit zonne-energie, met een apertuuroppervlakte van
      100 vierkante meter of meer, waarbij uitsluitend gebruik wordt gemaakt van afgedekte collectoren.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel121
  - number: '121.2'
    text: |-
      Aanvragen om subsidie als bedoeld in het eerste lid worden ontvangen in de periode van 3 september 2012, 17:00 uur,
      tot 27 december 2012, 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel121
  - number: '121.3'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031291
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0031291
  - number: '122.1'
    text: |-
      Subsidie als bedoeld in [artikel 121, eerste lid][ref1], wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel121
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0031291
        artikel: '121'
        paragraaf: '5'
  - number: '122.2'
    text: |-
      De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 121, eerste lid][ref1], binnen 3 jaar na
      de datum van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel121
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel122
