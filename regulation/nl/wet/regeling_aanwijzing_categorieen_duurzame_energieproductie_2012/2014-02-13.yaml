  - number: '126.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit en hernieuwbare warmte,
      geproduceerd door een bestaande productie-installatie van ten minste 8,5 jaar oud:
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel126
  - number: 126.1.a
    text: |-
      waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd met gebruik van uitsluitend biogas uit
      allesvergisting en waarbij het nominaal elektrisch vermogen ten minste 30% van de som van het nominale warmte en
      elektrisch vermogen bedraagt;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel126
  - number: 126.1.b
    text: |-
      waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd met gebruik van uitsluitend biogas uit
      vergisting en co-vergisting van dierlijke mest en waarbij het nominaal elektrisch vermogen ten minste 30% van de
      som van het nominale warmte en elektrisch vermogen bedraagt;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel126
  - number: 126.1.c
    text: |-
      voor de productie van hernieuwbare elektriciteit en hernieuwbare warmte door inzet van warmte verkregen uit
      thermische conversie van vaste of vloeibare biomassa en waarbij het nominaal elektrisch vermogen ten minste 6% van
      de som van het nominale warmte en elektrisch vermogen bedraagt.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel126
  - number: '126.2'
    text: |-
      Productie-installaties als bedoeld in het eerste lid worden aangewezen als productie-installaties als bedoeld in
      [artikel 3, eerste lid, onderdeel d en tweede lid, onderdeel a, van het besluit][ref1].


