      warmte van wie hernieuwbare warmte voor het eerst nuttig wordt gebruikt en die de hernieuwbare elektriciteit en
      hernieuwbare warmte produceert door middel van:
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel116
