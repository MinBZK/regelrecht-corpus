  - number: '4.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee door hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit wordt
      geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van de
      elektriciteitsproductie omhoog is gepompt:
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
  - number: 4.1.a
    text: in installaties met een valhoogte gelijk aan of groter dan 50 centimeter en kleiner dan 5 meter;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
  - number: 4.1.b
    text: in installaties met een valhoogte gelijk aan of groter dan 5 meter.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
  - number: '4.2'
    text: 'Aanvragen om subsidie als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
  - number: 4.2.a
    text: |-
      het eerste lid, onderdeel a, worden ontvangen in de periode van 3 september 2012, 17:00 uur, tot 27 december 2012,
      17:00 uur;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
  - number: 4.2.b
    text: |-
      het eerste lid, onderdeel b, worden ontvangen in de periode van 1 mei 2012, 17:00 uur, tot 27 december 2012, 17:00
      uur.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
  - number: '4.3'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031291
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031291
  - number: '5.1'
    text: |-
      Subsidie als bedoeld in [artikel 4, eerste lid][ref1], wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel4
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel5
