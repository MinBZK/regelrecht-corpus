      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een ketel
      met een nominaal thermisch vermogen groter dan of gelijk aan 0,5 MW, voor de productie van warmte uit verbranding
      van vaste of vloeibare biomassa als bedoeld in de NTA 8003: 2008, met uitzondering van biomassa als bedoeld in de
      nummers 100, 150, 170 tot en met 179, 500, 550 tot en met 559 van de NTA 8003: 2008.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel76
  - number: '76.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de voor de productie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel76
  - number: '76.3'
    text: |-
      De minister verstrekt uitsluitend subsidie als bedoeld in het eerste lid voor productie van hernieuwbare warmte
      met behulp van vloeibare biomassa indien de producent aantoont dat de gebruikte vloeibare biomassa voldoet aan de
      duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel76
  - number: '76.4'
    text: |-
