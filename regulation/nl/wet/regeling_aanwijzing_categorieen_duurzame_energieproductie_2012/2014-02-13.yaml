  - number: '49.1'
    text: 'De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel49
  - number: 49.1.a
    text: |-
      een productie-installatie bestaande uit een vergistingsinstallatie en een installatie voor het opwerken van
      hernieuwbaar gas tot aardgaskwaliteit, waarmee hernieuwbaar gas wordt geproduceerd met gebruik van uitsluitend
      biogas uit allesvergisting;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel49
  - number: 49.1.b
    text: |-
      een productie-installatie bestaande uit een vergistingsinstallatie en een installatie voor het opwerken van
      hernieuwbaar gas tot aardgaskwaliteit, waarmee hernieuwbaar gas wordt geproduceerd met gebruik van uitsluitend
      biogas uit vergisting en co-vergisting van dierlijke mest;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel49
  - number: 49.1.c
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd met gebruik van uitsluitend biogas uit
      allesvergisting die onderdeel uitmaakt van een groen gas hub voor de gezamenlijke invoeding van het hernieuwbaar
      gas op een gasnet;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel49
  - number: 49.1.d
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd met gebruik van uitsluitend biogas uit
      vergisting en co-vergisting van dierlijke mest die onderdeel uitmaakt van een groen gas hub voor de gezamenlijke
      invoeding van het hernieuwbaar gas op een gasnet.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel49
  - number: '49.2'
    text: |-
      Productie-installaties als bedoeld in het eerste lid, onderdelen c en d, worden aangewezen
      als productie-installaties als bedoeld in de [artikelen 32, vierde lid][ref1], en
      [56, eerste lid, tweede volzin, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel56
