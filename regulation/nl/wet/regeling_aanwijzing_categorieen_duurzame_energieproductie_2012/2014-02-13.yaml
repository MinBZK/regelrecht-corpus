  - number: '59.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biomassa als bedoeld in de NTA 8003: 2008, met uitzondering
      van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179, 500, 550 tot en met 559 van de NTA 8003: 2008,
      door middel van vergassing.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel59
  - number: '59.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de voor de productie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel59
  - number: '59.3'
    text: |-
      Aanvragen om subsidie als bedoeld in het eerste lid worden ontvangen in de periode van 5 november 2012, 17:00 uur,
      tot 27 december 2012, 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel59
  - number: '59.4'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031291
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel59
    references:
