  - number: '106.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit en hernieuwbare warmte
      geproduceerd door een productie-installatie voor de productie van hernieuwbare elektriciteit en hernieuwbare warmte
      door inzet van warmte verkregen uit thermische conversie van vaste of vloeibare biomassa als bedoeld in de NTA
      8003: 2008, met uitzondering van biomassa als bedoeld in de nummers 100, 150, 170 tot en met 179 en 550 tot en met
      559 van de NTA 8003: 2008:
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: 106.1.a
    text: |-
      met een nominaal elektrisch vermogen groter dan 10 MW en kleiner dan of gelijk aan 100 MW en waarbij het nominaal
      elektrisch vermogen ten minste 10% van de som van het nominale warmte en elektrisch vermogen bedraagt;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: 106.1.b
    text: |-
      met een nominaal elektrisch vermogen kleiner dan of gelijk aan 10 MW en waarbij het nominaal elektrisch vermogen
      ten minste 6% van de som van het nominale warmte en elektrisch vermogen bedraagt.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: '106.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de voor de productie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: '106.3'
    text: |-
      De minister verstrekt uitsluitend subsidie als bedoeld in het eerste lid voor productie van hernieuwbare
      elektriciteit en hernieuwbare warmte met behulp van vloeibare biomassa indien de producent aantoont dat de
      gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: '106.4'
    text: 'Aanvragen om subsidie als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: 106.4.a
    text: |-
      het eerste lid, onderdeel a, worden ontvangen in de periode van 1 mei 2012, 17:00 uur, tot 27 december 2012, 17:00
      uur;
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: 106.4.b
    text: |-
      het eerste lid, onderdeel b, worden ontvangen in de periode van 5 november 2012, 17:00 uur, tot 27 december 2012,
      17:00 uur
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
  - number: '106.5'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031291
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel106
    references:
