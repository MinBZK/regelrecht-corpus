      zonnepanelen met een vermogen groter dan of gelijk aan 15 kWp, die is aangesloten op een elektriciteitsnet via een
      aansluiting met een totale maximale doorlaatwaarde van meer dan 3*80 A.
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel28
  - number: '28.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031291
    url: https://wetten.overheid.nl/BWBR0031291/2014-02-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0031291
  - number: '29.1'
    text: |-
