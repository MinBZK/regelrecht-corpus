preamble:
  text: |-
    Gelet op artikel 5 van de Wet op bijzondere medische verrichtingen en op artikel 1, onder b, van het Besluit
    aanwijzing bijzondere medische verrichtingen,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder radiotherapie: de behandeling van patiënten door middel van:

        - teletherapie
        - brachytherapie.
    url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#Artikel1
  - number: '2'
    text: |-
      De behoefte aan het aantal centra waar radiotherapie plaatsvindt, de spreiding van deze centra over Nederland en de
      manier waarop eventuele uitbreiding van bestralingapparatuur bij de bestaande centra gerealiseerd moet worden, zijn
      neergelegd in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#Artikel2
  - number: '3'
    text: |-
      Het bedrag van de investeringskosten voor apparatuur, bedoeld in
      [artikel 1, onder b ,van het Besluit aanwijzing bijzondere medische verrichtingen][ref1], tot welk bedrag een
      vergunning niet vereist is, wordt vastgesteld op 30 mln. per afzonderlijk apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005209#Artikel1
    url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005209
        artikel: '1'
  - number: '4'
    text: Het Planningsbesluit radiotherapie (Stcrt. 1987, 148) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Planningsbesluit radiotherapie 2000.'
    url: https://wetten.overheid.nl/BWBR0011656/2000-09-28#Artikel6
