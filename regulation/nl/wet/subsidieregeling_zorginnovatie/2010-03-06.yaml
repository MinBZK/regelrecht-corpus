  - number: '37'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 januari 2013, met dien verstande dat zij van toepassing blijft op
      subsidies en zorginnovatievouchers die op grond van deze regeling zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel37
  - number: '38'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling zorginnovatie.'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel38
