  - number: '2'
    text: |-
      De [Hoofdstukken I][ref1] en [II van de Subsidieregeling VWS-subsidies][ref2] zijn van overeenkomstige toepassing
      op het verstrekken van een subsidie op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0019947#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019947
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0019947
        hoofdstuk: II
  - number: '3.1'
    text: |-
      Voor een aanvraag van een verlening of vaststelling van een subsidie of voucher op grond van deze regeling wordt
      een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel3
  - number: '3.2'
    text: |-
      De minister kan op grond van [artikel 25, derde lid, van de Subsidieregeling VWS-subsidies][ref1] voor het
      projectverslag en de subsidiedeclaratie een formulier vaststellen dat uitsluitend geldt voor een subsidie die op
      grond van deze


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel25
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '25'
  - number: '4.1'
    text: 'Voor subsidie komen de kosten in aanmerking die:'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: 4.1.a
    text: verbonden zijn met de uitvoering van een activiteit;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: 4.1.b
    text: de gewone bedrijfsuitoefening betreffen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.2'
    text: |-
      De kosten van aangeschafte apparatuur en verbruikte materialen en hulpmiddelen worden berekend op basis van
      historische aanschafprijzen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.3'
    text: |-
      De eventuele restwaarde van specifiek voor de subsidiabele activiteiten aangeschafte apparatuur maakt geen deel uit
      van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.4'
    text: |-
      De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidieontvanger die de kosten
      heeft gemaakt, omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.5'
    text: |-
      Winstopslagen bij transacties binnen een groep worden alleen in aanmerking genomen voor zover het gebruikelijk is
      die winstopslagen ook bij soortgelijke transacties buiten de groep in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.6'
    text: |-
      De subsidiabele kosten worden berekend op basis van een voor de subsidie-ontvanger gebruikelijke en controleerbare
      methode, die is gebaseerd op bedrijfeconomische grondslagen en normen die in het maatschappelijk verkeer als
      aanvaardbaar worden beschouwd en die de subsidie-ontvanger stelselmatig toepast.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.7'
    text: |-
      Indien het aantal direct productieve uren niet blijkt uit de methode, bedoeld in het zesde lid, wordt het aantal
      direct productieve uren voor een fulltime dienstverband gesteld op 1650 uur.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '4.8'
    text: |-
      Bij subsidie aan een zorgaanbieder of MKB-ondernemer waar een Europees steunkader op van toepassing is, komen
      alleen de kosten voor vergoeding in aanmerking die voldoen aan de eisen van het desbetreffende steunkader.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel4
  - number: '5.1'
    text: |-
      Deze regeling valt onder de [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’)
      (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel5
  - number: '5.2'
    text: |-
      De minister beslist geheel of gedeeltelijk afwijzend op een aanvraag van een subsidie of voucher op grond van deze
      regeling voor zover dit nodig is om te voldoen aan een de-minimis verordening of een Europees steunkader.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel5
  - number: '6.1'
    text: |-
      De subsidie-ontvanger voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke wijze
      is af te leiden:
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel6
  - number: 6.1.a
    text: de aard, inhoud en voortgang van de verrichte activiteiten;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel6
  - number: 6.1.b
    text: het aantal uren dat per persoon is besteed aan activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel6
  - number: 6.1.c
    text: de specifiek ten behoeve van de activiteiten gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel6
  - number: '6.2'
    text: De administratie wordt tot vijf jaar na de datum van de beschikking tot subsidievaststelling bewaard.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel6
  - number: '7'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.a
    text: |-
      *collectieve activiteiten:* activiteiten die op basis van zorginnovatieplannen door vijf of meer ZIPC-deelnemers
      gezamenlijk zullen worden gefinancierd en uitgevoerd krachtens een samenwerkingsovereenkomst tussen die deelnemers,
      waarin hun onderlinge rechten en verplichtingen en een evenredige verdeling van de resultaten van die activiteiten
      worden geregeld;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.b
    text: |-
      *zorginnovatieplan:* planmatige beschrijving van de activiteiten, inclusief de planning, kosten en opbrengsten
      daarvan, die een ZIPC-deelnemer in het kader van een ZIPC-verband zal verrichten met het oog op zorginnovatie,
      met inbegrip van de activiteiten die hij tezamen met een of meer andere ZIPC-deelnemers zal verrichten en van zijn
      verplichtingen jegens de ZIPC-penvoerder van het ZIPC-verband;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.c
    text: |-
      *zorginnovatietraject:* activiteiten die de ZIPC-penvoerder en de ZIPC-deelnemers verrichten ter uitvoering van de
      zorginnovatieplannen en het overkoepelende plan;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.d
    text: '*ZIPC-deelnemer:* zorgaanbieder of MKB-ondernemer die deelneemt aan een ZIPC-verband;'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.e
    text: |-
      *ZIPC-penvoerder:* niet krachtens publiek recht ingestelde rechtspersoon met volledige rechtsbevoegdheid, die geen
      winstoogmerk heeft, die volgens haar statuten tot doel heeft de behartiging van belangen van zorgaanbieders, van
      MKB-ondernemers of van cliënten van zorgaanbieders en die namens de ZIPC-deelnemers optreedt als projectleider
      van een ZIPC-verband op basis van een met de ZIPC-deelnemers gesloten samenwerkingsovereenkomst, dan wel – voor
      de toepassing van paragraaf 2 van dit hoofdstuk – degene die de mogelijkheden onderzoekt om tot een ZIPC-verband
      te komen;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.f
    text: |-
      *ZIPC-verband:* geen rechtspersoonlijkheid bezittend verband, bestaande uit een ZIPC-penvoerder en ZIPC-deelnemers,
      dat is aangegaan ten behoeve van de uitvoering van een zorginnovatietraject;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: 7.g
    text: |-
      *overkoepelend plan:* beschrijving van de activiteiten, die krachtens een tussen de ZIPC-penvoerder en de ZIPC-
      deelnemers gesloten samenwerkingsovereenkomst gedurende de looptijd van een zorginnovatietraject door de ZIPC-
      penvoerder ten behoeve van de ZIPC-deelnemers zullen worden uitgevoerd alsmede een omschrijving van de planning en
      de geraamde kosten en opbrengsten van die activiteiten.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel7
  - number: '8'
    text: |-
      Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het subsidieplafond,
      bedoeld in [artikel 12][ref1] of [20][ref2], zou worden overschreden, stelt de minister de onderlinge rangschikking
      van deze aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0026090#Artikel20
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026090
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '9'
    text: |-
      De Minister kan op aanvraag een projectsubsidie verstrekken aan een ZIPC-penvoerder in het kader van de
      voorbereiding en totstandkoming van een ZIPC-verband voor:
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel9
  - number: 9.a
    text: |-
      het uitvoeren van een innovatiepositiestudie resulterende in een innovatiepositierapport, waarin de ontwikkelingen
      binnen een deel van de zorgsector, de behoefte aan innoverende technologieën of kennis daarbinnen en de
      mogelijkheden om aan die behoefte te voldoen, worden geanalyseerd,
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel9
  - number: 9.b
    text: het verspreiden van dat innovatiepositierapport onder de betrokken zorgaanbieders en MKB-ondernemers of
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel9
  - number: 9.c
    text: het selecteren van deelnemers aan een ZIPC-verband en het voorbereiden van de totstandkoming van een ZIPC-verband.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel9
  - number: '10.1'
    text: |-
      Voor de projectsubsidie, bedoeld in [artikel 9][ref1], komen uitsluitend de volgende kosten in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 10.1.a
    text: het aantal uren gemaakt door personeel van de ZIPC-penvoerder, vermenigvuldigd met een vast uurtarief van € 60;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel10
  - number: 10.1.b
    text: |-
      de specifiek ten behoeve van de activiteiten gemaakte overige kosten, gemaakt bij personen of rechtspersonen met
      wie de ZIPC-penvoerder niet in een groep verbonden is.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel10
  - number: '10.2'
    text: Kosten die voor indiening van de aanvraag zijn gemaakt, komen niet voor subsidie in aanmerking.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel10
  - number: '11'
    text: |-
      In afwijking van [artikel 11, eerste lid, eerste zin, van de Subsidieregeling VWS-subsidies][ref1] bedraagt de
      projectsubsidie, bedoeld in [artikel 9][ref2], ten hoogste 50 procent van het verschil tussen de subsidiabele
      kosten, bedoeld in [artikel 10][ref3], en de opbrengsten tot een bedrag van ten hoogste € 125.000.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0026090#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0026090#Artikel10
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0026090
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      De minister ontvangt gedurende de periode van 1 juli 2009 tot en met 31 december 2009 aanvragen van
      projectsubsidies als bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Het subsidieplafond voor het verstrekken van projectsubsidies op aanvragen ontvangen in de periode, bedoeld in het
      eerste lid, bedraagt € 2.000.000.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel12
  - number: '13'
    text: |-
      De Minister beslist in ieder geval afwijzend op een aanvraag van de projectsubsidie, bedoeld in [artikel 9][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.a
    text: |-
      indien minder dan drie jaar voor de beslissing op de aanvraag reeds subsidie krachtens dit hoofdstuk, de
      Subsidieregeling innoveren of de Subsidieregeling innovatieprestatiecontracten is toegekend, betrekking hebbend op
      eenzelfde of vergelijkbare zorginnovatie;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel13
  - number: 13.b
    text: |-
      indien de ZIPC-penvoerder niet aannemelijk maakt dat er een aanzienlijke kans is dat de subsidiabele
      activiteiten zullen leiden tot het tot stand komen van een ZIPC-verband, waarvan de deelnemers overeenkomstig
      [paragraaf 3][ref1] van dit hoofdstuk voor subsidie in aanmerking komen of de ZIPC-penvoerder niet het vertrouwen
      geeft in staat te zijn om de daarbij benodigde inzet te leveren;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026090
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 13.c
    text: van de activiteiten onvoldoende positieve gevolgen voor de zorgsector te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel13
  - number: '14'
    text: |-
      In afwijking van [artikel 16 van de Subsidieregeling VWS-subsidies][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel16
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '16'
  - number: 14.a
    text: |-
      verstrekt de minister ambtshalve voorschotten op de projectsubsidie, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14.b
    text: |-
      wordt het eerste voorschot verstrekt binnen twee weken na de datum van verzending van de beschikking tot
      subsidieverlening of, indien deze later is, de datum die in het projectplan is opgenomen voor de start van de
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
  - number: 14.c
    text: |-
      worden de volgende voorschotten ambtshalve verstrekt binnen twee weken na 1 januari, 1 april, 1 juli en 1 oktober
      voor de in het desbetreffende kwartaal te maken subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
  - number: 14.d
    text: |-
      bedraagt het voorschot 90% van het bedrag dat in het desbetreffende kwartaal maximaal voor subsidie in aanmerking
      komt;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
  - number: 14.e
    text: |-
      wordt de hoogte van het maximaal voor subsidie in aanmerking komende bedrag berekend door de volgens het
      projectplan in dat kalenderjaar te maken subsidiabele kosten te vermenigvuldigen met het subsidiepercentage,
      bedoeld in [artikel 11][ref1], en te delen door het aantal voorschotmomenten in deze periode;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel11
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14.f
    text: bedraagt het geheel van voorschotten niet meer dan 90% van de projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel14
  - number: '15.1'
    text: |-
      De activiteiten, bedoeld in [artikel 9][ref1] vinden plaats voor 1 januari 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Indien het uitsluitend activiteiten betreft als bedoeld in [artikel 9, onderdeel c][ref1], vinden de activiteiten
      plaats binnen een periode van zes maanden na de in de aanvraag aangegeven startdatum van het project, doch
      uiterlijk voor 1 januari 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      De ZIPC-penvoerder stelt het innovatiepositierapport, bedoeld in [artikel 9, onderdeel a][ref1], voor een ieder op
      aanvraag verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16'
    text: |-
      De minister stelt het bedrag van de projectsubsidie, bedoeld in [artikel 9][ref1], vast op ten hoogste het bedrag
      dat is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel9
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De Minister kan op aanvraag een projectsubsidie verstrekken aan een ZIPC-deelnemer voor de uitvoering van zijn
      zorginnovatieplan.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel17
  - number: '17.2'
    text: De aanvraag van de projectsubsidie, bedoeld in het eerste lid, wordt ingediend via een ZIPC-penvoerder.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel17
  - number: '17.3'
    text: |-
      De Minister verzendt de beschikking op de aanvraag van de projectsubsidie, bedoeld in het eerste lid, aan de ZIPC-
      penvoerder.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel17
  - number: '18.1'
    text: |-
      Voor de projectsubsidie, bedoeld in [artikel 17][ref1], komen uitsluitend de volgende kosten in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 18.1.a
    text: het aantal uren gemaakt door personeel van de ZIPC-deelnemer, vermenigvuldigd met een vast uurtarief van € 40;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
  - number: 18.1.b
    text: de kosten die de ZIPC-deelnemer maakt bij de ZIPC-penvoerder;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
  - number: 18.1.c
    text: |-
      de specifiek ten behoeve van de uitvoering van het zorginnovatieplan gemaakte overige kosten, gemaakt bij personen
      of rechtspersonen met wie de ZIPC-deelnemer niet in een groep verbonden is.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
  - number: '18.2'
    text: |-
      Met betrekking tot kosten, die de ZIPC-deelnemer maakt voor de inzet van personeel van een andere ZIPC-deelnemer
      ten behoeve van gezamenlijke collectieve activiteiten, is het eerste lid, onderdeel a, van toepassing.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
  - number: '18.3'
    text: |-
      Kosten in verband met op verkoop gerichte marketing- en sales-activiteiten, investeringen in en afschrijvingen
      van bedrijfsmiddelen, herhalingstesten of het deelnemen aan tentoonstellingen en symposia komen niet voor subsidie
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
  - number: '18.4'
    text: Kosten die voorafgaand aan de indiening van de aanvraag zijn gemaakt, komen niet voor subsidie in aanmerking.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel18
  - number: '19.1'
    text: |-
      In afwijking van [artikel 11, eerste lid, eerste zin, van de Subsidieregeling VWS-subsidies][ref1] bedraagt de
      projectsubsidie, bedoeld in [artikel 17][ref2], ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 19.1.a
    text: |-
      50 procent van het verschil tussen de subsidiabele kosten, bedoeld in
      [artikel 18, eerste lid, onderdelen a en c][ref1], en de opbrengsten, doch ten hoogste € 45.000, en


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel18
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 19.1.b
    text: |-
      100 procent van het verschil tussen de subsidiabele kosten, bedoeld in [artikel 18, eerste lid, onderdeel b][ref1],
      en de opbrengsten, doch ten hoogste € 6.500.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel18
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '19.2'
    text: 'Het in het eerste lid eerstgenoemde subsidiepercentage wordt verlaagd:'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
  - number: 19.2.a
    text: |-
      indien minder dan 60 procent van het maximaal voor subsidie in aanmerking komende verschil tussen de subsidiabele
      kosten en de opbrengsten is gemaakt bij personen of rechtspersonen, die niet met de deelnemer in een groep
      verbonden zijn dan wel, voor zover betrekking hebbend op collectieve activiteiten, geen ZIPC-deelnemer zijn met wie
      die collectieve activiteiten gezamenlijk worden uitgevoerd noch met die deelnemer in een groep verbonden zijn;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
  - number: 19.2.b
    text: |-
      indien bij de vaststelling van de projectsubsidie blijkt dat het percentage subsidiabele kosten voor collectieve
      activiteiten minder bedraagt dan 20 procent van het maximaal voor subsidie in aanmerking komende verschil tussen de
      subsidiabele kosten en de opbrengsten.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
  - number: '19.3'
    text: |-
      Het subsidiepercentage wordt in de in het tweede lid, onderdeel a en b, bedoelde gevallen met hetzelfde aantal
      procenten verlaagd als het aantal procentpunten bedraagt dat zich bevindt tussen het bij de vaststelling van de
      subsidie gebleken percentage en het percentage van 60 onderscheidenlijk 20.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
  - number: '19.4'
    text: |-
      Indien de ZIPC-deelnemer collectieve activiteiten uitvoert in samenwerking met een gemeente of een provincie, wordt
      het maximum, bedoeld in het eerste lid, onderdeel a, verhoogd tot € 50.000.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
  - number: '19.5'
    text: |-
      De minister stelt het bedrag van de projectsubsidie, bedoeld in [artikel 17][ref1], vast op ten hoogste het bedrag
      dat is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      De Minister ontvangt gedurende de periode van 1 november 2009 tot en met 28 februari 2010 aanvragen van
      projectsubsidies als bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Het subsidieplafond voor het verstrekken van projectsubsidies op aanvragen ontvangen in de periode, bedoeld in het
      eerste lid, bedraagt € 5.000.000.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel20
  - number: '21'
    text: |-
      De Minister beslist in ieder geval afwijzend op een aanvraag van de projectsubsidie, bedoeld in [artikel 17][ref1],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 21.a
    text: |-
      de ZIPC-deelnemer een onderneming in stand houdt als bedoeld in artikel 1 van [verordening (EG) nr. 1998/2006]
      (32006R1998) van de Commissie van de Europese Gemeenschappen van 15 december 2006 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun (PbEU L379);
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
  - number: 21.b
    text: |-
      minder dan drie jaar geleden reeds subsidie krachtens dit hoofdstuk, de [Subsidieregeling innoveren][ref1] of de
      [Subsidieregeling innovatieprestatiecontracten][ref2] is verstrekt aan de ZIPC-deelnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0024855
      [ref2]: https://wetten.overheid.nl/BWBR0020508
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024855
      - id: ref2
        bwb_id: BWBR0020508
  - number: 21.c
    text: |-
      het verschil tussen de subsidiabele kosten, bedoeld in [artikel 18][ref1], en de opbrengsten, zoals beschreven in
      het bij de aanvraag gevoegde zorginnovatieplan, minder bedraagt dan € 60.000;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel18
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 21.d
    text: |-
      het verschil tussen de subsidiabele kosten, bedoeld in [artikel 18][ref1], en de opbrengsten voor collectieve
      activiteiten, zoals beschreven in de gezamenlijke zorginnovatieplannen, niet ten minste € 10.000, vermenigvuldigd
      met het aantal deelnemers, bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel18
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 21.e
    text: |-
      het overkoepelende plan niet het vertrouwen geeft dat de ZIPC-penvoerder de begeleiding van de ZIPC-deelnemers
      bij het uitvoeren van hun zorginnovatieplannen en de totstandkoming en begeleiding van de in het plan opgenomen
      samenwerkingsprojecten naar behoren kan uitvoeren;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
  - number: 21.f
    text: |-
      uit het zorginnovatieplan onvoldoende blijkt dat de ZIPC-deelnemer activiteiten verricht die gericht zijn op
      zorginnovatie;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
  - number: 21.g
    text: het ZIPC-verband bestaat uit minder dan 10 en meer dan 35 ZIPC-deelnemers;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
  - number: 21.h
    text: de ZIPC-deelnemer in een groep is verbonden met een andere ZIPC-deelnemer aan het ZIPC-verband.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel21
  - number: '22'
    text: |-
      In afwijking van [artikel 16 van de Subsidieregeling VWS-subsidies][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel16
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '16'
  - number: 22.a
    text: |-
      verstrekt de minister ambtshalve voorschotten op de projectsubsidie, bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 22.b
    text: |-
      wordt binnen acht weken na de datum van verzending van de beschikking tot subsidieverlening of, indien deze later
      is, de datum die in het projectplan is opgenomen voor de start van de activiteiten een voorschot verstrekt van 50%
      van het bedrag van de verleende projectsubsidie;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel22
  - number: 22.c
    text: |-
      wordt binnen twee weken na het verstrijken van 12 maanden na de datum, bedoeld in onderdeel b, een voorschot
      verstrekt van 30% van het bedrag van de verleende projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel22
  - number: '23'
    text: |-
      De activiteiten ter uitvoering van het zorginnovatieplan vangen voor 1 januari 2011 aan en vinden plaats gedurende
      ten minste 18 en ten hoogste 30 maanden na de in de aanvraag van de projectsubsidie, bedoeld in [artikel 17][ref1],
      aangegeven startdatum van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel17
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      De aanvraag voor de subsidievaststelling, bedoeld in [artikel 25 van de Subsidieregeling VWS-subsidies][ref1],
      wordt ingediend via een ZIPC-penvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel25
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '25'
  - number: '24.2'
    text: De Minister verzendt de beschikking op de aanvraag, bedoeld in het eerste lid, aan de ZIPC-penvoerder.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel24
  - number: '25.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
  - number: 25.1.a
    text: |-
      *zorginnovatievoucher:* op grond van dit hoofdstuk door de minister aan een zorgaanbieder of MKB-ondernemer
      afgegeven waardedocument, dat deze zorgaanbieder of MKB-ondernemer kan inleveren bij een kennisinstelling ten
      behoeve van het verkrijgen door een kennisinstelling van een projectsubsidie op grond van [artikel 31][ref1] voor
      de uitvoering van een kennisoverdrachtproject;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 25.1.b
    text: '*kleine zorginnovatievoucher:* zorginnovatievoucher ter waarde van maximaal € 2.500;'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
  - number: 25.1.c
    text: |-
      *grote zorginnovatievoucher:* zorginnovatievoucher ter waarde van maximaal € 7.500 waarbij van de zorgaanbieder of
      MKB-ondernemer ingevolge [artikel 32, eerste lid][ref1], een eigen bijdrage wordt verlangd;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel32
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 25.1.d
    text: |-
      *extra grote zorginnovatievoucher:* zorginnovatievoucher ter waarde van maximaal € 21.000 waarbij van de
      zorgaanbieder of MKB-ondernemer ingevolge [artikel 32, eerste lid][ref1], een eigen bijdrage wordt verlangd;


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel32
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 25.1.e
    text: |-
      *kennisoverdrachtproject:* activiteit waarvan de gevolgen naar verwachting grotendeels ten goede zullen komen aan
      de zorgsector en die bestaat uit het beantwoorden van een toepassingsgerichte kennisvraag van een zorgaanbieder
      of MKB-ondernemer dan wel ten hoogste 10 niet in een groep verbonden zorgaanbieders of MKB-ondernemers
      gezamenlijk, uitgaande van voor de zorgaanbieder of MKB-ondernemer nieuwe kennis met betrekking tot zorginnovatie,
      marktonderzoek ten behoeve van zorginnovatie of methoden van zorginnovatie. Geen kennisoverdrachtsproject is
      een project waarbij de beantwoording van een toepassingsgerichte kennisvraag uitsluitend plaatsvindt door het
      leveren van goederen, het geven van cursussen of het verrichten van activiteiten op het gebied van verkoop van
      producten of diensten, zoals het ontwikkelen en vervaardigen van marketinginstrumenten en verkoopondersteunend
      promotiemateriaal.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
  - number: '25.2'
    text: 'Voorts wordt in dit hoofdstuk verstaan onder kennisinstelling:'
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
  - number: 25.2.a
    text: |-
      kennisinstelling als bedoeld in de [Subsidieregeling innoveren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024855
  - number: 25.2.b
    text: |-
      ondernemer met als economische activiteit ondernemers waarmee de ondernemer niet in een groep is verbonden
      te adviseren over het verbeteren van hun organisatie, het verrichten van marktonderzoek of het begeleiden van
      veranderingsprocessen en welke ondernemer voor de inwerkingtreding van deze regeling tenminste drie verschillende
      adviesprojecten in de zorg heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel25
  - number: '26'
    text: |-
      De Minister kan op aanvraag een zorginnovatievoucher verstrekken aan een zorgaanbieder of MKB-ondernemer die
      een kennisoverdrachtproject wil laten uitvoeren waarvan de resultaten ten goede komen aan de activiteiten die de
      zorgaanbieder of MKB-ondernemer in Nederland verricht.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel26
  - number: '27.1'
    text: |-
      Geen zorginnovatievoucher wordt verstrekt aan een [onder i van de bijlage bij de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek](onbekend) bedoeld academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
  - number: '27.2'
    text: |-
      Geen kleine zorginnovatievoucher wordt verstrekt aan een zorgaanbieder of MKB-ondernemer aan wie reeds een
      zorginnovatievoucher is verstrekt of aan wie op grond van de [Subsidieregeling innovatievouchers][ref1],
      de [Subsidieregeling innoveren][ref2], de [Beleidsregel verstrekking innovatievouchers 2004][ref3],
      de [Beleidsregel verstrekking innovatievouchers pilot 2005][ref4], de
      [Beleidsregel verstrekking innovatievouchers pilot 2005 tweede fase][ref5] of
      [artikel 2:22 van de Regeling LNV-subsidies][ref6] een voucher is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019805
      [ref2]: https://wetten.overheid.nl/BWBR0024855
      [ref3]: https://wetten.overheid.nl/BWBR0017163
      [ref4]: https://wetten.overheid.nl/BWBR0018052
      [ref5]: https://wetten.overheid.nl/BWBR0018805
      [ref6]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019805
      - id: ref2
        bwb_id: BWBR0024855
      - id: ref3
        bwb_id: BWBR0017163
      - id: ref4
        bwb_id: BWBR0018052
      - id: ref5
        bwb_id: BWBR0018805
      - id: ref6
        bwb_id: BWBR0021281
        artikel: '2'
  - number: '27.3'
    text: |-
      Geen kleine zorginnovatievoucher wordt verstrekt ten behoeve van een kennisoverdrachtproject dat een kennisvraag
      betreft van een aantal zorgaanbieders of MKB-ondernemers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
  - number: '27.4'
    text: |-
      In enig kalenderjaar wordt geen grote of extra grote zorginnovatievoucher verstrekt aan een zorgaanbieder of
      MKB-ondernemer aan wie in dat kalenderjaar reeds een grote of extra grote zorginnovatievoucher of een grote
      innovatievoucher op grond van de [Subsidieregeling innoveren][ref1] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024855
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024855
  - number: '27.5'
    text: |-
      Geen grote of extra grote zorginnovatievoucher wordt verstrekt aan een zorgaanbieder of MKB-ondernemer die
      failliet is verklaard, aan wie surseance van betaling is verleend, ten aanzien van wie de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, of voor wie een verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
  - number: '27.6'
    text: |-
      Geen grote of extra grote zorginnovatievoucher wordt verstrekt aan wie door een of meer bestuursorganen in de
      drie aan de aanvraag voorafgaande jaren reeds tot een hoger bedrag subsidie is verstrekt zonder goedkeuring van de
      Commissie van de Europese Gemeenschappen dan voor de sector waartoe de betrokken zorgaanbieder of MKB-ondernemer
      behoort is vastgesteld in een de-minimis verordening. Indien het voor de betrokken zorgaanbieder of MKB-ondernemer
      geldende de-minimisplafond niet al is bereikt door andere subsidies, wordt het bedrag dat gelet op dat plafond ten
      hoogste met inzet van de zorginnovatievoucher kan worden vergoed, op de zorginnovatievoucher vermeld.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
  - number: '27.7'
    text: |-
      Indien de zorgaanbieder ten tijde van de indiening van de aanvraag van een zorginnovatievoucher meer dan 250
      werknemers in dienst heeft, kan de Minister:
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
  - number: 27.7.a
    text: |-
      in afwijking van het tweede lid één kleine zorginnovatievoucher verstrekken ten behoeve van een vestiging,
      bedoeld in de [Handelsregisterwet 2007][ref1], waar de zorgaanbieder zorg verleent, tot ten hoogste tien kleine
      zorginnovatievouchers per zorgaanbieder;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 27.7.b
    text: |-
      in afwijking van het vierde lid per kalenderjaar één grote of extra grote zorginnovatievoucher verstrekken ten
      behoeve van een vestiging, bedoeld in de [Handelsregisterwet 2007][ref1], waar de zorgaanbieder zorg verleent, tot
      ten hoogste 10 grote en extra grote zorginnovatievouchers tezamen per zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '27.8'
    text: |-
      Een zorginnovatievoucher die is verstrekt met inachtneming van het zevende lid, is uitsluitend geldig voor een
      kennisoverdrachtproject ten behoeve van de op de zorginnovatievoucher vermelde vestiging.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel27
  - number: '28.1'
    text: Een zorgaanbieder of een MKB-ondernemer kan ten hoogste één zorginnovatievoucher tegelijkertijd aanvragen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel28
  - number: '28.2'
    text: |-
      Indien de zorgaanbieder ten tijde van de indiening van de aanvraag van een zorginnovatievoucher meer
      dan 250 werknemers in dienst heeft, kan de zorgaanbieder in afwijking van het eerste lid ten hoogste één
      zorginnovatievoucher tegelijkertijd aanvragen voor een vestiging, bedoeld in de [Handelsregisterwet 2007][ref1],
      waar de zorgaanbieder zorg verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '28.3'
    text: |-
      Indien de zorgaanbieder of MKB-ondernemer meer zorginnovatievouchers aanvraagt dan op grond van de voorgaande
      leden is toegestaan, worden de andere aanvragen dan de aanvraag van de zorginnovatievoucher met de laagste waarde
      afgewezen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel28
  - number: '29.1'
    text: |-
      Gedurende de periode van 1 juli 2009 tot en met 1 maart 2010 kunnen kleine zorginnovatievouchers worden aangevraagd
      en zijn ten hoogste 400 kleine zorginnovatievouchers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel29
  - number: '29.2'
    text: |-
      Gedurende de periode van 1 juli 2009 tot en met 1 maart 2010 kunnen grote zorginnovatievouchers worden aangevraagd
      en zijn ten hoogste 400 grote zorginnovatievouchers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel29
  - number: '29.3'
    text: |-
      Gedurende de periode van 1 juli 2009 tot en met 31 december 2009 kunnen extra grote zorginnovatievouchers worden
      aangevraagd en zijn ten hoogste 200 extra grote zorginnovatievouchers beschikbaar.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel29
  - number: '29.4'
    text: |-
      De Minister verdeelt de beschikbare kleine, grote en extra grote zorginnovatievouchers elk in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft
      voldaan aan enig voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de
      dag waarop de aanvraag is ontvangen die voldoet aan de voorschriften met betrekking tot de verdeling als datum van
      ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '29.5'
    text: |-
      Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      kleine, grote of extra grote zorginnovatievouchers zou worden overschreden, stelt de Minister de onderlinge
      rangschikking van de aanvragen voor elk van de zorginnovatievouchers vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel29
  - number: '30.1'
    text: De Minister geeft een beschikking binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel30
  - number: '30.2'
    text: |-
      Op de zorginnovatievoucher wordt de waarde ervan vermeld alsmede de datum waarop de geldigheid van de
      zorginnovatievoucher afloopt en de zorgaanbieder of MKB-ondernemer waaraan de zorginnovatievoucher is verstrekt
      alsmede, indien van toepassing, de vestiging ten behoeve waarvan de zorginnovatievoucher is verstrekt.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel30
  - number: '31.1'
    text: |-
      De Minister kan op aanvraag een projectsubsidie verstrekken aan een kennisinstelling die een
      kennisoverdrachtproject heeft uitgevoerd en in verband daarmee:
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel31
  - number: 31.1.a
    text: |-
      hetzij één of meer geldige grote of extra grote zorginnovatievouchers overlegt tot ten hoogste 10
      zorginnovatievouchers van 10 verschillende zorgaanbieders of MKB-ondernemers;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel31
  - number: 31.1.b
    text: hetzij één geldige kleine zorginnovatievoucher overlegt.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel31
  - number: '31.2'
    text: De projectsubsidie wordt zonder voorafgaande verlening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel31
  - number: '31.3'
    text: |-
      De [artikelen 9][ref1], [11][ref2], [12][ref3], [13][ref4],
      [14, eerste lid, derde lid en vierde lid, eerste en tweede volzin][ref5], [15][ref6], [16][ref7],
      [17][ref8], [20][ref9], [24][ref10], [25, eerste, tweede, derde en vijfde lid][ref11], en
      [26, tweede en derde volzin van de Subsidieregeling VWS-subsidies][ref12] zijn niet van toepassing op de
      projectsubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0019947#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0019947#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0019947#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0019947#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0019947#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0019947#Artikel16
      [ref8]: https://wetten.overheid.nl/BWBR0019947#Artikel17
      [ref9]: https://wetten.overheid.nl/BWBR0019947#Artikel20
      [ref10]: https://wetten.overheid.nl/BWBR0019947#Artikel24
      [ref11]: https://wetten.overheid.nl/BWBR0019947#Artikel25
      [ref12]: https://wetten.overheid.nl/BWBR0019947#Artikel26
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0019947
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0019947
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0019947
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0019947
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0019947
        artikel: '15'
      - id: ref7
        bwb_id: BWBR0019947
        artikel: '16'
      - id: ref8
        bwb_id: BWBR0019947
        artikel: '17'
      - id: ref9
        bwb_id: BWBR0019947
        artikel: '20'
      - id: ref10
        bwb_id: BWBR0019947
        artikel: '24'
      - id: ref11
        bwb_id: BWBR0019947
        artikel: '25'
      - id: ref12
        bwb_id: BWBR0019947
        artikel: '26'
  - number: '31.4'
    text: De projectsubsidie is geen steun in de zin van artikel 87 en 88 EG-verdrag.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel31
  - number: '32.1'
    text: |-
      De projectsubsidie, bedoeld in [artikel 31, eerste lid, onderdeel a][ref1], bedraagt ten hoogste tweederde
      deel van het verschil tussen de met de gesubsidieerde activiteiten samenhangende subsidiabele kosten en de
      opbrengsten van de kennisinstelling voor het kennisoverdrachtproject, exclusief eventueel in rekening te brengen
      omzetbelasting, maar per overgelegde grote of extra grote zorginnovatievoucher niet meer dan tweederde van het op
      de zorginnovatievoucher vermelde bedrag en, indien het kennisoverdrachtproject gericht is op het beantwoorden van
      een kennisvraag van meerdere zorgaanbieders of MKB-ondernemers gezamenlijk, niet meer dan € 125.000 in totaal.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '32.2'
    text: |-
      De projectsubsidie, bedoeld in [artikel 31, eerste lid, onderdeel b][ref1], bedraagt ten hoogste het verschil
      tussen de met de gesubsidieerde activiteiten samenhangende subsidiabele kosten en de opbrengsten van de
      kennisinstelling voor het kennisoverdrachtproject, exclusief eventueel in rekening te brengen omzetbelasting, maar
      niet meer dan het op de kleine zorginnovatievoucher vermelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '33'
    text: |-
      De kosten die in aanmerking komen voor de projectsubsidie, bedoeld in [artikel 31][ref1], zijn de in
      [artikel 32][ref2] bedoelde subsidiabele kosten met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0026090#Artikel32
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026090
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 33.a
    text: |-
      niet subsidiabel zijn kosten die in het kader van stages van studenten van kennisinstellingen worden gemaakt, noch
      kosten in het kader van activiteiten waarvoor studenten studiepunten krijgen;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel33
  - number: 33.b
    text: de loonkosten van een kennisinstelling subsidiabel zijn tot ten hoogste € 100 per uur per persoon.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel33
  - number: '34.1'
    text: |-
      Een aanvraag van de projectsubsidie, bedoeld in [artikel 31][ref1], wordt na afloop van het kennisoverdrachtproject
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '34.2'
    text: |-
      De Minister ontvangt de aanvraag voor 1 september 2010. Op een voor het einde van de termijn daartoe ontvangen
      schriftelijk verzoek kan de Minister deze termijn eenmalig verlengen.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel34
  - number: '34.3'
    text: |-
      Het projectverslag, bedoeld in [artikel 25, tweede lid, onderdeel a, van de Subsidieregeling VWS-subsidies][ref1],
      geeft inzicht in de aard, duur, omvang, doelstellingen en resultaten van de in het kader van de subsidiëring
      verrichte activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel25
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '25'
  - number: '34.4'
    text: |-
      De declaratie, bedoeld in [artikel 25, tweede lid, onderdeel b, van de Subsidieregeling VWS-subsidies][ref1],
      geeft inzicht in de kosten en de opbrengsten van de verrichtte activiteiten en is voorzien van een postgewijze
      toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel25
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '25'
  - number: '34.5'
    text: |-
      Indien het een eerste aanvraag betreft van een kennisinstelling als bedoeld in
      [artikel 25, tweede lid, onderdeel b][ref1], gaat de aanvraag vergezeld van een verklaring van een zorgaanbieder
      ten aanzien van elk van de drie adviesprojecten die de kennisinstelling voor de inwerkingtreding van deze regeling
      heeft afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel25
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '25'
  - number: '35'
    text: |-
      De Minister beslist in ieder geval afwijzend op een aanvraag van de projectsubsidie, bedoeld in [artikel 31][ref1],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 35.a
    text: |-
      de zorgaanbieder of de MKB-ondernemer enerzijds en de kennisinstelling anderzijds reeds voor de afgiftedatum van de
      zorginnovatievoucher verplichtingen jegens elkaar zijn aangegaan met betrekking tot het kennisoverdrachtproject;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel35
  - number: 35.b
    text: |-
      de zorgaanbieder of de MKB-ondernemer de zorginnovatievoucher aangewend heeft voor een kennisoverdrachtproject
      waarvoor reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt of dat
      deel uitmaakt van een project of programma waarvoor reeds door een bestuursorgaan of de Commissie van de Europese
      Gemeenschappen subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel35
  - number: 35.c
    text: |-
      de bij de aanvraag overgelegde zorginnovatievoucher aan de kennisinstelling in zijn hoedanigheid van zorgaanbieder
      of MKB-ondernemer is verstrekt op grond van [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel26
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026090
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 35.d
    text: |-
      het een kennisoverdrachtproject betreft ten behoeve van een zorgaanbieder of MKB-ondernemer waarmee de
      kennisinstelling in een groep is verbonden.
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel35
  - number: '36'
    text: |-
      De Minister kan bij de vaststelling van de projectsubsidie, bedoeld in [artikel 31][ref1], verplichtingen opleggen
      die strekken tot verwezenlijking van het doel van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026090#Artikel31
    url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026090
