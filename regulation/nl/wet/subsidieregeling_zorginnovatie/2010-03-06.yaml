preamble:
  text: |-
    Gelet op de artikelen 3, 5 en 7 van de Kaderwet VWS-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026090/2010-03-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder - *minister:* Minister van Volksgezondheid, Welzijn en Sport;
        - *zorg:* 1°. zorg of dienst als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] of de
      [Algemene Wet Bijzondere Ziektekosten][ref2]; 2°. vorm van hulp voor de kosten waarvan een subsidie
      wordt verstrekt op grond van [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref3] of
      [artikel 68 van de Zorgverzekeringswet][ref4];
        - *zorgaanbieder:* 1°. zorgaanbieder als bedoeld in
      [artikel 1 van de Kwaliteitswet zorginstellingen][ref5]; 2°. degene die in een register als bedoeld
      in [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref6] staat ingeschreven of
      die een beroep uitoefent waarvan de opleiding krachtens [artikel 34, eerste lid, van die wet][ref7] is
      geregeld of aangewezen, en zijn beroep uitoefent anders dan in het kader van een instelling als bedoeld in
      [artikel 1 van de Kwaliteitswet zorginstellingen][ref8];
        - *zorginnovatie:* vernieuwing van producten, productieprocessen, diensten of dienstverleningsprocessen, met
      inbegrip van de wijze waarop de arbeid is georganiseerd: 1°. ter versterking van het verlenen van patiëntgerichte
      zorg aan chronisch zieken of ouderen in een netwerk van zorgaanbieders of 2°. ter verhoging van de effectiviteit
      van de arbeid die wordt geleverd voor het verlenen van zorg aan chronisch zieken of ouderen;
        - *groep:* een economische eenheid, waarin organisatorisch zijn verbonden: 1°. een natuurlijke persoon of
      privaatrechtelijke rechtspersoon, die direct of indirect: – meer dan de helft van het geplaatste kapitaal verschaft
      aan, – volledig aansprakelijk vennoot is van, of – overwegende zeggenschap heeft over een of meer rechtspersonen of
      vennootschappen, en 2°. laatstbedoelde rechtspersonen of vennootschappen;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *ondernemer:* natuurlijke persoon, rechtspersoon of vennootschap, die een onderneming in stand houdt, niet zijnde
      een rechtspersoon die krachtens publiekrecht is ingesteld;
        - *MKB-ondernemer:* ondernemer die een kleine of middelgrote onderneming in de zin van [verordening (EG) nr.
      800/2008](32008R0800) van de Commissie van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde
      categorieën steun op grond van de artikelen 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar
      worden verklaard (‘de algemene groepsvrijstellingsverordening’) (PbEU L 214) in stand houdt;
        - *de-minimis verordening:* [verordening (EG) nr. 1998/2006](32006R1998) van de Commissie van Europese
      Gemeenschappen van 15 december 2006 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-
      minimissteun (PbEU L379) ), [verordening (EG) nr. 1535/2007](32007R1535) van de Commissie van de Europese
      Gemeenschappen van 20 december 2007 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-
      minimissteun in de landbouwproductiesector (PbEU L 337) en [verordening (EG) nr. 875/2007](32007R0875) van de
      Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de toepassing van de artikelen 87 en 88 van
      het Verdrag op de-minimissteun in de landbouwsector en de visserijsector (PbEU L 193);
        - *Europees steunkader:* mededeling, richtsnoer, kaderregeling, beschikking of vrijstellingsverordening op het
      gebied van staatssteun die de Commissie van de Europese Gemeenschappen, gelet op de artikelen 86, derde lid , 87 en
      88 van het EG-Verdrag heeft vastgesteld;
        - *opbrengsten:* de met de subsidiabele activiteiten samenhangende opbrengsten, met inbegrip van subsidies,
      afkomstig van personen of rechtspersonen met wie de subsidie-ontvanger niet in een groep verbonden is .


      [ref1]: https://wetten.overheid.nl/BWBR0018450
