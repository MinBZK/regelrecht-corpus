$id: wet_verbod_op_kolen_bij_elektriciteitsproductie
regulatory_layer: WET
publication_date: '2025-11-13'
valid_from: '2026-01-01'
bwb_id: BWBR0042905
url: https://wetten.overheid.nl/BWBR0042905/2026-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is om CO2-reductie te bewerkstelligen bij
    kolengestookte elektriciteitscentrales om klimaatverandering tegen te gaan en dat de meest geëigende maatregel
    daartoe een verbod op het gebruik van kolen is voor elektriciteitsopwekking door deze centrales;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *elektrisch rendement:* het elektrisch rendement zoals opgenomen in de omgevingsvergunning voor een productie-
      installatie op het moment waarop deze wet in werking treedt;
        - *kolen:* producten van de GN-codes 2701, 2702 en 2704 als bedoeld in bijlage I bij [Verordening (EEG) nr.
      2658/87](31987R2658) van de Raad van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het
      gemeenschappelijk douanetarief (PbEU 1987, L 256);
        - *Onze Minister:* Onze Minister van Klimaat en Groene Groei;
        - *productie-installatie:* een installatie, bestaande uit één of meer productie-eenheden, voor de opwekking van
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel1
  - number: '2'
    text: Het is verboden om in een productie-installatie elektriciteit op te wekken met behulp van kolen.
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Het verbod, bedoeld in [artikel 2][ref1], is:

      a. tot en met 31 december 2024 niet van toepassing op alle productie-installaties;

      b. tot 1 januari 2030 niet van toepassing op een productie-installatie met een elektrisch rendement van 44% of
      meer.


      [ref1]: https://wetten.overheid.nl/BWBR0042905#Artikel2
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0042905
        artikel: '2'
  - number: 3a
    text: |-
      In afwijking van [artikel 3, aanhef en onderdeel a][ref1], is het verbod, bedoeld in [artikel 2][ref2], tot
      1 januari 2020 niet van toepassing op een productie-installatie die:

      a. een elektrisch rendement van minder dan 44% heeft;

      b. waarin geen hernieuwbare elektriciteit wordt geproduceerd door middel van biomassa; en

      c. waarin geen hernieuwbare warmte wordt geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0042905#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042905#Artikel2
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0042905
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0042905
        artikel: '2'
  - number: '4'
    text: |-
      Onze Minister kan op verzoek van een exploitant van een productie-installatie een tegemoetkoming verlenen indien de
      desbetreffende exploitant aantoont dat hij ten gevolge van het verbod, ten opzichte van andere exploitanten van een
      kolengestookte productie-installatie, onevenredig zwaar wordt geraakt.
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel4
  - number: 4a
    text: |-
      1 Er is een fonds waaruit uitkeringen kunnen worden gedaan aan werknemers van een productie-installatie alsmede
      investeringen in om- en bijscholing.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het fonds en de wijze waarop de
      uitkeringen worden verstrekt alsmede de wijze waarop investeringen worden gedaan in om- en bijscholing.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid consulteert de betrokken werknemers dan wel een vereniging
      van werknemers die krachtens haar statuten ten doel heeft de belangen van haar leden als werknemers te behartigen
      over de regels, bedoeld in het tweede lid, en informeert de Tweede Kamer der Staten-Generaal uiterlijk twee
      maanden nadat dit lid is ingevoegd over de voorwaarden waaronder en de wijze waarop de bekostiging van de om- en
      bijscholing van werknemers wordt geregeld.

      4 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel4a
  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij deze wet zijn belast de bij besluit van Onze Minister
      daartoe aangewezen ambtenaren van de Nederlandse Emissieautoriteit.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 De in het eerste lid aangewezen ambtenaren zijn bevoegd gegevens of inlichtingen te verstrekken aan een
      bestuursorgaan, dat bevoegd is een vergunning in te trekken als het verbod als bedoeld in [artikel 2][ref1] niet
      wordt nageleefd, indien verstrekking voor de goede vervulling van deze bevoegdheid noodzakelijk is.

      4 Verstrekking aan een bestuursorgaan vindt uitsluitend plaats indien de geheimhouding van de gegevens of
      inlichtingen in voldoende mate is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0042905#Artikel2
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042905
        artikel: '2'
  - number: '6'
    text: Onze Minister kan in geval van overtreding van deze wet de overtreder een last onder bestuursdwang opleggen.
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel6
  - number: 6a
    text: |-
      [Artikel 4, tweede tot en met zesde lid][ref1], en de daarop berustende bepalingen, zoals die luidden voor 21 juni
      2022, blijven van toepassing op schade die is ontstaan in de periode van 1 januari 2022 tot en met 20 juni 2022 als
      gevolg van de voorwaarde, bedoeld in [artikel 3, tweede lid][ref2], zoals dat luidde voor 21 juni 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0042905#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0042905#Artikel3
    url: https://wetten.overheid.nl/BWBR0042905/2026-01-01#Artikel6a
