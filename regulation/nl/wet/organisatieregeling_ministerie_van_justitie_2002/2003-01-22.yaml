$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: organisatieregeling_ministerie_van_justitie_2002
regulatory_layer: WET
publication_date: '2005-05-24'
valid_from: '2003-01-22'
bwb_id: BWBR0014344
url: https://wetten.overheid.nl/BWBR0014344/2003-01-22
preamble:
  text: |-
    In overeenstemming met de Minister voor Vreemdelingenzaken en Integratie;

    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit inrichting organisatie en formatie rijksdienst;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. ministerie: het Ministerie van Justitie;

      b. minister: de Minister van Justitie of de Minister voor Vreemdelingenzaken en Integratie;

      c. departementsleiding: de ministers alsmede de secretaris-generaal, de plaatsvervangend secretaris-generaal en de
      directeuren-generaal gezamenlijk;

      d. bestuursdepartement: de departementsleiding alsmede de beleids-, staf- en bedrijfsvoeringsonderdelen ter
      ondersteuning van de departementsleiding;

      e. bestuursraad: de bestuursraad, bedoeld in artikel 3, vierde lid.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel1
  - number: '2'
    text: |-
      Het ministerie bestaat uit de volgende dienstonderdelen:

      a. de hierna genoemde dienstonderdelen, die rechtstreeks ressorteren onder de secretaris-generaal:

      1°. de directie Algemene Justitiële Strategie;

      2°. het Wetenschappelijk Onderzoek- en Documentatiecentrum;

      3°. het bureau Secretaris-Generaal;

      4°. de directie Voorlichting;

      5°. het bureau Kwaliteitszorg

      6°. de directie Financieel-Economische Zaken;

      7°. de directie Personeel en Organisatie;

      8°. de directie Informatisering;

      9°. de Departementale Accountantsdienst;

      10°. de directie Bedrijfsvoering en Ondersteuning Bestuursdepartemen;

      11°. de Gemeenschappelijke Beheerorganisatie;

      12°. de projectdirectie Huisvesting, Inkoop en Milieu;

      13°. de projectdirectie Nieuwbouw Justitie;

      b. het directoraat-generaal Internationale Aangelegenheden en Vreemdelingenzaken, dat bestaat uit een
      stafondersteuning en de volgende dienstonderdelen:

      1°. het stafbureau Internationale Zaken;

      2°. de directie Vreemdelingenbeleid;

      3°. de directie Coördinatie Integratiebeleid Minderheden;

      4°. de directie Internationale Strafrechtelijke Aangelegenheden en Drugsbeleid;

      5°. het secretariaat van de Adviescommissie voor vreemdelingenzaken;

      6°. de Immigratie- en Naturalisatiedienst;

      c. het directoraat-generaal Preventie, Jeugd en Sancties, dat bestaat uit een stafondersteuning en de volgende
      dienstonderdelen:

      1°. de directie Sancties, Reclassering en Slachtofferzorg;

      2°. de directie Jeugd en Criminaliteitspreventie

      3°. de directie Bestuurszaken;

      4°. de dienst Justitiële Inrichtingen;

      5°. de raad voor de kinderbescherming;

      6°. het Centraal Justitieel Incassobureau;

      7°. het secretariaat van de Raad voor Strafrechtstoepassing en Jeugdbescherming;

      8°. het bureau van het College van toezicht op de kansspelen;

      9°. 9°. het secretariaat van het schadefonds geweldsmisdrijven;

      d. het directoraat-generaal Wetgeving, Rechtspleging en Rechtsbijstand, dat bestaat uit een stafondersteuning en de
      volgende dienstonderdelen:

      1°. de directie Wetgeving;

      2°. de directie Strategie Rechtspleging;

      3°. de directie Rechtsbijstand en Juridische Beroepen;

      e. het directoraat-generaal Rechtshandhaving, dat bestaat uit een stafbureau en de volgende dienstonderdelen:

      1°. het bureau Juridische en Beleidsondersteunende Aangelegenheden;

      2°. het bureau Operationele Zaken;

      3°. de directie Opsporingsbeleid;

      4°. de directie Handhaving;

      5°. het Nederlands Forensisch Instituut;

      het projectdirectoraat-generaal Vreemdelingenwet 2000, dat bestaat uit een stafbureau en een projectbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel2
  - number: '3'
    text: |-
      1 De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in artikel 2 genoemde
      dienstonderdelen.

      2 De secretaris-generaal wordt bij afwezigheid volledig vervangen door de plaatsvervangend secretaris-generaal.
      Daarnaast treedt de plaatsvervangend secretaris-generaal ten aanzien van door de secretaris-generaal vast te
      stellen taken in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal.

      3 De directeuren-generaal zijn belast met de beleids- en bedrijfsvoering van de tot hun directoraat-generaal
      behorende onderdelen. Eén van de binnen het directoraat-generaal vallende directeuren van onderdelen wordt op
      voordracht van de betreffende directeur-generaal namens de minister door de secretaris-generaal aangewezen als
      plaatsvervangend directeur-generaal.

      4 De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal en de directeuren-generaal vormen
      samen de bestuursraad. De bestuursraad formuleert de Justitiebrede en gemeenschappelijke kaders en bewaakt dat de
      activiteiten en het beleid van de onderscheiden directoraten-generaal daarbinnen blijven. De voorzitter van het
      College van procureurs-generaal neemt als toehoorder deel aan de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel3
  - number: '4'
    text: |-
      1 Onverminderd artikel 3 is de secretaris-generaal integraal verantwoordelijk voor de beleids- en bedrijfsvoering
      van de rechtstreeks onder hem ressorterende dienstonderdelen.

      2 Ten aanzien van door hem aan te wijzen dienstonderdelen kan de secretaris-generaal taken opdragen aan de
      plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel4
  - number: '5'
    text: |-
      De directie Algemene Justitiële Strategie ondersteunt de departementsleiding bij de ontwikkeling van strategie. Dit
      doet zij door het uitvoeren van verkenningen en het voorbereiden van de strategische agenda, dit in goed samenspel
      met partners binnen en buiten het ministerie.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel5
  - number: '6'
    text: |-
      1 Het Wetenschappelijk Onderzoek- en Documentatiecentrum is belast met het verrichten van onderzoek en het doen
      verrichten van onderzoek, het adviseren over voorgenomen beleidsprogramma's en te voeren beleid en te verrichten
      onderzoek alsmede het verspreiden van binnen het WODC aanwezige kennis op het terrein van Justitie en met de
      documentatie van (sociaal-) wetenschappelijke publicaties;

      2 Het Wetenschappelijk Onderzoek- en Documentatiecentrum bestaat uit:

      a. de onderzoeksafdeling Asiel & Migratie;

      b. de onderzoeksafdeling Criminaliteitspreventie, Slachtofferzorg, Jeugdbescherming en Sanctietoepassing;

      c. de onderzoeksafdeling Regelgeving, Rechtspleging & Rechtsbijstand;

      d. de onderzoeksafdeling Rechtshandhaving;

      e. de afdeling Externe Wetenschappelijke Betrekkingen;

      f. de afdeling Statistische lnformatievoorziening en Beleidsanalyse;

      g. de afdeling Documentaire lnformatievoorziening;

      h. het bureau bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel6
  - number: '7'
    text: |-
      Het bureau Secretaris-Generaal is belast met algemene staftaken en de secretariële, administratieve en
      organisatorische ondersteuning van de ministers, de secretaris-generaal en de plaatsvervangend secretaris-generaal.
      Het is voorts belast met de protocolaire ondersteuning van de departementsleiding van het ministerie en vervult
      daarbij een coördinerende rol. Deze taken worden gekenmerkt door een representatief of vertrouwelijk karakter.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel7
  - number: '8'
    text: |-
      1 De directie Voorlichting is belast met de interne en externe communicatie.

      2 De directie Voorlichting bestaat uit:

      a. de afdeling In- en externe communicatie;

      b. de afdeling Persvoorlichting en Beleidspresentatie;

      c. de afdeling Publieksinformatie en Nieuwe Media;

      d. het Bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel8
  - number: '9'
    text: |-
      Het bureau Kwaliteitszorg is belast met het ontwikkelen en in stand houden van een algemeen systeem van
      kwaliteitszorg dat complementair is aan de systemen die bij de dienstonderdelen van het ministerie functioneren.
      Daarnaast verricht het bureau doorlichtingen en kwaliteitsonderzoeken.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel9
  - number: '10'
    text: |-
      1 De directie Financieel-Economische Zaken is belast met de advisering van de departementsleiding over financiële
      en macro-economische aspecten van beleid, bedrijfsvoering en uitvoering als bedoeld in artikel 27, eerste en tweede
      lid, van de Comptabiliteitswet 2001 en de daaruit voortvloeiende regelgeving.

      2 De directie Financieel-Economische Zaken bestaat uit:

      a. de afdeling Begroting en Strategie;

      b. de afdeling Planning en Control Sectoren;

      c. de afdeling Evaluatie en Instrumentatie;

      d. de afdeling Financiële Infrastructuur;

      e. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel10
  - number: '11'
    text: |-
      1 De directie Personeel en Organisatie is belast met advisering van de departementsleiding over, en de ontwikkeling
      en coördinatie van justitiebreed organisatie- en personeelsbeleid.

      2 De directie Personeel en Organisatie bestaat uit:

      a. clusters, die verantwoordelijk zijn voor relatiebeheer en de hele cyclus van beleids- en productontwikkeling;

      b. de dienst Salarisadministratie en Financiële Rechtspositietoepassing;

      c. het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel11
  - number: '12'
    text: |-
      1 De directie Informatisering is belast met de advisering van de departementsleiding over, de coördinatie van
      departementale vraagstukken en projectleiding van sectoroverstijgende projecten op het gebied van informatie- en
      communicatietechnologie.

      2 De directie bestaat uit de volgende onderdelen:

      a. de sectie ICT-advies;

      b. de sectie Programmamanagement;

      c. het projectenbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel12
  - number: '13'
    text: |-
      1 De Departementale Accountantsdienst is gelet op de Comptabiliteitswet 2001 belast met de controle van de
      financiële informatie in de jaarverslagen van het ministerie en een aantal aangewezen onderdelen van het
      ministerie. Voorts zijn aan de dienst taken opgedragen voor het uitvoeren van audits naar de totstandkoming
      van informatie over het gevoerde beleid en de bedrijfsvoering, waaronder het gevoerde financieel en materieel
      beheer. De dienst verricht controles en adviseert de departementsleiding over de beheersing van bedrijfsprocessen,
      bedrijfseconomische en administratief-organisatorische aangelegenheden en over geautomatiseerde gegevensverwerking.

      2 Voor de uitvoering van controle- en overige audittaken zijn binnen de Departementale Accountantsdienst drie
      disciplines aanwezig. Afhankelijk van de opdracht wordt rechtmatigheid, IT en/of operational auditdeskundigheid
      ingezet. De uitvoering van de werkzaamheden wordt ondersteund door het Bureau Management Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel13
  - number: '14'
    text: |-
      1 De directie Bedrijfsvoering en Ondersteuning Bestuursdepartement is belast met het ondersteunen van
      integrale managers die deel uitmaken van het bestuursdepartement. De terreinen waarop dat plaatsvindt zijn:
      personeel en organisatie, financiën, commerciële zaken, het vervullen van de rol van sectorcontroller van het
      bestuursdepartement en het verlenen van diensten ten behoeve van het bestuursdepartement op het gebied van
      huisvesting, materieel, automatisering en informatisering.

      2 De directie bestaat uit:

      a. de hoofdafdeling Mandaatbeheer;

      b. de hoofdafdeling Servicemanagement;

      c. de hoofdafdeling Productiemanagement;

      d. het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel14
  - number: '15'
    text: |-
      De Gemeenschappelijke Beheerorganisatie (GBO) is belast met het beheer van geautomatiseerde personeelsinformatie-
      en financiële systemen en andere gemeenschappelijke gebruikte systemen ter ondersteuning van de bedrijfsvoering,
      zoals het intranet.

      De GBO bestaat uit:

      a. de afdeling Functioneel Applicatie Beheer;

      b. de afdeling Beheer Infrastructuur en Techniek;

      c. de afdeling Dienstenbeheer en Kwaliteitszorg;

      d. de afdeling Bedrijfsvoering en Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel15
  - number: '16'
    text: |-
      1 Onverminderd artikel 3 is de directeur-generaal Internationale Aangelegenheden en Vreemdelingenzaken integraal
      verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Internationale
      Aangelegenheden en Vreemdelingenzaken ondergebrachte dienstonderdelen. De directeur-generaal is daarnaast
      verantwoordelijk voor de coördinatie van de internationale aspecten van het beleid van het ministerie.

      2 De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel16
  - number: '17'
    text: |-
      Het stafbureau Internationale Zaken is belast met de coördinatie van de internationale aspecten van het beleid van
      het ministerie.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel17
  - number: '18'
    text: |-
      1 De directie Vreemdelingenbeleid is belast met de advisering van de departementsleiding over en de ontwikkeling en
      coördinatie van het immigratie- en vreemdelingenopvangbeleid.

      2 De directie heeft een coördinerende taak in de advisering van de directeur-generaal Internationale
      Aangelegenheden en Vreemdelingenzaken omtrent de besturing van de uitvoerende organisaties op het gebied van de
      vreemdelingen en van de opvang van asielzoekers.

      3 De directie heeft verder tot taak het Centraal Orgaan opvang asielzoekers binnen de door de directeur-generaal
      gestelde kaders beheersmatig en financieel aan te sturen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel18
  - number: '19'
    text: |-
      1 De directie Coördinatie Integratiebeleid Minderheden heeft een coördinerende taak ten aanzien van:

      a. het integratiebeleid, waaronder inburgering, arbeidsmarkt, onderwijs en wet- en regelgeving;

      b. het antidiscriminatie- en remigratiebeleid;

      c. de uitvoering van de Wet gemeentelijke zorg voor houders van een voorwaardelijke vergunning tot verblijf,
      voorzover van toepassing ingevolge artikel 5, tweede lid, van hoofdstuk 11 van de Invoeringswet Vreemdelingenwet
      2000, en de uitplaatsing van vergunninghouders asiel;

      d. het initiëren van beleidsvoornemens van de directie op Europees en internationaal niveau.

      2 De directie bestaat uit:

      a. de afdeling Antiracisme, Huisvesting en Participatie;

      b. de afdeling Inburgering, Onderwijs en Werk;

      c. de afdeling Strategie, Onderzoek en Communicatie;

      d. het Bureau Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel19
  - number: '20'
    text: |-
      1 De directie Internationale Strafrechtelijke Aangelegenheden en Drugsbeleid is belast met de ontwikkeling
      en coördinatie van en overleg over het nationaal en internationaal justitieel drugsbeleid, het verzorgen van
      de samenhang bij de inbreng van Justitie in internationale gremia op het gebied van justitiële en politiële
      samenwerking en met de uitvoering van taken op het terrein van de internationale rechtshulp in strafzaken en met
      de advisering van de departementsleiding over en de ontwikkeling van beleid op het gebied van de internationale
      strafrechtspleging.

      2 De directie bestaat uit:

      a. het bureau Coördinatie Drugsbeleid;

      b. het bureau Internationale Rechtshulp in Strafzaken;

      c. het bureau Internationale Strafrechtelijke Samenwerking;

      d. het Bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel20
  - number: '21'
    text: |-
      Het secretariaat van de Adviescommissie Vreemdelingenzaken is belast met de ambtelijke ondersteuning van de
      Adviescommissie voor vreemdelingenzaken.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel21
  - number: '22'
    text: |-
      De Immigratie- en Naturalisatiedienst is belast met de uitvoering van de Vreemdelingenwetgeving en van de Rijkswet
      op het Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel22
  - number: '23'
    text: |-
      1 Onverminderd artikel 3 is de directeur-generaal Preventie, Jeugd en Sancties integraal verantwoordelijk voor
      de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Preventie, Jeugd en Sancties ondergebrachte
      dienstonderdelen.

      2 De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel23
  - number: '24'
    text: |-
      1 De directie Sancties, Reclassering en Slachtofferzorg is verantwoordelijk voor de advisering van de
      departementsleiding over en de ontwikkeling, de coördinatie en evaluatie van beleid dat gericht is op het
      bevorderen van de veiligheid van de maatschappij door:

      a. een effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en maatregelen en
      financiële sancties;

      b. een vermindering van de recidive;

      c. het aanbieden van goede zorg en dienstverlening aan slachtoffers van criminaliteit.

      2 Tevens is de directie belast met de advisering van de departementsleiding over en de ontwikkeling, coördinatie
      en evaluatie van beleid dat gericht is op het in goede banen leiden van kansspelen door het beschermen van de
      consument, het tegengaan van gokverslaving en het tegengaan van criminaliteit.

      3 De directie heeft een coördinerende taak in de advisering van de directeur-generaal Preventie, Jeugd en Sancties
      omtrent de besturing en beleidsvoering van de dienst Justitiële Inrichtingen.

      4 De directie onderhoudt namens de directeur-generaal de besturingsrelatie met gesubsidieerde organisaties en
      instellingen op het terrein van de directie.

      5 De directeur heeft verder tot taak de dienst Centraal Justitieel Incassobureau en de ambtelijke diensten van
      de Raad voor de strafrechttoepassing en jeugdbescherming, van het College van toezicht op de kansspelen en het
      Schadefonds Geweldsmisdrijven binnen de door de directeur-generaal gestelde kaders aan te sturen.

      6 De directie bestaat uit:

      a. de afdeling Sancties en Slachtofferzorg;

      b. de afdeling Jeugdsancties en TBS;

      c. de afdeling Planning & Control;

      d. het bureau managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel24
  - number: '25'
    text: |-
      1 De directie Jeugd en Criminaliteitspreventie is belast met de advisering van de departementsleiding over en de
      coördinatie, ontwikkeling en evaluatie van beleid dat gericht is op het leveren van een bijdrage aan een veilige
      en rechtvaardige samenleving vanuit een oogpunt van preventie van criminaliteit, versterking van de sociale
      infrastructuur, bescherming van minderjarigen en bevordering van een samenhangende strafrechtelijke en pedagogische
      aanpak van de jeugdige nadat deze zich schuldig heeft gemaakt aan strafwaardig gedrag.

      2 De directie heeft een coördinerende taak in de advisering van de directeur-generaal Preventie, Jeugd en Sancties
      omtrent de besturing en de beleidsvoering van de directie Bestuurszaken en de raad voor de kinderbescherming.

      3 De directie onderhoudt namens de directeur-generaal de besturingsrelatie met gesubsidieerde organisaties en
      instellingen op het terrein van de directie.

      4 De directie heeft verder tot taak het Landelijk Bureau Inning Onderhoudsbijdrage binnen de door de directeur-
      generaal gestelde kaders beheersmatig en financieel aan te sturen.

      5 De directie bestaat uit:

      a. de afdeling Criminaliteitspreventie;

      b. de afdeling Jeugd;

      c. de afdeling Algemeen Beleid;

      d. de afdeling Planning en Control;

      e. het bureau managementondersteuning, de afdeling Juridische zaken, welke tevens werkzaamheden verricht voor de
      directeur-generaal en diens stafondersteuning en de directie Sancties, Reclassering en Slachtofferzorg.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel25
  - number: '26'
    text: |-
      1 De directie Bestuurszaken is belast met het namens de minister nemen van besluiten en verwerken van informatie
      ter bevordering van een betrouwbare, veilige en rechtvaardige samenleving in sectoren met kwetsbare belangen.

      2 De directie bestaat uit:

      a. de afdeling Informatie, Beheer en Ondersteuning;

      b. de afdeling Juridische Zaken en Beleid;

      c. de afdeling Planning, Financiën en Control;

      d. de afdeling Integriteit Bedrijfsleven;

      e. de afdeling Individuele Beleidsbeslissingen;

      f. het bureau Bevordering Integere Besluitvorming Openbaar Bestuur i.o;

      g. de afdeling verklaring omtrent gedrag i.o.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel26
  - number: '27'
    text: |-
      De dienst Justitiële Inrichtingen is belast met de tenuitvoerlegging van vrijheidsbenemende straffen en
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel27
  - number: '28'
    text: |-
      De raad voor de kinderbescherming is belast met het waarborgen van het fundamentele recht van het kind op
      een gezonde en evenwichtige ontwikkeling en uitgroei naar volwassenheid. De raad voert de volgende taken uit:
      beschermingszaken, advieszaken en strafzaken.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel28
  - number: '29'
    text: |-
      Het Centraal Justitieel Incassobureau is belast met de adequate inning van opgelegde of toegepaste financiële
      sancties, geldboetes en geaccepteerde transacties naar aanleiding van een wetsovertreding, alsmede met de
      landelijke coördinatie van arrestatiebevelen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel29
  - number: '30'
    text: |-
      Het secretariaat van de Raad voor strafrechtstoepassing en jeugdbescherming is belast met de bedrijfsvoering en
      ondersteuning van de Raad in de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel30
  - number: '31'
    text: |-
      Het bureau van het College van toezicht op de kansspelen is belast met de inhoudelijke en administratieve
      ondersteuning van het College van toezicht op de kansspelen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel31
  - number: '32'
    text: |-
      Het secretariaat van het Schadefonds geweldsmisdrijven is belast met de bedrijfsvoering en ondersteuning van de
      Commissie schadefonds geweldsmisdrijven.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel32
  - number: '33'
    text: |-
      Onverminderd artikel 3 is de directeur-generaal Wetgeving, Rechtspleging en Rechtsbijstand integraal
      verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Wetgeving,
      Rechtspleging en Rechtsbijstand ondergebrachte dienstonderdelen.

      De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel33
  - number: '34'
    text: |-
      1 De directie Wetgeving is belast met de ontwikkeling, totstandkoming, het beheer en onderhoud van
      Justitiewetgeving, alsmede met het ontwikkelen en uitdragen van het wetgevingskwaliteitsbeleid en de toetsing
      van ontwerp-wetgeving van de ministeries op rechtsstatelijke en bestuurlijke kwaliteit, met inbegrip van de
      constitutionele, Europees-rechtelijke en internationaal-rechtelijke toetsing van wetgeving. Voorts worden
      juridische adviestaken uitgevoerd betreffende: de coördinatie van contacten met de landsadvocaat, het geven
      van juridisch advies in gecompliceerde aangelegenheden en het uitvoeren van bijzondere opdrachten van de
      departementsleiding.

      2 De directie Wetgeving bestaat uit:

      a. de sector Straf- en sanctierecht;

      b. de sector Staats- en bestuursrecht;

      c. de sector Privaatrecht;

      d. de sector Wetgevingskwaliteitsbeleid;

      e. de Juridisch Adviseur;

      f. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel34
  - number: '35'
    text: |-
      1 De directie Strategie Rechtspleging is binnen het kader van de ministeriële verantwoordelijkheid voor de
      rechtspleging belast met de beleidsadvisering van de departementsleiding over het stelsel van de rechterlijke
      organisatie en behartigt de relatie tussen de rechterlijke macht en de Minister van Justitie. De directie draagt
      zorg voor de bekostiging van de Raad voor de rechtspraak en beoordeelt de verantwoording van de raad. De directie
      is voorts belast met het beheer van de Hoge Raad, het College voor de bescherming van persoonsgegevens, de
      Commissie gelijke behandeling, de Nederlandse Vereniging voor Rechtspraak en de Centrale Justitiële Documentatie.

      2 De directie bestaat uit:

      a. de sector Strategie en Ontwikkeling;

      b. de sector Instrumentatie, Begroting en Verantwoording

      c. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel35
  - number: '36'
    text: |-
      1 De directie Rechtsbijstand en Juridische Beroepen is belast met de beleidsadvisering van de departementsleiding
      over en de uitvoering van de aan de minister opgedragen taken op het terrein van de rechtsbijstand, juridische
      beroepen, alternatieve geschillenbeslechting (ADR), schuldsanering natuurlijke personen en tolken en vertalers.

      2 De directie heeft een coördinerende taak in de advisering van de directeur-generaal Wetgeving, Rechtspleging en
      Rechtsbijstand omtrent de besturing van de raden voor rechtsbijstand en de uitvoerende organisaties en instellingen
      waarmee een subsidierelatie wordt onderhouden.

      3 De directie bestaat uit:

      a. de afdeling Beleid;

      b. de afdeling Operationele processen;

      c. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel36
  - number: '37'
    text: |-
      1 Onverminderd artikel 3 is de directeur-generaal Rechtshandhaving integraal verantwoordelijk voor de beleids- en
      bedrijfsvoering van de binnen het directoraat-generaal Rechtshandhaving ondergebrachte dienstonderdelen.

      2 De directeur-generaal is daarnaast beheersverantwoordelijk voor het Openbaar Ministerie.

      De directeur-generaal wordt hierbij organisatorisch, administratief, financieel en documentair ondersteund door
      het stafbureau.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel37
  - number: '38'
    text: |-
      Het bureau Operationele Zaken is belast met de uitoefening van een aantal taken op het gebied van de opsporing en
      vervolging, crisisbeheersing, terreurbestrijding en beveiliging van personen, dat in het bijzonder aan de Minister
      van Justitie is opgedragen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel38
  - number: '39'
    text: |-
      Het bureau Juridische en Beleidsondersteunende Aangelegenheden is belast met de juridische en beleidsmatige
      ondersteuning van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel39
  - number: '40'
    text: |-
      De directie Opsporingsbeleid is belast met sturing, instrumentatie, kwaliteit en organisatie van de opsporing. Het
      Meldpunt Ongebruikelijke Transacties, het bureau Platform Interceptie, Decryptie en Signaalanalyse en het Centraal
      Informatiepunt Onderzoek Telecommunicatie zijn onderdeel van de directie.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel40
  - number: '41'
    text: |-
      De directie Handhaving is met inachtneming van de verantwoordelijkheden van het Openbaar Ministerie belast met
      de ontwikkeling en vaststelling van het justitiële vervolgingsbeleid. Het expertisecentrum Rechtshandhaving is
      onderdeel van de directie.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel41
  - number: '42'
    text: |-
      Het Nederlands Forensisch Instituut is belast met het leveren van een bijdrage aan de waarheidsvinding in het
      strafproces door het verrichten van forensisch zaakonderzoek ten dienste van de zittende magistratuur, het Openbaar
      Ministerie, de politie en overige personen en instanties die met de opsporing van strafbare feiten belast zijn.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel42
  - number: '43'
    text: |-
      Bij de hoofden van de in artikel 2 genoemde dienstonderdelen ligt voor het daarbij werkzame personeel een exemplaar
      van deze regeling alsmede het organisatie- en formatierapport van het betreffende dienstonderdeel ter inzage.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel43
  - number: '44'
    text: |-
      1 Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in deze regeling, behoeft de instemming
      van de bestuursraad.

      2 De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent instemming wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel44
  - number: '45'
    text: |-
      1 Elk van de in artikel 2 genoemde dienstonderdelen ontwerpt en onderhoudt een organisatierapport en een
      formatierapport en, voor zover van toepassing, een taakbesluit en een agentschapsregeling.

      2 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in artikel
      2, onder a en f, is de secretaris-generaal bevoegd het document namens de minister vast te stellen.

      3 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in artikel
      2, onder b tot en met e, is de directeur-generaal onder wie het dienstonderdeel ressorteert, bevoegd het document
      namens de minister vast te stellen.

      4 De secretaris-generaal respectievelijk de directeur-generaal kan de in het tweede respectievelijk derde lid
      bedoelde bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.

      5 Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad. De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent
      instemming wordt genomen.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel45
  - number: '46'
    text: |-
      Na inwerkingtreding van deze regeling berust het Taak- en bevoegdheidsbesluit plv. secretaris-generaal Justitie op
      de artikelen 3, tweede lid, tweede volzin, en 4, tweede lid, van deze regeling.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel46
  - number: '47'
    text: De Organisatieregeling Ministerie van Justitie 2000 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel47
  - number: '48'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel48
  - number: '49'
    text: 'Deze regeling wordt aangehaald als: Organisatieregeling Ministerie van Justitie 2002.'
    url: https://wetten.overheid.nl/BWBR0014344/2003-01-22#Artikel49
