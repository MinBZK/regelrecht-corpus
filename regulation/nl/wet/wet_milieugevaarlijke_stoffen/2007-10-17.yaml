        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '30'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], kan tevens worden bepaald dat de
      schade, geleden door degene die de stoffen, preparaten of produkten moet terugzenden of afgeven, of de kosten,
      gemaakt door degene die is aangewezen om die stoffen, preparaten of produkten in te zamelen, ten laste kunnen
      worden gebracht van degenen die die stoffen, preparaten of produkten hebben vervaardigd of in Nederland ingevoerd.
      Daarbij kunnen tevens regelen worden gesteld inzake de berekening van die schade of kosten en de bepaling van
      degenen ten laste van wie die schade of kosten worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '31'
    text: |-
      1 Indien de verwachte of gebleken effecten van stoffen of preparaten op mens of milieu het stellen van regelen
      als bedoeld in [artikel 24, eerste lid][ref1], naar het oordeel van Onze Minister dringend noodzakelijk maken en
      naar zijn oordeel de totstandkoming van een algemene maatregel van bestuur krachtens dat artikel niet kan worden
      afgewacht, kan hij een besluit nemen van de in dat lid bedoelde strekking. Onze Minister neemt een zodanig besluit
      in overeenstemming met Onze Ministers wie het mede aangaat, tenzij de vereiste spoed dit naar zijn oordeel niet
      gedoogt. De [artikelen 25 tot en met 28][ref2] en [30][ref3] zijn van overeenkomstige toepassing.

      2 Een ministeriële regeling als bedoeld in het eerste lid vervalt een jaar nadat zij in werking is getreden
      of indien binnen die termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is
      getreden, op het tijdstip waarop die maatregel in werking treedt. De termijn kan bij ministeriële regeling eenmaal
      met ten hoogste een jaar worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel30
