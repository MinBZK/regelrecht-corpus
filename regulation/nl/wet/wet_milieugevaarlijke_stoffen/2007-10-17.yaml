  - number: '61.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel61
  - number: '62'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel62
  - number: '63'
    text: |-
      Een gedraging in strijd met een voorschrift krachtens [artikel 26, vierde lid][ref1], of [33, tweede lid][ref2],
      aan een vergunning of ontheffing verbonden, in strijd met een krachtens [artikel 26, vierde lid][ref3], gestelde
      nadere eis, dan wel in strijd met een krachtens [artikel 40][ref4] genomen maatregel is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel40
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel63
