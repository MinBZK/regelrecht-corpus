  - number: '15'
    text: |-
      1 Nadere gegevens moeten wederom door degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een
      kennisgeving heeft gedaan, met betrekking tot die stof worden overgelegd, indien hij in enig jaar 1000 ton of meer
      van die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd, dan wel indien hij in totaal meer
      dan 5000 ton van die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd. Met het oog daarop is
      hij verplicht het bereiken of overschrijden van de in de eerste volzin aangegeven hoeveelheidsgrenzen terstond aan
      Onze Minister te melden.

      2 Onze Minister stelt, na overleg met degene die de kennisgeving heeft gedaan, in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid vast, welke nadere gegevens met betrekking tot de stof door degene
      die de kennisgeving heeft gedaan, moeten worden verschaft en binnen welke termijn dat dient te geschieden.
      [Artikel 14, tweede lid, tweede, derde en vierde volzin, derde, vierde en zesde lid][ref2], is van overeenkomstige
      toepassing.

      3 Bij zijn besluit op grond van het tweede lid, eerste volzin, kan Onze Minister afwijken van de met
      overeenkomstige toepassing van [artikel 14, vierde lid][ref3], gestelde regelen.


