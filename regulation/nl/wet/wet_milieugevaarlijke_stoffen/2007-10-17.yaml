        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '56.3'
    text: |-
      Indien het verzoek een stuk betreft, overgelegd krachtens [artikel 4][ref1], [13][ref2], [14][ref3], [15][ref4] of
      [16][ref5], kan Onze Minister niet besluiten tot geheimhouding van:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0003892#Artikel16
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
    references:
