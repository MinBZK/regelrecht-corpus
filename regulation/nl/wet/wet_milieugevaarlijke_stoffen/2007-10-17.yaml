        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '40.3'
    text: |-
      Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat, tenzij de vereiste spoed dit naar zijn oordeel niet gedoogt. In het laatstgenoemde geval onderwerpt Onze
      Minister de maatregel zo spoedig mogelijk aan het oordeel van de Raad van Ministers. Indien deze met de maatregel
      niet instemt, trekt Onze Minister haar terstond in.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: '40.4'
    text: |-
      Onze Minister geeft van een maatregel krachtens het eerste lid en van de intrekking van zodanige maatregel kennis
      in de *Nederlandse Staatscourant*, alsmede op zodanige wijze dat de maatregel, onderscheidenlijk de intrekking
      daarvan, zo spoedig mogelijk ter kennis van de betrokkenen komt.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: '42'
    text: |-
      Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
  - number: '55.1'
    text: |-
      Onze Minister zendt - voor zover het betreft het ambtsterrein van een of meer Onzer andere ministers, in
      overeenstemming met die ministers - telkens om de vijf jaar aan de Staten-Generaal een verslag over de wijze waarop
      deze wet is toegepast.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel55
  - number: '55.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de toepassing van
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel55
  - number: '56.1'
    text: |-
      Indien in een stuk dat ingevolge het bij of krachtens deze wet bepaalde aan Onze Minister, dan wel aan een andere
      persoon of instelling wordt overgelegd, gegevens voorkomen of uit zodanig stuk gegevens kunnen worden afgeleid,
      waarvan de geheimhouding met het oog op de bescherming van bedrijfsgeheimen gerechtvaardigd is, besluit Onze
      Minister op een daartoe strekkend verzoek van degene die het stuk overlegt, dat die gegevens geheim gehouden
      worden.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: '56.2'
    text: |-
      Het eerste lid is niet van toepassing op een kennisgeving als bedoeld in [artikel 3][ref1] van het vervaardigen van
      een stof en op de stukken die in verband met een zodanige kennisgeving ingevolge [artikel 4][ref2] of [13][ref3]
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel13
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
