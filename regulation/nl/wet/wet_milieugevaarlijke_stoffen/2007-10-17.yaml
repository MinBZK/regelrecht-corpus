  - number: '67.2'
    text: |-
      Indien met betrekking tot de in het eerste lid bedoelde stoffen een kennisgeving als bedoeld in
      [artikel 3, tweede lid][ref1], wordt gedaan, zijn op zodanige kennisgeving de[ artikelen 9 tot en met 12][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel9
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel67
    references:
