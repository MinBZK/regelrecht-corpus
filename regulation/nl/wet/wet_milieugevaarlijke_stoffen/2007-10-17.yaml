  - number: '14'
    text: |-
      1 Degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een kennisgeving heeft gedaan, is
      verplicht met betrekking tot die stof nadere gegevens over te leggen, indien hij in enig jaar 100 ton of meer van
      die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd, dan wel indien hij in totaal 500 ton
      of meer van die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd. Met het oog daarop is hij
      verplicht, het bereiken of overschrijden van de in de eerste volzin aangegeven hoeveelheidsgrenzen terstond aan
      Onze Minister te melden.

      2 Onze Minister stelt, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid vast welke
      nadere gegevens met betrekking tot de stof door degene die de kennisgeving heeft gedaan, moeten worden overgelegd
      en binnen welke termijn dat dient te geschieden. Degene die de kennisgeving heeft gedaan, is verplicht voor het
      verkrijgen van de vereiste gegevens onderzoek te verrichten. Ingeval de vereiste gegevens reeds ingevolge dit
      artikel, dan wel ingevolge [artikel 16][ref2] door een ander zijn overgelegd, kan hij in afwijking van de vorige
      volzin naar die gegevens verwijzen, indien hij een schriftelijke verklaring van de betrokkene overlegt, dat deze
      tegen de verwijzing geen bedenkingen heeft, dan wel indien de vereiste gegevens ten minste tien jaar tevoren zijn
      overgelegd. [Artikel 4, vijfde lid, tweede volzin][ref3], is van overeenkomstige toepassing.

      3 De nadere gegevens, bedoeld in het tweede lid, worden schriftelijk overgelegd. Onze Minister maakt de
      overlegging van nadere gegevens zo spoedig mogelijk bekend, doch in elk geval binnen zes weken na de dag
      van ontvangst, dan wel, ingeval met betrekking tot deze gegevens op een verzoek om geheimhouding ingevolge
      [artikel 56][ref4] nog niet onherroepelijk is beslist, uiterlijk twee weken na de datum waarop zodanige beslissing
      onherroepelijk is geworden. Met betrekking tot de bekendmaking zijn de[ artikelen 9, tweede lid][ref5], en
      [ artikelen 10, aanhef en onder ][ref6], en [11][ref7] van overeenkomstige toepassing.

      4 Bij algemene maatregel van bestuur worden regelen gesteld met betrekking tot de over te leggen nadere gegevens.
      De [artikelen 4, zesde en negende lid][ref8], en [5][ref9] zijn van overeenkomstige toepassing.

      5 Bij zijn besluit op grond van het tweede lid kan Onze Minister in bijzondere gevallen afwijken van de krachtens
      het vierde lid gestelde regelen, indien het naar zijn oordeel op grond van de reeds bekende eigenschappen van de
      stof wenselijk is dat met betrekking tot die stof andere, door hem bij zijn besluit aan te wijzen gegevens worden
      overgelegd, dan wel indien het naar zijn oordeel op grond van de reeds bekende eigenschappen van de stof niet
      noodzakelijk is dat nadere gegevens worden overgelegd.

      6 Onze Minister zendt een exemplaar van de ingevolge een besluit krachtens het tweede lid aan hem overgelegde
      stukken zo spoedig mogelijk aan Onze Minister van Sociale Zaken en Werkgelegenheid. Indien de kennisgeving, bedoeld
      in het eerste lid, betrekking had op het in Nederland invoeren of het aan een ander ter beschikking stellen van
      de stof, zendt hij een samenvatting van de stukken aan de Commissie van de Europese Gemeenschappen en aan Onze
      Minister van Volksgezondheid, Welzijn en Sport. Bij de stukken voegt hij een exemplaar van zijn in dat lid bedoelde
      besluit. [Artikel 6, vierde lid][ref10], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
