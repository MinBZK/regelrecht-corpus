  - number: '37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de
      aanduiding van stoffen waarvan nog niet is bepaald in hoeverre zij behoren tot een of meer van de in
      [artikel 34, tweede lid][ref1], bedoelde categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel37
