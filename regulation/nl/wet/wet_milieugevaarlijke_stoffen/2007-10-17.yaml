  - number: '21'
    text: |-
      1 Onze Minister kan na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, indien hij zulks met het oog
      op de toepassing van de[ artikelen 22][ref1], [23][ref2], [24][ref3] of [31][ref4] in verband met de beoordeling
      van de mogelijke gevaren van een stof of een preparaat nodig acht, aan een ieder die beroepshalve die stof of
      dat preparaat vervaardigt, in Nederland invoert, toepast of aan een ander ter beschikking stelt, opdragen de door
      hem verlangde gegevens met betrekking tot die stof of dat preparaat te verstrekken, waarover deze beschikt of
      redelijkerwijs kan beschikken.

      2 Degene aan wie een opdracht als bedoeld in het eerste lid is gegeven, is verplicht zodanige gegevens schriftelijk
      over te leggen. [Artikel 20, derde en vierde lid][ref5], is van overeenkomstige toepassing.


