  - number: '11'
    text: |-
      1 Onze Minister legt met een exemplaar van de kennisgeving stukken ter inzage, die bevatten:

      a. een aanduiding van de identiteit van de stof;

      b. de overgelegde gegevens inzake de fysisch-chemische eigenschappen van de stof;

      c. de overgelegde gegevens met betrekking tot mogelijkheden om de stof onschadelijk te maken;

      d. de overgelegde gegevens met betrekking tot aanbevolen voorzorgsmaatregelen om verspreiding van de stof te
      voorkomen en aanbevolen noodmaatregelen bij een ongeval met de stof;

      e. de overgelegde gegevens inzake de verrichte onderzoeken naar de effecten die de stof op mens of milieu kan
      hebben, dan wel, indien met betrekking tot zodanige gegevens [artikel 56][ref1] toepassing heeft gevonden, de
      overeenkomstig dat artikel overgelegde tweede tekst.

      2 Onze Minister legt voorts de overige bij de kennisgeving overgelegde stukken, voor zover kennisneming daarvan
      redelijkerwijs nodig kan zijn voor een beoordeling van de mogelijke effecten van de stof op mens of milieu, ter
      inzage, tenzij met betrekking tot die stukken toepassing is gegeven aan [artikel 56][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel56
