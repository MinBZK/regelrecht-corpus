    text: |-
      1 De[ artikelen 3 tot en met 18][ref1] zijn niet van toepassing op stoffen:

      a. die voor 18 september 1981 reeds in de Europese Gemeenschappen werden ingevoerd of in de handel waren;

      b. die in Nederland worden vervaardigd of ingevoerd met het oog op de voorbereiding van een kennisgeving als
      bedoeld in [artikel 3][ref2];

      c. die in Nederland niet in het vrije verkeer worden gebracht, tenzij zij binnen Nederlands grondgebied worden
      verwerkt of omgezet;

      d. die in de procesinstallatie waarin zij ontstaan, worden omgezet in andere stoffen zonder dat daarbij
      tussentijdse opslag plaatsvindt;

      e. met betrekking waartoe degene die voornemens is die stof in Nederland te vervaardigen of in te voeren ingevolge
      de artikelen 7 of 8 van de richtlijn een toereikende kennisgeving heeft gedaan bij het daartoe aangewezen
      overheidsorgaan van een andere Lid-Staat van de Europese Unie of van een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte.

      2 Indien met betrekking tot een stof van de zijde van de Commissie van de Europese Gemeenschappen gegevens als
      bedoeld in [artikel 4][ref3], [14][ref4], [15 ][ref5]en [16][ref6] worden ontvangen als gevolg van een kennisgeving
      met betrekking tot die stof in een andere Lid-Staat van de Europese Unie of een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, zijn op die gegevens de[ artikelen 9 tot en met 12][ref7],
      [14, derde lid, tweede en derde volzin][ref8], en [18][ref9] van overeenkomstige toepassing. De eerste volzin vindt
      geen toepassing voor zover zulks door Onze Minister met het oog op de in de desbetreffende Staat geldende regelen
      met betrekking tot de bescherming van bedrijfsgeheimen is bepaald.

      3 Bij algemene maatregel van bestuur kunnen andere categorieën van gevallen worden aangewezen, waarin
      de[ artikelen 3 tot en met 18][ref10] geheel of voor een daarbij te bepalen gedeelte niet van toepassing zijn:

      a. ter uitvoering van een krachtens het Verdrag betreffende de Europese Unie tot stand gekomen bindende regeling;

      b. indien onverkorte toepassing van die artikelen in het belang van de bescherming van mens en milieu niet
      noodzakelijk is.

      4 Bij algemene maatregel van bestuur kunnen met betrekking tot stoffen waarop ingevolge het eerste of derde lid
      de[ artikelen 3 tot en met 18][ref11] geheel of ten dele niet van toepassing zijn, regelen worden gesteld met
      betrekking tot de in die artikelen geregelde onderwerpen.

      5 Bij algemene maatregel van bestuur kan ter uitvoering van de richtlijn worden bepaald dat, in plaats van het in
      het eerste lid, onder *a*, bepaalde, de[ artikelen 3 tot en met 18][ref12] vanaf een bij die maatregel te bepalen
      datum niet van toepassing zijn op stoffen die voorkomen op een bij die maatregel vast te stellen lijst.


