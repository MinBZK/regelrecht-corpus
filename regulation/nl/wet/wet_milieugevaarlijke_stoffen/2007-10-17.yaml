        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 56.3.h
    text: |-
      met betrekking tot een stof of een preparaat, behorende tot een van de in [artikel 34, tweede lid][ref1], genoemde
      categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
