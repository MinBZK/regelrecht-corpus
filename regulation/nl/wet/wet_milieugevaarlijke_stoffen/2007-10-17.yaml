  - number: '18'
    text: |-
      1 Gelijktijdig met de bekendmaking van een kennisgeving overeenkomstig [artikel 9][ref1] doet Onze Minister de stof
      waarop de kennisgeving betrekking heeft, opnemen in een register.

      2 Van de stof worden in het register opgenomen:

      a. een aanduiding van de identiteit;

      b. een beschrijving van de effecten die de stof kan hebben op mens of milieu;

      c. de ingevolge [artikel 4, eerste lid, onder ][ref2], overgelegde gegevens met betrekking tot de mogelijkheden om
      de stof onschadelijk te maken;

      d. de ingevolge [artikel 4, eerste lid, onder ][ref3], overgelegde gegevens met betrekking tot aanbevolen
      voorzorgsmaatregelen om verspreiding van de stof te voorkomen en aanbevolen noodmaatregelen bij een ongeval met
      de stof;

      e. indien de stof behoort tot een categorie als bedoeld in [artikel 34, tweede lid][ref4]: de categorie waarin de
      stof is opgenomen.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat ook daarbij aan te wijzen andere gegevens in het
      register worden opgenomen, voor zover zij niet krachtens een besluit op grond van [artikel 56, eerste lid][ref5],
      geheim moeten worden gehouden.

      4 Aan een ieder wordt inzage verleend in het register. Onze Minister verstrekt aan een ieder desgevraagd, tegen
      betaling van de kosten, een afschrift.

      5 Onze Minister stelt regelen inzake de inrichting van het register. Hij kan tevens nadere regelen stellen ter zake
      van het in het tweede lid of krachtens het derde lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel9
