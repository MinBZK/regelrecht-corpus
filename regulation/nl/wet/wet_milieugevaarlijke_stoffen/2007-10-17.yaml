  - number: '6'
    text: |-
      1 Onze Minister tekent de datum van ontvangst van een kennisgeving als bedoeld in [artikel 3][ref1] aan op het
      geschrift waarbij de kennisgeving is gedaan, en zendt degene die de kennisgeving heeft gedaan, uiterlijk een week
      na de ontvangst van de kennisgeving een bewijs van ontvangst, waarin die datum is vermeld.

      2 Hij zendt zo spoedig mogelijk een exemplaar van de kennisgeving en de daarbij overgelegde stukken als bedoeld
      in [artikel 4][ref2] aan Onze Minister van Sociale Zaken en Werkgelegenheid en, voor zover deze stukken van belang
      zijn in verband met het vervoer van de stof, aan Onze Minister van Verkeer en Waterstaat.

      3 Indien de kennisgeving betrekking heeft op het in Nederland invoeren of het aan een ander ter beschikking stellen
      van een stof, zendt Onze Minister voorts een exemplaar van de kennisgeving aan Onze Minister van Volksgezondheid,
      Welzijn en Sport en aan de Commissie van de Europese Gemeenschappen. Hij voegt daarbij een samenvatting van alle
      met betrekking tot die stof door degene die de kennisgeving heeft gedaan, aan hem overgelegde stukken als bedoeld
      in [artikel 4][ref3].

      4 Bij algemene maatregel van bestuur kunnen andere bestuursorganen of instellingen worden aangewezen, waaraan een
      exemplaar van de in het tweede lid bedoelde stukken of van bij de maatregel aan te wijzen onderdelen daarvan wordt
      toegezonden of kan worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel4
