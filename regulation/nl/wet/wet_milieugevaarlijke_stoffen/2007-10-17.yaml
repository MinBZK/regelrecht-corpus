  - number: '24'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, indien een redelijk vermoeden is gerezen dat door handelingen
      met stoffen of preparaten ongewenste effecten zullen ontstaan voor mens of milieu, regelen worden gesteld met
      betrekking tot het vervaardigen, in Nederland invoeren, toepassen, voorhanden hebben, aan een ander ter beschikking
      stellen, vervoeren, uitvoeren en zich ontdoen van deze stoffen of preparaten.

      2 Hiertoe kunnen behoren regelen, inhoudende:

      a. een verbod een of meer van de in het eerste lid genoemde handelingen te verrichten met betrekking tot bij de
      maatregel aangewezen stoffen of preparaten;

      b. een verbod zodanige handeling te verrichten op een bij de maatregel aangegeven wijze, voor daarbij aangegeven
      doeleinden, op daarbij aangegeven plaatsen of onder daarbij aangegeven omstandigheden;

      c. een verbod een handeling als onder *a* of *b* bedoeld te verrichten zonder vergunning, verleend door Onze
      Minister;

      d. een verbod zodanige handeling te verrichten indien met betrekking tot de stoffen of preparaten niet aan bij de
      maatregel gestelde eisen wordt voldaan;

      e. een verbod zodanige handeling te verrichten indien bij degene die die handeling verricht, niet de bij de
      maatregel aangegeven deskundigheid aanwezig is;

      f. een verbod zodanige handeling te verrichten met betrekking tot produkten, indien deze daarbij aangewezen stoffen
      of preparaten bevatten, of indien deze zodanige stoffen of preparaten bevatten in grotere dan daarbij aangegeven
      hoeveelheden;

      g. een verbod bij de maatregel aangewezen stoffen of preparaten toe te passen in produkten die niet behoren
      tot een type dat bij een keuring, verricht aan de hand van de bij de maatregel daartoe vastgestelde regelen, is
      goedgekeurd;

      h. een verbod bij de maatregel aangewezen stoffen of preparaten ter beschikking te stellen aan een daarbij
      aangewezen categorie van personen;

      i. een verplichting een of meer van de in het eerste lid genoemde handelingen met betrekking tot bij de maatregel
      aangewezen stoffen of preparaten of daarbij aangewezen categorieën van produkten waarin die stoffen of preparaten
      voorkomen, te melden op een daarbij aangegeven wijze aan een daarbij aangewezen bestuursorgaan onder overlegging
      van daarbij aangegeven gegevens;

      j. een verplichting met betrekking tot zodanige handelingen volgens bij de maatregel gestelde regelen controle-
      onderzoeken te verrichten en de resultaten van die onderzoeken op de bij de maatregel aangegeven wijze aan Onze
      Minister over te leggen;

      k. een verplichting bij de maatregel aangewezen stoffen of preparaten of daarbij aangewezen categorieën van
      produkten waarin die stoffen of preparaten voorkomen, na toepassing terug te zenden aan degene die die stoffen,
      preparaten of produkten ter beschikking heeft gesteld;

      l. een verplichting bij de maatregel aangewezen stoffen of preparaten of daarbij aangewezen categorieën van
      produkten waarin die stoffen of preparaten voorkomen, af te geven aan daarbij aangewezen personen of instellingen;

      m. een verplichting voor degenen die bij de maatregel aangewezen stoffen of preparaten of daarbij aangewezen
      categorieën van produkten waarin die stoffen of preparaten voorkomen, vervaardigen, in Nederland invoeren
      of aan een ander ter beschikking stellen, voor daarbij aangewezen personen of instellingen die krachtens
      de [Wet milieubeheer][ref1] bevoegd zijn tot vergunning hebben voor het nuttig toepassen of verwijderen van
      gevaarlijke afvalstoffen, dan wel voor bij de maatregel aangewezen bestuursorganen, om die stoffen, preparaten of
      produkten in te zamelen.

      3 Onze Minister kan omtrent in een maatregel krachtens het eerste lid geregelde onderwerpen nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
