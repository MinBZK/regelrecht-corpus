  - number: '39'
    text: |-
      1 De[ artikelen 34 tot en met 38][ref1] zijn van overeenkomstige toepassing op de verpakking en aanduiding en
      op het aanbevelen en aanprijzen van stoffen waaraan met het oog op de stabiliteit hulpstoffen zijn toegevoegd of
      waarbij onzuiverheden voorkomen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de verpakking
      en de aanduiding van andere preparaten en met betrekking tot het aanbevelen en aanprijzen daarvan. Daarbij kan
      worden bepaald dat die regelen alleen gelden in daarbij aangewezen gevallen of voor daarbij aangewezen preparaten,
      en kunnen de[ artikelen 34 tot en met 38][ref2] geheel of gedeeltelijk van overeenkomstige toepassing worden
      verklaard.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de aanduiding
      van preparaten waarin daarbij aangewezen stoffen voorkomen, alsmede met betrekking tot de aanduiding van produkten
      waarin daarbij aangewezen stoffen of preparaten voorkomen. Daarbij kan worden bepaald dat die regelen alleen in
      daarbij aangewezen gevallen gelden.

      4 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in daarbij aangewezen gevallen
      de[ artikelen 34 tot en met 38][ref3] geheel of voor een daarbij te bepalen gedeelte niet van toepassing zijn:

      a. ter uitvoering van een krachtens het Verdrag betreffende de Europese Unie tot stand gekomen bindende regeling;

      b. indien onverkorte toepassing van die artikelen in het belang van de bescherming van mens en milieu niet
      noodzakelijk is.

      5 Bij of krachtens een algemene maatregel van bestuur als bedoeld in het vierde lid kunnen regelen worden gesteld
      met betrekking tot de in de[ artikelen 34 tot en met 38][ref4] geregelde onderwerpen.


