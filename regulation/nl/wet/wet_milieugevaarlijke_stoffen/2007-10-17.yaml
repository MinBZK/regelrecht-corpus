  - number: '7'
    text: |-
      1 Indien Onze Minister van oordeel is dat bij de kennisgeving niet aan het bij of krachtens [artikel 4][ref1] of
      [5][ref2] bepaalde is voldaan, maakt hij zijn daartoe strekkende beschikking binnen vijf weken na de datum van
      ontvangst van de kennisgeving bekend.

      2 Een kennisgeving met betrekking waartoe het vorige lid toepassing heeft gevonden, wordt geacht niet te zijn
      gedaan.

      3 Onze Minister doet een mededeling als bedoeld in het eerste lid, ingeval deze betrekking heeft op een
      kennisgeving ter zake van het vervaardigen van een stof, in overeenstemming met Onze Minister van Sociale Zaken
      en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
