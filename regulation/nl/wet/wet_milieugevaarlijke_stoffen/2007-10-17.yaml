  - number: '9'
    text: |-
      1 Onze Minister maakt een kennisgeving ter zake van het in Nederland invoeren of het aan een ander ter beschikking
      stellen zo spoedig mogelijk bekend, doch in elk geval binnen het tijdvak van 60 dagen na de dag van ontvangst, dan
      wel, indien een beschikking krachtens [artikel 7][ref1] in beroep is vernietigd, uiterlijk twee weken na de datum
      waarop het besluit, houdende de vernietiging, is genomen.

      2 In ieder geval wordt de kennisgeving gelijktijdig bekendgemaakt door middel van:

      a. mededeling in de *Nederlandse Staatscourant*;

      b. terinzagelegging overeenkomstig [artikel 11][ref2].

      3 Indien degene die een kennisgeving als bedoeld in het eerste lid doet, bij die kennisgeving verklaart dat hij
      de stof waarop de kennisgeving betrekking heeft, niet eerder zal invoeren of aan een ander ter beschikking stellen
      dan met ingang van een daarbij aangegeven tijdstip dat gelegen is na het in het eerste lid genoemde tijdvak van 60
      dagen, wordt de kennisgeving door Onze Minister op verzoek van degene die de kennisgeving doet, in afwijking van
      het eerste lid bekendgemaakt binnen het tijdvak van 60 dagen voor het bij de kennisgeving aangegeven tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel11
