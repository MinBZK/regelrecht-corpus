  - number: '22'
    text: |-
      1 Onze Minister stelt na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport een lijst vast van stoffen
      en preparaten die wegens hun mogelijke effecten op mens of milieu in het bijzonder aandacht behoeven.

      2 Met betrekking tot de stoffen en preparaten die vermeld zijn op de in het eerste lid bedoelde lijst, wordt door
      of vanwege Onze Minister regelmatig onderzoek uitgevoerd naar het voorkomen, de toepassing en de verspreiding van
      die stoffen en preparaten in Nederland.

      3 Ieder die beroepshalve een stof of een preparaat, vermeld op de in het eerste lid bedoelde lijst, vervaardigt, of
      die beroepshalve zodanige stof, al dan niet verwerkt in een preparaat, of preparaat in Nederland invoert, toepast
      of aan een ander ter beschikking stelt, is verplicht medewerking te verlenen aan het in het tweede lid bedoelde
      onderzoek.

      4 Onze Minister stelt de in het eerste lid bedoelde lijst niet vast dan nadat van het ontwerp van die lijst
      mededeling is gedaan in de *Staatscourant* en aan een ieder de gelegenheid is geboden binnen twaalf weken na die
      mededeling zijn zienswijze kenbaar te maken aan Onze Minister.

      5 De in het eerste lid bedoelde lijst wordt ten minste een maal per jaar herzien. Met betrekking tot de herziening
      is het vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel22
  - number: '23'
    text: |-
      1 Indien Onze Minister een ernstig vermoeden heeft dat door handelingen met een stof of een preparaat gevaren
      kunnen ontstaan voor mens of milieu, kan hij in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid en na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport aan degene die beroepshalve
      die stof of dat preparaat vervaardigt, in Nederland invoert of toepast, opdragen door hem omschreven onderzoek
      te verrichten en daarover schriftelijk aan hem verslag uit te brengen. Gelijke bevoegdheden komen toe aan Onze
      Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister, indien hij een ernstig
      vermoeden heeft dat door zodanige handelingen gevaren kunnen ontstaan in de arbeidssituatie. Onze Minister,
      onderscheidenlijk Onze Minister van Sociale Zaken en Werkgelegenheid kan daarbij een termijn stellen waarbinnen
      het verslag moet worden uitgebracht. [ Artikel 14, zesde lid, eerste en laatste volzin][ref1], is tevens van
      overeenkomstige toepassing.

      2 Indien een stof of een preparaat, met betrekking waartoe een ernstig vermoeden bestaat dat door handelingen
      daarmee gevaren kunnen ontstaan voor mens of milieu, door meer dan een persoon beroepshalve wordt vervaardigd, in
      Nederland ingevoerd of toegepast, kan bij algemene maatregel van bestuur worden bepaald dat met betrekking tot die
      stof of dat preparaat onderzoek moet worden verricht.

      3 Bij een maatregel op grond van het tweede lid wordt bepaald welk onderzoek moet worden verricht en worden eisen
      gesteld waaraan de instelling of instellingen die het onderzoek verricht, onderscheidenlijk verrichten, moeten
      voldoen. Indien degenen die de stof of het preparaat beroepshalve vervaardigen, in Nederland invoeren of toepassen,
      niet binnen twaalf weken na het in werking treden van de maatregel het onderzoek hebben opgedragen aan een of
      meer instellingen, geschiedt zulks door Onze Minister, onderscheidenlijk door Onze Minister van Sociale Zaken en
      Werkgelegenheid.

      4 Ieder die beroepshalve een bij een maatregel op grond van het tweede lid aangewezen stof of preparaat
      vervaardigt, of die beroepshalve zodanige stof, al dan niet verwerkt in een preparaat, of preparaat in Nederland
      invoert, aan een ander ter beschikking stelt, opslaat, vervoert, toepast of zich daarvan ontdoet, is verplicht aan
      de aangewezen instellingen de door deze gevraagde gegevens met betrekking tot de stof te verschaffen, voor zover
      hij over deze gegevens beschikt of redelijkerwijs kan beschikken.

      5 Van een onderzoek als bedoeld in het tweede lid wordt schriftelijk verslag uitgebracht aan Onze Minister en Onze
      Minister van Sociale Zaken en Werkgelegenheid. Onze Minister zendt een exemplaar van het verslag aan Onze Minister
      van Volksgezondheid, Welzijn en Sport. [Artikel 6, vierde lid][ref2], is van overeenkomstige toepassing.

      6 Bij een besluit als bedoeld in de tweede volzin van het derde lid bepaalt Onze Minister, onderscheidenlijk Onze
      Minister van Sociale Zaken en Werkgelegenheid tevens in hoeverre de kosten ten laste van de in het tweede lid
      bedoelde personen zullen worden gebracht, alsmede de wijze van berekening van de kosten.

      7 Met betrekking tot het bij of krachtens het tweede, derde, vijfde en zesde lid van dit artikel bepaalde kan Onze
      Minister, onderscheidenlijk Onze Minister van Sociale Zaken en Werkgelegenheid nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
