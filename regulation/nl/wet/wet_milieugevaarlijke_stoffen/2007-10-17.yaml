  - number: 56.3.a
    text: |-
      de naam waaronder een stof of preparaat aan een ander ter beschikking wordt gesteld, alsmede de naam van degene die
      de stof vervaardigt en van degene die de kennisgeving heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.b
    text: de fysisch-chemische eigenschappen van de stof of het preparaat;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.c
    text: de mogelijkheden om de stof of het preparaat onschadelijk te maken;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.d
    text: |-
      de aanbevolen aanwijzingen voor het gebruik van de stof of het preparaat, de aanbevolen maatregelen om verspreiding
      van de stof of het preparaat te voorkomen en de aanbevolen noodmaatregelen bij een ongeval met de stof of het
      preparaat;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.e
    text: |-
      de naam van degene die het onderzoek, bedoeld in die artikelen, heeft verricht, behoudens indien het betreft een
      onderzoek naar de fysisch-chemische eigenschappen van de stof of het preparaat;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.f
    text: een samenvatting van de resultaten van de toxicologische en ecotoxicologische proeven;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.g
    text: |-
      indien noodzakelijk voor de indeling en het kenmerken van de stof overeenkomstig de richtlijn: de zuiverheidsgraad
      van de stof en de identiteit van de onzuiverheden of toevoegingen die behoren tot een of meer van de in
      [artikel 34, tweede lid][ref1], bedoelde categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
    references:
