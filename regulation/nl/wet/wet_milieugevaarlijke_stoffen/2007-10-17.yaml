  - number: '28'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], met betrekking tot het vervaardigen,
      aan een ander ter beschikking stellen of in Nederland invoeren van stoffen waarop [hoofdstuk 2][ref2] niet van
      toepassing is, of van preparaten, kan bij de in dat artikel bedoelde algemene maatregel van bestuur het bij of
      krachtens dat hoofdstuk bepaalde geheel of gedeeltelijk van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel28
