  - number: '8'
    text: |-
      1 Het is verboden een stof te vervaardigen of, al dan niet verwerkt in een preparaat, in Nederland in te voeren:

      a. zonder dat een kennisgeving als bedoeld in [artikel 3, eerste of derde lid][ref1], is gedaan;

      b. indien aan Onze Minister kennisgeving is gedaan ter zake van het in Nederland of in de Europese Economische
      Ruimte invoeren als bedoeld in [artikel 3, eerste lid][ref2], onderscheidenlijk [artikel 3, derde lid][ref3]:
      binnen 60 dagen nadat Onze Minister die kennisgeving heeft ontvangen blijkens het bewijs van ontvangst, bedoeld in
      [artikel 6, eerste lid][ref4], tenzij Onze Minister anders bepaalt;

      c. indien door een vertegenwoordiger kennisgeving is gedaan ter zake van het in de Europese Economische Ruimte
      invoeren als bedoeld in [artikel 3, derde lid][ref5], aan het daartoe aangewezen overheidsorgaan in een andere
      Lid-Staat van de Europese Unie of een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte: binnen 60 dagen nadat dat orgaan die kennisgeving heeft ontvangen, tenzij dat orgaan anders
      bepaalt;

      d. indien een kennisgeving ter zake van het vervaardigen als bedoeld in [artikel 3, eerste lid][ref6], is
      gedaan: binnen 45 dagen nadat Onze Minister die kennisgeving blijkens het bewijs van ontvangst, bedoeld in
      [artikel 6, eerste lid][ref7], heeft ontvangen.

      2 Het is degene die een stof vervaardigt, verboden die stof, al dan niet verwerkt in een preparaat, aan een ander
      ter beschikking te stellen:

      a. zonder dat een kennisgeving als bedoeld in [artikel 3, tweede lid][ref8], is gedaan;

      b. indien een kennisgeving als bedoeld in [artikel 3, tweede lid][ref9], is gedaan: binnen 60 dagen
      nadat Onze Minister die kennisgeving heeft ontvangen blijkens het bewijs van ontvangst, bedoeld in
      [artikel 6, eerste lid][ref10], tenzij Onze Minister anders bepaalt.


