  - number: '20'
    text: |-
      1 Indien degene die beroepshalve stoffen of preparaten vervaardigt, in Nederland invoert, toepast of aan een ander
      ter beschikking stelt, met betrekking tot een stof of een preparaat nieuwe kennis verkrijgt, waaruit ernstige
      gevaren voor mens of milieu blijken of redelijkerwijs kunnen worden afgeleid, is hij verplicht, onverminderd het
      bepaalde bij of krachtens [artikel 13][ref1], zodanige kennis zo spoedig mogelijk schriftelijk aan Onze Minister
      te melden.

      2 Indien een persoon als bedoeld in het eerste lid kennis verkrijgt van een belangrijke nieuwe toepassing van
      een stof of een preparaat, waaruit ernstige gevaren voor mens of milieu blijken of redelijkerwijs kunnen worden
      afgeleid, is hij verplicht, onverminderd het bepaalde bij of krachtens [artikel 13][ref2], zodanige kennis zo
      spoedig mogelijk schriftelijk aan Onze Minister te melden.

      3 Onze Minister zendt zo spoedig mogelijk een exemplaar van door hem ontvangen stukken als bedoeld in het eerste en
      tweede lid aan Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport.

      4 Met betrekking tot het in het eerste en tweede lid bepaalde kunnen bij algemene maatregelen van bestuur nadere
      regelen worden gesteld. [Artikel 6, vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel13
