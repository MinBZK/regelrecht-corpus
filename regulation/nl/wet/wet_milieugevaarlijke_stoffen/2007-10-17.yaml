  - number: '27'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], wijst Onze Minister de instantie aan,
      die de in die bepaling bedoelde keuring verricht. Bij de maatregel worden regelen gesteld ten aanzien van de wijze
      waarop zodanige keuring plaatsheeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
