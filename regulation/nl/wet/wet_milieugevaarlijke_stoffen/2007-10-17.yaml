  - number: '34'
    text: |-
      1 Degene die een stof aan een ander ter beschikking stelt of in Nederland invoert, die behoort tot een of meer van
      de in het tweede lid aangewezen categorieën, is verplicht ervoor zorg te dragen dat die stof bij de aflevering en
      bij het ter aflevering voorhanden hebben is verpakt en op de verpakking is aangeduid overeenkomstig het bepaalde
      bij of krachtens de[ artikelen 35][ref1] en [36][ref2].

      2 De in het eerste lid bedoelde categorieën zijn:

      a. de categorie ontplofbaar;

      b. de categorie oxyderend;

      c. de categorie zeer licht ontvlambaar;

      d. de categorie licht ontvlambaar;

      e. de categorie ontvlambaar;

      f. de categorie zeer vergiftig;

      g. de categorie vergiftig;

      h. de categorie schadelijk;

      i. de categorie bijtend;

      j. de categorie irriterend;

      k. de categorie sensibiliserend;

      l. de categorie kankerverwekkend;

      m. de categorie mutageen;

      n. de categorie voor de voortplanting vergiftig;

      o. de categorie milieugevaarlijk.

      3 Bij of krachtens algemene maatregel van bestuur worden de criteria en methoden aangewezen volgens welke moet
      worden bepaald of een stof behoort tot een categorie als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel36
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
