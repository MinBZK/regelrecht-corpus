  - number: '67.3'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld met betrekking tot hetgeen overigens in verband met het
      gaan gelden van deze wet regeling behoeft.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel67
  - number: '71.1'
    text: |-
      Deze wet is niet van toepassing op stoffen en preparaten, voor zover daaromtrent regelen zijn gesteld bij de
      [Geneesmiddelenwet][ref1] (*Stb.* 1958, 408) of de [Wet gewasbeschermingsmiddelen en biociden][ref2], dan wel zijn
      of worden gesteld krachtens die wetten. Indien het bij Koninklijke Boodschap van 17 januari 1983 bij de Tweede
      Kamer der Staten-Generaal ingediende voorstel van een [Diergeneesmiddelenwet][ref3] kracht van wet verkrijgt, is
      de onderhavige wet evenmin van toepassing op stoffen en preparaten, voor zover daaromtrent regelen zijn gesteld bij
      die wet, dan wel zijn of worden gesteld krachtens die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0021505
      [ref2]: https://wetten.overheid.nl/BWBR0021670
      [ref3]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0021505
      - id: ref2
        bwb_id: BWBR0021670
      - id: ref3
        bwb_id: BWBR0003818
  - number: '71.2'
    text: |-
      Deze wet laat het met betrekking tot stoffen of preparaten bij of krachtens de [Kernenergiewet][ref1] (Stb. 1963,
      82) bepaalde onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: '71.3'
    text: |-
      Deze wet is niet van toepassing op het vervoeren, het ten vervoer aanbieden en het ten vervoer aannemen,
      het laden en het lossen en het nederleggen tijdens het vervoer van stoffen, preparaten of micro-
      organismen, alsmede op het laten staan en het laten liggen van een vervoermiddel waarin of waarop zich
      zodanige stoffen, preparaten of micro-organismen of resten daarvan bevinden, voor zover daaromtrent
      regelen zijn gesteld bij of krachtens de [Wet luchtvaart][ref1], dan wel op de handelingen genoemd in
      [artikel 2, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref2] ten aanzien van stoffen, preparaten of micro-
      organismen, voor zover daaromtrent regelen zijn gesteld bij of krachtens [die wet][ref3]. Met betrekking tot de
      verpakking van genetische gemodificeerde micro-organismen blijven de bij of krachtens deze wet gestelde regels van
      kracht indien die organismen zich bij de handelingen, bedoeld in de eerste volzin, niet bevinden in een verpakking
      die voldoet aan de regels die terzake zijn gesteld bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref4] of
      de [Wet luchtvaart][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005555
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007606
      [ref4]: https://wetten.overheid.nl/BWBR0007606
      [ref5]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005555
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007606
      - id: ref4
        bwb_id: BWBR0007606
      - id: ref5
        bwb_id: BWBR0005555
  - number: '71.4'
    text: |-
      Krachtens deze wet worden geen regelen gesteld met betrekking tot het zich ontdoen van stoffen en preparaten
      door het brengen daarvan in oppervlaktewateren, voor zover in het stellen van zodanige regelen is voorzien door
      het vaststellen van grenswaarden krachtens [artikel 1a van de Wet verontreiniging oppervlaktewateren][ref1]
      (*Stb.* 1969, 536) of voor zodanig zich ontdoen een verbod geldt krachtens
      [artikel 3 van de Wet verontreiniging zeewater][ref2] ( Stb. 1975, 352).


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0002975
        artikel: '3'
  - number: '72'
    text: 'Deze wet kan worden aangehaald als: "Wet milieugevaarlijke stoffen".'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel72
  - number: '73'
    text: |-
      De artikelen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel73
