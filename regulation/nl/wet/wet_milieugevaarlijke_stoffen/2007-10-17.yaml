        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '38'
    text: |-
      1 Het aanbevelen of aanprijzen van een stof, behorende tot een of meer van de in [artikel 34, tweede lid][ref1],
      bedoelde categorieën, zonder vermelding van de categorie of categorieën waartoe die stof behoort, is verboden.

      2 Het aanduiden van een stof op een wijze die misleidend is ten aanzien van de effecten van die stof op mens of
      milieu of ten aanzien van het krachtens [artikel 24][ref2] of [31][ref3] bepaalde, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel31
