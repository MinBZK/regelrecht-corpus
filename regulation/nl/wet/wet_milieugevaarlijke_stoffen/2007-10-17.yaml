  - number: '42'
    text: |-
      Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
  - number: '55'
    text: |-
      1 Onze Minister zendt - voor zover het betreft het ambtsterrein van een of meer Onzer andere ministers, in
      overeenstemming met die ministers - telkens om de vijf jaar aan de Staten-Generaal een verslag over de wijze waarop
      deze wet is toegepast.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de toepassing
      van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel55
  - number: '56'
    text: |-
      1 Indien in een stuk dat ingevolge het bij of krachtens deze wet bepaalde aan Onze Minister, dan wel aan een
      andere persoon of instelling wordt overgelegd, gegevens voorkomen of uit zodanig stuk gegevens kunnen worden
      afgeleid, waarvan de geheimhouding met het oog op de bescherming van bedrijfsgeheimen gerechtvaardigd is, besluit
      Onze Minister op een daartoe strekkend verzoek van degene die het stuk overlegt, dat die gegevens geheim gehouden
      worden.

      2 Het eerste lid is niet van toepassing op een kennisgeving als bedoeld in [artikel 3][ref1] van het vervaardigen
      van een stof en op de stukken die in verband met een zodanige kennisgeving ingevolge [artikel 4][ref2] of
      [13][ref3] worden overgelegd.

      3 Indien het verzoek een stuk betreft, overgelegd krachtens [artikel 4][ref4], [13][ref5], [14][ref6], [15][ref7]
      of [16][ref8], kan Onze Minister niet besluiten tot geheimhouding van:

      a. de naam waaronder een stof of preparaat aan een ander ter beschikking wordt gesteld, alsmede de naam van degene
      die de stof vervaardigt en van degene die de kennisgeving heeft gedaan;

      b. de fysisch-chemische eigenschappen van de stof of het preparaat;

      c. de mogelijkheden om de stof of het preparaat onschadelijk te maken;

      d. de aanbevolen aanwijzingen voor het gebruik van de stof of het preparaat, de aanbevolen maatregelen om
      verspreiding van de stof of het preparaat te voorkomen en de aanbevolen noodmaatregelen bij een ongeval met de stof
      of het preparaat;

      e. de naam van degene die het onderzoek, bedoeld in die artikelen, heeft verricht, behoudens indien het betreft een
      onderzoek naar de fysisch-chemische eigenschappen van de stof of het preparaat;

      f. een samenvatting van de resultaten van de toxicologische en ecotoxicologische proeven;

      g. indien noodzakelijk voor de indeling en het kenmerken van de stof overeenkomstig de richtlijn: de
      zuiverheidsgraad van de stof en de identiteit van de onzuiverheden of toevoegingen die behoren tot een of meer van
      de in [artikel 34, tweede lid][ref9], bedoelde categorieën;

      h. met betrekking tot een stof of een preparaat, behorende tot een van de in [artikel 34, tweede lid][ref10],
      genoemde categorieën:

      1°. de gegevens vermeld in het inlichtingenblad bedoeld in artikel 27 van de richtlijn;

      2°. de analysemethoden waarmee de stof kan worden gevolgd, nadat deze in het milieu is gebracht en waardoor de
      rechtstreekse blootstelling van de mens aan deze stof kan worden bepaald.

      i. indien een stof in het in [artikel 18, eerste lid][ref11], bedoelde register wordt opgenomen: de in het tweede
      lid van dat artikel bedoelde gegevens.

      4 Een verzoek tot geheimhouding van gegevens met betrekking tot de effecten die een stof of preparaat op mens en
      milieu kan hebben, wordt geweigerd, indien de verzoeker daarbij niet tevens een tweede tekst overlegt, waarin de
      geheim te houden gegevens niet voorkomen en waaruit ze niet kunnen worden afgeleid, doch die voldoende inzicht
      biedt in de effecten van de stof of het preparaat op mens en milieu. De overgelegde tweede tekst behoeft de
      goedkeuring van Onze Minister.

      5 Op een verzoek om geheimhouding beslist Onze Minister binnen vier weken na ontvangst.

      6 Indien een verzoek om geheimhouding geheel of gedeeltelijk wordt geweigerd, laat Onze Minister de bekendmaking
      van de gegevens waarvan de geheimhouding wordt geweigerd, achterwege, totdat de beslissing op het verzoek
      onherroepelijk is geworden.

      7 Een besluit krachtens het eerste lid vervalt, voor zover de verzoeker, degene die de stof vervaardigt of de
      importeur gegevens die op grond van dat besluit geheim gehouden worden, zelf openbaar maakt, dan wel voor zover
      deze gegevens in het kader van de uitvoering van de richtlijn, door de Commissie van de Europese Gemeenschappen
      openbaar worden gemaakt. Indien het openbaarmaking door de verzoeker, degene die de stof vervaardigt of de
      importeur betreft, geeft deze daarvan kennis aan Onze Minister.


