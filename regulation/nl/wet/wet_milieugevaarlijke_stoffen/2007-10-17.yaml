  - number: '35'
    text: |-
      1 De verpakking en de sluiting, die een stof als bedoeld in [artikel 34, eerste lid][ref1], rechtstreeks omsluiten,
      moeten:

      a. zodanig zijn dat ongewild verlies van de inhoud niet kan plaatsvinden;

      b. vervaardigd zijn van materiaal dat niet door de stof kan worden aangetast, noch hiermede een gevaarlijke reactie
      kan aangaan of een gevaarlijke verbinding kan vormen;

      c. niet kunnen losraken en tegen normale behandeling bestand zijn.

      2 Indien de verpakking is voorzien van een sluiting die meermalen kan worden gebruikt, moeten verpakking en
      sluiting zodanig zijn dat de verpakking meermalen opnieuw kan worden afgesloten zonder dat ongewild verlies van de
      inhoud plaatsvindt.

      3 In afwijking van het eerste lid, onder *a*, mogen aan de verpakking, indien nodig, een of meer
      ontluchtingsventielen of andersoortige veiligheidvoorzieningen aangebracht zijn.

      4 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot de in de vorige leden geregelde
      onderwerpen nadere regelen worden gesteld en kunnen met betrekking tot de verpakking en de sluiting verdere regelen
      worden gesteld. Daarbij kan worden bepaald dat die regelen slechts gelden voor daarbij aangewezen stoffen of in
      daarbij aangewezen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
    references:
      - id: ref1
