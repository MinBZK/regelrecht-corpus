        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '36'
    text: |-
      1 Op een verpakking als bedoeld in [artikel 35, eerste lid][ref1], moeten duidelijk en onuitwisbaar vermeld zijn:

      a. de chemische naam van de stof;

      b. de naam en het adres van de in de Europese Economische Ruimte gevestigde persoon die de stof vervaardigt, in de
      Europese Economische Ruimte aan een ander ter beschikking stelt of invoert;

      c. de benaming van het gevaar of de gevaren van de stof, als bedoeld in [artikel 34, tweede lid][ref2], met het
      bijbehorende symbool, onderscheidenlijk de bijbehorende symbolen, voor zover daarin krachtens het derde lid is
      voorzien;

      d. een verwijzing naar de bijzondere, aan het gebruik van de stof verbonden gevaren, voor zover daarin krachtens
      het derde lid is voorzien;

      e. veiligheidsaanbevelingen ter vermijding van de belangrijkste, aan het gebruik van de stof verbonden gevaren,
      voor zover daarin krachtens het derde lid is voorzien.

      2 De bij het eerste lid voorgeschreven aanduidingen moeten gesteld zijn in de Nederlandse taal. Bij of krachtens
      algemene maatregel van bestuur kunnen gevallen worden aangewezen, waarin die aanduidingen mogen worden gesteld in
      een andere, bij of krachtens de maatregel aangewezen taal.

      3 Onze Minister en Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport
      stellen tezamen nadere regelen met betrekking tot de in het eerste lid bedoelde aanduidingen. Zij kunnen daarbij
      tevens, zo nodig onder het stellen van nadere regelen, bepalen dat door hen aan te geven verdere aanduidingen op
      een verpakking moeten zijn vermeld, of dat door hen aan te geven aanduidingen slechts in door hen aan te geven
      gevallen behoeven te zijn vermeld.

      4 Aan het bepaalde bij of krachtens het eerste lid, onder *a*, *c*, *d* en *e*, en het derde lid wordt geacht
      te zijn voldaan, indien een stof, opgenomen op een door Onze Minister en Onze Ministers van Sociale Zaken en
      Werkgelegenheid en van Volksgezondheid, Welzijn en Sport te zamen vastgestelde lijst van stoffen als bedoeld in
      [artikel 34][ref3], is aangeduid op de wijze die in die lijst met betrekking tot die stof is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel34
