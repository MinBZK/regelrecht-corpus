  - number: 15b
    text: |-
      1 Indien voor een buiten de Europese Economische Ruimte vervaardigde stof in de Europese Economische Ruimte
      meer dan één kennisgeving is gedaan en deze kennisgevingen betrekking hebben op een stof, die is vervaardigd
      door dezelfde persoon, hebben de gewichtsgrenzen, genoemd in de[ artikelen 14][ref1] en [15][ref2], betrekking
      op de totale hoeveelheid van de stof, zoals die door degene die de stof vervaardigt, door middel van de in de
      kennisgevingen genoemde importeurs, in de Europese Economische Ruimte wordt ingevoerd.

      2 Indien het eerste lid toepassing vindt, geldt de verplichting om aanvullende gegevens over te leggen als bedoeld
      in de[ artikelen 13, eerste lid, aanhef en onder ][ref3], [14][ref4] en [15][ref5], in afwijking van die artikelen,
      voor de kennisgevers gezamenlijk.

      3 Bij de in [artikel 14, vierde lid][ref6], bedoelde maatregel wordt bepaald wie de gegevens, bedoeld in het tweede
      lid, overlegt.


