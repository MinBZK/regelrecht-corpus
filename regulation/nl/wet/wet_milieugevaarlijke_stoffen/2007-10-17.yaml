  - number: '5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het in
      [artikel 4, vijfde lid][ref1], bedoelde onderzoek. Tot deze regelen kunnen behoren regelen betreffende:

      a. de onderzoekmethoden en de omstandigheden waaronder deze worden toegepast;

      b. het vastleggen en bewaren van de resultaten van het onderzoek;

      c. de verslaglegging met betrekking tot het onderzoek.

      2 Bij of krachtens algemene maatregel van bestuur worden voorts eisen gesteld waaraan degenen die onderzoek als
      bedoeld in [artikel 4, vijfde lid][ref2], verrichten, moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
