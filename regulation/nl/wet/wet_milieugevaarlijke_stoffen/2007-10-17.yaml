  - number: 59.1.a
    text: bij algemene maatregel van bestuur vrijstelling verlenen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel59
  - number: 59.1.b
    text: op een daartoe strekkend verzoek ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel59
  - number: '59.2'
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden die naar Ons oordeel in het belang van de
      bescherming van mens en milieu nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel59
  - number: '59.3'
    text: |-
      De voordracht voor een besluit krachtens het eerste lid wordt Ons niet gedaan dan op verzoek van Onze Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel59
  - number: '60.1'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 4, eerste of derde lid][ref1], krachtens
      of met overeenkomstige toepassing van [artikel 5][ref2], krachtens [artikel 13, eerste of derde lid][ref3],
      krachtens of met overeenkomstige toepassing van [artikel 14, vierde lid][ref4], of krachtens
      [artikel 19, derde, vierde of vijfde lid][ref5], of [67, derde lid][ref6], wordt Ons gedaan door Onze Minister en
      Onze Minister van Sociale Zaken en Werkgelegenheid te zamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel5
