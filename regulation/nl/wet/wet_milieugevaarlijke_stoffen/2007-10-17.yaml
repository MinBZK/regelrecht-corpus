  - number: '29'
    text: |-
      1 Met toepassing van [artikel 24, tweede lid, onder ][ref1], wordt in elk geval een melding vereist van het
      uitvoeren van stoffen en preparaten waarvan het toepassen ernstig gevaar oplevert voor mens of milieu en die
      voorkomen op een bij de maatregel vast te stellen lijst.

      2 Een melding als bedoeld in het eerste lid geschiedt bij Onze Minister, alsmede bij de bevoegde overheidsinstantie
      van de staat waarheen de uitvoer zal plaatsvinden, voordat de uitvoer plaatsvindt. Bij de maatregel wordt bepaald
      welke gegevens door degene die een stof of een preparaat als bedoeld in het eerste lid uitvoert, met betrekking tot
      die stof of dat preparaat ter beschikking moeten zijn gesteld van die bevoegde overheidsinstantie.

      3 Degene die een stof of een preparaat als bedoeld in het eerste lid uitvoert, dient bij de melding voorts aan
      te tonen dat de bevoegde overheidsinstantie, bedoeld in het tweede lid, na ontvangst van de in dat lid bedoelde
      gegevens met de invoer van de stof of het preparaat heeft ingestemd. Indien aan het bepaalde in de vorige volzin
      niet is voldaan, kan Onze Minister degene die de melding heeft gedaan, verbieden de stof uit te voeren. Bij de
      maatregel worden terzake nadere regelen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel29
    references:
