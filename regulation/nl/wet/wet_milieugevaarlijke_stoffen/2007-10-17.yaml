  - number: 63a.1
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel63a
  - number: 63a.2
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63a.3
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel63a
  - number: '64.1'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 18.3 tot en met 18.16 van de Wet milieubeheer][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
  - number: '64.2'
    text: |-
      Het in [artikel 18.2 van de Wet milieubeheer][ref1] bedoelde bestuursorgaan heeft tot taak zorg te dragen voor
      de bestuursrechtelijke handhaving van de op grond van deze wet voor degene die de betrokken inrichting drijft,
      geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
  - number: '64.3'
    text: |-
      Onverminderd het tweede lid heeft Onze betrokken Minister tot taak zorg te dragen voor de bestuursrechtelijke
      handhaving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel64
  - number: '67.1'
    text: |-
      Met betrekking tot stoffen die op het tijdstip waarop de[ artikelen 3 tot en met 18][ref1] in
      werking treden, in Nederland worden vervaardigd, doch die niet behoren tot de stoffen, bedoeld in
      [artikel 19, eerste lid, onder ][ref2], dan wel die niet voorkomen op de in [artikel 19, vijfde lid][ref3],
      bedoelde lijst, zijn de[ artikelen 3, eerste lid][ref4], en [4 tot en met 18][ref5], voor zover deze artikelen
      betrekking hebben op het vervaardigen van die stoffen, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel67
