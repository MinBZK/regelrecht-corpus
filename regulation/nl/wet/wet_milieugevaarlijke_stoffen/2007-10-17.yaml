      1 Wij kunnen in het belang van de landsverdediging van de bij of krachtens [artikel 3][ref1], [4][ref2],
      [5][ref3], [8][ref4], [13][ref5], [14][ref6], [15][ref7], [17][ref8], [19][ref9], [22][ref10], [23][ref11],
