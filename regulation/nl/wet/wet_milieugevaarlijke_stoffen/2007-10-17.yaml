  - number: '64'
    text: |-
      1 Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 18.3 tot en met 18.16 van de Wet milieubeheer][ref1] van toepassing.

      2 Het in [artikel 18.2 van de Wet milieubeheer][ref2] bedoelde bestuursorgaan heeft tot taak zorg te dragen voor
      de bestuursrechtelijke handhaving van de op grond van deze wet voor degene die de betrokken inrichting drijft,
      geldende voorschriften.

      3 Onverminderd het tweede lid heeft Onze betrokken Minister tot taak zorg te dragen voor de bestuursrechtelijke
      handhaving van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18.10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18.2
