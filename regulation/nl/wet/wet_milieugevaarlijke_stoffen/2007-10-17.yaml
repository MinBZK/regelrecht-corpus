  - number: '67'
    text: |-
      1 Met betrekking tot stoffen die op het tijdstip waarop de[ artikelen 3 tot en met 18][ref1] in
      werking treden, in Nederland worden vervaardigd, doch die niet behoren tot de stoffen, bedoeld in
      [artikel 19, eerste lid, onder ][ref2], dan wel die niet voorkomen op de in [artikel 19, vijfde lid][ref3],
      bedoelde lijst, zijn de[ artikelen 3, eerste lid][ref4], en [4 tot en met 18][ref5], voor zover deze artikelen
      betrekking hebben op het vervaardigen van die stoffen, niet van toepassing.

      2 Indien met betrekking tot de in het eerste lid bedoelde stoffen een kennisgeving als bedoeld in
      [artikel 3, tweede lid][ref6], wordt gedaan, zijn op zodanige kennisgeving de[ artikelen 9 tot en met 12][ref7] van
      overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur worden regelen gesteld met betrekking tot hetgeen overigens in verband met het
      gaan gelden van deze wet regeling behoeft.


