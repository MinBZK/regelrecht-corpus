  - number: '10'
    text: |-
      In een mededeling als bedoeld in [artikel 9, tweede lid, onder ][ref1], vermeldt Onze Minister ten minste:

      a. een aanduiding van de identiteit van de stof;

      b. waar en wanneer de stukken ter inzage zullen liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel9
