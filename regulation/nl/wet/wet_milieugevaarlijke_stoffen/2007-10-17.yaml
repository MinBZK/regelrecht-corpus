preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter aanvulling van de bestaande wetgeving nieuwe
    regelen te stellen ter bescherming van mens en milieu tegen gevaarlijke stoffen en preparaten, in het bijzonder
    ter zake van de verplichting onderzoek te verrichten naar de mogelijke ongewenste effecten van stoffen op mens
    of milieu, zulks mede ter uitvoering van de Richtlijn van de Raad van de Europese Gemeenschappen van 18 september
    1979, 79/831/EEG ( Pb.E.G. 1979, L 259), alsmede ter zake van het treffen van passende maatregelen met betrekking
    tot stoffen en preparaten, indien van gevaar voor mens of milieu is gebleken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      stoffen: chemische elementen en hun verbindingen, zoals deze voorkomen in de natuur of door toedoen van de mens
      worden voortgebracht;

      preparaten: mengsels of oplossingen van stoffen;

      Europese Economische Ruimte: gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is, onder
      de in de verdragen neergelegde voorwaarden, en voorts de grondgebieden van de Republiek Finland, met inachtneming
      van het tweede lid van artikel 126 van de Overeenkomst betreffende de Europese Economische Ruimte, de Republiek
      IJsland, het Koninkrijk Noorwegen, de Republiek Oostenrijk en het Koninkrijk Zweden.

      invoeren: binnen het grondgebied van Nederland, onderscheidenlijk binnen de Europese Economische Ruimte brengen;

      richtlijn: [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van 27 juni 1967
      betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de verpakking en
      het kenmerken van gevaarlijke stoffen (*PbEG* 1967, L 196), zoals deze laatstelijk is gewijzigd bij [richtlijn nr.
      92/32/EEG](31992L0032) van de Raad van de Europese Gemeenschappen van 30 april 1992 (*PbEG* L 154);

      vertegenwoordiger: persoon, aangewezen door degene die een stof buiten de Europese Economische Ruimte vervaardigt,
      voor het kennisgeven in de Europese Economische Ruimte van het aldaar invoeren van die stof, al dan niet verwerkt
      in een preparaat.

      2 Onder stoffen worden voedings- en genotmiddelen, alsmede diervoeders niet begrepen.

      3 Bij algemene maatregel van bestuur kunnen bepalingen van deze wet of onderdelen daarvan van toepassing worden
      verklaard op micro-organismen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel1
  - number: '2'
    text: |-
      Ieder die beroepshalve een stof of een preparaat vervaardigt, aan een ander ter beschikking stelt, in Nederland
      invoert of toepast, en die weet of redelijkerwijs had kunnen vermoeden dat door zijn handelingen met die
      stof of dat preparaat gevaren kunnen optreden voor mens of milieu, is verplicht alle maatregelen te nemen die
      redelijkerwijs van hem kunnen worden gevergd, teneinde die gevaren zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel2
  - number: '3'
    text: |-
      1 Degene die voornemens is ertoe over te gaan een stof te vervaardigen of, al dan niet verwerkt in een preparaat,
      in Nederland in te voeren, is verplicht van dat voornemen schriftelijk kennis te geven aan Onze Minister.

      2 Degene die een stof vervaardigt en die voornemens is deze stof, al dan niet verwerkt in een preparaat, voor de
      eerste maal aan een ander ter beschikking te stellen, is voorts verplicht ook van dat voornemen schriftelijk kennis
      te geven aan Onze Minister.

      3 Het eerste lid geldt niet voor degene, die in een kennisgeving door een vertegenwoordiger is genoemd als
      importeur van de stof waarvoor die kennisgeving is gedaan, en die voornemens is die stof, al dan niet verwerkt in
      een preparaat, in Nederland in te voeren.

      4 Een vertegenwoordiger die in Nederland kennis geeft van het voornemen om een buiten de Europese Economische
      Ruimte vervaardigde stof, al dan niet verwerkt in een preparaat, in de Europese Economische Ruimte in te voeren,
      dient in Nederland gevestigd te zijn.

      5 Een kennisgeving als bedoeld in het vierde lid, geschiedt schriftelijk aan Onze Minister en heeft betrekking
      op de totale hoeveelheid van de stof zoals die door degene die de stof vervaardigt, door middel van de in de
      kennisgeving genoemde importeurs, in de Europese Economische Ruimte wordt ingevoerd.

      6 Voor de toepassing van het bij of krachtens dit hoofdstuk bepaalde wordt onder "vervaardigen" verstaan:
      produceren van een stof met het oogmerk deze, al dan niet verwerkt in een preparaat dan wel verwerkt of omgezet in
      een produkt, aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '4'
    text: |-
      1 Degene die een kennisgeving doet als bedoeld in [artikel 3][ref1], is verplicht bij die kennisgeving bij algemene
      maatregel van bestuur aangewezen gegevens met betrekking tot de mogelijke effecten van de stof op mens of milieu
      schriftelijk over te leggen. Deze gegevens betreffen:

      a. de identiteit, de eigenschappen en de gevaren van de stof;

      b. de hoeveelheid van de stof waarvan de vervaardiging, de invoer of het aan een ander ter beschikking stellen
      wordt beoogd;

      c. de verwachte toepassing van de stof;

      d. mogelijkheden om de stof onschadelijk te maken;

      e. aanbevolen aanwijzingen voor het gebruik van de stof, aanbevolen maatregelen om verspreiding van de stof te
      voorkomen en aanbevolen noodmaatregelen bij een ongeval met de stof.

      2 Indien de kennisgeving betrekking heeft op het vervaardigen van de stof, is hij tevens verplicht schriftelijk de
      plaats mede te delen, waar de stof wordt vervaardigd.

      3 Indien de kennisgeving betrekking heeft op het invoeren of het aan een ander ter beschikking stellen van de stof,
      is hij tevens verplicht schriftelijk over te leggen:

      a. een voorstel inzake de indeling van de stof overeenkomstig [artikel 34][ref2];

      b. een voorstel voor de wijze van aanduiding van de stof;

      c. een voorstel voor de bij vervoer en opslag te nemen maatregelen ter bescherming van mens en milieu tegen de
      mogelijke nadelige effecten van de stof.

      4 In afwijking van het eerste lid behoeft degene die een kennisgeving doet van het invoeren of het aan een ander
      ter beschikking stellen van een stof met betrekking waartoe ten minste tien jaren tevoren voor het eerst in
      de Europese Economische Ruimte kennisgeving is gedaan, niet de ingevolge het eerste lid, onder *a*, aangewezen
      gegevens met betrekking tot de eigenschappen van de stof en de ingevolge het eerste lid, onder *d*, aangewezen
      gegevens over te leggen.

      5 Degene die een kennisgeving doet als bedoeld in [artikel 3][ref3], is verplicht voor het verkrijgen van de
      in het eerste lid bedoelde gegevens onderzoek te verrichten, tenzij hij reeds op andere wijze over de vereiste
      gegevens kan beschikken. Hij is verplicht bij de overgelegde gegevens met betrekking tot de stof tevens gegevens
      te vermelden met betrekking tot de identiteit van degene die het in de eerste volzin bedoelde onderzoek heeft
      verricht.

      6 Indien met het oog op de stabiliteit van de stof daaraan hulpstoffen zijn toegevoegd, of indien bij de stof
      onzuiverheden voorkomen, dienen de krachtens het eerste en derde lid over te leggen gegevens en het krachtens het
      vijfde lid te verrichten onderzoek betrekking te hebben op de stof tezamen met die hulpstoffen of onzuiverheden,
      doch zonder de oplosmiddelen die kunnen worden afgescheiden zonder dat de stabiliteit van de stof wordt aangetast
      of de samenstelling ervan wordt gewijzigd.

      7 Onverminderd het krachtens het eerste lid bepaalde is degene die de kennisgeving doet, verplicht daarbij alle
      gegevens als bedoeld in het eerste lid, onder *a*, over te leggen, waarover hij beschikt of redelijkerwijs kan
      beschikken.

      8 Een kennisgeving als bedoeld in [artikel 3][ref4] kan slechts worden gedaan door een binnen de Europese
      Economische Ruimte gevestigde persoon.

      9 Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid nadere regelen
      stellen omtrent de krachtens het eerste tot en met derde lid en het vijfde lid over te leggen gegevens en omtrent
      de wijze waarop de kennisgevingen en de overlegging van gegevens moeten geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel3
