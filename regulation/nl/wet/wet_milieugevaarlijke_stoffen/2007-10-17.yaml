  - number: '40'
    text: |-
      1 Indien stoffen of preparaten, dan wel handelingen met stoffen of preparaten naar het oordeel van Onze Minister
      onduldbaar gevaar opleveren voor mens of milieu, kan hij - zo nodig met behulp van de sterke arm - alle maatregelen
      nemen die hij met het oog op de bescherming van mens en milieu noodzakelijk acht.

      2 Tot de in het eerste lid bedoelde maatregelen kunnen behoren:

      a. het geheel of gedeeltelijk stopzetten van het vervaardigen of in Nederland invoeren van stoffen of preparaten of
      van produkten die die stoffen of preparaten bevatten;

      b. het in beslag nemen en, zo nodig, vernietigen van stoffen of preparaten of van produkten die die stoffen of
      preparaten bevatten;

      c. het beletten dat bepaalde gebieden zonder toestemming van Onze Minister worden betreden of dat dieren, planten
      of goederen zonder zodanige toestemming daarbinnen of daarbuiten worden gebracht;

      d. het verwijderen van personen, dieren, planten of goederen uit bepaalde gebieden;

      e. het toestaan dat de bij een kennisgeving als bedoeld in [artikel 3][ref1] ingevolge
      [artikel 4, eerste, tweede of derde lid][ref2], over te leggen gegevens binnen een door hem te bepalen termijn na
      de kennisgeving worden overgelegd en dat de stof waarvan kennisgeving is gedaan, in Nederland wordt vervaardigd of
      ingevoerd voordat de in [artikel 8, eerste lid, onder ][ref3], gestelde termijn is verstreken.

      3 Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat, tenzij de vereiste spoed dit naar zijn oordeel niet gedoogt. In het laatstgenoemde geval onderwerpt Onze
      Minister de maatregel zo spoedig mogelijk aan het oordeel van de Raad van Ministers. Indien deze met de maatregel
      niet instemt, trekt Onze Minister haar terstond in.

      4 Onze Minister geeft van een maatregel krachtens het eerste lid en van de intrekking van zodanige maatregel kennis
      in de *Nederlandse Staatscourant*, alsmede op zodanige wijze dat de maatregel, onderscheidenlijk de intrekking
      daarvan, zo spoedig mogelijk ter kennis van de betrokkenen komt.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel8
