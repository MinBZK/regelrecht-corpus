        hoofdstuk: '4'
        paragraaf: '2'
  - number: 56.3.h.1°
    text: de gegevens vermeld in het inlichtingenblad bedoeld in artikel 27 van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.h.2°
    text: |-
      de analysemethoden waarmee de stof kan worden gevolgd, nadat deze in het milieu is gebracht en waardoor de
      rechtstreekse blootstelling van de mens aan deze stof kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: 56.3.i
    text: |-
      indien een stof in het in [artikel 18, eerste lid][ref1], bedoelde register wordt opgenomen: de in het tweede lid
      van dat artikel bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel18
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '56.4'
    text: |-
      Een verzoek tot geheimhouding van gegevens met betrekking tot de effecten die een stof of preparaat op mens en
      milieu kan hebben, wordt geweigerd, indien de verzoeker daarbij niet tevens een tweede tekst overlegt, waarin de
      geheim te houden gegevens niet voorkomen en waaruit ze niet kunnen worden afgeleid, doch die voldoende inzicht
      biedt in de effecten van de stof of het preparaat op mens en milieu. De overgelegde tweede tekst behoeft de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: '56.5'
    text: Op een verzoek om geheimhouding beslist Onze Minister binnen vier weken na ontvangst.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: '56.6'
    text: |-
      Indien een verzoek om geheimhouding geheel of gedeeltelijk wordt geweigerd, laat Onze Minister de bekendmaking
      van de gegevens waarvan de geheimhouding wordt geweigerd, achterwege, totdat de beslissing op het verzoek
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: '56.7'
    text: |-
      Een besluit krachtens het eerste lid vervalt, voor zover de verzoeker, degene die de stof vervaardigt of de
      importeur gegevens die op grond van dat besluit geheim gehouden worden, zelf openbaar maakt, dan wel voor zover
      deze gegevens in het kader van de uitvoering van de richtlijn, door de Commissie van de Europese Gemeenschappen
      openbaar worden gemaakt. Indien het openbaarmaking door de verzoeker, degene die de stof vervaardigt of de
      importeur betreft, geeft deze daarvan kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel56
  - number: '59.1'
    text: |-
