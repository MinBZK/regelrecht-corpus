---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_milieugevaarlijke_stoffen
regulatory_layer: WET
publication_date: '2007-05-30'
valid_from: '2007-10-17'
bwb_id: BWBR0003892
url: https://wetten.overheid.nl/BWBR0003892/2007-10-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter aanvulling van de bestaande wetgeving nieuwe
    regelen te stellen ter bescherming van mens en milieu tegen gevaarlijke stoffen en preparaten, in het bijzonder
    ter zake van de verplichting onderzoek te verrichten naar de mogelijke ongewenste effecten van stoffen op mens
    of milieu, zulks mede ter uitvoering van de Richtlijn van de Raad van de Europese Gemeenschappen van 18 september
    1979, 79/831/EEG ( Pb.E.G. 1979, L 259), alsmede ter zake van het treffen van passende maatregelen met betrekking
    tot stoffen en preparaten, indien van gevaar voor mens of milieu is gebleken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: Onze Minister: Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer; stoffen: chemische elementen en hun verbindingen, zoals
      deze voorkomen in de natuur of door toedoen van de mens worden voortgebracht; preparaten: mengsels of oplossingen
      van stoffen; Europese Economische Ruimte: gebieden waarop het Verdrag betreffende de Europese Unie van toepassing
      is, onder de in de verdragen neergelegde voorwaarden, en voorts de grondgebieden van de Republiek Finland, met
      inachtneming van het tweede lid van artikel 126 van de Overeenkomst betreffende de Europese Economische Ruimte,
      de Republiek IJsland, het Koninkrijk Noorwegen, de Republiek Oostenrijk en het Koninkrijk Zweden. invoeren:
      binnen het grondgebied van Nederland, onderscheidenlijk binnen de Europese Economische Ruimte brengen; richtlijn:
      [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van 27 juni 1967 betreffende de
      aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de verpakking en het kenmerken
      van gevaarlijke stoffen (*PbEG* 1967, L 196), zoals deze laatstelijk is gewijzigd bij [richtlijn nr. 92/32/EEG]
      (31992L0032) van de Raad van de Europese Gemeenschappen van 30 april 1992 (*PbEG* L 154); vertegenwoordiger:
      persoon, aangewezen door degene die een stof buiten de Europese Economische Ruimte vervaardigt, voor het
      kennisgeven in de Europese Economische Ruimte van het aldaar invoeren van die stof, al dan niet verwerkt in een
      preparaat.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel1
  - number: '1.2'
    text: Onder stoffen worden voedings- en genotmiddelen, alsmede diervoeders niet begrepen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen bepalingen van deze wet of onderdelen daarvan van toepassing worden
      verklaard op micro-organismen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel1
  - number: '2'
    text: |-
      Ieder die beroepshalve een stof of een preparaat vervaardigt, aan een ander ter beschikking stelt, in Nederland
      invoert of toepast, en die weet of redelijkerwijs had kunnen vermoeden dat door zijn handelingen met die
      stof of dat preparaat gevaren kunnen optreden voor mens of milieu, is verplicht alle maatregelen te nemen die
      redelijkerwijs van hem kunnen worden gevergd, teneinde die gevaren zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel2
  - number: '3.1'
    text: |-
      Degene die voornemens is ertoe over te gaan een stof te vervaardigen of, al dan niet verwerkt in een preparaat, in
      Nederland in te voeren, is verplicht van dat voornemen schriftelijk kennis te geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '3.2'
    text: |-
      Degene die een stof vervaardigt en die voornemens is deze stof, al dan niet verwerkt in een preparaat, voor de
      eerste maal aan een ander ter beschikking te stellen, is voorts verplicht ook van dat voornemen schriftelijk kennis
      te geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '3.3'
    text: |-
      Het eerste lid geldt niet voor degene, die in een kennisgeving door een vertegenwoordiger is genoemd als importeur
      van de stof waarvoor die kennisgeving is gedaan, en die voornemens is die stof, al dan niet verwerkt in een
      preparaat, in Nederland in te voeren.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '3.4'
    text: |-
      Een vertegenwoordiger die in Nederland kennis geeft van het voornemen om een buiten de Europese Economische Ruimte
      vervaardigde stof, al dan niet verwerkt in een preparaat, in de Europese Economische Ruimte in te voeren, dient in
      Nederland gevestigd te zijn.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '3.5'
    text: |-
      Een kennisgeving als bedoeld in het vierde lid, geschiedt schriftelijk aan Onze Minister en heeft betrekking op de
      totale hoeveelheid van de stof zoals die door degene die de stof vervaardigt, door middel van de in de kennisgeving
      genoemde importeurs, in de Europese Economische Ruimte wordt ingevoerd.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '3.6'
    text: |-
      Voor de toepassing van het bij of krachtens dit hoofdstuk bepaalde wordt onder "vervaardigen" verstaan: produceren
      van een stof met het oogmerk deze, al dan niet verwerkt in een preparaat dan wel verwerkt of omgezet in een
      produkt, aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel3
  - number: '4.1'
    text: |-
      Degene die een kennisgeving doet als bedoeld in [artikel 3][ref1], is verplicht bij die kennisgeving bij algemene
      maatregel van bestuur aangewezen gegevens met betrekking tot de mogelijke effecten van de stof op mens of milieu
      schriftelijk over te leggen. Deze gegevens betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4.1.a
    text: de identiteit, de eigenschappen en de gevaren van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: 4.1.b
    text: |-
      de hoeveelheid van de stof waarvan de vervaardiging, de invoer of het aan een ander ter beschikking stellen wordt
      beoogd;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: 4.1.c
    text: de verwachte toepassing van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: 4.1.d
    text: mogelijkheden om de stof onschadelijk te maken;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: 4.1.e
    text: |-
      aanbevolen aanwijzingen voor het gebruik van de stof, aanbevolen maatregelen om verspreiding van de stof te
      voorkomen en aanbevolen noodmaatregelen bij een ongeval met de stof.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '4.2'
    text: |-
      Indien de kennisgeving betrekking heeft op het vervaardigen van de stof, is hij tevens verplicht schriftelijk de
      plaats mede te delen, waar de stof wordt vervaardigd.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '4.3'
    text: |-
      Indien de kennisgeving betrekking heeft op het invoeren of het aan een ander ter beschikking stellen van de stof,
      is hij tevens verplicht schriftelijk over te leggen:
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: 4.3.a
    text: |-
      een voorstel inzake de indeling van de stof overeenkomstig [artikel 34][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.3.b
    text: een voorstel voor de wijze van aanduiding van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: 4.3.c
    text: |-
      een voorstel voor de bij vervoer en opslag te nemen maatregelen ter bescherming van mens en milieu tegen de
      mogelijke nadelige effecten van de stof.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid behoeft degene die een kennisgeving doet van het invoeren of het aan een ander ter
      beschikking stellen van een stof met betrekking waartoe ten minste tien jaren tevoren voor het eerst in de Europese
      Economische Ruimte kennisgeving is gedaan, niet de ingevolge het eerste lid, onder *a*, aangewezen gegevens met
      betrekking tot de eigenschappen van de stof en de ingevolge het eerste lid, onder *d*, aangewezen gegevens over
      te leggen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '4.5'
    text: |-
      Degene die een kennisgeving doet als bedoeld in [artikel 3][ref1], is verplicht voor het verkrijgen van de in
      het eerste lid bedoelde gegevens onderzoek te verrichten, tenzij hij reeds op andere wijze over de vereiste
      gegevens kan beschikken. Hij is verplicht bij de overgelegde gegevens met betrekking tot de stof tevens gegevens
      te vermelden met betrekking tot de identiteit van degene die het in de eerste volzin bedoelde onderzoek heeft
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '4.6'
    text: |-
      Indien met het oog op de stabiliteit van de stof daaraan hulpstoffen zijn toegevoegd, of indien bij de stof
      onzuiverheden voorkomen, dienen de krachtens het eerste en derde lid over te leggen gegevens en het krachtens het
      vijfde lid te verrichten onderzoek betrekking te hebben op de stof tezamen met die hulpstoffen of onzuiverheden,
      doch zonder de oplosmiddelen die kunnen worden afgescheiden zonder dat de stabiliteit van de stof wordt aangetast
      of de samenstelling ervan wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '4.7'
    text: |-
      Onverminderd het krachtens het eerste lid bepaalde is degene die de kennisgeving doet, verplicht daarbij alle
      gegevens als bedoeld in het eerste lid, onder *a*, over te leggen, waarover hij beschikt of redelijkerwijs kan
      beschikken.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '4.8'
    text: |-
      Een kennisgeving als bedoeld in [artikel 3][ref1] kan slechts worden gedaan door een binnen de Europese Economische
      Ruimte gevestigde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '4.9'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid nadere regelen stellen
      omtrent de krachtens het eerste tot en met derde lid en het vijfde lid over te leggen gegevens en omtrent de wijze
      waarop de kennisgevingen en de overlegging van gegevens moeten geschieden.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel4
  - number: '5.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent het in
      [artikel 4, vijfde lid][ref1], bedoelde onderzoek. Tot deze regelen kunnen behoren regelen betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.1.a
    text: de onderzoekmethoden en de omstandigheden waaronder deze worden toegepast;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel5
  - number: 5.1.b
    text: het vastleggen en bewaren van de resultaten van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel5
  - number: 5.1.c
    text: de verslaglegging met betrekking tot het onderzoek.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel5
  - number: '5.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorts eisen gesteld waaraan degenen die onderzoek als
      bedoeld in [artikel 4, vijfde lid][ref1], verrichten, moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Onze Minister tekent de datum van ontvangst van een kennisgeving als bedoeld in [artikel 3][ref1] aan op het
      geschrift waarbij de kennisgeving is gedaan, en zendt degene die de kennisgeving heeft gedaan, uiterlijk een week
      na de ontvangst van de kennisgeving een bewijs van ontvangst, waarin die datum is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Hij zendt zo spoedig mogelijk een exemplaar van de kennisgeving en de daarbij overgelegde stukken als bedoeld in
      [artikel 4][ref1] aan Onze Minister van Sociale Zaken en Werkgelegenheid en, voor zover deze stukken van belang
      zijn in verband met het vervoer van de stof, aan Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.3'
    text: |-
      Indien de kennisgeving betrekking heeft op het in Nederland invoeren of het aan een ander ter beschikking stellen
      van een stof, zendt Onze Minister voorts een exemplaar van de kennisgeving aan Onze Minister van Volksgezondheid,
      Welzijn en Sport en aan de Commissie van de Europese Gemeenschappen. Hij voegt daarbij een samenvatting van alle
      met betrekking tot die stof door degene die de kennisgeving heeft gedaan, aan hem overgelegde stukken als bedoeld
      in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere bestuursorganen of instellingen worden aangewezen, waaraan een
      exemplaar van de in het tweede lid bedoelde stukken of van bij de maatregel aan te wijzen onderdelen daarvan wordt
      toegezonden of kan worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel6
  - number: '7.1'
    text: |-
      Indien Onze Minister van oordeel is dat bij de kennisgeving niet aan het bij of krachtens [artikel 4][ref1] of
      [5][ref2] bepaalde is voldaan, maakt hij zijn daartoe strekkende beschikking binnen vijf weken na de datum van
      ontvangst van de kennisgeving bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel5
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.2'
    text: Een kennisgeving met betrekking waartoe het vorige lid toepassing heeft gevonden, wordt geacht niet te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister doet een mededeling als bedoeld in het eerste lid, ingeval deze betrekking heeft op een
      kennisgeving ter zake van het vervaardigen van een stof, in overeenstemming met Onze Minister van Sociale Zaken
      en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel7
  - number: '8.1'
    text: 'Het is verboden een stof te vervaardigen of, al dan niet verwerkt in een preparaat, in Nederland in te voeren:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
  - number: 8.1.a
    text: |-
      zonder dat een kennisgeving als bedoeld in [artikel 3, eerste of derde lid][ref1], is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.b
    text: |-
      indien aan Onze Minister kennisgeving is gedaan ter zake van het in Nederland of in de Europese Economische
      Ruimte invoeren als bedoeld in [artikel 3, eerste lid][ref1], onderscheidenlijk [artikel 3, derde lid][ref2]:
      binnen 60 dagen nadat Onze Minister die kennisgeving heeft ontvangen blijkens het bewijs van ontvangst, bedoeld in
      [artikel 6, eerste lid][ref3], tenzij Onze Minister anders bepaalt;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.c
    text: |-
      indien door een vertegenwoordiger kennisgeving is gedaan ter zake van het in de Europese Economische Ruimte
      invoeren als bedoeld in [artikel 3, derde lid][ref1], aan het daartoe aangewezen overheidsorgaan in een andere
      Lid-Staat van de Europese Unie of een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte: binnen 60 dagen nadat dat orgaan die kennisgeving heeft ontvangen, tenzij dat orgaan anders
      bepaalt;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.d
    text: |-
      indien een kennisgeving ter zake van het vervaardigen als bedoeld in [artikel 3, eerste lid][ref1], is
      gedaan: binnen 45 dagen nadat Onze Minister die kennisgeving blijkens het bewijs van ontvangst, bedoeld in
      [artikel 6, eerste lid][ref2], heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Het is degene die een stof vervaardigt, verboden die stof, al dan niet verwerkt in een preparaat, aan een ander ter
      beschikking te stellen:
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
  - number: 8.2.a
    text: |-
      zonder dat een kennisgeving als bedoeld in [artikel 3, tweede lid][ref1], is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.2.b
    text: |-
      indien een kennisgeving als bedoeld in [artikel 3, tweede lid][ref1], is gedaan: binnen 60 dagen
      nadat Onze Minister die kennisgeving heeft ontvangen blijkens het bewijs van ontvangst, bedoeld in
      [artikel 6, eerste lid][ref2], tenzij Onze Minister anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Onze Minister maakt een kennisgeving ter zake van het in Nederland invoeren of het aan een ander ter beschikking
      stellen zo spoedig mogelijk bekend, doch in elk geval binnen het tijdvak van 60 dagen na de dag van ontvangst, dan
      wel, indien een beschikking krachtens [artikel 7][ref1] in beroep is vernietigd, uiterlijk twee weken na de datum
      waarop het besluit, houdende de vernietiging, is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel7
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: 'In ieder geval wordt de kennisgeving gelijktijdig bekendgemaakt door middel van:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel9
  - number: 9.2.a
    text: mededeling in de *Nederlandse Staatscourant*;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel9
  - number: 9.2.b
    text: |-
      terinzagelegging overeenkomstig [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel11
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Indien degene die een kennisgeving als bedoeld in het eerste lid doet, bij die kennisgeving verklaart dat hij de
      stof waarop de kennisgeving betrekking heeft, niet eerder zal invoeren of aan een ander ter beschikking stellen
      dan met ingang van een daarbij aangegeven tijdstip dat gelegen is na het in het eerste lid genoemde tijdvak van 60
      dagen, wordt de kennisgeving door Onze Minister op verzoek van degene die de kennisgeving doet, in afwijking van
      het eerste lid bekendgemaakt binnen het tijdvak van 60 dagen voor het bij de kennisgeving aangegeven tijdstip.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel9
  - number: '10'
    text: |-
      In een mededeling als bedoeld in [artikel 9, tweede lid, onder ][ref1], vermeldt Onze Minister ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel9
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 10.a
    text: een aanduiding van de identiteit van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel10
  - number: 10.b
    text: waar en wanneer de stukken ter inzage zullen liggen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel10
  - number: '11.1'
    text: 'Onze Minister legt met een exemplaar van de kennisgeving stukken ter inzage, die bevatten:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
  - number: 11.1.a
    text: een aanduiding van de identiteit van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
  - number: 11.1.b
    text: de overgelegde gegevens inzake de fysisch-chemische eigenschappen van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
  - number: 11.1.c
    text: de overgelegde gegevens met betrekking tot mogelijkheden om de stof onschadelijk te maken;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
  - number: 11.1.d
    text: |-
      de overgelegde gegevens met betrekking tot aanbevolen voorzorgsmaatregelen om verspreiding van de stof te voorkomen
      en aanbevolen noodmaatregelen bij een ongeval met de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
  - number: 11.1.e
    text: |-
      de overgelegde gegevens inzake de verrichte onderzoeken naar de effecten die de stof op mens of milieu kan
      hebben, dan wel, indien met betrekking tot zodanige gegevens [artikel 56][ref1] toepassing heeft gevonden, de
      overeenkomstig dat artikel overgelegde tweede tekst.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel56
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '56'
        hoofdstuk: '7'
  - number: '11.2'
    text: |-
      Onze Minister legt voorts de overige bij de kennisgeving overgelegde stukken, voor zover kennisneming daarvan
      redelijkerwijs nodig kan zijn voor een beoordeling van de mogelijke effecten van de stof op mens of milieu, ter
      inzage, tenzij met betrekking tot die stukken toepassing is gegeven aan [artikel 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel56
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '56'
        hoofdstuk: '7'
  - number: '12.1'
    text: De stukken liggen gedurende zes weken ter inzage.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 3:11, derde lid, van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.1'
    text: |-
      Degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een kennisgeving heeft gedaan, is verplicht
      zo spoedig mogelijk schriftelijk aan Onze Minister elke verandering te melden in:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 13.1.a
    text: |-
      de gegevens betreffende de hoeveelheid van de stof die hij vervaardigt, aan een ander ter beschikking stelt of
      invoert, voor zover zulks bij of krachtens algemene maatregel van bestuur is bepaald;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
  - number: 13.1.b
    text: |-
      de kennis welke hij met betrekking tot mogelijke effecten die de stof op mens of milieu kan hebben, heeft of
      redelijkerwijs kan hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
  - number: 13.1.c
    text: |-
      de gegevens betreffende de toepassingsgebieden van de stof, welke te zijner kennis zijn of redelijkerwijs kunnen
      zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
  - number: 13.1.d
    text: |-
      de gegevens betreffende de hulpstoffen als bedoeld in [artikel 4, zesde lid][ref1], toegevoegd aan de stof of de
      onzuiverheden, als bedoeld in dat lid, voorkomende bij de stof;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 13.1.e
    text: de gegevens betreffende de plaats waar de stof wordt vervaardigd;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
  - number: 13.1.f
    text: de naam waaronder de stof aan een ander ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
  - number: '13.2'
    text: |-
      De importeur, genoemd in de kennisgeving, bedoeld in [artikel 3, derde lid][ref1], stelt de kennisgever op de
      hoogte van de gegevens, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de meldingen, bedoeld in het
      eerste lid, onder *b-e*.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
  - number: '13.4'
    text: |-
      Onze Minister zendt een exemplaar van een melding krachtens het eerste lid zo spoedig mogelijk aan Onze Minister
      van Sociale Zaken en Werkgelegenheid. Indien de kennisgeving, bedoeld in het eerste lid, betrekking had op het
      in Nederland invoeren of het aan een ander ter beschikking stellen van de stof, zendt hij een samenvatting van de
      melding aan de Commissie van de Europese Gemeenschappen en aan Onze Minister van Volksgezondheid, Welzijn en Sport.
      [Artikel 6, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een kennisgeving heeft gedaan, is verplicht
      met betrekking tot die stof nadere gegevens over te leggen, indien hij in enig jaar 100 ton of meer van die stof
      in de Europese Economische Ruimte heeft vervaardigd of ingevoerd, dan wel indien hij in totaal 500 ton of meer van
      die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd. Met het oog daarop is hij verplicht,
      het bereiken of overschrijden van de in de eerste volzin aangegeven hoeveelheidsgrenzen terstond aan Onze Minister
      te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid vast welke nadere
      gegevens met betrekking tot de stof door degene die de kennisgeving heeft gedaan, moeten worden overgelegd en
      binnen welke termijn dat dient te geschieden. Degene die de kennisgeving heeft gedaan, is verplicht voor het
      verkrijgen van de vereiste gegevens onderzoek te verrichten. Ingeval de vereiste gegevens reeds ingevolge dit
      artikel, dan wel ingevolge [artikel 16][ref1] door een ander zijn overgelegd, kan hij in afwijking van de vorige
      volzin naar die gegevens verwijzen, indien hij een schriftelijke verklaring van de betrokkene overlegt, dat deze
      tegen de verwijzing geen bedenkingen heeft, dan wel indien de vereiste gegevens ten minste tien jaar tevoren zijn
      overgelegd. [Artikel 4, vijfde lid, tweede volzin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.3'
    text: |-
      De nadere gegevens, bedoeld in het tweede lid, worden schriftelijk overgelegd. Onze Minister maakt de
      overlegging van nadere gegevens zo spoedig mogelijk bekend, doch in elk geval binnen zes weken na de dag
      van ontvangst, dan wel, ingeval met betrekking tot deze gegevens op een verzoek om geheimhouding ingevolge
      [artikel 56][ref1] nog niet onherroepelijk is beslist, uiterlijk twee weken na de datum waarop zodanige beslissing
      onherroepelijk is geworden. Met betrekking tot de bekendmaking zijn de[ artikelen 9, tweede lid][ref2], en
      [ artikelen 10, aanhef en onder ][ref3], en [11][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel11
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '56'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.4'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld met betrekking tot de over te leggen nadere gegevens. De
      [artikelen 4, zesde en negende lid][ref1], en [5][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel5
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.5'
    text: |-
      Bij zijn besluit op grond van het tweede lid kan Onze Minister in bijzondere gevallen afwijken van de krachtens
      het vierde lid gestelde regelen, indien het naar zijn oordeel op grond van de reeds bekende eigenschappen van de
      stof wenselijk is dat met betrekking tot die stof andere, door hem bij zijn besluit aan te wijzen gegevens worden
      overgelegd, dan wel indien het naar zijn oordeel op grond van de reeds bekende eigenschappen van de stof niet
      noodzakelijk is dat nadere gegevens worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel14
  - number: '14.6'
    text: |-
      Onze Minister zendt een exemplaar van de ingevolge een besluit krachtens het tweede lid aan hem overgelegde stukken
      zo spoedig mogelijk aan Onze Minister van Sociale Zaken en Werkgelegenheid. Indien de kennisgeving, bedoeld in het
      eerste lid, betrekking had op het in Nederland invoeren of het aan een ander ter beschikking stellen van de stof,
      zendt hij een samenvatting van de stukken aan de Commissie van de Europese Gemeenschappen en aan Onze Minister van
      Volksgezondheid, Welzijn en Sport. Bij de stukken voegt hij een exemplaar van zijn in dat lid bedoelde besluit.
      [Artikel 6, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Nadere gegevens moeten wederom door degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een
      kennisgeving heeft gedaan, met betrekking tot die stof worden overgelegd, indien hij in enig jaar 1000 ton of meer
      van die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd, dan wel indien hij in totaal meer
      dan 5000 ton van die stof in de Europese Economische Ruimte heeft vervaardigd of ingevoerd. Met het oog daarop is
      hij verplicht het bereiken of overschrijden van de in de eerste volzin aangegeven hoeveelheidsgrenzen terstond aan
      Onze Minister te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Onze Minister stelt, na overleg met degene die de kennisgeving heeft gedaan, in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid vast, welke nadere gegevens met betrekking tot de stof door degene
      die de kennisgeving heeft gedaan, moeten worden verschaft en binnen welke termijn dat dient te geschieden.
      [Artikel 14, tweede lid, tweede, derde en vierde volzin, derde, vierde en zesde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.3'
    text: |-
      Bij zijn besluit op grond van het tweede lid, eerste volzin, kan Onze Minister afwijken van de met overeenkomstige
      toepassing van [artikel 14, vierde lid][ref1], gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 15a
    text: |-
      Indien aan Onze Minister een kennisgeving als bedoeld in [artikel 3, derde lid][ref1], is gedaan, heeft de melding,
      bedoeld in de[ artikelen 13][ref2], [14][ref3] en [15][ref4], betrekking op de totale hoeveelheid van die stof,
      zoals die door degene die de stof vervaardigt, door middel van de in de kennisgeving genoemde importeurs, in de
      Europese Economische Ruimte wordt ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel15
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 15b.1
    text: |-
      Indien voor een buiten de Europese Economische Ruimte vervaardigde stof in de Europese Economische Ruimte meer dan
      één kennisgeving is gedaan en deze kennisgevingen betrekking hebben op een stof, die is vervaardigd door dezelfde
      persoon, hebben de gewichtsgrenzen, genoemd in de[ artikelen 14][ref1] en [15][ref2], betrekking op de totale
      hoeveelheid van de stof, zoals die door degene die de stof vervaardigt, door middel van de in de kennisgevingen
      genoemde importeurs, in de Europese Economische Ruimte wordt ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel15
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 15b.2
    text: |-
      Indien het eerste lid toepassing vindt, geldt de verplichting om aanvullende gegevens over te leggen als bedoeld
      in de[ artikelen 13, eerste lid, aanhef en onder ][ref1], [14][ref2] en [15][ref3], in afwijking van die artikelen,
      voor de kennisgevers gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel15
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 15b.3
    text: |-
      Bij de in [artikel 14, vierde lid][ref1], bedoelde maatregel wordt bepaald wie de gegevens, bedoeld in het tweede
      lid, overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, indien zulks naar
      zijn oordeel, gelet op de bij een kennisgeving overeenkomstig [artikel 3][ref1], een melding overeenkomstig
      [artikel 13, eerste lid][ref2] of ingevolge een besluit op grond van [artikel 14, tweede lid][ref3], of
      [15, tweede lid][ref4], ter zake van een stof overgelegde gegevens, voor het inzicht in de gevaren die voor mens of
      milieu door handelingen met die stof kunnen ontstaan, noodzakelijk is, aan degene die de kennisgeving heeft gedaan,
      opdragen nadere door hem aangeduide gegevens met betrekking tot deze stof over te leggen. Daarbij kan hij bepalen
      binnen welke termijn deze gegevens moeten worden overgelegd, en kan hij tevens aan degene die de kennisgeving heeft
      gedaan, opdragen ten behoeve van het overleggen van die gegevens nader door hem omschreven onderzoek met betrekking
      tot die stof te verrichten. Gelijke bevoegdheden komen toe aan Onze Minister van Sociale Zaken en Werkgelegenheid
      in overeenstemming met Onze Minister, indien zulks naar zijn oordeel noodzakelijk is voor het inzicht in de gevaren
      die door handelingen met die stof in de arbeidssituatie kunnen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel15
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde opdracht kan mede strekken tot het verrichten van krachtens [artikel 14][ref1] of
      [15 ][ref2]met overeenkomstige toepassing van [artikel 5][ref3] aangegeven onderzoek op een eerder tijdstip dan dat
      waarop het op grond van [artikel 14][ref4] of [15][ref5] moet worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0003892#Artikel15
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.3'
    text: |-
      Met betrekking tot de over te leggen gegevens is [artikel 14, derde en zesde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16.4'
    text: |-
      Degene aan wie een opdracht als in het eerste lid bedoeld is gegeven, is verplicht de aldaar bedoelde gegevens over
      te leggen en het aldaar bedoelde onderzoek te verrichten.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel16
  - number: '17'
    text: |-
      Degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een kennisgeving heeft gedaan, is
      verplicht alle gegevens die hij met betrekking tot die stof bezit, ten minste tot 10 jaar na de beëindiging van het
      vervaardigen of in de Europese Economische Ruimte invoeren van die stof te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Gelijktijdig met de bekendmaking van een kennisgeving overeenkomstig [artikel 9][ref1] doet Onze Minister de stof
      waarop de kennisgeving betrekking heeft, opnemen in een register.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel9
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18.2'
    text: 'Van de stof worden in het register opgenomen:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
  - number: 18.2.a
    text: een aanduiding van de identiteit;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
  - number: 18.2.b
    text: een beschrijving van de effecten die de stof kan hebben op mens of milieu;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
  - number: 18.2.c
    text: |-
      de ingevolge [artikel 4, eerste lid, onder ][ref1], overgelegde gegevens met betrekking tot de mogelijkheden om de
      stof onschadelijk te maken;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 18.2.d
    text: |-
      de ingevolge [artikel 4, eerste lid, onder ][ref1], overgelegde gegevens met betrekking tot aanbevolen
      voorzorgsmaatregelen om verspreiding van de stof te voorkomen en aanbevolen noodmaatregelen bij een ongeval met
      de stof;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 18.2.e
    text: |-
      indien de stof behoort tot een categorie als bedoeld in [artikel 34, tweede lid][ref1]: de categorie waarin de stof
      is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ook daarbij aan te wijzen andere gegevens in het register
      worden opgenomen, voor zover zij niet krachtens een besluit op grond van [artikel 56, eerste lid][ref1], geheim
      moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel56
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '56'
        hoofdstuk: '7'
  - number: '18.4'
    text: |-
      Aan een ieder wordt inzage verleend in het register. Onze Minister verstrekt aan een ieder desgevraagd, tegen
      betaling van de kosten, een afschrift.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
  - number: '18.5'
    text: |-
      Onze Minister stelt regelen inzake de inrichting van het register. Hij kan tevens nadere regelen stellen ter zake
      van het in het tweede lid of krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel18
  - number: '19.1'
    text: |-
      De[ artikelen 3 tot en met 18][ref1] zijn niet van toepassing op stoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19.1.a
    text: die voor 18 september 1981 reeds in de Europese Gemeenschappen werden ingevoerd of in de handel waren;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
  - number: 19.1.b
    text: |-
      die in Nederland worden vervaardigd of ingevoerd met het oog op de voorbereiding van een kennisgeving als bedoeld
      in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19.1.c
    text: |-
      die in Nederland niet in het vrije verkeer worden gebracht, tenzij zij binnen Nederlands grondgebied worden
      verwerkt of omgezet;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
  - number: 19.1.d
    text: |-
      die in de procesinstallatie waarin zij ontstaan, worden omgezet in andere stoffen zonder dat daarbij tussentijdse
      opslag plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
  - number: 19.1.e
    text: |-
      met betrekking waartoe degene die voornemens is die stof in Nederland te vervaardigen of in te voeren ingevolge
      de artikelen 7 of 8 van de richtlijn een toereikende kennisgeving heeft gedaan bij het daartoe aangewezen
      overheidsorgaan van een andere Lid-Staat van de Europese Unie of van een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
  - number: '19.2'
    text: |-
      Indien met betrekking tot een stof van de zijde van de Commissie van de Europese Gemeenschappen gegevens als
      bedoeld in [artikel 4][ref1], [14][ref2], [15 ][ref3]en [16][ref4] worden ontvangen als gevolg van een kennisgeving
      met betrekking tot die stof in een andere Lid-Staat van de Europese Unie of een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, zijn op die gegevens de[ artikelen 9 tot en met 12][ref5],
      [14, derde lid, tweede en derde volzin][ref6], en [18][ref7] van overeenkomstige toepassing. De eerste volzin vindt
      geen toepassing voor zover zulks door Onze Minister met het oog op de in de desbetreffende Staat geldende regelen
      met betrekking tot de bescherming van bedrijfsgeheimen is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003892#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0003892#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0003892#Artikel18
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0003892
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0003892
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '19.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere categorieën van gevallen worden aangewezen, waarin
      de[ artikelen 3 tot en met 18][ref1] geheel of voor een daarbij te bepalen gedeelte niet van toepassing zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19.3.a
    text: ter uitvoering van een krachtens het Verdrag betreffende de Europese Unie tot stand gekomen bindende regeling;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
  - number: 19.3.b
    text: |-
      indien onverkorte toepassing van die artikelen in het belang van de bescherming van mens en milieu niet
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
  - number: '19.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot stoffen waarop ingevolge het eerste of derde lid
      de[ artikelen 3 tot en met 18][ref1] geheel of ten dele niet van toepassing zijn, regelen worden gesteld met
      betrekking tot de in die artikelen geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19.5'
    text: |-
      Bij algemene maatregel van bestuur kan ter uitvoering van de richtlijn worden bepaald dat, in plaats van het in het
      eerste lid, onder *a*, bepaalde, de[ artikelen 3 tot en met 18][ref1] vanaf een bij die maatregel te bepalen datum
      niet van toepassing zijn op stoffen die voorkomen op een bij die maatregel vast te stellen lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Indien degene die beroepshalve stoffen of preparaten vervaardigt, in Nederland invoert, toepast of aan een ander
      ter beschikking stelt, met betrekking tot een stof of een preparaat nieuwe kennis verkrijgt, waaruit ernstige
      gevaren voor mens of milieu blijken of redelijkerwijs kunnen worden afgeleid, is hij verplicht, onverminderd het
      bepaalde bij of krachtens [artikel 13][ref1], zodanige kennis zo spoedig mogelijk schriftelijk aan Onze Minister
      te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel13
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Indien een persoon als bedoeld in het eerste lid kennis verkrijgt van een belangrijke nieuwe toepassing van
      een stof of een preparaat, waaruit ernstige gevaren voor mens of milieu blijken of redelijkerwijs kunnen worden
      afgeleid, is hij verplicht, onverminderd het bepaalde bij of krachtens [artikel 13][ref1], zodanige kennis zo
      spoedig mogelijk schriftelijk aan Onze Minister te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel13
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.3'
    text: |-
      Onze Minister zendt zo spoedig mogelijk een exemplaar van door hem ontvangen stukken als bedoeld in het eerste en
      tweede lid aan Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel20
  - number: '20.4'
    text: |-
      Met betrekking tot het in het eerste en tweede lid bepaalde kunnen bij algemene maatregelen van bestuur nadere
      regelen worden gesteld. [Artikel 6, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '21.1'
    text: |-
      Onze Minister kan na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, indien hij zulks met het oog
      op de toepassing van de[ artikelen 22][ref1], [23][ref2], [24][ref3] of [31][ref4] in verband met de beoordeling
      van de mogelijke gevaren van een stof of een preparaat nodig acht, aan een ieder die beroepshalve die stof of
      dat preparaat vervaardigt, in Nederland invoert, toepast of aan een ander ter beschikking stelt, opdragen de door
      hem verlangde gegevens met betrekking tot die stof of dat preparaat te verstrekken, waarover deze beschikt of
      redelijkerwijs kan beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0003892#Artikel31
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '22'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '23'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003892
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Degene aan wie een opdracht als bedoeld in het eerste lid is gegeven, is verplicht zodanige gegevens schriftelijk
      over te leggen. [Artikel 20, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel20
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '20'
        hoofdstuk: '3'
  - number: '22.1'
    text: |-
      Onze Minister stelt na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport een lijst vast van stoffen
      en preparaten die wegens hun mogelijke effecten op mens of milieu in het bijzonder aandacht behoeven.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel22
  - number: '22.2'
    text: |-
      Met betrekking tot de stoffen en preparaten die vermeld zijn op de in het eerste lid bedoelde lijst, wordt door of
      vanwege Onze Minister regelmatig onderzoek uitgevoerd naar het voorkomen, de toepassing en de verspreiding van die
      stoffen en preparaten in Nederland.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel22
  - number: '22.3'
    text: |-
      Ieder die beroepshalve een stof of een preparaat, vermeld op de in het eerste lid bedoelde lijst, vervaardigt, of
      die beroepshalve zodanige stof, al dan niet verwerkt in een preparaat, of preparaat in Nederland invoert, toepast
      of aan een ander ter beschikking stelt, is verplicht medewerking te verlenen aan het in het tweede lid bedoelde
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel22
  - number: '22.4'
    text: |-
      Onze Minister stelt de in het eerste lid bedoelde lijst niet vast dan nadat van het ontwerp van die lijst
      mededeling is gedaan in de *Staatscourant* en aan een ieder de gelegenheid is geboden binnen twaalf weken na die
      mededeling zijn zienswijze kenbaar te maken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel22
  - number: '22.5'
    text: |-
      De in het eerste lid bedoelde lijst wordt ten minste een maal per jaar herzien. Met betrekking tot de herziening is
      het vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel22
  - number: '23.1'
    text: |-
      Indien Onze Minister een ernstig vermoeden heeft dat door handelingen met een stof of een preparaat gevaren kunnen
      ontstaan voor mens of milieu, kan hij in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid
      en na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport aan degene die beroepshalve die stof of
      dat preparaat vervaardigt, in Nederland invoert of toepast, opdragen door hem omschreven onderzoek te verrichten
      en daarover schriftelijk aan hem verslag uit te brengen. Gelijke bevoegdheden komen toe aan Onze Minister van
      Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister, indien hij een ernstig vermoeden heeft dat
      door zodanige handelingen gevaren kunnen ontstaan in de arbeidssituatie. Onze Minister, onderscheidenlijk Onze
      Minister van Sociale Zaken en Werkgelegenheid kan daarbij een termijn stellen waarbinnen het verslag moet worden
      uitgebracht. [ Artikel 14, zesde lid, eerste en laatste volzin][ref1], is tevens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel14
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Indien een stof of een preparaat, met betrekking waartoe een ernstig vermoeden bestaat dat door handelingen daarmee
      gevaren kunnen ontstaan voor mens of milieu, door meer dan een persoon beroepshalve wordt vervaardigd, in Nederland
      ingevoerd of toegepast, kan bij algemene maatregel van bestuur worden bepaald dat met betrekking tot die stof of
      dat preparaat onderzoek moet worden verricht.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
  - number: '23.3'
    text: |-
      Bij een maatregel op grond van het tweede lid wordt bepaald welk onderzoek moet worden verricht en worden eisen
      gesteld waaraan de instelling of instellingen die het onderzoek verricht, onderscheidenlijk verrichten, moeten
      voldoen. Indien degenen die de stof of het preparaat beroepshalve vervaardigen, in Nederland invoeren of toepassen,
      niet binnen twaalf weken na het in werking treden van de maatregel het onderzoek hebben opgedragen aan een of
      meer instellingen, geschiedt zulks door Onze Minister, onderscheidenlijk door Onze Minister van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
  - number: '23.4'
    text: |-
      Ieder die beroepshalve een bij een maatregel op grond van het tweede lid aangewezen stof of preparaat vervaardigt,
      of die beroepshalve zodanige stof, al dan niet verwerkt in een preparaat, of preparaat in Nederland invoert, aan
      een ander ter beschikking stelt, opslaat, vervoert, toepast of zich daarvan ontdoet, is verplicht aan de aangewezen
      instellingen de door deze gevraagde gegevens met betrekking tot de stof te verschaffen, voor zover hij over deze
      gegevens beschikt of redelijkerwijs kan beschikken.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
  - number: '23.5'
    text: |-
      Van een onderzoek als bedoeld in het tweede lid wordt schriftelijk verslag uitgebracht aan Onze Minister en Onze
      Minister van Sociale Zaken en Werkgelegenheid. Onze Minister zendt een exemplaar van het verslag aan Onze Minister
      van Volksgezondheid, Welzijn en Sport. [Artikel 6, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel6
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '23.6'
    text: |-
      Bij een besluit als bedoeld in de tweede volzin van het derde lid bepaalt Onze Minister, onderscheidenlijk Onze
      Minister van Sociale Zaken en Werkgelegenheid tevens in hoeverre de kosten ten laste van de in het tweede lid
      bedoelde personen zullen worden gebracht, alsmede de wijze van berekening van de kosten.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
  - number: '23.7'
    text: |-
      Met betrekking tot het bij of krachtens het tweede, derde, vijfde en zesde lid van dit artikel bepaalde kan Onze
      Minister, onderscheidenlijk Onze Minister van Sociale Zaken en Werkgelegenheid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel23
  - number: '24.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien een redelijk vermoeden is gerezen dat door handelingen met
      stoffen of preparaten ongewenste effecten zullen ontstaan voor mens of milieu, regelen worden gesteld met
      betrekking tot het vervaardigen, in Nederland invoeren, toepassen, voorhanden hebben, aan een ander ter beschikking
      stellen, vervoeren, uitvoeren en zich ontdoen van deze stoffen of preparaten.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: '24.2'
    text: 'Hiertoe kunnen behoren regelen, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.a
    text: |-
      een verbod een of meer van de in het eerste lid genoemde handelingen te verrichten met betrekking tot bij de
      maatregel aangewezen stoffen of preparaten;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.b
    text: |-
      een verbod zodanige handeling te verrichten op een bij de maatregel aangegeven wijze, voor daarbij aangegeven
      doeleinden, op daarbij aangegeven plaatsen of onder daarbij aangegeven omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.c
    text: een verbod een handeling als onder *a* of *b* bedoeld te verrichten zonder vergunning, verleend door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.d
    text: |-
      een verbod zodanige handeling te verrichten indien met betrekking tot de stoffen of preparaten niet aan bij de
      maatregel gestelde eisen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.e
    text: |-
      een verbod zodanige handeling te verrichten indien bij degene die die handeling verricht, niet de bij de maatregel
      aangegeven deskundigheid aanwezig is;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.f
    text: |-
      een verbod zodanige handeling te verrichten met betrekking tot produkten, indien deze daarbij aangewezen stoffen
      of preparaten bevatten, of indien deze zodanige stoffen of preparaten bevatten in grotere dan daarbij aangegeven
      hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.g
    text: |-
      een verbod bij de maatregel aangewezen stoffen of preparaten toe te passen in produkten die niet behoren tot
      een type dat bij een keuring, verricht aan de hand van de bij de maatregel daartoe vastgestelde regelen, is
      goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.h
    text: |-
      een verbod bij de maatregel aangewezen stoffen of preparaten ter beschikking te stellen aan een daarbij aangewezen
      categorie van personen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.i
    text: |-
      een verplichting een of meer van de in het eerste lid genoemde handelingen met betrekking tot bij de maatregel
      aangewezen stoffen of preparaten of daarbij aangewezen categorieën van produkten waarin die stoffen of preparaten
      voorkomen, te melden op een daarbij aangegeven wijze aan een daarbij aangewezen bestuursorgaan onder overlegging
      van daarbij aangegeven gegevens;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.j
    text: |-
      een verplichting met betrekking tot zodanige handelingen volgens bij de maatregel gestelde regelen controle-
      onderzoeken te verrichten en de resultaten van die onderzoeken op de bij de maatregel aangegeven wijze aan Onze
      Minister over te leggen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.k
    text: |-
      een verplichting bij de maatregel aangewezen stoffen of preparaten of daarbij aangewezen categorieën van produkten
      waarin die stoffen of preparaten voorkomen, na toepassing terug te zenden aan degene die die stoffen, preparaten of
      produkten ter beschikking heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.l
    text: |-
      een verplichting bij de maatregel aangewezen stoffen of preparaten of daarbij aangewezen categorieën van produkten
      waarin die stoffen of preparaten voorkomen, af te geven aan daarbij aangewezen personen of instellingen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: 24.2.m
    text: |-
      een verplichting voor degenen die bij de maatregel aangewezen stoffen of preparaten of daarbij aangewezen
      categorieën van produkten waarin die stoffen of preparaten voorkomen, vervaardigen, in Nederland invoeren
      of aan een ander ter beschikking stellen, voor daarbij aangewezen personen of instellingen die krachtens
      de [Wet milieubeheer][ref1] bevoegd zijn tot vergunning hebben voor het nuttig toepassen of verwijderen van
      gevaarlijke afvalstoffen, dan wel voor bij de maatregel aangewezen bestuursorganen, om die stoffen, preparaten of
      produkten in te zamelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '24.3'
    text: Onze Minister kan omtrent in een maatregel krachtens het eerste lid geregelde onderwerpen nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel24
  - number: '25'
    text: |-
      Een algemene maatregel van bestuur waarbij toepassing is gegeven aan [artikel 24, tweede lid, onder ][ref1], kan
      tevens de verplichting inhouden te voldoen aan door bestuursorganen die bij de maatregel zijn aangewezen, omtrent
      onderwerpen die in de maatregel zijn geregeld, aan de betrokkene gestelde nadere eisen. Bij het stellen van
      zodanige eis wordt tevens het tijdstip bepaald waarop ten aanzien van die eis de verplichting ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.1'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], worden tevens bij algemene maatregel
      van bestuur regelen gesteld betreffende de wijze waarop de aanvraag om een vergunning dient te geschieden, en de
      gegevens die van de aanvrager kunnen worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.2'
    text: De vergunning kan slechts in het belang van de bescherming van mens en milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
  - number: '26.3'
    text: |-
      Op de voorbereiding van de beschikking op de aanvraag om een vergunning zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2]
      van toepassing. Bij een algemene maatregel van bestuur als bedoeld in het eerste lid kunnen categorieën
      van gevallen worden aangewezen, waarin de [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en
      [afdeling 13.2 van de Wet milieubeheer][ref4] geheel of gedeeltelijk buiten toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '26.4'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen in het belang van de bescherming
      van mens en milieu voorschriften worden verbonden. De voorschriften kunnen, voor zover bij de maatregel niet anders
      is bepaald, de verplichting inhouden te voldoen aan door bestuursorganen die bij het voorschrift zijn aangewezen,
      in het belang van de bescherming van mens en milieu gestelde nadere eisen. Bij het stellen van zodanige eis wordt
      tevens het tijdstip bepaald, waarop ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
  - number: '26.5'
    text: Voor zover zulks bij algemene maatregel van bestuur is bepaald, kan de vergunning worden gewijzigd en ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
  - number: '26.6'
    text: 'Intrekking kan slechts geschieden:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
  - number: 26.6.a
    text: indien een aan de vergunning verbonden voorschrift niet wordt nageleefd, of
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
  - number: 26.6.b
    text: |-
      indien de handeling aanmerkelijk gevaar oplevert voor mens of milieu en wijziging of aanvulling van de aan de
      vergunning verbonden voorschriften redelijkerwijs geen oplossing kan bieden.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
  - number: '26.7'
    text: |-
      Op de voorbereiding van een wijziging of intrekking als bedoeld in het zesde lid, onder a, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '27'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], wijst Onze Minister de instantie aan,
      die de in die bepaling bedoelde keuring verricht. Bij de maatregel worden regelen gesteld ten aanzien van de wijze
      waarop zodanige keuring plaatsheeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '28'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], met betrekking tot het vervaardigen,
      aan een ander ter beschikking stellen of in Nederland invoeren van stoffen waarop [hoofdstuk 2][ref2] niet van
      toepassing is, of van preparaten, kan bij de in dat artikel bedoelde algemene maatregel van bestuur het bij of
      krachtens dat hoofdstuk bepaalde geheel of gedeeltelijk van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        hoofdstuk: '2'
  - number: '29.1'
    text: |-
      Met toepassing van [artikel 24, tweede lid, onder ][ref1], wordt in elk geval een melding vereist van het uitvoeren
      van stoffen en preparaten waarvan het toepassen ernstig gevaar oplevert voor mens of milieu en die voorkomen op een
      bij de maatregel vast te stellen lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '29.2'
    text: |-
      Een melding als bedoeld in het eerste lid geschiedt bij Onze Minister, alsmede bij de bevoegde overheidsinstantie
      van de staat waarheen de uitvoer zal plaatsvinden, voordat de uitvoer plaatsvindt. Bij de maatregel wordt bepaald
      welke gegevens door degene die een stof of een preparaat als bedoeld in het eerste lid uitvoert, met betrekking tot
      die stof of dat preparaat ter beschikking moeten zijn gesteld van die bevoegde overheidsinstantie.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel29
  - number: '29.3'
    text: |-
      Degene die een stof of een preparaat als bedoeld in het eerste lid uitvoert, dient bij de melding voorts aan
      te tonen dat de bevoegde overheidsinstantie, bedoeld in het tweede lid, na ontvangst van de in dat lid bedoelde
      gegevens met de invoer van de stof of het preparaat heeft ingestemd. Indien aan het bepaalde in de vorige volzin
      niet is voldaan, kan Onze Minister degene die de melding heeft gedaan, verbieden de stof uit te voeren. Bij de
      maatregel worden terzake nadere regelen gesteld.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel29
  - number: '30'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], kan tevens worden bepaald dat de
      schade, geleden door degene die de stoffen, preparaten of produkten moet terugzenden of afgeven, of de kosten,
      gemaakt door degene die is aangewezen om die stoffen, preparaten of produkten in te zamelen, ten laste kunnen
      worden gebracht van degenen die die stoffen, preparaten of produkten hebben vervaardigd of in Nederland ingevoerd.
      Daarbij kunnen tevens regelen worden gesteld inzake de berekening van die schade of kosten en de bepaling van
      degenen ten laste van wie die schade of kosten worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '31.1'
    text: |-
      Indien de verwachte of gebleken effecten van stoffen of preparaten op mens of milieu het stellen van regelen
      als bedoeld in [artikel 24, eerste lid][ref1], naar het oordeel van Onze Minister dringend noodzakelijk maken en
      naar zijn oordeel de totstandkoming van een algemene maatregel van bestuur krachtens dat artikel niet kan worden
      afgewacht, kan hij een besluit nemen van de in dat lid bedoelde strekking. Onze Minister neemt een zodanig besluit
      in overeenstemming met Onze Ministers wie het mede aangaat, tenzij de vereiste spoed dit naar zijn oordeel niet
      gedoogt. De [artikelen 25 tot en met 28][ref2] en [30][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel30
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '31.2'
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid vervalt een jaar nadat zij in werking is getreden of indien
      binnen die termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden,
      op het tijdstip waarop die maatregel in werking treedt. De termijn kan bij ministeriële regeling eenmaal met ten
      hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel31
  - number: '32.1'
    text: |-
      Ieder die beroepshalve stoffen of preparaten vervaardigt of in Nederland invoert, is verplicht een register bij te
      houden van de hoeveelheden van de stoffen of preparaten die hij heeft vervaardigd, in Nederland ingevoerd of aan
      een ander ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel32
  - number: '32.2'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld met betrekking tot de inrichting van het register en de
      wijze waarop het moet worden bijgehouden en kunnen andere gegevens worden aangewezen, die in het register moeten
      worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel32
  - number: '32.3'
    text: |-
      Bij algemene maatregel van bestuur kan aan daarbij aangewezen categorieën van personen of voor daarbij aangewezen
      stoffen of preparaten van de krachtens het eerste lid geldende verplichting vrijstelling worden verleend.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel32
  - number: '32.4'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de bescherming van mens en milieu het eerste lid
      van overeenkomstige toepassing worden verklaard op bij de maatregel aangewezen categorieën van personen die
      beroepshalve daarbij aangewezen stoffen of preparaten toepassen. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister kan in bijzondere gevallen van het krachtens [artikel 24][ref1] of [31][ref2] bepaalde of het bij of
      krachtens [artikel 32][ref3] bepaalde op een daartoe strekkende aanvraag ontheffing verlenen, indien het belang van
      de bescherming van mens en milieu zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel32
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003892
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '33.2'
    text: |-
      Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen de voorschriften worden verbonden,
      die naar het oordeel van Onze Minister in het belang van de bescherming van mens en milieu nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel33
  - number: '33.3'
    text: |-
      Op de voorbereiding van een beschikking op een aanvraag om een ontheffing als bedoeld eerste lid, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '33.4'
    text: |-
      Een ontheffing kan door Onze Minister worden gewijzigd of ingetrokken, indien zulks in het belang van de
      bescherming van mens en milieu noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel33
  - number: '34.1'
    text: |-
      Degene die een stof aan een ander ter beschikking stelt of in Nederland invoert, die behoort tot een of meer van de
      in het tweede lid aangewezen categorieën, is verplicht ervoor zorg te dragen dat die stof bij de aflevering en bij
      het ter aflevering voorhanden hebben is verpakt en op de verpakking is aangeduid overeenkomstig het bepaalde bij of
      krachtens de[ artikelen 35][ref1] en [36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel36
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '34.2'
    text: 'De in het eerste lid bedoelde categorieën zijn:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.a
    text: de categorie ontplofbaar;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.b
    text: de categorie oxyderend;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.c
    text: de categorie zeer licht ontvlambaar;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.d
    text: de categorie licht ontvlambaar;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.e
    text: de categorie ontvlambaar;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.f
    text: de categorie zeer vergiftig;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.g
    text: de categorie vergiftig;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.h
    text: de categorie schadelijk;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.i
    text: de categorie bijtend;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.j
    text: de categorie irriterend;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.k
    text: de categorie sensibiliserend;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.l
    text: de categorie kankerverwekkend;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.m
    text: de categorie mutageen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.n
    text: de categorie voor de voortplanting vergiftig;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: 34.2.o
    text: de categorie milieugevaarlijk.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: '34.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de criteria en methoden aangewezen volgens welke moet worden
      bepaald of een stof behoort tot een categorie als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel34
  - number: '35.1'
    text: |-
      De verpakking en de sluiting, die een stof als bedoeld in [artikel 34, eerste lid][ref1], rechtstreeks omsluiten,
      moeten:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 35.1.a
    text: zodanig zijn dat ongewild verlies van de inhoud niet kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
  - number: 35.1.b
    text: |-
      vervaardigd zijn van materiaal dat niet door de stof kan worden aangetast, noch hiermede een gevaarlijke reactie
      kan aangaan of een gevaarlijke verbinding kan vormen;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
  - number: 35.1.c
    text: niet kunnen losraken en tegen normale behandeling bestand zijn.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
  - number: '35.2'
    text: |-
      Indien de verpakking is voorzien van een sluiting die meermalen kan worden gebruikt, moeten verpakking en sluiting
      zodanig zijn dat de verpakking meermalen opnieuw kan worden afgesloten zonder dat ongewild verlies van de inhoud
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste lid, onder *a*, mogen aan de verpakking, indien nodig, een of meer
      ontluchtingsventielen of andersoortige veiligheidvoorzieningen aangebracht zijn.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
  - number: '35.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot de in de vorige leden geregelde
      onderwerpen nadere regelen worden gesteld en kunnen met betrekking tot de verpakking en de sluiting verdere regelen
      worden gesteld. Daarbij kan worden bepaald dat die regelen slechts gelden voor daarbij aangewezen stoffen of in
      daarbij aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel35
  - number: '36.1'
    text: |-
      Op een verpakking als bedoeld in [artikel 35, eerste lid][ref1], moeten duidelijk en onuitwisbaar vermeld zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 36.1.a
    text: de chemische naam van de stof;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
  - number: 36.1.b
    text: |-
      de naam en het adres van de in de Europese Economische Ruimte gevestigde persoon die de stof vervaardigt, in de
      Europese Economische Ruimte aan een ander ter beschikking stelt of invoert;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
  - number: 36.1.c
    text: |-
      de benaming van het gevaar of de gevaren van de stof, als bedoeld in [artikel 34, tweede lid][ref1], met het
      bijbehorende symbool, onderscheidenlijk de bijbehorende symbolen, voor zover daarin krachtens het derde lid is
      voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 36.1.d
    text: |-
      een verwijzing naar de bijzondere, aan het gebruik van de stof verbonden gevaren, voor zover daarin krachtens het
      derde lid is voorzien;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
  - number: 36.1.e
    text: |-
      veiligheidsaanbevelingen ter vermijding van de belangrijkste, aan het gebruik van de stof verbonden gevaren, voor
      zover daarin krachtens het derde lid is voorzien.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
  - number: '36.2'
    text: |-
      De bij het eerste lid voorgeschreven aanduidingen moeten gesteld zijn in de Nederlandse taal. Bij of krachtens
      algemene maatregel van bestuur kunnen gevallen worden aangewezen, waarin die aanduidingen mogen worden gesteld in
      een andere, bij of krachtens de maatregel aangewezen taal.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
  - number: '36.3'
    text: |-
      Onze Minister en Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport
      stellen tezamen nadere regelen met betrekking tot de in het eerste lid bedoelde aanduidingen. Zij kunnen daarbij
      tevens, zo nodig onder het stellen van nadere regelen, bepalen dat door hen aan te geven verdere aanduidingen op
      een verpakking moeten zijn vermeld, of dat door hen aan te geven aanduidingen slechts in door hen aan te geven
      gevallen behoeven te zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
  - number: '36.4'
    text: |-
      Aan het bepaalde bij of krachtens het eerste lid, onder *a*, *c*, *d* en *e*, en het derde lid wordt geacht
      te zijn voldaan, indien een stof, opgenomen op een door Onze Minister en Onze Ministers van Sociale Zaken en
      Werkgelegenheid en van Volksgezondheid, Welzijn en Sport te zamen vastgestelde lijst van stoffen als bedoeld in
      [artikel 34][ref1], is aangeduid op de wijze die in die lijst met betrekking tot die stof is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de
      aanduiding van stoffen waarvan nog niet is bepaald in hoeverre zij behoren tot een of meer van de in
      [artikel 34, tweede lid][ref1], bedoelde categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '38.1'
    text: |-
      Het aanbevelen of aanprijzen van een stof, behorende tot een of meer van de in [artikel 34, tweede lid][ref1],
      bedoelde categorieën, zonder vermelding van de categorie of categorieën waartoe die stof behoort, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Het aanduiden van een stof op een wijze die misleidend is ten aanzien van de effecten van die stof op mens of
      milieu of ten aanzien van het krachtens [artikel 24][ref1] of [31][ref2] bepaalde, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel31
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '39.1'
    text: |-
      De[ artikelen 34 tot en met 38][ref1] zijn van overeenkomstige toepassing op de verpakking en aanduiding en op het
      aanbevelen en aanprijzen van stoffen waaraan met het oog op de stabiliteit hulpstoffen zijn toegevoegd of waarbij
      onzuiverheden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '39.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de verpakking
      en de aanduiding van andere preparaten en met betrekking tot het aanbevelen en aanprijzen daarvan. Daarbij kan
      worden bepaald dat die regelen alleen gelden in daarbij aangewezen gevallen of voor daarbij aangewezen preparaten,
      en kunnen de[ artikelen 34 tot en met 38][ref1] geheel of gedeeltelijk van overeenkomstige toepassing worden
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '39.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de aanduiding
      van preparaten waarin daarbij aangewezen stoffen voorkomen, alsmede met betrekking tot de aanduiding van produkten
      waarin daarbij aangewezen stoffen of preparaten voorkomen. Daarbij kan worden bepaald dat die regelen alleen in
      daarbij aangewezen gevallen gelden.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
  - number: '39.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in daarbij aangewezen gevallen
      de[ artikelen 34 tot en met 38][ref1] geheel of voor een daarbij te bepalen gedeelte niet van toepassing zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 39.4.a
    text: ter uitvoering van een krachtens het Verdrag betreffende de Europese Unie tot stand gekomen bindende regeling;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
  - number: 39.4.b
    text: |-
      indien onverkorte toepassing van die artikelen in het belang van de bescherming van mens en milieu niet
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
  - number: '39.5'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in het vierde lid kunnen regelen worden gesteld met
      betrekking tot de in de[ artikelen 34 tot en met 38][ref1] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Indien stoffen of preparaten, dan wel handelingen met stoffen of preparaten naar het oordeel van Onze Minister
      onduldbaar gevaar opleveren voor mens of milieu, kan hij - zo nodig met behulp van de sterke arm - alle maatregelen
      nemen die hij met het oog op de bescherming van mens en milieu noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: '40.2'
    text: 'Tot de in het eerste lid bedoelde maatregelen kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: 40.2.a
    text: |-
      het geheel of gedeeltelijk stopzetten van het vervaardigen of in Nederland invoeren van stoffen of preparaten of
      van produkten die die stoffen of preparaten bevatten;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: 40.2.b
    text: |-
      het in beslag nemen en, zo nodig, vernietigen van stoffen of preparaten of van produkten die die stoffen of
      preparaten bevatten;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: 40.2.c
    text: |-
      het beletten dat bepaalde gebieden zonder toestemming van Onze Minister worden betreden of dat dieren, planten of
      goederen zonder zodanige toestemming daarbinnen of daarbuiten worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: 40.2.d
    text: het verwijderen van personen, dieren, planten of goederen uit bepaalde gebieden;
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
  - number: 40.2.e
    text: |-
      het toestaan dat de bij een kennisgeving als bedoeld in [artikel 3][ref1] ingevolge
      [artikel 4, eerste, tweede of derde lid][ref2], over te leggen gegevens binnen een door hem te bepalen termijn na
      de kennisgeving worden overgelegd en dat de stof waarvan kennisgeving is gedaan, in Nederland wordt vervaardigd of
      ingevoerd voordat de in [artikel 8, eerste lid, onder ][ref3], gestelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel8
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
