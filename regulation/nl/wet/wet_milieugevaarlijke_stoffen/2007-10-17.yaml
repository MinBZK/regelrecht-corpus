  - number: '32'
    text: |-
      1 Ieder die beroepshalve stoffen of preparaten vervaardigt of in Nederland invoert, is verplicht een register bij
      te houden van de hoeveelheden van de stoffen of preparaten die hij heeft vervaardigd, in Nederland ingevoerd of aan
      een ander ter beschikking gesteld.

      2 Bij algemene maatregel van bestuur worden regelen gesteld met betrekking tot de inrichting van het register en
      de wijze waarop het moet worden bijgehouden en kunnen andere gegevens worden aangewezen, die in het register moeten
      worden opgenomen.

      3 Bij algemene maatregel van bestuur kan aan daarbij aangewezen categorieën van personen of voor daarbij aangewezen
      stoffen of preparaten van de krachtens het eerste lid geldende verplichting vrijstelling worden verleend.

      4 Bij algemene maatregel van bestuur kan in het belang van de bescherming van mens en milieu het eerste lid
      van overeenkomstige toepassing worden verklaard op bij de maatregel aangewezen categorieën van personen die
      beroepshalve daarbij aangewezen stoffen of preparaten toepassen. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel32
  - number: '33'
    text: |-
      1 Onze Minister kan in bijzondere gevallen van het krachtens [artikel 24][ref1] of [31][ref2] bepaalde of het bij
      of krachtens [artikel 32][ref3] bepaalde op een daartoe strekkende aanvraag ontheffing verlenen, indien het belang
      van de bescherming van mens en milieu zich daartegen niet verzet.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen de voorschriften worden
      verbonden, die naar het oordeel van Onze Minister in het belang van de bescherming van mens en milieu nodig zijn.

      3 Op de voorbereiding van een beschikking op een aanvraag om een ontheffing als bedoeld eerste lid, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] en [afdeling 13.2 van de Wet milieubeheer][ref5] van
      toepassing.

      4 Een ontheffing kan door Onze Minister worden gewijzigd of ingetrokken, indien zulks in het belang van de
      bescherming van mens en milieu noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel31
