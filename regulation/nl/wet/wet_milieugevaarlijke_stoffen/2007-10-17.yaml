      1 Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 1, derde lid][ref1], krachtens
      of met overeenkomstige toepassing van [artikel 4, eerste lid][ref2],[ 5][ref3] of [14, vierde lid][ref4],
      krachtens [artikel 19, derde of vierde lid][ref5], [23, tweede lid][ref6], [24][ref7],
      [32, tweede, derde of vierde lid][ref8], [34, derde lid][ref9], [35, vierde lid][ref10], of [39][ref11] wordt
      overgelegd aan de beide kamers der Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een ieder wordt
      de gelegenheid geboden gedurende een bij die bekendmaking vast te stellen termijn van ten minste vier weken
      opmerkingen over het ontwerp schriftelijk ter kennis van Onze Minister te brengen.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.


