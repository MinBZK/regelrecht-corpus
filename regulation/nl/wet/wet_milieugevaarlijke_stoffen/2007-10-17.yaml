  - number: '25'
    text: |-
      Een algemene maatregel van bestuur waarbij toepassing is gegeven aan [artikel 24, tweede lid, onder ][ref1], kan
      tevens de verplichting inhouden te voldoen aan door bestuursorganen die bij de maatregel zijn aangewezen, omtrent
      onderwerpen die in de maatregel zijn geregeld, aan de betrokkene gestelde nadere eisen. Bij het stellen van
      zodanige eis wordt tevens het tijdstip bepaald waarop ten aanzien van die eis de verplichting ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
