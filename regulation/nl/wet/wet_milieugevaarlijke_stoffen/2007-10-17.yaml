  - number: '71'
    text: |-
      1 Deze wet is niet van toepassing op stoffen en preparaten, voor zover daaromtrent regelen zijn gesteld bij de
      [Geneesmiddelenwet][ref1] (*Stb.* 1958, 408) of de [Wet gewasbeschermingsmiddelen en biociden][ref2], dan wel zijn
      of worden gesteld krachtens die wetten. Indien het bij Koninklijke Boodschap van 17 januari 1983 bij de Tweede
      Kamer der Staten-Generaal ingediende voorstel van een [Diergeneesmiddelenwet][ref3] kracht van wet verkrijgt, is
      de onderhavige wet evenmin van toepassing op stoffen en preparaten, voor zover daaromtrent regelen zijn gesteld bij
      die wet, dan wel zijn of worden gesteld krachtens die wet.

      2 Deze wet laat het met betrekking tot stoffen of preparaten bij of krachtens de [Kernenergiewet][ref4] (Stb. 1963,
      82) bepaalde onverlet.

      3 Deze wet is niet van toepassing op het vervoeren, het ten vervoer aanbieden en het ten vervoer
      aannemen, het laden en het lossen en het nederleggen tijdens het vervoer van stoffen, preparaten of micro-
      organismen, alsmede op het laten staan en het laten liggen van een vervoermiddel waarin of waarop zich
      zodanige stoffen, preparaten of micro-organismen of resten daarvan bevinden, voor zover daaromtrent
      regelen zijn gesteld bij of krachtens de [Wet luchtvaart][ref5], dan wel op de handelingen genoemd in
      [artikel 2, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref6] ten aanzien van stoffen, preparaten of micro-
      organismen, voor zover daaromtrent regelen zijn gesteld bij of krachtens [die wet][ref7]. Met betrekking tot de
      verpakking van genetische gemodificeerde micro-organismen blijven de bij of krachtens deze wet gestelde regels van
      kracht indien die organismen zich bij de handelingen, bedoeld in de eerste volzin, niet bevinden in een verpakking
      die voldoet aan de regels die terzake zijn gesteld bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref8] of
      de [Wet luchtvaart][ref9].

      4 Krachtens deze wet worden geen regelen gesteld met betrekking tot het zich ontdoen van stoffen en preparaten
      door het brengen daarvan in oppervlaktewateren, voor zover in het stellen van zodanige regelen is voorzien door
      het vaststellen van grenswaarden krachtens [artikel 1a van de Wet verontreiniging oppervlaktewateren][ref10]
      (*Stb.* 1969, 536) of voor zodanig zich ontdoen een verbod geldt krachtens
      [artikel 3 van de Wet verontreiniging zeewater][ref11] ( Stb. 1975, 352).


