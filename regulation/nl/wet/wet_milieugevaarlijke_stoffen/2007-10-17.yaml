  - number: '13'
    text: |-
      1 Degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een kennisgeving heeft gedaan, is
      verplicht zo spoedig mogelijk schriftelijk aan Onze Minister elke verandering te melden in:

      a. de gegevens betreffende de hoeveelheid van de stof die hij vervaardigt, aan een ander ter beschikking stelt of
      invoert, voor zover zulks bij of krachtens algemene maatregel van bestuur is bepaald;

      b. de kennis welke hij met betrekking tot mogelijke effecten die de stof op mens of milieu kan hebben, heeft of
      redelijkerwijs kan hebben verkregen;

      c. de gegevens betreffende de toepassingsgebieden van de stof, welke te zijner kennis zijn of redelijkerwijs kunnen
      zijn gekomen;

      d. de gegevens betreffende de hulpstoffen als bedoeld in [artikel 4, zesde lid][ref2], toegevoegd aan de stof of de
      onzuiverheden, als bedoeld in dat lid, voorkomende bij de stof;

      e. de gegevens betreffende de plaats waar de stof wordt vervaardigd;

      f. de naam waaronder de stof aan een ander ter beschikking wordt gesteld.

      2 De importeur, genoemd in de kennisgeving, bedoeld in [artikel 3, derde lid][ref3], stelt de kennisgever op de
      hoogte van de gegevens, bedoeld in het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de meldingen, bedoeld in
      het eerste lid, onder *b-e*.

      4 Onze Minister zendt een exemplaar van een melding krachtens het eerste lid zo spoedig mogelijk aan Onze Minister
      van Sociale Zaken en Werkgelegenheid. Indien de kennisgeving, bedoeld in het eerste lid, betrekking had op het
      in Nederland invoeren of het aan een ander ter beschikking stellen van de stof, zendt hij een samenvatting van de
      melding aan de Commissie van de Europese Gemeenschappen en aan Onze Minister van Volksgezondheid, Welzijn en Sport.
      [Artikel 6, vierde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel3
