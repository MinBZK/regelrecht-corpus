      Degene die met betrekking tot een stof overeenkomstig [artikel 3][ref1] een kennisgeving heeft gedaan, is
      verplicht alle gegevens die hij met betrekking tot die stof bezit, ten minste tot 10 jaar na de beëindiging van het
      vervaardigen of in de Europese Economische Ruimte invoeren van die stof te bewaren.


