      1 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 4, eerste of derde lid][ref1], krachtens
      of met overeenkomstige toepassing van [artikel 5][ref2], krachtens [artikel 13, eerste of derde lid][ref3],
      krachtens of met overeenkomstige toepassing van [artikel 14, vierde lid][ref4], of krachtens
      [artikel 19, derde, vierde of vijfde lid][ref5], of [67, derde lid][ref6], wordt Ons gedaan door Onze Minister en
      Onze Minister van Sociale Zaken en Werkgelegenheid te zamen.

      2 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 23, tweede lid][ref7], wordt, ingeval
      zij wordt gedaan op grond van een ernstig vermoeden dat door handelingen met een stof of een preparaat gevaren
      kunnen ontstaan in de arbeidssituatie, Ons gedaan door Onze Minister van Sociale Zaken en Werkgelegenheid.

      3 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 34, derde lid][ref8],
      [35, vierde lid][ref9], [36, tweede lid][ref10], [37][ref11] of [39][ref12] wordt Ons gedaan door Onze Minister en
      Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport te zamen.


