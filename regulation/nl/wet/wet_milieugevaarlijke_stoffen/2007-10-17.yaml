  - number: '60.2'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 23, tweede lid][ref1], wordt, ingeval zij
      wordt gedaan op grond van een ernstig vermoeden dat door handelingen met een stof of een preparaat gevaren kunnen
      ontstaan in de arbeidssituatie, Ons gedaan door Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel23
    url: https://wetten.overheid.nl/BWBR0003892/2007-10-17#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '23'
        hoofdstuk: '3'
  - number: '60.3'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 34, derde lid][ref1],
      [35, vierde lid][ref2], [36, tweede lid][ref3], [37][ref4] of [39][ref5] wordt Ons gedaan door Onze Minister en
      Onze Ministers van Sociale Zaken en Werkgelegenheid en van Volksgezondheid, Welzijn en Sport te zamen.


