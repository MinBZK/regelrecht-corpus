  - number: '16'
    text: |-
      1 Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, indien zulks
      naar zijn oordeel, gelet op de bij een kennisgeving overeenkomstig [artikel 3][ref1], een melding overeenkomstig
      [artikel 13, eerste lid][ref2] of ingevolge een besluit op grond van [artikel 14, tweede lid][ref3], of
      [15, tweede lid][ref4], ter zake van een stof overgelegde gegevens, voor het inzicht in de gevaren die voor mens of
      milieu door handelingen met die stof kunnen ontstaan, noodzakelijk is, aan degene die de kennisgeving heeft gedaan,
      opdragen nadere door hem aangeduide gegevens met betrekking tot deze stof over te leggen. Daarbij kan hij bepalen
      binnen welke termijn deze gegevens moeten worden overgelegd, en kan hij tevens aan degene die de kennisgeving heeft
      gedaan, opdragen ten behoeve van het overleggen van die gegevens nader door hem omschreven onderzoek met betrekking
      tot die stof te verrichten. Gelijke bevoegdheden komen toe aan Onze Minister van Sociale Zaken en Werkgelegenheid
      in overeenstemming met Onze Minister, indien zulks naar zijn oordeel noodzakelijk is voor het inzicht in de gevaren
      die door handelingen met die stof in de arbeidssituatie kunnen ontstaan.

      2 De in het eerste lid bedoelde opdracht kan mede strekken tot het verrichten van krachtens [artikel 14][ref5] of
      [15 ][ref6]met overeenkomstige toepassing van [artikel 5][ref7] aangegeven onderzoek op een eerder tijdstip dan dat
      waarop het op grond van [artikel 14][ref8] of [15][ref9] moet worden opgedragen.

      3 Met betrekking tot de over te leggen gegevens is [artikel 14, derde en zesde lid][ref10], van overeenkomstige
      toepassing.

      4 Degene aan wie een opdracht als in het eerste lid bedoeld is gegeven, is verplicht de aldaar bedoelde gegevens
      over te leggen en het aldaar bedoelde onderzoek te verrichten.


