  - number: '26'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 24, tweede lid, onder ][ref1], worden tevens bij algemene maatregel
      van bestuur regelen gesteld betreffende de wijze waarop de aanvraag om een vergunning dient te geschieden, en de
      gegevens die van de aanvrager kunnen worden verlangd.

      2 De vergunning kan slechts in het belang van de bescherming van mens en milieu worden geweigerd.

      3 Op de voorbereiding van de beschikking op de aanvraag om een vergunning zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en [afdeling 13.2 van de Wet milieubeheer][ref3]
      van toepassing. Bij een algemene maatregel van bestuur als bedoeld in het eerste lid kunnen categorieën
      van gevallen worden aangewezen, waarin de [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] en
      [afdeling 13.2 van de Wet milieubeheer][ref5] geheel of gedeeltelijk buiten toepassing blijven.

      4 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen in het belang van de bescherming
      van mens en milieu voorschriften worden verbonden. De voorschriften kunnen, voor zover bij de maatregel niet anders
      is bepaald, de verplichting inhouden te voldoen aan door bestuursorganen die bij het voorschrift zijn aangewezen,
      in het belang van de bescherming van mens en milieu gestelde nadere eisen. Bij het stellen van zodanige eis wordt
      tevens het tijdstip bepaald, waarop ten aanzien van die eis de verplichting ingaat.

      5 Voor zover zulks bij algemene maatregel van bestuur is bepaald, kan de vergunning worden gewijzigd en
      ingetrokken.

      6 Intrekking kan slechts geschieden:

      a. indien een aan de vergunning verbonden voorschrift niet wordt nageleefd, of

      b. indien de handeling aanmerkelijk gevaar oplevert voor mens of milieu en wijziging of aanvulling van de aan de
      vergunning verbonden voorschriften redelijkerwijs geen oplossing kan bieden.

      7 Op de voorbereiding van een wijziging of intrekking als bedoeld in het zesde lid, onder a, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref6] en [afdeling 13.2 van de Wet milieubeheer][ref7] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
