  - number: '12'
    text: |-
      Bij een besluit tot terugvordering als bedoeld in [artikel 4:57 van de Algemene wet bestuursrecht][ref1] kan de
      subsidie geheel worden teruggevorderd van iedere subsidieontvanger alsmede van iedere aandeelhouder en ieder lid
      als bedoeld in [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
