  - number: '10'
    text: |-
      1 De voorzitter stelt de subsidie of, indien [artikel 6][ref1] van toepassing is, subsidies vast in drie gelijke
      jaarlijkse termijnen.

      2 De subsidieontvanger verzoekt jaarlijks om subsidievaststelling, de eerste maal binnen één maand na de
      subsidieverlening.

      3 De subsidieontvanger beëindigt vóór de eerste aanvraag om subsidievaststelling de exploitatie van het
      verzamelcentrum. Bij de eerste aanvraag tot subsidievaststelling voegt de subsidieontvanger een verklaring
      van een accountant waarin deze gemotiveerd verklaart dat hem is gebleken dat de exploitatie van het betrokken
      verzamelcentrum is gestaakt, alsmede een bewijs van de vernietiging als bedoeld in [artikel 9, tweede lid][ref2].

      4 De voorzitter is bevoegd om van de beëindiging aanvullend bewijs te vragen en om te verlangen dat een door de
      voorzitter aangewezen ambtenaar van het Productschap aanwezig is bij het vernietigen van de inventaris.

      5 De derde jaarlijkse termijn wordt vastgesteld voorzover het Productschap in het derde jaar na de
      subsidieverlening over de benodigde middelen beschikt uit een daartoe in te stellen heffingsverordening. Indien
      wegens gebrek aan middelen slechts een deel van de derde jaarlijkse termijn wordt vastgesteld, wordt het resterende
      deel van de derde termijn een jaar later vastgesteld, voorzover de ontvangsten uit de heffingsverordening in dat
      jaar toereikend zijn, een en ander totdat de derde jaarlijkse termijn volledig is uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009818#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009818#Artikel9
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel10
