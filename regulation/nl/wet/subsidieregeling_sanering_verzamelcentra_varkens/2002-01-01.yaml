preamble:
  text: |-
    Gelet op de artikelen 2, 4 en 7 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *Productschap:*


              Productschap voor Vee en Vlees;



            b

              *voorzitter:*


              voorzitter van het Productschap voor Vee en Vlees;



            c

              *verzamelcentrum:*


              plaats in Nederland ten behoeve van de verzameling van varkens;



            d

              *varkensequivalent:*


              rekeneenheid om het jaarlijks gemiddeld over 1994, 1995 en 1996 aantal op het verzamelcentrum verzamelde,
      van primaire landbouwbedrijven afkomstige varkens in uit te drukken, waarbij een big tot 45 kg gelijk is aan 0,45
      varkensequivalent, een varken bestemd voor de slacht van 45 kg of meer gelijk is aan 1 varkensequivalent en een
      varken bestemd voor de fokkerij van 45 kg of meer gelijk is aan 1,82 varkensequivalent;



            e

              *accountant:*


              een registeraccountant of een accountant-administratieconsulent als bedoeld in artikel 2:393, eerste lid,
      van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 De voorzitter is bevoegd besluiten te nemen ter uitvoering van deze regeling.

      2 De voorzitter kan van de bevoegdheid bedoeld in het eerste lid slechts mandaat verlenen aan ondergeschikten.

      3 Een aanvraag tot subsidieverlening of subsidievaststelling wordt ingediend bij het Productschap met een door het
      Productschap verstrekt formulier.
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De voorzitter verleent een subsidie ter beëindiging van de exploitatie van een verzamelcentrum.

      2 De subsidie wordt slechts verleend voor een verzamelcentrum dat op het tijdstip van de inwerkingtreding van de
      regeling is erkend als verzamelcentrum als bedoeld in artikel 4.10 van de Regeling handel levende dieren en levende
      producten.
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 De subsidie bestaat uit een deel ter compensatie van het inkomensverlies en een deel ter compensatie van het
      vermogensverlies.

      2 Het subsidiedeel ter compensatie van het inkomensverlies bedraagt € 1,13 per varkens-equivalent, met dien
      verstande dat, voorzover uit de bij de aanvraag gevoegde jaar-rekeningen of uit een door een accountant opgestelde,
      op de aan de jaarrekeningen ten grondslag liggende stukken gebaseerde, verklaring blijkt dat de gemiddelde
      inkomens-marge per varkensequivalent meer bedraagt dan € 0,23, het subsidiedeel evenredig wordt verhoogd tot ten
      hoogste € 2,61 per varkensequivalent.

      3 Het subsidiedeel ter compensatie van het vermogensverlies bestaat uit

      a. het getaxeerde huurwaardeverlies per m2 oppervlakte die daadwerkelijk wordt gebruikt voor het aanvoeren, het
      verzamelen, het wegen en het afvoeren van de varkens, alsmede het getaxeerde huurwaardeverlies van de wasplaats en
      de aan het verzamelcentrum toe te rekenen kantoorruimte ter plaatste, vermenigvuldigd met een rendementsfactor van
      10, en

      b. de getaxeerde waarde van de inventaris.

      4 Voor de beëindiging van een verzamelcentrum waarop op het tijdstip van de inwerkingtreding van de regeling
      tevens andere dieren dan varkens worden verzameld, wordt slechts een subsidie verleend ter compensatie van het
      inkomensverlies.
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 De subsidie wordt verleend aan de natuurlijke persoon of rechtspersoon die een verzamelcentrum exploiteert.

      2 Indien de onroerende bedrijfsmiddelen van het te beëindigen verzamelcentrum door de exploitant worden
      gehuurd, wordt het subsidiedeel ter compensatie van het vermogensverlies verleend aan de natuurlijke persoon of
      rechtspersoon die eigenaar is van de onroerende bedrijfsmiddelen.

      3 Indien het te beëindigen verzamelcentrum wordt geëxploiteerd door meer natuurlijke personen of rechtspersonen
      gezamenlijk, of indien de onroerende bedrijfsmiddelen eigendom zijn van meer natuurlijke personen of rechtspersonen
      gezamenlijk, wordt de subsidie verleend aan de natuurlijke personen en rechtspersonen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien de onroerende bedrijfsmiddelen van het te beëindigen verzamelcentrum door de exploitant worden
      gehuurd, wordt de aanvraag ingediend door exploitant en eigenaar gezamenlijk, tenzij op grond van
      [artikel 4, vierde lid][ref1], geen subsidie wordt verleend ter compensatie van het vermogensverlies.

      2 Voorzover de subsidie wordt verleend aan een besloten vennootschap, een naamloze vennootschap of een coöperatieve
      vereniging, wordt de aanvraag om subsidieverlening gezamenlijk ingediend door de rechtspersoon en alle natuurlijke
      personen die middellijk of onmiddellijk aandeelhouder zijn van de vennootschap, dan wel door de rechtspersoon
      en alle natuurlijke personen die middellijk of onmiddellijk lid zijn van de coöperatieve vereniging. Als mede-
      indiener van de aanvraag verbinden deze aandeelhouders of leden zich tot de nakoming van hetgeen in deze regeling
      is bepaald.

      3 Het vorig lid is niet van toepassing op de rechtspersoon die eigenaar is van de ten behoeve van het te beëindigen
      verzamelcentrum gehuurde onroerende bedrijfsmiddelen, indien deze rechtspersoon geen aandeelhouders of leden heeft
      die tevens exploitant, aandeelhouder of lid zijn van het te beëindigen verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0009818#Artikel4
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel6
