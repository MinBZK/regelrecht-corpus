        artikel: '4'
  - number: '7'
    text: |-
      1 Aanvragen voor de subsidieverlening worden ingediend vanaf de datum van inwerkingtreding van deze regeling tot en
      met 30 september 1998.

      2 De aanvraag bevat de namen van alle natuurlijke personen en rechtspersonen als bedoeld in
      [artikel 5, derde lid][ref1].

      3 Indien de aanvraag wordt ingediend of mede wordt ingediend door een rechtspersoon, bevat de aanvraag de namen van
      alle aandeelhouders of leden als bedoeld in [artikel 6, tweede lid][ref2].

      4 De natuurlijke personen en rechtspersonen als bedoeld in [artikel 5, derde lid][ref3], machtigen één van hen of
      een derde om namens hen en hun aandeelhouders of leden op te treden.

      5 Bij de aanvraag worden met betrekking tot het te beëindigen verzamelcentrum de door een accountant van een
      goedkeurende accountantsverklaring voorziene jaarrekeningen gevoegd over de jaren 1994, 1995 en 1996 dan wel,
      indien uit de jaarrekeningen niet de varkensequivalenten of de inkomensmarge kan worden afgeleid, in ieder
      geval een verklaring van een accountant waaruit gemotiveerd blijkt welke aantallen biggen, slachtvarkens
      of fokvarkens in de jaren 1994, 1995 en 1996 zijn verzameld en eventueel een verklaring als bedoeld in
      [artikel 4, tweede lid][ref4]. Tevens wordt bijgevoegd een bewijsstuk waaruit de oppervlakte blijkt als bedoeld in
      [artikel 4, derde lid, onder a][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009818#Artikel5
