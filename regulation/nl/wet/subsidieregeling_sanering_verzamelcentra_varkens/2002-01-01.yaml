  - number: '11'
    text: |-
      Indien de aanvraag wordt ingediend door meer subsidieontvangers gezamenlijk, gelden de [artikelen 7][ref1]
      en [10][ref2] voor de subsidieontvangers gezamenlijk en de [artikelen 8][ref3] en [9][ref4] voor iedere
      subsidieontvanger afzonderlijk.


