  - number: '13'
    text: Het subsidieplafond bedraagt f 29.250.000.
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 Totdat de Commissie van de Europese Gemeenschappen heeft verklaard dat de onderhavige regeling verenigbaar is met
      de gemeenschappelijke markt wordt een besluit tot subsidieverlening genomen onder voorbehoud van deze verklaring.

      2 De subsidie wordt verleend onder de voorwaarde dat de Sociaal Economische Raad de in
      [artikel 10, vijfde lid][ref1], bedoelde heffingsverordening goedkeurt.

      3 Een besluit tot subsidievaststelling wordt pas genomen nadat de in het eerste en tweede lid bedoelde
      goedkeuringen zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009818#Artikel10
