  - number: '8'
    text: |-
      1 De subsidieontvanger verplicht zich na beëindiging van het verzamelcentrum

      a. geen verzamelcentrum te exploiteren, en

      b. geen aandeelhouder of lid te zijn of te worden van een rechtspersoon die een verzamelcentrum exploiteert, en

      c. niet als geldschieter of borg betrokken te zijn bij de exploitatie van een verzamelcentrum, en

      d. niet op andere wijzen de voordelen te genieten uit de exploitatie van een verzamelcentrum.

      2 De aandeelhouders en leden als bedoeld in [artikel 6, tweede lid][ref1], verplichten zich individueel na
      beëindiging van het verzamelcentrum

      a. geen verzamelcentrum te exploiteren, en

      b. geen aandeelhouder of lid te zijn of te worden van een rechtspersoon die een verzamelcentrum exploiteert, en

      c. niet als geldschieter of borg betrokken te zijn bij de exploitatie van een verzamelcentrum, en

      d. niet op andere wijzen de voordelen te genieten uit de exploitatie van een verzamelcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0009818#Artikel6
    url: https://wetten.overheid.nl/BWBR0009818/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009818
        artikel: '6'
  - number: '9'
    text: |-
      1 De subsidieontvanger alsmede de aandeelhouders en leden als bedoeld in [artikel 6, tweede lid][ref1], staan er
      voor in dat de bedrijfsmiddelen van het verzamelcentrum, inclusief de rechtspersoon waarmee het verzamelcentrum
      wordt geëxploiteerd, na beëindiging van het verzamelcentrum noch geheel, noch gedeeltelijk, opnieuw worden gebruikt
      voor de exploitatie van een verzamelcentrum.

      2 De subsidieontvanger draagt zorg voor de vernietiging van de getaxeerde inventaris.

      3 De subsidieontvanger alsmede de aandeelhouders en leden als bedoeld in [artikel 6, tweede lid][ref2], staan er
      voor in dat de bedrijfsmiddelen van het verzamelcentrum na beëindiging van het verzamelcentrum gedurende tien jaren
      na subsidieverlening noch geheel, noch gedeeltelijk, worden gebruikt voor de exploitatie van een verzamelcentrum
      voor andere dieren dan varkens.

      4 Het tweede en derde lid zijn niet van toepassing indien op datum van inwerkingtreding van deze regeling op het
      verzamelcentrum andere dieren dan varkens worden verzameld.


      [ref1]: https://wetten.overheid.nl/BWBR0009818#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009818#Artikel6
