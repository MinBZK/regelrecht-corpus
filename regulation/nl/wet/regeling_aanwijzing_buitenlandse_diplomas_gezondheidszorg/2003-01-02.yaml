  - number: '9'
    text: |-
      Als bewijs van verworven vakbekwaamheid als bedoeld in de [artikelen 2][ref1], [3][ref2], [4][ref3], [6][ref4]
      en [7][ref5] geldt tevens een in een lid-staat of andere overeenkomstsluitende staat behaald getuigschrift
      dat betrekking heeft op een titel die niet overeenstemt met de benaming die voor die lid-staat of andere
      overeenkomstsluitende staat voorkomt op [bijlage 1][ref6], [2][ref7], [3][ref8], [5][ref9] of [6][ref10] bij
      deze regeling, mits vergezeld van een verklaring van de daartoe bevoegde autoriteit van de desbetreffende lid-staat
      of andere overeenkomstsluitende staat waarin wordt bevestigd dat het getuigschrift werd afgegeven na afsluiting van
      een opleiding die in overeenstemming is met de opleiding die leidt tot het desbetreffende in [bijlage 1][ref11],
      [2][ref12], [3][ref13], [5][ref14] of [6][ref15] bedoelde getuigschrift en dat het getuigschrift door de lid-staat
      of andere overeenkomstsluitende staat die het heeft afgegeven wordt gelijkgesteld met het getuigschrift waarvan de
      benaming wel voorkomt op de desbetreffende bijlage.


