    text: |-
      De [artikelen 2 tot en met 6][ref1], [8][ref2] en [9][ref3] zijn niet van toepassing op personen die in het bezit
      zijn van een in [bijlage 1][ref4], [2][ref5], [3][ref6], [4][ref7] of [5][ref8] bedoeld getuigschrift, indien
      zij geen onderdaan zijn van een lid-staat of andere overeenkomstsluitende staat.


