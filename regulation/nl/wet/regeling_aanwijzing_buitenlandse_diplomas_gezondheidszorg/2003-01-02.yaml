preamble:
  text: >-
    Gelet op de artikelen 41, eerste lid, onder a, en tweede lid, en 44 van de Wet op de beroepen in de individuele
    gezondheidszorg;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0021549/2003-01-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: de [Wet op de beroepen in de individuele gezondheidszorg][ref1];

      b. EER-overeenkomst: de Overeenkomst van Oporto van 2 mei 1992 betreffende de Europese Economische Ruimte (Trb.
      1993, 132);

      c. lidstaat: een lidstaat van de Europese Gemeenschap;

      d. andere overeenkomstsluitende staat: een staat niet zijnde een lidstaat van de Europese Gemeenschap, die partij
      is bij de EER-overeenkomst of bij de overeenkomst tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en
      de Zwitserse Bondsstaat, anderzijds, over het vrije verkeer van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0021549/2003-01-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: '2'
    text: |-
      Als bewijs van verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid die uit
      het voldoen aan de krachtens [artikel 18 van de wet][ref1] gestelde opleidingseisen met betrekking tot de arts mag
      worden afgeleid, gelden de getuigschriften die in [bijlage 1][ref2] bij deze regeling worden genoemd, voor zover de
      getuigschriften zijn behaald na de desbetreffende daarbij vermelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0021549
    url: https://wetten.overheid.nl/BWBR0021549/2003-01-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0021549
  - number: '3'
    text: |-
      Als bewijs van verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid die uit
      het voldoen aan de krachtens [artikel 20 van de wet][ref1] gestelde opleidingseisen met betrekking tot de tandarts
      mag worden afgeleid, gelden de getuigschriften die in [bijlage 2][ref2] bij deze regeling worden genoemd, voor
      zover de getuigschriften zijn behaald na de desbetreffende daarbij vermelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0021549
    url: https://wetten.overheid.nl/BWBR0021549/2003-01-02#Artikel3
    references:
