  - number: '4'
    text: |-
      Als bewijs van verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid die uit
      het voldoen aan de krachtens [artikel 22 van de wet][ref1] gestelde opleidingseisen met betrekking tot de apotheker
