      fysiotherapeut mag worden afgeleid, gelden de getuigschriften die in [bijlage 4][ref2] bij deze regeling worden
      genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021549
