  - number: '8'
    text: |-
      Als bewijs van verworven vakbekwaamheid als bedoeld in de [artikelen 2][ref1], [3][ref2], [4][ref3], [6][ref4]
      en [7][ref5] gelden voorts de in de [bijlagen 1][ref6], [2][ref7], [3][ref8], [5][ref9] en [6][ref10] genoemde
      getuigschriften die in een lid-staat of andere overeenkomstsluitende staat zijn behaald vóór de desbetreffende
      in die artikelen bedoelde data, mits vergezeld van een verklaring van de daartoe bevoegde autoriteit van de
      desbetreffende lid-staat of andere overeenkomstsluitende staat waarin wordt bevestigd dat de bezitter van zo'n
      getuigschrift de werkzaamheden van onderscheidenlijk arts, tandarts, apotheker, verloskundige of verpleegkundige
      gedurende ten minste drie jaren achtereen tijdens de vijf jaren, voorafgaande aan de afgifte van de verklaring,
      daadwerkelijk en op wettige wijze heeft uitgeoefend.


