  - number: '7'
    text: |-
      Als bewijs van verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de vakbekwaamheid die
      uit het voldoen aan de krachtens [artikel 32 van de wet][ref1] gestelde opleidingseisen met betrekking tot de
      verpleegkundige mag worden afgeleid, gelden de getuigschriften die in [bijlage 6][ref2] bij deze regeling worden
      genoemd, voor zover de getuigschriften zijn behaald na de desbetreffende daarbij vermelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0021549
