$id: vuurwapenregeling_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028694
url: https://wetten.overheid.nl/BWBR0028694/2010-10-10
articles:
  - number: '1.1'
    text: |-
      De in deze regeling voorkomende uitdrukkingen hebben, met inachtneming van het bepaalde in het volgende lid,
      dezelfde betekenis als die zij hebben in de [Vuurwapenwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028251
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028251
  - number: '1.2'
    text: |-
      Onder vuurwapenen worden mede verstaan: alarmpistolen en andere soortgelijke voor bedreiging of afdreiging
      geschikte voorwerpen met uitzondering van die, welke geen loop of een kennelijk verkorte, geheel gevulde loop
      hebben en welke zodanig zijn ingericht, dat zij enkel losse patronen van een kaliber kleiner dan 6 millimeter
      kunnen bevatten, terwijl de ligplaats van die patronen en de gasuitlaat loodrecht staan op den loop of op de
      lengterichting van het voorwerp.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel1
  - number: '1.3'
    text: |-
      Deze regeling berust op de [artikelen 1][ref1], [2][ref2], [7][ref3] en [10 van de Vuurwapenwet BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028251#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028251#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0028251#Artikel10
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028251
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028251
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0028251
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0028251
        artikel: '10'
  - number: '2.1'
    text: Invoer, uitvoer en doorvoer van vuurwapenen en van munitie zijn verboden.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Vervoer van vuurwapenen, anders dan door iemand, die ingevolge de [Wapenwet BES][ref1] het wapen in het openbaar
      mag dragen, is op de openbare weg of op een voor het publiek toegankelijke plaats verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0028756
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028756
  - number: '3'
    text: |-
      De verbodsbepalingen, genoemd in [artikel 2][ref1], zijn niet van toepassing ten aanzien van invoer, uitvoer,
      doorvoer en vervoer:


      [ref1]: https://wetten.overheid.nl/BWBR0028694#Artikel2
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028694
        artikel: '2'
  - number: '3.1'
    text: door of vanwege het Rijk of de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      toegelaten door de betrokken gezaghebber of met machtiging van hem, door de korpschef of door degene die als zijn
      plaatsvervanger is aangewezen, mits dit geschiedt met inachtneming van de voorwaarden die bij de toelating zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      Invoer, uitvoer, doorvoer of vervoer ingevolge [artikel 3][ref1] heeft niet anders plaats dan krachtens consent
      hetwelk op aanvraag kan worden verleend door de betrokken gezaghebber of met machtiging van hem, door de korpschef
      of degene die als zijn plaatsvervanger is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028694#Artikel3
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028694
        artikel: '3'
  - number: '4.2'
    text: De aanvraag en het consent worden onderscheidenlijk ingericht naar de bij deze regeling gevoegde modellen A en B.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel4
  - number: '4.3'
    text: Bij de aanvraag kiest de belanghebbende woonplaats in het openbaar lichaam waar de aanvraag wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel4
  - number: '4.4'
    text: De aanvrager verstrekt de door of vanwege de betrokken gezaghebber gevraagde inlichtingen of bescheiden.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      De gezaghebber gedraagt zich in de uitvoering van deze regeling naar de aanwijzingen van Onze Minister van
      Justitie.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Zij zijn verplicht een register te houden en daarin aantekening te doen van elk door hen ingevolge deze regeling
      verleend consent.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Ten bate van 's Rijks kas betaalt degene aan wie een consent wordt verleend ter vergoeding van de
      administratiekosten:
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.1.a
    text: |-
      voor zover het betreft een consent van invoer, USD 0,30 per kilogram gewicht van de voorwerpen waarvoor het consent
      geldt;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.1.b
    text: |-
      voor zover het betreft een consent van vervoer van vuurwapenen, USD 0,20 voor elk wapen, waarvoor het consent
      geldt;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.1.c
    text: |-
      en overigens USD 0,60 per duizend kilogram bruto gewicht van de voorwerpen, waarvoor het consent geldt, met een
      minimum van USD 3.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: '6.2'
    text: 'De in het vorige lid vermelde bedragen worden niet geheven:'
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.2.a
    text: bij doorvoer zonder overlading;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.2.b
    text: |-
      bij invoer, uitvoer, doorvoer of vervoer door of vanwege één van de openbare lichamen Bonaire, Sint Eustatius en
      Saba, Curaçao, Sint Maarten of Nederland;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.2.c
    text: |-
      bij invoer, uitvoer, doorvoer of vervoer door verenigingen, die in het bezit zijn van een vergunning als bedoeld in
      artikel 2a van de Wapenwet BES;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: 6.2.d
    text: |-
      bij invoer, uitvoer, doorvoer of vervoer van oorlogswapens en projectielen voor oorlogswapens en andere
      oorlogsmunitie.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel6
  - number: '7'
    text: |-
      De aanvraag om een machtiging tot het voorhanden hebben van een vuurwapen, alsmede de machtiging, waar nodig,
      voorzien van een aangehechte bon voor de aflevering van een vuurwapen, worden onderscheidenlijk ingericht naar de
      bij deze regeling gevoegde modellen C en D.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Ten bate van 's Rijks kas betaalt degene aan wie een machtiging tot het voorhanden hebben van een vuurwapen wordt
      verleend ter vergoeding van de administratiekosten:
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel8
  - number: '8.1'
    text: voor zover het betreft een bijzondere machtiging, USD 0,60 voor elk wapen, waarvoor de machtiging geldt;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      voor zover het betreft een algemene machtiging, USD 14 bij de uitreiking daarvan en vervolgens telkens in de eerste
      maand van elk kalenderjaar eveneens USD 14.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Aan elke machtiging tot het voorhanden hebben van een vuurwapen wordt steeds de voorwaarde verbonden dat de houder
      de bepalingen, bij of krachtens de Vuurwapenwet BES gesteld, stipt zal naleven.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Aan een machtiging tot het voorhanden hebben van vuurwapenen, verleend aan iemand, die van het afleveren van
      vuurwapenen of van munitie aan particulieren een beroep of een gewoonte maakt, worden steeds de navolgende
      voorwaarden verbonden:
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel9
  - number: 9.2.a
    text: |-
      dat de houder behoorlijke voorzorgsmaatregelen zal nemen en behoorlijk toezicht zal uitoefenen of doen uitoefenen
      om te verzekeren, dat voor hem handelende personen de bepalingen, bij of krachtens de Vuurwapenwet BES gesteld,
      stipt naleven;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel9
  - number: 9.2.b
    text: |-
      dat het doorlopend register, bedoeld in artikel 4 van de Vuurwapenwet BES, is ingericht overeenkomstig het bij deze
      regeling gevoegde model E;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel9
  - number: 9.2.c
    text: |-
      dat hij op een bon voor de aflevering van een vuurwapen alleen dan een vuurwapen zal afleveren, indien de inhoud
      van de bon zich daartegen niet verzet, en dat hij zal handelen overeenkomstig hetgeen op de bon is aangegeven;
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel9
  - number: 9.2.d
    text: |-
      dat hij er nauwlettend zorg voor draagt, dat de wapens en munitie, die hij voorhanden heeft, steeds onderling
      streng gescheiden worden bewaard in behoorlijk afgesloten plaatsen of ruimten, die onderling zover mogelijk van
      elkaar staan.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Het bewaarloon, bedoeld in artikel 10, derde lid, van de Vuurwapenwet BES bedraagt USD 0,60 per kilogram gewicht
      van de in bewaring gegeven voorwerpen, doch ten minste USD 0,60 per jaar. Niet geheel vervulde jaren worden daarbij
      voor een vol jaar gerekend.
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Vuurwapenregeling BES.'
    url: https://wetten.overheid.nl/BWBR0028694/2010-10-10#Artikel11
