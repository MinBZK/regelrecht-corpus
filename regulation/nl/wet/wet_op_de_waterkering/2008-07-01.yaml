  - number: '10'
    text: |-
      1 Door en op kosten van het Rijk worden tot het voorkomen of tegengaan van een landwaartse verplaatsing van de
      kustlijn de werken uitgevoerd die naar het oordeel van Onze Minister noodzakelijk zijn vanwege de ingevolge deze
      wet te handhaven veiligheidsnorm. Onze Minister stelt de noodzaak, de plaats en het doel van de werken, alsmede de
      termijn van uitvoering vast.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van werken waarvan naar het oordeel van Onze
      Minister de uitvoering anderszins door het algemeen belang wordt gevorderd.

      3 De in het eerste lid bedoelde kustlijn wordt aangegeven op een door Onze Minister kosteloos verkrijgbaar gestelde
      kaart, die telkens na vijf jaren wordt herzien. De verkrijgbaarstelling wordt bekendgemaakt in de Staatscourant.

      4 Onze Minister geeft toepassing aan het eerste en het tweede lid uit eigen beweging dan wel op een hem
      schriftelijk gedaan verzoek van de beheerder of van gedeputeerde staten. Dit geschiedt niet dan nadat het
      desbetreffend voornemen of verlangen is behandeld in een overlegorgaan, dat bestaat uit vertegenwoordigers van de
      provincie, de beheerders en het Rijk en dat in ieder der provincies Fryslân, Noord-Holland, Zuid-Holland en Zeeland
      door gedeputeerde staten wordt ingesteld.

      5 Onze Minister beslist binnen zes maanden op een ingevolge het vierde lid gedaan verzoek.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel10
  - number: '12'
    text: |-
      1 Onze Minister verleent op aanvraag een subsidie aan het overheidslichaam dat vanwege wijziging van de in
      [artikel 3, eerste of tweede lid][ref1], bedoelde veiligheidsnorm, de in [artikel 4, eerste lid][ref2], bedoelde
      hoogwaterstanden of andere zodanige factoren, of de in [artikel 5a][ref3] bedoelde voorschriften, maatregelen dient
      te treffen, indien de desbetreffende maatregelen zijn opgenomen in het jaarlijks door Onze Minister vast te stellen
      programma.

      2 Bij ministeriële regeling worden regels gesteld over de aanvraag, verlening, vaststelling, intrekking, wijziging,
      weigering, betaling en terugvordering van de subsidie en de verplichtingen van de subsidie-ontvanger.

      3 Een subsidie wordt verleend voor 100 procent van de kosten van uitvoering, volgens bij ministeriële regeling te
      stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007801#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007801#Artikel5a
