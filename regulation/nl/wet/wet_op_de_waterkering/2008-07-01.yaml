        artikel: '18'
  - number: '8'
    text: |-
      De beheerder betrekt bij de voorbereiding van het plan in ieder geval gedeputeerde staten van de provincie en
      burgemeester en wethouders van de gemeenten op wier grondgebied het plan wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel8
  - number: '9'
    text: |-
      1 Iedere vijf jaren brengt de beheerder, in het bijzonder vanwege de zorg die op hem rust voor de handhaving
      van de veiligheidsnorm in de zin van [artikel 3][ref1], verslag uit aan gedeputeerde staten over de algemene
      waterstaatkundige toestand van de primaire waterkering. Gedeputeerde staten brengen over dezelfde periode verslag
      uit aan Onze Minister over elk van de dijkringgebieden in hun gebied, met dien verstande dat ten aanzien van
      een dijkringgebied dat in meer dan één provincie is gelegen gedeputeerde staten van de betreffende provincies
      gezamenlijk verslag uitbrengen aan Onze Minister. Onze Minister zendt de verslagen van gedeputeerde staten met zijn
      bevindingen daaromtrent aan de beide Kamers der Staten-Generaal.

      2 De in het eerste lid bedoelde verslagen bevatten een beoordeling van de veiligheid. Die beoordeling geschiedt
      onder meer in het licht van de ingevolge [artikel 3, eerste of tweede lid][ref2], vastgestelde veiligheidsnorm,
      de ingevolge [artikel 4, eerste lid][ref3], vastgestelde factoren, de in [artikel 5, eerste lid][ref4], bedoelde
      technische leidraden en de in [artikel 13, onder b][ref5], bedoelde legger.

      3 Indien de beoordeling van de veiligheid daartoe aanleiding geeft, bevatten de in het eerste lid bedoelde
      verslagen een omschrijving van de voorzieningen die - op een daarbij aan te geven termijn - nodig worden geacht.

      4 Gedeputeerde staten zenden hun verslag de eerste maal toe vóór het daartoe door Onze Minister voor de
      desbetreffende dijkringgebied of dijkringgebieden vastgestelde tijdstip, dat niet eerder wordt gesteld dan twee
      jaar na de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007801#Artikel3
