  - number: '7'
    text: |-
      1 De aanleg, versterking of verlegging van een primaire waterkering geschiedt overeenkomstig een door de beheerder
      vastgesteld plan.

      2 Het plan bevat:

      a. de te treffen voorzieningen, gericht op de uitvoering van het werk ten aanzien van een primaire waterkering;

      b. de te treffen voorzieningen, gericht op het ongedaan maken of beperken van de nadelige gevolgen van de
      uitvoering van het werk, voor zover die voorzieningen rechtstreeks verband houden met de uitvoering van het werk;

      c. de te treffen voorzieningen ter bevordering van het belang van landschap, natuur of cultuurhistorie, voor zover
      zij rechtstreeks verband houden met de uitvoering van het werk.

      3 In geval het plan een verlegging van de primaire waterkering inhoudt, kan het de te treffen voorzieningen
      bevatten met betrekking tot de inpassing in de omgeving van het gebied tussen de plaats waar de oorspronkelijke
      primaire waterkering is gelegen en de plaats waar de nieuwe primaire waterkering komt te liggen.

      4 In de toelichting op het plan wordt aangegeven welke gevolgen aan de uitvoering van het plan zijn verbonden en op
      welke wijze met de daarbij betrokken belangen rekening is gehouden.

      5 Het eerste lid is niet van toepassing indien ten aanzien van een in dat lid bedoelde werkzaamheid
      toepassing wordt gegeven aan [afdeling 3.5][ref1] dan wel [artikel 3.33, eerste lid][ref2], of
      [artikel 3.35, eerste lid, van de Wet ruimtelijke ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling3.5
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.33
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7
