  - number: 7k
    text: |-
      1 De in [artikel 18, eerste lid, van de onteigeningswet][ref1] bedoelde dagvaarding kan geschieden nadat het plan
      door gedeputeerde staten is goedgekeurd.

      2 De rechtbank spreekt de onteigening niet uit dan nadat het plan onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7k
