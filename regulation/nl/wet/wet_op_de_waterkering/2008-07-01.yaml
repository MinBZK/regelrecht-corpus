  - number: 7f
    text: |-
      1 Voor zover een bestemmingsplan voor de uitvoering van werken en werkzaamheden of het treffen van
      voorzieningen een aanlegvergunning als bedoeld in [artikel 3.3, onder a, van de Wet ruimtelijke ordening][ref1]
      vereist, geldt zodanige eis niet in het gebied dat is begrepen in een vastgesteld plan als bedoeld in
      [artikel 7, eerste lid][ref2].

      2 Ten aanzien van de aanvragen tot het nemen van de in [artikel 7d, eerste lid][ref3], bedoelde besluiten is de
      beheerder mede bevoegd deze in te dienen bij de bevoegde bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.3
