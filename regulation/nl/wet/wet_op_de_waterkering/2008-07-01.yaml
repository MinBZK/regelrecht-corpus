  - number: '13'
    text: |-
      De beheerder draagt zorg voor de vaststelling van:

      a. een overzichtskaart waarop de ligging van de primaire waterkering staat aangegeven;

      b. een legger waarin is omschreven waaraan die waterkering moet voldoen naar richting, vorm, afmeting en
      constructie;

      c. een technisch beheersregister waarin de voor het behoud van het waterkerend vermogen kenmerkende gegevens van de
      constructie en de feitelijke toestand nader zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel13
  - number: '14'
    text: |-
      1 Provinciale staten der provincies waarin een of meer dijkringgebieden zijn gelegen stellen met betrekking tot het
      onderwerp van deze wet een verordening vast, waarin in elk geval de in [artikel 13][ref1] omschreven verplichting
      van de beheerder - en de termijn waarop daaraan moet zijn voldaan nader worden geregeld.

      2 Voor een dijkringgebied dat in meer dan één provincie is gelegen wordt de in het eerste lid bedoelde verordening
      vastgesteld bij gemeenschappelijk besluit van provinciale staten van de betreffende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel13
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007801
        artikel: '13'
  - number: '15'
    text: |-
      1 In het belang van het tijdig nemen van maatregelen bij hoog water dat gevaar voor een tot directe kering van het
      buitenwater bestemde primaire waterkering kan opleveren, draagt Onze Minister zorg dat:

      a. informatie beschikbaar is over de verwachte afwijkingen van de daartoe door Onze Minister gepubliceerde
      hoogwaterstanden;

      b. waarschuwingen en verdere inlichtingen worden verschaft aan de beheerders van primaire waterkeringen en colleges
      van gedeputeerde staten die het betreft, zodra te verwachten is dat bij hoge stormvloed, hoog opperwater van een
      van de grote rivieren, hoog water van het IJsselmeer of het Markermeer - of tengevolge van een combinatie daarvan -
      de hoogwaterstand het alarmeringspeil overschrijdt.

      2 Alarmeringspeilen, als bedoeld in het eerste lid, onderdeel *b*, worden door Onze Minister telkens voor vijf
      jaren vastgesteld bij in de *Staatscourant* bekend te maken besluit.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel15
  - number: '35'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel35
  - number: '36'
    text: Deze wet kan worden aangehaald als Wet op de waterkering.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel36
