preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de beveiliging tegen overstroming door het buitenwater - in het
    bijzonder bij hoge stormvloeden, bij hoog opperwater van de grote rivieren, bij hoog water van het IJsselmeer of
    bij een combinatie daarvan - een wezenlijk vereiste is voor de bewoonbaarheid van ons land;

    dat het gewenst is algemene regels te stellen omtrent de mate van beveiliging die in onderscheidene gebieden
    moet zijn gewaarborgd, alsmede procedurele voorzieningen te treffen om een versnelde uitvoering van nieuwe of
    versterkingswerken - met het oog op het zo spoedig mogelijk bereiken van die mate van beveiliging - te kunnen
    verzekeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In het gestelde bij of krachtens deze wet wordt verstaan onder:

      "Onze Minister": Onze Minister van Verkeer en Waterstaat;

      "dijkringgebied": een gebied dat door een stelsel van waterkeringen beveiligd moet zijn tegen overstroming, in
      het bijzonder bij hoge stormvloed, bij hoog opperwater van een van de grote rivieren, bij hoog water van het
      IJsselmeer, bij hoog water van het Markermeer of bij een combinatie daarvan;

      "primaire waterkering": een waterkering, die beveiliging biedt tegen overstroming doordat deze ofwel behoort
      tot het stelsel dat een dijkringgebied - al dan niet met hoge gronden omsluit, ofwel vóór een dijkringgebied is
      gelegen;

      "buitenwater": het oppervlaktewater waarvan de waterstand direct invloed ondergaat bij hoge stormvloed, bij hoog
      opperwater van een van de grote rivieren, bij hoog water van het IJsselmeer, bij hoog water van het Markermeer of
      bij een combinatie daarvan;

      "beheerder": de overheid waarbij de primaire waterkering in beheer is.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel1
  - number: '2'
    text: |-
      1 Deze wet is van toepassing op de dijkringgebieden en de primaire waterkeringen welke staan aangegeven op als
      [bijlage I][ref1] en [bijlage IA][ref2] bij deze wet behorende landkaarten.

      2 De in het eerste lid bedoelde bijlagen kunnen worden gewijzigd bij algemene maatregel van bestuur op voordracht
      van Onze Minister, gehoord de voor de betreffende dijkringgebieden en primaire waterkeringen bevoegde colleges van
      gedeputeerde staten en beheerders.

      3 Een algemene maatregel van bestuur, als bedoeld in het tweede lid, treedt niet eerder in werking dan drie maanden
      na de datum waarop deze aan beide Kamers der Staten-Generaal is toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007801
      [ref2]: https://wetten.overheid.nl/BWBR0007801
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel2
    references:
      - id: ref1
