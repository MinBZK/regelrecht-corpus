  - number: 3a
    text: |-
      Indien bovenregionale belangen daartoe nopen, wijst Onze Minister waterkeringen, niet zijnde primaire
      waterkeringen, aan, waarvoor gedeputeerde staten met het oog op het voorkomen van onveilige situaties en ernstige
      schade binnen een door hem te bepalen termijn een veiligheidsnorm vaststellen. Deze vaststelling geschiedt bij
      verordening.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel3a
  - number: '4'
    text: |-
      1 Bij ministeriële regeling wordt voor daarbij aan te geven plaatsen vastgesteld van welke relatie tussen
      hoogwaterstanden en overschrijdingskansen daarvan de beheerder van de betreffende primaire waterkering moet uitgaan
      bij de bepaling van het waterkerend vermogen daarvan. Bij die vaststelling kunnen tevens waarden worden vastgesteld
      van andere zodanige factoren.

      2 De in het eerste lid bedoelde vaststelling geschiedt telkens voor vijf jaren, voor de eerste maal binnen één jaar
      na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister draagt zorg voor de totstandkoming en verkrijgbaarstelling van technische leidraden voor het
      ontwerp, het beheer en het onderhoud van primaire waterkeringen. Zij strekken tot aanbeveling ten behoeve van
      degenen die met het beheer onderscheidenlijk het toezicht zijn belast.

      2 Onze Minister kan de vervulling van de in het eerste lid omschreven taak bij in de Staatscourant bekend te maken
      besluit opdragen aan een door hem ingestelde technische adviescommissie voor de waterkeringen.

      3 De verkrijgbaarstelling van leidraden als bedoeld in het eerste lid, wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel5
  - number: 5a
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de door de beheerder te verrichten beoordeling van de
      veiligheid van primaire waterkeringen.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel5a
  - number: '6'
    text: |-
      1 Gedeputeerde staten hebben het toezicht op alle primaire waterkeringen in hun provincie.

      2 Indien een primaire waterkering is gelegen in meerdere provincies, kunnen gedeputeerde staten van die provincies
      bij overeenstemmende besluiten bepalen dat het toezicht op die primaire waterkering wordt uitgeoefend door
      gedeputeerde staten van de provincie waarin de primaire waterkering in hoofdzaak is gelegen.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel6
  - number: 6a
    text: |-
      1 Indien de in [artikel 3, eerste of tweede lid][ref1], bedoelde veiligheidsnormen, de in
      [artikel 4, eerste lid][ref2], bedoelde hoogwaterstanden, de krachtens [artikel 4, eerste lid][ref3], vastgestelde
      waarden of de krachtens [artikel 5a][ref4] vastgestelde regels wijziging ondergaan, kan bij besluit van Onze
      Minister worden bepaald door welk bestuursorgaan, op welke wijze en binnen welk tijdsbestek maatregelen met
      betrekking tot de beveiliging tegen overstroming worden getroffen.

      2 Op de voorbereiding van een besluit als bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] van toepassing.

      3 Het eerste lid wordt niet toegepast dan nadat overleg is gevoerd met het betrokken bestuursorgaan en niet eerder
      dan vier weken nadat de beide Kamers der Staten-Generaal in kennis zijn gesteld van het voornemen tot het nemen van
      het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007801#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007801#Artikel4
