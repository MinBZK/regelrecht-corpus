  - number: 7g
    text: |-
      1 Indien een bestuursorgaan, uitgezonderd een bestuursorgaan van het Rijk, dat in eerste aanleg bevoegd is te
      beslissen op een aanvraag tot het nemen van een besluit tot uitvoering van het plan, niet of niet tijdig een
      ontwerp-besluit op de aanvraag aan gedeputeerde staten zendt, dan wel niet, niet tijdig of niet in overeenstemming
      met het plan beslist, dan wel een beslissing neemt die naar het oordeel van gedeputeerde staten wijziging behoeft,
      kunnen gedeputeerde staten een beslissing op de aanvraag nemen. In het laatste geval treedt hun besluit in de
      plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten voornemens zijn
      zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in eerste aanleg bevoegd
      is te beslissen.

      2 Het eerste lid is van overeenkomstige toepassing op de ambtshalve te nemen besluiten ter uitvoering van het plan
      en andere besluiten dan die ter uitvoering van het plan, welke zijn gericht op de realisering van de in het plan
      opgenomen voorzieningen.

      3 Indien bij de toepassing van het eerste lid de beslissing op een aanvraag tot het nemen van een besluit als in
      dat lid bedoeld, wordt genomen door gedeputeerde staten, draagt het bestuursorgaan dat in eerste aanleg bevoegd was
      te beslissen op de aanvraag de ter zake ontvangen leges over aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7g
  - number: 7h
    text: |-
      De in [artikel 7d, eerste lid,][ref1] bedoelde besluiten worden, voor zover zij gecoördineerd zijn voorbereid,
      gelijktijdig door gedeputeerde staten bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel7d
