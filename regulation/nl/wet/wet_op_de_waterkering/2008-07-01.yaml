  - number: '3'
    text: |-
      1 Op de bij deze wet behorende [bijlage II][ref1] en [bijlage IIA][ref2] is voor elk dijkringgebied de
      veiligheidsnorm aangegeven als gemiddelde overschrijdingskans - per jaar - van de hoogste hoogwaterstand waarop de
      tot directe kering van het buitenwater bestemde primaire waterkering moet zijn berekend, mede gelet op overige het
      waterkerend vermogen bepalende factoren.

      2 In overeenstemming met en ter vervanging van de overschrijdingskans in de zin van het eerste lid, wordt bij
      algemene maatregel van bestuur voor elk dijkringgebied de veiligheidsnorm nader aangegeven als de gemiddelde kans
      per jaar op een overstroming door het bezwijken van een primaire waterkering.

      3 Primaire waterkeringen, niet bestemd tot directe kering van het buitenwater, moeten, zolang voor het
      dijkringgebied waartoe zij behoren geen veiligheidsnorm krachtens het tweede lid is vastgesteld, tenminste gelijke
      veiligheid bieden als op de datum van inwerkingtreding van deze wet.

      4 [Artikel 2, tweede en derde lid][ref3], is van overeenkomstige toepassing op de wijziging van de in het eerste
      lid bedoelde bijlagen en op de vaststelling of wijziging van de in het tweede lid bedoelde algemene maatregel van
      bestuur.

      5 Onze Minister zendt elke tien jaar aan de beide Kamers der Staten-Generaal een verslag over de doeltreffendheid
      en de effecten van de in [bijlage II][ref4] en [bijlage IIA][ref5] aangegeven veiligheidsnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0007801
      [ref2]: https://wetten.overheid.nl/BWBR0007801
      [ref3]: https://wetten.overheid.nl/BWBR0007801#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007801
      [ref5]: https://wetten.overheid.nl/BWBR0007801
