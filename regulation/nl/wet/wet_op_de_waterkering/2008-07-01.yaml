  - number: 7a
    text: |-
      1 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      2 De terinzagelegging geschiedt tevens ten kantore van de betrokken bestuursorganen. Zienswijzen kunnen naar voren
      worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 7b
    text: |-
      1 De beheerder stelt het plan vast binnen twaalf weken nadat de termijn voor het naar voren brengen van zienswijzen
      is verstreken.

      2 Het plan behoeft de goedkeuring van gedeputeerde staten van de provincie op wier grondgebied het plan wordt
      uitgevoerd. De beheerder zendt na de vaststelling het plan onverwijld aan gedeputeerde staten.

      3 Indien het een primaire waterkering betreft die in meer dan één provincie is gelegen, kunnen gedeputeerde staten
      van de desbetreffende provincies bij overeenstemmende besluiten bepalen dat gedeputeerde staten van de provincie
      waarin de primaire waterkering in hoofdzaak is gelegen, belast is met de goedkeuring van het plan.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7b
  - number: 7c
    text: |-
      In afwijking van [artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] kan het nemen van
      een besluit omtrent goedkeuring niet worden verdaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:31
  - number: 7d
    text: |-
      1 Gedeputeerde staten bevorderen een gecoördineerde voorbereiding van de besluiten die nodig zijn ter uitvoering
      van het plan.

      2 Indien het een primaire waterkering betreft die in meer dan één provincie is gelegen, kunnen gedeputeerde staten
      van de desbetreffende provincies bij overeenstemmende besluiten bepalen dat gedeputeerde staten van een van die
      provincies de coördinatie van de voorbereiding van de in het eerste lid bedoelde besluiten bevorderen.

      3 Gedeputeerde staten kunnen van de andere betrokken bestuursorganen de medewerking vorderen, die voor het
      welslagen van de coördinatie nodig is. Die bestuursorganen verlenen de van hen gevorderde medewerking.
    url: https://wetten.overheid.nl/BWBR0007801/2008-07-01#Artikel7d
  - number: 7e
    text: |-
      Op de voorbereiding van de in [artikel 7d, eerste lid][ref1], bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. de ontwerpen van de besluiten binnen een door gedeputeerde staten te bepalen termijn worden toegezonden aan
      gedeputeerde staten, die zorg dragen voor de in [artikel 3:13, eerste lid, van die wet][ref3] bedoelde toezending;

      b. gedeputeerde staten ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kunnen geven aan de
      [artikelen 3:11, eerste lid][ref4], en [3:12 van die wet][ref5];

      c. zienswijzen naar voren kunnen worden gebracht door een ieder;

      d. in afwijking van [artikel 3:18 van die wet][ref6] de besluiten worden genomen binnen een door gedeputeerde
      staten te bepalen termijn;

      e. de besluiten onverwijld worden gezonden aan gedeputeerde staten;

      f. gedeputeerde staten beslissen over de toepassing van [artikel 3:18, tweede lid, van die wet][ref7].


