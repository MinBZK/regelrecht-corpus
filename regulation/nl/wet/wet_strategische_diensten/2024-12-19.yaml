  - number: '13'
    text: |-
      1 Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van de uitvoering van bindende
      EU-rechtshandelingen regeling of nadere regeling behoeven, kan deze geschieden bij algemene maatregel van bestuur.

      2 Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit
      het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister kan aan een toestemming als bedoeld in de artikelen 3, tweede lid, en 4, tweede lid,
      van [verordening 2019/125](32025R2019), aan een ontheffing als bedoeld in [artikel 3, derde lid][ref1],
      van deze wet, en aan een vergunning als bedoeld in de artikelen 11, eerste lid, 12, eerste lid,
      onderdelen a, b en c, en 13, eerste lid, van de Verordening producten voor tweeërlei gebruik, en de
      [artikelen 4, derde lid en vierde lid][ref2], [5, eerste lid][ref3], [6, eerste lid][ref4], [8][ref5] en
      [10, eerste lid][ref6], voorschriften en voorwaarden verbinden.

      2 Ten aanzien van de vergunningverlening worden bij ministeriële regeling nadere regels gesteld over:

      a. de wijze waarop en door wie een vergunning wordt aangevraagd;

      b. de aard van de vergunning;

      c. de voorschriften en voorwaarden die aan de vergunning verbonden kunnen worden.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref7] is niet van toepassing.

      4 De vergunning kan ook worden geweigerd, dan wel ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref8]. Voordat toepassing
      wordt gegeven aan de vorige volzin, kan het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur,
      bedoeld in [artikel 8 van die wet][ref9], om een advies als bedoeld in [artikel 9 van die wet][ref10] worden
      gevraagd.

      5 Een vergunning als bedoeld in de [artikelen 8][ref11] en [10, eerste lid][ref12], wordt in ieder geval geweigerd
      voor zover dit voortvloeit uit internationale verplichtingen.

      6 Het is verboden te handelen in strijd met de voorschriften en voorwaarden die zijn verbonden aan een toestemming,
      ontheffing en vergunning, bedoeld in het eerste lid.


