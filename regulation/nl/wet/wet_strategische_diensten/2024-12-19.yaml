preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, om regels te stellen inzake de controle op diensten
    die betrekking hebben op strategische goederen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *goederen voor tweeërlei gebruik:* producten voor tweeërlei gebruik als bedoeld in artikel 2, eerste lid, van de
      Verordening producten voor tweeërlei gebruik;
        - *militair eindgebruik:* militair eindgebruik als bedoeld in artikel 4, eerste lid, onderdeel b, van de
      Verordening producten voor tweeërlei gebruik;
        - *militaire goederen:* de krachtens [artikel 3:1 van de Algemene douanewet aangewezen][ref1] militaire goederen;
        - *militaire programmatuur:* programmatuur als bedoeld in de door de Raad van de Europese Unie vastgestelde
      Gemeenschappelijke EU-lijst van militaire goederen (PbEU 2010, C 69);
        - *militaire technologie:* technologie als bedoeld in de door de Raad van de Europese Unie vastgestelde
      Gemeenschappelijke EU-lijst van militaire goederen (PbEU 2010, C 69);
        - *Onze Minister:* Onze Minister van Buitenlandse Zaken;
        - *technische bijstand:* de technische bijstand, bedoeld in artikel 1, negende lid, Verordening producten voor
      tweeërlei gebruik;
        - *tussenhandelaar:* tussenhandelaar als bedoeld in artikel 2, achtste lid, van de Verordening producten voor
      tweeërlei gebruik;
        - *tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land:* a. het onderhandelen over of
      regelen van overeenkomsten met het oog op de koop, verkoop of levering van goederen voor tweeërlei gebruik die zich
      niet in de Europese Unie bevinden en niet bestemd zijn voor invoer in de Europese Unie of Bonaire, Sint Eustatius
      of Saba; b. het ten behoeve van één of meer partijen verkopen of kopen van goederen voor tweeërlei gebruik die zich
      niet in de Europese Unie bevinden en niet bestemd zijn voor invoer in de Europese Unie of Bonaire, Sint Eustatius
      of Saba;
        - *tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land:* a. het onderhandelen over of regelen
      van overeenkomsten met het oog op de koop, verkoop of levering van goederen voor tweeërlei gebruik die zich in
      de Europese Unie bevinden en bestemd zijn voor uitvoer uit de Europese Unie; b. het ten behoeve van één of meer
      partijen verkopen of kopen van goederen voor tweeërlei gebruik die zich in de Europese Unie bevinden en bestemd
      zijn voor uitvoer uit de Europese Unie;
        - *tussenhandeldiensten militaire goederen:* a. het onderhandelen over of regelen van overeenkomsten met het oog
      op de koop, verkoop of levering van militaire goederen die zich niet in het Europese deel van Nederland en Bonaire,
      Sint Eustatius en Saba bevinden en niet bestemd zijn voor invoer in het Europese deel van Nederland of Bonaire,
      Sint Eustatius of Saba; b. het ten behoeve van één of meer partijen verkopen of kopen van militaire goederen die
      zich niet in het Europese deel van Nederland en Bonaire, Sint Eustatius en Saba bevinden en niet bestemd zijn voor
      invoer in het Europese deel van Nederland of Bonaire, Sint Eustatius of Saba;
        - *verordening 2019/125:* de verordening (EU) 2019/125 van het Europees Parlement en de Raad van 16 januari 2019
      met betrekking tot de handel in bepaalde goederen die gebruikt zouden kunnen worden voor de doodstraf, foltering of
      andere wrede, onmenselijke of onterende behandeling of bestraffing (PbEU 2019, L 30);
        - *Verordening producten voor tweeërlei gebruik:* [Verordening (EU) 2021/821](32721R2021) van het Europees
      Parlement en de Raad van 20 mei 2021 tot instelling van een EU-regeling voor controle op de uitvoer, de
      overbrenging, de tussenhandel, de technische bijstand en de doorvoer van producten voor tweeërlei gebruik
      (herschikking) (PbEU 2021, L 206);
        - *wapenembargo:* een wapenembargo als bedoeld in artikel 2, negentiende lid, van de Verordening producten voor
      tweeërlei gebruik.

      2 De bepalingen in dit hoofdstuk zijn van toepassing in het Europese deel van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel31
