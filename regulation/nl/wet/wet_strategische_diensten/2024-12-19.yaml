  - number: '31'
    text: |-
      De strafwet van Bonaire, Sint Eustatius en Saba is toepasselijk op de vreemdeling die in Bonaire, Sint Eustatius
      of Saba een vaste woon- of verblijfplaats heeft en zich buiten Bonaire, Sint Eustatius en Saba en het Europese
      deel van Nederland, schuldig maakt aan een bij deze wet strafbaar gesteld feit door in strijd te handelen met de
      [artikelen 20][ref1], [21][ref2], [22, eerste tot en met derde lid][ref3], [23, eerste tot en met derde lid][ref4],
      en [24, eerste tot en met derde lid][ref5].


