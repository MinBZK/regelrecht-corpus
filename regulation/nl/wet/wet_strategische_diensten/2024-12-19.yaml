        artikel: '2.26'
  - number: '20'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister programmatuur of technologie door middel van elektronische
      media met betrekking tot goederen voor tweeërlei gebruik die zijn genoemd in bijlage I van de Verordening producten
      tweeërlei gebruik over te dragen naar een bestemming buiten Bonaire, Sint Eustatius en Saba en het Europese deel
      van Nederland.

      2 Het is verboden zonder vergunning van Onze Minister programmatuur of technologie door middel van elektronische
      media met betrekking tot goederen voor tweeërlei gebruik die niet zijn genoemd in bijlage I van de Verordening
      producten tweeërlei gebruik over te dragen naar een bestemming buiten Bonaire, Sint Eustatius en Saba en het
      Europese deel van Nederland indien degene die de programmatuur of technologie overdraagt door Onze Minister ervan
      in kennis is gesteld dat de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn
      voor:

      a. gebruik in verband met de ontwikkeling, de productie, de behandeling, de bediening, het onderhoud, de opslag,
      de opsporing, de herkenning of de verspreiding van chemische, biologische of nucleaire wapens of andere nucleaire
      explosiemiddelen, of voor de ontwikkeling, de productie, het onderhoud of de opslag van raketten die dergelijke
      wapens naar hun doel kunnen voeren,

      b. militair eindgebruik in een kopend land of een land van bestemming waarop een wapenembargo rust of

      c. het gebruik als onderdelen of componenten van militaire goederen die vanuit Bonaire, Sint Eustatius of Saba zijn
      uitgevoerd zonder vergunning of met schending van de voorgeschreven vergunning.

      3 Indien degene die programmatuur of technologie overdraagt door middel van elektronische media er kennis van
      draagt dat de programmatuur of technologie betrekking hebben op goederen voor tweeërlei gebruik die niet zijn
      genoemd in bijlage I van de Verordening producten tweeërlei gebruik, geheel of ten dele bestemd zijn voor een van
      de in het tweede lid genoemde doeleinden, deelt hij dit mede aan Onze Minister.

      4 Indien Onze Minister bij beschikking heeft bepaald dat de overdracht van daarbij aangewezen programmatuur of
      technologie zonder vergunning is verboden, is de adressant van deze beschikking, zodra voor hem aannemelijk is
      dat de desbetreffende programmatuur en technologie een andere bestemming zullen krijgen dan in de beschikking is
      vermeld, verplicht onder opgave van redenen van deze gewijzigde bestemming mededeling te doen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel20
