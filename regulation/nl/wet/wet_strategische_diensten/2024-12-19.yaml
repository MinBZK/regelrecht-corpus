      1 Onze Minister kan aan een vergunning als bedoeld in de [artikelen 20, eerste en tweede lid][ref1],
      [22, eerste en tweede lid][ref2], [24, derde lid][ref3], een ontheffing verleend op grond van [artikel 21][ref4],
      en aan een vergunning verleend op grond van artikel 24, eerste lid, voorschriften en voorwaarden verbinden.

      2 Ten aanzien van de vergunningverlening is [artikel 14, tweede lid][ref5], van toepassing in Bonaire, Sint
      Eustatius en Saba.

      3 Een vergunning als bedoeld in [artikel 24, eerste en derde lid][ref6], wordt in ieder geval geweigerd voor zover
      dit voortvloeit uit internationale verplichtingen.


