        artikel: 3:1
  - number: '9'
    text: |-
      1 Het is verboden technische bijstand te verlenen indien:

      a. de technische bijstand verleend wordt aan een eindgebruiker in een land van bestemming waarop een wapenembargo
      rust en

      b. de technische bijstand bestemd is voor militaire goederen.

      2 Het eerste lid is niet van toepassing indien de technische bijstand plaatsvindt in de vorm van overdracht van
      informatie die:

      a. voor iedereen beschikbaar is of

      b. fundamenteel wetenschappelijk onderzoek is als bedoeld in door de Raad vastgestelde Gemeenschappelijke EU-lijst
      van militaire goederen (PbEU 2010, C 69).
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden zonder een vergunning van Onze Minister tussenhandeldiensten militaire goederen te verlenen.

      2 Het eerste lid is niet van toepassing op vervoer, financiële diensten, verzekering, herverzekering, algemene
      reclame of algemene promotie met betrekking tot militaire goederen.

      3 Bij ministeriële regeling kan vrijstelling worden verleend van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel10
  - number: '11'
    text: |-
      Het is verboden te handelen in strijd met de artikelen:

      a. 3, eerste lid, en 4, eerste lid, van [verordening 2019/125](32025R2019) voor zover het betreft het verlenen van
      technische bijstand als bedoeld in artikel 2, onderdeel f, van deze verordening;

      b. 6 tot en met 9, 15 en 19 van [verordening 2019/125](32025R2019).
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel11
  - number: '12'
    text: |-
      1 De Nederlandse strafwet is toepasselijk op de Nederlander die zich buiten het Europese deel van Nederland en
      Bonaire, Sint Eustatius en Saba schuldig maakt aan een bij deze wet strafbaar gesteld feit door in strijd te
      handelen met:

      a. de [artikelen 3, eerste lid][ref1], [4, derde en vierde lid][ref2], [5, eerste lid][ref3],
      [6, eerste lid][ref4], [9, eerste lid][ref5], of [10, eerste lid][ref6];

      b. [artikel 4, eerste, lid][ref7], voor zover de Nederlander de tussenhandeldiensten verleent buiten de Europese
      Unie.

      2 De Nederlandse strafwet is toepasselijk op de vreemdeling die in het Europese deel van Nederland een vaste woon-
      of verblijfplaats heeft en zich buiten het Europese deel van Nederland en Bonaire, Sint Eustatius en Saba schuldig
      maakt aan een bij deze wet strafbaar gesteld feit door in strijd te handelen met:

      a. de [artikelen 3, eerste lid][ref8], [4, derde en vierde lid][ref9], [5, eerste lid][ref10],
      [6, eerste lid][ref11], [9, eerste lid][ref12], of [10, eerste lid][ref13];

      b. [artikel 4, eerste lid][ref14], voor zover de vreemdeling de tussenhandeldiensten verleent buiten de Europese
      Unie.


