  - number: '22'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik derde
      land-derde land of tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land
      te verlenen indien degene die deze tussenhandeldiensten verleent door Onze Minister ervan in kennis is gesteld dat
      de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor gebruik in verband met
      de ontwikkeling, de productie, de behandeling, de bediening, het onderhoud, de opslag, de opsporing, de herkenning
      of de verspreiding van chemische, biologische of nucleaire wapens of andere nucleaire explosiemiddelen, of voor
      de ontwikkeling, de productie, het onderhoud of de opslag van raketten die dergelijke wapens naar hun doel kunnen
      voeren.

      2 Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik derde
      land-derde land of tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land
      te verlenen indien degene die deze tussenhandeldiensten verleent door Onze Minister ervan in kennis is gesteld dat
      de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor militair eindgebruik in
      een kopend land of een land van bestemming waarop een wapenembargo rust.

      3 Indien degene die tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land en
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land verleent ervan op
      de hoogte is dat de goederen voor tweeërlei gebruik, bedoeld in het eerste en tweede lid, waarvoor hij voornemens
      is tussenhandeldiensten te verlenen, geheel of gedeeltelijk bestemd zijn voor één van de het eerste lid genoemde
      doeleinden of voor militair eindgebruik als bedoeld in het tweede lid deelt hij dit mede aan Onze Minister.

      4 Het eerste tot en met derde lid zijn niet van toepassing op vervoer, financiële diensten, verzekering,
      herverzekering, algemene reclame of algemene promotie met betrekking tot goederen voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel22
  - number: '23'
    text: |-
      1 Een ieder die voornemens is tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land te verlenen, deelt
      dit mede aan Onze Minister voorafgaand aan de eerste keer dat de tussenhandeldiensten verleend worden.

      2 Een ieder die voornemens is tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land te verlenen, deelt
      wijzigingen van de gegevens die zijn verstrekt in de melding op grond van het eerste lid onverwijld mede aan Onze
      Minister.

      3 Een ieder die voornemens is tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land te verlenen met
      betrekking tot:

      a. een goed voor tweeërlei gebruik genoemd in bijlage II, Sectie I, van de Verordening producten voor tweeërlei
      gebruik of

      b. een goed voor tweeërlei gebruik uit te voeren naar een in een ministeriële regeling aan te wijzen land,

      deelt dit mede aan Onze Minister.

      4 Bij ministeriële regeling worden nadere regels gesteld over de mededeling, bedoeld in het eerste tot en met derde
      lid.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel23
