      [artikel 2.26 van de Douane- en Accijnswet BES][ref2] zonder vergunning verboden is.

      2 Artikel 9 is van toepassing in Bonaire, Sint Eustatius en Saba.

      3 Het is verboden zonder een vergunning van Onze Minister tussenhandeldiensten militaire goederen Bonaire, Sint
      Eustatius en Saba te verlenen.

      4 [Artikel 10, tweede en derde lid][ref3], is van toepassing in Bonaire, Sint Eustatius en Saba.


