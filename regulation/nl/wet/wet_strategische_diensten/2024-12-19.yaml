  - number: '29'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens dit hoofdstuk bepaalde zijn belast de bij besluit van Onze
      Minister, in overeenstemming met Onze Minister van Financiën, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel29
  - number: '30'
    text: |-
      1 Degene die het gestelde bij of krachtens de [artikelen 20][ref1], [21][ref2],
      [22, eerste tot en met derde lid][ref3], [23, eerste tot en met derde lid][ref4], en
      [24, eerste tot en met derde lid][ref5], overtreedt, maakt zich schuldig aan het plegen van een strafbaar feit.

      2 Overtredingen van het gestelde bij of krachtens de [artikelen 20][ref6], [21][ref7],
      [22, eerste tot en met derde lid][ref8], [23, eerste tot en met derde lid][ref9], en
      [24, eerste tot en met derde lid][ref10], zijn misdrijven, voor zover zij opzettelijk zijn begaan. Voor zover deze
      overtredingen geen misdrijven zijn, zijn zij overtredingen.

      3 Voor zover de in het eerste lid strafbaar gestelde feiten misdrijven zijn wordt een overtreding gestraft met een
      gevangenisstraf van ten hoogste zes jaar of een geldboete van de vijfde categorie.

      4 Voor zover de in het eerste lid strafbaar gestelde feiten overtredingen zijn wordt een overtreding gestraft met
      een gevangenisstraf van ten hoogste een jaar of een geldboete van de vierde categorie.

      5 Met de opsporing van de strafbare feiten, bedoeld in het eerste lid, zijn belast:

      a. de bij of krachtens [artikel 184 Wetboek van Strafvordering BES][ref11] aangewezen ambtenaren;

      b. de door Onze Minister, in overeenstemming met Onze Minister wie het mede aangaat, aangewezen ambtenaren;

      c. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.

      6 Van een besluit als bedoeld in het vijfde lid, onderdeel b, wordt mededeling gedaan door plaatsing in de
      Staatscourant.


