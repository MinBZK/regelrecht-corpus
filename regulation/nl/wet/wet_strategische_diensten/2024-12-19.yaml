  - number: '26'
    text: |-
      1 Degene die activiteiten verricht die bij of krachtens dit hoofdstuk verboden of zonder vergunning verboden zijn,
      is gehouden op zodanige wijze een administratie te voeren en de daartoe behorende gegevensdragers of de inhoud
      daarvan op zodanige wijze te bewaren, dat te allen tijde zijn rechten en verplichtingen uit hoofde van deze wet
      duidelijk blijken.

      2 Degene die activiteiten verricht die bij of krachtens dit hoofdstuk verboden of zonder vergunning verboden zijn,
      is gehouden de tot een administratie behorende gegevensdrager of de inhoud daarvan waarvan de raadpleging van
      belang kan zijn voor de toepassing van de wettelijke regelingen, gedurende ten minste zeven jaren te bewaren.

      3 De administratie moet zodanig zijn ingericht en worden gevoerd en de gegevensdragers of de inhoud daarvan moeten
      op zodanige wijze worden bewaard, dat het uitvoeren van de controle daarvan binnen een redelijke termijn mogelijk
      is.

      4 De administratie behoort te worden gevoerd in het Nederlands, Papiaments of Engels met gebruikmaking van de
      daarbij gebruikelijke cijfers.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel26
  - number: '27'
    text: |-
      De boeken, bescheiden en andere gegevensdragers van een ontbonden rechtspersoon moeten worden bewaard gedurende
      zeven jaren nadat de rechtspersoon heeft opgehouden te bestaan. Bewaarder is degene die bij of krachtens de
      statuten, dan wel door de algemene vergadering of, als de rechtspersoon een stichting was, door het bestuur als
      zodanig is aangewezen.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel27
  - number: '28'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] en de [artikelen 16][ref2] en [17][ref3] zijn van
      overeenkomstige toepassing in Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel16
