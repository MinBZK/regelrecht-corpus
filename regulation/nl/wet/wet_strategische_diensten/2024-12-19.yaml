  - number: '2'
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 3, eerste lid, 4, eerste, tweede en derde lid, 5, eerste,
      tweede en derde lid, 7, 8, en 27, eerste en derde lid, van de Verordening producten voor tweeërlei gebruik voor
      zover het betreft de overdracht van programmatuur of technologie, bedoeld in artikel 2, tweede lid, onderdeel d,
      van deze verordening.

      2 Het is verboden te handelen in strijd met de artikelen 11, eerste, tweede en negende lid, en 27, vierde lid,
      van de Verordening producten voor tweeërlei gebruik voor zover het betreft de overdracht van programmatuur of
      technologie, bedoeld in artikel 2, tweede lid, onderdeel d, van deze verordening.

      3 Onze Minister is de bevoegde autoriteit, bedoeld in de artikelen 4, eerste en tweede lid, 7, 11, eerste lid, 12,
      tweede tot en met zevende lid, 13, eerste, derde en vierde lid, 14, eerste lid, 16, eerste, tweede en vierde lid,
      en 21, vierde lid, van de Verordening producten voor tweeërlei gebruik, voor zover het betreft de overdracht van
      programmatuur of technologie, bedoeld in artikel 2, tweede lid, onderdeel d, van deze verordening.

      4 Als Onze Minister bij beschikking, bedoeld in artikel 4, eerste lid, van de Verordening producten voor tweeërlei
      gebruik, heeft bepaald dat de overdracht van daarbij aangewezen programmatuur of technologie, bedoeld in artikel 2,
      tweede lid, onderdeel d, van deze verordening, zonder vergunning is verboden, is de adressant van deze beschikking
      verplicht onder opgave van redenen van deze gewijzigde bestemming mededeling te doen aan Onze Minister, zodra voor
      hem aannemelijk is dat de desbetreffende programmatuur en technologie een andere bestemming zullen krijgen dan in
      de beschikking is vermeld.

      5 Bij ministeriële regeling kan Onze Minister om redenen van openbare veiligheid, waaronder het voorkomen van
      terreurdaden, of uit mensenrechtenoverwegingen een verbod instellen of een vergunning verplicht stellen als bedoeld
      in artikel 9, eerste lid, van de Verordening producten voor tweeërlei gebruik voor zover het betreft de overdracht
      van programmatuur of technologie, bedoeld in artikel 2, tweede lid, onderdeel d, van deze verordening.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden technische bijstand te verlenen indien deze bijstand verband houdt met de ontwikkeling, de
      productie, de behandeling, de bediening, het onderhoud, de opslag, de opsporing, de herkenning of de verspreiding
      van chemische, biologische of nucleaire wapens of andere nucleaire explosiemiddelen, of voor de ontwikkeling, de
      productie, het onderhoud of de opslag van raketten die dergelijke wapens naar hun doel kunnen voeren.

      2 Het verbod, bedoeld in het eerste lid, geldt niet als één van de gronden, bedoeld in artikel 8, derde lid, van de
      Verordening producten voor tweeërlei gebruik, van toepassing is.

      3 Onze Minister kan op aanvraag ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 6, eerste tot en met vierde lid, 8, eerste, tweede, vierde
      en vijfde lid, en 27, tweede en derde lid, van de Verordening producten voor tweeërlei gebruik.

      2 Onze Minister is de bevoegde autoriteit, bedoeld in de artikelen 6, eerste tot en met vierde lid, 8, eerste,
      tweede, vierde en vijfde lid, 13, eerste, derde en vierde lid, en 16, eerste, tweede en vierde lid, van de
      Verordening producten voor tweeërlei gebruik.

      3 Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten als bedoeld in artikel 2, zevende lid,
      van de Verordening producten voor tweeërlei gebruik te verlenen indien:

      a. deze betrekking hebben op goederen voor tweeërlei gebruik die niet zijn genoemd in bijlage I van deze
      verordening, en

      b. de tussenhandelaar door Onze Minister ervan in kennis is gesteld dat de goederen voor tweeërlei gebruik, bedoeld
      in onderdeel a, geheel of gedeeltelijk bestemd zijn of kunnen zijn voor één van de doeleinden, bedoeld in artikel
      4, eerste lid, onderdeel a, van deze verordening.

      4 Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten als bedoeld in artikel 2, zevende lid,
      van de Verordening producten voor tweeërlei gebruik te verlenen indien:

      a. deze betrekking hebben op goederen voor tweeërlei gebruik, en

      b. de tussenhandelaar door Onze Minister ervan in kennis is gesteld dat de goederen voor tweeërlei gebruik geheel
      of gedeeltelijk bestemd zijn of kunnen zijn voor militair eindgebruik in een land van bestemming als bedoeld in
      artikel 4, eerste lid, onderdeel b, van deze verordening.

      5 Als een tussenhandelaar ervan op de hoogte is dat de goederen voor tweeërlei gebruik, bedoeld in het derde lid,
      onderdeel a, of vierde lid, onderdeel a, waarvoor hij voornemens is tussenhandeldiensten te verlenen, geheel of
      gedeeltelijk bestemd zijn voor één van de voor doeleinden, bedoeld in artikel 4, eerste lid, onderdeel a, van de
      Verordening producten voor tweeërlei gebruik of voor militair eindgebruik in een land van bestemming als bedoeld in
      artikel 4, eerste lid, onderdeel b, van deze verordening, deelt hij dit mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik derde
      land-derde land te verlenen indien een Nederlander of een vreemdeling die in het Europese deel van Nederland een
      vaste woon- of verblijfplaats heeft deze tussenhandeldiensten verleent, zich niet in de Europese Unie en Bonaire,
      Sint Eustatius en Saba bevindt en door Onze Minister ervan in kennis is gesteld dat:

      a. de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor één van de
      doeleinden, bedoeld in artikel 4, eerste lid, onderdeel a, van de Verordening producten voor tweeërlei gebruik;

      b. de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor militair eindgebruik
      in een land van bestemming als bedoeld in artikel 4, eerste lid, onderdeel b, van de Verordening producten voor
      tweeërlei gebruik.

      2 Indien degene die tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land verleent ervan op de
      hoogte is dat de goederen voor tweeërlei gebruikwaarvoor hij voornemens is deze tussenhandeldiensten te verlenen,
      geheel of gedeeltelijk bestemd zijn voor één van de doeleinden, bedoeld in artikel 4, eerste lid, onderdeel a,
      van de Verordening producten voor tweeërlei gebruik of voor militair eindgebruik in een land van bestemming als
      bedoeld in artikel 4, eerste lid, onderdeel b, van de Verordening voor tweeërlei gebruik, deelt hij dit mede aan
      Onze Minister.

      3 Het eerste en tweede lid zijn niet van toepassing op vervoer, financiële diensten, verzekering, herverzekering,
      algemene reclame of promotie met betrekking tot goederen voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel5
  - number: '6'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik EU-
      derde land te verlenen indien degene die deze tussenhandeldiensten verleent door Onze Minister ervan in kennis is
      gesteld dat de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor één van de
      doeleinden, bedoeld in artikel 4, eerste lid, onderdeel a, van de Verordening producten voor tweeërlei gebruik.

      2 Indien degene die tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land verleent ervan op de hoogte
      is dat de goederen voor tweeërlei gebruikwaarvoor hij voornemens is deze tussenhandeldiensten te verlenen, geheel
      of gedeeltelijk bestemd zijn voor één van de doeleinden, bedoeld in artikel 4, eerste lid, onderdeel a, van de
      Verordening producten voor tweeërlei gebruik deelt hij dit mede aan Onze Minister.

      3 Het eerste en tweede lid zijn niet van toepassing op vervoer, financiële diensten, verzekering, herverzekering,
      algemene reclame of promotie met betrekking tot goederen voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel6
  - number: '7'
    text: |-
      1 Een ieder die voornemens is tussenhandeldiensten als bedoeld in artikel 2, zevende lid, van de Verordening
      producten voor tweeërlei gebruik, tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land te verlenen, deelt dit mede aan Onze Minister
      voorafgaand aan de eerste keer dat de tussenhandeldiensten verleend worden.

      2 Een ieder die voornemens is tussenhandeldiensten als bedoeld in artikel 2, zevende lid, van de Verordening
      producten voor tweeërlei gebruik, tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land te verlenen, deelt wijzigingen van de gegevens
      die zijn verstrekt in de melding op grond van het eerste lid onverwijld mede aan Onze Minister.

      3 Een ieder die voornemens is tussenhandeldiensten als bedoeld in artikel 2, zevende lid, van de Verordening
      producten voor tweeërlei gebruik, tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land, of
      tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land te verlenen met betrekking tot:

      a. een goed voor tweeërlei gebruik genoemd in bijlage II, Sectie I, van de Verordening producten voor tweeërlei
      gebruik of

      b. een goed voor tweeërlei gebruik uit te voeren naar een in een ministeriële regeling aan te wijzen land,

      deelt dit mede aan Onze Minister.

      4 Bij ministeriële regeling worden nadere regels gesteld over de mededeling, bedoeld in het eerste tot en met derde
      lid.
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel7
  - number: '8'
    text: |-
      Het is verboden zonder vergunning van Onze Minister militaire programmatuur of militaire technologie met betrekking
      tot militaire goederen door middel van elektronische media over te dragen of beschikbaar te stellen indien:

      a. het militaire programmatuur of militaire technologie betreft waarvan de uitvoer als militair goed krachtens
      [artikel 3:1 van de Algemene douanewet][ref1] zonder vergunning verboden is;

      b. het mondelinge overdracht van militaire technologie betreft die via de telefoon wordt beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel31
    url: https://wetten.overheid.nl/BWBR0030545/2024-12-19#Artikel8
