        paragraaf: '1'
  - number: '19.2'
    text: De bepalingen in dit hoofdstuk zijn van toepassing in Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister programmatuur of technologie door middel van elektronische
      media met betrekking tot goederen voor tweeërlei gebruik die zijn genoemd in bijlage I van [verordening 428/2009]
      (32009R0428) over te dragen naar een bestemming buiten Bonaire, Sint Eustatius en Saba en het Europese deel van
      Nederland.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: '20.2'
    text: |-
      Het is verboden zonder vergunning van Onze Minister programmatuur of technologie door middel van elektronische
      media met betrekking tot goederen voor tweeërlei gebruik die niet zijn genoemd in bijlage I van [verordening
      428/2009](32009R0428) over te dragen naar een bestemming buiten Bonaire, Sint Eustatius en Saba en het Europese
      deel van Nederland indien degene die de programmatuur of technologie overdraagt door Onze Minister ervan in kennis
      is gesteld dat de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: 20.2.a
    text: |-
      gebruik in verband met de ontwikkeling, de productie, de behandeling, de bediening, het onderhoud, de opslag, de
      opsporing, de herkenning of de verspreiding van chemische, biologische of nucleaire wapens of andere nucleaire
      explosiemiddelen, of voor de ontwikkeling, de productie, het onderhoud of de opslag van raketten die dergelijke
      wapens naar hun doel kunnen voeren,
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: 20.2.b
    text: militair eindgebruik in een kopend land of een land van bestemming waarop een wapenembargo rust of
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: 20.2.c
    text: |-
      het gebruik als onderdelen of componenten van militaire goederen die vanuit Bonaire, Sint Eustatius of Saba zijn
      uitgevoerd zonder vergunning of met schending van de voorgeschreven vergunning.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: '20.3'
    text: |-
      Indien degene die programmatuur of technologie overdraagt door middel van elektronische media er kennis van draagt
      dat de programmatuur of technologie betrekking hebben op goederen voor tweeërlei gebruik die niet zijn genoemd in
      bijlage I van [verordening 428/2009](32009R0428), geheel of ten dele bestemd zijn voor een van de in het tweede lid
      genoemde doeleinden, deelt hij dit mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: '20.4'
    text: |-
      Indien Onze Minister bij beschikking heeft bepaald dat de overdracht van daarbij aangewezen programmatuur of
      technologie zonder vergunning is verboden, is de adressant van deze beschikking, zodra voor hem aannemelijk is
      dat de desbetreffende programmatuur en technologie een andere bestemming zullen krijgen dan in de beschikking is
      vermeld, verplicht onder opgave van redenen van deze gewijzigde bestemming mededeling te doen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel20
  - number: '21'
    text: |-
      [Artikel 3][ref1] is van toepassing in Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel3
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik derde
      land-derde land of tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land
      te verlenen indien degene die deze tussenhandeldiensten verleent door Onze Minister ervan in kennis is gesteld dat
      de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor gebruik in verband met
      de ontwikkeling, de productie, de behandeling, de bediening, het onderhoud, de opslag, de opsporing, de herkenning
      of de verspreiding van chemische, biologische of nucleaire wapens of andere nucleaire explosiemiddelen, of voor
      de ontwikkeling, de productie, het onderhoud of de opslag van raketten die dergelijke wapens naar hun doel kunnen
      voeren.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel22
  - number: '22.2'
    text: |-
      Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik derde
      land-derde land of tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land
      te verlenen indien degene die deze tussenhandeldiensten verleent door Onze Minister ervan in kennis is gesteld dat
      de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor militair eindgebruik in
      een kopend land of een land van bestemming waarop een wapenembargo rust.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel22
  - number: '22.3'
    text: |-
      Indien degene die tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land en
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land verleent ervan op
      de hoogte is dat de goederen voor tweeërlei gebruik, bedoeld in het eerste en tweede lid, waarvoor hij voornemens
      is tussenhandeldiensten te verlenen, geheel of gedeeltelijk bestemd zijn voor één van de het eerste lid genoemde
      doeleinden of voor militair eindgebruik als bedoeld in het tweede lid deelt hij dit mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel22
  - number: '22.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op vervoer, financiële diensten, verzekering,
      herverzekering, algemene reclame of algemene promotie met betrekking tot goederen voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel22
  - number: '23.1'
    text: |-
      Een ieder die voornemens is tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land te verlenen, deelt
      dit mede aan Onze Minister voorafgaand aan de eerste keer dat de tussenhandeldiensten verleend worden.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel23
  - number: '23.2'
    text: |-
      Een ieder die voornemens is tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land te verlenen, deelt
      wijzigingen van de gegevens die zijn verstrekt in de melding op grond van het eerste lid onverwijld mede aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel23
  - number: '23.3'
    text: |-
      Een ieder die voornemens is tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of
      tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land te verlenen met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel23
  - number: 23.3.a
    text: een goed voor tweeërlei gebruik genoemd in deel 2 van bijlage II van [verordening 428/2009](32009R0428) of
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel23
  - number: 23.3.b
    text: een goed voor tweeërlei gebruik uit te voeren naar een in een ministeriële regeling aan te wijzen land,
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel23
  - number: '23.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de mededeling, bedoeld in het eerste tot en met derde
      lid.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel23
  - number: '24.1'
    text: |-
      [Artikel 8][ref1] is van toepassing in Bonaire, Sint Eustatius en Saba met dien verstande dat in onderdeel
      a het militaire programmatuur of technologie betreft waarvan de uitvoer als militair goed krachtens
      [artikel 2.26 van de Douane- en Accijnswet BES][ref2] zonder vergunning verboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029236#Artikel2
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0029236
        artikel: '2'
  - number: '24.2'
    text: Artikel 9 is van toepassing in Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel24
  - number: '24.3'
    text: |-
      Het is verboden zonder een vergunning van Onze Minister tussenhandeldiensten militaire goederen Bonaire, Sint
      Eustatius en Saba te verlenen.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel24
  - number: '24.4'
    text: |-
      [Artikel 10, tweede en derde lid][ref1], is van toepassing in Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel10
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      Onze Minister kan aan een vergunning als bedoeld in de [artikelen 20, eerste en tweede lid][ref1],
      [22, eerste en tweede lid][ref2], [24, derde lid][ref3], een ontheffing verleend op grond van [artikel 21][ref4],
      en aan een vergunning verleend op grond van artikel 24, eerste lid, voorschriften en voorwaarden verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0030545#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0030545#Artikel21
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030545
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030545
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0030545
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Ten aanzien van de vergunningverlening is [artikel 14, tweede lid][ref1], van toepassing in Bonaire, Sint Eustatius
      en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel14
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '25.3'
    text: |-
      Een vergunning als bedoeld in [artikel 24, eerste en derde lid][ref1], wordt in ieder geval geweigerd voor zover
      dit voortvloeit uit internationale verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel24
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '26.1'
    text: |-
      Degene die activiteiten verricht die bij of krachtens dit hoofdstuk verboden of zonder vergunning verboden zijn, is
      gehouden op zodanige wijze een administratie te voeren en de daartoe behorende gegevensdragers of de inhoud daarvan
      op zodanige wijze te bewaren, dat te allen tijde zijn rechten en verplichtingen uit hoofde van deze wet duidelijk
      blijken.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel26
  - number: '26.2'
    text: |-
      Degene die activiteiten verricht die bij of krachtens dit hoofdstuk verboden of zonder vergunning verboden zijn, is
      gehouden de tot een administratie behorende gegevensdrager of de inhoud daarvan waarvan de raadpleging van belang
      kan zijn voor de toepassing van de wettelijke regelingen, gedurende ten minste zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel26
  - number: '26.3'
    text: |-
      De administratie moet zodanig zijn ingericht en worden gevoerd en de gegevensdragers of de inhoud daarvan moeten op
      zodanige wijze worden bewaard, dat het uitvoeren van de controle daarvan binnen een redelijke termijn mogelijk is.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel26
  - number: '26.4'
    text: |-
      De administratie behoort te worden gevoerd in het Nederlands, Papiaments of Engels met gebruikmaking van de daarbij
      gebruikelijke cijfers.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel26
  - number: '27'
    text: |-
      De boeken, bescheiden en andere gegevensdragers van een ontbonden rechtspersoon moeten worden bewaard gedurende
      zeven jaren nadat de rechtspersoon heeft opgehouden te bestaan. Bewaarder is degene die bij of krachtens de
      statuten, dan wel door de algemene vergadering of, als de rechtspersoon een stichting was, door het bestuur als
      zodanig is aangewezen.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel27
  - number: '28'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] en de [artikelen 16][ref2] en [17][ref3] zijn van
      overeenkomstige toepassing in Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030545#Artikel17
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0030545
        artikel: '16'
        hoofdstuk: '1'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0030545
        artikel: '17'
        hoofdstuk: '1'
        paragraaf: '8'
  - number: '29'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens dit hoofdstuk bepaalde zijn belast de bij besluit van Onze
      Minister, in overeenstemming met Onze Minister van Financiën, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel29
  - number: '30.1'
    text: |-
      Degene die het gestelde bij of krachtens de [artikelen 20][ref1], [21][ref2],
      [22, eerste tot en met derde lid][ref3], [23, eerste tot en met derde lid][ref4], en
      [24, eerste tot en met derde lid][ref5], overtreedt, maakt zich schuldig aan het plegen van een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0030545#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0030545#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0030545#Artikel24
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030545
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030545
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0030545
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0030545
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '30.2'
    text: |-
      Overtredingen van het gestelde bij of krachtens de [artikelen 20][ref1], [21][ref2],
      [22, eerste tot en met derde lid][ref3], [23, eerste tot en met derde lid][ref4], en
      [24, eerste tot en met derde lid][ref5], zijn misdrijven, voor zover zij opzettelijk zijn begaan. Voor zover deze
      overtredingen geen misdrijven zijn, zijn zij overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0030545#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0030545#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0030545#Artikel24
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030545
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030545
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0030545
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0030545
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '30.3'
    text: |-
      Voor zover de in het eerste lid strafbaar gestelde feiten misdrijven zijn wordt een overtreding gestraft met een
      gevangenisstraf van ten hoogste zes jaar of een geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
  - number: '30.4'
    text: |-
      Voor zover de in het eerste lid strafbaar gestelde feiten overtredingen zijn wordt een overtreding gestraft met een
      gevangenisstraf van ten hoogste een jaar of een geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
  - number: '30.5'
    text: 'Met de opsporing van de strafbare feiten, bedoeld in het eerste lid, zijn belast:'
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
  - number: 30.5.a
    text: |-
      de bij of krachtens [artikel 184 Wetboek van Strafvordering BES][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 30.5.b
    text: de door Onze Minister, in overeenstemming met Onze Minister wie het mede aangaat, aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
  - number: 30.5.c
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
  - number: '30.6'
    text: |-
      Van een besluit als bedoeld in het vijfde lid, onderdeel b, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel30
  - number: '31'
    text: |-
      De strafwet van Bonaire, Sint Eustatius en Saba is toepasselijk op de vreemdeling die in Bonaire, Sint Eustatius
      of Saba een vaste woon- of verblijfplaats heeft en zich buiten Bonaire, Sint Eustatius en Saba en het Europese
      deel van Nederland, schuldig maakt aan een bij deze wet strafbaar gesteld feit door in strijd te handelen met de
      [artikelen 20][ref1], [21][ref2], [22, eerste tot en met derde lid][ref3], [23, eerste tot en met derde lid][ref4],
      en [24, eerste tot en met derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0030545#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0030545#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0030545#Artikel24
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030545
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0030545
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0030545
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0030545
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '35'
    text: |-
      Degene die tussenhandeldiensten als bedoeld in [artikel 7, eerste lid][ref1], of tussenhandeldiensten als bedoeld
      in [artikel 23, eerste lid][ref2], verleent op het moment waarop deze wet in werking treedt, deelt dit binnen zes
      maanden na inwerkingtreding van deze wet aan Onze Minister mede.


      [ref1]: https://wetten.overheid.nl/BWBR0030545#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel23
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030545
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030545
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36'
    text: |-
      Het [Besluit financieel verkeer strategische goederen 1996][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008298
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008298
  - number: '37'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen en
