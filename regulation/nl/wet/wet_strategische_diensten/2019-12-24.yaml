  - number: '14.2'
    text: 'Ten aanzien van de vergunningverlening worden bij ministeriële regeling nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel14
  - number: 14.2.a
    text: de wijze waarop en door wie een vergunning wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel14
  - number: 14.2.b
    text: de aard van de vergunning;
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel14
  - number: 14.2.c
    text: de voorschriften en voorwaarden die aan de vergunning verbonden kunnen worden.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel14
  - number: '14.3'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '14.4'
    text: |-
      De vergunning kan ook worden geweigerd, dan wel ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1]. Voordat toepassing
      wordt gegeven aan de vorige volzin, kan het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur,
      bedoeld in [artikel 8 van die wet][ref2], om een advies als bedoeld in [artikel 9 van die wet][ref3] worden
      gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel14
    references:
