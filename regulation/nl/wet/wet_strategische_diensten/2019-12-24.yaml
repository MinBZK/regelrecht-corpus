preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, om regels te stellen inzake de controle op diensten
    die betrekking hebben op strategische goederen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *goederen voor tweeërlei gebruik:*
      producten voor tweeërlei gebruik als bedoeld in artikel 2, eerste lid, van [verordening 428/2009](32009R0428);
        - *militair eindgebruik:* militair eindgebruik als bedoeld in artikel 4, tweede lid, van [verordening 428/2009]
      (32009R0428);
        - *militaire goederen:* de krachtens [artikel 3:1 van de Algemene douanewet aangewezen][ref1] militaire goederen;
        - *militaire programmatuur:* programmatuur als bedoeld in de door de Raad van de Europese Unie vastgestelde
      Gemeenschappelijke EU-lijst van militaire goederen (PbEU 2010, C 69);
        - *militaire technologie:* technologie als bedoeld in de door de Raad van de Europese Unie vastgestelde
      Gemeenschappelijke EU-lijst van militaire goederen (PbEU 2010, C 69);
        - *Onze Minister:* Onze Minister van Buitenlandse Zaken;
        - *technische bijstand:* de technische ondersteuning in verband met reparaties, ontwikkeling, productie,
      assemblage, testen, onderhoud, of een andere technische dienst, die in ieder geval de vorm kan aannemen van
      instructies, training, overdracht van praktische kennis of vaardigheden of adviesdiensten;
        - *tussenhandelaar:* tussenhandelaar als bedoeld in artikel 2, zesde lid, van [verordening 428/2009](32009R0428);
        - *tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land:* a. het onderhandelen over of
      regelen van overeenkomsten met het oog op de koop, verkoop of levering van goederen voor tweeërlei gebruik die zich
      niet in de Europese Unie bevinden en niet bestemd zijn voor invoer in de Europese Unie of Bonaire, Sint Eustatius
      of Saba; b. het ten behoeve van één of meer partijen verkopen of kopen van goederen voor tweeërlei gebruik die zich
      niet in de Europese Unie bevinden en niet bestemd zijn voor invoer in de Europese Unie of Bonaire, Sint Eustatius
      of Saba;
        - *tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land:* a. het onderhandelen over of regelen
      van overeenkomsten met het oog op de koop, verkoop of levering van goederen voor tweeërlei gebruik die zich in
      de Europese Unie bevinden en bestemd zijn voor uitvoer uit de Europese Unie; b. het ten behoeve van één of meer
      partijen verkopen of kopen van goederen voor tweeërlei gebruik die zich in de Europese Unie bevinden en bestemd
      zijn voor uitvoer uit de Europese Unie;
        - *tussenhandeldiensten militaire goederen:* a. het onderhandelen over of regelen van overeenkomsten met het oog
      op de koop, verkoop of levering van militaire goederen die zich niet in het Europese deel van Nederland en Bonaire,
      Sint Eustatius en Saba bevinden en niet bestemd zijn voor invoer in het Europese deel van Nederland of Bonaire,
      Sint Eustatius of Saba; b. het ten behoeve van één of meer partijen verkopen of kopen van militaire goederen die
      zich niet in het Europese deel van Nederland en Bonaire, Sint Eustatius en Saba bevinden en niet bestemd zijn voor
      invoer in het Europese deel van Nederland of Bonaire, Sint Eustatius of Saba;
        - *verordening 2019/125:* de verordening (EU) 2019/125 van het Europees Parlement en de Raad van 16 januari 2019
      met betrekking tot de handel in bepaalde goederen die gebruikt zouden kunnen worden voor de doodstraf, foltering of
      andere wrede, onmenselijke of onterende behandeling of bestraffing (PbEU 2019, L 30);
        - *verordening 428/2009:* de [verordening (EG) nr. 428/2009](32009R0428) van de Raad 5 mei 2009 tot instelling
      van een communautaire regeling voor controle op de uitvoer, de overbrenging, de tussenhandel en de doorvoer van
      producten voor tweeërlei gebruik (PbEU 2009, L 134);
        - *wapenembargo:* een wapenembargo ingesteld in een door de Raad van de Europese Unie vastgesteld gemeenschappelijk
      standpunt of gemeenschappelijk optreden, een besluit van de Organisatie voor Veiligheid en Samenwerking in Europa
      of een resolutie van de Veiligheidsraad van de Verenigde Naties.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
  - number: '1.2'
    text: De bepalingen in dit hoofdstuk zijn van toepassing in het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden te handelen in strijd met de artikelen 3, eerste lid, 4, eerste tot en met vierde lid, en 20,
      eerste en derde lid, van [verordening 428/2009](32009R0428) voor zover het betreft de overdracht van programmatuur
      of technologie, bedoeld in artikel 2, tweede lid, onder iii, van [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden te handelen in strijd met artikel 22, eerste, achtste en tiende lid, van [verordening 428/2009]
      (32009R0428) voor zover het betreft de overdracht van programmatuur of technologie, bedoeld in artikel 2, tweede
      lid, onder iii, van [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister wordt aangewezen als bevoegde autoriteit, bedoeld in de artikelen 4, eerste lid, 9, tweede lid,
      11, eerste lid, 13, eerste, tweede en vijfde lid, en 16, vierde lid, van [verordening 428/2009](32009R0428), voor
      zover het betreft de overdracht van programmatuur of technologie, bedoeld in artikel 2, tweede lid, onder iii, van
      [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel2
  - number: '2.4'
    text: |-
      Indien Onze Minister bij beschikking, bedoeld in artikel 4, eerste tot en met derde lid, van [verordening 428/2009]
      (32009R0428), heeft bepaald dat de overdracht van daarbij aangewezen programmatuur of technologie, bedoeld in
      artikel 2, tweede lid, onder iii, van [verordening 428/2009](32009R0428) zonder vergunning is verboden, is de
      adressant van deze beschikking, zodra voor hem aannemelijk is dat de desbetreffende programmatuur en technologie
      een andere bestemming zullen krijgen dan in de beschikking is vermeld, verplicht onder opgave van redenen van deze
      gewijzigde bestemming mededeling te doen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden technische bijstand te verlenen indien deze bijstand verband houdt met de ontwikkeling, de
      productie, de behandeling, de bediening, het onderhoud, de opslag, de opsporing, de herkenning of de verspreiding
      van chemische, biologische of nucleaire wapens of andere nucleaire explosiemiddelen, of voor de ontwikkeling, de
      productie, het onderhoud of de opslag van raketten die dergelijke wapens naar hun doel kunnen voeren.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: '3.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: 3.2.a
    text: |-
      het op grond van [verordening 428/2009](32009R0428) verboden is zonder vergunning technische bijstand te verlenen
      als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: 3.2.b
    text: 'de technische bijstand plaatsvindt in de vorm van overdracht van informatie die:'
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: 3.2.b.1°
    text: voor iedereen beschikbaar is of
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: 3.2.b.2°
    text: fundamenteel wetenschappelijk onderzoek is als bedoeld in [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: '3.3'
    text: Onze Minister kan op aanvraag ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden te handelen in strijd met de artikelen 5, eerste lid, en 20, tweede en derde lid, van [verordening
      428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister wordt aangewezen als bevoegde autoriteit, bedoeld in artikelen 5, eerste lid, 10, eerste en tweede
      lid, en 13, eerste, tweede en vijfde lid, van [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten als bedoeld in artikel 2, vijfde lid, van
      [verordening 428/2009](32009R0428) te verlenen indien:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: 4.3.a
    text: |-
      deze betrekking hebben op goederen voor tweeërlei gebruik die niet zijn genoemd in bijlage I van [verordening
      428/2009](32009R0428) en
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: 4.3.b
    text: |-
      de tussenhandelaar door Onze Minister ervan in kennis is gesteld dat de goederen voor tweeërlei gebruik, bedoeld
      in onderdeel a, geheel of gedeeltelijk bestemd zijn of kunnen zijn voor één van de in artikel 4, eerste lid, van
      [verordening 428/2009](32009R0428) genoemde doeleinden.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: '4.4'
    text: |-
      Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten als bedoeld in artikel 2, vijfde lid, van
      [verordening 428/2009](32009R0428) te verlenen indien:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: 4.4.a
    text: deze betrekking hebben opgoederen voor tweeërlei gebruiken
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: 4.4.b
    text: |-
      de tussenhandelaar door Onze Minister ervan in kennis is gesteld dat de goederen voor tweeërlei gebruik geheel
      of gedeeltelijk bestemd zijn of kunnen zijn voor militair eindgebruik in een land van bestemming als bedoeld in
      artikel 4, tweede lid, van [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: '4.5'
    text: |-
      Indien een tussenhandelaar ervan op de hoogte is dat de goederen voor tweeërlei gebruik, bedoeld in het derde lid,
      onderdeel a, of vierde lid, onderdeel a, waarvoor hij voornemens is tussenhandeldiensten te verlenen, geheel of
      gedeeltelijk bestemd zijn voor één van de in artikel 4, eerste lid, van [verordening 428/2009](32009R0428) genoemde
      doeleinden of voor militair eindgebruik in een land van bestemming als bedoeld in artikel 4, tweede lid, van
      [verordening 428/2009](32009R0428), deelt hij dit mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik derde
      land-derde land te verlenen indien een Nederlander of een vreemdeling die in het Europese deel van Nederland een
      vaste woon- of verblijfplaats heeft deze tussenhandeldiensten verleent, zich niet in de Europese Unie en Bonaire,
      Sint Eustatius en Saba bevindt en door Onze Minister ervan in kennis is gesteld dat:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel5
  - number: 5.1.a
    text: |-
      de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor één van de in artikel 4,
      eerste lid, van [verordening 428/2009](32009R0428) genoemde doeleinden;
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel5
  - number: 5.1.b
    text: |-
      de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor militair eindgebruik in
      een land van bestemming als bedoeld in artikel 4, tweede lid, van [verordening 428/2009](32009R0428).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel5
  - number: '5.2'
    text: |-
      Indien degene die tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land verleent ervan
      op de hoogte is dat de goederen voor tweeërlei gebruikwaarvoor hij voornemens is deze tussenhandeldiensten te
      verlenen, geheel of gedeeltelijk bestemd zijn voor één van de in artikel 4, eerste lid, van [verordening 428/2009]
      (32009R0428) genoemde doeleinden of voor militair eindgebruik in een land van bestemming als bedoeld in artikel 4,
      tweede lid, van [verordening 428/2009](32009R0428), deelt hij dit mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel5
  - number: '5.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op vervoer, financiële diensten, verzekering, herverzekering,
      algemene reclame of algemene promotie met betrekking tot goederen voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel5
  - number: '6.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde
      land te verlenen indien degene die deze tussenhandeldiensten verleent door Onze Minister ervan in kennis is gesteld
      dat de goederen voor tweeërlei gebruik geheel of gedeeltelijk bestemd zijn of kunnen zijn voor één van de in
      artikel 4, eerste lid, van [verordening 428/2009](32009R0428) genoemde doeleinden.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel6
  - number: '6.2'
    text: |-
      Indien degene die tussenhandeldiensten goederen voor tweeërlei gebruik EU-derde land verleent ervan op de hoogte is
      dat de goederen voor tweeërlei gebruikwaarvoor hij voornemens is deze tussenhandeldiensten te verlenen, geheel of
      gedeeltelijk bestemd zijn voor één van de in artikel 4, eerste lid, van [verordening 428/2009](32009R0428) genoemde
      doeleinden deelt hij dit mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel6
  - number: '6.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op vervoer, financiële diensten, verzekering, herverzekering,
      algemene reclame of algemene promotie met betrekking tot goederen voor tweeërlei gebruik.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel6
  - number: '7.1'
    text: |-
      Een ieder die voornemens is tussenhandeldiensten als bedoeld in artikel 2, vijfde lid, van [verordening 428/2009]
      (32009R0428), tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of tussenhandeldiensten
      goederen voor tweeërlei gebruik EU-derde land te verlenen, deelt dit mede aan Onze Minister voorafgaand aan de
      eerste keer dat de tussenhandeldiensten verleend worden.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel7
  - number: '7.2'
    text: |-
      Een ieder die voornemens is tussenhandeldiensten als bedoeld in artikel 2, vijfde lid, van [verordening 428/2009]
      (32009R0428), tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land of tussenhandeldiensten
      goederen voor tweeërlei gebruik EU-derde land te verlenen, deelt wijzigingen van de gegevens die zijn verstrekt in
      de melding op grond van het eerste lid onverwijld mede aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel7
  - number: '7.3'
    text: |-
      Een ieder die voornemens is tussenhandeldiensten als bedoeld in artikel 2, vijfde lid van [verordening 428/2009]
      (32009R0428), tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land, of tussenhandeldiensten
      goederen voor tweeërlei gebruik EU-derde land te verlenen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel7
  - number: 7.3.a
    text: een goed voor tweeërlei gebruik genoemd in deel 2 van bijlage II van [verordening 428/2009](32009R0428) of
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel7
  - number: 7.3.b
    text: een goed voor tweeërlei gebruik uit te voeren naar een in een ministeriële regeling aan te wijzen land,
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel7
  - number: '7.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de mededeling, bedoeld in het eerste tot en met derde
      lid.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel7
  - number: '8'
    text: |-
      Het is verboden zonder vergunning van Onze Minister militaire programmatuur of militaire technologie met betrekking
      tot militaire goederen door middel van elektronische media over te dragen of beschikbaar te stellen indien:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel8
  - number: 8.a
    text: |-
      het militaire programmatuur of militaire technologie betreft waarvan de uitvoer als militair goed krachtens
      [artikel 3:1 van de Algemene douanewet][ref1] zonder vergunning verboden is;


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '3'
  - number: 8.b
    text: het mondelinge overdracht van militaire technologie betreft die via de telefoon wordt beschreven.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel8
  - number: '9.1'
    text: 'Het is verboden technische bijstand te verlenen indien:'
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel9
  - number: 9.1.a
    text: |-
      de technische bijstand verleend wordt aan een eindgebruiker in een land van bestemming waarop een wapenembargo
      rust en
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel9
  - number: 9.1.b
    text: de technische bijstand bestemd is voor militaire goederen.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is niet van toepassing indien de technische bijstand plaatsvindt in de vorm van overdracht van
      informatie die:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel9
  - number: 9.2.a
    text: voor iedereen beschikbaar is of
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel9
  - number: 9.2.b
    text: |-
      fundamenteel wetenschappelijk onderzoek is als bedoeld in door de Raad vastgestelde Gemeenschappelijke EU-lijst van
      militaire goederen (PbEU 2010, C 69).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel9
  - number: '10.1'
    text: Het is verboden zonder een vergunning van Onze Minister tussenhandeldiensten militaire goederen te verlenen.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is niet van toepassing op vervoer, financiële diensten, verzekering, herverzekering, algemene
      reclame of algemene promotie met betrekking tot militaire goederen.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel10
  - number: '10.3'
    text: Bij ministeriële regeling kan vrijstelling worden verleend van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel10
  - number: '11'
    text: 'Het is verboden te handelen in strijd met de artikelen:'
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel11
  - number: 11.a
    text: |-
      3, eerste lid, en 4, eerste lid, van [verordening 2019/125](32025R2019) voor zover het betreft het verlenen van
      technische bijstand als bedoeld in artikel 2, onderdeel f, van deze verordening;
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel11
  - number: 11.b
    text: 6 tot en met 9, 15 en 19 van [verordening 2019/125](32025R2019).
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel11
  - number: '12.1'
    text: |-
      De Nederlandse strafwet is toepasselijk op de Nederlander die zich buiten het Europese deel van Nederland en
      Bonaire, Sint Eustatius en Saba schuldig maakt aan een bij deze wet strafbaar gesteld feit door in strijd te
      handelen met:
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel12
  - number: 12.1.a
    text: |-
