      [27ga tot en met 27ge][ref13], is van overeenkomstige toepassing op een beschikking als bedoeld in het derde lid,
      met dien verstande dat voor de overeenkomstige toepassing van artikel 27e, onderdeel b, geldt dat het de situatie
      betreft waarin niet volledig is voldaan aan de verplichting ingevolge [artikel 15][ref14].


