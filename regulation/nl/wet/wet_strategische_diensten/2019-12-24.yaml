  - number: '16.2'
    text: De toezichthouder is bevoegd met medeneming van de benodigde apparatuur elke plaats te betreden.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel16
  - number: '16.3'
    text: |-
      Het betreden van een woning zonder toestemming van de bewoner mag slechts door ambtenaren die deze bevoegdheid door
      de toezichthouder hebben gekregen.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel16
  - number: '16.4'
    text: |-
      De toezichthouder is bevoegd tot het geven van een machtiging als bedoeld in
      [artikel 2 van de Algemene wet op het binnentreden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
