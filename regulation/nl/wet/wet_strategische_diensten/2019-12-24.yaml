    text: |-
      Voor de overeenkomstige toepassing van [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] is een
      beschikking voor bezwaar vatbaar indien het een beschikking betreft die is genomen bij of krachtens deze wet.


