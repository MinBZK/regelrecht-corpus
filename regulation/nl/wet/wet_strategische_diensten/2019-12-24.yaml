  - number: '13.1'
    text: |-
      Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van de uitvoering van bindende
      EU-rechtshandelingen regeling of nadere regeling behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel13
  - number: '13.2'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit
      het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan aan een toestemming als bedoeld in de artikelen 3, tweede lid, en 4, tweede lid, van [verordening
      2019/125](32025R2019), aan een ontheffing als bedoeld in [artikel 3, derde lid][ref1], en aan een vergunning
      als bedoeld in de artikelen 9, tweede lid, en 10, eerste lid, van [verordening 428/2009](32009R0428), en de
      [artikelen 4, derde lid en vierde lid][ref2], [5, eerste lid][ref3], [6, eerste lid][ref4], [8][ref5] en
      [10, eerste lid][ref6], voorschriften en voorwaarden verbinden.


