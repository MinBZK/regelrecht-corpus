  - number: '19.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *goederen voor tweeërlei gebruik:* producten voor tweeërlei gebruik als
      bedoeld in artikel 2, eerste lid, van [verordening 428/2009](32009R0428);
        - *militair eindgebruik:* militair eindgebruik als bedoeld in artikel 4, tweede lid, van [verordening 428/2009]
      (32009R0428);
        - *militaire goederen:* de krachtens [artikel 2.26, eerste lid, van de Douane- en Accijnswet BES][ref1] aangewezen
      goederen;
        - *militaire programmatuur:* programmatuur als bedoeld in de door de Raad van de Europese Unie vastgestelde
      Gemeenschappelijke EU-lijst van militaire goederen (PbEU 2010, C 69);
        - *militaire technologie:* technologie als bedoeld in de door de Raad van de Europese Unie vastgestelde
      Gemeenschappelijke EU-lijst van militaire goederen (PbEU 2010, C 69);
        - *Onze Minister:* Onze Minister van Buitenlandse Zaken;
        - *programmatuur of technologie:* programmatuur of technologie als bedoeld in artikel 2, tweede lid, onder iii, van
      [verordening 428/2009](32009R0428);
        - *technische bijstand:* technische bijstand als bedoeld in [artikel 1, eerste lid][ref2];
        - *tussenhandeldiensten goederen voor tweeërlei gebruik derde land-derde land:* a. het onderhandelen over of
      regelen van overeenkomsten met het oog op de koop, verkoop of levering van goederen voor tweeërlei gebruik die zich
      niet in Bonaire, Sint Eustatius en Saba bevinden en niet bestemd zijn voor invoer in Bonaire, Sint Eustatius of
      Saba of de Europese Unie; b. het ten behoeve van één of meer partijen verkopen of kopen van goederen voor tweeërlei
      gebruik die zich niet in Bonaire, Sint Eustatius en Saba bevinden en niet bestemd zijn voor invoer in Bonaire, Sint
      Eustatius of Saba of de Europese Unie;
        - *tussenhandeldiensten goederen voor tweeërlei gebruik Bonaire, Sint Eustatius en Saba-derde land:* a. het
      onderhandelen over of regelen van overeenkomsten met het oog op de koop, verkoop of levering van goederen voor
      tweeërlei gebruik die zich in Bonaire, Sint Eustatius of Saba bevinden en bestemd zijn voor uitvoer uit Bonaire,
      Sint Eustatius of Saba; b. het ten behoeve van één of meer partijen verkopen of kopen van goederen voor tweeërlei
      gebruik die zich in Bonaire, Sint Eustatius en Saba bevinden en bestemd zijn voor uitvoer uit Bonaire, Sint
      Eustatius en Saba;
        - *tussenhandeldiensten militaire goederen:* a. het onderhandelen over of regelen van overeenkomsten met het oog
      op de koop, verkoop of levering van militaire goederen die zich niet in Bonaire, Sint Eustatius en Saba en het
      Europese deel van Nederland bevinden en niet bestemd zijn voor invoer in Bonaire, Sint Eustatius of Saba of het
      Europese deel van Nederland; b. het ten behoeve van één of meer partijen verkopen of kopen van militaire goederen
      die zich niet in Bonaire, Sint Eustatius en Saba en het Europese deel van Nederland bevinden en niet bestemd zijn
      voor invoer in Bonaire, Sint Eustatius of Saba of het Europese deel van Nederland;
        - *verordening 428/2009:* de [verordening (EG) nr. 428/2009](32009R0428) van de Raad van 5 mei 2009 tot instelling
      van een communautaire regeling voor controle op de uitvoer, de overbrenging, de tussenhandel en de doorvoer van
      producten voor tweeërlei gebruik (PbEU 2010, L 134);
        - *wapenembargo:* wapenembargo als bedoeld in artikel 1, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030545#Artikel1
    url: https://wetten.overheid.nl/BWBR0030545/2019-12-24#Artikel19
    references:
