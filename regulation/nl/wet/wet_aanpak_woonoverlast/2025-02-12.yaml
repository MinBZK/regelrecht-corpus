$id: wet_aanpak_woonoverlast
regulatory_layer: WET
publication_date: '2024-12-10'
valid_from: '2025-02-12'
bwb_id: BWBR0039275
url: https://wetten.overheid.nl/BWBR0039275/2025-02-12
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke mogelijkheden voor gemeenten tot aanpak
    van woonoverlast te vergroten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039275/2025-02-12#ArtikelAanhef
articles:
  - number: II
    text: |-
      Onze Minister van Volkshuisvesting en Ruimtelijke Ordening zendt binnen vijf jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039275/2025-02-12#ArtikelII
  - number: III
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0039275/2025-02-12#ArtikelIII
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet aanpak woonoverlast.'
    url: https://wetten.overheid.nl/BWBR0039275/2025-02-12#ArtikelIV
