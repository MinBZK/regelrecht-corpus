  - number: 1A
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028467/2011-08-30#Artikel1A
  - number: '2'
    text: |-
      Wanneer ingevolge artikel 2, zevende lid, van de Onderlinge regeling deelgenoten van het Werkliedenpensioenfonds,
      de verplichtingen jegens hen en het in verband met die verplichtingen gereserveerde vermogen aan de Staat
      der Nederlanden zijn toegewezen en de activa en passiva van het Werkliedenpensioenfonds zijn verdeeld, kunnen
      bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voorschriften worden gegeven die
      noodzakelijk zijn om het recht op pensioen, bedoeld in [artikel 2, eerste lid, van de Onderlinge regeling][ref1],
      de verplichtingen op grond van opgebouwde rechten op pensioen, bedoeld in artikel 2, tweede lid, van de Onderlinge
      regeling, en het recht op nabestaanden- en wezenpensioen, bedoeld in artikel 2, derde lid, van de Onderlinge
      regeling te garanderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028963#Artikel2
