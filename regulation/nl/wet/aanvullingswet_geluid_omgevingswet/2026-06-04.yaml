  - number: '3.5'
    text: |-
      1 Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op:

      a. de op dat tijdstip aanwezige, in aanleg zijnde of geprojecteerde wegen in beheer bij de provincie en het geluid
      van die wegen op woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen binnen de zones van die
      wegen, totdat provinciale staten op grond van [artikel 2.13a, eerste lid, onder a, van de Omgevingswet][ref1] bij
      besluit als omgevingswaarden geluidproductieplafonds hebben vastgesteld aan weerszijden van die wegen, en deze
      besluiten in werking zijn getreden, met dien verstande dat:

      1°. in de [artikelen 74][ref2], [76][ref3], [77][ref4], [79][ref5], [99][ref6] en
      [110c van de Wet geluidhinder][ref7] voor «bestemmingsplan« wordt gelezen «omgevingsplan als
      bedoeld in artikel 2.4 van de Omgevingswet» of, waar van toepassing, «projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref8]»,

      2°. in de [artikelen 76][ref9] en [77 van de Wet geluidhinder][ref10] voor «wijzigings- of uitwerkingsplan als
      bedoeld in [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref11]» en «wijzigings-
      of uitwerkingsplan» wordt gelezen «omgevingsvergunning voor een omgevingsplanactiviteit die wordt verleend
      met toepassing van regels over een wijzigingsbevoegdheid of uitwerkingsplicht in het tijdelijke deel van het
      omgevingsplan, bedoeld in [artikel 22.1, onder a, van de Omgevingswet][ref12]»,

      3°. in [artikel 76a van de Wet geluidhinder][ref13] voor «omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref14] van het
      bestemmingsplan wordt afgeweken» wordt gelezen «omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit
      als bedoeld in de [Omgevingswet][ref15]»,

      4°. in de [artikelen 98][ref16] en [104a van de Wet geluidhinder][ref17] voor «tracébesluit» wordt gelezen
      «projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref18]»,

      5°. in [artikel 98 van de Wet geluidhinder][ref19] voor «wegaanpassingsbesluit als bedoeld in
      [artikel 5 van de Spoedwet wegverbreding][ref20]» wordt gelezen «projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref21]»,

      6°. in [artikel 98 van de Wet geluidhinder][ref22] voor «geluidplan als bedoeld in
      [artikel 6, vijfde lid, van de Spoedwet wegverbreding][ref23]» wordt gelezen «programma als bedoeld in
      [afdeling 3.2 van de Omgevingswet][ref24]»,

      7°. in [artikel 110c van de Wet geluidhinder][ref25] voor «omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref26] van het
      bestemmingsplan wordt afgeweken» wordt gelezen «omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit
      als bedoeld in de [Omgevingswet][ref27]»,

      b. de onderstaande besluiten, totdat deze onherroepelijk zijn:

      1°. het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting van bestaande, in
      aanbouw zijnde en geprojecteerde woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen op grond
      van [hoofdstuk VI van de Wet geluidhinder][ref28] ten behoeve van een besluit waarvoor een aanvraag is ingediend
      of waarvan een ontwerp ter inzage is gelegd voor dat tijdstip, of als het een weg in beheer bij de provincie
      betreft, voor het tijdstip waarop de onder a bedoelde besluiten tot vaststelling van geluidproductieplafonds als
      omgevingswaarden in werking zijn getreden,

      2°. het beslissen op een aanvraag om een omgevingsvergunning als bedoeld in
      [artikel 76a van de Wet geluidhinder][ref29], waarvoor de aanvraag is ingediend voor dat tijdstip, of als het een
      weg in beheer bij de provincie betreft, voor het tijdstip waarop de onder a bedoelde besluiten tot vaststelling van
      geluidproductieplafonds als omgevingswaarden in werking zijn getreden.

      2 Voor een op het tijdstip van inwerkingtreding van deze wet bestaande weg in beheer bij de
      provincie wordt uiterlijk op een bij koninklijk besluit te bepalen tijdstip voldaan aan de plicht
      tot het bij besluit als omgevingswaarden vaststellen van geluidproductieplafonds als bedoeld in
      [artikel 2.13a, eerste lid, onder a, van de Omgevingswet][ref30].

      3 Het eerste lid is niet van toepassing op een weg die op grond van [artikel 74 van de Wet geluidhinder][ref31]
      geen zone heeft of waarvoor de in het tweede lid bedoelde plicht niet geldt.

      4 Het eerste en tweede lid zijn niet van toepassing op een weg waarvoor geluidproductieplafonds als
      omgevingswaarden gelden op grond van [artikel 3.2a][ref32].


