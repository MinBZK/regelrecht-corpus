  - number: 3.2a
    text: |-
      1 De op grond van [artikel 3.2, eerste lid][ref1], herberekende geluidproductieplafonds gelden:

      a. voor provinciale wegen als bij besluit als omgevingswaarden vastgestelde geluidproductieplafonds als bedoeld
      in [artikel 2.13a, eerste lid, aanhef en onder a, van de Omgevingswet][ref2], tenzij het gaat om een bij algemene
      maatregel van bestuur aangewezen geval,

      b. voor lokale spoorwegen voor zover gelegen buiten de gebieden die op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref3] zijn aangewezen als
      bij besluit als omgevingswaarden vastgestelde geluidproductieplafonds als bedoeld in
      [artikel 2.13a, eerste lid, aanhef en onder b, van de Omgevingswet][ref4],

      c. voor lokale spoorwegen voor zover gelegen binnen de gebieden die op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref5] zijn aangewezen als bij omgevingsplan als
      bedoeld in [artikel 4.6, eerste lid, van de Invoeringswet Omgevingswet][ref6] als omgevingswaarden vastgestelde
      geluidproductieplafonds.

      2 [Artikel 3.2, derde en vierde lid][ref7], is van overeenkomstige toepassing.


