  - number: '3.2'
    text: |-
      1 De volgende geluidproductieplafonds worden door Onze Minister van Infrastructuur en Waterstaat met bij
      ministeriële regeling gestelde rekenvoorschriften herberekend:

      a. de op het tijdstip van inwerkingtreding van deze wet vastgestelde geluidproductieplafonds,

      b. de geluidproductieplafonds die onder de werking van [artikel 3.1, eerste lid, onder a en d][ref1], of
      [3.3, tweede lid, onder c][ref2], vallen,

      c. de geluidproductieplafonds die onder de werking van [artikel 4.44][ref3] of
      [4.45 van de Invoeringswet Omgevingswet][ref4] vallen.

      2 De herberekende geluidproductieplafonds gelden voor wegen in beheer bij het Rijk of hoofdspoorwegen
      als bij besluit als omgevingswaarden vastgestelde geluidproductieplafonds als bedoeld in
      [artikel 2.15, tweede lid, van de Omgevingswet][ref5].

      3 Een ontheffing van de verplichting tot naleving van een geluidproductieplafond als bedoeld in
      [artikel 11.24 van de Wet milieubeheer][ref6] geldt als een bij besluit als omgevingswaarde vastgesteld
      geluidproductieplafond als bedoeld in [artikel 2.15, tweede lid, van de Omgevingswet][ref7].

      4 Als in een ontheffing als bedoeld in het derde lid een voorschrift is opgenomen over de mate van overschrijding
      van het geluidproductieplafond, wordt die mate van overschrijding door Onze Minister van Infrastructuur en
      Waterstaat herberekend met de in het eerste lid bedoelde rekenmethode.


