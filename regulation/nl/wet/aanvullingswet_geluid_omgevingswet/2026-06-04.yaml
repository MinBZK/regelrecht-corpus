  - number: '3.1'
    text: |-
      1 Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op de
      onderstaande besluiten totdat deze onherroepelijk zijn:

      a. de vaststelling of wijziging van geluidproductieplafonds waarvoor voor dat tijdstip een verzoek als bedoeld in
      [artikel 11.31, eerste lid, van de Wet milieubeheer][ref1] is ingediend,

      b. de ambtshalve vaststelling of wijziging van geluidproductieplafonds als het besluit is bekendgemaakt voor dat
      tijdstip,

      c. een ontheffing van de verplichting tot naleving van een geluidproductieplafond als bedoeld in
      [artikel 11.24, eerste lid, van de Wet milieubeheer][ref2] waarvoor voor dat tijdstip een verzoek als bedoeld in
      dat artikel is ingediend,

      d. de vaststelling van een overschrijdingsbesluit als bedoeld in
      [artikel 11.49, eerste lid, van de Wet milieubeheer][ref3] waarvoor voor dat tijdstip een verzoek als bedoeld in
      dat artikel is ingediend.

      2 Als op grond van [hoofdstuk 11 van de Wet milieubeheer][ref4] zoals dat gold voor het tijdstip van
      inwerkingtreding van deze wet een plicht bestond tot het treffen van geluidwerende of geluidbeperkende maatregelen
      op grond van een onherroepelijk besluit, of op grond van een besluit dat onder de werking van dit artikel valt,
      en die maatregelen op dat tijdstip nog niet zijn getroffen, blijft op die plicht de [Wet milieubeheer][ref5] van
      toepassing.

      3 [Artikel 11.22 van de Wet milieubeheer][ref6] blijft van toepassing totdat de in dat artikel bedoelde beheerder
      over het laatste volledige kalenderjaar waarop [hoofdstuk 11 van die wet][ref7] van toepassing was een verslag over
      de naleving van de geluidproductieplafonds in dat kalenderjaar aan Onze Minister van Infrastructuur en Waterstaat
      heeft gezonden.


