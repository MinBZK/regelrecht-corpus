  - number: '3.7'
    text: |-
      Bij algemene maatregel van bestuur kan overgangsrecht worden geregeld voor een bepaling in de
      [Wet geluidhinder][ref1] of [hoofdstuk 11 van de Wet milieubeheer][ref2], die wordt vervangen door een bepaling in
      een algemene maatregel van bestuur op grond van de [Omgevingswet][ref3], voor zover hierin niet is voorzien in het
      overgangsrecht in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
