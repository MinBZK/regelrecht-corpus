  - number: '4.1'
    text: |-
      1 Op de voorbereiding van een algemene maatregel van bestuur in verband met de invoering van de Aanvullingswet
      geluid Omgevingswet zijn de [artikelen 23.4][ref1] en [23.5 van de Omgevingswet][ref2] van overeenkomstige
      toepassing. Op de voorbereiding van een ministeriële regeling in verband met de invoering van de Aanvullingswet
      geluid Omgevingswet is artikel 23.4 van de Omgevingswet van overeenkomstige toepassing.

      2 De artikelen, bedoeld in het eerste lid, treden in de plaats van wettelijke voorschriften waarin is bepaald dat:

      a. over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd
      of extern overleg moet worden gevoerd,

      b. van het ontwerp van een regeling kennis moet worden gegeven,

      c. de voordracht niet eerder wordt gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overgelegd,

      d. de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere Minister dan Onze
      Minister van Infrastructuur en Waterstaat,

      e. door of namens een van de kamers der Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, en

      f. een regeling niet eerder in werking kan treden dan nadat sinds haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken.

      3 Het tweede lid, aanhef en onder a, is niet van toepassing op het vragen van advies aan de Afdeling advisering van
      de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel23.4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel23.5
