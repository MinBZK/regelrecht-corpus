preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de Omgevingswet aan te vullen met regels over de
    beheersing van geluid afkomstig van wegen, spoorwegen en industrieterreinen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043247/2026-06-04#ArtikelAanhef
articles:
  - number: '2.1'
    text: |-
      De [Wet geluidhinder][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0043247/2026-06-04#Artikel2.1
