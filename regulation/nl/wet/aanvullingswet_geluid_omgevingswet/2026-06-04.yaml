        artikel: '23.5'
  - number: '4.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende
      hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043247/2026-06-04#Artikel4.2
  - number: '4.3'
    text: 'Deze wet wordt aangehaald als: Aanvullingswet geluid Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0043247/2026-06-04#Artikel4.3
