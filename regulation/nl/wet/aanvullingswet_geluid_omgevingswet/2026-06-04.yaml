  - number: '3.6'
    text: |-
      1 Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op:

      a. de op dat tijdstip aanwezige industrieterreinen als bedoeld in [artikel 1 van de Wet geluidhinder][ref1] en
      het geluid van die industrieterreinen op woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen
      binnen de zones van die industrieterreinen, totdat de gemeenteraad, respectievelijk provinciale staten, op grond
      van [artikel 2.11a van de Omgevingswet][ref2] bij omgevingsplan als omgevingswaarden geluidproductieplafonds heeft
      vastgesteld, respectievelijk op grond van [artikel 2.12a, eerste lid][ref3], bij besluit als omgevingswaarden
      geluidproductieplafonds hebben vastgesteld rondom die industrieterreinen, en deze besluiten in werking zijn
      getreden, met dien verstande dat:

      1°. in de [artikelen 40][ref4], [41][ref5], [46][ref6], [48][ref7], [55][ref8], [56][ref9], [57][ref10]
      en [110c van de Wet geluidhinder][ref11] voor «bestemmingsplan» wordt gelezen «omgevingsplan als bedoeld
      in [artikel 2.4 van de Omgevingswet][ref12]» of, waar van toepassing, «projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref13]»,

      2°. in [artikel 41 van de Wet geluidhinder][ref14] voor «omgevingsvergunningen
      voor activiteiten met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref15]»
      wordt gelezen «omgevingsvergunningen voor milieubelastende activiteiten als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder b, van de Omgevingswet][ref16]»,

      3°. in de [artikelen 48][ref17] en [57 van de Wet geluidhinder][ref18] voor «wijzigings- of uitwerkingsplan
      als bedoeld in [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref19]» en «wijzigings-
      of uitwerkingsplan» wordt gelezen «omgevingsvergunning voor een omgevingsplanactiviteit die wordt verleend
      met toepassing van regels over een wijzigingsbevoegdheid of uitwerkingsplicht in het tijdelijke deel van het
      omgevingsplan, bedoeld in [artikel 22.1, onder a, van de Omgevingswet][ref20]»,

      4°. in de [artikelen 49][ref21] en [58 van de Wet geluidhinder][ref22]
      voor «omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref23] van het
      bestemmingsplan wordt afgeweken» wordt gelezen «omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit
      als bedoeld in de [Omgevingswet][ref24]»,

      5°. in [artikel 110c van de Wet geluidhinder][ref25] voor «omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref26] van het
      bestemmingsplan wordt afgeweken» wordt gelezen «omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit
      als bedoeld in de [Omgevingswet][ref27]»,

      b. de op het tijdstip van inwerkingtreding van deze wet aanwezige terreinen waarvan de geluidszone op grond
      van [artikel 41, derde lid, van de Wet geluidhinder][ref28] voortbestaat, totdat aan de verplichting tot het
      vaststellen van een omgevingsplan, bedoeld in [artikel 2.4 van de Omgevingswet][ref29], is voldaan,

      c. de onderstaande besluiten, totdat deze onherroepelijk zijn:

      1°. het bij bestemmingsplan wijzigen en opheffen van een geluidszone op grond van
      [hoofdstuk V van de Wet geluidhinder][ref30], waarvan het ontwerpbesluit ter inzage is gelegd voor dat tijdstip,

      2°. het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting van bestaande, in
      aanbouw zijnde en geprojecteerde woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen op grond
      van [hoofdstuk V van de Wet geluidhinder][ref31] ten behoeve van een besluit waarvoor een aanvraag is ingediend of
      waarvan een ontwerp ter inzage is gelegd voor het tijdstip waarop de onder a bedoelde besluiten tot vaststelling
      van geluidproductieplafonds als omgevingswaarden in werking zijn getreden,

      3°. het beslissen op een aanvraag om een omgevingsvergunning als bedoeld in de [artikelen 49][ref32] en
      [58 van de Wet geluidhinder][ref33], waarvoor de aanvraag is ingediend voor het tijdstip waarop de onder a bedoelde
      besluiten tot vaststelling van geluidproductieplafonds als omgevingswaarden in werking zijn getreden,

      4°. het vaststellen van een geluidreductieplan als bedoeld in [artikel 67 van de Wet geluidhinder][ref34], waarvan
      het ontwerpbesluit ter inzage is gelegd voor het tijdstip waarop de onder a bedoelde besluiten tot vaststelling van
      geluidproductieplafonds als omgevingswaarden in werking zijn getreden.

      2 Voor een op het tijdstip van inwerkingtreding van deze wet bestaand industrieterrein als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref35] wordt uiterlijk op een bij koninklijk besluit te bepalen tijdstip
      voldaan aan de plicht tot het bij omgevingsplan als omgevingswaarden vaststellen van geluidproductieplafonds als
      bedoeld in [artikel 2.11a van de Omgevingswet][ref36].

      3 In afwijking van de [artikelen 2.11a][ref37] en [2.12a, eerste lid, van de Omgevingswet][ref38] worden
      voor een op het tijdstip van inwerkingtreding van deze wet bestaand industrieterrein als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref39] dat als industrieterrein van regionaal belang is aangewezen bij
      provinciale verordening krachtens de [Wet milieubeheer][ref40] of de [Wet ruimtelijke ordening][ref41] bij besluit
      als omgevingswaarden geluidproductieplafonds vastgesteld door provinciale staten. Aan deze plicht wordt uiterlijk
      op een bij koninklijk besluit te bepalen tijdstip voldaan.

      4 Een besluit tot vaststelling van maatregelen als bedoeld in
      [artikel 63, vierde lid, van de Wet geluidhinder][ref42] geldt als een programma als bedoeld in
      [afdeling 3.2 van de Omgevingswet][ref43].

      5 Een geluidreductieplan als bedoeld in [artikel 67 van de Wet geluidhinder][ref44] geldt als een programma als
      bedoeld in [afdeling 3.2 van de Omgevingswet][ref45].

      6 Het eerste, tweede en derde lid zijn niet van toepassing op een op het tijdstip van inwerkingtreding van deze
      wet bestaand industrieterrein als bedoeld in [artikel 1 van de Wet geluidhinder][ref46] als na dat tijdstip het
      omgevingsplan als bedoeld in [artikel 2.4 van de Omgevingswet][ref47] wordt vastgesteld en daarin is bepaald dat de
      bij algemene maatregel van bestuur op grond van [artikel 2.11a van de Omgevingswet][ref48] aangewezen activiteiten
      die in aanzienlijke mate geluid kunnen veroorzaken niet worden verricht.


