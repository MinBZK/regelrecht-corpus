  - number: '3.3'
    text: |-
      1 [Afdeling 11.3.6 van de Wet milieubeheer][ref1] blijft van toepassing tot voor alle wegen en spoorwegen als
      bedoeld in [artikel 11.56, eerste en tweede lid, van de Wet milieubeheer][ref2] een besluit op een verzoek tot
      vaststelling van een saneringsplan dan wel een tracébesluit of een besluit op een verzoek tot wijziging van
      een geluidproductieplafond, beide als bedoeld in [artikel 11.42, eerste lid, van de Wet milieubeheer][ref3],
      onherroepelijk is en de saneringsmaatregelen uit dat besluit, alsmede de geluidwerende maatregelen voor de
      saneringsobjecten volgend uit dat besluit, zijn uitgevoerd.

      2 In geval van toepassing van het eerste lid blijft [hoofdstuk 11 van de Wet milieubeheer][ref4] van toepassing op:

      a. een op grond van [artikel 11.56, eerste lid, van die wet][ref5] ingediend verzoek om vaststelling van een
      saneringsplan, totdat de vaststelling van dit saneringsplan onherroepelijk is,

      b. een wijziging van een saneringsplan of de termijn waarbinnen de daarin opgenomen saneringsmaatregelen moeten
      zijn getroffen als bedoeld in [artikel 11.61 van die wet][ref6], totdat deze wijziging van dit saneringsplan of
      deze termijn onherroepelijk is,

      c. een op grond van [artikel 11.63, eerste lid, van die wet][ref7] ingediend verzoek tot verlaging van
      geluidproductieplafonds, totdat deze verlaging van geluidproductieplafonds onherroepelijk is, en

      d. de in de saneringsplannen opgenomen saneringsmaatregelen en de eventuele geluidwerende maatregelen, totdat deze
      maatregelen getroffen zijn.

      3 In afwijking van [artikel 11.64, derde lid, van de Wet milieubeheer][ref8] strekt voor een besluit op grond van
      [artikel 11.60, eerste lid, van de Wet milieubeheer][ref9] dat onherroepelijk is geworden na 31 december 2023 de
      verplichting, bedoeld in het eerste en tweede lid van [artikel 11.64 van de Wet milieubeheer][ref10], ertoe dat
      uiterlijk twee jaar na het onherroepelijk worden van dat besluit de geluidsbelasting binnen de geluidsgevoelige
      ruimten van het betreffende saneringsobject wordt teruggebracht tot een waarde die ten minste 3 dB is gelegen onder
      de binnenwaarde.

      4 Een vastgesteld saneringsplan wordt voor de toepassing van [artikel 11.6 van de Omgevingswet][ref11] als een
      onteigeningsbelang aangemerkt.


