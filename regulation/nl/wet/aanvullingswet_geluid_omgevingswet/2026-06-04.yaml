  - number: 3.6a
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op de
      onderstaande besluiten op grond van [hoofdstuk VII van de Wet geluidhinder][ref1], totdat deze onherroepelijk zijn:

      a. het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting van bestaande, in aanbouw
      zijnde en geprojecteerde woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen ten behoeve van
      een besluit waarvoor een aanvraag is ingediend of waarvan een ontwerp ter inzage is gelegd voor dat tijdstip,

      b. het beslissen op een aanvraag om een omgevingsvergunning, waarvoor voor dat tijdstip de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
