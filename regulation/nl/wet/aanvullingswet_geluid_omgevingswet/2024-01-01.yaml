  - number: 3.2.1
    text: |-
      De volgende geluidproductieplafonds worden door Onze Minister van Infrastructuur en Waterstaat met bij ministeriële
      regeling gestelde rekenvoorschriften herberekend:
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
  - number: 3.2.1.a
    text: de op het tijdstip van inwerkingtreding van deze wet vastgestelde geluidproductieplafonds,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
  - number: 3.2.1.b
    text: |-
      de geluidproductieplafonds die onder de werking van [artikel 3.1, eerste lid, onder a en d][ref1], of
      [3.3, tweede lid, onder c][ref2], vallen,


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043247#Artikel3
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
