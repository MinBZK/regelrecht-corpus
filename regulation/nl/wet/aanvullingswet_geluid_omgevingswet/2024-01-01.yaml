    text: |-
      In afwijking van de [artikelen 2.11a][ref1] en [2.12a, eerste lid, van de Omgevingswet][ref2] worden
      voor een op het tijdstip van inwerkingtreding van deze wet bestaand industrieterrein als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref3] dat als industrieterrein van regionaal belang is aangewezen bij
      provinciale verordening krachtens de [Wet milieubeheer][ref4] of de [Wet ruimtelijke ordening][ref5] bij besluit
      als omgevingswaarden geluidproductieplafonds vastgesteld door provinciale staten. Aan deze plicht wordt uiterlijk
      op een bij koninklijk besluit te bepalen tijdstip voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003245
      [ref5]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0003245
      - id: ref5
        bwb_id: BWBR0020449
  - number: 3.6.4
    text: |-
      Een besluit tot vaststelling van maatregelen als bedoeld in [artikel 63, vierde lid, van de Wet geluidhinder][ref1]
      geldt als een programma als bedoeld in [afdeling 3.2 van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0037885
        afdeling: '3.2'
  - number: 3.6.5
    text: |-
      Een geluidreductieplan als bedoeld in [artikel 67 van de Wet geluidhinder][ref1] geldt als een programma als
      bedoeld in [afdeling 3.2 van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0037885
        afdeling: '3.2'
  - number: 3.6.6
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op een op het tijdstip van inwerkingtreding van deze
      wet bestaand industrieterrein als bedoeld in [artikel 1 van de Wet geluidhinder][ref1] als na dat tijdstip het
      omgevingsplan als bedoeld in [artikel 2.4 van de Omgevingswet][ref2] wordt vastgesteld en daarin is bepaald dat de
      bij algemene maatregel van bestuur op grond van [artikel 2.11a van de Omgevingswet][ref3] aangewezen activiteiten
      die in aanzienlijke mate geluid kunnen veroorzaken niet worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 3.6a
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op de
      onderstaande besluiten op grond van [hoofdstuk VII van de Wet geluidhinder][ref1], totdat deze onherroepelijk zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VII
  - number: 3.6a.a
    text: |-
      het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting van bestaande, in aanbouw
      zijnde en geprojecteerde woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen ten behoeve van
      een besluit waarvoor een aanvraag is ingediend of waarvan een ontwerp ter inzage is gelegd voor dat tijdstip,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6a
  - number: 3.6a.b
    text: het beslissen op een aanvraag om een omgevingsvergunning, waarvoor voor dat tijdstip de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6a
  - number: 3.6b
    text: |-
      Onze Minister van Infrastructuur en Waterstaat doet zo spoedig mogelijk na het hierna onder a en b genoemde
      tijdstip mededeling aan de Dienst voor het kadaster en de openbare registers dat de inschrijving in die registers
      van een saneringsplan als bedoeld in [artikel 11.60 van de Wet milieubeheer][ref1], een besluit tot wijziging van
      een geluidproductieplafond als bedoeld in [artikel 11.42 van de Wet milieubeheer][ref2] of een tracébesluit als
      bedoeld in artikel 11.42 van de Wet milieubeheer, zoals die gold voor het tijdstip van inwerkingtreding van deze
      wet, moet worden beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.6b.a
    text: |-
      als het gaat om een saneringsplan, een besluit tot wijziging van een geluidproductieplafond of een tracébesluit
      waarbij de saneringsmaatregelen en de eventuele geluidwerende maatregelen zijn getroffen voor de inwerkingtreding
      van de Omgevingswet: na inwerkingtreding van dit artikel, en
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6b
  - number: 3.6b.b
    text: 'als het gaat om:'
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6b
  - number: 3.6b.b.1°
    text: |-
      een saneringsplan waarop [artikel 3.3, eerste en tweede lid][ref1], van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6b
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6b.b.2°
    text: |-
      een besluit tot wijziging van een geluidproductieplafond waarop [artikel 3.1, eerste lid, onder a][ref1] van
      toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6b
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6b.b.3°
    text: |-
      een tracébesluit waarop [artikel 4.44][ref1] of [4.45 van de Invoeringswet Omgevingswet][ref2] van toepassing is:


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.6b
    references:
      - id: ref1
        bwb_id: BWBR0043660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0043660
        artikel: '4'
  - number: '3.7'
    text: |-
      Bij algemene maatregel van bestuur kan overgangsrecht worden geregeld voor een bepaling in de
      [Wet geluidhinder][ref1] of [hoofdstuk 11 van de Wet milieubeheer][ref2], die wordt vervangen door een bepaling in
      een algemene maatregel van bestuur op grond van de [Omgevingswet][ref3], voor zover hierin niet is voorzien in het
      overgangsrecht in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk11
      [ref3]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0037885
  - number: 4.1.1
    text: |-
      Op de voorbereiding van een algemene maatregel van bestuur in verband met de invoering van de Aanvullingswet geluid
      Omgevingswet zijn de [artikelen 23.4][ref1] en [23.5 van de Omgevingswet][ref2] van overeenkomstige toepassing.
      Op de voorbereiding van een ministeriële regeling in verband met de invoering van de Aanvullingswet geluid
      Omgevingswet is artikel 23.4 van de Omgevingswet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel23
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '23'
  - number: 4.1.2
    text: 'De artikelen, bedoeld in het eerste lid, treden in de plaats van wettelijke voorschriften waarin is bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.2.a
    text: |-
      over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd of
      extern overleg moet worden gevoerd,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.2.b
    text: van het ontwerp van een regeling kennis moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.2.c
    text: |-
      de voordracht niet eerder wordt gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.2.d
    text: |-
      de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere Minister dan Onze Minister
      van Infrastructuur en Waterstaat,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.2.e
    text: |-
      door of namens een van de kamers der Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, en
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.2.f
    text: |-
      een regeling niet eerder in werking kan treden dan nadat sinds haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Het tweede lid, aanhef en onder a, is niet van toepassing op het vragen van advies aan de Afdeling advisering van
      de Raad van State.
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende
      hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.2
  - number: '4.3'
    text: 'Deze wet wordt aangehaald als: Aanvullingswet geluid Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel4.3
