preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de Omgevingswet aan te vullen met regels over de
    beheersing van geluid afkomstig van wegen, spoorwegen en industrieterreinen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#ArtikelAanhef
articles:
  - number: '2.1'
    text: |-
      De [Wet geluidhinder][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 3.1.1
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op de
      onderstaande besluiten totdat deze onherroepelijk zijn:
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
  - number: 3.1.1.a
    text: |-
      de vaststelling of wijziging van geluidproductieplafonds waarvoor voor dat tijdstip een verzoek als bedoeld in
      [artikel 11.31, eerste lid, van de Wet milieubeheer][ref1] is ingediend,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.1.1.b
    text: |-
      de ambtshalve vaststelling of wijziging van geluidproductieplafonds als het besluit is bekendgemaakt voor dat
      tijdstip,
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
  - number: 3.1.1.c
    text: |-
      een ontheffing van de verplichting tot naleving van een geluidproductieplafond als bedoeld in
      [artikel 11.24, eerste lid, van de Wet milieubeheer][ref1] waarvoor voor dat tijdstip een verzoek als bedoeld in
      dat artikel is ingediend,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.1.1.d
    text: |-
      de vaststelling van een overschrijdingsbesluit als bedoeld in
      [artikel 11.49, eerste lid, van de Wet milieubeheer][ref1] waarvoor voor dat tijdstip een verzoek als bedoeld in
      dat artikel is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.1.2
    text: |-
      Als op grond van [hoofdstuk 11 van de Wet milieubeheer][ref1] zoals dat gold voor het tijdstip van inwerkingtreding
      van deze wet een plicht bestond tot het treffen van geluidwerende of geluidbeperkende maatregelen op grond van een
      onherroepelijk besluit, of op grond van een besluit dat onder de werking van dit artikel valt, en die maatregelen
      op dat tijdstip nog niet zijn getroffen, blijft op die plicht de [Wet milieubeheer][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk11
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0003245
  - number: 3.1.3
    text: |-
      [Artikel 11.22 van de Wet milieubeheer][ref1] blijft van toepassing totdat de in dat artikel bedoelde beheerder
      over het laatste volledige kalenderjaar waarop [hoofdstuk 11 van die wet][ref2] van toepassing was een verslag over
      de naleving van de geluidproductieplafonds in dat kalenderjaar aan Onze Minister van Infrastructuur en Waterstaat
      heeft gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
