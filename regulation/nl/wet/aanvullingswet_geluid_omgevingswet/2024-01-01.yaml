      - id: ref2
        bwb_id: BWBR0043247
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.1.c
    text: |-
      de geluidproductieplafonds die onder de werking van [artikel 4.44][ref1] of
      [4.45 van de Invoeringswet Omgevingswet][ref2] vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0043660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0043660
        artikel: '4'
  - number: 3.2.2
    text: |-
      De herberekende geluidproductieplafonds gelden voor wegen in beheer bij het Rijk of hoofdspoorwegen
      als bij besluit als omgevingswaarden vastgestelde geluidproductieplafonds als bedoeld in
      [artikel 2.15, tweede lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 3.2.3
    text: |-
      Een ontheffing van de verplichting tot naleving van een geluidproductieplafond als bedoeld in
      [artikel 11.24 van de Wet milieubeheer][ref1] geldt als een bij besluit als omgevingswaarde vastgesteld
      geluidproductieplafond als bedoeld in [artikel 2.15, tweede lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 3.2.4
    text: |-
      Als in een ontheffing als bedoeld in het derde lid een voorschrift is opgenomen over de mate van overschrijding van
      het geluidproductieplafond, wordt die mate van overschrijding door Onze Minister van Infrastructuur en Waterstaat
      herberekend met de in het eerste lid bedoelde rekenmethode.
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2
  - number: 3.2a.1
    text: |-
      De op grond van [artikel 3.2, eerste lid][ref1], herberekende geluidproductieplafonds gelden:


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2a.1.a
    text: |-
      voor provinciale wegen als bij besluit als omgevingswaarden vastgestelde geluidproductieplafonds als bedoeld in
      [artikel 2.13a, eerste lid, aanhef en onder a, van de Omgevingswet][ref1], tenzij het gaat om een bij algemene
      maatregel van bestuur aangewezen geval,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 3.2a.1.b
    text: |-
      voor lokale spoorwegen voor zover gelegen buiten de gebieden die op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1] zijn aangewezen als
      bij besluit als omgevingswaarden vastgestelde geluidproductieplafonds als bedoeld in
      [artikel 2.13a, eerste lid, aanhef en onder b, van de Omgevingswet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 3.2a.1.c
    text: |-
      voor lokale spoorwegen voor zover gelegen binnen de gebieden die op grond van
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1] zijn aangewezen als bij omgevingsplan als
      bedoeld in [artikel 4.6, eerste lid, van de Invoeringswet Omgevingswet][ref2] als omgevingswaarden vastgestelde
      geluidproductieplafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0043660
        artikel: '4'
  - number: 3.2a.2
    text: |-
      [Artikel 3.2, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043247#Artikel3
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0043247
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.1
    text: |-
      [Afdeling 11.3.6 van de Wet milieubeheer][ref1] blijft van toepassing tot voor alle wegen en spoorwegen als
      bedoeld in [artikel 11.56, eerste en tweede lid, van de Wet milieubeheer][ref2] een besluit op een verzoek tot
      vaststelling van een saneringsplan dan wel een tracébesluit of een besluit op een verzoek tot wijziging van
      een geluidproductieplafond, beide als bedoeld in [artikel 11.42, eerste lid, van de Wet milieubeheer][ref3],
      onherroepelijk is en de saneringsmaatregelen uit dat besluit, alsmede de geluidwerende maatregelen voor de
      saneringsobjecten volgend uit dat besluit, zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Afdeling11.3.6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        afdeling: 11.3.6
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.3.2
    text: |-
      In geval van toepassing van het eerste lid blijft [hoofdstuk 11 van de Wet milieubeheer][ref1] van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '11'
  - number: 3.3.2.a
    text: |-
      een op grond van [artikel 11.56, eerste lid, van die wet][ref1] ingediend verzoek om vaststelling van een
      saneringsplan, totdat dit saneringsplan onherroepelijk is,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.3.2.b
    text: |-
      een wijziging van een saneringsplan of de termijn waarbinnen de daarin opgenomen saneringsmaatregelen moeten zijn
      getroffen als bedoeld in [artikel 11.61 van die wet][ref1], totdat deze wijziging van dit saneringsplan of deze
      termijn onherroepelijk is,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.3.2.c
    text: |-
      een op grond van [artikel 11.63, eerste lid, van die wet][ref1] ingediend verzoek tot verlaging van
      geluidproductieplafonds, totdat deze verlaging van geluidproductieplafonds onherroepelijk is, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.3.2.d
    text: |-
      de in de saneringsplannen opgenomen saneringsmaatregelen en de eventuele geluidwerende maatregelen, totdat deze
      maatregelen getroffen zijn.
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      In afwijking van [artikel 11.64, derde lid, van de Wet milieubeheer][ref1] strekt voor een besluit op grond van
      [artikel 11.60, eerste lid, van de Wet milieubeheer][ref2] dat onherroepelijk is geworden na 31 december 2023 de
      verplichting, bedoeld in het eerste en tweede lid van [artikel 11.64 van de Wet milieubeheer][ref3], ertoe dat
      uiterlijk twee jaar na het onherroepelijk worden van dat besluit de geluidsbelasting binnen de geluidsgevoelige
      ruimten van het betreffende saneringsobject wordt teruggebracht tot een waarde die ten minste 3 dB is gelegen onder
      de binnenwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '11'
  - number: 3.3.4
    text: |-
      Een vastgesteld saneringsplan wordt voor de toepassing van [artikel 11.6 van de Omgevingswet][ref1] als een
      onteigeningsbelang aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel11
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '11'
  - number: 3.4.1
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op de
      onderstaande besluiten totdat deze onherroepelijk zijn:
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.4
  - number: 3.4.1.a
    text: |-
      het nemen van een besluit tot aanleg of reconstructie van een weg of aanleg of wijziging van een spoorweg buiten
      toepassing van de bestemmingsplanprocedure waarbij uitvoering wordt gegeven aan de [Wet geluidhinder][ref1] en
      waarvoor de resultaten van het vereiste akoestische onderzoek en een beschrijving van de maatregelen die nodig zijn
      voor dat tijdstip aan het college van burgemeester en wethouders zijn overgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 3.4.1.b
    text: |-
      het vaststellen van een programma van maatregelen, een saneringsprogramma of het vaststellen van de ten
      hoogste toelaatbare waarde van de geluidsbelasting en maatregelen waarbij uitvoering wordt gegeven aan de
      [Wet geluidhinder][ref1], voor bij algemene maatregel van bestuur aangewezen saneringsprojecten.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 3.4.2
    text: |-
      Als op grond van de [Wet geluidhinder][ref1] zoals die gold voor het tijdstip van inwerkingtreding van deze wet
      een plicht bestond tot het treffen van maatregelen als bedoeld in het eerste lid op grond van een onherroepelijk
      besluit, of op grond van een besluit dat onder de werking van dit artikel valt, en die maatregelen op dat tijdstip
      nog niet zijn getroffen, blijft op die plicht de [Wet geluidhinder][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003227
  - number: 3.5.1
    text: 'Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.5
  - number: 3.5.1.a
    text: |-
      de op dat tijdstip aanwezige, in aanleg zijnde of geprojecteerde wegen in beheer bij de provincie en het geluid
      van die wegen op woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen binnen de zones van die
      wegen, totdat provinciale staten op grond van [artikel 2.13a, eerste lid, onder a, van de Omgevingswet][ref1] bij
      besluit als omgevingswaarden geluidproductieplafonds hebben vastgesteld aan weerszijden van die wegen, en deze
      besluiten in werking zijn getreden, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 3.5.1.a.1°
    text: |-
      in de [artikelen 74][ref1], [76][ref2], [77][ref3], [79][ref4], [99][ref5] en [110c van de Wet geluidhinder][ref6]
      voor «bestemmingsplan« wordt gelezen «omgevingsplan als bedoeld in artikel 2.4 van de Omgevingswet» of, waar van
      toepassing, «projectbesluit als bedoeld in [afdeling 5.2 van de Omgevingswet][ref7]»,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel79
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel99
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel110c
      [ref7]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0043247/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '77'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '79'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '99'
      - id: ref6
        bwb_id: BWBR0003227
        artikel: 110c
      - id: ref7
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 3.5.1.a.2°
