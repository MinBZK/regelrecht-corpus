  - number: '44.1'
    text: |-
      De beschikkingen die het UWV, onderscheidenlijk de SVB, onderscheidenlijk het College zorgverzekeringen
      voor de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet heeft genomen op
      grond van een wettelijke bepaling die door de inwerkingtreding van de desbetreffende bepalingen van de
      [Wet financiering sociale verzekeringen][ref1] en van deze wet komt te vervallen en die betrekking hebben of mede
      betrekking hebben op een periode, gelegen na de datum van inwerkingtreding van de desbetreffende bepalingen van
      deze wet, blijven na die datum van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel44
