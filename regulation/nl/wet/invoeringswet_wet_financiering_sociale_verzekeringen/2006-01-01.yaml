      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel37
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '37'
  - number: '44.3'
    text: |-
      Tot de beschikkingen, bedoeld in het eerste lid, behoren tevens de beschikkingen die voor de
      datum van inwerkingtreding van de desbetreffende bepalingen van deze wet door het UWV zijn genomen
      over het verzekerd zijn op grond van de [Werkloosheidswet][ref1], de [Ziektewet][ref2] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3] en die betrekking hebben of mede betrekking hebben op een na
      die datum gelegen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
  - number: '45.1'
    text: |-
      Het UWV, onderscheidenlijk de SVB, onderscheidenlijk het College zorgverzekeringen is bevoegd te beslissen op een
      bezwaarschrift dat voor de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet is ingediend
      tegen een beschikking als bedoeld in [artikel 44][ref1] en waarop op die datum nog niet is beslist, met toepassing
      van het recht zoals dit voor die datum gold.


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel44
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017747
        artikel: '44'
        hoofdstuk: '3'
  - number: '45.2'
    text: |-
      In afwijking van het eerste lid is de inspecteur bevoegd te beslissen op een bezwaarschrift dat na de datum van
      inwerkingtreding van de desbetreffende bepalingen van deze wet wordt ingediend en dat betrekking heeft op een
      beschikking van het UWV als bedoeld in [artikel 44, tweede en derde lid][ref1]. Op een bezwaarschrift als bedoeld
      in dit lid wordt beslist met toepassing van het recht zoals dit geldt met ingang van de datum van inwerkingtreding
      van de desbetreffende bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel44
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017747
        artikel: '44'
        hoofdstuk: '3'
  - number: '46.1'
    text: |-
      Op beroep tegen een uitspraak op een bezwaarschrift van het UWV, de SVB of het College zorgverzekeringen waarop
      op de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet nog geen uitspraak is gedaan, wordt
      beslist door de rechter waarbij het beroep aanhangig is. Ten aanzien van dit beroep, alsmede ten aanzien van hoger
      beroep tegen een uitspraak van de rechtbank met toepassing van dit lid, blijft het recht zoals dit gold voor de
      datum van inwerkingtreding van de desbetreffende bepalingen van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel46
  - number: '46.2'
    text: |-
      Op het beroep dat na de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet wordt
      ingediend tegen een uitspraak op een bezwaarschrift van het UWV inzake een beschikking als bedoeld in
      [artikel 44, tweede en derde lid][ref1], is het recht zoals dit na die datum geldt van toepassing. De vorige zin is
      tevens van toepassing ten aanzien van hoger beroep tegen een uitspraak van de rechtbank met toepassing van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel44
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017747
        artikel: '44'
        hoofdstuk: '3'
  - number: '46.3'
    text: |-
      In bestuursrechtelijke gedingen als bedoeld in het tweede lid treedt de inspecteur als partij in de plaats van
      het UWV.
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel46
  - number: '47.1'
    text: |-
      Op een voor de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet bij het UWV,
      onderscheidenlijk de SVB, onderscheidenlijk het College zorgverzekeringen ingediende aanvraag tot het geven van een
      beschikking op grond van een wettelijke bepaling die door de inwerkingtreding van de desbetreffende bepalingen van
      de [Wet financiering sociale verzekeringen][ref1] en van deze wet komt te vervallen en die betrekking heeft of mede
      betrekking heeft op een periode, gelegen na de datum van inwerkingtreding van de desbetreffende bepalingen van deze
      wet, wordt na die datum door het UWV, onderscheidenlijk de SVB, onderscheidenlijk het College zorgverzekeringen
      beslist met toepassing van het recht zoals dit voor die datum gold.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '47.2'
    text: |-
      De [artikelen 44][ref1], [45, tweede lid][ref2], en [46, tweede lid][ref3], zijn van overeenkomstige toepassing op
      een beschikking als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0017747#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0017747#Artikel46
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017747
        artikel: '44'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017747
        artikel: '45'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0017747
        artikel: '46'
        hoofdstuk: '3'
  - number: '48.1'
    text: |-
      De [Wet financiering volksverzekeringen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004538
  - number: '48.2'
    text: |-
      De [Wet premieregime bij marginale arbeid][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008510
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008510
  - number: '48.3'
    text: |-
      De [Coördinatiewet Sociale Verzekering][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: 48a
    text: |-
      De Sociale verzekeringsbank hevelt het bedrag van de uitkering ingevolge de [Algemene nabestaandenwet][ref1] dat
      op grond van [artikel 18 van die wet][ref2] niet tot uitbetaling komt in verband met het ontvangen van inkomen
      als vervanger, en dat ten laste komt van het Nabestaandenfonds voor de duur van de periode waarin op grond van
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _ (Stb. 274) recht bestaat op een financiële tegemoetkoming op grond van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref4], over naar het Uitvoeringsinstituut werknemersverzekeringen ten
      gunste van het Algemeen Werkloosheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0018262#ArtikelIXa
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0018262
        artikel: IXa
      - id: ref4
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 48b
    text: |-
      Zolang in artikel 27 van het op 5 juni 2001 te Luxemburg tot stand gekomen Verdrag tussen het Koninkrijk der
      Nederlanden en het Koninkrijk België tot het vermijden van dubbele belasting en tot het voorkomen van het ontgaan
      van belasting inzake belastingen naar het inkomen en naar het vermogen, met Protocollen (Trb. 2001, 136), melding
      wordt gemaakt van de [Wet financiering volksverzekeringen][ref1], wordt de premie voor de volksverzekeringen voor
      de toepassing van dat artikel geacht te zijn geheven krachtens de [Wet financiering volksverzekeringen][ref2],
      zoals deze wet luidde op de dag voor inwerkingtreding van [artikel 48, eerste lid][ref3], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004538
      [ref2]: https://wetten.overheid.nl/BWBR0004538
      [ref3]: https://wetten.overheid.nl/BWBR0017747#Artikel48
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0004538
      - id: ref2
        bwb_id: BWBR0004538
      - id: ref3
        bwb_id: BWBR0017747
        artikel: '48'
        hoofdstuk: '4'
  - number: '49'
    text: |-
      Bij regeling van Onze Minister en Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport kunnen met
      het oog op een goede invoering van de [Wet financiering sociale verzekeringen][ref1] regels worden gesteld, waarbij
      zo nodig kan worden afgeweken van het bepaalde bij en krachtens die wet, deze wet en de wetten die bij deze wet
      worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '50.1'
    text: |-
      Indien blijkt dat niet of niet ten volle kan worden voldaan aan de administratieve verplichtingen
      op grond van [artikel 59 van de Wet financiering sociale verzekeringen][ref1] in verbinding met de
      [Wet op de loonbelasting 1964][ref2] en de [Algemene wet inzake rijksbelastingen][ref3], dan wel dat de
      polisadministratie, bedoeld in [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4],
      of de verzekerdenadministratie, bedoeld in [artikel 35 van die wet][ref5], nog niet volledig kan functioneren,
      kan bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, worden bepaald dat, in afwijking van het bij koninklijk besluit op grond van
      [artikel 52][ref6] bepaalde, tot uiterlijk 1 januari 2008 één of meer van de volgende voorschriften en de daarop
      berustende bepalingen, zoals deze luidden op de dag voorafgaande aan de bij koninklijk besluit op grond van
      [artikel 52][ref7] voor de desbetreffende bepalingen vastgestelde datum, hun gelding na die datum behouden:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0002320
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel35
      [ref6]: https://wetten.overheid.nl/BWBR0017747#Artikel52
      [ref7]: https://wetten.overheid.nl/BWBR0017747#Artikel52
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0002320
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '35'
      - id: ref6
        bwb_id: BWBR0017747
        artikel: '52'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0017747
        artikel: '52'
        hoofdstuk: '4'
  - number: 50.1.a
    text: |-
      [artikel 10, tweede lid, van de Coördinatiewet Sociale Verzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel10
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '10'
  - number: 50.1.b
    text: |-
      [artikel 28, onderdeel d, van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: 50.1.c
    text: |-
      [artikel 58, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel58
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '58'
  - number: 50.1.d
    text: |-
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
  - number: 50.1.e
    text: |-
      [artikel 35 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '35'
  - number: '50.2'
    text: |-
      De toepassing van het eerste lid, onderdelen a, b en c, kan worden beperkt tot bij de regeling op grond van dat lid
      aan te wijzen categorieën.
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
  - number: '50.3'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid blijven voor de duur van die toepassing ten aanzien daarvan
      tevens de volgende artikelen en de daarop berustende bepalingen van kracht:
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
  - number: 50.3.a
    text: |-
      voorzover het betreft het eerste lid, onderdeel a: [artikel 17a van de Coördinatiewet Sociale Verzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel17a
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 17a
  - number: 50.3.b
    text: |-
      voorzover het betreft het eerste lid, onderdeel b: [artikel 68 van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
  - number: 50.3.c
    text: |-
      voorzover het betreft het eerste lid, onderdeel c: de [artikelen 55, derde lid][ref1],
      [58, eerste lid][ref2], [59][ref3], [60][ref4], [77, eerste en tweede lid][ref5], en
      [84 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel77
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel84
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '59'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '60'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '77'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '84'
  - number: '50.4'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn
      en Sport, kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
  - number: '50.5'
    text: |-
      Bij koninklijk besluit kan voor de in het eerste lid genoemde datum 1 januari 2008 een latere datum in de plaats
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel50
  - number: '51'
    text: |-
      Voor de plaatsing in het Staatsblad brengt Onze Minister de aanhalingen van de artikelen, paragrafen,
      afdelingen en hoofdstukken van de [Wet financiering sociale verzekeringen][ref1] die voorkomen in
      deze wet en in de wetten die bij deze wet worden gewijzigd in overeenstemming met de op grond van
      [artikel 126 van de Wet financiering sociale verzekeringen][ref2] vastgestelde nieuwe nummering van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel126
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '126'
  - number: '52'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel52
  - number: '53'
    text: 'Deze wet wordt aangehaald als: Invoeringswet Wet financiering sociale verzekeringen.'
    url: https://wetten.overheid.nl/BWBR0017747/2006-01-01#Artikel53
