  - number: '49'
    text: |-
      Bij regeling van Onze Minister en Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport kunnen met
      het oog op een goede invoering van de [Wet financiering sociale verzekeringen][ref1] regels worden gesteld, waarbij
      zo nodig kan worden afgeweken van het bepaalde bij en krachtens die wet, deze wet en de wetten die bij deze wet
      worden gewijzigd. Een ministeriële regeling als bedoeld in de eerste volzin wordt niet vastgesteld dan twee weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0017747/2008-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '50'
    text: |-
      1 Indien blijkt dat niet of niet ten volle kan worden voldaan aan de administratieve verplichtingen
      op grond van [artikel 59 van de Wet financiering sociale verzekeringen][ref1] in verbinding met de
      [Wet op de loonbelasting 1964][ref2] en de [Algemene wet inzake rijksbelastingen][ref3], dan wel dat de
      polisadministratie, bedoeld in [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4],
      of de verzekerdenadministratie, bedoeld in [artikel 35 van die wet][ref5], nog niet volledig kan functioneren,
      kan bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, worden bepaald dat, in afwijking van het bij koninklijk besluit op grond van
      [artikel 52][ref6] bepaalde, tot uiterlijk 1 januari 2008 één of meer van de volgende voorschriften en de daarop
      berustende bepalingen, zoals deze luidden op de dag voorafgaande aan de bij koninklijk besluit op grond van
      [artikel 52][ref7] voor de desbetreffende bepalingen vastgestelde datum, hun gelding na die datum behouden:

      a. [artikel 10, tweede lid, van de Coördinatiewet Sociale Verzekering][ref8];

      b. [artikel 28, onderdeel d, van de Wet op de loonbelasting 1964][ref9];

      c. [artikel 58, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10];

      d. [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11];

      e. [artikel 35 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12].

      2 De toepassing van het eerste lid, onderdelen a, b en c, kan worden beperkt tot bij de regeling op grond van dat
      lid aan te wijzen categorieën.

      3 Indien toepassing wordt gegeven aan het eerste lid blijven voor de duur van die toepassing ten aanzien daarvan
      tevens de volgende artikelen en de daarop berustende bepalingen van kracht:

      a. voorzover het betreft het eerste lid, onderdeel a:
      [artikel 17a van de Coördinatiewet Sociale Verzekering][ref13];

      b. voorzover het betreft het eerste lid, onderdeel b:
      [artikel 68 van de Algemene wet inzake rijksbelastingen][ref14];

      c. voorzover het betreft het eerste lid, onderdeel c: de [artikelen 55, derde lid][ref15],
      [58, eerste lid][ref16], [59][ref17], [60][ref18], [77, eerste en tweede lid][ref19], en
      [84 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref20].

      4 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Financiën en van Volksgezondheid,
      Welzijn en Sport, kunnen met betrekking tot dit artikel nadere regels worden gesteld.

      5 Bij koninklijk besluit kan voor de in het eerste lid genoemde datum 1 januari 2008 een latere datum in de plaats
      worden gesteld.


