  - number: '44'
    text: |-
      1 De beschikkingen die het UWV, onderscheidenlijk de SVB, onderscheidenlijk het College zorgverzekeringen
      voor de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet heeft genomen op
      grond van een wettelijke bepaling die door de inwerkingtreding van de desbetreffende bepalingen van de
      [Wet financiering sociale verzekeringen][ref1] en van deze wet komt te vervallen en die betrekking hebben of mede
      betrekking hebben op een periode, gelegen na de datum van inwerkingtreding van de desbetreffende bepalingen van
      deze wet, blijven na die datum van kracht.

      2 Tot de beschikkingen, bedoeld in het eerste lid, behoren de beschikkingen die door het UWV zijn genomen op
      grond van de hierna genoemde wettelijke bepalingen en die met ingang van de datum van inwerkingtreding van de
      desbetreffende bepalingen van deze wet gelden als een beschikking, genomen op grond het artikel, de artikelen of de
      paragraaf van de [Wet financiering sociale verzekeringen][ref2] die daarbij is genoemd:

      a. [artikel 75 van de Wet op de arbeidsongeschiktheidsverzekering][ref3]: [artikel 40][ref4];

      b. [artikel 63 van de Ziektewet][ref5]: [artikel 40][ref6];

      c. de [Wet premieregime bij marginale arbeid][ref7]: [hoofdstuk 3, afdeling 6, § 3][ref8];

      d. de [artikelen 97k][ref9] of [97m van de Werkloosheidswet][ref10]: de [artikelen 95][ref11] of [97][ref12];

      e. [artikel 78 van de Wet op de arbeidsongeschiktheidsverzekering][ref13]: [artikel 37][ref14].

      3 Tot de beschikkingen, bedoeld in het eerste lid, behoren tevens de beschikkingen die voor de
      datum van inwerkingtreding van de desbetreffende bepalingen van deze wet door het UWV zijn genomen
      over het verzekerd zijn op grond van de [Werkloosheidswet][ref15], de [Ziektewet][ref16] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref17] en die betrekking hebben of mede betrekking hebben op een na
      die datum gelegen periode.


