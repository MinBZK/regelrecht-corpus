  - number: '43'
    text: |-
      1 De hierna genoemde algemene maatregelen van bestuur en de daarop berustende bepalingen,
      berusten met ingang van de datum van inwerkingtreding van de desbetreffende bepalingen van de
      [Wet financiering sociale verzekeringen][ref1] op dan wel mede op de telkens bij die maatregelen genoemde artikelen
      van die wet:

      a. het [Besluit vrijwillige verzekering AOW en ANW 2001][ref2] en het [Besluit vrijwillige verzekering AWBZ][ref3]:
      op [artikel 71][ref4];

      b. het [Besluit financiering uitvoeringsorganisatie bijzondere ziektekostenverzekering][ref5]: op
      [artikel 91][ref6];

      c. het [Besluit vaststelling premiepercentage wachtgeldfondsen][ref7]: op [artikel 28, eerste lid][ref8];

      d. het [Besluit vaststelling rekenpremie wachtgeldfondsen][ref9]: op [artikel 28, tweede lid][ref10].

      2 De hierna genoemde ministeriële regelingen berusten met ingang van de datum van inwerkingtreding van de
      desbetreffende bepalingen van de [Wet financiering sociale verzekeringen][ref11] op dan wel mede op de telkens bij
      die regelingen genoemde artikelen van die wet:

      a. de [Uitvoeringsregeling premieheffing volksverzekeringen 2002][ref12]: op [artikel 13][ref13];

      b. de [Regeling rekening-courant verhouding sociale verzekeringen][ref14]: op de [artikelen 119][ref15] en
      [120][ref16];

      c. de [Regeling indeling van het bedrijfs- en beroepsleven in sectoren][ref17]: op [artikel 95][ref18];

      d. de [Regeling verdeling premiekorting WAO][ref19]: op [artikel 55, eerste lid][ref20];

      e. de [Regeling vergoeding bijdragen Remigratiewet][ref21]: op de [artikelen 102][ref22] en [110][ref23];

      f. de [Financieringsregeling Algemene Kinderbijslagwet][ref24], de
      [Financieringsregeling Toeslagenfonds en Arbeidsongeschiktheidsfonds jonggehandicapten][ref25] en de
      [Financieringsregeling Hoofdstuk 7 Wet arbeid en zorg 2004][ref26]: op [artikel 122][ref27];

      g. de [Regeling reservevorming Algemeen werkloosheidsfonds 2002][ref28] en de
      [Regeling reservevorming wachtgeldfondsen 2002][ref29]: op [artikel 120, achtste lid][ref30].

      3 Door de SVB vastgestelde beleidsregels met betrekking tot bevoegdheden op grond van de
      [Wet financiering volksverzekeringen][ref31] worden met ingang van de datum van inwerkingtreding van de
      desbetreffende bepalingen van de [Wet financiering sociale verzekeringen][ref32] aangemerkt als beleidsregels met
      betrekking tot de overeenkomstige bevoegdheden op grond van [laatstgenoemde wet][ref33].

      4 Door het College zorgverzekeringen vastgestelde beleidsregels met betrekking tot bevoegdheden op grond van
      de [Wet financiering volksverzekeringen][ref34] worden met ingang van de datum van inwerkingtreding van de
      desbetreffende bepalingen van de [Wet financiering sociale verzekeringen][ref35] aangemerkt als beleidsregels met
      betrekking tot de overeenkomstige bevoegdheden op grond van [laatstgenoemde wet][ref36].

      5 De door het UWV op grond van [artikel 97n van de Werkloosheidswet][ref37] vastgestelde Regeling
      vermogensoverdracht wachtgeldfondsen en daaraan op grond van [116, eerste lid, van die wet][ref38]
      door Onze Minister verleende goedkeuring berusten met ingang van de datum van inwerkingtreding van
      [artikel 98 van de Wet financiering sociale verzekeringen][ref39] op [laatstgenoemd artikel][ref40].


