  - number: '45'
    text: |-
      1 Het UWV, onderscheidenlijk de SVB, onderscheidenlijk het College zorgverzekeringen is bevoegd te beslissen op een
      bezwaarschrift dat voor de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet is ingediend
      tegen een beschikking als bedoeld in [artikel 44][ref1] en waarop op die datum nog niet is beslist, met toepassing
      van het recht zoals dit voor die datum gold.

      2 In afwijking van het eerste lid is de inspecteur bevoegd te beslissen op een bezwaarschrift dat na de datum
      van inwerkingtreding van de desbetreffende bepalingen van deze wet wordt ingediend en dat betrekking heeft op een
      beschikking van het UWV als bedoeld in [artikel 44, tweede en derde lid][ref2]. Op een bezwaarschrift als bedoeld
      in dit lid wordt beslist met toepassing van het recht zoals dit geldt met ingang van de datum van inwerkingtreding
      van de desbetreffende bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017747#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0017747#Artikel44
    url: https://wetten.overheid.nl/BWBR0017747/2008-01-01#Artikel45
