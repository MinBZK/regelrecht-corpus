preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Wet financiering sociale
    verzekeringen en enkele daarmee samenhangende onderwerpen te regelen, zulks onder intrekking van onder andere de
    Wet financiering volksverzekeringen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017747/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In de [hoofdstukken 3][ref1] en [4][ref2] van deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      c. SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      d. College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in
      [hoofdstuk IA van de Ziekenfondswet][ref5];

      e. werknemer: de werknemer in de zin van de [Werkloosheidswet][ref6], de [Ziektewet][ref7], de
      [Wet werk en inkomen naar arbeidsvermogen][ref8] of de [Wet op de arbeidsongeschiktheidsverzekering][ref9];

      f. werkgever: de werkgever in de zin van de [Werkloosheidswet][ref10], de [Ziektewet][ref11], de
      [Wet werk en inkomen naar arbeidsvermogen][ref12] of de [Wet op de arbeidsongeschiktheidsverzekering][ref13];

      g. inspecteur: de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen.


