    text: |-
      1 Met betrekking tot de financiering van de [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2] en
      de [Algemene Wet Bijzondere Ziektekosten][ref3] over de kalenderjaren, gelegen voor de datum van inwerkingtreding
      van de desbetreffende bepalingen van deze wet, blijft het recht zoals dit gold voor die datum, van toepassing.

      2 Met betrekking tot de financiering van de [Werkloosheidswet][ref4], de [Ziektewet][ref5], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6] en de [Ziekenfondswet][ref7] over de kalenderjaren, gelegen
      voor de datum van inwerkingtreding van de desbetreffende bepalingen van deze wet, blijft het recht zoals dit gold
      voor die datum, van toepassing.


