    text: |-
      bevoegd gezag: het bevoegd gezag, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      het bestuur van een rechtspersoon die een centrale dienst in stand houdt als bedoeld in
      [artikel 68 van de Wet op het primair onderwijs][ref2], het bevoegd gezag, bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref3], het bestuur van de rechtspersoon die een regionaal
      expertisecentrum in stand houdt als bedoeld in [artikel 28b van de Wet op de expertisecentra][ref4],
      het bevoegd gezag, bedoeld in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref5] onderscheidenlijk
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref6] dan wel het instellingsbestuur, bedoeld in
      [artikel 1.1, onder j, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7];


