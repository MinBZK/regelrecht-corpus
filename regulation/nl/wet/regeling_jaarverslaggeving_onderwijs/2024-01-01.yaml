  - number: 1.n
    text: |-
      *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 1a
    text: |-
      Deze regeling is van overeenkomstige toepassing ten aanzien van de jaarverslaggeving van
      samenwerkingsverbanden als bedoeld in [artikel 1.1, van de Wet op het primair onderwijs][ref1] of
      [artikel 1.1 van de Wet voorgezet onderwijs 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel1
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '1'
  - number: '2'
    text: |-
      Op de jaarverslaggeving is [Titel 9 Boek 2 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing, met
      uitzondering van de [afdelingen 1][ref2], [10][ref3], [11][ref4] en [12][ref5], een en ander voor zover in deze
      regeling niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling10
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '10'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref5
        bwb_id: BWBR0003045
        afdeling: '12'
  - number: '3'
    text: |-
      In afwijking van of in aanvulling op [Titel 9 Boek 2 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 3.a
    text: |-
      wordt de jaarverslaggeving ingericht overeenkomstig de richtlijnen, in het bijzonder de hoofdstukken 400, 640
      en 660 behoudens het bepaalde in [artikel 4, onder 1a][ref1] ten aanzien van het bevoegd gezag van een school of
      scholengemeenschappen in het primair en het voortgezet onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0023132#Artikel4
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023132
        artikel: '4'
  - number: 3.b
    text: |-
      wordt de jaarverslaggeving vastgesteld in de Nederlandse taal en in de in Nederland wettige valuta, en wordt zij
      jaarlijks vóór 1 juli door de onderwijsinstelling openbaar gemaakt;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.c
    text: is het verslagjaar gelijk aan een kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.d
    text: wordt de jaarverslaggeving opgesteld door het bevoegd gezag dat de onderwijsinstelling in stand houdt;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.e1
    text: |-
      wordt de informatie, bedoeld in de [artikelen 1.7][ref1], [4.1][ref2] en
      [4.2 van de Wet normering topinkomens][ref3], opgenomen in de jaarrekening;


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '4'
  - number: 3.e2
    text: |-
      kan aan de [artikelen 383][ref1] en [383c van Boek 2 van het Burgerlijk Wetboek][ref2] worden voldaan
      middels het verstrekken van de betreffende bezoldigingsinformatie op basis van het bezoldigingsbegrip van de
      [Wet normering topinkomens][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel383c
      [ref3]: https://wetten.overheid.nl/BWBR0032249
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 383c
      - id: ref3
        bwb_id: BWBR0032249
  - number: 3.e3
    text: |-
      geschiedt de elektronische aanlevering van de gegevens in het kader van de [Wet normering topinkomens][ref1] door
      gebruikmaking van het WNT-onderdeel uit de elektronische versie van de jaarrekening, zoals voor het betreffende
      verslagjaar voor het onderwijs is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0032249
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032249
  - number: 3.e4
    text: |-
      geschiedt de inrichting en vormgeving van de rapportage in de jaarrekening van de gegevens in het kader van de
      [Wet normering topinkomens][ref1] conform de wijze als bedoeld in onderdeel e3;


      [ref1]: https://wetten.overheid.nl/BWBR0032249
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032249
  - number: 3.f
    text: |-
      wordt aan het bestuursverslag een verslag toegevoegd van de raad van toezicht of een vergelijkbare interne
      toezichthouder, waarin deze verantwoording aflegt over zijn handelen en van de resultaten die dat handelen heeft
      opgeleverd;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.f1
    text: |-
      wordt in het bestuursverslag over de jaren 2019 tot en met 2024 een hoofdstuk toegevoegd over de voortgang ten
      aanzien van inhoud en proces van de kwaliteitsafspraken, bedoeld in artikel 1 van het Uitvoeringsbesluit WHW 2008,
      waarbij afspraken met de medezeggenschap over de besteding van de studievoorschotmiddelen terugkomen;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.f2
    text: |-
      neemt het bevoegd gezag, indien het publieke eigen vermogen in een boekjaar boven de signaleringswaarden bovenmatig
      publiek eigen vermogen van de Inspectie van het Onderwijs uitstijgt, dienaangaande een toelichting in het
      bestuursverslag op;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.g
    text: |-
      worden de balans en de staat van baten en lasten, het kasstroomoverzicht en de toelichting opgesteld overeenkomstig
      de modellen in de bijlagen bij hoofdstuk 660 van de richtlijnen. Het Besluit modellen jaarrekening, samengesteld
      door de Raad voor de Jaarverslaggeving en opgenomen in hoofdstuk 910 van de richtlijnen is van overeenkomstige
      toepassing;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.h
    text: |-
      wordt een geconsolideerde jaarrekening als bedoeld in
      [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede het bestuursverslag, zo
      gespecificeerd dat in ieder geval inzicht ontstaat in de onderscheiden posten op het niveau van elk afzonderlijk
      bevoegd gezag, waarbij voor de bepaling van de operationele segmenten aansluiting wordt gezocht bij het
      bedrijfsproces, zoals de te onderscheiden onderwijssectoren en overige activiteiten op het niveau van elk
      afzonderlijk bevoegd gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel406
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '406'
  - number: 3.j
    text: |-
      wordt de jaarverslaggeving per instelling opgesteld als een bevoegd gezag meer dan een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] of meer dan één instelling voor hoger onderwijs als
      bedoeld in [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] in stand houdt;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 3.k
    text: |-
      blijven ten aanzien van onderwijsinstellingen voor openbaar onderwijs zonder afgescheiden vermogen die niet door
      een privaatrechtelijke rechtspersoon in stand worden gehouden of voor onderwijsinstellingen waarvoor anderszins
      geen toerekening mogelijk is van een of meer balansposten aan het belang van de instelling, de onder g bedoelde
      modellen wat betreft de inrichting van de balans beperkt tot die posten waar die toerekening wel mogelijk is;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.l
    text: |-
      wordt separaat aan het bestuursverslag en de jaarrekening door het bevoegd gezag specifieke informatie toegevoegd
      in de vorm van een aanvullende set met nader te bepalen gegevens;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 3.l1
    text: |-
      onverminderd onderdeel l, zorgt het bevoegd gezag van een instelling voor hoger onderwijs die kwaliteitsbekostiging
      ontvangt op grond van [hoofdstuk 4, afdeling 5, van het Uitvoeringsbesluit WHW 2008][ref1], ervoor dat aan het
      bestuursverslag en de jaarrekening over de jaren 2021 tot en met 2024 een reflectie wordt toegevoegd van de
      medezeggenschap op de realisatie van het plan en de betrokkenheid van belanghebbenden en de facilitering van de
      medezeggenschap;


      [ref1]: https://wetten.overheid.nl/BWBR0006152#Afdeling5
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006152
        afdeling: '5'
  - number: 3.m
    text: |-
      is het niet toegestaan de jaarrekening op te stellen volgens de door de International Accounting Standards Board
      vastgestelde en door de Europese Commissie goedgekeurde standaarden.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel3
  - number: 4.1a
    text: |-
      In aanvulling op hoofdstuk 271 Personeelsbeloningen van de richtlijnen worden de lasten op basis van de Bapo en
      de SOP, overeenkomstig paragraaf 2, alinea 204, van dat hoofdstuk, in de staat van baten en lasten verantwoord
      als periodelasten.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.1b
    text: |-
      Overeenkomstig hoofdstuk 271 Personeelsbeloningen van de richtlijnen worden de gespaarde verlofuren als gevolg van
      de afspraken duurzame inzetbaarheid of de werktijdenvermindering voor senioren conform paragraaf 2, alinea 203,
      van dat hoofdstuk, op de balans opgenomen als een verplichting uit hoofde van een opbouw van rechten voor zover de
      gespaarde rechten op doorbetaalde afwezigheid kunnen worden opgenomen of verzilverd.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.1c
    text: |-
      In afwijking van hoofdstuk 212 Materiële vaste activa, paragraaf 4, alinea 451, van de richtlijnen is het voor
      onderwijsinstellingen voor de verslagjaren 2018 tot en met 2023 toegestaan de jaarlijkse toevoegingen aan de
      voorziening groot onderhoud te bepalen op basis van het voorgenomen groot onderhoud gedurende de gehele planperiode
      van het groot onderhoud op het niveau van het onderwijspand gedeeld door het aantal jaren waaruit deze planperiode
      bestaat, voor zover deze methode reeds in 2017 werd toegepast en indien is gewaarborgd dat de voorziening groot
      onderhoud gedurende de planperiode niet op enig moment negatief wordt. De onderwijsinstelling die gebruik maakt van
      deze tijdelijke regeling vermeldt dit in haar jaarrekening.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Onderwijsinstellingen nemen met gebruikmaking van de in [bijlage 1][ref1] opgenomen tabel
      in het bestuursverslag op aan hoeveel ho-studenten zij uit het profileringsfonds, bedoeld in
      [artikel 7.51 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], financiële ondersteuning
      hebben verleend, uitgesplitst naar de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0023132
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023132
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 4.2.a
    text: |-
      ho-studenten in overmachtssituaties, zoals ziekte, functiebeperking, familieomstandigheden mantelzorg of niet
      studeerbare opleidingen;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.2.b
    text: |-
      ho-studenten die optreden als bestuurslid van door de instelling erkende studie- of studentenverenigingen of in de
      studentenmedezeggenschap, en
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.2.c
    text: |-
      overige, zoals het leveren van uitzonderlijke prestaties op het gebied van sport of cultuur, financiële steun aan
      ho-studenten uit niet-EER-landen en uitgaande beurzen.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.2a
    text: |-
      Mbo-instellingen nemen met gebruikmaking van de in [bijlage 2][ref1] opgenomen tabel in het bestuursverslag op aan
      hoeveel mbo-studenten zij uit het mbo-studentenfonds, bedoeld in [artikel 8.1.5 WEB][ref2], ondersteuning hebben
      verleend. Daarbij geven de mbo-instellingen tevens aan hoeveel mbo-studenten ondersteuning hebben aangevraagd,
      hoeveel mbo-studenten ondersteuning toegekend hebben gekregen, hoeveel in totaal is toegekend en wat de gemiddelde
      hoogte was van de toekenningen. Deze informatie wordt uitgesplitst in vier categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0023132
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023132
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 4.2a.a
    text: |-
      mbo-studenten die lid zijn van een studentenraad als bedoeld in [artikel 8a.1.2 WEB][ref1], van een andere door het
      bevoegd gezag ingestelde medezeggenschapsstructuur of van het bestuur van een studentenorganisatie van enige omvang
      met volledige rechtsbevoegdheid;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
  - number: 4.2a.b
    text: |-
      mbo-studenten die activiteiten verrichten op bestuurlijk of maatschappelijk gebied die naar het oordeel van het
      bevoegd gezag mede in het belang zijn van de instelling of van het onderwijs dat de student volgt;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.2a.c
    text: |-
      mbo-studenten, of diens wettelijk vertegenwoordigers, die aantoonbaar onvoldoende financiële middelen hebben voor
      de aanschaf van onderwijsbenodigdheden waarover de student geacht wordt te beschikken; en
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.2a.d
    text: |-
      mbo-studenten die in verband met de aanwezigheid van een bijzondere omstandigheid studievertraging hebben
      opgelopen.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Instellingen voor hoger onderwijs als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] nemen in het bestuursverslag
      een overzicht op van de vergoedingen aan en de declaraties van de individuele bestuurders. Hogescholen
      verantwoorden de declaraties van bestuurders in overeenstemming met de Handreiking, opgenomen in de brief van de
      Vereniging Hogescholen van 3 november 2016 met kenmerk 16.4347.avw (te raadplegen via www.onderwijsinspectie.nl).
      Universiteiten verantwoorden de declaraties van bestuurders in overeenstemming met de Handreiking verantwoording
      declaraties bestuurders, opgenomen in de brief van de Vereniging van Universiteiten van 7 september 2016 met
      kenmerk VSNU 16/214 U (te raadplegen via www.onderwijsinspectie.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '4.4'
    text: |-
      In het bestuursverslag rapporteert het bevoegd gezag met gebruikmaking van de in [bijlage 3][ref1] opgenomen set
      gegevens en de daarbij behorende toelichting over de resultaten van het financiële beleid over het verslagjaar.
      Daarnaast rapporteert het bevoegd gezag – in meerjarenperspectief over de drie verslagjaren volgend op het
      verslagjaar en ingeval sprake is van majeure investeringen, in meerjarenperspectief over de vijf verslagjaren
      volgend op het verslagjaar. Er is sprake van een majeure investering als het totaal van de investering gedeeld
      door de totale jaarlijkse baten in de staat van baten en lasten gelijk is of groter dan 15%. In de sectoren primair
      onderwijs en voortgezet onderwijs wordt ingeval sprake is van volledige doordecentralisatie van de huisvesting,
      steeds een meerjarenperspectief opgenomen voor de periode van vijf jaren volgend op het verslagjaar. De toelichting
      op deze investeringen bevat in ieder geval een beschrijving van de relatie met de strategische doelstellingen, de
      omvang, het tijdpad, de wijze van financiering, inclusief een duidelijke onderbouwing met analyse van de prognose
      van de ontwikkeling van leerlingen-, mbo-studenten-, vavo-studenten- of ho-studentenaantallen en het gebruik van
      sturingsinstrumenten. De rapportage betreft onder meer het risicomanagement en het interne toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '4.5'
    text: |-
      Een bekostigde instelling voor hoger onderwijs dan wel een bekostigde instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1], verantwoordt zich in het bestuursverslag over het
      gevoerde beleid zoals aangegeven in de volgende notities:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 4.5.a
    text: Helderheid in de bekostiging van het hoger onderwijs (bijlage bij Kamerstukken II 2003/04, 28 817, nr. 5)
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.5.b
    text: |-
      Aanvulling op de notitie Helderheid in de bekostiging van het hoger onderwijs (bijlage bij II 2004/05, 28 248, nr.
      72); en
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.5.c
    text: |-
      Helderheid in de bekostiging van het beroepsonderwijs en de volwasseneneducatie (Bijlage bij Kamerstukken 2004/05,
      28 248, nr. 72.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4.5a
    text: |-
      In aanvulling op het vijfde lid verantwoordt een bekostigde instelling voor hoger onderwijs dan wel een
      bekostigde instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] zich
      vanaf het verslagjaar 2023 in het bestuursverslag eveneens over het gevoerde beleid zoals aangegeven in de
      [Beleidsregel investeren met publieke middelen in private activiteiten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0045046
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0045046
  - number: '4.6'
    text: |-
      De Minister van Onderwijs, Cultuur en Wetenschap publiceert jaarlijks een overzicht van de voor het betreffende
      verslagjaar relevante politieke of maatschappelijke thema’s, waarover het bevoegd gezag in het bestuursverslag
      rapporteert met betrekking tot de wijze waarop middelen zijn ingezet en de resultaten die daarmee zijn behaald.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4
  - number: 4a
    text: |-
      Een bevoegd gezag neemt, ter verantwoording van de aan haar door de Minister van Onderwijs, Cultuur en Wetenschap
      of de Minister voor Basis- en Voortgezet Onderwijs en Media verstrekte subsidies, in haar jaarverslag het
      verantwoordingsmodel G op als bedoeld in [bijlage 4][ref1], indien zij daartoe verplicht is op grond van een
      besluit van één of beide ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '5'
    text: |-
      Het bevoegd gezag levert jaarlijks vóór 1 juli de volgende gegevens over het voorafgaande kalenderjaar aan bij de
      Dienst Uitvoering Onderwijs:
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5
  - number: 5.a
    text: |-
      in schriftelijke vorm de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: 5.b
    text: |-
      met gebruikmaking van de methode SBR/XBRL overeenkomstig de op de website van de Dienst Uitvoering Onderwijs
      bekend gemaakte onderwijstaxonomie, de gegevens uit de jaarrekening, alsmede de gegevens, bedoeld in
      [artikel 3, onder e3][ref1], en [artikel 4, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023132#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023132#Artikel4
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023132
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023132
        artikel: '4'
  - number: 5a.1
    text: |-
      In afwijking van deze regeling is de [Regeling openbare jaarverantwoording WMG][ref1] van overeenkomstige
      toepassing op de jaarverslaglegging van een onderwijsinstelling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0045649
  - number: 5a.1.a
    text: |-
      de onderwijsinstelling tevens een zorgaanbieder is waarop
      [artikel 40b van de Wet marktordening gezondheidszorg][ref1] van toepassing is; en


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 40b
  - number: 5a.1.b
    text: |-
      de netto-omzet van de onderwijsinstelling gedurende twee opeenvolgende balansdata, zonder onderbreking nadien
      gedurende twee opeenvolgende balansdata, voor een groter aandeel bestaat uit zorg of jeugdhulp dan uit onderwijs.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5a
  - number: 5a.2
    text: |-
      In afwijking van deze regeling is de [Regeling openbare jaarverantwoording WMG][ref1] is van overeenkomstige
      toepassing op het eerste en tweede boekjaar voor een onderwijsinstelling waarvan op de balansdatum van het eerste
      boekjaar een groter aandeel van de netto-omzet bestaat uit zorg of jeugdhulp dan uit onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0045649
  - number: 5a.3
    text: |-
      In afwijking van deze regeling is het eerste en tweede lid is de [Regeling openbare jaarverantwoording WMG][ref1]
      van overeenkomstige toepassing op een academisch ziekenhuis als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], met dien verstande dat in
      de toelichting op de financiële verantwoording financiële gegevens worden opgenomen aangaande de besteding van
      de rijksbijdrage voor de werkplaatsfunctie ten behoeve van het wetenschappelijk medisch onderwijs en onderzoek en
      kwantitatieve gegevens voor het verdeelmodel van die rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0045649
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0045649
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 5b.1
    text: |-
      In afwijking van deze regeling is zijn de [artikelen 4.2 tot en met 4.4 van de Regeling Jeugdwet][ref1] van
      overeenkomstige toepassing op de jaarverslaglegging van een onderwijsinstelling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel4
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: '4'
  - number: 5b.1.a
    text: |-
      de onderwijsinstelling tevens een jeugdhulpaanbieder als bedoeld in
      [artikel 1.1, onderdeel 1°, van de Jeugdwet][ref1] is, maar niet tevens een zorgaanbieder is waarop
      [artikel 40b van de Wet marktordening gezondheidszorg][ref2] van toepassing is; en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40b
  - number: 5b.1.b
    text: |-
      de netto-omzet van de onderwijsinstelling gedurende twee opeenvolgende balansdata, zonder onderbreking nadien
      gedurende twee opeenvolgende balansdata, voor een groter aandeel bestaat uit jeugdhulp dan uit onderwijs.
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5b
  - number: 5b.2
    text: |-
      In afwijking van deze regeling is zijn de [artikelen 4.2 tot en met 4.4 van de Regeling Jeugdwet][ref1] zijn van
      overeenkomstige toepassing op het eerste en tweede boekjaar voor een onderwijsinstelling waarvan op de balansdatum
      van het eerste boekjaar een groter aandeel van de netto-omzet bestaat uit jeugdhulp dan uit onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0036007#Artikel4
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0036007
        artikel: '4'
  - number: 5c
    text: |-
      Deze regeling berust mede op [artikel 6.19, zesde lid, van het Uitvoeringsbesluit WVO 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel5c
    references:
