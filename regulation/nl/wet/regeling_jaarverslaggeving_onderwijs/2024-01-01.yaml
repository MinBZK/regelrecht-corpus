  - number: 1.a
    text: |-
      onderwijsinstelling: een bekostigde school als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      een bekostigde school als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref2], een bekostigd
      regionaal expertisecentrum als bedoeld in [artikel 28b van de Wet op de expertisecentra][ref3], een
      school als bedoeld in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref4], met uitzondering van de
      scholen, bedoeld in de [artikelen 2.66][ref5] en [3.27 van die wet][ref6], een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref7] of een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8];


