  - number: 1.c
    text: |-
      jaarverslaggeving : het geheel van verslaggevingsdocumenten bestaande uit de jaarrekening, het bestuursverslag en
      de overige gegevens, bedoeld in [artikel 392 van Titel 9 Boek 2 BW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: 1.d
    text: |-
      jaarrekening: de jaarrekening, bedoeld in [artikel 361 van Titel 9, Boek 2, van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 1.e
    text: |-
      bestuursverslag: het verslag waarmee het bevoegd gezag van een onderwijsinstelling interne en externe
      belanghebbenden informeert over het gevoerde en voorgenomen beleid en de gang van zaken bij de instelling, de
      uitkomsten van het gevoerde beleid in het jaar waarover verslag wordt gedaan alsmede de aanwending van middelen in
      dat jaar en verantwoording aflegt overeenkomstig de gestelde wettelijke eisen;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
  - number: 1.f
    text: 'richtlijnen: de Richtlijnen voor de Jaarverslaggeving, zoals vastgesteld door de Raad voor de Jaarverslaggeving;'
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
  - number: 1.g
    text: |-
      BAPO: de regeling ‘Bevordering Arbeidsparticipatie Ouderen’ zoals opgenomen in de geldende CAO’s voor het primair
      onderwijs, het voortgezet onderwijs en het beroepsonderwijs en de volwasseneneducatie;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
  - number: 1.h
    text: 'SOP: de ‘Seniorenregeling onderwijspersoneel’ zoals opgenomen in de geldende CAO voor het hoger beroepsonderwijs;'
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
  - number: 1.i
    text: 'periodelasten: lasten die in aanmerking worden genomen in de periode waarover deze lasten zijn verschuldigd;'
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
  - number: 1.j
    text: |-
      volledige doordecentralisatie: overdracht van gelden en het overlaten van alle taken ten aanzien van het verzorgen
      van onderwijshuisvesting door de gemeente aan een bevoegd gezag in het primair of voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
  - number: 1.k
    text: |-
      *mbo-student:* student als bedoeld in de [WEB][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0023132/2024-01-01#Artikel1
