  - number: 5a
    text: |-
      1 In afwijking van deze regeling is de [Regeling openbare jaarverantwoording WMG][ref1] van overeenkomstige
      toepassing op de jaarverslaglegging van een onderwijsinstelling, indien:

      a. de onderwijsinstelling tevens een zorgaanbieder is waarop
      [artikel 40b van de Wet marktordening gezondheidszorg][ref2] van toepassing is; en

      b. de netto-omzet van de onderwijsinstelling gedurende twee opeenvolgende balansdata, zonder onderbreking nadien
      gedurende twee opeenvolgende balansdata, voor een groter aandeel bestaat uit zorg of jeugdhulp dan uit onderwijs.

      2 In afwijking van deze regeling is de [Regeling openbare jaarverantwoording WMG][ref3] is van overeenkomstige
      toepassing op het eerste en tweede boekjaar voor een onderwijsinstelling waarvan op de balansdatum van het eerste
      boekjaar een groter aandeel van de netto-omzet bestaat uit zorg of jeugdhulp dan uit onderwijs.

      3 In afwijking van deze regeling is het eerste en tweede lid is de [Regeling openbare jaarverantwoording WMG][ref4]
      van overeenkomstige toepassing op een academisch ziekenhuis als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], met dien verstande dat in
      de toelichting op de financiële verantwoording financiële gegevens worden opgenomen aangaande de besteding van
      de rijksbijdrage voor de werkplaatsfunctie ten behoeve van het wetenschappelijk medisch onderwijs en onderzoek en
      kwantitatieve gegevens voor het verdeelmodel van die rijksbijdrage.


