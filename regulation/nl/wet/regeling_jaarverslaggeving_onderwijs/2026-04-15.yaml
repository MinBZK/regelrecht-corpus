  - number: 3a
    text: |-
      1 Indien de totale baten van een bevoegd gezag ten hoogste € 15.000.000 bedragen kan het bevoegd gezag ervoor
      kiezen een compact bestuursverslag op te stellen.

      2 Dit artikel kan niet worden toegepast door een bevoegd gezag dat uitsluitend of eveneens het bevoegd gezag
      is van een onderwijsinstelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] of
      [artikel 1.8 van de Wet op hoger onderwijs en wetenschappelijk onderzoek][ref2].

      3 Indien een bevoegd gezag kiest voor het opstellen van een compact bestuursverslag is de toepassing van
      [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref3] en van de inrichtingseisen van de Richtlijnen voor de
      Jaarverslaggeving die expliciet betrekking hebben op het bestuursverslag niet verplicht, behoudens voor zover
      anders voortvloeit uit [bijlage 5][ref4].

      4 Indien een bevoegd gezag in enig jaar het maximum van totale baten zoals bedoeld in het eerste lid overschrijdt,
      kan het bevoegd gezag met ingang van het daaropvolgende verslagjaar nog voor ten hoogste drie achtereenvolgende
      verslagjaren een compact bestuursverslag opstellen.

      5 Indien de totale baten van een bevoegd gezag dalen tot onder het maximum van totale baten zoals bedoeld in
      het eerste lid, kan het bevoegd gezag ervoor kiezen een compact bestuursverslag op te stellen met ingang van het
      daaropvolgende verslagjaar.

      6 Met betrekking tot het uitvoeren van dit artikel neemt het bevoegd gezag bij wijzigingen ten aanzien van de
      inrichting van het bestuursverslag ten opzichte van het vorige verslagjaar daarover een toelichting op in het
      bestuursverslag.


