  - number: '4'
    text: |-
      1a In aanvulling op hoofdstuk 271 Personeelsbeloningen van de richtlijnen worden de lasten op basis van de Bapo
      en de SOP, overeenkomstig paragraaf 2, alinea 204, van dat hoofdstuk, in de staat van baten en lasten verantwoord
      als periodelasten.

      1b Overeenkomstig hoofdstuk 271 Personeelsbeloningen van de richtlijnen worden de gespaarde verlofuren als gevolg
      van de afspraken duurzame inzetbaarheid of de werktijdenvermindering voor senioren conform paragraaf 2, alinea 203,
      van dat hoofdstuk, op de balans opgenomen als een verplichting uit hoofde van een opbouw van rechten voor zover de
      gespaarde rechten op doorbetaalde afwezigheid kunnen worden opgenomen of verzilverd.

      2 Onderwijsinstellingen nemen met gebruikmaking van de in [bijlage 1][ref1] opgenomen tabel in het
      bestuursverslag op aan hoeveel ho-studenten zij uit het studentenondersteuningsfonds, bedoeld in
      [artikel 7.51 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], financiële ondersteuning
      hebben verleend, uitgesplitst naar de volgende onderdelen:

      a. ho-studenten in overmachtssituaties, zoals ziekte, functiebeperking, familieomstandigheden mantelzorg of niet
      studeerbare opleidingen;

      b. ho-studenten die optreden als bestuurslid van door de instelling erkende studie- of studentenverenigingen of in
      de studentenmedezeggenschap, en

      c. overige, zoals het leveren van uitzonderlijke prestaties op het gebied van sport of cultuur, financiële steun
      aan ho-studenten uit niet-EER-landen en uitgaande beurzen.

      Tevens geven de onderwijsinstellingen per categorie aan hoeveel ho-studenten een vergoeding hebben aangevraagd,
      hebben ontvangen, hoeveel in totaal per categorie is uitgekeerd en wat de gemiddelde hoogte en duur was van de
      vergoeding.

      2a Mbo-instellingen nemen met gebruikmaking van de in [bijlage 2][ref3] opgenomen tabel in het bestuursverslag
      op aan hoeveel mbo-studenten zij uit het mbo-studentenfonds, bedoeld in [artikel 8.1.5 WEB][ref4], ondersteuning
      hebben verleend. Daarbij geven de mbo-instellingen tevens aan hoeveel mbo-studenten ondersteuning hebben
      aangevraagd, hoeveel mbo-studenten ondersteuning toegekend hebben gekregen, hoeveel in totaal is toegekend en wat
      de gemiddelde hoogte was van de toekenningen. Deze informatie wordt uitgesplitst in vier categorieën:

      a. mbo-studenten die lid zijn van een studentenraad als bedoeld in [artikel 8a.1.2 WEB][ref5], van een andere door
      het bevoegd gezag ingestelde medezeggenschapsstructuur of van het bestuur van een studentenorganisatie van enige
      omvang met volledige rechtsbevoegdheid;

      b. mbo-studenten die activiteiten verrichten op bestuurlijk of maatschappelijk gebied die naar het oordeel van het
      bevoegd gezag mede in het belang zijn van de instelling of van het onderwijs dat de student volgt;

      c. mbo-studenten, of diens wettelijk vertegenwoordigers, die aantoonbaar onvoldoende financiële middelen hebben
      voor de aanschaf van onderwijsbenodigdheden waarover de student geacht wordt te beschikken; en

      d. mbo-studenten die in verband met de aanwezigheid van een bijzondere omstandigheid studievertraging hebben
      opgelopen.

      3 Instellingen voor hoger onderwijs als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6] nemen in het bestuursverslag
      een overzicht op van de vergoedingen aan en de declaraties van de individuele bestuurders. Hogescholen
      verantwoorden de declaraties van bestuurders in overeenstemming met de Handreiking, opgenomen in de brief van de
      Vereniging Hogescholen van 3 november 2016 met kenmerk 16.4347.avw (te raadplegen via www.onderwijsinspectie.nl).
      Universiteiten verantwoorden de declaraties van bestuurders in overeenstemming met de Handreiking verantwoording
      declaraties bestuurders, opgenomen in de brief van de Vereniging van Universiteiten van 7 september 2016 met
      kenmerk VSNU 16/214 U (te raadplegen via www.onderwijsinspectie.nl).

      4 In het bestuursverslag rapporteert het bevoegd gezag met gebruikmaking van de in [bijlage 3][ref7] opgenomen set
      gegevens en de daarbij behorende toelichting over de resultaten van het financiële beleid over het verslagjaar.
      Daarnaast rapporteert het bevoegd gezag – in meerjarenperspectief over de drie verslagjaren volgend op het
      verslagjaar en ingeval sprake is van majeure investeringen, in meerjarenperspectief over de vijf verslagjaren
      volgend op het verslagjaar. Er is sprake van een majeure investering als het totaal van de investering gedeeld
      door de totale jaarlijkse baten in de staat van baten en lasten gelijk is of groter dan 15%. In de sectoren primair
      onderwijs en voortgezet onderwijs wordt ingeval sprake is van volledige doordecentralisatie van de huisvesting,
      steeds een meerjarenperspectief opgenomen voor de periode van vijf jaren volgend op het verslagjaar. De toelichting
      op deze investeringen bevat in ieder geval een beschrijving van de relatie met de strategische doelstellingen, de
      omvang, het tijdpad, de wijze van financiering, inclusief een duidelijke onderbouwing met analyse van de prognose
      van de ontwikkeling van leerlingen-, mbo-studenten-, vavo-studenten- of ho-studentenaantallen en het gebruik van
      sturingsinstrumenten. De rapportage betreft onder meer het risicomanagement en het interne toezicht.

      5 Een bekostigde instelling voor hoger onderwijs dan wel een bekostigde instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref8], verantwoordt zich in het bestuursverslag over het
      gevoerde beleid zoals aangegeven in de volgende notities:

      a. Helderheid in de bekostiging van het hoger onderwijs (bijlage bij Kamerstukken II 2003/04, 28 817, nr. 5)

      b. Aanvulling op de notitie Helderheid in de bekostiging van het hoger onderwijs (bijlage bij II 2004/05, 28 248,
      nr. 72); en

      c. Helderheid in de bekostiging van het beroepsonderwijs en de volwasseneneducatie (Bijlage bij Kamerstukken
      2004/05, 28 248, nr. 72;

      d. van bovengenoemde notities is thema 2, Investeren van publieke middelen in private activiteiten, niet meer van
      toepassing. Dit thema is vervangen door de Beleidsregel investeren met publieke middelen in private activiteiten.

      5a In aanvulling op het vijfde lid verantwoordt een bekostigde instelling voor hoger onderwijs dan wel een
      bekostigde instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref9] zich
      vanaf het verslagjaar 2023 in het bestuursverslag eveneens over het gevoerde beleid zoals aangegeven in de
      [Beleidsregel investeren met publieke middelen in private activiteiten][ref10].

      6 De Minister van Onderwijs, Cultuur en Wetenschap publiceert jaarlijks een overzicht van de voor het betreffende
      verslagjaar relevante politieke of maatschappelijke thema’s, waarover het bevoegd gezag in het bestuursverslag
      rapporteert met betrekking tot de wijze waarop middelen zijn ingezet en de resultaten die daarmee zijn behaald.

      7 In het bestuursverslag rapporteert een bevoegd gezag als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref11], [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref12],
      of [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref13] over de tijdige aanwezigheid van de VOG met
      gebruikmaking van de in [bijlage 6][ref14] opgenomen tabel.


