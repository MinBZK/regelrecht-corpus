  - number: 5b
    text: |-
      1 In afwijking van deze regeling is zijn de [artikelen 4.2 tot en met 4.4 van de Regeling Jeugdwet][ref1] van
      overeenkomstige toepassing op de jaarverslaglegging van een onderwijsinstelling, indien:

      a. de onderwijsinstelling tevens een jeugdhulpaanbieder als bedoeld in
      [artikel 1.1, onderdeel 1°, van de Jeugdwet][ref2] is, maar niet tevens een zorgaanbieder is waarop
      [artikel 40b van de Wet marktordening gezondheidszorg][ref3] van toepassing is; en

      b. de netto-omzet van de onderwijsinstelling gedurende twee opeenvolgende balansdata, zonder onderbreking nadien
      gedurende twee opeenvolgende balansdata, voor een groter aandeel bestaat uit jeugdhulp dan uit onderwijs.

      2 In afwijking van deze regeling is zijn de [artikelen 4.2 tot en met 4.4 van de Regeling Jeugdwet][ref4] zijn van
      overeenkomstige toepassing op het eerste en tweede boekjaar voor een onderwijsinstelling waarvan op de balansdatum
      van het eerste boekjaar een groter aandeel van de netto-omzet bestaat uit jeugdhulp dan uit onderwijs.


