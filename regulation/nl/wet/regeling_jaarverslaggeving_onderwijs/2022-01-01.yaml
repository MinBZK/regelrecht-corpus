  - number: '5'
    text: |-
      Het bevoegd gezag levert jaarlijks vóór 1 juli de volgende gegevens over het voorafgaande kalenderjaar aan bij de
      Dienst Uitvoering Onderwijs:

      a. in schriftelijke vorm de jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1]; en

      b. met gebruikmaking van de methode SBR/XBRL overeenkomstig de op de website van de Dienst Uitvoering
      Onderwijs bekend gemaakte onderwijstaxonomie, de gegevens uit de jaarrekening, alsmede de gegevens, bedoeld in
      [artikel 3, onder e3][ref2], en [artikel 4, vierde lid][ref3].


