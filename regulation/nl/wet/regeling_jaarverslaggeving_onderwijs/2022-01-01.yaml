    text: |-
      In deze regeling wordt verstaan onder:

      a. onderwijsinstelling: een bekostigde school als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      een bekostigde school als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref2], een bekostigd
      regionaal expertisecentrum als bedoeld in [artikel 28b van de Wet op de expertisecentra][ref3], een
      school als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs ][ref4] met uitzondering van de
      scholen, bedoeld in [titel II, afdeling II van die wet][ref5], een bekostigde instelling als bedoeld in
      [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref6] of een instelling voor hoger onderwijs als
      bedoeld in [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7];

      b. bevoegd gezag: het bevoegd gezag, bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref8],
      het bestuur van een rechtspersoon die een centrale dienst in stand houdt als bedoeld in
      [artikel 68 van de Wet op het primair onderwijs][ref9], het bevoegd gezag, bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref10], het bestuur van de rechtspersoon die een regionaal
      expertisecentrum in stand houdt als bedoeld in [artikel 28b van de Wet op de expertisecentra][ref11],
      het bevoegd gezag, bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref12] onderscheidenlijk
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref13] dan wel het instellingsbestuur, bedoeld in
      [artikel 1.1, onder j, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref14];

      c. jaarverslaggeving : het geheel van verslaggevingsdocumenten bestaande uit de jaarrekening, het bestuursverslag
      en de overige gegevens, bedoeld in [artikel 392 van Titel 9 Boek 2 BW][ref15];

      d. jaarrekening: de jaarrekening, bedoeld in [artikel 361 van Titel 9, Boek 2, van het Burgerlijk Wetboek][ref16];

      e. bestuursverslag: het verslag waarmee het bevoegd gezag van een onderwijsinstelling interne en externe
      belanghebbenden informeert over het gevoerde en voorgenomen beleid en de gang van zaken bij de instelling, de
      uitkomsten van het gevoerde beleid in het jaar waarover verslag wordt gedaan alsmede de aanwending van middelen in
      dat jaar en verantwoording aflegt overeenkomstig de gestelde wettelijke eisen;

      f. richtlijnen: de Richtlijnen voor de Jaarverslaggeving, zoals vastgesteld door de Raad voor de Jaarverslaggeving;

      g. BAPO: de regeling ‘Bevordering Arbeidsparticipatie Ouderen’ zoals opgenomen in de geldende CAO’s voor het
      primair onderwijs, het voortgezet onderwijs en het beroepsonderwijs en de volwasseneneducatie;

      h. SOP: de ‘Seniorenregeling onderwijspersoneel’ zoals opgenomen in de geldende CAO voor het hoger
      beroepsonderwijs;

      i. periodelasten: lasten die in aanmerking worden genomen in de periode waarover deze lasten zijn verschuldigd;

      j. volledige doordecentralisatie: overdracht van gelden en het overlaten van alle taken ten aanzien van het
      verzorgen van onderwijshuisvesting door de gemeente aan een bevoegd gezag in het primair of voortgezet onderwijs;

      k. *mbo-student:* student als bedoeld in de [WEB][ref17];

      l. *ho-student:* student als bedoeld in de [WHW][ref18].


