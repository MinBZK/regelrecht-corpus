      In afwijking van of in aanvulling op [Titel 9 Boek 2 van het Burgerlijk Wetboek][ref1]:

      a. wordt de jaarverslaggeving ingericht overeenkomstig de richtlijnen, in het bijzonder de hoofdstukken 400, 640
      en 660 behoudens het bepaalde in [artikel 4, onder 1a][ref2] ten aanzien van het bevoegd gezag van een school of
      scholengemeenschappen in het primair en het voortgezet onderwijs;

      b. wordt de jaarverslaggeving gepubliceerd in de Nederlandse taal en in de in Nederland wettige valuta;

      c. is het verslagjaar gelijk aan een kalenderjaar;

      d. wordt de jaarverslaggeving opgesteld door het bevoegd gezag dat de onderwijsinstelling in stand houdt;

      e1. wordt de informatie, bedoeld in de [artikelen 1.7][ref3], [4.1][ref4] en
      [4.2 van de Wet normering topinkomens][ref5], opgenomen in de jaarrekening;

      e2. kan aan de [artikelen 383][ref6] en [383c van Boek 2 van het Burgerlijk Wetboek][ref7] worden voldaan
      middels het verstrekken van de betreffende bezoldigingsinformatie op basis van het bezoldigingsbegrip van de
      [Wet normering topinkomens][ref8];

      e3. geschiedt de elektronische aanlevering van de gegevens in het kader van de [Wet normering topinkomens][ref9]
      door gebruikmaking van het WNT-onderdeel uit de elektronische versie van de jaarrekening, zoals voor het
      betreffende verslagjaar voor het onderwijs is vastgesteld;

      e4. geschiedt de inrichting en vormgeving van de rapportage in de jaarrekening van de gegevens in het kader van de
      [Wet normering topinkomens][ref10] conform de wijze als bedoeld in onderdeel e3;

      f. wordt aan het bestuursverslag een verslag toegevoegd van de raad van toezicht of een vergelijkbare interne
      toezichthouder, waarin deze verantwoording aflegt over zijn handelen en van de resultaten die dat handelen heeft
      opgeleverd;

      f1. wordt in het bestuursverslag over de jaren 2019 tot en met 2024 een hoofdstuk toegevoegd over de voortgang ten
      aanzien van inhoud en proces van de kwaliteitsafspraken, bedoeld in artikel 1 van het Uitvoeringsbesluit WHW 2008,
      waarbij afspraken met de medezeggenschap over de besteding van de studievoorschotmiddelen terugkomen;

      f2. neemt het bevoegd gezag, indien het publieke eigen vermogen in een boekjaar boven de signaleringswaarden
      bovenmatig publiek eigen vermogen van de Inspectie van het Onderwijs uitstijgt, dienaangaande een toelichting in
      het bestuursverslag op;

      g. worden de balans en de staat van baten en lasten, het kasstroomoverzicht en de toelichting opgesteld
      overeenkomstig de modellen in de bijlagen bij hoofdstuk 660 van de richtlijnen. Het Besluit modellen jaarrekening,
      samengesteld door de Raad voor de Jaarverslaggeving en opgenomen in hoofdstuk 910 van de richtlijnen is van
      overeenkomstige toepassing;

      h. wordt een geconsolideerde jaarrekening als bedoeld in
      [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref11], alsmede het bestuursverslag, zo
      gespecificeerd dat in ieder geval inzicht ontstaat in de onderscheiden posten op het niveau van elk afzonderlijk
      bevoegd gezag, waarbij voor de bepaling van de operationele segmenten aansluiting wordt gezocht bij het
      bedrijfsproces, zoals de te onderscheiden onderwijssectoren en overige activiteiten op het niveau van elk
      afzonderlijk bevoegd gezag;

      i.

      j. wordt de jaarverslaggeving per instelling opgesteld als een bevoegd gezag meer dan één instelling als bedoeld
      in [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref12] of meer dan één instelling voor hoger
      onderwijs als bedoeld in [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref13] in
      stand houdt;

      k. blijven ten aanzien van onderwijsinstellingen voor openbaar onderwijs zonder afgescheiden vermogen die niet door
      een privaatrechtelijke rechtspersoon in stand worden gehouden of voor onderwijsinstellingen waarvoor anderszins
      geen toerekening mogelijk is van een of meer balansposten aan het belang van de instelling, de onder g bedoelde
      modellen wat betreft de inrichting van de balans beperkt tot die posten waar die toerekening wel mogelijk is;

      l. wordt separaat aan het bestuursverslag en de jaarrekening door het bevoegd gezag specifieke informatie
      toegevoegd in de vorm van een aanvullende set met nader te bepalen gegevens;

      l1. onverminderd onderdeel l, wordt separaat aan het bestuursverslag en de jaarrekening door het bevoegd gezag over
      het jaar 2021 een reflectie van de medezeggenschap op de realisatie van het plan tot dan toe, de betrokkenheid van
      belanghebbenden en de facilitering van de medezeggenschap toegevoegd;

      m. is het niet toegestaan de jaarrekening op te stellen volgens de door de International Accounting Standards Board
      vastgestelde en door de Europese Commissie goedgekeurde standaarden.


