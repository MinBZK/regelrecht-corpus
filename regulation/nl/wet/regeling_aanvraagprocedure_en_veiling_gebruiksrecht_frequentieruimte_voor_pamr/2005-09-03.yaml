---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_aanvraagprocedure_en_veiling_gebruiksrecht_frequentieruimte_voor_pamr
regulatory_layer: WET
publication_date: '2013-02-15'
valid_from: '2005-09-03'
bwb_id: BWBR0018687
url: https://wetten.overheid.nl/BWBR0018687/2005-09-03
preamble:
  text: |-
    Gelet op de artikelen 4, 6, eerste lid, en 8, eerste lid, van het Frequentiebesluit, artikel 2, eerste en tweede
    lid, van het Besluit tarieven openbaarheid van bestuur en de artikelen 4, vierde lid, en 5 van het Besluit
    vergoedingen Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: 1.a
    text: 'minister: Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: 1.b
    text: |-
      PAMR: Public Access Mobile Radio, een openbaar elektronisch communicatienetwerk voor mobiele
      communicatiedienstverlening ten behoeve van besloten gebruikersgroepen;
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: 1.c
    text: |-
      besloten gebruikersgroep: een besloten gebruikersgroep bestaat uit gebruikers van elektronische
      communicatiediensten die onderling een duurzame professionele relatie hebben en daardoor binnen de groep een
      communicatiebehoefte hebben die voortvloeit uit het gemeenschappelijke belang dat aan deze duurzame relatie
      ten grondslag ligt. De duurzame professionele relatie omvat meer dan alleen het gezamenlijk afnemen van
      elektronische communicatiediensten en de besloten gebruikersgroep is niet uitsluitend opgezet om elektronische
      communicatiediensten af te nemen;
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: 1.d
    text: |-
      informatiedocument: een overzicht van en een toelichting op het geheel van toepasselijke regels voor de aanvraag
      van een vergunning, de veilingprocedure alsmede de aan de te verlenen vergunning verbonden rechten en plichten;
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: 1.e
    text: 'aanvrager: degene die een aanvraag voor een vergunning voor PAMR doet;'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: 1.f
    text: 'deelnemer: aanvrager die gerechtigd is een bod uit te brengen.'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel1
  - number: '2'
    text: |-
      Ingevolge het besluit van de minister van 22 augustus 2005, (Stcrt. 2005, 169) is voor PAMR de volgende vergunning
      beschikbaar die door middel van een veiling zal worden verleend: 451,76875–454,76875 MHz en 461,76875–464,76875
      MHz. Een ontwerp van de vergunning is als [bijlage 1][ref1] bij deze regeling gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018687
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018687
  - number: '3.1'
    text: |-
      Degene die de beschikking wil hebben over het informatiedocument, kan een daartoe strekkend verzoek per brief
      of per elektronische post bij de minister indienen. Het informatiedocument kan worden opgevraagd met ingang van
      12 september 2005, 09.00 uur. Het informatiedocument kan worden afgehaald op het in het vierde lid genoemde adres,
      of wordt, indien daar expliciet om is verzocht, toegezonden.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel3
  - number: '3.2'
    text: |-
      Het verzoek wordt als volgt geadresseerd: De Minister van Economische Zaken, p/a notaris mr. C.A. de Zeeuw, Pels
      Rijcken & Droogleever Fortuijn Postbus 11756 2502 AT Den Haag e-mail: pamr@pelsrijcken.nl
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel3
  - number: '3.3'
    text: |-
      Voor de beschikbaarstelling van het informatiedocument is een bedrag van € 25,– verschuldigd. Het bedrag kan
      worden voldaan door middel van contante betaling bij het afhalen van het informatiedocument dan wel door middel
      van overboeking onder vermelding van ‘informatiedocument vergunning PAMR’ naar het volgende bankrekeningnummer:
      21.30.13.495 (Fortis bank Nederland N.V., Den Haag, t.n.v. Pels Rijcken & Droogleever Fortuijn, inzake derdengelden
      notariaat).
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel3
  - number: '3.4'
    text: |-
      Beschikbaarstelling van het informatiedocument door overhandiging bij het afhalen dan wel door toezending geschiedt
      nadat het in het derde lid genoemde bedrag is voldaan. Het afhalen geschiedt op het volgende adres: De Minister
      van Economische Zaken, p/a notaris mr. C.A. de Zeeuw, Pels Rijcken & Droogleever Fortuijn Koningin Julianaplein 30
      Gebouw Babylon Kantoren A, receptie vijfde verdieping 2595 AA Den Haag
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel3
  - number: '3.5'
    text: Het bedrag, genoemd in het derde lid, wordt niet geretourneerd.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel3
  - number: '4.1'
    text: |-
      Een ieder aan wie overeenkomstig [artikel 3][ref1] een informatiedocument is verstrekt, kan met betrekking
      tot dat document per brief of per elektronische post en per brief vragen stellen aan de minister. Indien er
      verschillen bestaan tussen de schriftelijke en de elektronische versie van de vragen, is de schriftelijke versie
      bepalend. De vragen worden uiterlijk op 23 september 2005, om 14.00 uur door tussenkomst van de notaris op het
      in [artikel 3, tweede lid][ref2], genoemde adres, door de minister ontvangen. Na voornoemde datum en voornoemd
      tijdstip ontvangen vragen worden niet beantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel3
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      De vragen worden op niet tot de vragensteller te herleiden briefpapier gesteld en zodanig geformuleerd dat ook
      daaruit niet de identiteit van de vragensteller kan worden herleid. De vragen worden in de Nederlandse taal
      gesteld. De identiteit van de vragensteller is uitsluitend aan de notaris bekend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel4
  - number: '4.3'
    text: |-
      Uiterlijk op 11 oktober 2005 zendt de minister aan een ieder aan wie een informatiedocument is verstrekt
      schriftelijk antwoord op de vragen die tijdig zijn ontvangen, die voldoen aan de eisen, bedoeld in het eerste en
      tweede lid, en betrekking hebben op het informatiedocument, vergezeld van de gestelde vragen.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel4
  - number: '5.1'
    text: |-
      De aanvraag bevat de gegevens en bescheiden, bedoeld in de bij deze regeling behorende [bijlage 2][ref1], en wordt
      overeenkomstig het model in [die bijlage][ref2] ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018687
      [ref2]: https://wetten.overheid.nl/BWBR0018687
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018687
      - id: ref2
        bwb_id: BWBR0018687
  - number: '5.2'
    text: |-
      De aanvraag is in de Nederlandse taal gesteld en aangeduid als het originele exemplaar. Dit exemplaar wordt door de
      aanvrager ondertekend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel5
  - number: '5.3'
    text: |-
      De aanvraag gaat vergezeld van drie als zodanig aangeduide afschriften. Indien er verschillen bestaan tussen het
      originele exemplaar en de afschriften, is het originele exemplaar bepalend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel5
  - number: '5.4'
    text: |-
      De aanvrager informeert de minister per brief onverwijld over wijzigingen met betrekking tot de in het eerste lid
      bedoelde gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel5
  - number: '5.5'
    text: |-
      Met de gegevens en bescheiden, bedoeld in het eerste lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel5
  - number: '6.1'
    text: Elke aanvrager dient slechts één aanvraag in.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel6
  - number: '6.2'
    text: |-
      De aanvraag wordt vanaf 12 september 2005 tot uiterlijk op 18 oktober 2005 om 14.00 uur per
      post dan wel door middel van persoonlijke overhandiging ontvangen op het adres, genoemd in
      [artikel 3, tweede respectievelijk vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel3
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
  - number: '6.3'
    text: De minister bevestigt onverwijld schriftelijk de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel6
  - number: '7'
    text: |-
      Indien de aanvrager niet heeft voldaan aan de in [artikel 6, tweede lid][ref1], gestelde eisen, wordt de aanvraag
      niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel6
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '6'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Indien de aanvrager niet heeft voldaan aan de in [artikel 5][ref1] of [artikel 6, eerste lid][ref2], gestelde
      eisen, deelt de minister de aanvrager dit schriftelijk mee.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel6
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '6'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      De aanvrager heeft gedurende vijf werkdagen, te rekenen vanaf de dag nadat de mededeling, bedoeld in het eerste
      lid, is verstuurd, de gelegenheid dit verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel8
  - number: '8.3'
    text: |-
      De gegevens ten behoeve van het verzuimherstel, bedoeld in het eerste lid, worden per post
      dan wel door middel van persoonlijke overhandiging ingediend bij het adres, genoemd in
      [artikel 3, tweede respectievelijk vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel3
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
  - number: '8.4'
    text: |-
      Indien het verzuim, bedoeld in het eerste lid, binnen de termijn, genoemd in het tweede lid, niet is hersteld of
      de aanvraag na herstel niet voldoet aan de in [artikel 5][ref1] of [artikel 6, eerste lid][ref2], gestelde eisen,
      wordt de aanvraag niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel6
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '6'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De minister deelt de aanvrager uiterlijk op 8 november 2005 schriftelijk mee of zijn aanvraag in behandeling wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel9
  - number: '9.2'
    text: |-
      Indien is voldaan aan de in [artikel 5][ref1] en[ 6][ref2] gestelde eisen, wordt de aanvrager getoetst aan de
      eisen, bedoeld in [artikel 10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018687#Artikel10
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018687
        artikel: '10'
        paragraaf: '2'
  - number: '10'
    text: 'Een aanvrager voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel10
  - number: 10.a
    text: |-
      de aanvrager is een rechtspersoon, opgericht in overeenstemming met het recht van een van de lidstaten van de
      Europese Unie of een van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging binnen de Europese Economische
      Ruimte;
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel10
  - number: 10.b
    text: 'wat betreft de financiële positie van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel10
  - number: 10.b.1°
    text: |-
      de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de aanvrager
      ingediend,
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel10
  - number: 10.b.2°
    text: de aanvrager heeft geen surcéance van betaling aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel10
  - number: 10.b.3°
    text: geen substantieel beslag is gelegd op bedrijfsmiddelen van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel10
  - number: '11.1'
    text: |-
      De minister stelt uiterlijk 15 november 2005 vast of de aanvrager voldoet aan de eisen, bedoeld in
      [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel10
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '10'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in [artikel 10][ref1] is voldaan, wijst de minister de
      aanvraag af. De minister stelt de desbetreffende aanvrager schriftelijk op de hoogte van zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel10
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '10'
        paragraaf: '2'
  - number: '12'
    text: |-
      Na de vaststelling, bedoeld in [artikel 11, eerste lid][ref1], stelt de minister vast of de voor PAMR beschikbare
      vergunning zonder toepassing van een veiling kan worden verleend. Dit is het geval indien in totaal slechts één
      aanvrager die aan de eisen, bedoeld in [artikel 10][ref2], voldoet, een aanvraag heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel10
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '11'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '10'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Indien uit de aanvraag blijkt dat is voldaan aan de eisen, bedoeld in [artikel 10][ref1], en na toepassing
      van [artikel 12][ref2] de noodzaak van veiling is komen vast te staan, stelt de minister de aanvrager hiervan
      schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel12
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '12'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt aan de aanvrager tevens bekend gemaakt hoeveel deelnemers er
      in totaal zijn.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel13
  - number: '14'
    text: |-
      Voor het geval na toepassing van [artikel 12][ref1] de noodzaak van veilen is komen vast te staan, sluit de
      minister een overeenkomst met een notaris die zorg draagt voor een goed en ordelijk verloop van de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel12
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '12'
        paragraaf: '3'
  - number: '15.1'
    text: |-
      Een deelnemer onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken of onderling afgestemde
      feitelijke gedragingen die afbreuk doen aan de tot stand te brengen mededinging in de veilingprocedure.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel15
  - number: '15.2'
    text: De minister kan een deelnemer die handelt in strijd met het eerste lid van deelname aan de veiling uitsluiten.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel15
  - number: '15.3'
    text: Een tijdens de veiling uitgebracht bod door een van deelname aan de veiling uitgesloten deelnemer is ongeldig.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel15
  - number: '16.1'
    text: De minister kan de veiling opschorten.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel16
  - number: '16.2'
    text: |-
      De minister kan onder meer tot opschorting van de veiling overgaan indien naar zijn oordeel sprake is van afspraken
      of gedragingen in strijd met [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel15
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '15'
        paragraaf: '5'
  - number: '17.1'
    text: De vergunning wordt via een veiling met gesloten bod geveild.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel17
  - number: '17.2'
    text: De veiling met gesloten bod omvat één veilingronde.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel17
  - number: '18'
    text: |-
      Een deelnemer is vanaf het moment dat hij een bod heeft uitgebracht tot en met het tijdstip waarop de
      veiling is afgerond onvoorwaardelijk en onherroepelijk aan zijn bod gebonden, tenzij hij op grond van
      [artikel 15, tweede lid][ref1], wordt uitgesloten van verdere deelname aan de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel15
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '15'
        paragraaf: '5'
  - number: '19.1'
    text: |-
      Gelijktijdig met de kennisgeving, bedoeld in [artikel 13, eerste lid][ref1], wordt aan iedere deelnemer een
      biedkaart verstrekt. Het model van deze biedkaart is als [bijlage 3][ref2] bij deze regeling gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018687
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018687
  - number: '19.2'
    text: 'Bij het verstrekken van de biedkaart wordt tevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: 19.2.a
    text: vanaf welk tijdstip de biedkaart kan worden ingediend;
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: 19.2.b
    text: op welk tijdstip de biedkaart uiterlijk moet zijn ingediend;
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: 19.2.c
    text: op welk adres de biedkaart per post dan wel door middel van persoonlijke overhandiging moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: '19.3'
    text: |-
      Een bod wordt uitsluitend uitgebracht door middel van de in het eerste lid bedoelde biedkaart op het in het tweede
      lid, onder c, bedoelde adres.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: '19.4'
    text: De biedkaart wordt in de Nederlandse taal ingevuld.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: '19.5'
    text: |-
      Het bedrag van het bod wordt in letters geschreven en wordt vermeld in hele euro’s. Biedingen boven een bedrag van
      nul euro eindigen niet op een nul.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
  - number: '19.6'
    text: |-
      De deelnemer aan de veiling die een bod uitbrengt, voldoet een bedrag ter hoogte van zijn bod tot zekerheid
      van de gestanddoening van zijn bod. Uiterlijk op het in het tweede lid, onder b, bedoelde tijdstip, is het
      bedoelde bedrag, onder vermelding van ‘zekerheidstelling PAMR’ ontvangen op het bankrekeningnummer, genoemd
      in [artikel 3, derde lid][ref1], of is voor het bedoelde bedrag ter zekerheidstelling een bankgarantie
      volgens het model dat als [bijlage 4][ref2] bij deze regeling is gevoegd, overgelegd aan de notaris op het in
      [artikel 3, vierde lid][ref3], genoemde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018687
      [ref3]: https://wetten.overheid.nl/BWBR0018687#Artikel3
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
      - id: ref3
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
  - number: '20.1'
    text: 'Een bod wordt uitgebracht op een biedkaart die:'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel20
  - number: 20.1.a
    text: |-
      niet eerder dan het in [artikel 19, tweede lid, onder a][ref1], bedoelde tijdstip en niet later dan het in
      [artikel 19, tweede lid, onder b][ref2], bedoelde tijdstip wordt ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel19
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '19'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '19'
        paragraaf: '6'
  - number: 20.1.b
    text: volledig en op de juiste wijze is ingevuld en ondertekend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel20
  - number: '20.2'
    text: |-
      De notaris stelt vast of de biedkaart niet eerder, onderscheidenlijk niet later dan de in het eerste lid, onder a,
      bedoelde tijdstippen is ingediend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel20
  - number: '21.1'
    text: |-
      Indien een bod niet voldoet aan de [artikelen 19, derde, vierde, vijfde of zesde lid][ref1], of
      [20, eerste lid, onder b][ref2], wordt de deelnemer door de minister in de gelegenheid gesteld alsnog aan genoemde
      bepalingen te voldoen binnen een door de minister te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel20
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '19'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '20'
        paragraaf: '6'
  - number: '21.2'
    text: 'Een bod is ongeldig indien:'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel21
  - number: 21.2.a
    text: |-
      het niet voldoet aan [artikel 20, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel20
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '20'
        paragraaf: '6'
  - number: 21.2.b
    text: na toepassing van het eerste lid nog niet is voldaan aan de daarin genoemde bepalingen.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel21
  - number: '22.1'
    text: |-
      De notaris stelt na de veilingronde en na de door de minister op basis van [artikel 21, eerste lid][ref1], gestelde
      termijn(en), vast welke deelnemer het hoogste bod heeft uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel21
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '21'
        paragraaf: '6'
  - number: '22.2'
    text: |-
      In geval twee of meer deelnemers eenzelfde hoogste bod hebben uitgebracht, stelt de notaris, na loting, vast welke
      deelnemer wordt aangemerkt als deelnemer met het hoogste bod.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel22
  - number: '23.1'
    text: |-
      Na de vaststelling, bedoeld in [artikel 22][ref1], verleent de minister onverwijld aan de deelnemer met het hoogste
      bod, bedoeld in [artikel 22][ref2], de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018687#Artikel22
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '22'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0018687
        artikel: '22'
        paragraaf: '6'
  - number: '23.2'
    text: |-
      Tegelijk met de vergunningverlening, bedoeld in het eerste lid, verklaart de minister onverwijld de aanvragen
      waarbij een ongeldig bod is uitgebracht, bedoeld in [artikel 21, tweede lid][ref1], niet ontvankelijk en wijst hij
      de overige aanvragen af. Daarbij maakt de minister bekend aan welke aanvrager de vergunning wordt verleend en wat
      de hoogte van zijn bod was.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel21
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '21'
        paragraaf: '6'
  - number: '23.3'
    text: |-
      De deelnemer, bedoeld in het eerste lid, die ter voldoening van het bedrag ter zekerheidstelling een bankgarantie
      heeft overgelegd, betaalt het door hem verschuldigde bedrag ter hoogte van zijn bod binnen twee weken volgend op
      de datum waarop de vergunning is verleend op het bankrekeningnummer, genoemd in [artikel 3, derde lid][ref1], onder
      vermelding van ‘PAMR-veilingbod’. Zodra het verschuldigde bedrag is ontvangen, wordt de bankgarantie teruggegeven
      aan de bank die deze bankgarantie heeft afgegeven door middel van de procedure zoals beschreven in het als
      [bijlage 4][ref2] bij deze regeling opgenomen model van de bankgarantie. De minister stelt de vergunninghouder
      onverwijld op de hoogte van het teruggeven van de bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0018687#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018687
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018687
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018687
  - number: '23.4'
    text: |-
      Indien de deelnemer, bedoeld in het eerste lid, niet aan zijn betalingsverplichting als bedoeld in het tweede lid
      voldoet, wordt de door hem overgelegde bankgarantie voor de betaling aangewend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel23
  - number: '23.5'
    text: |-
      Indien de deelnemer, bedoeld in het eerste lid, ter voldoening van het bedrag ter zekerheidstelling een waarborgsom
      heeft gestort, wordt de door hem gestorte waarborgsom voor de betaling van het door hem verschuldigde bedrag ter
      hoogte van zijn bod aangewend.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel23
  - number: '23.6'
    text: |-
      De minister betaalt de deelnemer aan wie geen vergunning wordt verleend, en die ter voldoening van het bedrag
      ter zekerheidstelling, een waarborgsom heeft gestort, deze waarborgsom vermeerderd met de rente van een
      éénmaandsdeposito terug of geeft, indien de deelnemer ter voldoening van het bedrag ter zekerheidstelling een
      bankgarantie heeft overgelegd, deze bankgarantie terug aan de bank die deze heeft afgegeven door middel van de
      procedure zoals beschreven in het als [bijlage 4][ref1] bij deze regeling opgenomen model van de bankgarantie. De
      minister stelt de deelnemer onverwijld op de hoogte van het teruggeven van de bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0018687
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018687
  - number: '25'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvraagprocedure en veiling gebruiksrecht frequentieruimte voor PAMR.'
    url: https://wetten.overheid.nl/BWBR0018687/2005-09-03#Artikel26
