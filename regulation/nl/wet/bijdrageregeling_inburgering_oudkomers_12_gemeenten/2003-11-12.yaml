preamble:
  text: |-
    Handelende in overeenstemming met de minister van Onderwijs, Cultuur en Wetenschappen, de staatssecretaris van
    Volksgezondheid, Welzijn en Sport en de minister van Sociale Zaken en Werkgelegenheid,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a)

              *minister:*


              de Minister voor Vreemdelingenzaken en Integratie;



            b)

              *gemeenten:*


              de gemeenten Culemborg, Diemen, Gorinchem, Harderwijk, Hoogezand-Sappemeer, Leerdam, Maassluis, Roermond,
      Tiel, Weesp, IJsselstein en Zeist;



            c)

              *gemeentebestuur:*


              het college van burgemeester en wethouders van een gemeente, genoemd in onderdeel b;



            d)

              *oudkomers:*


              leden van etnische minderheidsgroepen die al voor langere tijd legaal in Nederland verblijven;



            e)

              *meerjarig plan:*


              het plan, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel2
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '2'
  - number: '2'
    text: |-
      1 De minister verstrekt het gemeentebestuur voor de uitvoering van het gemeentelijk beleid ter verbetering van
      de inburgering van oudkomers een bijdrage ter hoogte van het in de bij deze regeling behorende bijlage vermelde
      bedrag voor de periode 2001 tot en met 2003, indien het gemeentebestuur de minister een meerjarig plan voorlegt,
      waarin een samenstel van maatregelen is opgenomen dat naar het oordeel van de minister voldoet aan de in de
      [artikelen 4][ref1] en [5][ref2] gestelde voorwaarden.

      2 De minister verstrekt het gemeentebestuur ten behoeve van de ontwikkeling, de voorbereiding en de start van het
      meerjarig plan een bijdrage ter hoogte van het bedrag vermeld in de bij deze regeling behorende bijlage voor het
      jaar 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012253#Artikel5
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012253
        artikel: '5'
  - number: '3'
    text: |-
      De op grond van deze regeling toe te kennen bijdragen worden beschikbaar gesteld onder het voorbehoud van
      autorisatie door de begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel3
  - number: '4'
    text: |-
      Aan het meerjarig plan legt het gemeentebestuur de volgende doelstelling ten grondslag: het vergroten van deelname
      aan en succesvolle afronding van trajecten voor in het bijzonder de beheersing van de Nederlandse taal door
      werklozen en opvoeders uit de groep oudkomers.
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel4
  - number: '5'
    text: |-
      1 Het gemeentebestuur geeft in het meerjarig plan een beschrijving van de omvang en de samenstelling van de groepen
      waarop het gemeentelijk beleid met het oog op het bereiken van de in [artikel 4][ref1] genoemde doelstelling is
      gericht.

      2 Het gemeentebestuur geeft in het meerjarig plan een beschrijving van de maatregelen die met het oog op de in
      [artikel 4][ref2] genoemde doelstelling worden genomen en een globale indicatie van de bestedingen die ten laste
      van de bijdrage, bedoeld in [artikel 2, eerste lid][ref3], zullen worden gedaan.

      3 Het gemeentebestuur geeft ten aanzien van de in het tweede lid bedoelde maatregelen aan welke prestaties in
      termen van streefcijfers ten opzichte van de vastgestelde beginsituatie zullen worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012253#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012253#Artikel2
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012253
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0012253
        artikel: '2'
  - number: '6'
    text: |-
      Indien de minister van oordeel is dat het meerjarig plan niet voldoet aan de [artikelen 4][ref1] en [5][ref2],
      stelt hij het gemeentebestuur in de gelegenheid het meerjarig plan aan te passen. Hij stelt daarbij een termijn en
      geeft aan op welke onderdelen het meerjarig plan aanpassing behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012253#Artikel5
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012253
        artikel: '5'
  - number: '7'
    text: |-
      1 Het gemeentebestuur ontvangt de bijdrage, bedoeld in [artikel 2, tweede lid][ref1], voor 1 december 2000.

      2 Het gemeentebestuur ontvangt de bijdrage, bedoeld in [artikel 2, eerste lid][ref2], in drie jaarlijkse termijnen,
      die telkens voor 1 juli betaalbaar worden gesteld.

      3 Indien op 1 juli 2001 het meerjarig plan nog niet is goedgekeurd wordt de termijn in 2001 onder voorbehoud van
      goedkeuring van het meerjarig plan uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012253#Artikel2
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012253
        artikel: '2'
  - number: '8'
    text: |-
      1 Het gemeentebestuur dient de bijdrage, bedoeld in [artikel 2, eerste lid][ref1], uiterlijk 31 december 2004 te
      hebben besteed.

      2 Het gemeentebestuur brengt uiterlijk 15 juli 2005 aan de minister verslag uit over de besteding van de bijdragen,
      bedoeld in [artikel 2, eerste en tweede lid][ref2].

      3 Het financieel verslag, bedoeld in het eerste lid, kan deel uitmaken van de rekening, bedoeld in
      [artikel 197, derde lid, van de Gemeentewet][ref3]. Het verslag is dan voorzien van de accountantsverklaring,
      bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012253#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012253
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '9'
    text: |-
      De minister kan de bijdrage, bedoeld in [artikel 2, eerste en tweede lid][ref1], geheel of gedeeltelijk
      terugvorderen, indien uit het financieel verslag, bedoeld in [artikel 8][ref2], blijkt dat de bijdrage niet is
      besteed aan de voorbereiding en uitvoering van het meerjarig plan.


      [ref1]: https://wetten.overheid.nl/BWBR0012253#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012253#Artikel8
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012253
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012253
        artikel: '8'
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 15 november 2000.
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Bijdrageregeling inburgering oudkomers 12 gemeenten.'
    url: https://wetten.overheid.nl/BWBR0012253/2003-11-12#Artikel11
