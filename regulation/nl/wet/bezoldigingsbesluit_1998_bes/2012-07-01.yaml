  - number: '7'
    text: |-
      De bezoldiging van de ambtenaar met een onvolledige werktijd wordt vastgesteld op een evenredig deel van de
      bezoldiging bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel7
  - number: '8'
    text: |-
      Ingeval de ambtenaar bevorderd wordt naar een functie waaraan een bezoldigingsschaal is verbonden die een hogere
      maximum-bezoldiging bevat dan die welke voorkomt in de schaal volgens welke hij tot dusver is bezoldigd, wordt hem
      de bezoldigingstrede in de nieuwe schaal toegekend waarvan het bedrag procentueel ten minste zoveel hoger is dan
      dat van de hem laatstelijk toekomende bezoldigingstrede in de oude schaal, als in die oude schaal het procentuele
      verschil tussen twee bezoldigingstreden uitmaakt.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel8
  - number: '9'
    text: |-
      1 Aan de ambtenaar, aan wie zodanige eisen gesteld worden, dat zijn positie of taak een bijzonder karakter draagt,
      kan Onze Minister wie het aangaat een in ieder afzonderlijk geval vast te stellen toelage toekennen.

      2 De toelage wordt bepaald op ten hoogste vijfentwintig procent (25%) van de bezoldiging van de betrokken
      ambtenaar, en wordt tezamen met deze betaalbaar gesteld.

      3 Indien het onmogelijk blijkt om het tijdvak gedurende welke het recht op de toelage bestaat reeds bij de
      toekenning te bepalen, wordt in de beschikking waarbij de toekenning geschiedt het tijdstip vastgesteld waarop door
      Onze Minister wie het aangaat zal worden beslist of de gronden daartoe nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel9
  - number: 9a
    text: |-
      1 De ambtenaar heeft jaarlijks recht op een eindejaarsuitkering ter grootte van USD 41,67 vermenigvuldigd met het
      aantal maanden, inclusief de maand van uitbetaling, dat de ambtenaar in het desbetreffende kalenderjaar in dienst
      was.

      2 De eindejaarsuitkering wordt uitbetaald in de maand december.

      3 Voor een ambtenaar voor wie de geldende werktijd korter is dan de gebruikelijke volledige werktijd, wordt het
      ingevolge het eerste lid van toepassing zijnde bedrag vermenigvuldigd met een breuk waarvan de teller bestaat
      uit het aantal uren van de voor die ambtenaar geldende werktijd en de noemer uit het aantal uren van de voor zijn
      functie geldende gebruikelijke volledige werktijd.

      4 In afwijking van het tweede lid, wordt bij ontslag van de ambtenaar de eindejaarsuitkering uitbetaald in de
      laatste maand van zijn dienstverband.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel9a
  - number: '10'
    text: |-
      De gratificatie, bedoeld in [artikel 75 van de wet][ref1], bedraagt ten hoogste acht en eenderde procent (81/%) van
      de bezoldiging van de betrokken ambtenaar, berekend over een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel75
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '75'
  - number: 10a
    text: |-
      1 Voor het bewonen van een ambtswoning door portiers en conciërges wordt op de bezoldiging een korting toegepast
      van 12 procent.

      2 In afwijking van het eerste lid, kan Onze Minister in de gevallen waarin naar zijn oordeel daartoe aanleiding
      bestaat, de korting vaststellen op een lager percentage dan wel op een bepaald bedrag, mits dit eveneens minder
      beloopt dan 12 procent van de bezoldiging.

      3 Indien een portier of een conciërge een ambtswoning bewoont, draagt hij de onderhoudskosten welke volgens
      wettelijke voorschriften en het plaatselijk gebruik ten laste van de huurder zijn.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel10a
  - number: '11'
    text: |-
      1 De ambtenaar kan binnen een maand nadat hij van de beslissing inzake de vaststelling van een bezoldiging of
      inzake de toekenning van een verhoging, toelage, gratificatie of andere beloning, en van de weigering om hem een
      verhoging, toelage, gratificatie of andere beloning toe te kennen in kennis is gesteld of nadat hij geacht kan
      worden op een andere wijze daarmee bekend te zijn geworden, zijn bezwaren ertegen aan het bevoegde gezag kenbaar
      maken door de indiening van een bezwaarschrift.

      2 Het bezwaarschrift wordt door de ambtenaar of namens hem door een gemachtigde ondertekend. Indien het
      bezwaarschrift door een gemachtigde is getekend, worden stukken welke naar aanleiding ervan door het bevoegde gezag
      tot de ambtenaar worden gericht aan deze gemachtigde of in elk geval mede aan deze toegezonden.

      3 De indiening van een bezwaarschrift schorst niet de uitvoering van de beslissing waartegen bezwaar wordt gemaakt.

      4 Tenzij het bezwaar kennelijk niet-ontvankelijk of ongegrond is, wordt de ambtenaar in de gelegenheid gesteld
      over zijn bezwaren te worden gehoord door een of meer personen die het bevoegde gezag daartoe aanwijst; degene die
      aangewezen is, onderscheidenlijk de meerderheid van degenen die aangewezen zijn, mag niet bij de totstandkoming
      van de beslissing of van de weigering waartegen het bezwaar is ingebracht betrokken zijn geweest. De ambtenaar kan
      tijdens de zitting waarin hij wordt gehoord gebruik maken van de diensten van een raadsman.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel11
  - number: '12'
    text: |-
      1 Het bevoegde gezag deelt aan de ambtenaar zijn beslissing op het door deze ingediende bezwaar zo spoedig
      mogelijk, doch uiterlijk binnen een maand na de ontvangst van het bezwaarschrift of, indien een gehoor heeft
      plaatsgevonden, na de datum van dat gehoor, mede. Het tijdvak van een maand kan door het bevoegde gezag bij
      gemotiveerde beschikking eenmaal met ten hoogste een maand worden verlengd.

      2 De mededeling omtrent de beslissing bevat de overwegingen waarop deze steunt en, indien het bezwaar geheel of
      gedeeltelijk ontvankelijk is gebleken, de wijziging van de oorspronkelijke beslissing of weigering waartoe een
      heroverweging op grond van deze ontvankelijkheid het bevoegde gezag heeft geleid.

      3 De beslissing op het bezwaar is een beschikking als bedoeld in artikel 3, eerste lid, van de Wet
      ambtenarenrechtspraak BES. Indien met deze beslissing niet of niet geheel aan het bezwaar van de ambtenaar wordt
      tegemoetgekomen, wordt hem in de mededeling, bedoeld in het voorgaande lid, tevens medegedeeld dat hij bij het
      gerecht in ambtenarenzaken in beroep kan komen en de termijn waarbinnen dit dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel12
