        artikel: '82'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '24'
  - number: '6'
    text: |-
      1 De bezoldiging van de ambtenaar wordt verhoogd tot het bedrag dat behoort bij de naast-hogere bezoldigingstrede
      in de schaal, indien hij naar het oordeel van het bevoegde gezag, dat is neergelegd in een formele beoordeling als
      bedoeld in [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref1], zijn functie naar behoren
      vervult. Deze beoordeling vindt voor iedere ambtenaar ten laatste één jaar na zijn indiensttreding of overgang naar
      een andere functie en vervolgens ten minste aan het einde van elk jaar plaats.

      2 De bezoldiging van de ambtenaar kan worden verhoogd tot het bedrag dat behoort bij de eerste
      bezoldigingstrede volgend op de naast-hogere bezoldigingstrede in de schaal, indien hij naar
      het oordeel van het bevoegde gezag, dat is neergelegd in een formele beoordeling als bedoeld in
      [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref2], zijn functie zeer goed of uitstekend
      verricht.

      3 Vervult de ambtenaar zijn functie naar het oordeel van het bevoegde gezag niet naar behoren, dan blijft verhoging
      van de bezoldiging achterwege.

      4 De in het eerste en het tweede lid bedoelde verhogingen van de bezoldiging worden met ingang van 1 januari van
      een jaar toegekend, zolang de ambtenaar de maximum-bezoldiging van de voor hem geldende bezoldigingsschaal nog niet
      heeft bereikt, doch voor de eerste maal niet eerder dan nadat sinds zijn aanstelling als ambtenaar ten minste zes
      maanden zijn verstreken.

      5 Voor de ambtenaar die volgens een der schalen 1 tot en met 6 wordt bezoldigd en die de maximum-bezoldiging in de
      voor hem geldende schaal heeft bereikt, wordt, indien hij naar het oordeel van het bevoegde gezag, neergelegd in
      een formele beoordeling als bedoeld in [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref3],
      zijn functie zeer goed vervult, de bezoldiging na verloop van telkens twee jaren verhoogd tot het bedrag dat
      vermeld is achter de naast-hogere bezoldigingstrede in de schaal die wordt voorafgegaan door de letter U.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel12
