  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* de [Ambtenarenwet BES][ref1];

      b. [vervallen]

      c. *ambtenaar:* de ambtenaar in dienst van de staat, wiens bezoldiging niet bij afzonderlijke wettelijke regeling
      is geregeld;

      d. *bezoldiging:* het loon van de ambtenaar voor het vervullen van zijn functie, met inachtneming van de bepalingen
      van dit besluit aan de hand van een bezoldigingsschaal vastgesteld;

      e. *bezoldigingsschaal:* een als zodanig bij ministeriële regeling vastgestelde, van een volgnummer voorziene reeks
      van bedragen;

      f. *bezoldigingstrede:* elk afzonderlijk binnen een bezoldigingsschaal opgenomen bezoldigingsbedrag, voorzien van
      een al dan niet door de letter U (=uitloop) voorafgegaan volgnummer of van de aanduiding «G.T.» (=garantie-trede);

      g. *functie:* het samenstel van werkzaamheden door de ambtenaar in zijn ambt te verrichten krachtens en
      overeenkomstig hetgeen hem door of namens het daartoe bevoegde gezag uitdrukkelijk of impliciet is opgedragen;

      h. *maximum-bezoldiging:* het bedrag behorende bij de hoogste bezoldigingstrede van een bezoldigingsschaal, waarvan
      de volgnummeraanduiding uitsluitend uit een getal bestaat;

      i. *toelage:* een een- of meermalige toeslag op de bezoldiging in meerdering en tezamen met deze bezoldiging
      betaalbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '2'
    text: |-
      1 De bezoldiging en eventuele met die bezoldiging verbonden toelagen worden maandelijks aan of tegen het einde van
      de maand waarop de betaling betrekking heeft betaald.

      2 Wanneer de bezoldiging of een toelage moet worden uitbetaald over een gedeelte van een kalendermaand, wordt het
      te betalen bedrag berekend door het voor een maand vastgesteld bedrag te vermenigvuldigen met het aantal dagen
      gedurende welke de betrokken ambtenaar in dienst is geweest en het produkt te delen door dertig.

      3 Van het bepaalde in het eerste en tweede lid kan worden afgeweken, ingeval daartoe naar het oordeel van het
      bevoegde gezag op grond van bijzondere omstandigheden aanleiding bestaat.

      4 De bezoldiging per uur bedraagt 1/170 deel van de bezoldiging per maand bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel2
  - number: 2a
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels worden gesteld met
      betrekking tot het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel2a
  - number: 2b
    text: |-
      Aan de ambtenaar, die in januari 2011 in dienst was van de staat, wordt een eenmalige uitkering verleend ter hoogte
      van USD 100,00 netto.
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel2b
  - number: '3'
    text: |-
      1 Bij de indiensttreding of bij de overgang naar een andere functie wordt de bezoldigingsschaal bepaald met
      inachtneming van de aard en het niveau van de functie waarmede de betrokken ambtenaar wordt belast.

      2 Van het eerste lid kan worden afgeweken, indien het gebrek aan ervaring met betrekking tot de arbeid die de
      betrokkene in de functie moet verrichten de verwachting aannemelijk maakt dat zijn wijze van functioneren zich
      tegen de toepassing van dat artikellid vooralsnog verzet. In dit geval kan de bezoldigingsschaal bepaald worden
      en gedurende een tijdvak van ten hoogste drie jaren bepaald blijven op ten hoogste twee volgnummers beneden de
      schaal die met toepassing van het eerste lid in aanmerking zou komen. Indien het functioneren van de ambtenaar aan
      het einde van het genoemde tijdvak de toepassing van het eerste lid nog niet toelaat, wordt hij geplaatst in een
      functie waarvan de aard en het niveau in overeenstemming is met de schaal volgens welke hij bezoldigd wordt, of
      wordt hem ontslag aangezegd.

      3 Aard en niveau van de functie worden bepaald aan de hand van functiebeschrijvingen en functieniveau-
      karakteristieken, welke deel uitmaken van een bij ministeriële regeling vast te stellen functiewaarderingssysteem.

      4 Anders dan bij wijze van disciplinaire straf als bedoeld in [artikel 82 van de wet][ref1], kan zonder voorafgaand
      ontslag voor een ambtenaar geen bezoldigingsschaal worden vastgesteld die een lagere maximum-bezoldiging bevat dan
      die welke in de voordien voor hem geldende bezoldigingsschaal aangegeven is.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
  - number: '5'
    text: |-
      Indien de ambtenaar anders dan bij wijze van disciplinaire straf als bedoeld in [artikel 82 van de wet][ref1],
      wordt belast met een andere functie, als gevolg waarvan zijn bezoldiging op grond van de overige bepalingen van dit
      besluit een verlaging zou moeten ondergaan, zonder dat de bekleding met die andere functie bij wijze van waarneming
      als bedoeld in [artikel 24 van het Rechtspositiebesluit ambtenaren BES][ref2] geschiedt of zonder dat ontslag
      voorafgegaan is, blijft deze verlaging achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel24
    url: https://wetten.overheid.nl/BWBR0028491/2012-07-01#Artikel5
