---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: bezoldigingsbesluit_1998_bes
regulatory_layer: WET
publication_date: '2026-04-09'
valid_from: '2025-01-01'
bwb_id: BWBR0028491
url: https://wetten.overheid.nl/BWBR0028491/2025-01-01
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* de [Ambtenarenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 1.b
    text: |-
      *ambtenaar:* de ambtenaar in dienst van de staat, wiens bezoldiging niet bij afzonderlijke wettelijke regeling
      is geregeld;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: 1.c
    text: |-
      *bezoldiging:* het loon van de ambtenaar voor het vervullen van zijn functie, met inachtneming van de bepalingen
      van dit besluit aan de hand van een bezoldigingsschaal vastgesteld;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: 1.d
    text: |-
      *bezoldigingsschaal:* een als zodanig bij ministeriële regeling vastgestelde, van een volgnummer voorziene reeks
      van bedragen;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: 1.e
    text: |-
      *bezoldigingstrede:* elk afzonderlijk binnen een bezoldigingsschaal opgenomen bezoldigingsbedrag, voorzien van een
      volgnummer dat niet wordt voorafgegaan door de aanduiding «GRT», «GJT», «GDT» of «GOT»;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: 1.f
    text: |-
      *functie:* het samenstel van werkzaamheden door de ambtenaar in zijn ambt te verrichten krachtens en overeenkomstig
      hetgeen hem door of namens het daartoe bevoegde gezag uitdrukkelijk of impliciet is opgedragen;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: 1.g
    text: '*maximum-bezoldiging:* het bedrag, behorende bij de hoogste bezoldigingstrede van een bezoldigingsschaal.'
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel1
  - number: '2.1'
    text: |-
      De bezoldiging en eventuele met die bezoldiging verbonden toelagen worden maandelijks aan of tegen het einde van de
      maand waarop de betaling betrekking heeft betaald.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      Wanneer de bezoldiging of een toelage moet worden uitbetaald over een gedeelte van een kalendermaand, wordt het
      te betalen bedrag berekend door het voor een maand vastgesteld bedrag te vermenigvuldigen met het aantal dagen
      gedurende welke de betrokken ambtenaar in dienst is geweest en het produkt te delen door dertig.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel2
  - number: '2.3'
    text: |-
      Van het bepaalde in het eerste en tweede lid kan worden afgeweken, ingeval daartoe naar het oordeel van het
      bevoegde gezag op grond van bijzondere omstandigheden aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel2
  - number: '2.4'
    text: De bezoldiging per uur bedraagt 1/150 deel van de bezoldiging per maand bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel2
  - number: 2a
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels worden gesteld met
      betrekking tot het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Bij de indiensttreding of bij de overgang naar een andere functie wordt de bezoldigingsschaal bepaald met
      inachtneming van de aard en het niveau van de functie waarmede de betrokken ambtenaar wordt belast.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel3
  - number: '3.2'
    text: |-
      Van het eerste lid kan worden afgeweken, indien het gebrek aan ervaring met betrekking tot de arbeid die de
      betrokkene in de functie moet verrichten de verwachting aannemelijk maakt dat zijn wijze van functioneren zich
      tegen de toepassing van dat artikellid vooralsnog verzet. In dit geval kan de bezoldigingsschaal bepaald worden
      en gedurende een tijdvak van ten hoogste drie jaren bepaald blijven op ten hoogste twee volgnummers beneden de
      schaal die met toepassing van het eerste lid in aanmerking zou komen. Indien het functioneren van de ambtenaar aan
      het einde van het genoemde tijdvak de toepassing van het eerste lid nog niet toelaat, wordt hij geplaatst in een
      functie waarvan de aard en het niveau in overeenstemming is met de schaal volgens welke hij bezoldigd wordt, of
      wordt hem ontslag aangezegd.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel3
  - number: '3.3'
    text: |-
      Aard en niveau van de functie worden bepaald aan de hand van functiebeschrijvingen en functieniveau-
      karakteristieken, welke deel uitmaken van een bij ministeriële regeling vast te stellen functiewaarderingssysteem.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel3
  - number: '3.4'
    text: |-
      Anders dan bij wijze van disciplinaire straf als bedoeld in [artikel 82 van de wet][ref1], kan zonder voorafgaand
      ontslag voor een ambtenaar geen bezoldigingsschaal worden vastgesteld die een lagere maximum-bezoldiging bevat dan
      die welke in de voordien voor hem geldende bezoldigingsschaal aangegeven is.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
  - number: '5'
    text: |-
      Indien de ambtenaar anders dan bij wijze van disciplinaire straf als bedoeld in [artikel 82 van de wet][ref1],
      wordt belast met een andere functie, als gevolg waarvan zijn bezoldiging op grond van de overige bepalingen van dit
      besluit een verlaging zou moeten ondergaan, zonder dat de bekleding met die andere functie bij wijze van waarneming
      als bedoeld in [artikel 24 van het Rechtspositiebesluit ambtenaren BES][ref2] geschiedt of zonder dat ontslag
      voorafgegaan is, blijft deze verlaging achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel24
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '24'
  - number: '6.1'
    text: |-
      De bezoldiging van de ambtenaar wordt jaarlijks verhoogd tot het in de schaal naast-hogere bedrag, indien hij zijn
      functie naar het oordeel van zijn leidinggevende naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel6
  - number: '6.2'
    text: |-
      De bezoldiging van de ambtenaar kan worden verhoogd tot het bedrag dat behoort bij de eerste
      bezoldigingstrede volgend op de naast-hogere bezoldigingstrede in de schaal, indien hij naar
      het oordeel van het bevoegde gezag, dat is neergelegd in een formele beoordeling als bedoeld in
      [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref1], zijn functie zeer goed of uitstekend
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '12'
  - number: '6.3'
    text: |-
      Vervult de ambtenaar zijn functie naar het oordeel van het bevoegd gezag, dat is neergelegd in een formele
      beoordeling als bedoeld in [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref1], niet naar
      behoren, dan blijft verhoging van de bezoldiging achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '12'
  - number: '6.4'
    text: |-
      De in het eerste en tweede lid bedoelde verhogingen van de bezoldiging worden toegekend zolang de ambtenaar de
      maximum bezoldiging van de voor hem geldende bezoldigingsschaal nog niet heeft bereikt, voor de eerste maal met
      ingang van de eerste dag van de maand, waarin sinds zijn aanstelling of sinds zijn overgang naar een functie
      waaraan een hogere bezoldiging is verbonden een jaar is verstreken, en geschiedt nadien telkens na één jaar.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel6
  - number: '7'
    text: |-
      De bezoldiging van de ambtenaar met een deelbetrekking wordt vastgesteld op een evenredig deel van de bezoldiging
      bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel7
  - number: '8'
    text: |-
      Ingeval de ambtenaar bevorderd wordt naar een functie waaraan een bezoldigingsschaal is verbonden die een hogere
      maximum-bezoldiging bevat dan die welke voorkomt in de schaal volgens welke hij tot dusver is bezoldigd, wordt hem
      de bezoldigingstrede in de nieuwe schaal toegekend waarvan het bedrag procentueel ten minste zoveel hoger is dan
      dat van de hem laatstelijk toekomende bezoldigingstrede in de oude schaal, als in die oude schaal het procentuele
      verschil tussen twee bezoldigingstreden uitmaakt.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel8
  - number: '9.1'
    text: |-
      Aan de ambtenaar, aan wie zodanige eisen gesteld worden, dat zijn positie of taak een bijzonder karakter draagt,
      kan Onze Minister wie het aangaat een in ieder afzonderlijk geval vast te stellen toelage toekennen.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9
  - number: '9.2'
    text: |-
      De toelage wordt bepaald op ten hoogste vijfentwintig procent (25%) van de bezoldiging van de betrokken ambtenaar,
      en wordt tezamen met deze betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het onmogelijk blijkt om het tijdvak gedurende welke het recht op de toelage bestaat reeds bij de toekenning
      te bepalen, wordt in de beschikking waarbij de toekenning geschiedt het tijdstip vastgesteld waarop door Onze
      Minister wie het aangaat zal worden beslist of de gronden daartoe nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9
  - number: 9a.1
    text: |-
      De ambtenaar heeft recht op een eindejaarsuitkering ter grootte van 8,33% van zijn bezoldiging inclusief de
      toelagen, genoemd in [artikel 28, tweede, derde en vierde lid, van het Rechtspositiebesluit ambtenaren BES][ref1],
      met een minimum van USD 1750.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel28
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '28'
  - number: 9a.2
    text: |-
      De eindejaarsuitkering wordt jaarlijks uitbetaald in de maand november over een periode van twaalf maanden, die is
      aangevangen met de maand januari van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9a
  - number: 9a.3
    text: |-
      In afwijking van het tweede lid kan de eindejaarsuitkering op verzoek van de ambtenaar binnen een periode als
      bedoeld in het tweede lid op twee momenten worden uitbetaald. In dat geval vindt de eerste uitbetaling plaats in de
      door de ambtenaar verzochte maand, en wel over de maand januari, bedoeld in het tweede lid, en de volgende maanden
      tot en met de maand van de eerste uitbetaling. De tweede uitbetaling vindt dan plaats in de maand november, en wel
      over de resterende maanden van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9a
  - number: 9a.4
    text: |-
      In afwijking van het tweede of derde lid, wordt bij ontslag van de ambtenaar de eindejaarsuitkering
      onderscheidenlijk het resterende deel van de eindejaarsuitkering uitbetaald in de laatste maand van zijn
      dienstverband.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9a
  - number: 9a.5
    text: |-
      [Artikel 36a, vierde lid, van het Rechtspositiebesluit ambtenaren BES][ref1] is van overeenkomstige toepassing op
      de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel36a
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 36a
  - number: 10a.1
    text: |-
      Voor het bewonen van een ambtswoning door portiers en conciërges wordt op de bezoldiging een korting toegepast
      van 12 procent.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel10a
  - number: 10a.2
    text: |-
      In afwijking van het eerste lid, kan Onze Minister in de gevallen waarin naar zijn oordeel daartoe aanleiding
      bestaat, de korting vaststellen op een lager percentage dan wel op een bepaald bedrag, mits dit eveneens minder
      beloopt dan 12 procent van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Indien een portier of een conciërge een ambtswoning bewoont, draagt hij de onderhoudskosten welke volgens
      wettelijke voorschriften en het plaatselijk gebruik ten laste van de huurder zijn.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel10a
  - number: '11.1'
    text: |-
      De ambtenaar kan binnen een maand nadat hij van de beslissing inzake de vaststelling van een bezoldiging of
      inzake de toekenning van een verhoging, toelage, gratificatie of andere beloning, en van de weigering om hem een
      verhoging, toelage, gratificatie of andere beloning toe te kennen in kennis is gesteld of nadat hij geacht kan
      worden op een andere wijze daarmee bekend te zijn geworden, zijn bezwaren ertegen aan het bevoegde gezag kenbaar
      maken door de indiening van een bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het bezwaarschrift wordt door de ambtenaar of namens hem door een gemachtigde ondertekend. Indien het
      bezwaarschrift door een gemachtigde is getekend, worden stukken welke naar aanleiding ervan door het bevoegde gezag
      tot de ambtenaar worden gericht aan deze gemachtigde of in elk geval mede aan deze toegezonden.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel11
  - number: '11.3'
    text: De indiening van een bezwaarschrift schorst niet de uitvoering van de beslissing waartegen bezwaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel11
  - number: '11.4'
    text: |-
      Tenzij het bezwaar kennelijk niet-ontvankelijk of ongegrond is, wordt de ambtenaar in de gelegenheid gesteld over
      zijn bezwaren te worden gehoord door een of meer personen die het bevoegde gezag daartoe aanwijst; degene die
      aangewezen is, onderscheidenlijk de meerderheid van degenen die aangewezen zijn, mag niet bij de totstandkoming
      van de beslissing of van de weigering waartegen het bezwaar is ingebracht betrokken zijn geweest. De ambtenaar kan
      tijdens de zitting waarin hij wordt gehoord gebruik maken van de diensten van een raadsman.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het bevoegde gezag deelt aan de ambtenaar zijn beslissing op het door deze ingediende bezwaar zo spoedig mogelijk,
      doch uiterlijk binnen een maand na de ontvangst van het bezwaarschrift of, indien een gehoor heeft plaatsgevonden,
      na de datum van dat gehoor, mede. Het tijdvak van een maand kan door het bevoegde gezag bij gemotiveerde
      beschikking eenmaal met ten hoogste een maand worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel12
  - number: '12.2'
    text: |-
      De mededeling omtrent de beslissing bevat de overwegingen waarop deze steunt en, indien het bezwaar geheel of
      gedeeltelijk ontvankelijk is gebleken, de wijziging van de oorspronkelijke beslissing of weigering waartoe een
      heroverweging op grond van deze ontvankelijkheid het bevoegde gezag heeft geleid.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel12
  - number: '12.3'
    text: |-
      De beslissing op het bezwaar is een beschikking als bedoeld in artikel 3, eerste lid, van de Wet
      ambtenarenrechtspraak BES. Indien met deze beslissing niet of niet geheel aan het bezwaar van de ambtenaar wordt
      tegemoetgekomen, wordt hem in de mededeling, bedoeld in het voorgaande lid, tevens medegedeeld dat hij bij het
      gerecht in ambtenarenzaken in beroep kan komen en de termijn waarbinnen dit dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel12
  - number: '13'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel13
  - number: 13.a
    text: '*oorspronkelijke bezoldigingsschaal:* de bezoldigingsschaal die van toepassing was tot en met 30 juni 2013;'
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel13
  - number: 13.b
    text: |-
      *nieuwe bezoldigingsschaal:* de bezoldigingsschaal die met terugwerkende kracht van toepassing is met ingang van
      1 juli 2013;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel13
  - number: 13.c
    text: |-
      *oorspronkelijke maximum-bezoldiging:* het bedrag, behorende bij de hoogste bezoldigingstrede van de
      oorspronkelijke bezoldigingsschaal;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel13
  - number: 13.d
    text: |-
      *garantietrede:* elk afzonderlijk binnen een bezoldigingsschaal opgenomen bezoldigingsbedrag, voorzien van een
      nummer dat wordt voorafgegaan door de aanduiding «GRT», «GJT», of «GDT» «;
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel13
  - number: 13.e
    text: '*bevorderen:* overgaan naar een functie, aan welke bezoldiging in een hogere bezoldigingsschaal is verbonden.'
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel13
  - number: '14'
    text: |-
      Voor zover in de nieuwe bezoldigingsschaal de maximum-bezoldiging een lager bedrag is dan de maximum-bezoldiging
      in de oorspronkelijke bezoldigingsschaal worden bij ministeriële regeling garantietreden vastgesteld. Voor zover
      de maximum-bezoldiging in de oorspronkelijke bezoldigingsschaal voor verschillende groepen ambtenaren verschilt,
      worden voor die groepen ambtenaren verschillende garantietreden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel14
  - number: '16.1'
    text: |-
      Indien de ambtenaar die reeds op 30 september 2014 in dienst was de maximum-bezoldiging van de voor hem
      geldende bezoldigingsschaal heeft bereikt, wordt zijn bezoldiging met overeenkomstige toepassing van
      [artikel 6, eerste lid][ref1], verhoogd tot het bedrag dat behoort bij de eerste garantietrede die behoort bij de
      schaal, indien hij naar het oordeel van het bevoegd gezag, dat is neergelegd in een formele beoordeling als bedoeld
      in [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref2], zijn functie naar behoren vervult.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '12'
  - number: '16.2'
    text: |-
      Indien de ambtenaar wordt bezoldigd op een garantietrede binnen de voor hem geldende bezoldigingschaal,
      wordt zijn bezoldiging met overeenkomstige toepassing van [artikel 6, eerste lid][ref1], verhoogd
      tot het bedrag dat behoort bij de naast-hogere garantietrede die behoort bij de schaal, indien hij
      naar het oordeel van het bevoegd gezag, dat is neergelegd in een formele beoordeling als bedoeld in
      [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref2], zijn functie naar behoren vervult.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '12'
  - number: '16.3'
    text: |-
      Voor zover de ambtenaar die reeds op 30 september 2014 in dienst was de maximum-bezoldiging van de voor hem
      geldende bezoldigingsschaal heeft bereikt, wordt zijn bezoldiging bij toepassing van [artikel 6, tweede lid][ref1],
      verhoogd tot een bedrag dat behoort tot de eerste garantietrede volgend op de naast hogere bezoldigings- of
      garantietrede die behoort bij de schaal, indien hij naar het oordeel van het bevoegd gezag, dat is neergelegd in
      een formele beoordeling als bedoeld in [artikel 12, tweede lid, van het Rechtspositiebesluit ambtenaren BES][ref2],
      zijn functie zeer goed of uitstekend vervult.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '12'
  - number: '16.4'
    text: |-
      De in het tweede en derde lid bedoelde verhogingen van de bezoldiging worden met ingang van 1 januari van een jaar
      toegekend, zolang de ambtenaar de laatste garantietrede die behoort bij de voor hem geldende bezoldigingsschaal nog
      niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien de ambtenaar die reeds op 30 september 2014 in dienst was na 1 juli 2013 een of twee maal is bevorderd en
      hij de maximum-bezoldiging van de alsdan voor hem geldende bezoldigingsschaal heeft bereikt, is [artikel 16][ref1]
      van overeenkomstige toepassing met inachtneming van het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel16
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: '16'
        hoofdstuk: VII
  - number: '17.2'
    text: |-
      Na de eerste bevordering sinds 1 juli 2013, niet zijnde een reguliere plaatsing in de vooraf afgesproken formatieve
      bezoldigingsschaal, kunnen verhogingen van de bezoldiging van de ambtenaar, bedoeld in het eerste lid, worden
      toegekend tot en met het aantal garantietreden in de bezoldigingsschaal volgens welke hij vóór zijn bevordering
      werd bezoldigd minus twee.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel17
  - number: '17.3'
    text: |-
      Na de tweede bevordering sinds 1 juli 2013, niet zijnde een reguliere plaatsing in de vooraf afgesproken formatieve
      bezoldigingsschaal, kunnen verhogingen van de bezoldiging van de ambtenaar, bedoeld in het eerste lid, worden
      toegekend tot en met het aantal garantietreden in de bezoldigingsschaal volgens welke hij vóór zijn eerste
      bevordering sinds 1 juli 2013 werd bezoldigd minus vijf.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel17
  - number: '17.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de ambtenaar die tussen 1 juli 2013 en
      1 oktober 2014 in dienst is getreden, met dien verstande dat voor «1 juli 2013» gelezen wordt: de datum van
      indiensttreding.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel17
  - number: '17.5'
    text: |-
      Indien de ambtenaar die reeds op 30 september 2014 in dienst was na 1 juli 2013 is geplaatst in de vooraf
      afgesproken formatieve bezoldigingsschaal, en hij de maximum-bezoldiging van de alsdan voor hem geldende
      bezoldigingsschaal heeft bereikt, is [artikel 16][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel16
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: '16'
        hoofdstuk: VII
  - number: '18'
    text: |-
      Ingeval de ambtenaar die reeds op 30 september 2014 in dienst was, wordt bevorderd, wordt hem, onverminderd
      [artikel 8][ref1], de bezoldigings- of garantietrede in de nieuwe bezoldigingsschaal toegekend, waarvan het bedrag
      ten minste gelijk is aan de hem laatstelijk toekomende bezoldigings- of garantietrede in de oude schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel8
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: '8'
        hoofdstuk: II
  - number: '19'
    text: |-
      Aan de ambtenaar die op 1 februari 2024 in dienst was, wordt een eenmalige uitkering verleend ter hoogte van USD
      750 netto.
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel19
  - number: 20a
    text: |-
      Dit besluit berust op [artikel 17 van de Ambtenarenwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '17'
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Bezoldigingsbesluit 1998 BES.'
    url: https://wetten.overheid.nl/BWBR0028491/2025-01-01#Artikel21
