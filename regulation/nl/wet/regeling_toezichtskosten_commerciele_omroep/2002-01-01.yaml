      2 De vergoeding die een commerciële omroepinstelling, die toestemming heeft verkregen voor het uitzenden of doen
      uitzenden van een door haar verzorgd radioprogramma voor algemene omroep, jaarlijks aan het Commissariaat voor de
      Media is verschuldigd voor de kosten die verbonden zijn aan het toezicht, bedraagt 50% (vijftig procent) van de
      bedragen, vermeld in de tabel van het eerste lid, met dien verstande dat de vergoeding niet lager wordt vastgesteld
      dan op een bedrag van € 113.

      3 In afwijking van het eerste lid bedraagt de vergoeding die een commerciële omroepinstelling, die toestemming
      heeft verkregen voor het uitzenden of doen uitzenden van een door haar verzorgd televisieprogramma voor algemene
      omroep dat bestaat uit het gedurende de uitzendduur veelvuldig en aaneensluitend herhalen van een programma
      dat voor zover het de beeldinhoud betreft uitsluitend of nagenoeg uitsluitend bestaat uit stilstaande beelden,
      25% (vijfentwintig procent) van de bedragen vermeld in de tabel van het eerste lid, met dien verstande dat de
      vergoeding niet lager wordt vastgesteld dan op een bedrag van € 113.

      4 Indien de toestemming voor het uitzenden of doen uitzenden van een programma voor algemene omroep in de loop
      van het kalenderjaar in werking treedt, wordt ingetrokken of vervalt, worden het eerste tot en met derde lid naar
      tijdsgelang toegepast, met dien verstande dat de vergoeding niet lager wordt vastgesteld dan op een bedrag van
      € 113.
    url: https://wetten.overheid.nl/BWBR0012826/2002-01-01#Artikel1
