  - number: '3'
    text: |-
      Indien een commerciële omroepinstelling, die toestemming heeft verkregen voor het uitzenden of doen uitzenden van
      een door haar verzorgd programma voor bijzondere omroep, tevens toestemming heeft verkregen voor het uitzenden of
      doen uitzenden van een door haar verzorgd programma voor algemene omroep, en het programma voor bijzondere omroep
      steeds aansluitend op hetzelfde kanaal van een omroepnetwerk wordt uitgezonden als waarop het programma voor
      algemene omroep wordt uitgezonden, is de commerciële omroepinstelling ten hoogste € 20.400 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012826/2002-01-01#Artikel3
  - number: '4'
    text: |-
