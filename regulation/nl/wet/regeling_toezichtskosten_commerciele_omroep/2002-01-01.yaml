      2 De vergoeding die een commerciële instelling, die toestemming heeft verkregen voor het uitzenden of doen
      uitzenden van een door haar verzorgd radioprogramma voor bijzondere omroep, jaarlijks aan het Commissariaat voor
      de Media is verschuldigd voor de kosten die verbonden zijn aan het toezicht, bedraagt 50% (vijftig procent) van de
      bedragen, vermeld in de tabel van het eerste lid.

      3 Indien de toestemming voor het uitzenden of doen uitzenden van een programma voor bijzondere omroep in de
