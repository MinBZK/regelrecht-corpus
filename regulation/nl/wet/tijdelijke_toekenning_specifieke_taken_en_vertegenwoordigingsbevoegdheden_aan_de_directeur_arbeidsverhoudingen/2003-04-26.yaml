$id: tijdelijke_toekenning_specifieke_taken_en_vertegenwoordigingsbevoegdheden_aan_de_directeur_arbeidsverhoudingen
regulatory_layer: WET
publication_date: '2005-12-21'
valid_from: '2003-04-26'
bwb_id: BWBR0014991
url: https://wetten.overheid.nl/BWBR0014991/2003-04-26
preamble:
  text: |-
    Gelet op artikel 53, eerste lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#ArtikelAanhef
articles:
  - number: '1'
    text: 'De directie Arbeidsverhoudingen is met betrekking tot kinderopvang verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel1
  - number: 1.a
    text: |-
      het ontwerpen van teksten van wetten, algemene maatregelen van bestuur, ministeriële regelingen, beleidsregels
      en circulaires;
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel1
  - number: 1.b
    text: de implementatie van nieuwe wetgeving;
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel1
  - number: 1.c
    text: |-
      het verzorgen van ramingen en de ten behoeve van die ramingen benodigde analyses en het verkrijgen en beheren van
      de betreffende beleidsinformatie, waarbij zonodig afstemming plaatsvindt met het Centraal Bureau voor de Statistiek
      en het Centraal Planbureau;
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel1
  - number: 1.d
    text: het opstellen van het kader voor het toezicht op de kwaliteit van kinderopvang.
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel1
  - number: '2'
    text: |-
      De directeur Arbeidsverhoudingen is in het kader van zijn verantwoordelijkheden, bedoeld in [artikel 1][ref1],
      gevolmachtigd tot het aangaan van overeenkomsten met een waarde van maximaal € 500.000,- betreffende door de
      directeur-generaal Arbeidsverhoudingen en Internationale Betrekkingen goedgekeurde activiteiten met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0014991#Artikel1
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014991
        artikel: '1'
  - number: 2.a
    text: beleidsinformatievoorziening;
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel2
  - number: 2.b
    text: de organisatie van voorlichtings- en informatiecampagnes en productie van voorlichtingsmateriaal;
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel2
  - number: 2.c
    text: externe advisering in het kader van voorlichtingsprojecten.
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 april 2003.
    url: https://wetten.overheid.nl/BWBR0014991/2003-04-26#Artikel3
