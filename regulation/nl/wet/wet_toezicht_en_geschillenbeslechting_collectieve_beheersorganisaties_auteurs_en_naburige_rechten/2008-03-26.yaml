$id: wet_toezicht_en_geschillenbeslechting_collectieve_beheersorganisaties_auteurs_en_naburige_rechten
regulatory_layer: WET
publication_date: '2013-03-19'
valid_from: '2008-03-26'
bwb_id: BWBR0014779
url: https://wetten.overheid.nl/BWBR0014779/2008-03-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat regels gesteld worden met betrekking tot het
    toezicht op collectieve beheersorganisaties voor auteurs- en naburige rechten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel1
  - number: 1.a
    text: 'Onze Minister: de Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel1
  - number: 1.b
    text: |-
      het College van Toezicht: het College van Toezicht, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '2'
  - number: 1.c
    text: |-
      collectieve beheersorganisatie: de door Onze Minister aangewezen rechtspersoon, die met uitsluiting van anderen
      belast is met de inning en de verdeling van vergoedingen, verschuldigd op grond van de [Auteurswet][ref1], of op
      grond van de [Wet op de naburige rechten][ref2], of de rechtspersoon die met toestemming van Onze Minister als
      bedrijf bemiddeling verleent inzake muziekauteursrecht op grond van [artikel 30a van de Auteurswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 30a
  - number: '2.1'
    text: |-
      Er is een College van Toezicht dat tot taak heeft toezicht uit te oefenen op de inning en de verdeling van de
      vergoedingen door de collectieve beheersorganisaties.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: '2.2'
    text: 'Het College van Toezicht ziet er op toe dat een collectieve beheersorganisatie:'
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: 2.2.a
    text: aan rechthebbenden en betalingsplichtigen voldoende inzicht verschaft in haar algemene en financiële beleid;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: 2.2.b
    text: voldoende is toegerust om haar taken naar behoren te kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: 2.2.c
    text: |-
      de door haar geïnde vergoedingen op rechtmatige wijze verdeelt over de rechthebbenden overeenkomstig het
      repartitiereglement;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: 2.2.d
    text: bij de uitoefening van haar werkzaamheden voldoende rekening houdt met de belangen van de betalingsplichtigen;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: 2.2.e
    text: een deugdelijke geschillenregeling voor rechthebbenden kent;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: 2.2.f
    text: gelijke gevallen op gelijke wijze behandelt.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel2
  - number: '3.1'
    text: |-
      De volgende besluiten van een collectieve beheersorganisatie, niet zijnde een vereniging, worden slechts genomen na
      voorafgaande schriftelijke goedkeuring van het College van Toezicht:
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
  - number: 3.1.a
    text: een besluit tot wijziging van de statuten of tot ontbinding van de collectieve beheersorganisatie;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
  - number: 3.1.b
    text: |-
      een besluit tot benoeming van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 3.1.c
    text: |-
      een besluit tot vaststelling of wijziging van modelovereenkomsten met rechthebbenden betreffende de uitoefening en
      handhaving van auteursrechten of naburige rechten;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
  - number: 3.1.d
    text: |-
      een besluit tot vaststelling of wijziging van andere modelovereenkomsten en reglementen die de uitoefening van de
      aan de collectieve beheersorganisatie opgedragen taak betreffen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
  - number: '3.2'
    text: |-
      Het College van Toezicht kan over besluiten als bedoeld in het eerste lid een collectieve beheersorganisatie van
      advies dienen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
  - number: '3.3'
    text: |-
      Het College van Toezicht kan slechts zijn goedkeuring aan een besluit onthouden indien de collectieve
      beheersorganisatie binnen een door het college te bepalen periode na ontvangst van een voorafgaand advies van het
      college het advies niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel3
  - number: '4'
    text: |-
      Het College van Toezicht houdt geen toezicht op collectieve beheersorganisaties voor zover toezicht op grond van de
      [Mededingingswet][ref1] wordt uitgeoefend door de Nederlandse Mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '5.1'
    text: |-
      Een collectieve beheersorganisatie is gehouden het College van Toezicht vooraf schriftelijk te informeren over te
      nemen besluiten die van wezenlijke invloed zijn op de uitoefening door de collectieve beheersorganisatie van haar
      wettelijke taken of het verlenen van bemiddeling als bedoeld in [artikel 30a van de Auteurswet][ref1], waaronder:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 30a
  - number: 5.1.a
    text: investeringen die een door het College van Toezicht bij reglement vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel5
  - number: 5.1.b
    text: het oprichten of mede-oprichten van een privaatrechtelijke rechtspersoon of het deelnemen in een vennootschap.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel5
  - number: '5.2'
    text: |-
      De leden van het College van Toezicht hebben toegang tot de kantoren van een collectieve beheersorganisatie en
      kunnen de algemene ledenvergadering, de vergadering van aangeslotenen en de vergaderingen van het bestuur van de
      collectieve beheersorganisatie bijwonen. De leden van het College hebben inzage in boeken en bescheiden en andere
      informatiedragers van een collectieve beheersorganisatie een en ander voor zover kennisneming daarvan noodzakelijk
      is voor de uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel5
  - number: '5.3'
    text: |-
      Indien een collectieve beheersorganisatie samenwerkt met of werkzaamheden laat verrichten door een derde,
      verband houdende met de inning en de verdeling van vergoedingen op grond van de [Auteurswet][ref1] en de
      [Wet op de naburige rechten][ref2], blijft zij verantwoordelijk voor de uitoefening van deze taken. Zij draagt in
      dat geval zorg voor de beschikbaarheid voor het College van Toezicht van de financiële gegevens die relevant kunnen
      zijn voor de taakuitoefening van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
  - number: '5.4'
    text: |-
      Het College van Toezicht kan, indien het daartoe gronden aanwezig acht, de boekhouding van
      een collectieve beheersorganisatie laten onderzoeken door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De kosten van dit onderzoek komen voor
      rekening van de collectieve beheersorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '6.1'
    text: Het College van Toezicht kan een collectieve beheersorganisatie van advies dienen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel6
  - number: '6.2'
    text: |-
      Het College van Toezicht kan een collectieve beheersorganisatie aanwijzingen geven met betrekking
      tot de uitoefening van haar wettelijke taken of het verlenen van bemiddeling als bedoeld in
      [artikel 30a van de Auteurswet][ref1]. De collectieve beheersorganisatie is gehouden overeenkomstig de aanwijzingen
      te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 30a
  - number: '6.3'
    text: |-
      Het College van Toezicht kan slechts een aanwijzing geven indien de collectieve beheersorganisatie binnen een door
      het college te bepalen periode na ontvangst van een voorafgaand advies van het college het advies niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel6
  - number: '7.1'
    text: |-
      Het College van Toezicht bestaat uit drie of meer personen. Het aantal leden van het College, de voorzitter
      daaronder begrepen, is steeds oneven.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel7
  - number: '7.2'
    text: |-
      De leden van het College van Toezicht kunnen de taken onderling verdelen. Het College blijft verantwoordelijk voor
      de uitoefening van deze taken.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel7
  - number: '7.3'
    text: |-
      De leden van het College van Toezicht worden, in overeenstemming met de Minister van Onderwijs, Cultuur en
      Wetenschappen, benoemd door Onze Minister, die tevens de voorzitter aanwijst.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel7
  - number: '7.4'
    text: |-
      De leden van het College van Toezicht worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen na
      afloop van deze periode aansluitend eenmaal opnieuw worden benoemd voor een termijn van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel7
  - number: '7.5'
    text: Het College van Toezicht blijft ook in geval van een of meer vacatures bevoegd tot hetgeen hem is opgedragen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel7
  - number: '7.6'
    text: |-
      Een lid dat een vacature vervult, wordt benoemd voor de resterende duur van de periode waarvoor het door hem
      vervangen afgetreden lid was benoemd.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel7
  - number: '8'
    text: |-
      Een lid van het College van Toezicht vervult geen nevenfuncties die ongewenst zijn met het oog op een goede
      vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel8
  - number: '9.1'
    text: 'Het lidmaatschap van het College van Toezicht eindigt:'
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: 9.1.a
    text: door het verstrijken van de periode waarvoor het lid is benoemd;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: 9.1.b
    text: |-
      door ontslag door Onze Minister, in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschappen, al dan
      niet op eigen verzoek van het lid;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: 9.1.c
    text: door ondercuratelestelling of overlijden van het lid;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: 9.1.d
    text: |-
      indien het faillissement of de toepassing van de schuldsaneringsregeling natuurlijke personen ten aanzien van het
      lid wordt uitgesproken;
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: 9.1.e
    text: door een veroordeling wegens een misdrijf.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: '9.2'
    text: |-
      De leden van het College van Toezicht kunnen door Onze Minister, in overeenstemming met de Minister van Onderwijs,
      Cultuur en Wetenschappen, worden geschorst. Het schorsingsbesluit regelt de gevolgen van de schorsing.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: '9.3'
    text: |-
      Schorsing en ontslag vindt slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel
      wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel9
  - number: '10.1'
    text: |-
      Indien naar het oordeel van Onze Minister, het College van Toezicht zijn taken ernstig verwaarloost, kan
      Onze Minister, in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschappen, de noodzakelijke
      voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel10
  - number: '10.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het zelfstandig
      bestuursorgaan in de gelegenheid is gesteld om binnen een door Onze Minister, in overeenstemming met de Minister
      van Onderwijs, Cultuur en Wetenschappen, te stellen termijn alsnog zijn taken naar behoren uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister stelt de beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel10
  - number: '11.1'
    text: Het College van Toezicht heeft een secretaris. De secretaris is geen lid van het College van Toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de secretaris, na overleg met de voorzitter van het College van
      Toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel11
  - number: '11.3'
    text: De secretaris is voor zijn werkzaamheden uitsluitend verantwoording schuldig aan het College.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister stelt de hoogte vast van de bezoldiging van de leden van het College van Toezicht, gehoord de
      collectieve beheersorganisaties.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel12
  - number: '12.2'
    text: |-
      De leden van het College van Toezicht en de secretaris ontvangen voor de uitoefening van hun werkzaamheden
      vergoeding van reis- en verblijfkosten overeenkomstig regels door Onze Minister te stellen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel12
  - number: '12.3'
    text: |-
      De algemene kosten gemaakt door het College van Toezicht ten behoeve van de uitoefening van het toezicht, waaronder
      die genoemd in het eerste en tweede lid, komen voor rekening van de collectieve beheersorganisaties gezamenlijk,
      naar rato van de door hen geïncasseerde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel12
  - number: '13.1'
    text: |-
      Het College van Toezicht vergadert ten minste vier maal per jaar en voorts zo vaak als door de voorzitter of ten
      minste twee andere leden van het College wenselijk wordt geoordeeld.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel13
  - number: '13.2'
    text: |-
      Het College van Toezicht besluit met volstrekte meerderheid van uitgebrachte stemmen. Elk lid heeft één stem.
      Indien de stemmen staken beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel13
  - number: '13.3'
    text: |-
      Het College van Toezicht kan bij reglement nadere regels vaststellen omtrent zijn vergadering en besluitvorming.
      Vaststelling en wijziging van het reglement is onderworpen aan de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel13
  - number: '14.1'
    text: |-
      Het College van Toezicht stelt ten minste een maal per jaar vertegenwoordigers van betalingsplichtigen in de
      gelegenheid te worden gehoord. Het College is bevoegd ook andere belanghebbenden te horen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel14
  - number: '14.2'
    text: |-
      Belanghebbenden kunnen zich tot het College van Toezicht wenden, indien de betreffende geschillenregeling is
      doorlopen. Het College kan een niet bindend advies aan partijen geven ter beslechting van het geschil.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel14
  - number: '15.1'
    text: |-
      Het College van Toezicht stelt een jaarrekening en een begroting op, welke de goedkeuring behoeven van Onze
      Minister, gehoord de collectieve beheersorganisaties.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel15
  - number: '15.2'
    text: |-
      Het College van Toezicht brengt jaarlijks voor 1 april verslag uit aan Onze Minister van de verrichte werkzaamheden
      in het voorafgaande kalenderjaar. De Minister zendt het verslag door aan beide Kamers der Staten-Generaal en aan de
      collectieve beheersorganisaties.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel15
  - number: '15.3'
    text: |-
      Het College van Toezicht verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel15
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten.'
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel18
  - number: '19'
    text: Deze wet treedt in werking op een bij koninklijk besluit vast te stellen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014779/2008-03-26#Artikel19
