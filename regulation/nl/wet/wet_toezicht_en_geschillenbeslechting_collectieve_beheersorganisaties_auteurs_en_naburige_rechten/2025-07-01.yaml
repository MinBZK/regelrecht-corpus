  - number: 2n
    text: |-
      Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie aan collectieve beheersorganisaties
      namens wie zij rechten beheert op grond van een vertegenwoordigingsovereenkomst, tenminste eenmaal per jaar,
      op elektronische wijze, voor de periode waarop de informatie betrekking heeft, minimaal de volgende informatie
      bekendmaakt:

      a) de toegewezen rechteninkomsten, de door de collectieve beheersorganisatie betaalde bedragen per beheerde
      rechtencategorie en soort gebruik voor de rechten die zij beheert op grond van de vertegenwoordigingsovereenkomst,
      en rechteninkomsten toegewezen aan een rechthebbende die voor enige periode onbetaald blijven;

      b) bedragen die zijn ingehouden met betrekking tot beheerskosten;

      c) de bedragen die zijn ingehouden voor andere doeleinden dan met betrekking tot beheerskosten, als bedoeld in
      [artikel 2k][ref1];

      d) informatie over iedere verleende of geweigerde licentie met betrekking tot op grond van de
      [Auteurswet][ref2] en de [Wet op de naburige rechten][ref3] beschermd materiaal die wordt bestreken door de
      vertegenwoordigingsovereenkomst;

      e) door de algemene ledenvergadering genomen besluiten voor zover deze besluiten relevant zijn voor het beheer van
      de rechten op grond van de vertegenwoordigingsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2k
      [ref2]: https://wetten.overheid.nl/BWBR0001886
      [ref3]: https://wetten.overheid.nl/BWBR0005921
