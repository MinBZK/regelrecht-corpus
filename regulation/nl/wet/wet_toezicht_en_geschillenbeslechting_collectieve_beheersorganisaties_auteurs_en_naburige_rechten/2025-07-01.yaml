  - number: '6'
    text: |-
      1 Het College van Toezicht kan een collectieve beheersorganisatie of onafhankelijke beheersorganisatie van advies
      dienen.

      2 Het College van Toezicht kan een collectieve beheersorganisatie of onafhankelijke beheersorganisatie
      aanwijzingen geven met betrekking tot de uitoefening van haar taken of het verlenen van bemiddeling als bedoeld in
      [artikel 30a van de Auteurswet][ref1]. De collectieve beheersorganisatie of onafhankelijke beheersorganisatie is
      gehouden overeenkomstig de aanwijzingen te handelen.


