  - number: 25b
    text: |-
      Het College van Toezicht zorgt voor de inrichting van een procedure waarmee belanghebbenden het College in kennis
      kunnen stellen van signalen die volgens hen een inbreuk vormen op de bepalingen uit deze wet. Het College maakt
      deze procedure openbaar op zijn internetpagina.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel25b
  - number: 25c
    text: |-
      1 Het College van Toezicht beantwoordt een verzoek om informatie dat wordt ontvangen van een daartoe aangewezen
      bevoegde instantie van een andere lidstaat van de Europese Unie of een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische ruimte aangaande de toepassing van de in [richtlijn 2014/26](32014L0026)/EU
      van het Europese Parlement en de Raad relevante zaken en in het bijzonder met betrekking tot de activiteiten van op
      het grondgebied van een in Nederland gevestigde collectieve beheersorganisatie, onverwijld, mits het verzoek naar
      behoren gemotiveerd is.

      2 Het College van Toezicht geeft binnen drie maanden een met redenen omkleed antwoord op een verzoek tot het nemen
      van passende maatregelen van een daartoe aangewezen bevoegde instantie uit een andere lidstaat die van oordeel
      is dat een collectieve beheersorganisatie die in Nederland is gevestigd maar op zijn grondgebied actief is,
      mogelijkerwijs niet voldoet aan de bepalingen uit de Wet toezicht, die zijn vastgesteld op grond van [richtlijn
      2014/26](32014L0026)/EU van het Europees Parlement en de Raad, op voorwaarde dat de aangewezen bevoegde instantie
      alle relevante informatie heeft doorgegeven aan het College, vergezeld van een verzoek tot handhaving.

      3 Het College van Toezicht kan, wanneer hij van oordeel is dat een collectieve beheersorganisatie die in een andere
      lidstaat gevestigd is maar op Nederlands grondgebied actief is, mogelijkerwijs niet voldoet aan de bepalingen in
      het nationale recht van deze lidstaat, die zijn vastgesteld op grond van de voorschriften van [richtlijn 2014/26]
      (32014L0026)/EU van het Europees Parlement en de Raad, de bevoegde instantie van de lidstaat waar de collectieve
      beheersorganisatie gevestigd is, verzoeken om onder haar bevoegdheid vallende passende maatregelen te nemen, indien
      dit verzoek vergezeld gaat van alle relevante informatie.

      4 Het College van Toezicht kan een verzoek dat bij een aangewezen bevoegde instantie uit een andere lidstaat kan
      worden ingediend omdat een collectieve beheersorganisatie gevestigd in de andere lidstaat in Nederland actief is,
      maar mogelijk niet voldoet aan de bepalingen die in de lidstaat van herkomst zijn vastgelegd ter implementatie van
      [richtlijn 2014/26](32014L0026)/EU, eveneens indienen bij de groep met deskundigen als bedoeld in artikel 41 van
      die richtlijn, bestaande uit vertegenwoordigers van de bevoegde instanties van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel25c
  - number: 25d
    text: |-
