  - number: 2j
    text: |-
      Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie niet discrimineert jegens een
      rechthebbende wiens rechten zij beheert krachtens een vertegenwoordigingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel2j
  - number: 2k
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie handelt overeenkomstig
      het bepaalde in het tweede tot en met het vijfde lid, bij de inhoudingen en betalingen op grond van een
      vertegenwoordigingsovereenkomst.

      2 Een collectieve beheersorganisatie houdt uitsluitend kosten in voor het beheer op de rechteninkomsten, of op
      inkomsten uit de belegging van die rechteninkomsten, die voortvloeien uit de rechten die zij beheert op grond
      van een vertegenwoordigingsovereenkomst, tenzij de andere collectieve beheersorganisatie die partij is bij de
      vertegenwoordigingsovereenkomst uitdrukkelijk met andere inhoudingen instemt.

      3 De collectieve beheersorganisatie verdeelt en betaalt de aan andere collectieve beheersorganisaties verschuldigde
      bedragen op regelmatige, zorgvuldige en correcte wijze.

      4 De collectieve beheersorganisatie verricht de verdeling en betalingen aan de andere collectieve
      beheersorganisatie zo snel mogelijk maar uiterlijk negen maanden na afloop van het boekjaar waarin de
      rechteninkomsten zijn geïnd, tenzij objectieve redenen de collectieve beheersorganisatie ervan weerhouden deze
      termijn na te leven.

      5 De vertegenwoordigde collectieve beheersorganisatie of zijn leden, die rechthebbenden vertegenwoordigen, verdelen
      en betalen de aan rechthebbenden verschuldigde bedragen uiterlijk zes maanden na ontvangst van deze bedragen,
      tenzij objectieve redenen de collectieve beheersorganisatie of, in voorkomend geval, zijn leden ervan weerhouden
      deze termijn na te leven.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel2k
  - number: 2l
    text: |-
      1 Collectieve beheersorganisaties en gebruikers van collectieve beheersorganisaties voeren in goed vertrouwen
      onderhandelingen over de licentieverlening voor rechten. Collectieve beheersorganisaties en gebruikers verschaffen
      elkaar alle noodzakelijke informatie.

      2 Licentievoorwaarden zijn gebaseerd op objectieve en niet-discriminerende criteria. Een collectieve
      beheersorganisatie is niet verplicht licentievoorwaarden die zijn overeengekomen met een gebruiker die een online
      dienst aanbiedt, als precedent te gebruiken voor andere onlinediensten, indien deze onlinedienst nog geen drie
      jaar voor het publiek in de Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte beschikbaar is. Rechthebbenden ontvangen een passende vergoeding voor het gebruik van de
      rechten. Tarieven voor exclusieve rechten en rechten op vergoeding zijn billijk in verhouding tot onder meer de
      economische waarde van het gebruik van de rechten in het handelsverkeer, gelet op de aard en reikwijdte van het
      gebruik van op grond van de [Auteurswet][ref1] en de [Wet op de naburige rechten][ref2] beschermd materiaal, en in
      verhouding tot de economische waarde van de door de collectieve beheersorganisatie verstrekte dienst. Collectieve
      beheersorganisaties stellen de betrokken gebruiker in kennis van de criteria die voor het bepalen van die tarieven
      zijn gebruikt.

      3 Collectieve beheersorganisaties beantwoorden aanvragen van gebruikers zonder onnodige vertraging en geven
      daarbij onder meer op welke informatie gebruikers nodig hebben om een licentie aan te bieden. Nadat een
      collectieve beheersorganisatie alle relevante informatie van de gebruiker heeft ontvangen, biedt de collectieve
      beheersorganisatie zonder onnodige vertraging een licentie aan, of verschaft zij de gebruiker een gemotiveerde
      verklaring waarom zij geen licentie verleent voor een bepaalde dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel2l
