  - number: 17b
    text: |-
      1 Een collectieve beheersorganisatie of onafhankelijke beheersorganisatie is op verzoek van het College van
      Toezicht gehouden om onderzoek te laten uitvoeren naar de uitoefening van haar taken of om een verbeterplan in te
      dienen. De kosten van dit onderzoek of verbeterplan komen voor rekening van de collectieve beheersorganisatie of
      onafhankelijke beheersorganisatie.

      2 Het College van Toezicht kan een collectieve beheersorganisatie of onafhankelijke beheersorganisatie uitsluitend
      verzoeken een onderzoek te laten uitvoeren of verbeterplan in te dienen wanneer het College signalen ontvangt
      waaruit blijkt van gegronde redenen om te twijfelen aan een juist beleid van of juiste gang van zaken.

      3 De collectieve beheersorganisatie of onafhankelijke beheersorganisatie dient binnen zes weken na ontvangst van
      het verzoek van het College van Toezicht een onderzoeksopdracht of verbeterplan, voorzien van de goedkeuring van
      het orgaan dat de interne toezichtfunctie uitoefent, in bij het College van Toezicht.

      4 De onderzoeksopdracht en het verbeterplan behoeven de schriftelijke instemming van het College van Toezicht. Het
      College van Toezicht bericht binnen vier weken na ontvangst van de onderzoeksopdracht of het verbeterplan of het
      zijn instemming aan de onderzoeksopdracht of het verbeterplan verleent.

      5 De termijn, bedoeld in het vierde lid, wordt opgeschort:

      a. met ingang van de dag na die waarop het College van Toezicht de collectieve beheersorganisatie of onafhankelijke
      beheersorganisatie uitnodigt de onderzoeksopdracht of het verbeterplan aan te vullen, tot de dag waarop de
      onderzoeksopdracht of het verbeterplan is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken,

      b. gedurende de termijn waarvoor de collectieve beheersorganisatie of onafhankelijke beheersorganisatie
      schriftelijk met uitstel heeft ingestemd,

      c. zolang de vertraging aan de collectieve beheersorganisatie of onafhankelijke beheersorganisatie kan worden
      toegerekend, of

      d. zolang het College van Toezicht door overmacht niet in staat is instemming te verlenen.

      6 Het College van Toezicht bepaalt bij zijn instemming met het verbeterplan voor welke termijn het verbeterplan
      geldt. De termijn bedraagt ten hoogste zes maanden. Het College van Toezicht kan de termijn met ten hoogste zes
      maanden verlengen.

      7 Het College van Toezicht vermeldt zijn instemming met een onderzoeksopdracht of verbeterplan op zijn website.

      8 De collectieve beheersorganisatie of onafhankelijke beheersorganisatie is op verzoek van het College van Toezicht
      gehouden om de uitvoering van het verbeterplan te bespreken met het College van Toezicht.

      9 De collectieve beheersorganisatie of onafhankelijke beheersorganisatie brengt op verzoek van het College van
      Toezicht verslag uit over de uitvoering van het verbeterplan na het verstrijken van de termijn, bedoeld in het
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel17b
  - number: '18'
    text: |-
      1 Het College van Toezicht kan een collectieve beheersorganisatie of onafhankelijke beheersorganisatie aan wie de
      overtreding kan worden toegerekend een bestuurlijke boete opleggen:

      a. van ten hoogste € 225.000 per overtreding, of, indien dat meer is, 5% van het totaal van de door een collectieve
      beheersorganisatie of onafhankelijke beheersorganisatie in het aan de beschikking voorafgaande boekjaar geïnde of
      voor verdeling beschikbare vergoedingen

      1°. bij niet-naleving van een aanwijzing als bedoeld in [artikel 6, tweede lid][ref1],

      2°. wegens het niet of niet behoorlijk naleven van de voor de collectieve beheersorganisatie of onafhankelijke
      beheersorganisatie geldende verplichtingen op grond van deze wet, indien binnen een tijdvak van vijf jaren
      voorafgaand aan de dag van overtreding een bestuurlijke boete is opgelegd en onherroepelijk geworden wegens
      niet-naleving van een aanwijzing als bedoeld in [artikel 6, tweede lid][ref2], die betrekking had op een zelfde
      gedraging, of

      3°. bij overtreding van [artikel 17a, vijfde lid][ref3];

      b. bij overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4] in afwijking van
      [artikel 184 van het Wetboek van Strafrecht][ref5], van ten hoogste € 35.000 per overtreding, of, indien dat meer
      is, 1% van het totaal van de door een collectieve beheersorganisatie of onafhankelijke beheersorganisatie in het
      aan de beschikking voorafgaande boekjaar geïnde of voor verdeling beschikbare vergoedingen.

      2 Het College van Toezicht legt geen boete op indien de collectieve beheersorganisatie of onafhankelijke
      beheersorganisatie aan wie de overtreding kan worden toegerekend aannemelijk maakt dat haar van de overtreding geen
      verwijt kan worden gemaakt.

      3 Bij de vaststelling van de hoogte van de boete houdt het College van Toezicht rekening met de ernst en de duur
      van de overtreding. Bij een overtreding als bedoeld in het eerste lid, onderdeel a, onder 1°. en 3°., vervalt
      de bevoegdheid tot het opleggen van een boete drie jaren na de dag waarop de overtreding is begaan. Bij een
      overtreding als bedoeld in het eerste lid, onderdeel b, vervalt de bevoegdheid tot het opleggen van een boete een
      jaar na de dag waarop de overtreding is begaan.

      4 Het College van Toezicht draagt de opbrengst van de bestuurlijke boeten af aan Onze Minister. De afgedragen
      opbrengst dient ter aanwending voor door Onze Minister te bepalen doeleinden van auteursrechtbeleid in brede zin.


