      Het College van Toezicht houdt geen toezicht op collectieve beheersorganisaties voor zover toezicht op grond van de
      [Mededingingswet][ref1] wordt uitgeoefend door de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '5'
    text: |-
      1 Een collectieve beheersorganisatie is gehouden het College van Toezicht vooraf schriftelijk te informeren over te
      nemen besluiten die van wezenlijke invloed zijn op de uitoefening door de collectieve beheersorganisatie van haar
      taken of het verlenen van bemiddeling als bedoeld in [artikel 30a van de Auteurswet][ref1], waaronder:

      a. investeringen die een door het College van Toezicht bij reglement vast te stellen bedrag te boven gaan;

      b. het oprichten of mede-oprichten van een privaatrechtelijke rechtspersoon of het deelnemen in een vennootschap;

      c. de vaststelling van een normaal toepasselijk tarief of korting voor een nieuw beheerd recht of nieuwe vorm van
      gebruik;

      d. de wijziging van een door een of meer betalingsplichtigen te betalen tarief, inclusief korting, anders dan
      bedoeld in [artikel 3, eerste lid, onderdeel c][ref2];

      e. de vaststelling of wijziging van overeenkomsten met representatieve organisaties van gebruikers;

      f. de benoeming van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].

      2 De leden van het College van Toezicht hebben toegang tot de kantoren van een collectieve beheersorganisatie en
      kunnen de algemene ledenvergadering, de vergadering van aangeslotenen en de vergaderingen van het bestuur van de
      collectieve beheersorganisatie bijwonen. De leden van het College hebben inzage in boeken en bescheiden en andere
      informatiedragers van een collectieve beheersorganisatie een en ander voor zover kennisneming daarvan noodzakelijk
      is voor de uitoefening van het toezicht.

      3 Het College houdt toezicht op organisaties, die direct of indirect eigendom zijn van, of geheel of gedeeltelijk
      onder toezicht staan van een collectieve beheersorganisatie, mits dergelijke organisaties een activiteit verrichten
      die, indien ze werd verricht door de collectieve beheersorganisatie, onderworpen zou zijn aan het toezicht van
      het College.

      4 Indien een collectieve beheersorganisatie samenwerkt met of werkzaamheden laat verrichten door een derde,
      verband houdende met de inning en de verdeling van vergoedingen op grond van de [Auteurswet][ref4] en de
      [Wet op de naburige rechten][ref5], blijft zij verantwoordelijk voor de uitoefening van deze taken. Zij draagt in
      dat geval zorg voor de beschikbaarheid voor het College van Toezicht van de financiële gegevens die relevant kunnen
      zijn voor de taakuitoefening van het College.

      5 Gegevens of inlichtingen omtrent een collectieve beheersorganisatie of een derde als bedoeld in
      [artikel 16][ref6], die in verband met enige werkzaamheid ten behoeve van de uitvoering van deze
      wet zijn verkregen, mogen uitsluitend voor de toepassing van deze wet, de [Auteurswet][ref7] en de
      [Wet op de naburige rechten][ref8] worden gebruikt.


