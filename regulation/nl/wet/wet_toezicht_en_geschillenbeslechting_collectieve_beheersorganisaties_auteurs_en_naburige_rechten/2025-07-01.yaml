  - number: 2p
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie ten minste de volgende informatie
      openbaar maakt:

      a) zijn statuten;

      b) zijn lidmaatschapsvoorwaarden en de voorwaarden voor beëindiging van de machtiging tot beheer van rechten,
      indien deze niet zijn opgenomen in de statuten;

      c) standaardlicentieovereenkomsten en normaal toepasselijke tarieven, inclusief kortingen;

      d) de lijst met personen bedoeld in [artikel 2f][ref1] en de nevenactiviteiten die door hen worden uitgeoefend;

      e) zijn algemene beleid inzake verdeling van de aan rechthebbenden verschuldigde bedragen;

      f) zijn algemene beleid inzake beheerskosten;

      g) zijn algemene beleid inzake inhoudingen, voor andere doeleinden dan beheerskosten, op rechteninkomsten en op
      enig ander inkomen voortvloeiend uit de belegging van rechteninkomsten, met inbegrip van inhoudingen ten behoeve
      van sociale, culturele en educatieve diensten;

      h) een lijst met door zijn gesloten vertegenwoordigingsovereenkomsten, en de namen van de collectieve
      beheersorganisaties waarmee deze vertegenwoordigingsovereenkomsten zijn gesloten;

      i) het algemene beleid inzake het gebruik van onverdeelde bedragen;

      j) de overeenkomstig de [artikelen 22][ref2] en [23][ref3] beschikbare procedures voor klachtenafhandeling en
      geschillenbeslechting;

      l) de wijze waarop wel of geen vrijwaring wordt gegeven voor claims van niet-vertegenwoordigde rechthebbenden.

      2 De collectieve beheersorganisatie maakt de in eerste lid bedoelde informatie op zijn publieke internetpagina
      bekend en houdt deze actueel.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2f
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel22
