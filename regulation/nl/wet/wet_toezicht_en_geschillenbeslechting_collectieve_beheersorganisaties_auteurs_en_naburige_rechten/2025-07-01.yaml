preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat regels gesteld worden met betrekking tot het
    toezicht op collectieve beheersorganisaties voor auteurs- en naburige rechten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

        - *Onze Minister:* de Minister van Justitie en Veiligheid;
        - *het College van Toezicht:* het College van Toezicht, bedoeld in [artikel 2][ref1];
        - *algemene voorwaarden:* voorwaarden als bedoeld in
      [artikel 231, onderdeel a, van Boek 6 van het Burgerlijk Wetboek][ref2];
        - *collectieve beheersorganisatie:* elke organisatie die in Nederland gevestigd is en die bij wet of door middel
      van overdracht, licentieverlening of een andere overeenkomst door meer dan één rechthebbende is gemachtigd met
      als hoofddoel auteursrecht of naburige rechten te beheren ten behoeve van één of meer van hen, in het gezamenlijk
      belang van deze rechthebbenden en die onder zeggenschap staat van zijn leden of is ingericht zonder winstoogmerk;
        - *onafhankelijke beheersorganisatie:* iedere organisatie, niet zijnde een collectieve beheersorganisatie, die in
      Nederland gevestigd is en die bij wet of door middel van overdracht, licentieverlening of een andere overeenkomst
      door meer dan één rechthebbende is gemachtigd met als hoofddoel auteursrechten of naburige rechten te beheren,
      ten behoeve van één of meer rechthebbenden, in het gezamenlijk belang van deze rechthebbenden en die direct noch
      indirect, geheel noch gedeeltelijk onder zeggenschap staat van rechthebbenden en is ingericht met winstoogmerk;
        - *geschillencommissie:* de geschillencommissie, bedoeld in [artikel 23][ref3];
        - *de Kaderwet:* de [Kaderwet zelfstandige bestuursorganen][ref4];
        - *rechthebbende:* elke natuurlijke persoon of organisatie anders dan een collectieve beheersorganisatie die houder
      is van een auteursrecht of naburig recht, of krachtens een overeenkomst voor de exploitatie van rechten of bij wet
      aanspraak kan maken op een aandeel in de rechteninkomsten;
        - *lid:* iedere rechthebbende of een organisatie die rechthebbenden vertegenwoordigt, met inbegrip van andere
      collectieve beheersorganisaties en verenigingen van rechthebbenden, die voldoet aan de lidmaatschapscriteria van de
      collectieve beheersorganisatie en door de collectieve beheersorganisatie is toegelaten;
        - *rechteninkomsten:* door een collectieve beheersorganisatie namens rechthebbenden geïnde inkomsten op grond van
      een exclusief recht of een recht op billijke vergoeding;
        - *beheerskosten:* de bedragen die door een collectieve beheersorganisatie in rekening worden gebracht dan wel op
      de rechteninkomsten of inkomsten uit belegging van rechteninkomsten ingehouden of verrekend worden om de kosten te
      dekken van het beheer van auteursrecht en naburige rechten;
        - *vertegenwoordigingsovereenkomst:* iedere overeenkomst tussen collectieve beheersorganisaties waarbij één
      collectieve beheersorganisatie een andere collectieve beheersorganisatie belast met het beheer van rechten die zij
      vertegenwoordigt, met inbegrip van overeenkomsten die worden gesloten voor de multiterritoriale licentiëring van
      online muziekrechten;
        - *gebruiker:* iedere natuurlijke persoon of rechtspersoon die handelingen uitvoert waarvoor de toestemming van, of
      de betaling van een billijke vergoeding aan rechthebbenden vereist is en die niet handelt als consument;
        - *repertoire:* een werk van letterkunde, wetenschap of kunst waarvoor een collectieve of een onafhankelijke
      beheersorganisatie de rechten beheert;
        - *multiterritoriale licentie:* een licentie die geldt voor het grondgebied van meer dan één lidstaat van de
      Europese Unie;
        - *onlinerechten inzake muziekwerken:* elk van de rechten van een maker inzake een muziekwerk, bedoeld in
      de artikelen 2 en 3 van de [Richtlijn 2001/29](32001L0029) van het Europees Parlement en de Raad van 22 mei
      2001 betreffende de harmonisatie van bepaalde aspecten van het auteursrecht en de naburige rechten in de
      informatiemaatschappij en die zijn voorgeschreven voor de verstrekking van een onlinemuziekdienst (PbEG 2001,
      L 167).


