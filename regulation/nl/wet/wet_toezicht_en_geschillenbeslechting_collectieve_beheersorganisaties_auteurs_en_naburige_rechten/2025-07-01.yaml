  - number: 2o
    text: |-
      Onverminderd het bepaalde in [artikel 5c][ref1], ziet het College van Toezicht erop toe dat een collectieve
      beheersorganisatie, na een gemotiveerd verzoek, op elektronische wijze en zonder onnodige vertraging, op zijn minst
      de volgende informatie bekendmaakt aan iedere rechthebbende of gebruiker of aan de collectieve beheersorganisatie
      wiens rechten zij beheert op grond van een vertegenwoordigingsovereenkomst:

      a) het op grond van de [Auteurswet][ref2] en de [Wet op de naburige rechten][ref3] beschermd materiaal dat zij
      beheert, de rechten die zij direct of krachtens een vertegenwoordigingsovereenkomst beheert en het grondgebied dat
      zij bestrijkt, of

      b) wanneer wegens de reikwijdte van de activiteiten van de collectieve beheersorganisatie dergelijke soorten van
      op grond van de [Auteurswet][ref4] of de [Wet op de naburige rechten][ref5] beschermd materiaal niet kunnen worden
      vastgesteld, de soorten op grond van de Auteurswet of de Wet op de naburige rechten beschermd materiaal die zij
      vertegenwoordigt, de rechten die zij beheert en de grondgebieden die zij bestrijkt.


