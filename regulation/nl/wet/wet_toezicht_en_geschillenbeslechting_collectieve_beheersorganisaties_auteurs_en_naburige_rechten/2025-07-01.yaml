  - number: '22'
    text: |-
      1 Het College van Toezicht ziet erop toe dat collectieve beheersorganisaties ten behoeve van collectieve
      beheersorganisaties namens wie zij rechten beheren op grond van een vertegenwoordigingsovereenkomst en hun leden,
      procedures beschikbaar stellen voor de doeltreffende en tijdige behandeling van klachten en geschillen.

      2 Collectieve beheersorganisaties beantwoorden klachten en beoordelen geschillen, bedoeld in het eerste lid,
      schriftelijk. Ingeval de collectieve beheersorganisatie de klacht of het geschil afwijst, motiveert zij de
      afwijzing.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister wijst een geschillencommissie aan voor de beslechting van geschillen tussen in Nederland gevestigde
      collectieve beheersorganisaties die multiterritoriale licenties voor onlinerechten inzake muziekwerken aanbieden of
      verlenen en:

      a. feitelijke en potentiële aanbieders van onlinediensten betreffende de toepassing van de [artikelen 2l][ref1],
      [5c][ref2], [5d][ref3] en [5e][ref4];

      b. geschillen met één of meer rechthebbenden betreffende de toepassing van de [artikelen 5c tot en met 5i][ref5];

      c. geschillen met een andere collectieve beheersorganisatie betreffende de toepassing van de
      [artikelen 5c tot en met 5h][ref6].

      2 Onze Minister kan een geschillencommissie aanwijzen, voor de beslechting van geschillen, anders dan de in
      het eerste lid genoemde, tussen collectieve beheersorganisaties en betalingsplichtigen over de billijkheid
      van de hoogte en de toepassing van door collectieve beheersorganisaties in rekening gebrachte vergoedingen,
      met uitzondering van geschillen over de hoogte van de in de [artikelen 15c][ref7], [16c][ref8] en
      [16h van de Auteurswet][ref9] bedoelde vergoedingen.

      3 Bij de aanwijzing van de geschillencommissie kunnen nadere regels worden gesteld omtrent de samenstelling,
      inrichting, procedures, bekostiging, werkwijze van en toezicht op de geschillencommissie. De leden van de
      geschillencommissie zijn onafhankelijk en deskundig op het gebied van het tot stand komen, toepassen en de
      billijkheid van door collectieve beheersorganisaties in rekening gebrachte vergoedingen voor gebruik van werken van
      letterkunde, wetenschap of kunst en ander materiaal.

      4 De betalingsplichtige, rechthebbenden of de collectieve beheersorganisatie kunnen de geschillencommissie binnen
      een, bij de aanwijzing, bedoeld in het derde lid, te bepalen termijn verzoeken een uitspraak te doen over een
      geschil als bedoeld in het eerste en het tweede lid.

      5 Wordt het geschil niet binnen drie maanden nadat het afschrift van de uitspraak van de geschillencommissie aan
      partijen werd verzonden bij de rechter aanhangig gemaakt, dan wordt hetgeen in de uitspraak is vastgesteld na het
      verstrijken van deze termijn geacht te zijn overeengekomen tussen partijen.


