        artikel: '9'
  - number: '8'
    text: |-
      1 Nevenfuncties van een lid van het College van Toezicht worden openbaar gemaakt door vermelding op de website van
      het College van Toezicht.

      2 Een lid van het College van Toezicht heeft geen financiële of andere belangen bij ondernemingen, instellingen of
      andere organisaties waardoor zijn onpartijdigheid in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 Het lidmaatschap van het College van Toezicht eindigt:

      a. door het verstrijken van de periode waarvoor het lid is benoemd;

      b. door ontslag, bedoeld in [artikel 12, tweede lid, van de Kaderwet][ref1];

      c. door ondercuratelestelling of overlijden van het lid;

      d. indien het faillissement of de toepassing van de schuldsaneringsregeling natuurlijke personen ten aanzien van
      het lid wordt uitgesproken;

      e. door een veroordeling wegens een misdrijf.

      2 Een besluit tot schorsing van de leden van het College van Toezicht regelt de gevolgen van de schorsing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '12'
    text: |-
      1 De kosten die het College van Toezicht maakt, worden vergoed door Onze Minister.

      2 Onze Minister brengt jaarlijks vijftig procent van de kosten, bedoeld in het eerste lid, in rekening aan de
      collectieve beheersorganisaties en onafhankelijke beheersorganisaties.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de systematiek op basis waarvan het bedrag, bedoeld
      in het tweede lid, over de collectieve beheersorganisaties en onafhankelijke beheersorganisaties wordt verdeeld
      en de bijdrage van een collectieve beheersorganisatie of onafhankelijke beheersorganisatie die een deel van het
      kalenderjaar onder het toezicht van het College van Toezicht valt.

      4 Het College van Toezicht organiseert jaarlijks een overleg met de collectieve beheersorganisaties en
      onafhankelijke beheersorganisaties. Ambtenaren kunnen het overleg bijwonen namens Onze Minister. Het College van
      Toezicht maakt het verslag van het overleg binnen een redelijke termijn na het overleg openbaar.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel12
  - number: '13'
    text: |-
      1 Het College van Toezicht vergadert ten minste vier maal per jaar en voorts zo vaak als door de voorzitter of ten
      minste twee andere leden van het College wenselijk wordt geoordeeld.

      2 Het College van Toezicht besluit met volstrekte meerderheid van uitgebrachte stemmen. Elk lid heeft één stem.
      Indien de stemmen staken beslist de voorzitter.

      3 Het College van Toezicht kan bij bestuursreglement nadere regels vaststellen omtrent zijn vergadering en
      besluitvorming.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel13
  - number: '14'
    text: |-
      Het College van Toezicht kan vertegenwoordigers van betalingsplichtigen of andere belanghebbenden in de gelegenheid
      stellen te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel14
  - number: '15'
    text: |-
      1 Het College van Toezicht stelt jaarlijks voor 1 oktober een jaarverslag en een toezichtsrapport op. Het
      jaarverslag beschrijft de taakuitoefening en het gevoerde beleid. Het jaarverslag beschrijft voorts het gevoerde
      beleid met betrekking tot de kwaliteitszorg.

      2 Het College van Toezicht zendt het jaarverslag en het toezichtsrapport aan Onze Minister en beide kamers der
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel15
  - number: '16'
    text: |-
      1 Indien een collectieve beheersorganisatie samenwerkt met of werkzaamheden laat verrichten door een in
      Nederland gevestigde derde, verband houdende met de inning of de verdeling van vergoedingen op grond van
      de [Auteurswet][ref1] of de [Wet op de naburige rechten][ref2], is deze derde, onverminderd het bepaalde in
      [artikel 5, derde lid][ref3], gehouden het College van Toezicht op zijn verzoek onverwijld alle inlichtingen te
      verschaffen die het college nodig acht voor zijn taakuitoefening.

      2 [Artikel 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref4] alsmede de [artikelen 6][ref5],
      [18][ref6] en [19][ref7] zijn van overeenkomstige toepassing.

      3 Het College van Toezicht is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref8] ten aanzien van de in het eerste lid bedoelde
      taakuitoefening.


