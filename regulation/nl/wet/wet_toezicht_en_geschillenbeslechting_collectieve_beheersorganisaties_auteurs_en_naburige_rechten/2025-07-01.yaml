  - number: 5b
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie die multiterritoriale licenties
      voor onlinerechten inzake muziekwerken verleent, over voldoende capaciteit beschikt om elektronisch op doelmatige
      en transparante wijze de gegevens te verwerken die nodig zijn voor het beheer van dergelijke licenties.

      2 Voor de doeleinden van het eerste lid voldoet een collectieve beheersorganisatie ten minste aan de volgende
      eisen:

      a) de collectieve beheersorganisatie kan de muziekwerken waarvoor zij bevoegd is tot vertegenwoordiging nauwkeurig
      identificeren in zijn geheel of in onderdelen;

      b) de collectieve beheersorganisatie kan voor elk betrokken grondgebied in de Europese Unie of een staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte de rechten en de respectievelijke rechthebbenden
      nauwkeurig identificeren in zijn geheel of in onderdelen, voor elk muziekwerk of aandeel daarin waarvoor de
      collectieve beheersorganisatie is gemachtigd tot vertegenwoordiging;

      c) de collectieve beheersorganisatie gebruikt unieke identificatiemiddelen om rechthebbenden en muziekwerken te
      identificeren, voor zover mogelijk rekening houdend met vrijwillige industriële normen en praktijken die zijn
      ontwikkeld op internationaal niveau of op het niveau van de Europese Unie;

      d) de collectieve beheersorganisatie gebruikt gepaste middelen om tijdig en doeltreffend tegenstrijdigheden te
      constateren en weg te nemen in gegevens van andere collectieve beheersorganisaties die multiterritoriale licenties
      voor rechten van onlinegebruik van muziekwerken verlenen.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5b
  - number: 5c
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie die multiterritoriale licenties
      voor onlinerechten inzake muziekwerken verstrekt, aan aanbieders van onlinediensten, aan rechthebbenden van
      wie zij de rechten vertegenwoordigt en aan andere collectieve beheersorganisaties op elektronische wijze, na
      een gemotiveerd verzoek, actuele informatie verstrekt die de identificatie van het door zijn vertegenwoordigde
      onlinemuziekrepertoire mogelijk maakt. Deze informatie omvat:

      a) de vertegenwoordigde muziekwerken;

      b) de geheel of gedeeltelijk vertegenwoordigde rechten, en

      c) de bestreken grondgebieden.

      2 De collectieve beheersorganisatie kan zo nodig redelijke maatregelen treffen om de juistheid en integriteit van
      de gegevens te beschermen, hun hergebruik te beheren en commercieel gevoelige informatie te beschermen.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5c
  - number: 5d
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie die multiterritoriale licenties
      voor onlinerechten inzake muziekwerken verleent, beschikt over een regeling waarmee rechthebbenden, andere
      collectieve beheersorganisaties en aanbieders van onlinediensten kunnen vragen om rectificatie van de gegevens,
      bedoeld in de lijst van voorwaarden in [artikel 5b, tweede lid][ref1], of de op grond van [artikel 5c][ref2]
      verstrekte informatie. Een verzoek tot rectificatie gaat vergezeld van bewijsstukken waaruit redelijkerwijs
      blijkt dat de gegevens met betrekking tot hun onlinerechten inzake muziekwerken onjuist zijn. De collectieve
      beheersorganisatie draagt zorg voor rectificatie zonder onnodige vertraging, indien het verzoek voldoende is
      onderbouwd.

      2 De collectieve beheersorganisatie stelt rechthebbenden van wie muziekwerken in zijn eigen muziekrepertoire
      zijn opgenomen, of die zij overeenkomstig [artikel 5i][ref3] vertegenwoordigt, in staat om in elektronische
      vorm informatie in te dienen over hun muziekwerken, hun rechten op deze werken en de grondgebieden waarvoor
      zij de collectieve beheersorganisatie machtigen. Daarbij houden de collectieve beheersorganisatie en de
      rechthebbenden voor zover mogelijk rekening met vrijwillige industriële normen of praktijken met betrekking
      tot gegevensuitwisseling die zijn ontwikkeld op internationaal niveau of op het niveau van de Europese Unie,
      waardoor de rechthebbenden het muziekwerk geheel of gedeeltelijk, de onlinerechten geheel of gedeeltelijk en de
      grondgebieden waarvoor zij de organisatie machtigen, kunnen specificeren.

      3 Een collectieve beheersorganisatie die door een andere collectieve beheersorganisatie overeenkomstig
      [artikel 5g][ref4] en [5h][ref5] is belast met de uitgifte van multiterritoriale licenties past het tweede lid ook
      toe met betrekking tot de rechthebbenden van lastgevende collectieve beheersorganisaties, tenzij de collectieve
      beheersorganisaties anders overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel5c
      [ref3]: https://wetten.overheid.nl/BWBR0014779#Artikel5i
      [ref4]: https://wetten.overheid.nl/BWBR0014779#Artikel5g
      [ref5]: https://wetten.overheid.nl/BWBR0014779#Artikel5h
