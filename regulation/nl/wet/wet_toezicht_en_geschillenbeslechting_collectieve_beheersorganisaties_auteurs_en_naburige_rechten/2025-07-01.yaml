      - id: ref2
        bwb_id: BWBR0005921
  - number: 2m
    text: |-
      1 Onverminderd het bepaalde in het tweede lid, [artikel 2n][ref1] en [artikel 5f, tweede lid][ref2], ziet
      het College van Toezicht erop toe dat een collectieve beheersorganisatie minimaal eenmaal per jaar ten minste
      de volgende informatie bekendmaakt aan iedere rechthebbende aan wie zij rechteninkomsten heeft toegewezen of
      betalingen heeft gedaan, voor de periode waarop de informatie betrekking heeft:

      a) de contactgegevens van de rechthebbende;

      b) de aan de rechthebbende toegewezen rechteninkomsten;

      c) de door de collectieve beheersorganisatie aan de rechthebbende betaalde bedragen per beheerde rechtencategorie
      en per soort gebruik;

      d) de periode waarin het gebruik heeft plaatsgevonden waarvoor bedragen zijn toegewezen en betaald aan de
      rechthebbende, tenzij de collectieve beheersorganisatie vanwege objectieve redenen, niet over deze gegevens kan
      beschikken;

      e) bedragen die zijn ingehouden met betrekking tot beheerskosten;

      f) bedragen die zijn ingehouden voor andere doeleinden dan met betrekking tot beheerskosten;

      g) rechteninkomsten toegewezen aan een rechthebbende die voor enige periode onbetaald blijven.

      2 Wanneer een collectieve beheersorganisatie rechteninkomsten toewijst en als leden organisaties heeft, die
      verantwoordelijk zijn voor de uitkering van rechteninkomsten aan rechthebbenden, verstrekt de collectieve
      beheersorganisatie de opgesomde informatie, bedoeld in het eerste lid, aan deze organisaties, tenzij de collectieve
      beheersorganisatie deze informatie niet in zijn bezit heeft. Het College ziet erop toe dat deze organisaties ten
      minste éénmaal per jaar, minimaal de informatie bedoeld in het eerste lid, bekendmaken aan elke rechthebbende aan
      wie zij inkomsten uit rechten hebben toegewezen of betalingen hebben gedaan in de periode waarop de informatie
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2n
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel5f
