      1 Het College van Toezicht kan een last onder dwangsom opleggen wegens niet-naleving van een advies als bedoeld in
      [artikel 6, eerste lid][ref1], en van een aanwijzing als bedoeld in artikel 6, tweede lid.

      2 Aan een last kunnen voorschriften worden verbonden betreffende de in [artikel 2, tweede lid][ref2], aan een
      collectieve beheersorganisatie of onafhankelijke beheersorganisatie gestelde eisen.

      3 Een last geldt voor een door het College van Toezicht te bepalen termijn van ten hoogste twee jaren.


