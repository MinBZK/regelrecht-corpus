    text: |-
      De rechter beslist omtrent een geschil als bedoeld in [artikel 23, tweede lid][ref1], niet dan nadat
      de geschillencommissie in de gelegenheid is gesteld om hieromtrent advies uit te brengen, tenzij de
      geschillencommissie hierover reeds uitspraak heeft gedaan of de rechter ook zonder advies aanstonds kan beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel23
