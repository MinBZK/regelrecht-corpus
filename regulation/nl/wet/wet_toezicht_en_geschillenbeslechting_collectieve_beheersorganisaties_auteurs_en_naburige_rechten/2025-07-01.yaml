  - number: 5e
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie toezicht houdt op het gebruik van
      onlinerechten inzake muziekwerken die zij geheel of gedeeltelijk beheert, door aanbieders van onlinediensten aan
      wie zij een multiterritoriale licentie voor die rechten heeft verleend.

      2 De collectieve beheersorganisatie biedt aanbieders van onlinediensten de mogelijkheid om op elektronische wijze
      verslag te doen van het feitelijke gebruik van onlinerechten inzake muziekwerken.

      3 Aanbieders van onlinediensten doen nauwkeurig verslag van het feitelijke gebruik van onlinerechten inzake
      muziekwerken.

      4 De collectieve beheersorganisatie biedt het gebruik van ten minste één verslagmethode aan, rekening houdend met
      vrijwillige industriële normen of praktijken die op internationaal niveau of op het niveau van de Europese Unie
      zijn ontwikkeld voor de elektronische uitwisseling van dergelijke gegevens. Als de collectieve beheersorganisatie
      voorziet in verslaglegging volgens een industriële norm voor de elektronische gegevensuitwisseling, kan zij
      weigeren verslagen van de aanbieder van onlinediensten in een eigen indeling te aanvaarden.

      5 De collectieve beheersorganisatie verzendt facturen aan de aanbieder van onlinediensten op elektronische
      wijze. De collectieve beheersorganisatie biedt het gebruik van ten minste één indeling aan, rekening houdend
      met vrijwillige industriële normen of praktijken die op internationaal niveau of op het niveau van de Unie zijn
      ontwikkeld. Op de factuur worden de muziekwerken en rechten geïdentificeerd die geheel of gedeeltelijk in licentie
      zijn gegeven op grond van de gegevens, als bedoeld in [artikel 5b, tweede lid][ref1] en het dienovereenkomstige
      feitelijke gebruik, voor zover mogelijk op grond van de door de aanbieder van onlinediensten verstrekte informatie
      en de indeling die is gebruikt om die informatie te verstrekken. Als de collectieve beheersorganisatie een
      industriële norm hanteert, kan de aanbieder van onlinediensten de factuur niet weigeren vanwege de indeling.

      6 Nadat het feitelijke gebruik van de onlinerechten van een muziekwerk is gemeld, factureert de collectieve
      beheersorganisatie, de onlinediensten zorgvuldig en zonder vertraging aan de aanbieder, tenzij dat niet mogelijk is
      om redenen die zijn toe te schrijven aan de aanbieder van onlinediensten.

      7 De collectieve beheersorganisatie stelt de aanbieder van onlinediensten in staat om de juistheid van de factuur
      te betwisten, ook wanneer de aanbieder van onlinediensten van één of meer collectieve beheersorganisaties facturen
      ontvangt voor dezelfde onlinerechten inzake hetzelfde muziekwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel5b
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5e
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: 5b
  - number: 5f
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie die multiterritoriale licenties
      voor onlinerechten inzake muziekwerken verleent, aan rechthebbenden verschuldigde bedragen die voortvloeien uit
      dergelijke licenties nauwkeurig en zonder vertraging verdeelt nadat het feitelijke gebruik van het werk is gemeld,
      tenzij dat niet mogelijk is om redenen die zijn toe te schrijven aan de aanbieder van onlinediensten.

      2 De collectieve beheersorganisatie verstrekt samen met elke betaling die zij doet op grond van het eerste lid, ten
      minste de volgende informatie aan rechthebbenden:

      a) de periode waarin en de gebieden waar het gebruik waarvoor bedragen aan rechthebbenden verschuldigd zijn, heeft
      plaatsgevonden;

      b) de geïnde bedragen, ingehouden bedragen en bedragen die door de collectieve beheersorganisatie zijn
      verdeeld voor ieder recht voor online gebruik van een muziekwerk waarvoor de rechthebbenden de collectieve
      beheersorganisatie hebben gemachtigd om hen geheel of gedeeltelijk te vertegenwoordigen;

      c) de voor de rechthebbenden geïnde bedragen, ingehouden bedragen en bedragen die door de collectieve
      beheersorganisatie zijn verdeeld met betrekking tot iedere aanbieder van onlinediensten.

      3 Het bepaalde in het eerste en het tweede lid geldt niet wanneer een collectieve beheersorganisatie een andere
      collectieve beheersorganisatie heeft belast met multiterritoriale licentieverlening voor de onlinerechten inzake
      muziekwerken op grond van de [artikelen 5g][ref1] en [5h][ref2]. In dat geval verdeelt de lastnemende collectieve
      beheersorganisatie de bedragen, bedoeld in het eerste lid, nauwkeurig en zonder vertraging, en verstrekt zij
      de informatie, als bedoeld in het tweede lid aan de lastgevende collectieve beheersorganisatie. De lastgevende
      collectieve beheersorganisatie is verantwoordelijk voor de verdeling van die bedragen en de verstrekking van die
      informatie aan de rechthebbenden, tenzij de collectieve beheersorganisaties anders overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel5g
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel5h
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5f
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: 5g
      - id: ref2
        bwb_id: BWBR0014779
        artikel: 5h
  - number: 5g
    text: |-
      1 Het College van Toezicht ziet erop toe dat iedere vertegenwoordigingsovereenkomst tussen collectieve
      beheersorganisaties waarbij een collectieve beheersorganisatie een andere collectieve beheersorganisatie
      belast met de verlening van multiterritoriale licenties voor de onlinerechten inzake muziekwerken in zijn
      eigen muziekrepertoire, van niet-exclusieve aard is. De lastnemende collectieve beheersorganisatie beheert die
      onlinerechten op niet-discriminerende wijze.

      2 De lastgevende collectieve beheersorganisatie informeert zijn leden over de belangrijkste bepalingen van de
      overeenkomst, met inbegrip van de duur ervan en de kosten van de door de lastnemende collectieve beheersorganisatie
      geleverde diensten.

      3 De lastnemende collectieve beheersorganisatie informeert de lastgevende collectieve beheersorganisatie over de
      belangrijkste voorwaarden waar de rechten van deze laatste in licentie worden gegeven, met inbegrip van de aard
      van de exploitatie, alle bepalingen die betrekking hebben of van invloed zijn op de licentiekosten, de duur van de
      licentie, de boekperioden en de bestreken grondgebieden.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5g
  - number: 5h
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie instemt met een verzoek van een
      andere collectieve beheersorganisatie om een vertegenwoordigingsovereenkomst te sluiten om multiterritoriale
      licenties voor onlinerechten inzake muziekwerken te verlenen voor het repertoire van de verzoekende organisatie,
      indien deze organisatie niet zelf deze licenties verleent en de aangezochte organisatie al multiterritoriale
      licenties voor dezelfde categorie onlinerechten inzake muziekwerken in het repertoire van één of meer andere
      collectieve beheersorganisaties verleent.

      2 De aangezochte collectieve beheersorganisatie beantwoordt het verzoek van de verzoekende collectieve
      beheersorganisatie schriftelijk en zonder onnodige vertraging.

      3 Onverminderd het bepaalde in het vijfde en het zesde lid, beheert de aangezochte collectieve beheersorganisatie
      het vertegenwoordigde repertoire van de verzoekende collectieve beheersorganisatie onder dezelfde voorwaarden als
      zijn eigen repertoire.

      4 De aangezochte collectieve beheersorganisatie neemt het vertegenwoordigde repertoire van de verzoekende
      collectieve beheersorganisatie op in alle aanbiedingen die zij doet aan aanbieders van onlinediensten.

      5 De beheerskosten voor de dienst die door de aangezochte collectieve beheersorganisatie wordt verleend aan
      de verzoekende organisatie overstijgen niet de kosten die door de aangezochte collectieve beheersorganisatie
      redelijkerwijs zijn gemaakt.

      6 De verzoekende collectieve beheersorganisatie verstrekt de aangezochte collectieve beheersorganisatie
      de informatie over zijn eigen muziekrepertoire die noodzakelijk is voor de verlening van multiterritoriale
      licenties voor onlinerechten inzake muziekwerken. De aangezochte collectieve beheersorganisatie kan de kosten
      die redelijkerwijs zijn gemaakt, teneinde muziekwerken waarvoor informatie ontoereikend of onbruikbaar is, uit te
      sluiten of om aan de vereisten te voldoen, in rekening brengen bij de verzoekende collectieve beheersorganisatie,
      indien de verstrekte informatie ontoereikend is of in een vorm is verstrekt die de aangezochte collectieve
      beheersorganisatie niet in staat stelt aan de vereisten van de [artikel 5a tot en met 5j][ref1] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel5a
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5h
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: 5a
  - number: 5i
    text: |-
      1 Het College van Toezicht ziet erop toe dat rechthebbenden, die een collectieve beheersorganisatie hebben
      gemachtigd om hun onlinerechten inzake muziekwerken te beheren, de onlinerechten inzake muziekwerken ten behoeve
      van multiterritoriale licentieverlening voor alle grondgebieden uit die collectieve beheersorganisatie kunnen
      terugtrekken zonder de onlinerechten inzake muziekwerken ten behoeve van monoterritoriale licentieverlening te
      hoeven terugtrekken, wanneer een collectieve beheersorganisatie uiterlijk op 10 april 2017 geen multiterritoriale
      licenties voor onlinerechten inzake muziekwerken verleent of aanbiedt en geen andere collectieve beheersorganisatie
      toestaat die rechten voor een dergelijk doel te beheren. Deze rechthebbenden kunnen vervolgens zelf of via enige
      andere partij die zij machtigen of via een collectieve beheersorganisatie die wel voldoet aan de voorwaarden van
      de [artikelen 5a tot en met 5j][ref1], multiterritoriale licenties voor hun onlinerechten inzake muziekwerken
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel5a
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel5i
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: 5a
  - number: 5j
    text: |-
      De [artikelen 5a tot en met 5i][ref1] zijn niet van toepassing op collectieve beheersorganisaties die op grond van
      de vrijwillige samenvoeging van de vereiste rechten overeenkomstig de mededingingsregels krachtens de artikelen
      101 en 102 VWEU, een multiterritoriale licentie verlenen voor de onlinerechten inzake muziekwerken die vereist zijn
      voor een omroep die zijn radio- of televisieprogramma’s gelijktijdig met of na de oorspronkelijke uitzending wil
      meedelen of openbaar wil maken.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel5a
