  - number: 2a
    text: |-
      1 Het College van Toezicht ziet erop toe dat rechthebbenden de rechten hebben, bedoeld in het tweede tot en met
      het achtste lid, en dat die rechten worden opgenomen in de statuten of lidmaatschapsvoorwaarden van de collectieve
      beheersorganisatie.

      2 Rechthebbenden hebben het recht om de collectieve beheersorganisatie van hun keuze te machtigen de rechten
      op grond van in de [Auteurswet][ref1] en de [Wet op de naburige rechten][ref2] beschermd materiaal te laten
      beheren voor de grondgebieden van hun keuze, ongeacht nationaliteit, lidstaat van verblijf of vestiging
      van de rechthebbende. Tenzij de collectieve beheersorganisatie objectief gerechtvaardigde redenen heeft
      om het beheer te weigeren, beheert zij de rechten op materiaal bedoeld in de [Auteurswet][ref3] en de
      [Wet op de naburige rechten][ref4], mits het beheer daarvan binnen zijn werkterrein valt.

      3 Rechthebbenden kunnen licenties verlenen voor niet-commercieel gebruik van rechten op grond van in de
      [Auteurswet][ref5] en de [Wet op de naburige rechten][ref6] beschermd materiaal.

      4 Rechthebbenden kunnen de machtiging, als bedoeld in het tweede lid, geheel of gedeeltelijk beëindigen met
      inachtneming van een redelijke opzegtermijn van ten hoogste zes maanden. De collectieve beheersorganisatie kan
      besluiten dat een dergelijke beëindiging ingaat op het einde van het boekjaar.

      5 Als er aan een rechthebbende bedragen verschuldigd zijn voor exploitatiehandelingen die hebben plaatsgevonden
      voordat de machtiging is beëindigd, of op grond van een licentie die is verleend voordat de beëindiging van
      kracht werd, behoudt de rechthebbende zijn rechten op grond van de artikelen [2h][ref7], [2i][ref8], [2m][ref9],
      [2o][ref10], [5f ][ref11] en [22][ref12].

      6 Een collectieve beheersorganisatie mag de uitoefening van de rechten, bedoeld in het vierde en vijfde
      lid, niet beperken door te eisen dat het beheer van de rechten op grond van de in de [Auteurswet][ref13] en
      de [Wet op de naburige rechten][ref14] beschermd materiaal die het voorwerp zijn van de beëindiging, wordt
      toevertrouwd aan een andere collectieve beheersorganisatie.

      7 De rechthebbende die een collectieve beheersorganisatie machtigt om zijn rechten te beheren, verleent specifiek
      en schriftelijk toestemming aan de collectieve beheersorganisatie voor het beheer van ieder op grond van de
      [Auteurswet][ref15] en de [Wet op de naburige rechten][ref16] beschermd materiaal.

      8 Een collectieve beheersorganisatie informeert rechthebbenden over hun rechten op grond van het tweede tot
      en met het zevende lid, en over elke voorwaarde die aan het in derde lid bedoelde recht verbonden is, alvorens
      de machtiging, als bedoeld in het tweede lid, te verkrijgen. Een collectieve beheersorganisatie informeert de
      rechthebbenden die zijn al hebben gemachtigd, uiterlijk op 10 oktober 2016 over hun rechten op grond van deze
      bepaling.


