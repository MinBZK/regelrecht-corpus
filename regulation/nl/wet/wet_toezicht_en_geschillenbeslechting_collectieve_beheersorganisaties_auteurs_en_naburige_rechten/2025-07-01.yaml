  - number: 2f
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie alle nodige maatregelen neemt zodat
      de personen die zijn belast met de dagelijkse leiding dit op solide, prudente en passende wijze doen met behulp van
      goede administratieve en boekhoudkundige procedures en interne controlemechanismen.

      2 Het College van Toezicht ziet erop toe dat collectieve beheersorganisaties procedures invoeren en toepassen ter
      vermijding van belangconflicten en om ieder direct of indirect persoonlijk tegenstrijdig belang te identificeren,
      te beheren, te bewaken en bekend te maken op een zodanige wijze dat voorkomen wordt dat deze de gezamenlijke
      belangen schaden van de rechthebbenden die de organisatie vertegenwoordigt.

      3 De procedure, bedoeld in het tweede lid, omvat een jaarlijkse individuele verklaring van elk van de in het eerste
      lid bedoelde personen aan de algemene ledenvergadering, die de volgende informatie bevat:

      a) ieder belang bij de collectieve beheersorganisatie;

      b) iedere ontvangen beloning van de collectieve beheersorganisatie in het boekjaar voorafgaand aan het jaar waarin
      de verklaring wordt afgelegd, waaronder pensioenregelingen, voordelen in natura en andersoortige voordelen;

      c) eventuele bedragen die zij in het boekjaar voorafgaand aan het jaar waarin de verklaring wordt afgelegd als
      rechthebbende van de collectieve beheersorganisatie hebben ontvangen;

      d) een opgave van ieder direct of indirect persoonlijk belang dat tegenstrijdig is met het belang van de
      collectieve beheersorganisatie;
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel2f
  - number: 2g
    text: |-
      1 Het College van Toezicht ziet erop toe dat een collectieve beheersorganisatie voldoet aan het bepaalde in het
      tweede tot en met vijfde lid met betrekking tot het beheer van rechteninkomsten.

      2 Een collectieve beheersorganisatie int en beheert rechteninkomsten zorgvuldig.

      3 Een collectieve beheersorganisatie administreert in zijn boekhouding gescheiden:

      a) rechteninkomsten en inkomsten uit de belegging van rechteninkomsten; en

      b) eventuele eigenvermogensbestanddelen en inkomsten uit dergelijke vermogensbestanddelen, uit beheerskosten of uit
      overige activiteiten.

      4 Het is een collectieve beheersorganisatie niet toegestaan om de rechteninkomsten of inkomsten uit de belegging
      van rechteninkomsten te gebruiken voor andere doeleinden dan uitkering aan de rechthebbenden, tenzij de
      collectieve beheersorganisatie toestemming heeft om beheerskosten in te houden of te compenseren in overeenstemming
      met een besluit genomen overeenkomstig artikel 2d, zesde lid, onderdeel d, of zij deze rechteninkomsten of
      inkomsten uit de belegging van rechteninkomsten mag gebruiken in overeenstemming met een besluit, als bedoeld in
      [artikel 2d, zesde lid][ref1].

      5 Wanneer een collectieve beheersorganisatie rechteninkomsten of inkomsten uit de belegging van rechteninkomsten
      belegt, doet zij dat in het belang van de rechthebbenden wiens rechten zij vertegenwoordigt, in overeenstemming
      met het in [artikel 2d, zesde lid, onderdelen c en f][ref2], bedoelde algemene beleggings- en risicobeheerbeleid en
      rekening houdend met de volgende bepalingen:

      a) wanneer er een potentieel belangenconflict bestaat, ziet de collectieve beheersorganisatie erop toe dat de
      belegging uitsluitend in het belang van die rechthebbenden wordt uitgevoerd;

      b) de bedragen worden belegd met het oogmerk om de zekerheid, kwaliteit, liquiditeit en winstgevendheid van de
      portefeuille als geheel te waarborgen;

      c) de beleggingen worden deugdelijk gediversifieerd om buitensporige afhankelijkheid van één belegging en de
      accumulatie van risico in de portefeuille als geheel te vermijden.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel2d
