  - number: 2e
    text: |-
      1 Het College van Toezicht ziet erop toe dat iedere collectieve beheersorganisatie beschikt over een
      toezichtfunctie die voldoet aan de voorwaarden genoemd in het tweede tot en met het vijfde lid.

      2 De verschillende categorieën van leden van de collectieve beheersorganisatie zijn billijk en evenwichtig
      vertegenwoordigd in het orgaan dat de toezichtfunctie uitoefent.

      3 Elk lid van het orgaan dat de toezichtfunctie uitoefent, legt aan de algemene ledenvergadering jaarlijks een
      individuele verklaring af over ieder tegenstrijdige belang als bedoeld in [artikel 2f, derde lid][ref1].

      4 Het orgaan dat de toezichtfunctie uitoefent, komt periodiek bijeen en heeft ten minste de bevoegdheid om:

      (a) de bevoegdheden uit te oefenen die door de algemene vergadering zijn gedelegeerd, met inbegrip van de
      bevoegdheden op grond van [artikel 2d, vierde, vijfde en zevende lid][ref2];

      (b) toezicht te houden op de activiteiten en de taakuitvoering van de in [artikel 2f][ref3] bedoelde personen, de
      uitvoering van de besluiten van de algemene ledenvergadering of het orgaan dat de toezichtfunctie uitoefent, en in
      het bijzonder van de algemene beleidslijnen als bedoeld in [artikel 2d, zesde lid, onderdeel a tot en met d][ref4].

      5 Het orgaan dat de toezichtfunctie uitoefent, brengt ten minste eenmaal per jaar verslag uit aan de algemene
      ledenvergadering over de uitoefening van zijn bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2f
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel2d
      [ref3]: https://wetten.overheid.nl/BWBR0014779#Artikel2f
      [ref4]: https://wetten.overheid.nl/BWBR0014779#Artikel2d
