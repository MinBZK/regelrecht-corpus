    text: |-
      Onverminderd het bepaalde in [artikel 30a Auteurswet][ref1], ziet het College van Toezicht erop
      toe dat in Nederland gevestigde collectieve beheersorganisaties zich aan de voorschriften uit de
      [artikelen 5b tot en met 5j][ref2] houden bij de verlening van multiterritoriale licenties voor onlinerechten
      inzake muziekwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel5b
