  - number: '2'
    text: |-
      1 Er is een College van Toezicht dat tot taak heeft toezicht uit te oefenen op de inning en de verdeling
      van rechteninkomsten door de collectieve beheersorganisaties en op onafhankelijke beheersorganisaties
      voor zover het de in [artikel 25d][ref1] genoemde artikelen betreft. De [Kaderwet][ref2], met
      uitzondering van de [artikelen 18][ref3], [21][ref4] en [22][ref5], is van toepassing op het College van
      Toezicht. Onze Minister oefent de bevoegdheden uit, bedoeld in de [artikelen 12, eerste lid][ref6], en
      [23, eerste en tweede lid, van de Kaderwet][ref7] in overeenstemming met Onze Minister van Onderwijs, Cultuur en
      Wetenschap en Onze Minister van Economische Zaken.

      2 Het College ziet erop toe dat een collectieve beheersorganisatie voldoende is toegerust om zijn taken naar
      behoren uit te oefenen en bij de uitoefening van zijn werkzaamheden voldoende rekening houdt met de belangen van
      betalingsplichtigen.

      3 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden vastgesteld betreffende de in de
      [artikelen 2a tot en met 2r][ref8] gestelde eisen waaraan een collectieve beheersorganisatie moet voldoen. Deze
      voorschriften kunnen in het bijzonder betrekking hebben op de inhoud van het jaarlijkse transparantieverslag, de
      naleving van een bij algemene maatregel van bestuur aan te wijzen gedragscode, het vaststellen van nadere regels
      ten aanzien van aanwending van gelden voor andere doeleinden dan uitkering aan rechthebbenden, het beheer van
      de gelden waarvoor geen rechthebbenden zijn gevonden en de wijze waarop de representativiteit dienen te worden
      aangetoond. Bij algemene maatregel van bestuur kunnen tevens regels worden vastgesteld over de inrichting en het
      bestuur van een collectieve beheersorganisatie alsmede over de hoogte en de vorm van de bezoldiging van leden van
      een adviserend orgaan en het toezicht daarop.

      4 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


