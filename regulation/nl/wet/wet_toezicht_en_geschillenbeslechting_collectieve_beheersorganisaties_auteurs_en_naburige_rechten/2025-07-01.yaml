  - number: 25a
    text: |-
      1 De [paragrafen 1][ref1], [2][ref2], [4][ref3] en [5][ref4] alsmede de
      [artikelen 7.3, eerste, derde en vijfde tot en met tiende lid][ref5], [7.3a][ref6], [7.3b][ref7] en
      [7.5 van de Wet normering topinkomens][ref8] en de daarop berustende algemene maatregelen van bestuur alsmede
      de ministeriële regeling, bedoeld in [artikel 1.9 van die wet][ref9], zijn van overeenkomstige toepassing op
      collectieve beheersorganisaties, met dien verstande dat:

      a. wordt verstaan onder topfunctionaris: de leden van de uitvoerende, adviserende en toezichthoudende organen
      van een collectieve beheersorganisatie alsmede de hoogste ondergeschikte of de leden van de groep hoogste
      ondergeschikten aan dat orgaan en degene of degenen die is of zijn belast met de dagelijkse leiding van een
      collectieve beheersorganisatie.

      b. de op grond van [artikel 5.5, eerste lid, van die wet][ref10] opgeëiste bedragen beschikbaar komen voor
      verdeling aan rechthebbenden, en

      c. voor [artikel 7.3, elfde lid van die wet][ref11] wordt gelezen: Voor de toepassing van dit artikel blijft buiten
      beschouwing iedere wijziging in de bezoldiging of de duur van het dienstverband die is of wordt overeengekomen
      tussen 18 januari 2012 en het tijdstip waarop deze wet in werking treedt.

      2 De op grond van
      [paragraaf 5 van de Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref12] aan de
      Minister wie het aangaat toekomende bevoegdheden worden, in afwijking van [artikel 5.1 van die wet][ref13], voor
      de overeenkomstige toepassing van die wet op collectieve beheersorganisaties uitgeoefend door het College van
      Toezicht. De in de [artikelen 4.1][ref14], [4.2][ref15], [5.2, tweede lid][ref16], en [5.3 van genoemde wet][ref17]
      bedoelde informatie wordt, in afwijking van die artikelen, verstrekt aan het College van Toezicht.


