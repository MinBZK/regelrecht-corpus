  - number: 2d
    text: |-
      1 Het College van Toezicht ziet erop toe dat de algemene ledenvergadering van een collectieve beheersorganisatie
      met leden wordt gehouden overeenkomstig het bepaalde in het tweede tot en met het tiende lid.

      2 De algemene vergadering wordt ten minste éénmaal per jaar bijeen geroepen.

      3 De algemene vergadering beslist over wijzigingen in de lidmaatschapsvoorwaarden voor zover die voorwaarden niet
      in de statuten worden geregeld. Wanneer een algemene vergadering vanwege de rechtsvorm ontbreekt, beslist het
      orgaan dat de toezichtfunctie uitoefent over een statutenwijziging en een wijziging in de lidmaatschapsvoorwaarden.

      4 De algemene vergadering beslist over de benoeming of het ontslag van de bestuurders en ziet toe op hun algemene
      prestaties.

      5 De algemene vergadering heeft het recht de bezoldiging van bestuurders en andere emolumenten, zoals geldelijke
      en niet-geldelijke voordelen, pensioenrechten en -toekenningen, rechten op andere toekenningen en rechten op
      ontslagvergoedingen, goed te keuren.

      6 Onverminderd het bepaalde in de [artikelen 2g][ref1], [2h][ref2] en [2i][ref3] besluit de algemene
      ledenvergadering ten minste over de volgende zaken:

      (a) het algemene beleid ten aanzien van de verdeling van aan rechthebbenden verschuldigde bedragen;

      (b) het algemene beleid ten aanzien van onverdeelde bedragen;

      (c) het algemene beleggingsbeleid ten aanzien van rechteninkomsten en inkomsten uit de belegging van
      rechteninkomsten;

      (d) het algemene beleid ten aanzien van inhoudingen op rechteninkomsten en het gebruik van gelden afkomstig uit de
      belegging van rechteninkomsten;

      (e) het gebruik van onverdeelde bedragen;

      (f) het risicobeheerbeleid;

      (g) de goedkeuring van iedere verwerving, verkoop of het bezwaren van onroerend goed;

      (h) de goedkeuring van fusies en samenwerkingsverbanden, de oprichting van dochtermaatschappijen, de overname van
      andere organisaties en de verwerving van aandelen of rechten in andere organisaties;

      (i) de goedkeuring voor het opnemen van leningen, het verstrekken van leningen en zekerheden voor leningen;

      (j) de goedkeuring van het in [artikel 2][ref4] bedoelde jaarlijkse transparantierapport van de collectieve
      beheersorganisatie.

      7 De algemene vergadering kan de in het vierde, vijfde en zesde lid, onder f, g, h, en i opgesomde bevoegdheden bij
      besluit of door middel van een bepaling in de statuten delegeren aan het orgaan dat de toezichtfunctie uitoefent,
      ingeval een collectieve beheersorganisatie met leden over een dergelijk orgaan beschikt.

      8 Alle leden kunnen deelnemen aan een algemene ledenvergadering en daar hun stemrecht uit oefenen. De toegang tot
      de algemene ledenvergadering en het stemrecht kan in de statuten of de lidmaatschapsvoorwaarden worden beperkt
      op grond van ontvangen bedragen of aan een lid verschuldigde bedragen, mits dit criterium wordt vastgesteld en
      toegepast op een billijke en evenredige wijze.

      9 Ieder lid van een collectieve beheersorganisatie kan een andere persoon of organisatie als gevolmachtigde
      aanwijzen om aan de algemene vergadering deel te nemen en daar te stemmen, tenzij deze persoon of organisatie
      een tegenstrijdig belang heeft. Een volmacht wordt schriftelijk afgegeven en is slechts geldig ten behoeve van
      één algemene ledenvergadering. De gevolmachtigde heeft dezelfde rechten als de volmachtgever in de algemene
      ledenvergadering. De gevolmachtigde brengt zijn stem uit overeenkomstig de instructies van de volmachtgever.
      Personen die geen lid zijn van een collectieve beheersorganisatie kunnen slechts hun stem uitbrengen voor zover de
      statuten dit bepalen.

      10 In het geval dat een collectieve beheersorganisatie een algemene ledenvergadering heeft, kan deze de in dit
      artikel beschreven bevoegdheden laten uitoefenen door afgevaardigden die ten minste om de vier jaar worden gekozen
      door de leden van een collectieve beheersorganisatie. Het College van Toezicht ziet erop toe dat effectieve en
      passende deelname van de leden in de besluitvorming van de collectieve beheersorganisatie gewaarborgd blijft en dat
      de vertegenwoordiging van de verschillende categorieën van leden in de vergadering van afgevaardigden billijk en
      evenwichtig is. Het tweede tot en met het tiende lid zijn van overeenkomstige toepassing.

      11 De bevoegdheden van de algemene ledenvergadering kunnen worden uitgeoefend door het orgaan dat de
      toezichtfunctie uitoefent, ingeval een collectieve beheersorganisatie vanwege zijn rechtsvorm geen algemene
      ledenvergadering heeft. De in het eerste, tweede lid, en het vierde tot en met het zesde lid vastgestelde regels
      zijn van overeenkomstige toepassing.

      12 De bevoegdheden van de algemene ledenvergadering kunnen worden uitgeoefend door een vergadering van die
      rechthebbenden, ingeval een collectieve beheersorganisatie vanwege zijn rechtsvorm geen algemene ledenvergadering
      heeft en deze bevoegdheden niet worden uitgeoefend door het orgaan dat de toezichtfunctie uitoefent. De in het
      eerste, tweede lid, en het vierde tot en met zesde lid vastgestelde regels zijn van overeenkomstige toepassing.


