  - number: '7'
    text: |-
      1 Het College van Toezicht bestaat uit drie of meer personen. Het aantal leden van het College, de voorzitter
      daaronder begrepen, is steeds oneven.

      2 De leden van het College van Toezicht kunnen de taken onderling verdelen. Het College blijft verantwoordelijk
      voor de uitoefening van deze taken.

      3 Onze Minister wijst de voorzitter aan.

      4 De leden van het College van Toezicht worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen na
      afloop van deze periode aansluitend eenmaal opnieuw worden benoemd voor een termijn van ten hoogste vier jaren.

      5 Het College van Toezicht blijft ook in geval van een of meer vacatures bevoegd tot hetgeen hem is opgedragen.

      6 Het College van Toezicht kent zoveel plaatsvervangende leden als Onze Minister nodig acht. Het vierde lid en
      [artikel 9][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel9
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel7
    references:
