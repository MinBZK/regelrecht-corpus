  - number: 2h
    text: |-
      1 Het College van Toezicht ziet erop toe dat inhoudingen op rechteninkomsten en inkomsten uit beleggingen van
      rechtenkomsten door een collectieve beheersorganisatie in overeenstemming plaatsvinden met het bepaalde in het
      tweede tot en met het vijfde lid.

      2 De collectieve beheersorganisatie informeert de rechthebbende over beheerskosten, andere inhoudingen op de
      rechteninkomsten en op inkomsten uit de belegging van rechteninkomsten, alvorens de rechthebbende de collectieve
      beheersorganisatie toestemming geeft.

      3 Inhoudingen op rechteninkomsten zijn redelijk, staan in verhouding tot de door de collectieve beheersorganisatie
      aan de rechthebbenden verleende diensten, ook tot de in het vijfde lid bedoelde diensten, en worden vastgesteld op
      basis van objectieve criteria.

      4 Het College van Toezicht ziet erop toe dat de beheerskosten niet hoger zijn dan de gerechtvaardigde en
      gedocumenteerde kosten voor het beheren van auteursrechten en naburige rechten.

      5 Wanneer een collectieve beheersorganisatie sociale, culturele of educatieve diensten verleent die worden
      gefinancierd uit inhoudingen op de rechteninkomsten of uit andere inkomsten die voortvloeien uit de belegging van
      rechteninkomsten, worden dergelijke diensten geleverd op grond van billijke criteria.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel2h
  - number: 2i
    text: |-
      1 Onverminderd het bepaalde in [artikel 2k, vierde en vijfde lid][ref1] en [artikel 5f][ref2] ziet het College van
      Toezicht erop toe dat elke collectieve beheersorganisatie bij de verdeling van aan rechthebbenden verschuldigde
      bedragen de in het tweede tot en met tiende lid vastgestelde regels naleeft.

      2 Elke collectieve beheersorganisatie verdeelt regelmatig, zorgvuldig en correct de verschuldigde bedragen en
      betaalt deze bedragen aan rechthebbenden, in overeenstemming met het algemene beleid inzake de verdeling, bedoeld
      in [artikel 2d, zesde lid, onderdeel a][ref3].

      3 Collectieve beheersorganisaties of hun leden die organisaties zijn die rechthebbenden vertegenwoordigen, verdelen
      en betalen deze bedragen zo snel mogelijk aan rechthebbenden. Betaling en verdeling vindt in ieder geval uiterlijk
      negen maanden na afloop van het boekjaar plaats waarin de rechteninkomsten zijn geïnd, tenzij objectieve redenen
      de collectieve beheersorganisatie of, in voorkomend geval, zijn leden ervan weerhouden deze uiterste termijn te
      eerbiedigen.

      4 Verschuldigde bedragen die niet binnen de termijn gegeven in het derde lid onder rechthebbenden kunnen worden
      verdeeld, omdat de betrokken rechthebbenden niet geïdentificeerd of gelokaliseerd kunnen worden, worden apart
      geregistreerd in de boekhouding van de collectieve beheersorganisatie, tenzij de uitzondering op de termijn uit het
      derde lid van toepassing is.

      5 De collectieve beheersorganisatie treft de nodige maatregelen, in overeenstemming met het tweede en derde lid,
      om de rechthebbenden te identificeren en te lokaliseren. De collectieve beheersorganisatie maakt, in ieder geval,
      uiterlijk drie maanden na het verstrijken van de in het derde lid vermelde termijn, informatie bekend over op
      grond van de [Auteurswet][ref4] en de [Wet op de naburige rechten][ref5] beschermd materiaal waarvoor één of meer
      rechthebbenden niet zijn geïdentificeerd of gelokaliseerd aan:

      a) de rechthebbenden die zij vertegenwoordigt of de organisaties die rechthebbenden vertegenwoordigen, wanneer die
      organisaties lid zijn van de collectieve beheersorganisatie; en

      b) alle collectieve beheersorganisaties waarmee ze vertegenwoordigingsovereenkomsten heeft gesloten.

      6 Voor zover beschikbaar, omvat de informatie uit het vijfde lid, het volgende:

      a) de titel van het op grond de [Auteurswet][ref6] of de [Wet op de naburige rechten][ref7] beschermd materiaal;

      b) de naam van de rechthebbende;

      c) de naam van de betrokken uitgever of producent; en

      d) alle overige ter zake dienende beschikbare informatie die kan helpen om de rechthebbende te identificeren.

      7 De collectieve beheersorganisatie controleert het in [artikel 2b, zesde lid][ref8], bedoelde register en
      andere gemakkelijk beschikbare registers. Indien deze controle geen resultaat oplevert, maakt de collectieve
      beheersorganisatie de informatie, bedoeld in het zesde lid, uiterlijk één jaar na het verstrijken van de periode
      van drie maanden openbaar op zijn internetpagina.

      8 Verschuldigde bedragen aan rechthebbenden worden als onverdeeld beschouwd, indien deze bedragen drie jaar na
      afloop van het boekjaar waarin de inning van de rechteninkomsten heeft plaatsgevonden nog niet kunnen worden
      verdeeld en de collectieve beheersorganisatie alle nodige maatregelen heeft getroffen om de rechthebbenden te
      identificeren en te lokaliseren, als bedoeld in het vijfde, zesde en zevende lid.

      9 De algemene ledenvergadering van een collectieve beheersorganisatie besluit over het gebruik van de onverdeelde
      bedragen overeenkomstig [artikel 2d, zesde lid onderdeel b][ref9], onverminderd het recht van rechthebbenden om
      dergelijke bedragen van de collectieve beheersorganisatie te vorderen.

      10 Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven over het gebruik van onverdeelde gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2k
