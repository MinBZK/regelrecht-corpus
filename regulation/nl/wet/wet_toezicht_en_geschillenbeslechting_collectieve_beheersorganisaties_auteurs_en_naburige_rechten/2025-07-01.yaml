  - number: '17'
    text: |-
      Het College van Toezicht stelt de Europese Commissie uiterlijk op 10 april 2016 een lijst met collectieve
      beheersorganisaties die onder haar toezicht staan ter beschikking. Het College stelt de Europese Commissie zonder
      onnodige vertraging in kennis van elke wijziging in de lijst.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel17
  - number: 17a
    text: |-
      1 Onverminderd [artikel 5:45 van de Algemene wet bestuursrecht][ref1] vervalt de bevoegdheid van het College van
      Toezicht tot het opleggen van een bestuurlijke boete of last onder dwangsom aan een collectieve beheersorganisatie
      of onafhankelijke beheersorganisatie, indien het College van Toezicht op aanvraag van die collectieve
      beheersorganisatie of onafhankelijke beheersorganisatie besluit tot het bindend verklaren van een door die
      collectieve beheersorganisatie of onafhankelijke beheersorganisatie gedane toezegging.

      2 Het College van Toezicht kan een besluit nemen als bedoeld in het eerste lid, indien het:

      a. aannemelijk acht dat het naleven van de toezegging leidt tot het beëindigen of voorkomen van een overtreding,

      b. in staat is het naleven van de toezegging te controleren, en

      c. het bindend verklaren van een toezegging doelmatiger acht dan het opleggen van een bestuurlijke boete of een
      last onder dwangsom.

      3 De collectieve beheersorganisatie of onafhankelijke beheersorganisatie dient de aanvraag voor het nemen van een
      besluit als bedoeld in het eerste lid in, voordat het College van Toezicht een besluit omtrent het opleggen van een
      bestuurlijke boete of een last onder dwangsom heeft genomen.

      4 De termijn, bedoeld in [artikel 5:45, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt opgeschort met
      ingang van de dag waarop het College van Toezicht de aanvraag ontvangt, tot de dag waarop het College van Toezicht
      een besluit op de aanvraag heeft genomen.

      5 De collectieve beheersorganisatie of onafhankelijke beheersorganisatie gedraagt zich overeenkomstig het besluit,
      bedoeld in het eerste lid.

      6 Het College van Toezicht bepaalt gedurende welke periode het besluit, bedoeld in het eerste lid, geldt en kan
      deze periode telkens verlengen.

      7 Het College van Toezicht kan een besluit als bedoeld in het eerste lid of een besluit tot verlenging als bedoeld
      in het zesde lid, wijzigen of intrekken indien:

      a. er een wezenlijke verandering is opgetreden in de feiten waarop het besluit berust;

      b. het besluit berust op door de collectieve beheersorganisatie of onafhankelijke beheersorganisatie verstrekte
      onvolledige, onjuiste of misleidende gegevens;

      c. de collectieve beheersorganisatie of onafhankelijke beheersorganisatie in strijd met het vijfde lid handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel545
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel545
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel17a
