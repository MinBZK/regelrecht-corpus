  - number: 2r
    text: |-
      Een collectieve beheersorganisatie stelt met alle collectieve beheersorganisaties aan wie een betalingsplichtige
      een vergoeding verschuldigd is een gezamenlijke jaarlijkse factuur op en reikt deze uit aan die betalingsplichtige.
    url: https://wetten.overheid.nl/BWBR0014779/2025-07-01#Artikel2r
  - number: '3'
    text: |-
      1 De volgende besluiten van een collectieve beheersorganisatie behoeven de voorafgaande schriftelijke instemming
      van het College van Toezicht:

      a. een besluit tot wijziging van de statuten of tot ontbinding van de collectieve beheersorganisatie;

      b. een besluit tot vaststelling of wijziging van reglementen of algemene voorwaarden betreffende de uitoefening en
      handhaving van auteursrechten of naburige rechten;

      c. een besluit tot de vaststelling van een normaal toepasselijk tarief of korting voor een nieuw beheerd recht
      of nieuwe vorm van gebruik of tot verhoging van de tarieven, inclusief het vervallen van een korting, anders
      dan ingevolge een bij of krachtens algemene maatregel van bestuur vast te stellen indexering, overeenkomsten
      daaromtrent met representatieve organisaties van betalingsplichtigen of toegenomen gebruik van beschermde werken;

      d. een besluit tot vaststelling van het format waarop en het tijdsbestek waarbinnen gebruikers van een
      collectieve beheersorganisatie relevante informatie over het gebruik van de door de collectieve beheersorganisatie
      vertegenwoordigde rechten dienen te verstrekken voor de inning van de rechteninkomsten en de verdeling
      en uitbetaling daarvan aan rechthebbenden. Voor het vaststellen van dit besluit nemen de collectieve
      beheersorganisaties en de gebruikers voor zover mogelijk de vrijwillige normen van de industrie in acht.

      2 Het College van Toezicht kan over besluiten als bedoeld in het eerste lid een collectieve beheersorganisatie
      van advies dienen. Brengt het College van Toezicht binnen acht weken na ontvangst van het verzoek om schriftelijke
      instemming geen advies uit, dan wordt het besluit, bedoeld in het eerste lid, geacht te zijn goedgekeurd. Het
      College van Toezicht kan de termijn vanwege bijzondere omstandigheden verlengen met ten hoogste vier weken.

      3 Het College van Toezicht kan slechts zijn schriftelijke instemming aan een besluit onthouden indien de
      collectieve beheersorganisatie binnen een door het college te bepalen periode na ontvangst van een voorafgaand
      advies van het college het advies niet opvolgt.

      4 Het College van Toezicht onthoudt zijn goedkeuring aan een besluit tot de vaststelling van een normaal
      toepasselijk tarief of korting voor een nieuw beheerd recht of nieuwe vorm van gebruik of tot verhoging
      van de tarieven, bedoeld in het eerste lid, onderdeel c, indien het tarief of de verhoging, gelet op de in
      [artikel 2, tweede lid][ref1], vermelde eisen, buitensporig is. Het College van Toezicht onthoudt zijn goedkeuring
      niet dan nadat de geschillencommissie hieromtrent advies heeft uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2
