preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat regels gesteld worden met betrekking tot het
    toezicht op collectieve beheersorganisaties voor auteurs- en naburige rechten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      het College van Toezicht: het College van Toezicht, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '2'
  - number: 1.c
    text: |-
      collectieve beheersorganisatie: de door Onze Minister op grond van de [Auteurswet][ref1] of de
      [Wet op de naburige rechten][ref2] aangewezen rechtspersoon, die belast is met de inning en de
      verdeling van vergoedingen, alsmede de rechtspersoon die door Onze Minister is aangewezen overeenkomstig
      [artikel 17, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0014779#Artikel17
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel1
    references:
