      - id: ref3
        bwb_id: BWBR0014779
        artikel: '17'
  - number: 1.d
    text: |-
      geschillencommissie: de geschillencommissie, bedoeld in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel22
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '22'
  - number: 1.e
    text: |-
      de Kaderwet: de [Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '2.1'
    text: |-
      Er is een College van Toezicht dat tot taak heeft toezicht uit te oefenen op de inning en de verdeling
      van de vergoedingen door de collectieve beheersorganisaties. De [Kaderwet][ref1], met uitzondering van de
      [artikelen 21][ref2] en [22][ref3], is van toepassing op het College van Toezicht. Onze Minister oefent de
      bevoegdheden, bedoeld in de [artikelen 12, eerste lid][ref4], en [23, eerste en tweede lid, van de Kaderwet][ref5]
      uit in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap en Onze Minister van Economische
      Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0020495
        artikel: '23'
  - number: '2.2'
    text: 'Het College van Toezicht ziet er op toe dat een collectieve beheersorganisatie:'
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.a
    text: 'aan rechthebbenden en betalingsplichtigen inzicht verschaft in haar algemene en financiële beleid door:'
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.a.(i)
    text: |-
      het jaarlijks opstellen en openbaar maken van een jaarverslag en een jaarrekening overeenkomstig
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 2.2.a.(ii)
    text: |-
      openbaarmaking van de nevenfuncties van bestuurders, leden van de raad van toezicht, leden van een adviserend
      orgaan en van degene of degenen die met de dagelijkse leiding van een collectieve beheersorganisatie is of zijn
      belast;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.a.(iii)
    text: |-
      openbaarmaking van de statuten, de geschillenregeling, het repartitiereglement, de tarieven, de tariefgrondslagen,
      de licentievoorwaarden, kortingsregelingen, de mate van representativiteit, de mate van legitimiteit en de wijze
      waarop wel of geen vrijwaring wordt gegeven voor claims van niet-vertegenwoordigde rechthebbenden;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.a.(iv)
    text: openbaarmaking van de beheerskosten in het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.a.(v)
    text: |-
      in het jaarverslag de wijze van beheer en de verdeling van gelden toe te lichten, waarbij ten minste wordt vermeld
      in welk jaar de verdeelde gelden waren geïnd en voor welk deel van de gelden geen rechthebbenden zijn gevonden in
      de drie kalenderjaren volgend op het kalenderjaar van inning;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.b
    text: voldoende is toegerust om haar taken naar behoren te kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.c
    text: |-
      de door haar geïnde vergoedingen op rechtmatige wijze verdeelt over de rechthebbenden overeenkomstig het
      repartitiereglement;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.d
    text: bij de uitoefening van haar werkzaamheden voldoende rekening houdt met de belangen van de betalingsplichtigen;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.e
    text: een deugdelijke geschillenregeling voor rechthebbenden kent;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.f
    text: gelijke gevallen op gelijke wijze behandelt;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.g
    text: |-
      een doelmatig financieel beleid voert en de geïnde vergoedingen in de drie kalenderjaren volgend op het
      kalenderjaar van inning onder de rechthebbenden verdeelt;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.h
    text: |-
      streeft naar beperking van de beheerskosten voor de inning, het beheer en de verdeling van gelden tot een nader bij
      algemene maatregel van bestuur te bepalen drempel van het in een bepaald kalenderjaar geïnde of door een of meer
      organisaties verdeelde bedrag aan vergoedingen, bij overschrijding waarvan in het jaarverslag en ten genoegen van
      het College met redenen omkleed wordt aangegeven waaraan deze overschrijding te wijten is;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: 2.2.i
    text: |-
      met alle collectieve beheersorganisaties aan wie een betalingsplichtige een vergoeding is verschuldigd een
      gezamenlijke jaarlijkse factuur opstelt en uitreikt aan die betalingsplichtige.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven betreffende de in het tweede lid
      genoemde eisen waaraan een collectieve beheersorganisatie moet voldoen. Deze voorschriften kunnen in het bijzonder
      betrekking hebben op de inhoud van het jaarverslag, de naleving van een bij algemene maatregel van bestuur aan
      te wijzen gedragscode en de wijze waarop de representativiteit en legitimiteit dienen te worden aangetoond. Bij
      algemene maatregel van bestuur kunnen tevens regels worden gegeven over de inrichting en het bestuur van een
      collectieve beheersorganisatie alsmede over de hoogte en de vorm van de bezoldiging van leden van een adviserend
      orgaan en het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: '2.5'
    text: |-
      De voordracht voor een krachtens het derde en vierde lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De volgende besluiten van een collectieve beheersorganisatie behoeven de voorafgaande schriftelijke instemming van
      het College van Toezicht:
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
  - number: 3.1.a
    text: een besluit tot wijziging van de statuten of tot ontbinding van de collectieve beheersorganisatie;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
  - number: 3.1.b
    text: |-
      een besluit tot vaststelling of wijziging van reglementen of modelovereenkomsten betreffende de uitoefening en
      handhaving van auteursrechten of naburige rechten;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
  - number: 3.1.c
    text: |-
      een besluit tot verhoging van de tarieven anders dan ingevolge een bij of krachtens algemene maatregel van bestuur
      vast te stellen indexering, overeenkomsten daaromtrent met representatieve organisaties van betalingsplichtigen of
      toegenomen gebruik van beschermde werken.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het College van Toezicht kan over besluiten als bedoeld in het eerste lid een collectieve beheersorganisatie van
      advies dienen. Brengt het College van Toezicht binnen acht weken na ontvangst van het verzoek om schriftelijke
      instemming geen advies uit, dan wordt het besluit, bedoeld in het eerste lid, geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het College van Toezicht kan slechts zijn schriftelijke instemming aan een besluit onthouden indien de collectieve
      beheersorganisatie binnen een door het college te bepalen periode na ontvangst van een voorafgaand advies van het
      college het advies niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het College van Toezicht onthoudt zijn goedkeuring aan een besluit tot verhoging van de tarieven, bedoeld in
      het eerste lid, onderdeel c, indien de verhoging, gelet op de in [artikel 2, tweede lid][ref1], vermelde eisen,
      buitensporig is.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '2'
  - number: '4'
    text: |-
      Het College van Toezicht houdt geen toezicht op collectieve beheersorganisaties voor zover toezicht op grond van de
      [Mededingingswet][ref1] wordt uitgeoefend door de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '5.1'
    text: |-
      Een collectieve beheersorganisatie is gehouden het College van Toezicht vooraf schriftelijk te informeren over te
      nemen besluiten die van wezenlijke invloed zijn op de uitoefening door de collectieve beheersorganisatie van haar
      taken of het verlenen van bemiddeling als bedoeld in [artikel 30a van de Auteurswet][ref1], waaronder:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 30a
  - number: 5.1.a
    text: investeringen die een door het College van Toezicht bij reglement vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
  - number: 5.1.b
    text: het oprichten of mede-oprichten van een privaatrechtelijke rechtspersoon of het deelnemen in een vennootschap.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      De leden van het College van Toezicht hebben toegang tot de kantoren van een collectieve beheersorganisatie en
      kunnen de algemene ledenvergadering, de vergadering van aangeslotenen en de vergaderingen van het bestuur van de
      collectieve beheersorganisatie bijwonen. De leden van het College hebben inzage in boeken en bescheiden en andere
      informatiedragers van een collectieve beheersorganisatie een en ander voor zover kennisneming daarvan noodzakelijk
      is voor de uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien een collectieve beheersorganisatie samenwerkt met of werkzaamheden laat verrichten door een derde,
      verband houdende met de inning en de verdeling van vergoedingen op grond van de [Auteurswet][ref1] en de
      [Wet op de naburige rechten][ref2], blijft zij verantwoordelijk voor de uitoefening van deze taken. Zij draagt in
      dat geval zorg voor de beschikbaarheid voor het College van Toezicht van de financiële gegevens die relevant kunnen
      zijn voor de taakuitoefening van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
  - number: '5.4'
    text: |-
      Het College van Toezicht kan, indien het daartoe gronden aanwezig acht, de boekhouding van
      een collectieve beheersorganisatie laten onderzoeken door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De kosten van dit onderzoek komen voor
      rekening van de collectieve beheersorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '5.5'
    text: |-
      Gegevens of inlichtingen omtrent een collectieve beheersorganisatie of een derde als bedoeld in [artikel 16][ref1],
      die in verband met enige werkzaamheid ten behoeve van de uitvoering van deze wet zijn verkregen, mogen uitsluitend
      voor de toepassing van deze wet, de [Auteurswet][ref2] en de [Wet op de naburige rechten][ref3] worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001886
      [ref3]: https://wetten.overheid.nl/BWBR0005921
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0001886
      - id: ref3
        bwb_id: BWBR0005921
  - number: '6.1'
    text: Het College van Toezicht kan een collectieve beheersorganisatie van advies dienen.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het College van Toezicht kan een collectieve beheersorganisatie aanwijzingen geven met betrekking tot de
      uitoefening van haar taken of het verlenen van bemiddeling als bedoeld in [artikel 30a van de Auteurswet][ref1]. De
      collectieve beheersorganisatie is gehouden overeenkomstig de aanwijzingen te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 30a
  - number: '6.3'
    text: |-
      Het College van Toezicht kan slechts een aanwijzing geven indien de collectieve beheersorganisatie binnen een door
      het college te bepalen periode na ontvangst van een voorafgaand advies van het college het advies niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het College van Toezicht bestaat uit drie of meer personen. Het aantal leden van het College, de voorzitter
      daaronder begrepen, is steeds oneven.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
  - number: '7.2'
    text: |-
      De leden van het College van Toezicht kunnen de taken onderling verdelen. Het College blijft verantwoordelijk voor
      de uitoefening van deze taken.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
  - number: '7.3'
    text: Onze Minister wijst de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
  - number: '7.4'
    text: |-
      De leden van het College van Toezicht worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen na
      afloop van deze periode aansluitend eenmaal opnieuw worden benoemd voor een termijn van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
  - number: '7.5'
    text: Het College van Toezicht blijft ook in geval van een of meer vacatures bevoegd tot hetgeen hem is opgedragen.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
  - number: '7.6'
    text: |-
      Een lid dat een vacature vervult, wordt benoemd voor de resterende duur van de periode waarvoor het door hem
      vervangen afgetreden lid was benoemd.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
  - number: '7.7'
    text: |-
      Het College van Toezicht kent zoveel plaatsvervangende leden als Onze Minister nodig acht. Het vierde en zesde lid
      en [artikel 9][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel9
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '9'
  - number: '8.1'
    text: |-
      Nevenfuncties van een lid van het College van Toezicht worden openbaar gemaakt door vermelding op de website van
      het College van Toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een lid van het College van Toezicht heeft geen financiële of andere belangen bij ondernemingen, instellingen of
      andere organisaties waardoor zijn onpartijdigheid in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel8
  - number: '9.1'
    text: 'Het lidmaatschap van het College van Toezicht eindigt:'
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
  - number: 9.1.a
    text: door het verstrijken van de periode waarvoor het lid is benoemd;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
  - number: 9.1.b
    text: |-
      door ontslag, bedoeld in [artikel 12, tweede lid, van de Kaderwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: 9.1.c
    text: door ondercuratelestelling of overlijden van het lid;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
  - number: 9.1.d
    text: |-
      indien het faillissement of de toepassing van de schuldsaneringsregeling natuurlijke personen ten aanzien van het
      lid wordt uitgesproken;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
  - number: 9.1.e
    text: door een veroordeling wegens een misdrijf.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
  - number: '9.2'
    text: Een besluit tot schorsing van de leden van het College van Toezicht regelt de gevolgen van de schorsing.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel9
  - number: '11.1'
    text: Het College van Toezicht heeft een secretaris. De secretaris is geen lid van het College van Toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de secretaris, na overleg met de voorzitter van het College van
      Toezicht.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel11
  - number: '12'
    text: De kosten van het College van Toezicht worden door Onze Minister vergoed.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het College van Toezicht vergadert ten minste vier maal per jaar en voorts zo vaak als door de voorzitter of ten
      minste twee andere leden van het College wenselijk wordt geoordeeld.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het College van Toezicht besluit met volstrekte meerderheid van uitgebrachte stemmen. Elk lid heeft één stem.
      Indien de stemmen staken beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel13
  - number: '13.3'
    text: |-
      Het College van Toezicht kan bij bestuursreglement nadere regels vaststellen omtrent zijn vergadering en
      besluitvorming.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel13
  - number: '14'
    text: |-
      Het College van Toezicht kan vertegenwoordigers van betalingsplichtigen of andere belanghebbenden in de gelegenheid
      stellen te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel14
  - number: '15'
    text: |-
      In afwijking van [artikel 18, eerste lid, eerste volzin, van de Kaderwet][ref1] stelt het College van Toezicht voor
      1 juli een jaarverslag op.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '16.1'
    text: |-
      Indien een collectieve beheersorganisatie samenwerkt met of werkzaamheden laat verrichten door een in
      Nederland gevestigde derde, verband houdende met de inning of de verdeling van vergoedingen op grond van
      de [Auteurswet][ref1] of de [Wet op de naburige rechten][ref2], is deze derde, onverminderd het bepaalde in
      [artikel 5, derde lid][ref3], gehouden het College van Toezicht op zijn verzoek onverwijld alle inlichtingen te
      verschaffen die het college nodig acht voor zijn taakuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0001886
      [ref2]: https://wetten.overheid.nl/BWBR0005921
      [ref3]: https://wetten.overheid.nl/BWBR0014779#Artikel5
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001886
      - id: ref2
        bwb_id: BWBR0005921
      - id: ref3
        bwb_id: BWBR0014779
        artikel: '5'
  - number: '16.2'
    text: |-
      [Artikel 5:20 van de Algemene wet bestuursrecht][ref1] alsmede de [artikelen 6][ref2], [18][ref3] en [19][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014779#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0014779#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0014779#Artikel19
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0014779
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0014779
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0014779
        artikel: '19'
  - number: '17.1'
    text: |-
      Het bij en krachtens deze wet bepaalde geldt ook voor de collectieve beheersorganisaties die zijn vermeld in de
      bijlage. De bijlage kan door Onze Minister op voordracht van het College van Toezicht worden gewijzigd bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel17
  - number: '17.2'
    text: |-
      Voor plaatsing op de bijlage komen collectieve beheersorganisaties in aanmerking waarvan de totale incasso of het
      totaal aan voor verdeling beschikbare vergoedingen, over ten hoogste twee opeenvolgende kalenderjaren, een nader
      bij algemene maatregel van bestuur te bepalen drempel overschrijdt.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het College van Toezicht kan een collectieve beheersorganisatie aan wie de overtreding kan worden toegerekend een
      bestuurlijke boete opleggen:
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel18
  - number: 18.1.a
    text: |-
      bij niet-naleving van een aanwijzing als bedoeld in [artikel 6, tweede lid][ref1], van ten hoogste € 225.000 per
      overtreding, of, indien dat meer is, 5% van het totaal van de door een collectieve beheersorganisatie in het aan de
      beschikking voorafgaande boekjaar geïnde of voor verdeling beschikbare vergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel6
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '6'
  - number: 18.1.b
    text: |-
      bij overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], van ten hoogste € 35.000
      per overtreding, of, indien dat meer is, 1% van het totaal van de door een collectieve beheersorganisatie in het
      aan de beschikking voorafgaande boekjaar geïnde of voor verdeling beschikbare vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '18.2'
    text: |-
      Het College van Toezicht legt geen boete op indien de collectieve beheersorganisatie aan wie de overtreding kan
      worden toegerekend aannemelijk maakt dat haar van de overtreding geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij de vaststelling van de hoogte van de boete houdt het College van Toezicht rekening met de ernst en de duur
      van de overtreding. Bij een overtreding als bedoeld in het eerste lid, onderdeel a, vervalt de bevoegdheid tot het
      opleggen van een boete drie jaren na de dag waarop de overtreding is begaan. Bij een overtreding als bedoeld in
      het eerste lid, onderdeel b, vervalt de bevoegdheid tot het opleggen van een boete een jaar na de dag waarop de
      overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel18
  - number: '18.4'
    text: |-
      Het College van Toezicht draagt de opbrengst van de bestuurlijke boeten af aan Onze Minister. De afgedragen
      opbrengst dient ter aanwending voor door Onze Minister te bepalen doeleinden van auteursrechtbeleid in brede zin.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het College van Toezicht kan een last onder dwangsom opleggen wegens niet-naleving
      van een aanwijzing als bedoeld in [artikel 6, tweede lid][ref1], of overtreding van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '19.2'
    text: |-
      Aan een last kunnen voorschriften worden verbonden betreffende de in [artikel 2, tweede lid][ref1], aan een
      collectieve beheersorganisatie gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel2
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '2'
  - number: '19.3'
    text: Een last geldt voor een door het College van Toezicht te bepalen termijn van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel19
  - number: '19.4'
    text: |-
      Een boete, als bedoeld in [artikel 18][ref1], en een last onder dwangsom kunnen samen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel18
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '18'
  - number: '20'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit op grond van deze wet is, in afwijking van
      [artikel 8:7 van de Algemene wet bestuursrecht][ref1], in eerste aanleg uitsluitend de rechtbank te ’s-Gravenhage
      bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '22.1'
    text: |-
      Onze Minister kan een geschillencommissie aanwijzen voor de beslechting van geschillen tussen collectieve
      beheersorganisaties en betalingsplichtigen over de billijkheid van de hoogte en de toepassing van door collectieve
      beheersorganisaties in rekening gebrachte vergoedingen, met uitzondering van geschillen over de hoogte van de in de
      [artikelen 15c][ref1], [16c][ref2] en [16h van de Auteurswet][ref3] bedoelde vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15c
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16c
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16h
  - number: '22.2'
    text: |-
      Bij de aanwijzing kunnen nadere regels worden gesteld omtrent de samenstelling, inrichting, procedures,
      bekostiging, werkwijze van en toezicht op de geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel22
  - number: '23.1'
    text: |-
      De betalingsplichtige of de collectieve beheersorganisatie kan de geschillencommissie binnen een bij de in
      [artikel 22][ref1] bedoelde aanwijzing van de geschillencommissie te bepalen termijn verzoeken uitspraak te doen
      over een geschil als bedoeld in artikel 22.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel22
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '22'
  - number: '23.2'
    text: |-
      Wordt het geschil niet binnen drie maanden nadat afschrift van de uitspraak van de geschillencommissie aan
      partijen werd verzonden bij de rechter aanhangig gemaakt, dan wordt hetgeen in de uitspraak is vastgesteld na het
      verstrijken van deze termijn geacht te zijn overeengekomen tussen partijen.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel23
  - number: '24'
    text: |-
      De rechter beslist omtrent een geschil als bedoeld in [artikel 22][ref1] niet dan nadat de geschillencommissie
      in de gelegenheid is gesteld om hieromtrent advies uit te brengen, tenzij de geschillencommissie hierover reeds
      uitspraak heeft gedaan of de rechter ook zonder advies aanstonds kan beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0014779#Artikel22
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0014779
        artikel: '22'
  - number: '25'
    text: |-
      De geschillencommissie betrekt bij haar beoordeling of de hoogte en de toepassing van een in rekening gebrachte
      vergoeding billijk zijn in ieder geval:
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25
  - number: 25.a
    text: het beginsel dat gelijke gevallen gelijk worden behandeld;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25
  - number: 25.b
    text: de waarde van het gebruik van het werk in het economisch verkeer;
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25
  - number: 25.c
    text: de aard en de omvang van het gebruik.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25
  - number: 25a.1
    text: |-
      De [paragrafen 1][ref1], [2][ref2], [4][ref3] en [5][ref4]
      alsmede de [artikelen 7.3, leden 1, 3, 6, 7, 8 en 9][ref5], en
      [7.5 van de Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref6] en
      de daarop berustende algemene maatregelen van bestuur alsmede de ministeriële regeling, bedoeld in
      [artikel 1.9 van die wet][ref7], zijn van overeenkomstige toepassing op collectieve beheersorganisaties, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Paragraaf4
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Paragraaf5
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0032249#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0032249
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0032249
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0032249
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0032249
        artikel: '1'
  - number: 25a.1.a
    text: |-
      wordt verstaan onder topfunctionaris: de leden van de uitvoerende, adviserende en toezichthoudende organen van een
      collectieve beheersorganisatie alsmede de hoogste ondergeschikte of de leden van de groep hoogste ondergeschikten
      aan dat orgaan en degene of degenen die is of zijn belast met de dagelijkse leiding van een collectieve
      beheersorganisatie.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25a
  - number: 25a.1.b
    text: |-
      de op grond van [artikel 5.5, eerste lid, van die wet][ref1] opgeëiste bedragen beschikbaar komen voor verdeling
      aan rechthebbenden, en


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '5'
  - number: 25a.1.c
    text: |-
      voor [artikel 7.3, elfde lid van die wet][ref1] wordt gelezen: Voor de toepassing van dit artikel blijft buiten
      beschouwing iedere wijziging in de bezoldiging of de duur van het dienstverband die is of wordt overeengekomen
      tussen 18 januari 2012 en het tijdstip waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel7
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '7'
  - number: 25a.2
    text: |-
      De op grond van [paragraaf 5 van de Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref1]
      aan de Minister wie het aangaat toekomende bevoegdheden worden, in afwijking van [artikel 5.1 van die wet][ref2],
      voor de overeenkomstige toepassing van die wet op collectieve beheersorganisaties uitgeoefend door het College van
      Toezicht. De in de [artikelen 4.1][ref3], [4.2][ref4], [5.2, tweede lid][ref5], en [5.3 van genoemde wet][ref6]
      bedoelde informatie wordt, in afwijking van die artikelen, verstrekt aan het College van Toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0032249
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0032249
        artikel: '5'
  - number: '28'
    text: |-
      Deze wet wordt aangehaald als: Wet toezicht en geschillenbeslechting collectieve beheersorganisaties auteurs- en
      naburige rechten.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel28
  - number: '29'
    text: Deze wet treedt in werking op een bij koninklijk besluit vast te stellen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014779/2015-01-01#Artikel29
