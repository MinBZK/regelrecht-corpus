  - number: '7'
    text: |-
      1 De periode dat de militair, met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere
      rang dan wel zonder rang,:

      a. consignatie als bedoeld in [artikel 58a AMAR][ref1] wordt opgelegd op de plaats waar de militair gewoonlijk de
      nacht geacht wordt door te brengen;

      b. gedurende een pauze consignatie wordt opgelegd als bedoeld in [artikel 56q AMAR][ref2], op een schip, in een
      kazerne, in het gebouw waar de militair is tewerkgesteld of een andere in dit verband door de commandant aan te
      wijzen plaats, niet zijnde de woning van de militair of de plaats waar de militair gewoonlijk de nacht geacht wordt
      door te brengen;

      c. consignatie wordt opgelegd gedurende een aanwezigheidsdienst of piket als bedoeld in de [artikelen 58b][ref3],
      [58c][ref4] en [58d AMAR][ref5], op een schip, in een kazerne, in het gebouw waar de militair is tewerkgesteld
      of een andere in dit verband door de commandant aan te wijzen plaats, niet zijnde de woning van de militair of
      de plaats waar de militair gewoonlijk de nacht geacht wordt door te brengen, wordt herleid naar een vergoeding in
      vrije uren.

      2 De herleiding, bedoeld in het eerste lid, vindt plaats door toepassing van een herleiding factor.

      3 De factor, bedoeld in het tweede lid, bedraagt:

      a. 1/10 voor de periode van consignatie bedoeld in het eerste lid, onderdeel a;

      b. 1/2 voor de periode van consignatie bedoeld in het eerste lid, onderdeel b en c, voor zover het de militair niet
      is toegestaan te slapen;

      c. 1/3 voor de periode van consignatie bedoeld in het eerste lid, onderdeel b en c, voor zover het de militair
      gedurende de dienst de mogelijkheid wordt geboden te slapen.

      4 De tijdsduur, dat de militair wordt opgedragen:

      a. bereikbaarheid te zijn, bijvoorbeeld in de vorm van de zogenoemde "pieperdienst" (pieper, GSM of anderszins);

      b. of zich als reserve beschikbaar te houden om in voorkomend geval werkzaamheden of diensten te verrichten ter
      vervanging van een collega,

      zonder dat hij wordt beperkt in zijn bewegingsvrijheid naar plaats en tijd of wordt geconsigneerd als bedoeld in
      [artikel 58a AMAR][ref6], komt niet voor herleiding in aanmerking.

      5 Voor de toepassing van het derde lid wordt na herleiding naar boven afgerond op gehele uren.

      6 De in het eerste lid genoemde vergoeding in vrije uren dient voor de militair binnen de meetperiode te worden
      verroosterd. Het door de militair meenemen van de niet verroosterde uren naar een volgende meetperiode is niet
      toegestaan. Vooruitlopend op het daadwerkelijk ontstaan van een aanspraak op de vergoeding in vrije uren kan de
      commandant toestaan dat deze uren voor afloop van de meetperiode worden verroosterd. Verroostering vindt niet
      plaats indien het dienstbelang dat niet toestaat.

      7 Indien na afloop van de meetperiode blijkt dat de in het eerste lid verleende vergoeding in vrije uren niet is
      verroosterd, dan wordt deze vervangen door een vergoeding in geld overeenkomstig [artikel 8, zevende lid][ref7],
      van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel58a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel56q
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel58b
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel58c
