  - number: 8a
    text: |-
      1 De commandant kent aan de militair met de rang van kapitein-luitenant ter zee dan wel luitenant-kolonel een
      compensatie voor overwerk toe, indien de militair in opdracht van de commandant een of meerdere uren overwerk
      verricht.

      2 De compensatie voor overwerk bestaat uit roostervrije uren, gelijk aan het aantal uren overschrijding
      van het per dag vastgestelde aantal arbeidsuren. Voor het bepalen van de omvang van het overwerk worden
      [artikel 8, tweede en achtste lid][ref1], overeenkomstig toegepast.

      3 De commandant stelt de militair in de gelegenheid de compensatie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel8
    url: https://wetten.overheid.nl/BWBR0039900/2025-02-07#Artikel8a
