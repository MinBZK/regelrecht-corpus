  - number: '5'
    text: |-
      1 Aan de militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel
      zonder rang wordt, voor het verrichten van werkzaamheden, ingeval hij dit regelmatig of vrij regelmatig volgens een
      rooster op ongebruikelijke uren doet, en anders dan bij wijze van overschrijding van het vastgestelde rooster en
      anders dan meerdaagse activiteiten, een vaste maandelijkse toelage toegekend.

      2 Onverlet het eerste lid kan de Minister van Defensie functies aanwijzen waarvoor geldt dat de aanspraak op
      de toelage aan het eind van elke kalendermaand wordt vastgesteld, op basis van de in die maand door de militair
      daadwerkelijk verrichte werkzaamheden op ongebruikelijke uren.

      3 De aanvang, een wijziging of het einde van de aanspraak op de toelage, bedoeld in het eerste lid, gaat, behoudens
      het vierde en vijfde lid, in op de dag waarop de werkzaamheden bedoeld in het eerste lid, een aanvang nemen,
      zich wijzigen of eindigen. De hoogte van de toelage, bedoeld in het eerste lid, wordt alsdan naar evenredigheid
      vastgesteld.

      4 Ingeval de werkzaamheden, bedoeld in het eerste lid, door onvoorziene omstandigheden worden onderbroken,
      eindigt de aanspraak op de toelage aan het einde van de roosterperiode, doch niet later dan met ingang van de
      eenenzestigste dag na de aanvang van bedoelde onderbreking.

      5 Wijziging of beëindiging van de aanspraak op de toelage vindt niet plaats in geval van onderbreking van de
      werkzaamheden, bedoeld in het eerste lid, ten gevolge van vakantieverlof.

      6 Ten behoeve van het vaststellen van de hoogte van de toelage, bedoeld in het eerste en tweede lid, wordt de
      volgende puntenwaardering van ongebruikelijke uren gehanteerd:

      a. In geval de werkzaamheden worden verricht op een plaats als bedoeld in [artikel 7a, tweede lid][ref1]:

        - 20 punten voor ieder uur op maandag tot en met vrijdag tussen 18.00 en 24.00 uur;
        - 35 punten voor ieder uur op maandag tot en met vrijdag tussen 00.00 en 07.00 uur, alsmede voor ieder uur op
      zaterdag;
        - 50 punten voor ieder uur op zondag, alsmede voor ieder uur op een dag als bedoeld in
      [artikel 57a, tweede lid, van het AMAR][ref2].

      b. In geval de werkzaamheden worden verricht op een plaats als bedoeld in [artikel 7a, derde lid][ref3]: 10 punten
      voor ieder ongebruikelijk uur.

      7 De toelage, bedoeld in het eerste en tweede lid, bedraagt bij een aantal punten per maand van:

      a. 600 – 1.199 punten:








