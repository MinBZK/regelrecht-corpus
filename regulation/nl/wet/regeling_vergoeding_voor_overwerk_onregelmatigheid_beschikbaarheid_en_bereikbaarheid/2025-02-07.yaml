      1 Deze regeling is van toepassing op de militair die aanspraak heeft op salaris als bedoeld in
      [artikel 5 van het Inkomstenbesluit militairen][ref1]

      2 Deze regeling is van toepassing op de militair die is tewerkgesteld bij een bondgenootschappelijk orgaan of
      bij bondgenootschappelijke strijdkrachten, met dien verstande dat [artikel 8][ref2] uitsluitend van toepassing is
      voorzover krachtens de voor hem geldende regeling met betrekking tot werk- en rusttijden de maximale arbeidsduur
      als bedoeld in [artikel 54b, vierde lid, van het AMAR][ref3] in de meetperiode wordt overschreden.


