    text: Deze regeling treedt in werking met ingang van 1 maart 1987.
    url: https://wetten.overheid.nl/BWBR0039900/2025-02-07#Artikel12
  - number: '13'
    text: |-
      Deze regeling kan worden aangehaald als ‘Regeling vergoeding voor overwerk, onregelmatigheid, beschikbaarheid en
      bereikbaarheid’, afgekort VROB.
