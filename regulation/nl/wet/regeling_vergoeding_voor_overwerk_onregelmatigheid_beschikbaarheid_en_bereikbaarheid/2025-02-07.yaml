  - number: 5a
    text: |-
      1 Aan de militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel
      zonder rang wordt met toepassing van het achtste lid een maandelijkse afbouwtoelage toegekend, indien de aanspraak
      op de toelage onregelmatige dienst, bedoeld in [artikel 5, eerste lid][ref1], een verlaging ondergaat als gevolg
      van een in het achtste lid bedoelde beëindiging of vermindering en hij voor een duur van ten minste zesendertig
      maanden voorafgaande aan die beëindiging of vermindering onafgebroken een toelage onregelmatige dienst heeft
      genoten.

      2 Onderbreking van de aanspraak op toelage onregelmatige dienst tijdens de in het eerste lid genoemde duur van
      zesendertig maanden, wordt buiten beschouwing gelaten voor zover de onderbreking verband houdt met:

      a. inzet in het kader van een operatie als bedoeld in de
      [Regeling voorzieningen bij vredes- en humanitaire operaties][ref2], alsmede de aan die inzet voorafgaande
      opleiding;

      b. andere redenen van dienst of ziekte, zulks voor een periode of perioden van in totaal ten hoogste vier maanden.

      3 De afbouwtoelage wordt toegekend voor een periode van ten hoogste 12 maanden, welke periode wordt opgeschort voor
      zover op de militair de [Regeling voorzieningen bij vredes- en humanitaire operaties][ref3] van toepassing is.

      4 De aanvang van de aanspraak op de afbouwtoelage gaat in op de dag waarop de aanspraak op de toelage onregelmatige
      dienst eindigt of wijzigt.

      5 Indien tijdens de in het derde lid genoemde periode aanspraak ontstaat op een nieuwe dan wel hogere toelage
      onregelmatige dienst, dan wordt het bedrag van de afbouwtoelage daarmee verlaagd, zolang het bedrag van de
      nieuwe dan wel hogere aanspraak lager is dan de afbouwtoelage. Bestaat tijdens die periode aanspraak op meerdere
      afbouwtoelagen tegelijk, dan wordt in voornoemd geval de som van de afbouwtoelagen verlaagd.

      6 De aanspraak op de afbouwtoelage(n) vervalt op de dag dat de militair een toelage onregelmatige dienst heeft of
      wordt toegekend, die gelijk is aan of hoger is dan de (som van de) afbouwtoelage(n).

      7 Bij toepassing van het vierde tot en met het zesde lid wordt de hoogte van de afbouwtoelage naar evenredigheid
      vastgesteld, afhankelijk van de dag in de kalendermaand waarop de aanspraak op de afbouwtoelage ingaat dan wel
      vervalt.

      8 De afbouwtoelage wordt gevonden met toepassing van onderstaande tabel.









                    A.


                    Bij beëindiging:





                    van een toelage onregelmatige dienst overeenkomstig


                    bedraagt de afbouwtoelage het bedrag van de toelage onregelmatige dienst overeenkomstig




                    1.


                    [Art. 5.7 onderdeel b][ref4]


                    [art. 5.7 onderdeel a][ref5], gedurende twaalf maanden




                    2.


                    [Art. 5.7 onderdeel c][ref6]


                    [art. 5.7 onderdeel b][ref7], gedurende zes maanden en vervolgens, art. 5.7 onderdeel a, gedurende
      zes maanden




                    3.


                    [Art. 5.7 onderdeel d][ref8]


                    [art. 5.7 onderdeel c][ref9], gedurende vijf maanden, vervolgens art. 5.7 onderdeel b, gedurende vier
      maanden, vervolgens art. 5.7 onderdeel a, gedurende drie maanden.




                    B.


                    Bij vermindering:





                    van een toelage onregelmatige dienst overeenkomstig


                    bedraagt de afbouwtoelage naar een toelage onregelmatige dienst overeenkomstig




                    1.


                    [Art. 5.7 onderdeel c][ref10]/Art. 5.7 onderdeel a


                    het verschil van de toelagen onregelmatige dienst overeenkomstig [art. 5.7 onderdeel b][ref11] en 5.7
      onderdeel a, gedurende twaalf maanden.




                    2.


                    [Art. 5.7 onderdeel d][ref12]/ Art. 5.7 onderdeel b


                    het verschil van de toelagen onregelmatige dienst overeenkomstig [art. 5.7 onderdeel c][ref13] en 5.7
      onderdeel b, gedurende twaalf maanden.




                    3.


                    [Art. 5.7 onderdeel d][ref14]/ Art. 5.7 onderdeel a


                    het verschil van de toelagen onregelmatige dienst overeenkomstig [art. 5.7 onderdeel c][ref15] en
      5.7 onderdeel a, gedurende zes maanden, vervolgens het verschil van de toelagen onregelmatige dienst overeenkomstig
      art. 5.7 onderdeel b en 5.7 onderdeel a, gedurende zes maanden.


