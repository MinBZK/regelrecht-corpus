      8 Voor de toepassing van dit artikel wordt onder uur/uren verstaan; klokuur/klokuren.

      9 De militair die aanspraak heeft op een toelage onregelmatige dienst heeft geen aanspraak op een ZZF-vergoeding in
      geld als bedoeld in [artikel 9, vierde lid][ref4], tenzij hij buiten het voor hem geldende rooster in opdracht van
      de commandant op een ZZF-dag een activiteit, genoemd in [artikel 9, vierde lid][ref5], verricht.


