    text: |-
      1 Tenzij anders bepaald zijn de begripsomschrijvingen zoals opgenomen in [artikel 54a van het AMAR][ref1] op deze
      regeling van toepassing.

      2 Voor de toepassing van deze regeling wordt, voor zover in deze regeling niet anders is bepaald, verstaan onder:

        - *militair:* de militair als bedoeld in [artikel 1, eerste lid, onder c, van het AMAR][ref2], waaronder mede
      begrepen hij die is aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als geestelijke verzorger
      werkzaam te zijn;
        - *meetperiode:* bij gebruik van continu- of ploegendienstroosters de periode waarvoor het rooster geldt en bij
      gebruik van andere roosters niet korter dan de periode waarvoor het rooster geldt, doch tenminste één maand;
        - *etmaal:* een tijdsbestek van 24 uur;
        - *dagdeel:* een tijdsbestek van 4 uur;
        - *maximale arbeidsduur:* de arbeidsduur als bedoeld in [artikel 54b, vierde lid, van het AMAR][ref3];
        - *ongebruikelijke uren:* de uren gelegen tussen 00.00 en 07.00 uur en tussen 18.00 en 24.00 uur op
      maandag tot en met vrijdag, alsmede de uren gelegen tussen 00.00 en 24.00 uur op de dagen genoemd in
      [artikel 57a, eerste en tweede lid, van het AMAR][ref4];
        - *meerdaagse activiteiten:* varen, oefenen en bijzondere inzet die een aaneengesloten periode van langer dan een
      etmaal beslaan;
        - *oefenen:* elk door defensiepersoneel in de praktijk brengen van onderwezen bekwaamheden teneinde aldus de
      bedrevenheid in het uitvoeren van aan de krijgsmacht opgedragen operationele taken te verwerven, te vergroten of
      te onderhouden;
        - *varen:* het buiten de thuishaven verrichten van werkzaamheden en diensten aan boord van een Nederlands
      oorlogsschip alsmede van een vaartuig dat bestemd is om als Nederlands oorlogsschip in dienst te worden gesteld en
      voorts van elk ander vaartuig dat – bij afzonderlijke beschikking – wordt aangewezen als oorlogsschip in de zin van
      deze regeling;
        - *bijzondere inzet:* inzet in het kader van militaire steunverlening in het openbaar belang als bedoeld in het
      Voorschrift Militaire Steunverlening in het openbaar belang en Maatschappelijke dienstverlening door Defensie aan
      derden, alsmede andere door de Minister van Defensie te bepalen vormen van bijzondere inzet;
        - *ZZF-dag:* een dag als bedoeld in [artikel 57a, eerste en tweede lid, van het AMAR][ref5];
        - *commandant:* de commandant als bedoeld in de Regeling aanwijzing commandanten defensie;
        - *groep 1:* (a) voor de militair van de Koninklijke marine: de schepeling met de stand van matroos; (b) voor de
      overige militairen: de militair met de stand van soldaat der derde klasse, soldaat der tweede klasse en soldaat der
      eerste klasse en de militair met de rang van korporaal.
        - *groep 2:* (a) voor de militair van de Koninklijke marine: de militair met de rang van korporaal; (b) voor
      de overige militairen: de militair met de rang van korporaal der eerste klasse, sergeant en sergeant der eerste
      klasse.
        - *groep 3:* (a) voor de militair van de Koninklijke marine: de militair met de rang van sergeant of een hogere
      rang. (b) voor de overige militairen: de militair met de rang van sergeant-majoor of een hogere rang.


