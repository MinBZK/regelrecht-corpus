  - number: 5c
    text: |-
      Aan de militair die aanspraak heeft op een toelage onregelmatige dienst als bedoeld in
      [artikel 5, tweede lid][ref1], wordt een vergoeding toegekend van 25% van de vastgestelde toelage onregelmatige
      dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel5
