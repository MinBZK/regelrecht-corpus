        artikel: '8'
        paragraaf: V
  - number: '9'
    text: |-
      1 De militair die op een ZZF-dag meerdaagse activiteiten verricht, wordt, naast een vergoeding op grond van
      [artikel 6][ref1] van deze regeling, tevens een ZZF-vergoeding toegekend, bestaande uit per etmaal 8 uur vrije
      tijd.

      2 De militair heeft de keuze om binnen de meetperiode de in het eerste lid bedoelde ZZF-vergoeding
      op te nemen in uren als bedoeld in het derde lid, dan wel in geld vergoed te krijgen. De vergoeding
      in geld per uur bedraagt 1/165 deel van het voor de militair geldende maandsalaris, bedoeld in de
      [bijlage A van het inkomstenbesluit militairen][ref2].

      3 De in het eerste lid bedoelde ZZF-vergoeding in vrije tijd wordt binnen de meetperiode verroosterd. Uitsluitend
      indien verroostering om reden van dienstbelang niet mogelijk was, mogen de uren worden overgeheveld naar de
      volgende meetperiode. De commandant kan tevens inroostering van een te verwachten aanspraak op ZZF-uren toestaan.
      Indien de meetperiode eindigt als gevolg van een overplaatsing worden de uren, indien betrokkene dat wenst,
      verroosterd voordat de aansluitende plaatsing ingaat.

      4 De militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel
      zonder, die op een ZZF-dag:

      a. diensten verricht als bedoeld in [artikel 7, eerste lid, onderdelen b en c][ref3];

      b. het verrichten van functionele werkzaamheden: 1° die worden verricht op een plaats als bedoeld in
      [artikel 7a, tweede lid; 2°][ref4] die worden verricht op een plaats als bedoeld in artikel 7a, derde lid, doch
      uitsluitend voor zover het betreft werkzaamheden die naar het oordeel van de commandant geen uitstel gedogen en
      niet op een plaats als bedoeld in artikel 7a, tweede lid, kunnen worden verricht;

      c. beschikbaarheid en bereikbaarheid is opgelegd als bedoeld in [artikel 7a, tweede lid][ref5];

      d. militaire bijstand verleent op grond van de [artikelen 57][ref6] en [58 van de Politiewet 2012][ref7];

      wordt, naast een vergoeding op grond van [artikel 7][ref8], [7a][ref9] en [8][ref10] van deze regeling en
      [artikel 8 van de Inkomstenregeling militairen][ref11], tevens per etmaal een ZZF-vergoeding in tijd ter hoogte van
      8 uren toegekend. Indien deze vergoeding in tijd, naar het oordeel van de commandant, vanwege operationele noodzaak
      niet binnen de meetperiode volledig kan worden opgenomen, wordt de vergoeding van de resterende uren omgezet in een
      vergoeding in geld conform het vijfde lid.

      5 De ZZF-vergoeding bedoeld in het vierde lid bedraagt per uur:

      a. voor de militair die behoort tot groep 1 € 6,74;

      b. voor de militair die behoort tot groep 2 € 7,55;

      c. voor de militair die behoort tot groep 3 € 8,33.

      6 Voor de toepassing van het eerste en vierde lid telt een periode van 8 uren of langer voor een etmaal, en geeft
      een periode korter dan 8 uren geen aanspraak op een vergoeding in vrije tijd dan wel op een ZZF-vergoeding.

      7 De in het vierde lid bedoelde ZZF-vergoeding in tijd geldt ook voor militairen in de rang van kapitein-luitenant
      ter zee en luitenant-kolonel, met dien verstande dat er geen aanspraak bestaat op een vergoeding op grond van
      [artikel 7][ref12], [7a][ref13] en [8][ref14] van deze regeling.


