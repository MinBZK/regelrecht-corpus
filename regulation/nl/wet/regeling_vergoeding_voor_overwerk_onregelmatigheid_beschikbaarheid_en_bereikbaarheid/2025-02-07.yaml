  - number: 5b
    text: |-
      De militair die aanspraak heeft op een toelage onregelmatige dienst als bedoeld in [artikel 5, eerste lid][ref1],
      komt in aanmerking voor een verschuivingstoelage van € 54,00 per verschoven dienst als gevolg van een
      roosterwijziging, indien:

      a. de roosterwijziging plaatsvindt in opdracht van de commandant, en

      b. de opdracht tot verschuiving binnen 72 uur voor aanvang van de verschoven dienst is gegeven


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel5
    url: https://wetten.overheid.nl/BWBR0039900/2025-02-07#Artikel5b
