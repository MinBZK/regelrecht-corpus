  - number: '6'
    text: |-
      1 Aan de militair wordt voor het verrichten van meerdaagse activiteiten, die een aaneengesloten periode van een
      etmaal of langer dan een etmaal beslaan, een vergoeding toegekend.

      2 De in het eerste lid bedoelde vergoeding voor meerdaagse activiteiten bestaande uit varen bedraagt per etmaal:








                    voor de militair die behoort tot groep 1


                    € 94,58




                    voor de militair die behoort tot groep 2


                    € 105,95




                    voor de militair die behoort tot groep 3


                    € 116,89






      3 De in het eerste lid bedoelde vergoeding voor meerdaagse activiteiten bestaande uit oefenen en bijzondere inzet
      bedraagt per etmaal:








                    voor de militair die behoort tot groep 1


                    € 94,58




                    voor de militair die behoort tot groep 2


                    € 105,95




                    voor de militair die behoort tot groep 3


                    € 116,89






      4 De militair die aanspraak heeft op een vergoeding ingevolge het tweede lid, heeft geen gelijktijdige aanspraak
      op een vergoeding als bedoeld in het derde lid. Dienovereenkomstig heeft de militair die aanspraak heeft op een
      vergoeding ingevolge het derde lid, geen gelijktijdige aanspraak op een vergoeding als bedoeld in het tweede lid.

      5 De militair die deelneemt aan een oefening, die een aangesloten periode van een etmaal of langer dan een
      etmaal beslaat, en in het kader daarvan per schip wordt verplaatst, heeft uitsluitend aanspraak op een vergoeding
      ingevolge het derde lid.

      6 De militair die verblijft aan boord van een schip, dat voor onderhoudswerkzaamheden van langere duur in een
      Nederlandse haven ligt, heeft geen aanspraak op een vergoeding ingevolge het tweede lid.

      7 De militair die aanspraak heeft op een vergoeding ingevolge dit artikel heeft geen aanspraak op een vergoeding
      als bedoeld in [artikel 7][ref1], [7a][ref2] of [8][ref3] van deze regeling.

      8 Voor de toepassing van het tweede en het derde lid wordt een gedeelte van een etmaal berekend per half etmaal,
      waarbij een tijdvak van minder dan 12 uren telt voor een half etmaal.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039900#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0039900#Artikel8
