  - number: '3'
    text: |-
      De uren waarop de militair:

      a. ziek of arbeidsongeschikt is in de zin van de rechtspositievoorschriften;

      b. verlof geniet in de zin van de rechtspositievoorschriften, dan wel vrije tijd geniet op grond van deze regeling;

      c. aanspraak heeft op de toelage militaire bijstand, bedoeld in artikel 8, eerste lid, van de Inkomstenregeling
      militairen;

      worden, voor zover die samenvallen met het voor hem geldende rooster, op dezelfde wijze tot de arbeidsduur gerekend
      als de in dat rooster vastgelegde werktijd.
    url: https://wetten.overheid.nl/BWBR0039900/2025-02-07#Artikel3
  - number: '4'
    text: |-
      1 De militair komt niet in aanmerking voor een vergoeding op grond van de bepalingen in de [paragrafen II][ref1],
      [III][ref2], [IV][ref3], [V][ref4] en [VI][ref5] van deze regeling gedurende de tijd dat hij:

      a. beperkt wordt in zijn bewegingsvrijheid dan wel werkzaamheden verricht, uitsluitend ten gevolge van het
      ondergaan van een krijgstuchtelijke straf of van arrest;

      b. is aangewezen voor het volgen van een studie buiten de krijgsmacht en aan hem om die reden geen werkzaamheden en
      diensten worden opgedragen;

      c. een initiële opleiding volgt, tenzij: 1° hij is geplaatst of gedetacheerd voor een praktische tewerkstelling
      dan wel een praktische bedrijfsintroductie; 2° hem diensten worden opgedragen die geen deel uitmaken van de
      opleiding(ssyllabus); 3° hem een beperking van de bewegingsvrijheid, bedoeld in [artikel 60b AMAR][ref6], wordt
      opgelegd; 4° hij in het kader van de opleiding(ssyllabus) vaart of deelneemt aan een oefening, voor zover deze
      activiteit een aaneengesloten periode van een etmaal of langer dan een etmaal beslaat; 5° hij wordt aangewezen voor
      een bijzondere inzet;

      d. een niet-initiële opleiding of cursus volgt, tenzij hij in het kader van de opleiding(ssyllabus) bij een
      operationele eenheid is geplaatst of gedetacheerd en in dat kader vaart of oefent voor een aaneengesloten periode
      van een etmaal of langer dan een etmaal;

      e. buiten de normale voor hem geldende werktijd, reizende is, met uitzondering van de militair wiens functie
      is aangewezen als een functie waarbij het reizen een wezenlijk bestanddeel uitmaakt van de functie, bedoeld in
      [artikel 54b, vijfde lid, van het AMAR][ref7];

      f. aanwezig dient te zijn op een plaats als bedoeld in [artikel 7a, tweede lid][ref8], uitsluitend ten gevolge van
      het feit, dat hij van rijkswege wordt gehuisvest en/of gevoed.

      2 Niet in aanmerking voor een vergoeding op grond van de bepalingen in de [paragrafen II][ref9], [III][ref10],
      [IV][ref11], [V][ref12] en [VI][ref13] van deze regeling komt de militair die en gedurende de tijd dat hij
      aanspraak heeft op:

      a. de voorzieningen op grond van [hoofdstuk 3 van het Voorzieningenstelsel buitenland defensiepersoneel][ref14];

      b. de voorzieningen op grond van de [Regeling voorzieningen bij vredes- en humanitaire operaties][ref15].

      3 Niet in aanmerking voor een vergoeding op grond van de bepalingen in de [paragrafen II][ref16], [III][ref17],
      [IV][ref18] en [V][ref19] van deze regeling komt de militair die en gedurende de tijd dat hij aanspraak heeft op de
      toelage militaire bijstand, bedoeld in artikel 8 van de Inkomstenregeling militairen.


