        artikel: 60b
  - number: '8'
    text: |-
      1 Aan de militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel
      zonder rang wordt voor:

      a. varen, oefenen en bijzondere inzet korter durend dan een etmaal:

      b. het verrichten van functionele werkzaamheden,

      een vergoeding voor overwerk in vrije uren toegekend, indien als gevolg daarvan de voor de militair in het rooster
      voor die werkdag vastgestelde arbeidsduur wordt overschreden.

      2 Voor de toepassing van het eerste lid wordt een overschrijding van korter dan een half uur op enige werkdag niet
      meegerekend.

      3 De in het eerste lid genoemde vergoeding in vrije uren dient door de militair binnen de meetperiode te worden
      verroosterd. Het door de militair meenemen van de niet verroosterde uren naar een volgende meetperiode is niet
      toegestaan. Vooruitlopend op het daadwerkelijk ontstaan van een aanspraak op de vergoeding in vrije uren kan de
      commandant toestaan dat deze uren voor afloop van de meetperiode worden verroosterd. Verroostering vindt niet
      plaats indien het dienstbelang dat niet toestaat.

      4 Indien na afloop van de meetperiode blijkt dat de maximale arbeidsduur is overschreden, dan wordt de militair een
      vergoeding voor overwerk in geld toegekend.

      5 De maximale arbeidsduur, bedoeld in het vierde lid, is de gemiddelde arbeidsduur per week waarvoor het rooster
      van de militair over de meetperiode is vastgesteld. In deze gemiddelde arbeidsduur zijn de aan de militair
      toegekende aanspraken, of de met de militair gemaakte afspraken die leiden tot een aanpassing van de arbeidsduur
      van zijn rooster, verwerkt.

      6 Bij de vaststelling van de overschrijding van de maximale arbeidsduur als bedoeld in het eerste en vierde lid
      blijven buiten beschouwing:

      a. meerdaagse activiteiten, bedoeld in [artikel 6][ref1];

      b. functionele werkzaamheden die worden verricht buiten de in het rooster vastgestelde dagelijkse werktijden,
      zonder dat daarvoor door de commandant uitdrukkelijk opdracht is gegeven.

      7 De in het vierde lid bedoelde vergoeding voor overwerk in geld bedraagt per uur 1/165 deel van
      het voor de betrokken militair geldende maandsalaris, als bedoeld in de [bijlagen A][ref2] en
      [B van het Inkomstenbesluit militairen][ref3].

      8 Voor de toepassing van het vierde en zevende lid wordt een periode van een half uur of langer naar boven
      afgerond, een periode korter dan een half uur naar beneden.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007816
      [ref3]: https://wetten.overheid.nl/BWBR0007816
