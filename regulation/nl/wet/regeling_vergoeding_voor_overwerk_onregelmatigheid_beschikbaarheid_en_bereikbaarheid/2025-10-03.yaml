  - number: '9.5'
    text: 'De ZZF-vergoeding bedoeld in het vierde lid bedraagt per uur:'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: 9.5.a
    text: voor de militair die behoort tot groep 1 € 6,74;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: 9.5.b
    text: voor de militair die behoort tot groep 2 € 7,55;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: 9.5.c
    text: voor de militair die behoort tot groep 3 € 8,33.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: '9.6'
    text: |-
      Voor de toepassing van het eerste en vierde lid telt een periode van 8 uren of langer voor een etmaal, en geeft een
      periode korter dan 8 uren geen aanspraak op een vergoeding in vrije tijd dan wel op een ZZF-vergoeding.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: '9.7'
    text: |-
      De in het vierde lid bedoelde ZZF-vergoeding in tijd geldt ook voor militairen in de rang van kapitein-luitenant
      ter zee en luitenant-kolonel, met dien verstande dat er geen aanspraak bestaat op een vergoeding op grond van
      [artikel 7][ref1], [7a][ref2] en [8][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039900#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0039900#Artikel8
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
    references:
      - id: ref1
