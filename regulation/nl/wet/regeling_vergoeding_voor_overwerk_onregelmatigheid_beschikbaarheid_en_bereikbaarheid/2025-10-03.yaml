  - number: 4a
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel4a
  - number: '5.1'
    text: |-
      De commandant kent na afloop van iedere kalendermaand een toelage onregelmatige dienst toe aan de militair met
      de rang van kapitein-luitenant ter zee dan wel luitenant-kolonel of met een lagere rang dan wel zonder rang die,
      uitsluitend in opdracht van de commandant, op ongebruikelijke uren werkzaamheden of diensten heeft verricht, anders
      dan bij wijze van overwerk en anders dan meerdaagse activiteiten.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: '5.2'
    text: |-
      De toelage onregelmatige dienst komt slechts tot uitbetaling als de hoogte van de toelage in een kalendermaand
      ten minste € 50,40 bedraagt conform de in het derde lid vastgestelde berekeningswijze. Dit bedrag wordt naar
      evenredigheid verminderd indien op de militair buitengewoon verlof in verband met deeltijdarbeid van toepassing is,
      bedoeld in [artikel 2 van het Besluit aanpassing arbeidsduur militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011531#Artikel2
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011531
        artikel: '2'
  - number: '5.3'
    text: 'De hoogte van de toelage onregelmatige dienst bedraagt per gewerkt uur een percentage van € 14,– en wel:'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: 5.3.a
    text: 20% voor de uren op maandag tot en met vrijdag tussen 06.00 uur en 07.00 uur en tussen 18.00 uur en 22.00 uur;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: 5.3.b
    text: 40% voor de uren op maandag tot en met vrijdag tussen 00.00 uur en 06.00 uur en tussen 22.00 uur en 24.00 uur;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: 5.3.c
    text: 45% voor alle uren op zaterdag;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: 5.3.d
    text: 70% voor alle uren op zondag;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: 5.3.e
    text: |-
      100% voor alle uren op de feestdagen, genoemd in [artikel 57a, tweede lid, van het AMAR][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel57a
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 57a
  - number: '5.4'
    text: |-
      Voor de in het derde lid, onder a, genoemde avonduren wordt de toelage slechts toegekend, indien de werkzaamheden
      of diensten zijn beëindigd na 19.00 uur.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
  - number: '5.5'
    text: |-
      De militair die aanspraak heeft op een toelage onregelmatige dienst, heeft geen aanspraak op een ZZF-vergoeding als
      bedoeld in [artikel 9, vierde lid][ref1], tenzij de militair bij wijze van overwerk in opdracht van de commandant
      op een ZZF-dag een activiteit verricht, genoemd in artikel 9, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel9
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '9'
        paragraaf: VI
  - number: 5a.1
    text: |-
      De commandant kent een afbouwtoelage onregelmatige dienst toe aan de militair, indien aan de militair in een
      kalendermaand niet langer een toelage onregelmatige dienst wordt toegekend en aan de militair voor de duur van
      ten minste vierentwintig maanden voorafgaande aan die beëindiging onafgebroken een toelage onregelmatige dienst
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.2
    text: |-
      Onderbreking van de toekenning van de toelage onregelmatige dienst tijdens de in het eerste lid genoemde duur van
      vierentwintig maanden, wordt buiten beschouwing gelaten voor zover deze onderbreking verband houdt met:
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.2.a
    text: |-
      inzet in het kader van een operatie als bedoeld in de
      [Regeling voorzieningen bij vredes- en humanitaire operaties][ref1], alsmede de aan die inzet voorafgaande
      opleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0039789
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0039789
  - number: 5a.2.b
    text: een waarneming, in opdracht van de commandant voor een periode van in totaal ten hoogste twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.3
    text: |-
      De afbouwtoelage wordt toegekend voor een periode van twaalf maanden. Deze periode wordt opgeschort voor zover op
      de militair de [Regeling voorzieningen bij vredes- en humanitaire operaties][ref1] van toepassing is, of indien aan
      de militair een vergoeding wordt toegekend voor het verrichten van meerdaagse activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0039789
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0039789
  - number: 5a.4
    text: |-
      De berekeningsbasis voor de afbouwtoelage onregelmatige dienst is de toelage onregelmatige dienst die de militair
      gemiddeld over de twaalf kalendermaanden direct voorafgaand aan de beëindiging van de toekenning van de toelage
      onregelmatige dienst heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.5
    text: 'De hoogte van de afbouwtoelage wordt, conform de in het derde lid genoemde periode van twaalf maanden, vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.5.a
    text: voor de eerste vier maanden op 75% van de berekeningsbasis;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.5.b
    text: voor de tweede vier maanden op 50% van de berekeningsbasis en
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.5.c
    text: voor de derde vier maanden op 25% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5a.6
    text: |-
      Indien tijdens de in het derde lid genoemde periode van twaalf maanden opnieuw een toelage onregelmatige dienst
      wordt toegekend, dan wordt het bedrag van de afbouwtoelage daarmee verlaagd.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5a
  - number: 5b
    text: |-
      De militair die aanspraak heeft op een toelage onregelmatige dienst als bedoeld in [artikel 5, eerste lid][ref1],
      komt in aanmerking voor een verschuivingstoelage van € 55,97 per verschoven dienst als gevolg van een
      roosterwijziging, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel5
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '5'
        paragraaf: II
  - number: 5b.a
    text: de roosterwijziging plaatsvindt in opdracht van de commandant, en
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5b
  - number: 5b.b
    text: de opdracht tot verschuiving binnen 72 uur voor aanvang van de verschoven dienst is gegeven
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5b
  - number: 5c.1
    text: |-
      De militair van wie de werkzaamheden of diensten door ziekte worden onderbroken, behoudt aanspraak op de toelage
      onregelmatige dienst, bedoeld in [artikel 5, eerste lid][ref1], voor de duur van de ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel5
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '5'
        paragraaf: II
  - number: 5c.2
    text: |-
      De hoogte van de toelage, bedoeld in het eerste lid, wordt bepaald op basis van de toelage onregelmatige dienst die
      de militair gemiddeld over de twaalf kalendermaanden direct voorafgaand aan de onderbreking heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5c
  - number: 5c.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing indien de werkzaamheden of diensten door
      vakantieverlof worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel5c
  - number: '6.1'
    text: |-
      Aan de militair wordt voor het verrichten van meerdaagse activiteiten, die een aaneengesloten periode van een
      etmaal of langer dan een etmaal beslaan, een vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde vergoeding voor meerdaagse activiteiten bestaande uit varen bedraagt per etmaal:






                    voor de militair die behoort tot groep 1


                    € 94,58




                    voor de militair die behoort tot groep 2


                    € 105,95




                    voor de militair die behoort tot groep 3


                    € 116,89
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste lid bedoelde vergoeding voor meerdaagse activiteiten bestaande uit oefenen en bijzondere inzet
      bedraagt per etmaal:






                    voor de militair die behoort tot groep 1


                    € 94,58




                    voor de militair die behoort tot groep 2


                    € 105,95




                    voor de militair die behoort tot groep 3


                    € 116,89
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '6.4'
    text: |-
      De militair die aanspraak heeft op een vergoeding ingevolge het tweede lid, heeft geen gelijktijdige aanspraak
      op een vergoeding als bedoeld in het derde lid. Dienovereenkomstig heeft de militair die aanspraak heeft op een
      vergoeding ingevolge het derde lid, geen gelijktijdige aanspraak op een vergoeding als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '6.5'
    text: |-
      De militair die deelneemt aan een oefening, die een aangesloten periode van een etmaal of langer dan een etmaal
      beslaat, en in het kader daarvan per schip wordt verplaatst, heeft uitsluitend aanspraak op een vergoeding
      ingevolge het derde lid.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '6.6'
    text: |-
      De militair die verblijft aan boord van een schip, dat voor onderhoudswerkzaamheden van langere duur in een
      Nederlandse haven ligt, heeft geen aanspraak op een vergoeding ingevolge het tweede lid.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '6.7'
    text: |-
      De militair die aanspraak heeft op een vergoeding ingevolge dit artikel heeft geen aanspraak op een vergoeding als
      bedoeld in [artikel 7][ref1], [7a][ref2] of [8][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039900#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0039900#Artikel8
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '7'
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0039900
        artikel: 7a
        paragraaf: IV
      - id: ref3
        bwb_id: BWBR0039900
        artikel: '8'
        paragraaf: V
  - number: '6.8'
    text: |-
      Voor de toepassing van het tweede en het derde lid wordt een gedeelte van een etmaal berekend per half etmaal,
      waarbij een tijdvak van minder dan 12 uren telt voor een half etmaal.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel6
  - number: '7.1'
    text: |-
      De periode dat de militair, met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang
      dan wel zonder rang,:
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: 7.1.a
    text: |-
      consignatie als bedoeld in [artikel 58a AMAR][ref1] wordt opgelegd op de plaats waar de militair gewoonlijk de
      nacht geacht wordt door te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel58a
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 58a
  - number: 7.1.b
    text: |-
      gedurende een pauze consignatie wordt opgelegd als bedoeld in [artikel 56q AMAR][ref1], op een schip, in een
      kazerne, in het gebouw waar de militair is tewerkgesteld of een andere in dit verband door de commandant aan te
      wijzen plaats, niet zijnde de woning van de militair of de plaats waar de militair gewoonlijk de nacht geacht wordt
      door te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel56q
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 56q
  - number: 7.1.c
    text: |-
      consignatie wordt opgelegd gedurende een aanwezigheidsdienst of piket als bedoeld in de [artikelen 58b][ref1],
      [58c][ref2] en [58d AMAR][ref3], op een schip, in een kazerne, in het gebouw waar de militair is tewerkgesteld
      of een andere in dit verband door de commandant aan te wijzen plaats, niet zijnde de woning van de militair of
      de plaats waar de militair gewoonlijk de nacht geacht wordt door te brengen, wordt herleid naar een vergoeding in
      vrije uren.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel58b
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel58c
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel58d
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 58b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 58c
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 58d
  - number: '7.2'
    text: De herleiding, bedoeld in het eerste lid, vindt plaats door toepassing van een herleiding factor.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: '7.3'
    text: 'De factor, bedoeld in het tweede lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: 7.3.a
    text: 1/10 voor de periode van consignatie bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: 7.3.b
    text: |-
      1/2 voor de periode van consignatie bedoeld in het eerste lid, onderdeel b en c, voor zover het de militair niet is
      toegestaan te slapen;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: 7.3.c
    text: |-
      1/3 voor de periode van consignatie bedoeld in het eerste lid, onderdeel b en c, voor zover het de militair
      gedurende de dienst de mogelijkheid wordt geboden te slapen.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: '7.4'
    text: 'De tijdsduur, dat de militair wordt opgedragen:'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: 7.4.a
    text: bereikbaarheid te zijn, bijvoorbeeld in de vorm van de zogenoemde "pieperdienst" (pieper, GSM of anderszins);
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: 7.4.b
    text: |-
      of zich als reserve beschikbaar te houden om in voorkomend geval werkzaamheden of diensten te verrichten ter
      vervanging van een collega,
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: '7.5'
    text: Voor de toepassing van het derde lid wordt na herleiding naar boven afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: '7.6'
    text: |-
      De in het eerste lid genoemde vergoeding in vrije uren dient voor de militair binnen de meetperiode te worden
      verroosterd. Het door de militair meenemen van de niet verroosterde uren naar een volgende meetperiode is niet
      toegestaan. Vooruitlopend op het daadwerkelijk ontstaan van een aanspraak op de vergoeding in vrije uren kan de
      commandant toestaan dat deze uren voor afloop van de meetperiode worden verroosterd. Verroostering vindt niet
      plaats indien het dienstbelang dat niet toestaat.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
  - number: '7.7'
    text: |-
      Indien na afloop van de meetperiode blijkt dat de in het eerste lid verleende vergoeding in vrije uren niet is
      verroosterd, dan wordt deze vervangen door een vergoeding in geld overeenkomstig [artikel 8, zevende lid][ref1],
      van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel8
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '8'
        paragraaf: V
  - number: 7a.1
    text: |-
      Aan de militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel
      zonder rang op wie de bij of krachtens [artikel 60b van het AMAR][ref1] bedoelde verplichting wordt opgelegd zich
      op een bepaalde plaats beschikbaar of bereikbaar te houden, dan wel binnen een bepaald gebied te verblijven en/of
      zich op bepaalde tijdstippen te melden met het oog op eventuele dienstverrichting, wordt een vergoeding toegekend,
      voor zover deze verplichting wordt opgelegd op buiten de voor hem vastgestelde werktijden.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel60b
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 60b
  - number: 7a.2
    text: |-
      Indien de plaats, bedoeld in het eerste lid, een schip, een kazerne, het gebouw waar de militair tewerkgesteld
      of een andere in dit verband door de commandant aan te wijzen plaats, niet zijnde de woning van de militair of de
      plaats waar de militair gewoonlijk de nacht geacht wordt door te brengen, is, bedraagt de vergoeding per dagdeel
      € 2,32.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7a
  - number: 7a.3
    text: |-
      Indien de plaats, bedoeld in het eerste lid, de woning van de militair of de plaats waar de militair gewoonlijk
      de nacht geacht wordt door te brengen is, dan wel indien aan hem de verplichting wordt opgelegd binnen een bepaald
      gebied te verblijven en/of zich op bepaalde tijdstippen te melden, bedraagt de vergoeding per dagdeel:
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7a
  - number: 7a.3.a
    text: 'op een ZZF-dag: € 3,58;'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7a
  - number: 7a.3.b
    text: 'op overige dagen: € 1,77.'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7a
  - number: 7a.4
    text: |-
      Voor de toepassing van dit artikel telt een periode van 2 uur tot 4 uur voor een dagdeel en geeft een periode
      korter dan 2 uur geen aanspraak op vergoeding.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel7a
  - number: '8.1'
    text: |-
      Aan de militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel
      zonder rang wordt voor:
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: 8.1.a
    text: 'varen, oefenen en bijzondere inzet korter durend dan een etmaal:'
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: 8.1.b
    text: het verrichten van functionele werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: '8.2'
    text: |-
      Voor de toepassing van het eerste lid wordt een overschrijding van korter dan een half uur op enige werkdag niet
      meegerekend.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: '8.3'
    text: |-
      De in het eerste lid genoemde vergoeding in vrije uren dient door de militair binnen de meetperiode te worden
      verroosterd. Het door de militair meenemen van de niet verroosterde uren naar een volgende meetperiode is niet
      toegestaan. Vooruitlopend op het daadwerkelijk ontstaan van een aanspraak op de vergoeding in vrije uren kan de
      commandant toestaan dat deze uren voor afloop van de meetperiode worden verroosterd. Verroostering vindt niet
      plaats indien het dienstbelang dat niet toestaat.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: '8.4'
    text: |-
      Indien na afloop van de meetperiode blijkt dat de maximale arbeidsduur is overschreden, dan wordt de militair een
      vergoeding voor overwerk in geld toegekend.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: '8.5'
    text: |-
      De maximale arbeidsduur, bedoeld in het vierde lid, is de gemiddelde arbeidsduur per week waarvoor het rooster van
      de militair over de meetperiode is vastgesteld. In deze gemiddelde arbeidsduur zijn de aan de militair toegekende
      aanspraken, of de met de militair gemaakte afspraken die leiden tot een aanpassing van de arbeidsduur van zijn
      rooster, verwerkt.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: '8.6'
    text: |-
      Bij de vaststelling van de overschrijding van de maximale arbeidsduur als bedoeld in het eerste en vierde lid
      blijven buiten beschouwing:
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: 8.6.a
    text: |-
      meerdaagse activiteiten, bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel6
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '6'
        paragraaf: III
  - number: 8.6.b
    text: |-
      functionele werkzaamheden die worden verricht buiten de in het rooster vastgestelde dagelijkse werktijden, zonder
      dat daarvoor door de commandant uitdrukkelijk opdracht is gegeven.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: '8.7'
    text: |-
      De in het vierde lid bedoelde vergoeding voor overwerk in geld bedraagt per uur 1/165 deel van
      het voor de betrokken militair geldende maandsalaris, als bedoeld in de [bijlagen A][ref1] en
      [B van het Inkomstenbesluit militairen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007816
      [ref2]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007816
      - id: ref2
        bwb_id: BWBR0007816
  - number: '8.8'
    text: |-
      Voor de toepassing van het vierde en zevende lid wordt een periode van een half uur of langer naar boven afgerond,
      een periode korter dan een half uur naar beneden.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8
  - number: 8a.1
    text: |-
      De commandant kent aan de militair met de rang van kapitein-luitenant ter zee dan wel luitenant-kolonel een
      compensatie voor overwerk toe, indien de militair in opdracht van de commandant een of meerdere uren overwerk
      verricht.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8a
  - number: 8a.2
    text: |-
      De compensatie voor overwerk bestaat uit roostervrije uren, gelijk aan het aantal uren overschrijding
      van het per dag vastgestelde aantal arbeidsuren. Voor het bepalen van de omvang van het overwerk worden
      [artikel 8, tweede en achtste lid][ref1], overeenkomstig toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel8
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '8'
        paragraaf: V
  - number: 8a.3
    text: De commandant stelt de militair in de gelegenheid de compensatie op te nemen.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel8a
  - number: '9.1'
    text: |-
      De militair die op een ZZF-dag meerdaagse activiteiten verricht, wordt, naast een vergoeding op grond van
      [artikel 6][ref1] van deze regeling, tevens een ZZF-vergoeding toegekend, bestaande uit per etmaal 8 uur vrije
      tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel6
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '6'
        paragraaf: III
  - number: '9.2'
    text: |-
      De militair heeft de keuze om binnen de meetperiode de in het eerste lid bedoelde ZZF-vergoeding
      op te nemen in uren als bedoeld in het derde lid, dan wel in geld vergoed te krijgen. De vergoeding
      in geld per uur bedraagt 1/165 deel van het voor de militair geldende maandsalaris, bedoeld in de
      [bijlage A van het inkomstenbesluit militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007816
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde ZZF-vergoeding in vrije tijd wordt binnen de meetperiode verroosterd. Uitsluitend
      indien verroostering om reden van dienstbelang niet mogelijk was, mogen de uren worden overgeheveld naar de
      volgende meetperiode. De commandant kan tevens inroostering van een te verwachten aanspraak op ZZF-uren toestaan.
      Indien de meetperiode eindigt als gevolg van een overplaatsing worden de uren, indien betrokkene dat wenst,
      verroosterd voordat de aansluitende plaatsing ingaat.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: '9.4'
    text: |-
      De militair met de rang van luitenant ter zee der 1e klasse dan wel majoor, of met een lagere rang dan wel zonder,
      die op een ZZF-dag:
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
  - number: 9.4.a
    text: |-
      diensten verricht als bedoeld in [artikel 7, eerste lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel7
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: '7'
        paragraaf: IV
  - number: 9.4.b
    text: |-
      het verrichten van functionele werkzaamheden: 1° die worden verricht op een plaats als bedoeld in
      [artikel 7a, tweede lid; 2°][ref1] die worden verricht op een plaats als bedoeld in artikel 7a, derde lid, doch
      uitsluitend voor zover het betreft werkzaamheden die naar het oordeel van de commandant geen uitstel gedogen en
      niet op een plaats als bedoeld in artikel 7a, tweede lid, kunnen worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel7a
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: 7a
        paragraaf: IV
  - number: 9.4.c
    text: |-
      beschikbaarheid en bereikbaarheid is opgelegd als bedoeld in [artikel 7a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039900#Artikel7a
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039900
        artikel: 7a
        paragraaf: IV
  - number: 9.4.d
    text: |-
      militaire bijstand verleent op grond van de [artikelen 57][ref1] en [58 van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel58
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel9
