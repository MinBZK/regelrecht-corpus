      beperkt wordt in zijn bewegingsvrijheid dan wel werkzaamheden verricht, uitsluitend ten gevolge van het ondergaan
      van een krijgstuchtelijke straf of van arrest;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel4
  - number: 4.1.b
    text: |-
      is aangewezen voor het volgen van een studie buiten de krijgsmacht en aan hem om die reden geen werkzaamheden en
      diensten worden opgedragen;
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel4
  - number: 4.1.c
    text: |-
      een initiële opleiding volgt, tenzij: 1° hij is geplaatst of gedetacheerd voor een praktische tewerkstelling
      dan wel een praktische bedrijfsintroductie; 2° hem diensten worden opgedragen die geen deel uitmaken van de
      opleiding(ssyllabus); 3° hem een beperking van de bewegingsvrijheid, bedoeld in [artikel 60b AMAR][ref1], wordt
      opgelegd; 4° hij in het kader van de opleiding(ssyllabus) vaart of deelneemt aan een oefening, voor zover deze
      activiteit een aaneengesloten periode van een etmaal of langer dan een etmaal beslaat; 5° hij wordt aangewezen voor
      een bijzondere inzet;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel60b
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel4
