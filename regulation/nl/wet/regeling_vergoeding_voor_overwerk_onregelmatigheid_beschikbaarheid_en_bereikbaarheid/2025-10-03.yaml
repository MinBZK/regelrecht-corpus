        artikel: 7a
        paragraaf: IV
      - id: ref3
        bwb_id: BWBR0039900
        artikel: '8'
        paragraaf: V
  - number: '10'
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0039900/2025-10-03#Artikel10
  - number: '11'
    text: |-
