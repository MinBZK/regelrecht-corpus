preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van artikel 3.1.2.1, tweede
    lid, van het Burgerlijk Wetboek, nieuwe regelen vast te stellen met betrekking tot de openbare registers voor
    registergoederen, alsmede met betrekking tot het kadaster (Kadasterwet);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
  - number: 1.1.b
    text: |-
      de Dienst: de Dienst voor het kadaster en de openbare registers, bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
  - number: 1.1.c
    text: |-
      "perceel": een deel van het Nederlands grondgebied van welk deel de Dienst de begrenzing met behulp van
      landmeetkundige gegevens heeft vastgelegd op grond van gegevens betreffende de rechtstoestand, bestemming en het
      gebruik en dat door zijn kadastrale aanduiding is gekenmerkt;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
  - number: 1.1.d
    text: |-
      "bewaarder": bewaarder, als bedoeld in de [artikelen 6][ref1] en [7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel7
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '7'
        hoofdstuk: '1'
  - number: 1.1.e
    text: '"ambtenaar": ambtenaar van de Dienst;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
  - number: 1.1.f
    text: |-
      geografisch gegeven: een gegeven over een object of verschijnsel met een specifieke ruimtelijke locatie en met
      daarbij behorende kenmerken, dat is aangewezen bij of krachtens [artikel 98a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel98a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 98a
        hoofdstuk: 6a
  - number: '1.2'
    text: |-
      De begripsomschrijvingen, opgenomen in de [artikelen 1][ref1], [2][ref2], [3, eerste lid][ref3], [8][ref4]
      en [10 van Boek 3][ref5], de [artikelen 1][ref6], [2][ref7], [3][ref8], [3][ref9], [190][ref10] en
      [780 van Boek 8 van het Burgerlijk Wetboek][ref11], alsmede in [artikel 312 van het Wetboek van Koophandel][ref12],
      gelden ook voor de onderhavige wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel2
