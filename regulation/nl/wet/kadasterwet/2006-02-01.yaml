        bwb_id: BWBR0010388
        artikel: '45'
  - number: '43'
    text: |-
      Indien het ter inschrijving aangeboden stuk waarin het in te schrijven feit is opgenomen, niet voldoet aan de
      vereisten, gesteld in de [artikelen 18-42][ref1], kan het met ontbrekende gegevens worden aangevuld door een
      verklaring aan de voet van het stuk, ondertekend door degene die bevoegd is tot het opmaken en ondertekenen van een
      zodanig stuk, een en ander voor zover de aard van het stuk zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '44.1'
    text: |-
      Stukken die voor bewijs bij de aanbieding van een stuk worden overgelegd, worden slechts mede ingeschreven, indien
      de wet dit eist of de aanbieder dit verlangt, tenzij bij wet is bepaald dat de desbetreffende stukken niet worden
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel44
  - number: '44.2'
    text: |-
      Onverminderd [artikel 17, tweede lid][ref1], maakt de bewaarder, overeenkomstig door het bestuur van de Dienst te
      stellen regels, melding van de overlegging van stukken:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel17
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '17'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 44.2.a
    text: |-
      voorzover die in papieren vorm ter inschrijving zijn aangeboden: op het ter inschrijving aangeboden stuk en op het
      afschrift van dat stuk, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel44
  - number: 44.2.b
    text: |-
      voorzover die in elektronische vorm ter inschrijving zijn aangeboden: in het desbetreffende elektronisch gedeelte
      van de openbare registers bij dat stuk.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel44
  - number: '44.3'
    text: |-
      Stukken die worden overgelegd maar waarvan de inschrijving niet wordt voorgeschreven of verlangd,
      worden onverwijld aan de aanbieder teruggegeven. De eerste zin is niet van toepassing indien
      [artikel 11b, vijfde lid, derde zin][ref1], toepassing heeft gevonden en het stuk in elektronische vorm is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '45.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vereisten waaraan stukken dienen te
      voldoen die worden aangeboden ter inschrijving van andere inschrijfbare feiten dan die waarop de artikelen 24-40
      betrekking hebben, voor zover dit niet reeds in deze dan wel bij of krachtens een andere wet is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel45
  - number: '45.2'
    text: |-
      Voor zover bij de in het eerste lid bedoelde maatregel niet anders is bepaald, wordt ter inschrijving van
      een beschikking of van een uitspraak waarbij een beschikking werd vernietigd, ingetrokken of gewijzigd, een
      afschrift van die beschikking onderscheidenlijk van die uitspraak aangeboden, afgegeven door het bestuursorgaan
      onderscheidenlijk het rechterlijk orgaan dat de beschikking of de uitspraak gaf.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel45
  - number: '46.1'
    text: |-
      Naast feiten die voor de rechtstoestand van registergoederen van belang zijn, kunnen in de openbare registers
      tevens algemene voorwaarden, modelreglementen en andere stukken, die niet op een bepaald registergoed betrekking
      hebben, worden ingeschreven, met het uitsluitend doel dat daarnaar in later ter inschrijving aangeboden stukken
      kan worden verwezen. De [artikelen 18][ref1], [19][ref2], [20, eerste lid, eerste zin][ref3], [22][ref4] en
      [30 van Boek 3 van het Burgerlijk Wetboek][ref5] en [117, eerste en tweede lid][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel117
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0005291
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '117'
        hoofdstuk: '9'
  - number: '46.2'
    text: |-
      Ter inschrijving van een stuk als bedoeld in het eerste lid wordt naast dat stuk aangeboden, indien het in papieren
      vorm ter inschrijving wordt aangeboden, een afschrift van dat stuk voorzien van een verklaring van eensluidendheid.
      [Artikel 11, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '46.3'
    text: |-
      Ter inschrijving van een stuk als bedoeld in het eerste lid is, indien het in elektronische vorm ter inschrijving
      wordt aangeboden, vereist een afschrift van dat stuk als bedoeld in [artikel 11b, eerste lid][ref1]. De
      [artikelen 11, tweede lid][ref2], en [11b, tweede tot en met negende lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '46.4'
    text: |-
      De [artikelen 18 tot en met 23][ref1] zijn niet van toepassing. Bij algemene maatregel van bestuur kunnen regels
      worden gesteld waaraan ter inschrijving aangeboden stukken als bedoeld in het eerste lid, voldoen. Bij regeling
      van Onze Minister worden regels gesteld met betrekking tot de wijze waarop de verwijzing in de latere stukken
      geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '46.5'
    text: |-
      Een verwijzing als bedoeld in het vierde lid heeft tot gevolg dat het stuk waarnaar in een ter inschrijving
      aangeboden stuk wordt verwezen, deel uitmaakt van de inschrijving die op grond van het aangeboden stuk plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46
  - number: 46a.1
    text: |-
      Ter voorkoming van een onjuiste of onvolledige bijhouding als bedoeld in de
      [artikelen 54, eerste lid, onderdeel a][ref1], [78, eerste lid][ref2], [87, eerste lid, onderdeel a][ref3],
      en [94, eerste lid, onderdeel a][ref4], kan met betrekking tot bij regeling van Onze Minister vast te stellen
      gevallen een door een notaris opgemaakte bijhoudingsverklaring worden ingeschreven, inhoudende dat naar zijn
      verklaring hem gebleken is dat in een eerder ingeschreven, door hem verleden notariële akte voor een juiste en
      volledige bijhouding van dat stuk kennelijk benodigde gegevens ontbreken en dat die gegevens uitsluitend ten
      behoeve van een juiste en volledige bijhouding van dat stuk in die verklaring worden vermeld. De inschrijving van
      een bijhoudingsverklaring kan slechts plaatsvinden indien die verklaring ter inschrijving wordt aangeboden voor de
      afloop van een periode van tien dagen die aanvangt met de eerste dag volgend op die waarop het desbetreffende stuk
      is ingeschreven, waarbij niet meegerekend worden de dagen waarop de kantoren van de Dienst niet voor het publiek
      zijn opengesteld voor het aanbieden van stukken ter inschrijving in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel87
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel94
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '78'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '87'
        hoofdstuk: '5'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '94'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 46a.2
    text: |-
      Ter inschrijving van een bijhoudingsverklaring als bedoeld in het eerste lid wordt aangeboden, indien dit
      in papieren vorm geschiedt, die verklaring of een authentiek afschrift daarvan, en een afschrift van die
      verklaring, onderscheidenlijk van dat authentieke afschrift, voorzien van een verklaring van eensluidendheid.
      [Artikel 11, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 46a.3
    text: |-
      Ter inschrijving van een bijhoudingsverklaring als bedoeld in het eerste lid is, indien het
      in elektronische vorm ter inschrijving wordt aangeboden, vereist een afschrift van dat stuk
      als bedoeld in [artikel 11b, eerste lid][ref1]. De [artikelen 11, tweede lid][ref2], en
      [11b, tweede tot en met vijfde lid, tweede zin, zesde, zevende en negende lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 46a.4
    text: |-
      De [artikelen 18][ref1] en [20 tot en met 23][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '20'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '47.1'
    text: |-
      Een verandering van een in een ingeschreven stuk gekozen woonplaats, een alsnog ter zake van een inschrijving
      gedane keuze van woonplaats en de opheffing van een gekozen woonplaats kunnen worden ingeschreven. Ter inschrijving
      van de verandering, keuze of opheffing wordt een door of namens de belanghebbende ondertekende verklaring
      aangeboden die de nieuwe en de vorige gekozen dan wel wettelijke woonplaats vermeldt, alsmede de datum van ingang.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel47
  - number: '47.2'
    text: |-
      Een krachtens [artikel 18, vierde lid][ref1], van deze wet of de [artikelen 260, eerste lid, van Boek 3][ref2] of
      [252, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref3] gekozen woonplaats, heeft, ongeacht of zij met het
      oorspronkelijke stuk dan wel krachtens het eerste lid is ingeschreven, geen ander gevolg dan dat


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 47.2.a
    text: daar exploiten kunnen worden uitgebracht die de inschrijving betreffen, ter zake waarvan woonplaats werd gekozen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel47
  - number: 47.2.b
    text: |-
      daar de door of krachtens de wet voorgeschreven mededelingen en kennisgevingen van de bewaarder en de Dienst kunnen
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel47
  - number: '47.3'
    text: |-
      Door of krachtens deze wet voorgeschreven mededelingen en kennisgevingen worden in elk geval gedaan aan de laatste
      bij de Dienst bekende woonplaats van de belanghebbende. In geval van overlijden van een persoon die tot een
      registergoed gerechtigd was, worden zodanige mededelingen en kennisgevingen aan zijn rechtsopvolgers gedaan aan het
      laatste bij de Dienst bekende adres van de boedel, bedoeld in [artikel 64, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel64
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '48.1'
    text: |-
      De kadastrale registratie, bedoeld in [artikel 3, eerste lid, onder b][ref1], wordt op een zodanige wijze gehouden
      en bijgehouden, dat zij tenminste door middel van de naam van de eigenaar of beperkt gerechtigde, met uitzondering
      evenwel van rechthebbenden op erfdienstbaarheden, alsmede door middel van de kadastrale aanduiding van de
      onroerende zaak en het appartementsrecht de raadpleegbaarheid mogelijk doet zijn van de openbare registers, bedoeld
      in [artikel 8, eerste lid][ref2], voorzover het gaat om stukken betreffende onroerende zaken en rechten waaraan die
      zaken zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '48.2'
    text: 'De kadastrale registratie bevat:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.a
    text: |-
      voor zover bekend de naam, voornamen, geboortedatum, de wettelijke woonplaats met adres en de burgerlijke staat dan
      wel, indien het een rechtspersoon betreft, de rechtsvorm, naam en de wettelijke woonplaats, van degenen die volgens
      de bij de Dienst bekende gegevens eigenaar dan wel beperkt gerechtigde met betrekking tot onroerende zaken zijn, en
      in geval van een gemeenschap het aandeel van ieder der deelgenoten;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.b
    text: |-
      ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld in onderdeel a: een verwijzing naar alle op hen
      betrekking hebbende in de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], ingeschreven of geboekte
      stukken voorzover die stukken betreffen onroerende zaken en rechten waaraan die zaken zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 48.2.c
    text: |-
      de wettelijke benaming van de beperkte rechten waaraan de onroerende zaken onderworpen zijn, en van de beslagen
      die op die zaken of beperkte rechten zijn gelegd, als ook, of die zaken of beperkte rechten onder bewind staan
      en of ten aanzien daarvan een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1]
      is ingeschreven, met dien verstande dat in bij regeling van Onze Minister vast te stellen gevallen in plaats van
      de soorten van gegevens, bedoeld in dit onderdeel, ook kan worden vermeld een verwijzing naar de desbetreffende
      ingeschreven stukken;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 48.2.d
    text: |-
      de kadastrale aanduiding van de onroerende zaken en de grootte van de percelen, alsmede de kadastrale aanduiding
      van de appartementsrechten;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.e
    text: |-
      ten aanzien van elk perceel en appartementsrecht een verwijzing naar alle daarop betrekking hebbende in de
      openbare registers, bedoeld in [artikel 8, eerste lid, onder a][ref1], ingeschreven stukken en in het register van
      voorlopige aantekeningen geboekte stukken, alsmede door de Dienst verkregen inlichtingen of verrichte waarnemingen,
      als bedoeld in [artikel 54, eerste lid, onder b-e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel54
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
  - number: 48.2.f
    text: |-
      ten aanzien van een gekozen woonplaats de vermelding ervan, alsmede een verwijzing naar alle in de openbare
      registers, bedoeld in [artikel 8, eerste lid, onder a][ref1], ingeschreven stukken betreffende onroerende zaken
      en rechten waaraan die zaken zijn onderworpen, waarin woonplaats is gekozen, dan wel een gekozen woonplaats is
      veranderd of opgeheven;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 48.2.g
    text: 'voorzover op een perceel een recht van hypotheek rust, ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.g.1°
    text: |-
      het bedrag waarvoor de hypotheek is gevestigd, of indien dit bedrag nog niet vaststaat, het maximumbedrag dat uit
      hoofde van een hypotheek op het goed kan worden verhaald, en voorzover bekend, de rentevoet;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.g.2°
    text: |-
      de aard van de onroerende zaak waarop de hypotheek is gevestigd, of indien het onderpand een beperkt recht is, de
      wettelijke benaming van dat recht, en indien de hypotheek op een aandeel in een gemeenschap is gevestigd, tevens de
      aanduiding van dat aandeel, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.g.3°
    text: de aanduiding van de aard van de hypotheek;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.h
    text: |-
      een korte aanduiding van de aard van de in de openbare registers ingeschreven beschikkingen die bestaan ten laste
      van de onroerende zaken en van de beperkte rechten waaraan deze zijn onderworpen, overeenkomstig door het bestuur
      van de Dienst te geven regelen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.i
    text: |-
      gegevens betreffende de feitelijke gesteldheid van en andere dan de gegevens, bedoeld in dit lid, met betrekking
      tot onroerende zaken, die worden opgenomen op grond van andere wettelijke bepalingen of op grond van bij regeling
      van Onze Minister gestelde regels;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.j
    text: |-
      met betrekking tot een ingeschreven notariële akte en notariële verklaring betreffende onroerende zaken en
      rechten waaraan die zaken zijn onderworpen: de naam en plaats van vestiging van de notaris door wie of door wiens
      plaatsvervanger de akte is verleden, onderscheidenlijk de verklaring is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: 48.2.k
    text: |-
      ten aanzien van een ingeschreven stuk voorzover betreffend onroerende zaken en rechten waaraan die zaken zijn
      onderworpen: dag, uur en minuut waarop de aanbieding ervan ter inschrijving plaatsvond.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: '48.3'
    text: |-
      Het tweede lid, onder *a* en *b*, vindt ten aanzien van erfdienstbaarheden slechts toepassing, voor zover bepaald
      bij regeling van het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: '48.4'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de wijze waarop de kadastrale registratie wordt gehouden.
      Het bestuur van de Dienst kan daarbij bepalen dat ten aanzien van het gebruik van hoofd- en kleine letters
      en diakritische tekens, het al dan niet aan elkaar schrijven van letters en de schrijfwijze van adressen geen
      overeenstemming behoeft te bestaan tussen de bij de Dienst bekend gestelde schrijfwijze der in de kadastrale
      registratie te vermelden gegevens en de wijze van vermelding van die gegevens daarin.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel48
  - number: '49.1'
    text: Het kaartenbestand van de Dienst bestaat in elk geval uit kadastrale kaarten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel49
  - number: '49.2'
    text: |-
      Een kadastrale kaart is een kaart die bevat de perceelsgewijze indeling van een deel van het Nederlandse
      grondgebied, een voorstelling van de omtrek van door het bestuur van de Dienst vast te stellen opstallen die daarop
      zijn gesticht, de nummers van de percelen, en gegevens omtrent de terreinstoestand.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel49
  - number: '50'
    text: |-
      De aan de kadastrale kaarten ten grondslag liggende bescheiden bevatten in elk geval de landmeetkundige gegevens
      van hetgeen op die kaarten wordt weergegeven.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel50
  - number: '51.1'
    text: Het bestuur van de Dienst stelt regelen vast omtrent de inrichting van de kadastrale kaarten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel51
  - number: '51.2'
    text: |-
      Het bestuur van de Dienst stelt tevens regelen vast omtrent de vorm van de aan de kadastrale kaarten ten grondslag
      liggende bescheiden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel51
  - number: '52.1'
    text: |-
      Er is een net van coördinaatpunten waarvan de coördinaten worden vastgelegd in het stelsel van de
      Rijksdriehoeksmeting en in het stelsel van het Europese referentiesysteem voor geodesie en navigatie.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel52
  - number: '52.2'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de registratie en de weergave van de in het eerste lid
      genoemde punten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel52
  - number: '53'
    text: Bijwerking vindt plaats als bijhouding dan wel als vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel53
  - number: '54.1'
    text: |-
      Bijhouding vindt, onverminderd het bepaalde bij of krachtens deze of een andere wet, plaats op grond van
      veranderingen, voor zover deze blijken uit:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
  - number: 54.1.a
    text: |-
      in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken, voorzover
      die betrekking hebben op onroerende zaken en rechten waaraan die zaken zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 54.1.b
    text: |-
      inlichtingen omtrent het overlijden van personen die als eigenaar of beperkt gerechtigde met betrekking tot een
      onroerende zaak in de kadastrale registratie staan vermeld, voor zover althans deze inlichtingen afkomstig zijn
      van door Onze Minister aangewezen publiekrechtelijke rechtspersonen of andere lichamen, aan wie een deel van de
      overheidstaak is opgedragen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
  - number: 54.1.c
    text: |-
      inlichtingen omtrent de wettelijke woonplaats, daaronder begrepen het adres, van personen die als eigenaar of
      beperkt gerechtigde met betrekking tot een onroerende zaak in de kadastrale registratie staan vermeld, voor
      zover althans deze inlichtingen van die personen zelf afkomstig zijn dan wel van door Onze Minister aangewezen
      publiekrechtelijke rechtspersoon of andere lichamen, aan wie een deel van de overheidstaak is opgedragen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
  - number: 54.1.d
    text: |-
      inlichtingen van personen die als eigenaar of beperkt gerechtigde met betrekking tot een onroerende zaak in
      de kadastrale registratie staan vermeld dan wel van de rechtsopvolgers onder algemene titel van die personen
      of waarnemingen van met meting belaste ambtenaren omtrent feiten, als bedoeld in de [artikelen 29][ref1] en
      [35 van Boek 5 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel35
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '35'
  - number: 54.1.e
    text: |-
      inlichtingen van personen die als eigenaar of beperkt gerechtigde met betrekking tot een onroerende zaak in de
      kadastrale registratie staan vermeld of van de rechtsopvolgers onder algemene titel van die personen, dan wel
      van door Onze Minister aangewezen publiekrechtelijke rechtspersonen of andere lichamen, aan wie een deel van
      de overheidstaak is opgedragen, of uit waarnemingen van met meting belaste ambtenaren omtrent de feitelijke
      gesteldheid van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
  - number: '54.2'
    text: |-
      Bijhouding van de kadastrale registratie vindt ook plaats met betrekking tot voorlopige aantekeningen terzake van
      stukken betreffende onroerende zaken en rechten waaraan die zaken zijn onderworpen en doorhalingen daarvan in het
      register van voorlopige aantekeningen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
  - number: '54.3'
    text: |-
      Wij kunnen publiekrechtelijke rechtspersonen of andere lichamen aan wie een deel van de overheidstaak is
      opgedragen, aanwijzen om inlichtingen ten behoeve van de bijhouding van de kadastrale registratie en de kadastrale
      kaarten aan de Dienst te verstrekken. Ingeval het bepaalde in de vorige zin toepassing heeft gevonden, verstrekken
      de desbetreffende rechtspersonen en lichamen, bedoeld in de vorige zin, de inlichtingen overeenkomstig de door Ons
      dienaangaande vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel54
  - number: '55'
    text: |-
      Vernieuwing vindt plaats op grond van veranderingen, voor zover deze blijken uit in de openbare registers, bedoeld
      in [artikel 8, eerste lid, onder ][ref1], ingeschreven akten van vernieuwing, als bedoeld in [artikel 77][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel77
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '77'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '56'
    text: |-
      De wijze van bijwerking wordt, onverminderd het bepaalde bij of krachtens deze of een andere wet, bij of krachtens
      algemene maatregel van bestuur geregeld in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56
  - number: 56.a
    text: dat na een inschrijving de bijwerking terstond aanvangt, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56
  - number: 56.b
    text: |-
      dat tenminste ingeval een bijwerking leidt tot het wijzigen of aanvullen van de in de kadastrale registratie
      vermeld staande gegevens betreffende de eigenaars of beperkt gerechtigden, de kadastrale aanduiding dan wel
      de grootte, in de registratie wordt vermeld op grond van welk ingeschreven of ander stuk een bijwerking heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56
  - number: 56a.1
    text: |-
      Op beschikkingen inzake de bijwerking, genomen krachtens [hoofdstuk 4][ref1] van deze wet, zijn de
      [artikelen 4:7][ref2], [4:8][ref3] en [3:40 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 56a.2
    text: |-
      Het voorstel van vernieuwing, als bedoeld in [artikel 76, tweede lid][ref1], geldt als een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: 56b.1
    text: |-
      Belanghebbenden kunnen tegen beschikkingen inzake de bijwerking, genomen krachtens [hoofdstuk 4][ref1] van deze
      wet, bezwaar maken nadat zij is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '4'
  - number: 56b.2
    text: |-
      Geen bezwaar staat open tegen bijhoudingen als bedoeld in de [artikelen 71][ref1] en [72][ref2] alsmede tegen een
      vernieuwing als bedoeld in [artikel 78, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel78
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '78'
        hoofdstuk: '4'
        afdeling: '3'
  - number: 56c.1
    text: |-
      Tegen de beslissing op het bezwaarschrift kunnen belanghebbenden bij verzoekschrift in beroep
      komen bij de rechtbank, binnen welker rechtsgebied de onroerende zaak geheel of grotendeels is
      gelegen. De [artikelen 6:2][ref1], [6:7 tot en met 6:13][ref2], [6:18 tot en met 6:20][ref3] en
      [6:22 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 56c.2
    text: |-
      De indiening van het verzoekschrift kan, behalve door een procureur, ook door een notaris
      geschieden, in welk geval het kantoor van de notaris als gekozen woonplaats van de verzoeker geldt.
      [Artikel 280 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel280
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '280'
  - number: 56c.3
    text: |-
      Zodra een verzoekschrift is ingediend, zendt de griffier een afschrift daarvan aan de ambtenaar. De ambtenaar zendt
      onverwijld aan de griffier:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
  - number: 56c.3.a
    text: een lijst van de personen die bij de bijwerking belanghebbenden zijn;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
  - number: 56c.3.b
    text: een afschrift van het stuk waarin het resultaat van de desbetreffende bijwerking is bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
  - number: 56c.3.c
    text: het bezwaarschrift en zijn beslissing daarop, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
  - number: 56c.3.d
    text: afschriften van de overige bescheiden die op de bijwerking betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56c
  - number: 56d.1
    text: |-
      De rechtbank beschikt omtrent de wijze waarop de bijwerking zal plaatsvinden na oproeping van de verzoeker,
      de ambtenaar en de belanghebbenden bij de bijwerking onder wie in elk geval zij die door de ambtenaar op de in
      [artikel 56c, derde lid, onder a][ref1], bedoelde lijst zijn geplaatst. De ambtenaar kan in persoon of ook bij een
      vertegenwoordiger verschijnen. Zo voor andere belanghebbenden nog beroep openstaat, wordt daarmee rekening gehouden
      bij de vaststelling van de dag waartegen wordt opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel56
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '56'
        hoofdstuk: '4'
        afdeling: '1'
  - number: 56d.2
    text: |-
      Verschillende beroepen tegen één beslissing van de ambtenaar worden zoveel mogelijk gevoegd behandeld. Elke
      belanghebbende kan verschijnen bij of zich doen bijstaan door een notaris.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56d
  - number: 56d.3
    text: De rechtbank kan bij haar onderzoek een meting gelasten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56d
  - number: 56d.4
    text: |-
      Tegen een beschikking van de rechtbank is geen hoger beroep toegelaten. Voor belanghebbenden die voor
      de rechtbank zijn verschenen en voor de ambtenaar staat beroep in cassatie open overeenkomstig de
      [artikelen 426 tot en met 429 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel426
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '426'
  - number: 56d.5
    text: |-
      De griffier van de rechtbank, of in geval van beroep in cassatie de griffier van de Hoge Raad, zendt bij
      aangetekende brief een afschrift van de beschikking aan de hem bekende belanghebbenden bij de bijwerking, alsmede
      aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56d
  - number: 56e
    text: |-
      Zodra de beslissing van de ambtenaar onherroepelijk is geworden dan wel het afschrift van de eindbeschikking van de
      rechtbank door de ambtenaar is ontvangen en deze beschikking in kracht van gewijsde is gegaan, wordt de bijwerking
      zonodig aangepast overeenkomstig deze beslissing onderscheidenlijk beschikking.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel56e
  - number: '57.1'
    text: |-
      Indien een meting noodzakelijk is ten behoeve van de bijhouding, doet de Dienst van het voornemen daartoe
      mededeling aan de personen die volgens de bij de Dienst bekende gegevens als eigenaar, beperkt gerechtigde,
      met uitzondering van evenwel de hypotheekhouders en de rechthebbenden op erfdienstbaarheden zo die er zijn, of
      anderszins bij de bijhouding belanghebbenden zijn. De mededeling houdt in elk geval in de dag en het uur waarop de
      aanwijzing die de grondslag vormt voor de meting, zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel57
  - number: '57.2'
    text: Onze Minister stelt regelen vast omtrent de wijze waarop de in het vorige lid bedoelde mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel57
  - number: '57.3'
    text: |-
      De in het eerste lid bedoelde belanghebbenden verschaffen, indien naar het oordeel van de met de meting belaste
      ambtenaar nodig door aanwijzing ter plaatse, de door deze ambtenaar voor de bijhouding benodigde inlichtingen.
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent de bijhouding voor de gevallen
      waarin één of meer belanghebbenden niet de voor de bijhouding benodigde inlichtingen of onderling tegenstrijdige
      inlichtingen verschaffen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel57
  - number: '57.4'
    text: De ambtenaar maakt een relaas van zijn bevindingen, dat mede de door de meting verkregen gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel57
  - number: '57.5'
    text: |-
      De bijhouding vindt plaats mede op grondslag van het relaas van bevindingen indien het eerste-vierde lid toepassing
      heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel57
  - number: '57.6'
    text: |-
      Op vertoon van een bewijs van de in [artikel 58, eerste lid][ref1], bedoelde bekendmaking worden aan
      belanghebbenden op het desbetreffende kantoor van de Dienst kosteloos nadere inlichtingen omtrent de uitkomsten
      van de meting verschaft, indien het eerste-vierde lid toepassing heeft gevonden. Onze Minister stelt nadere regelen
      vast omtrent de wijze waarop deze inlichtingen worden verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '58.1'
    text: |-
      Ingeval de bijhouding waartoe een ingeschreven stuk aanleiding geeft, met betrekking tot een gehandhaafd perceel
      dan wel een nieuw gevormd perceel is voltooid en heeft geleid tot wijziging of aanvulling van de in de kadastrale
      registratie en op kadastrale kaarten vermeld staande gegevens betreffende de eigenaars of beperkt gerechtigden,
      de kadastrale aanduiding dan wel de grootte van de onroerende zaak waarop het ingeschreven feit betrekking heeft,
      wordt het resultaat van die bijhouding aan belanghebbenden door toezending of uitreiking bekendgemaakt. Met
      betrekking tot een rechthebbende op een erfdienstbaarheid vindt het bepaalde in de eerste zin slechts toepassing,
      voor zover een regeling van het bestuur van de Dienst als bedoeld in [artikel 48, derde lid][ref1], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: '58.2'
    text: De verzending ingevolge het eerste lid vindt op één en dezelfde dag plaats.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel58
  - number: '58.3'
    text: |-
      Indien in een geval, als bedoeld in het eerste lid, het ingeschreven stuk is een akte van toedeling, als
      bedoeld in de [artikelen 89, eerste lid, van de Reconstructiewet Midden-Delfland][ref1] ( *Stb.* 1977, 233),
      [95, eerste lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref2] (*Stb.* 1977,
      694) en [207, eerste lid, van de Landinrichtingswet][ref3] (*Stb.* 1985, 299), of een ruilakte als bedoeld in
      [artikel 90, eerste lid, van de Reconstructiewet concentratiegebieden][ref4] vindt het bepaalde in de vorige leden
      geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0003793#Artikel207
      [ref4]: https://wetten.overheid.nl/BWBR0013399#Artikel90
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0003793
        artikel: '207'
      - id: ref4
        bwb_id: BWBR0013399
        artikel: '90'
  - number: '59.1'
    text: |-
      Blijkt de in het ingeschreven stuk voorkomende feitelijke omschrijving van de onroerende zaak waarop
      het stuk betrekking heeft, onverenigbaar met hetgeen de met de meting belaste ambtenaar overeenkomstig
      [artikel 57, derde lid][ref1], door de belanghebbenden ter plaatse is aangewezen, of is de kadastrale aanduiding
      van die zaak in dat stuk onjuist of onvolledig, dan vindt [artikel 58, eerste-derde lid][ref2], slechts toepassing
      voor zover bijhouding naar de krachtens het volgende lid vast te stellen regelen mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '59.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld in hoeverre en op welke wijze bijhouding
      plaatsvindt, indien de in het eerste lid bedoelde gevallen zich voordoen, in dier voege dat de bijhouding waartoe
      het ingeschreven stuk aanleiding geeft, eerst wordt voltooid, nadat een stuk tot verbetering, als bedoeld in
      [artikel 42][ref1], is ingeschreven in de in [artikel 8, eerste lid, onder a][ref2], bedoelde openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '59.3'
    text: |-
      De beslissing om toepassing aan het eerste lid te geven wordt met bekwame spoed genomen. Indien het
      ingeschreven stuk is opgemaakt door een notaris, wordt de beslissing tevens aan hem medegedeeld. De
      bekendmaking van de beslissing gaat vergezeld van een verzoek een stuk tot verbetering, als bedoeld in
      [artikel 42][ref1], in te schrijven in de openbare registers, bedoeld in [artikel 8, eerste lid, onder a][ref2].
      [Artikel 58, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '59.4'
    text: |-
      Bij de bekendmaking wordt gewezen op het gevolg voor de bijhouding dat de wet aan het niet-inschrijven van een stuk
      tot verbetering, als bedoeld in [artikel 42][ref1], verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '59.5'
    text: |-
      Het bepaalde in de vorige leden is van overeenkomstige toepassing ingeval de kadastrale aanduiding van een
      appartementsrecht in een ingeschreven stuk onjuist of onvolledig blijkt te zijn.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel59
  - number: '64.1'
    text: |-
      De wijze van bijhouding op grond van inlichtingen omtrent het overlijden van personen die als eigenaar of beperkt
      gerechtigde met betrekking tot een onroerende zaak in de kadastrale registratie staan vermeld, wordt geregeld bij
      of krachtens algemene maatregel van bestuur, in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel64
  - number: 64.1.a
    text: dat de bijhouding beperkt blijft tot het aantekenen van het feit en datum van overlijden, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel64
  - number: 64.1.b
    text: dat vermeld wordt het adres van de boedel, zo dat adres bekend is.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel64
  - number: '64.2'
    text: |-
      Van deze aantekening wordt mededeling gedaan naar het in de kadastrale registratie vermelde adres van de boedel of,
      bij onbekendheid daarvan, naar de laatst bekende woonplaats van de overleden persoon, alsmede aan de boedelnotaris,
      zo deze bekend is.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel64
  - number: '64.3'
    text: |-
      [ Artikel 58, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '65.1'
    text: |-
      De wijze van bijhouding op grond van inlichtingen omtrent de wettelijke woonplaats, daaronder begrepen het adres,
      van personen die als eigenaar of beperkt gerechtigde met betrekking tot een onroerende zaak in de kadastrale
      registratie staan vermeld, wordt geregeld bij of krachtens algemene maatregel van bestuur, in dier voege dat de
      bijhouding beperkt blijft tot het aantekenen van de nieuwe wettelijke woonplaats.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel65
  - number: '65.2'
    text: Van deze aantekening wordt mededeling gedaan aan de persoon op wie de wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel65
  - number: '66.1'
    text: |-
      Ingeval een belanghebbende, bedoeld in [artikel 54, eerste lid, onder ][ref1], meent dat zich een feit heeft
      voorgedaan, als bedoeld in [artikel 29][ref2] dan wel in [artikel 35 van Boek 5 van het Burgerlijk Wetboek][ref3],
      kan hij de Dienst verzoeken, een onderzoek in te stellen, als bedoeld in het volgende artikel. Het verzoek wordt
      ingediend bij het kantoor van de Dienst, binnen welks kring de desbetreffende onroerende zaak is gelegen. Binnen
      acht weken na ontvangst van de aanvraag wordt de beslissing op het verzoek genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel35
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '35'
  - number: '66.2'
    text: |-
      In geval van toewijzing van het verzoek wordt door de Dienst van het voornemen tot het houden van een onderzoek
      ter plaatse mededeling gedaan overeenkomstig [artikel 57, eerste lid][ref1]. [Artikel 57, tweede lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '67.1'
    text: |-
      De met het onderzoek belaste ambtenaar gaat ter plaatse na of een feit, als bedoeld in [artikel 29][ref1] dan wel
      in [artikel 35 van Boek 5 van het Burgerlijk Wetboek][ref2], zich heeft voorgedaan. [Artikel 57, derde lid][ref3],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '29'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '67.2'
    text: |-
      De ambtenaar maakt een relaas van zijn bevindingen. Indien ten behoeve van het onderzoek een meting plaatsvindt,
      worden de daardoor verkregen gegevens eveneens opgenomen in het relaas van bevindingen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel67
  - number: '68.1'
    text: |-
      Indien het onderzoek ter plaatse aanleiding geeft tot bijhouding, vindt deze plaats op grondslag van het relaas van
      bevindingen. [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '68.2'
    text: |-
      Indien het onderzoek ter plaatse geen aanleiding geeft tot bijhouding, wordt daarvan mededeling gedaan aan de
      verzoeker en de overige bij de bijhouding belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel68
  - number: '70.1'
    text: |-
      De Dienst is bevoegd, ook zonder een verzoek, als bedoeld in [artikel 66, eerste lid][ref1], een onderzoek,
      als bedoeld in [artikel 67, eerste lid][ref2], in te stellen indien er redenen zijn om aan te nemen dat
      zich met betrekking tot onroerende zaken feiten hebben voorgedaan, als bedoeld in de [artikelen 29][ref3] en
      [35 van Boek 5 van het Burgerlijk Wetboek][ref4]. Van het voornemen tot een onderzoek wordt door de Dienst
      mededeling gedaan overeenkomstig [artikel 57, eerste lid][ref5]. De [artikelen 57, tweede en derde lid][ref6], en
      [67, tweede lid][ref7], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0005288#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel67
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0005288
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
  - number: '70.2'
    text: |-
      Indien de Dienst gebruik heeft gemaakt van de in het vorige lid bedoelde bevoegdheid en het onderzoek ter plaatse
      aanleiding heeft gegeven tot bijhouding, vindt bijhouding plaats op grondslag van het relaas van bevindingen.
      [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '70.3'
    text: |-
      Ingeval het onderzoek geen aanleiding geeft tot bijhouding is [artikel 68, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel68
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '68'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
  - number: '71'
    text: |-
      De wijze van bijhouding op grond van inlichtingen of waarnemingen omtrent de feitelijke gesteldheid van onroerende
      zaken wordt geregeld door het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel71
  - number: '72'
    text: |-
      De wijze van bijhouding in de kadastrale registratie met betrekking tot voorlopige aantekeningen terzake van
      stukken betreffende onroerende zaken en rechten waaraan die zaken zijn onderworpen en doorhalingen daarvan in het
      register van voorlopige aantekeningen wordt geregeld door het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel72
  - number: '73.1'
    text: |-
      De Dienst kan besluiten tot splitsing of samenvoeging van percelen in bij of krachtens algemene maatregel van
      bestuur te bepalen gevallen. [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '73.2'
    text: |-
      Degene die als eigenaar of beperkt gerechtigde met betrekking tot een onroerende zaak in de kadastrale registratie
      staat vermeld, kan in bij of krachtens algemene maatregel van bestuur te bepalen gevallen een verzoek tot splitsing
      of samenvoeging van percelen doen met betrekking tot die onroerende zaak, indien hij daarbij een redelijk belang
      heeft. Het verzoek wordt ingediend bij het kantoor van de Dienst, binnen welks kring de desbetreffende onroerende
      zaak is gelegen. Indien het verzoek afkomstig is van een beperkt gerechtigde moet degene die met betrekking tot die
      onroerende zaak als eigenaar in de kadastrale registratie staat vermeld, door de Dienst worden gehoord alvorens tot
      bijhouding kan worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel73
  - number: '73.3'
    text: |-
      Indien naar zijn oordeel nodig wint de daarmee belaste ambtenaar ter plaatse nadere inlichtingen in.
      Van het voornemen daartoe wordt alsdan mededeling gedaan overeenkomstig [artikel 57, eerste lid][ref1].
      [Artikel 57, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '73.4'
    text: |-
      Voorts is [artikel 67, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel67
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
  - number: '73.5'
    text: |-
      Voor zover het verzoek wordt toegewezen, vindt de bijhouding plaats op grondslag van het relaas van bevindingen.
      [Artikel 58, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '74.1'
    text: |-
      In bij algemene maatregel van bestuur te bepalen gevallen is de Dienst bevoegd te onderzoeken of de gegevens
      betreffende de rechtstoestand, de grootte en feitelijke gesteldheid van onroerende zaken, alsmede de gegevens
      betreffende de rechtstoestand van de rechten waaraan deze onroerende zaken onderworpen zijn, die zijn weergegeven
      in de kadastrale registratie, op de kadastrale kaarten en de daaraan ten grondslag liggende bescheiden, juist en
      volledig zijn. De ambtenaar die met dit onderzoek is belast, gaat daartoe overeenkomstig de bepalingen van deze
      afdeling na of deze gegevens en de daaraan ten grondslag liggende gegevens, vermeld in ingeschreven stukken en
      verkregen uit inlichtingen of waarnemingen, bedoeld in [artikel 54, eerste lid, onder ][ref1], overeenkomen met de
      gegevens die hij krachtens deze afdeling uit inlichtingen, bescheiden en door middel van waarnemingen verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '74.2'
    text: |-
      Komen de in de tweede zin van het vorige lid bedoelde gegevens niet met elkaar overeen, dan vindt vernieuwing van
      de kadastrale registratie en de kadastrale kaarten plaats overeenkomstig de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel74
  - number: '75.1'
    text: |-
      Vóór de aanvang van een onderzoek van vernieuwing maakt de Dienst het voornemen daartoe openbaar overeenkomstig
      door Onze Minister vast te stellen regels. Bij algemene maatregel van bestuur kan voor daarin omschreven gevallen
      worden bepaald dat openbaarmaking achterwege kan blijven op de grond dat het bereiken van alle belanghebbenden door
      het bepaalde in het tweede lid voldoende gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel75
  - number: '75.2'
    text: |-
      De Dienst doet in elk geval van een voornemen tot een onderzoek van vernieuwing per brief mededeling aan de
      personen die als eigenaar of beperkt gerechtigde met betrekking tot de onroerende zaak waarop de vernieuwing
      betrekking heeft, in de kadastrale registratie staan vermeld, alsmede aan de personen die bij de Dienst anderszins
      als belanghebbenden bij de vernieuwing bekend zijn. [Artikel 57, eerste lid, tweede zin, en tweede lid][ref1], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel57
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '75.3'
    text: |-
      Een voornemen tot een onderzoek van vernieuwing wordt bij het desbetreffende perceel in de kadastrale registratie
      vermeld volgens door het bestuur van de Dienst vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel75
  - number: '75.4'
    text: |-
      In de brief, bedoeld in het tweede lid, wordt gewezen op de in [artikel 78, tweede en derde lid][ref1], genoemde
      gevolgen die de wet aan de vernieuwing verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel78
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '78'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '76.1'
    text: |-
      De in [artikel 74, eerste lid][ref1], bedoelde ambtenaar wint, zonodig ter plaatse, inlichtingen in, verzoekt
      zonodig om overlegging of openlegging van bescheiden en doet de nodige waarnemingen. De belanghebbenden, bedoeld in
      [artikel 75, tweede lid][ref2], dienen, indien naar het oordeel van de ambtenaar nodig door aanwijzing ter plaatse,
      de door de ambtenaar voor de vernieuwing benodigde inlichtingen te verschaffen en daartoe zonodig bescheiden over
      te leggen of open te leggen. [Artikel 67, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel67
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '74'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '75'
        hoofdstuk: '4'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '4'
        afdeling: '2'
  - number: '76.2'
    text: |-
      Op de grondslag van het relaas van bevindingen worden voorstellen van vernieuwing gemaakt. Alvorens daartoe wordt
      overgegaan, wordt nagegaan of na het onderzoek van vernieuwing met betrekking tot de onroerende zaak waarop het
      voorstel betrekking heeft, nog bijhoudingen hebben plaatsgevonden. Is dat het geval dan wordt in het voorstel
      afzonderlijk melding gemaakt van die bijhoudingen, overeenkomstig door het bestuur van de Dienst vast te stellen
      regelen. Elk voorstel bevat in elk geval de gegevens omtrent de rechten, de rechthebbenden, de grootte, de
      kadastrale aanduiding van de onroerende zaak waarop het betrekking heeft, zoals deze luiden op de dag waarop het
      voorstel is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
  - number: '76.3'
    text: |-
      Bij het maken van een voorstel van vernieuwing wordt geen acht geslagen op niet-ingeschreven feiten waarvan
      het rechtsgevolg slechts kan intreden door inschrijving daarvan in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '76.4'
    text: |-
      In het voorstel worden de gegevens omtrent rechten van hypotheek en inbeslagnemingen, zoals deze blijken
      uit de desbetreffende, in de openbare registers, bedoeld in [artikel 8, eerste lid, onder ][ref1],
      ingeschreven stukken, ongewijzigd overgenomen. Het bepaalde in de vorige zin lijdt uitzondering ingeval de
      in [artikel 74, eerste lid][ref2], bedoelde ambtenaar tijdens het onderzoek is gebleken dat de omvang van de
      onroerende zaak waarop het recht van hypotheek is gevestigd, onderscheidenlijk het beslag is gelegd, wijziging
      heeft ondergaan. In dat geval dient bij het opmaken van het voorstel op deze wijziging acht te worden geslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel74
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '74'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '76.5'
    text: |-
      In het voorstel worden slechts gegevens omtrent die erfdienstbaarheden vermeld welke in de kadastrale registratie
      zijn vermeld, of, indien niet daarin vermeld, waarvan het bestaan aannemelijk is geworden op grond van
      inlichtingen, bescheiden of waarnemingen, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
  - number: '76.6'
    text: |-
      Het voorstel van vernieuwing wordt bekend gemaakt aan belanghebbenden. [Artikel 58, tweede lid][ref1], is van
      overeenkomstige toepassing. Bij toepassing van de [artikelen 56][ref2] bevat de beslissing van de ambtenaar op het
      bezwaarschrift dan wel de beschikking van de rechtbank alle gegevens uit het voorstel van vernieuwing omtrent de
      rechten, de rechthebbenden, de kadastrale aanduiding en de grootte van de onroerende zaak, waarop de vernieuwing
      betrekking heeft, ook die waarvan de juistheid door belanghebbenden niet is betwist.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
  - number: '76.7'
    text: |-
      Het voorstel van vernieuwing wordt op het kantoor van de Dienst, binnen welks kring de onroerende zaken waarop het
      voorstel betrekking heeft, zijn gelegen, voor een ieder ter inzage gelegd. Van de indiening van bezwaarschriften
      en het instellen van beroep, alsmede van daarop gegeven beslissingen wordt bij het voorstel melding gemaakt
      overeenkomstig door het bestuur van de Dienst vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel76
  - number: '77.1'
    text: |-
      Voor zover tegen een voorstel van vernieuwing geen of niet tijdig bezwaren zijn ingediend, dan wel de beslissing
      van de ambtenaar op bezwaren onherroepelijk is geworden of door de ambtenaar afschriften zijn ontvangen van de
      beschikking of de beschikkingen van de rechter, waarin onherroepelijk op een beroep ter zake van zijn beslissing
      is beslist en waaruit blijkt van de gegevens die krachtens [artikel 76, zesde lid, tweede zin][ref1], in de
      beschikking moeten worden opgenomen, wordt door een daartoe door de Dienst aangewezen notaris een akte van
      vernieuwing opgemaakt. De akte wordt door de ambtenaar ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '77.2'
    text: |-
      Een akte van vernieuwing kan op één of meer voorstellen van vernieuwing betrekking hebben. De akte bevat
      ten aanzien van elke onroerende zaak waarop de vernieuwing betrekking heeft, het relaas van bevindingen, de
      inhoud van het voorstel van vernieuwing, onderscheidenlijk de beslissing van de ambtenaar of de in het eerste
      lid bedoelde beschikking of beschikkingen van de rechter. Bescheiden die tijdens het onderzoek aan de in
      [artikel 74, eerste lid][ref1], bedoelde ambtenaar worden overgelegd, worden in de akte vermeld en daaraan in
      afschrift gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel74
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '74'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '77.3'
    text: |-
      Tevens worden overeenkomstig door het bestuur van de Dienst vast te stellen regelen aan de voet van de akte van
      vernieuwing ten aanzien van elke onroerende zaak waarop de vernieuwing betrekking heeft, afzonderlijk vermeld de
      in [artikel 76, tweede lid][ref1], bedoelde bijhoudingen alsmede die bijhoudingen, zo die hebben plaatsgevonden,
      welke zich hebben voorgedaan tussen het tijdstip van de dagtekening van het voorstel van vernieuwing en dat van de
      dagtekening van de akte van vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '77.4'
    text: |-
      Een bezwaar of beroep ter zake van een bijhouding, als bedoeld in het vorige lid, kan op verzoek van de
      belanghebbende gevoegd worden behandeld met bezwaren of beroepen ter zake van een voorstel van vernieuwing. De
      behandeling kan op verzoek van de belanghebbende ook worden aangehouden tot na het verlijden van de akte van
      vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel77
  - number: '77.5'
    text: |-
      De akte van vernieuwing wordt ingeschreven in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '78.1'
    text: |-
      Na de inschrijving, bedoeld in [artikel 77, vijfde lid][ref1], worden de kadastrale registratie en de kadastrale
      kaarten met bekwame spoed vernieuwd op de voet van de akte van vernieuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel77
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '77'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '78.2'
    text: |-
      Zij die volgens de akte van vernieuwing rechthebbende zijn op een daarin opgenomen onroerende zaak
      of recht dat geen recht van hypotheek is, gelden voor de toepassing van de verjaring, bedoeld in
      [artikel 99 van Boek 3 van het Burgerlijk Wetboek][ref1], met ingang van de dag van de inschrijving als bezitter te
      goeder trouw van die zaak of dat recht zoals zij in de akte worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '99'
  - number: '78.3'
    text: |-
      De in [artikel 106 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde rechtsvordering van een beperkt
      gerechtigde, wiens recht niet in de akte van vernieuwing is opgenomen, verjaart in elk geval door verloop van tien
      jaren na de dag van de inschrijving van deze akte.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel106
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '106'
  - number: '79'
    text: Het bestuur van de Dienst stelt nadere regelen vast omtrent de in deze titel voorziene metingen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel79
  - number: '80'
    text: |-
      Bij regeling van het bestuur van de Dienst kan worden bepaald dat in door het bestuur van de Dienst vast te stellen
      gevallen bij een kennisgeving van het resultaat van een bijhouding, als bedoeld in afdeling 2 , of bij een voorstel
      van vernieuwing, als bedoeld in [artikel 76, tweede lid][ref1], een kaart wordt gevoegd weergevend de onroerende
      zaken ten aanzien waarvan de bijwerking heeft plaatsgevonden, onderscheidenlijk zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel76
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '76'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '81.1'
    text: |-
      Bij regeling van Onze Minister wordt bepaald, onverminderd hetgeen daaromtrent op grond van andere bepalingen van
      deze titel reeds is of wordt bepaald, welke gegevens eveneens ten minste in de in deze titel voorziene relazen
      van bevindingen en voorstellen van vernieuwing worden vermeld. Het bestuur van de Dienst stelt nadere regelen vast
      omtrent de vorm van de relazen van bevindingen en de voorstellen van vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel81
  - number: '81.2'
    text: |-
      Bij regeling van Onze Minister kunnen tevens nadere voorschriften worden gegeven inzake de vorm van de akte van
      vernieuwing.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel81
  - number: '82'
    text: |-
      Het bestuur van de Dienst stelt de vorm vast van de in deze titel voorziene mededelingen, kennisgevingen alsmede
      van de in deze titel voorziene te geven beslissingen op bezwaarschriften. Indien [artikel 80][ref1] toepassing
      heeft gevonden stelt het bestuur van de Dienst tevens de vorm vast van de in dat artikel bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel80
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '80'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '83'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de bijhouding van het net van coördinaatpunten, bedoeld in
      [artikel 52, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel52
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '52'
        hoofdstuk: '3'
  - number: '85.1'
    text: |-
      De registratie voor schepen, bedoeld in [artikel 3, eerste lid, onderdeel d][ref1], wordt op een zodanige wijze
      gehouden en bijgehouden, dat zij ten minste door middel van de naam van de eigenaar en beperkt gerechtigde
      en door middel van het brandmerk van het schip, bedoeld in [artikel 21, eerste lid, onderdeel c][ref2], de
      raadpleegbaarheid mogelijk doet zijn van de openbare registers, bedoeld in [artikel 8, eerste lid][ref3], voorzover
      het gaat om stukken betreffende schepen en rechten waaraan die schepen zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '85.2'
    text: 'De registratie voor schepen bevat ten aanzien van elk daarin te boek staand schip de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.a
    text: |-
      de naam, voornamen, geboortedatum, wettelijke woonplaats of verblijfplaats, daaronder begrepen het adres en de
      burgerlijke staat dan wel, indien het een rechtspersoon betreft, de rechtsvorm, naam en wettelijke woonplaats,
      van degenen die volgens de bij de Dienst bekende gegevens eigenaar dan wel beperkt gerechtigde met betrekking
      tot schepen zijn, alsmede in geval van medeëigendom of een rederij, het aandeel van ieder der deelgenoten,
      onderscheidenlijk reders;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.b
    text: |-
      ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld in onderdeel a: een verwijzing naar alle op hen
      betrekking hebbende in de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], ingeschreven of geboekte
      stukken, voorzover die stukken betreffen schepen en rechten waaraan die schepen zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 85.2.c
    text: |-
      de wettelijke benaming van de beperkte rechten waaraan de schepen onderworpen zijn, en van de beslagen die op de
      schepen of beperkte rechten zijn gelegd, als ook of die schepen of beperkte rechten onder bewind staan, alsmede of
      ten aanzien daarvan zijn ingeschreven:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.c.1°
    text: |-
      een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 85.2.c.2°
    text: |-
      een afwijkend beding, als bedoeld in [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref1] onder
      vermelding van het scheepstoebehoren ten aanzien waarvan het afwijkend beding is gemaakt, en


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: 85.2.c.3°
    text: |-
      voorrechten, genoemd in [artikel 211][ref1] dan wel in [artikel 821 van Boek 8 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '821'
  - number: 85.2.d
    text: |-
      de naam en het brandmerk, bedoeld in [artikel 21, eerste lid, onder c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 85.2.e
    text: de dagtekening der teboekstelling;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.f
    text: |-
      het type, de inrichting, het materiaal waarvan de romp is gemaakt, jaar en plaats van de bouw en, voor zover het
      een schip met mechanische voortstuwing betreft, ook al betreft het slechts een hulpmotor, het aantal motoren, het
      type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met aanduiding van de plaats waar
      dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.g
    text: |-
      indien het een binnenschip betreft, het laadvermogen in tonnen van 1.000 kilogram of de verplaatsing in kubieke
      meters, zoals vermeld in de meetbrief, dan wel, indien het een zeeschip of een zeevissersschip betreft, de bruto-
      inhoud in kubieke meters of de bruto-tonnage, zoals vermeld in de meetbrief; ingeval geen meetbrief is vereist,
      het laadvermogen, de verplaatsing, de bruto-inhoud dan wel de bruto-tonnage, zoals kan worden vastgesteld aan de
      hand van de verstrekte gegevens; zolang een schip in aanbouw is, wordt het laadvermogen, de verplaatsing, de bruto-
      inhoud dan wel de bruto-tonnage geschat;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.h
    text: |-
      ten aanzien van elk schip een verwijzing naar alle daarop betrekking hebbende, in de openbare registers,
      bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken en in het register van
      voorlopige aantekeningen geboekte stukken, alsmede door de Dienst verkregen inlichtingen als bedoeld in
      [artikel 87, eerste lid, onder b en c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel87
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '87'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 85.2.i
    text: |-
      ten aanzien van elke gekozen woonplaats de vermelding ervan, alsmede een verwijzing naar alle daarop betrekking
      hebbende in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken
      betreffende schepen en rechten waaraan die schepen zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 85.2.j
    text: elk register waarin het schip heeft te boek gestaan;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.k
    text: |-
      voorzover op een schip een recht van hypotheek rust, ten minste de gegevens, genoemd in
      [artikel 48, tweede lid, onderdeel g][ref1], met dien verstande dat in onderdeel 2° voor «de aard van de onroerende
      zaak» en «gemeenschap» wordt gelezen «het type van het schip», respectievelijk «mede-eigendom of rederij»;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 85.2.l
    text: |-
      gegevens die worden opgenomen op grond van andere wettelijke bepalingen of op grond van bij regeling van Onze
      Minister gestelde regels;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.m
    text: |-
      met betrekking tot een ingeschreven notariële akte en notariële verklaring betreffende schepen en rechten waaraan
      die schepen zijn onderworpen: de naam en plaats van vestiging van de notaris door wie of door wiens plaatsvervanger
      de akte is verleden, onderscheidenlijk de verklaring is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: 85.2.n
    text: |-
      ten aanzien van een ingeschreven stuk voorzover betreffend schepen en rechten waaraan die schepen zijn onderworpen:
      dag, uur en minuut waarop de aanbieding ervan ter inschrijving plaatsvond.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: '85.3'
    text: |-
      De in het tweede lid bedoelde gegevens omtrent en de bescheiden betreffende schepen waarvan de teboekstelling is
      doorgehaald, blijven deel uitmaken van de registratie voor schepen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: '85.4'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de wijze waarop de registratie voor schepen wordt gehouden.
      Het bestuur van de Dienst kan daarbij bepalen dat ten aanzien van het gebruik van hoofd- en kleine letters
      en diakritische tekens, het al dan niet aan elkaar schrijven van letters en de schrijfwijze van adressen geen
      overeenstemming behoeft te bestaan tussen de bij de Dienst bekend gestelde schrijfwijze der in de registratie voor
      schepen te vermelden gegevens en de wijze van vermelding van die gegevens daarin.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel85
  - number: '86'
    text: Bijwerking vindt plaats als bijhouding.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel86
  - number: '87.1'
    text: |-
      Bijhouding vindt, onverminderd het bepaalde bij of krachtens deze of een andere wet, plaats op grond van
      veranderingen, voor zover deze blijken uit:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: 87.1.a
    text: |-
      in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken, voorzover
      die betrekking hebben op schepen en rechten waaraan die schepen zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 87.1.b
    text: |-
      inlichtingen omtrent het overlijden van personen die als eigenaar of beperkt gerechtigde met betrekking tot een
      schip in de registratie voor schepen staan vermeld, voor zover althans deze inlichtingen afkomstig zijn van door
      Onze Minister aangewezen publiekrechtelijke rechtspersonen of andere lichamen aan wie een deel van de overheidstaak
      is opgedragen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: 87.1.c
    text: |-
      inlichtingen omtrent de wettelijke woonplaats, daaronder begrepen het adres, van personen die als eigenaar of
      beperkt gerechtigde met betrekking tot een schip in de registratie voor schepen staan vermeld, voor zover althans
      deze inlichtingen van die personen zelf afkomstig zijn dan wel van door Onze Minister aangewezen publiekrechtelijke
      rechtspersonen of andere lichamen aan wie een deel van de overheidstaak is opgedragen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: '87.2'
    text: |-
      Bijhouding van de registratie voor schepen vindt ook plaats met betrekking tot voorlopige aantekeningen terzake van
      stukken betreffende schepen en rechten waaraan die schepen zijn onderworpen en doorhalingen daarvan in het register
      van voorlopige aantekeningen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: '87.3'
    text: |-
      [ Artikel 54, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '87.4'
    text: |-
      De wijze van bijhouding wordt, onverminderd het bepaalde bij of krachtens deze of een andere wet, bij of krachtens
      algemene maatregel van bestuur geregeld, in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: 87.4.a
    text: dat na een inschrijving de bijhouding terstond aanvangt, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: 87.4.b
    text: |-
      dat in de registratie wordt vermeld op grond van welk ingeschreven of ander stuk een bijhouding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
  - number: '87.5'
    text: |-
      [ Artikel 72][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel72
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '2'
  - number: 87a
    text: |-
      Op beschikkingen inzake de bijhouding, genomen krachtens [hoofdstuk 5][ref1] van deze wet, zijn de
      [artikelen 4:7][ref2], [4:8][ref3] en [3:40 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 87b.1
    text: |-
      Belanghebbenden kunnen tegen beschikkingen inzake de bijwerking, genomen krachtens deze titel, bezwaar maken nadat
      zij is voltooid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87b
  - number: 87b.2
    text: |-
      Geen bezwaar staat open tegen bijhoudingen als bedoeld in [artikel 87, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel87
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '87'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 87b.3
    text: |-
      De [artikelen 56][ref1], [56][ref2], en [56][ref3] zijn van overeenkomstige toepassing, met dien verstande dat
      het beroep moet worden ingesteld bij de rechtbank binnen welker rechtsgebied het kantoor van de Dienst, waar het
      desbetreffende schip te boek staat, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56d
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel56e
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56d
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 56e
        hoofdstuk: '4'
        afdeling: '1'
  - number: '88.1'
    text: |-
      Ingeval de bijhouding waartoe een ingeschreven stuk aanleiding geeft, met betrekking tot een schip is voltooid en
      heeft geleid tot wijziging of aanvulling van de in de registratie voor schepen vermeld staande gegevens betreffende
      de eigenaars of beperkt gerechtigden, dan wel de naam van het schip waarop het ingeschreven feit betrekking heeft,
      wordt het resultaat van die bijhouding door toezending of uitreiking aan belanghebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel88
  - number: '88.2'
    text: |-
      [ Artikel 58, tweede lid][ref1], is voorts van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '89.1'
    text: |-
      Ingeval blijkt dat in een stuk dat is ingeschreven in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], één of meer der in dat stuk vermelde gegevens, als bedoeld in
      [artikel 21, eerste lid][ref2], onverenigbaar zijn met de in de registratie voor schepen vermeld staande gegevens
      ten aanzien van het schip waarop het in te schrijven feit betrekking heeft, vindt [artikel 88][ref3] slechts
      toepassing voor zover bijhouding mogelijk is ingevolge de op grond van het volgende lid vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel88
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '88'
        hoofdstuk: '5'
        afdeling: '2'
  - number: '89.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld in hoeverre en op welke wijze bijhouding
      plaatsvindt, indien een geval, als bedoeld in het eerste lid zich voordoet, in dier voege dat de bijhouding
      waartoe het ingeschreven stuk aanleiding geeft, eerst wordt voltooid nadat een stuk tot verbetering, als bedoeld
      in [artikel 42][ref1], is ingeschreven in de in [artikel 8, eerste lid, onderdeel a][ref2], bedoelde openbare
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '89.3'
    text: |-
      [ Artikel 59, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel59
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '91.1'
    text: |-
      Op de bijhouding op grond van inlichtingen omtrent het overlijden van personen die als eigenaar of beperkt
      gerechtigde met betrekking tot een schip in de registratie voor schepen staan vermeld, is [artikel 64][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel64
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '91.2'
    text: |-
      Op de bijhouding op grond van inlichtingen omtrent de wettelijke woonplaats, daaronder begrepen het adres, van
      personen die als eigenaar of beperkt gerechtigde met betrekking tot een schip in de registratie voor schepen staan
      vermeld, is [artikel 65][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel65
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: '91.3'
    text: |-
      Het bestuur van de Dienst stelt de vorm vast van de in deze titel voorziene kennisgevingen en van de te geven
      beslissingen op bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel91
  - number: '92.1'
    text: |-
      De registratie voor luchtvaartuigen, bedoeld in [artikel 3, eerste lid, onderdeel e][ref1], wordt op een zodanige
      wijze gehouden en bijgehouden, dat zij ten minste door middel van de naam van de eigenaar en beperkt gerechtigde,
      het inschrijvingskenmerk, bedoeld in [artikel 22, eerste lid, onderdeel a][ref2], en het boekingsnummer van een
      luchtvaartuig, bedoeld in [artikel 22, eerste lid, onderdeel d][ref3], de raadpleegbaarheid mogelijk doet zijn
      van de openbare registers, bedoeld in [artikel 8, eerste lid][ref4], voorzover het gaat om stukken betreffende
      luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '92.2'
    text: |-
      De registratie voor luchtvaartuigen bevat ten aanzien van elk daarin te boek staand luchtvaartuig de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.a
    text: |-
      de naam, voornamen, geboortedatum, wettelijke woonplaats met adres en de burgerlijke staat dan wel, indien het
      een rechtspersoon betreft, de rechtsvorm, naam en wettelijke woonplaats, van degenen die volgens de bij de Dienst
      bekende gegevens eigenaar dan wel beperkt gerechtigde met betrekking tot luchtvaartuigen zijn, en in geval van een
      gemeenschap het aandeel van ieder der deelgenoten;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.b
    text: |-
      ten aanzien van een eigenaar en beperkt gerechtigde als bedoeld in onderdeel a: een verwijzing naar alle op hen
      betrekking hebbende in de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], ingeschreven stukken of
      geboekte stukken, voorzover die stukken betreffen luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn
      onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 92.2.c
    text: |-
      de wettelijke benaming van de beperkte rechten waaraan de luchtvaartuigen onderworpen zijn, en van de beslagen die
      op die luchtvaartuigen of beperkte rechten zijn gelegd, als ook of die luchtvaartuigen of beperkte rechten onder
      bewind staan, alsmede of ten aanzien daarvan zijn ingeschreven:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.c.1°
    text: |-
      een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 92.2.c.2°
    text: |-
      voorrechten als bedoeld in [artikel 1317 van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1317
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1317'
  - number: 92.2.d
    text: |-
      het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld in
      [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 92.2.e
    text: |-
      de naam en woonplaats van de fabrikant, het type, jaar en plaats van de bouw, het serienummer, zo het luchtvaartuig
      dat heeft, met de aanduiding van de plaats waar dit nummer is aangebracht, het aantal motoren, het type, vermogen
      en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met de aanduiding van de plaats waar dit nummer
      is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.f
    text: de maximaal toegelaten startmassa;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.g
    text: |-
      de dagtekening der teboekstelling, het boekingsnummer, bedoeld in [artikel 22, eerste lid, onder d][ref1], en
      indien het luchtvaartuig een naam voert, de naam ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel22
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 92.2.h
    text: |-
      ten aanzien van elk luchtvaartuig een verwijzing naar alle daarop betrekking hebbende, in de openbare
      registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken en in het register
      van voorlopige aantekeningen geboekte stukken, alsmede door de Dienst verkregen inlichtingen als bedoeld in
      [artikel 94, eerste lid, onder b en c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel94
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '94'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 92.2.i
    text: |-
      ten aanzien van elke gekozen woonplaats de vermelding ervan, alsmede een verwijzing naar alle daarop betrekking
      hebbende in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken
      betreffende luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 92.2.j
    text: elk register waarin het luchtvaartuig heeft te boek gestaan;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.k
    text: |-
      voorzover op een luchtvaartuig een recht van hypotheek rust, ten minste de gegevens, genoemd in
      [artikel 48, tweede lid, onderdeel g][ref1], met dien verstande dat in onderdeel 2° voor «de aard van de onroerende
      zaak» wordt gelezen «het type van het luchtvaartuig»;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 92.2.l
    text: |-
      gegevens die worden opgenomen op grond van andere wettelijke bepalingen of op grond van bij regeling van Onze
      Minister gestelde regels;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.m
    text: |-
      met betrekking tot een ingeschreven notariële akte en notariële verklaring betreffende luchtvaartuigen en rechten
      waaraan die luchtvaartuigen zijn onderworpen: de naam en plaats van vestiging van de notaris door wie of door wiens
      plaatsvervanger de akte is verleden, onderscheidenlijk de verklaring is opgemaakt;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: 92.2.n
    text: |-
      ten aanzien van een ingeschreven stuk voorzover betreffend luchtvaartuigen en rechten waaraan die luchtvaartuigen
      zijn onderworpen: dag, uur en minuut waarop de aanbieding ervan ter inschrijving plaatsvond.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
  - number: '92.3'
    text: |-
      [ Artikel 85, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: '93'
    text: Bijwerking vindt plaats als bijhouding.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel93
  - number: '94.1'
    text: |-
      Bijhouding vindt, onverminderd het bepaalde bij of krachtens deze of een andere wet, plaats op grond van
      veranderingen, voor zover deze blijken uit:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: 94.1.a
    text: |-
      in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], ingeschreven stukken, voorzover
      die betrekking hebben op luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 94.1.b
    text: |-
      inlichtingen omtrent het overlijden van personen die als eigenaar of beperkt gerechtigde met betrekking tot een
      luchtvaartuig in de registratie voor luchtvaartuigen staan vermeld, voor zover althans deze inlichtingen afkomstig
      zijn van door Onze Minister aangewezen publiekrechtelijke rechtspersonen of andere lichamen aan wie een deel van de
      overheidstaak is opgedragen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: 94.1.c
    text: |-
      inlichtingen omtrent de wettelijke woonplaats, daaronder begrepen het adres, van personen die als eigenaar of
      beperkt gerechtigde met betrekking tot een luchtvaartuig in de registratie voor luchtvaartuigen staan vermeld,
      voor zover althans deze inlichtingen van die personen zelf afkomstig zijn dan wel van door Onze Minister aangewezen
      publiekrechtelijke rechtspersonen of andere lichamen aan wie een deel van de overheidstaak is opgedragen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: '94.2'
    text: |-
      Bijhouding van de registratie voor luchtvaartuigen vindt ook plaats met betrekking tot voorlopige aantekeningen
      terzake van stukken betreffende luchtvaartuigen en rechten waaraan die luchtvaartuigen zijn onderworpen en
      doorhalingen daarvan in het register van voorlopige aantekeningen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: '94.3'
    text: |-
      [ Artikel 54, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel54
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '54'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '94.4'
    text: |-
      De wijze van bijhouding wordt, onverminderd het bepaalde bij of krachtens deze of andere wet, bij of krachtens
      algemene maatregel van bestuur geregeld, in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: 94.4.a
    text: dat na een inschrijving de bijhouding terstond aanvangt, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: 94.4.b
    text: |-
      dat in de registratie wordt vermeld op grond van welk ingeschreven of ander stuk een bijhouding heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
  - number: '94.5'
    text: |-
      [ Artikel 72][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel72
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '6'
        afdeling: '2'
  - number: 94a
    text: |-
      Op beschikkingen inzake de bijhouding, genomen krachtens [hoofdstuk 6][ref1] van deze wet, zijn de
      [artikelen 4:7][ref2], [4:8][ref3] en [3:40 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 94b.1
    text: |-
      Belanghebbenden kunnen tegen beschikkingen inzake de bijwerking, genomen krachtens deze titel, bezwaar maken nadat
      zij is voltooid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94b
  - number: 94b.2
    text: |-
      Geen bezwaar staat open tegen bijhoudingen als bedoeld in [artikel 94, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel94
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '94'
        hoofdstuk: '6'
        afdeling: '1'
  - number: 94b.3
    text: |-
      De [artikelen 56][ref1], [56][ref2], en [56][ref3] zijn van overeenkomstige toepassing, met dien verstande dat
      het beroep moet worden ingesteld bij de rechtbank binnen welker rechtsgebied het kantoor van de Dienst, waar het
      desbetreffende luchtvaartuig te boek staat, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56d
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel56e
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel94b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56d
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 56e
        hoofdstuk: '4'
        afdeling: '1'
  - number: '95.1'
    text: |-
      Ingeval de bijhouding waartoe een ingeschreven stuk aanleiding geeft, met betrekking tot een luchtvaartuig
      is voltooid en heeft geleid tot wijziging of aanvulling van de in de registratie voor luchtvaartuigen vermeld
      staande gegevens betreffende de eigenaars of beperkt gerechtigden, dan wel de naam van het luchtvaartuig waarop
      het ingeschreven feit betrekking heeft, wordt het resultaat van die bijhouding door toezending of uitreiking aan
      belanghebbenden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel95
  - number: '95.2'
    text: |-
      [Artikel 58, tweede lid][ref1], is voorts van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '96.1'
    text: |-
      Ingeval blijkt dat in een stuk, dat is ingeschreven in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], één of meer der in dat stuk vermelde gegevens, als bedoeld in
      [artikel 22, eerste lid][ref2], onverenigbaar zijn met de in de registratie voor luchtvaartuigen vermeld
      staande gegevens ten aanzien van het luchtvaartuig waarop het in te schrijven feit betrekking heeft, vindt
      [artikel 95][ref3] slechts toepassing voor zover bijhouding mogelijk is ingevolge de op grond van het volgende lid
      vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel95
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '22'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '95'
        hoofdstuk: '6'
        afdeling: '2'
  - number: '96.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld in hoeverre en op welke wijze bijhouding
      plaatsvindt indien een geval, als bedoeld in het eerste lid, zich voordoet, in dier voege dat de bijhouding
      waartoe het ingeschreven stuk aanleiding geeft, eerst wordt voltooid nadat een stuk tot verbetering, als bedoeld
      in [artikel 42][ref1], is ingeschreven in de in [artikel 8, eerste lid, onderdeel a][ref2], bedoelde openbare
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '42'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '96.3'
    text: |-
      [Artikel 59, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel59
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '98.1'
    text: |-
      Op de bijhouding op grond van inlichtingen omtrent het overlijden van personen die als eigenaar of beperkt
      gerechtigde met betrekking tot een luchtvaartuig in de registratie voor luchtvaartuigen staan vermeld, is
      [artikel 64][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel64
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: '98.2'
    text: |-
      Op de bijhouding op grond van inlichtingen omtrent de wettelijke woonplaats, daaronder begrepen het adres, van
      personen die als eigenaar of beperkt gerechtigde met betrekking tot een luchtvaartuig in de registratie voor
      luchtvaartuigen staan vermeld, is [artikel 65][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel65
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '2'
  - number: '98.3'
    text: |-
      Het bestuur van de Dienst stelt de vorm vast van de in deze titel voorziene kennisgevingen en van de te geven
      beslissingen op bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98
  - number: 98a.1
    text: |-
      De geografische gegevens, bedoeld in [artikel 3, eerste lid, onderdeel f][ref1], hebben betrekking op de volgende
      objecten of verschijnselen met de daarbij onderscheiden kenmerken:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 98a.1.a
    text: 'bebouwing: type, functie, hoogte, status en naam;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.b
    text: |-
      wegen, straten en paden: wegtype, hoofdverkeersgebruik, fysiek voorkomen, verhardingsbreedte, verhardingstype,
      aantal rijstroken, status en naam of nummer;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.c
    text: 'railverbindingen: verkeersgebruik, fysiek voorkomen, spoorbreedte, aantal sporen, status en bijzondere kenmerken;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.d
    text: 'wateren: watertype, breedteklasse, hoofdafwatering, gebruik, fysiek voorkomen, stroomrichting, status en naam;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.e
    text: 'terreinen: landgebruik en fysiek voorkomen;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.f
    text: 'inrichtingselementen: type, functie en naam of nummer;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.g
    text: 'reliëf: terreinhoogte, hoogtelijnen, dieptelijnen en reliëfvorm;'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.h
    text: 'getrianguleerde punten: fysiek voorkomen, en'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.1.i
    text: 'gebieden: administratieve, functionele en geografische gebieden en beheersgebieden.'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot aanwijzing van andere objecten,
      verschijnselen of kenmerken dan die genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.3
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de uitwerking van de kenmerken,
      genoemd in het eerste lid, en bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.4
    text: |-
      Bij regeling van het bestuur van de Dienst worden regels gesteld met betrekking tot de wijze waarop geografische
      gegevens worden gehouden en bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: 98a.5
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de voorwaarden waaronder geografische
      gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel98a
  - number: '99.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], en geeft
      hij af of zendt toe voor eensluidend gewaarmerkte afschriften of uittreksels van de in die registers ingeschreven
      of geboekte stukken, en getuigschriften omtrent het al dan niet bestaan van inschrijvingen of voorlopige
      aantekeningen betreffende een registergoed of een persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '99.2'
    text: |-
      Indien met betrekking tot een registergoed in het register van voorlopige aantekeningen, bedoeld in
      [artikel 8, eerste lid, onderdeel b][ref1], voorlopige aantekeningen zijn gesteld die nog niet zijn doorgehaald,
      wordt op de getuigschriften inzake dat registergoed melding gemaakt van die nog niet doorgehaalde voorlopige
      aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '100.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de kadastrale registratie, de door de Dienst gehouden kadastrale
      kaarten en de daaraan ten grondslag liggende bescheiden, en geeft hij voor eensluidend gewaarmerkte afschriften of
      uittreksels daarvan af of zendt die toe.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel100
  - number: '100.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin de
      verstrekking van inlichtingen uit de kadastrale kaarten en de daaraan ten grondslag liggende bescheiden na een
      verzoek daartoe in papieren vorm te velde kan plaatsvinden, en met betrekking tot de daarbij in acht te nemen
      regels.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel100
  - number: '100.3'
    text: Desgevraagd verstrekt de Dienst inlichtingen over het net van coördinaatpunten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel100
  - number: '101.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de registratie voor schepen en van andere documenten betreffende schepen
      die niet zijn ingeschreven in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], en
      geeft hij voor eensluidend gewaarmerkte afschriften of uittreksels daarvan af of zendt die toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '101.2'
    text: |-
      De Dienst kan desgevraagd een verklaring afgeven, inhoudende dat een schip ten aanzien waarvan bij het
      desbetreffende verzoek door de betrokkene ten minste zodanige gegevens worden bekend gesteld dat de identiteit van
      het schip voldoende vaststaat, niet te boek staat noch heeft te boek gestaan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel101
  - number: '102.1'
    text: |-
      Desgevraagd verleent de Dienst inzage van de registratie voor luchtvaartuigen en van andere
      documenten betreffende luchtvaartuigen die niet zijn ingeschreven in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], en geeft hij voor eensluidend gewaarmerkte afschriften of uittreksels
      daarvan af of zendt die toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '102.2'
    text: |-
      De Dienst kan desgevraagd een verklaring afgeven, inhoudende dat een luchtvaartuig ten aanzien waarvan bij het
      desbetreffende verzoek door de betrokkene ten minste het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld
      in [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1] worden bekend gesteld, niet te boek staat noch heeft te
      boek gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 102a
    text: |-
      Desgevraagd verstrekt de Dienst inlichtingen over de geografische gegevens, bedoeld in
      [artikel 3, eerste lid, onderdeel f][ref1], en verleent de Dienst inzage van de daaraan ten grondslag liggende
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '103.1'
    text: |-
      Desgevraagd geeft de Dienst een verklaring af dat sedert het tijdstip waarop een getuigschrift, afschrift of
      uittreksel als bedoeld in de [artikelen 99 tot en met 102][ref1] door hem is afgegeven, in de daarin vermelde
      gegevens geen wijziging is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '103.2'
    text: |-
      Het eerste lid is niet van toepassing op afschriften en uittreksels van de door de Dienst gehouden kadastrale
      kaarten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel103
  - number: '104.1'
    text: |-
      Onverminderd [artikel 100, eerste lid][ref1], verstrekt de Dienst desgevraagd aan gemeenten en andere
      publiekrechtelijke lichamen voor hun grondgebied een afschrift van de kadastrale registratie en de door de Dienst
      gehouden kadastrale kaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel100
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '104.2'
    text: |-
      Door het bestuur van de Dienst worden in overleg met betrokkenen regels gesteld met betrekking tot de wijze waarop
      door de Dienst, al of niet periodiek, grote hoeveelheden gegevens uit de kadastrale registratie aan gemeenten en
      andere publiekrechtelijke lichamen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel104
  - number: '104.3'
    text: |-
      Op de verstrekking van gegevens, bedoeld in het eerste en tweede lid, zijn de [artikelen 108 tot en met 110][ref1]
      van overeenkomstige toepassing, met dien verstande dat bij de vaststelling van de hoogte van het verschuldigde
      kadastraal recht rekening wordt gehouden met besparingen die voortvloeien uit het feit dat grote hoeveelheden
      gegevens tegelijkertijd worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel108
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '108'
        hoofdstuk: '7'
  - number: '105.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de voorwaarden waaronder
      en de wijze waarop een permanente aansluiting kan worden verkregen op, voorzover in elektronische vorm gehouden,
      de openbare registers voor registergoederen, de kadastrale registratie, de door de Dienst gehouden kaarten, de
      registratie voor schepen en de registratie voor luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel105
  - number: '105.2'
    text: |-
      Het bestuur van de Dienst kan aan gemeenten die beschikken over een permanente aansluiting als bedoeld in het
      eerste lid, desgevraagd de bevoegdheid geven daaruit gegevens aan derden te verschaffen. Bij algemene maatregel van
      bestuur worden regels gesteld met betrekking tot de voorwaarden waaronder een bevoegdheid als bedoeld in de eerste
      zin wordt verleend en de gevallen waarin de verlening van die bevoegdheid kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel105
  - number: '106.1'
    text: |-
      De bewaarder is belast met de verstrekking van de inlichtingen, bedoeld in de [artikelen 99][ref1],
      [100, eerste lid][ref2], voorzover betreffend de kadastrale registratie, en [101][ref3], [102][ref4] en
      [103][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel102
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel103
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '101'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '102'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '103'
        hoofdstuk: '7'
        afdeling: '1'
  - number: '106.2'
    text: |-
      Het bestuur van de Dienst kan andere personen behorend tot het personeel van de Dienst dan de bewaarder belasten
      met de verstrekking van de inlichtingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel106
  - number: '106.3'
    text: |-
      Het bestuur van de Dienst wijst ambtenaren aan die belast zijn met de verstrekking van de inlichtingen, bedoeld in
      [artikel 100][ref1], met uitzondering van inlichtingen uit de kadastrale registratie, en [artikel 102a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel102a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '100'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 102a
        hoofdstuk: '7'
        afdeling: '1'
  - number: '107'
    text: 'Het bestuur van de Dienst stelt vast:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
  - number: 107.a
    text: |-
      de vorm van de afschriften, uittreksels, getuigschriften en verklaringen, bedoeld in de
      [artikelen 99 tot en met 102a][ref1], alsmede de gevallen waarin de Dienst getuigschriften opmaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.b
    text: |-
      de wijze en plaats van raadpleging van de openbare registers voor registergoederen, de kadastrale registratie,
      de door de Dienst gehouden kadastrale kaarten en de daaraan ten grondslag liggende bescheiden, de registratie
      voor schepen en andere documenten betreffende schepen, de registratie voor luchtvaartuigen en andere documenten
      betreffende luchtvaartuigen, de geografische gegevens en de aan die gegevens ten grondslag liggende bescheiden;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
  - number: 107.c
    text: |-
      de vorm van de verklaring, bedoeld in [artikel 103][ref1], en de wijze waarop de afschriften, uittreksels en
      getuigschriften, bedoeld in dat artikel, worden voorzien van die verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel103
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '103'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.d
    text: |-
      de wijze waarop de waarmerking, bedoeld in de [artikelen 99 tot en met 102][ref1], van in papieren vorm te
      verstrekken afschriften, uittreksels en getuigschriften als bedoeld in de [artikelen 99 tot en met 102][ref2]
      plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.e
    text: |-
      de wijze waarop in elektronische vorm te verstrekken getuigschriften, afschriften, uittreksels en verklaringen als
      bedoeld in de [artikelen 99 tot en met 102][ref1] worden gewaarmerkt, waartoe zij ten minste worden voorzien van
      een elektronische handtekening van de bewaarder en welke waarmerking wat betreft afschriften en uittreksels mede
      omvat de waarmerking voor eensluidendheid;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107.f
    text: de wijze waarop inlichtingen over het net van coördinaatpunten worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
  - number: 107.g
    text: |-
      de wijze waarop inlichtingen over geografische gegevens als bedoeld in [artikel 3, eerste lid, onderdeel f][ref1],
      worden verstrekt en de wijze waarop inzage wordt verleend van de aan die geografische gegevens ten grondslag
      liggende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 107a.1
    text: |-
      [Artikel 35 van de Wet bescherming persoonsgegevens][ref1] is niet van toepassing ingeval de verstrekking van
      inlichtingen ingevolge deze titel persoonsgegevens betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: 107a.2
    text: |-
      Een beslissing tot afwijzing van een verzoek om inlichtingen ingevolge deze titel, geldt als een besluit in de
      zin van de [Algemene wet bestuursrecht][ref1]. De [artikelen 56b, eerste lid][ref2], [56c tot en met 56e][ref3] en
      [58, eerste en tweede lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 107b
    text: |-
      Ter bescherming van de persoonlijke levenssfeer van personen die in de kadastrale registratie, de registratie voor
      schepen en in de registratie voor luchtvaartuigen vermeld staan, kunnen bij of krachtens algemene maatregel van
      bestuur voor daarbij aangewezen soort of soorten van persoonsgegevens beperkingen worden vastgesteld ten aanzien
      van de verstrekking van inlichtingen als bedoeld in de [artikelen 99 tot en met 107][ref1]. Daarbij kunnen tevens
      regels worden vastgesteld voor de behandeling van verzoeken tot afscherming van persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
        hoofdstuk: '7'
        afdeling: '1'
  - number: 107c
    text: |-
      De Dienst kan slechts een verzameling van persoonsgegevens verstrekken in een zodanige vorm dat daarop rechtstreeks
      een geautomatiseerde verwerking mogelijk is ten aanzien van een op voorhand onbepaalde groep van personen, indien
      dit voortvloeit uit een van de doeleinden, genoemd in [artikel 2a][ref1], de aanvrager deze gegevens kan verwerken
      op één van de gronden, bedoeld in [artikel 8, onder c tot en met f, van de Wet bescherming persoonsgegevens][ref2]
      en zulks is toegestaan bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel107c
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '8'
  - number: '108.1'
    text: |-
      Onder de naam van kadastraal recht zijn betrokkenen aan de Dienst wegens het verrichten door de Dienst van
      werkzaamheden ter uitvoering van de taken, bedoeld in [artikel 3][ref1], vergoedingen verschuldigd overeenkomstig
      de bij regeling van Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '108.2'
    text: |-
      De tarieven van het kadastraal recht worden tot geen hoger bedrag vastgesteld dan wordt vereist tot dekking van de
      ten laste van de Dienst komende kosten van het verrichten van de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel108
  - number: '108.3'
    text: |-
      Het bestuur van de Dienst stelt regelen vast omtrent de wijze waarop het kadastraal recht wordt voldaan of
      verrekend.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel108
  - number: '109'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de gevallen waarin en de
      verrichtingen ten aanzien waarvan in die gevallen geen kadastraal recht is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel109
  - number: '110'
    text: |-
      Het bestuur van de Dienst is bevoegd om in bijzondere gevallen vrijstelling, vermindering of teruggaaf van
      kadastraal recht te verlenen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel110
  - number: 110a
    text: |-
      Op beschikkingen, genomen krachtens hoofdstuk 8 van deze wet, zijn de [artikelen 4:7][ref1], [4:8][ref2] en
      [3:40 van de Algemene wet bestuursrecht][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '111.1'
    text: |-
      De Dienst is bevoegd om, anders dan ingevolge de bepalingen omtrent de bijwerking, bedoeld in [hoofdstuk 4][ref1],
      in door Onze Minister te bepalen gevallen de kadastrale aanduiding van onroerende zaken en appartementsrechten te
      wijzigen en de grootte van percelen opnieuw vast te stellen. Het bestuur van de Dienst stelt regelen vast omtrent
      de wijze waarop wijzigingen, als bedoeld in de eerste zin, in de kadastrale registratie en op de kadastrale kaarten
      worden weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004541
        hoofdstuk: '4'
  - number: '111.2'
    text: |-
      Indien de Dienst ambtshalve de kadastrale aanduiding van een onroerende zaak of van een appartementsrecht wijzigt,
      als bedoeld in het eerste lid, is [artikel 58, eerste lid][ref1], van overeenkomstige toepassing. Tegen deze
      wijziging staat generlei voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '111.3'
    text: |-
      Indien de Dienst ambtshalve de grootte van een perceel opnieuw vaststelt, als bedoeld in het eerste lid,
      en deze afwijkt van de in de kadastrale registratie vermeld staande grootte vóór de herberekening, zijn de
      [artikelen 58, eerste en tweede lid][ref1], [artikel 56][ref2], en de [artikelen 56][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
  - number: '112.1'
    text: |-
      Kennelijke misslagen, door de Dienst begaan bij de bijwerking van de kadastrale registratie, de
      door de Dienst gehouden kadastrale kaarten en de daaraan ten grondslag liggende bescheiden worden
      op verzoek van een belanghebbende dan wel ambtshalve hersteld. [Artikel 56b, eerste lid][ref1], de
      [artikelen 56c tot en met 56e][ref2] en [artikel 58, eerste en tweede lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel58
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 56b
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '112.2'
    text: |-
      Het verzoek wordt ingediend bij het kantoor van de Dienst, binnen welks kring de desbetreffende onroerende zaak
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel112
  - number: '112.3'
    text: |-
      In geval van gehele of gedeeltelijke toewijzing van het verzoek vindt het herstel van de bij de bijwerking begane
      misslag plaats overeenkomstig de beslissing op het verzoek.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel112
  - number: '112.4'
    text: |-
      Ingeval een gehele of gedeeltelijke toewijzing van het verzoek leidt tot verbetering, aanvulling of verwijdering
      van persoonsgegevens, is de Dienst verplicht om aan derden aan wie de persoonsgegevens daaraan voorafgaand
      zijn verstrekt, zo spoedig mogelijk kennis te geven van de verbetering, aanvulling of verwijdering, tenzij dit
      onmogelijk blijkt of een onevenredige inspanning kost.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel112
  - number: '112.5'
    text: De Dienst doet desgevraagd aan de verzoeker opgave van degenen aan wie hij de mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel112
  - number: '113.1'
    text: |-
      [Artikel 112, eerste lid][ref1], is ten aanzien van de registratie voor schepen van overeenkomstige toepassing,
      met dien verstande dat voor de zinsnede in [artikel 56][ref2], luidende "rechtbank, binnen welker rechtsgebied
      de onroerende zaak geheel of grotendeels is gelegen", wordt gelezen: de rechtbank, binnen welker rechtsgebied het
      kantoor van de Dienst, waar het desbetreffende schip te boek staat, is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '112'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
  - number: '113.2'
    text: |-
      Een verzoek tot herstel van kennelijke misslagen, door de Dienst begaan bij de bijwerking van de registratie voor
      schepen, wordt ingediend bij het kantoor van de Dienst, waar het desbetreffende schip te boek staat.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel113
  - number: '113.3'
    text: |-
      In geval van gehele of gedeeltelijke toewijzing van het verzoek vindt het herstel van de bij de bijwerking begane
      misslag plaats overeenkomstig de beslissing op het verzoek.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel113
  - number: '113.4'
    text: |-
      [Artikel 112, vierde en vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel112
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '112'
        hoofdstuk: '8'
  - number: '114.1'
    text: |-
      [Artikel 112, eerste lid][ref1], is ten aanzien van de registratie voor luchtvaartuigen van overeenkomstige
      toepassing, met dien verstande dat voor de zinsnede in [artikel 56][ref2], luidende "rechtbank, binnen welker
      rechtsgebied de onroerende zaak geheel of grotendeels is gelegen", wordt gelezen: de rechtbank, binnen welker
      rechtsgebied het kantoor van de Dienst, waar het desbetreffende luchtvaartuig te boek staat, is gelegen.
      [Artikel 113, tweede lid][ref3], is eveneens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56c
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel113
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '112'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56c
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '113'
        hoofdstuk: '8'
  - number: '114.2'
    text: |-
      Ingeval van een gehele of gedeeltelijke toewijzing van het verzoek zijn de
      [artikelen 112, vierde en vijfde lid][ref1], en [113, derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel113
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '112'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '113'
        hoofdstuk: '8'
  - number: '115'
    text: |-
      Het bestuur van de Dienst stelt de vorm vast van de in de [artikelen 111-114][ref1] voorziene mededelingen,
      kennisgevingen, de op verzoeken te geven beslissingen en de te geven beslissingen op bezwaarschriften


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel111
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '111'
        hoofdstuk: '8'
  - number: '116.1'
    text: |-
      Het bestuur van de Dienst stelt regels met betrekking tot de wijze waarop een vergissing, verzuim of een andere
      onregelmatigheid begaan door de bewaarder bij de inschrijving van stukken in de openbare registers, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], bij het stellen daarin van aantekeningen, bij de boeking van stukken in
      het register van voorlopige aantekeningen, of bij de doorhaling van voorlopige aantekeningen, wordt hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '116.2'
    text: |-
      Het bestuur van de Dienst stelt voorts regelen vast omtrent de wijze waarop kennelijke misslagen, door de Dienst
      begaan bij de bijwerking van de kadastrale registratie, de door de Dienst gehouden kadastrale kaarten en daaraan
      ten grondslag liggende bescheiden, worden hersteld.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel116
  - number: '116.3'
    text: |-
      Het tweede lid is voor zover mogelijk van overeenkomstige toepassing op het herstel van kennelijke misslagen, door
      de Dienst begaan bij de bijhouding van de registratie voor schepen en de registratie voor luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel116
  - number: '117.1'
    text: |-
      De Dienst is jegens betrokkenen aansprakelijk voor de schade die zij lijden, doordat in strijd met de wet een
      inschrijving is geweigerd of geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
  - number: '117.2'
    text: |-
      De Dienst is eveneens aansprakelijk voor alle verdere vergissingen, verzuimen, vertragingen of andere
      onregelmatigheden van zijn ambtenaren, gepleegd bij het houden van de registers of bij het opmaken of afgeven van
      afschriften, uittreksels en getuigschriften.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
  - number: '117.3'
    text: |-
      De Dienst is jegens betrokkenen aansprakelijk voor vergissingen, verzuimen of andere onregelmatigheden door de
      Dienst gepleegd bij het bijwerken van de kadastrale registratie, de door de Dienst gehouden kadastrale kaarten
      en de daaraan ten grondslag liggende bescheiden, alsmede van de registratie voor schepen en de registratie voor
      luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
  - number: '117.4'
    text: |-
      De Dienst is eveneens aansprakelijk voor alle vergissingen, verzuimen of andere onregelmatigheden van de
      Dienst, begaan bij het in papieren vorm en in elektronische vorm verstrekken van inlichtingen uit de kadastrale
      registratie, de door de Dienst gehouden kadastrale kaarten en de daaraan ten grondslag liggende bescheiden, alsmede
      uit de registratie voor schepen en de registratie voor luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
  - number: '117.5'
    text: |-
      De Dienst is aansprakelijk voor schade die is veroorzaakt door een vergissing, verzuim of een andere
      onregelmatigheid door hem begaan bij:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
  - number: 117.5.a
    text: |-
      het vervaardigen, verzamelen, houden en bijwerken van geografische gegevens en het uniform en consistent
      cartografisch weergeven van die gegevens, bedoeld in [artikel 3, eerste lid, onderdelen f en g][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 117.5.b
    text: |-
      het in papieren vorm en in elektronische vorm verstrekken van inlichtingen omtrent geografische gegevens, bedoeld
      in [artikel 3, eerste lid, onderdelen g en h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '117.6'
    text: |-
      Het bestuur van de Dienst kan regels stellen met betrekking tot aansprakelijkheid voor de gevolgen van storingen in
      de middelen die de Dienst gebruikt bij elektronische gegevensuitwisseling als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel117
  - number: '118.1'
    text: |-
      Door het bestuur van de Dienst te nemen beslissingen en te stellen regels als bedoeld in deze wet, worden geplaatst
      in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel118
  - number: '118.2'
    text: |-
      Het eerste lid is niet van toepassing op de beslissingen, bedoeld in de
      [artikelen 4a, eerste lid, derde zin][ref1], [6][ref2], [7, tweede tot en met vierde lid][ref3],
      [8, derde lid, derde zin][ref4], [9, derde, vierde en zesde lid][ref5], [9a][ref6],
      [11a, tweede lid, tweede zin, derde lid, tweede zin, en vierde lid, tweede zin][ref7],
      [11b, achtste lid][ref8], [11c, tweede en derde lid][ref9], [12, eerste lid, tweede zin][ref10],
      [13, eerste lid, tweede zin, en tweede lid, derde zin][ref11], [14][ref12], [17, eerste lid, onderdeel a][ref13],
      [46, derde lid, tweede zin][ref14], [82][ref15], [91, derde lid][ref16], [98, derde lid][ref17],
      [107, onderdelen a en c tot en met e][ref18], [110][ref19], en [115][ref20], en op de regels, bedoeld
      in de [artikelen 4a, derde lid, tweede zin][ref21], [8, tweede lid, eerste en vierde zin][ref22], en
      [17, eerste lid, onderdeel b][ref23].


