        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '35'
        hoofdstuk: '2'
