  - number: '2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent de wijze van kadastrale aanduiding
      van onroerende zaken en appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2
  - number: 2a
    text: 'De Dienst heeft, onverminderd het bepaalde in andere wettelijke voorschriften, als doeleinden:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.a
    text: 'de bevordering van de rechtszekerheid ten aanzien van registergoederen:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.a.1°
    text: in het rechtsverkeer;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.a.2°
    text: in het economisch verkeer;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.a.3°
    text: in het bestuurlijk verkeer tussen burgers en bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.b
    text: de bevordering van een doelmatige geo-informatie-infrastructuur;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.c
    text: |-
      een doelmatige informatievoorziening van de overheid ten behoeve van de goede vervulling van publiekrechtelijke
      taken en de nakoming van wettelijke verplichtingen door bestuursorganen, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: 2a.d
    text: ondersteuning en bevordering van de economische activiteiten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel2a
  - number: '3.1'
    text: 'De Dienst heeft, onverminderd het bepaalde in andere wettelijke voorschriften, tot taak:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.a
    text: het houden van openbare registers voor registergoederen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.b
    text: |-
      het houden en bijwerken van de kadastrale registratie en het vervaardigen, houden en bijwerken van kadastrale
      kaarten en daaraan ten grondslag liggende bescheiden;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.c
    text: het instandhouden van een net van coördinaatpunten;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.d
    text: het houden en bijwerken van een registratie voor schepen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.e
    text: het houden en bijwerken van een registratie voor luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.f
    text: |-
      het vervaardigen, verzamelen, houden en bijwerken van geografische gegevens en het uniform, consistent en
      landsdekkend cartografisch weergeven daarvan;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.g
    text: |-
      het in opdracht van Onze Minister van Defensie vervaardigen, verzamelen, houden en bijwerken van geografische
      gegevens ten behoeve van de krijgsmacht, het uniform en consistent overeenkomstig diens opdracht cartografisch
      weergeven van die gegevens en het aan Onze Minister van Defensie verstrekken van inlichtingen omtrent die gegevens;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.h
    text: |-
      het verstrekken van inlichtingen omtrent gegevens, die de Dienst heeft verkregen in het kader van de uitvoering van
      de taken, bedoeld in de onderdelen a tot en met f;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.i
    text: |-
      het bevorderen van de toegankelijkheid en de uitwisselbaarheid van gegevens als bedoeld in de onderdelen a tot en
      met f;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: 3.1.j
    text: |-
      het vervaardigen en verstrekken van informatie door verwerking van gegevens als bedoeld in de onderdelen a tot
      en met f, voorzover het vervaardigen en verstrekken van die informatie niet onverenigbaar zijn met de doeleinden,
      genoemd in [artikel 2a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
  - number: 3.1.k
    text: |-
      het in opdracht van een of meer van Onze ministers verrichten van werkzaamheden of het aan een of meer van Onze
      ministers verstrekken van informatie over gegevens als bedoeld in de onderdelen a tot en met f ter nakoming van
      op Nederland rustende internationale verplichtingen uit verdragen en overeenkomsten of daarop gebaseerde besluiten
      overeenkomstig die verdragen, overeenkomsten of besluiten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan de Dienst andere taken dan genoemd in het eerste lid worden
      opgedragen of marktactiviteiten worden toegestaan, voorzover die taken en marktactiviteiten verband houden met de
      taken, genoemd in het eerste lid, en niet onverenigbaar zijn met de doeleinden, genoemd in [artikel 2a][ref1]. Bij
      algemene maatregel van bestuur kan worden bepaald dat Onze Minister nadere regels kan stellen met betrekking tot de
      uitvoering van de bij die maatregel opgedragen taken of toegestane marktactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
  - number: 3a.1
    text: |-
      De Dienst verzamelt persoonsgegevens als bedoeld in
      [artikel 1, onderdeel a, van de Wet bescherming persoonsgegevens][ref1] voor de doeleinden, genoemd in
      [artikel 2a][ref2], onverminderd het bepaalde in andere wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
  - number: 3a.2
    text: |-
      De Dienst verwerkt geen persoonsgegevens in verband met de totstandbrenging of de instandhouding van een directe
      relatie tussen de Dienst of een derde en de betrokkene met het oog op werving voor commerciële of charitatieve
      doelen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3a
  - number: 3b
    text: |-
      Ten aanzien van verwerkingen als bedoeld in [artikel 3a][ref1] is het bestuur van de Dienst verantwoordelijke in de
      zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 3a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 3c.1
    text: 'Het bestuur van de Dienst stelt jaarlijks in de maand januari een overzicht op van:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3c.1.a
    text: 'de soorten van gegevens die zijn opgenomen in:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3c.1.a.1°
    text: de kadastrale registratie;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3c.1.a.2°
    text: de registratie voor schepen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3c.1.a.3°
    text: de registratie voor luchtvaartuigen, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3c.1.b
    text: de soorten van gegevens die worden weergegeven op de kadastrale kaarten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3c.2
    text: Het bestuur van de Dienst plaatst het overzicht, bedoeld in het eerste lid, in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3c
  - number: 3d.1
    text: |-
      Ter waarborging van de kwaliteit van de verwerking van gegevens die de Dienst heeft verkregen in het
      kader van de vervulling van de hem opgedragen taken, legt het bestuur van de Dienst passende technische en
      organisatorische maatregelen ten uitvoer om die gegevens te beveiligen tegen verlies, aantasting en onbevoegde
      wijziging, kennisneming of verstrekking, onverminderd het bepaalde daaromtrent bij of krachtens deze wet en de
      [Wet bescherming persoonsgegevens][ref1]. Bij het nemen van de maatregelen, bedoeld in de eerste zin, houdt het
      bestuur van de Dienst rekening met de stand van de techniek, de kosten van tenuitvoerlegging en de desbetreffende
      risico’s.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 3d.2
    text: 'De maatregelen, bedoeld in het eerste lid, omvatten ten minste:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.2.a
    text: |-
      maatregelen met betrekking tot personen die in dienst zijn van of werkzaam zijn voor de Dienst, voorzover betrokken
      bij de verwerking van de te beveiligen gegevens;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.2.b
    text: |-
      maatregelen met betrekking tot de toegang tot gebouwen en ruimten waarin de te beveiligen gegevens zijn opgeslagen
      door de Dienst;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.2.c
    text: |-
      maatregelen met betrekking tot een deugdelijke werking en beveiliging van de apparatuur en programmatuur die bij
      het verwerken van de te beveiligen gegevens worden ingezet;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.2.d
    text: |-
      maatregelen met betrekking tot het beheer van de te beveiligen gegevens, waaronder mede verstaan die welke strekken
      tot het waarborgen dat de te beveiligen gegevens zijn opgeslagen op gegevensdragers met een voldoende kwaliteit
      en levensduur;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.2.e
    text: |-
      maatregelen met betrekking tot de gevallen waarin onbevoegd is kennisgenomen van de te beveiligen gegevens of die
      onbevoegd zijn gewijzigd of verstrekt, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.2.f
    text: maatregelen met betrekking tot calamiteiten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: 3d.3
    text: |-
      Indien de Dienst gegevens te zijnen behoeve laat verwerken door een persoon die niet rechtstreeks aan zijn gezag
      is onderworpen, draagt het bestuur van de Dienst er zorg voor dat, onverminderd het bepaalde daaromtrent bij of
      krachtens de [Wet bescherming persoonsgegevens][ref1], die bewerker voldoende waarborgen biedt ten aanzien van
      de technische en organisatorische beveiligingsmaatregelen met betrekking tot de te verrichten verwerkingen. Het
      bestuur van de Dienst ziet toe op en draagt zorg voor de naleving van die maatregelen door die bewerker.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 3d.4
    text: |-
      Het bestuur van de Dienst draagt er zorg voor dat eenmaal per jaar door een of meer deskundigen de toereikendheid
      van de genomen en ten uitvoer gelegde beveiligingsmaatregelen, bedoeld in het eerste en derde lid, wordt
      gecontroleerd, daaronder mede verstaan de toereikendheid van het toezicht op de naleving en effectuering van
      die maatregelen. Een deskundige als bedoeld in de eerste zin is niet betrokken of betrokken geweest bij de
      voorbereiding, vaststelling en uitvoering van de beveiligingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel3d
  - number: '4.1'
    text: |-
      Het bestuur van de Dienst bepaalt in welke gemeenten de kantoren van de Dienst zijn gevestigd. Het bestuur van
      de Dienst kan daarbij bepalen welke burgerlijke gemeenten behoren tot de kring van een kantoor van de Dienst. Bij
      de beslissing, bedoeld in de tweede zin, kan het bestuur van de Dienst vaststellen een overzicht, in alfabetische
      volgorde, van de namen van de kadastrale gemeenten per kantoor van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4
  - number: '4.2'
    text: 'Het bestuur van de Dienst bepaalt:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4
  - number: 4.2.a
    text: welke kantoren van de Dienst voor het publiek zijn opengesteld;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4
  - number: 4.2.b
    text: |-
      de tijden gedurende welke die kantoren voor het publiek zijn opengesteld, waarbij dat bestuur een onderscheid kan
      maken met betrekking tot in elk geval het aanbieden van stukken ter inschrijving in de openbare registers voor
      registergoederen, en overige werkzaamheden die op verzoek door de Dienst worden verricht, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4
  - number: 4.2.c
    text: |-
      de tijden gedurende welke stukken ter inschrijving in de openbare registers, bedoeld in onderdeel b, kunnen worden
      aangeboden, waarbij geen onderscheid wordt gemaakt tussen in papieren en in elektronische vorm aangeboden stukken.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4
  - number: 4a.1
    text: |-
      De registers, registraties, kaarten, bescheiden en geografische gegevens, bedoeld in [artikel 3, eerste lid][ref1],
      en daarvan vervaardigde duplicaten worden gehouden aan een of meer door het bestuur van de Dienst te bepalen
      kantoren van de Dienst. Het bestuur van de Dienst kan daarbij een onderscheid maken met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 4a.1.a
    text: |-
      onroerende zaken en de rechten waaraan die zijn onderworpen, onderscheidenlijk schepen en de rechten waaraan die
      zijn onderworpen, onderscheidenlijk luchtvaartuigen en de rechten waaraan die zijn onderworpen, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
  - number: 4a.1.b
    text: |-
      in elektronische vorm gehouden gedeelten van die registers, registraties, kaarten, bescheiden en geografische
      gegevens.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
  - number: 4a.2
    text: |-
      Indien het bestuur van de Dienst bepaalt dat de registers en registraties, bedoeld in
      [artikel 3, eerste lid][ref1], voorzover schepen onderscheidenlijk luchtvaartuigen betreffend, worden gehouden aan
      meer dan een kantoor van de Dienst, bepaalt het bestuur van de Dienst welk van de betrokken kantoren hoofdkantoor
      van de openbare registers en registratie voor schepen onderscheidenlijk voor luchtvaartuigen is. Bij of krachtens
      algemene maatregel van bestuur worden regels gesteld omtrent dat hoofdkantoor. Het bestuur van de Dienst wijst
      een of meer van de kantoren, bedoeld in de eerste zin, aan waar de teboekstelling van schepen onderscheidenlijk
      luchtvaartuigen kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: 4a.3
    text: 'Het bestuur van de Dienst bepaalt op welke wijze:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
  - number: 4a.3.a
    text: |-
      indien [artikel 4, eerste lid, tweede zin][ref1], toepassing heeft gevonden en door hem tot een wijziging van de
      grens tussen twee kringen wordt beslist, en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel4
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '4'
        hoofdstuk: '1'
  - number: 4a.3.b
    text: |-
      ingeval van opheffing van een kantoor waaraan de registers en registraties, bedoeld in
      [artikel 3, eerste lid][ref1], voorzover schepen onderscheidenlijk luchtvaartuigen betreffend, worden gehouden,


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '6.1'
    text: |-
      Onder de benaming van bewaarder van het kadaster en de openbare registers worden door het bestuur van de Dienst ten
      minste twee bewaarders benoemd.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
  - number: '6.2'
    text: 'Tot bewaarder kunnen uitsluitend worden benoemd zij die:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
  - number: 6.2.a
    text: |-
      op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit of de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester te
      voeren, hebben verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 6.2.b
    text: een door het bestuur van de Dienst voldoende verklaarde opleiding van gelijkwaardige aard hebben, of
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
  - number: 6.2.c
    text: |-
      in het bezit zijn van een ten aanzien van het beroep van bewaarder afgegeven EG-verklaring
      als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] of in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '6.3'
    text: |-
      Bij afwezigheid, belet, ontstentenis of schorsing van een bewaarder wordt hij vervangen door een of meer van de
      andere bewaarders door het bestuur van de Dienst aan te wijzen op een daarbij door dat bestuur te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
  - number: '6.4'
    text: |-
      Het bestuur van de Dienst kan een of meer personen behorend tot het personeel van de Dienst belasten met de
      waarneming van het ambt van bewaarder.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel6
  - number: '7.1'
    text: 'De bewaarder is, onverminderd het bepaalde bij of krachtens deze of een andere wet, belast met:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
  - number: 7.1.a
    text: |-
      het verrichten van inschrijvingen in de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], en het
      stellen van aantekeningen in die registers;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7.1.b
    text: |-
      het bijwerken van de kadastrale registratie, bedoeld in [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 7.1.c
    text: |-
      het bijwerken van de registratie voor schepen, bedoeld in [artikel 85][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: 7.1.d
    text: |-
      het bijwerken van de registratie voor luchtvaartuigen, bedoeld in [artikel 92][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel92
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '92'
        hoofdstuk: '6'
  - number: '7.2'
    text: |-
      De bewaarder kan met betrekking tot een of meer van zijn bevoegdheden die hem zijn toegekend bij of krachtens
      deze of een andere wet, mandaat of machtiging verlenen aan een of meer personen behorend tot het personeel van
      de Dienst. Verlening van mandaat of machtiging behoeft de instemming van het bestuur van de Dienst, voorzover het
      mandaat of de machtiging wordt verleend aan personeel van de Dienst dat niet werkzaam is onder verantwoordelijkheid
      van de bewaarder.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
  - number: '7.3'
    text: |-
      Het bestuur van de Dienst wijst een bewaarder aan als hoofdbewaarder belast met de verdeling van de werkzaamheden
      tussen hem en de andere bewaarder of bewaarders, indien er meer dan twee bewaarders zijn benoemd. Het bestuur van
      de Dienst kan richtlijnen en aanwijzingen geven aan de hoofdbewaarder met betrekking tot de verdeling, bedoeld in
      de eerste zin.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
  - number: '7.4'
    text: 'Het bestuur van de Dienst kan richtlijnen en aanwijzingen geven aan de bewaarder met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
  - number: 7.4.a
    text: |-
      het verrichten van werkzaamheden en het uitoefenen van bevoegdheden die hem zijn opgedragen onderscheidenlijk
      toegekend bij of krachtens deze of een andere wet, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
  - number: 7.4.b
    text: de toepassing van het tweede lid, eerste zin.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7
  - number: 7a.1
    text: |-
      Personen die door de Dienst, het bestuur van de Dienst of een daartoe op grond van een wettelijk voorschrift
      bevoegde functionaris van de Dienst zijn belast met aan de uitvoering van de aan de Dienst opgedragen taken
      verbonden werkzaamheden, zijn bevoegd, met medeneming van de benodigde apparatuur en andere hulpmiddelen, elke
      plaats te betreden, onverminderd [artikel 2 van de Algemene wet op het binnentreden][ref1], en daar een waarneming,
      meting of graving te verrichten en daarop of daarin een teken te stellen, voorzover dat redelijkerwijs nodig is
      voor de vervulling van hun taak ter uitvoering van aan de Dienst opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: 7a.2
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een registergoed zijn verplicht aan een persoon als
      bedoeld in het eerste lid binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden, genoemd in het eerste lid, met dien verstande
      dat de toegang slechts wordt verleend tussen acht uur 's morgens en zes uur 's avonds en dat die niet behoeft te
      worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7a
  - number: 7a.3
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een gebouw en grond zijn verplicht te gedogen
      dat daarop of daarin een teken wordt gesteld ter uitvoering van aan de Dienst opgedragen taken. De eerste
      zin is van overeenkomstige toepassing op het aanbrengen van een brandmerk op een schip als bedoeld in
      [artikel 21, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7a.4
    text: |-
      Indien de toegang wordt geweigerd, verschaffen de personen, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan of de medewerking, bedoeld in het tweede lid, niet wordt verleend, zijn de personen, bedoeld in het
      eerste lid, bevoegd het verrichten van de handelingen, bedoeld in het eerste lid, zo nodig met behulp van de sterke
      arm mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7a
  - number: 7a.5
    text: |-
      De schade die uit de toepassing van het eerste of derde lid voortvloeit, wordt door de Dienst vergoed. Het verzoek
      om schadevergoeding wordt ingediend bij het bestuur van de Dienst. De vordering tot schadevergoeding staat ter
      kennisneming van de kantonrechter van de rechtbank van het arrondissement waarin de plaats van vestiging van de
      Dienst is gelegen. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7a
  - number: 7b.1
    text: |-
      Een persoon als bedoeld in [artikel 7a, eerste lid][ref1], draagt bij het verrichten van de werkzaamheden, bedoeld
      in [artikel 7a, eerste lid][ref2], een legitimatiebewijs bij zich, dat is uitgegeven door het bestuur van de
      Dienst, en toont zijn legitimatiebewijs desgevraagd terstond.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 7a
        hoofdstuk: '1'
  - number: 7b.2
    text: Het legitimatiebewijs bevat een foto van de betrokken persoon en vermeldt in elk geval zijn naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7b
  - number: 7b.3
    text: Het model van het legitimatiebewijs wordt vastgesteld bij regeling van het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7b
  - number: 7c
    text: |-
      De [artikelen 2:13 tot en met 2:17 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing
      op het elektronische berichtenverkeer verbonden aan het houden van de in [artikel 8, eerste lid][ref2], bedoelde
      openbare registers en het verstrekken van inlichtingen daaruit, tenzij bij of krachtens deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7d.1
    text: |-
      De bevoegdheden die op grond van [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1] aan een
      bestuursorgaan zijn toegekend, komen uitsluitend toe aan het bestuur van de Dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 7d.2
    text: |-
      Het bestuur van de Dienst kan de ingevolge het eerste lid aan hem toekomende bevoegdheden uitsluitend uitoefenen
      door het vaststellen van regelingen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7d
  - number: 7e.1
    text: |-
      Indien in deze wet wordt voorgeschreven dat een document van een elektronische handtekening wordt
      voorzien, wordt een elektronische handtekening gebruikt die voldoet aan de eisen, genoemd in
      [artikel 15a, tweede lid, onderdelen a tot en met f, van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15a
  - number: 7e.2
    text: |-
      Een certificaat waarop een in deze wet voorgeschreven elektronische handtekening is gebaseerd, bevat geen
      pseudoniem.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7e
  - number: 7e.3
    text: |-
      De in [artikel 2:16, derde zin, van de Algemene wet bestuursrecht][ref1] bedoelde aanvullende eisen met betrekking
      tot het gebruik van een elektronische handtekening worden gesteld bij of krachtens regeling van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '8.1'
    text: |-
      De openbare registers waarin feiten die voor de rechtstoestand van registergoederen van belang zijn, worden
      ingeschreven, zijn:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
  - number: 8.1.a
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op onroerende zaken, schepen en luchtvaartuigen en
      op de rechten waaraan die onderworpen zijn;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
  - number: 8.1.b
    text: |-
      het register van voorlopige aantekeningen waarin de aanbieding van stukken waarvan de inschrijving door de
      bewaarder ingevolge [artikel 20 van Boek 3 van het Burgerlijk Wetboek][ref1] is geweigerd, wordt aangetekend onder
      vermelding van de gerezen bedenkingen, en waarin de aanbieding van notariële verklaringen wordt geboekt in de
      gevallen, bedoeld in [artikel 37, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '8.2'
    text: |-
      Het bestuur van de Dienst stelt nadere regels met betrekking tot de vorm van de registers, bedoeld in het eerste
      lid. Het bestuur van de Dienst kan daarbij een onderscheid maken met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
  - number: 8.2.a
    text: |-
      onroerende zaken en de rechten waaraan die zijn onderworpen, onderscheidenlijk schepen en de rechten waaraan die
      zijn onderworpen, onderscheidenlijk luchtvaartuigen en de rechten waaraan die zijn onderworpen, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
  - number: 8.2.b
    text: in elektronische vorm en in andere vorm gehouden gedeelten van die registers.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
  - number: '8.3'
    text: |-
      Bij regeling van het bestuur van de Dienst worden vastgesteld, onverminderd het bepaalde dienaangaande bij of
      krachtens deze of een andere wet, de gevallen waarin in de registers, bedoeld in het eerste lid, door de bewaarder
      aantekeningen worden gesteld, de aard van die aantekeningen en de wijze waarop die worden gesteld. Het bestuur van
      de Dienst kan daarbij bepalen dat in door hem nader te bepalen gevallen de aantekening wordt geplaatst in een door
      de bewaarder op te maken, te dagtekenen en te ondertekenen stuk dat hij onverwijld ambtshalve inschrijft in de
      openbare registers. Het bestuur van de Dienst stelt indien de tweede zin toepassing vindt, tevens de vorm van dat
      stuk vast.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel8
  - number: '9.1'
    text: |-
      Het bestuur van de Dienst draagt zorg dat de openbare registers, bedoeld in [artikel 8, eerste lid][ref1],
      zodanig duurzaam worden bewaard dat de inhoud ervan naar de eisen van openbaarheid binnen redelijke termijn voor
      raadpleging beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '9.2'
    text: |-
      De inhoud van de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], kan worden gehouden op papieren,
      elektronische of andere gegevensdragers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '9.3'
    text: |-
      Het bestuur van de Dienst kan ten aanzien van door hem aan te wijzen openbare registers als bedoeld in
      [artikel 8, eerste lid][ref1], of gedeelten ervan, de inhoud overbrengen op andere gegevensdragers van dezelfde
      of een andere soort, mits de overbrenging geschiedt met juiste en volledige weergave van alle desbetreffende
      gegevens, ter waarborging waarvan het bestuur van de Dienst passende maatregelen ten uitvoer legt. Het bestuur
      van de Dienst kan bepalen dat meer dan een duplicaat van dezelfde of een andere soort als bedoeld in de eerste
      zin wordt vervaardigd. Het bestuur van de Dienst draagt in elk geval zorg dat van de openbare registers, bedoeld
      in [artikel 8, eerste lid][ref2], zo spoedig mogelijk ten minste een duplicaat in dubbel aanwezig is, waarbij
      [artikel 3d, eerste lid, tweede zin][ref3], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel3d
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 3d
        hoofdstuk: '1'
  - number: '9.4'
    text: |-
      Het bestuur van de Dienst kan bepalen dat een ingevolge het derde lid vervaardigd duplicaat de inhoud vervangt van
      de openbare registers of gedeelten ervan waarvan dat duplicaat een afschrift is.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
  - number: '9.5'
    text: |-
      De duplicaten, bedoeld in het derde en vierde lid, hebben dezelfde bewijskracht als de inhoud van de registers
      die is geplaatst op de oorspronkelijke gegevensdragers onderscheidenlijk als de oorspronkelijke inhoud van de
      registers.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
  - number: '9.6'
    text: |-
      Van elke vervaardiging van een duplicaat en vervanging als bedoeld in het derde onderscheidenlijk vierde lid
      wordt een verklaring opgemaakt, die ten minste een specificatie bevat van de desbetreffende vervaardiging
      onderscheidenlijk vervanging, en aangeeft op grond waarvan zij is geschied. Het bestuur van de Dienst stelt de vorm
      van de verklaring vast, en wanneer en door wie zij wordt opgemaakt en ondertekend.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
  - number: '9.7'
    text: |-
      Het bestuur van de Dienst stelt met inachtneming van het eerste tot en met zesde lid nadere regels omtrent de wijze
      waarop de openbare registers worden gehouden. Daarbij wordt in elk geval geregeld de wijze waarop voor gebruik niet
      langer geschikte of beschikbare duplicaten als bedoeld in het derde lid worden vervangen door nieuwe duplicaten.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9
  - number: 9a
    text: |-
      [Artikel 9][ref1] is van overeenkomstige toepassing op in vreemde of Friese taal gestelde stukken als bedoeld in
      [artikel 41, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel41
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '41'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '10'
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld waar stukken ter verkrijging van inschrijving van feiten die
      betrekking hebben op onroerende zaken, schepen, luchtvaartuigen, en rechten waaraan die zaken zijn onderworpen,
      kunnen worden aangeboden, met dien verstande dat bij regeling van het bestuur van de Dienst een of meer
      elektronische postadressen van de Dienst worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel10
  - number: 10a
    text: |-
      Voor inschrijving van een feit in de openbare registers, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], is
      vereist een stuk dat voldoet aan de vereisten, bedoeld in [hoofdstuk 2, titel 2][ref2], onverminderd hetgeen wordt
      bepaald bij verdrag en bij of krachtens deze of een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        hoofdstuk: '2'
  - number: 10b.1
    text: |-
      Stukken als bedoeld in [artikel 10a][ref1] worden in papieren of elektronische vorm ter inschrijving in
      de openbare registers aangeboden, onverminderd de [artikelen 11a, eerste tot en met vierde lid][ref2], en
      [11b, vijfde en zesde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 10a
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 11a
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 10b.2
    text: |-
      Bij regeling van Onze Minister worden met betrekking tot in te schrijven stukken met een papieren vorm, regels
      gesteld met betrekking tot de wijze waarop daarin voorkomende doorhalingen van de oorspronkelijke tekst,
      aangebrachte gewijzigde tekst en daarop geplaatste ondertekeningen worden weergegeven in het afschrift en
      uittreksel, bedoeld in [artikel 11b, eerste lid][ref1], tenzij de aard van het desbetreffende stuk meebrengt dat
      die regels worden gesteld bij of krachtens een andere dan deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 10b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop een
      elektronisch afschrift en een elektronisch uittreksel van een tot het register van de gerechtsdeurwaarder behorend
      stuk wordt vervaardigd ten behoeve van het in elektronische vorm aanbieden van dit stuk ter inschrijving in de in
      [artikel 8, eerste lid, onder a][ref1], bedoelde openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '11.1'
    text: |-
      Indien een stuk als bedoeld in [artikel 10a][ref1] in papieren vorm wordt aangeboden, wordt tevens een afschrift
      van dat stuk aangeboden, voorzien van een verklaring van eensluidendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel10a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 10a
        hoofdstuk: '2'
        afdeling: '3'
  - number: '11.2'
    text: |-
      De bewaarder is niet gehouden de juistheid van de verklaring, bedoeld in het eerste lid, te onderzoeken. De Dienst
      is niet aansprakelijk voor schade voortvloeiend uit een onjuistheid en onvolledigheid in het afschrift.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: '11.3'
    text: |-
      Bij regeling van Onze Minister wordt de vorm vastgesteld van de verklaring, bedoeld in het eerste lid, en wordt
      bepaald, onverminderd het bepaalde bij of krachtens een andere wet, door wie die verklaring wordt ondertekend.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: '11.4'
    text: |-
      Bij regeling van Onze Minister kan voor bijzondere gevallen worden bepaald dat geen afschrift als bedoeld in
      het eerste lid behoeft te worden aangeboden. In die gevallen vervaardigt de Dienst het afschrift van het ter
      inschrijving aangeboden stuk. De Dienst is aansprakelijk voor schade voortvloeiend uit een onjuistheid en
      onvolledigheid in het afschrift, ontstaan ten gevolge van de vervaardiging ervan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: '11.5'
    text: 'Bij regeling van Onze Minister worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: 11.5.a
    text: de eisen waaraan tekeningen die deel uitmaken van in papieren vorm ter inschrijving aangeboden stukken, voldoen, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: 11.5.b
    text: |-
      indien het zevende lid, eerste zin, toepassing heeft gevonden, de gevallen waarin van een tekening een niet op een
      formulier als bedoeld in het zevende lid gesteld afschrift wordt aangeboden, in welke gevallen dat afschrift wordt
      voorzien van een verklaring van eensluidendheid waarop het tweede en derde lid van overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: '11.6'
    text: |-
      Bij regeling van het bestuur van de Dienst worden regels gesteld met inachtneming waarvan het in het eerste lid
      bedoelde afschrift wordt vervaardigd en aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: '11.7'
    text: |-
      Bij regeling van het bestuur van de Dienst kan worden bepaald dat het in het eerste lid bedoelde afschrift van
      het stuk wordt gesteld op een door de Dienst verstrekt formulier. Bij toepassing van de eerste zin worden bij die
      regeling tevens de vorm vastgesteld van dat formulier en regels gesteld met inachtneming waarvan dat formulier
      wordt ingevuld en aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11
  - number: 11a.1
    text: |-
      Een stuk als bedoeld in [artikel 10a][ref1] kan slechts in elektronische vorm ter inschrijving worden aangeboden,
      indien het tezamen met het verzoek tot inschrijving, bedoeld in [artikel 11b, tweede lid][ref2], wordt verzonden
      door middel van een bericht en de aanbieder ervan voldoet aan de door het bestuur van de Dienst bij regeling te
      stellen regels met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 10a
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 11a.1.a
    text: |-
      het formaat van de in elektronische vorm aan de bewaarder toe te zenden bestanden waaruit een zodanig bericht
      bestaat;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.1.b
    text: de indeling van die bestanden;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.1.c
    text: het uitwisselingsprotocol voor de berichten, bedoeld in de aanhef;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.1.d
    text: de waarborging en controleerbaarheid van de integriteit van die berichten;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.1.e
    text: de waarborging van de continuïteit en de beveiliging van het in elektronische vorm verzenden van die berichten;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.1.f
    text: de wijze waarop elektronische bestanden waaruit dat bericht bestaat, ter inschrijving kunnen worden aangeboden, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.1.g
    text: |-
      de wijze waarop degene die voornemens is stukken in elektronische vorm ter inschrijving aan te bieden, dat
      voornemen uiterlijk mededeelt aan de bewaarder voordat hij voor de eerste keer daartoe overgaat, de daarbij te
      verstrekken gegevens en de wijze en het tijdstip van mededeling van wijzigingen in die gegevens.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.2
    text: |-
      De bewaarder aanvaardt een aan hem elektronisch toegezonden bericht als bedoeld in het eerste lid niet,
      indien de aanbieder niet heeft voldaan aan het bepaalde bij of krachtens het eerste lid. Het bestuur
      van de Dienst bepaalt de wijze waarop en de termijn waarbinnen de bewaarder aan de aanbieder mededeling
      doet van die niet-aanvaarding en de wijze van bewaren van berichten als bedoeld in de eerste zin.
      [Artikel 20 van Boek 3 van het Burgerlijk Wetboek][ref1] is niet van toepassing op niet aanvaarde berichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: 11a.3
    text: |-
      Indien op grond van het niet voldaan hebben aan het bepaalde bij of krachtens het eerste lid, met uitzondering van
      onderdeel g, meer dan een bericht van een aanbieder niet is aanvaard, kan de bewaarder beslissen dat hij andere
      berichten door die aanbieder aan hem verzonden na een in die beslissing te noemen tijdstip, niet aanvaardt. Het
      bestuur van de Dienst bepaalt de wijze waarop en de termijn waarbinnen de bewaarder aan de aanbieder mededeling
      doet van zijn beslissing en de inhoud van die mededeling. Op een niet aanvaard bericht als bedoeld in de eerste zin
      is [artikel 20 van Boek 3 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: 11a.4
    text: |-
      Bij regeling van het bestuur van de Dienst worden vastgesteld de procedure met inachtneming waarvan en de
      voorwaarden waaronder een aanbieder als bedoeld in het derde lid op zijn verzoek in papieren vorm in de gelegenheid
      wordt gesteld om de bewaarder aan te tonen dat hij in staat is bij het in elektronische vorm toezenden van stukken
      ter inschrijving, te voldoen aan de regels, bedoeld in het eerste lid, onderdelen a tot en met f, alsmede de wijze
      waarop een zodanig verzoek kan worden gedaan. Van de uitkomsten van het onderzoek, bedoeld in de eerste zin, geeft
      de bewaarder aan de verzoeker met bekwame spoed een verklaring af, waarvan de inhoud en de wijze van verzenden door
      het bestuur van de Dienst worden vastgesteld. Een verklaring als bedoeld in de tweede zin doet een beslissing als
      bedoeld in het derde lid vervallen, indien daaruit blijkt dat de verzoeker heeft aangetoond dat hij in staat is bij
      het in elektronische vorm toezenden van stukken ter inschrijving, te voldoen aan de regels, bedoeld in het eerste
      lid, onderdelen a tot en met f.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.5
    text: |-
      Bij regeling van het bestuur van de Dienst worden regels gesteld omtrent de voorwaarden waaronder en de wijze
      waarop een netwerkbeheerder ten behoeve van het elektronisch verzenden en ontvangen van berichten in verband met
      het in elektronische vorm aanbieden van stukken ter inschrijving, een permanente aansluiting kan verkrijgen op het
      door de Dienst gehouden systeem.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11a.6
    text: |-
      Bij regeling van het bestuur van de Dienst kan worden bepaald ten aanzien van welke andere dan de gevallen, bedoeld
      in het tweede lid, een persoon als bedoeld in het eerste lid, onderdeel g, kan verzoeken om, indien een van de
      door hem bij zijn verzoek aangegeven soorten van die gevallen zich voordoet met betrekking tot door hem verzonden
      berichten als bedoeld in het eerste lid, het desbetreffende door hem gedaan verzoek tot inschrijving aan te merken
      als te zijn ingetrokken. Bij regeling van het bestuur van de Dienst worden regels gesteld omtrent de wijze en het
      tijdstip waarop uiterlijk en aan welke bewaarder het verzoek, bedoeld in de eerste zin, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11a
  - number: 11b.1
    text: |-
      Indien een stuk als bedoeld in [artikel 10a][ref1] in elektronische vorm ter inschrijving wordt aangeboden, is
      het desbetreffende afschrift of het woordelijk gelijkluidend uittreksel voorzien van een verklaring, inhoudende
      dat het inhoudelijk een volledige en juiste weergave is van de inhoud van het stuk waarvan het een afschrift
      is onderscheidenlijk van de desbetreffende gedeelten van het stuk waarvan het een uittreksel is, en van een
      elektronische handtekening. [Artikel 11, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 10a
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 11b.2
    text: |-
      Indien een stuk in elektronische vorm ter inschrijving wordt aangeboden biedt de aanbieder tezamen met dat stuk
      eveneens in elektronische vorm een verzoek tot inschrijving aan. Een verzoek als bedoeld in de eerste zin mag op
      meer dan een stuk betrekking hebben. Bij regeling van het bestuur van de Dienst worden de vorm en inhoud van dat
      verzoek vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.3
    text: 'Bij regeling van Onze Minister wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.3.a
    text: de vorm van de verklaring, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.3.b
    text: van wiens elektronische handtekening stukken als bedoeld in het eerste lid worden voorzien.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.4
    text: |-
      Bij regeling van Onze Minister wordt vastgesteld in welke gevallen en op welke wijze het ambt, de hoedanigheid
      of functie van de persoon, bedoeld in het derde lid, onderdeel b, wordt opgenomen in een bericht als bedoeld in
      [artikel 11a, eerste lid, eerste zin][ref1]. Indien in de regeling, bedoeld in de eerste zin, wordt bepaald dat dat
      ambt, die hoedanigheid of functie als specifiek attribuut wordt vermeld in het certificaat waarop de elektronische
      handtekening is gebaseerd, wordt bij die regeling bepaald de wijze waarop de betrokken certificatiedienstverlener
      zich vergewist dat de betrokkene ten tijde van de afgifte van het certificaat dat ambt, die hoedanigheid of functie
      bekleedde of toekwam.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11a
        hoofdstuk: '2'
        afdeling: '3'
  - number: 11b.5
    text: |-
      Ten aanzien van tekeningen die deel uitmaken van in elektronische vorm ter inschrijving aan te bieden stukken
      is [artikel 11, vijfde lid][ref1], van overeenkomstige toepassing. Bij regeling van Onze Minister kunnen worden
      vastgesteld de gevallen waarin tekeningen en andere stukken die deel uitmaken van een in elektronische vorm aan te
      bieden stuk, afzonderlijk in papieren vorm ter inschrijving kunnen worden aangeboden. Ten aanzien van stukken die
      in elektronische vorm ter inschrijving worden aangeboden kan, voorzover ter verkrijging van inschrijving door de
      aanbieder stukken voor bewijs worden overgelegd die niet worden ingeschreven, Onze Minister bij regeling:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 11b.5.a
    text: vaststellen de gevallen waarin die overlegging in elektronische vorm kan plaatsvinden, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.5.b
    text: regels stellen waaraan in elektronische vorm over te leggen stukken voldoen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.6
    text: |-
      In de gevallen waarop een regeling als bedoeld in het vijfde lid, tweede zin, van toepassing is, en in de gevallen
      waarop een regeling als bedoeld in het vijfde lid, derde zin, niet van toepassing is, vindt:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.6.a
    text: |-
      de aanbieding van tekeningen en andere stukken als bedoeld in het vijfde lid, tweede zin, die in papieren vorm
      worden aangeboden, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.6.b
    text: de overlegging van stukken als bedoeld in het vijfde lid, derde zin, die in papieren vorm worden overgelegd,
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.7
    text: |-
      Bij regeling van Onze Minister wordt bepaald de wijze waarop de aanbieder een in elektronische vorm ter
      inschrijving aan te bieden stuk en:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.7.a
    text: elk in papieren vorm aan te bieden stuk dat deel uitmaakt van eerstbedoeld stuk, of
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.7.b
    text: |-
      elk stuk in papieren vorm dat voor bewijs wordt overgelegd bij de aanbieding van eerstbedoeld stuk maar niet mede
      wordt ingeschreven,
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.8
    text: |-
      Het bestuur van de Dienst stelt de termijn vast gedurende welke en de wijze waarop overgelegde stukken als bedoeld
      in het vijfde lid, derde zin, worden bewaard.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
  - number: 11b.9
    text: |-
      [Artikel 11, zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 11b.10
    text: |-
      Bij regeling van Onze Minister kan worden bepaald in welke gevallen en onder welke voorwaarden de Dienst van
      tekeningen en andere stukken die deel uitmaken van een in elektronische vorm ter inschrijving aan te bieden
      stuk, voorafgaande aan die aanbieding een afschrift in elektronische vorm vervaardigt en onder een uniek kenmerk
      bewaart met het uitsluitend doel dat daarnaar in dat later aan te bieden stuk kan worden verwezen op een bij
      die regeling vast te stellen wijze. Een verwijzing als bedoeld in de eerste zin heeft tot gevolg dat het stuk
      waarnaar in het ter inschrijving aangeboden stuk wordt verwezen, deel uitmaakt van het aan te bieden stuk.
      [Artikel 11, vierde lid, tweede zin][ref1], alsmede het zevende lid, tweede zin, en achtste lid van dit artikel
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 11c.1
    text: |-
      Elk stuk dat ter inschrijving wordt aangeboden, wordt door de bewaarder met bekwame spoed voorzien van een
      aantekening omtrent dag, uur en minuut van aanbieding en een uniek stukidentificatienummer, met dien verstande dat
      indien een stuk in elektronische vorm ter inschrijving wordt aangeboden die gegevens bij het desbetreffende stuk
      in het desbetreffende elektronisch gedeelte van de openbare registers worden geplaatst. Het bestuur van de Dienst
      regelt waaruit dit stukidentificatienummer bestaat en de wijze waarop het wordt gevormd.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11c
  - number: 11c.2
    text: |-
      Bij ontvangst van een in elektronische vorm aangeboden stuk wordt in het desbetreffende elektronisch gedeelte van
      de openbare registers een aantekening geplaatst waaruit blijkt dat het stuk de status «aangeboden» heeft, en worden
      daarin andere door het bestuur van de Dienst vast te stellen gegevens vermeld die op de aanbieding betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11c
  - number: 11c.3
    text: Het bestuur van de Dienst stelt de vorm vast van de aantekeningen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel11c
  - number: '12.1'
    text: 'De inschrijving geschiedt:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel12
  - number: 12.1.a
    text: |-
      wat betreft stukken die in papieren vorm ter inschrijving zijn aangeboden: door het plaatsen op het afschrift van
      het stuk, bedoeld in [artikel 11, eerste lid][ref1], van een door de bewaarder te ondertekenen aantekening dat het
      stuk is ingeschreven, en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 12.1.b
    text: |-
      wat betreft stukken die in elektronische vorm ter inschrijving zijn aangeboden: door het plaatsen in het
      desbetreffende elektronisch gedeelte van de openbare registers bij het stuk van een aantekening waaruit blijkt
      dat het stuk de status «ingeschreven» heeft, voorzien van de naam van de bewaarder, en in de gevallen, bedoeld in
      [artikel 11b, vijfde lid, tweede zin][ref1], door tevens op de stukken die deel uitmaken van het in elektronische
      vorm aangeboden stuk, een door de bewaarder te ondertekenen aantekening te plaatsen dat het stuk is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '12.2'
    text: 'Het bestuur van de Dienst stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel12
  - number: 12.2.a
    text: |-
      de rangschikking en de wijze van opberging van de afschriften, bedoeld in [artikel 11, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 12.2.b
    text: |-
      de bewaring van de bestanden waaruit een bericht als bedoeld in [artikel 11a, eerste lid, onderdeel a][ref1],
      bestaat, en van bestanden die bij een zodanig bericht zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11a
        hoofdstuk: '2'
        afdeling: '3'
  - number: '13.1'
    text: |-
      Indien stukken in papieren vorm ter inschrijving zijn aangeboden, worden zij na de inschrijving, bedoeld in
      [artikel 12, eerste lid][ref1], aan de aanbieder teruggegeven nadat zij zijn voorzien van een door de bewaarder
      ondertekende verklaring van inschrijving vermeldende ten minste dag, uur en minuut van aanbieding, en het
      stukidentificatienummer, bedoeld in [artikel 11c][ref2]. Het bestuur van de Dienst stelt de vorm vast van de
      verklaring, bedoeld in de eerste zin, en kan de inhoud ervan nader vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11c
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 11c
        hoofdstuk: '2'
        afdeling: '3'
  - number: '13.2'
    text: |-
      Indien stukken in elektronische vorm ter inschrijving zijn aangeboden, wordt na hun inschrijving aan de aanbieder
      toegezonden een bewijs van inschrijving houdende mededeling van de verrichte inschrijving en vermeldende ten minste
      de gegevens, bedoeld in het eerste lid, eerste zin, welk bewijs door de bewaarder wordt ondertekend of, indien
      het in elektronische vorm wordt opgemaakt en toegezonden, wordt voorzien van een elektronische handtekening van de
      bewaarder. Het bestuur van de Dienst stelt regels met betrekking tot de vorm, wijze en het tijdstip van verzenden
      van het bewijs van inschrijving en kan de inhoud ervan nader vaststellen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel13
  - number: '13.3'
    text: |-
      Indien [artikel 11b, vijfde lid, tweede zin][ref1], toepassing heeft gevonden en indien in het geval, bedoeld
      in het tweede lid, stukken die deel uitmaken van het in te schrijven stuk in papieren vorm ter inschrijving zijn
      aangeboden, is het eerste lid van overeenkomstige toepassing op die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14'
    text: |-
      Op de inschrijving van een feit waarvan de inschrijving alsnog is bevolen overeenkomstig
      [artikel 20, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref1] of opnieuw is verzocht als bedoeld in
      [artikel 20, vierde lid, tweede zin, van Boek 3 van dat wetboek][ref2], zijn de [artikelen 10a tot en met 13][ref3]
      van toepassing, voorzover daarvan in de [artikelen 14a][ref4] en [14b][ref5] niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel14a
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel14b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: 14a
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: 14b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 14a.1
    text: |-
      Voor een inschrijving als bedoeld in [artikel 14][ref1] wordt vereist, indien het oorspronkelijke stuk in papieren
      vorm ter inschrijving is aangeboden, het oorspronkelijk aangeboden stuk dat is voorzien van de verklaring, bedoeld
      in [artikel 15a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel15a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 15a
        hoofdstuk: '2'
        afdeling: '4'
  - number: 14a.2
    text: |-
      De inschrijving geschiedt door op het afschrift van het stuk, bedoeld in [artikel 11, eerste lid][ref1], een door
      de bewaarder te ondertekenen aantekening te plaatsen inhoudende dat het stuk is ingeschreven onder vermelding van
      het tijdstip van de hernieuwde aanbieding.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 14a.3
    text: |-
      [Artikel 13, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel13
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 14b.1
    text: |-
      Voor een inschrijving als bedoeld in [artikel 14][ref1] wordt vereist, indien het oorspronkelijke stuk in
      elektronische vorm ter inschrijving is aangeboden, een hernieuwd verzoek tot inschrijving dat in elk geval
      vermeldt het stukidentificatienummer van het oorspronkelijk aangeboden stuk en is voorzien van een elektronische
      handtekening. Indien [artikel 11b, vijfde lid, tweede zin][ref2], toepassing heeft gevonden en indien in het
      geval, bedoeld in de eerste zin, stukken die deel uitmaken van het oorspronkelijk ter inschrijving aangeboden
      stuk in papieren vorm ter inschrijving zijn aangeboden, wordt tevens vereist de hernieuwde aanbieding van
      diezelfde stukken voorzien van de door de bewaarder bij de oorspronkelijke aanbieding daarop gestelde gegevens,
      bedoeld in [artikel 11c, eerste lid, onverminderd het tweede lid][ref3]. [Artikel 11b, zesde lid][ref4], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11c
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: 11c
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: 14b.2
    text: 'Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14b
  - number: 14b.2.a
    text: |-
      de vorm en inhoud van het verzoek, bedoeld in het eerste lid, en van wiens elektronische handtekening dat verzoek
      wordt voorzien, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14b
  - number: 14b.2.b
    text: de gevallen waarin een hernieuwde aanbieding als bedoeld in het eerste lid, tweede zin, achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14b
  - number: 14b.3
    text: |-
      De inschrijving geschiedt in de gevallen, bedoeld in het eerste lid, eerste zin, door in het desbetreffende
      elektronisch gedeelte van de openbare registers de voorlopige aantekening door te halen en door het plaatsen bij
      het stuk van een aantekening waaruit blijkt het tijdstip van de hernieuwde aanbieding en dat het stuk de status
      «ingeschreven» heeft, en, in de gevallen, bedoeld in het eerste lid, tweede zin, door tevens op de stukken die
      deel uitmaken van het in elektronische vorm aangeboden stuk, een aantekening te plaatsen ten aanzien waarvan het
      bepaalde omtrent de in dit lid eerstgenoemde aantekening van overeenkomstige toepassing is. Het bestuur van de
      Dienst stelt de vorm vast van de aantekeningen, bedoeld in de eerste zin.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14b
  - number: 14b.4
    text: |-
      [Artikel 13, tweede en derde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de bewaarder in
      de gevallen, bedoeld in het eerste lid, tweede zin, op de stukken die deel uitmaken van het in elektronische vorm
      aangeboden stuk, een aantekening plaatst ten aanzien waarvan [artikel 13, eerste lid][ref2], van overeenkomstige
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel13
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15'
    text: |-
      De boeking, bedoeld in [artikel 20, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1], geschiedt in het
      register van voorlopige aantekeningen met vermelding van de gerezen bedenkingen, en, voorzover bekend, van de naam
      en woonplaats met adres van de aanbieder, met dien verstande dat met betrekking tot een stuk dat in elektronische
      vorm ter inschrijving is aangeboden, die vermelding plaatsvindt in het desbetreffende elektronisch gedeelte van de
      openbare registers bij dat stuk onder gelijktijdige aantekening van de status «niet-ingeschreven». Het bestuur van
      de Dienst stelt de vorm vast van de aantekening, bedoeld in de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: 15a.1
    text: |-
      Indien een stuk in papieren vorm ter inschrijving is aangeboden, wordt na de boeking, bedoeld in
      [artikel 15][ref1], dat stuk voorzien van een door de bewaarder ondertekende verklaring van niet-inschrijving,
      vermeldende ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 15a.1.a
    text: dag, uur en minuut van aanbieding;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
  - number: 15a.1.b
    text: |-
      het stukidentificatienummer, bedoeld in [artikel 11c, eerste lid][ref1], onder verwijzing naar de boeking in het
      register van voorlopige aantekeningen, en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11c
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11c
        hoofdstuk: '2'
        afdeling: '3'
  - number: 15a.1.c
    text: de gerezen bedenkingen,
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
  - number: 15a.2
    text: |-
      Indien het voor inschrijving vereiste afschrift niet is aangeboden, vervaardigt de Dienst een afschrift van het
      stuk, bedoeld in het eerste lid, overeenkomstig door het bestuur van de Dienst te stellen regels. De Dienst is
      aansprakelijk voor de schade voortvloeiend uit een onjuistheid en onvolledigheid in het afschrift. De eerste en
      tweede zin zijn van overeenkomstige toepassing op de stukken, bedoeld in [artikel 15][ref1], waarop ten aanzien van
      de inschrijving [artikel 11, vierde lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 15a.3
    text: |-
      Het bestuur van de Dienst stelt regels over de gevallen waarin de Dienst een afschrift vervaardigt van het stuk
      waarvan de inschrijving is geweigerd, en op welke wijze die vervaardiging geschiedt, indien:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
  - number: 15a.3.a
    text: |-
      het afschrift, bedoeld in [artikel 11, eerste lid][ref1], niet is vervaardigd of aangeboden met inachtneming van de
      regels, bedoeld in [artikel 11, zesde lid][ref2], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 15a.3.b
    text: |-
      het formulier, bedoeld in [artikel 11, zevende lid][ref1], indien dat lid toepassing heeft gevonden, niet is
      ingevuld of aangeboden met inachtneming van de regels, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 15a.4
    text: |-
      [Artikel 15][ref1] en het eerste lid zijn van overeenkomstige toepassing op de boeking van de aanbieding van een
      stuk, dat krachtens [artikel 37, tweede lid][ref2], op bevel van de rechter kan worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 15b.1
    text: |-
      Indien een stuk in elektronische vorm ter inschrijving is aangeboden, wordt na de boeking, bedoeld in
      [artikel 15][ref1], aan de aanbieder toegezonden een bewijs van niet-inschrijving vermeldende ten minste de
      gegevens, bedoeld in [artikel 15a, eerste lid, eerste zin][ref2], welk bewijs door de bewaarder wordt ondertekend
      of, indien het in elektronische vorm wordt opgemaakt en toegezonden, wordt voorzien van een elektronische
      handtekening van de bewaarder. Het bestuur van de Dienst stelt regels met betrekking tot de vorm, wijze en het
      tijdstip van verzenden van het bewijs van niet-inschrijving. Het bestuur kan nadere regels stellen met betrekking
      tot de inhoud van het bewijs van niet-inschrijving. [Artikel 12, tweede lid][ref3], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel12
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 15a
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 15b.2
    text: |-
      Indien [artikel 11b, vijfde lid, tweede zin][ref1], toepassing heeft gevonden en indien in het geval, bedoeld
      in het eerste lid, eerste zin, stukken die deel uitmaken van het in te schrijven stuk in papieren vorm ter
      inschrijving zijn aangeboden zonder het voor inschrijving vereiste afschrift, vervaardigt de Dienst een afschrift
      van de desbetreffende stukken overeenkomstig door het bestuur van de Dienst te stellen regels. De Dienst is
      aansprakelijk voor de schade voortvloeiend uit een onjuistheid en onvolledigheid in het afschrift. De eerste en
      tweede zin zijn van overeenkomstige toepassing met betrekking tot de stukken, bedoeld in [artikel 15][ref2], waarop
      ten aanzien van de inschrijving [artikel 11, vierde lid][ref3], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 15b.3
    text: |-
      [Artikel 15][ref1] en het eerste lid zijn van overeenkomstige toepassing op de boeking van de aanbieding van een
      stuk, dat krachtens [artikel 37, tweede lid][ref2], op bevel van de rechter kan worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '16.1'
    text: |-
      Van aan de bewaarder uitgebrachte dagvaardingen als bedoeld in
      [artikel 20, vierde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], en van uitspraken van
      de voorzieningenrechter in kort geding, aangespannen ter verkrijging van het bevel, bedoeld in
      [artikel 20, tweede lid, van Boek 3 van dat wetboek][ref2], wordt aantekening gehouden in het register van
      voorlopige aantekeningen overeenkomstig door het bestuur van de Dienst te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '20'
  - number: '16.2'
    text: |-
      Het bestuur van de Dienst stelt regels met betrekking tot de wijze waarop in het register van voorlopige
      aantekeningen de boeking, bedoeld in [artikel 15][ref1], geschiedt, en met betrekking tot de wijze van doorhaling
      van voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '16.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op dagvaardingen uitgebracht aan de bewaarder ter
      verkrijging van een bevel van de rechter tot inschrijving van een notariële verklaring als bedoeld in
      [artikel 37, eerste lid, onderdeel c][ref1]. Het tweede lid is van overeenkomstige toepassing op de boeking,
      bedoeld in [artikel 37, tweede lid, eerste zin][ref2], en de doorhaling van een zodanige boeking in het register
      van voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '17.1'
    text: 'Het bestuur van de Dienst stelt:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel17
  - number: 17.1.a
    text: |-
      de vorm vast van het bewijs van ontvangst, bedoeld in [artikel 18 van Boek 3 van het Burgerlijk Wetboek][ref1],
      dat door de bewaarder wordt ondertekend, met dien verstande dat indien het in elektronische vorm wordt opgemaakt en
      toegezonden aan de aanbieder, het wordt voorzien van een elektronische handtekening van de bewaarder, en


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '18'
  - number: 17.1.b
    text: |-
      regels met betrekking tot de wijze waarop op het bewijs van ontvangst, bedoeld in onderdeel a, indien
      het in papieren vorm is afgegeven, de verrichte inschrijving desgevraagd wordt aangetekend, bedoeld in
      [artikel 19, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel19
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '19'
  - number: '17.2'
    text: |-
      Het bestuur van de Dienst stelt nadere regels met betrekking tot de inhoud van het bewijs van ontvangst, bedoeld in
      het eerste lid, onderdeel a, met dien verstande dat daarin in elk geval wordt vermeld het aantal van de overgelegde
      maar niet mede in te schrijven stukken als bedoeld in [artikel 44][ref1], onder vermelding van hun kenmerken als
      bedoeld in [artikel 11b, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11b
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '44'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 11b
        hoofdstuk: '2'
        afdeling: '3'
  - number: '17.3'
    text: |-
      Het bestuur van de Dienst stelt regels met betrekking tot de wijze en het tijdstip van verstrekken van het bewijs
      van ontvangst.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel17
  - number: '18.1'
    text: |-
      Onverminderd de overige uit deze titel voortvloeiende eisen moet een ter inschrijving aangeboden notariële akte,
      notariële verklaring of authentiek afschrift of uittreksel van een zodanige akte of verklaring vermelden:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: 18.1.1°
    text: |-
      naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens het aangeboden stuk daarbij als partij zijn opgetreden;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: 18.1.2°
    text: |-
      rechtsvorm, naam en woonplaats met adres van de rechtspersonen die blijkens het aangeboden stuk daarbij als partij
      zijn opgetreden;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: 18.1.3°
    text: |-
      ten aanzien van natuurlijke en rechtspersonen die blijkens het aangeboden stuk voormelde partijen hebben
      vertegenwoordigd: de in de onderdelen a en b bedoelde gegevens, met uitzondering van de burgerlijke staat, alsmede
      de grond van hun bevoegdheid, met dien verstande dat voor natuurlijke personen die een kantoor houden of werkzaam
      zijn op een kantoor ten aanzien van aangelegenheden die dit kantoor betreffen in plaats van de woonplaats met adres
      ook het kantooradres vermeld kan worden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: '18.2'
    text: |-
      Andere ter inschrijving aangeboden stukken vermelden, zo mogelijk, dezelfde gegevens als in het eerste lid
      omschreven, tenzij anders voortvloeit uit hetgeen de wet voor een stuk van de aard als waarom het gaat, ten aanzien
      van de vermelding van voornamen, namen en woonplaatsen voorschrijft.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: '18.3'
    text: |-
      In elk geval worden de in het eerste lid omschreven gegevens opgegeven van de partij ten behoeve van wie de
      aanbieding ter inschrijving geschiedt. Zo het ter inschrijving aangeboden stuk één of meer van deze gegevens
      niet vermeldt en naar zijn aard niet voor aanvulling te dier zake vatbaar is, wordt vermelding van de ontbrekende
      gegevens en, zo opgave van één of meer dezer gegevens niet mogelijk is, de vermelding van de redenen daarvan in een
      nadere door of namens die partij ondertekende verklaring alsnog op het stuk gesteld of daaraan gehecht.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: '18.4'
    text: |-
      Zo een partij geen woonplaats in Nederland heeft, kiest zij ter zake van de inschrijving een woonplaats in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: '18.5'
    text: |-
      Indien een partij in een ter inschrijving aangeboden stuk woonplaats heeft gekozen, wordt niettemin daarin ook de
      wettelijke woonplaats met adres vermeld.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel18
  - number: '19'
    text: |-
      Ingeval het ter inschrijving aangeboden stuk betrekking heeft op een bepaald reeds eerder ingeschreven stuk, bevat
      het een verwijzing naar dit eerdere stuk overeenkomstig door Onze Minister daartoe vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel19
  - number: '20.1'
    text: |-
      Indien een stuk ter inschrijving wordt aangeboden en het daarin vermelde in te schrijven feit betrekking heeft
      op een onroerende zaak of op een recht waaraan een zodanige zaak is onderworpen, vermeldt dit stuk de aard, de
      plaatselijke aanduiding zo deze er is, en de kadastrale aanduiding van die onroerende zaak onderscheidenlijk
      van de onroerende zaak die aan dat recht is onderworpen. Indien het in te schrijven feit betrekking heeft op
      een appartementsrecht, wordt in het ter inschrijving aangeboden stuk vermeld de plaatselijke aanduiding van het
      desbetreffende gedeelte van het gebouw dat is bestemd om als afzonderlijk geheel te worden gebruikt, alsmede de
      aard en de kadastrale aanduiding van dat appartementsrecht.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister kan regelen vaststellen omtrent de wijze waarop de plaatselijke aanduiding, bedoeld in het eerste
      lid, in het ter inschrijving aangeboden stuk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel20
  - number: '21.1'
    text: |-
      Indien het in te schrijven feit betrekking heeft op een in de registratie voor schepen, bedoeld in
      [artikel 85][ref1], te boek staand schip of op een recht waaraan een zodanige zaak is onderworpen, bevat het ter
      inschrijving aangeboden stuk:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: 21.1.a
    text: |-
      de naam van het schip met vermelding van het gebruik waartoe het is bestemd, en zijn bruto-inhoud of bruto-tonnage
      dan wel, indien het een binnenschip betreft, zijn laadvermogen in tonnen van 1.000 kilogram of verplaatsing in
      kubieke meters;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: 21.1.b
    text: |-
      het type en de inrichting van het schip, het materiaal waarvan de romp is gemaakt, jaar en plaats van de bouw,
      en, voor zover het een schip met een mechanische voortstuwing betreft, ook al betreft het slechts een hulpmotor,
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: 21.1.c
    text: |-
      het nummer waaronder de teboekstelling van het schip in de openbare registers is geschied, de aanwijzing van de
      rubriek waartoe dat schip behoort, de aanduiding van het kantoor van de Dienst waar de teboekstelling is geschied,
      en het jaar van teboekstelling, welke gegevens tezamen in genoemde volgorde het brandmerk van het schip vormen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent de in het eerste lid, onder *c*, bedoelde
      onderscheiding van rubrieken van schepen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: '21.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op ter inschrijving aangeboden rechterlijke uitspraken. Deze
      stukken kunnen, onverminderd andere vereisten gesteld bij of krachtens wet, echter slechts worden ingeschreven,
      indien en voor zover de identiteit van het desbetreffende schip voldoende vaststaat.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: '21.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan worden volstaan met het vermelden van de naam van het schip en
      de in dat lid, onder *c*, genoemde gegevens in het ter inschrijving aangeboden stuk, indien dat stuk betreft:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: 21.4.a
    text: |-
      de doorhaling van de teboekstelling van een schip, bedoeld in de [artikelen 195, eerste lid][ref1], en
      [786, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '195'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '786'
  - number: 21.4.b
    text: |-
      de aangifte van de eigenaar inhoudende dat het schip een wijziging heeft ondergaan waardoor de beschrijving van
      het schip in de registratie voor schepen, bedoeld in [artikel 85, tweede lid, onder f en g][ref1], niet meer aan de
      werkelijkheid beantwoordt;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: 21.4.c
    text: |-
      een afwijkend beding, als bedoeld in [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: 21.4.d
    text: de verandering van een door de eigenaar van een schip in een ingeschreven stuk gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel21
  - number: '22.1'
    text: |-
      Indien het in te schrijven feit betrekking heeft op een in de registratie voor luchtvaartuigen, bedoeld in
      [artikel 92][ref1], te boek staand luchtvaartuig of op een recht waaraan een zodanige zaak is onderworpen, bevat
      het ter inschrijving aangeboden stuk:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel92
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '92'
        hoofdstuk: '6'
  - number: 22.1.a
    text: |-
      het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld in
      [artikel 3.2, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 22.1.b
    text: |-
      de naam en woonplaats van de fabrikant en het type van het luchtvaartuig, jaar en plaats van de bouw, het
      serienummer zo het luchtvaartuig dat heeft met vermelding van de plaats waar dit nummer is aangebracht, en
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel22
  - number: 22.1.c
    text: de maximaal toegelaten startmassa van het luchtvaartuig en, indien het luchtvaartuig een naam voert, de naam ervan;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel22
  - number: 22.1.d
    text: het nummer waaronder de teboekstelling van het luchtvaartuig in de openbare registers is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 21, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '23'
    text: |-
      Vermeldt een ter inschrijving aangeboden stuk niet één of meer der gegevens, in de [artikelen 19-22][ref1] voor
      een zodanig stuk voorgeschreven, en is het naar zijn aard niet voor aanvulling te dier zake vatbaar, dan wordt
      de vermelding van de ontbrekende gegevens in een nadere, door degene die de inschrijving verlangt, ondertekende
      verklaring alsnog op het stuk gesteld of daaraan gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel19
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '19'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '24.1'
    text: |-
      Ter inschrijving van een akte van levering, vereist voor de overdracht van een registergoed, voor de vestiging,
      afstand of wijziging van een beperkt recht dat een registergoed is, of voor de overgang van een registergoed na
      toedeling uit hoofde van de verdeling van een gemeenschap, wordt aangeboden een authentiek afschrift dan wel een
      authentiek uittreksel van de notariële akte betreffende deze levering. In geval van vestiging van een recht van
      hypotheek op een schip in aanbouw wordt mede ter inschrijving aangeboden een verklaring van een ambtenaar van de
      Dienst belast met het aanbrengen van brandmerken op te boek staande schepen of van een andere door de bewaarder
      daarmee belaste persoon, inhoudende dat de bouw van het schip nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: '24.2'
    text: 'Het ter inschrijving aangeboden stuk, bedoeld in het eerste lid, bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.a
    text: 'de titel op grond waarvan de levering plaatsvindt en, in geval van vestiging van een recht van hypotheek, tevens:'
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.a.1°
    text: |-
      een aanduiding van de vordering waarvoor het recht van hypotheek tot zekerheid strekt, of van de feiten aan de hand
      waarvan die vordering zal kunnen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.a.2°
    text: |-
      het bedrag waarvoor het recht van hypotheek wordt gevestigd of, wanneer dit bedrag nog niet vaststaat, het
      maximumbedrag dat uit hoofde van dat recht van hypotheek op het goed kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.a.3°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand zeeschip of op een recht waaraan een
      zodanige zaak is onderworpen, bovendien: een duidelijke vermelding van het aan de hypotheek onderworpen schip;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.a.4°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand binnenschip of op een recht waaraan een
      zodanige zaak is onderworpen, bovendien: een duidelijke vermelding van het aan de hypotheek onderworpen schip, de
      voorwaarden voor opeisbaarheid of een verwijzing naar een op het kantoor van inschrijving ingeschreven document
      waarin deze voorwaarden zijn vastgelegd, alsmede de bedongen rente en de tijdstippen waarop deze vervalt;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.a.5°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand luchtvaartuig, bovendien: een duidelijke
      vermelding van het aan de hypotheek onderworpen luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.b
    text: |-
      de wettelijke benaming van het recht, op de levering waarvan het ter inschrijving aangeboden stuk betrekking heeft
      of, ingeval dat recht geen wettelijke benaming heeft:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.b.1°
    text: de gangbare benaming, dan wel de vermelding dat het recht geen gangbare benaming heeft;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.b.2°
    text: de wetsbepaling volgens welke het recht kan worden gevestigd of een registergoed is;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
  - number: 24.2.b.3°
    text: |-
      in geval van een recht als bedoeld in [artikel 150, eerste lid, van de Overgangswet nieuw Burgerlijk Wetboek][ref1],
      de omschrijving van de inhoud van dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel150
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '150'
  - number: '24.3'
    text: |-
      Het eerste lid, eerste zin, en tweede lid zijn van overeenkomstige toepassing op de inschrijving van het proces-
      verbaal van toewijzing, bedoeld in de [artikelen 525, eerste lid][ref1], en [584 ][ref2], onverminderd hetgeen in
      ieder van de artikelen in het tweede lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel525
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '525'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '584'
  - number: '24.4'
    text: |-
      Het aangeboden stuk mag op meer leveringen, als bedoeld in het eerste lid, betrekking hebben, voor zover voor ieder
      daarvan aan de in de vorige leden gestelde eisen is voldaan. Betreft het stuk een overdracht onder voorbehoud van
      een beperkt recht of van een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1], dan
      wordt de vestiging van dit recht dan wel het op zich nemen van het beding afzonderlijk en duidelijk vermeld, bij
      gebreke waarvan de inschrijving van het stuk geacht wordt niet mede dit recht of dit beding te betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '24.5'
    text: |-
      Het eerste lid, eerste zin, is van overeenkomstige toepassing op de inschrijving van een akte van grensvastlegging,
      opgemaakt krachtens de [artikelen 31][ref1] of [35, derde lid, van Boek 5 van het Burgerlijk Wetboek][ref2],
      alsmede op de inschrijving van een akte van splitsing, als bedoeld in
      [artikel 109, eerste lid, van Boek 5 van dat wetboek][ref3], en een akte tot wijziging of opheffing van een
      zodanige splitsing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '109'
  - number: '24.6'
    text: |-
      Het eerste lid, eerste zin, is van overeenkomstige toepassing op de inschrijving van een akte van vernieuwing als
      bedoeld in [artikel 77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel77
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '77'
        hoofdstuk: '4'
        afdeling: '3'
  - number: '25.1'
    text: |-
      Ter inschrijving van een rechterlijke uitspraak die voor een akte van levering in de plaats treedt of die
      anderszins krachtens wetsbepaling kan worden ingeschreven, wordt een expeditie van de rechterlijke uitspraak
      aangeboden, alsmede:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: 25.1.a
    text: |-
      indien de rechterlijke uitspraak slechts inschrijfbaar is, nadat zij in kracht van gewijsde is gegaan: een
      verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan, inhoudende dat daartegen geen gewoon
      rechtsmiddel meer openstaat;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: 25.1.b
    text: |-
      indien de onder *a* bedoelde eis voor inschrijfbaarheid niet is gesteld en de rechterlijke uitspraak niet
      uitvoerbaar bij voorraad is: een verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan,
      inhoudende:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: 25.1.b.1°
    text: |-
      hetzij dat daartegen geen gewoon rechtsmiddel meer openstaat, hetzij dat hem drie maanden na de uitspraak niet van
      het instellen van een gewoon rechtsmiddel is gebleken;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: 25.1.b.2°
    text: |-
      zo het rechtsmiddel bij verzoekschrift moet worden ingesteld, dat ook de griffier van het gerecht waar dit
      verzoekschrift moet worden ingediend, niet van het instellen van een rechtsmiddel is gebleken;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: 25.1.c
    text: |-
      indien voor de inschrijving betekening aan de veroordeelde vereist is, een door de deurwaarder getekend afschrift
      van het exploit waarbij de betekening is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: '25.2'
    text: |-
      Ter inschrijving van een beslissing van de rechter van een vreemde Staat wordt een authentiek afschrift van deze
      beslissing aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: '25.3'
    text: |-
      Bestaat de rechterlijke uitspraak in een verlof tot tenuitvoerlegging van een beslissing van arbiters, dan wordt
      ook een afschrift van deze beslissing aangeboden, getekend door de griffier van het gerecht waarvan de president
      het verlof gaf.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel25
  - number: '26.1'
    text: |-
      Ter inschrijving van een rechtshandeling naar burgerlijk recht die krachtens wetsbepaling kan worden ingeschreven,
      worden, tenzij anders is bepaald, aangeboden authentieke afschriften van een door een notaris met inachtneming
      van [artikel 37][ref1] opgemaakte verklaring, inhoudende dat de rechtshandeling naar de verklaring van degene
      die de inschrijving verlangt, is verricht en wat zij inhoudt, en van de daaraan gehechte stukken waaruit van die
      rechtshandeling blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '26.2'
    text: |-
      Ingeval voor de rechtshandeling of de inschrijving daarvan een notariële akte is vereist, wordt aangeboden een
      authentiek afschrift of een authentiek uittreksel van die akte.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel26
  - number: '26.3'
    text: |-
      Ingeval van de rechtshandeling een notariële akte is opgemaakt, zonder dat dit vereist was, kan naar keuze van
      degene die de inschrijving verlangt het eerste of tweede lid worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel26
  - number: '26.4'
    text: |-
      Ingeval het gaat om een eenzijdige tot één of meer bepaalde personen gerichte rechtshandeling, kan worden volstaan
      met aanbieding van een aan die persoon of personen uitgebracht exploit, waarbij die rechtshandeling is verricht of
      tijdig bevestigd, of een authentiek afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel26
  - number: '26.5'
    text: |-
      Ingeval de rechtshandeling betreft een scheepshuurkoopovereenkomst waarop
      [artikel 800, tweede lid, van Boek 8 van het Burgerlijk Wetboek][ref1] van toepassing is, worden ter inschrijving
      aangeboden hetzij authentieke afschriften van de in het eerste lid van dat artikel bedoelde notariële akte en
      van de daaraan gehechte stukken inhoudende de in het tweede lid van dat artikel bedoelde toestemming, hetzij een
      authentiek uittreksel van die akte en authentieke afschriften van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel800
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '800'
  - number: '26.6'
    text: |-
      Ter inschrijving van een afwijkend beding, als bedoeld in
      [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref1], wordt, in afwijking van het bepaalde in het
      eerste lid, een door de eigenaar van het schip ondertekende verklaring aangeboden, waarin het scheepstoebehoren ten
      aanzien waarvan het afwijkend beding is gemaakt, eenduidig is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: '27.1'
    text: |-
      Ter inschrijving van erfopvolgingen die registergoederen betreffen, wordt een authentiek afschrift van een door een
      notaris opgemaakte verklaring van erfrecht als bedoeld in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1]
      aangeboden, waaruit van de erfopvolging blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
  - number: '27.2'
    text: |-
      Ter inschrijving van een executele, een bij uiterste wilsbeschikking ingesteld bewind of de benoeming van een
      vereffenaar van de nalatenschap wordt een authentiek afschrift van een verklaring van erfrecht als bedoeld
      in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1] aangeboden, waaruit van de executele, het bewind
      onderscheidenlijk de benoeming blijkt. De eerste zin laat onverlet de mogelijkheid van inschrijving van de
      benoeming van een vereffenaar door inschrijving van de desbetreffende rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
  - number: '27.3'
    text: |-
      Ter inschrijving van een verkrijging door de Staat van registergoederen krachtens
      [artikel 189 van Boek 4 van het Burgerlijk Wetboek][ref1] wordt een authentiek afschrift van een verklaring van een
      notaris aangeboden, waarin deze vermeldt dat het registergoed door de Staat krachtens dat artikel is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel189
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '189'
  - number: '27.4'
    text: |-
      Ter inschrijving van afgifte aan de Staat van registergoederen krachtens
      [artikel 226, eerste en tweede lid, van Boek 4 van het Burgerlijk Wetboek][ref1] wordt aangeboden een verklaring
      van de vereffenaar waarin deze vermeldt op welk tijdstip het registergoed aan de Staat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel226
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '226'
  - number: '27.5'
    text: |-
      Ter inschrijving van het verval aan de Staat van registergoederen of hetgeen daarvoor in de plaats is gekomen
      krachtens [artikel 226, vierde lid, van Boek 4 van het Burgerlijk Wetboek][ref1] wordt aangeboden een verklaring
      van Onze Minister van Financiën, inhoudende dat tijdens het in dat artikel genoemde tijdvak van twintig jaren die
      goederen niet zijn opgeëist.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel226
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '226'
  - number: '28'
    text: |-
      Ter inschrijving van de aanvaarding van een nalatenschap onder het voorrecht van boedelbeschrijving of
      de verwerping van een nalatenschap wordt een door de griffier getekend uittreksel uit het boedelregister
      aangeboden, inhoudende de verklaring betreffende de aanvaarding of de verwerping die krachtens
      [artikel 191 van Boek 4 van het Burgerlijk Wetboek][ref1] in het boedelregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel191
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '191'
  - number: '29'
    text: |-
      Ter inschrijving van de afstand van een huwelijksgemeenschap of van een gemeenschap van geregistreerd partnerschap
      wordt een door de griffier getekend uittreksel uit het huwelijksgoederenregister aangeboden, inhoudende de
      verklaring betreffende de afstand, die krachtens [artikel 104 van Boek 1 van het Burgerlijk Wetboek][ref1] in het
      huwelijksgoederenregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel104
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '104'
  - number: '30.1'
    text: |-
      Ter inschrijving van de vervulling van een voorwaarde, gesteld in een ingeschreven voorwaardelijke rechtshandeling,
      of van de verschijning van een onzeker tijdstip, aangeduid in de aan een ingeschreven rechtshandeling verbonden
      tijdsbepaling, worden aangeboden authentieke afschriften van een door een notaris met inachtneming van
      [artikel 37][ref1] opgemaakte verklaring, inhoudende dat naar de verklaring van degene die de inschrijving
      verlangt, de voorwaarde is vervuld, onderscheidenlijk het tijdstip is verschenen, en van de daaraan gehechte
      stukken waaruit van deze vervulling of verschijning blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '30.2'
    text: |-
      Het vorige lid is van overeenkomstige toepassing op de inschrijving van de dood van de vruchtgebruiker van een
      registergoed. De verklaring van de notaris houdt in dit geval tevens in:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel30
  - number: 30.2.a
    text: het tijdstip van overlijden van de vruchtgebruiker, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel30
  - number: 30.2.b
    text: |-
      of het vruchtgebruik is vervallen, dan wel bij wie het vruchtgebruik na de dood van de vruchtgebruiker is
      verbleven.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel30
  - number: '31'
    text: |-
      Op de inschrijving van reglementen en andere regelingen die tussen medegerechtigden in registergoederen zijn
      vastgesteld, zijn van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel31
  - number: 31.a
    text: |-
      voor zover het reglement of de regeling door de rechter is vastgesteld: [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel25
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '25'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 31.b
    text: |-
      voor zover het reglement of de regeling bij rechtshandeling is vastgesteld: [artikel 26, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '32.1'
    text: |-
      Ter inschrijving van een proces-verbaal van inbeslagneming wordt dit proces-verbaal of een door de deurwaarder of
      een advocaat getekend afschrift daarvan aangeboden. [Artikel 18, tweede-vijfde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '32.2'
    text: |-
      Ingeval een proces-verbaal van inbeslagneming van een luchtvaartuig in het buitenland is opgemaakt door een
      deurwaarder of andere volgens de daar geldende wet hiertoe bevoegde persoon, kan ook een zodanig proces-verbaal ter
      inschrijving worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
  - number: '32.3'
    text: |-
      Ter inschrijving van een der in de [artikelen 211][ref1] en [821 van Boek 8 van het Burgerlijk Wetboek][ref2]
      genoemde voorrechten, wordt aangeboden een door een deurwaarder ondertekend verzoek tot inschrijving van het
      voorrecht, inhoudende naar de verklaring van degene die de inschrijving verlangt:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '821'
  - number: 32.3.a
    text: de aanduiding van de vordering waar het om gaat;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
  - number: 32.3.b
    text: |-
      het beloop der vordering ten tijde van het ondertekenen door de deurwaarder van het verzoek, of van de feiten aan
      de hand waarvan die vordering zal kunnen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
  - number: 32.3.c
    text: |-
      de omschrijving van het voorrecht door vermelding van het wettelijk voorschrift, op grond waarvan aan die vordering
      het voorrecht is toegekend, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
  - number: 32.3.d
    text: |-
      het tijdstip waarop de vordering is ontstaan. Indien het verzoek van de deurwaarder ter inschrijving
      wordt aangeboden na verloop van de termijn, genoemd in [artikel 219, eerste lid][ref1], onderscheidenlijk
      [artikel 829, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2], wordt ter inschrijving tevens aangeboden
      een stuk waaruit blijkt dat de schuldeiser zijn vordering binnen die termijn in rechte heeft geldend gemaakt, op de
      inschrijving van welk bewijsstuk [artikel 38][ref3] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel219
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel829
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel38
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '219'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '829'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '32.4'
    text: |-
      Op de inschrijving van een voorrecht, als bedoeld in
      [artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1] is het bepaalde in de eerste zin van het
      derde lid van overeenkomstige toepassing. Indien het verzoek van de deurwaarder ter inschrijving wordt aangeboden
      drie maanden of langer na het in die zin, onder *d*, bedoelde tijdstip, wordt ter inschrijving tevens aangeboden
      een stuk waaruit blijkt dat binnen de in [artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2]
      genoemde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1320
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1320
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1320'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1320'
  - number: 32.4.a
    text: het bedrag der vordering in der minne is vastgesteld, dan wel
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
  - number: 32.4.b
    text: |-
      langs gerechtelijke weg erkenning van het voorrecht en de omvang ervan is gevorderd, op de inschrijving van welk
      bewijsstuk in het onder *b* bedoelde geval [artikel 38][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel38
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '33.1'
    text: |-
      Ter inschrijving van een verandering in de voornaam of de geslachtsnaam van tot registergoederen gerechtigde
      natuurlijke personen wordt een door of namens deze persoon ondertekend stuk aangeboden, inhoudende de gegevens,
      bedoeld in [artikel 18, eerste lid, onder 1°][ref1], met vermelding van de oude en de nieuwe naam of voornaam,
      en de dag waarop de verandering is ingegaan. Indien de verandering blijkt uit de registers van de burgerlijke
      stand, wordt een uittreksel daaruit overgelegd, dat de verandering relateert. In andere gevallen wordt een ander
      bewijsstuk betreffende deze verandering overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.2'
    text: |-
      Ter inschrijving van de naamsverandering van een rechtspersoon wordt een opgave van een notaris aangeboden,
      inhoudende de gegevens, bedoeld in [artikel 18, eerste lid, onder 2°][ref1], met vermelding van de oude en de
      nieuwe naam en de dag waarop de verandering is ingegaan. Gaat het om een publiekrechtelijke rechtspersoon, dan kan
      deze de opgave zelf doen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.3'
    text: |-
      Ter inschrijving van een omzetting van een rechtspersoon, als bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende de in [artikel 18, eerste lid, onder 2°][ref2], bedoelde gegevens, met vermelding van de
      oude en nieuwe rechtsvorm, de oude en nieuwe naam alsmede van de dag waarop de omzetting van kracht is
      geworden. Het bepaalde in de eerste zin is van overeenkomstige toepassing op een omzetting, als bedoeld in
      [artikel 8, eerste en tweede lid, van de Wet van 28 juni 1989 (][ref3] (*PbEG* L 199/1).


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004579#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004579
        artikel: '8'
  - number: '33.4'
    text: |-
      Ter inschrijving van een fusie van rechtspersonen, als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende met betrekking tot elk der fuserende rechtspersonen en, zo de verkrijgende rechtspersoon een door
      hen samen bij de fusie opgerichte nieuwe rechtspersoon is, tevens met betrekking tot die rechtspersoon de in
      [artikel 18, eerste lid, onder 2°][ref2], bedoelde gegevens, met vermelding wie de verkrijgende rechtspersoon is
      alsmede van de dag waarop de fusie van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.5'
    text: |-
      Ter inschrijving van een splitsing van rechtspersonen als bedoeld in
      [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1], wordt een opgave van een notaris aangeboden, inhoudende
      met betrekking tot elke partij bij de splitsing en, zo bij de splitsing verkrijgende rechtspersonen worden
      opgericht, tevens met betrekking tot die rechtspersonen de in [artikel 18, eerste lid, onder 2°][ref2], bedoelde
      gegevens, met vermelding op welke verkrijgende rechtspersoon welke registergoederen zijn overgegaan alsmede van de
      dag waarop de splitsing van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '34'
    text: |-
      Ter inschrijving van een verjaring wordt een authentiek afschrift van een door een notaris met inachtneming
      van [artikel 37][ref1] opgemaakte verklaring aangeboden, inhoudende dat naar de verklaring van degene die de
      inschrijving verlangt, de verjaring is ingetreden, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 34.a
    text: welk registergoed door verjaring is verkregen, dan wel welk beperkt recht op een registergoed is tenietgegaan;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel34
  - number: 34.b
    text: tegen wie de verjaring werkt, indien dit bekend is;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel34
  - number: 34.c
    text: welke feiten tot de verjaring hebben geleid, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel34
  - number: 34.d
    text: dat de verjaring wordt betwist of niet wordt betwist door degene tegen wie zij werkt, zo dit bekend is.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel34
  - number: '35.1'
    text: |-
      Ter inschrijving van een of meer verklaringen van waardeloosheid als bedoeld in
      [artikel 28 van Boek 3 van het Burgerlijk Wetboek][ref1] worden aangeboden authentieke afschriften van een door
      een notaris opgemaakte verklaring, inhoudende dat degenen te wier behoeve de inschrijving zou hebben gestrekt,
      schriftelijk hebben verklaard dat zij waardeloos is, en van deze schriftelijke verklaringen die aan die notariële
      verklaring zijn gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel28
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '28'
  - number: '35.2'
    text: |-
      Tenzij de inschrijving een hypotheek of een beslag betreft, vermelden de in het eerste lid bedoelde schriftelijke
      verklaringen van degenen te wier behoeve de inschrijving zou hebben gestrekt, tevens de feiten waarop de
      waardeloosheid berust, en houdt de in dat lid bedoelde verklaring van de notaris tevens in dat de vermelde feiten
      een rechtsgrond voor de waardeloosheid van de inschrijving opleveren.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel35
  - number: '35.3'
    text: |-
      Ter inschrijving van een verklaring als bedoeld in [artikel 273 van Boek 3 van het Burgerlijk Wetboek][ref1] wordt
      aangeboden een authentiek afschrift van die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel273
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '273'
  - number: '35.4'
    text: |-
      Ter inschrijving van een verklaring als bedoeld in [artikel 274 van Boek 3 van het Burgerlijk Wetboek][ref1] wordt
      aangeboden een authentiek afschrift van de desbetreffende authentieke akte.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel274
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '274'
  - number: '36.1'
    text: |-
      Ter inschrijving van het feit dat het nut van een mandelige zaak voor elk der erven is geëindigd, wordt een door
      een authentiek afschrift van een door een notaris met inachtneming van [artikel 37][ref1] opgemaakte verklaring
      aangeboden, inhoudende dat naar de verklaring van hen die de inschrijving verlangen, het nut voor elk der erven is
      geëindigd. Werken niet alle rechthebbenden op de mandelige zaak mee, dan vermeldt de notaris in zijn verklaring de
      reden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '36.2'
    text: |-
      Ter inschrijving van het bestaan van een recht, als bedoeld in
      [artikel 150, eerste lid, van de Overgangswet nieuw Burgerlijk Wetboek][ref1] (*Stb.* 1976, 396), worden aangeboden
      authentieke afschriften van een door een notaris met inachtneming van [artikel 37][ref2] opgemaakte verklaring,
      waarin het bestaan van het recht wordt geconstateerd, en die tevens inhoudt:


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '150'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 36.2.a
    text: de omschrijving van de inhoud van het recht;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
  - number: 36.2.b
    text: zo mogelijk, de gangbare benaming ervan dan wel de verklaring, dat dat recht niet een zodanige benaming heeft, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
  - number: 36.2.c
    text: wie de rechthebbende op dat recht is,
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
  - number: '36.3'
    text: |-
      Ter inschrijving van het ontstaan van een erfdienstbaarheid door bestemming of herleving, bedoeld in
      [artikel 163, eerste zin, van de Overgangswet nieuw Burgerlijk Wetboek][ref1], worden aangeboden authentieke
      afschriften van een door een notaris met inachtneming van [artikel 37][ref2] opgemaakte verklaring, waarin het
      ontstaan van de erfdienstbaarheid wordt geconstateerd, en die tevens inhoudt:


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 36.3.a
    text: de omschrijving van de inhoud van de erfdienstbaarheid, en
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
  - number: 36.3.b
    text: wie de rechthebbende op dat recht is,
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel36
  - number: '37.1'
    text: |-
      Een notariële verklaring, als bedoeld in de [artikelen 26][ref1], [30][ref2], [34][ref3] en [36][ref4], houdt
      behalve hetgeen in deze artikelen is voorgeschreven, tevens in een verklaring van de notaris:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 37.1.a
    text: |-
      hetzij dat allen die als partij bij het in te schrijven feit betrokken zijn aan de notaris hebben medegedeeld met
      de inschrijving in te stemmen;
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
  - number: 37.1.b
    text: |-
      hetzij dat bewijsstukken aan hem zijn overgelegd en aan de verklaring gehecht, die genoegzaam aantonen dat
      het in te schrijven feit zich inderdaad heeft voorgedaan dan wel, in geval van een verklaring als bedoeld in
      [artikel 36, tweede lid][ref1], dat het recht bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 37.1.c
    text: hetzij dat hij niet aan het onder *a* en *b* gestelde kan voldoen.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
  - number: '37.2'
    text: |-
      In het in het eerste lid, onder *c*, bedoelde geval boekt de bewaarder de
      aanbieding van de notariële verklaring slechts in het register van voorlopige
      aantekeningen en kan inschrijving alleen plaatsvinden op bevel van de rechter. Het
      __REF000___________________________________________________________________________________________________________
      _____________________ zijn van overeenkomstige toepassing met dien verstande, dat het bevel slechts wordt gegeven,
      indien de eiser naast de bewaarder allen die als partij bij het in te schrijven feit zijn betrokken, tijdig in het
      geding heeft geroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: '37.3'
    text: |-
      De kosten van het geding blijven voor rekening van de eiser, tenzij de vordering ondanks verweer wordt toegewezen,
      in welk geval degene die het verweer heeft gevoerd in de kosten wordt veroordeeld.
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
  - number: '37.4'
    text: |-
      Wanneer het aangeboden stuk ook overigens niet aan de vereisten voor inschrijving voldoet,
      vermeldt de bewaarder bij de voorlopige aantekening tevens de gerezen bedenkingen en is
      [artikel 20 van Boek 3 van het Burgerlijk Wetboek][ref1] in dier voege van toepassing dat het daarbedoelde bevel
      slechts tezamen met dat uit hoofde van het tweede lid kan worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: 37a
    text: |-
      Een notariële verklaring als bedoeld in de [artikelen 26][ref1], [27, derde lid][ref2], [30][ref3],
      [31, onder b][ref4], juncto [26, eerste lid][ref5], [34][ref6], [35][ref7], [36][ref8] en [46a][ref9], wordt
      opgemaakt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel35
      [ref8]: https://wetten.overheid.nl/BWBR0004541#Artikel36
      [ref9]: https://wetten.overheid.nl/BWBR0004541#Artikel46a
    url: https://wetten.overheid.nl/BWBR0004541/2006-02-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '27'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '31'
        hoofdstuk: '2'
        afdeling: '2'
