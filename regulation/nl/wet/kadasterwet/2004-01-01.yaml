  - number: '2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent de wijze van kadastrale aanduiding
      van onroerende zaken en appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2
  - number: 2a
    text: 'De Dienst heeft, onverminderd het bepaalde in andere wettelijke voorschriften, als doeleinden:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.a
    text: 'de bevordering van de rechtszekerheid ten aanzien van registergoederen:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.a.1°
    text: in het rechtsverkeer;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.a.2°
    text: in het economisch verkeer;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.a.3°
    text: in het bestuurlijk verkeer tussen burgers en bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.b
    text: de bevordering van een doelmatige geo-informatie-infrastructuur;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.c
    text: |-
      een doelmatige informatievoorziening van de overheid ten behoeve van de goede vervulling van publiekrechtelijke
      taken en de nakoming van wettelijke verplichtingen door bestuursorganen, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: 2a.d
    text: ondersteuning en bevordering van de economische activiteiten.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel2a
  - number: '3.1'
    text: 'De Dienst heeft, onverminderd het bepaalde in andere wettelijke voorschriften, tot taak:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.a
    text: het houden van openbare registers voor registergoederen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.b
    text: |-
      het houden en bijwerken van de kadastrale registratie en het vervaardigen, houden en bijwerken van kadastrale
      kaarten en daaraan ten grondslag liggende bescheiden;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.c
    text: het instandhouden van een net van coördinaatpunten;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.d
    text: het houden en bijwerken van een registratie voor schepen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.e
    text: het houden en bijwerken van een registratie voor luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.f
    text: |-
      het vervaardigen, verzamelen, houden en bijwerken van geografische gegevens en het uniform, consistent en
      landsdekkend cartografisch weergeven daarvan;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.g
    text: |-
      het in opdracht van Onze Minister van Defensie vervaardigen, verzamelen, houden en bijwerken van geografische
      gegevens ten behoeve van de krijgsmacht, het uniform en consistent overeenkomstig diens opdracht cartografisch
      weergeven van die gegevens en het aan Onze Minister van Defensie verstrekken van inlichtingen omtrent die gegevens;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.h
    text: |-
      het verstrekken van inlichtingen omtrent gegevens, die de Dienst heeft verkregen in het kader van de uitvoering van
      de taken, bedoeld in de onderdelen a tot en met f;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.i
    text: |-
      het bevorderen van de toegankelijkheid en de uitwisselbaarheid van gegevens als bedoeld in de onderdelen a tot en
      met f;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: 3.1.j
    text: |-
      het vervaardigen en verstrekken van informatie door verwerking van gegevens als bedoeld in de onderdelen a tot
      en met f, voorzover het vervaardigen en verstrekken van die informatie niet onverenigbaar zijn met de doeleinden,
      genoemd in [artikel 2a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
  - number: 3.1.k
    text: |-
      het in opdracht van een of meer van Onze ministers verrichten van werkzaamheden of het aan een of meer van Onze
      ministers verstrekken van informatie over gegevens als bedoeld in de onderdelen a tot en met f ter nakoming van
      op Nederland rustende internationale verplichtingen uit verdragen en overeenkomsten of daarop gebaseerde besluiten
      overeenkomstig die verdragen, overeenkomsten of besluiten.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan de Dienst andere taken dan genoemd in het eerste lid worden
      opgedragen of marktactiviteiten worden toegestaan, voorzover die taken en marktactiviteiten verband houden met de
      taken, genoemd in het eerste lid, en niet onverenigbaar zijn met de doeleinden, genoemd in [artikel 2a][ref1]. Bij
      algemene maatregel van bestuur kan worden bepaald dat Onze Minister nadere regels kan stellen met betrekking tot de
      uitvoering van de bij die maatregel opgedragen taken of toegestane marktactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
  - number: 3a.1
    text: |-
      De Dienst verzamelt persoonsgegevens als bedoeld in
      [artikel 1, onderdeel a, van de Wet bescherming persoonsgegevens][ref1] voor de doeleinden, genoemd in
      [artikel 2a][ref2], onverminderd het bepaalde in andere wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 2a
        hoofdstuk: '1'
  - number: 3a.2
    text: |-
      De Dienst verwerkt geen persoonsgegevens in verband met de totstandbrenging of de instandhouding van een directe
      relatie tussen de Dienst of een derde en de betrokkene met het oog op werving voor commerciële of charitatieve
      doelen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3a
  - number: 3b
    text: |-
      Ten aanzien van verwerkingen als bedoeld in [artikel 3a][ref1] is het bestuur van de Dienst verantwoordelijke in de
      zin van [artikel 1, eerste lid, onderdeel d, van de Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 3a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 3c.1
    text: 'Het bestuur van de Dienst stelt jaarlijks in de maand januari een overzicht op van:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: 3c.1.a
    text: 'de soorten van gegevens die zijn opgenomen in:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: 3c.1.a.1°
    text: de kadastrale registratie;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: 3c.1.a.2°
    text: de registratie voor schepen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: 3c.1.a.3°
    text: de registratie voor luchtvaartuigen, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: 3c.1.b
    text: de soorten van gegevens die worden weergegeven op de kadastrale kaarten.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: 3c.2
    text: Het bestuur van de Dienst plaatst het overzicht, bedoeld in het eerste lid, in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel3c
  - number: '4.1'
    text: |-
      De in [artikel 3, eerste lid][ref1], bedoelde registers, registraties, kaarten en bescheiden worden gehouden,
      voor zover onroerende zaken en de rechten waaraan deze zijn onderworpen betreffend, aan elk der kantoren van de
      Dienst voor zover hun kring betreffend, en, voor zover schepen onderscheidenlijk luchtvaartuigen en de rechten
      waaraan deze zijn onderworpen betreffend, aan één of meer door het bestuur van de Dienst te bepalen kantoren van
      de Dienst. Indien het bestuur van de Dienst bepaalt dat de in [artikel 3, eerste lid][ref2], bedoelde registers
      en registraties, voor zover schepen onderscheidenlijk luchtvaartuigen betreffend, worden gehouden aan meer dan één
      kantoor van de Dienst, dan worden zij aan elk der desbetreffende kantoren gehouden voor zover hun kring betreffend,
      en bepaalt het bestuur van de Dienst tevens welk van de desbetreffende kantoren hoofdkantoor van de openbare
      registers en registratie voor schepen, onderscheidenlijk voor luchtvaartuigen is. Bij of krachtens algemene
      maatregel van bestuur worden alsdan regelen gesteld omtrent dat hoofdkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.2'
    text: |-
      De in [artikel 3, eerste lid][ref1], bedoelde geografische gegevens worden gehouden aan een door het bestuur van de
      Dienst te bepalen kantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel3
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.3'
    text: |-
      Het bestuur van de Dienst bepaalt in welke gemeenten de kantoren van de Dienst zijn gevestigd en welke gemeenten
      behoren tot de kring van een kantoor van de Dienst. Het bestuur van de Dienst bepaalt voorts de tijden gedurende
      welke deze kantoren voor het publiek zijn opengesteld.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het bestuur van de Dienst bepaalt op welke wijze uitvoering wordt gegeven aan een wijziging van de grens tussen
      twee kringen als bedoeld in de eerste zin van het tweede lid, en aan verplichtingen van bewaarders tot het
      verrichten van ambtshalve inschrijvingen en andere ambtshalve handelingen die meer kringen betreffen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel4
  - number: '6.1'
    text: |-
      Onder de benaming van bewaarder van het kadaster en de openbare registers is aan elk kantoor van de Dienst een
      bewaarder die door het bestuur van de Dienst wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel6
  - number: '6.2'
    text: 'Tot bewaarder kunnen alleen worden benoemd zij die:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel6
  - number: 6.2.a
    text: |-
      op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het recht om de titel meester te
      voeren hebben verkregen. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot
      de beroepsvereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 6.2.b
    text: een door het bestuur van de Dienst voldoende verklaarde opleiding van gelijkwaardige aard hebben, dan wel
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel6
  - number: 6.2.c
    text: |-
      in het bezit zijn van een ten aanzien van het beroep van bewaarder afgegeven EG-verklaring
      als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '6.3'
    text: |-
      Bij afwezigheid, belet, ontstentenis of schorsing van een bewaarder wordt deze waargenomen door een der andere
      bewaarders op een door het bestuur van de Dienst te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel6
  - number: '7.1'
    text: De bewaarder is, onverminderd het bepaalde bij of krachtens deze of een andere wet, belast met
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
  - number: 7.1.a
    text: |-
      het bewaren van de openbare registers, bedoeld in [artikel 8, eerste lid][ref1], het verrichten van inschrijvingen
      in die registers, alsmede het stellen in die registers van aantekeningen, daaronder begrepen doorhalingen van
      inschrijvingen;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7.1.b
    text: |-
      het bewaren en bijwerken van de kadastrale registratie, bedoeld in [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
        hoofdstuk: '3'
  - number: 7.1.c
    text: het bewaren van door het bestuur van de Dienst aan te wijzen kaarten;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
  - number: 7.1.d
    text: |-
      het bewaren en bijwerken van de registratie voor schepen, bedoeld in [artikel 85][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: 7.1.e
    text: |-
      het bewaren en bijwerken van de registratie voor luchtvaartuigen, bedoeld in [artikel 92][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel92
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '92'
        hoofdstuk: '6'
  - number: '7.2'
    text: |-
      Het bestuur van de Dienst kan de bewaarder ter zake van de werkzaamheden en bevoegdheden die hem zijn opgedragen
      onderscheidenlijk toegekend bij of krachtens deze of een andere wet, richtlijnen en aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7
  - number: 7a.1
    text: |-
      Personen die door de Dienst, het bestuur van de Dienst of een daartoe op grond van een wettelijk voorschrift
      bevoegde functionaris van de Dienst zijn belast met aan de uitvoering van de aan de Dienst opgedragen taken
      verbonden werkzaamheden, zijn bevoegd, met medeneming van de benodigde apparatuur en andere hulpmiddelen, elke
      plaats te betreden, onverminderd [artikel 2 van de Algemene wet op het binnentreden][ref1], en daar een waarneming,
      meting of graving te verrichten en daarop of daarin een teken te stellen, voorzover dat redelijkerwijs nodig is
      voor de vervulling van hun taak ter uitvoering van aan de Dienst opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: 7a.2
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een registergoed zijn verplicht aan een persoon als
      bedoeld in het eerste lid binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden, genoemd in het eerste lid, met dien verstande
      dat de toegang slechts wordt verleend tussen acht uur 's morgens en zes uur 's avonds en dat die niet behoeft te
      worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7a
  - number: 7a.3
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een gebouw en grond zijn verplicht te gedogen
      dat daarop of daarin een teken wordt gesteld ter uitvoering van aan de Dienst opgedragen taken. De eerste
      zin is van overeenkomstige toepassing op het aanbrengen van een brandmerk op een schip als bedoeld in
      [artikel 21, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7a.4
    text: |-
      Indien de toegang wordt geweigerd, verschaffen de personen, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan of de medewerking, bedoeld in het tweede lid, niet wordt verleend, zijn de personen, bedoeld in het
      eerste lid, bevoegd het verrichten van de handelingen, bedoeld in het eerste lid, zo nodig met behulp van de sterke
      arm mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7a
  - number: 7a.5
    text: |-
      De schade die uit de toepassing van het eerste of derde lid voortvloeit, wordt door de Dienst vergoed. Het verzoek
      om schadevergoeding wordt ingediend bij het bestuur van de Dienst. De vordering tot schadevergoeding staat ter
      kennisneming van de kantonrechter van de rechtbank van het arrondissement waarin de plaats van vestiging van de
      Dienst is gelegen. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7a
  - number: 7b.1
    text: |-
      Een persoon als bedoeld in [artikel 7a, eerste lid][ref1], draagt bij het verrichten van de werkzaamheden, bedoeld
      in [artikel 7a, eerste lid][ref2], een legitimatiebewijs bij zich, dat is uitgegeven door het bestuur van de
      Dienst, en toont zijn legitimatiebewijs desgevraagd terstond.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 7a
        hoofdstuk: '1'
  - number: 7b.2
    text: Het legitimatiebewijs bevat een foto van de betrokken persoon en vermeldt in elk geval zijn naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7b
  - number: 7b.3
    text: Het model van het legitimatiebewijs wordt vastgesteld bij regeling van het bestuur van de Dienst.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel7b
  - number: '8.1'
    text: |-
      De openbare registers waarin feiten die voor de rechtstoestand van registergoederen van belang zijn, worden
      ingeschreven, zijn:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.1.a
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op onroerende zaken en de rechten waaraan deze
      onderworpen zijn;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.1.b
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op schepen en de rechten waaraan deze onderworpen
      zijn;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.1.c
    text: |-
      de registers van inschrijving van feiten die betrekking hebben op luchtvaartuigen en de rechten waaraan deze
      onderworpen zijn;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.1.d
    text: |-
      het register van voorlopige aantekeningen onderscheidenlijk voor onroerende zaken, schepen en luchtvaartuigen en de
      rechten waaraan deze onderworpen zijn, waarin de aanbieding van stukken waarvan de inschrijving door de bewaarder
      ingevolge [artikel 20 van Boek 3 van het Burgerlijk Wetboek][ref1] is geweigerd wordt aangetekend onder vermelding
      van de gerezen bedenkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: '8.2'
    text: |-
      Onze Minister regelt nader uit welke registers de registers, bedoeld in het eerste lid, onder *a*, *b*,
      onderscheidenlijk *c*, bestaan. Het bestuur van de Dienst stelt nadere regelen vast ter zake van de vorm van de in
      het eerste lid bedoelde registers.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij regeling van het bestuur van de Dienst wordt voorts vastgesteld, onverminderd het bepaalde dienaangaande
      bij of krachtens andere wet, de gevallen waarin in de in het eerste lid bedoelde registers door de bewaarder
      aantekeningen, daaronder begrepen doorhalingen van inschrijvingen in die registers, worden gesteld, de aard van die
      aantekeningen en de wijze waarop deze worden gesteld, in dier voege:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.3.a
    text: |-
      dat de doorhaling, behoudens in het onder *d* voorziene geval, slechts geschiedt op grond van in de desbetreffende
      registers ingeschreven stukken die de bewaarder tot doorhaling machtigen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.3.b
    text: dat na een inschrijving van een stuk dat tot doorhaling machtigt, deze terstond geschiedt;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: 8.3.c
    text: |-
      dat, tenzij ingevolge [artikel 9, eerste lid][ref1], of [artikel 11, zevende lid][ref2], van dat stuk een afschrift
      in de vorm van een mechanische reproduktie is vervaardigd, op het stuk door middel waarvan het door te halen feit
      is ingeschreven, wordt vermeld op grond van welk stuk de doorhaling is geschied, en


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '9'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 8.3.d
    text: |-
      dat, zo ingevolge een wetsbepaling door een beschikking of door de inschrijving van enig stuk met betrekking
      tot een zaak bestaande lasten en rechten vervallen of tenietgaan, na de inschrijving van die beschikking of van
      dat stuk de inschrijvingen betreffende hypotheken en beslagen die door die beschikking, onderscheidenlijk de
      inschrijving van dat stuk waardeloos zijn geworden, met bekwame spoed worden doorgehaald.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het bestuur van de Dienst kan ten aanzien van door hem aan te wijzen kantoren van de Dienst bepalen, dat de inhoud
      van de in [artikel 8, eerste lid][ref1], bedoelde registers wordt vervangen door afschriften daarvan in dubbel in
      de vorm van door de Dienst vervaardigde mechanische reprodukties. Het bestuur van de Dienst bepaalt tevens de wijze
      waarop deze vervanging zal geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '9.2'
    text: Deze reprodukties hebben dezelfde bewijskracht als de oorspronkelijke inhoud van de registers.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel9
  - number: '10.1'
    text: |-
      Stukken ter verkrijging van inschrijving van feiten die betrekking hebben op onroerende zaken of de rechten waaraan
      deze onderworpen zijn, worden aangeboden aan de bewaarder van het kantoor van de Dienst, binnen welks kring de
      onroerende zaken waarop de in te schrijven feiten betrekking hebben, blijkens hun kadastrale aanduiding zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      Ingeval een onroerende zaak is gelegen binnen de kring van meer dan één kantoor van de Dienst, worden deze stukken
      aangeboden aan elk der kantoren binnen welks kring zij is gelegen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel10
  - number: '10.3'
    text: |-
      Bij algemene maatregel van bestuur worden, onverminderd het bepaalde in [artikel 4, eerste lid][ref1], regelen
      gesteld omtrent het kantoor van de Dienst, waaraan stukken ter verkrijging van inschrijving van feiten die
      betrekking hebben op schepen of op de rechten waaraan deze onderworpen zijn, moeten worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel4
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '4'
        hoofdstuk: '1'
  - number: '10.4'
    text: |-
      Het bepaalde in het vorige lid is van overeenkomstige toepassing op de aanbieding van stukken ter verkrijging van
      inschrijving van feiten die betrekking hebben op luchtvaartuigen of op de rechten waaraan deze onderworpen zijn.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel10
  - number: '11.1'
    text: |-
      Voor inschrijving van een feit in de openbare registers, bedoeld in [artikel 8, eerste lid, onder ][ref1], is
      vereist een stuk dat voldoet aan de eisen gesteld in [titel 2 van dit hoofdstuk][ref2], alsmede een afschrift van
      dat stuk, gesteld op een door de Dienst verstrekt formulier en voorzien van een verklaring van eensluidendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004541
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De bewaarder is niet gehouden de juistheid van de in het eerste lid bedoelde verklaring te onderzoeken. De Dienst
      is niet aansprakelijk voor schade voortvloeiend uit onjuistheden en onvolledigheden in het afschrift.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij regeling van Onze Minister wordt de vorm vastgesteld van de in het eerste lid bedoelde verklaring en
      wordt bepaald, onverminderd het bepaalde bij of krachtens een andere wet, door wie deze verklaring moet worden
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
  - number: '11.4'
    text: |-
      Bij regeling van Onze Minister kan voor bijzondere gevallen worden bepaald dat geen afschrift, als bedoeld in
      het eerste lid, behoeft te worden aangeboden. In die gevallen vervaardigt de Dienst het afschrift van het ter
      inschrijving aangeboden stuk. Het bepaalde in het zevende lid, derde zin, is alsdan van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
  - number: '11.5'
    text: |-
      Bij regeling van Onze Minister worden de vereisten vastgesteld, waaraan tekeningen die deel uitmaken van ter
      inschrijving aangeboden stukken, moeten voldoen. Daarbij kan worden afgeweken van het bepaalde in het eerste-vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
  - number: '11.6'
    text: |-
      Bij regeling van het bestuur van de Dienst wordt de vorm vastgesteld van het in het eerste lid bedoelde formulier,
      alsmede de vereisten met inachtneming waarvan dit formulier dient te worden ingevuld en aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
  - number: '11.7'
    text: |-
      Bij regeling van Onze Minister kan in afwijking van het eerste lid worden bepaald, dat in plaats van het in dat
      lid bedoelde voor inschrijving vereiste afschrift de Dienst een afschrift van het ter inschrijving aangeboden
      stuk in dubbel vervaardigt in de vorm van een mechanische reproduktie. In dat geval dient het ter inschrijving
      aan te bieden stuk te zijn gesteld op een door de Dienst verstrekt formulier of te voldoen aan andere bij regeling
      van Onze Minister te stellen eisen. De Dienst is alsdan aansprakelijk voor schade voortvloeiend uit onjuistheden
      en onvolledigheden in het afschrift, ontstaan ten gevolge van de vervaardiging van de mechanische reproduktie.
      Het vijfde en het zesde lid zijn, indien het bepaalde in de eerste zin toepassing vindt, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel11
  - number: '12.1'
    text: |-
      De inschrijving geschiedt door het in bewaring nemen van het afschrift van het stuk, bedoeld in
      [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '12.2'
    text: |-
      De afschriften van de stukken worden zo veel mogelijk gerangschikt in volgorde waarin zij ter inschrijving zijn
      aangeboden, met vermelding van het tijdstip waarop deze aanbieding is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het bestuur van de Dienst stelt nadere regelen vast omtrent de rangschikking en de wijze van opberging van de
      afschriften.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien [artikel 11, zevende lid][ref1], toepassing heeft gevonden geschiedt de inschrijving in afwijking
      van het bepaalde in het eerste lid door de vervaardiging van het afschrift in dubbel, bedoeld in
      [artikel 11, zevende lid][ref2]. Het bepaalde in het tweede en derde lid is alsdan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '13'
    text: |-
      Na de inschrijving, bedoeld in [artikel 12, eerste lid][ref1], worden de ter inschrijving aangeboden stukken aan
      de aanbieder teruggegeven nadat zij door de bewaarder zijn voorzien van een aantekening, vermeldende het kantoor,
      dag, uur en minuut van aanbieding, alsmede het deel van het desbetreffende register waarin en het nummer waaronder
      in dat deel de opberging van het afschrift is geschied, dan wel ingeval [artikel 11, zevende lid][ref2], toepassing
      heeft gevonden, de verwijzing naar de plaats waaronder de desbetreffende mechanische reproduktie is opgeborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14.1'
    text: |-
      Op de inschrijving van een feit, waarvan de inschrijving alsnog is bevolen overeenkomstig
      [artikel 20, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref1] dan wel opnieuw is verzocht, als bedoeld
      in [artikel 20, vierde lid, tweede zin, van Boek 3 van dat wetboek][ref2], zijn de [artikelen 11-13][ref3] van
      toepassing, voor zover daarvan in dit artikel niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14.2'
    text: |-
      Voor een inschrijving, als bedoeld in het eerste lid, wordt vereist het oorspronkelijk aangeboden stuk dat is
      voorzien van de in [artikel 15, tweede lid][ref1], bedoelde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '14.3'
    text: |-
      De inschrijving geschiedt, tenzij [artikel 11, zevende lid][ref1], toepassing heeft gevonden, door doorhaling van
      de voorlopige aantekening en door vermelding daarbij van het deel en nummer, bedoeld in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel13
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '14.4'
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing met dien verstande, dat de bewaarder op het ingeschreven
      stuk eveneens van de doorhaling van de voorlopige aantekening melding maakt overeenkomstig door het bestuur van de
      Dienst daartoe vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel13
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.1'
    text: |-
      De boeking, bedoeld in [artikel 20, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1], geschiedt in het
      register van voorlopige aantekeningen voor goederen als waarop het aangeboden stuk betrekking heeft, met vermelding
      van de gerezen bedenkingen, alsmede, voor zover bekend, van de naam en woonplaats met adres van de aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: '15.2'
    text: |-
      Na de boeking wordt dat stuk voorzien van een door de bewaarder ondertekende verklaring, vermeldende
      tenminste het kantoor, dag, uur en minuut van aanbieding, onder verwijzing naar de boeking in het
      desbetreffende register van voorlopige aantekeningen, alsmede de gerezen bedenkingen, en wordt het aan de
      aanbieder teruggegeven. Het voor inschrijving vereiste, aangeboden afschrift van het stuk wordt in bewaring
      genomen.[ Artikel 12, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel12
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.3'
    text: |-
      Ingeval het voor inschrijving vereiste afschrift niet is aangeboden, vervaardigt de Dienst een afschrift van het
      in het eerste lid bedoelde stuk overeenkomstig door het bestuur van de Dienst daartoe vast te stellen regelen,
      waarbij het bepaalde in [artikel 11, zevende lid, derde zin][ref1], van overeenkomstige toepassing is. Het bepaalde
      in de vorige zin is van overeenkomstige toepassing met betrekking tot in het eerste lid bedoelde stukken waarop ten
      aanzien van de inschrijving [artikel 11, vierde lid][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.4'
    text: |-
      Het bestuur van de Dienst geeft voorts regelen in welke van de gevallen, waarin het in
      [artikel 11, eerste lid][ref1], bedoelde formulier niet met inachtneming van de in [artikel 11, zesde lid][ref2],
      bedoelde vereisten is ingevuld of aangeboden, de Dienst een afschrift vervaardigt van het stuk waarvan de
      inschrijving is geweigerd, en op welke wijze deze vervaardiging geschiedt. [Artikel 12, tweede en derde lid][ref3],
      is van overeenkomstige toepassing. Het aangeboden afschrift blijft berusten ten kantore van de Dienst en wordt voor
      zover mogelijk opgeborgen in het desbetreffende register van voorlopige aantekeningen bij het desbetreffende door
      de Dienst vervaardigde afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel12
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '12'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.5'
    text: |-
      Indien [artikel 11, zevende lid][ref1], toepassing heeft gevonden, vervaardigt de Dienst, alvorens het
      stuk waarvan de inschrijving is geweigerd, aan de aanbieder terug te geven, voor zover mogelijk een
      afschrift van dat stuk overeenkomstig door het bestuur van de Dienst daartoe vast te stellen regelen.
      [Artikel 11, zevende lid, derde zin][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel11
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '15.6'
    text: |-
      Het bepaalde in het eerste en tweede lid is mede van overeenkomstige toepassing op de boeking van de aanbieding van
      een stuk, dat krachtens [artikel 37, tweede lid][ref1], slechts op bevel van de rechter kan worden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '16.1'
    text: |-
      Van aan de bewaarder uitgebrachte dagvaardingen, als bedoeld in
      [artikel 20, vierde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], en van uitspraken van de voorzieningenrechter
      in kort geding, aangespannen ter verkrijging van het in [artikel 20, tweede lid, van Boek 3 van dat wetboek][ref2]
      bedoelde bevel, wordt aantekening gehouden in het desbetreffende register van voorlopige aantekeningen
      overeenkomstig door het bestuur van de Dienst daartoe vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '20'
  - number: '16.2'
    text: |-
      Het bestuur van de Dienst stelt voorts regelen vast omtrent de wijze waarop in het register van voorlopige
      aantekeningen de in [artikel 15, eerste lid][ref1], bedoelde boeking geschiedt, alsmede omtrent de wijze van
      doorhaling van voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel15
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '16.3'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van dagvaardingen uitgebracht aan de
      bewaarder ter verkrijging van een bevel van de rechter tot inschrijving van een notariële verklaring, bedoeld in
      [artikel 37, eerste lid, onder ][ref1] Het bepaalde in het tweede lid is van overeenkomstige toepassing ten aanzien
      van de in [artikel 37, tweede lid, eerste zin][ref2], bedoelde boeking en de doorhaling van een zodanige boeking in
      het register van voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '17'
    text: |-
      Het bestuur van de Dienst stelt de vorm vast van het bewijs van ontvangst, bedoeld in
      [artikel 18 van Boek 3 van het Burgerlijk Wetboek][ref1], alsmede regelen omtrent de wijze
      waarop op dat bewijs de verrichte inschrijving desverlangd wordt aangetekend, bedoeld in
      [artikel 19, derde lid, van Boek 3 van dat wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel19
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '19'
  - number: '18.1'
    text: |-
      Onverminderd de overige uit deze titel voortvloeiende eisen moet een ter inschrijving aangeboden notariële akte,
      notariële verklaring of authentiek afschrift of uittreksel van een zodanige akte of verklaring vermelden:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: 18.1.1°
    text: |-
      naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens het aangeboden stuk daarbij als partij zijn opgetreden;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: 18.1.2°
    text: |-
      rechtsvorm, naam en woonplaats met adres van de rechtspersonen die blijkens het aangeboden stuk daarbij als partij
      zijn opgetreden;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: 18.1.3°
    text: |-
      ten aanzien van natuurlijke en rechtspersonen die blijkens het aangeboden stuk voormelde partijen hebben
      vertegenwoordigd: de in de onderdelen a en b bedoelde gegevens, met uitzondering van de burgerlijke staat, alsmede
      de grond van hun bevoegdheid, met dien verstande dat voor natuurlijke personen die een kantoor houden of werkzaam
      zijn op een kantoor ten aanzien van aangelegenheden die dit kantoor betreffen in plaats van de woonplaats met adres
      ook het kantooradres vermeld kan worden.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: '18.2'
    text: |-
      Andere ter inschrijving aangeboden stukken vermelden, zo mogelijk, dezelfde gegevens als in het eerste lid
      omschreven, tenzij anders voortvloeit uit hetgeen de wet voor een stuk van de aard als waarom het gaat, ten aanzien
      van de vermelding van voornamen, namen en woonplaatsen voorschrijft.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: '18.3'
    text: |-
      In elk geval worden de in het eerste lid omschreven gegevens opgegeven van de partij ten behoeve van wie de
      aanbieding ter inschrijving geschiedt. Zo het ter inschrijving aangeboden stuk één of meer van deze gegevens
      niet vermeldt en naar zijn aard niet voor aanvulling te dier zake vatbaar is, wordt vermelding van de ontbrekende
      gegevens en, zo opgave van één of meer dezer gegevens niet mogelijk is, de vermelding van de redenen daarvan in een
      nadere door of namens die partij ondertekende verklaring alsnog op het stuk gesteld of daaraan gehecht.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: '18.4'
    text: |-
      Zo een partij geen woonplaats in Nederland heeft, kiest zij ter zake van de inschrijving een woonplaats in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: '18.5'
    text: |-
      Indien een partij in een ter inschrijving aangeboden stuk woonplaats heeft gekozen, wordt niettemin daarin ook de
      wettelijke woonplaats met adres vermeld.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel18
  - number: '19'
    text: |-
      Ingeval het ter inschrijving aangeboden stuk betrekking heeft op een bepaald reeds eerder ingeschreven stuk, bevat
      het een verwijzing naar dit eerdere stuk overeenkomstig door Onze Minister daartoe vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel19
  - number: '20.1'
    text: |-
      Indien een stuk ter inschrijving wordt aangeboden en het daarin vermelde in te schrijven feit betrekking heeft
      op een onroerende zaak of op een recht waaraan een zodanige zaak is onderworpen, vermeldt dit stuk de aard, de
      plaatselijke aanduiding zo deze er is, en de kadastrale aanduiding van die onroerende zaak onderscheidenlijk
      van de onroerende zaak die aan dat recht is onderworpen. Indien het in te schrijven feit betrekking heeft op
      een appartementsrecht, wordt in het ter inschrijving aangeboden stuk vermeld de plaatselijke aanduiding van het
      desbetreffende gedeelte van het gebouw dat is bestemd om als afzonderlijk geheel te worden gebruikt, alsmede de
      aard en de kadastrale aanduiding van dat appartementsrecht.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister kan regelen vaststellen omtrent de wijze waarop de plaatselijke aanduiding, bedoeld in het eerste
      lid, in het ter inschrijving aangeboden stuk wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien het in te schrijven feit betrekking heeft op een in de registratie voor schepen, bedoeld in
      [artikel 85][ref1], te boek staand schip of op een recht waaraan een zodanige zaak is onderworpen, bevat het ter
      inschrijving aangeboden stuk:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: 21.1.a
    text: |-
      de naam van het schip met vermelding van het gebruik waartoe het is bestemd, en zijn bruto-inhoud of bruto-tonnage
      dan wel, indien het een binnenschip betreft, zijn laadvermogen in tonnen van 1.000 kilogram of verplaatsing in
      kubieke meters;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: 21.1.b
    text: |-
      het type en de inrichting van het schip, het materiaal waarvan de romp is gemaakt, jaar en plaats van de bouw,
      en, voor zover het een schip met een mechanische voortstuwing betreft, ook al betreft het slechts een hulpmotor,
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: 21.1.c
    text: |-
      het nummer waaronder de inschrijving van het verzoek tot teboekstelling van het schip in het desbetreffende
      register is geschied, de aanwijzing van de rubriek waartoe dat schip behoort, de aanduiding van het kantoor van
      de Dienst waar de teboekstelling is geschied, en het jaar van teboekstelling, welke gegevens tezamen in genoemde
      volgorde het brandmerk van het schip vormen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent de in het eerste lid, onder *c*, bedoelde
      onderscheiding van rubrieken van schepen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: '21.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op ter inschrijving aangeboden rechterlijke uitspraken. Deze
      stukken kunnen, onverminderd andere vereisten gesteld bij of krachtens wet, echter slechts worden ingeschreven,
      indien en voor zover de identiteit van het desbetreffende schip voldoende vaststaat.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: '21.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan worden volstaan met het vermelden van de naam van het schip en
      de in dat lid, onder *c*, genoemde gegevens in het ter inschrijving aangeboden stuk, indien dat stuk betreft:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: 21.4.a
    text: |-
      de doorhaling van de teboekstelling van een schip, bedoeld in de [artikelen 195, eerste lid][ref1], en
      [786, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '195'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '786'
  - number: 21.4.b
    text: |-
      de aangifte van de eigenaar inhoudende dat het schip een wijziging heeft ondergaan waardoor de beschrijving van
      het schip in de registratie voor schepen, bedoeld in [artikel 85, tweede lid, onder ][ref1], niet meer aan de
      werkelijkheid beantwoordt;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
        hoofdstuk: '5'
  - number: 21.4.c
    text: |-
      een afwijkend beding, als bedoeld in [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: 21.4.d
    text: de verandering van een door de eigenaar van een schip in een ingeschreven stuk gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel21
  - number: '22.1'
    text: |-
      Indien het in te schrijven feit betrekking heeft op een in de registratie voor luchtvaartuigen, bedoeld in
      [artikel 92][ref1], te boek staand luchtvaartuig of op een recht waaraan een zodanige zaak is onderworpen, bevat
      het ter inschrijving aangeboden stuk:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel92
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '92'
        hoofdstuk: '6'
  - number: 22.1.a
    text: |-
      het nationaliteitskenmerk en het inschrijvingskenmerk, bedoeld in
      [artikel 6, eerste lid, van de Luchtvaartwet][ref1] (*Stb.* 1958, 47);


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel6
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '6'
  - number: 22.1.b
    text: |-
      de naam en woonplaats van de fabrikant en het type van het luchtvaartuig, jaar en plaats van de bouw, het
      fabrieksnummer zo het luchtvaartuig dat heeft met vermelding van de plaats waar dit nummer is aangebracht, en
      het aantal motoren, het type, vermogen en de fabrikant van elke motor, alsmede het fabrieksnummer daarvan met
      aanduiding van de plaats waar dit nummer is aangebracht;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel22
  - number: 22.1.c
    text: de maximaal toegelaten massa van het luchtvaartuig en, indien het luchtvaartuig een naam voert, de naam ervan;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel22
  - number: 22.1.d
    text: |-
      het nummer waaronder de inschrijving van het verzoek tot teboekstelling van dat luchtvaartuig in het desbetreffende
      register is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 21, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '23'
    text: |-
      Vermeldt een ter inschrijving aangeboden stuk niet één of meer der gegevens, in de [artikelen 19-22][ref1] voor
      een zodanig stuk voorgeschreven, en is het naar zijn aard niet voor aanvulling te dier zake vatbaar, dan wordt
      de vermelding van de ontbrekende gegevens in een nadere, door degene die de inschrijving verlangt, ondertekende
      verklaring alsnog op het stuk gesteld of daaraan gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel19
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '19'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '24.1'
    text: |-
      Ter inschrijving van een akte van levering, vereist voor de overdracht van een registergoed, voor de vestiging,
      afstand of wijziging van een beperkt recht dat een registergoed is, of voor de overgang van een registergoed na
      toedeling uit hoofde van de verdeling van een gemeenschap, wordt aangeboden de notariële akte betreffende deze
      levering, dan wel een authentiek afschrift of een authentiek uittreksel daarvan. In geval van vestiging van een
      recht van hypotheek op een schip in aanbouw wordt mede ter inschrijving aangeboden een verklaring van de ambtenaar
      van de Scheepsmetingsdienst, inhoudende dat de bouw van het schip nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: '24.2'
    text: 'Het ter inschrijving aangeboden stuk, bedoeld in het eerste lid, bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.a
    text: 'de titel op grond waarvan de levering plaatsvindt en, in geval van vestiging van een recht van hypotheek, tevens:'
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.a.1°
    text: |-
      een aanduiding van de vordering waarvoor het recht van hypotheek tot zekerheid strekt, of van de feiten aan de hand
      waarvan die vordering zal kunnen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.a.2°
    text: |-
      het bedrag waarvoor het recht van hypotheek wordt gevestigd of, wanneer dit bedrag nog niet vaststaat, het
      maximumbedrag dat uit hoofde van dat recht van hypotheek op het goed kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.a.3°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand zeeschip of op een recht waaraan een
      zodanige zaak is onderworpen, bovendien: een duidelijke vermelding van het aan de hypotheek onderworpen schip;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.a.4°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand binnenschip of op een recht waaraan een
      zodanige zaak is onderworpen, bovendien: een duidelijke vermelding van het aan de hypotheek onderworpen schip, de
      voorwaarden voor opeisbaarheid of een verwijzing naar een op het kantoor van inschrijving ingeschreven document
      waarin deze voorwaarden zijn vastgelegd, alsmede de bedongen rente en de tijdstippen waarop deze vervalt;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.a.5°
    text: |-
      in geval van vestiging van een recht van hypotheek op een teboekstaand luchtvaartuig, bovendien: een duidelijke
      vermelding van het aan de hypotheek onderworpen luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.b
    text: |-
      de wettelijke benaming van het recht, op de levering waarvan het ter inschrijving aangeboden stuk betrekking heeft
      of, ingeval dat recht geen wettelijke benaming heeft:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.b.1°
    text: de gangbare benaming, dan wel de vermelding dat het recht geen gangbare benaming heeft;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.b.2°
    text: de wetsbepaling volgens welke het recht kan worden gevestigd of een registergoed is;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
  - number: 24.2.b.3°
    text: |-
      in geval van een recht als bedoeld in [artikel 150, eerste lid, van de Overgangswet nieuw Burgerlijk Wetboek][ref1],
      de omschrijving van de inhoud van dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel150
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '150'
  - number: '24.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de inschrijving van het proces-verbaal van
      toewijzing, bedoeld in de [artikelen 525][ref1], eerste lid, en [584 ][ref2], onverminderd hetgeen in ieder van de
      artikelen in het tweede lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel525
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel584
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '525'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '584'
  - number: '24.4'
    text: |-
      Het aangeboden stuk mag op meer leveringen, als bedoeld in het eerste lid, betrekking hebben, voor zover voor ieder
      daarvan aan de in de vorige leden gestelde eisen is voldaan. Betreft het stuk een overdracht onder voorbehoud van
      een beperkt recht of van een beding, als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1], dan
      wordt de vestiging van dit recht dan wel het op zich nemen van het beding afzonderlijk en duidelijk vermeld, bij
      gebreke waarvan de inschrijving van het stuk geacht wordt niet mede dit recht of dit beding te betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '24.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de inschrijving van een akte van grensvastlegging, opgemaakt
      krachtens de [artikelen 31][ref1] of [35, derde lid, van Boek 5 van het Burgerlijk Wetboek][ref2], alsmede op de
      inschrijving van een akte van splitsing, als bedoeld in [artikel 109, eerste lid, van Boek 5 van dat wetboek][ref3],
      en een akte tot wijziging of opheffing van een zodanige splitsing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '109'
  - number: '25.1'
    text: |-
      Ter inschrijving van een rechterlijke uitspraak die voor een akte van levering in de plaats treedt of die
      anderszins krachtens wetsbepaling kan worden ingeschreven, wordt een expeditie van de rechterlijke uitspraak
      aangeboden, alsmede:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: 25.1.a
    text: |-
      indien de rechterlijke uitspraak slechts inschrijfbaar is, nadat zij in kracht van gewijsde is gegaan: een
      verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan, inhoudende dat daartegen geen gewoon
      rechtsmiddel meer openstaat;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: 25.1.b
    text: |-
      indien de onder *a* bedoelde eis voor inschrijfbaarheid niet is gesteld en de rechterlijke uitspraak niet
      uitvoerbaar bij voorraad is: een verklaring van de griffier van het gerecht dat de uitspraak heeft gedaan,
      inhoudende:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: 25.1.b.1°
    text: |-
      hetzij dat daartegen geen gewoon rechtsmiddel meer openstaat, hetzij dat hem drie maanden na de uitspraak niet van
      het instellen van een gewoon rechtsmiddel is gebleken;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: 25.1.b.2°
    text: |-
      zo het rechtsmiddel bij verzoekschrift moet worden ingesteld, dat ook de griffier van het gerecht waar dit
      verzoekschrift moet worden ingediend, niet van het instellen van een rechtsmiddel is gebleken;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: 25.1.c
    text: |-
      indien voor de inschrijving betekening aan de veroordeelde vereist is, een door de deurwaarder getekend afschrift
      van het exploit waarbij de betekening is geschied.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      Ter inschrijving van een beslissing van de rechter van een vreemde Staat wordt een authentiek afschrift van deze
      beslissing aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: '25.3'
    text: |-
      Bestaat de rechterlijke uitspraak in een verlof tot tenuitvoerlegging van een beslissing van arbiters, dan wordt
      ook een afschrift van deze beslissing aangeboden, getekend door de griffier van het gerecht waarvan de president
      het verlof gaf.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel25
  - number: '26.1'
    text: |-
      Ter inschrijving van een rechtshandeling naar burgerlijk recht die krachtens wetsbepaling kan worden ingeschreven,
      wordt, tenzij anders is bepaald, aangeboden een door een notaris met inachtneming van [artikel 37][ref1],
      opgemaakte verklaring, inhoudende dat de rechtshandeling naar de verklaring van degene die de inschrijving
      verlangt, is verricht en wat zij inhoudt, met daaraan gehecht de stukken waaruit van die rechtshandeling blijkt, of
      authentieke afschriften van die verklaring van de notaris en van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '26.2'
    text: |-
      Ingeval voor de rechtshandeling of de inschrijving daarvan een notariële akte is vereist, wordt aangeboden hetzij
      die akte, hetzij een authentiek afschrift of een authentiek uittreksel daarvan.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel26
  - number: '26.3'
    text: |-
      Ingeval van de rechtshandeling een notariële akte is opgemaakt, zonder dat dit vereist was, kan naar keuze van
      degene die de inschrijving verlangt het eerste of tweede lid worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel26
  - number: '26.4'
    text: |-
      Ingeval het gaat om een eenzijdige tot één of meer bepaalde personen gerichte rechtshandeling, kan worden volstaan
      met aanbieding van een aan die persoon of personen uitgebracht exploit, waarbij die rechtshandeling is verricht of
      tijdig bevestigd, of een authentiek afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel26
  - number: '26.5'
    text: |-
      Ingeval de rechtshandeling betreft een scheepshuurkoopovereenkomst waarop
      [artikel 800, tweede lid, van Boek 8 van het Burgerlijk Wetboek][ref1] van toepassing is, wordt ter inschrijving
      aangeboden hetzij de in [artikel 800, eerste lid, van Boek 8 van dat wetboek][ref2] bedoelde notariële akte met
      daaraan gehecht de stukken inhoudende de in het tweede lid van dat artikel bedoelde toestemming, hetzij authentieke
      afschriften van die akte en van die stukken, hetzij een authentiek uittreksel van die akte en authentieke
      afschriften van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel800
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel800
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '800'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '800'
  - number: '26.6'
    text: |-
      Ter inschrijving van een afwijkend beding, als bedoeld in
      [artikel 1, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref1], wordt, in afwijking van het bepaalde in het
      eerste lid, een door de eigenaar van het schip ondertekende verklaring aangeboden, waarin het scheepstoebehoren ten
      aanzien waarvan het afwijkend beding is gemaakt, eenduidig is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: '27.1'
    text: |-
      Ter inschrijving van erfopvolgingen die registergoederen betreffen, wordt een verklaring van erfrecht als bedoeld
      in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1] aangeboden, waaruit van de erfopvolging blijkt, dan
      wel een authentiek afschrift van die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
  - number: '27.2'
    text: |-
      Ter inschrijving van een executele, een bij uiterste wilsbeschikking ingesteld bewind of de
      benoeming van een vereffenaar van de nalatenschap wordt een verklaring van erfrecht als bedoeld in
      [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1] aangeboden, waaruit van de executele, het bewind,
      onderscheidenlijk de benoeming blijkt, dan wel een authentiek afschrift van die verklaring. De eerste zin
      laat onverlet de mogelijkheid van inschrijving van de benoeming van een vereffenaar door inschrijving van de
      desbetreffende rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
  - number: '27.3'
    text: |-
      Ter inschrijving van een verkrijging door de Staat van registergoederen krachtens
      [artikel 189 van Boek 4 van het Burgerlijk Wetboek][ref1] wordt aangeboden een verklaring van een notaris waarin
      deze vermeldt dat het registergoed door de Staat krachtens [artikel 189 van Boek 4 van dat wetboek][ref2] is
      verkregen, dan wel een authentiek afschrift van die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel189
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '189'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '189'
  - number: '27.4'
    text: |-
      Ter inschrijving van afgifte aan de Staat van registergoederen krachtens
      [artikel 226, eerste en tweede lid, van Boek 4 van het Burgerlijk Wetboek][ref1] wordt aangeboden een verklaring
      van de vereffenaar waarin deze vermeldt op welk tijdstip het registergoed aan de Staat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel226
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '226'
  - number: '27.5'
    text: |-
      Ter inschrijving van het verval aan de Staat van registergoederen of hetgeen daarvoor in de plaats is gekomen
      krachtens [artikel 226, vierde lid, van Boek 4 van het Burgerlijk Wetboek][ref1] wordt aangeboden een verklaring
      van de Minister van Financiën, inhoudende dat tijdens het in dat artikel genoemde tijdvak van twintig jaren die
      goederen niet zijn opgeëist.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel226
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '226'
  - number: '28'
    text: |-
      Ter inschrijving van de aanvaarding van een nalatenschap onder het voorrecht van boedelbeschrijving of
      de verwerping van een nalatenschap wordt een door de griffier getekend uittreksel uit het boedelregister
      aangeboden, inhoudende de verklaring betreffende de aanvaarding of de verwerping die krachtens
      [artikel 191 van Boek 4 van het Burgerlijk Wetboek][ref1] in het boedelregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel191
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '191'
  - number: '29'
    text: |-
      Ter inschrijving van de afstand van een huwelijksgemeenschap of van een gemeenschap van geregistreerd partnerschap
      wordt een door de griffier getekend uittreksel uit het huwelijksgoederenregister aangeboden, inhoudende de
      verklaring betreffende de afstand, die krachtens [artikel 104 van Boek 1 van het Burgerlijk Wetboek][ref1] in het
      huwelijksgoederenregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel104
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '104'
  - number: '30.1'
    text: |-
      Ter inschrijving van de vervulling van een voorwaarde, gesteld in een ingeschreven voorwaardelijke rechtshandeling,
      of van de verschijning van een onzeker tijdstip, aangeduid in de aan een ingeschreven rechtshandeling verbonden
      tijdsbepaling, wordt aangeboden een door een notaris met inachtneming van [artikel 37][ref1] opgemaakte
      verklaring, inhoudende dat naar de verklaring van degene die de inschrijving verlangt, de voorwaarde is vervuld,
      onderscheidenlijk het tijdstip is verschenen met daaraan gehecht de stukken waaruit van deze vervulling of
      verschijning blijkt, of authentieke afschriften van de verklaring van een notaris en van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '30.2'
    text: |-
      Het vorige lid is van overeenkomstige toepassing op de inschrijving van de dood van de vruchtgebruiker van een
      registergoed. De verklaring van de notaris houdt in dit geval tevens in:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel30
  - number: 30.2.a
    text: het tijdstip van overlijden van de vruchtgebruiker, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel30
  - number: 30.2.b
    text: |-
      of het vruchtgebruik is vervallen, dan wel bij wie het vruchtgebruik na de dood van de vruchtgebruiker is
      verbleven.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel30
  - number: '31'
    text: |-
      Op de inschrijving van reglementen en andere regelingen die tussen medegerechtigden in registergoederen zijn
      vastgesteld, zijn van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel31
  - number: 31.a
    text: |-
      voor zover het reglement of de regeling door de rechter is vastgesteld: [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel25
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '25'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 31.b
    text: |-
      voor zover het reglement of de regeling bij rechtshandeling is vastgesteld: [artikel 26, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '32.1'
    text: |-
      Ter inschrijving van een proces-verbaal van inbeslagneming wordt dit proces-verbaal of een door de deurwaarder of
      een advocaat getekend afschrift daarvan aangeboden. [Artikel 18, tweede-vijfde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '32.2'
    text: |-
      Ingeval een proces-verbaal van inbeslagneming van een luchtvaartuig in het buitenland is opgemaakt door een
      deurwaarder of andere volgens de daar geldende wet hiertoe bevoegde persoon, kan ook een zodanig proces-verbaal ter
      inschrijving worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
  - number: '32.3'
    text: |-
      Ter inschrijving van een der in de [artikelen 211][ref1] en [821 van Boek 8 van het Burgerlijk Wetboek][ref2]
      genoemde voorrechten, wordt aangeboden een door een deurwaarder ondertekend verzoek tot inschrijving van het
      voorrecht, inhoudende naar de verklaring van degene die de inschrijving verlangt:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '821'
  - number: 32.3.a
    text: de aanduiding van de vordering waar het om gaat;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
  - number: 32.3.b
    text: |-
      het beloop der vordering ten tijde van het ondertekenen door de deurwaarder van het verzoek, of van de feiten aan
      de hand waarvan die vordering zal kunnen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
  - number: 32.3.c
    text: |-
      de omschrijving van het voorrecht door vermelding van het wettelijk voorschrift, op grond waarvan aan die vordering
      het voorrecht is toegekend, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
  - number: 32.3.d
    text: |-
      het tijdstip waarop de vordering is ontstaan. Indien het verzoek van de deurwaarder ter inschrijving
      wordt aangeboden na verloop van de termijn, genoemd in [artikel 219, eerste lid][ref1], onderscheidenlijk
      [artikel 829, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2], wordt ter inschrijving tevens aangeboden
      een stuk waaruit blijkt dat de schuldeiser zijn vordering binnen die termijn in rechte heeft geldend gemaakt, op de
      inschrijving van welk bewijsstuk [artikel 38][ref3] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel219
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel829
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel38
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '219'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '829'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '32.4'
    text: |-
      Op de inschrijving van een voorrecht, als bedoeld in
      [artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1] is het bepaalde in de eerste zin van het
      derde lid van overeenkomstige toepassing. Indien het verzoek van de deurwaarder ter inschrijving wordt aangeboden
      drie maanden of langer na het in die zin, onder *d*, bedoelde tijdstip, wordt ter inschrijving tevens aangeboden
      een stuk waaruit blijkt dat binnen de in [artikel 1320, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref2]
      genoemde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1320
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1320
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1320'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1320'
  - number: 32.4.a
    text: het bedrag der vordering in der minne is vastgesteld, dan wel
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
  - number: 32.4.b
    text: |-
      langs gerechtelijke weg erkenning van het voorrecht en de omvang ervan is gevorderd, op de inschrijving van welk
      bewijsstuk in het onder *b* bedoelde geval [artikel 38][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel38
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '38'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '33.1'
    text: |-
      Ter inschrijving van een verandering in de voornaam of de geslachtsnaam van tot registergoederen gerechtigde
      natuurlijke personen wordt een door of namens deze persoon ondertekend stuk aangeboden, inhoudende de gegevens,
      bedoeld in [artikel 18, eerste lid, onder 1°][ref1], met vermelding van de oude en de nieuwe naam of voornaam,
      en de dag waarop de verandering is ingegaan. Indien de verandering blijkt uit de registers van de burgerlijke
      stand, wordt een uittreksel daaruit overgelegd, dat de verandering relateert. In andere gevallen wordt een ander
      bewijsstuk betreffende deze verandering overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.2'
    text: |-
      Ter inschrijving van de naamsverandering van een rechtspersoon wordt een opgave van een notaris aangeboden,
      inhoudende de gegevens, bedoeld in [artikel 18, eerste lid, onder 2°][ref1], met vermelding van de oude en de
      nieuwe naam en de dag waarop de verandering is ingegaan. Gaat het om een publiekrechtelijke rechtspersoon, dan kan
      deze de opgave zelf doen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.3'
    text: |-
      Ter inschrijving van een omzetting van een rechtspersoon, als bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende de in [artikel 18, eerste lid, onder 2°][ref2], bedoelde gegevens, met vermelding van de
      oude en nieuwe rechtsvorm, de oude en nieuwe naam alsmede van de dag waarop de omzetting van kracht is
      geworden. Het bepaalde in de eerste zin is van overeenkomstige toepassing op een omzetting, als bedoeld in
      [artikel 8, eerste en tweede lid, van de Wet van 28 juni 1989 (][ref3] (*PbEG* L 199/1).


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004579#Artikel8
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004579
        artikel: '8'
  - number: '33.4'
    text: |-
      Ter inschrijving van een fusie van rechtspersonen, als bedoeld in
      [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1], wordt een opgave van een notaris aangeboden,
      inhoudende met betrekking tot elk der fuserende rechtspersonen en, zo de verkrijgende rechtspersoon een door
      hen samen bij de fusie opgerichte nieuwe rechtspersoon is, tevens met betrekking tot die rechtspersoon de in
      [artikel 18, eerste lid, onder 2°][ref2], bedoelde gegevens, met vermelding wie de verkrijgende rechtspersoon is
      alsmede van de dag waarop de fusie van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '33.5'
    text: |-
      Ter inschrijving van een splitsing van rechtspersonen als bedoeld in
      [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1], wordt een opgave van een notaris aangeboden, inhoudende
      met betrekking tot elke partij bij de splitsing en, zo bij de splitsing verkrijgende rechtspersonen worden
      opgericht, tevens met betrekking tot die rechtspersonen de in [artikel 18, eerste lid, onder 2°][ref2], bedoelde
      gegevens, met vermelding op welke verkrijgende rechtspersoon welke registergoederen zijn overgegaan alsmede van de
      dag waarop de splitsing van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel18
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '18'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '34'
    text: |-
      Ter inschrijving van een verjaring wordt een door een notaris met inachtneming van [artikel 37][ref1] opgemaakte
      verklaring of een authentiek afschrift daarvan aangeboden, inhoudende dat naar de verklaring van degene die de
      inschrijving verlangt, de verjaring is ingetreden, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 34.a
    text: welk registergoed door verjaring is verkregen, dan wel welk beperkt recht op een registergoed is tenietgegaan;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel34
  - number: 34.b
    text: tegen wie de verjaring werkt, indien dit bekend is;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel34
  - number: 34.c
    text: welke feiten tot de verjaring hebben geleid, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel34
  - number: 34.d
    text: dat de verjaring wordt betwist of niet wordt betwist door degene tegen wie zij werkt, zo dit bekend is.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel34
  - number: '35.1'
    text: |-
      Ter inschrijving van een of meer verklaringen van waardeloosheid, als bedoeld in
      [artikel 28 van Boek 3 van het Burgerlijk Wetboek][ref1], wordt een door een notaris opgemaakte verklaring
      aangeboden, die inhoudt dat degenen te wier behoeve de inschrijving zou hebben gestrekt, schriftelijk hebben
      verklaard dat zij waardeloos is en waaraan deze schriftelijke verklaringen zijn gehecht, dan wel een authentiek
      afschrift van de verklaring van de notaris en de daaraan gehechte verklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel28
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '28'
  - number: '35.2'
    text: |-
      Tenzij de inschrijving een hypotheek of een beslag betreft, vermelden de in het eerste lid bedoelde schriftelijke
      verklaringen van degenen te wier behoeve de inschrijving zou hebben gestrekt, tevens de feiten waarop de
      waardeloosheid berust, en houdt de in dat lid bedoelde verklaring van de notaris tevens in dat de vermelde feiten
      een rechtsgrond voor de waardeloosheid van de inschrijving opleveren.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel35
  - number: '35.3'
    text: |-
      Ter inschrijving van een verklaring, als bedoeld in [artikel 273 van Boek 3 van het Burgerlijk Wetboek][ref1],
      wordt aangeboden die verklaring of een authentiek afschrift daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel273
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '273'
  - number: '35.4'
    text: |-
      Ter inschrijving van een verklaring, als bedoeld in [artikel 274 van Boek 3 van het Burgerlijk Wetboek][ref1],
      wordt aangeboden de desbetreffende authentieke akte of een authentiek afschrift daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel274
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '274'
  - number: '36.1'
    text: |-
      Ter inschrijving van het feit dat het nut van een mandelige zaak voor elk der erven is geëindigd, wordt een
      door een notaris met inachtneming van [artikel 37][ref1] opgemaakte verklaring aangeboden, inhoudende dat naar
      de verklaring van hen die de inschrijving verlangen, het nut voor elk der erven is geëindigd, of een authentiek
      afschrift van de verklaring van de notaris. Werken niet alle rechthebbenden op de mandelige zaak mee, dan vermeldt
      de notaris in zijn verklaring de reden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: '36.2'
    text: |-
      Ter inschrijving van het bestaan van een recht, als bedoeld in
      [artikel 150, eerste lid, van de Overgangswet nieuw Burgerlijk Wetboek][ref1] (*Stb.* 1976, 396), wordt een door
      een notaris met inachtneming van [artikel 37][ref2] opgemaakte verklaring aangeboden, waarin het bestaan van het
      recht wordt geconstateerd, en die tevens inhoudt:


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '150'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 36.2.a
    text: de omschrijving van de inhoud van het recht;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
  - number: 36.2.b
    text: zo mogelijk, de gangbare benaming ervan dan wel de verklaring, dat dat recht niet een zodanige benaming heeft, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
  - number: 36.2.c
    text: wie de rechthebbende op dat recht is,
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
  - number: '36.3'
    text: |-
      Ter inschrijving van het ontstaan van een erfdienstbaarheid door bestemming of herleving, bedoeld in
      [artikel 163, eerste zin, van de Overgangswet nieuw Burgerlijk Wetboek][ref1], wordt een door een notaris met
      inachtneming van [artikel 37][ref2] opgemaakte verklaring aangeboden, waarin het ontstaan van de erfdienstbaarheid
      wordt geconstateerd, en die tevens inhoudt:


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel37
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '37'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 36.3.a
    text: de omschrijving van de inhoud van de erfdienstbaarheid, en
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
  - number: 36.3.b
    text: wie de rechthebbende op dat recht is,
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel36
  - number: '37.1'
    text: |-
      Een notariële verklaring, als bedoeld in de [artikelen 26][ref1], [30][ref2], [34][ref3] en [36][ref4], houdt
      behalve hetgeen in deze artikelen is voorgeschreven, tevens in een verklaring van de notaris:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '30'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 37.1.a
    text: |-
      hetzij dat allen die als partij bij het in te schrijven feit betrokken zijn aan de notaris hebben medegedeeld met
      de inschrijving in te stemmen;
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
  - number: 37.1.b
    text: |-
      hetzij dat bewijsstukken aan hem zijn overgelegd en aan de verklaring gehecht, die genoegzaam aantonen dat
      het in te schrijven feit zich inderdaad heeft voorgedaan dan wel, in geval van een verklaring als bedoeld in
      [artikel 36, tweede lid][ref1], dat het recht bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '36'
        hoofdstuk: '2'
        afdeling: '2'
  - number: 37.1.c
    text: hetzij dat hij niet aan het onder *a* en *b* gestelde kan voldoen.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
  - number: '37.2'
    text: |-
      In het in het eerste lid, onder *c*, bedoelde geval boekt de bewaarder de
      aanbieding van de notariële verklaring slechts in het register van voorlopige
      aantekeningen en kan inschrijving alleen plaatsvinden op bevel van de rechter. Het
      __REF000___________________________________________________________________________________________________________
      _____________________ zijn van overeenkomstige toepassing met dien verstande, dat het bevel slechts wordt gegeven,
      indien de eiser naast de bewaarder allen die als partij bij het in te schrijven feit zijn betrokken, tijdig in het
      geding heeft geroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: '37.3'
    text: |-
      De kosten van het geding blijven voor rekening van de eiser, tenzij de vordering ondanks verweer wordt toegewezen,
      in welk geval degene die het verweer heeft gevoerd in de kosten wordt veroordeeld.
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
  - number: '37.4'
    text: |-
      Wanneer het aangeboden stuk ook overigens niet aan de vereisten voor inschrijving voldoet,
      vermeldt de bewaarder bij de voorlopige aantekening tevens de gerezen bedenkingen en is
      [artikel 20 van Boek 3 van het Burgerlijk Wetboek][ref1] in dier voege van toepassing dat het daarbedoelde bevel
      slechts tezamen met dat uit hoofde van het tweede lid kan worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel20
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '20'
  - number: 37a
    text: |-
      Een notariële verklaring als bedoeld in de [artikelen 26][ref1], [27, derde lid][ref2], [30][ref3],
      [31, onder b, juncto 26, eerste lid][ref4], [34][ref5], [35][ref6] en [36][ref7], wordt opgemaakt bij notariële
      akte.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel35
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0004541/2004-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '2'
