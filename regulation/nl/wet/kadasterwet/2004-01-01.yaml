        artikel: '31'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '34'
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '35'
